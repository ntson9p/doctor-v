id: preeclampsia
names:
  vi: "Tiền sản giật"
  vi_common: ["Tiền sản giật", "Tiền sản giật – sản giật", "Nhiễm độc thai nghén"]
  en: "Pre-eclampsia"
codes:
  icd10: "O14"
  icd10_verified: true
  mondo: "MONDO:0005081"
summary_vi:
  - "Huyết áp tăng từ tuần thứ 20 của thai kỳ, kèm đạm trong nước tiểu hoặc tổn thương cơ quan khác như thận, gan."
  - "Nhiều người không thấy triệu chứng; khi nặng có thể đau đầu, nhìn mờ, đau vùng trên rốn, phù mặt và tay."
  - "Bệnh có thể xuất hiện cả sau sinh và có thể gây co giật (sản giật), nguy hiểm cho mẹ và thai."
urgency: 2
cant_miss: true
specialties: [obstetrics_gynecology, emergency]
applicability:
  sex: [female]
  age_groups: [teen_13_17, adult_18_44, adult_45_64]
  reason_vi: "Chỉ gặp ở phụ nữ đang có thai hoặc vừa sinh con."
priors:
  - complaint: headache
    default: P4
    by_age: { teen_13_17: P5, adult_45_64: P6 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015, thang-yhcd-2023, ngwenya-preghy-2020, yen-jogc-2011]
      locator: "315/QĐ-BYT, bài Tiền sản giật – sản giật, mục 1"
      note: "Prior tính trong số phụ nữ cùng nhóm tuổi bị đau đầu, kể cả người không có thai; việc có thai, tuổi thai và vừa sinh được tính qua câu hỏi riêng (đều được hỏi bắt buộc khi đau đầu). Tiền sản giật gặp ở 2–8% thai phụ (315/QĐ-BYT); khoảng một nửa có triệu chứng, hay nhất là đau đầu (35% ở ca nằm viện, Thăng 2023; 47,9% ở thể nặng, Ngwenya 2020; Yen 2011). Lượt C: hai lượt lệch một mức (A P4, B P5), đều là ước lượng. Ước tính thô của lượt C (khoảng 3–4% phụ nữ 18–44 tuổi đang có thai từ 20 tuần hoặc trong 6 tuần sau sinh) cho khoảng 0,05–0,2%, gần P5; nhưng người bị đau đầu dữ dội khi có thai thường tự kiểm tra hoặc đi khám nhiều hơn, và theo kb-guide mục 5 khi nguồn ngang nhau thì chọn mức thận trọng cho bệnh nguy hiểm, nên giữ P4. Với P4, ở thai phụ từ 20 tuần bị đau đầu, khả năng ước tính ngay sau các câu hỏi bắt buộc khoảng 15% (ca phát triển d-preeclampsia-1), sau đau đầu căng thẳng và đau nửa đầu. Tuổi 13–17 có thai ít hơn khoảng 8–10 lần (P5); từ 45 tuổi rất hiếm có thai (P6). Cần bác sĩ duyệt và đối chiếu khi gộp prior các lô."
  - complaint: abdominal_pain
    default: P5
    by_age: { teen_13_17: P6, adult_45_64: P6 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015, ngwenya-preghy-2020, thang-yhcd-2023]
      note: "Đau vùng thượng vị hoặc hạ sườn phải là tiêu chuẩn tiền sản giật nặng (315/QĐ-BYT), gặp ở 22,4% thể nặng (Ngwenya 2020) nhưng chỉ 2,5% ca nằm viện kèm nôn nhiều hoặc rối loạn khác (Thăng 2023), ít hơn đau đầu. Hai lượt cùng chọn P5 cho 18–44 tuổi, P6 cho nhóm còn lại."
findings:
  - finding: pregnant
    freq: very_frequent
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015, nhs-pre-eclampsia, ihs-ichd3-2018]
      locator: "315/QĐ-BYT, mục 2.1 (huyết áp tăng sau tuần 20) và 2.2 (sản giật có thể xảy ra trong thời kỳ hậu sản); NHS: vài ngày đến vài tuần sau sinh; ICHD-3 mục 10.3.4 (tới 4 tuần sau sinh)"
      note: "Phần lớn đang có thai; một phần khởi phát hoặc nặng lên sau sinh, khi đó người bệnh trả lời 'không có thai' và 'vừa sinh con'. Không nguồn nào cho tỷ lệ khởi phát sau sinh; hai lượt cùng ước khoảng 15–20%, nên chọn very_frequent thay vì almost_always."
  - finding: gestational_age
    dist: { lt_20w: 0.03, ge_20w: 0.97 }
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-315-2015, nhs-pre-eclampsia]
      locator: "315/QĐ-BYT, mục 2.1.1 (huyết áp từ 140/90 mmHg sau tuần 20)"
      note: "Phân bố trong số người đang có thai. Theo định nghĩa xuất hiện sau tuần 20; NHS ghi hay gặp từ tuần 20 nhưng có thể xảy ra bất kỳ lúc nào. Để 0,03 cho trường hợp ước sai tuổi thai."
  - finding: recent_childbirth
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015, nhs-pre-eclampsia, ihs-ichd3-2018]
      note: "Bệnh có thể xuất hiện vài ngày đến vài tuần sau sinh (NHS); sản giật có thể xảy ra trong thời kỳ hậu sản (315/QĐ-BYT). Hai lượt cùng ước khoảng 15–20% người bệnh ở giai đoạn sau sinh. Danh mục hỏi 'vừa sinh con' độc lập với 'có thai', nên mô hình chưa thể hiện được quan hệ 'hoặc' giữa hai dấu hiệu (xem đề xuất trong biên bản)."
  - finding: bp_measured
    dist: { normal: 0.10, high: 0.47, very_high: 0.29, extreme: 0.14 }
    evidence:
      tier: B
      basis: numeric
      sources: [thang-yhcd-2023, byt-qd-315-2015]
      locator: "Thăng 2023, bảng 3; 315/QĐ-BYT mục 2.1"
      reported: "Tăng huyết áp độ 1: 26,9%; độ 2: 36,7%; độ 3: 36,4% (lúc đình chỉ thai)."
      population: "316 sản phụ tiền sản giật nằm viện tuyến cuối, thai từ 28 tuần"
      note: "Theo định nghĩa huyết áp từ 140/90 mmHg (315/QĐ-BYT). Ca nằm viện là ca nặng nên dịch phân bố về mức thấp hơn cho cộng đồng; giữ 10% 'dưới 140/90' vì lần đo gần nhất có thể trước khi bệnh khởi phát. Lượt C lấy trung bình hai lượt (lệch 0,07)."
  - finding: headache
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [thang-yhcd-2023, ngwenya-preghy-2020, byt-qd-315-2015, nhs-pre-eclampsia]
      reported: "Đau đầu khoảng 35% ca nằm viện (Thăng 2023: 86 + 17 + 7 trên 316); 47,9% ở thể nặng (Ngwenya 2020)."
      note: "Chỉ có tác dụng khi triệu chứng chính là đau bụng (khi chọn đau đầu thì dấu hiệu này đã được ngầm định). Người đau bụng do tiền sản giật thường là thể nặng (315/QĐ-BYT xếp nhức đầu và đau thượng vị vào tiền sản giật nặng)."
  - finding: headache_location
    dist: { one_side: 0.10, both_sides: 0.30, forehead_face: 0.20, back_neck: 0.15, whole_head: 0.25 }
    evidence:
      tier: B
      basis: verbal
      sources: [ihs-ichd3-2018]
      locator: "ICHD-3 mục 10.3.4"
      note: "Chỉ lượt A có; lượt C giữ vì ICHD-3 mô tả đau đầu do tiền sản giật thường hai bên. Chia theo lựa chọn là ước lượng."
  - finding: headache_character
    dist: { throbbing: 0.65, pressing: 0.35 }
    evidence:
      tier: B
      basis: verbal
      sources: [ihs-ichd3-2018]
      locator: "ICHD-3 mục 10.3.4"
      note: "Chỉ lượt A có; lượt C giữ vì ICHD-3 mô tả đau thường theo nhịp mạch. Tỷ lệ là ước lượng."
  - finding: headache_severity
    dist: { mild: 0.12, moderate: 0.40, severe: 0.48 }
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-pre-eclampsia, byt-qd-315-2015]
      note: "NHS: đau đầu dữ dội, không đỡ khi dùng thuốc giảm đau thông thường; 315/QĐ-BYT xếp nhức đầu vào tiêu chuẩn tiền sản giật nặng. Phân bố là ước lượng (trung bình hai lượt)."
  - finding: headache_worse_activity
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [ihs-ichd3-2018]
      locator: "ICHD-3 mục 10.3.4, tiêu chuẩn C3"
      note: "Chỉ lượt A có; lượt C giữ vì ICHD-3 nêu tăng khi vận động là một trong ba đặc điểm của tiêu chuẩn C3 (cần ít nhất hai trong ba: hai bên, theo nhịp mạch, tăng khi vận động). Không có tỷ lệ."
  - finding: headache_course
    dist: { first_time: 0.70, recurrent_similar: 0.20, progressive: 0.10 }
    evidence:
      tier: C
      basis: judgment
      sources: [ihs-ichd3-2018, nhs-pre-eclampsia]
      note: "Đau đầu mới xuất hiện cùng lúc với bệnh (ICHD-3 mục 10.3.4, tiêu chuẩn C1); người vốn có đau nửa đầu có thể thấy giống cơn cũ. Hai lượt cùng ước phân bố này."
  - finding: headache_duration
    dist: { lt_4h: 0.20, h4_72: 0.55, gt_3d: 0.25 }
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-pre-eclampsia]
      note: "Chỉ lượt B có; lượt C giữ: NHS mô tả đau đầu dai dẳng, không đỡ khi dùng thuốc. Phân bố là ước lượng."
  - finding: blurred_vision
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [thang-yhcd-2023, byt-qd-315-2015, nhs-pre-eclampsia]
      reported: "Rối loạn thị giác khoảng 11% ca nằm viện (đơn thuần 5,7%, kèm đau đầu 17/316)."
      population: "316 sản phụ tiền sản giật nằm viện"
      note: "Nhìn mờ là tiêu chuẩn tiền sản giật nặng (315/QĐ-BYT); NHS mô tả nhìn mờ hoặc thấy chớp sáng."
  - finding: edema_face_hands
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [thang-yhcd-2023, byt-qd-315-2015, nhs-pre-eclampsia]
      locator: "Thăng 2023, bảng 3 (phù)"
      reported: "Phù toàn thân 29,4%, chỉ phù 2 chi dưới 64,6%, không phù 5,7%."
      population: "316 sản phụ tiền sản giật nằm viện tuyến cuối"
      note: "Lượt C: hai lượt lệch một mức (A occasional theo số liệu, B frequent theo mô tả 'phù là triệu chứng thường gặp' của 315/QĐ-BYT). Chọn mức có số liệu: câu hỏi chỉ hỏi phù mặt, tay mới xuất hiện, tương ứng nhóm phù toàn thân (29,4% ở ca nặng nằm viện). Phù chân đơn thuần cũng hay gặp ở thai bình thường. Tỷ lệ nền của danh mục (5%) có thể thấp so với thai phụ."
  - finding: abdominal_pain
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [ngwenya-preghy-2020, thang-yhcd-2023, byt-qd-315-2015, nhs-pre-eclampsia]
      reported: "Đau thượng vị 22,4% ở tiền sản giật nặng (Ngwenya 2020); đau thượng vị, nôn nhiều hoặc rối loạn khác 2,5% ca nằm viện (Thăng 2023)."
      note: "Chỉ lượt A có; lượt C giữ. Đau thượng vị hoặc hạ sườn phải là dấu hiệu nặng (315/QĐ-BYT; NHS: đau dưới sườn) cần nhận ra; chọn occasional để câu trả lời 'Có' làm tăng khả năng bệnh. Chỉ có tác dụng khi triệu chứng chính là đau đầu."
  - finding: abd_pain_location
    dist: { epigastric: 0.50, right_upper: 0.34, left_upper: 0.03, periumbilical: 0.03, right_lower: 0.015, left_lower: 0.015, suprapubic: 0.02, whole: 0.05 }
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-315-2015, nhs-pre-eclampsia]
      locator: "315/QĐ-BYT, mục 2.1.2 (đau vùng thượng vị hoặc hạ sườn phải)"
      note: "NHS: đau dưới sườn. Tỷ lệ từng vùng là ước lượng (trung bình hai lượt)."
  - finding: abd_pain_severe
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015, nhs-pre-eclampsia]
      note: "Chỉ lượt B có; lượt C giữ. Đau thượng vị, hạ sườn phải là dấu hiệu tiền sản giật nặng; mức độ đau không có số liệu. Ước occasional."
  - finding: vomiting
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [nhs-pre-eclampsia, thangaratinam-aogs-2011, yen-jogc-2011]
      note: "NHS liệt kê nôn trong các triệu chứng cần kiểm tra ngay; buồn nôn và nôn được xét trong tổng quan Thangaratinam 2011 và nghiên cứu PIERS (Yen 2011); không có tỷ lệ chung. Hai lượt cùng chọn occasional."
  - finding: heartburn
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-pre-eclampsia]
      note: "NHS: ợ nóng không đỡ khi dùng thuốc là một triệu chứng của tiền sản giật. Không có tỷ lệ."
  - finding: hypertension_known
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-pre-eclampsia]
      note: "Chỉ lượt A có; lượt C giữ. Tăng huyết áp có từ trước là yếu tố nguy cơ (NHS). Chưa có tỷ lệ; tỷ lệ nền của danh mục (15%) cao hơn nhiều so với phụ nữ tuổi sinh đẻ nên tác dụng của liên kết này nhỏ."
  - finding: fever
    freq: rare
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015, nhs-pre-eclampsia]
      note: "Chỉ lượt B có; lượt C giữ. Sốt không phải triệu chứng của tiền sản giật trong cả hai nguồn; có thai kèm sốt cần nghĩ đến nhiễm trùng. Mức rare thấp hơn tỷ lệ nền 5%."
warning_signs: [seizure_recent, confusion, vision_loss_or_double, blurred_vision, breathing_difficulty, abd_pain_severe, persistent_vomiting, edema_face_hands]
self_care_vi:
  - "Nếu có máy đo huyết áp tại nhà, đo và mang theo kết quả khi đi khám."
  - "Mang theo sổ khám thai và các kết quả xét nghiệm."
  - "Không tự ý dùng thuốc khi chưa hỏi bác sĩ sản khoa."
see_doctor_vi:
  - "Đến ngay khoa sản hoặc cơ sở cấp cứu gần nhất để được đo huyết áp và thử nước tiểu."
  - "Gọi 115 nếu co giật, lơ mơ, khó thở hoặc nhìn mờ nặng."
  - "Trong 6 tuần sau sinh vẫn có thể bị bệnh này, nên đau đầu nặng hoặc nhìn mờ cũng cần đi khám ngay."
review:
  status: source_checked
  authors: ["agent:pass-a", "agent:pass-b"]
  reconciler: "agent:pass-c"
  doctor_reviewer: null
  updated: "2026-10-24"
  notes_vi: "Lượt C đã đối chiếu 21 liên kết và mở lại mọi nguồn được trích. Bỏ liên kết 'co giật' (lượt A để rare): mức này cao hơn tỷ lệ nền 1% nên bộ kiểm tra cảnh báo, và co giật đã do quy tắc rf_new_seizure (mức 2) xử lý. Bác sĩ cần xem: (1) prior khi đau đầu chọn P4 (mức thận trọng) dù ước tính thô gần P5; (2) mô hình tính 'có thai' và 'vừa sinh con' độc lập nên ca sau sinh bị ước thấp; (3) số liệu triệu chứng Việt Nam lấy từ ca nặng nằm viện tuyến cuối (Thăng 2023 loại người có tăng huyết áp, bệnh thận từ trước); (4) lượt B nêu Quyết định 1154/QĐ-BYT (2024) về tăng huyết áp thai kỳ có thể thay bài tiền sản giật của 315/QĐ-BYT, nhưng lượt C chưa tìm thấy văn bản này; (5) danh mục thiếu yếu tố nguy cơ chính (mang thai lần đầu, đa thai, từng bị tiền sản giật)."
