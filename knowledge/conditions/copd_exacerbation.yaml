  notes_vi: "Lượt C (Giai đoạn 3 lô 3) mở lại các nguồn mới: McManus 2008 (toàn văn, bảng 3), WHO Việt Nam, STEPS 2021 (báo cáo PDF, bảng 5), Lâm 2014 và Nguyen Viet 2015 (tóm tắt), NHS COPD, Frese 2011 (toàn văn); 2767/QĐ-BYT và GOLD 2026 đã được lượt R xác minh. Cần bác sĩ xem: (1) urgency 3 như gợi ý: 2767 và GOLD ghi hơn 80% đợt cấp điều trị ngoại trú nhưng cần được đánh giá, chỉnh thuốc; đợt nặng do quy tắc xử lý; (2) applicability từ 18 tuổi; prior dưới 45 tuổi thấp (P4 khó thở, P5 ho); (3) copd_known frequent vì nhiều người Việt Nam chưa được chẩn đoán; (4) hệ số giới 1,4 và 0,6 cộng với câu hút thuốc có thể đếm trùng một phần; hệ số mùa lạnh miền Bắc 1,3 chỉ dựa trên mô tả bằng lời; (5) khói bếp frequent và sụt cân occasional là ước lượng; (6) số triệu chứng chính từ người nhập viện (Bắc Ireland), đã hạ mức; (7) MONDO ghi mã của bệnh nền (MONDO không có mục riêng cho đợt cấp); mã ICD-10 chưa đối chiếu."
