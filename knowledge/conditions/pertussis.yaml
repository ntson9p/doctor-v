  updated: "2026-10-31"
  notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần b) đối chiếu 16 liên kết, 1 prior, 2 hệ số mùa và mở lại mọi nguồn được trích. Mức xử trí 3, không thuộc nhóm không được bỏ sót (hai lượt cùng giữ gợi ý): NHS xếp khám khẩn khi trẻ dưới 6 tháng có triệu chứng hoặc ho rất nặng, nặng dần; gọi cấp cứu khi tím, thở khó, đau ngực tăng khi thở, co giật; kháng sinh trong 3 tuần đầu chủ yếu để hạn chế lây. Ca nặng ở trẻ nhỏ do quy tắc rf_pertussis_infant (mức 2) và rf_infant_apnea (mức 1) xử lý. Bộ Y tế chưa có hướng dẫn chẩn đoán, điều trị riêng cho ho gà (hai lượt và lượt R cùng tìm không thấy). Điều cần bác sĩ xem: (1) prior là ước lượng từ huyết thanh học và ca nằm viện, chưa có tỷ lệ ho gà trong số người ho đi khám ban đầu ở Việt Nam; P3 cho trẻ 5–17 tuổi suy từ số liệu Anh; (2) tần suất cơn ho, tiếng rít, nôn sau ho ở người lớn lấy từ tổng quan Moore (độ nhạy), ở trẻ nhỏ từ ca nằm viện; (3) sốt để occasional theo số liệu (khoảng 18–23%), trong khi NHS, MSD mô tả là ít gặp; (4) hệ số theo mùa chỉ có số liệu miền Bắc, trẻ nằm viện; (5) mã A37.9 chưa đối chiếu được với danh mục ICD-10 của Bộ Y tế."
