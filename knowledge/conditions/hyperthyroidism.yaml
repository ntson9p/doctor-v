id: hyperthyroidism
names:
  vi: "Nhiễm độc tuyến giáp (cường giáp)"
  vi_common: ["Cường giáp", "Bệnh Basedow", "Bướu cổ lồi mắt"]
  en: "Hyperthyroidism (thyrotoxicosis)"
codes:
  icd10: "E05"
  icd10_verified: true
  mondo: "MONDO:0004425"
summary_vi:
  - "Tuyến giáp tiết quá nhiều hormon, làm cơ thể hoạt động quá mức."
  - "Hay gặp tim đập nhanh, run tay, sợ nóng, ra nhiều mồ hôi, sụt cân dù ăn nhiều; có thể có bướu cổ, lồi mắt."
  - "Bệnh Basedow là nguyên nhân hay gặp nhất, chủ yếu ở phụ nữ."
urgency: 4
cant_miss: false
specialties: [endocrinology]
priors:
  - complaint: palpitations
    default: P3
    by_age: { child_5_12: P5, teen_13_17: P4 }
    evidence:
      tier: B
      basis: judgment
      sources: [weber-amjmed-1996, raviele-europace-2011, msd-hyperthyroidism, nhs-overactive-thyroid, byt-qd-3879-2014]
      locator: "Weber 1996 tóm tắt; EHRA 2011 mục nguyên nhân (bệnh toàn thân 4%); MSD (dịch tễ); NHS Overactive thyroid; 3879/QĐ-BYT bài Bệnh Basedow"
      reported: "Bệnh toàn thân (cường giáp, thiếu máu, sốt...) 4% người hồi hộp ở trung tâm đại học (Weber, theo EHRA); cường giáp khoảng 1% dân Mỹ, hay gặp ở nữ 20–50 tuổi (MSD)."
      note: "Hai lượt trùng mức. Cường giáp chỉ là một phần trong nhóm bệnh toàn thân 4%, nhưng hồi hộp, nhịp tim nhanh thường xuyên gặp ở hầu hết người bệnh (3879/QĐ-BYT). Ước 1–5% người lớn hồi hộp (P3), tính chung hai giới (hệ số giới điều chỉnh). Vẫn gặp ở người cao tuổi (thường do bướu nhân, biểu hiện tim mạch nổi trội) nên giữ P3 đến tuổi già. Trẻ em, thiếu niên ít bị Basedow: 5–12 tuổi P5, 13–17 tuổi P4. Chưa có số liệu Việt Nam."
prior_modifiers:
  - when: { sex: [female] }
    factor: 1.5
    evidence:
      tier: B
      basis: numeric
      sources: [byt-qd-3879-2014, nhs-overactive-thyroid, msd-hyperthyroidism]
      locator: "3879/QĐ-BYT bài Bệnh Basedow (yếu tố nguy cơ); NHS Overactive thyroid"
      reported: "Basedow: nữ/nam 7–10/1 (3879/QĐ-BYT); cường giáp ở nữ gấp khoảng 10 lần nam (NHS)."
      note: "Hai lượt trùng hệ số. Người đi khám vì hồi hộp vốn nhiều nữ hơn (khoảng 60%), nên với tỷ lệ nữ/nam khoảng 8/1 trong bệnh, hệ số so với mức chung khoảng 1,5 cho nữ, 0,3 cho nam. Ước lượng."
  - when: { sex: [male] }
    factor: 0.3
    evidence:
      tier: B
      basis: numeric
      sources: [byt-qd-3879-2014, nhs-overactive-thyroid]
      reported: "Nữ/nam 7–10/1."
      note: "Xem hệ số của nữ."
findings:
  - finding: palpitation_rhythm
    dist: { fast_regular: 0.47, irregular: 0.12, skipped_beats: 0.08, forceful: 0.33 }
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-3879-2014, raviele-europace-2011, msd-hyperthyroidism]
      locator: "3879/QĐ-BYT bài Bệnh Basedow mục 3.1.2 (nhịp nhanh thường xuyên 100–140 chu kỳ/phút, mạch nảy mạnh; rung nhĩ hay gặp ở người cao tuổi)"
      note: "Tính trong số người đã hồi hộp; trung bình hai lượt. Nhịp nhanh xoang đều, mạch nảy mạnh; rung nhĩ là biến chứng hay gặp, nhất là ở người cao tuổi. Ước lượng."
  - finding: palpitation_abrupt_onset
    freq: rare
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-3879-2014]
      locator: "3879/QĐ-BYT mục 3.1.2"
      note: "Hai lượt trùng mức. Tính trong số người đã hồi hộp. Nhịp tim nhanh thường xuyên, không thành cơn bật tắt; chỉ đôi khi có cơn nhịp nhanh kịch phát trên thất. Mức rare thấp hơn tỷ lệ nền 0,15."
  - finding: palpitation_duration
    dist: { seconds: 0.10, minutes_hours: 0.30, ongoing: 0.60 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-3879-2014]
      locator: "3879/QĐ-BYT mục 3.1.2 (nhịp tim nhanh thường xuyên ở hầu hết người bệnh)"
      note: "Chỉ lượt B có (dấu hiệu thêm sau lượt A); lượt C giữ. Tính trong số người đã hồi hộp. Phần lớn thấy hồi hộp kéo dài liên tục. Ước lượng."
  - finding: pulse_measured
    dist: { lt_40: 0.004, n40_100: 0.146, n100_150: 0.232, gt_150: 0.018, not_measured: 0.6 }
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-3879-2014]
      locator: "3879/QĐ-BYT mục 3.1.2 (tần số tim 100–140 chu kỳ/phút)"
      note: "'Chưa đo' giữ đúng tỷ lệ nền 0,6; trung bình hai lượt. Bệnh nhẹ có thể dưới 100; trên 140 gợi ý cơn bão giáp hoặc rung nhĩ nhanh. Ước lượng."
  - finding: weight_loss_unintended
    freq: very_frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-3879-2014, msd-hyperthyroidism, nhs-overactive-thyroid, boelaert-jcem-2010, nordyke-archintmed-1988]
      locator: "3879/QĐ-BYT mục 3.1.1 (thường ăn nhiều, mau đói, gầy sút cân), 3.4.5 (thể tăng cân khoảng 5%); Boelaert, Nordyke: tóm tắt"
      note: "Lượt A frequent, lượt B very_frequent. Lượt C chọn very_frequent: 3879/QĐ-BYT mô tả gầy sút cân là biểu hiện thường gặp ('thường', tương ứng very_frequent ở bảng 2.1) và thể tăng cân chỉ khoảng 5%; sụt cân không giảm theo tuổi (Boelaert), thậm chí tăng theo tuổi (Nordyke), nên không hạ mức ở người cao tuổi."
  - finding: heat_intolerance
    freq: very_frequent
    freq_by_age: { elder_65_74: frequent, elder_75p: frequent }
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-3879-2014, nhs-overactive-thyroid, msd-hyperthyroidism, boelaert-jcem-2010]
      locator: "3879/QĐ-BYT mục 3.1.1 (luôn có cảm giác nóng bức, ra nhiều mồ hôi); Boelaert 2010 tóm tắt"
      note: "Lượt A frequent (người cao tuổi occasional), lượt B very_frequent (người cao tuổi frequent). Lượt C chọn bản của lượt B vì 3879/QĐ-BYT ghi người bệnh 'luôn' có cảm giác nóng bức; người trên 60 tuổi ít có triệu chứng kinh điển hơn (Boelaert; Nordyke: giảm sau tuổi 50) nên hạ một mức từ 65 tuổi."
  - finding: tremor
    freq: very_frequent
    freq_by_age: { elder_65_74: frequent, elder_75p: occasional }
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-3879-2014, msd-hyperthyroidism, boelaert-jcem-2010, nordyke-archintmed-1988]
      locator: "3879/QĐ-BYT mục 3.1.3, 3.3 (run tay đầu ngón là triệu chứng chủ yếu để chẩn đoán), 3.4.3; MSD (người cao tuổi phần lớn không run)"
      note: "Lượt A frequent (cao tuổi occasional), lượt B very_frequent (cao tuổi frequent). Lượt C: dưới 65 tuổi chọn very_frequent theo 3879/QĐ-BYT; từ 75 tuổi chọn occasional vì MSD ghi phần lớn người cao tuổi không run, còn 65–74 tuổi chọn frequent (triệu chứng kinh điển giảm dần sau 50 tuổi: Nordyke, Boelaert). 3879/QĐ-BYT lại ghi người cao tuổi run biên độ lớn; hai nguồn chưa thống nhất, cần bác sĩ duyệt. Cùng cụm 'run tay, vã mồ hôi'."
  - finding: goiter_visible
    freq: frequent
    freq_by_age: { elder_65_74: occasional, elder_75p: occasional }
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-3879-2014, nhs-overactive-thyroid, msd-hyperthyroidism]
      locator: "3879/QĐ-BYT mục 3.1.4 (bướu lan tỏa), 3.4.3 (người cao tuổi tuyến giáp to vừa phải); NHS (sưng ở cổ)"
      note: "Hai lượt cùng chọn frequent; chỉ lượt A hạ một mức từ 65 tuổi, lượt C giữ theo 3879/QĐ-BYT (ở người cao tuổi bướu chỉ to vừa phải, khó tự nhận thấy). Câu hỏi hỏi bướu nhìn thấy được nên thấp hơn tỷ lệ có bướu khi khám. Tỷ lệ nền 0,03."
  - finding: eyes_bulging
    freq: occasional
    freq_by_age: { elder_65_74: rare, elder_75p: rare }
    above_leak_ok: true
    evidence:
      tier: B
      basis: numeric
      sources: [byt-qd-3879-2014, msd-hyperthyroidism, nhs-overactive-thyroid]
      locator: "3879/QĐ-BYT mục 3.1.5 (khoảng 50% có bệnh mắt trên lâm sàng), 3.4.3 (người cao tuổi ít triệu chứng mắt); MSD (người cao tuổi phần lớn không lồi mắt)"
      reported: "Khoảng 50% người Basedow có bệnh mắt trên lâm sàng; 10–20% lồi mắt một bên."
      note: "Hai lượt cùng chọn occasional; chỉ lượt A hạ xuống rare từ 65 tuổi, lượt C giữ theo MSD. Bệnh mắt gồm cả cộm, chói, phù mi; người bệnh tự thấy mắt lồi ra ít hơn; bướu nhân độc không lồi mắt. Mức rare ở người cao tuổi vẫn cao hơn tỷ lệ nền 0,01, cố ý (above_leak_ok): lồi mắt vẫn gợi ý cường giáp ở mọi tuổi."
  - finding: fatigue
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-3879-2014, msd-hyperthyroidism, nhs-overactive-thyroid]
      locator: "3879/QĐ-BYT mục 3.1.3 (mệt mỏi, giảm khả năng lao động)"
      note: "Hai lượt trùng mức. Tỷ lệ nền 0,2 nên dấu hiệu này phân biệt kém."
  - finding: diarrhea
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-3879-2014, msd-hyperthyroidism]
      locator: "3879/QĐ-BYT mục 3.1.1 (khoảng 50% tiêu chảy không đau quặn); MSD (đi ngoài nhiều lần, đôi khi tiêu chảy)"
      note: "Hai lượt trùng mức. Câu hỏi đòi từ 3 lần phân lỏng mỗi ngày, nhiều người chỉ đi ngoài nhiều lần hơn, nên hạ xuống occasional."
  - finding: stress_poor_sleep
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-3879-2014, nhs-overactive-thyroid]
      locator: "3879/QĐ-BYT mục 3.1.3 (bồn chồn, dễ cáu gắt, rối loạn giấc ngủ); NHS (lo âu, khó ngủ)"
      note: "Chỉ lượt B có; lượt C giữ. Câu hỏi gộp căng thẳng, lo lắng, thiếu ngủ. Tỷ lệ nền 0,2."
  - finding: breathless_on_exertion
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [boelaert-jcem-2010, msd-hyperthyroidism]
      locator: "Boelaert 2010 tóm tắt (khó thở không giảm theo tuổi); MSD (yếu, suy tim ở người cao tuổi)"
      note: "Chỉ lượt A có; lượt C giữ. Tần suất chưa có số liệu; mức occasional chỉ cao hơn tỷ lệ nền 0,15 một chút."
  - finding: cold_sweat
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-3879-2014]
      locator: "3879/QĐ-BYT mục 3.1.1, 3.1.3 (ra nhiều mồ hôi, bàn tay ấm ẩm, toát mồ hôi)"
      note: "Chỉ lượt B có; lượt C giữ. Mồ hôi thường ấm, không phải vã mồ hôi lạnh, nhưng người dùng có thể trả lời 'Có'. Ước 20%."
warning_signs: [confusion, breathing_difficulty, chest_pain_pressure, fainting_or_near_fainting]
self_care_vi:
  - "Hạn chế cà phê, trà đặc, nước tăng lực vì làm tim đập nhanh hơn."
  - "Không tự uống thuốc hoặc thực phẩm chức năng có i-ốt (iod) khi chưa hỏi bác sĩ."
see_doctor_vi:
  - "Đặt lịch khám trong vài ngày để được xét nghiệm máu về tuyến giáp."
  - "Đi cấp cứu ngay nếu sốt cao kèm tim đập rất nhanh, vật vã, lú lẫn, nôn hoặc tiêu chảy nhiều."
  - "Nếu đang điều trị, không tự ý ngừng thuốc, vì ngừng đột ngột có thể gây cơn bão giáp."
review:
  status: source_checked
  authors: ["agent:pass-a", "agent:pass-b"]
  reconciler: "agent:pass-c"
  doctor_reviewer: null
  updated: "2026-10-25"
  notes_vi: "Lượt C (phần b) đối chiếu 15 liên kết và mở lại mọi nguồn được trích (3879/QĐ-BYT đọc trên luatvietnam.vn). Mức xử trí 4, không thuộc nhóm không được bỏ sót: 3879/QĐ-BYT điều trị nội khoa; NHS khuyên khám bác sĩ gia đình để xét nghiệm máu; cơn bão giáp (1–2% người nhiễm độc giáp nhập viện) có sốt cao, tim rất nhanh, lú lẫn, đã được các quy tắc lú lẫn (mức 1) và mạch trên 150 (mức 2) bắt một phần. Lượt C bỏ liên kết 'sợ hãi dữ dội' (rare) của lượt A: MSD ghi cường giáp có thể gây triệu chứng giống cơn hoảng sợ, nên câu trả lời 'Có' không nên làm giảm khả năng cường giáp. Bác sĩ cần xem: (1) prior chỉ suy từ nhóm 'bệnh toàn thân' 4% của Weber; (2) tần suất triệu chứng dựa trên mô tả của 3879/QĐ-BYT, MSD, NHS (chưa mở được toàn văn Boelaert có tỷ lệ theo tuổi); (3) run tay ở người cao tuổi: MSD và 3879/QĐ-BYT ngược nhau; (4) người cao tuổi có thể biểu hiện chủ yếu bằng rung nhĩ, sụt cân, khó thở (thể vô cảm), dễ bị xếp vào rối loạn nhịp; (5) chưa có câu hỏi 'đã biết bị cường giáp'."
