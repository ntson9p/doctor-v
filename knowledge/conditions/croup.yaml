id: croup
names:
  vi: "Viêm thanh quản cấp (croup)"
  vi_common: ["Viêm thanh quản", "Viêm thanh khí phế quản cấp"]
  en: "Croup (acute laryngotracheobronchitis)"
codes:
  icd10: "J05.0"
  icd10_verified: false
  mondo: "MONDO:0005722"
summary_vi:
  - "Nhiễm vi rút làm sưng thanh quản, khí quản, hay gặp ở trẻ 6 tháng đến 3 tuổi."
  - "Sau 1–3 ngày sổ mũi, sốt nhẹ, trẻ ho ông ổng như chó sủa, khàn tiếng, có thể thở rít, hay nặng về đêm."
  - "Phần lớn nhẹ, đỡ trong vài ngày; thở rít cả khi nằm yên là dấu hiệu nặng."
urgency: 3
cant_miss: false
specialties: [pediatrics, ent]
applicability:
  age_groups: [infant_0_2m, child_2m_5y, child_5_12, teen_13_17]
  reason_vi: "Bệnh của trẻ em; ở người lớn rất hiếm và thường mang tên khác (viêm thanh quản, viêm nắp thanh quản)."
priors:
  - complaint: cough
    default: P4
    by_age:
      infant_0_2m: P5
      child_2m_5y: P3
      teen_13_17: P5
    evidence:
      tier: C
      basis: judgment
      sources: [smith-afp-2018, msd-croup, byt-qd-3312-2015]
      locator: "Smith 2018 phần dịch tễ; MSD Croup; 3312 bài Khó thở thanh quản ở trẻ em (tr. 268–271)"
      reported: "Mỗi năm khoảng 3% trẻ 6 tháng–3 tuổi bị croup; croup chiếm 7% số lần nằm viện vì sốt, bệnh hô hấp cấp ở trẻ dưới 5 tuổi (Mỹ); có thể gặp tới 6 tuổi, hoặc dưới 6 tháng ở ca không điển hình"
      note: "Thang tuyệt đối. Hai lượt trùng mức ở nhóm chính: 2 tháng–5 tuổi P3 (trẻ nhỏ ho nhiều đợt mỗi năm, phần lớn là cảm lạnh), 5–12 tuổi P4. Lượt A giới hạn bệnh ở 2 tháng–12 tuổi; lượt B thêm dưới 2 tháng và 13–17 tuổi ở P5 (lượt C giữ, xem phạm vi tuổi). Chưa có số liệu Việt Nam. Câu ho ông ổng (tỷ lệ nền 3%) mang phần lớn thông tin. Cần bác sĩ duyệt."
  - complaint: shortness_of_breath
    default: P3
    by_age:
      infant_0_2m: P4
      child_2m_5y: P2
      teen_13_17: P4
    evidence:
      tier: C
      basis: judgment
      sources: [smith-afp-2018, msd-croup, byt-qd-3312-2015]
      locator: "Smith 2018 (trên 99% trẻ thở rít đột ngột là croup); 3312 tr. 268–269 (khó thở thanh quản là cấp cứu hô hấp ở trẻ em, viêm thanh quản cấp là nguyên nhân cấp tính chính)"
      note: "Hai lượt trùng mức ở nhóm chính: 2 tháng–5 tuổi P2 (cạnh tranh với viêm tiểu phế quản, viêm phổi, hen, dị vật), 5–12 tuổi P3. Dưới 2 tháng và 13–17 tuổi P4 (lượt B). Ước lượng."
prior_modifiers:
  - when: { sex: [male] }
    factor: 1.2
    evidence:
      tier: C
      basis: numeric
      sources: [smith-afp-2018, msd-croup]
      locator: "Smith 2018 phần dịch tễ; MSD (trẻ trai mắc nhiều hơn)"
      reported: "Trai/gái 1,5/1"
      note: "Lượt A 1,2/0,8 (Smith, trai/gái 1,5/1), lượt B 1,15/0,85 (Bjornson 2013, 1,4/1; không mở được bài này). Lượt C chọn hệ số của lượt A theo nguồn đã mở: với tỷ lệ trai/gái trong dân số khoảng 1/1, tỷ lệ 1,5/1 ứng với 1,2 cho trẻ trai và 0,8 cho trẻ gái so với mức chung."
  - when: { sex: [female] }
    factor: 0.8
    evidence:
      tier: C
      basis: numeric
      sources: [smith-afp-2018, msd-croup]
      reported: "Trai/gái 1,5/1"
      note: "Xem hệ số của trẻ trai."
findings:
  - finding: barking_cough
    freq: almost_always
    evidence:
      tier: C
      basis: verbal
      sources: [smith-afp-2018, msd-croup, nhs-croup, bjornson-bmjopen-2024, byt-qd-3312-2015]
      locator: "Smith 2018 (chẩn đoán lâm sàng: ho ông ổng khởi phát đột ngột, thở rít, khàn tiếng; ho giúp phân biệt với viêm nắp thanh môn); MSD; Bjornson 2024 tóm tắt (ho ông ổng là triệu chứng kéo dài nhất); 3312 tr. 268"
      note: "Lượt A very_frequent, lượt B almost_always. Lượt C chọn almost_always: ho ông ổng là dấu hiệu đặc trưng để chẩn đoán (Smith, MSD) và kéo dài nhất (Bjornson 2024). Câu trả lời 'không ho ông ổng' làm giảm mạnh khả năng croup, nên trẻ thở rít mà không ho ông ổng nghiêng về dị vật, phản vệ, viêm nắp thanh môn (Smith bảng 1), an toàn hơn. Tần suất trong số trẻ đã ho. Tỷ lệ nền 0,03."
  - finding: hoarse_voice
    freq: very_frequent
    evidence:
      tier: C
      basis: verbal
      sources: [smith-afp-2018, msd-croup, nhs-croup, byt-qd-3312-2015]
      locator: "Smith 2018 (bộ ba ho ông ổng, thở rít, khàn tiếng); MSD (ho ông ổng, khàn tiếng); 3312 tr. 268 (khàn tiếng hay mất tiếng là triệu chứng phụ hay gặp)"
      note: "Lượt A đề xuất dấu hiệu này, lượt B liên kết very_frequent; lượt C giữ. Không có tỷ lệ; khàn tiếng là một phần bộ ba chẩn đoán. Tỷ lệ nền 5%."
  - finding: stridor
    freq: occasional
    evidence:
      tier: C
      basis: numeric
      sources: [smith-afp-2018, msd-croup, nhs-croup, byt-qd-3312-2015]
      locator: "Smith 2018 (85% thể nhẹ, dưới 1% thể nặng; bảng Westley); MSD (thể nhẹ: không thở rít lúc nghỉ)"
      reported: "Khoảng 85% thể nhẹ, dưới 1% thể nặng"
      note: "Hai lượt trùng mức. Câu hỏi của app chỉ tính tiếng rít lúc ngồi yên, không khóc, tức thể vừa trở lên (khoảng 15%); nhiều trẻ chỉ rít khi khóc, quấy. Tỷ lệ nền 1% nên câu 'Có' vẫn tăng mạnh khả năng bệnh. Có dấu hiệu này thì quy tắc rf_stridor xếp mức 2."
  - finding: breathing_difficulty
    freq: frequent
    evidence:
      tier: C
      basis: verbal
      sources: [smith-afp-2018, msd-croup, nhs-croup]
      locator: "Smith 2018 (nhiều trẻ khó thở); MSD (trẻ thức giấc vì khó thở, thở nhanh, co kéo)"
      note: "Hai lượt trùng mức. Có ý nghĩa với Ho. Thể nhẹ có thể chỉ ho ông ổng, khàn tiếng; ước khoảng một nửa."
  - finding: night_respiratory_symptoms
    freq: very_frequent
    evidence:
      tier: C
      basis: verbal
      sources: [smith-afp-2018, msd-croup, nhs-croup]
      locator: "Smith 2018 (nặng hơn về đêm); MSD (ho ông ổng, khàn tiếng thường về đêm); NHS (thường nặng về đêm)"
      note: "Chỉ lượt B có (dấu hiệu thêm sau lượt A phần a); lượt C giữ vì ba nguồn cùng nêu. Tần suất trong số trẻ đã ho hoặc khó thở. Không có tỷ lệ."
  - finding: fever
    freq: frequent
    evidence:
      tier: C
      basis: verbal
      sources: [smith-afp-2018, msd-croup, nhs-croup]
      locator: "Smith 2018 (12–72 giờ sốt nhẹ; nhiều trẻ sốt nhưng không sốt không loại trừ); MSD (nhiều trẻ có sốt; croup co thắt thường không sốt)"
      note: "Hai lượt trùng mức. Có ý nghĩa với Ho và Khó thở. Ước khoảng một nửa."
  - finding: fever_max_temp
    dist: { lt_38: 0.425, t38_39: 0.475, ge_39: 0.10 }
    evidence:
      tier: C
      basis: verbal
      sources: [smith-afp-2018]
      locator: "Smith 2018 (sốt nhẹ; bảng 1: sốt cao, nhiễm độc gợi ý viêm khí quản do vi khuẩn, viêm nắp thanh môn)"
      note: "Trung bình hai lượt. Phân bố trong số trẻ có sốt. Ước lượng."
  - finding: fever_duration
    dist: { d1_2: 0.75, d3_5: 0.22, d6_7: 0.02, gt_7d: 0.01 }
    evidence:
      tier: C
      basis: judgment
      sources: [smith-afp-2018, bjornson-bmjopen-2024]
      locator: "Smith 2018 (12–72 giờ sốt nhẹ, sổ mũi; tự khỏi trong 48 giờ đến 1 tuần)"
      note: "Chỉ lượt B có; lượt C giữ. Phân bố trong số trẻ có sốt; bệnh ngắn ngày. Ước lượng."
  - finding: runny_nose
    freq: frequent
    evidence:
      tier: C
      basis: verbal
      sources: [smith-afp-2018, msd-croup, nhs-croup]
      locator: "Smith 2018 (12–72 giờ sổ mũi trước đó); MSD (thường có nhiễm trùng hô hấp trên trước)"
      note: "Hai lượt trùng mức. Sổ mũi trong 1–3 ngày đầu; khi ho ông ổng có thể đã giảm. Tỷ lệ nền 0,2; phân biệt yếu."
  - finding: cough_duration
    dist: { lt_1w: 0.915, w1_2: 0.065, w2_8: 0.015, gt_8w: 0.005 }
    evidence:
      tier: B
      basis: numeric
      sources: [bjornson-bmjopen-2024, smith-afp-2018, nhs-croup]
      locator: "Bjornson 2024 tóm tắt; Smith 2018 (tự khỏi trong 48 giờ đến 1 tuần)"
      reported: "Ho ông ổng hết ở 90% trẻ sau 78–119 giờ kể từ khi đến khám"
      note: "Trung bình hai lượt. Phân bố trong số trẻ đã ho, tính cả 1–3 ngày ho viêm long trước đó. Ho ông ổng kéo dài hoặc tái đi tái lại cần nghĩ bệnh khác (dị vật, hẹp thanh quản: Smith bảng 1; 3312 tr. 270)."
  - finding: dyspnea_onset
    dist: { sudden: 0.35, hours_days: 0.60, weeks: 0.05 }
    evidence:
      tier: C
      basis: verbal
      sources: [smith-afp-2018, msd-croup]
      locator: "Smith 2018 (ho ông ổng, thở rít khởi phát đột ngột); MSD (trẻ có thể thức giấc ban đêm vì khó thở)"
      note: "Hai lượt trùng phân bố. Phân bố trong số trẻ khó thở. Khó thở thường xuất hiện đột ngột về đêm sau 1–3 ngày cảm lạnh; người nhà có thể chọn 'đột ngột' hoặc 'vài giờ'. Ước lượng."
  - finding: chest_indrawing
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [smith-afp-2018, byt-qd-3312-2015, nhs-croup]
      locator: "Smith 2018 (85% thể nhẹ; co kéo gợi ý ca nặng hơn; bảng Westley); 3312 tr. 268 (độ 2: co kéo cơ hô hấp mạnh)"
      note: "Lượt A occasional, lượt B rare (above_leak_ok). Lượt C chọn occasional theo số liệu Smith: khoảng 15% không phải thể nhẹ, và thể vừa có co kéo lúc nghỉ, cùng cách tính với thở rít lúc nằm yên. Chỉ hỏi trẻ 2 tháng–5 tuổi. Có dấu hiệu này thì quy tắc rf_child_chest_indrawing xếp mức 2."
  - finding: wheeze
    freq: rare
    evidence:
      tier: C
      basis: verbal
      sources: [smith-afp-2018, who-imci-chart-booklet-2014]
      locator: "Smith 2018 (khò khè nếu có thường nhẹ; khò khè rõ cần nghĩ chẩn đoán khác); IMCI Module 3 (khò khè khi thở ra khác thở rít)"
      note: "Hai lượt trùng mức. Mức rare thấp hơn tỷ lệ nền 5%. Người nhà có thể gọi tiếng rít khi hít vào là 'khò khè', nên không chọn very_rare."
  - finding: cough_paroxysms
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [msd-croup]
      locator: "MSD (ho ông ổng, thường thành cơn co thắt)"
      note: "Chỉ lượt A có; lượt C giữ. Tần suất trong số trẻ đã ho. Ho có thể thành cơn nhưng không kéo dài nhiều tuần như ho gà. Ước khoảng 20%."
  - finding: sick_contact_respiratory
    freq: frequent
    evidence:
      tier: C
      basis: judgment
      sources: [msd-croup, smith-afp-2018]
      locator: "Smith 2018 (do vi rút đường hô hấp, chủ yếu á cúm)"
      note: "Chỉ lượt A có; lượt C giữ. Bệnh do vi rút đường hô hấp lây từ người đang cảm, ho. Ước khoảng một nửa. Tỷ lệ nền 0,2."
  - finding: choking_episode
    freq: very_rare
    evidence:
      tier: C
      basis: verbal
      sources: [smith-afp-2018, msd-croup, byt-qd-3312-2015]
      locator: "Smith 2018 bảng 1 (dị vật đường thở: khởi phát đột ngột nghẹn, hóc); MSD (dị vật thường không sốt, không có nhiễm trùng hô hấp trên trước); 3312 tr. 269 (dị vật đường thở thường có hội chứng xâm nhập)"
      note: "Hai lượt trùng mức. Bắt đầu ngay sau hóc, sặc gợi ý dị vật đường thở, không phải croup. Mức very_rare thấp hơn tỷ lệ nền 1%. Quy tắc rf_choking_episode xếp mức 2."
  - finding: drooling_cannot_swallow
    freq: very_rare
    evidence:
      tier: C
      basis: verbal
      sources: [smith-afp-2018, msd-croup]
      locator: "Smith 2018 (chảy dãi rất nhạy và đặc hiệu để phân biệt viêm nắp thanh môn; bảng 1: áp xe sau họng); MSD (viêm nắp thanh môn trông nhiễm độc hơn, không ho ông ổng)"
      note: "Chỉ lượt B có (dấu hiệu thêm sau lượt A phần a); lượt C giữ. Chảy dãi, không nuốt được gợi ý viêm nắp thanh môn, áp xe sau họng, dị vật. Mức very_rare thấp hơn tỷ lệ nền 1%. Quy tắc rf_drooling_cannot_swallow xếp mức 2."
  - finding: apnea_cyanosis_spells
    freq: very_rare
    evidence:
      tier: C
      basis: numeric
      sources: [smith-afp-2018, byt-qd-3312-2015]
      locator: "Smith 2018 (dưới 1% thể nặng; phần lớn không tím); 3312 tr. 270 (độ 3: tím tái, rối loạn nhịp thở)"
      note: "Chỉ lượt A có; lượt C giữ. Chỉ hỏi trẻ dưới 5 tuổi. Tím tái, ngừng thở chỉ có ở thể nặng (dưới 1%). Quy tắc rf_infant_apnea xếp mức 1."
warning_signs:
  - stridor
  - chest_indrawing
  - drooling_cannot_swallow
  - apnea_cyanosis_spells
  - grunting
  - es_severe_breathing
  - drowsy_hard_to_wake
  - child_unable_to_drink
self_care_vi:
  - "Giữ bé bình tĩnh, bế hoặc cho ngồi thẳng; khóc làm bé khó thở hơn."
  - "Cho bé uống đủ nước, bú từng ít một; kiểm tra bé thường xuyên, cả ban đêm."
  - "Không cho bé xông hơi nước nóng hoặc ngồi trong phòng đầy hơi nước."
  - "Không tự dùng thuốc ho; hỏi bác sĩ hoặc dược sĩ trước khi dùng thuốc."
see_doctor_vi:
  - "Đi khám trong 24 giờ: bác sĩ có thể cho thuốc giúp giảm sưng thanh quản."
  - "Đi khám lại ngay nếu bé nặng hơn, hoặc không đỡ sau khi đã khám."
  - "Trẻ dưới 6 tháng, hoặc bệnh kéo dài quá 5 ngày, cần được khám lại."
  - "Đi cấp cứu ngay nếu bé thở rít cả khi nằm yên, lõm ngực, tím tái, chảy dãi không nuốt được, hoặc lơ mơ."
sources: [smith-afp-2018, msd-croup, nhs-croup, byt-qd-3312-2015]
review:
  status: source_checked
  authors: ["agent:pass-a", "agent:pass-b"]
  reconciler: "agent:pass-c"
  doctor_reviewer: null
  updated: "2026-10-31"
  notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần b) đối chiếu 19 liên kết, 2 prior, hệ số giới và mở lại mọi nguồn được trích. Mức xử trí 3 (hai lượt cùng đổi từ gợi ý 4): NHS khuyên đặt lịch khám khẩn hoặc gọi 111 ngay khi nghĩ trẻ bị bệnh này vì bác sĩ có thể cho thuốc; 3312/QĐ-BYT coi khó thở thanh quản là cấp cứu hô hấp ở trẻ em, độ 1 điều trị ngoại trú bằng một liều corticoid và tái khám hằng ngày; Smith 2018: một liều corticoid cải thiện triệu chứng ở mọi mức độ. Bệnh ngắn ngày nên khám trong vài ngày là quá muộn. Không thuộc nhóm không được bỏ sót: thể vừa, nặng (thở rít lúc nằm yên, rút lõm, chảy dãi, tím) đã có quy tắc mức 1–2. Phạm vi tuổi theo lượt B (dưới 18 tuổi): kb-guide chỉ cho khai báo phạm vi khi bất khả về sinh học; prior ở dưới 2 tháng và 13–17 tuổi thấp. Không dùng Bjornson 2013 (CMAJ): cmaj.ca và pmc.ncbi.nlm.nih.gov chặn truy cập tự động, Europe PMC không trả toàn văn; các dữ kiện tương ứng lấy từ Smith 2018 (trích Bjornson), MSD, NHS. Không giữ liên kết mề đay của lượt B (very_rare): nguồn duy nhất là Bjornson 2013, và mề đay cấp ở trẻ nhỏ hay do nhiễm vi rút. Điều cần bác sĩ xem: (1) prior là ước lượng, không có số liệu Việt Nam; (2) tần suất khàn tiếng, ho về đêm, sốt, co kéo chỉ có mô tả bằng lời; (3) 3312/QĐ-BYT phân độ khó thở thanh quản theo tiếng ho, tiếng rít, co kéo, khác bảng Westley; (4) mã J05.0 chưa đối chiếu được."
