  notes_vi: "Mức xử trí 1, không được bỏ sót (hai lượt thống nhất): 3312/QĐ-BYT (2015): khởi phát cấp, diễn biến nặng, tử vong và di chứng cao; 5642/QĐ-BYT: cần acyclovir tĩnh mạch sớm; NHS: gọi 999 khi lú lẫn, co giật, khó nói, yếu, mất ý thức; CDC: tử vong 20–30%. Bệnh gộp viêm não do vi rút viêm não Nhật Bản, herpes, vi rút đường ruột; viêm não tự miễn (thường không sốt) chưa được mô tả riêng. Mã A86 chỉ là mã đại diện (A83.0, B00.4, G04 là mã cụ thể), chưa đối chiếu với bộ mã của Bộ Y tế; bỏ mã MONDO của lượt A vì chưa kiểm tra. Lượt C bỏ nguồn CDC Yellow Book (trùng nội dung trang CDC dành cho nhân viên y tế). Cần bác sĩ xem: (1) prior chỉ suy từ tỷ suất mắc và tỷ lệ ở bệnh viện tỉnh, chưa có số liệu người đi khám vì sốt hoặc đau đầu; (2) tần suất lấy từ người bệnh nằm viện (Việt Nam, Trung Quốc, Ấn Độ); lú lẫn very_frequent nên người hỏi ở giai đoạn khởi phát bị xếp thấp; (3) hệ số mùa chỉ cho miền Bắc, áp dụng cho mọi tuổi dù đỉnh mùa chủ yếu ở trẻ em; (4) chưa có câu hỏi về tiêm vắc xin viêm não Nhật Bản và 'thay đổi tính tình, hành vi' (đề xuất của lượt B, chưa đưa vào danh mục ở lô này); (5) đề nghị người bảo trì thêm encephalitis vào `conditions` của rf_altered_consciousness và rf_new_seizure."
