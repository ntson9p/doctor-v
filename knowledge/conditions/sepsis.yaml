id: sepsis
names:
  vi: "Nhiễm khuẩn huyết"
  vi_common: ["Nhiễm trùng máu", "Nhiễm trùng huyết"]
  en: "Sepsis"
codes:
  icd10: "A41.9"
  icd10_verified: false
  mondo: "MONDO:0005229"
summary_vi:
  - "Tình trạng nhiễm khuẩn nặng, vi khuẩn lan vào máu và làm tổn thương nhiều cơ quan."
  - "Có thể sốt cao, rét run hoặc thân nhiệt thấp, kèm thở nhanh, lú lẫn, tay chân lạnh, tiểu ít."
  - "Đây là tình trạng cấp cứu, có thể gây sốc và tử vong nhanh nếu không được điều trị kịp thời."
urgency: 1
cant_miss: true
specialties: [emergency, infectious_disease]
priors:
  - complaint: fever
    default: P5
    by_age: { infant_0_2m: P3, child_2m_5y: P5, elder_65_74: P4, elder_75p: P3 }
    evidence:
      tier: B
      basis: judgment
      sources: [rudd-lancet-2020, nhs-sepsis, byt-qd-5642-2015, loots-bjgp-2022]
      locator: "Rudd 2020 phần Findings; NHS Sepsis (nhóm nguy cơ cao); 5642 bài Nhiễm khuẩn huyết (yếu tố nguy cơ); Loots 2022 bảng 1"
      reported: "Toàn cầu năm 2017 có khoảng 48,9 triệu ca nhiễm khuẩn huyết; tỷ lệ mắc cao nhất ở trẻ nhỏ, đỉnh thứ hai ở người cao tuổi; gánh nặng cao ở Đông Nam Á. NHS: nhóm nguy cơ cao gồm trẻ dưới 12 tháng và người trên 75 tuổi. Ở người cao tuổi bệnh cấp nghi nhiễm khuẩn nặng được bác sĩ gia đình khám tại nhà, 42% là nhiễm khuẩn huyết (chọn lọc mạnh)"
      note: "Không có số liệu về tỷ lệ nhiễm khuẩn huyết trong số người sốt ở cộng đồng Việt Nam. Hai lượt trùng mức ở mọi nhóm tuổi trừ 2 tháng–5 tuổi (lượt A P4, lượt B P5 sau khi chạy thử). Lượt C chọn P5 cho 2 tháng–5 tuổi: nhóm nguy cơ cao theo NHS và 5642 là trẻ sơ sinh, trẻ dưới 12 tháng (nhóm dưới 2 tháng đã ở P3); trẻ sốt không có dấu hiệu nguy hiểm được IMCI và NHS cho theo dõi tại nhà, còn trẻ có dấu hiệu nặng đã được quy tắc mức 2 bắt. Lượt C chạy lại: với P4, trẻ 2 tuổi chỉ sốt cao 1 ngày, không có dấu hiệu nào khác bị xếp mức 2 (tổng xác suất mức 1–2 vượt ngưỡng 2%); với P5 là mức 3 (xem biên bản đối chiếu). Người lớn dưới 65 tuổi P5; 65–74 tuổi P4; từ 75 tuổi P3. Cần bác sĩ duyệt."
findings:
  - finding: chills_rigors
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [loots-bjgp-2022, wattanapaiboon-idr-2020, byt-qd-5642-2015, nhs-sepsis]
      locator: "Loots bảng 1; Wattanapaiboon bảng 2; 5642 mục 2.1 (sốt có thể kèm theo rét run hoặc không); NHS (shivery)"
      reported: "Rét run 66% (nhóm không nhiễm khuẩn huyết 60%); sốt và/hoặc rét run 53,8%"
      note: "Tần suất trong số người đã sốt. Hai lượt trùng mức."
  - finding: fever_max_temp
    dist: { lt_38: 0.20, t38_39: 0.33, ge_39: 0.47 }
    evidence:
      tier: B
      basis: numeric
      sources: [loots-bjgp-2022, byt-qd-5642-2015, nhs-sepsis]
      locator: "Loots bảng 1; 5642 mục 2.1 (ca nặng có thể hạ thân nhiệt); NHS (nhiệt độ rất cao hoặc rất thấp)"
      reported: "Nhiệt độ trung bình 39,0°C (độ lệch chuẩn 0,7) ở nhóm nhiễm khuẩn huyết, 38,5°C ở nhóm không"
      note: "Trung bình hai lượt. Lựa chọn 'dưới 38°C' gồm cả người thân nhiệt thấp."
  - finding: fever_duration
    dist: { d1_2: 0.55, d3_5: 0.30, d6_7: 0.08, gt_7d: 0.07 }
    evidence:
      tier: B
      basis: judgment
      sources: [loots-bjgp-2022]
      locator: "Bảng 1 (bệnh tiến triển nhanh)"
      reported: "Bệnh tiến triển nhanh ở 84% nhóm nhiễm khuẩn huyết (70% ở nhóm không)"
      note: "Chỉ lượt A khai báo; gần với phân bố nền, lệch nhẹ về sốt mới vài ngày. Ước lượng."
  - finding: confusion
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [wattanapaiboon-idr-2020, loots-bjgp-2022, nhs-sepsis, byt-qd-5642-2015]
      locator: "Wattanapaiboon bảng 2; Loots bảng 1; NHS (confused, slurred speech); 5642 mục 2.1 (có thể thay đổi ý thức)"
      reported: "Nói ngọng hoặc lú lẫn 22,2% (cấp cứu Thái Lan, tuổi trung vị 67); thay đổi ý thức 54% ở người cao tuổi (tuổi trung vị 80) được bác sĩ gia đình khám tại nhà"
      note: "Lượt A chọn frequent (Loots), lượt B occasional (Wattanapaiboon). Lượt C chọn occasional: nhóm Thái Lan gần người dùng doctor-v hơn (Đông Nam Á, trẻ hơn); mức thấp hơn cũng giữ cho câu trả lời 'không lú lẫn' không làm giảm mạnh khả năng bệnh. Có lú lẫn thì quy tắc mức 2 đã áp dụng."
  - finding: drowsy_hard_to_wake
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [wattanapaiboon-idr-2020, nhs-sepsis, byt-qd-5642-2015]
      locator: "Wattanapaiboon bảng 2 (thay đổi ý thức là triệu chứng khi đến khám 13,0%); NHS (trẻ dưới 5 tuổi khó đánh thức, ngủ nhiều hơn); 5642 mục 2.1"
      reported: "Thay đổi ý thức 13,0%"
      note: "Lượt A frequent, lượt B occasional (đều ước lượng). Lượt C chọn occasional theo số liệu Wattanapaiboon; với trẻ dưới 5 tuổi (không hỏi lú lẫn), mức này giữ cho câu trả lời 'không li bì' không làm giảm mạnh khả năng bệnh. Cùng cụm với lú lẫn."
  - finding: breathing_difficulty
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [wattanapaiboon-idr-2020, loots-bjgp-2022, byt-qd-5642-2015, nhs-sepsis]
      locator: "Wattanapaiboon bảng 1–2; Loots bảng 1; 5642 mục 2.1 (thở nhanh); NHS (breathing very fast)"
      reported: "Khó thở nhiều 41,4%; ổ nhiễm ở phổi 49,9%; nhịp thở trung bình 26 lần/phút (Loots)"
      note: "Hai lượt trùng mức."
  - finding: cold_hands_feet
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [nhs-sepsis, wattanapaiboon-idr-2020, byt-qd-5642-2015]
      locator: "NHS (da, môi tái, xám hoặc loang lổ); Wattanapaiboon bảng 1–2 (42,8% sốc nhiễm khuẩn; da loang lổ ghi nhận 1,1%); 5642 mục 2.1 (sốc nhiễm khuẩn)"
      note: "Hai lượt trùng mức. Dấu hiệu giảm tưới máu thường bị ghi chép thiếu; ước 20–30%."
  - finding: severe_weakness
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [wattanapaiboon-idr-2020, byt-qd-5642-2015]
      locator: "Wattanapaiboon bảng 2 (mệt mỏi 16,2%); 5642 mục 2.1"
      note: "Lượt A frequent, lượt B occasional (đều ước lượng; không có số liệu về mệt lả đến mức không tự đi lại). Lượt C chọn occasional, gần số liệu mệt mỏi 16,2%; có dấu hiệu này thì quy tắc mức 2 đã áp dụng."
  - finding: decreased_urine
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [wattanapaiboon-idr-2020, nhs-sepsis, byt-qd-5642-2015]
      locator: "Wattanapaiboon bảng 2 (cả ngày không đi tiểu 4,1%); NHS (trẻ không đi tiểu 12 giờ); 5642 mục 2.1 (thiểu niệu)"
      note: "Hai lượt trùng mức. Câu hỏi doctor-v (lượng nước tiểu ít hẳn trong 12 giờ) dễ thỏa hơn 'cả ngày không đi tiểu'."
  - finding: fainting_or_near_fainting
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-5642-2015, wattanapaiboon-idr-2020]
      locator: "5642 mục 2.1 (sốc nhiễm khuẩn: tụt huyết áp); Wattanapaiboon bảng 1 (42,8% sốc)"
      note: "Hai lượt trùng mức; choáng, ngất do tụt huyết áp, ước lượng."
  - finding: rash_non_blanching
    freq: frequent
    evidence:
      tier: B
      basis: judgment
      sources: [nhs-sepsis, wertheim-plosone-2009, byt-qd-5642-2015]
      locator: "NHS (ban không mất khi ấn); Wertheim phần Results (ban xuất huyết, bầm tím ở 14% ca liên cầu lợn); 5642 (yếu tố nguy cơ: N. meningitidis, S. suis)"
      note: "Tần suất trong số người nhiễm khuẩn huyết đã có ban: ban do não mô cầu, liên cầu lợn, rối loạn đông máu thường là ban xuất huyết. Hai lượt trùng mức, ước khoảng một nửa."
  - finding: cough
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [wattanapaiboon-idr-2020, loots-bjgp-2022]
      locator: "Wattanapaiboon bảng 2; Loots bảng 1"
      reported: "Ho có đờm 25,2%, ho khan 3,0% khi đến khám; ổ nhiễm hô hấp 40–50%"
      note: "Chỉ lượt A liên kết (ở mức frequent). Lượt C chọn occasional theo tỷ lệ ho khi đến khám (khoảng 28%); mức này bằng tỷ lệ nền 0,2 nên trung tính, tránh làm mọi người sốt kèm ho tăng khả năng nhiễm khuẩn huyết."
  - finding: immunocompromised
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [wattanapaiboon-idr-2020, byt-qd-5642-2015, nhs-sepsis]
      locator: "Wattanapaiboon bảng 1; 5642 (yếu tố nguy cơ); NHS (higher-risk groups)"
      reported: "Suy giảm miễn dịch 10,8%"
      note: "Hai lượt trùng mức."
  - finding: diabetes
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [wattanapaiboon-idr-2020, loots-bjgp-2022, byt-qd-5642-2015]
      locator: "Wattanapaiboon bảng 1; Loots bảng 1; 5642 (yếu tố nguy cơ: tiểu đường)"
      reported: "Đái tháo đường 25,2% (tuổi trung vị 67); 36% so với 24% ở nhóm không (tuổi trung vị 80)"
      note: "Hai lượt trùng mức; người dùng doctor-v trẻ hơn các nhóm nghiên cứu."
  - finding: child_unable_to_drink
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [nhs-sepsis]
      locator: "Trẻ dưới 5 tuổi: not feeding"
      note: "Hai lượt trùng mức. Chỉ hỏi ở trẻ 2 tháng–5 tuổi; ước lượng, chưa có số liệu."
warning_signs:
  - confusion
  - drowsy_hard_to_wake
  - breathing_difficulty
  - cold_hands_feet
  - severe_weakness
  - decreased_urine
  - rash_non_blanching
  - seizure_recent
  - fainting_or_near_fainting
self_care_vi:
  - "Không tự chữa tại nhà và không chờ xem có đỡ không."
  - "Trong lúc chờ xe cấp cứu, cho người bệnh nằm nghỉ và mang theo các thuốc đang dùng."
see_doctor_vi:
  - "Gọi 115 hoặc đến khoa cấp cứu gần nhất ngay."
  - "Nhiễm khuẩn huyết cần được dùng kháng sinh càng sớm càng tốt tại bệnh viện."
  - "Báo cho nhân viên y tế các bệnh nền, thuốc đang dùng và nơi có thể bị nhiễm khuẩn như phổi, đường tiểu, vết thương."
review:
  status: source_checked
  authors: ["agent:pass-a", "agent:pass-b"]
  reconciler: "agent:pass-c"
  doctor_reviewer: null
  updated: "2026-10-25"
  notes_vi: "Mức xử trí 1, thuộc nhóm không được bỏ sót (kb-guide mục 2.5; 5642: tử vong 20–50%; NHS: gọi 999 khi có dấu hiệu). Lượt C bỏ: tiểu buốt (4,3% khi đến khám, không phân biệt), nôn liên tục (không có số liệu; đã có quy tắc mức 3), để tránh làm mọi ca nhiễm trùng tiết niệu, tiêu chảy có sốt bị đẩy lên mức cấp cứu chỉ vì xác suất. Không liên kết ăn tiết canh, giết mổ lợn: chưa có số liệu tỷ lệ liên cầu lợn trong toàn bộ nhiễm khuẩn huyết. Không dùng NICE NG253/NG254 vì nice.org.uk chặn truy cập trực tiếp. Điểm cần bác sĩ xem: (1) prior hoàn toàn là ước lượng, nhất là trẻ 2 tháng–5 tuổi (P4 hay P5); (2) tần suất triệu chứng lấy từ nghiên cứu ở khoa cấp cứu Thái Lan và người cao tuổi Hà Lan; (3) mô hình một bệnh: nhiễm khuẩn huyết thường đi kèm viêm phổi, viêm thận – bể thận, nên xác suất bị chia với bệnh nguồn; (4) MONDO:0005229 là 'bacterial infectious disease with sepsis'."
