warning_signs:
  - confusion
  - drowsy_hard_to_wake
  - breathing_difficulty
  - cold_hands_feet
  - severe_weakness
  - decreased_urine
  - rash_non_blanching
  - seizure_recent
  - fainting_or_near_fainting
self_care_vi:
  - "Không tự chữa tại nhà và không chờ xem có đỡ không."
  - "Trong lúc chờ xe cấp cứu, cho người bệnh nằm nghỉ và mang theo các thuốc đang dùng."
see_doctor_vi:
  - "Gọi 115 hoặc đến khoa cấp cứu gần nhất ngay."
  - "Nhiễm khuẩn huyết cần được dùng kháng sinh càng sớm càng tốt tại bệnh viện."
  - "Báo cho nhân viên y tế các bệnh nền, thuốc đang dùng và nơi có thể bị nhiễm khuẩn như phổi, đường tiểu, vết thương."
review:
  status: source_checked
  authors: ["agent:pass-a", "agent:pass-b"]
  reconciler: "agent:pass-c"
  doctor_reviewer: null
  updated: "2026-10-31"
  notes_vi: "Mức xử trí 1, thuộc nhóm không được bỏ sót (kb-guide mục 2.5; 5642: tử vong 20–50%; NHS: gọi 999 khi có dấu hiệu). Lượt C bỏ: tiểu buốt (4,3% khi đến khám, không phân biệt), nôn liên tục (không có số liệu; đã có quy tắc mức 3), để tránh làm mọi ca nhiễm trùng tiết niệu, tiêu chảy có sốt bị đẩy lên mức cấp cứu chỉ vì xác suất. Không liên kết ăn tiết canh, giết mổ lợn: chưa có số liệu tỷ lệ liên cầu lợn trong toàn bộ nhiễm khuẩn huyết. Không dùng NICE NG253/NG254 vì nice.org.uk chặn truy cập trực tiếp. Điểm cần bác sĩ xem: (1) prior hoàn toàn là ước lượng, nhất là trẻ 2 tháng–5 tuổi (P4 hay P5); (2) tần suất triệu chứng lấy từ nghiên cứu ở khoa cấp cứu Thái Lan và người cao tuổi Hà Lan; (3) mô hình một bệnh: nhiễm khuẩn huyết thường đi kèm viêm phổi, viêm thận – bể thận, nên xác suất bị chia với bệnh nguồn; (4) MONDO:0005229 là 'bacterial infectious disease with sepsis'. Giai đoạn 3 lô 1 (lượt C phần b, 25/10/2026): thêm prior cho Ngất (người lớn dưới 65 tuổi P5, từ 65 tuổi P4, trẻ 5–17 tuổi P6) và Chóng mặt (18–74 tuổi P5, từ 75 tuổi P4, trẻ 5–17 tuổi P6); thêm 6 liên kết (sốt, choáng khi đứng dậy, hoàn cảnh ngất, chưa hồi phục sau ngất, mạch, kiểu chóng mặt); không giữ liên kết chóng mặt (frequent) của lượt A vì chỉ là nhận định (NHS Sepsis không liệt kê chóng mặt) mà câu trả lời không chóng mặt sẽ hạ nhiễm khuẩn huyết ở mọi người chọn Sốt và tần suất theo triệu chứng chính cho choáng, ngất (Chóng mặt: frequent). Không sửa giá trị cũ. Bác sĩ cần xem thêm: prior dưới Ngất, Chóng mặt là ước lượng; các liên kết có sẵn (lú lẫn, khó thở, tay chân lạnh) lấy từ người bệnh đi khám vì sốt; liên kết mới choáng khi đứng dậy, mạch cũng có thể được hỏi khi triệu chứng chính là Sốt. Giai đoạn 3 lô 3 (lượt C phần b, 31/10/2026): thêm prior Khó thở (hai lượt trùng: người lớn dưới 65 tuổi và trẻ 2 tháng–5 tuổi P5, từ 65 tuổi và dưới 2 tháng P4, trẻ 5–17 tuổi P6) và 4 liên kết (khởi phát khó thở, mức khó thở, SpO2, thở rên ở trẻ dưới 5 tuổi). Nguồn mới ray-critcare-2006 (đã mở lại); NICE NG253, NG254 nay mở trực tiếp được (ghi chú cũ nói bị chặn). Không sửa giá trị cũ; với Khó thở, các liên kết sốt (frequent), rét run, lú lẫn, tay chân lạnh, mệt lả trở thành bằng chứng, còn liên kết ho (occasional, bằng tỷ lệ nền 0,2) trung tính. Bác sĩ cần xem thêm: prior Khó thở cộng vào tổng xác suất mức 1–2 ở mọi người chọn Khó thở, nhất là từ 65 tuổi (P4); các phân bố mới là ước lượng."
