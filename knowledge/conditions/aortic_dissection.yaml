  updated: "2026-10-31"
  notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần c) đối chiếu 21 liên kết và mở lại mọi nguồn được trích (toàn văn Evangelista 2016, Methorst 2026, Erhabor 2026, Saricilar 2026; tóm tắt Klompas 2002, Hagan 2000, Pape 2015, Howard 2013; MSD; HSE đã được lượt R mở cùng ngày). Mức xử trí 1, không được bỏ sót, hai lượt giống nhau. HSE ghi 'gọi 112 hoặc 999, hoặc đến khoa cấp cứu ngay' (theo quy ước của lượt R cho quy tắc là mức 2), nhưng NHS (bài viêm sụn sườn) xếp đau ngực, lưng đột ngột như xé vào 'chỉ gọi 999', NHS Chest pain xếp đau ngực đột ngột lan ra lưng vào 'Call 999', và bệnh tử vong nhanh: khoảng 20% tử vong trước khi tới viện, không điều trị thì 1–2% mỗi giờ (MSD), gần một nửa ca týp A tử vong trước khi được khám ở viện (Oxford). Lượt C giữ mức 1, cùng mức với quy tắc rf_aortic_dissection_signs; bác sĩ cần quyết. Không khai báo applicability (lượt B loại trẻ dưới 13 tuổi): bệnh rất hiếm nhưng không bất khả ở trẻ có bệnh mô liên kết; dùng prior P6. Không có mã MONDO riêng cho bóc tách mắc phải; tên chính thức và mã I71.0 chưa đối chiếu bảng ICD-10 của Bộ Y tế (4235/QĐ-BYT gọi là 'phình tách động mạch chủ'). Bác sĩ cần xem: (1) prior ước lượng từ tỷ lệ mới mắc, chưa có số liệu ở người đau ngực tại Việt Nam; (2) đau như xé để occasional vì hai nguồn lệch nhau (MSD: hay gặp; IRAD: không phổ biến); (3) tần suất đau lan, ngất, vã mồ hôi lấy từ Methorst 2026 (chỉ týp A được mổ, ghi theo hồ sơ) và IRAD (trung tâm chuyên sâu); (4) danh mục không có câu mạch hoặc huyết áp hai tay chênh nhau (LR dương 5,7) vì người dân khó tự đo; (5) chưa dùng hệ số theo mùa dù IRAD thấy bệnh hay gặp vào mùa đông."
