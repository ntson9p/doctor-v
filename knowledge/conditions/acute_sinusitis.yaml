id: acute_sinusitis
names:
  vi: "Viêm mũi xoang cấp tính"
  vi_common: ["Viêm xoang cấp", "Viêm xoang"]
  en: "Acute rhinosinusitis"
codes:
  icd10: "J01.9"
  icd10_verified: false
summary_vi:
  - "Viêm niêm mạc mũi và các xoang quanh mũi, thường xảy ra sau cảm lạnh hoặc cúm."
  - "Thường nghẹt mũi, chảy mũi đục, đau hoặc nặng vùng trán, má, có thể giảm ngửi."
  - "Nên nghĩ tới khi triệu chứng mũi kéo dài quá 10 ngày, hoặc đã đỡ rồi lại nặng lên."
urgency: 4
cant_miss: false
specialties: [ent, general_medicine]
priors:
  - complaint: headache
    default: P3
    by_age:
      child_2m_5y: P4
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-5643-2015, ebell-afm-2019, nhs-sinusitis]
      note: "Thang tuyệt đối (kb-guide 2.3). Đau đầu là triệu chứng phụ của viêm mũi xoang cấp (5643) và có ở khoảng một nửa người bệnh (Ebell); 5643 lưu ý đau đầu, đau nửa đầu rất dễ nhầm với đau do viêm xoang. Ước 1–5% người đến vì đau đầu; trẻ dưới 5 tuổi ít khi than đau đầu nên hạ một mức (lượt B)."
  - complaint: fever
    default: P4
    evidence:
      tier: C
      basis: judgment
      sources: [ebell-afm-2019, byt-qd-5643-2015]
      reported: "nhiệt độ trên 38°C có độ nhạy 0,11"
      note: "Chỉ khoảng 11% người viêm mũi xoang cấp có nhiệt độ trên 38°C, nên hiếm khi là nguyên nhân chính của sốt; trẻ em có thể sốt nhẹ kéo dài (5643). Ước 0,2–1%; hai lượt thống nhất."
findings:
  - finding: fever
    freq: occasional
    freq_by_age:
      child_2m_5y: frequent
      child_5_12: frequent
    evidence:
      tier: A
      basis: numeric
      sources: [ebell-afm-2019, byt-qd-5643-2015]
      locator: "5643, bài Viêm mũi xoang trẻ em, mục 3.1.1"
      reported: "nhiệt độ trên 38°C 0,11 (7 nghiên cứu, chủ yếu người lớn)"
      note: "Chỉ có tác dụng khi triệu chứng chính là đau đầu. Câu hỏi của doctor-v tính sốt từ 37,5°C nên cao hơn 11%. 5643 (bài trẻ em): trẻ thường sốt nhẹ kéo dài, nên tăng mức cho trẻ (lượt B)."
  - finding: fever_max_temp
    dist: { lt_38: 0.55, t38_39: 0.35, ge_39: 0.10 }
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-5643-2015, ebell-afm-2019]
      note: "Phần lớn sốt nhẹ (5643: trẻ sốt nhẹ kéo dài); nhiệt độ trên 38°C chỉ ở khoảng 11% người bệnh. Phân bố trong số người có sốt (lượt B)."
  - finding: fever_duration
    dist: { d1_2: 0.30, d3_5: 0.40, d6_7: 0.20, gt_7d: 0.10 }
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-5643-2015, cdc-sinus-infection]
      note: "Viêm xoang thường kéo dài hơn viêm hô hấp trên do vi rút; trẻ có thể sốt nhẹ kéo dài (5643); CDC khuyên đi khám khi sốt quá 3–4 ngày. Lượt C giữ tỷ lệ sốt quá 7 ngày bằng tỷ lệ nền (lượt B: 0,20) để bệnh lành tính này không 'giải thích' sốt kéo dài, vốn cần tìm nguyên nhân khác. Ước lượng."
  - finding: nasal_congestion
    freq: very_frequent
    evidence:
      tier: A
      basis: numeric
      sources: [ebell-afm-2019, byt-qd-5643-2015]
      locator: "Ebell 2019, bảng 3"
      reported: "nghẹt mũi 0,83 (9 nghiên cứu)"
      population: "người ngoại trú nghi viêm mũi xoang cấp, phần lớn ở phòng khám chuyên khoa"
  - finding: runny_nose
    freq: very_frequent
    evidence:
      tier: A
      basis: numeric
      sources: [ebell-afm-2019, byt-qd-5643-2015]
      reported: "có chảy mũi 0,75 (4 nghiên cứu)"
  - finding: purulent_nasal_discharge
    freq: very_frequent
    evidence:
      tier: A
      basis: numeric
      sources: [ebell-afm-2019, byt-qd-5643-2015, nhs-sinusitis]
      reported: "chảy mũi mủ 0,71 (10 nghiên cứu) trong khi có chảy mũi 0,75"
      note: "Tần suất trong số người có sổ mũi nên còn cao hơn 0,71."
  - finding: facial_pain_pressure
    freq: frequent
    evidence:
      tier: A
      basis: numeric
      sources: [ebell-afm-2019, byt-qd-5643-2015, nhs-sinusitis]
      reported: "đau vùng hàm hoặc trán 0,49 (3 nghiên cứu); đau tăng khi cúi người 0,72 (5 nghiên cứu)"
      note: "Câu hỏi gộp đau, nặng vùng trán, má với tăng khi cúi đầu; phần chính của câu hỏi là đau vùng mặt (0,49), nên chọn frequent (lượt A). Lượt B để very_frequent theo số 0,72. 5643, NHS xếp đau vùng mặt vào triệu chứng chính."
  - finding: loss_of_smell_taste
    freq: frequent
    evidence:
      tier: A
      basis: numeric
      sources: [ebell-afm-2019, nhs-sinusitis, byt-qd-5643-2015]
      reported: "giảm hoặc mất ngửi 0,61"
      note: "Lượt B để occasional theo ước lượng; chọn số liệu của Ebell (lượt A)."
  - finding: headache
    freq: frequent
    freq_by_age:
      child_5_12: very_frequent
    evidence:
      tier: A
      basis: numeric
      sources: [ebell-afm-2019, byt-qd-5643-2015]
      locator: "5643, bài Viêm mũi xoang trẻ em, mục 3.1.1"
      reported: "đau đầu 0,50 (6 nghiên cứu)"
      note: "Dùng khi triệu chứng chính là sốt. 5643 (bài trẻ em): trẻ trên 6 tuổi luôn có nhức đầu, nên tăng một mức cho trẻ 5–12 tuổi (lượt B)."
  - finding: cough
    freq: very_frequent
    evidence:
      tier: A
      basis: numeric
      sources: [ebell-afm-2019, byt-qd-5643-2015]
      reported: "ho 0,69 (7 nghiên cứu)"
  - finding: nasal_symptoms_over_10_days
    freq: frequent
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-5643-2015, ebell-afm-2019, cdc-sinus-infection]
      locator: "5643, bài Viêm mũi xoang cấp tính, mục 3.1.1 và 3.2.1"
      reported: "thời gian bệnh trên 5, 10 hoặc 21 ngày: độ nhạy 25–70%"
      note: "5643: nghĩ đến viêm mũi xoang do vi khuẩn khi viêm mũi do vi rút kéo dài hơn 10 ngày hoặc xấu đi sau 5–7 ngày. Tần suất trong số người có sổ mũi hoặc nghẹt mũi. Hai lượt thống nhất."
  - finding: symptoms_worsen_after_improving
    freq: very_frequent
    evidence:
      tier: A
      basis: numeric
      sources: [ebell-afm-2019, byt-qd-5643-2015, cdc-sinus-infection]
      reported: "bệnh nặng lên lần hai 0,74 (3 nghiên cứu; độ đặc hiệu chỉ 0,41)"
      note: "5643: nghĩ viêm mũi xoang do vi khuẩn khi bệnh xấu đi sau 5–7 ngày. Lượt A để frequent vì nhiều ca chỉ kéo dài mà không có pha đỡ rồi nặng lại; chọn số liệu của lượt B (very_frequent). Độ đặc hiệu thấp ở nhóm nghi viêm xoang, nhưng liên kết của cảm lạnh để rare."
  - finding: ear_pain
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-5643-2015, nhs-sinusitis]
      locator: "5643, bài Viêm mũi xoang cấp tính, mục 3.1.1"
      note: "5643 xếp đau nhức ở tai vào triệu chứng phụ; NHS nêu cảm giác căng tai. Hai lượt thống nhất."
  - finding: sore_throat
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [cdc-sinus-infection]
      note: "CDC liệt kê đau họng do dịch chảy xuống họng; không có tỷ lệ. Chỉ lượt A có liên kết này."
  - finding: headache_duration
    dist: { lt_4h: 0.05, h4_72: 0.37, gt_3d: 0.58 }
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-5643-2015]
      locator: "5643, bài Viêm mũi xoang cấp tính, mục 3.2.3–3.2.4"
      note: "Đau do viêm xoang kéo dài liên tục nhiều ngày; 5643 phân biệt với đau nửa đầu (4–72 giờ) và đau dây thần kinh V (từng cơn). Trung bình của hai lượt."
  - finding: headache_location
    dist: { one_side: 0.15, both_sides: 0.10, forehead_face: 0.50, back_neck: 0.05, whole_head: 0.20 }
    evidence:
      tier: C
      basis: judgment
      sources: [ebell-afm-2019, byt-qd-5643-2015]
      note: "Đau vùng hàm hoặc trán 0,49, đau một bên hàm 0,30 (Ebell). Lệch về vùng trán, mặt nhưng giữ vừa phải vì câu 'đau, nặng vùng trán, má' đã hỏi cùng ý (tránh đếm trùng; lượt B)."
  - finding: headache_course
    dist: { first_time: 0.40, recurrent_similar: 0.50, progressive: 0.10 }
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-5643-2015]
      locator: "5643, bài Viêm mũi xoang cấp tính, mục 1"
      note: "Có thể bị nhiều đợt (viêm mũi xoang cấp tái phát từ 4 đợt mỗi năm); hiếm khi nặng dần nhiều tuần. Ước lượng của lượt A."
warning_signs:
  - periorbital_swelling
  - vision_loss_or_double
  - neck_stiffness
  - confusion
  - drowsy_hard_to_wake
  - seizure_recent
self_care_vi:
  - "Rửa mũi bằng nước muối sinh lý nhiều lần trong ngày."
  - "Nghỉ ngơi, uống đủ nước, tránh khói thuốc lá và bụi."
  - "Hỏi bác sĩ hoặc dược sĩ trước khi dùng thuốc xịt, thuốc nhỏ mũi."
  - "Không tự dùng kháng sinh khi chưa được bác sĩ khám."
see_doctor_vi:
  - "Đi khám trong vài ngày nếu triệu chứng quá 10 ngày không đỡ, hoặc đã đỡ rồi lại nặng lên."
  - "Đi khám sớm nếu sốt quá 3–4 ngày, hoặc đau đầu, đau mặt dữ dội."
  - "Trẻ em có biểu hiện viêm xoang nên được bác sĩ khám."
  - "Đi cấp cứu ngay nếu sưng đỏ quanh mắt, nhìn mờ, nhìn đôi, đau đầu dữ dội hoặc cứng gáy."
sources: [byt-qd-5643-2015, nhs-sinusitis, cdc-sinus-infection]
review:
  status: source_checked
  authors: ["agent:pass-a", "agent:pass-b"]
  reconciler: "agent:pass-c"
  doctor_reviewer: null
  updated: "2026-10-24"
  notes_vi: "Cần bác sĩ xem: (1) mức xử trí 4 (hai lượt cùng chọn): bệnh được định nghĩa theo 5643 là viêm mũi xoang nghĩ do vi khuẩn (quá 10 ngày hoặc xấu đi sau 5–7 ngày); viêm mũi do vi rút trong 10 ngày đầu thuộc cảm lạnh (mức 5); NHS cho tự chăm sóc tới 3 tuần, 5643 cho biết khoảng 70% tự khỏi; (2) tần suất lấy từ người nghi viêm xoang, phần lớn ở phòng khám chuyên khoa châu Âu, Mỹ; (3) độ đặc hiệu của 'bệnh nặng lên lần hai' thấp (0,41); (4) prior là ước lượng; (5) có thể đếm trùng giữa đau vùng trán, má và vị trí đau đầu (đã giảm phân bố vị trí); (6) không liên kết sưng nề quanh mắt (đã có quy tắc mức 2); (7) mã ICD-10 chưa đối chiếu được; MONDO không có mục riêng cho viêm xoang cấp ở người."
