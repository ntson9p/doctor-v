  status: source_checked
  authors: ["agent:pass-a", "agent:pass-b"]
  reconciler: "agent:pass-c"
  doctor_reviewer: null
  updated: "2026-10-31"
  notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần b) đối chiếu 23 liên kết, 3 prior và mở lại mọi nguồn được trích (NG9 Recommendations tải trực tiếp). Mức xử trí 3, không thuộc nhóm không được bỏ sót (hai lượt cùng giữ gợi ý): NG9 khuyên đo SpO2 ở mọi trẻ nghi bệnh và dặn cha mẹ dấu hiệu nguy hiểm; NHS khám khẩn khi bú kém, ít tiểu, sốt cao; ngừng thở, thở rên, rút lõm rõ, tím thì chuyển cấp cứu (NG9 1.2.1; đã có quy tắc mức 1–2). Phạm vi tuổi: dưới 2 tháng và 2 tháng–5 tuổi; prior của nhóm 2 tháng–5 tuổi là trung bình cả nhóm vì app chưa có prior theo tháng tuổi. Không dùng hệ số mùa (lượt B đề xuất 1,3 cho mùa đông xuân ở miền Bắc): 3312 chỉ mô tả bằng lời, Do 2016 ghi mùa mưa ở miền Nam, chưa lượng hóa được. Điều cần bác sĩ xem: (1) prior, nhất là prior cho Sốt (P3), là ước lượng; nó đổi kết quả của trẻ dưới 5 tuổi chọn Sốt (biên bản đối chiếu); (2) chưa có số liệu Việt Nam về tỷ lệ viêm tiểu phế quản ở trẻ đi khám ban đầu; (3) tần suất khò khè, rút lõm, bú kém ở cộng đồng là ước lượng; (4) 3312/QĐ-BYT dùng chữ 'thở rít' cho tiếng thở của bệnh này, khác thở rít khi hít vào trong danh mục; (5) danh mục chưa có câu sinh non (yếu tố nguy cơ bệnh nặng); (6) mã J21.9 chưa đối chiếu được."
