      reported: "Cơn thoáng qua trước 59/275 đột quỵ tuần hoàn sau (khoảng 21%), phần lớn là triệu chứng thân não đơn độc, nhiều nhất trong 2 ngày trước (Paul 2013); 28% từng bị cơn thoáng qua hoặc đột quỵ (Kerber 2006)"
      note: "Hai lượt cùng chọn occasional. Chỉ một phần cơn báo trước khớp với câu hỏi (yếu, tê nửa người, nói khó, nhìn đôi rồi tự hết); người có triệu chứng dao động cũng có thể trả lời 'Có'. Đã có quy tắc rf_transient_neuro (mức 2)."
