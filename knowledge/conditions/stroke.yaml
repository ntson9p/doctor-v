  - "Gọi 115 ngay và ghi nhớ giờ bắt đầu có triệu chứng."
  - "Không tự lái xe đến viện."
  - "Không tự dùng thuốc khi chưa có ý kiến bác sĩ."
see_doctor_vi:
  - "Cần đến bệnh viện có khả năng điều trị đột quỵ càng sớm càng tốt."
  - "Vẫn gọi 115 nếu các dấu hiệu đã tự hết sau vài phút."
review:
  status: source_checked
  authors: ["agent:pass-a", "agent:pass-b"]
  reconciler: "agent:pass-c"
  doctor_reviewer: null
  updated: "2026-10-25"
  notes_vi: "Lượt C đã đối chiếu 21 liên kết và mở lại mọi nguồn được trích, kể cả 3312/QĐ-BYT (2024) trên luatvietnam.vn. Bác sĩ cần xem: (1) prior là ước lượng, chưa có số liệu Việt Nam; từ 75 tuổi chọn P3; (2) tỷ lệ có dấu hiệu FAST và mất thăng bằng ở nhóm biểu hiện bằng đau đầu chưa có số liệu trực tiếp (dùng số của nhồi máu não chung); (3) phần lớn tần suất khác dựa trên mô tả bằng lời của 3312/QĐ-BYT và LR của Runchey 2010; (4) chưa có tỷ lệ yếu tố nguy cơ trong người đột quỵ Việt Nam; (5) mã I64 dùng chung cho đột quỵ không xác định thể vì bệnh gộp cả nhồi máu và xuất huyết não. Giai đoạn 3 lô 1 (lượt C, 25/10/2026): thêm prior cho Chóng mặt (P5; dưới 18 tuổi P6; 45–64 tuổi P4; từ 65 tuổi P3), mức riêng occasional cho dấu hiệu đột quỵ ở màn sàng lọc khi triệu chứng chính là Chóng mặt, và 6 liên kết (đau đầu, cảm giác quay, kiểu chóng mặt, chóng mặt tư thế, không tự đi được, cơn thần kinh thoáng qua); mọi giá trị cũ giữ nguyên, mọi nguồn mới đã mở lại. Bác sĩ cần xem thêm: (6) prior cho Chóng mặt suy từ số liệu cấp cứu ở Mỹ; (7) mức occasional cho méo miệng, yếu tay, nói khó ở người chọn Chóng mặt suy từ Tarnutzer 2011 và Paul 2013, chưa có số liệu ở tuyến ban đầu."
