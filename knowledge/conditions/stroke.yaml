      basis: judgment
      sources: [tarnutzer-cmaj-2011, grace3-dizziness-2023, byt-qd-3312-2024, paul-lancetneurol-2013]
      locator: "GRACE-3 định nghĩa hội chứng tiền đình cấp; Tarnutzer 2011 bảng 3; Paul 2013 phần Kết quả"
      note: "Trung bình hai lượt (lệch 0,05). Đột quỵ biểu hiện bằng chóng mặt thường là hội chứng tiền đình cấp (chóng mặt liên tục, khởi phát cấp); khoảng 25% ± 15% hội chứng tiền đình cấp ở cấp cứu là đột quỵ (Tarnutzer 2011); một phần có triệu chứng dao động hoặc có cơn báo trước (Paul 2013). Ước lượng."
  - finding: dizziness_positional
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [tarnutzer-cmaj-2011, grace3-dizziness-2023]
      locator: "Tarnutzer 2011 bảng 3 (yếu tố làm tăng chóng mặt)"
      note: "Hai lượt cùng chọn occasional. Tần suất trong số người đã chóng mặt. Chóng mặt do đột quỵ là chóng mặt tự phát, có thể tăng khi cử động đầu như viêm dây thần kinh tiền đình (Tarnutzer 2011), nên một phần người bệnh trả lời 'Có'. Ước 20%, thấp hơn hẳn chóng mặt tư thế kịch phát lành tính."
