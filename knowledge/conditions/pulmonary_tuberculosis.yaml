  notes_vi: "Lượt C (Giai đoạn 3 lô 3) mở lại các nguồn mới: điều tra lao quốc gia (Nguyen 2020, toàn văn, bảng 3–4), Cochrane 2022 (toàn văn), Wang 2008, Miller 2000, Duong 2025 (tóm tắt), NHS, MSD; 162/QĐ-BYT đã được lượt R xác minh. Cần bác sĩ xem: (1) urgency 4 như gợi ý (NHS: ho trên 3 tuần, nghi lao thì khám không khẩn; 162/QĐ-BYT: người nghi lao cần được xét nghiệm); ho ra máu, khó thở nặng, dấu hiệu lao màng não, sốt kéo dài do quy tắc xử lý; (2) prior Sốt (đã phát hành) P5 ở người lớn, P4 từ 65 tuổi, P6 ở trẻ em; đổi kết quả Sốt đã ghi trong biên bản đối chiếu; (3) prior Ho P3 từ 45 tuổi dựa trên tỷ lệ hiện mắc quốc gia, chưa có tỷ lệ lao trong người đi khám vì ho; (4) tần suất triệu chứng toàn thân (sốt, mồ hôi đêm, sụt cân) có số ở ca phát hiện qua điều tra (thấp hơn người tự đi khám) và ở bệnh viện; lượt C chọn occasional, có thể đang thấp; (5) hệ số giới 1,5 và 0,5 (thấp hơn tỷ số 4) để bớt đếm trùng với câu hút thuốc; không đặt hệ số vùng (khác biệt vùng không có ý nghĩa, p = 0,297); (6) không liên kết ho ra nhiều máu (tỷ lệ trong số người ho ra máu khoảng bằng tỷ lệ nền 15%); (7) mã ICD-10 A15 chưa đối chiếu (A15.0 nếu có xác nhận vi khuẩn bằng soi đờm)."
