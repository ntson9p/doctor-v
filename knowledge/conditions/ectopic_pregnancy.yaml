  status: source_checked
  authors: ["agent:pass-a", "agent:pass-b"]
  reconciler: "agent:pass-c"
  doctor_reviewer: null
  updated: "2026-10-25"
  notes_vi: "Lượt C đã đối chiếu 13 liên kết và mở lại mọi nguồn được trích. Bác sĩ cần xem: (1) prior P4 chỉ là ước lượng từ tỷ lệ có thai và tỷ lệ thai ngoài tử cung, chưa có số liệu Việt Nam về người đau bụng đi khám; (2) 'có thai' để very_frequent và 'chậm kinh' để frequent cố ý, để người chưa biết mình có thai vẫn được xét; (3) số liệu triệu chứng lấy từ bệnh viện tuyến cuối Ấn Độ, nơi phần lớn đã vỡ; (4) danh mục chưa có các yếu tố nguy cơ chính (từng bị thai ngoài tử cung, từng mổ vòi trứng, đang đặt vòng tránh thai) và câu hỏi đau vai chỉ hỏi bên phải; (5) mã ICD-10 dùng cấp nhóm O00 vì bệnh gồm mọi vị trí làm tổ. Giai đoạn 3 lô 1 (lượt C phần b, 25/10/2026): thêm prior cho Ngất (18–44 tuổi P4, 13–17 tuổi P5, 45–64 tuổi P6) và Chóng mặt (18–44 tuổi P5, 13–17 và 45–64 tuổi P6), tính trong số phụ nữ cùng nhóm tuổi; thêm 9 liên kết (đau bụng, chóng mặt, choáng khi đứng dậy, da xanh, tay chân lạnh, hoàn cảnh ngất, chưa hồi phục sau ngất, mạch, kiểu chóng mặt) và tần suất theo triệu chứng chính cho đau bụng dữ dội (Ngất, Chóng mặt: frequent) và choáng, ngất (Chóng mặt: frequent). Không sửa giá trị cũ. Bác sĩ cần xem thêm: prior dưới Ngất, Chóng mặt chỉ là ước lượng; bệnh ngất phản xạ có liên kết 'có thai' (occasional) để không xếp mọi phụ nữ có thai bị ngất vào chửa ngoài tử cung; các liên kết mới (chóng mặt, choáng khi đứng dậy, da xanh, mạch) cũng có thể được hỏi khi triệu chứng chính là Đau bụng."
