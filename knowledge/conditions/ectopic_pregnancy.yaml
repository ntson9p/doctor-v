self_care_vi:
  - "Nhờ người thân đưa đi khám, không tự lái xe."
  - "Nếu có sẵn que thử thai, có thể thử ngay, nhưng không chờ kết quả mới đi khám."
  - "Mang theo kết quả siêu âm hoặc xét nghiệm, nếu có."
see_doctor_vi:
  - "Đến ngay khoa cấp cứu hoặc khoa sản của bệnh viện gần nhất để được thử thai và siêu âm."
  - "Gọi 115 nếu đau bụng dữ dội đột ngột, choáng ngất, vã mồ hôi lạnh hoặc da tái nhợt."
