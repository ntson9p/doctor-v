warning_signs: [breathing_difficulty, pleuritic_chest_pain, chest_pain_pressure, hemoptysis, fainting_or_near_fainting, leg_swelling_one_side, cold_hands_feet]
self_care_vi:
  - "Gọi 115 hoặc nhờ người đưa đến khoa cấp cứu ngay. Không tự lái xe."
  - "Trong lúc chờ, ngồi hoặc nằm nghỉ, tránh đi lại nhiều."
  - "Mang theo các thuốc đang dùng, nhất là thuốc chống đông."
see_doctor_vi:
  - "Cần được xét nghiệm máu và chụp mạch phổi ở bệnh viện càng sớm càng tốt."
  - "Người vừa mổ, bó bột, nằm lâu hoặc ngồi xe lâu mà sưng đau một bên bắp chân nên đi khám ngay."
review:
  status: source_checked
  authors: ["agent:pass-a", "agent:pass-b"]
  reconciler: "agent:pass-c"
  doctor_reviewer: null
  updated: "2026-10-31"
  notes_vi: "Lượt C (phần b) đối chiếu 20 liên kết và mở lại mọi nguồn được trích. Mức xử trí 1, thuộc nhóm không được bỏ sót, giữ như hai lượt: NHS ghi 'gọi 999 hoặc đến cấp cứu' khi khó thở đột ngột, đau ngực, tim rất nhanh, ngất, kèm lời dặn không tự lái xe mà nhờ người chở hoặc gọi xe cấp cứu (đúng nội dung mức 1 của doctor-v); ESC 2019: bệnh có thể gây tụt huyết áp, ngừng tim, cần chẩn đoán và điều trị ngay; cùng mức với nhiễm khuẩn huyết, nhồi máu cơ tim (NHS Sepsis cũng ghi '999 hoặc cấp cứu'). Theo quy ước của lượt R cho quy tắc ('999 hoặc cấp cứu' là mức 2) có thể xét mức 2; cần bác sĩ quyết. Bác sĩ cần xem: (1) prior lấy từ người ngất ở cấp cứu châu Âu, Bắc Mỹ, hạ cho cộng đồng; chưa có số liệu thuyên tắc huyết khối ở người Việt Nam; (2) phân bố hoàn cảnh ngất, dấu hiệu báo trước, kiểu chóng mặt là ước lượng; (3) số liệu triệu chứng (Miniati) ở bệnh viện; (4) chưa có câu hỏi về thuốc tránh thai, hậu sản cho bệnh này; (5) 3908/QĐ-BYT (2023) về dự phòng thuyên tắc huyết khối tĩnh mạch chưa được mở. Giai đoạn 3 lô 3 (lượt C phần c, 31/10/2026): thêm prior Khó thở (từ 45 tuổi P4, 13–44 tuổi P5, dưới 13 tuổi P6), Đau ngực (từ 45 tuổi P4, 18–44 tuổi P5, dưới 18 tuổi P6) và Ho (từ 45 tuổi P5, dưới 45 tuổi P6); thêm 8 liên kết với dấu hiệu lô 3 (kiểu khởi phát khó thở, mức khó thở, SpO2, thuốc tránh thai hoặc nội tiết nữ, đau ngực đột ngột dữ dội, thời gian cơn đau ngực, khó thở khi nằm thấp, thời gian ho); thêm very_frequent khi Đau ngực cho đau kiểu màng phổi (Miniati: 84% số người đau ngực). Mọi nguồn mới đã mở lại (Frese 2011, Haasenritter 2015, Verdon 2008; Miniati 2012, ESC 2019 đã xác minh ở lượt trước). Không sửa giá trị cũ; không liên kết dấu hiệu chung chest_pain và ho. Đã thêm câu hỏi về thuốc tránh thai (điểm 4 ở trên). Bác sĩ cần xem thêm: prior Đau ngực, Ho ở người trẻ là ước lượng theo xu hướng tuổi của ESC; tỷ lệ dùng thuốc tránh thai ở người bệnh Việt Nam chưa có số liệu."
