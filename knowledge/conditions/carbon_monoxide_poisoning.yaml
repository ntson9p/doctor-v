  updated: "2026-10-25"
  notes_vi: "Lượt C đã đối chiếu 25 liên kết và mở lại mọi nguồn được trích. Mức xử trí: lượt A giữ mức 1 như gợi ý, lượt B chọn mức 2; lượt C chọn mức 2 (vẫn 'không được bỏ sót'). Lý do: ca điển hình chưa biến chứng là người còn tỉnh, đau đầu, chóng mặt sau phơi nhiễm; NHS khuyên gọi 111 khi có triệu chứng và gọi 999 hoặc đến cấp cứu khi khó thở, đột ngột lú lẫn, mất ý thức, yếu, đau ngực hoặc đau cơ, và ghi người ngộ độc cần được kiểm tra ở bệnh viện; 3610/QĐ-BYT yêu cầu xử trí nhanh, thở oxy càng sớm càng tốt, việc chỉ làm được ở cơ sở y tế; Jüttner 2021 khuyên thở oxy 100% từ trước khi đến viện. Đến cơ sở cấp cứu ngay (mức 2) khớp với quy tắc rf_co_exposure; dấu hiệu nặng đã có quy tắc mức 1 (lú lẫn, li bì, đau ngực khi chóng mặt, ngất kèm khó thở). Với mức 1 và ngưỡng 1%, mọi người chóng mặt có phơi nhiễm sẽ bị khuyên gọi 115. Mã T58 và tên chính thức chưa đối chiếu được với bảng ICD-10 của Bộ Y tế. Bác sĩ cần xem: (1) prior P5 và hệ số mùa đông 2 là ước lượng (số liệu theo tháng của Mỹ, chưa có số liệu Việt Nam); (2) tần suất triệu chứng lấy từ hồ sơ hoặc khoa cấp cứu ở Mỹ, Ý, Trung Quốc; (3) câu co_exposure có nhắc bình nóng lạnh chạy gas và đám cháy trong phần gợi ý, nhưng người bệnh có thể không nhận ra nguồn khí; (4) mức 1 hay 2 cho ca điển hình."
