  updated: "2026-10-31"
  notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần b) đối chiếu 24 liên kết, 2 prior và mở lại mọi nguồn được trích (toàn văn hai nghiên cứu Việt Nam, tóm tắt Wang 2005, Mant 2009, ADHERE-AP). Bệnh là đợt suy tim mới xuất hiện hoặc nặng lên (suy tim cấp theo 1857/QĐ-BYT Phần III), không phải suy tim mạn ổn định. Mức xử trí 3, không thuộc nhóm không được bỏ sót (hai lượt cùng giữ gợi ý): NHS xếp khó thở khi nằm, khi sinh hoạt hằng ngày, ho đờm hồng có bọt, tăng cân đột ngột vào khám khẩn; gọi 999 khi khó thở dữ dội, tím, ngất; MSD: điều trị nội trú ngay khi phù phổi, triệu chứng nặng, suy tim mới mắc. Ca nặng (khó thở lúc nghỉ, không nói trọn câu, tức ngực, ngất) đã có quy tắc mức 1–2. Không khai báo phạm vi tuổi: suy tim ở trẻ em hiếm nhưng có thể gặp (tim bẩm sinh), nên dùng prior thấp. Lượt C không giữ bốn liên kết chỉ lượt A có: sốt rare (nhiễm trùng là yếu tố thúc đẩy theo 1857, nên câu 'có sốt' không nên hạ suy tim; theo lượt B), ho occasional (bằng tỷ lệ nền 0,2, không mang thông tin), choáng, ngất rare (NHS liệt kê choáng là triệu chứng suy tim, nên mức thấp hơn nền trái nguồn), sưng một bên bắp chân rare (bằng tỷ lệ nền 0,03, không mang thông tin). Hai id nguồn nguyen-bmccardiovascdisord-2025 (lượt A) và nguyenht-bmccvd-2025 (lượt B) là cùng một bài; giữ id thứ hai. Điều cần bác sĩ xem: (1) prior suy từ tuyến ban đầu Hà Lan, Đức (mọi lứa tuổi), chưa có số liệu theo tuổi và số liệu Việt Nam ở tuyến ban đầu; (2) yếu tố nguy cơ lấy từ người nằm viện ở Việt Nam, người dùng cộng đồng có thể ít bệnh nền hơn; (3) tần suất khó thở khi nằm, ho về đêm ở đợt nặng lên ước từ số liệu chẩn đoán suy tim nói chung (Mant, Wang); (4) danh mục chưa có 'ho ra đờm hồng có bọt' và 'tím tái ở người lớn'; (5) mã I50.9 chưa đối chiếu được."
