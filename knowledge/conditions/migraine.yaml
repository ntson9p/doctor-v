  notes_vi: "Lượt C đã đối chiếu 16 liên kết và mở lại mọi nguồn được trích; thêm liên kết đau đầu sét đánh very_rare theo ghi chú lô 4 (tổng 15 liên kết sau khi bỏ 2). Bỏ hai liên kết chỉ có ở lượt A, đều để rare (cao hơn tỷ lệ nền 1% nên bộ kiểm tra cảnh báo): 'cứng gáy' (ICHD-3 ghi cứng cổ là triệu chứng báo trước của cơn, nên mức thấp hơn nền cũng không đúng) và 'đột ngột mất thị lực hoặc nhìn đôi' (tiền triệu có thể để lại ám điểm); hai dấu hiệu này đã có quy tắc mức 2. Bác sĩ cần xem: (1) hệ số theo giới 1,2/0,85 áp dụng cho mọi lứa tuổi; (2) đặc điểm cơn đau lấy từ nghiên cứu ở Đan Mạch, Thổ Nhĩ Kỳ, Mỹ, Ấn Độ, chưa có số liệu người Việt; (3) tần suất buồn nôn, sợ ánh sáng trong một cơn suy từ tỷ lệ 'từng có' và LR; (4) tiền triệu có thể bị mô tả như tê một bên, giống đột quỵ; quy tắc an toàn đảm nhận. Giai đoạn 3 lô 1 (lượt C, 25/10/2026): thêm prior cho Chóng mặt (đại diện cho đau nửa đầu tiền đình: P2; 45–64 tuổi P3; từ 65 tuổi P4), mức riêng frequent cho sợ ánh sáng, sợ tiếng ồn khi triệu chứng chính là Chóng mặt, và 7 liên kết (đau đầu, cảm giác quay, chóng mặt tư thế, kiểu chóng mặt, đã từng có cơn giống hệt, ù tai hoặc nghe kém, cơn thần kinh thoáng qua); mọi giá trị cũ giữ nguyên, mọi nguồn mới đã mở lại. Bác sĩ cần xem thêm: (5) prior cho Chóng mặt là ước lượng, bệnh ít được nhận ra ở tuyến ban đầu; (6) buồn nôn (very_frequent) vẫn dùng mức của cơn đau đầu khi triệu chứng chính là Chóng mặt."
