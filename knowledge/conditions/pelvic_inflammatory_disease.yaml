id: pelvic_inflammatory_disease
names:
  vi: "Bệnh viêm tiểu khung ở nữ giới"
  vi_common: ["Viêm vùng chậu (viêm phần phụ)", "Viêm phần phụ", "Viêm tiểu khung", "Viêm vòi trứng"]
  en: "Pelvic inflammatory disease"
codes:
  icd10: "N73.9"
  icd10_verified: true
  mondo: "MONDO:0000922"
summary_vi:
  - "Nhiễm khuẩn ở tử cung, vòi trứng hoặc buồng trứng, thường lây qua quan hệ tình dục hoặc sau thủ thuật phụ khoa."
  - "Hay gặp đau bụng dưới hai bên, khí hư bất thường, có thể kèm sốt."
  - "Cần điều trị sớm để tránh áp xe, vô sinh và thai ngoài tử cung về sau."
urgency: 3
cant_miss: false
specialties: [obstetrics_gynecology]
applicability:
  sex: [female]
  reason_vi: "Bệnh của cơ quan sinh dục nữ."
priors:
  - complaint: abdominal_pain
    default: P3
    by_age: { infant_0_2m: P6, child_2m_5y: P6, child_5_12: P6, teen_13_17: P4, adult_45_64: P4, elder_65_74: P6, elder_75p: P6 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015, msd-pid, cdc-sti-pid]
      locator: "315/QĐ-BYT, bài Viêm phần phụ, mục 1 và 2.1; MSD: Etiology, Risk factors"
      note: "Prior tính trong số nữ cùng nhóm tuổi bị đau bụng (applicability chỉ giới hạn giới). 315/QĐ-BYT coi viêm nhiễm đường sinh dục là bệnh phổ biến ở phụ nữ, hay gặp sau đẻ, sau sẩy hoặc phá thai, sau nạo hút, đặt hoặc tháo vòng; MSD: hay gặp ở phụ nữ trẻ, nguy cơ cao hơn dưới 25 tuổi, hiếm trước kỳ kinh đầu và sau mãn kinh; CDC: nhiều đợt bệnh không được nhận ra. Hai lượt cùng ước khoảng 2% phụ nữ 18–44 tuổi đau bụng (P3), thấp hơn ở 13–17 tuổi và 45–64 tuổi (P4), rất hiếm từ 65 tuổi (P6). Lượt C chọn cách của lượt A cho trẻ em (P6 thay vì loại trừ cứng), vì kb-guide chỉ cho loại trừ khi bất khả về sinh học. Chưa có số liệu Việt Nam theo triệu chứng chính; cần bác sĩ duyệt."
  - complaint: fever
    default: P4
    by_age: { infant_0_2m: P6, child_2m_5y: P6, child_5_12: P6, teen_13_17: P5, adult_45_64: P5, elder_65_74: P6, elder_75p: P6 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015, msd-pid]
      locator: "315/QĐ-BYT, mục 2.1.1 (sốt tới 39°C) và 2.2.1 (sốt nhẹ 37,5–38°C)"
      note: "Phần lớn người viêm vùng chậu chọn đau bụng là triệu chứng chính; một số chọn sốt (sốt hay gặp theo MSD, có thể tới 39°C theo 315/QĐ-BYT). Hai lượt cùng ước P4 cho nữ 18–44 tuổi bị sốt. Ước tính thô của lượt C nằm ở ranh giới P4/P5 (sốt ở phụ nữ trẻ chủ yếu do nhiễm trùng hô hấp, sốt xuất huyết, nhiễm khuẩn tiết niệu); giữ P4 vì hai lượt thống nhất. Khi triệu chứng chính là sốt, liên kết đau bụng (almost_always) làm khả năng bệnh giảm mạnh nếu không đau bụng."
findings:
  - finding: abdominal_pain
    freq: almost_always
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-315-2015, cdc-sti-pid]
      locator: "315/QĐ-BYT, mục 2.1.1; CDC: Diagnostic Considerations (tiêu chuẩn tối thiểu)"
      note: "Chỉ lượt A có; lượt C giữ vì cần cho triệu chứng chính sốt. Đau bụng dưới là triệu chứng nổi bật (315/QĐ-BYT) và là điều kiện của tiêu chuẩn tối thiểu (CDC). Không có tác dụng khi triệu chứng chính là đau bụng (đã được ngầm định)."
  - finding: abd_pain_location
    dist: { epigastric: 0.02, right_upper: 0.04, left_upper: 0.02, periumbilical: 0.04, right_lower: 0.15, left_lower: 0.15, suprapubic: 0.46, whole: 0.12 }
    evidence:
      tier: B
      basis: numeric
      sources: [byt-qd-315-2015, msd-pid, nhs-pid]
      locator: "315/QĐ-BYT, Viêm phần phụ, mục 2.1.1 và 2.2.2 (hội chứng Fitz-Hugh-Curtis)"
      reported: "Đau vùng bụng dưới, thường đau cả hai bên (90%)."
      population: "Viêm phần phụ cấp (315/QĐ-BYT)"
      note: "Đau hai bên bụng dưới thường được chọn là 'bụng dưới, ở giữa'; một phần đau trội một bên; viêm quanh gan gây đau hạ sườn phải (MSD; 315/QĐ-BYT). Lượt C lấy trung bình hai lượt (lệch 0,13) và để hai bên hố chậu bằng nhau vì nguồn không nêu bên nào trội."
  - finding: abd_pain_worse_movement
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-315-2015]
      locator: "315/QĐ-BYT, Viêm phần phụ, mục 2.1.1 (đau tăng khi đi lại) và 2.3.2 (đi lại nhiều, làm việc nặng đau tăng)"
      note: "Văn bản nêu đây là đặc điểm nổi bật của đau nhưng không cho tỷ lệ; hai lượt cùng chọn frequent."
  - finding: abd_pain_duration
    dist: { lt_6h: 0.05, h6_24: 0.12, d1_3: 0.34, d4_14: 0.34, gt_2w: 0.15 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015, cdc-sti-pid]
      locator: "315/QĐ-BYT, Viêm phần phụ, mục 2.1–2.3 (thể cấp, bán cấp chiếm 30%, mạn tính)"
      note: "Có thể cấp, bán cấp (đau âm ỉ) hoặc mạn tính; CDC: triệu chứng thường kín đáo nên hay đi khám muộn. Phân bố là ước lượng (trung bình hai lượt): thường đã đau vài ngày, hiếm khi dưới 6 giờ."
  - finding: abd_pain_severe
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [msd-pid, nhs-pid]
      note: "Chỉ lượt B có; lượt C giữ vì nguồn ủng hộ. Đau dữ dội gặp ở thể nặng hoặc có áp xe vòi – buồng trứng (khoảng 15% người viêm vòi trứng theo MSD); NHS khuyên đi cấp cứu khi đau vùng chậu dữ dội hoặc nặng dần. Ước occasional."
  - finding: fever
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-315-2015, msd-pid, cdc-sti-pid]
      locator: "315/QĐ-BYT, mục 2.1.1 (sốt tới 39°C) và 2.2.1 (sốt nhẹ 37,5–38°C); CDC: tiêu chuẩn bổ sung nhiệt độ miệng trên 38,3°C"
      note: "MSD xếp sốt vào triệu chứng thường gặp; CDC dùng sốt làm tiêu chuẩn bổ sung chứ không phải tối thiểu vì nhiều người không sốt. Hai lượt cùng chọn frequent."
  - finding: abnormal_vaginal_discharge
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [byt-qd-315-2015, msd-pid, nhs-pid]
      locator: "315/QĐ-BYT, Viêm phần phụ, mục 2.1.1 (đặt mỏ vịt)"
      reported: "Nhiều khí hư, có khi là mủ: 39–65% các trường hợp."
      population: "Viêm phần phụ cấp (315/QĐ-BYT)"
      note: "Tỷ lệ nền của câu hỏi là 15% (viêm âm đạo hay gặp), nên khí hư chỉ làm tăng vừa phải khả năng bệnh."
  - finding: vaginal_bleeding
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [byt-qd-315-2015, nhs-pid, cdc-sti-pid]
      locator: "315/QĐ-BYT, mục 2.1.1 (rối loạn kinh nguyệt 50%) và 2.2.1 (rong kinh)"
      reported: "Rối loạn kinh nguyệt khoảng 50% (gồm cả rong kinh, kinh nhiều)."
      note: "Câu hỏi chỉ hỏi ra máu ngoài kỳ kinh (NHS: ra máu giữa kỳ kinh hoặc sau quan hệ; CDC: ra máu bất thường là triệu chứng kín đáo), nên chọn mức thấp hơn 50%."
  - finding: dysuria
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [byt-qd-315-2015, msd-pid]
      locator: "315/QĐ-BYT, Viêm phần phụ, mục 2.1.1"
      reported: "Dấu hiệu kích thích vùng tiểu khung như mót rặn, đi nặng, tiểu khó, tiểu không hết: 15–25%."
      population: "Viêm phần phụ cấp (315/QĐ-BYT)"
  - finding: pain_with_intercourse
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [msd-pid, nhs-pid, cdc-sti-pid]
      note: "MSD xếp đau khi giao hợp vào nhóm ít gặp hơn đau bụng, sốt, khí hư; NHS liệt kê đau sâu khi quan hệ; CDC xếp vào nhóm triệu chứng kín đáo."
  - finding: new_sexual_partner
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [msd-pid, byt-qd-315-2015]
      note: "Bạn tình mới trong 12 tháng hoặc từ 2 bạn tình là yếu tố nguy cơ (MSD). Câu hỏi chỉ hỏi 3 tháng qua, là câu nhạy cảm; ở Việt Nam bệnh cũng hay gặp sau đẻ, sẩy, phá thai, thủ thuật đặt hoặc tháo vòng (315/QĐ-BYT). Hai lượt cùng ước occasional."
  - finding: pregnant
    freq: rare
    evidence:
      tier: C
      basis: verbal
      sources: [msd-pid, cdc-sti-pid]
      note: "MSD: bệnh hiếm khi có thai; CDC: phụ nữ có thai nghi viêm vùng chậu cần nhập viện. Mức rare thấp hơn tỷ lệ nền 5% nên trả lời 'có thai' nghiêng về các bệnh thai kỳ như thai ngoài tử cung."
  - finding: abd_pain_migrated_rlq
    freq: rare
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-315-2015]
      locator: "315/QĐ-BYT, Viêm phần phụ, mục 3 (phân biệt với viêm ruột thừa: đau cả hai bên, điểm đau thấp hơn)"
      note: "Chỉ lượt B có; lượt C giữ vì giúp phân biệt với viêm ruột thừa. Đau di chuyển từ quanh rốn xuống hố chậu phải là kiểu đau của viêm ruột thừa; viêm vùng chậu thường đau bụng dưới hai bên ngay từ đầu. Mức rare thấp hơn tỷ lệ nền 10% của câu hỏi."
warning_signs: [abd_pain_severe, persistent_vomiting, abdomen_hard_swollen, severe_weakness, cold_hands_feet]
self_care_vi:
  - "Nghỉ ngơi, uống đủ nước trong khi chờ đi khám."
  - "Không quan hệ tình dục cho đến khi điều trị xong và hết triệu chứng."
  - "Hỏi bác sĩ hoặc dược sĩ trước khi dùng thuốc."
see_doctor_vi:
  - "Đi khám phụ khoa trong vòng 24 giờ để được khám và điều trị sớm."
  - "Bạn tình cũng cần được khám và điều trị."
  - "Đến cơ sở cấp cứu ngay nếu đau bụng dữ dội, sốt cao, nôn nhiều hoặc đang có thai."
review:
  status: source_checked
  authors: ["agent:pass-a", "agent:pass-b"]
  reconciler: "agent:pass-c"
  doctor_reviewer: null
  updated: "2026-10-24"
  notes_vi: "Lượt C đã đối chiếu 13 liên kết và mở lại mọi nguồn được trích. Bác sĩ cần xem: (1) prior là ước lượng, chưa có số liệu Việt Nam; prior khi sốt (P4) nằm ở ranh giới P4/P5; (2) tần suất sốt và đau dữ dội ở người bệnh ngoại trú dao động lớn giữa các nguồn (315/QĐ-BYT mô tả thể cấp có sốt, CDC nhấn mạnh thể kín đáo); (3) không liên kết buồn nôn, nôn dù 315/QĐ-BYT và MSD ghi 'có thể', vì tỷ lệ nền ở người đau bụng đã cao; (4) applicability chỉ giới hạn giới nữ, trẻ em dùng prior P6; (5) tên chính thức theo ICD-10 N73.9 khác tên bài của 315/QĐ-BYT ('Viêm phần phụ')."
