id: bowel_obstruction
names:
  vi: "Tắc ruột"
  vi_common: ["Bán tắc ruột", "Tắc ruột do dính"]
  en: "Bowel obstruction"
codes:
  icd10: "K56.7"
  icd10_verified: true
  mondo: "MONDO:0004565"
summary_vi:
  - "Ruột bị tắc, làm thức ăn, hơi và phân không đi xuống được."
  - "Thường đau quặn bụng từng cơn, nôn (ói), bụng chướng, không đi ngoài và không xì hơi được."
  - "Nguyên nhân hay gặp là dính ruột sau mổ, thoát vị hoặc khối u; đây là cấp cứu ngoại khoa."
urgency: 2
cant_miss: true
specialties: [general_surgery, emergency]
priors:
  - complaint: abdominal_pain
    default: P4
    by_age: { infant_0_2m: P5, child_2m_5y: P5, child_5_12: P5, teen_13_17: P5, elder_65_74: P3, elder_75p: P3 }
    evidence:
      tier: B
      basis: judgment
      sources: [taylor-aem-2013, bohner-ejs-1998, cervellin-atm-2016, ramireddy-cgr-2017]
      reported: "Tắc ruột non khoảng 2% người lớn đau bụng ở cấp cứu (Taylor); tắc ruột 3,8% người đau bụng cấp ở 6 bệnh viện Đức (Böhner); ở cấp cứu Ý: 0,3% dưới 65 tuổi, 2,3% từ 65 tuổi (Cervellin)"
      population: "Người lớn đau bụng ở bệnh viện, cấp cứu; chưa có số liệu Việt Nam"
      note: "Hai lượt giống nhau. Ở cộng đồng thấp hơn ở cấp cứu: P4 (0,2–1%) cho người lớn dưới 65 tuổi; P3 từ 65 tuổi vì tuổi trên 50 là một trong các dấu hiệu nhạy nhất (Böhner), tỷ lệ ở cấp cứu tăng khoảng 8 lần (Cervellin) và người già có thêm nguyên nhân u đại tràng, thoát vị. Trẻ em P5 (lồng ruột được tính riêng); 3312/QĐ-BYT nêu búi giun đũa có thể gây tắc ruột ở trẻ."
findings:
  - finding: abd_pain_location
    dist: { epigastric: 0.10, right_upper: 0.035, left_upper: 0.035, periumbilical: 0.30, right_lower: 0.06, left_lower: 0.055, suprapubic: 0.04, whole: 0.375 }
    evidence:
      tier: C
      basis: judgment
      sources: [msd-intestinal-obstruction, wses-asbo-2018, cartwright-afp-2008]
      locator: "MSD: tắc ruột non đau quặn quanh rốn hoặc thượng vị"
      note: "Trung bình hai lượt. Đau quặn lan tỏa, quanh rốn hoặc khắp bụng. Phân bố là ước lượng."
  - finding: abd_pain_colicky
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [bohner-ejs-1998, cartwright-afp-2008, wses-asbo-2018, eskelinen-sjg-1994, jackson-afp-2011]
      locator: "Cartwright 2008 Bảng 2 (theo Böhner 1998); WSES 2018 mục Diagnosis; Eskelinen 1994"
      reported: "Đau quặn: LR+ 2,8, LR− 0,8 (Böhner); đau quặn từng cơn so với liên tục: RR 2,4 (Eskelinen)"
      note: "Lượt C: hai lượt lệch một mức (A frequent theo số liệu, B very_frequent theo mô tả 'kinh điển' của WSES, AAFP). Chọn frequent: cặp LR của Böhner cho độ nhạy chỉ khoảng 0,3, và LR+ 2,8 gần bằng tỷ số giữa mức frequent (0,5) và tỷ lệ nền 0,2 của câu hỏi; mức very_frequent làm câu trả lời 'Không' hạ bệnh không được bỏ sót này khoảng 4 lần."
  - finding: no_stool_or_gas
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [bohner-ejs-1998, cartwright-afp-2008, taylor-aem-2013, wses-asbo-2018, ramireddy-cgr-2017]
      locator: "Cartwright 2008 Bảng 2; WSES 2018 mục Diagnosis (có hoặc không có bí trung đại tiện)"
      reported: "Táo bón: LR+ 8,8, LR− 0,6 (độ nhạy suy ra khoảng 0,43)"
      note: "Tắc không hoàn toàn hoặc mới bị vẫn có thể xì hơi; câu hỏi đòi cả không đi ngoài và không xì hơi. Hai lượt giống nhau."
  - finding: abdomen_hard_swollen
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [bohner-ejs-1998, cartwright-afp-2008, eskelinen-sjg-1994, wses-asbo-2018]
      reported: "Chướng bụng: LR+ 5,7, LR− 0,4 (độ nhạy suy ra khoảng 0,64) (Böhner); RR 13,1 (Eskelinen)"
      note: "Câu hỏi gộp bụng cứng và chướng căng; tắc cao ít chướng hơn tắc thấp. Hai lượt giống nhau."
  - finding: previous_abdominal_surgery
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [bohner-ejs-1998, cartwright-afp-2008, eskelinen-sjg-1994, wses-asbo-2018, jackson-afp-2011]
      reported: "Từng mổ bụng: LR+ 2,7, LR− 0,4 (độ nhạy suy ra khoảng 0,7) (Böhner); RR 12,1 (Eskelinen); dính sau mổ gây khoảng 60% tắc ruột non (WSES, AAFP)"
      note: "Tắc đại tràng (u, xoắn) và tắc do thoát vị ít liên quan mổ cũ; ở Việt Nam có thể nhiều thoát vị, u hơn. Với tỷ lệ nền mới 0,15, mức frequent cho LR+ khoảng 3,3, LR− khoảng 0,6, phù hợp Böhner. Hai lượt giống nhau."
  - finding: vomiting
    freq: very_frequent
    evidence:
      tier: B
      basis: verbal
      sources: [ramireddy-cgr-2017, jackson-afp-2011, wses-asbo-2018, msd-intestinal-obstruction]
      locator: "Rami Reddy 2017 (bộ bốn kinh điển); AAFP 2011 (dấu hiệu chính); MSD (tắc ruột non nôn sớm, tắc đại tràng nôn muộn)"
      note: "Hai lượt giống nhau."
  - finding: nausea
    freq: very_frequent
    evidence:
      tier: B
      basis: verbal
      sources: [wses-asbo-2018, jackson-afp-2011]
      locator: "WSES 2018: đau quặn từng cơn, chướng bụng, buồn nôn có hoặc không có nôn"
      note: "Hai lượt giống nhau."
  - finding: persistent_vomiting
    freq: frequent
    evidence:
      tier: C
      basis: judgment
      sources: [msd-intestinal-obstruction, wses-asbo-2018]
      note: "Tắc ruột non thường nôn nhiều lần, uống gì cũng nôn; WSES nhấn mạnh tình trạng mất nước. Ước khoảng một nửa. Hai lượt giống nhau."
  - finding: vomiting_bilious
    freq: frequent
    evidence:
      tier: B
      basis: judgment
      sources: [bines-bwho-2006, reust-afp-2016, nhs-stomach-ache, nhs-diarrhoea-vomiting]
      locator: "Bines 2006, tiêu chuẩn chính 1 (nôn dịch mật là bằng chứng tắc ruột); Reust 2016 (nôn dịch mật gợi ý tắc ruột); NHS: nôn dịch xanh thì đến cấp cứu"
      note: "Tần suất trong số người có nôn. Nguồn không cho tần suất ở người lớn; ước khoảng một nửa (tắc cao nôn dịch mật, tắc thấp có thể nôn chất như phân). Hai lượt giống nhau."
  - finding: hernia_lump_painful
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [ramireddy-cgr-2017, jackson-afp-2011, wses-asbo-2018]
      locator: "Rami Reddy 2017 (tóm tắt); AAFP 2011 Bảng 1; WSES 2018 mục Diagnosis (khám tìm thoát vị thành bụng, vùng bẹn)"
      reported: "Thoát vị gây khoảng 10% tắc ruột"
      note: "Chỉ lượt B có (dấu hiệu mới do lượt B đề xuất). Tỷ lệ nền 1% nên câu trả lời 'Có' làm tăng mạnh khả năng bệnh; quy tắc rf_painful_hernia đã xếp mức 2."
  - finding: abd_pain_onset
    dist: { sudden: 0.325, gradual: 0.675 }
    evidence:
      tier: C
      basis: verbal
      sources: [msd-intestinal-obstruction, jackson-afp-2011]
      note: "Trung bình hai lượt. Phần lớn đau quặn tăng dần; tắc do dính, xoắn có thể khởi phát nhanh; tắc đại tràng do u thường từ từ (MSD). Tỷ lệ là ước lượng."
  - finding: abd_pain_duration
    dist: { lt_6h: 0.135, h6_24: 0.34, d1_3: 0.38, d4_14: 0.12, gt_2w: 0.025 }
    evidence:
      tier: C
      basis: judgment
      sources: [bohner-ejs-1998, msd-intestinal-obstruction]
      note: "Trung bình hai lượt. Tắc ruột non diễn tiến trong vài giờ đến 1–2 ngày; tắc đại tràng chậm hơn. Phân bố là ước lượng."
  - finding: abd_pain_severe
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [wses-asbo-2018, msd-intestinal-obstruction]
      locator: "WSES 2018: ở người già đau thường ít rõ; MSD: đau dữ dội, liên tục gợi ý thắt nghẹt (gần 25% tắc ruột non)"
      note: "Lượt C: hai lượt lệch một mức (A frequent, B occasional). Chọn occasional: 'không chịu nổi' là ngưỡng cao, người già đau ít; khi trả lời 'Có', quy tắc rf_severe_abdominal_pain đã xếp mức 2, nên mức thấp hơn chỉ làm câu trả lời 'Không' ít hạ bệnh này hơn (thận trọng hơn)."
  - finding: abd_pain_worse_movement
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [msd-intestinal-obstruction, ramireddy-cgr-2017]
      note: "Dấu hiệu kích thích phúc mạc gợi ý tắc ruột đã có thắt nghẹt, hoại tử; ước 20%. Hai lượt giống nhau."
  - finding: loss_of_appetite
    freq: frequent
    evidence:
      tier: C
      basis: judgment
      sources: [msd-intestinal-obstruction]
      note: "Chỉ lượt A có. Người bệnh thường bỏ ăn vì đau và nôn; ước khoảng một nửa."
  - finding: diarrhea
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [wses-asbo-2018, msd-intestinal-obstruction]
      locator: "WSES 2018 mục Diagnosis (tắc không hoàn toàn có thể tiêu chảy phân nước, dễ nhầm với viêm dạ dày – ruột); MSD"
      note: "Liên kết để tiêu chảy không loại trừ quá mạnh tắc ruột. Hai lượt giống nhau."
warning_signs:
  - abd_pain_severe
  - abdomen_hard_swollen
  - no_stool_or_gas
  - persistent_vomiting
  - vomiting_bilious
  - hernia_lump_painful
  - fainting_or_near_fainting
  - cold_hands_feet
self_care_vi:
  - "Không ăn uống gì trong khi chờ đến cơ sở cấp cứu."
  - "Không tự dùng thuốc hoặc thụt tháo tại nhà."
see_doctor_vi:
  - "Đến cơ sở cấp cứu ngay khi đau quặn bụng kèm nôn (ói), bụng chướng, hoặc không xì hơi được."
  - "Người đã từng mổ bụng và người cao tuổi càng cần đi khám sớm khi có các dấu hiệu này."
  - "Khối phồng ở bẹn hoặc rốn bỗng sưng đau, không đẩy lên được cần đi cấp cứu ngay."
review:
  status: source_checked
  authors: ["agent:pass-a", "agent:pass-b"]
  reconciler: "agent:pass-c"
  doctor_reviewer: null
  updated: "2026-10-25"
  notes_vi: "Lượt C đã đối chiếu 18 liên kết và mở lại mọi nguồn được trích. Bác sĩ cần xem: (1) tần suất suy từ cặp LR của Böhner qua bảng Cartwright và RR của Eskelinen, chưa đọc được toàn văn; (2) bệnh gộp tắc ruột non, tắc đại tràng, thoát vị nghẹt và xoắn ruột, có đặc điểm khác nhau; (3) đau quặn từng cơn và đau dữ dội để mức thấp hơn mô tả kinh điển để câu trả lời 'Không' không hạ quá mạnh bệnh này; (4) bỏ hai liên kết chỉ có ở lượt A: sốt (MSD không nêu sốt là dấu hiệu thắt nghẹt) và liên quan bữa ăn (ước lượng có thể hạ bệnh không được bỏ sót); (5) chưa có số liệu Việt Nam về nguyên nhân (dính sau mổ, u đại tràng, thoát vị, búi giun ở trẻ)."
