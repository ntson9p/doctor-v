warning_signs: [confusion, drowsy_hard_to_wake, es_unresponsive_or_seizing, seizure_recent, not_recovered_after_faint]
self_care_vi:
  - "Nếu còn tỉnh và nuốt được, ăn hoặc uống ngay đồ ngọt, ví dụ một cốc nhỏ nước hoa quả hoặc nước ngọt có đường."
  - "Sau 10–15 phút chưa đỡ thì ăn, uống đồ ngọt lần nữa."
  - "Khi đã đỡ, ăn thêm bữa nhẹ như bánh mì, cơm để tránh bị lại."
  - "Nếu có máy, đo đường huyết và ghi lại kết quả."
  - "Nếu lơ mơ hoặc không nuốt được, không cho ăn uống; đặt nằm nghiêng và gọi 115."
  - "Không lái xe trong ít nhất 45 phút sau khi đường huyết trở lại bình thường."
see_doctor_vi:
  - "Đi khám trong 24 giờ để bác sĩ xem lại thuốc và cách ăn uống, vì cơn có thể tái lại."
  - "Gọi 115 nếu lơ mơ, co giật, bất tỉnh hoặc không nuốt được."
  - "Người dùng thuốc tiểu đường mà bị cơn nặng cần được theo dõi tại bệnh viện, vì cơn có thể kéo dài."
  - "Người không bị tiểu đường mà có các cơn như vậy cần đi khám để tìm nguyên nhân."
review:
  status: source_checked
  authors: ["agent:pass-a", "agent:pass-b"]
  reconciler: "agent:pass-c"
  doctor_reviewer: null
  updated: "2026-10-25"
  notes_vi: "Lượt C đã đối chiếu 27 liên kết và mở lại mọi nguồn được trích. Mức xử trí 3, không thuộc nhóm 'không được bỏ sót': hai lượt cùng đổi so với gợi ý (mức 2, không được bỏ sót) và lượt C đồng ý sau khi đọc lại nguồn: ca điển hình là người còn tỉnh; 5481/QĐ-BYT (phần 6 mục 1c) và NHS đều cho người tỉnh, nuốt được tự ăn uống đồ ngọt rồi thử lại sau 15 phút; chỉ hạ đường huyết mức 3 (rối loạn ý thức) mới cần cấp cứu, và các dấu hiệu này đã có quy tắc mức 1–2 (lú lẫn, li bì, chưa hồi phục sau ngất, màn sàng lọc cấp cứu). Mức 3 khớp quy tắc rf_hypoglycemia_suspected (khám trong 24 giờ để xem lại thuốc). Mức 2 kèm ngưỡng 1% sẽ khuyên đi viện ngay mọi người tiểu đường có chóng mặt, làm chậm việc ăn đồ ngọt. Mã E16.2 và tên chính thức chưa đối chiếu được với bảng ICD-10 của Bộ Y tế; phần lớn ca do thuốc (E16.0). Bác sĩ cần xem: (1) 5481/QĐ-BYT ghi người dùng sulfonylurea hoặc insulin tác dụng chậm bị cơn nặng cần được theo dõi trong bệnh viện: có cần mức 2 cho nhóm này sau một cơn nặng không; (2) prior theo tuổi là ước lượng; (3) tần suất triệu chứng lấy từ cơn nặng trong thử nghiệm ACCORD và mô tả của 5481/QĐ-BYT, NHS, chưa có số liệu cơn nhẹ ở cộng đồng; (4) câu hỏi thuốc hạ đường huyết chưa tách insulin, sulfonylurea với thuốc ít gây hạ đường huyết."
