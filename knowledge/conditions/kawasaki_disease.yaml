id: kawasaki_disease
names:
  vi: "Bệnh Kawasaki"
  vi_common: ["Hội chứng hạch, da, niêm mạc"]
  en: "Kawasaki disease"
codes:
  icd10: "M30.3"
  icd10_verified: false
summary_vi:
  - "Bệnh viêm mạch máu cấp chưa rõ nguyên nhân, hay gặp ở trẻ dưới 5 tuổi."
  - "Trẻ sốt cao từ 5 ngày, kèm mắt đỏ, môi đỏ nứt, phát ban, sưng đỏ bàn tay chân hoặc nổi hạch cổ."
  - "Cần điều trị sớm tại bệnh viện, tốt nhất trong 10 ngày đầu, để tránh tổn thương tim."
urgency: 3
cant_miss: false
specialties: [pediatrics, cardiology]
applicability:
  age_groups: [infant_0_2m, child_2m_5y, child_5_12]
  reason_vi: "Bệnh gần như chỉ gặp ở trẻ em, phần lớn dưới 5 tuổi; ở thiếu niên, người lớn rất hiếm, và các câu hỏi đặc trưng chỉ hỏi trẻ dưới 13 tuổi."
priors:
  - complaint: fever
    default: P6
    by_age: { child_2m_5y: P5 }
    evidence:
      tier: B
      basis: judgment
      sources: [makino-jepidemiol-2015, kim-pidj-2020, byt-qd-3312-2015, doan-pidj-2022]
      locator: "Makino 2015 phần Results; Kim 2020 tóm tắt; 3312/QĐ-BYT (2015) bài Kawasaki, mục 1 (tr. 311); Doan 2022 tóm tắt"
      reported: "Nhật Bản 243–265 ca/100.000 trẻ 0–4 tuổi/năm; Hàn Quốc 196,9/100.000; 3312: hay gặp ở nhũ nhi và trẻ dưới 5 tuổi"
      note: "Hai lượt cho cùng giá trị (lượt A ghi mặc định P5 kèm P6 cho các nhóm khác; lượt B ghi mặc định P6 kèm P5 cho trẻ 2 tháng–5 tuổi). Chưa có tỷ suất mắc ở Việt Nam; Doan 2022 gợi ý trẻ Việt mắc nhiều và nặng. Với 50–200 ca/100.000 trẻ dưới 5 tuổi mỗi năm và 2–4 đợt sốt mỗi trẻ mỗi năm, khoảng 0,02–0,1% đợt sốt (P5). Từ 5 tuổi ít gặp hơn nhiều: P6. Trẻ dưới 2 tháng chỉ sàng lọc: P6. Cần bác sĩ duyệt."
prior_modifiers:
  - when: { sex: [male] }
    factor: 1.15
    evidence:
      tier: B
      basis: numeric
      sources: [makino-jepidemiol-2015, kim-pidj-2020]
      locator: "Makino 2015 phần Results; Kim 2020 tóm tắt"
      reported: "15.442 nam, 11.249 nữ (tỉ số khoảng 1,37, Nhật Bản); tỉ số nam/nữ 1,41 (Hàn Quốc)"
      note: "Hai lượt cùng 1,15 cho nam; cho nữ lượt A 0,82, lượt B 0,85. Lượt C chọn 0,85: tỉ số 1,35 gần số liệu, trung bình hai hệ số gần 1."
  - when: { sex: [female] }
    factor: 0.85
    evidence:
      tier: B
      basis: numeric
      sources: [makino-jepidemiol-2015, kim-pidj-2020]
      locator: "Như hệ số cho nam"
      reported: "Như hệ số cho nam."
      note: "Đi cặp với hệ số 1,15 cho nam."
findings:
  - finding: fever_duration
    dist: { d1_2: 0.11, d3_5: 0.39, d6_7: 0.27, gt_7d: 0.23 }
    evidence:
      tier: B
      basis: numeric
      sources: [byt-qd-3312-2015, doan-pidj-2022, nhs-kawasaki-disease]
      locator: "3312/QĐ-BYT (2015) mục 3.1a, bảng 1; Doan 2022 tóm tắt; NHS Kawasaki disease"
      reported: "Sốt trung bình 9–11 ngày nếu không điều trị; tiêu chuẩn sốt từ 5 ngày; ngày chẩn đoán trung vị ngày 6 ở trẻ gốc Việt"
      note: "Trung bình hai lượt. Phân bố theo thời điểm cha mẹ hỏi (trước khi được chẩn đoán)."
  - finding: fever_max_temp
    dist: { lt_38: 0.04, t38_39: 0.27, ge_39: 0.69 }
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-3312-2015, nhs-kawasaki-disease]
      locator: "3312/QĐ-BYT (2015) mục 3.1a (thường sốt cao liên tục, không đáp ứng kháng sinh); NHS (sốt cao)"
      note: "Trung bình hai lượt. Phân bố trong số trẻ có sốt; ước lượng."
  - finding: red_eyes
    freq: very_frequent
    evidence:
      tier: B
      basis: numeric
      sources: [park-bmcpediatr-2021, byt-qd-3312-2015, nhs-kawasaki-disease]
      locator: "Park 2021 bảng 2; 3312/QĐ-BYT (2015) bảng 1 (viêm đỏ kết mạc 2 bên, không có nhử); NHS"
      reported: "Đỏ kết mạc 91,2% (Hàn Quốc)"
      note: "Hai lượt trùng mức. Không chọn almost_always vì người dùng có thể hỏi sớm và có thể không điển hình."
  - finding: red_lips_strawberry_tongue
    freq: very_frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-3312-2015, nhs-kawasaki-disease]
      locator: "3312/QĐ-BYT (2015) bảng 1 (môi đỏ sẫm, mọng hoặc rỉ máu; lưỡi dâu tây); NHS (môi khô nứt, lưỡi dâu tây)"
      note: "Hai lượt trùng mức (lượt B dẫn thêm Park 2021: thay đổi môi, khoang miệng 81,3%, chưa được lượt C đối chiếu riêng). Tỷ lệ nền 0,08 nên trả lời 'Có' tăng khả năng khoảng 10 lần. Chỉ hỏi trẻ 2 tháng–12 tuổi."
  - finding: rash_any
    freq: very_frequent
    evidence:
      tier: B
      basis: numeric
      sources: [park-bmcpediatr-2021, byt-qd-3312-2015, nhs-kawasaki-disease]
      locator: "Park 2021 bảng 2; 3312/QĐ-BYT (2015) mục 3.1a, bảng 1"
      reported: "Ban đa dạng 84,6% (Hàn Quốc)"
      note: "Hai lượt trùng mức. Ban dạng hồng ban, đôi khi giống sởi hoặc sẩn, không phỏng nước."
  - finding: rash_non_blanching
    freq: rare
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-3312-2015]
      locator: "3312/QĐ-BYT (2015) mục 3.1a"
      note: "Hai lượt trùng mức. Tần suất trong số trẻ đã có ban; ban không mô tả là xuất huyết. Thấp hơn tỷ lệ nền 5% để ban không mất khi ấn nghiêng về não mô cầu, sốt xuất huyết."
  - finding: rash_spreads_from_face
    freq: rare
    evidence:
      tier: C
      basis: verbal
      sources: [lee-medicina-2022, byt-qd-1019-2025]
      locator: "Lee 2022 mục Mucocutaneous manifestations (ban thường bắt đầu ở thân rồi lan ra tay chân); 1019/QĐ-BYT mục 2.5"
      note: "Chỉ lượt A có; lượt C giữ vì nguồn mô tả rõ. Tần suất trong số trẻ đã có ban. Ban mọc từ sau tai, mặt lan xuống là đặc trưng của sởi; thấp hơn tỷ lệ nền 5%."
  - finding: hands_feet_swelling_peeling
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [park-bmcpediatr-2021, byt-qd-3312-2015, nhs-kawasaki-disease]
      locator: "Park 2021 bảng 2; 3312/QĐ-BYT (2015) bảng 1"
      reported: "Thay đổi đầu chi 67,0% (Hàn Quốc, cả đợt bệnh)"
      note: "Hai lượt trùng mức. Bong da đầu ngón chỉ có từ tuần 2–3; hỏi trong tuần đầu có thể chưa thấy."
  - finding: lymph_node_swelling
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [doan-pidj-2022, park-bmcpediatr-2021, byt-qd-3312-2015]
      locator: "Doan 2022 tóm tắt; Park 2021 bảng 2; 3312/QĐ-BYT (2015) bảng 1 (hạch góc hàm trên 1,5 cm), mục 3.1a (sưng hạch một bên)"
      reported: "Hạch cổ nổi rõ lúc chẩn đoán 20% ở trẻ gốc Việt, 40% ở trẻ châu Á khác (San Diego); sưng hạch cổ 44,0% (Hàn Quốc)"
      note: "Lượt A occasional, lượt B frequent. Lượt C chọn occasional: số liệu riêng cho trẻ gốc Việt (dù chỉ 20 trẻ), là biểu hiện chính ít gặp nhất (3312), và mức thấp hơn tránh làm giảm mạnh khả năng bệnh ở số đông trẻ không có hạch."
  - finding: bcg_scar_red
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [khreis-pedint-2026, byt-qd-3312-2015]
      locator: "Khreis 2026 bảng 1 (Roh 2022, Loh 2019); 3312/QĐ-BYT (2015) mục 3.1b (có thể tấy đỏ sẹo BCG)"
      reported: "Hàn Quốc 25,6% (tiêm BCG lúc sơ sinh như Việt Nam; 89% ở trẻ từ 3 tháng trở xuống, 22,9% ở trẻ lớn hơn); Singapore 42,7% ở trẻ Kawasaki so với 9,9% ở trẻ sốt do nguyên nhân khác"
      note: "Hai lượt trùng mức. Lượt C hiệu chỉnh theo tỷ lệ nền mới 0,05 (trước 0,005): với occasional, trả lời 'Có' tăng khả năng khoảng 4 lần (Singapore: 42,7/9,9 ≈ 4,3), trả lời 'Không' giảm khoảng 0,84 lần (Singapore 0,64), hơi thận trọng vì phụ huynh có thể không để ý. Mức frequent sẽ cho tỉ số 10 lần, quá cao so với nhóm chứng duy nhất có số liệu. Chỉ hỏi trẻ 2 tháng–5 tuổi."
  - finding: mouth_ulcers
    freq: rare
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-3312-2015]
      locator: "3312/QĐ-BYT (2015) bảng 1 (thay đổi khoang miệng: môi đỏ sẫm, phù đỏ khoang miệng, lưỡi dâu tây)"
      note: "Chỉ lượt A có; lượt C giữ. Nguồn không mô tả loét hay phỏng nước trong miệng; thấp hơn tỷ lệ nền 5% để loét, phỏng nước nghiêng về tay chân miệng. Ước lượng."
  - finding: hand_foot_blisters
    freq: very_rare
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-3312-2015]
      locator: "3312/QĐ-BYT (2015) mục 3.1a (ban không phỏng nước)"
      note: "Hai lượt trùng mức. Thấp hơn tỷ lệ nền 1% để phỏng nước ở tay chân nghiêng về tay chân miệng."
  - finding: cough
    freq: frequent
    evidence:
      tier: C
      basis: numeric
      sources: [lee-medicina-2022]
      locator: "Mục Respiratory system"
      reported: "Ho 69% (Đài Loan, tiến cứu); 46% (Hàn Quốc)"
      note: "Chỉ lượt A có (cùng chảy mũi); lượt B không liên kết vì Park 2021 ghi 'triệu chứng hô hấp' 9,9%. Lượt C mở lại cả hai: Park 2021 là nghiên cứu về hội chứng sốc, nhóm sốc có 'triệu chứng hô hấp' 76,9% nên mục này có lẽ là tổn thương hô hấp, không phải ho đơn thuần; Lee 2022 dẫn hai nghiên cứu đo riêng ho. Giữ ho frequent (ho không loại trừ Kawasaki, nhưng vẫn thấp hơn sởi, cảm lạnh). Không liên kết chảy mũi: số liệu 31–58% ngang tỷ lệ nền 0,2–0,5, không phân biệt."
  - finding: vomiting
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [park-bmcpediatr-2021, byt-qd-3312-2015, lee-medicina-2022]
      locator: "Park 2021 bảng 2; 3312/QĐ-BYT (2015) mục 3.1b (rối loạn tiêu hóa hay gặp ở trẻ nhỏ); Lee 2022 mục Gastrointestinal system"
      reported: "Triệu chứng tiêu hóa 26,4% (Hàn Quốc)"
      note: "Hai lượt trùng mức."
  - finding: diarrhea
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [park-bmcpediatr-2021, byt-qd-3312-2015]
      locator: "Park 2021 bảng 2; 3312/QĐ-BYT (2015) mục 3.1b"
      reported: "Triệu chứng tiêu hóa 26,4% (Hàn Quốc)"
      note: "Hai lượt trùng mức."
warning_signs:
  - cold_hands_feet
  - severe_weakness
  - drowsy_hard_to_wake
  - breathing_difficulty
  - child_unable_to_drink
  - child_vomits_everything
  - decreased_urine
self_care_vi:
  - "Cho trẻ uống đủ nước, mặc thoáng mát và theo dõi nhiệt độ."
  - "Không tự cho trẻ uống aspirin; chỉ dùng khi bác sĩ chỉ định."
  - "Ghi lại ngày bắt đầu sốt và chụp ảnh mắt, môi, ban, bàn tay chân để bác sĩ xem."
see_doctor_vi:
  - "Đưa trẻ đi khám trong 24 giờ nếu sốt từ 3 ngày kèm mắt đỏ, môi đỏ nứt, phát ban hoặc sưng đỏ tay chân."
  - "Đến cấp cứu ngay nếu trẻ li bì, tay chân lạnh, khó thở, bỏ bú hoặc không uống được."
  - "Sau khi điều trị, cần tái khám và siêu âm tim theo hẹn của bác sĩ."
review:
  status: source_checked
  authors: ["agent:pass-a", "agent:pass-b"]
  reconciler: "agent:pass-c"
  doctor_reviewer: null
  updated: "2026-10-27"
  notes_vi: "Mức xử trí 3, không thuộc nhóm không được bỏ sót (hai lượt thống nhất): NHS chỉ có mục khám khẩn, không có mục gọi 999; 3312/QĐ-BYT: globulin miễn dịch nên dùng sớm trong 10 ngày đầu, tổn thương động mạch vành ở khoảng một phần ba ca không điều trị hoặc điều trị muộn. Quy tắc rf_kawasaki_signs (mức 3) đã có; đề nghị người bảo trì thêm kawasaki_disease vào `conditions` của quy tắc. Tên thường gọi 'hội chứng hạch, da, niêm mạc' theo 3312/QĐ-BYT (2015), tr. 716. Phạm vi tuổi theo lượt B (không gồm thiếu niên): kb-guide chỉ dùng applicability khi bất khả về sinh học; ở thiếu niên bệnh rất hiếm nhưng vẫn có thể gặp, và các câu đặc trưng không được hỏi, nên để ngoài phạm vi; cần bác sĩ, người bảo trì quyết định. Lời dặn không tự dùng aspirin theo NHS Kawasaki disease (không cho trẻ dưới 16 tuổi uống aspirin khi không có chỉ định). Không dùng số liệu của AHA 2017 (chưa mở được toàn văn). Cần bác sĩ xem: (1) prior suy từ Nhật Bản, Hàn Quốc; (2) tần suất các biểu hiện là cả đợt bệnh ở bệnh viện, người dùng hỏi sớm có thể chưa đủ dấu hiệu; (3) liên kết ho frequent dựa trên một tổng quan (bậc C); (4) sẹo BCG: tỷ lệ nền 0,05 là ước lượng cộng đồng từ nhóm chứng 9,9% ở bệnh viện Singapore; (5) mã M30.3 chưa đối chiếu, bỏ mã MONDO của lượt A vì chưa kiểm tra."
