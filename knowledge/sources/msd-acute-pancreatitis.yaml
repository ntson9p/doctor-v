notes_vi: "Lượt C lô 3 mở trang (rà soát 8/2026). Nguyên nhân: sỏi mật 40–70%, rượu 25–35%, tăng triglycerid khoảng 1–4%. Đau bụng trên liên tục, thường dữ dội, ở thượng vị hoặc hạ sườn trái, hay lan ra sau lưng; khởi phát đột ngột khi do sỏi, tăng dần trong vài ngày khi do rượu; thường kéo dài vài ngày; ho, cử động mạnh, hít sâu làm đau tăng; ngồi cúi ra trước có thể đỡ. Buồn nôn, nôn thường gặp; trên 60% có sốt; đôi khi vàng mắt; có thể chướng bụng do liệt ruột. Thể hoại tử khoảng 5–10%."
