notes_vi: "Lượt C (agent:pass-c, phần b) đọc tóm tắt qua API Europe PMC ngày 25/10/2026. 107 trẻ trên 5 tuổi hồi hộp không rõ nguyên nhân ở bệnh viện nhi (Lahore, 2015), tuổi trung vị 10: triệu chứng kèm hay gặp là ngất, tiền ngất (32,7%), đau ngực (20,5%), khó thở (19,6%), da tái (10,3%). Holter bất thường ở 37%; hay gặp nhất là ngoại tâm thu thất dày (11,2%) và ngoại tâm thu nhĩ (8,4%)."
