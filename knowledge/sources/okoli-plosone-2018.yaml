notes_vi: "Lượt C (Giai đoạn 3 lô 3) đọc lại toàn văn (PMC6248994) qua API Europe PMC ngày 31/10/2026; lượt A đã đọc trước đó. 13 nghiên cứu ở tuyến ban đầu và bệnh viện; tỷ số chênh chẩn đoán gộp: ho ra máu 6,39, khó thở 2,73, ho 2,64, đau ngực 2,02. Bảng 3 nêu tỷ số khả dĩ từ số liệu gốc của Hamilton 2005 (bệnh–chứng ở 21 phòng khám đa khoa Exeter, Anh, người từ 40 tuổi, hồ sơ 2 năm trước chẩn đoán): ho ra máu LR+ 13,2, LR− 0,80; sụt cân 6,2 và 0,76; chán ăn 4,8 và 0,84; khó thở 3,6 và 0,52; đau ngực hoặc đau sườn 3,3 và 0,68; mệt 2,3 và 0,76. Độ nhạy tính từ cặp LR+ và LR− (lượt A tính, lượt C tính lại): ho ra máu khoảng 21%, sụt cân 27%, khó thở 56%, đau ngực 40%, mệt 36%; đây là số tự tính, chưa đối chiếu bài gốc của Hamilton."
