notes_vi: "Lượt C lô 3 đọc tóm tắt qua API Europe PMC. 15 nghiên cứu, 41.763 người lớn ở cộng đồng, nơi làm việc, phòng khám bác sĩ gia đình hoặc nội khoa (40,4% có khó tiêu): viêm thực quản trào ngược 11,0% (bất thường hay gặp nhất); loét dạ dày – tá tràng 4,4% (bất thường duy nhất gặp nhiều hơn ở người khó tiêu, OR 1,61); trên 85% nội soi bình thường; ung thư dưới 0,4%."
