notes_vi: "Lượt C đọc toàn văn (PMC4994428) qua API Europe PMC (www.ebi.ac.uk/europepmc/webservices/rest). Đoàn hệ 270 hộ ở một xã của Hà Nam (miền Bắc), 2008–2013; hội chứng giống cúm là nhiệt độ từ 38°C kèm ho hoặc đau họng. Trong các mẫu: rhinovirus 28%, cúm 17%, coronavirus 8%, enterovirus 5%. Cúm chiếm 24% ca ở người dưới 18 tuổi, 13% ở người lớn hơn. Bảng 3: 55/71 đợt cúm (78%) vào mùa đông và mùa xuân; rhinovirus chủ yếu vào hè, thu. Bài báo không ghi tháng của từng mùa."
