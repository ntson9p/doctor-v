notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần c) đọc lại toàn văn PMC13460135 qua API Europe PMC ngày 31/10/2026; lượt A đã đọc trước đó. 369 người bóc tách týp A được mổ ở một trung tâm (Leiden, Hà Lan, 1992–2025; loại người thiếu hồ sơ triệu chứng và người đái tháo đường), nam 60,4%, tuổi trung bình 61; tăng huyết áp 40% (nam 35%, nữ 47%); bệnh mạch máu 18%. Bảng 2 (nam/nữ): đau ngực 64%/63%; đau giữa hai bả vai 16%/16%; đau lưng không rõ vị trí 13%/21%; đau cổ, họng khoảng 9%/13%; đau tay khoảng 6%/9%; đau hàm 3,1%/8,9%; đau bụng 13%/8,2%. Bảng 3: khó thở 7,2%/17%; buồn nôn 9,4%/12%; gục, ngất 14%/23%; vã mồ hôi 13%/9,6%; liệt nửa người khoảng 3,5%/6,2%; nói khó 3,1%/1,4%; 5% không triệu chứng. Số liệu ghi theo hồ sơ nên có thể thấp hơn thực tế; chỉ gồm týp A được mổ."
