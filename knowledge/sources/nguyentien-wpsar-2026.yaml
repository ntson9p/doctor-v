notes_vi: "Lượt C đọc toàn văn (PMC13099529) qua API Europe PMC (www.ebi.ac.uk/europepmc/webservices/rest). Đồng Nai: tỷ lệ tiêm mũi 1 vắc xin sởi 73,1% (2021), 73,9% (2022), 91,9% (2023). Dịch tăng từ quý 4/2024, đỉnh tuần 50–51 (khoảng 900 ca/tuần), 7.173 ca năm 2024, giảm dần đến khoảng 80 ca ở tuần 14/2025. Trong 11.434 ca: 55,9% dưới 5 tuổi, 24,3% 5–10 tuổi, 19,8% trên 10 tuổi. Chiến dịch tiêm bù 9/2024–3/2025 đạt 97,5%."
