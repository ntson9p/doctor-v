notes_vi: "Lượt C lô 3 đọc toàn văn trên PMC. 10.023 vụ dịch viêm dạ dày – ruột cấp báo cáo cho CDC (NORS 2009–2012). Bảng 1, trung vị tỷ lệ ca trong mỗi vụ: do noro vi rút đã xác nhận: nôn 72%, tiêu chảy 86%, sốt 22%, phân có máu 0%, thời gian bệnh 48 giờ, ủ bệnh 30 giờ; do vi khuẩn hoặc tác nhân không phải vi rút: nôn 39%, tiêu chảy 100%, sốt 58%, phân có máu 30%, thời gian bệnh 144 giờ, ủ bệnh 60 giờ. Số liệu vụ dịch ở Mỹ, không phải ca lẻ tẻ ở Việt Nam."
