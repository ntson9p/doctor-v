notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần b) đọc lại tóm tắt qua API Europe PMC ngày 31/10/2026; lượt A đã đọc trước đó. Trẻ trên 5 tuổi, vị thành niên, người lớn ho (mọi thời gian ho); 3 nghiên cứu tiến cứu được phân tích. Nôn sau ho LR dương 1,8, LR âm 0,58; tiếng rít khi hít vào LR dương 1,9, LR âm 0,78; không có ho từng cơn LR âm 0,52. Ngoài vụ dịch, các triệu chứng kinh điển chỉ thay đổi khả năng ho gà ở mức vừa phải."
