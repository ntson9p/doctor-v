notes_vi: "Lượt C (phần b) mở trang ngày 25/10/2026 (địa chỉ cũ trong bản nháp tự chuyển sang địa chỉ này). Cơn hoảng sợ: sợ hãi hoặc khó chịu dữ dội khởi phát đột ngột, kèm ít nhất 4 trong 13 triệu chứng; kéo dài vài phút đến 1 giờ; không nguy hiểm về y khoa. Tỷ lệ từng có cơn trong đời 8–23%; rối loạn hoảng sợ 2–3% dân số trong 12 tháng, thường bắt đầu cuối tuổi vị thành niên hoặc đầu tuổi trưởng thành, nữ gấp khoảng 2 lần nam. Người bệnh hay lo mình bị bệnh tim, phổi, thần kinh nguy hiểm và nhiều lần đi khám, đi cấp cứu. Chỉ kết luận sau khi loại trừ bệnh cơ thể như cường giáp, hội chứng vành cấp; bệnh kèm hay gặp gồm rối loạn nhịp, cường giáp, hen, bệnh phổi tắc nghẽn mạn. Cụm đau ngực, khó thở, vã mồ hôi, run nên được khám toàn thân, nhất là khi chưa từng được khám."
