notes_vi: "Xuất bản 19/3/2024. Khuyến cáo 1.1.7 và 1.1.13: nghi viêm màng não vi khuẩn hoặc bệnh não mô cầu thì chuyển viện cấp cứu. Bộ dấu hiệu nguy hiểm: sốt, đau đầu, cứng gáy, thay đổi ý thức (bảng 1–2); 1.1.9: nghĩ nhiều đến bệnh não mô cầu khi ban xuất huyết không mất khi ấn lan nhanh hoặc nốt trên 2 mm; 1.1.12: ban có thể chuyển từ mất khi ấn sang không mất, khó thấy trên da sẫm màu. nice.org.uk trả lỗi 403 với truy cập tự động; lượt R đã đọc các trang chính thức (Overview, Recommendations, History) qua dịch vụ đọc văn bản r.jina.ai."
