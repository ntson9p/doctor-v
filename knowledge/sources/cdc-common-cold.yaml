notes_vi: "Lượt C mở lại trang (ngày trên trang 19/02/2026). Triệu chứng: sổ mũi, nghẹt mũi, ho, hắt hơi, đau họng, đau đầu, đau mỏi người nhẹ, sốt (thường nhẹ ở trẻ lớn và người lớn); triệu chứng đạt đỉnh trong 2–3 ngày; thường kéo dài dưới 1 tuần; gặp quanh năm. Trang không nêu khi nào cần đi khám."
