notes_vi: "Lượt C (Giai đoạn 3 lô 3) đọc lại tóm tắt qua API Europe PMC ngày 31/10/2026 (chỉ có tóm tắt). Mẫu ngẫu nhiên người 21–70 tuổi: 3.008 người nội thành Hà Nội, 4.000 người huyện Ba Vì; tỷ lệ trả lời 70% và 92%. Từng mắc hen 5,6% (Hà Nội) và 3,9% (Ba Vì), không khác biệt lớn giữa nam và nữ. Ho kéo dài là triệu chứng hay gặp nhất (18,1% và 12,0%), rồi khạc đờm. Nam hút thuốc 49,7% (Hà Nội), 67,8% (Ba Vì); nữ 4,2% và 1,2%."
