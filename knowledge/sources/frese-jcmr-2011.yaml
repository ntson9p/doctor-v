notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần a) đọc lại toàn văn (PMC3279485) qua API Europe PMC ngày 31/10/2026; lượt A (id frese-jclinmedres-2011) và lượt B đã đọc trước đó. Người đi khám bác sĩ đa khoa vì khó thở ở Đức (SESAM 2, 93 người) và Hà Lan (Transition Project, 3.743 lần khám vì khó thở mới, 2.747 lần vì khó thở đã biết). Bảng 5 (SESAM 2 / khó thở mới / khó thở đã biết, %): viêm phế quản cấp 24,73 / 24,51 / 9,60; nhiễm trùng hô hấp trên 9,68 / 6,90 / 0,87; hen phế quản 5,38 / 10,96 / 36,12; bệnh phổi tắc nghẽn mạn tính 5,38 / 2,19 / 15,86; suy tim 5,38 / 4,09 / 6,98; viêm phế quản mạn 4,30 / 0,79 / 5,11; khó thở chưa rõ nguyên nhân 4,30 / 14,12 / 4,79; viêm phổi 3,23 / 2,64 / 1,03; viêm thanh khí quản 2,15 / 3,92 / 1,00; bệnh tim thiếu máu cục bộ 2,15 / 1,23 / 1,66; nhồi máu cơ tim 1,08 / 0 / 0; rung, cuồng nhĩ 1,08 / 0,49 / 0,79; cúm 1,08 / 0,44 / 0,03; tăng thông khí 0 / 7,56 / 4,01; tắc mạch phổi 0 / 0,35 / 0,21; u ác đường hô hấp 0 / 0,12 / 0,40. Khó thở gặp nhiều ở trẻ 0–4 tuổi và người trên 64 tuổi. Bàn luận (theo Ponka): dưới 45 tuổi hen đứng đầu, viêm phế quản thứ hai; trên 45 tuổi suy tim, bệnh phổi tắc nghẽn mạn tính rồi viêm phế quản. Ca cấp cứu hiếm ở phòng khám đa khoa."
