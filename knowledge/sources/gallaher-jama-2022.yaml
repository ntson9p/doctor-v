notes_vi: "Lượt C lô 3 đọc tóm tắt qua API Europe PMC. Khoảng 20 triệu người Mỹ có bệnh túi mật, khoảng 200.000 người được chẩn đoán viêm túi mật cấp mỗi năm; sỏi gây 90–95% ca. Biểu hiện: đau hạ sườn phải cấp, sốt, buồn nôn, đôi khi tăng sau ăn; khám thấy ấn đau hạ sườn phải. Siêu âm độ nhạy khoảng 81%, đặc hiệu khoảng 83%. Mổ nội soi cắt túi mật trong 3 ngày là điều trị hàng đầu."
