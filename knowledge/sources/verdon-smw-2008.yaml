notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần a) đọc lại tóm tắt qua API Europe PMC ngày 31/10/2026; lượt A, lượt B đã đọc trước đó. 59 bác sĩ đa khoa ở miền Tây Thụy Sĩ: 672/24.620 người được khám có đau ngực (2,7%), 52% nữ, tuổi trung bình 55; theo dõi 12 tháng. Nguyên nhân: cơ xương (gồm hội chứng thành ngực) 49%, tim mạch 16%, tâm lý 11%, hô hấp 10%, tiêu hóa 8%, khác 2%, không chẩn đoán được 3%; ba bệnh hay gặp nhất là hội chứng thành ngực 43%, bệnh mạch vành 12%, lo âu 7%. Đau thắt ngực không ổn định 6, nhồi máu cơ tim 4, thuyên tắc phổi 2 người (cộng lại 1,8%). Bệnh có thể nặng (tim, hô hấp, ung thư) chiếm 20%. 25 người tử vong trong 12 tháng, 12 người vì lý do liên quan trực tiếp tới đau ngực (ung thư 7, tim 5). Tóm tắt không tách hen, viêm phổi trong nhóm hô hấp."
