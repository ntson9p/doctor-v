notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần b) tải lại toàn văn ngày 31/10/2026; lượt A đã đọc trước đó (lượt A ghi L3; lượt C đổi thành L0 theo ghi chú bản quyền cuối bài). Croup gặp ở 3% trẻ 6 tháng–3 tuổi mỗi năm, chiếm 7% số lần nằm viện vì sốt, bệnh hô hấp cấp ở trẻ dưới 5 tuổi (Mỹ); trai/gái 1,5/1; có thể gặp tới 6 tuổi, hoặc dưới 6 tháng ở ca không điển hình; khoảng 85% thể nhẹ, dưới 1% thể nặng; dưới 5% phải nằm viện. Khởi đầu như nhiễm trùng hô hấp trên, 12–72 giờ sốt nhẹ, sổ mũi; rồi thở rít, thở nhanh, co kéo, ho ông ổng; nặng hơn về đêm, đỉnh ở giờ 24–48, tự khỏi trong 48 giờ đến 1 tuần. Chẩn đoán lâm sàng: ho ông ổng khởi phát đột ngột, thở rít khi hít vào, khàn tiếng; nhiều trẻ khó thở, sốt, nhưng không sốt không làm giảm nghi ngờ. Khò khè nếu có thường nhẹ; khò khè rõ cần nghĩ chẩn đoán khác. Trên 99% trẻ thở rít đột ngột là croup. Ho giúp phân biệt croup với viêm nắp thanh môn, chảy dãi gợi ý viêm nắp thanh môn. Bảng 1: dị vật đường thở khởi phát đột ngột nghẹn, hóc, chảy dãi."
