notes_vi: "Lượt C (Giai đoạn 3, lô 2, phần b) mở lại ngày 27/10/2026 (tải trang toàn văn PMC88975 trên pmc.ncbi.nlm.nih.gov). Bảng 7 (triệu chứng lúc nhập viện ở 8 loạt ca, gồm Việt Nam 1973, 150 người): vàng da 0–95% (Việt Nam 1,5%); đau đầu 70–98% (98%); đỏ kết mạc 28,5–99% (42%); nôn 18–69% (33%); đau cơ 40–100% (79%); đau bụng 26–43% (28%); ho 20–57% (20%); ho ra máu 9–51%; nổi hạch 19–49% (21%); tiêu chảy 11–36% (29%); phát ban 0–7% (7%). Thể không vàng da: sốt đột ngột, có thể hai pha; đau đầu thường dữ dội giống sốt xuất huyết; đau cơ dữ dội ở thắt lưng, đùi, bắp chân; viêm màng não vô khuẩn ở tới 25% ca; tử vong gần như bằng 0. Thể vàng da chiếm 5–10% số người bệnh, tử vong 5–15%; suy thận cấp ở 16–40% ca."
