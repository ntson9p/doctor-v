notes_vi: "Tổng quan tường thuật. Đau nửa đầu tiền đình: mắc trọn đời khoảng 1%, trong 1 năm 0,9%; khoảng 7% người khám ở phòng khám chóng mặt; nữ nhiều gấp 1,5–5 lần. Là nguyên nhân hay gặp nhất của chóng mặt ở trẻ em (39%), tiếp theo là chóng mặt chức năng, tâm lý (21%); chóng mặt kịch phát lành tính ở trẻ nhỏ là một dạng đau nửa đầu, cơn vài giây đến vài phút. Chóng mặt tự phát 21–83%, chóng mặt tư thế 17–65%, không chịu được cử động đầu 31–77%; điều tra dân số: 67% chóng mặt quay tự phát, 24% chóng mặt tư thế. Cơn kéo dài vài giây đến vài ngày; dưới 50% có cả đau đầu và chóng mặt ở mọi cơn; có thể kèm sợ ánh sáng, sợ tiếng ồn, tiền triệu. Triệu chứng tai (nghe kém, ù tai, đầy tai) 38%, thường nhẹ, thoáng qua. Cơn 5–60 phút kiểu tiền triệu ở 10–30%."
