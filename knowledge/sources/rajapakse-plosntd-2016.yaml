notes_vi: "Lượt C (Giai đoạn 3, lô 2, phần b) mở lại ngày 27/10/2026 (bản ghi và toàn văn PMC4917116 qua API Europe PMC). 592 người nằm viện vì nghi bệnh do Leptospira ở Sri Lanka; bảng 3 (nhóm phát triển, Leptospira xác định so với sốt do nguyên nhân khác): sốt 95% / 93,7%; rét run 73,9% / 69,6%; có phơi nhiễm 74,6% / 53,0%; đau đầu 81,7% / 77,4%; đau cơ 88,3% / 80,0%; xung huyết kết mạc 55% / 43,3%; vàng da 27,2% / 17,8%; cứng gáy 13,3% / 13,7%; ấn đau cơ 67,8% / 61,9%; tiểu ít 31,1% / 18,5%; xuất huyết phổi 0,6% / 0. Tác giả: ngoài phơi nhiễm, không triệu chứng lâm sàng nào phân biệt đáng tin cậy. Nhóm chứng là người được nghi bệnh (đã chọn theo phơi nhiễm), nên tỷ lệ phơi nhiễm ở nhóm chứng cao hơn cộng đồng."
