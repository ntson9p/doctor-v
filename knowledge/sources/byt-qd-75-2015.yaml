notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần c) tải lại toàn văn đăng lại trên vnras.com ngày 31/10/2026 (trang thứ cấp; trang có liên kết PDF của văn bản); lượt A, lượt B đã đọc trước đó. Quyết định số 75/QĐ-BYT ngày 13/01/2015. Bài Bệnh zona: ban đỏ, mụn nước, bọng nước thành đám, thành chùm dọc đường phân bố của dây thần kinh ngoại biên; hay gặp ở người già, người suy giảm miễn dịch. Yếu tố khởi động: suy giảm miễn dịch, người già yếu, thuốc ức chế miễn dịch, bệnh máu, đái tháo đường, lupus, stress, xạ trị, ung thư, HIV/AIDS. Tiền triệu 1–5 ngày: bỏng, nóng rát, châm chích, tê, đau trên một vùng da, nhất là về đêm; có thể nhức đầu, sợ ánh sáng, khó chịu. Khoảng nửa ngày đến một ngày sau nổi mảng đỏ, vài ngày sau thành mụn nước; lành sẹo sau 2–4 tuần. Thường chỉ một bên, không vượt đường giữa; cá biệt cả hai bên hay lan tỏa. Hạch vùng lân cận sưng to. Đau xuất hiện sớm, có thể trước tổn thương da, từ rát bỏng âm ỉ đến như kim châm, giật từng cơn; trẻ em, người trẻ đau ít, người nhiều tuổi đau từng cơn, kéo dài. Zona liên sườn và ngực bụng là thể hay gặp nhất (50%); zona mắt 10–15%. Giai đoạn khởi phát cần phân biệt với viêm màng phổi, đau do bệnh tim, viêm túi mật, cơn đau quặn thận… Thuốc kháng vi rút nên dùng sớm, tốt nhất trong 72 giờ đầu. Chưa tìm được văn bản thay thế."
