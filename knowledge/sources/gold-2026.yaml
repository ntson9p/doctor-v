notes_vi: "Lượt R lô 3 vòng 2 thêm thay cho gold-2025. Đã tải PDF (GOLD-REPORT-2026-v1.3-8Dec2025, 248 trang) ngày 31/10/2026; đây là báo cáo mới nhất trên goldcopd.org (chưa có bản 2027). Dữ kiện dùng: đợt cấp là biến cố cấp, triệu chứng nặng lên trong vài ngày (tới 14 ngày), với khó thở và/hoặc ho, khạc đờm tăng, có thể kèm thở nhanh, tim nhanh (tr. 39); hơn 80% đợt cấp điều trị ngoại trú; quyết định nơi điều trị dựa vào độ nặng đợt cấp, mức độ bệnh nền, bệnh đồng mắc, tri giác, điều kiện ở nhà (tr. 98, 100); không có dấu hiệu suy hô hấp thì điều trị ngoại trú và dặn người bệnh đi khám ngay khi nặng lên (tr. 98); phân loại khi nhập viện: suy hô hấp khi nhịp thở trên 24 lần/phút, tim trên 95 lần/phút, co kéo cơ hô hấp phụ (tr. 93). Hình 4.4 (chỉ định đánh giá nhập viện) là hình ảnh, không trích được chữ."
