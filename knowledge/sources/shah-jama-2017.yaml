notes_vi: "Lượt C đọc lại tóm tắt qua API Europe PMC (www.ebi.ac.uk/europepmc/webservices/rest). 23 nghiên cứu ở trẻ có thể bị viêm phổi (13.833 trẻ). Sốt trên 37,5°C: độ nhạy 80–92%; thở nhanh trên 40 lần/phút: độ nhạy 79%; đau ngực (2 nghiên cứu có trẻ vị thành niên): độ nhạy 8–14%. Thiếu oxy và thở gắng sức có giá trị nhất."
