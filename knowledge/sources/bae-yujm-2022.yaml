notes_vi: "Tổng quan tường thuật (Hàn Quốc). Bệnh tiền đình ngoại biên hay gặp thứ ba sau chóng mặt tư thế kịch phát lành tính và bệnh Ménière; hay gặp ở 30–60 tuổi, nhiều nhất 40–50 tuổi, một nghiên cứu gần đây thấy gặp nhiều cả ở người trên 70 tuổi. Nhiễm vi rút đường hô hấp trên trước đó hoặc cùng lúc ở 43–46%. Điển hình: chóng mặt quay thật sự đột ngột trên 24 giờ, buồn nôn, nôn, không có triệu chứng ốc tai hay thần kinh khác; phần lớn buồn nôn, nôn nhiều, đỡ rõ sau 1–3 ngày. Tới một phần tư có cơn choáng vài phút trong vài ngày trước. Trong 3 ngày đầu người bệnh vẫn tự đi được nhưng phần lớn phải có người đỡ vì nghiêng, ngã về bên bệnh."
