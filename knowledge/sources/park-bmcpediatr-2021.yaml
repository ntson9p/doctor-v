notes_vi: "Lượt C (Giai đoạn 3, lô 2, phần b) mở lại ngày 27/10/2026 (bản ghi và toàn văn PMC7790725 qua API Europe PMC). Bệnh viện nhi tuyến cuối ở Hàn Quốc, nghiên cứu bệnh–chứng về hội chứng sốc Kawasaki. Bảng 2, nhóm Kawasaki không sốc (91 trẻ): đỏ kết mạc 91,2%, ban đa dạng 84,6%, sưng hạch cổ 44,0%, thay đổi đầu chi 67,0%, triệu chứng tiêu hóa 26,4%, 'triệu chứng hô hấp' 9,9% (nhóm sốc 76,9%; bài không định nghĩa riêng, có lẽ là tổn thương hô hấp hơn là ho đơn thuần)."
