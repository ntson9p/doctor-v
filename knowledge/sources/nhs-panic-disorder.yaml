notes_vi: "Lượt C (phần b) tải trang và trích chữ ngày 25/10/2026 (rà soát lần cuối 22/8/2023, hạn rà soát 22/8/2026, chưa có bản mới). Cơn hoảng sợ đến rất nhanh, có khi không rõ lý do; triệu chứng: tim đập nhanh, cảm giác sắp ngất, vã mồ hôi, buồn nôn, đau ngực, khó thở, run, bốc hỏa, ớn lạnh, run chân tay, cảm giác nghẹn, chóng mặt, tê hoặc châm chích, khô miệng, cảm giác sợ chết, cồn cào bụng, tê đầu ngón tay, cảm giác tách khỏi cơ thể. Phần lớn cơn kéo dài 5–20 phút, có khi tới 1 giờ; cơn đáng sợ nhưng không nguy hiểm, không gây hại cho cơ thể. Nhiều triệu chứng cũng gặp ở bệnh khác. Khám bác sĩ gia đình để loại trừ bệnh khác. Trong cơn: ở yên chỗ nếu được, thở chậm và sâu, tự nhắc rằng cơn sẽ qua."
