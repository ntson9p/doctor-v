notes_vi: "Lượt C lô 3 đọc toàn văn trên PMC. 336 trẻ 4–16 tuổi có triệu chứng được nội soi tại hai bệnh viện nhi tuyến cuối ở TP.HCM (10/2019–5/2021): nhiễm H. pylori 80,1%; loét 19,4% (ở trẻ nhiễm: 18,7% dưới 11 tuổi, 36,7% từ 11 tuổi). Đau bụng dai dẳng 95,2%, đau thượng vị 75,3%; khoảng 7,7% có xuất huyết tiêu hóa (lượt C tính từ Bảng 1). Là trẻ được chuyển nội soi, không đại diện cho trẻ đau bụng ở cộng đồng. Lượt A và lượt B trích cùng bài này với hai ID khác nhau (nguyen-healthcare-2023, nguyentc-2023-pud-children-vietnam); sổ nguồn dùng ID này."
