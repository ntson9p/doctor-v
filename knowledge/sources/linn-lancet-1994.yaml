notes_vi: "Lượt C đọc tóm tắt qua API Europe PMC (lượt B đặt ID 'linn-1994-sentinel-headache-gp'). 148 người đau đầu đột ngột, dữ dội do 252 bác sĩ đa khoa ở Hà Lan gặp trong 5 năm: 37 người (25%) xuất huyết dưới nhện; trong 103 người chỉ có đau đầu đơn thuần, 12 người (12%) xuất huyết dưới nhện; chỉ 2 người từng có cơn đau đầu đột ngột trước đó; 37% có bệnh thần kinh nặng."
