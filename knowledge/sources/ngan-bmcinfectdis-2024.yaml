notes_vi: "Lượt C (Giai đoạn 3, lô 2, phần b) mở lại ngày 27/10/2026 (bản ghi và toàn văn PMC11149218 qua API Europe PMC). 66 người viêm não do herpes (PCR dịch não tủy dương tính) ở Bệnh viện Bệnh Nhiệt đới Trung ương (2018–2021), tuổi trung vị 53; 90,9% chuyển từ tuyến dưới; từ khởi bệnh đến nhập viện trung vị 5,5 ngày. Sốt 100%, rối loạn ý thức 95,5%, dấu hiệu màng não 86,4%, co giật 36,4%, rối loạn trí nhớ 31,8%, rối loạn ngôn ngữ 19,7%, rối loạn hành vi 13,6%. Phần mở đầu: herpes chiếm 7% viêm não cấp ở trẻ em và khoảng 3% nhiễm trùng thần kinh trung ương nghi ngờ ở người lớn Việt Nam."
