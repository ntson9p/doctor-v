notes_vi: "Lượt C lô 3 tải bản văn bản (TEXT) qua API kho IRIS và đối chiếu (bản sửa đổi lần 4 của WHO/CDD/SER/80.2). Trẻ dưới 3 tuổi ở nước đang phát triển bị trung bình 3 đợt tiêu chảy mỗi năm. Dấu hiệu mất nước: khát, vật vã hoặc kích thích, mắt trũng, nếp véo da mất chậm. Mục 4.2.4: đưa trẻ đến nhân viên y tế khi đi ngoài nhiều lần phân nước, nôn nhiều lần, rất khát, ăn uống kém, sốt, phân có máu hoặc không đỡ sau 3 ngày. Thuốc cầm tiêu chảy không bao giờ dùng cho trẻ dưới 5 tuổi; thuốc chống nôn không dùng cho trẻ tiêu chảy."
