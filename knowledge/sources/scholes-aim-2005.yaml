notes_vi: "Lượt C chỉ đọc tóm tắt qua API Europe PMC. Nghiên cứu bệnh–chứng dựa vào cộng đồng ở 788 phụ nữ 18–49 tuổi không có thai (Washington, Hoa Kỳ): 7% ca phải nằm viện; E. coli 85%; yếu tố nguy cơ độc lập: giao hợp từ 3 lần/tuần (OR 5,6), nhiễm khuẩn tiết niệu gần đây (OR 4,4), đái tháo đường (OR 4,1), són tiểu gần đây (OR 3,9), bạn tình mới trong năm qua (OR 2,2)."
