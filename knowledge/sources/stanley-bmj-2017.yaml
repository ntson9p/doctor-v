notes_vi: "Lượt C (phần b) đọc toàn văn PMC5217768 qua API Europe PMC. 3.012 người xuất huyết tiêu hóa trên liên tiếp ở 6 bệnh viện lớn (châu Âu, Bắc Mỹ, châu Á, châu Đại Dương): tuổi trung vị 65, nam 58%; bệnh gan 15%; mạch trung vị 89 lần/phút (khoảng 95%: 61–126); loét dạ dày tá tràng 28%, giãn tĩnh mạch 7%; 45% cần can thiệp tại viện hoặc tử vong trong 30 ngày. Thang Glasgow Blatchford dự báo can thiệp hoặc tử vong tốt nhất; điểm từ 1 trở xuống là ngưỡng tối ưu để xử trí ngoại trú."
