notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần c) đọc lại toàn văn PMC5642834 qua API Europe PMC ngày 31/10/2026; lượt B đã đọc trước đó. Bài tổng hợp các báo cáo của sổ bộ IRAD (trung tâm chuyên sâu): hai phần ba là nam, tuổi trung bình 63 (nữ 67); người dưới 40 tuổi ít tăng huyết áp (34%), hay có hội chứng Marfan, van động mạch chủ hai lá. Bảng 1: tăng huyết áp 72%, xơ vữa động mạch 31%, đã biết phình động mạch chủ 16%, đái tháo đường 5%, từng mổ tim 18%, Marfan 5%. Đau dữ dội, sắc, khởi phát đột ngột là than phiền hay gặp nhất; đau như xé, như rách hoặc di chuyển không phải mô tả phổ biến. Đau ngực 79% ở týp A, 63% ở týp B; đau lưng 64% và đau bụng 43% ở týp B; ngất 13%; mất mạch 30% (týp A), 20% (týp B). Bảng 2: khởi phát đột ngột 84,5% ở týp A. Bệnh hay gặp vào mùa đông, nhất là tháng 1, và buổi sáng."
