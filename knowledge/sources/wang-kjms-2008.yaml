notes_vi: "Lượt C (Giai đoạn 3 lô 3) đọc lại tóm tắt qua API Europe PMC ngày 31/10/2026; lượt A đã đọc trước đó. Hồi cứu 154 người lao phổi cấy dương tính đến khám tại một bệnh viện ở Cao Hùng (Đài Loan), 2003–2006; tuổi trung bình 59,5; 115 nam, 39 nữ. Ho 90,3% (139/154); sốt 27,9%; ho ra máu 14,9%; đái tháo đường là yếu tố nguy cơ hay gặp nhất (31,2%, 48/154). Tác giả ghi tỷ lệ ho cao hơn, sốt và ho ra máu thấp hơn các nghiên cứu trước."
