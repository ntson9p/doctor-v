notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần c) tải lại trang ngày 31/10/2026 (rà soát toàn bộ 7/2025, cập nhật 9/2026); lượt A đã mở trước đó. Tràn khí tự phát nguyên phát điển hình ở nam cao gầy tuổi thiếu niên và 20, liên quan bóng khí do hút thuốc hoặc bẩm sinh, thường xảy ra lúc nghỉ. Thứ phát hay gặp nhất do vỡ bóng khí ở người bệnh phổi tắc nghẽn mạn tính nặng. Tràn khí nhỏ đôi khi không triệu chứng; triệu chứng gồm khó thở và đau ngực kiểu màng phổi; khó thở đột ngột hoặc từ từ tùy tốc độ và kích thước; đau có thể lan vai, bụng, có thể giống đau do thiếu máu cơ tim (đau thiếu máu cơ tim thường không kiểu màng phổi). Tràn khí áp lực làm tụt huyết áp, ngừng thở, ngừng tim trong vài phút. Tái phát 19–29% sau 1 năm."
