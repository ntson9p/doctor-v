notes_vi: "Trang rà soát lần cuối 20/10/2026 (hạn rà soát 20/10/2029). Đã đối chiếu danh sách 'Call 999 or go to A&E' (đau đột ngột và dữ dội; nôn ra máu, dịch xanh hoặc bã cà phê; chảy nhiều máu từ hậu môn hoặc phân đen dính; không tiểu được; không đi ngoài, không xì hơi được; ban không mất khi ấn; khó thở) và danh sách 'urgent GP / NHS 111' (đau nặng lên nhanh; có thai; phân có máu; ra máu hoặc dịch bất thường âm đạo; tiêu chảy hoặc nôn vài ngày không đỡ)."
