notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần b) tải lại trang ngày 31/10/2026 (rà soát toàn bộ 3/2026, cập nhật 9/2026); lượt A đã đọc trước đó. Chủ yếu ở trẻ 6 tháng–3 tuổi; trẻ trai mắc nhiều hơn. Thường có triệu chứng nhiễm trùng hô hấp trên trước; rồi ho ông ổng, thường thành cơn co thắt, khàn tiếng, hay về đêm; có thể thở rít khi hít vào; trẻ có thể thức giấc vì khó thở, thở nhanh, co kéo. Nhiều trẻ có sốt; croup co thắt (tái phát) thường không sốt. Bệnh nhẹ (không thở rít lúc nghỉ, không suy hô hấp) thường kéo dài 3–4 ngày, chăm sóc tại nhà. Viêm nắp thanh môn, áp xe sau họng, viêm khí quản do vi khuẩn trông nhiễm độc hơn và không có ho ông ổng; dị vật đường thở thường không sốt, không có nhiễm trùng hô hấp trên trước."
