notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần b) đọc lại tóm tắt qua API Europe PMC ngày 31/10/2026; lượt B đã đọc trước đó. Tổng quan hệ thống và phân tích gộp dữ liệu từng người bệnh về chẩn đoán suy tim ở tuyến ban đầu: khó thở là triệu chứng duy nhất có độ nhạy cao (89%) nhưng độ đặc hiệu thấp (51%). Các dấu hiệu có độ đặc hiệu tương đối cao: tiền sử nhồi máu cơ tim (89%), khó thở khi nằm (89%), phù (72%), tĩnh mạch cổ nổi (70%), ran ở phổi (81%); độ nhạy của các dấu hiệu này thấp, từ 11% đến 53% (phù)."
