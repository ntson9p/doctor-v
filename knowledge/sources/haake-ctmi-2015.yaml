notes_vi: "Lượt C (Giai đoạn 3, lô 2, phần b) mở lại ngày 27/10/2026 (tải trang toàn văn PMC4442676 trên pmc.ncbi.nlm.nih.gov). Phần lớn nhiễm Leptospira ở vùng lưu hành là nhẹ hoặc không triệu chứng; dịch liên quan mưa lớn, lũ lụt; người trồng lúa là nhóm nghề nguy cơ; ủ bệnh trung bình 7–12 ngày (3 ngày đến 1 tháng); ho khan ở 20–57% người bệnh; phát ban ít gặp, khi có ban nên nghĩ tới sốt xuất huyết; hội chứng xuất huyết phổi nặng tử vong trên 50%. Lưu ý: hệ số OR 5,29 trong bài là nguy cơ khi sống cùng nhà với người bệnh Leptospira, không phải tiếp xúc chuột (bản nháp lượt A ghi nhầm)."
