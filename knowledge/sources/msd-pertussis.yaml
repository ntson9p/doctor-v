notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần b) tải lại trang ngày 31/10/2026 (rà soát toàn bộ 6/2024, cập nhật 9/2026); lượt A, lượt B đã đọc trước đó. Gặp nhiều ở trẻ em, vị thành niên; lây cho từ 80% người tiếp xúc gần, chủ yếu ở giai đoạn viêm long và đầu giai đoạn cơn. Giai đoạn viêm long: hắt hơi, chảy nước mắt, chán ăn, ho khan về đêm rồi cả ngày; có thể khàn tiếng; sốt hiếm. Sau 10–14 ngày vào giai đoạn cơn: từ 5 tiếng ho liền trong một hơi thở ra rồi hít vào rít; nôn là đặc trưng; ở nhũ nhi cơn nghẹn (có hay không tím) có thể nhiều hơn tiếng rít. Hồi phục thường trong 4 tuần từ khi khởi bệnh; trung bình bệnh khoảng 7 tuần (3 tuần đến hơn 3 tháng). Giai đoạn viêm long khó phân biệt với viêm phế quản, cúm. Kháng sinh ở giai đoạn viêm long giúp bệnh nhẹ hơn; sau đó chủ yếu để hạn chế lây."
