notes_vi: "Lượt C (Giai đoạn 3 lô 3) tải lại trang ngày 31/10/2026; lượt B đã mở trước đó. Lao phổi hoạt động có thể chỉ mệt, chán ăn, sụt cân tăng dần trong vài tuần; ho kéo dài là triệu chứng hay gặp nhất, lúc đầu ít đờm vàng hoặc xanh vào buổi sáng, rồi nhiều đờm hơn; ho ra máu hiếm, do hang lao. Sốt nhẹ thường gặp nhưng không phải ai cũng có; mồ hôi đêm nhiều là triệu chứng kinh điển nhưng không đặc hiệu; khó thở khi tổn thương nhu mô, tràn khí hoặc tràn dịch màng phổi. Nghi lao khi sốt, ho trên 2–3 tuần, ho ra máu, mồ hôi đêm, sụt cân, nổi hạch hoặc có phơi nhiễm. Ở Mỹ năm 2023, đái tháo đường là yếu tố nguy cơ y khoa hay gặp nhất (23,4% người lao), hút thuốc lá (đang hoặc đã từng) 31%."
