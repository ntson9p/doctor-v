notes_vi: "Lượt C đọc toàn văn (PMC11877276) qua API Europe PMC (www.ebi.ac.uk/europepmc/webservices/rest). 67 nghiên cứu, phần lớn tuyển người có triệu chứng hô hấp cấp hoặc nghi cúm. Bảng 3 (độ nhạy): sốt tự cảm thấy hoặc đo 0,87; viêm mũi (coryza) 0,76; chảy nước mũi 0,70; rét run 0,61; ho 0,92; nghẹt mũi 0,69; mệt 0,69; đau cơ 0,59; chán ăn 0,51; đau đầu 0,65; đau khớp 0,29; đau ngực 0,25; đau họng 0,57 (độ đặc hiệu 0,48); phát ban 0,04; tiêu chảy 0,14. Mệt nhạy hơn nhiều ở người lớn so với trẻ dưới 5 tuổi (0,82 và 0,27); mệt và đau cơ kém nhạy ở trẻ dưới 5 tuổi."
