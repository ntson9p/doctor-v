notes_vi: "Lượt C lô 3 đọc toàn văn bản thảo tác giả trên PMC. Nghiên cứu bậc 1 (O'Shea 1988, 2521 trẻ đau bụng ở cấp cứu, 10% viêm ruột thừa), Bảng 2: sốt độ nhạy 0,75 (LR+ 3,4; LR− 0,32); nôn 0,79; tiêu chảy 0,33 (LR+ 2,6); buồn nôn 0,29 và chán ăn 0,21 (tác giả ghi là giá trị không chắc chắn); tiểu buốt 0 (đặc hiệu 0,97). Đau chuyển xuống hố chậu phải LR+ 1,9–3,1 (độ nhạy 0,45–0,68); đau hố chậu phải LR+ 1,2, LR− 0,56; đau khi ho, nhảy hoặc gõ: độ nhạy 0,78; đi lại khó khăn: 0,80 (Kharbanda 2005). Thời gian đau trên hay dưới 24 giờ không làm đổi khả năng bệnh. Trẻ dưới 4 tuổi: thủng ruột thừa 80–100%."
