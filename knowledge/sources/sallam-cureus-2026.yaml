notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần c) đọc lại tóm tắt qua API Europe PMC ngày 31/10/2026; lượt B đã đọc trước đó. 6 nghiên cứu hồi cứu, 14.871 trẻ dưới 19 tuổi đau ngực đến cấp cứu ở 5 nước (tổng hợp mô tả, không gộp số): không rõ nguyên nhân 24,4–45,4%; cơ xương 4,7–33,0%; hô hấp 2,9–17,7%; tâm lý 6,0–21,6%; tim 0,9–1,5% ở nhóm không chọn lọc (7,1% ở nhóm được xe cấp cứu chở đến); nhập viện 0,3–7,2%; tử vong dưới 0,2%. Tạp chí Cureus, chất lượng trung bình: dùng bậc B."
