notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần b) đọc lại toàn văn (PMC11140950) qua API Europe PMC ngày 31/10/2026; lượt B đã đọc trước đó. 531 người trên 16 tuổi đến khoa cấp cứu Bern vì phản vệ độ II–IV (Ring và Messmer; loại người chỉ có triệu chứng da), 2013–2018; tuổi trung vị 38, nữ 53,3%; độ II 68,5%, độ III 30,5%, độ IV 0,9%. Tác nhân nghi ngờ: thuốc 31,8%, thức ăn 25,6%, côn trùng 17,1%. Bảng 3: da 88,7% (phù mạch 44,4%, mề đay 36,2%, đỏ da khu trú và khác 40,7%); hô hấp 70,2% (khó thở, co thắt phế quản, khò khè 68,0%; hen nặng lên 6,4%; nghẹt mũi 3,8%; chảy mũi 3,2%; ho, đau họng và khác 14,9%); tim mạch 46,1% (huyết áp tâm thu dưới 100 mmHg 19,2%; mạch trên 100 lần/phút 14,5%; ngất 10,0%; chóng mặt, vã mồ hôi lạnh, rét run, đau ngực và khác 21,5%); tiêu hóa 31,1% (buồn nôn 15,3%, nôn 9,6%, đau bụng 8,9%, tiêu chảy 5,8%). Thời gian từ tiếp xúc đến triệu chứng: dưới 30 phút 46,5%, 30–120 phút 6,4%, trên 120 phút 9,2%, không rõ 36,9%. Phần bàn luận: phản vệ chiếm 0,04–0,96% lượt đến cấp cứu ở các nghiên cứu; tỷ lệ mắc toàn cầu 50–112 trên 100.000 người-năm."
