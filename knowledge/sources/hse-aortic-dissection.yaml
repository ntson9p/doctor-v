notes_vi: "Lượt R lô 3 vòng 2 thêm thay cho nhs-aortic-dissection (trang NHS đã bị gỡ, lỗi 404). Đã tải trực tiếp hai trang Overview và Symptoms ngày 31/10/2026 (rà soát lần cuối 17/02/2026). Triệu chứng chính: đau ngực hoặc lưng dữ dội, có thể như xé, như rách; có thể đau bụng; dễ nhầm với viêm dạ dày, đau do phổi hoặc nhồi máu cơ tim. Dấu hiệu thường gặp: đau ngực hoặc lưng trên đột ngột, dữ dội, có thể lan lên cổ hoặc dọc lưng; đau bụng đột ngột dữ dội; mất ý thức; khó thở; nói khó, mất thị lực, yếu hoặc liệt nửa người như đột quỵ; mạch một bên tay hoặc đùi yếu hơn bên kia; đau chân, bụng, hông; đi lại khó; da vã mồ hôi, lạnh ẩm. 'Call 112 or 999 or go to your nearest emergency department now' khi có bất kỳ dấu hiệu nào. Bệnh hiếm, là cấp cứu; thường tử vong nếu không được chẩn đoán, điều trị sớm."
