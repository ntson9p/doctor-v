notes_vi: "Lượt C (Giai đoạn 3 lô 3) tải lại trang ngày 31/10/2026 (rà soát lần cuối 18/8/2026, hẹn rà soát 18/8/2029). Viêm phế quản thường do nhiễm trùng, thường tự khỏi sau khoảng 3 tuần. Triệu chứng giống cảm lạnh, cúm: ho (có thể có đờm), đau ngực khi ho, khó thở, đau họng, sổ mũi, sốt. Tự chăm sóc: nghỉ ngơi, uống đủ nước, mật ong pha nước ấm (không cho trẻ dưới 1 tuổi), che miệng khi ho, rửa tay, không hút thuốc. 'Urgent GP / 111': ho trên 3 tuần không đỡ; ho ra máu hoặc đờm lẫn máu; đau ngực từng cơn hoặc khi thở, khi ho; trên 65 tuổi; có thai; bệnh mạn tính (đái tháo đường, tim, phổi, thận); suy giảm miễn dịch; quá mệt; khó thở. 'Call 999': khó thở đến mức không nói được; môi, da tái, tím, xám; đột ngột lú lẫn; trẻ nhỏ không đánh thức được hoặc mềm nhũn."
