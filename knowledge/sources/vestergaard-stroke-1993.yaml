notes_vi: "Lượt C đọc tóm tắt qua API Europe PMC (lượt B đặt ID 'vestergaard-1993-headache-stroke'). 238 người đột quỵ cấp dưới 81 tuổi giao tiếp được: 27% đau đầu (từ 3 ngày trước đến 3 ngày sau đột quỵ); xuất huyết não 50%, nhồi máu 26%, nhồi máu ổ khuyết 15%; hay gặp hơn ở tuần hoàn sau; đau một bên thường cùng bên tổn thương."
