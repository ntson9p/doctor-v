notes_vi: "Mẫu đại diện quốc gia các lượt cấp cứu ở Mỹ 1993–2005 (NHAMCS): chóng mặt chiếm 3,3% lượt cấp cứu; nữ 61,4%. Nhóm chẩn đoán: tai – tiền đình 32,9%, tim mạch 21,1%, hô hấp 11,5%, thần kinh 11,2% (gồm 4% mạch máu não), chuyển hóa 11,0%, tiêu hóa 7,0%. Bảng 4 (tỷ lệ trong lượt chóng mặt): ngất phế vị 6,6%, viêm dây thần kinh tiền đình hoặc viêm mê đạo 5,6%, chóng mặt tư thế kịch phát lành tính 0,7%, đau nửa đầu 1,1%, hạ huyết áp tư thế 0,6%, hoảng sợ 0,5%; rối loạn nước – điện giải 5,6%, rối loạn nhịp 3,2%, cơn thiếu máu não thoáng qua 1,7%, thiếu máu 1,6%, hạ đường huyết 1,4%, đột quỵ hoặc chảy máu não 0,5%, ngộ độc khí CO 0,2% (16 ca, ước lượng không ổn định). Bệnh nguy hiểm định trước chiếm 15%, nhiều hơn ở người trên 50 tuổi (20,9% so với 9,3%)."
