notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần c) đọc lại tóm tắt qua API Europe PMC ngày 31/10/2026; lượt A đã đọc trước đó. Cơ sở dữ liệu nằm viện toàn quốc Pháp 2008–2011, người từ 14 tuổi nằm viện vì tràn khí màng phổi không do chấn thương: 59.637 lượt nằm viện của 42.595 người; khoảng 22,7 ca/100.000 dân mỗi năm; tỷ số nữ/nam 1/3,3; tuổi trung bình nữ 41, nam 37; 28% nằm viện lại trong 4 năm; không thay đổi theo mùa."
