notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần b) đọc lại toàn văn (PMC13202145) qua API Europe PMC ngày 31/10/2026; lượt A đã đọc trước đó. 423 người từ 18 tuổi nhập Bệnh viện Đa khoa Trung ương Cần Thơ vì suy tim cấp (5–12/2024), tuổi trung bình 69,7, nam 48%. Bảng 1 (theo nhóm chloride): tăng huyết áp 79–85%, đái tháo đường 25–35%, bệnh mạch vành 23–35%, rung nhĩ 0–7%. Tử vong trong viện 5,0%, sau 30 ngày 17,1%."
