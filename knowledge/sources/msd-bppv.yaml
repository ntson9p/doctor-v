notes_vi: "Lượt C mở lại trang (rà soát toàn bộ và cập nhật 10/2025). Nguyên nhân hay gặp nhất của chóng mặt tai trong tái diễn; mắc trọn đời 2,4% (điều tra ở Đức); nữ nhiều hơn; tăng theo tuổi, làm người cao tuổi dễ ngã. Cơn quay ngắn khi cử động đầu (trở mình, cúi nhặt đồ), kéo dài vài giây đến vài phút, hay nặng vào buổi sáng; có thể buồn nôn, nôn; không nghe kém, không ù tai. Chẩn đoán dựa vào triệu chứng điển hình, nghiệm pháp Dix-Hallpike và khám thần kinh không có bất thường khác; thính lực thường bình thường. Thường tự hết sau vài tuần đến vài tháng, có thể tái lại. Điều trị bằng thủ thuật đưa sỏi tai về chỗ cũ (Epley, Semont, bài tập Brandt-Daroff); không khuyên dùng thuốc thường quy."
