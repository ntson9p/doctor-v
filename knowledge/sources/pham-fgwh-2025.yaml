notes_vi: "Lượt C đọc toàn văn PMC12714984 qua API Europe PMC. 341 nữ sinh viên điều dưỡng Trường Đại học Y Hà Nội (01/2024): đau bụng kinh nguyên phát 78,6%, 68,7% đau vừa đến nặng. Trong 268 người có đau: bắt đầu ngày đầu có kinh 69,8%, trước 1 ngày 20,1%, trước từ 2 ngày 6,0%; kéo dài vài giờ 21,3%, 1 ngày 42,2%, từ 2 ngày 33,2%; đau bụng dưới 97,0%, đau thắt lưng 67,8%, mệt 60,3%, tiêu chảy 13,1%, đau đầu 12,7%, buồn nôn 12,0%, mất ngủ 11,2%, chóng mặt 10,5%; mức nhẹ 30,6%, vừa 50,7%, nặng 18,7%; chỉ 2,6% chỉ dùng thuốc, 50% không làm gì để giảm đau."
