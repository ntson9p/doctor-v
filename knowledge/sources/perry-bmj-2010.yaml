notes_vi: "Lượt C đọc toàn văn PMC2966872 qua API Europe PMC. 6 khoa cấp cứu ở Canada (2000–2005): 1.999 người lớn tỉnh táo, không có dấu hiệu thần kinh khu trú, đau đầu không do chấn thương đạt đỉnh trong 1 giờ; 130 người (6,5%) xuất huyết dưới nhện. Bảng 2 (có so với không xuất huyết dưới nhện): tuổi trung bình 54,4 so với 42,6; đau đầu dữ dội nhất đời 93,1% so với 77,5%; thời gian đến đỉnh trung bình 3,4 so với 9,2 phút; mất ý thức 16,9% so với 4,5%; than đau hoặc cứng cổ 71,1% so với 30,9%; nôn 58,6% so với 26,3%; khởi phát khi gắng sức 23,1% so với 10,7%; cứng gáy khi khám 30,4% so với 5,2%; nhiệt độ trung bình 36,3 so với 36,4°C; huyết áp trung bình 159/88 so với 141/81 mmHg (độ lệch chuẩn tâm thu 29,3). Chẩn đoán cuối cùng ở cả nhóm: đau đầu lành tính 54,1%, đau nửa đầu 27,3%."
