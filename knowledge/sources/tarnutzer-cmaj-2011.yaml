notes_vi: "Tổng quan hệ thống về hội chứng tiền đình cấp (chóng mặt khởi phát cấp kèm buồn nôn hoặc nôn, đi không vững, rung giật nhãn cầu, không chịu được cử động đầu, kéo dài từ 1 ngày), bối cảnh cấp cứu và bệnh viện. Tác giả gộp viêm dây thần kinh tiền đình và viêm mê nhĩ thành nguyên nhân ngoại biên vì hai tên gọi thường dùng lẫn cho nhau. Ước tính khoảng 25% ± 15% hội chứng tiền đình cấp ở cấp cứu do đột quỵ. Bảng 3: kiểu chóng mặt (quay hay không quay) và yếu tố làm tăng (cử động đầu) không giúp phân biệt; một cơn báo trước trong 48 giờ gặp ở 1/4 người bệnh dù nguyên nhân nào, còn nhiều cơn báo trước gợi ý đột quỵ; đau đầu hoặc đau cổ 38% ở nguyên nhân trung ương so với 12% ở ngoại biên (LR+ 3,2); nhìn đôi, nói khó gợi ý đột quỵ; tuổi trên 50 dự báo mạnh nhưng 25% đột quỵ xảy ra dưới 50 tuổi; có yếu tố nguy cơ mạch máu làm tăng nguy cơ. Thất điều thân nặng (không tự ngồi được) 33% ở đột quỵ so với 0% ở viêm dây thần kinh tiền đình, và là dấu hiệu rõ duy nhất ở 29% người đột quỵ; nhiều dấu hiệu trung ương không rõ với người không chuyên; không kể dấu hiệu vận nhãn và thất điều nặng, không có dấu hiệu thần kinh chỉ loại trừ khoảng 1/5 đột quỵ. 67% nhồi máu động mạch tiểu não trên không tự đứng, đi được. Mất thăng bằng khi đến khám OR 3,71 (Kerber 2006). Nghe kém một bên thường do tổn thương ngoại biên nhưng gặp cả trong nhồi máu động mạch tiểu não trước dưới; số liệu về nghe kém trong bệnh ngoại biên thiếu tin cậy (một nghiên cứu 33%, một nghiên cứu cũ 31% có ù tai hoặc đầy tai)."
