notes_vi: "Văn bản hành chính. URL là cơ sở dữ liệu văn bản pháp luật (caselaw.vn); Quyết định ký ngày 30/12/2020 (KT. Bộ trưởng, Thứ trưởng Nguyễn Trường Sơn), thay thế 3319/QĐ-BYT ngày 19/7/2017; cần thay bằng bản chính thức. Phần 6 'Hạ đường huyết': biến chứng cấp tính thường gặp ở người đái tháo đường; người dùng insulin, sulfonylurea cần được theo dõi, hướng dẫn nhận biết cơn vì có thể không nhận biết được cơn; người tỉnh, tự uống được (glucose dưới 3,9 mmol/L) thì uống 15–20 g glucose hoặc thức ăn có đường, thử lại sau 15 phút, nhắc lại nếu còn thấp, rồi ăn nhẹ ngay để tránh tái phát; người có nhiều cơn hoặc cơn nặng cần rà soát phác đồ. Phân mức: mức 1 từ 3,0 đến dưới 3,9 mmol/L; mức 2 dưới 3,0 mmol/L; mức 3 là hạ đường huyết nặng có rối loạn ý thức hoặc thay đổi toàn thân, cần xử trí cấp cứu. Xử trí cấp cứu: rối loạn ý thức do thiếu glucose não có thể mất một thời gian mới hồi phục hoàn toàn; người dùng insulin tác dụng chậm hoặc sulfonylurea cần được theo dõi trong bệnh viện. Phần thuốc insulin (tác dụng phụ): hạ glucose máu là biến chứng hay gặp nhất khi tiêm insulin (quá liều, bỏ bữa hoặc ăn muộn sau tiêm, vận động nhiều); dấu hiệu sớm: đói, bồn chồn, hoa mắt, vã mồ hôi, tay chân lạnh; khoảng 3 mmol/L: tim đập nhanh, hồi hộp, đổ mồ hôi, lạnh run, buồn nôn, đói; dưới 2,8 mmol/L: bứt rứt, lú lẫn, nhìn mờ, mệt mỏi, nhức đầu, nói khó; thấp hơn nữa: hôn mê, co giật."
