notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần b) đọc lại tóm tắt qua API Europe PMC ngày 31/10/2026; lượt A, lượt B đã đọc trước đó. 279 trẻ 5–15 tuổi đi khám bác sĩ gia đình (Anh) vì ho kéo dài 2–8 tuần: 56 trẻ (20%, khoảng tin cậy 95% 16–25%) có bằng chứng mới nhiễm ho gà, gồm 39/215 trẻ (18%) đã tiêm đủ; nguy cơ 40% khi mũi nhắc trước tuổi đi học đã cách từ 7 năm. Bốn trong sáu trẻ được đếm ho trên 400 lần trong 24 giờ."
