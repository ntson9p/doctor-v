notes_vi: "Văn bản hành chính. URL là bản đăng lại trên trang thứ cấp (vnras.com) có toàn văn Quyết định ký ngày 31/8/2015 (KT. Bộ trưởng, Thứ trưởng Nguyễn Thị Xuyên); cần thay bằng bản chính thức. Chưa thấy văn bản thay thế. Bài 33 'Ngộ độc khí carbon monoxide (CO)': mục 1: tỷ lệ mắc và tử vong khá cao, chẩn đoán và xử trí cần nhanh chóng, tích cực; thai nhi đặc biệt nhạy cảm. Mục 2.2: ở Việt Nam hay gặp do đốt than (nhất là bếp than tổ ong), củi, gỗ, khí gas trong phòng kín hoặc thiếu thông khí để nấu ăn, sưởi ấm, đun nước (bình nóng lạnh chạy gas trong nhà tắm); chạy máy phát điện, động cơ trong phòng kín; cháy nhà. Mục 3.1: thường nhiều người trong nhà cùng bị, cả vật nuôi; khởi đầu bằng đau đầu, mệt mỏi, chóng mặt, buồn nôn, nhìn mờ, rối loạn hành vi, nặng hơn là hôn mê; tổn thương cơ tim, loạn nhịp 5–6%. Mục 3.3: chẩn đoán dựa vào tiền sử tiếp xúc nguồn khí CO kèm lâm sàng và HbCO. Mục 3.4: ngộ độc nhẹ dễ lầm với cảm cúm, nhất là về mùa đông; ngộ độc vừa dễ nhầm với ngộ độc thức ăn, đau thắt ngực không ổn định. Mục 3.5: dạng thần kinh – tâm thần khởi đầu đi loạng choạng, rối loạn thị giác; trẻ em, đôi khi người lớn, khởi đầu bằng co giật; người già khởi đầu bằng lẫn lộn. Mục 4: đưa khỏi nguồn độc (người cứu mở thông thoáng trước khi vào), thở oxy càng sớm càng tốt; oxy cao áp trong 24 giờ (tốt nhất 4–6 giờ) khi mất ý thức, có thai, toan nặng. Mục 5: tổn thương thần kinh muộn 2–40 ngày sau."
