notes_vi: "Lượt R lô 3 vòng 2 tải trang trực tiếp ngày 31/10/2026 (rà soát lần cuối 08/12/2023, hẹn rà soát 08/12/2026). Ho thường tự hết trong 3–4 tuần; phần lớn do cảm lạnh, cúm. Không có mục 'Call 999'. 'Urgent GP / 111': ho rất nặng hoặc nặng lên nhanh (ho dồn dập, không dừng được); thấy rất mệt; đau ngực; sưng đau một bên cổ (hạch); khó thở; ho ra máu. 'See a GP' (không khẩn): ho trên 3 tuần; sụt cân không rõ lý do; suy giảm miễn dịch (hóa trị, đái tháo đường). Kháng sinh thường không cần cho ho."
