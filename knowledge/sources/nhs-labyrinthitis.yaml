notes_vi: "Lượt C mở lại trang (rà soát lần cuối 06/8/2026, hạn rà soát 06/8/2029). Hai bệnh nhiễm trùng tai trong ảnh hưởng thăng bằng, thường tự đỡ trong vài tuần, thường do nhiễm vi rút như cảm lạnh, cúm. Viêm mê nhĩ: chóng mặt quay, đứng không vững, buồn nôn hoặc nôn, nghe kém, ù tai; viêm dây thần kinh tiền đình rất giống nhưng không nghe kém, không ù tai; nếu thính lực bị ảnh hưởng thì là viêm mê nhĩ. Triệu chứng có thể bắt đầu đột ngột, có khi có ngay lúc thức dậy, thường đỡ sau vài ngày; thăng bằng hồi phục sau 2–6 tuần, có khi lâu hơn. Tự chăm sóc: nằm yên trong phòng tối khi chóng mặt nhiều, uống nước ít một và nhiều lần nếu nôn, tránh tiếng ồn và ánh sáng mạnh, ngủ đủ, sớm tập đi bộ ngoài trời có người đi kèm; không lái xe, đi xe đạp, dùng máy khi chóng mặt; không uống rượu. Khám không khẩn khi sau vài ngày không đỡ hoặc nặng lên; khám khẩn hoặc gọi 111 khi đột ngột nghe kém một tai. Trang không có mục gọi 999 hay đến cấp cứu."
