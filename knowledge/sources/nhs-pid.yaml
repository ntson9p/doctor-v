notes_vi: "Lượt C mở trang (rà soát lần cuối 17/12/2025). Triệu chứng: đau vùng chậu hoặc bụng dưới, đau sâu khi quan hệ, kinh nhiều hoặc đau bất thường, ra máu giữa kỳ kinh hoặc sau quan hệ, khí hư bất thường; không phải ai cũng có triệu chứng. Khám khẩn (bác sĩ gia đình hoặc 111) khi nghi bệnh, đau vùng chậu lúc có lúc không, hoặc có thai. Gọi 999 hoặc đến cấp cứu khi đau vùng chậu dữ dội hoặc nặng dần, đau bụng dưới đột ngột dữ dội, đau dưới sườn phải và vai phải, choáng, sốt rất cao, nôn."
