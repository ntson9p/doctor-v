notes_vi: "Lượt C mở trang (rà soát toàn bộ 6/2026). Đau bụng kinh nguyên phát thường bắt đầu trong vòng 1 năm sau lần có kinh đầu, giảm dần theo tuổi và sau lần mang thai đầu. Đau bắt đầu khi hành kinh hoặc trước 1–3 ngày, nặng nhất sau khoảng 24 giờ, giảm sau 2–3 ngày; đau quặn từng cơn trên nền đau âm ỉ bụng dưới, có thể lan ra lưng, đùi. Có thể kèm mệt, buồn nôn, nôn, tiêu chảy hoặc táo bón, đau thắt lưng, đau đầu, tiểu nhiều lần. Gợi ý nguyên nhân khác: đau mới, đột ngột hoặc liên tục, sốt, khí hư có mủ, dấu hiệu viêm phúc mạc; đau khi giao hợp gợi ý lạc nội mạc tử cung. Cần thử thai cho mọi phụ nữ tuổi sinh đẻ đau vùng chậu."
