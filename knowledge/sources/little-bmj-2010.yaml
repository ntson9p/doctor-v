notes_vi: "Lượt C lô 3 đọc toàn văn trên PMC. 839 phụ nữ không có thai nghi nhiễm khuẩn tiết niệu dưới chưa biến chứng ở chăm sóc ban đầu (Anh); loại trừ người có buồn nôn, nôn hoặc triệu chứng toàn thân nặng. Trong 511 người có nhật ký đầy đủ, tỷ lệ có triệu chứng ở mức khá khó chịu trở lên: tiểu nhiều lần ban ngày 78%, tiểu buốt 64%, tiểu gấp 63%, tiểu đêm 57%, đau bụng 47%, tiểu máu 16%. Triệu chứng bắt đầu trung vị 3 ngày trước khi khám (tứ phân vị 3–7); 13% trên 10 ngày; 71% đã từng bị viêm bàng quang."
