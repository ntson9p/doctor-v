notes_vi: "Lượt C đọc tóm tắt qua API Europe PMC (lượt B đặt ID 'yen-2011-piers-symptoms'). Nghiên cứu PIERS đa trung tâm, 2.023 phụ nữ tiền sản giật: 52% có ít nhất một triệu chứng (buồn nôn hoặc nôn nặng, đau đầu, rối loạn thị giác, đau hạ sườn phải hoặc thượng vị, đau bụng hoặc ra máu âm đạo, đau ngực hoặc khó thở); không triệu chứng đơn lẻ nào dự báo tốt biến chứng."
