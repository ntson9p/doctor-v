notes_vi: "Lượt C đọc toàn văn (PMC3702433) qua API Europe PMC (www.ebi.ac.uk/europepmc/webservices/rest). Nha Trang 2009–2010, người từ 15 tuổi nhập viện: tỷ suất viêm phổi cộng đồng nhập viện 0,81/1.000 người-năm; nhóm từ 65 tuổi 4,6/1.000, gấp khoảng 10 lần nhóm trẻ hơn (0,48/1.000). Thời gian từ khởi phát đến nhập viện trung bình 4,2 ngày (có vi khuẩn) và 2,7 ngày (không có vi khuẩn)."
