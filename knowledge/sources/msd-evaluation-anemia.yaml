notes_vi: "Lượt C mở lại trang (rà soát toàn bộ 5/2024, cập nhật 9/2024). Triệu chứng và dấu hiệu: mệt, yếu, khó thở khi gắng sức, da xanh; ngoài ra buồn ngủ, đau thắt ngực, ngất, chóng mặt quay, nhức đầu, ù tai theo nhịp mạch, mất kinh. Triệu chứng không nhạy, không đặc hiệu; thường xuất hiện khi huyết sắc tố giảm nhiều so với mức nền của người đó, rõ hơn khi dự trữ tim phổi kém hoặc thiếu máu xảy ra nhanh. Da xanh hay gặp khi thiếu máu nặng (Hb dưới 7 g/dL). Phân đen, chảy máu mũi, nôn ra máu, rong kinh gợi ý chảy máu; sụt cân gợi ý ung thư."
