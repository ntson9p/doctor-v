notes_vi: "Lượt C đọc tóm tắt qua API Europe PMC. 736 người nhồi máu não nhập Trung tâm Đột quỵ Đại học Kentucky (2014): 14,1% không có triệu chứng FAST (méo mặt, yếu tay, nói khó) khi đến viện; trong số này 42% có mất thăng bằng khi đi hoặc yếu chân, 40% có triệu chứng thị giác, 70% có ít nhất một trong hai; thêm hai nhóm này (BE-FAST) giảm tỷ lệ bỏ sót còn 4,4%."
