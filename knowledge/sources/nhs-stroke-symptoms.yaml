notes_vi: "Lượt C mở trang (rà soát lần cuối 12/9/2024). FAST: méo mặt, yếu tay, nói khó, gọi 999. Triệu chứng khác: yếu hoặc tê một bên người, nhìn mờ hoặc mất thị lực, khó nói hoặc tìm từ, lú lẫn và quên, chóng mặt hoặc ngã, đau đầu dữ dội, buồn nôn hoặc nôn. Gọi 999 kể cả khi triệu chứng đã tự hết; không tự lái xe đến cấp cứu."
