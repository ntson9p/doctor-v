notes_vi: "Lượt C mở trang (rà soát lần cuối 10/3/2026). Đau đầu theo nhịp mạch, thường một bên, có thể dữ dội, tăng khi vận động; kèm buồn nôn, nôn, nhạy cảm với ánh sáng và tiếng ồn; tiền triệu (đường zíc zắc, chớp sáng, tê bì, chóng mặt, khó nói) không quá 1 giờ; cơn thường kéo dài 4 giờ đến 3 ngày. Khi lên cơn nên nằm nghỉ trong phòng tối; không dùng thuốc giảm đau quá 2 ngày mỗi tuần. Yếu tố khởi phát: kinh nguyệt, lo âu, căng thẳng, mệt mỏi, bỏ bữa, nhiều cà phê. Khám khẩn khi cơn quá 72 giờ, tiền triệu quá 1 giờ, đang có thai hoặc mới sinh; gọi 999 khi đau đột ngột cực kỳ dữ dội, nói khó, mất thị lực hoặc nhìn đôi, li bì, lú lẫn, co giật, yếu một bên."
