notes_vi: "Lượt C (phần b) mở trang ngày 25/10/2026. Cường giáp gặp ở khoảng 1% dân Mỹ, hay gặp ở nữ 20–50 tuổi; Basedow là nguyên nhân hay gặp nhất; yếu tố nguy cơ: nữ, tuổi cao, hút thuốc. Triệu chứng: hồi hộp, mệt, sụt cân, sợ nóng, lo âu, run; bồn chồn, tăng tiết mồ hôi, ăn nhiều, mất ngủ, yếu cơ, đi ngoài nhiều lần (đôi khi tiêu chảy); dấu hiệu: da ấm ẩm, run, tim nhanh, rung nhĩ; có thể có bướu giáp hoặc nhân. Người cao tuổi, nhất là bướu nhân độc, có thể biểu hiện không điển hình (thể vô cảm): phần lớn không lồi mắt, không run; hay có rung nhĩ, ngất, rối loạn ý thức, suy tim, yếu. Lồi mắt thâm nhiễm chỉ có ở Basedow. Cơn bão giáp hiếm, nguy hiểm tính mạng: sốt, yếu nhiều, vật vã, lú lẫn, nôn, tiêu chảy, tim nhanh, có thể sốc."
