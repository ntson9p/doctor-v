notes_vi: "Lượt C (Giai đoạn 3 lô 3) đọc lại toàn văn (PMC7678343) qua API Europe PMC ngày 31/10/2026; lượt B đã đọc trước đó. Sổ đăng ký u ngực toàn quốc Tây Ban Nha, hơn 50 bệnh viện, 9.876 người ung thư phổi (74,3% nam, tuổi trung vị 65; chưa từng hút thuốc 11,9%, đã bỏ 46,9%, đang hút 40,1%), 2016–2019. Bảng 1, triệu chứng lúc chẩn đoán: ho 33,9%, khó thở 26,7%, đau 23,8%, sụt cân 21,0%, ho ra máu 11,3%, mệt 10,0%, chán ăn 6,1%, thay đổi giọng 3,2%; không triệu chứng 31,5%. 59% ca giai đoạn I và 27,7% ca giai đoạn IV không có triệu chứng."
