notes_vi: "Lượt C mở lại trang bài (phụ bản). Hồi cứu hồ sơ điện tử 2016–2018 ở Bệnh viện Đa khoa tỉnh Lâm Đồng: 483 người đái tháo đường típ 2 nằm viện có triệu chứng hạ đường huyết (glucose dưới 3,3 mmol/L). Triệu chứng chính là vã mồ hôi (83%) và li bì (70%); khoảng một nửa có chóng mặt, mệt yếu, kích động, lú lẫn, đói nhiều; co giật, đau đầu, mất ý thức mỗi loại dưới 25% (số chi tiết chỉ có trong hình). Liên quan thuốc uống 32,3%, insulin 18%, phối hợp 13,5%. Hạn chế lớn: bài phụ bản, cách tính tỷ lệ không rõ, bối cảnh nằm viện; chỉ dùng tham khảo, bậc C."
