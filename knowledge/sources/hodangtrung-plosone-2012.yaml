notes_vi: "Lượt C (Giai đoạn 3, lô 2, phần b) mở lại ngày 27/10/2026 (bản ghi và toàn văn PMC3360608 qua API Europe PMC). 1.241 người nghi nhiễm trùng thần kinh trung ương ở 13 bệnh viện tỉnh miền Trung, miền Nam (8/2007–4/2010). Bảng 2: người lớn viêm màng não vi khuẩn 302 (49%), viêm não hoặc viêm màng não do vi rút 209 (34%); trẻ em 150 (24%) và 432 (69%). Vi rút viêm não Nhật Bản gây 142/432 (33%) ca do vi rút ở trẻ em, gần 40% ở nhóm 1–14 tuổi, ít ở dưới 1 tuổi và từ 15 tuổi; ở người lớn dengue, vi rút đường ruột, herpes mỗi loại khoảng 10%. Tử vong trong viện 12% người lớn, 7% trẻ em."
