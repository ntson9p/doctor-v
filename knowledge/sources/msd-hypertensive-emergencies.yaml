notes_vi: "Lượt C (Giai đoạn 3, lô 2, phần b) mở lại ngày 27/10/2026 (tải trang). Tăng huyết áp cấp cứu: huyết áp rất cao (thường tâm thu từ 180 và/hoặc tâm trương từ 120 mmHg) kèm tổn thương cơ quan đích; triệu chứng thần kinh thay đổi nhanh (lú lẫn, mù vỏ não thoáng qua, liệt nửa người, co giật), đau ngực, khó thở. Huyết áp rất cao không có tổn thương cơ quan đích (tăng huyết áp khẩn cấp): biến chứng cấp ít xảy ra nên không cần hạ áp ngay, đánh giá điều trị ngoại trú; lo âu là nguyên nhân hay gặp nhất."
