notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần c) đọc lại toàn văn PMC3444903 qua API Europe PMC ngày 31/10/2026; lượt A, lượt B đã đọc trước đó (bản nháp ở nhiều thư mục, đã gộp). Đoàn hệ TOPIC (Thụy Sĩ, 59 bác sĩ đa khoa, 644 người đau ngực phân tích, theo dõi 12 tháng): hội chứng thành ngực 284 người (44,1%), tuổi trung bình 50,5 (cả nhóm 55,4); kiểm định ở Đức (1.212 người từ 35 tuổi). Đau tái hiện khi ấn: 201/284 (70,1%) người hội chứng thành ngực so với 299/644 (46,4%) cả nhóm; dấu hiệu quan trọng nhất nhưng không đặc hiệu tuyệt đối (có người đau thắt ngực ổn định). Bảng 3 (OR hội chứng thành ngực so với nguyên nhân khác): đau tái hiện khi ấn 6,47; không có tiền sử bệnh mạch vành 5,12; đau không sau xương ức 5,08; đau khu trú 2,65; đau không kiểu đè ép 2,37; liên quan tư thế 2,13; đau như dao đâm 2,11; liên quan cử động 2,06; liên quan hít thở 1,19 (không ý nghĩa); đau lan 0,78 (không ý nghĩa); kèm ho 0,83; liên quan ho 0,57; kèm triệu chứng tiêu hóa (trào ngược, nuốt đau, nuốt khó, đau thượng vị) 0,54."
