notes_vi: "Tiêu chuẩn của Hội Bárány: khởi phát cấp hoặc bán cấp chóng mặt quay hoặc không quay, liên tục, mức vừa đến nặng, kéo dài ít nhất 24 giờ rồi giảm dần trong nhiều ngày; không có triệu chứng thần kinh trung ương cấp hay triệu chứng tai cấp (nghe kém, ù tai, đau tai). Mức vừa nghĩa là còn đi được quãng ngắn; mức nặng là phải nằm. Triệu chứng hay gặp: chóng mặt tăng khi cử động đầu, nhìn nhòe do chuyển động, mất thăng bằng xu hướng ngã về bên tai bệnh, buồn nôn và thường nôn. Tới 25% có một cơn chóng mặt vài giờ trong 2 ngày trước; nếu cơn tái lại cần nghĩ bệnh Ménière, đau nửa đầu tiền đình, cơn thiếu máu não thoáng qua. Dịch tễ: mới mắc 3,5–15,5/100.000 người mỗi năm; trong hơn 36.000 người ở trung tâm chóng mặt, đứng thứ 6 trong các nguyên nhân chóng mặt và thứ 3 trong bệnh tiền đình ngoại biên (sau chóng mặt tư thế kịch phát lành tính và bệnh Ménière), kể cả ở trẻ em; tuổi khởi phát thường 30–60; không khác theo giới, không theo mùa; tái phát 1,9–10,7%. Căn nguyên viêm do tái hoạt vi rút HSV-1 là khả năng lớn nhất nhưng chưa chứng minh. Viêm mê nhĩ (labyrinthitis) là chẩn đoán phân biệt khi kèm đau tai, nghe kém hoặc ù tai."
