notes_vi: "Lượt C (Giai đoạn 3, lô 2, phần b) mở lại ngày 27/10/2026 (tải trang). Sốc nhiệt: thân nhiệt trên 40°C kèm thay đổi tri giác; có thể còn hoặc hết mồ hôi. Thể cổ điển cần 2–3 ngày phơi nóng, thường ở người cao tuổi ít vận động trong đợt nắng nóng, trẻ bị bỏ trong xe kín; thể gắng sức khởi phát nhanh ở người khỏe vận động nặng (vận động viên, bộ đội, công nhân). Da thể cổ điển thường nóng, khô; thể gắng sức có thể còn ướt mồ hôi."
