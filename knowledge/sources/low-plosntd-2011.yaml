notes_vi: "Lượt C đọc lại toàn văn qua API Europe PMC (PMC3104968). Nghiên cứu EDEN: 2.129 người lớn sốt dưới 72 giờ đến phòng khám ban đầu ở Singapore (2005–2010); 250 người (11,7%) mắc dengue. Bảng 3 (dengue so với bệnh sốt khác): đau đầu 80,0% / 68,7%; đau cơ 69,2% / 63,7%; đau khớp 60,8% / 42,6%; chán ăn 81,2% / 59,9%; đau bụng 11,6% / 14,7%; tiêu chảy 14,8% / 9,3%; nôn 16,4% / 8,4%; đau sau hốc mắt 26,0% / 15,9%; phát ban 9,6% / 3,6%; chảy máu 5,2% / 1,76%; nhiệt độ lúc khám trung vị 38,3°C. Bảng 7: đau sau hốc mắt 38–45% ở 18–35 tuổi, 10,5% từ 56 tuổi."
