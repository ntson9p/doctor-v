notes_vi: "Lượt C (Giai đoạn 3, lô 2, phần b) mở lại ngày 27/10/2026 (bản ghi và tóm tắt qua API Europe PMC; toàn văn không mở được). San Diego 2001–2019: 20 trẻ gốc Việt trong 978 ca Kawasaki; ngày chẩn đoán trung vị ngày 6 (gốc Việt), 5,5 (gốc châu Á khác), 7 (không phải châu Á); hạch cổ nổi rõ lúc chẩn đoán 20% (gốc Việt), 40% (châu Á khác), 12,5% (không phải châu Á); phình động mạch vành 60% ở trẻ gốc Việt so với 27,5%. Phỏng vấn bác sĩ Bệnh viện Nhi Đồng 1 gợi ý tỷ suất mắc và mức nặng cao ở trẻ Việt Nam (không có số)."
