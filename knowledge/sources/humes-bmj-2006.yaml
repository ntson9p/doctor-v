notes_vi: "Lượt C lô 3 đọc toàn văn trên PMC. Đau quặn quanh rốn tăng dần trong 24 giờ đầu, rồi đau liên tục và khu trú hố chậu phải; trình tự kinh điển chỉ có ở khoảng 50% người bệnh. Chán ăn thường nổi bật; buồn nôn thường có; nôn nhiều hiếm khi là đặc điểm chính của viêm ruột thừa chưa biến chứng; sốt đến khoảng 38°C hay gặp; tiêu chảy gặp ở khoảng 20% thể ruột thừa dưới manh tràng hoặc trong tiểu khung. Thủng 16–30% lúc đến khám, tới 97% ở người già và trẻ nhỏ; sau 36 giờ nguy cơ thủng tăng thêm khoảng 5% mỗi 12 giờ."
