notes_vi: "Lượt R lô 3 vòng 2 tải bản PDF có chữ ký (27 trang) đính kèm trang kcb.vn ngày 31/10/2026. Phần II (suy tim mạn), mục 1, Bảng 3: triệu chứng cơ năng điển hình gồm khó thở, cơn khó thở kịch phát về đêm, giảm khả năng gắng sức, mệt, phù mắt cá chân; ít điển hình gồm ho về đêm, thở rít, chướng bụng, chán ăn, lú lẫn ở người già, hồi hộp; thực thể kém đặc hiệu gồm tăng cân trên 2 kg/tuần, phù ngoại vi (mắt cá, cẳng chân), ran ở phổi. Mục 5: suy tim mạn có thể đột ngột mất bù (suy tim cấp), thường phải nhập viện. Phần III, mục 3: triệu chứng sung huyết của suy tim cấp gồm khó thở khi nằm, phù phổi, phù ngoại biên. Văn bản không nêu mức khẩn cho người dân tự đánh giá."
