notes_vi: "Lượt C lô 3 mở trang (rà soát 7/2024). Nguyên nhân hay gặp: dính ruột, thoát vị, khối u. Tắc ruột non: đau quặn quanh rốn hoặc thượng vị, nôn sớm, bí trung đại tiện khi tắc hoàn toàn; tắc không hoàn toàn có thể tiêu chảy. Tắc đại tràng: triệu chứng nhẹ, từ từ, táo bón tiến tới bí, chướng bụng; nôn muộn, ít. Thắt nghẹt gặp gần 25% tắc ruột non, có thể hoại tử sau 6 giờ; đau dữ dội liên tục gợi ý thắt nghẹt. Trang không nêu sốt là dấu hiệu thắt nghẹt. Người nghi tắc ruột cần nhập viện."
