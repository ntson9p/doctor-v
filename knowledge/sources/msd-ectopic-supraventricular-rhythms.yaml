notes_vi: "Lượt C (phần b) mở trang ngày 25/10/2026. Ngoại tâm thu nhĩ hay gặp, có thể ở tim bình thường, có hoặc không có yếu tố khởi phát (cà phê, rượu, thuốc thông mũi pseudoephedrine), hay gặp ở người bệnh phổi tắc nghẽn mạn; đôi khi gây hồi hộp. Ngoại tâm thu nhĩ thưa ở người khỏe thường lành tính; ngoại tâm thu nhĩ dày liên quan tăng nguy cơ đột quỵ, tử vong, rung nhĩ."
