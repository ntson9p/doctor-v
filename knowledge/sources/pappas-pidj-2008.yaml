notes_vi: "Lượt C đọc lại tóm tắt qua API Europe PMC (www.ebi.ac.uk/europepmc/webservices/rest). 81 đợt cảm lạnh ở trẻ tuổi đi học (nhật ký 10 ngày): dấu hiệu hay gặp nhất là ho, hắt hơi; triệu chứng hay gặp nhất là nghẹt mũi, sổ mũi; cảm giác sốt và đau đầu mỗi thứ 15% lúc khởi phát; 73% còn triệu chứng sau 10 ngày. Chưa đọc toàn văn."
