notes_vi: "Lượt C tải và đọc PDF toàn văn do thư viện điện tử Bệnh viện Đa khoa Trung ương Thái Nguyên lưu; trang quyết định ký ngày 29/01/2015 (Thứ trưởng Nguyễn Viết Tiến). Đã đối chiếu: Tiền sản giật – sản giật (tr. 29–32): gặp ở 2–8% thai phụ; tiền sản giật từ 140/90 mmHg sau tuần 20; tiêu chuẩn nặng gồm từ 160/110 mmHg, nhức đầu hay nhìn mờ, đau thượng vị hoặc hạ sườn phải; sản giật có thể xảy ra trước, trong chuyển dạ hoặc thời kỳ hậu sản; thể nhẹ chủ yếu điều trị ngoại trú. Viêm phần phụ (tr. 128–131): đau bụng dưới đột ngột, tăng khi đi lại, thường cả hai bên (90%); rối loạn kinh nguyệt 50%; mót rặn, tiểu khó 15–25%; sốt tới 39°C; có thể nôn hoặc buồn nôn; khí hư nhiều, có khi là mủ 39–65%; thể bán cấp 30% (sốt nhẹ 37,5–38°C); hội chứng Fitz-Hugh-Curtis đau hạ sườn phải. Chửa ngoài tử cung (tr. 135–140): chậm kinh nhiều khi không rõ vì ra máu trước thời điểm dự báo có kinh; ra máu ít một, sẫm màu, dai dẳng; đau ở vị trí khối chửa, có thể kèm mót rặn; có thể choáng ngất; phản ứng thành bụng khi có máu trong ổ bụng; là cấp cứu sản khoa. Văn bản không có bài đau bụng kinh. Chưa xác định được văn bản thay thế; lượt B nêu Quyết định 1154/QĐ-BYT (2024) về tăng huyết áp thai kỳ nhưng lượt C chưa tìm thấy văn bản này."
