notes_vi: "Lượt C (Giai đoạn 3 lô 3) đọc lại toàn văn (PMC6988682) qua API Europe PMC ngày 31/10/2026; lượt A đã đọc trước đó. 27.795 người ung thư phổi trong dữ liệu CPRD có liên kết ghi nhận ung thư, Anh, 2000–2017. Bảng 2 (triệu chứng có mã trong hồ sơ bác sĩ gia đình trong năm trước chẩn đoán, tổng cộng): có ít nhất một triệu chứng 17.661 (63,5%); ho 9.320 (33,5%); khó thở 7.539 (27,1%); đau ngực 3.846 (13,8%); ho ra máu 2.158 (7,8%); mệt 1.819 (6,5%); sụt cân 1.579 (5,7%); chán ăn 514 (1,8%). Số đếm theo mã chẩn đoán nên thấp hơn thực tế."
