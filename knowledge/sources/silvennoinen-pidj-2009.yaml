notes_vi: "Lượt C đọc lại tóm tắt qua API Europe PMC (www.ebi.ac.uk/europepmc/webservices/rest). 353 trẻ đến 13 tuổi bị cúm, điều trị ngoại trú (Phần Lan): 95% sốt, 50% sốt từ 39°C (trẻ dưới 3 tuổi: 20% từ 40°C); 77% ho; 78% viêm mũi. Trẻ 7–13 tuổi: đau đầu 39%, đau cơ 13%."
