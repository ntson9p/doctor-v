notes_vi: "Người bảo trì thêm khi soạn danh mục lô 3 (31/10/2026), chưa mở; lượt R xác minh. Lượt R lô 3 (31/10/2026) không mở được: mạng của phiên chặn ginasthma.org. Theo trí nhớ, GINA ra bản cập nhật mỗi năm vào khoảng tháng 5; vào ngày 31/10/2026 có thể đã có bản 2025 và 2026, nên khi xác minh cần đổi sang bản mới nhất (id mới, không sửa id này). Nhãn L3 (báo cáo GINA bảo lưu quyền) giữ nguyên."
