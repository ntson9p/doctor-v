notes_vi: "Lượt C đọc tóm tắt qua API Europe PMC (lượt B đặt ID 'lee-2025-tth-subgroups-korea'). Khảo sát trực tuyến toàn quốc ở Hàn Quốc (10/2020), 954 người đau đầu căng thẳng chia 4 nhóm: điển hình 43,3% (hai bên, nhẹ đến vừa, 53,3% không theo nhịp mạch), nặng 6,9%, một bên 39,4%, có sợ ánh sáng 10,4%; tổng cộng 51,4% có đau một bên."
