notes_vi: "Lượt C lô 3 mở trang (rà soát 10/2025). Đau hạ sườn phải, có thể lan ra bả vai phải hoặc lưng trên; giống cơn đau quặn mật nhưng nặng và dài hơn, đạt đỉnh trong 15–60 phút và kéo dài trên 6 giờ. Nôn được mô tả là thường gặp; sốt, thường nhẹ, hay gặp nhưng có thể không có. Vàng da kèm phân bạc màu gợi ý tắc một phần ống mật chủ. Phần lớn đã từng có cơn đau quặn mật hoặc viêm túi mật; từ 90% có sỏi túi mật. Người già có thể chỉ có triệu chứng toàn thân không đặc hiệu (chán ăn, nôn, mệt, yếu, sốt). Không điều trị: khoảng 10% thủng; tử vong khi thủng đến 16%. Cần nhập viện."
