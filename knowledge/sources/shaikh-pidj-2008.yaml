notes_vi: "Lượt C chỉ đọc tóm tắt qua API Europe PMC. Phân tích gộp 18 nghiên cứu (chủ yếu ở các nước phương Tây): nhiễm khuẩn tiết niệu ở 7,0% trẻ nhũ nhi bị sốt; trẻ gái sốt 0–3, 3–6, 6–12 tháng và trên 12 tháng lần lượt 7,5%, 5,7%, 8,3% và 2,1%; trẻ trai sốt dưới 3 tháng đã cắt bao quy đầu 2,4%, chưa cắt 20,1%. Phân tích gộp tỷ lệ hiện mắc, không phải độ chính xác chẩn đoán nên để bậc B."
