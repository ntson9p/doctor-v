notes_vi: "Lượt C (phần b) đọc tóm tắt qua API Europe PMC và mở toàn văn trên PMC ngày 25/10/2026. Khảo sát Sức khỏe tâm thần thế giới (142.949 người lớn, 25 nước): từng có cơn hoảng sợ 13,2%; rối loạn hoảng sợ suốt đời 1,7% (nước thu nhập thấp và trung bình thấp 0,8%, trung bình cao 1,1%, cao 2,2%; Trung Quốc: Bắc Kinh, Thượng Hải 0,4%, Thâm Quyến 0,3%; Nhật Bản 0,8%). Tuổi khởi phát trung vị 32 (khoảng tứ phân vị 20–47). Nữ: OR 1,8 (KTC 95% 1,6–2,0) với rối loạn hoảng sợ suốt đời."
