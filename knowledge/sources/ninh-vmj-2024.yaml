notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần b) tải lại trang và PDF toàn văn đính kèm (vmj-pdf-8967.pdf) ngày 31/10/2026; lượt A đã đọc trước đó. Hồi cứu 119 người được chẩn đoán phản vệ theo Thông tư 51/2017/TT-BYT (1/2018–12/2022). Phản vệ chiếm 0,15–0,23% số người nhập viện mỗi năm. Nguyên nhân: thuốc 53,8% (chống viêm không steroid 26,6%, kháng sinh 23,5%), thức ăn 38,7% (hải sản 40% trong số này), nọc côn trùng 2,5%. Biểu hiện: da, niêm mạc 92,4%, hô hấp 67,2% (gồm nghẹt mũi, chảy mũi, ho, khó thở), tim mạch 39,5% (hồi hộp, đánh trống ngực, đau ngực), tiêu hóa 29,4%, thần kinh 26,1%; triệu chứng đầu tiên ở da, niêm mạc 87,4%; tụt huyết áp khi chẩn đoán 23,5%. Từ tiếp xúc đến triệu chứng trung bình 56,5 phút (1–300 phút); dưới 5 phút 10,9%, 5–30 phút 46,2%, trên 60 phút 19,3%. Độ II 69,7%. Không ca tử vong. Bệnh viện tư, cỡ mẫu nhỏ."
