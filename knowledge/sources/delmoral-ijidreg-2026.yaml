notes_vi: "Lượt C đọc toàn văn (PMC13571253) qua API Europe PMC (www.ebi.ac.uk/europepmc/webservices/rest). 609 ca sởi xác định đến một bệnh viện tuyến cuối ở Jalisco (2025–2026), 423 ca không nhập viện. Bảng 1, ca không nhập viện: sốt 100%, ho 95,7%, chảy mũi 81,5%, viêm kết mạc 67,1%, phát ban 98,3%, hạt Koplik 55,3%, có tiếp xúc ca bệnh 22,7%. Toàn mẫu: 80,3% đủ tuổi tiêm nhưng chưa tiêm, 9,5% dưới 1 tuổi, 10,2% có ghi nhận ít nhất 1 mũi; đến khám trung vị ngày 4 từ khi khởi bệnh."
