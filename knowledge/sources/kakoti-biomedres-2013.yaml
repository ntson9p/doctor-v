notes_vi: "Lượt C (Giai đoạn 3, lô 2, phần b) mở lại ngày 27/10/2026 (bản ghi và tóm tắt qua API Europe PMC). 67 trẻ viêm não Nhật Bản trong 223 trẻ nằm viện vì hội chứng viêm não cấp ở Assam, Ấn Độ (3–12/2012): sốt 100%, rối loạn tri giác 83,6%, co giật 82,1%, đau đầu 41,8%, nôn 29,9%, dấu hiệu màng não 55,2%; Glasgow từ 8 trở xuống 40,3%; tử vong trong viện 14,7%."
