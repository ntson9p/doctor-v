notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần c) đọc lại tóm tắt qua API Europe PMC ngày 31/10/2026; lượt B đã đọc trước đó. 517 trẻ em, thiếu niên đau ngực đến khoa nhi một bệnh viện đại học (Hàn Quốc, 2006–2013): không rõ nguyên nhân 73,6%, hô hấp 9,3%, cơ xương 8,8%, tim 3,8% (trong đó rối loạn nhịp 65%, tim bẩm sinh 30%), tiêu hóa 2,9%, tâm thần 1,4%. 6 trẻ (1,2%) tràn khí màng phổi hoặc trung thất, đều ở thiếu niên lớn: đau đột ngột, liên tục, kéo dài 1–2 ngày. Mẫu bệnh viện."
