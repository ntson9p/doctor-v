notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần b) đọc lại tóm tắt và toàn văn (PMC1550946) qua API Europe PMC ngày 31/10/2026; lượt A đã đọc tóm tắt trước đó. 514 người từ 65 tuổi (trung bình 80) đến cấp cứu ở Paris vì khó thở có tiêu chuẩn suy hô hấp cấp (nhịp thở từ 25 lần/phút, PaO2 từ 70 mmHg trở xuống hoặc SpO2 từ 92% trở xuống, hoặc tăng CO2): phù phổi do tim 43%, viêm phổi cộng đồng 35%, đợt cấp bệnh hô hấp mạn 32%, tắc mạch phổi 18%, hen cấp 3%; 47% có trên hai chẩn đoán. Tử vong trong viện 16%. Nhóm chọn lọc nặng, không đại diện cho người khó thở ở tuyến ban đầu."
