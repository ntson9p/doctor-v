notes_vi: "Lượt C mở lại trang (ngày trên trang 17/04/2024). Triệu chứng: sổ mũi, nghẹt mũi, đau hoặc nặng mặt, đau đầu, dịch chảy xuống họng, đau họng, ho, hơi thở hôi. Phần lớn do vi rút. Đi khám khi: triệu chứng nặng (đau đầu, đau mặt dữ dội), nặng lại sau khi đã đỡ, kéo dài hơn 10 ngày không đỡ, sốt quá 3–4 ngày, bị nhiều lần trong năm."
