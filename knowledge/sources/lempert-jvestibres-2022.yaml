notes_vi: "Tiêu chuẩn đau nửa đầu tiền đình: ít nhất 5 đợt triệu chứng tiền đình mức vừa hoặc nặng, mỗi đợt 5 phút đến 72 giờ; có tiền sử đau nửa đầu theo ICHD-3; ít nhất một nửa số đợt có một đặc điểm đau nửa đầu (đau đầu kiểu đau nửa đầu, sợ ánh sáng kèm sợ tiếng ồn, hoặc tiền triệu thị giác). Triệu chứng tiền đình gồm chóng mặt tự phát, chóng mặt tư thế (sau đổi tư thế đầu), chóng mặt do kích thích thị giác, chóng mặt khi cử động đầu kèm buồn nôn. Thời gian đợt: khoảng 30% vài phút, 30% vài giờ, 30% vài ngày, 10% chỉ vài giây lặp lại khi cử động đầu hoặc đổi tư thế; có người tới 4 tuần mới hồi phục hẳn. Có thể nghe kém dao động, ù tai, đầy tai, nhưng nghe kém không tiến tới mức nặng. Ảnh hưởng 1–2,7% dân số, 11% người khám ở trung tâm chóng mặt, 13% ở phòng khám đau đầu; 65–85% là nữ; hơn 50% có rối loạn tâm thần đi kèm. Chẩn đoán phân biệt: có thể chỉ có chóng mặt tư thế, giống chóng mặt tư thế kịch phát lành tính; bệnh Ménière; cơn thiếu máu não thoáng qua tuần hoàn sau, nhất là người cao tuổi có yếu tố nguy cơ mạch máu, khởi phát đột ngột, các cơn mới xuất hiện dưới 1 năm."
