notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần b) tải lại trang ngày 31/10/2026 (rà soát toàn bộ và cập nhật 10/2026); lượt B đã đọc trước đó. Ủ bệnh trung bình 11–12 ngày (7–20 ngày). Giai đoạn khởi phát 3–7 ngày: sốt, sổ mũi, ho khan, viêm kết mạc; hạt Koplik ở 70%. Ban mọc khoảng 3–7 ngày sau khởi phát, bắt đầu ở mặt trước và dưới tai, cổ, trong 24–48 giờ lan xuống thân và tứ chi. Lúc nặng nhất sốt có thể trên 40°C, phù quanh mắt, sợ ánh sáng, ho khan. Bội nhiễm vi khuẩn gồm viêm phổi, viêm thanh khí phế quản, viêm tai giữa."
