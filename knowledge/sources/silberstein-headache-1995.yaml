notes_vi: "Lượt C đọc tóm tắt qua API Europe PMC. Phỏng vấn qua điện thoại 500 người tự báo đau nửa đầu (Mỹ, 1994): triệu chứng hay gặp nhất là đau, buồn nôn, vấn đề thị lực, nôn; buồn nôn ở trên 90% (gần 1/3 trong số đó buồn nôn ở mọi cơn); nôn ở gần 70% (gần 1/3 trong số đó nôn ở phần lớn các cơn); nhìn mờ, nghẹt mũi cũng được nêu."
