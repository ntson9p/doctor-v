notes_vi: "Lượt C đọc toàn văn (PMC8989396) qua API Europe PMC (www.ebi.ac.uk/europepmc/webservices/rest). Người 16–99 tuổi ở Anh, đã tiêm ít nhất 2 mũi vắc xin, tự báo triệu chứng trong 7 ngày trước và sau xét nghiệm. Giai đoạn Omicron (n = 4.990): chảy nước mũi 76,5%, đau đầu 74,7%, đau họng 70,5%, hắt hơi 63,0%, ho kéo dài 49,8%, khàn tiếng 42,6%; mất ngửi 16,7% (giai đoạn Delta 52,7%). Nhập viện 1,9%. Thời gian có triệu chứng trung bình 6,87 ngày."
