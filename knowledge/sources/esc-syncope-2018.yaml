notes_vi: "Người bảo trì thêm cho các quy tắc ngất (lô 1, Giai đoạn 3): đặc điểm nguy cơ cao như ngất khi gắng sức hoặc khi nằm, hồi hộp ngay trước khi ngất, ngất kèm đau ngực, khó thở, đau bụng, đau đầu, bệnh tim nặng. Lượt R cần mở và đối chiếu."
