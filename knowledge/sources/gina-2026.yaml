notes_vi: "Lượt R lô 3 vòng 2 thêm thay cho gina-2024. Đã tải PDF (GINA-2026-Strategy-Report-WMS.pdf, 298 trang, tạo ngày 05/5/2026) ngày 31/10/2026; đây là bản mới nhất trên ginasthma.org/reports/. Dữ kiện dùng: mục 9 (người lớn, vị thành niên, trẻ 6–11 tuổi): đánh giá độ nặng đợt cấp theo mức khó thở, khả năng nói trọn câu, nhịp thở, SpO2 (tr. 170, 179); có dấu hiệu đợt cấp nặng thì chuyển ngay tới cơ sở cấp cứu, lơ mơ, lú lẫn, phổi im lặng thì chuyển hồi sức (tr. 170); đợt cấp nặng có thể đe dọa tính mạng, người bệnh nên đến ngay cơ sở cấp cứu gần nhất (tr. 172); người bệnh có dấu hiệu nặng hoặc nguy kịch, không đáp ứng điều trị, hoặc tiếp tục xấu đi phải chuyển ngay tới cơ sở cấp cứu (tr. 181); SpO2 dưới 92% gợi ý cơn nặng (tr. 179); nếu có cả phản vệ thì tiêm adrenalin trước (tr. 170, 179). Trẻ từ 5 tuổi trở xuống: Box 12-1 (tr. 216) xếp cơn nặng khi chỉ nói từng từ, nhịp thở trên 40 lần/phút, SpO2 dưới 92%, nguy kịch khi lơ mơ, lú lẫn, tím; chuyển ngay tới bệnh viện khi có dấu hiệu nặng hoặc nguy kịch (tr. 213). Sơ đồ Box 9-4 là hình ảnh, không trích được chữ."
