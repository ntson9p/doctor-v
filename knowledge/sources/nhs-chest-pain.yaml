notes_vi: "Trang rà soát lần cuối 08/8/2023. 'Call 999': đau hoặc khó chịu ở ngực đột ngột và không hết; đau lan ra tay trái hoặc tay phải, cổ, hàm, bụng hoặc lưng; đau ngực kèm vã mồ hôi, buồn nôn, choáng váng hoặc khó thở. Đau ngực lúc có lúc không, hoặc đã hết nhanh: đi khám bác sĩ gia đình."
