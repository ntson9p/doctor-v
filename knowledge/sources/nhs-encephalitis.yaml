notes_vi: "Lượt C (Giai đoạn 3, lô 2, phần b) mở lại ngày 27/10/2026 (tải trang, rà soát lần cuối 15/5/2023). Bệnh hiếm nhưng nặng, cần điều trị khẩn trong bệnh viện; trẻ rất nhỏ và người rất già có nguy cơ cao nhất. Thường khởi đầu như cúm (sốt cao, đau đầu); trong vài giờ, vài ngày hoặc vài tuần xuất hiện lú lẫn, co giật, thay đổi tính cách, hành vi, khó nói, yếu hoặc mất cử động một phần cơ thể, mất ý thức. Có các triệu chứng nặng này thì gọi 999 ngay."
