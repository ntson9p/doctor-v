notes_vi: "Lượt C lô 3 đọc toàn văn trên PMC. 187 ca lồng ruột dưới 5 tuổi ở Nha Trang (2009–2011): 31% dưới 1 tuổi, 43% trong năm thứ hai, không ca nào dưới 3 tháng. Đau bụng từng cơn 98,9%, nôn 84,5%, khối ở bụng 76,5%, phân máu 17,1%, chướng bụng 8,6%. Đến viện sau trung vị 5 giờ (tứ phân vị 3–10; 77 ca có ghi). Tháo lồng bằng hơi thành công 185/187 ca. Tỷ lệ mắc 296/100.000 trẻ dưới 1 tuổi và 196/100.000 trẻ dưới 5 tuổi mỗi năm."
