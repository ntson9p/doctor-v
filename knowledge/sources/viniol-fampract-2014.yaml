notes_vi: "Lượt C (lô 4) đọc tóm tắt qua API Europe PMC. Tổng quan 14 nghiên cứu về đau bụng là lý do khám ở chăm sóc ban đầu (không gồm nghiên cứu chỉ ở trẻ em): đau bụng chiếm trung bình 2,8% lượt khám; khoảng 1/3 không rõ nguyên nhân; hay gặp: viêm dạ dày – ruột 7,2–18,7%, hội chứng ruột kích thích 2,6–13,2%, nguyên nhân tiết niệu 5,3%, viêm dạ dày 5,2%; khoảng 1/10 có bệnh cấp cần xử trí ngay (viêm ruột thừa 1,9%, viêm túi thừa 3,0%, bệnh mật – tụy 4,0%, ung thư 1,0%)."
