notes_vi: "Văn bản hành chính. Lượt R (Giai đoạn 3, lô 2) thêm và đọc bản PDF do vnras.com đăng lại (trang quyết định ghi số 40/QĐ-BYT, Hà Nội, ngày 12/01/2015, ban hành tài liệu chuyên môn áp dụng tại các cơ sở khám bệnh, chữa bệnh); chưa kiểm tra được trên cổng văn bản của Bộ Y tế có văn bản thay thế hay không. Bài Glôcôm góc đóng nguyên phát (tr. 78–84): tổn thương thần kinh thị giác do glôcôm không hồi phục được nên phát hiện sớm, điều trị kịp thời là rất quan trọng. Cơn cấp khởi phát đột ngột, rầm rộ, thường về chiều tối hoặc sau xúc động mạnh: đột ngột đau nhức mắt, nhức quanh hốc mắt lan lên nửa đầu cùng bên; nhìn mờ như qua màn sương; nhìn đèn thấy quầng xanh đỏ; sợ ánh sáng, chói, chảy nước mắt; có thể buồn nôn, nôn, đau bụng, vã mồ hôi, sốt. Khám: thị lực giảm sút nhiều, nhãn áp rất cao, mắt cương tụ, giác mạc phù, đồng tử giãn méo, tiền phòng nông, góc đóng. Chẩn đoán phân biệt với viêm màng bồ đào tăng nhãn áp."
