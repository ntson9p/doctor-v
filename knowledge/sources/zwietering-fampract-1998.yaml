notes_vi: "Lượt C (agent:pass-c, phần b) đọc tóm tắt qua API Europe PMC ngày 25/10/2026. 762 người khám bác sĩ gia đình ở Hà Lan với triệu chứng mới có thể do rối loạn nhịp, được ghi điện tim qua điện thoại: có rối loạn nhịp 28,3%, rối loạn nhịp có ý nghĩa lâm sàng 8,8%. Tuổi, ít hơn là nam giới, hồi hộp và khó thở lúc khám, dùng thuốc tim mạch liên quan với rối loạn nhịp; dùng thuốc thần kinh trung ương và hay than triệu chứng tâm thể liên quan nghịch với rối loạn nhịp có ý nghĩa."
