notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần c) đọc lại tóm tắt qua API Europe PMC ngày 31/10/2026; lượt A đã đọc trước đó. 80 người tràn khí tự phát điều trị ở khoa nội Bệnh viện Đa khoa Singapore (1/1981–3/1983), 75 nam, 15–92 tuổi: khó thở là triệu chứng chính ở 59 người (74%), đau ngực 47 người (59%), 1 người vào viện vì mất ý thức. Không có bệnh kèm 45%; bệnh phổi tắc nghẽn mạn tính 43%; lao phổi 5, ung thư phế quản 2, hen 2, viêm phổi 1. Tái phát 20%; 71% cần dẫn lưu; tử vong 7,5%, chủ yếu ở người bệnh phổi tắc nghẽn. Phân bố tuổi hai đỉnh, người trẻ không có bệnh phổi. Mẫu bệnh viện, đã cũ."
