notes_vi: "Lượt C mở bản PDF do vnras.com đăng lại (bản in NXB Y học; phông TCVN3 được chuyển sang Unicode để đọc). Trang quyết định: số 4235/QĐ-BYT, Hà Nội ngày 31/10/2012. Bài 'Viêm phổi mắc phải ở cộng đồng' (tr. 34–37): khởi phát đột ngột, sốt cao 39–40°C, rét run; đau ngực thường có; ho mới, lúc đầu ho khan rồi có đờm; có khi nôn, chướng bụng, đau bụng; khó thở khi tổn thương lan tỏa; người cao tuổi triệu chứng không rầm rộ, có khi khởi đầu bằng lú lẫn. URL là trang thứ cấp. Bài viêm phổi của văn bản này có thể đã được thay bằng hướng dẫn riêng về viêm phổi cộng đồng ở người lớn (4815/QĐ-BYT ngày 20/11/2020; một trang thứ cấp còn nêu 2147/QĐ-BYT năm 2026 thay thế 4815); lượt C chưa mở được hai văn bản này, nên các liên kết chỉ dựa vào văn bản này được để bậc C."
