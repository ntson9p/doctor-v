notes_vi: "Lượt C mở bản PDF do vnras.com đăng lại (bản in NXB Y học; phông TCVN3 được chuyển sang Unicode để đọc). Trang quyết định: số 4235/QĐ-BYT, Hà Nội ngày 31/10/2012. Bài 'Viêm phổi mắc phải ở cộng đồng' (tr. 34–37): khởi phát đột ngột, sốt cao 39–40°C, rét run; đau ngực thường có; ho mới, lúc đầu ho khan rồi có đờm; có khi nôn, chướng bụng, đau bụng; khó thở khi tổn thương lan tỏa; người cao tuổi triệu chứng không rầm rộ, có khi khởi đầu bằng lú lẫn. URL là trang thứ cấp. Bài viêm phổi của văn bản này có thể đã được thay bằng hướng dẫn riêng về viêm phổi cộng đồng ở người lớn (4815/QĐ-BYT ngày 20/11/2020; một trang thứ cấp còn nêu 2147/QĐ-BYT năm 2026 thay thế 4815); lượt C chưa mở được hai văn bản này, nên các liên kết chỉ dựa vào văn bản này được để bậc C. Lượt C Giai đoạn 3 lô 3 phần c tải lại PDF ngày 31/10/2026 (cùng địa chỉ) và đọc thêm ba bài (chuyển phông TCVN3 sang Unicode). Bài 'Hướng dẫn chẩn đoán và xử trí khó thở' (tr. 16–17): khó thở đột ngột do dị vật đường thở, nhồi máu phổi, tràn khí màng phổi; khó thở kèm đau ngực có thể do nhồi máu phổi, thiếu máu cơ tim, tràn khí màng phổi tự phát (đau ngực đột ngột, hay ở người trẻ). Bài 'Hướng dẫn chẩn đoán và xử trí đau ngực' (tr. 24–28): nguyên nhân nguy hiểm cần loại trừ là cơn đau thắt ngực không ổn định, nhồi máu cơ tim, phình tách động mạch chủ ngực, nhồi máu phổi, tràn khí màng phổi áp lực; đau sau bữa ăn có thể do dạ dày, thực quản hoặc cơn đau thắt ngực, đau sau gắng sức thường do bệnh mạch vành; đau đột ngột cần tìm nhồi máu cơ tim, nhồi máu phổi, tràn khí màng phổi, phình tách động mạch chủ; đau âm ỉ, từ từ cần tìm nguyên nhân thành ngực, tiêu hóa; đau dữ dội, đè ép cần tìm nhồi máu cơ tim, phình tách; đau giữa ngực thường do cơn đau thắt ngực hoặc tiêu hóa, đau bên phải hay trái thường do phổi, màng phổi; lan lên cổ, hàm dưới thường là cơn đau thắt ngực, lan từ ngực xuống bụng, thắt lưng thường do phình tách; tăng khi nuốt do thực quản, tăng khi ho, hắt hơi, hít sâu, đổi tư thế do màng phổi; vã mồ hôi, xanh tái cần tìm nhồi máu cơ tim, tắc mạch phổi, phình tách; khám thành ngực tìm zona. Mục 2.3: nguyên nhân thành ngực (nhiễm trùng da, cơ, chấn thương, zona, viêm dây thần kinh liên sườn, viêm khớp ức sườn…), màng phổi (tràn khí màng phổi…), phổi, tim mạch (phình tách động mạch chủ, nhồi máu phổi…), tiêu hóa (hội chứng trào ngược dạ dày – thực quản, viêm loét dạ dày…). Bài 'Hướng dẫn chẩn đoán và điều trị tràn khí màng phổi' (tr. 139–143): đau ngực thường đột ngột ở bên tràn khí; khó thở, thở nhanh nông khi nghỉ hoặc khi gắng sức; ho khan; tràn khí nguyên phát thường ở người trẻ, cao gầy, hút thuốc; thứ phát sau bệnh phổi tắc nghẽn mạn tính, giãn phế nang, hen, lao, nghĩ tới khi người bệnh đang ổn định đột nhiên suy hô hấp nặng; lượng khí ít ở tràn khí nguyên phát có thể chỉ thở oxy, theo dõi; tràn khí áp lực dương (thở trên 30 lần/phút, tim trên 120 lần/phút, tụt huyết áp) phải dẫn lưu. Chưa kiểm tra văn bản mới thay thế các bài này."
