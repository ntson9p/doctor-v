notes_vi: "Lượt C (agent:pass-c, phần b) đọc tóm tắt qua API Europe PMC ngày 25/10/2026. 516 người ngất chưa rõ nguyên nhân ở cấp cứu của 14 bệnh viện đa khoa (Ý). Yếu tố dự báo ngất do tim: điện tim bất thường hoặc bệnh tim, hồi hộp trước khi ngất, ngất khi gắng sức hoặc khi nằm, không có tiền triệu thần kinh thực vật, không có yếu tố thuận lợi hoặc khởi phát. Điểm EGSYS từ 3 trở lên nhận ra ngất do tim với độ nhạy 95%/92% và độ đặc hiệu 61%/69%."
