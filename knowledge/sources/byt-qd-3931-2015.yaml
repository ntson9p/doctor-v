notes_vi: "URL là trang thứ cấp; cần thay bằng bản chính thức. Quyết định 2388/QĐ-BYT ngày 12/8/2024 (Điều 3) chỉ bãi bỏ 4 bài: bệnh thận đái tháo đường, bệnh thận IgA, viêm thận lupus, bệnh thận mạn; bài sỏi và viêm bàng quang không bị bãi bỏ. Lượt C lô 3 tải lại PDF ngày 25/10/2026 và đối chiếu: trang bìa ghi ban hành kèm Quyết định 3931/QĐ-BYT ngày 21/9/2015. Bài Sỏi thận tiết niệu (tr. 55): bệnh thường gặp nhất của đường tiết niệu, nam nhiều hơn nữ, tuổi 30–55, hay gặp ở vùng nóng, nhiệt đới; cơn đau quặn thận xuất hiện đột ngột, sau gắng sức, khởi phát ở hố thắt lưng một bên, lan ra trước, xuống hố chậu, bộ phận sinh dục, đau mạnh, không có tư thế giảm đau; kèm buồn nôn, nôn, chướng bụng do liệt ruột; có thể sốt, rét run nếu có nhiễm trùng; giảm lượng nước uống khi đang có cơn đau. Bài Ứ nước, ứ mủ bể thận: sốt, rét run khi có nhiễm khuẩn; nguyên tắc điều trị là loại bỏ tắc nghẽn, dẫn lưu bể thận (văn bản không dùng chữ 'cấp cứu'). Bài Viêm bàng quang cấp: nữ/nam 9/1; tiểu buốt, tiểu dắt, có thể tiểu máu, tiểu mủ cuối bãi; có thể đau nhẹ vùng trên khớp mu; thường không sốt hoặc sốt nhẹ dưới 38°C."
