notes_vi: "Lượt C (Giai đoạn 3 lô 3) đọc lại tóm tắt qua API Europe PMC ngày 31/10/2026; lượt B đã đọc trước đó. 247 người ung thư phổi trên 40 tuổi ở 21 phòng khám đa khoa Exeter (1998–2002) và 1.235 người chứng: bảy triệu chứng liên quan độc lập với ung thư phổi (ho ra máu, sụt cân, chán ăn, khó thở, đau ngực, mệt, ho), cùng ngón tay dùi trống, tăng tiểu cầu, hô hấp ký bất thường và hút thuốc. Khi bỏ 180 ngày cuối trước chẩn đoán, ho ra máu, khó thở và hô hấp ký bất thường vẫn liên quan độc lập. Tóm tắt không cho tần suất từng triệu chứng (tỷ số khả dĩ ở okoli-plosone-2018)."
