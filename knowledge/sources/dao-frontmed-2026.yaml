notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần c) đọc lại toàn văn PMC13477947 qua API Europe PMC ngày 31/10/2026; lượt A (id vnage-gerd-2026) và lượt B (id này) đã đọc trước đó, gộp làm một. Hướng dẫn của hội chuyên ngành Việt Nam (đồng thuận Delphi, GRADE, 20 khuyến cáo), không phải văn bản của Bộ Y tế. Khuyến cáo 1: triệu chứng điển hình là ợ nóng (nóng rát sau xương ức, hay nặng sau ăn hoặc khi nằm) và ợ trớ; đồng thuận Lyon 2.0 coi đau ngực không do tim là triệu chứng điển hình thứ ba. Ở Việt Nam, người nội soi vì triệu chứng tiêu hóa trên có ợ nóng 9,2%, ợ trớ 27%; người được chẩn đoán sơ bộ trào ngược có ợ nóng 68,4–78,6%, ợ trớ 71,5–77,4%. Biểu hiện ngoài thực quản chiếm 7–23,1%; một nghiên cứu Việt Nam ở người trào ngược: ho 49,1%, cảm giác vướng họng 46,7%, đau ngực không do tim 45,3%, khàn tiếng 9,9%, khò khè 9,4%. Người chỉ có triệu chứng không điển hình cần tiếp cận đa chuyên khoa. Nội soi khi có dấu hiệu báo động (nuốt khó, nuốt đau, nôn kéo dài, sụt cân, xuất huyết tiêu hóa, thiếu máu). Thay đổi lối sống (giảm cân, kê cao đầu giường, bỏ thuốc lá, tránh ăn sát giờ ngủ) là điều trị bước đầu."
