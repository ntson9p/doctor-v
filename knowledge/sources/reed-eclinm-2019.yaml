notes_vi: "Lượt C (phần b) đọc toàn văn PMC6537555 qua API Europe PMC. 243 người từ 16 tuổi đến 10 khoa cấp cứu ở Anh vì hồi hộp, tiền ngất chưa rõ nguyên nhân. Trong 80 người ghi được nhịp lúc có triệu chứng: nhịp xoang 53 (66,3%), nhịp nhanh xoang 19 (23,8%), ngoại tâm thu 13 (16,3%); 12 người có rối loạn nhịp (rung, cuồng nhĩ, nhịp nhanh trên thất, nhịp chậm xoang). Phần mở đầu: khoảng 9/10 cơn có nhịp lành tính (nhịp xoang, nhịp nhanh xoang, ngoại tâm thu), khoảng 1/10 là rối loạn nhịp."
