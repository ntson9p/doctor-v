notes_vi: "Phân tích phụ thử nghiệm ACCORD (đái tháo đường típ 2): các cơn hạ đường huyết nặng (cần người khác giúp). Bảng 1, triệu chứng lúc có cơn (nhóm điều trị tích cực và chuẩn): yếu, mệt 29–30%; vã mồ hôi 26–27%; lú lẫn, mất định hướng 22–29%; run 19–21%; chóng mặt 14–16%; nhìn mờ 9–14%; lo âu 8–10%; cáu gắt 8%; đói 2–5%; tim đập nhanh 4%; đau đầu 2–3%; 17–18% cơn xảy ra khi đang ngủ, 10–11% lúc 0–4 giờ sáng. Bảng 2, yếu tố trước cơn: ăn muộn hoặc bỏ bữa 31–44%, ăn ít tinh bột hơn dự định (khoảng một nửa số cơn liên quan ăn uống), vận động nhiều hơn thường lệ 12–15%, uống rượu 2–3%; hậu quả: lú lẫn 34–37%, mất ý thức 25%, co giật 2–3%. Bối cảnh thử nghiệm lâm sàng, chỉ cơn nặng."
