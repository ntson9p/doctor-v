notes_vi: "390 người từ 12 tuổi (tuổi trung bình 40, nữ 48%) ở bệnh viện dạy học tại Ấn Độ. Các nghiên cứu trước ở người lớn nằm viện: độ nhạy của da, niêm mạc nhợt 19–70%, độ đặc hiệu 70–100%. Trong nghiên cứu: không nhợt lưỡi gần như loại trừ thiếu máu nặng dưới 7 g/dL; ở ngưỡng 9 g/dL không vị trí nào loại trừ hay khẳng định chắc được; hai người khám đánh giá rất khác nhau (kappa 0,07 với kết mạc, 0,20 với lưỡi). Ý nghĩa: người dùng tự nhận xét da xanh còn kém chính xác hơn."
