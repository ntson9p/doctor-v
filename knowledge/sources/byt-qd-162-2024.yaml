notes_vi: "Lượt R lô 3 vòng 2 tải bản PDF có chữ ký số (213 trang) do một cổng thông tin cấp tỉnh (hệ thống vnPortal) đăng lại, ngày 31/10/2026; id giống bản nháp của lượt A. Quyết định ký ngày 19/01/2024, có hiệu lực từ ngày ký, thay thế 1314/QĐ-BYT ngày 24/3/2020 (Điều 3). Phần II, mục 1 (Người nghi mắc bệnh lao), mục 1.1, Bảng 1: ở người lớn, ho kéo dài trên 2 tuần (ho khan, ho có đờm, ho ra máu) là triệu chứng nghi lao quan trọng nhất; có thể kèm gầy sút, kém ăn, mệt mỏi, sốt nhẹ về chiều, sốt kéo dài trên 2 tuần không rõ nguyên nhân, ra mồ hôi đêm, đau ngực, đôi khi khó thở. Ở trẻ em: bệnh kéo dài trên 2 tuần với ho kéo dài, khò khè kéo dài không đáp ứng thuốc giãn phế quản, sụt cân hoặc không tăng cân trong 3 tháng, sốt không rõ nguyên nhân, mệt, chán ăn, ra mồ hôi đêm, hoặc viêm phổi không đáp ứng kháng sinh 2 tuần. Mục 1.3: yếu tố nguy cơ gồm tiếp xúc trực tiếp với nguồn lây (đặc biệt trẻ em), suy giảm miễn dịch (kể cả HIV), bệnh mạn tính như đái tháo đường. Mục 3.2.1: lâm sàng lao phổi như trên (toàn thân, cơ năng: ho kéo dài trên 2 tuần, có thể ho ra máu, đau ngực, khó thở)."
