notes_vi: "Lượt C đọc lại toàn văn qua API Europe PMC (PMC6970225). Năm 2017 có khoảng 48,9 triệu ca nhiễm khuẩn huyết và 11,0 triệu ca tử vong liên quan; tỷ lệ mắc chuẩn hóa theo tuổi ở nữ 716,5 và ở nam 642,8/100.000; tỷ lệ mắc cao nhất ở trẻ nhỏ (20,3 triệu ca ở trẻ dưới 5 tuổi), đỉnh thứ hai ở người cao tuổi; gánh nặng cao nhất ở châu Phi cận Sahara, châu Đại Dương, Nam Á, Đông Á và Đông Nam Á. Số liệu riêng Việt Nam nằm trong phụ lục, chưa đọc."
