notes_vi: "Lượt C mở trang (rà soát lần cuối 04/9/2025). Triệu chứng: đau đầu cực kỳ dữ dội, bắt đầu đột ngột và không hết (đau đầu sét đánh); đau cổ hoặc cứng gáy; buồn nôn, nôn; rất sợ ánh sáng; co giật; ngất, li bì hoặc lú lẫn; méo một bên mặt, nói ngọng, yếu một bên người; nhìn mờ hoặc mất thị lực. Gọi 999; không tự lái xe đến cấp cứu."
