notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần c) đọc lại toàn văn PMC4655927 qua API Europe PMC ngày 31/10/2026; lượt A (id này) và lượt B (id haasenritter-cmj-2015, cùng bài, đã gộp) đã đọc trước đó. 11 nghiên cứu, khoảng 6.500 người đau ngực khám bác sĩ đa khoa (Bắc Mỹ, châu Âu, 1982–2010); không gộp số vì dị biệt lớn. Bảng 3 (6 nghiên cứu nguy cơ sai lệch thấp, khoảng 3.900 người): hội chứng thành ngực 24,5–49,8% (Buntinx 24,5; Verdon 48,8; Bösner 49,8); tim mạch 13,8–16,1%; bệnh mạch vành mọi loại 9,7–14,8%; bệnh mạch vành ổn định 6,6–11,2%; hội chứng vành cấp hoặc nhồi máu cơ tim 1,5–3,6%; hô hấp 10,3–18,2%; tâm lý 9,5–18,2%; tiêu hóa 5,6–9,7%; thực quản 6,0–7,1% (Buntinx, Verdon); chấn thương 1,8–3,9%. Bảng 1: nam 46–51% ở phần lớn nghiên cứu; năm nghiên cứu không giới hạn tuổi (trẻ em rất ít), hai nghiên cứu chỉ nhận người từ 35 tuổi. Ở cấp cứu và tuyến sau, trung vị hội chứng vành cấp là 37%, bệnh mạch vành ổn định 52% (phần bàn luận)."
