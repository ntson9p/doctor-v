notes_vi: "Lượt C lô 3 mở trang (rà soát 1/2025). Đau thượng vị, rát hoặc cồn cào, thường đỡ khi ăn hoặc dùng thuốc kháng axit; diễn biến mạn tính, tái phát; chỉ khoảng một nửa có kiểu điển hình; người già có thể ít hoặc không có triệu chứng. Loét tá tràng: không đau khi mới ngủ dậy, đỡ khi ăn, đau lại 2–3 giờ sau ăn, hay đau làm thức giấc ban đêm. Loét dạ dày: ăn có khi làm đau tăng. Đau lan ra lưng chỉ khi ổ loét mặt sau tá tràng xuyên thấu vào tụy. Thuốc chống viêm không steroid gây trên 50% ổ loét; H. pylori, hút thuốc là yếu tố nguy cơ. Xuất huyết là biến chứng hay gặp nhất (nôn ra máu hoặc bã cà phê, phân đen); thủng gây đau thượng vị đột ngột, dữ dội, bụng cứng. Trang không nêu sốt là triệu chứng."
