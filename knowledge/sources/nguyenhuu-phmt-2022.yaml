notes_vi: "Lượt C đọc lại toàn văn qua API Europe PMC (PMC9427117). Bảng 1: 33 trẻ viêm màng não mủ tại một trung tâm nhi tuyến cuối miền Trung (2019–2021), 9,1% dưới 1 tuổi, 60,6% từ 1–5 tuổi. Triệu chứng trong đợt bệnh: sốt 93,9%, nôn 60,6%, chán ăn 48,5%, co giật 42,4%, cứng gáy 42,4%, đau đầu 30,3%, thóp phồng 21,2%, tiêu chảy 21,2%, rối loạn ý thức 15,2%. Cỡ mẫu nhỏ, ở bệnh viện."
