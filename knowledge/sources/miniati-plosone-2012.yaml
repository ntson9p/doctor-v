notes_vi: "Lượt C (phần b) đọc toàn văn PMC3288010 qua API Europe PMC. 800 người thuyên tắc phổi đã xác định ở Ý (440 ở Pisa, phần lớn nằm viện; 360 ở Firenze, 90% ngoại trú). Cả hai mẫu: khó thở đột ngột 80%, đau ngực 49% (ở Firenze 84% số người đau ngực đau một bên kiểu màng phổi), ngất hoặc xỉu 24% (35% khi có quá tải thất phải, 15% khi không), ho ra máu 6%, sưng đau một bên chi 30%; 94% có ít nhất một trong bốn triệu chứng khó thở đột ngột, đau ngực, ngất, ho ra máu. Không có yếu tố thuận lợi 51% (66% ở Firenze); ung thư đang tiến triển 11%."
