notes_vi: "Lượt R lô 3 vòng 2 tải trực tiếp các trang Overview, Recommendations, History trên nice.org.uk ngày 31/10/2026 (không qua dịch vụ đọc hộ). Xuất bản 01/6/2015, cập nhật 09/8/2021 (ngưỡng SpO2); rà soát lần cuối 09/8/2021, vẫn hiện hành. Mục chuyển viện là mục 1.2 (không phải 1.3 như ghi theo trí nhớ trước đây). Khuyến cáo 1.2.1: chuyển cấp cứu ngay (thường bằng xe 999) khi ngừng thở (thấy hoặc người nhà kể), trông rất nặng, suy hô hấp nặng (thở rên, rút lõm lồng ngực rõ, nhịp thở trên 70 lần/phút), tím trung ương. 1.2.2: cân nhắc chuyển viện khi nhịp thở trên 60 lần/phút, bú khó hoặc lượng uống chỉ 50–75% bình thường, mất nước, SpO2 dưới 92% khi thở khí trời (từ 2021, SpO2 không còn là tiêu chí chuyển ngay). 1.2.3: yếu tố nguy cơ bệnh nặng: bệnh phổi mạn, bệnh tim bẩm sinh, dưới 3 tháng tuổi, sinh non (nhất là dưới 32 tuần), bệnh thần kinh cơ, suy giảm miễn dịch. 1.1.5: trẻ nhỏ (nhất là dưới 6 tuần) có thể chỉ biểu hiện bằng ngừng thở. 1.1.2: ho hết ở 90% trẻ trong 3 tuần."
