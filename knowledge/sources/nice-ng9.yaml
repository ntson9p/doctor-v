notes_vi: "Người bảo trì thêm khi soạn danh mục lô 3 (31/10/2026), chưa mở; lượt R xác minh. Lượt R lô 3 (31/10/2026) không mở được: mạng của phiên chặn nice.org.uk. Theo trí nhớ (chưa xác minh): xuất bản 6/2015, cập nhật 8/2021; khuyến cáo 1.3 về chuyển cấp cứu (ngừng thở, tím trung ương, thở rên, rút lõm lồng ngực nặng, nhịp thở trên 70 lần/phút, SpO2 dưới 92%) và cân nhắc chuyển viện (nhịp thở trên 60 lần/phút, bú 50–75% lượng thường ngày trong 24 giờ, mất nước); tuổi dưới 3 tháng là yếu tố nguy cơ bệnh nặng. Cần đối chiếu. Nhãn L3 như các hướng dẫn NICE khác trong sổ."
