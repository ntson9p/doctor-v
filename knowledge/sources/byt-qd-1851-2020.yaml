notes_vi: "Lượt R lô 3 vòng 2 tải bản PDF (48 trang, gồm quyết định và tài liệu) trên vilaphoikhoe.kcb.vn, trang của Cục Quản lý Khám, chữa bệnh, ngày 31/10/2026; trang mục lục phác đồ của kcb.vn cũng liệt kê văn bản này (kết quả tìm kiếm, chưa mở). Quyết định có hiệu lực từ ngày ký; bãi bỏ hai bài về hen trong 3942/QĐ-BYT (2014) và bãi bỏ 4776/QĐ-BYT (2009). Mục 4.4 (xử trí đợt cấp ở cơ sở chăm sóc ban đầu, tr. 50–51): đánh giá độ nặng theo mức khó thở (không nói được, hoặc chỉ nói từng từ), nhịp thở, mạch, SpO2; nghĩ tới nguyên nhân khác của khó thở cấp (suy tim, hít phải dị vật, tắc mạch phổi); chuyển tới cơ sở cấp cứu ngay khi có dấu hiệu nặng, chuyển hồi sức khi vật vã, ngủ gà, phổi im lặng; người bệnh có dấu hiệu nặng hoặc nguy kịch, không đáp ứng điều trị hoặc tiếp tục xấu đi thì chuyển ngay tới cơ sở cấp cứu. Bảng 9: cơn nặng khi nói từng từ, ngồi cúi người ra trước, kích động, nhịp thở trên 30 lần/phút, co kéo cơ hô hấp phụ, mạch trên 120 lần/phút, SpO2 dưới 90%; đe dọa tử vong khi buồn ngủ, lú lẫn, phổi im lặng. Mục 4.5: đợt cấp nặng là cấp cứu đe dọa tử vong. Mọi người bệnh hen cần có kế hoạch hành động để tự xử trí khi nặng lên."
