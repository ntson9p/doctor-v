notes_vi: "Lượt C chỉ đọc tóm tắt qua API Europe PMC. 696 đợt viêm màng não vi khuẩn mắc ở cộng đồng ở người lớn Hà Lan (1998–2002, có cấy dịch não tủy): phế cầu 51%, não mô cầu 37%; bộ ba sốt, cứng gáy, thay đổi ý thức chỉ có ở 44%; 95% có ít nhất 2 trong 4 dấu hiệu đau đầu, sốt, cứng gáy, thay đổi ý thức; 14% hôn mê, 33% có dấu hiệu thần kinh khu trú khi nhập viện; tử vong 21%."
