notes_vi: "Lượt C (Giai đoạn 3, lô 2, phần b) mở lại ngày 27/10/2026 (tải PDF trên kcb.vn; trang đầu ghi ban hành kèm theo Quyết định số 3192/QĐ-BYT ngày 31/8/2010). Phân độ: tăng huyết áp độ 3 khi tâm thu từ 180 và/hoặc tâm trương từ 110 mmHg. Không nên hạ huyết áp quá nhanh để tránh thiếu máu cơ quan đích, trừ tình huống cấp cứu. Quy trình đo: nghỉ trong phòng yên tĩnh ít nhất 5–10 phút; không dùng cà phê, thuốc lá, rượu bia trong 2 giờ trước. Chưa kiểm tra được văn bản thay thế."
