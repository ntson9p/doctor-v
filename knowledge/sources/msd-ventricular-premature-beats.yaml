notes_vi: "Lượt C (phần b) mở trang ngày 25/10/2026 (rà soát toàn bộ 9/2024; địa chỉ cũ trong bản nháp tự chuyển sang địa chỉ này). Ngoại tâm thu thất rất hay gặp ở cả người khỏe và người bệnh tim; có thể không triệu chứng hoặc gây hồi hộp, cảm giác hẫng hoặc mất nhịp (người bệnh cảm nhận nhịp xoang mạnh sau nhịp sớm); tăng khi lo âu, căng thẳng, rượu, cà phê, thuốc giống giao cảm, thiếu oxy, rối loạn điện giải. Ngoại tâm thu rất dày (nhịp đôi) có thể gây triệu chứng huyết động nhẹ. Không có bệnh tim cấu trúc thì tiên lượng lành tính, chỉ cần trấn an; ở người có bệnh tim cấu trúc, ngoại tâm thu dày liên quan tăng tử vong."
