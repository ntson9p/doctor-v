notes_vi: "Lượt C đọc tóm tắt qua API Europe PMC (lượt B đặt ID 'harriott-2020-headache-ischemic-stroke'). 50 nghiên cứu (20 được gộp): đau đầu gặp ở 6–44% người nhồi máu não, gộp 14% (châu Âu 22%, châu Á và Trung Đông 8%); phần lớn có đặc điểm như đau đầu căng thẳng, mức vừa đến nặng; hay gặp hơn ở tuần hoàn sau (OR 1,92) và ở nữ (1,25)."
