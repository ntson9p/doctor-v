notes_vi: "Lượt C đọc tóm tắt qua API Europe PMC (lượt B đặt ID 'jang-2013-dysmenorrhea-vietnam'). 3.017 phụ nữ Việt Nam 17–42 tuổi ở Cần Thơ, Ba Vì và người kết hôn di cư sang Hàn Quốc (2010–2011): đau bụng kinh 58,8%; ít gặp hơn ở người đã có thai, đã sinh đủ tháng, đã cho con bú; người trẻ hơn và có kinh lần đầu sớm hơn hay bị hơn."
