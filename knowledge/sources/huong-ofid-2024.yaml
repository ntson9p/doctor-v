notes_vi: "Lượt C (Giai đoạn 3, lô 2, phần b) mở lại ngày 27/10/2026 (bản ghi và toàn văn PMC11651147 qua API Europe PMC). 164 trẻ viêm não (định nghĩa ca: rối loạn ý thức từ 24 giờ kèm ít nhất 2 tiêu chuẩn như sốt, co giật, dấu thần kinh khu trú) tại Bệnh viện Nhi Đồng 1, TP.HCM (3/2020–12/2022). Căn nguyên: viêm não tự miễn kháng thụ thể NMDA 14,0%, vi rút viêm não Nhật Bản 8,5%, vi rút herpes 2,4%; 43,3% nghĩ do vi rút chưa xác định. Bảng 1: co giật 61,8–65,9% (viêm não Nhật Bản 42,9%); số ngày bệnh trước nhập viện trung vị 4–5; viêm não Nhật Bản sốt ở cả 14 ca, sốt trung vị 7 ngày, Glasgow trung vị 8; viêm não NMDA chỉ 56,5% có sốt."
