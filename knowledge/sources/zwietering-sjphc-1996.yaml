notes_vi: "Lượt C (agent:pass-c, phần b) đọc tóm tắt qua API Europe PMC ngày 25/10/2026. 868 người khám ở 20 phòng khám đa khoa Hà Lan (1989–1991) vì triệu chứng hoặc dấu hiệu có thể do rối loạn nhịp, được ghi điện tim qua điện thoại: có rối loạn nhịp 32%, trong đó 31% là rối loạn nhịp cần xử trí (khoảng 10% tổng số). Rối loạn nhịp tăng mạnh theo tuổi, gặp nhiều hơn ở nam và khi có triệu chứng gợi ý mất ổn định huyết động."
