notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần c) đọc lại tóm tắt qua API Europe PMC ngày 31/10/2026; lượt B đã đọc trước đó. Tổng quan y văn (265 bài, không phân tích gộp nên để bậc B) về tràn khí tự phát nguyên phát: hai đỉnh tuổi 15–30 và 40–45, phần lớn dưới 45 tuổi; đau ở trung bình 69,25% (9–100%), khó thở 54,55% (27–77,1%); hầu như không có thể không triệu chứng; hút thuốc lá là yếu tố nguy cơ ngoại sinh quan trọng nhất."
