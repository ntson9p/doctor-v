notes_vi: "Lượt C mở trang (rà soát toàn bộ 6/2025, cập nhật 1/2026). Khoảng 80% đột quỵ là nhồi máu, 20% là xuất huyết. Đột quỵ tuần hoàn sau gây rung giật nhãn cầu, chóng mặt, nuốt khó, nói khó, nhìn đôi, mù, thất điều thân hoặc chi, giảm ý thức. Đau đầu đột ngột dữ dội gợi ý xuất huyết dưới nhện; giảm ý thức kèm đau đầu, buồn nôn, nôn gợi ý tăng áp lực nội sọ. Yếu tố nguy cơ: tăng huyết áp, hút thuốc, rối loạn mỡ máu, đái tháo đường, rung nhĩ và bệnh tim gây huyết khối, uống nhiều rượu."
