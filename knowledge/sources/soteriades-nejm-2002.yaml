notes_vi: "Lượt C (agent:pass-c, phần b) đọc tóm tắt qua API Europe PMC ngày 25/10/2026. Nghiên cứu Framingham (cộng đồng Mỹ, 1971–1998): 7.814 người theo dõi trung bình 17 năm, 822 người ngất; tỷ lệ mới mắc 6,2/1.000 người-năm. Nguyên nhân hay gặp: phế vị 21,2%, do tim 9,5%, hạ huyết áp tư thế 9,4%; không rõ 36,6%. Ngất do tim làm tăng tử vong và biến cố tim mạch; ngất phế vị (gồm cả tư thế và do thuốc) không làm tăng nguy cơ."
