notes_vi: "Lượt C đọc toàn văn đăng lại trên vnras.com (trang có liên kết tải PDF; chưa tìm thấy PDF ký số trên cổng Bộ Y tế). Quyết định ký ngày 03/6/2019 (Thứ trưởng Nguyễn Viết Tiến). Đã đối chiếu: đau thắt sau xương ức, có thể lan lên vai trái, cằm; một số trường hợp lan xuống thượng vị nhưng không bao giờ quá rốn; đau kéo dài trên 20–30 phút; triệu chứng không điển hình gồm mệt, hồi hộp, khó thở, đau thượng vị, buồn nôn, nôn; người hậu phẫu, lớn tuổi, đái tháo đường có thể không đau ngực; đau ngực kéo dài kèm vã mồ hôi gợi ý nhiều đến nhồi máu cơ tim; liên lạc ngay 115, không tự lái xe đến bệnh viện, nằm nghỉ; chuyển ngay khi đau trên 20 phút, huyết động không ổn định hoặc có cơn ngất. Chưa kiểm tra văn bản thay thế."
