notes_vi: "Lượt C mở trang (rà soát lần cuối 23/8/2022, hạn rà soát 23/8/2025). Khoảng 1/90 thai ở Anh; triệu chứng thường xuất hiện từ tuần 4 đến tuần 12; có người không có triệu chứng. Triệu chứng: chậm kinh và dấu hiệu có thai khác, đau bụng dưới một bên, ra máu âm đạo hoặc dịch nâu loãng, đau ở đầu vai, khó chịu khi đi tiểu hoặc đi ngoài. Dấu hiệu vỡ (đau bụng đột ngột, dữ dội; chóng mặt nhiều hoặc ngất; buồn nôn; da rất tái): gọi 999 hoặc đến cấp cứu ngay; có các triệu chứng khác và có thể đang có thai: gọi bác sĩ gia đình hoặc 111, kể cả khi chưa thử thai dương tính."
