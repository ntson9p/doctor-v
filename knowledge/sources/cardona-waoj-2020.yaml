notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần b) đọc lại toàn văn (PMC7607509) qua API Europe PMC ngày 31/10/2026; lượt A, lượt B đã đọc trước đó. Phản vệ có thể không có biểu hiện da hoặc sốc, hay gặp ở ca tử vong; không có dấu hiệu da ở 10–20% phản ứng. Tiêu chuẩn chẩn đoán: tổn thương hô hấp (khó thở, khò khè, co thắt phế quản, thở rít, giảm lưu lượng đỉnh, giảm ô xy máu); triệu chứng thanh quản gồm thở rít, đổi giọng, nuốt đau. Phản vệ không rõ nguyên nhân chiếm 6,5–35% tùy nghiên cứu. Adrenalin tiêm bắp là điều trị đầu tay; sau phản vệ cần khám chuyên khoa dị ứng."
