notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần c) đọc lại toàn văn PMC13505866 qua API Europe PMC ngày 31/10/2026; lượt B đã đọc trước đó. Sổ bộ bệnh nhân và sổ tử vong quốc gia Thụy Điển 1999–2023: 15.946 người bóc tách động mạch chủ mới (kể cả tử vong trước khi vào viện); tỷ lệ mới mắc tăng từ 6,56 lên 9,32/100.000 mỗi năm; nam 10,52, nữ 6,25; tuổi trung bình 69,2 (nữ 71,9, nam 67,5); nam 62,2%; tử vong trước khi vào viện trung bình 1,97/100.000 mỗi năm."
