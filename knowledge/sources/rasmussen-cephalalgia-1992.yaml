notes_vi: "Lượt C đọc tóm tắt qua API Europe PMC (lượt B đặt ID 'rasmussen-1992-migraine-aura'). 1.000 người dân 25–64 tuổi: tỷ lệ mắc trọn đời đau nửa đầu có tiền triệu 5%, không tiền triệu 8% (nam:nữ 1:7); có yếu tố khởi phát ở 61% (có tiền triệu) và 90% (không tiền triệu), nổi bật nhất là căng thẳng; rối loạn thị giác ở 90% người có tiền triệu."
