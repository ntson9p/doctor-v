notes_vi: "Lượt C (Giai đoạn 3, lô 2, phần b) mở lại ngày 27/10/2026 (bản ghi và toàn văn PMC13691512 qua API Europe PMC). Tổng quan phạm vi về sẹo BCG tấy đỏ lại trong bệnh Kawasaki: tỷ lệ 11,8–49,9% tùy cohort; Hàn Quốc (Roh 2022) 25,6% (121/473), 89% ở trẻ từ 3 tháng trở xuống so với 22,9% ở trẻ lớn hơn; Singapore (Loh 2019) 42,7% (119/279) ở trẻ Kawasaki so với 9,9% (9/91) ở trẻ sốt do nguyên nhân khác; hay gặp ở trẻ dưới 2 tuổi, thường xuất hiện sớm trong giai đoạn sốt."
