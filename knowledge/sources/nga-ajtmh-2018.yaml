notes_vi: "Lượt C đọc lại toàn văn qua API Europe PMC (PMC6128360). Tổng quan dịch tễ thương hàn ở Việt Nam: tỷ lệ mắc toàn quốc ước khoảng 14,7/100.000 dân/năm giai đoạn 1999–2003, sau đó giảm mạnh; tác giả coi Việt Nam đã gần như loại trừ bệnh, chủ yếu nhờ phát triển kinh tế và cải thiện điều kiện sống. Là bài tổng quan, không có số liệu giám sát mới."
