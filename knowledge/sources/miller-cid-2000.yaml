notes_vi: "Lượt C (Giai đoạn 3 lô 3) đọc lại tóm tắt qua API Europe PMC ngày 31/10/2026; lượt B đã đọc trước đó. 526 ca lao được báo cáo ở hạt Los Angeles trong 6 tháng; 313 người trả lời bộ câu hỏi: ho 72,7% (ho trên 2 tuần 48,2%), sốt 52,3% (sốt trên 2 tuần 29,4%); ở lao phổi chỉ 52,4% ho trên 2 tuần. Người gốc châu Á hay có biểu hiện không điển hình hơn."
