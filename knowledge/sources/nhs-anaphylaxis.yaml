notes_vi: "Lượt R lô 3 vòng 2 tải trang trực tiếp ngày 31/10/2026 (rà soát lần cuối 21/6/2023, hẹn rà soát 21/6/2026 đã quá hạn). Triệu chứng thường bắt đầu trong vài phút sau tiếp xúc với thức ăn, thuốc, côn trùng đốt: sưng họng, lưỡi; khó thở hoặc thở rất nhanh; khó nuốt, nghẹn họng, khàn tiếng; khò khè, ho, thở ồn; mệt hoặc lú lẫn; choáng, chóng mặt, ngất; da lạnh; da, môi, lưỡi tím, xám, nhợt; có thể có ban sưng, gồ, ngứa. 'Call 999' (chỉ gọi 999): môi, miệng, họng, lưỡi đột ngột sưng; thở rất nhanh hoặc rất khó thở (khò khè nhiều, nghẹn, thở hổn hển); họng thắt lại, khó nuốt; da, lưỡi, môi tím, xám, nhợt; đột ngột rất lú lẫn, lơ mơ, chóng mặt; ngất không gọi tỉnh; trẻ mềm nhũn, không phản ứng như bình thường. Không đứng dậy hay đi lại kể cả khi thấy đỡ."
