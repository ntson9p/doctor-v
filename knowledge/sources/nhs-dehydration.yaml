notes_vi: "Lượt C mở lại trang (rà soát lần cuối 01/5/2026, hạn rà soát 01/5/2029). Triệu chứng mất nước ở người lớn và trẻ em: khát, đau đầu và choáng váng, nước tiểu vàng sẫm, đi tiểu ít, chóng mặt hoặc choáng, mệt, khô miệng, môi, lưỡi, mắt trũng. Dễ mất nước khi nôn hoặc tiêu chảy, sốt cao, ở nơi nóng, uống nhiều rượu, đổ nhiều mồ hôi, dùng thuốc lợi tiểu, đái tháo đường. Uống nước ít một nếu buồn nôn; dược sĩ có thể khuyên dung dịch bù nước. Khám khẩn hoặc gọi 111: mệt bất thường (trẻ li bì), chóng mặt khi đứng dậy mà không hết, nước tiểu sẫm hoặc tiểu ít, thở nhanh hoặc tim đập nhanh, trẻ khóc ít nước mắt, thóp lõm. Gọi 999 hoặc đến cấp cứu khi có dấu hiệu mất nước kèm da, môi, lưỡi xanh tái, xám, nhợt hoặc loang lổ; da lạnh; khó thở hoặc thở rất nhanh; lú lẫn; buồn ngủ hơn bình thường hoặc khó đánh thức (dấu hiệu sốc). Không tự lái xe đến cấp cứu."
