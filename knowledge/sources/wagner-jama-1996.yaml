notes_vi: "Lượt C lô 3 đọc tóm tắt qua API Europe PMC; tóm tắt không có số liệu. Tóm tắt nêu: dấu hiệu cơ thắt lưng chậu, sốt, đau di chuyển xuống hố chậu phải làm tăng khả năng bệnh; nôn trước khi đau làm giảm; không có đau di chuyển, không đau hố chậu phải, không phản ứng thành bụng hoặc không sốt làm giảm khả năng. Các LR cụ thể đọc qua Bảng 1 của snyder-afp-2018 (tài liệu tham khảo 7) và Bảng 2 của cartwright-afp-2008 (tham khảo 3)."
