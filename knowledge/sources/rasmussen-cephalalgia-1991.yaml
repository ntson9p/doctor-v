notes_vi: "Lượt C đọc tóm tắt qua API Europe PMC. 740 người dân Đan Mạch được phỏng vấn và khám: 16% có đau nửa đầu, 78% đau đầu căng thẳng. Đau nửa đầu: theo nhịp mạch 78%, nặng 85%, một bên 62%, tăng khi vận động thường ngày 96%. Đau đầu căng thẳng: ép chặt 78%, nhẹ hoặc vừa 99%, hai bên 90%, 72% không tăng khi vận động. Buồn nôn, sợ ánh sáng, sợ tiếng ồn hay gặp và thường vừa hoặc nặng ở đau nửa đầu; nếu có ở đau đầu căng thẳng thì thường nhẹ."
