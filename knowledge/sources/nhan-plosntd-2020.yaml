notes_vi: "Lượt C đọc toàn văn (PMC7451980) qua API Europe PMC (www.ebi.ac.uk/europepmc/webservices/rest). 1.196 trẻ đến 12 tuổi ở 3 bệnh viện TP.HCM (262 ngoại trú, 934 nội trú). Ngoại trú: loét miệng 81,7%, sốt 42,0%, tổn thương da 89,3%, phỏng nước 27,9%, ho 31,3%, sổ mũi 29,8%, tiêu chảy 3,8%, nôn 23,3%; giật mình ở nội trú 60,8%. Tổn thương da ở trên 91% ca do EV-A71, CV-A6, CV-A16 nhưng chỉ 61% ca do CV-A10. EV-A71 gặp nhiều hơn vào nửa cuối mỗi năm. Hai đợt dịch lớn: 2011–2012 (trên 200.000 ca nhập viện) và 2018 (trên 130.000 ca nhập viện)."
