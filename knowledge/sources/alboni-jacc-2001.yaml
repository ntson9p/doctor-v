notes_vi: "Lượt C (agent:pass-c, phần b) đọc tóm tắt qua API Europe PMC ngày 25/10/2026. 341 người ngất được đánh giá tiến cứu (Ý): do tim 23%, qua trung gian thần kinh 58%, thần kinh hoặc tâm thần 1%, không rõ 18%. Có bệnh tim (nghi ngờ hoặc chắc chắn sau đánh giá ban đầu) là yếu tố dự báo độc lập duy nhất của ngất do tim (OR 16; độ nhạy 95%, độ đặc hiệu 45%); không có bệnh tim loại trừ được ngất do tim ở 97%. Ở người có bệnh tim, gợi ý do tim: ngất khi nằm hoặc khi gắng sức, nhìn mờ, ngất kèm co giật. Gợi ý ngất phản xạ: cơn đầu và cơn cuối cách nhau trên 4 năm, khó chịu ở bụng trước khi mất ý thức, buồn nôn và vã mồ hôi khi hồi phục. Ở người không có bệnh tim, hồi hộp là yếu tố dự báo duy nhất của ngất do tim."
