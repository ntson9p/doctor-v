notes_vi: "Lượt C đọc tóm tắt qua API Europe PMC (PMC4624688). 913 bệnh nhân viêm màng não do liên cầu lợn trong 24 nghiên cứu (1980–2015): nam 82%; tiếp xúc lợn hoặc thịt lợn 61%; sốt 97%, đau đầu 95%, cứng gáy 93%; tổn thương da khi tiếp xúc lợn 20%; tử vong 2,9%; giảm thính lực 53%. Tổng quan đặc điểm lâm sàng, không phải độ chính xác chẩn đoán nên để bậc B."
