notes_vi: "URL là bản đăng lại trên trang thứ cấp (vnras.com, bản in NXB Y học 2016); cần thay bằng bản chính thức. Chưa kiểm tra văn bản thay thế. Lượt C Giai đoạn 3 lô 1 (agent:pass-c, 25/10/2026) mở lại PDF và đối chiếu thêm bài 'Chóng mặt' (tr. 72–78): mục 2.1 xếp chóng mặt kịch phát lành tính vào bệnh lý thạch nhĩ của mê đạo; mục 2.2 nêu viêm dây thần kinh tiền đình, thường cho là do vi rút; mục 2.3 nêu thiểu năng tuần hoàn động mạch đốt sống – thân nền là nguyên nhân thường gặp của chóng mặt ở người trên 50 tuổi (nhìn không rõ, song thị, giảm trương lực cơ, rối loạn ngôn ngữ, cùng cơn chóng mặt hoặc riêng biệt); mục 3.1: chóng mặt do tổn thương tiền đình ngoại biên là cảm giác quay tròn hoặc lắc lư, thường thành từng cơn, nhất là khi cử động hoặc thay đổi tư thế đầu, ngoài cơn người bệnh đi lại được, kèm buồn nôn, nôn, da xanh tái, có thể kèm ù tai, điếc tiếp nhận; rung giật nhãn cầu tư thế kịch phát chỉ xuất hiện khi thay đổi tư thế đột ngột và hết sau 30 giây đến 1 phút; mục 4: điều trị cơn chóng mặt kịch phát lành tính bằng nghiệm pháp đưa thạch nhĩ về vị trí ban đầu."
