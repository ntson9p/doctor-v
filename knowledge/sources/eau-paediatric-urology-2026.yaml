notes_vi: "Lượt R (Giai đoạn 3, lô 2) thêm và mở toàn văn trên uroweb.org ngày 26/10/2026 (bản trình bày tại Hội nghị EAU London 2026; ISBN của bộ hướng dẫn 978-94-92671-32-5). Chương Acute scrotum (mục 8): bìu cấp là cấp cứu tiết niệu nhi, hay gặp nhất do xoắn tinh hoàn, xoắn phần phụ tinh hoàn hoặc viêm mào tinh hoàn; xoắn tinh hoàn hay gặp nhất ở thời kỳ sơ sinh và quanh tuổi dậy thì. Người bệnh thường đau bìu (trừ xoắn sơ sinh); đau đột ngột, dữ dội kèm phản xạ phế vị (buồn nôn, nôn) là điển hình của xoắn. Khả năng tổn thương không hồi phục, hoại tử phụ thuộc thời gian, cửa sổ quyết định khoảng 4–6 giờ; teo tinh hoàn nặng có thể xảy ra chỉ sau 4 giờ khi xoắn trên 360°. Sốt hay gặp hơn ở viêm mào tinh hoàn (11–19%). Siêu âm Doppler còn dòng chảy không loại trừ xoắn. Mục 8.3.2: xoắn tinh hoàn cần mổ thám sát khẩn cho mọi ca trong 24 giờ đầu; tháo xoắn bằng tay có thể thử ở cấp cứu trong khi chờ mổ nhưng không được làm chậm mổ."
