notes_vi: "Lượt R lô 3 vòng 2 tải trang trực tiếp ngày 31/10/2026 để kiểm định nghĩa ca bệnh ho gà mà các lượt trước ghi theo trí nhớ. Ca xác định lâm sàng: bác sĩ chẩn đoán ho gà ở người ho ít nhất 2 tuần kèm ít nhất một trong: ho từng cơn dồn dập, tiếng rít khi hít vào, nôn ngay sau ho, không do nguyên nhân khác; chưa xác nhận bằng xét nghiệm. Ca xác định bằng xét nghiệm: đủ định nghĩa lâm sàng và cấy, PCR hoặc huyết thanh dương tính. Trang không nêu định nghĩa riêng cho trẻ dưới 1 tuổi (ho bất kể thời gian, ngừng thở): ý này chưa được xác minh."
