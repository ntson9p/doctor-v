notes_vi: "Lượt C (Giai đoạn 3 lô 3) tải lại trang Recommendations ngày 31/10/2026 (ban hành 23/6/2015, cập nhật lần cuối 15/4/2026; mục ung thư phổi vẫn là khuyến cáo 2015); lượt A đã mở trước đó. Mục 1.1.1: chuyển khám theo đường nghi ung thư khi phim phổi gợi ý ung thư phổi, hoặc người từ 40 tuổi ho ra máu không rõ nguyên nhân. Mục 1.1.2: chụp phim phổi khẩn cho người từ 40 tuổi có từ 2 triệu chứng không rõ nguyên nhân, hoặc từ 1 triệu chứng nếu đã từng hút thuốc, trong số: ho, mệt, khó thở, đau ngực, sụt cân, chán ăn. Mục 1.1.3: cân nhắc chụp phim phổi khẩn khi nhiễm trùng ngực kéo dài hoặc tái lại, ngón tay dùi trống, hạch trên đòn hoặc hạch cổ kéo dài, dấu hiệu khám ngực gợi ý ung thư, tăng tiểu cầu. Không có tỷ lệ triệu chứng."
