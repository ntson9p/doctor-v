notes_vi: "Điều tra dân số trưởng thành ở Đức: 1.003 người chóng mặt vừa hoặc nặng được phỏng vấn thần kinh – tai (so với khám chuyên khoa: nhạy 88%, đặc hiệu 92%). Tiêu chuẩn (bảng 1): cơn chóng mặt tiền đình tái diễn, mỗi cơn luôn dưới 1 phút, luôn do nằm xuống, trở mình hoặc từ 2 động tác đầu khác, không do bệnh khác. 80 người (8%) đạt tiêu chuẩn, khoảng một phần ba người chóng mặt do tiền đình. Bảng 2: mắc trọn đời 2,4% (nữ 3,2%, nam 1,6%); trong 1 năm 1,6% (nữ 2,3%, nam 0,9%): 0,5% ở 18–39 tuổi, 1,7% ở 40–59 tuổi, 3,4% từ 60 tuổi; mới mắc 0,6% mỗi năm; tuổi khởi phát trung bình 49,4. Bảng 3: đợt bệnh kéo dài trung vị 2 tuần (dưới 1 tuần 45%, 4–12 tuần 18,8%, trên 12 tuần 12,5%); 56% có nhiều đợt. Bảng 4: chóng mặt quay 86% (14% chỉ choáng váng không đặc hiệu), buồn nôn 33%, nôn 14%, mất thăng bằng 49% (giữa các cơn), ngã 1%; khởi phát khi trở mình trên giường 85%, nằm xuống 74%, ngồi dậy từ tư thế nằm 58%, cúi người 55%, ngửa đầu 41%; mọi người bệnh đều bị khi ở trên giường. 78% có đi khám. Liên quan độc lập với tuổi, đau nửa đầu, tăng huyết áp, rối loạn mỡ máu, đột quỵ; nữ chiếm 70% số ca."
