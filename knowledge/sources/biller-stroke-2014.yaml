notes_vi: "Lượt R (Giai đoạn 3, lô 2) chỉ đọc tóm tắt qua API Europe PMC: ahajournals.org chặn truy cập tự động (403). Có đính chính (Stroke 2016;47(11):e261); chưa thấy bản thay thế. Tóm tắt: bóc tách động mạch cổ là một trong những nguyên nhân hay gặp nhất của đột quỵ ở người trẻ và trung niên, thường ở đoạn cổ cao, gồm động mạch cảnh trong và động mạch đốt sống; biểu hiện: đau đầu một bên, đau gáy, thiếu máu não hoặc võng mạc (cơn thoáng qua, đột quỵ), liệt dây thần kinh sọ, hội chứng Horner, ù tai theo nhịp mạch; lực cơ học có thể gây tổn thương nội mạc và bóc tách; phần lớn nghiên cứu bệnh–chứng dân số thấy liên quan giữa nắn chỉnh cột sống cổ và đột quỵ do bóc tách động mạch đốt sống ở người trẻ, chưa rõ là nguyên nhân hay do bóc tách có sẵn; người làm nắn chỉnh cần nghĩ đến bóc tách khi người bệnh đến vì đau cổ. Chưa đọc được khoảng thời gian từ nắn chỉnh đến đột quỵ trong toàn văn (xem rothwell-stroke-2001)."
