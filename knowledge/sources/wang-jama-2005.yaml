notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần b) đọc lại tóm tắt qua API Europe PMC ngày 31/10/2026 (không có toàn văn mở); lượt A, lượt B đã đọc trước đó. 22 nghiên cứu ở người lớn đến cấp cứu vì khó thở. Làm tăng khả năng suy tim: tiền sử suy tim (LR dương 5,8), cơn khó thở kịch phát về đêm (LR dương 2,6), tiếng tim thứ ba (11), X quang sung huyết tĩnh mạch phổi (12), điện tim rung nhĩ (3,8). Làm giảm: không có tiền sử suy tim (LR âm 0,45), không khó thở khi gắng sức (LR âm 0,48), không có ran (0,51), không có bóng tim to (0,33)."
