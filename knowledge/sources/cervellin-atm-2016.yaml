notes_vi: "Lượt C lô 3 đọc toàn văn trên PMC. 5340 người lớn đau bụng cấp ở khoa cấp cứu một bệnh viện đô thị lớn ở Ý. Bảng 3–4, dưới 65 tuổi / từ 65 tuổi: đau bụng không đặc hiệu 32,0% / 29,7%; cơn đau quặn thận 34,5% / 20,8%; cơn đau quặn mật hoặc viêm túi mật 6,0% / 13,2%; viêm ruột thừa 4,5% / 1,5%; viêm tụy 1,4% / 3,3%; tắc ruột 0,3% / 2,3%; viêm túi thừa 2,5% / 7,3%; viêm dạ dày, loét 2,9% / 1,9%; viêm dạ dày – ruột 2,3% / 0,7%; nhiễm khuẩn và đau tiết niệu khác 2,9% / 2,4%. Bối cảnh cấp cứu nên bệnh nặng nhiều hơn cộng đồng; dùng chủ yếu để so sánh giữa các nhóm tuổi."
