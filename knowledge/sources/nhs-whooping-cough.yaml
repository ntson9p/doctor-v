notes_vi: "Lượt R lô 3 vòng 2 tải trang trực tiếp ngày 31/10/2026 (rà soát lần cuối 06/8/2026). Khởi đầu như cảm lạnh; sau khoảng 1 tuần có cơn ho kéo dài vài phút, nặng về đêm; có thể có tiếng rít khi hít vào (trẻ dưới 3 tháng và một số người lớn có thể không rít); trẻ nhỏ có thể khó thở, tím hoặc xám sau cơn ho; có thể nôn sau ho; ho kéo dài nhiều tuần, nhiều tháng. Trẻ dưới 6 tháng dễ biến chứng (mất nước, khó thở, viêm phổi, co giật). 'Urgent GP / 111': trẻ dưới 6 tháng có triệu chứng ho gà; ho rất nặng và nặng dần; đang có thai và tiếp xúc người bị ho gà. 'Call 999 or go to A&E': môi, lưỡi, mặt, da đột ngột tím hoặc xám; thở khó, thở nông; đau ngực tăng khi thở hoặc ho; trẻ co giật. Thường phải điều trị ở bệnh viện khi bệnh nặng hoặc trẻ dưới 6 tháng. Kháng sinh nếu chẩn đoán trong 3 tuần đầu kể từ khi ho, để giảm lây; lây tới 3 tuần sau khi bắt đầu ho."
