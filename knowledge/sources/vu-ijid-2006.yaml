notes_vi: "Lượt C lô 3 đọc tóm tắt qua API Europe PMC. 587 trẻ dưới 5 tuổi bị tiêu chảy đến bệnh viện ở Hà Nội (và 249 trẻ khỏe làm nhóm chứng): 71,0% dưới 2 tuổi (40,9% dưới 1 tuổi); sốt 43,6%; nôn 53,8%; mất nước 82,6%; phân nước 66,4%, phân nhầy 21,0%. Căn nguyên: rota vi rút nhóm A 46,7%, E. coli gây tiêu chảy 22,5%, Shigella 4,7%."
