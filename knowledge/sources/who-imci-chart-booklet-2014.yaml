notes_vi: "Đã tải PDF Chart booklet và bản văn bản của Module 2 qua API kho IRIS (bộ IMCI distance learning course, xuất bản 06/3/2014). Đã đối chiếu: dấu hiệu nguy hiểm toàn thân (2 tháng–5 tuổi); trẻ dưới 2 tháng 'very severe disease' gồm bú kém, co giật, thở nhanh từ 60 lần/phút, rút lõm lồng ngực nặng, sốt từ 37,5°C, nhiệt độ dưới 35,5°C (đo ở nách), chỉ cử động khi bị kích thích; sốt mỗi ngày quá 7 ngày thì chuyển khám; phân loại mất nước. Bản PDF dùng phông chữ đặc biệt nên công cụ trích xuất làm mất các con số ngưỡng; ngưỡng được đối chiếu qua Module 2. Lượt R lô 3 vòng 2 (31/10/2026) tải thêm Module 3 (Cough or difficult breathing) của cùng bộ tài liệu trên IRIS và đối chiếu bảng phân loại: thở rít khi trẻ nằm yên hoặc có dấu hiệu nguy hiểm toàn thân là viêm phổi nặng hoặc bệnh rất nặng, chuyển viện khẩn cấp; rút lõm lồng ngực hoặc thở nhanh là viêm phổi, uống amoxicillin 5 ngày, khám lại sau 3 ngày (trẻ phơi nhiễm hoặc nhiễm HIV có rút lõm thì chuyển viện); ho trên 2 tuần hoặc khò khè tái diễn thì chuyển khám lao, hen. Thở rít chỉ khi khóc, quấy ở trẻ không nặng thì không tính; tiếng khò khè khi thở ra không phải thở rít. Rút lõm lồng ngực: thành ngực dưới lõm vào khi hít vào, phải thấy rõ và thường xuyên. Dặn người chăm trẻ đưa trẻ trở lại ngay khi trẻ thở nhanh, khó thở, không uống được, nặng hơn, hoặc mới sốt."
