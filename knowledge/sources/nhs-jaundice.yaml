notes_vi: "Lượt R (Giai đoạn 3, lô 2) mở trang ngày 26/10/2026 (rà soát lần cuối 22/1/2024, hạn rà soát 22/1/2027). Vàng da có thể là dấu hiệu bệnh nặng như bệnh gan, nên cần được khám khẩn. 'Urgent advice: urgent GP / NHS 111' (khám khẩn) khi da hoặc lòng trắng mắt vàng, không phụ thuộc có sốt hay không; có thể kèm ngứa, nước tiểu sẫm, phân bạc màu hơn bình thường. Trang dành cho người lớn không có mục gọi 999. Nguyên nhân: bệnh gan do rượu, sỏi mật, viêm gan, viêm tụy, bệnh hồng cầu hình liềm. Vàng da ở trẻ sơ sinh hay gặp, thường lành tính: xem nhs-jaundice-in-babies."
