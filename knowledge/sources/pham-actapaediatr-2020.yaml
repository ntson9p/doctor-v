notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần b) đọc lại tóm tắt qua API Europe PMC ngày 31/10/2026; lượt A đã đọc trước đó. 909 trẻ dưới 5 tuổi nằm Bệnh viện Nhi Trung ương vì ho gà xác nhận (1/2015–6/2018): 44% dưới 2 tháng; ở nhóm này ho kéo dài 99%, ho dữ dội 87%, viêm phổi 91%. Trẻ trên 2 tháng chưa tiêm DPT có tỷ lệ nhập viện cao gấp 106 lần trẻ đã tiêm (149,6 so với 1,39 trên 100.000 dân)."
