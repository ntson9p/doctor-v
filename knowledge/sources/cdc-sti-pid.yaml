notes_vi: "Lượt C mở trang (rà soát lần cuối 21/9/2022; lượt B đặt ID 'cdc-sti-2021-pid'). Văn bản của chính phủ Mỹ (public domain). Triệu chứng thường kín đáo, không đặc hiệu hoặc không có; nhiều đợt bệnh không được nhận ra. Điều trị theo kinh nghiệm khi phụ nữ trẻ có hoạt động tình dục hoặc có nguy cơ bị đau vùng chậu hoặc bụng dưới không rõ nguyên nhân khác, kèm đau khi lay cổ tử cung, đau tử cung hoặc đau phần phụ. Tiêu chuẩn bổ sung: nhiệt độ miệng trên 38,3°C, mủ nhầy cổ tử cung. Nhập viện khi không loại trừ được cấp cứu ngoại khoa (như viêm ruột thừa), áp xe vòi – buồng trứng, có thai, bệnh nặng, buồn nôn và nôn, sốt trên 38,5°C, không dùng được thuốc uống. Thể nhẹ – vừa có thể điều trị ngoại trú, đánh giá lại nếu không đỡ sau 72 giờ. Bạn tình trong 60 ngày trước khởi phát cần được khám và điều trị."
