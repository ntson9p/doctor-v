notes_vi: "Lượt C đọc lại toàn văn qua API Europe PMC (PMC6455186). 378 người lớn sốt cấp không rõ ổ ở 4 bệnh viện Quảng Nam (tháng 5–8/2016). Bảng 1: đi rừng 11,1%, đau đầu 81,0%, chán ăn 54,5%, đau cơ 44,3%, ho 30,4%, vết loét 3,2%, nổi hạch 4,0%. Bảng 2: O. tsutsugamushi 5,5%, dengue 7,7%, Leptospira 4,8%. Bảng 4: sốt mò (19 ca) đi rừng 47,4%, vết loét 47,4%, nổi hạch 42,1%, đau đầu 94,8%, đau cơ 57,9%, đau khớp 36,8%, ho 31,6%, đau họng 5,3%, sốt trung vị 7,5 ngày, nhiệt độ cao nhất trung bình 39,2°C; dengue (28 ca) đau đầu 64,3%, đau bụng 17,9%, ho 10,7%, đau họng 14,3%, nhiệt độ cao nhất 39,6°C. Máu được làm PCR tìm S. Typhi/Paratyphi; không có ca dương tính nào trong danh sách tác nhân được báo cáo."
