notes_vi: "Xuất bản 28/8/2019, cập nhật lần cuối 26/02/2026. Khuyến cáo 1.5.1: huyết áp từ 180/120 không kèm triệu chứng thì thăm dò tổn thương cơ quan đích càng sớm càng tốt, đo lại trong 7 ngày. Khuyến cáo 1.5.2: khám chuyên khoa trong ngày nếu từ 180/120 kèm xuất huyết võng mạc hoặc phù gai thị, hoặc triệu chứng đe dọa tính mạng (lú lẫn mới, đau ngực, dấu hiệu suy tim, tổn thương thận cấp). Tăng huyết áp độ 3 (nặng): tâm thu từ 180 hoặc tâm trương từ 120. nice.org.uk trả lỗi 403 với truy cập tự động; lượt R đã đọc các trang chính thức (Overview, Recommendations, History) qua dịch vụ đọc văn bản r.jina.ai."
