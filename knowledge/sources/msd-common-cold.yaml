notes_vi: "Lượt C mở lại trang (rà soát toàn bộ 7/2026). Ủ bệnh 24–72 giờ; khởi đầu bằng ngứa hoặc đau họng, rồi hắt hơi, chảy mũi, nghẹt mũi, mệt; có thể đau đầu, đau cơ nhẹ. Nhiệt độ thường bình thường; sốt nhẹ ít gặp. Dịch mũi lúc đầu trong, có thể đục, đặc mà không phải bội nhiễm vi khuẩn. Ho thường nhẹ nhưng hay kéo dài sang tuần thứ hai; phần lớn triệu chứng hết trong 10 ngày. Biến chứng: viêm xoang, viêm tai giữa, làm nặng hen. Không dùng kháng sinh cho cảm lạnh."
