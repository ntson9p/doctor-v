notes_vi: "Lượt C đọc toàn văn (PMC3898587) qua API Europe PMC (www.ebi.ac.uk/europepmc/webservices/rest). Trẻ em ở nước thu nhập cao. Đau tai trong viêm tai giữa cấp: 50% hết vào ngày 3, 90% hết vào ngày 7–8; sốt kéo dài trung vị khoảng 3 ngày (một nghiên cứu: 17% dưới 1 ngày, 11% 1–2 ngày, 44% 2–3 ngày, 28% trên 3 ngày). Cảm lạnh: 90% hết triệu chứng vào ngày 15; thời gian trung bình 7–15 ngày."
