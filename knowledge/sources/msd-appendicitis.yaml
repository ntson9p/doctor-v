notes_vi: "Lượt C lô 3 mở trang (rà soát 7/2024). Kinh điển: đau thượng vị hoặc quanh rốn, sau đó buồn nôn, nôn, chán ăn; vài giờ sau đau chuyển xuống hố chậu phải, tăng khi ho và cử động. Hơn 50% người bệnh có biểu hiện khác kiểu kinh điển. Sốt nhẹ 37,7–38,3°C thường gặp. Đi ngoài thường ít hoặc không đi; có tiêu chảy thì nghĩ ruột thừa sau manh tràng. Nước tiểu có thể có hồng cầu, bạch cầu. Trẻ nhỏ đau có thể không khu trú; người già, phụ nữ có thai hay không điển hình, đau ít hơn. Hay gặp nhất ở tuổi vị thành niên và 20–29 tuổi."
