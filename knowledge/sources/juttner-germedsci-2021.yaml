notes_vi: "Hướng dẫn S2k (đồng thuận) của các hội chuyên ngành Đức. Triệu chứng không đặc hiệu, từ chóng mặt, đau đầu, đau thắt ngực đến bất tỉnh và tử vong; biểu hiện hay gặp nhất khi vào viện là đau đầu, buồn nôn, nôn, khó thở, chóng mặt và ngất. Tình huống điển hình gồm khói cháy, mất ý thức không rõ lý do trong phòng kín có lò sưởi, bếp. Người ngộ độc không chỉ đến bằng xe cấp cứu, nên khoa cấp cứu cần nghĩ đến ngộ độc khí CO ở người lơ mơ, chóng mặt, buồn nôn, nôn. Nghi ngộ độc thì cho thở oxy 100% ngay từ trước khi đến viện; người không có triệu chứng sau khám kỹ và đo đạc có thể không phải chuyển viện."
