notes_vi: "Lượt C lô 3 mở trang (rà soát 17/9/2026, hạn 17/9/2029). Sỏi lớn có thể gây đau dữ dội bắt đầu ở bên hông bụng hoặc thắt lưng, có thể lan xuống bẹn, bộ phận sinh dục; đau có thể lúc nặng lúc đỡ. Có thể sốt, thấy nóng lạnh hoặc run, buồn nôn, nôn, đi tiểu nhiều lần, nước tiểu đục. Hẹn khám khẩn hoặc gọi 111 khi đau dữ dội hoặc sốt, rét run. Sỏi có thể tái phát; yếu tố tái phát gồm đã từng bị sỏi, người thân bị sỏi, hay bị nhiễm khuẩn tiết niệu."
