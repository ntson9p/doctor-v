notes_vi: "Văn bản hành chính. Lượt C tải lại PDF trên kcb.vn (Cục Quản lý Khám, chữa bệnh; bản in NXB Y học 2016, phần 1) và trích chữ, đối chiếu các bài: Viêm màng não nhiễm khuẩn (tr. 17–18: căn nguyên ở trẻ em và người lớn, hội chứng màng não, dấu hiệu ít gặp, là bệnh cấp cứu); Thương hàn (tr. 38–40: khởi phát từ từ, sốt tăng dần tới 40°C, có thể chảy máu mũi, đào ban, li bì, biến chứng xuất huyết và thủng ruột); Sốt mò (tr. 60–63: ủ bệnh 6–21 ngày, vết loét đặc hiệu, hạch, ho, phù nhẹ mặt và mu chân, hết sốt trong 1–3 ngày khi được điều trị đặc hiệu); Nhiễm khuẩn huyết (tr. 79–81: yếu tố nguy cơ, sốt có thể kèm rét run hoặc hạ thân nhiệt, tử vong 20–50%, kháng sinh tĩnh mạch ngay). Bài cúm mùa và sốt rét đã có văn bản mới (1840/QĐ-BYT năm 2025, 3377/QĐ-BYT năm 2023); chưa thấy văn bản thay thế cho 4 bài trên. Lượt R Giai đoạn 3 lô 2 (26/10/2026) tải lại PDF: phần 1 không có bài riêng về bệnh do Leptospira (lượt R cũng chưa tìm được hướng dẫn chẩn đoán, điều trị riêng của Bộ Y tế về bệnh này). Bài Sốt mò, mục 3.4 Chẩn đoán phân biệt (tr. 62): bệnh do Leptospira biểu hiện chính là sốt, đau cơ, có thể phát ban, vàng da, tổn thương phổi, suy thận; xét nghiệm có thể giảm tiểu cầu, tăng men gan; dấu hiệu gợi ý là đau cơ và suy thận."
