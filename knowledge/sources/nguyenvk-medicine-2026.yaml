notes_vi: "Lượt C lô 3 đọc tóm tắt qua API Europe PMC. 25 nghiên cứu (8204 người lớn, 4641 trẻ em): nhiễm H. pylori gộp 58,7% (49,9–67,2%) ở người lớn và 77,2% (67,1–86,0%) ở trẻ em; dị biệt rất lớn (I² > 98%); thành thị 60,7%, nông thôn 46,8%; không khác giữa nghiên cứu ở cộng đồng và ở bệnh viện."
