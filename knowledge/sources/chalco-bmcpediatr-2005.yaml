notes_vi: "Phân tích gộp độ chính xác của da xanh do nhân viên y tế nhận định ở trẻ em (phần lớn nghiên cứu ở châu Phi). Hb dưới 11 g/dL: niêm mạc mắt nhạy 43,6%, đặc hiệu 81,4%; lòng bàn tay 39,2% và 86,7%. Hb dưới 8 g/dL: niêm mạc mắt 70,8% và 69%; lòng bàn tay 80,9% và 67,7%. Hb dưới 7 g/dL: niêm mạc mắt 36,9% và 88,7%. Không có dấu hiệu lâm sàng nào đủ chính xác."
