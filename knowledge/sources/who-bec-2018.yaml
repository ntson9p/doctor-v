notes_vi: "Tài liệu đào tạo chính thức của WHO và ICRC (ISBN 9789241513081), đã mở bản văn bản qua API kho IRIS. Phần sốc nêu: đau bụng dữ dội hoặc bụng rất cứng có thể là chảy máu hay nhiễm trùng trong ổ bụng, ở người có thể có thai thì nghĩ chửa ngoài tử cung; nôn ra máu, phân đen là chảy máu đường tiêu hóa. Danh mục tình trạng cấp cứu gồm cả ngộ độc, rắn và côn trùng cắn đốt, bỏng."
