notes_vi: "Tài liệu đào tạo chính thức của WHO và ICRC (ISBN 9789241513081), đã mở bản văn bản qua API kho IRIS. Phần sốc nêu: đau bụng dữ dội hoặc bụng rất cứng có thể là chảy máu hay nhiễm trùng trong ổ bụng, ở người có thể có thai thì nghĩ chửa ngoài tử cung; nôn ra máu, phân đen là chảy máu đường tiêu hóa. Danh mục tình trạng cấp cứu gồm cả ngộ độc, rắn và côn trùng cắn đốt, bỏng. Lượt R Giai đoạn 3 lô 2 (26/10/2026) tải lại bản PDF trên IRIS và đọc thêm. Module 3 (khó thở) và Module 4 (sốc): nhiễm toan ceton do đái tháo đường gây thở nhanh, sâu (người bệnh có thể kể là khó thở), tiểu nhiều, hơi thở mùi ngọt, đường máu hoặc đường niệu cao, mất nước, có thể đã biết đái tháo đường; người bệnh rất nặng, cần truyền dịch và chuyển gấp tới tuyến có khả năng điều trị. Module 4: dấu hiệu chảy máu trong ổ bụng gồm đau bụng, bụng rất cứng, bầm tím quanh rốn hoặc hai bên hông. Module 5 (rối loạn ý thức): sốc nhiệt (phơi nóng, nắng kéo dài; thân nhiệt cao, da rất nóng; có thể còn hoặc hết mồ hôi) là một nguyên nhân rối loạn ý thức; thân nhiệt cao kèm rối loạn ý thức gợi ý nhiễm trùng nhưng cũng gặp khi phơi nóng quá mức, gắng sức; khi thân nhiệt rất cao thì xịt phun sương nước mát, quạt, truyền dịch, tránh làm run."
