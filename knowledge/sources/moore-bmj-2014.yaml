notes_vi: "Lượt C lô 3 đọc toàn văn trên PMC. Khoa cấp cứu Mỹ, nhóm phát triển 1040 người lớn chụp CT vì nghi sỏi (loại người có sốt hoặc bạch cầu niệu), 515 người (49,5%) có sỏi niệu quản. Bảng 2 ghi số người có từng yếu tố và số trong đó có sỏi; lượt C tính tỷ lệ trong 515 người có sỏi: nam 72%; đau dưới 6 giờ 57%, 6–24 giờ 27%, trên 1 tuần 4,5%; khởi phát đột ngột 82%; đau 7–10/10 86%; đau liên tục 43%; lan xuống bẹn 44%; buồn nôn (có hoặc không nôn) 77%, có nôn 43%; tự thấy tiểu máu 27%; hồng cầu niệu 92%; tiểu buốt 25%; đau lưng 26%; đau khi cử động 18%; tiêu chảy 4%; tiền sử sỏi 38%. Lượt B trích cùng bài với ID moore-2014-bmj-stone-score."
