notes_vi: "Lượt C (agent:pass-c, phần b) đọc tóm tắt qua API Europe PMC ngày 25/10/2026. 125 người ngoại trú được đeo máy theo dõi điện tim vì hồi hộp (Mỹ): 43 người có rối loạn nhịp đáng kể; trong 82 người còn lại, 24 (29%) có rối loạn tâm thần hiện tại, 83% trong số đó là trầm cảm nặng hoặc rối loạn hoảng sợ. Ở nhóm này, cơn hồi hộp hay kéo dài trên 15 phút, có nhiều triệu chứng kèm và dữ dội hơn."
