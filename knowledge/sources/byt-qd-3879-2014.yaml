notes_vi: "Văn bản hành chính. Lượt C (phần b) mở toàn văn trên luatvietnam.vn ngày 25/10/2026 (bản PDF trên cổng NCD của WHO không trích được chữ). Hai lượt soạn ghi văn bản còn hiệu lực, sửa đổi một lần ngày 19/7/2017 (phần đái tháo đường đã có hướng dẫn riêng); lượt C chưa đối chiếu nội dung sửa đổi. Bài Bệnh Basedow: là thể điển hình, hay gặp nhất của cường giáp; nữ/nam 7–10/1. Lâm sàng: ăn nhiều, mau đói, gầy sút cân; luôn nóng bức, ra nhiều mồ hôi, bàn tay ấm ẩm; khoảng 50% tiêu chảy không đau quặn; hồi hộp, nhịp tim nhanh thường xuyên ở hầu hết người bệnh (100–140 chu kỳ/phút), đôi khi có cơn nhịp nhanh kịch phát trên thất; rung nhĩ là biến chứng hay gặp, thường ở người cao tuổi, bệnh nặng; bồn chồn, dễ cáu gắt, có thể đau đầu, chóng mặt, rối loạn giấc ngủ, mệt mỏi; run tay tần số cao, biên độ nhỏ ở đầu ngón; bướu giáp to lan tỏa; khoảng 50% có bệnh mắt trên lâm sàng, 10–20% lồi mắt một bên. Người cao tuổi: biểu hiện tim mạch rầm rộ, tuyến giáp to vừa phải, run tay biên độ lớn, ít triệu chứng mắt; thể vô cảm ở người già chủ yếu gầy sút nhiều; thể tăng cân khoảng 5%. Cơn nhiễm độc giáp cấp (cơn bão giáp) gặp ở 1–2% người nhiễm độc giáp nhập viện."
