notes_vi: "Lượt C đọc lại toàn văn qua API Europe PMC (PMC1579223): bảng 1–3 và phần Kết quả. 12 trạm y tế xã và phòng khám trạm sốt rét tỉnh Bình Thuận (4/2001–3/2002): người sốt cấp từ 38°C, dưới 14 ngày, không có dấu hiệu cơ quan rõ, đã loại sốt rét bằng lam máu; 697 người có huyết thanh kép, dengue cấp 33,6%. Bảng 2 (dengue thứ phát so với bệnh sốt khác): đau đầu 98,0% / 96,3%; chán ăn 79,7% / 83,6%; đau cơ 62,4% / 58,7%; đau họng 40,1% / 42,3%; ho 30,7% / 28,7%; sổ mũi 15,3% / 25,5%; đau khớp 12,4% / 14,5%; đau bụng 16,3% / 14,3%; nôn 11,9% / 13,6%; tiêu chảy 4,5% / 7,6%; số ngày sốt trung vị 1–2. Ban 4,0% / 4,3%; chảy máu tự nhiên 3,0% / 0,4%. Chẩn đoán sơ bộ 'thương hàn' ở 2,8–5,2% người sốt, không có xác nhận vi sinh."
