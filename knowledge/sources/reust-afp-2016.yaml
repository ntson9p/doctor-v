notes_vi: "Lượt C lô 3 mở trang AAFP. Đau bụng cấp chiếm khoảng 9% lượt khám ban đầu ở trẻ em; nguyên nhân cần mổ khoảng 2% (10–30% ở trẻ đến cấp cứu). Lồng ruột thường trước 2 tuổi; bộ ba đau quặn, nôn, phân máu gặp ở dưới một nửa số ca. Nôn dịch mật gợi ý tắc ruột, là dấu hiệu có thể cần mổ. Sốt có từ đầu ít gợi ý bệnh ngoại khoa; sốt xuất hiện sau khi đau hoặc nôn phù hợp với viêm phúc mạc đang tiến triển."
