notes_vi: "Lượt C đọc lại toàn văn qua API Europe PMC (PMC10316691). Giám sát trọng điểm ở Bệnh viện Nhi đồng 1 và 2 TP.HCM (2012–2021): 2.560 trẻ dưới 5 tuổi có viêm màng não mủ có thể, 66,6% dưới 1 tuổi; 6,2% xác định được phế cầu, Hib hoặc não mô cầu; tử vong 1,2%; số ca xác định mỗi năm 4,5–13/100.000 trẻ dưới 5 tuổi nhập 2 bệnh viện."
