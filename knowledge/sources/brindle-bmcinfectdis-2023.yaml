notes_vi: "Lượt C (Giai đoạn 3, lô 2, phần b) mở lại ngày 27/10/2026 (bản ghi và toàn văn PMC10262680 qua API Europe PMC). Số liệu giám sát hội chứng viêm não cấp 1998–2016 (Cục Y tế dự phòng): tỷ suất toàn quốc giảm 63,3%, từ 3,0 xuống 1,1 ca/100.000 dân/năm; tháng cao nhất 6/2004 (0,8/100.000 trong một tháng); trung bình theo tháng cao nhất vào tháng 6 (0,4/100.000) và thấp nhất vào tháng 1 (0,08/100.000). Miền Bắc đạt đỉnh vào mùa hè, miền Nam tương đối đều quanh năm; cao nhất ở Sơn La, Lai Châu. Khí hậu: càng lên phía Bắc mùa càng rõ (đông lạnh, khô; hè nóng, ẩm); miền Nam nóng, ẩm quanh năm."
