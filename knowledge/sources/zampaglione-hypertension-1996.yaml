notes_vi: "Lượt C (Giai đoạn 3, lô 2, phần b) mở lại ngày 27/10/2026 (bản ghi và tóm tắt qua API Europe PMC). Khoa cấp cứu ở Ý, 12 tháng: cơn tăng huyết áp (76% khẩn cấp, 24% cấp cứu) chiếm hơn 1/4 số ca cấp cứu nội khoa; khẩn cấp: đau đầu 22%, chảy máu mũi 17%, choáng ngất và kích động 10%; cấp cứu: đau ngực 27%, khó thở 22%, dấu thần kinh khu trú 21%; tổn thương: nhồi máu não 24%, phù phổi cấp 23%, bệnh não do tăng huyết áp 16%; tuổi 60 (khẩn cấp) và 67 (cấp cứu); tăng huyết áp chưa từng được biết ở 28% ca khẩn cấp."
