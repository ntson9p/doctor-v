notes_vi: "Xuất bản 19/11/2025, cập nhật lần cuối 23/9/2026 (khuyến cáo về procalcitonin). Bảng 1 (cộng đồng): tiêu chí nguy cơ cao gồm thay đổi ý thức mới có bằng chứng khách quan, nhịp thở từ 25 lần/phút, huyết áp tâm thu từ 90 mmHg trở xuống, mạch trên 130, không tiểu 18 giờ, da loang lổ hoặc xám tái, tím môi lưỡi, ban xuất huyết không mất khi ấn; nguy cơ trung bình gồm suy giảm miễn dịch, nhiệt độ dưới 36°C, không tiểu 12–18 giờ. nice.org.uk trả lỗi 403 với truy cập tự động; lượt R đã đọc các trang chính thức (Overview, Recommendations, History) qua dịch vụ đọc văn bản r.jina.ai."
