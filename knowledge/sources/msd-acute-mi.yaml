notes_vi: "Lượt C mở trang (rà soát toàn bộ 7/2026). Đau sâu sau xương ức kiểu đè ép, có thể lan ra lưng, hàm, tay, vai; thường kèm khó thở, vã mồ hôi, buồn nôn hoặc nôn (nhất là nhồi máu thành dưới). Khoảng 20% nhồi máu cơ tim không có triệu chứng rõ, tới 30% ở người đái tháo đường. Người bệnh hay tưởng là khó tiêu, có khi thấy đỡ sau ợ hơi hoặc uống thuốc dạ dày. Người cao tuổi có thể than khó thở nhiều hơn đau ngực; một số người đến khám vì ngất. Vài ngày đến vài tuần trước có thể có cơn đau thắt ngực tăng dần, khó thở, mệt, rối loạn tiêu hóa."
