notes_vi: "Lượt C đọc tóm tắt qua API Europe PMC (lượt B đặt ID 'perry-2013-jama-ottawa-sah'). 10 khoa cấp cứu ở Canada (2006–2010): 2.131 người lớn đau đầu đạt đỉnh trong 1 giờ, khám thần kinh bình thường; 132 người (6,2%) xuất huyết dưới nhện. Quy tắc Ottawa (từ 40 tuổi, đau hoặc cứng cổ, mất ý thức có người chứng kiến, khởi phát khi gắng sức, đau đạt đỉnh tức thì, hạn chế cúi cổ khi khám): độ nhạy 100%, độ đặc hiệu 15,3%."
