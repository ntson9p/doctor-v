notes_vi: "Lượt R mở trang (rà soát lần cuối 17/3/2026, hạn rà soát 17/3/2029). 'Call 999 or go to A&E' (gọi 999 hoặc đến cấp cứu): đang hồi hộp và cơn không hết, hoặc kèm đau ngực, khó thở, choáng như sắp ngất hoặc ngất. Nếu các triệu chứng đó đã hết: hẹn khám khẩn với bác sĩ gia đình hoặc gọi 111. Không tự lái xe đến cấp cứu; nhờ người chở hoặc gọi xe cấp cứu; mang theo thuốc đang dùng. 'See a GP' (không khẩn), khi đã hồi hộp nhưng vẫn khỏe: cơn hay tái lại hoặc dày hơn; kéo dài hơn vài phút; có bệnh tim; gia đình có người bệnh tim. Cảm giác: tim đập nhanh, không đều, hẫng hoặc thêm nhịp, đập mạnh, rung; cảm thấy ở ngực, cổ hoặc họng; kéo dài vài giây đến vài phút hoặc lâu hơn. Nguyên nhân thường gặp, lành tính: gắng sức nặng, thiếu ngủ, căng thẳng, lo âu, thuốc, rượu, cà phê, nicotin, chất gây nghiện; mãn kinh, có thai. Nguyên nhân bệnh lý: thiếu máu thiếu sắt, cường giáp, rối loạn nhịp tim, bệnh van tim."
