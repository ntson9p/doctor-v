notes_vi: "Điều tra mùa đông 10/2010–2/2011 ở vùng nhà một tầng sưởi bằng bếp than (Trung Quốc): 72 ca trong 67 hộ (5 hộ có 2 ca), tuổi trung vị 47, nam 56%. Triệu chứng ở 70 ca: mệt 43%, chóng mặt 39%, đau đầu 37%, buồn nôn hoặc nôn 33%, lú lẫn 14%, hôn mê 11%; 2 người chết. Nguồn khí: rò từ bếp than sưởi trong nhà 56%, quên khóa van gas 19%, bếp than trong phòng kín 10%, bình gas nấu ăn rò 10%, bếp lẩu 2,9%. Yếu tố nguy cơ: đặt bếp trong phòng ngủ (OR 11), không dập lửa trước khi ngủ. Số liệu triệu chứng lấy từ hồ sơ."
