notes_vi: "Lượt C (Giai đoạn 3 lô 2 phần a, 27/10/2026) mở lại trang web (tải bằng curl). Đã đối chiếu (rà soát 12/2024): 0,4–7,6% dân số, nam gấp 3 lần nữ, đỉnh 70–80 tuổi, hút thuốc là yếu tố nguy cơ mạnh nhất; đau sâu vùng thắt lưng – cùng; vỡ ở thành sau bên trái; phần lớn tử vong trước khi tới viện, khoảng 50% tử vong dù đã tới viện."
