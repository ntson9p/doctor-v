notes_vi: "Lượt C (agent:pass-c, phần b) đọc tóm tắt qua API Europe PMC ngày 25/10/2026. 417 người 65–95 tuổi khám bác sĩ gia đình ở Hà Lan vì chóng mặt kéo dài (2006–2008), được hội đồng chuyên gia xác định nguyên nhân. Kiểu tiền ngất (choáng như sắp ngất) hay gặp nhất (69%); 44% có hơn 1 kiểu chóng mặt. Nguyên nhân chính hay gặp nhất là bệnh tim mạch (57%), sau đó là bệnh tiền đình ngoại biên (14%) và bệnh tâm thần (10%). Tác dụng phụ của thuốc là nguyên nhân phụ hay gặp nhất (23%); 62% có hơn 1 nguyên nhân góp phần."
