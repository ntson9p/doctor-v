notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần c) đọc lại toàn văn PMC6556594 qua API Europe PMC ngày 31/10/2026; lượt B đã đọc trước đó. Đan Mạch 2009–2014, đọc lại hồ sơ người đến 40 tuổi nằm viện lần đầu vì tràn khí tự phát nguyên phát: tỷ lệ mới mắc 7,3/100.000/năm; nam 12,3, nữ 2,2 (tỷ số 5,9); nam cao nhất ở 16–20 tuổi (28,1) và 21–25 tuổi (24,7). Bảng 4 (514 người): hút thuốc hằng ngày 58%, hằng tuần 2%, chưa từng hút 27%; BMI thấp hơn dân số chung. Bảng 5: khởi phát triệu chứng đột ngột 95%; vào viện trong 24 giờ đầu 75%; lúc khởi phát đang nghỉ 70%, đang ngủ 16%, sinh hoạt thường ngày 11%, gắng sức 3%; 86% cần đặt dẫn lưu."
