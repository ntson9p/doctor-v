notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần b) đọc lại toàn văn (PMC12853784) qua API Europe PMC ngày 31/10/2026; lượt A (id nguyen-bmccardiovascdisord-2025) và lượt B đã đọc trước đó; hai id là cùng một bài, lượt C giữ id này. 277 người từ 60 tuổi nhập viện vì suy tim cấp ở 3 bệnh viện phía Nam, tuổi trung vị 76, nam 46,2%. Bảng 1: tăng huyết áp 73,3%, đái tháo đường 37,2%, hội chứng vành mạn 76,2%, rung nhĩ 34,7%. Bảng 2: lý do nhập viện khó thở 75,5%, đau ngực 36,1%, phù chân 40,4% (đã loại hội chứng vành cấp); suy tim mạn mất bù 85,2%, suy tim mới mắc 14,8%."
