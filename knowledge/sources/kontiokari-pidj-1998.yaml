notes_vi: "Lượt C đọc lại tóm tắt qua API Europe PMC (www.ebi.ac.uk/europepmc/webservices/rest). 857 trẻ đi nhà trẻ (tuổi trung bình 3,7) theo dõi 3 tháng, so sánh đợt nhiễm trùng hô hấp trên có và không có viêm tai giữa cấp: đau tai liên quan mạnh nhất (RR 21,3), tiếp theo đau họng (RR 3,2), ngủ không yên (RR 2,6), sốt (RR 1,8). Cha mẹ đoán đúng viêm tai giữa với độ nhạy 71%, độ đặc hiệu 80%."
