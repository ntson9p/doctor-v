notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần b) đọc lại tóm tắt qua API Europe PMC ngày 31/10/2026; lượt A đã đọc trước đó. 536 trẻ dưới 2 tuổi (trung vị 7 tháng) đi khám vì nhiễm trùng hô hấp dưới ở một bệnh viện nhi tuyến cuối miền Nam (2019–2021): 39,2% ngoại trú, 59,3% nằm khoa hô hấp, 1,5% hồi sức; gần 20% dương tính RSV (3,9% ở ngoại trú, 15,7% ở khoa hô hấp)."
