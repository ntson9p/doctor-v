notes_vi: "Lượt R lô 3 vòng 2 tải bản quét có dấu, chữ ký (20 trang, chứng thư số Bộ Y tế ngày 19/01/2018) đính kèm trang kcb.vn ngày 31/10/2026 và đọc các trang 1–7. Có hiệu lực từ 15/02/2018 (Điều 7); Thông tư 08/1999/TT-BYT hết hiệu lực từ ngày đó. Điều 2: phản vệ là phản ứng dị ứng có thể xuất hiện ngay lập tức từ vài giây, vài phút đến vài giờ sau khi tiếp xúc dị nguyên (thức ăn, thuốc và các yếu tố khác), có thể tử vong nhanh; sốc phản vệ có thể gây tử vong trong vài phút. Phụ lục I, mục I.1: nghĩ đến phản vệ khi có ít nhất một trong: mày đay, phù mạch nhanh; khó thở, tức ngực, thở rít; đau bụng hoặc nôn; tụt huyết áp hoặc ngất; rối loạn ý thức. Mục I.2: bệnh cảnh 1: triệu chứng da, niêm mạc xuất hiện trong vài giây đến vài giờ, kèm triệu chứng hô hấp (khó thở, thở rít, ran rít) hoặc tụt huyết áp, hậu quả của tụt huyết áp; bệnh cảnh 2: ít nhất 2 trong 4 nhóm (da, niêm mạc; hô hấp; tụt huyết áp; tiêu hóa như nôn, đau bụng) xuất hiện trong vài giây đến vài giờ sau tiếp xúc yếu tố nghi ngờ; bệnh cảnh 3: tụt huyết áp sau tiếp xúc yếu tố đã từng gây dị ứng. Chẩn đoán phân biệt gồm cơn hen, bệnh phổi tắc nghẽn mạn tính, khó thở thanh quản do dị vật, viêm. Phụ lục II: độ I (nhẹ) chỉ có triệu chứng da, niêm mạc (mày đay, ngứa, phù mạch); độ II (nặng) có từ 2 biểu hiện ở nhiều cơ quan (mày đay, phù mạch nhanh; khó thở nhanh nông, tức ngực, khàn tiếng; đau bụng, nôn, ỉa chảy; tim nhanh, loạn nhịp); độ III (nguy kịch): rít thanh quản, phù thanh quản, thở nhanh, khò khè, tím tái, vật vã, hôn mê, co giật, sốc, tụt huyết áp; độ IV ngừng tuần hoàn; mức độ có thể nặng lên rất nhanh, không theo tuần tự. Điều 6: tiêm bắp adrenalin ngay khi phản vệ từ độ II."
