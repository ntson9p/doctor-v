notes_vi: "Lượt C đọc lại toàn văn qua API Europe PMC (PMC6262185). Dữ liệu bảo hiểm y tế toàn quốc Hàn Quốc 2010–2014, người từ 15 tuổi: 39,1 đợt viêm thận – bể thận cấp/10.000 người/năm, tăng dần theo năm; nữ 71,3 so với nam 6,5 (khoảng 11 lần); cứ 4,1 người có 1 người nằm viện; 93,1% ca mang mã N10."
