notes_vi: "Lượt C đọc toàn văn (PMC9552893) qua API Europe PMC (www.ebi.ac.uk/europepmc/webservices/rest). Điểm xét nghiệm cộng đồng ở San Francisco, giai đoạn Omicron BA.1 (12/2021–01/2022): 3.032 người có triệu chứng dương tính so với 4.251 người có triệu chứng âm tính: sốt 30,4% và 14,4%; ho 67,4% và 50,6%; khó thở 8,0% và 6,0%; mệt 19,6% và 17,0%; đau cơ 28,6% và 17,8%; đau đầu 35,5% và 29,9%; mất vị hoặc mất ngửi 5,3% và 3,0%; đau họng 43,4% và 37,2%; nghẹt mũi 38,8% và 34,6%; tiêu chảy 4,8%. Bảng 2: ở trẻ dưới 12 tuổi dương tính, đau đầu 17,6%, đau cơ 8,6%, mệt 7,6%, mất vị hoặc ngửi 0,3%; trẻ âm tính: đau đầu 10,2%, đau cơ 4,8%, mệt 4,7%."
