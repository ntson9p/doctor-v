notes_vi: "Lượt C (phần b) đọc toàn văn PMC5819275 qua API Europe PMC. 31 nghiên cứu ở chăm sóc ban đầu; chóng mặt chiếm 1,0–15,5% lượt khám. Nguyên nhân (khoảng dao động giữa các nghiên cứu, không gộp vì dị biệt lớn): tim mạch 3,8–56,8%, tiền đình ngoại biên 5,4–42,1% (chóng mặt tư thế kịch phát lành tính 4,3–39,5%, viêm dây thần kinh tiền đình 0,6–24,0%, Ménière 1,4–2,7%), thần kinh 1,4–11,4%, tâm lý 1,8–21,6%, không rõ chẩn đoán 0–80,2%. Ở người từ 60 hoặc 65 tuổi, hai nghiên cứu ít sai lệch cho tim mạch 48,0% và 56,8%. Với chóng mặt kiểu quay (vertigo), nguyên nhân hay gặp là tiền đình ngoại biên, còn bệnh tim mạch không đóng vai trò nào."
