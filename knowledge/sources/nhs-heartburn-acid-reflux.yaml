notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần c) tải lại trang ngày 31/10/2026 (rà soát lần cuối 20/11/2023, hạn rà soát 20/11/2026); lượt A (id này) và lượt B (id nhs-heartburn-reflux, cùng trang, đã gộp) đã mở trước đó. Triệu chứng chính: nóng rát giữa ngực, vị chua khó chịu trong miệng; có thể ho hoặc nấc tái đi tái lại, khàn tiếng, hôi miệng, đầy bụng, buồn nôn; thường nặng hơn sau ăn, khi nằm, khi cúi. Yếu tố làm nặng: cà phê, cà chua, rượu, sô cô la, đồ béo, cay; thừa cân; hút thuốc; có thai; căng thẳng; thuốc giảm đau chống viêm; thoát vị khe; loét dạ dày; vi khuẩn dạ dày. Tự chăm sóc: ăn bữa nhỏ, giảm cân, không ăn trong 3–4 giờ trước khi ngủ, không mặc đồ chật ở eo, không hút thuốc, hạn chế rượu, kê cao đầu giường 10–20 cm (không chồng thêm gối). Hỏi dược sĩ khi hay bị ợ nóng. 'Non-urgent advice: see a GP' khi đổi lối sống và thuốc không đỡ, ợ nóng gần như ngày nào cũng có, hoặc kèm nuốt vướng, nôn nhiều, sụt cân không rõ lý do."
