notes_vi: "Lượt C lô 3 đọc toàn văn trên PMC. 16 nghiên cứu (3711 phụ nữ) ở chăm sóc ban đầu. Bảng 2 (ngưỡng 10^2 CFU/ml), độ nhạy / đặc hiệu: tiểu buốt 0,80 / 0,38; tiểu nhiều lần 0,88 / 0,20; tiểu gấp 0,67 / 0,45; tiểu máu 0,25 / 0,85; đau bụng dưới 0,50 / 0,50; đau hông 0,26 / 0,69; đau lưng 0,38 / 0,57; sốt 0,10 / 0,92; khí hư 0,15 / 0,77 (LR+ 0,65)."
