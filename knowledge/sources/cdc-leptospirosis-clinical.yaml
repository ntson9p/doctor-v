notes_vi: "Lượt C (Giai đoạn 3, lô 2, phần b) mở lại ngày 27/10/2026 bằng WebFetch (trang ghi ngày 02/6/2026). Ủ bệnh 5–14 ngày, dao động 2–30 ngày. Triệu chứng không đặc hiệu: sốt, đau cơ, đau đầu, nôn, buồn nôn, vàng da, tiêu chảy, rét run, đau bụng, mệt, xung huyết kết mạc, đôi khi phát ban. Không điều trị có thể suy thận, vàng da, suy hô hấp, suy gan, viêm màng não; 5–10% suy đa cơ quan và tử vong. Phơi nhiễm: nước nhiễm nước tiểu động vật (lội, tắm, uống), nhất là sau bão, lũ, mưa lớn; tiếp xúc động vật nhiễm bệnh."
