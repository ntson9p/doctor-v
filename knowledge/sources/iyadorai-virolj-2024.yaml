notes_vi: "Lượt C đọc toàn văn (PMC11462790) qua API Europe PMC (www.ebi.ac.uk/europepmc/webservices/rest). Nghiên cứu hồi cứu ở trung tâm chăm sóc ban đầu của một bệnh viện đại học (Kuala Lumpur, 2012–2014), chủ yếu người lớn (tuổi trung bình 49 và 42). Bảng 1, coronavirus gây cảm lạnh (n = 205) so với cúm (n = 417): sốt 46,8% và 83,0%; ho 85,9% và 84,7%; đau họng 72,2% và 44,6%; nghẹt mũi 60,5% và 39,6%; chảy mũi 84,9% và 59,0%; hắt hơi 70,7%; đau đầu 56,6% và 9,8%; đau cơ 57,6% và 19,4%. Số liệu cúm về đau đầu, đau cơ thấp bất thường (dữ liệu hồi cứu)."
