notes_vi: "Lượt R (Giai đoạn 3, lô 2) thêm và mở trang ngày 26/10/2026 (địa chỉ cũ /conditions/jaundice-newborn/ chuyển về đây; rà soát lần cuối 24/3/2026, hạn rà soát 24/3/2029). Vàng da sơ sinh hay gặp, thường lành tính, tự hết; vàng rõ nhất khoảng ngày thứ 3, thường hết sau khoảng 2 tuần. 'Urgent advice: urgent GP, nữ hộ sinh hoặc NHS 111' (khám khẩn) khi trẻ trên 24 giờ tuổi và: nghĩ trẻ bị vàng da; đã được chẩn đoán vàng da mà không đỡ hoặc nặng lên; nước tiểu vàng sẫm hoặc nâu, hoặc phân màu kem nhạt (giữ mẫu phân cho nhân viên y tế xem). 'Call 999 or go to A&E' (gọi 999 hoặc đến cấp cứu) khi trẻ vàng da và: ngủ nhiều hơn bình thường hoặc khó đánh thức; không bú; mềm nhũn, cứng người hoặc giật; thân nhiệt từ 38°C hoặc từ 36°C trở xuống, sờ thấy nóng hoặc lạnh, run; không có tã ướt; khó thở, thở rên, rút lõm, thở rất nhanh; dưới 24 giờ tuổi. Nguyên nhân khác: hội chứng Gilbert, nhiễm trùng (như rubella), bất đồng nhóm máu mẹ con, bệnh gan."
