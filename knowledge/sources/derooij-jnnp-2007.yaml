notes_vi: "Lượt C đọc tóm tắt qua API Europe PMC (lượt B đặt ID 'derooij-2007-sah-incidence'). 51 nghiên cứu, 58 quần thể ở 21 nước: tỷ suất mới mắc khoảng 9,1/100.000 người-năm (Nhật Bản 22,7; Phần Lan 19,7; Nam và Trung Mỹ 4,2); so với nhóm 45–55 tuổi, dưới 25 tuổi bằng 0,10 lần, trên 85 tuổi 1,61 lần; nữ cao hơn nam 1,24 lần, khác biệt bắt đầu từ khoảng 55 tuổi."
