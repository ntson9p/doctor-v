notes_vi: "Xuất bản 24/3/2010, cập nhật lần cuối 30/11/2016; vẫn hiện hành. Đã đối chiếu khuyến cáo 1.2.1.3 (triệu chứng gợi ý hội chứng vành cấp) và 1.2.1.7 (chuyển viện cấp cứu khi nghi hội chứng vành cấp và đang đau, hoặc đau trong 12 giờ qua). Lượt R lô 3 vòng 2 (31/10/2026) tải lại trực tiếp các trang Overview, Recommendations, History trên nice.org.uk (không qua dịch vụ đọc hộ) và đối chiếu lại: rà soát lần cuối 04/9/2019, không có bằng chứng mới làm đổi khuyến cáo. 1.2.1.3: triệu chứng gợi ý hội chứng vành cấp gồm đau ở ngực và/hoặc vùng khác (tay, lưng, hàm) kéo dài trên 15 phút; đau ngực kèm buồn nôn, nôn, vã mồ hôi nhiều, khó thở, nhất là khi có nhiều dấu hiệu; đau ngực kèm rối loạn huyết động; đau ngực mới xuất hiện hoặc đau thắt ngực ổn định nặng lên đột ngột, tái diễn thường xuyên khi gắng sức nhẹ hoặc lúc nghỉ, cơn thường trên 15 phút. 1.2.1.5: không phải người bệnh nào cũng đau giữa ngực. 1.2.1.7: chuyển cấp cứu khi nghi hội chứng vành cấp và đang đau, hoặc đã hết đau nhưng đau trong 12 giờ qua và điện tim bất thường hoặc chưa có. 1.2.1.8: đau trong 12 giờ qua đã hết, điện tim bình thường, hoặc cơn đau cuối cách 12–72 giờ: khám khẩn trong ngày. Mục 1.3: đau ngực ổn định nghi đau thắt ngực ổn định (đánh giá, làm xét nghiệm; không nêu mức khẩn)."
