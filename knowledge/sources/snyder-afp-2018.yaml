notes_vi: "Lượt C lô 3 mở trang AAFP. Bảng 1: LR ở người lớn lấy từ Wagner 1996 (tài liệu tham khảo 7), ở trẻ em từ Benabbas 2017 (tham khảo 8). Người lớn: đau hố chậu phải LR+ 7,3–8,5, LR− 0–0,28; đau di chuyển LR+ 3,2, LR− 0,50; co cứng thành bụng LR+ 3,8, LR− 0,82; sốt LR+ 1,9, LR− 0,58; chán ăn LR+ 1,3, LR− 0,64; nôn LR+ 0,92, LR− 1,1; buồn nôn LR+ 0,69–1,2; chưa từng đau tương tự LR+ 1,5, LR− 0,32. Bảng không ghi độ nhạy; các lượt soạn tự suy độ nhạy từ cặp LR. Nguy cơ suốt đời 8,6% ở nam, 6,7% ở nữ; thủng ruột thừa 17–32% ở người lớn."
