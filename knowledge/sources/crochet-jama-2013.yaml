notes_vi: "Lượt C đọc tóm tắt qua API Europe PMC. Tổng quan JAMA Rational Clinical Examination: 14 nghiên cứu, 12.101 phụ nữ có thai bị đau bụng hoặc ra máu âm đạo ở đầu thai kỳ. Mọi yếu tố bệnh sử có LR+ dưới 1,5; khám thấy đau khi lay cổ tử cung LR+ 4,9, khối phần phụ 2,4, đau phần phụ 1,9; siêu âm đầu dò thấy khối phần phụ mà không thấy thai trong tử cung LR+ 111."
