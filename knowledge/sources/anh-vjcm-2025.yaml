notes_vi: "Lượt C (phần b) mở trang bài và tải PDF toàn văn ngày 25/10/2026, tự trích chữ. Mô tả cắt ngang 70 người xuất huyết tiêu hóa do loét dạ dày tá tràng nằm khoa Nội tiêu hóa năm 2023: nam/nữ 2,2/1; tuổi trung bình 56,6 ± 16,6; dùng thuốc chống viêm không steroid 37,1%. Bảng 3: đi ngoài phân đen 63/70 (90,0%); nôn ra máu 35/70 (50,0%); đau, nóng rát vùng thượng vị 49/70 (70%); ngất 4/70 (5,7%); da xanh, niêm mạc nhợt 51/70 (72,9%); hoa mắt, chóng mặt 59/70 (84,3%). Là người bệnh nằm viện nên tần suất cao hơn ở cộng đồng."
