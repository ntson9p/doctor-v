notes_vi: "Đã mở bản văn bản trên kho IRIS (ISBN 978 92 4 154787 1). Bìa ghi 'Expiry date: 2014'. Hình 1.4 nêu dấu hiệu cảnh báo: đau bụng hoặc ấn đau, nôn liên tục, ứ dịch, chảy máu niêm mạc, li bì hoặc vật vã, gan to trên 2 cm, Hct tăng kèm tiểu cầu giảm nhanh. Về xử trí lâm sàng, WHO đã ban hành hướng dẫn mới năm 2025 (xem who-arbovirus-2025); phân độ năm 2009 vẫn được hướng dẫn mới dẫn lại."
