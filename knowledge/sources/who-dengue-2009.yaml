notes_vi: "Đã mở bản văn bản trên kho IRIS (ISBN 978 92 4 154787 1). Bìa ghi 'Expiry date: 2014'. Hình 1.4 nêu dấu hiệu cảnh báo: đau bụng hoặc ấn đau, nôn liên tục, ứ dịch, chảy máu niêm mạc, li bì hoặc vật vã, gan to trên 2 cm, Hct tăng kèm tiểu cầu giảm nhanh. Về xử trí lâm sàng, WHO đã ban hành hướng dẫn mới năm 2025 (xem who-arbovirus-2025); phân độ năm 2009 vẫn được hướng dẫn mới dẫn lại. Lượt C Giai đoạn 3 lô 1 (agent:pass-c, 25/10/2026) tải lại bản PDF tiếng Anh trên IRIS và đối chiếu thêm: mục 2.3.1.1 (hỏi bệnh) có hỏi thay đổi ý thức, co giật, chóng mặt; Textbox D: hạ huyết áp tư thế là dấu hiệu của sốc còn bù; Textbox E (tiêu chí nhập viện): dấu hiệu liên quan tụt huyết áp (có thể do thoát huyết tương) gồm mất nước, không uống được; choáng váng hoặc hạ huyết áp tư thế; vã mồ hôi nhiều, ngất, lả khi hết sốt."
