notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần b) tải lại trang ngày 31/10/2026 (rà soát toàn bộ 10/2025, cập nhật 7/2026); lượt A đã đọc trước đó. Suy tim trái: khó thở, mệt là triệu chứng hay gặp nhất; khó thở khi gắng sức hoặc lúc nghỉ tùy mức nặng; tim nhanh, thở nhanh; ca nặng tím, tụt huyết áp, lú lẫn (lú lẫn hay gặp hơn ở người cao tuổi). Có thể khò khè hoặc thở rít do phù phổi. Nghĩ tới suy tim cấp khi khó thở khi gắng sức, mệt, khó thở khi nằm, phù mới xuất hiện hoặc nặng lên, nhất là ở người có nhồi máu cơ tim, tăng huyết áp, bệnh van tim; nghi ngờ vừa ở người cao tuổi, đái tháo đường. Cần điều trị nội trú ngay khi phù phổi, triệu chứng nặng, suy tim mới mắc hoặc không đáp ứng điều trị ngoại trú; đợt nặng lên nhẹ của suy tim đã biết có thể điều trị tại nhà."
