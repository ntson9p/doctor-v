notes_vi: "Lượt R lô 3 vòng 2 tải trang trực tiếp ngày 31/10/2026 (rà soát lần cuối 30/01/2024). 'Call 999 or go to A&E' (người lớn): khó thở dữ dội (thở hổn hển, nghẹn, không nói được thành lời); ngực tức hoặc nặng; đau lan ra tay, lưng, cổ, hàm; môi hoặc da rất nhợt, tím, xám; đột ngột lú lẫn. 'Call 999 or go to A&E' (trẻ em): khó thở (thở rên, bụng hõm vào dưới bờ sườn); môi hoặc da rất nhợt, tím, xám; đột ngột lú lẫn (kích động, khóc mãi); mềm nhũn, không phản ứng như bình thường. 'Contact NHS 111': khó thở hơn bình thường; buồn nôn, nôn; ho ra máu; đau hoặc sưng một bên chân; hồi hộp. 'See a GP' (không khẩn): khó thở tăng khi làm việc thường ngày hoặc khi nằm; khó thở kèm phù mắt cá chân; ho từ 3 tuần. Không có mục chỉ ghi 'Call 999'."
