notes_vi: "Lượt C mở lại trang (rà soát 22/03/2024, hạn rà soát 22/03/2027). Triệu chứng chính: nghẹt hoặc sổ mũi, hắt hơi, đau họng, khàn tiếng, ho, mệt và khó chịu; có thể có sốt, đau cơ, mất vị và ngửi, cảm giác căng tai, mặt. Triệu chứng tăng dần trong 2–3 ngày; người lớn đỡ sau 1–2 tuần, trẻ nhỏ có thể lâu hơn. Đi khám nếu sốt cao hơn 3 ngày, triệu chứng nặng lên, khó thở hoặc đau ngực, không đỡ sau 10 ngày, ho quá 3 tuần, có bệnh nền hoặc suy giảm miễn dịch. Không dùng aspirin cho trẻ dưới 16 tuổi; kháng sinh không được khuyên dùng."
