notes_vi: "Lượt C đọc lại tóm tắt qua API Europe PMC (www.ebi.ac.uk/europepmc/webservices/rest). Khảo sát cộng đồng đại diện toàn quốc ở Anh. Ở người dương tính có triệu chứng, mất vị hoặc mất ngửi giảm từ 44%/45% (17/10/2021) xuống 16%/13% (02/01/2022) và 15%/12% (27/03/2022). Ho, sốt, khó thở, đau cơ, mệt, đau đầu giảm khi Omicron chiếm ưu thế; đau họng tăng. Triệu chứng gặp ở người 18–65 tuổi nhiều hơn ở trẻ em và người cao tuổi."
