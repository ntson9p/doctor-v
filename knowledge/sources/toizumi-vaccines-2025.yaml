notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần b) đọc lại tóm tắt qua API Europe PMC ngày 31/10/2026; lượt B đã đọc trước đó. Đoàn hệ sơ sinh ở Nha Trang (1.977 trẻ): nhập viện vì nhiễm trùng hô hấp cấp do RSV 17,92 trên 1.000 trẻ-năm trong 24 tháng đầu, 25,40 ở nhũ nhi nhỏ; kháng thể trung hòa RSV ở máu cuống rốn thấp liên quan với nguy cơ nhập viện cao hơn trong những tháng đầu."
