notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần c) tải lại trang ngày 31/10/2026 (rà soát lần cuối 23/11/2023, hạn rà soát 23/11/2026); lượt A, lượt B đã mở trước đó (bản nháp ở hai thư mục, đã gộp). Dấu hiệu đầu: châm chích hoặc đau ở một vùng da, nhức đầu hoặc thấy không khỏe; ban thường mọc vài ngày sau; hiếm khi đau mà không có ban. Ban hay ở ngực và bụng, chỉ một bên người; ban ở cả hai bên ít khả năng là zona; thành mụn nước rồi khô, đóng vảy; da còn đau tới sau khi hết ban; lành trong tới 4 tuần. 'Non-urgent advice': gặp dược sĩ nếu từ 18 tuổi, cố gắng trong 3 ngày từ khi nổi ban. 'Urgent advice: urgent GP / NHS 111': có thai, đang cho con bú mà ban ở vú, ban ở mắt hoặc mũi, thay đổi thị lực, suy giảm miễn dịch nặng, từ 17 tuổi trở xuống. Tự chăm sóc: giữ ban sạch khô, mặc đồ rộng, chườm mát; không để băng dính vào ban. Tránh người có thai chưa mắc thủy đậu, người suy giảm miễn dịch, trẻ dưới 1 tháng khi ban còn chảy dịch."
