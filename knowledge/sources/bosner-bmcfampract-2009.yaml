notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần b) đọc lại tóm tắt qua API Europe PMC ngày 31/10/2026; lượt A đã đọc trước đó. 1.212 người từ 35 tuổi đau ngực khám 74 bác sĩ đa khoa (Đức): rối loạn tâm lý 11,2% ở nữ, 7,3% ở nam; bệnh mạch vành 13,0% ở nữ, 17,2% ở nam. Các yếu tố dự báo bệnh mạch vành khác nhau theo giới. Lượt C phần c đọc thêm toàn văn PMC2801475 qua API Europe PMC cùng ngày (bản nháp của lượt A ở hai thư mục, đã gộp vào tệp này). 56% nữ (678/1.212). Bảng 2 (nữ/nam): hội chứng thành ngực 48,6%/44,0%; bệnh mạch vành ổn định và cấp 13,0%/17,2%; tâm lý 11,2%/7,3%; nhiễm trùng hô hấp trên 7,4%/9,0%; hội chứng vành cấp 2,9%/4,5%; trào ngược dạ dày – thực quản 3,7%/3,2%; chấn thương 1,8%/5,1%; bệnh dạ dày lành tính 2,8%/1,3%; viêm phổi hoặc viêm màng phổi 1,3%/3,0%; bệnh phổi tắc nghẽn hoặc hen 1,5%/2,4%; khác 8,7%/7,5%. Bảng 3 (180 người bệnh mạch vành ổn định hoặc cấp, nữ/nam): đau kiểu đè ép 60,9%/64,4%; bó chặt 54,5%/46,7%; đau tăng khi gắng sức 38,6%/47,8%; đau khi hít vào 5,7%/4,3%; vị trí sau xương ức 8,0%/6,5%, ngực trái 63,6%/68,5%; lan ra lưng 11,4%/14,1%; lan tay trái 15,9%/14,1%; khó thở 30,7%/37,0%; buồn nôn, nôn 5,7%/4,3%; ho 4,5%/3,3%; ấn vào đau 18,5%/6,3%; thời gian cơn đau dưới 1 phút 13,6%/10,9%, 1–30 phút 36,4%/45,7%, 30–60 phút 10,2%/22,8%, 1–12 giờ 23,9%/8,7%, liên tục 10,2%/8,7%."
