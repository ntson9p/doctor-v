notes_vi: "Lượt C mở lại trang (rà soát toàn bộ 6/2026). Hay gặp nhất ở trẻ dưới 2 tuổi; nhiều đợt nhất ở 2–4 tuổi. Triệu chứng khởi đầu thường là đau tai, hay kèm nghe kém; trẻ nhũ nhi chỉ quấy, khó bú, khó ngủ; trẻ nhỏ hay kèm sốt, buồn nôn, nôn, tiêu chảy. Thủng màng nhĩ gây chảy dịch hoặc mủ tai, thường đỡ đau nhanh. Biến chứng ít gặp. Kháng sinh cho trẻ dưới 6 tháng, chảy mủ tai, sốt từ 39°C, đau tai vừa hoặc nặng trên 48 giờ; các trường hợp khác có thể theo dõi nếu tái khám được trong 48–72 giờ."
