notes_vi: "Lượt C lô 3 mở trang (rà soát 21/02/2023; hạn rà soát ghi 21/02/2026, đã quá hạn). Đau đột ngột, nhói ở bụng trên bên phải, lan về phía vai phải, thường dai dẳng không hết sau vài giờ; vùng này rất đau khi ấn, hít sâu làm đau tăng. Một số người có sốt, buồn nôn, nôn, vã mồ hôi, chán ăn, vàng da, khối phồng ở bụng. Đi khám càng sớm càng tốt khi đau bụng đột ngột dữ dội, nhất là kéo dài vài giờ hoặc kèm vàng da, sốt; nhiều khả năng phải nhập viện. Sỏi mật gặp ở hơn 1/10 người lớn ở Anh."
