notes_vi: "Lượt C mở lại trang (rà soát lần cuối 13/2/2025). Triệu chứng: sốt cao; buồn nôn hoặc nôn; đau thắt lưng hoặc hông; tiêu chảy; đau mỏi cơ như cúm; tiểu buốt; tiểu nhiều lần, gấp; nước tiểu sẫm hoặc đục. Trẻ nhỏ có thể đái dầm, lơ mơ; trẻ dưới 2 tuổi có thể chỉ có sốt. Khám gấp trong ngày (hoặc gọi 111) khi sốt cao, rét run, nhiệt độ dưới 36°C, đau bụng dưới hoặc lưng dưới sườn, tiểu ra máu, nôn, cả ngày không đi tiểu, có thai. Gọi 999 khi lú lẫn, lơ mơ, khó nói. Phụ nữ, người có sỏi thận hoặc suy giảm miễn dịch dễ mắc hơn."
