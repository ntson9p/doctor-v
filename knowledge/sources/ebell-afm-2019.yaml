notes_vi: "Lượt C mở lại trang PMC (bảng 3). 17 nghiên cứu ngoại trú ở người nghi viêm mũi xoang cấp, phần lớn ở phòng khám chuyên khoa (tai mũi họng, hô hấp, dị ứng); 51% có bệnh trên phim, 31% do vi khuẩn. Độ nhạy (độ đặc hiệu): sốt trên 38°C 0,11 (0,87); đau hàm hoặc trán 0,49 (0,63); đau một bên hàm 0,30 (0,80); đau tăng khi cúi 0,72 (0,39); chảy mũi mủ 0,71 (0,54); chảy mũi bất kỳ 0,75 (0,49); nghẹt mũi 0,83 (0,24); giảm hoặc mất ngửi 0,61 (0,54); đau đầu 0,50 (0,50); ho 0,69 (0,40); có nhiễm trùng hô hấp trước đó 0,87 (0,27); bệnh nặng lên lần hai 0,74 (0,41); đau răng 0,34 (0,80). Thời gian bệnh không có ngưỡng rõ (độ nhạy 25–70%)."
