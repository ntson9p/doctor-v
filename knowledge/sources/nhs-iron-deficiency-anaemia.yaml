notes_vi: "Lượt C mở lại trang (rà soát lần cuối 26/01/2024, hạn rà soát 26/01/2027). Triệu chứng: mệt, thiếu năng lượng, khó thở, cảm thấy rõ tim đập (hồi hộp), da nhợt hơn bình thường, nhức đầu; ít gặp hơn: ù tai, ngứa, đau lưỡi, rụng tóc, thèm ăn thứ không phải thức ăn, móng hình thìa. Kinh nguyệt nhiều và có thai là nguyên nhân rất hay gặp; chảy máu dạ dày, ruột cũng hay gặp. Khám bác sĩ gia đình (không khẩn) nếu nghĩ mình bị thiếu máu thiếu sắt. Ăn thêm rau lá xanh đậm, ngũ cốc và bánh mì có bổ sung sắt, thịt, trái cây sấy, các loại đậu; bớt trà, cà phê, sữa và thức ăn nhiều phytat. Viên sắt dùng khoảng 6 tháng, có thể làm phân sẫm màu; để xa tầm tay trẻ em vì quá liều sắt có thể gây tử vong ở trẻ nhỏ."
