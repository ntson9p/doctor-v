notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần c) đọc lại tóm tắt qua API Europe PMC ngày 31/10/2026; lượt A, lượt B đã đọc trước đó. 1.212 người từ 35 tuổi đau ngực khám 74 bác sĩ đa khoa (Đức): đau từ thành ngực 46,6%. Ở người hội chứng thành ngực: đau sau xương ức 52,0% và/hoặc bên trái 69,2%; đau dai dẳng 28,0%; 72,3% không liên quan thời điểm trong ngày; 55,4% vẫn còn đau sau 6 tháng. Điểm 4 dấu hiệu (căng cơ khu trú, đau nhói, ấn vào đau, không ho): diện tích dưới đường cong 0,78."
