notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần b) đọc lại tóm tắt qua API Europe PMC ngày 31/10/2026; lượt A đã đọc trước đó. 632 trẻ dưới 2 tuổi nằm hai bệnh viện nhi ở Thành phố Hồ Chí Minh vì nhiễm trùng hô hấp dưới (5/2009–12/2010): 48% dương tính RSV; RSV gặp ở tuổi nhỏ hơn các vi rút khác, nhiều nhất trong 6 tháng đầu. Tuổi nhỏ và sốt khi nhập viện liên quan với bệnh nặng. Phân nhóm RSV thay đổi qua hai mùa mưa."
