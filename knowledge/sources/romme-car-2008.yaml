notes_vi: "Lượt C (agent:pass-c, phần b) đọc tóm tắt qua API Europe PMC ngày 25/10/2026. 503 người mất ý thức thoáng qua đến cấp cứu (Amsterdam), chẩn đoán sau 2 năm theo dõi. Ngất phản xạ là chẩn đoán hay gặp nhất (60,2%): 73,4% ở người dưới 40 tuổi, 45,3% ở người từ 60 tuổi. Dấu hiệu báo trước hay gặp nhất: da tái 79,9%, choáng váng 73,4%, vã mồ hôi 63,0%; phần lớn yếu tố khởi phát và dấu hiệu báo trước gặp nhiều hơn ở người dưới 40 tuổi và ở nữ."
