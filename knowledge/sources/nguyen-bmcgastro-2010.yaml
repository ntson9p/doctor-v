notes_vi: "Lượt C lô 3 đọc toàn văn trên PMC. 270 người được nội soi (14–86 tuổi) ở Hà Nội và TP.HCM: 65,6% nhiễm H. pylori; loét dạ dày – tá tràng 14,1% (21 tá tràng, 6 dạ dày, 11 cả hai), gặp ở 20,9% người nhiễm và 1,1% người không nhiễm. Bài không nêu lý do nội soi."
