notes_vi: "Lượt C (phần b) mở trang OUP ngày 25/10/2026 và xác nhận tên bài. Dịch tễ: khoảng một nửa dân số ngất ít nhất một lần; tỷ lệ cao ở tuổi 10–30 và tăng lại sau 65 tuổi; bảng web 2: trong 100 người ngất, 25–50 người đi khám, 10–20 người được chuyển chuyên khoa, 2–10 người đến khoa cấp cứu. Ngất phản xạ là nguyên nhân hay gặp nhất ở mọi bối cảnh và lứa tuổi; ngất do tim đứng thứ hai, hay gặp hơn ở cấp cứu và người cao tuổi, rất hiếm ở trẻ em, thiếu niên, người trẻ; hạ huyết áp tư thế hiếm dưới 40 tuổi, hay gặp ở người rất cao tuổi. Ngất phế vị: thần kinh thực vật hoạt hóa (buồn nôn, da tái, vã mồ hôi) trước khi ngất; hồi hộp có thể do nhịp nhanh xoang. Hạ huyết áp tư thế ban đầu: tụt huyết áp trong 15 giây sau khi đứng, choáng hoặc nhìn mờ, thường không ngất; thể kinh điển trong 3 phút; thuốc vận mạch và lợi tiểu là nguyên nhân (bảng web 1). Ngất hoặc tiền ngất có thể xảy ra lúc bắt đầu cơn nhịp nhanh kịch phát."
