notes_vi: "Lượt C lô 3 đọc bản thảo tác giả trên PMC. Giám sát ở bệnh viện, trẻ dưới 2 tuổi tại Bangladesh, Nepal, Pakistan, Việt Nam. Việt Nam (986 ca): tuổi trung vị 12 tháng (8–17), 55% ở năm thứ hai, nam 60%; nôn 76%, phân có máu 20%, sốt 16%, tiêu chảy 5%, táo bón 2%; 99% tháo lồng bằng thụt hơi hoặc nước, 1% phải mổ, không tử vong. Chung 4 nước: nôn 77%, phân có máu 37%, sốt 21%, tiêu chảy 12%."
