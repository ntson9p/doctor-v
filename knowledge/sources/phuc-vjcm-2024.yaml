notes_vi: "Lượt C (phần b) mở trang bài (tóm tắt tiếng Anh) ngày 25/10/2026; PDF không trích được chữ tiếng Việt nên chỉ dùng số liệu trong tóm tắt. 110 người xơ gan vỡ giãn tĩnh mạch thực quản (5/2021–8/2022): nam 94,5%; tuổi trung bình 55,3 ± 9,3; nghiện rượu 79,1%; nhiễm vi rút viêm gan B, C 14,5%; xuất huyết mức vừa 46,4%, nặng 29,5%; trên 70% có nôn ra máu, đi ngoài phân đen, cổ chướng, tuần hoàn bàng hệ; 100% thiếu máu (50,9% nặng)."
