notes_vi: "Lượt C (agent:pass-c, phần b) đọc tóm tắt qua API Europe PMC ngày 25/10/2026. Trong 5.762 người đến 6 khoa cấp cứu (New England) với triệu chứng nghi thiếu máu cơ tim cấp, 251 người ngất không đau ngực được phân tích: thiếu máu cơ tim cấp 7% (18/251); cả 18 người đều có bất thường thiếu máu trên điện tim lúc đến; đau tay hoặc vai, tiền sử đau thắt ngực khi gắng sức, nhồi máu cũ liên quan với thiếu máu cơ tim cấp. Mẫu được chọn từ người nghi thiếu máu cơ tim nên không cho biết tỷ lệ đau ngực ở người ngất do hội chứng vành cấp."
