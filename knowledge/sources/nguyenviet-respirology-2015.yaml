notes_vi: "Lượt C (Giai đoạn 3 lô 3) đọc lại tóm tắt qua API Europe PMC ngày 31/10/2026 (chỉ có tóm tắt). Người không hút thuốc từ 40 tuổi ở Việt Nam và Indonesia (1.506 người, có hô hấp ký): bệnh phổi tắc nghẽn mạn tính 6,9%, nam 12,9% so với nữ 4,4% (gần gấp 3); Việt Nam 8,1%, thành thị Việt Nam 11,1%; chỉ 6% số ca phát hiện trong nghiên cứu đã từng được chẩn đoán (94% chưa). Phần mở đầu: ước tính 25–40% người bệnh chưa từng hút thuốc."
