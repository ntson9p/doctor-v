notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần b) đọc lại tóm tắt qua API Europe PMC ngày 31/10/2026 (không có toàn văn mở); lượt A, lượt B đã đọc trước đó. 53 nghiên cứu so sánh người có và không có xét nghiệm dương tính với Bordetella pertussis. Người lớn: ho từng cơn độ nhạy 93,2% (độ đặc hiệu 20,6%); không sốt độ nhạy 81,8% (đặc hiệu 18,8%); nôn sau ho độ nhạy 32,5% (đặc hiệu 77,7%); tiếng rít khi hít vào độ nhạy 29,8% (đặc hiệu 79,5%). Trẻ em: nôn sau ho độ nhạy 60,0%, đặc hiệu 66,0% (ít giúp chẩn đoán)."
