notes_vi: "Lượt C đọc toàn văn PMC11572064 qua API Europe PMC. 1.362 sinh viên y ở hai trường đại học Việt Nam (tuổi trung bình 21,1; bộ câu hỏi HARDSHIP, tiêu chuẩn ICHD-3). Tỷ lệ mắc 1 năm (nam/nữ): đau đầu bất kỳ 82,6% (74,7%/88,5%); đau nửa đầu 21,8% (17,0%/25,4%); đau đầu căng thẳng 54,0% (52,7%/55,0%). Nữ liên quan độc lập với đau nửa đầu (OR hiệu chỉnh 1,77); tuổi tăng làm giảm đau nửa đầu (OR 0,84 mỗi năm) và tăng đau đầu căng thẳng (1,07)."
