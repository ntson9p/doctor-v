notes_vi: "Lượt C mở trang (rà soát toàn bộ 5/2025, cập nhật 7/2026; tác giả Aparna Sridhar). Khoảng 2/100 thai được phát hiện là thai ngoài tử cung; khối thai thường vỡ sau khoảng 6–16 tuần; phần lớn có đau vùng chậu, ra máu âm đạo hoặc cả hai; kinh nguyệt không đều có thể làm người bệnh không biết mình có thai; trước khi vỡ có thể đau dữ dội đột ngột, rồi ngất hoặc sốc mất máu, viêm phúc mạc; khoảng 53% thai ở người đang đặt vòng tránh thai là thai ngoài tử cung."
