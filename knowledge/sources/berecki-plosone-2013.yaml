notes_vi: "Lượt C (phần b) đọc toàn văn PMC3815402 qua API Europe PMC. Bảng 2 gộp 7 nghiên cứu (ở đơn vị ngất, cấp cứu, phòng khám; Ý, Thụy Sĩ, Canada, Mỹ): ngất do tim 488 người (21%) so với không do tim 1.800 người. Dưới 40 tuổi 1% so với 29%; 40–60 tuổi 22% so với 38%; từ 60 tuổi 77% so với 33%; nam 64% so với 49%; bệnh tim cấu trúc 87% so với 26%; từ 2 cơn trở xuống 70% so với 38% (trên 2 cơn 30% so với 62%); buồn nôn 8% so với 20%; vã mồ hôi 18% so với 43%; có (hoặc kéo dài) tiền triệu 39% so với 63%; nhìn mờ 21% so với 29%; hồi hộp 8% so với 11% (không khác biệt có ý nghĩa, bị loại khỏi mô hình); ngất khi nằm 10% so với 2%; ngất khi gắng sức 13% so với 2%. Tỷ lệ ngất do tim ở 4 bộ dữ liệu kiểm tra: 21% (Calgary), 9% (Amsterdam), 5% (Milan), 11% (Rochester)."
