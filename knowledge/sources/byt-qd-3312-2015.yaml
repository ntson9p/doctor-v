notes_vi: "Trùng số với 3312/QĐ-BYT năm 2024 (đột quỵ): luôn ghi kèm năm. Trang kcb.vn (Cục QLKCB) xác nhận số, ngày 07/8/2015 và còn hiệu lực, nhưng chỉ có tệp RAR; nội dung đã đọc qua bản PDF do vnras.com đăng lại (bìa ghi 'Ban hành kèm theo Quyết định số 3312/QĐ-BYT ngày 07/8/2015'). Văn bản không có bài riêng về lồng ruột: lồng ruột chỉ được nêu trong bài Xuất huyết tiêu hóa (nguyên nhân xuất huyết tiêu hóa dưới, cần loại trừ nguyên nhân ngoại khoa). Lượt R Giai đoạn 3 lô 2 (26/10/2026) tải lại bản PDF trên vnras.com và đọc thêm hai bài. Bài Chẩn đoán và điều trị bệnh Kawasaki (tr. 311–315): hay gặp ở nhũ nhi và trẻ dưới 5 tuổi; sốt cao liên tục, không đáp ứng kháng sinh, trung bình 9–11 ngày nếu không điều trị; 6 biểu hiện chính: sốt liên tục từ 5 ngày, viêm kết mạc 2 bên, môi đỏ sẫm, mọng hoặc rỉ máu, đỏ khoang miệng, lưỡi đỏ nổi gai như dâu tây, phù mu tay chân, đỏ lòng bàn tay chân rồi bong da đầu ngón ở tuần 2–3, ban đa dạng, hạch góc hàm trên 1,5 cm; có thể tấy đỏ sẹo BCG; thể điển hình cần từ 5/6 biểu hiện, hoặc 4 biểu hiện kèm giãn, phình động mạch vành (theo Nhật Bản); theo AHA, sốt liên tục từ 5 ngày là tiêu chuẩn bắt buộc; thể không điển hình có ít biểu hiện hơn, chẩn đoán dựa vào tổn thương mạch vành hoặc xét nghiệm viêm (CRP từ 3 mg/dL, máu lắng từ 40 mm/giờ, từ 3/6 tiêu chuẩn xét nghiệm); phân biệt với sởi, sốt tinh hồng nhiệt, dị ứng thuốc, nhiễm Leptospira, viêm khớp thiếu niên, hội chứng sốc, Stevens-Johnson, nhiễm vi rút, sốt xuất huyết; globulin miễn dịch nên dùng sớm trong 10 ngày đầu của bệnh; tổn thương động mạch vành gặp ở khoảng một phần ba số ca không điều trị hoặc điều trị muộn. Bài Toan xeton do đái tháo đường (tr. 632–637): bệnh sử thường có sụt cân, đau bụng, nôn, đái nhiều, uống nhiều; lâm sàng: mất nước, thở nhanh sâu kiểu Kussmaul, buồn nôn, nôn, đau bụng giống bệnh cấp tính vùng bụng, li bì hoặc hôn mê, sốt khi có nhiễm trùng; đường máu thường trên 11 mmol/L."
