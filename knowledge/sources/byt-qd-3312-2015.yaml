notes_vi: "Trùng số với 3312/QĐ-BYT năm 2024 (đột quỵ): luôn ghi kèm năm. Trang kcb.vn (Cục QLKCB) xác nhận số, ngày 07/8/2015 và còn hiệu lực, nhưng chỉ có tệp RAR; nội dung đã đọc qua bản PDF do vnras.com đăng lại (bìa ghi 'Ban hành kèm theo Quyết định số 3312/QĐ-BYT ngày 07/8/2015'). Văn bản không có bài riêng về lồng ruột: lồng ruột chỉ được nêu trong bài Xuất huyết tiêu hóa (nguyên nhân xuất huyết tiêu hóa dưới, cần loại trừ nguyên nhân ngoại khoa). Lượt R Giai đoạn 3 lô 2 (26/10/2026) tải lại bản PDF trên vnras.com và đọc thêm hai bài. Bài Chẩn đoán và điều trị bệnh Kawasaki (tr. 311–315): hay gặp ở nhũ nhi và trẻ dưới 5 tuổi; sốt cao liên tục, không đáp ứng kháng sinh, trung bình 9–11 ngày nếu không điều trị; 6 biểu hiện chính: sốt liên tục từ 5 ngày, viêm kết mạc 2 bên, môi đỏ sẫm, mọng hoặc rỉ máu, đỏ khoang miệng, lưỡi đỏ nổi gai như dâu tây, phù mu tay chân, đỏ lòng bàn tay chân rồi bong da đầu ngón ở tuần 2–3, ban đa dạng, hạch góc hàm trên 1,5 cm; có thể tấy đỏ sẹo BCG; thể điển hình cần từ 5/6 biểu hiện, hoặc 4 biểu hiện kèm giãn, phình động mạch vành (theo Nhật Bản); theo AHA, sốt liên tục từ 5 ngày là tiêu chuẩn bắt buộc; thể không điển hình có ít biểu hiện hơn, chẩn đoán dựa vào tổn thương mạch vành hoặc xét nghiệm viêm (CRP từ 3 mg/dL, máu lắng từ 40 mm/giờ, từ 3/6 tiêu chuẩn xét nghiệm); phân biệt với sởi, sốt tinh hồng nhiệt, dị ứng thuốc, nhiễm Leptospira, viêm khớp thiếu niên, hội chứng sốc, Stevens-Johnson, nhiễm vi rút, sốt xuất huyết; globulin miễn dịch nên dùng sớm trong 10 ngày đầu của bệnh; tổn thương động mạch vành gặp ở khoảng một phần ba số ca không điều trị hoặc điều trị muộn. Bài Toan xeton do đái tháo đường (tr. 632–637): bệnh sử thường có sụt cân, đau bụng, nôn, đái nhiều, uống nhiều; lâm sàng: mất nước, thở nhanh sâu kiểu Kussmaul, buồn nôn, nôn, đau bụng giống bệnh cấp tính vùng bụng, li bì hoặc hôn mê, sốt khi có nhiễm trùng; đường máu thường trên 11 mmol/L. Lượt R Giai đoạn 3 lô 3 vòng 2 (31/10/2026) tải lại bản PDF trên vnras.com, đọc thêm: bài Cấp cứu ngừng tuần hoàn, mục 4 'Trẻ bị dị vật đường thở' (tr. 44–45): hay gặp ở tuổi trước khi đi học; nghi ngờ khi trẻ đột ngột suy hô hấp, ho, nôn ọe, thở rít; trẻ tắc nghẽn đường thở chưa rõ nguyên nhân nhưng vẫn tự thở cần được đưa ngay tới bệnh viện; trẻ còn ho được thì khuyến khích ho. Bài Dị vật đường thở (tr. 279–282): hay gặp ở trẻ 6 tháng – 5 tuổi; hội chứng xâm nhập (ho sặc sụa ngay khi dị vật vào); dị vật ở phế quản có thể chỉ gây cơn ho, rít một bên; dị vật bỏ quên gây ho kéo dài, khó thở từng cơn, điều trị không đỡ; cần soi phế quản. Bài Viêm phổi do vi khuẩn ở trẻ em (tr. 262–263): viêm phổi khi ho, sốt kèm thở nhanh (dưới 2 tháng từ 60, 2–12 tháng từ 50, 1–5 tuổi từ 40, trên 5 tuổi từ 30 lần/phút), hoặc rút lõm lồng ngực (phần dưới lồng ngực lõm vào khi hít vào), hoặc ran; điều trị ngoại trú. Viêm phổi nặng (điều trị tại bệnh viện) khi có thêm bỏ bú hoặc không uống được, lơ mơ, hôn mê, co giật, thở rên, rút lõm lồng ngực rất nặng, tím hoặc SpO2 dưới 90%, hoặc trẻ dưới 2 tháng. Bài Viêm tiểu phế quản cấp ở trẻ em (tr. 275–276): tuổi dưới 6 tháng là yếu tố nguy cơ; khám có thể thấy thở nhanh, co kéo cơ hô hấp, rút lõm lồng ngực, thở rên; thể nặng khò khè tăng, không bú được, dễ kiệt sức, có thể tím tái, ngừng thở."
