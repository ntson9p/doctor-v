notes_vi: "Lượt C lô 3 mở trang AAFP. Bảng 2 (LR): viêm ruột thừa (Wagner 1996): đau hố chậu phải LR+ 8,4, LR− 0,2; đau di chuyển LR+ 3,6, LR− 0,4; sốt LR+ 3,2, LR− 0,4; chán ăn LR+ 1,1, LR− 0,9. Tắc ruột (Böhner 1998): táo bón LR+ 8,8, LR− 0,6; chướng bụng LR+ 5,7, LR− 0,4; đỡ đau sau nôn LR+ 4,5; đau quặn LR+ 2,8, LR− 0,8; từng mổ bụng LR+ 2,7, LR− 0,4. Viêm túi mật (Trowbridge 2003): dấu Murphy LR+ 5,0; đau hạ sườn phải LR+ 2,5, LR− 0,3; sốt LR+ 1,8, LR− 0,8; vàng da LR 1,0 (Singer 1996). Dưới 25% người viêm túi mật không đau hạ sườn phải hoặc không có cơn đau quặn; dấu Murphy có ở 65% người lớn bị viêm túi mật."
