notes_vi: "Lượt C lô 3 mở trang (ngày trên trang 24/4/2024). Triệu chứng thường gặp: tiêu chảy, nôn, buồn nôn, đau bụng; triệu chứng khác: sốt, đau đầu, đau mỏi người. Khởi phát 12–48 giờ sau phơi nhiễm; phần lớn đỡ sau 1–3 ngày. Dấu hiệu mất nước: tiểu ít, khô miệng, chóng mặt khi đứng, trẻ khóc ít nước mắt, ngủ li bì hoặc quấy bất thường."
