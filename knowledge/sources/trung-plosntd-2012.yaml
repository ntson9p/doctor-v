notes_vi: "Lượt C đọc lại toàn văn qua API Europe PMC (PMC3383761). Bảng 3: dengue chưa biến chứng nằm khoa nhiễm Bệnh viện Bệnh Nhiệt đới TP.HCM (472 trẻ em, tuổi trung vị 12; 285 người lớn). Lúc vào viện (trẻ em / người lớn): đau đầu 69% / 93%; mệt mỏi 90% / 94%; đau cơ 19% / 70%; ho 16% / 24%; nôn 37% / 50%; tiêu chảy 11% / 37%; đau bụng 20% / 41%; phát ban 7% / 13%. Cả đợt bệnh: chỉ xuất huyết dưới da 44% / 38%; chảy máu niêm mạc nhẹ–vừa 10% / 46%; hết sốt trung vị ngày 6. Số liệu bệnh viện."
