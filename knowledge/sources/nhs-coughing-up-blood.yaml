notes_vi: "Lượt R lô 3 vòng 2 tải trang trực tiếp ngày 31/10/2026 (rà soát lần cuối 13/6/2024). 'Urgent GP / 111': ho ra vài chấm, vài vệt máu nhỏ, hoặc thấy máu trong đờm, trên khăn. 'Call 999 or go to A&E': ho ra nhiều hơn vài chấm, vài vệt máu; ho ra máu kèm khó thở, tim đập rất nhanh, hoặc đau ngực, đau lưng trên (có thể là cục máu đông ở phổi). Nguyên nhân hay gặp: ho kéo dài hoặc ho nặng, nhiễm khuẩn phổi, đường thở (viêm phổi, lao, viêm phế quản), giãn phế quản; đôi khi là cục máu đông, ung thư phổi."
