notes_vi: "Người bảo trì mở trực tiếp chương Guidelines (bản 2026) ngày 25/10/2026. Mục 3.4.2 (xử trí nhiễm khuẩn huyết và/hoặc vô niệu ở thận tắc nghẽn): thận tắc nghẽn kèm dấu hiệu nhiễm khuẩn tiết niệu và/hoặc vô niệu là cấp cứu tiết niệu; thường cần giải áp khẩn để tránh biến chứng. Khuyến cáo mạnh: giải áp hệ thống đài bể thận khẩn khi nhiễm khuẩn huyết do sỏi gây tắc (dẫn lưu qua da hoặc đặt ống thông niệu quản); hoãn điều trị sỏi tới khi hết nhiễm khuẩn; dùng kháng sinh ngay."
