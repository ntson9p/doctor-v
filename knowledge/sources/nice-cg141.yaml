notes_vi: "Xuất bản 13/6/2012, cập nhật lần cuối 25/8/2016; vẫn hiện hành. Là hướng dẫn xử trí trong bệnh viện (người trên 16 tuổi), không có tiêu chí phân loại trước viện: mọi người xuất huyết tiêu hóa trên cấp cần được đánh giá nguy cơ bằng thang Blatchford ngay lần đánh giá đầu (khuyến cáo 1.1.1–1.1.2). nice.org.uk trả lỗi 403 với truy cập tự động; lượt R đã đọc các trang chính thức (Overview, Recommendations, History) qua dịch vụ đọc văn bản r.jina.ai."
