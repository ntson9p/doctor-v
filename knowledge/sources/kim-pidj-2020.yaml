notes_vi: "Lượt C (Giai đoạn 3, lô 2, phần b) mở lại ngày 27/10/2026 (bản ghi và tóm tắt qua API Europe PMC; toàn văn không mở được). Khảo sát toàn quốc Hàn Quốc 2015–2017: 15.378 ca Kawasaki; tuổi trung bình 33 tháng (0–205 tháng); tỉ số nam/nữ 1,41; tỷ suất 196,9/100.000 trẻ dưới 5 tuổi/năm; hay gặp vào mùa đông (tháng 12–1) và cuối xuân (tháng 5–6); phình động mạch vành 1,7%."
