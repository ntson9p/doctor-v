notes_vi: "Năm 2021 thiếu máu ở 24,3% dân số thế giới; nam 17,5%, nữ 31,2% (mọi lứa tuổi); 15–49 tuổi: nữ 33,7%, nam 11,3%. Chênh lệch theo giới lớn nhất ở 10–64 tuổi, nhỏ ở trẻ dưới 5 tuổi (41,4% chung) và thu hẹp lại từ 80 tuổi. Nguyên nhân hàng đầu là thiếu sắt do ăn uống (66,2% số ca), tiếp theo là bệnh hemoglobin và tan máu; bệnh phụ khoa và mất máu sản khoa quan trọng ở phụ nữ tuổi sinh đẻ; ở người trên 80 tuổi, bệnh thận mạn đứng thứ hai về gánh nặng."
