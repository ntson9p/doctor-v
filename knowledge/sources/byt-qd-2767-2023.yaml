notes_vi: "Lượt R lô 3 vòng 2 tải bản PDF có chữ ký số của Bộ Y tế (ký ngày 04/7/2023, 87 trang) trên kcb.vn ngày 31/10/2026; id giống bản nháp của lượt A. Chương 3 (đợt cấp), mục 3.1: đợt cấp là tình trạng nặng lên trong vòng 14 ngày, đặc trưng bởi khó thở và/hoặc ho khạc đờm, có thể kèm thở nhanh, tim nhanh, thường do nhiễm trùng phế quản hoặc ô nhiễm không khí. Yếu tố nguy cơ kết cục xấu: bệnh đồng mắc (nhất là suy tim, bệnh tim thiếu máu cục bộ), nhập viện vì đợt cấp trong 3 tháng trước, từ 2 đợt cấp trong năm trước, tắc nghẽn nặng, đang thở oxy hoặc thở máy tại nhà, từ 65 tuổi. Mục 3.4.1, Bảng 3.2 (yếu tố xem xét nơi điều trị): hơn 80% đợt cấp điều trị ngoại trú; ngoại trú khi đáp ứng tốt với xử trí ban đầu, triệu chứng nhẹ (khó thở khi gắng sức, nhịp thở dưới 24 lần/phút, SpO2 từ 92%, tỉnh táo); nhập viện (khoa Nội hoặc Hô hấp) khi không đủ điều kiện chăm sóc tại nhà, đáp ứng không tốt với xử trí ban đầu, hoặc triệu chứng nặng (khó thở khi nghỉ, nhịp thở từ 24 lần/phút, SpO2 dưới 92%)."
