notes_vi: "Lượt C (Giai đoạn 3 lô 3) tải lại trang ngày 31/10/2026 (rà soát lần cuối 11/4/2023, hạn rà soát 11/4/2026 đã qua). Phần lớn chưa có triệu chứng rõ trước cuối tuổi 40–50. Triệu chứng hay gặp: khó thở (lúc đầu chỉ khi gắng sức, có khi thức dậy ban đêm vì khó thở), ho có đờm kéo dài, hay nhiễm trùng ngực, khò khè kéo dài. Đợt nặng lên đột ngột (đợt cấp) thường vài lần mỗi năm, nhất là mùa đông. Ít gặp, thường ở giai đoạn nặng: sụt cân, mệt, phù mắt cá chân; đau ngực và ho ra máu thường do bệnh khác như nhiễm trùng ngực hoặc ung thư phổi."
