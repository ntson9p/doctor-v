notes_vi: "Xuất bản 07/11/2019, cập nhật lần cuối 26/11/2021 (sửa nhỏ đến 11/2025: liên kết sang NG254); rà soát 30/4/2025, không cập nhật phần đánh giá nguy cơ. Đã đối chiếu khuyến cáo 1.2.5, 1.2.12 (trẻ dưới 3 tháng có nhiệt độ từ 38°C thuộc nhóm nguy cơ cao), 1.2.13, 1.2.14, 1.2.18–1.2.19, 1.3.2–1.3.4 và bảng 2 (đèn giao thông). nice.org.uk trả lỗi 403 với truy cập tự động; lượt R đã đọc các trang chính thức (Overview, Recommendations, History) qua dịch vụ đọc văn bản r.jina.ai."
