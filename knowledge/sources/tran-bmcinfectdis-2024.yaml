notes_vi: "Lượt C đọc toàn văn (PMC11384796) qua API Europe PMC (www.ebi.ac.uk/europepmc/webservices/rest). Trẻ nhập Bệnh viện Nhi Trung ương vì sởi (2017–2019): khoảng một nửa dưới 9 tháng tuổi; tỷ lệ đã tiêm ít nhất 1 mũi tăng theo tuổi, ổn định khoảng 27% từ 22 tháng tuổi; nhóm trên 18 tháng: 27,7% đã tiêm (32,3% ở trẻ không có bệnh mạn tính, 9,4% ở trẻ có bệnh mạn tính). Lịch tiêm: mũi 1 lúc 9 tháng, mũi 2 lúc 18 tháng."
