notes_vi: "Lượt C lô 3 đọc tóm tắt qua API Europe PMC. Khoa cấp cứu nhi ở Istanbul (7/2001–8/2002): 399/7442 trẻ (5,4%) đau bụng cấp, 2–16 tuổi (trung bình 6,9). Nhiễm khuẩn hô hấp trên (có thể kèm viêm tai giữa, viêm xoang) 23,7%; viêm dạ dày – ruột 15,4%; không rõ nguyên nhân 15,4%; táo bón 9,4%; nhiễm khuẩn tiết niệu 8%; 17 trẻ cần mổ, 15 trẻ do viêm ruột thừa (khoảng 3,8% tổng số)."
