notes_vi: "Lượt C lô 3 mở trang AAFP. Dấu hiệu chính: đau bụng quặn, buồn nôn và nôn, chướng bụng, ngừng trung đại tiện; tắc thấp đau và chướng nhiều hơn, tắc cao nôn nhiều hơn. Bảng 1 (tắc ruột nói chung): dính 60%, khối u 20%, thoát vị 10%, bệnh viêm ruột 5%, lồng ruột, xoắn ruột mỗi loại dưới 5%. Dính sau mổ bụng là nguyên nhân chính của tắc ruột non."
