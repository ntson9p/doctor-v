notes_vi: "Lượt R (Giai đoạn 3, lô 2) thêm và chỉ đọc tóm tắt qua API Europe PMC. Nghiên cứu bệnh–chứng lồng trong dân số Ontario (Canada) 1993–1998: 582 ca đột quỵ hệ sống–nền, mỗi ca 4 người chứng cùng tuổi, giới. Ở người dưới 45 tuổi, nhóm bệnh có khả năng đã khám nắn chỉnh cột sống trong 1 tuần trước khi đột quỵ cao gấp khoảng 5 lần nhóm chứng, và cũng gấp khoảng 5 lần khả năng đã có từ 3 lần khám nắn chỉnh vì bệnh cột sống cổ trong tháng trước. Không thấy liên quan ở người từ 45 tuổi. Tác giả lưu ý có thể có sai lệch. Dùng để chọn khoảng thời gian hỏi 'bị bẻ, nắn cổ' (1 tháng)."
