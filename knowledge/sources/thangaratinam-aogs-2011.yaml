notes_vi: "Lượt C đọc tóm tắt qua API Europe PMC (lượt B đặt ID 'thangaratinam-2011-pe-symptoms'). 6 nghiên cứu, 2.573 phụ nữ tiền sản giật: độ nhạy dự báo biến chứng mẹ của đau đầu 0,54, đau thượng vị 0,34, rối loạn thị giác 0,27, buồn nôn và nôn 0,24 (độ đặc hiệu 0,59; 0,83; 0,81; 0,87). Tổng quan đánh giá khả năng dự báo biến chứng, không cho tần suất triệu chứng chung."
