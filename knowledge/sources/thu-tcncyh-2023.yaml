notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần b) tải lại PDF toàn văn ngày 31/10/2026; lượt A đã đọc trước đó. 273 người nghi ho gà, 52 dương tính B. pertussis bằng PCR; 86,6% dưới 1 tuổi, nam/nữ 1,9/1. Ở 52 ca: ho cơn kéo dài 100%, viêm long 73,1%, nôn trớ 28,8%, sốt 23,1%, ho đỏ mặt tím tái 21,2%, tiếng rít 19,2%. Thời gian bệnh khi nhập viện: dưới 7 ngày 23,1%, 7–14 ngày 42,3%, trên 14 ngày 34,6%. Tiêm đủ 3 mũi 36,5%. Số liệu ca nằm viện, phần lớn là nhũ nhi."
