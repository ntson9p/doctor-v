notes_vi: "Xuất bản 25/6/2019, cập nhật lần cuối 17/4/2023. Khuyến cáo 1.1.1: phụ nữ có thai cần gặp nhân viên y tế ngay khi có triệu chứng tiền sản giật (đau đầu dữ dội, nhìn mờ hoặc chớp sáng, đau dữ dội ngay dưới sườn, nôn, phù mặt, tay hoặc chân đột ngột). Mục định nghĩa: tăng huyết áp nặng là trên 160 mmHg tâm thu hoặc trên 110 mmHg tâm trương; bảng xử trí: nhập viện, dưới 160/110 thì xử trí như tăng huyết áp. nice.org.uk trả lỗi 403 với truy cập tự động; lượt R đã đọc các trang chính thức (Overview, Recommendations, History) qua dịch vụ đọc văn bản r.jina.ai."
