notes_vi: "Lượt C (phần b) đọc toàn văn PMC11726996 qua API Europe PMC. 214 người ngoại tâm thu thất dày không kèm rối loạn nhịp khác hay bệnh tim cấu trúc (một bệnh viện Trung Quốc): 57,9% có hồi hộp; nhóm có hồi hộp nhiều nữ hơn (63,7% so với 47,8%) và nhiều lo âu hơn (44,4% so với 14,4%). Chỉ 33,6% có hồi hộp trùng đúng lúc có ngoại tâm thu; ở nhóm này hồi hộp chỉ vài giây gặp nhiều hơn (29,2% so với 11,5%), 70,8% tả cơn hồi hộp kéo dài hơn."
