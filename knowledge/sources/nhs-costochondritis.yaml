notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần c) tải lại trang ngày 31/10/2026 (rà soát lần cuối 14/8/2026, hạn rà soát 14/8/2029); lượt A, lượt B đã mở trước đó (bản nháp ở hai thư mục, đã gộp). Viêm chỗ xương sườn nối xương ức: đau nhói ở trước hoặc bên ngực, tăng khi cử động phần trên cơ thể, khi nằm, khi hít sâu, khi ấn vào giữa ngực hoặc xương sườn; thường tự khỏi sau vài tuần đến vài tháng; liên quan chấn thương ngực, động tác lặp lại như mang vác, ho nhiều, nhiễm trùng. Luôn cần hỏi ý kiến y tế khi đau ngực không rõ nguyên nhân, không hết. 'Urgent advice: NHS 111' khi nghĩ mình bị viêm sụn sườn, để loại trừ bệnh nặng hơn. 'Call 999': đau ngực đột ngột, lan tay, cổ, hàm, hoặc ngực bó chặt; đau ngực kèm khó thở, tim nhanh, ho ra máu; đau ngực hoặc lưng đột ngột như có gì bị xé bên trong kèm khó thở, khó đi lại, nhìn, nói. Không tự lái xe đến cấp cứu."
