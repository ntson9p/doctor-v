notes_vi: "Lượt C lô 3 mở trang (ngày trên trang 24/11/2025). Triệu chứng hay gặp: tiêu chảy, đau hoặc quặn bụng, buồn nôn, nôn, sốt. Cần đi khám khi sốt trên 102°F (khoảng 38,9°C), tiêu chảy quá 3 ngày, tiêu chảy có máu, nôn đến mức không giữ được nước, hoặc có dấu hiệu mất nước."
