notes_vi: "Văn bản hành chính. URL là cơ sở dữ liệu văn bản pháp luật (caselaw.vn); Quyết định ký ngày 01/7/2022, thay thế 1494/QĐ-BYT ngày 22/4/2015; cần thay bằng bản chính thức. Bài 'Tiếp cận chẩn đoán thiếu máu', mục 3.1: biểu hiện thiếu oxy mô tùy mức độ thiếu máu: mệt mỏi, hoa mắt, chóng mặt, giảm tập trung, chán ăn; tức ngực, khó thở nhất là khi gắng sức hoặc đi lại nhiều; hồi hộp, đánh trống ngực; da xanh, niêm mạc nhợt; móng tay khô, dễ gãy; tóc khô, dễ rụng; mất kinh ở nữ. Bài 'Thiếu máu thiếu sắt': rất phổ biến, gặp ở mọi lứa tuổi và cả hai giới, phụ nữ tuổi sinh đẻ và trẻ em chiếm tỷ lệ cao hơn; nguyên nhân: tăng nhu cầu (dậy thì, có thai, kinh nguyệt, cho con bú), ăn thiếu sắt, giảm hấp thu (viêm loét dạ dày, cắt dạ dày, ruột), mất máu mạn tính (đường tiêu hóa, tiết niệu, kinh nguyệt nhiều); diễn biến từ từ qua 3 giai đoạn; mức độ nặng có thể choáng, ngất."
