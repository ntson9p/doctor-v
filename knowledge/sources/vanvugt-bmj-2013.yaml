notes_vi: "Lượt C đọc toàn văn (PMC3639712) qua API Europe PMC (www.ebi.ac.uk/europepmc/webservices/rest). 2.820 người lớn ho cấp ở tuyến ban đầu tại 12 nước châu Âu; 140 người (5%) viêm phổi trên phim. Bảng 1, ở người viêm phổi (so với toàn mẫu): có đờm 86% (79%), khó thở 69% (57%), không sổ mũi 44% (29%), sốt theo bệnh sử 59% (35%), đau ngực 57% (46%), tiêu chảy 11% (7%); trung bình 9 ngày bệnh trước khi khám."
