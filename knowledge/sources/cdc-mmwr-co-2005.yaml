notes_vi: "Lượt C mở lại trang. Mỹ 2001–2003: phơi nhiễm khí CO không do cháy xảy ra nhiều hơn vào mùa thu, mùa đông: tháng 12 có 2.157 và tháng 1 có 2.511 lượt không tử vong, so với 510 (tháng 6) và 524 (tháng 7). 64,3% phơi nhiễm không tử vong xảy ra tại nhà. Trong số ca có ghi triệu chứng: đau đầu 37,5%, chóng mặt 18,0%, buồn nôn 17,3%; ít hơn là mất ý thức 7,7%, khó thở 6,7%, mất kiểm soát vận động 3,5%. 11% người khám cấp cứu được nhập viện hoặc chuyển viện. Số liệu lấy từ hồ sơ nên tỷ lệ triệu chứng có thể thấp hơn thực tế."
