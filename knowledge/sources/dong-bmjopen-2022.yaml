notes_vi: "Lượt C (agent:pass-c, phần b) đọc tóm tắt qua API Europe PMC ngày 25/10/2026. 4.754 người ngoại trú đeo Holter 24 giờ vì hồi hộp ở một bệnh viện tuyến cuối Trung Quốc: có ngoại tâm thu thất 67,7% (nam 69,9%, nữ 66,0%); ngoại tâm thu thất dày (chiếm từ 5% số nhịp) 7,7%. Người lớn tuổi có tỷ lệ ngoại tâm thu thất cao nhất, người trẻ có gánh nặng ngoại tâm thu cao hơn."
