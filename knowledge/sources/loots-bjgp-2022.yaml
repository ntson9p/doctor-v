notes_vi: "Lượt C đọc lại toàn văn qua API Europe PMC (PMC9037184). Bảng 1: 357 người lớn bệnh cấp nghi nhiễm khuẩn nặng được bác sĩ ngoài giờ khám tại nhà ở Hà Lan (tuổi trung vị 80); 151 người (42%) nhiễm khuẩn huyết. Nhóm nhiễm khuẩn huyết so với nhóm không: thay đổi ý thức 54% / 22%; rét run 66% / 60%; bệnh tiến triển nhanh 84% / 70%; đái tháo đường 36% / 24%; dùng thuốc ức chế miễn dịch 4,0% / 3,4%; nhiệt độ trung bình 39,0°C / 38,5°C; nhịp thở 26 / 23 lần/phút; ổ hô hấp 40%, tiết niệu 30%."
