notes_vi: "Lượt C đọc lại toàn văn qua API Europe PMC (PMC4426587). Bảng 1: 579 người từ 15 tuổi nằm viện Bạch Mai (2001–2003) nghi bệnh do rickettsia; 237 sốt mò (IgM ELISA). Sốt mò so với nhóm không do rickettsia: nhập viện mùa mưa tháng 5–10 74,7% / 49,0%; nghề tiếp xúc thiên nhiên 61,2% / 34,7%; sốt hơn 7 ngày 76,0%; đau đầu 70,5%; đau cơ 67,9%; rét run 82,3% / 75,8%; ho 43,9%; phát ban 31,2%; nổi hạch 64,1% / 16,8%; vết loét 62,9% / 5,4%; phù 27,9% / 6,7%; rối loạn ý thức 9,7%. Bệnh viện tuyến cuối, nhiều ca sốt kéo dài."
