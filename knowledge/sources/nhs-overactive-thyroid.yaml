notes_vi: "Lượt C (phần b) tải trang và trích chữ ngày 25/10/2026 (rà soát lần cuối 11/4/2023, hạn rà soát 11/4/2026, chưa có bản mới). Gặp ở nữ khoảng gấp 10 lần nam, thường ở tuổi 20–40. Triệu chứng: bồn chồn, lo âu, cáu gắt; thay đổi tâm trạng; khó ngủ; mệt, yếu kéo dài; sợ nóng; sưng ở cổ do bướu giáp; tim đập không đều hoặc nhanh bất thường (hồi hộp); co giật cơ hoặc run; sụt cân. Khám bác sĩ gia đình để xét nghiệm máu. Khoảng 4/5 người cường giáp do Basedow; nguyên nhân khác: nhân tuyến giáp, thuốc như amiodarone. Biến chứng: bệnh mắt (kích ứng, nhìn đôi, lồi mắt), biến chứng thai kỳ, cơn bão giáp."
