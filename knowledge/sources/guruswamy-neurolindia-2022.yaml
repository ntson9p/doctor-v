notes_vi: "Lượt C đọc tóm tắt qua API Europe PMC (lượt B đặt ID 'guruswamy-2022-tth-triggers'). 2.050 sinh viên, nhân viên một trường y ở Ấn Độ, 464 người đau đầu căng thẳng (22,6%): yếu tố khởi phát hay gặp nhất là căng thẳng 72,1% và ngủ ít 49,4%. Nhóm này ghi nhận đau theo nhịp mạch 51,6%, buồn nôn kèm yếu tố khác 40%, khác với tiêu chuẩn ICHD-3, nên chỉ dùng số liệu yếu tố khởi phát."
