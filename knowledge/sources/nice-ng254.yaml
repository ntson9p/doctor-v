notes_vi: "Xuất bản 19/11/2025; rà soát 05/3/2026, đang cập nhật theo thang PEWS quốc gia. Bảng 1–3 (chương Evaluating risk level): trẻ dưới 5 tuổi nguy cơ cao khi không đáp ứng giao tiếp, khó đánh thức, khóc yếu hoặc thét, thở rên, ngừng thở, da loang lổ hoặc xám tái, tím, ban không mất khi ấn, nhiệt độ dưới 36°C, hoặc dưới 3 tháng có nhiệt độ từ 38°C; tay chân lạnh và 3–6 tháng có nhiệt độ từ 39°C là nguy cơ trung bình–cao. nice.org.uk trả lỗi 403 với truy cập tự động; lượt R đã đọc các trang chính thức (Overview, Recommendations, History) qua dịch vụ đọc văn bản r.jina.ai."
