notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần c) đọc lại tóm tắt qua API Europe PMC ngày 31/10/2026; lượt A đã đọc trước đó. 130 nghiên cứu ở 26 nước: tỷ lệ mới mắc zona 3–5/1.000 người-năm ở Bắc Mỹ, châu Âu và châu Á – Thái Bình Dương, tăng theo thời gian; đau sau zona 5% đến trên 30%; tái phát 1–6% (5–6% ở nghiên cứu theo dõi dài); nhập viện 2–25/100.000 người-năm, cao hơn ở người cao tuổi. Tổng quan về tỷ lệ mới mắc (không phải độ chính xác chẩn đoán) nên dùng bậc B."
