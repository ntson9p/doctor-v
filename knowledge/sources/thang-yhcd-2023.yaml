notes_vi: "Lượt C tải và đọc PDF. Hồi cứu 316 sản phụ tiền sản giật, tiền sản giật nặng và sản giật có thai từ 28 tuần, Bệnh viện Phụ sản Trung ương (2019–2021); loại người có tăng huyết áp, bệnh tim, thận, gan, đái tháo đường từ trước. Lúc đình chỉ thai (bảng 3): tăng huyết áp độ 1, 2, 3 lần lượt 26,9%, 36,7%, 36,4%; đau đầu 86/316 (27,2%), rối loạn thị giác 18 (5,7%), đau đầu kèm rối loạn thị giác 17, đau đầu kèm triệu chứng khác 7, đau thượng vị, nôn nhiều hoặc rối loạn khác 8 (2,5%), khó thở 2, thiểu niệu 1; không phù 5,7%, phù 2 chi dưới 64,6%, phù toàn thân 29,4%; đạm niệu dương tính 94,3%; tiểu cầu dưới 100 G/L 10,4%. Đây là ca nặng ở bệnh viện tuyến cuối."
