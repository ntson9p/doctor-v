notes_vi: "Lượt C lô 3 đọc tóm tắt qua API Europe PMC. Nghiên cứu tiến cứu ở 6 bệnh viện Đức: 1254 người đau bụng cấp dưới 7 ngày, 48 người (3,8%) tắc ruột. Sáu dấu hiệu nhạy nhất: chướng bụng, nhu động ruột tăng, tiền sử táo bón, từng mổ bụng, tuổi trên 50, nôn. Các LR đọc qua Bảng 2 của cartwright-afp-2008 (tài liệu tham khảo 4)."
