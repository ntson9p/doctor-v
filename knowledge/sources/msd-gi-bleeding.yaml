notes_vi: "Lượt C (phần b) mở trang ngày 25/10/2026. Nôn ra máu hoặc như bã cà phê gợi ý chảy máu đường tiêu hóa trên (loét dạ dày – tá tràng, tổn thương mạch, giãn tĩnh mạch); phân đen như hắc ín cần khoảng 100–200 mL máu ở đường tiêu hóa trên và có thể kéo dài vài ngày sau khi ngừng chảy; phân đen do sắt, bismuth không có máu ẩn. Thuốc liên quan: thuốc chống đông, aspirin và thuốc chống viêm không steroid, clopidogrel. Dấu hiệu giảm thể tích, sốc: tim nhanh, thở nhanh, da tái, vã mồ hôi, tiểu ít, lú lẫn; chảy máu ít có thể chỉ tim hơi nhanh (trên 100) hoặc không có dấu hiệu; hạ huyết áp tư thế kèm tim nhanh thường xuất hiện khi mất trên 2 đơn vị máu. Đau thượng vị đỡ khi ăn gợi ý loét, nhưng nhiều người loét chảy máu không có tiền sử đau; xơ gan, viêm gan mạn gợi ý giãn tĩnh mạch thực quản. Nôn ra máu, phân đen là cấp cứu tiềm tàng."
