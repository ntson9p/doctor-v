notes_vi: "Lượt C lô 3 đọc toàn văn trên PMC. Tỷ lệ mắc trung bình 74/100.000 trẻ dưới 1 tuổi mỗi năm (9–328); Việt Nam 302/100.000. Đỉnh ở trẻ 4–7 tháng, thấp nhất ở 0–2 tháng. Ở châu Á 13% phải mổ, tử vong khoảng 0,2%; châu Phi 9,4%."
