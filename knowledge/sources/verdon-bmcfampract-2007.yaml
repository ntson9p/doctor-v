notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần c) đọc lại toàn văn PMC2072948 qua API Europe PMC ngày 31/10/2026; lượt A đã đọc trước đó. 300/672 người đau ngực ở 58 phòng khám (Thụy Sĩ, 2001) là hội chứng thành ngực (44,6%), gặp ở mọi lứa tuổi kể cả thiếu niên và người trên 75 tuổi, nam nữ như nhau (155 nữ, 145 nam), tuổi trung bình 50,3. Mới 62%, cũ hoặc tái lại 35%; 57% bị lại trong năm theo dõi. Đau vừa 75%, nặng 23%; 71% tăng khi đổi tư thế, cử động, nằm hoặc thở; từng cơn vài giây đến vài ngày 50%, liên tục hàng giờ đến hàng tuần 35%, cấp và dữ dội 9%. Điểm đau khi ấn ở 214/300 người. Lan tay trái 18, tay phải 4, lưng 5, cổ 3, bụng 3 người. Bảng 1: kèm ho hoặc khó thở kéo dài 31 người (10%), lo âu 20 người (7%). Bảng 2 (yếu tố liên quan): đau không bóp nghẹt, đè ép (OR 2,53), không do gắng sức (OR 1,58), tái hiện khi ấn (OR 5,72). Trong năm theo dõi, chẩn đoán đổi ở 16 người (viêm thực quản 7, lo âu 4, bệnh mạch vành 3, ung thư 2)."
