notes_vi: "Lượt C (Giai đoạn 3 lô 3) tải lại trang ngày 31/10/2026; lượt B đã mở trước đó. Khoảng 85% ca liên quan hút thuốc; 15–20% người bệnh chưa từng hoặc ít hút; nguy cơ giảm sau khi bỏ thuốc nhưng không về mức người chưa hút. Khoảng 25% người bệnh không có triệu chứng, phát hiện tình cờ. U tại chỗ gây ho (thường ho khan, kéo dài); ít gặp hơn là khó thở, sốt khi viêm phổi sau tắc; ho ra máu ít gặp hơn và thường ít máu, trừ khi hiếm hoi u ăn vào động mạch lớn; ho ra máu là triệu chứng đầu tiên ở khoảng 30%; có thể khò khè; khoảng 18% đau ngực âm ỉ. Lan tại vùng: đau ngực kiểu màng phổi, tràn dịch, khàn tiếng. Di căn: chán ăn, sụt cân, mệt."
