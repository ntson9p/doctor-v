notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần c) đọc lại tóm tắt qua API Europe PMC ngày 31/10/2026; lượt A, lượt B đã đọc trước đó. 464 người bóc tách động mạch chủ cấp ở 12 trung tâm chuyển tuyến (1996–1998): tuổi trung bình 63, nam 65,3%, týp A 62,3%. Đau dữ dội, sắc, khởi phát đột ngột là than phiền hay gặp nhất nhưng biểu hiện rất đa dạng; hở van động mạch chủ 31,6%, mất mạch 15,1%; X quang ngực, điện tim không có bất thường ở 12,4% và 31,3%. Tử vong trong viện 27,4%. Tóm tắt không có tỷ lệ từng kiểu đau (bảng triệu chứng chưa mở được)."
