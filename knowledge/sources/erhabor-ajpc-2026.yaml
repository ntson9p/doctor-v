notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần c) đọc lại toàn văn PMC13329584 qua API Europe PMC ngày 31/10/2026; lượt B đã đọc trước đó. 22.171 người lớn ở cộng đồng (Mỹ, tuổi trung bình 56,6), theo dõi 20,2 năm, 97 ca bóc tách (xác định theo mã ICD): 21,8/100.000 người-năm (dưới 60 tuổi 15,6; từ 60 tuổi 33,0; có tăng huyết áp 29,9 so với 14,1; đang hút thuốc 45,3, chưa từng hút 9,9). Yếu tố độc lập: tuổi (HR 2,13 mỗi 10 năm), nam (HR 1,67), tăng huyết áp (HR 2,60), đang hút thuốc (HR 4,26 với 1–9 gói-năm; 6,11 với từ 10 gói-năm); đái tháo đường có nguy cơ thấp hơn, gần ý nghĩa (HR 0,25, p = 0,052). Người bị bóc tách so với người không bị: nam 55,7% so với 45,6%; tăng huyết áp 52,6% so với 38,7%; đang hút thuốc từ 10 gói-năm 41,2% so với 18,6%; đái tháo đường 2,1% so với 10,7%."
