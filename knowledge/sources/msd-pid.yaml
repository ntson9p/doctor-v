notes_vi: "Lượt C mở trang (rà soát toàn bộ 7/2026; tác giả Anna Maya Powell). Hay gặp ở phụ nữ trẻ trong tuổi sinh đẻ, nguy cơ cao hơn dưới 25 tuổi; hiếm trước kỳ kinh đầu, sau mãn kinh và khi có thai. Thường gặp: sốt, đau vùng chậu hoặc bụng dưới, khí hư, ra máu bất thường; ít gặp hơn: đau khi giao hợp, tiểu đau, đau bụng trên, buồn nôn, nôn; nhiều người không có hoặc chỉ có triệu chứng nhẹ. Áp xe vòi – buồng trứng ở khoảng 15% người viêm vòi trứng; viêm quanh gan gây đau hạ sườn phải. Yếu tố nguy cơ: dưới 25 tuổi, bạn tình mới trong 12 tháng hoặc từ 2 bạn tình."
