notes_vi: "Địa chỉ cũ https://www.nhs.uk/conditions/asthma/asthma-attack/ nay chuyển về trang Asthma; mục cơn hen nằm trong trang này. Lượt R lô 3 vòng 2 tải trang trực tiếp ngày 31/10/2026 (rà soát lần cuối 07/4/2025). Khi lên cơn: ngồi thẳng, giữ bình tĩnh; bình xịt cắt cơn màu xanh: 1 nhát mỗi 30–60 giây tới khi đỡ, tối đa 10 nhát; bình AIR hoặc MART: 1 nhát mỗi 1–3 phút, tối đa 6 nhát. 'Call 999' khi đang lên cơn hen và: thấy nặng hơn bất cứ lúc nào; không đỡ sau liều tối đa thuốc cắt cơn; không có bình xịt. 'Urgent GP': đã lên cơn và đã đỡ (khám trong 2 ngày). Cơn hen có thể đe dọa tính mạng."
