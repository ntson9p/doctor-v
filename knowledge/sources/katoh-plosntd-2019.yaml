notes_vi: "Lượt C đọc lại toàn văn qua API Europe PMC (PMC6917290). 1.127 người lớn nằm viện vì sốt tại Bạch Mai (6/2012–5/2013); 33 người (2,9%) sốt mò. Bảng 1 (sốt mò so với nhóm khác): nông dân 60,6% / 32,7%; đau đầu 66,7% / 46,5%; rét run 24,2%; ho 42,4%; đau họng 6,1% / 7,3%; xung huyết kết mạc 39,4% / 16,6%; phát ban 9,1%; vết loét 18,2% / 0,7%; nhiều hạch 12,1%; sốt trung vị 7 ngày trước nhập viện. Phần Introduction: các nghiên cứu Việt Nam trước ghi nhận vết loét 46–94%, phát ban 0–34%. Phần Discussion: ca điển hình đã được chẩn đoán và điều trị ở tuyến dưới nên ít được chuyển lên; kết quả không suy rộng cho tuyến ban đầu."
