notes_vi: "Lượt C đọc lại toàn văn qua API Europe PMC (PMC12844392). Tổng quan 23 nghiên cứu, chủ yếu ở bệnh viện: viêm thận – bể thận cấp thường được định nghĩa bằng sốt từ 38°C, đau hông lưng hoặc ấn đau góc sườn lưng, kèm bạch cầu và vi khuẩn niệu; người cao tuổi hay biểu hiện không điển hình (lú lẫn, tiểu ít, mệt mỏi); dữ liệu hơn 205 triệu lượt khám cấp cứu ở Hoa Kỳ: viêm thận – bể thận chiếm 0,5%, viêm bàng quang 4,3%."
