notes_vi: "Lượt C (Giai đoạn 3, lô 2, phần b) mở lại ngày 27/10/2026 bằng WebFetch (trang ghi ngày 03/3/2026). Sốc nhiệt: lú lẫn, thay đổi tri giác, nói lắp; mất ý thức; da nóng khô hoặc ra rất nhiều mồ hôi; co giật; thân nhiệt rất cao (có thể lên khoảng 41°C trong 10–15 phút); có thể tử vong nếu chậm điều trị; gọi cấp cứu, đưa vào chỗ mát, cởi bớt quần áo, làm mát nhanh bằng nước lạnh, khăn ướt, quạt. Kiệt sức do nóng: đau đầu, buồn nôn, chóng mặt, yếu, cáu gắt, khát, ra nhiều mồ hôi, thân nhiệt tăng, tiểu ít; đưa ra khỏi chỗ nóng, cho uống từng ngụm, cởi bớt quần áo, chườm mát, đưa đi khám (gọi cấp cứu nếu không có cơ sở y tế). Ngất do nóng: ngất ngắn, chóng mặt, choáng khi đứng lâu hoặc đứng dậy đột ngột. Chuột rút do nóng: chuột rút, đau cơ ở bụng, tay, chân."
