notes_vi: "Lượt C (Giai đoạn 3 lô 2 phần a, 27/10/2026) mở lại trang web (tải bằng curl). Đã đối chiếu: áp xe gan do amip thường một ổ ở gan phải, nam nhiều hơn nữ 7–9 lần, có thể khởi phát âm ỉ; đau vùng gan đôi khi lan lên vai phải; sốt từng đợt, vã mồ hôi, rét run, buồn nôn, nôn, sụt cân; vàng da ít gặp và nhẹ; có thể lan lên khoang dưới cơ hoành, màng phổi phải."
