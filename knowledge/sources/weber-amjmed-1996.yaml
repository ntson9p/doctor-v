notes_vi: "Lượt C (agent:pass-c, phần b) đọc tóm tắt qua API Europe PMC ngày 25/10/2026. 190 người liên tiếp đến khám vì hồi hộp ở một trung tâm y khoa đại học Mỹ (gồm cả cấp cứu, phòng khám). Nguyên nhân: do tim 43%, tâm thần 31%, khác 10%, không rõ 16%. Trong năm đầu, 75% bị hồi hộp lại; tử vong 1 năm 1,6%, đột quỵ 1,1%. Phần chia nhỏ theo bảng của EHRA 2011 (raviele-europace-2011): rối loạn nhịp 41% (rung, cuồng nhĩ 16%; nhịp nhanh trên thất 10%; nhịp nhanh thất 2%), bệnh tim cấu trúc 3%, bệnh toàn thân 4%, thuốc, chất kích thích 6%; cơn kéo dài trên 5 phút là yếu tố dự báo độc lập của nguyên nhân tim."
