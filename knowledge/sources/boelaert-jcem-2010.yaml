notes_vi: "Lượt C (agent:pass-c, phần b) đọc tóm tắt qua API Europe PMC ngày 25/10/2026. 3.049 người cường giáp liên tiếp ở một phòng khám tuyến hai, tuyến ba (Anh). Tuổi càng cao, khả năng có phần lớn triệu chứng kinh điển càng giảm, trừ sụt cân và khó thở; người trên 61 tuổi ít khi có từ 5 triệu chứng. Tuổi cao, FT4 cao, nam, bướu nhân độc liên quan rung nhĩ; dấu hiệu bệnh mắt liên quan tuổi cao, hút thuốc, bệnh kéo dài, nữ. Tóm tắt không cho tỷ lệ từng triệu chứng."
