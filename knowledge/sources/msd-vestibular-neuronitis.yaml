notes_vi: "Lượt C mở lại trang (rà soát toàn bộ 10/2025, cập nhật 9/2026). Thường do nhiễm vi rút hoặc viêm sau nhiễm vi rút; một nghiên cứu ghi mới mắc 11,7–15,5/100.000 mỗi năm, tuổi khởi phát trung bình 52,3. Đôi khi được dùng đồng nghĩa với viêm mê nhĩ do vi rút, nhưng viêm mê nhĩ có thêm ù tai, nghe kém. Một cơn chóng mặt nặng duy nhất kèm buồn nôn, nôn, rung giật nhãn cầu 7–10 ngày; có thể đi không vững nhưng vẫn đi lại được; không ù tai, không nghe kém. Giảm dần trong vài ngày đến vài tuần; một số người còn mất thăng bằng khi cử động đầu nhanh. Ở cấp cứu dùng nghiệm pháp HINTS để phân biệt với đột quỵ; có triệu chứng thần kinh kèm theo thì cần thăm dò cấp cứu. Truyền dịch khi nôn kéo dài."
