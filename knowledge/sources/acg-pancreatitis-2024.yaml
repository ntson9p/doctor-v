notes_vi: "Lượt C lô 3 đọc toàn văn trên PMC. Thường đau thượng vị hoặc hạ sườn trái, liên tục, lan ra lưng, ngực hoặc hai bên hông (mô tả này không đặc hiệu); cường độ thường dữ dội nhưng có thể khác nhau; đau âm ỉ, đau quặn hoặc đau ở bụng dưới không phù hợp với viêm tụy cấp. Chẩn đoán cần 2 trong 3 tiêu chuẩn (đau phù hợp, men tụy trên 3 lần giới hạn trên, hình ảnh học). Nguyên nhân: sỏi mật 40–70%, rượu 25–35%, tăng triglycerid khoảng 5%. Thể vừa nặng và nặng khoảng 15–25%. Lượt A và lượt B trích cùng văn bản với hai ID; sổ nguồn dùng ID này."
