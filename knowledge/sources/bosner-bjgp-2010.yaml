notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần c) đọc lại tóm tắt qua API Europe PMC ngày 31/10/2026; lượt B đã đọc trước đó. 1.249 người đau ngực liên tiếp ở 74 phòng khám đa khoa (Đức). Liên quan với bệnh mạch vành: bệnh mạch máu đã biết OR 5,13; đau tăng khi gắng sức OR 4,27; người bệnh nghĩ là đau do tim OR 3,20; có ho OR 0,08; đau tái hiện khi ấn OR 0,27. Với chỉ định nhập viện khẩn: đau lan tay trái OR 8,81; bệnh mạch máu đã biết OR 7,50; cần khám tại nhà OR 7,31; suy tim đã biết OR 3,53."
