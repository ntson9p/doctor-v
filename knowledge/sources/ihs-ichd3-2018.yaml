notes_vi: "Lượt C tải và đọc PDF chính thức (lượt B đặt ID 'ihs-ichd3' và dẫn trang ichd-3.org). Đã đối chiếu: 1.1 đau nửa đầu không tiền triệu (cơn 4–72 giờ, dưới 18 tuổi có thể 2–72 giờ; ít nhất 2 trong 4 đặc điểm một bên, theo nhịp mạch, vừa hoặc nặng, tăng khi vận động thường ngày; kèm buồn nôn hoặc nôn, hoặc sợ cả ánh sáng lẫn tiếng ồn; trẻ em và thiếu niên hay đau hai bên; triệu chứng báo trước có thể gồm mệt, cứng cổ, nhạy cảm ánh sáng, tiếng ồn, buồn nôn, nhìn mờ); 2.1–2.2 đau đầu căng thẳng (30 phút đến 7 ngày; ít nhất 2 trong 4 đặc điểm hai bên, ép chặt, nhẹ hoặc vừa, không tăng khi vận động; không buồn nôn hay nôn; tối đa một trong sợ ánh sáng hoặc sợ tiếng ồn; cần ít nhất 10 đợt; thể thưa thường không cần nhân viên y tế); 6.1.1 nhồi máu não (đau đầu rất hiếm khi là biểu hiện nổi bật, gặp tới một phần ba, hay gặp hơn ở vùng thân nền; hiếm khi khởi phát kiểu sét đánh); 6.2.1 chảy máu não (đôi khi khởi phát kiểu sét đánh, có thể nổi bật trong chảy máu tiểu não); 6.2.2 xuất huyết dưới nhện (đau đột ngột, đạt đỉnh trong vài giây đến vài phút, có thể chỉ ở mức vừa; mọi đau đầu khởi phát đột ngột cần được đánh giá xuất huyết dưới nhện; một phần tư đến một nửa bị nhầm lúc đầu, hay nhất là nhầm với đau nửa đầu; tử vong 40–50%); 10.3.4 đau đầu do tiền sản giật (thường hai bên, theo nhịp mạch, tăng khi vận động; khi có thai hoặc tới 4 tuần sau sinh)."
