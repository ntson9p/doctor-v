notes_vi: "Lượt C (phần b) mở trang OUP ngày 25/10/2026. Nguyên nhân hồi hộp (số liệu Weber và Kapoor, 190 người): rối loạn nhịp 41% (rung, cuồng nhĩ 16%, nhịp nhanh trên thất 10%, nhịp nhanh thất 2%), bệnh tim cấu trúc 3%, tâm thần 31% (chủ yếu hoảng sợ, lo âu), bệnh toàn thân 4%, thuốc, chất kích thích 6%, không rõ 16%; các nghiên cứu khác: lo âu, cơn hoảng sợ ở 15–31% người hồi hộp. Bảng 2: kiểu ngoại tâm thu (hẫng, mất nhịp; không đều xen nhịp bình thường; khởi phát đột ngột; không có triệu chứng kèm); kiểu nhịp nhanh (đập rất nhanh, đều hoặc không đều; khởi phát đột ngột; có thể kèm ngất, khó thở, mệt, đau ngực); kiểu lo âu (đều, hơi nhanh; khởi phát từ từ; sau căng thẳng; kèm tê tay, mặt, nghẹn cổ, đau ngực không điển hình, thở dài); kiểu đập mạnh (đều, tần số bình thường; sau gắng sức; kèm mệt). Cảm giác mạch cổ đập nhanh, đều (dấu hiệu con ếch) gợi ý nhịp nhanh vòng vào lại nút nhĩ thất; ngoại tâm thu thất chỉ gây một vài nhịp đập không đều ở cổ. Ngoại tâm thu nhĩ, thất hay gặp, kể cả ở người trẻ, thường lành tính. Cơn dưới 5 phút giúp loại trừ rối loạn nhịp đáng kể (số liệu nhỏ). Hồi hộp kèm ngất, tiền ngất, chóng mặt, khó thở, đau ngực gợi ý bệnh nặng; thường cần nhập viện cấp cứu khi có rối loạn huyết động, đau ngực hoặc ngất. Hai phần ba người có nhịp nhanh trên thất từng bị chẩn đoán nhầm là rối loạn hoảng sợ."
