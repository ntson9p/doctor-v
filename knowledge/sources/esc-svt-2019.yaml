notes_vi: "Lượt C (phần b) mở trang OUP ngày 25/10/2026. Mục 6: tỷ lệ hiện mắc nhịp nhanh trên thất 2,25/1.000, mới mắc 35/100.000 người-năm; nữ gấp 2 lần nam. Mục 7: có thể gây hồi hộp, mệt, choáng váng, khó chịu ngực, khó thở, rối loạn ý thức; choáng váng không hiếm; tiền ngất và ngất ít gặp hơn, hay ở người cao tuổi; mô tả mạch cổ đập thình thịch (dấu hiệu con ếch) gợi ý nhịp nhanh vòng vào lại nút nhĩ thất; khởi phát đột ngột gợi ý nhịp nhanh vòng vào lại; nhịp nhanh trên thất có thể bị bỏ sót và có đặc điểm giống rối loạn hoảng sợ. Bảng 10: nguyên nhân nhịp nhanh xoang gồm cảm xúc, gắng sức, đau, có thai, lo âu, cơn hoảng sợ, thiếu máu, sốt, mất nước, nhiễm trùng, cường giáp, hạ đường huyết, thuyên tắc phổi, nhồi máu cơ tim, sốc, cà phê, rượu."
