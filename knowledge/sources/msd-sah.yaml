notes_vi: "Lượt C mở trang (rà soát toàn bộ 6/2025, cập nhật 8/2026). Khoảng 85% do vỡ túi phình bẩm sinh; hay gặp ở tuổi 40–65. Đau đầu thường dữ dội, đạt đỉnh trong vài giây, người bệnh mô tả là đau nhất đời; có thể mất ý thức, thường ngay lập tức; lúc đầu cổ thường chưa cứng, trong 24 giờ xuất hiện dấu hiệu màng não và nôn; có thể co giật; sốt, đau đầu kéo dài và lú lẫn hay gặp trong 5–10 ngày đầu; khoảng 25% có dấu hiệu thiếu máu não do co thắt mạch; khoảng 35% tử vong sau lần vỡ đầu."
