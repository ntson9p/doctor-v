notes_vi: "Lượt C lô 3 tải bản văn bản qua API kho IRIS. Bệnh viện Nhi Trung ương (Hà Nội) và Melbourne, 2002–2004: 533 trẻ dưới 2 tuổi lồng ruột ở Hà Nội (tuổi trung vị 9,3 tháng, nam 65%); nhóm chứng ở Hà Nội 234 trẻ có triệu chứng giống lồng ruột (186 trẻ viêm dạ dày – ruột). Bảng 3, độ nhạy ở Hà Nội / Melbourne: nôn dịch mật 30% / 31%; chướng bụng 17% / 31%; chảy máu qua hậu môn 47% / 43%; phân như mứt dâu 15% / 15%; sờ thấy khối 82% / 55%; đau bụng (tiêu chuẩn phụ) 100% / 94%; nôn không có mật 61%; da xanh tái 52% / 78%; li bì 38% / 96%. Độ đặc hiệu trong nhóm chứng: nôn dịch mật 91% / 97%; phân như mứt dâu 91% / 100%; đau bụng 82% / 81%; chướng bụng 83% / 95%. Li bì, xanh tái thường xuất hiện từng lúc theo cơn đau."
