notes_vi: "Lượt C đọc tóm tắt qua API Europe PMC (lượt B đặt ID 'jorgensen-1994-headache-stroke'). Nghiên cứu cộng đồng, 867 người đột quỵ cấp giao tiếp được: 28% đau đầu lúc khởi phát; yếu tố độc lập: tuổi (OR 0,57 mỗi 20 tuổi), nữ (1,6), chảy máu não (2,8), vùng động mạch sống – nền (1,7), bệnh tim thiếu máu cục bộ (1,5); 46% đau khu trú một bên, cùng bên tổn thương ở 68% số này."
