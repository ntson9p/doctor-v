notes_vi: "Lượt C đọc lại toàn văn qua API Europe PMC (PMC4073838). Tổng quan hệ thống và phân tích gộp: tỷ lệ gộp người bệnh làm nghề liên quan đến lợn 38,1%, có ăn thực phẩm nguy cơ cao (tiết canh, thịt lợn chưa chín) 37,3%; thể bệnh chính là viêm màng não (68,0%), sau đó là nhiễm khuẩn huyết; 76,6% là nam; tử vong gộp 12,8%."
