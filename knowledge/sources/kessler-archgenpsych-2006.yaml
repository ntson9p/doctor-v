notes_vi: "Lượt C (phần b) đọc tóm tắt qua API Europe PMC và mở toàn văn trên PMC ngày 25/10/2026. Khảo sát quốc gia Mỹ (9.282 người lớn): từng có cơn hoảng sợ 28,3%; rối loạn hoảng sợ suốt đời 4,7% (không kèm sợ khoảng rộng 3,7%, có kèm 1,1%). Nữ so với nam: OR 1,4 với cơn hoảng sợ đơn lẻ, 2,3 với rối loạn hoảng sợ không kèm sợ khoảng rộng, 2,0 khi có kèm. Tuổi khởi phát trung bình khoảng 23."
