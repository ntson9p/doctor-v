notes_vi: "ĐÃ BỊ THAY THẾ. Ngày 19/11/2025 NICE tách NG51 thành 3 hướng dẫn: NG253 (người từ 16 tuổi, không có thai), NG254 (dưới 16 tuổi) và NG255 (có thai hoặc mới sinh); trang tổng quan NG253 và NG254 ghi 'partially updates and replaces NICE guideline NG51 (2016)'. Lượt R không đọc được nội dung NG51. Không dùng nguồn này cho quy tắc; dùng nice-ng253, nice-ng254."
