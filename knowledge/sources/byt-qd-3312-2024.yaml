notes_vi: "Trùng số với 3312/QĐ-BYT năm 2015 (nhi khoa): luôn ghi kèm năm. Lượt R chưa mở được văn bản. Lượt C (lô 4) đã mở toàn văn trên luatvietnam.vn (cơ sở dữ liệu văn bản pháp luật; chưa tìm thấy PDF ký số trên kcb.vn, moh.gov.vn): quyết định ký ngày 05/11/2024 (Thứ trưởng Trần Văn Thuấn), Điều 3 thay thế 5331/QĐ-BYT ngày 23/12/2020. Đã đối chiếu: nhồi máu não chiếm 76,2% đột quỵ ở Việt Nam; chảy máu não khởi phát đột ngột, triệu chứng tối đa sau 30 phút đến vài giờ, hay gặp đau đầu, buồn nôn, liệt nửa người, rối loạn ý thức; chảy máu tiểu não: nhức đầu dữ dội vùng chẩm, thất điều, nôn; nhồi máu não khởi phát đột ngột với liệt, mất cảm giác nửa người, mất thị lực, nhìn đôi, rối loạn ngôn ngữ, thất điều, chóng mặt; bảng phân biệt: hôn mê, cứng gáy, co giật, huyết áp tăng cao, nôn, đau đầu nghĩ nhiều đến chảy máu; phình động mạch não vỡ: đau đầu 'sét đánh' lan xuống gáy chẩm, nôn thường gặp, rối loạn ý thức hồi phục nhanh khi chảy máu ít, triệu chứng khác (co giật, mất thăng bằng, giảm thị lực) ít giá trị, cứng gáy thường gặp và có giá trị chẩn đoán cao; tuổi thường gặp 40–65, nữ cao hơn nam 1,6 lần; 10% tử vong trước khi kịp cấp cứu; chảy máu lại sớm khoảng 18%, 75% trong 2 giờ đầu; tăng huyết áp, hút thuốc, uống nhiều rượu là yếu tố nguy cơ; cần vận chuyển nhanh, an toàn đến cơ sở có khả năng điều trị đột quỵ. Quy tắc rf_sudden_balance_loss trích dẫn nguồn này. Lượt R (Giai đoạn 3, lô 1) mở lại toàn văn trên luatvietnam.vn ngày 25/10/2026. Bài 1 (đột quỵ nhẹ và cơn thiếu máu não thoáng qua): cơn thiếu máu não thoáng qua là triệu chứng thần kinh khu trú khởi phát đột ngột do thiếu máu não hoặc võng mạc, kéo dài không quá 24 giờ, không có nhồi máu trên cộng hưởng từ (mục 1.1.2); dấu hiệu dễ bị bỏ qua: méo miệng nhẹ, chóng mặt, thất điều, nói khó, rung giật nhãn cầu, rối loạn cảm giác một bên, liệt nhẹ nửa người (mục 3.1); cần phân biệt với đau nửa đầu, ngất, động kinh, quên thoáng qua, hạ glucose máu (mục 3.4); nguy cơ tái phát sớm rất cao (mục 4.2); điều trị dự phòng ngay, tối ưu trong 24 giờ đầu, có thể đến 7 ngày đầu (mục 4.3.1). Bài 2 (nhồi máu não cấp): khởi phát đột ngột với liệt nửa người, mất cảm giác nửa người, mất thị lực một hoặc hai mắt, khiếm khuyết thị trường, nhìn đôi, rối loạn ngôn ngữ, liệt mặt, thất điều, chóng mặt (hiếm khi đơn độc) (mục 3.1); chẩn đoán phân biệt gồm viêm mê đạo (có thể nhầm với đột quỵ tiểu não) và bệnh Ménière (mục 3.4); khi phát hiện đột quỵ cấp cần vận chuyển nhanh, an toàn đến cơ sở điều trị được đột quỵ (mục 4.1)."
