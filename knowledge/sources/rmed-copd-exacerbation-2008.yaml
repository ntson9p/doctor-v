notes_vi: "Lượt C (Giai đoạn 3 lô 3) đọc lại toàn văn (PMC7125807) qua API Europe PMC ngày 31/10/2026; lượt A đã đọc trước đó. 136 người đợt cấp bệnh phổi tắc nghẽn mạn tính (phần lớn nhập viện, Belfast), 68 người bệnh ổn định, 16 người hút thuốc không tắc nghẽn. Bảng 3 (triệu chứng trong đợt cấp): tăng khó thở 99%, khò khè 81%, tăng ho 77%, tăng lượng đờm 65%, đờm mủ tăng 60%, chảy mũi hoặc nghẹt mũi 55%, đau họng 25%, sốt 28% (sốt liên quan với có vi rút). Có vi rút ở 37% đợt cấp, hay gặp nhất rhinovirus. Bối cảnh bệnh viện, bệnh nặng: cần hạ mức cho người tự kiểm tra ở cộng đồng."
