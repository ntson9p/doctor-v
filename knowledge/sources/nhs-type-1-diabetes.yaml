notes_vi: "Lượt R (Giai đoạn 3, lô 2) thêm và mở trang ngày 26/10/2026 (rà soát lần cuối 31/10/2024, hạn rà soát 31/10/2027), thay cho NICE NG18 chưa mở được. Triệu chứng thường gặp: đi tiểu nhiều hơn, nhất là ban đêm; rất khát, uống nhiều; rất mệt; sụt cân hoặc gầy đi. Trẻ có thể tã nặng hơn hoặc đái dầm trở lại. Triệu chứng khác: nhìn mờ; hơi thở mùi ngọt hoặc mùi trái cây (như nước rửa móng tay hoặc kẹo lê); vết thương lâu lành; hay nhiễm trùng. Triệu chứng xuất hiện nhanh, trong vài ngày đến vài tuần; không điều trị có thể dẫn tới nhiễm toan ceton. Bệnh thường khởi phát ở trẻ em và người trẻ, nhưng gặp ở mọi tuổi. 'Urgent advice: urgent GP / NHS 111' (khám khẩn) khi nghĩ mình hoặc con bị đái tháo đường típ 1. 'Call 999 or go to A&E' (gọi 999 hoặc đến cấp cứu) khi đang tiểu nhiều, rất khát và mệt, kèm: triệu chứng nặng lên nhanh; đau bụng, tiêu chảy, buồn nôn hoặc nôn; buồn ngủ hoặc lú lẫn; thở nhanh và sâu hơn bình thường (có thể là nhiễm toan ceton). Bác sĩ thử đường máu đầu ngón tay; nếu nghi típ 1 thì thường được khám chuyên khoa ở bệnh viện ngay trong ngày. Trẻ có thể đồng thời bị cảm, viêm amidan, đau bụng hoặc hăm tã nên dễ bỏ sót."
