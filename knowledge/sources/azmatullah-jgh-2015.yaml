notes_vi: "Lượt C đọc lại toàn văn qua API Europe PMC (PMC4672836). 180 báo cáo, 96% ở bệnh viện. Bảng 1 (người lớn): sốt 98%, đau đầu 63%, ho 41%, buồn nôn hoặc nôn 49%, tiêu chảy 46%, đau hoặc ấn đau bụng 54%, ban hồng 8%, thay đổi ý thức 29%, xuất huyết tiêu hóa 7%, thủng ruột 5%; trẻ dưới 5 tuổi đau đầu 14%, đau bụng 20%. Bảng 2: bệnh dưới 1 tuần 42–62% tùy vùng; tiêu chảy ở Đông Á – Thái Bình Dương 33%. Bảng 3 (trẻ em ở cộng đồng hoặc trạm y tế, 6 nghiên cứu): sốt 100%, đau đầu 46%, ho 33%, buồn nôn hoặc nôn 23%, tiêu chảy 10%, đau bụng 50%, bệnh dưới 1 tuần 36%."
