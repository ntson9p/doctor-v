notes_vi: "Lượt C (Giai đoạn 3 lô 3) tải lại báo cáo quốc gia (Viet_Nam_STEP_2021_Report.pdf, mục Reports của catalog 948) ngày 31/10/2026; lượt A đã mở trước đó. Điều tra STEPS lần 3, thu thập 01–03/2021, 4.738 người. Tóm tắt kết quả và Bảng 5: đang hút thuốc 20,8% người từ 15 tuổi, gồm 41,1% nam và 0,6% nữ; nam 15–24 tuổi 18,4%, 25–44 tuổi 43,9%, 45–64 tuổi 55,0%, từ 65 tuổi 30,4%; 37,3% hút thuốc thụ động tại nhà trong 30 ngày."
