notes_vi: "Lượt C đọc tóm tắt qua API Europe PMC (toàn văn PMC11926925). Bệnh viện tuyến cuối ở Kolkata, Ấn Độ (6/2018–5/2019): 123 ca thai ngoài tử cung trong 5.793 thai phụ; đau bụng 82,9%, mất kinh 63,4%, ra máu âm đạo bất thường 46,3%; vỡ khi mổ 84,6%; yếu tố nguy cơ hay gặp: từng mất thai 19,5%, viêm vùng chậu 17,9%. Phần lớn đến khi đã vỡ nên tần suất cao hơn ở cộng đồng."
