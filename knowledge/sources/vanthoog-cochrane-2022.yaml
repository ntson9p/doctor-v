notes_vi: "Lượt C (Giai đoạn 3 lô 3) đọc lại toàn văn (PMC9109771) qua API Europe PMC ngày 31/10/2026; lượt A đã đọc trước đó. Tóm tắt, mục Main results: nghiên cứu sàng lọc chủ động (nhiều nhất là điều tra tỷ lệ hiện mắc quốc gia); độ nhạy gộp của ho từ 2 tuần 42,1% (KTC 95% 36,6–47,7; 41 nghiên cứu), ho bất kỳ 51,3% (42,8–59,7; 21 nghiên cứu), có bất kỳ triệu chứng lao nào 70,6% (61,7–78,2; 29 nghiên cứu); độ đặc hiệu lần lượt 94,4%, 87,6%, 65,1%. Tổng quan không gộp riêng sốt, ra mồ hôi đêm, sụt cân hay ho ra máu. Bối cảnh sàng lọc chủ động, khác người tự đi khám: dùng làm bậc B cho liên kết."
