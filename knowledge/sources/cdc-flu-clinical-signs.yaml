notes_vi: "Lượt C mở lại trang dành cho nhân viên y tế (ngày trên trang 04/02/2026). Cúm chưa biến chứng: khởi phát đột ngột với sốt, ớn lạnh, đau cơ, đau đầu, mệt, ho khan, đau họng, viêm mũi. Nhiều người, nhất là người cao tuổi và người suy giảm miễn dịch, không sốt. Trẻ nhỏ có thể buồn nôn, nôn, tiêu chảy. Người cao tuổi có thể biểu hiện thay đổi tri giác, chán ăn. Triệu chứng thường hết sau 3–7 ngày; ho, mệt có thể kéo dài hơn 2 tuần."
