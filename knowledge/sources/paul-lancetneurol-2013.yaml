notes_vi: "Nghiên cứu dân số Oxfordshire (Anh), 2002–2010: 1.141 người nhồi máu não, 275 ở tuần hoàn sau. Cơn thần kinh thoáng qua đơn độc ở thân não gặp trước 45/275 đột quỵ tuần hoàn sau so với 10/759 đột quỵ tuần hoàn trước (OR 14,7), nhất là trong 2 ngày trước (22/252). Trong 59 cơn thoáng qua trước đột quỵ tuần hoàn sau (trung vị 4 ngày trước): chỉ 5 cơn (8%) đủ tiêu chuẩn kinh điển của cơn thiếu máu não thoáng qua; còn lại là chóng mặt đơn độc (23), rối loạn thị giác hai mắt (9), chóng mặt kèm triệu chứng không khu trú (10), nói khó, tê nửa người hoặc nhìn đôi đơn độc (8), cơn không khu trú (4). Chỉ 10/45 người (22%) đi khám trước khi đột quỵ, và bác sĩ chỉ nghĩ đến nguyên nhân mạch máu ở 1 người."
