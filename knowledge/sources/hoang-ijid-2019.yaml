notes_vi: "Lượt C đọc toàn văn (PMC6403263) qua API Europe PMC (www.ebi.ac.uk/europepmc/webservices/rest). 1.547 trẻ ở phòng khám ngoại trú và khoa nội trú của 3 bệnh viện tuyến cuối tại TP.HCM, 7/2013–7/2015. Bảng 1, ngoại trú (n = 590; tuổi trung vị 20,2 tháng; ngày bệnh lúc vào 1,2): sốt 63,9%, ban da 91,7% (chủ yếu dát 39,7%, cả dát và phỏng nước 51,8%, chủ yếu phỏng nước 8,5%), tổn thương miệng 85,8%, đau đầu 5,5%, ho 35,1%, sổ mũi 36,3%, viêm kết mạc 2%, nôn 24,6%, tiêu chảy 5,6%, ngủ gà 1,5%, quấy khóc 24,6%, giật mình 10,8% (nội trú 20,6%); nhiệt độ trung vị 37,0°C."
