notes_vi: "Lượt C đọc toàn văn (PMC3375788) qua API Europe PMC (www.ebi.ac.uk/europepmc/webservices/rest). 764 trẻ nhập viện vì tay chân miệng ở TP.HCM năm 2005. Bệnh có quanh năm, tăng vào tháng 3–5 và tháng 9–12 (giai đoạn chuyển giữa mùa khô và mùa mưa). Chủ yếu dưới 5 tuổi, nhiều nhất 1–2 tuổi. Đau họng 43,1% (EV71) và 38,7% (CVA16); sổ mũi khoảng 42%; tiêu chảy 8–9%; co giật 10,4% và 1,9%; nôn 36,4% và 14,0%."
