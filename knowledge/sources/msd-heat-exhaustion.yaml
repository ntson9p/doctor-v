notes_vi: "Lượt C (Giai đoạn 3, lô 2, phần b) mở lại ngày 27/10/2026 (tải trang). Kiệt sức do nóng không đe dọa tính mạng: yếu, mệt, buồn nôn, ngất và triệu chứng không đặc hiệu do nóng; điều hòa thân nhiệt và thần kinh trung ương không bị ảnh hưởng; thường mất nước. Dấu hiệu sớm: khát nhiều, chuột rút; sau đó mệt, yếu, chóng mặt, đau đầu, buồn nôn, đôi khi nôn; ngất khi đứng lâu nơi nóng; khám thấy vã mồ hôi, tim nhanh, có thể hạ huyết áp tư thế; tri giác bình thường (khác sốc nhiệt); thân nhiệt thường bình thường, nếu tăng thường không quá 40°C. Không đỡ sau 30–60 phút bù dịch đường uống thì chuyển đến khoa cấp cứu; nôn không uống được thì truyền dịch."
