notes_vi: "Dự án BASIC (Nueces County, Texas, 2000–2003): 1.666 người trên 44 tuổi đến cấp cứu hoặc nhập viện vì chóng mặt, quay cuồng hoặc mất thăng bằng. Đột quỵ hoặc cơn thiếu máu não thoáng qua 3,2% (53 người: 33 nhồi máu, 17 cơn thoáng qua, 1 chảy máu, 2 không rõ thể); chỉ 0,7% (9/1.297) ở người chóng mặt đơn độc. Bảng 1 (53 người): nam 55% so với 36% ở nhóm không đột quỵ; tăng huyết áp 72%, bệnh mạch vành 40%, đái tháo đường 32%, từng bị cơn thoáng qua hoặc đột quỵ 28%, hút thuốc 23%, rung nhĩ 6%; chóng mặt đơn độc 17%; yếu vận động 60%, rối loạn cảm giác 31%, rối loạn ngôn ngữ 21%, rối loạn thị giác 24%. Lý do khám chính: chóng mặt 23, quay cuồng 18, mất thăng bằng 11. Bảng 2: nam OR 2,47 (1,39–4,40); chóng mặt đơn độc OR 0,05; mất thăng bằng so với chóng mặt OR 3,71; quay cuồng so với chóng mặt OR 0,88 (không khác). Bác sĩ cấp cứu bỏ sót 35%."
