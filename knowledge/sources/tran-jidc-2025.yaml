notes_vi: "Lượt C lô 3 đọc tóm tắt qua API Europe PMC. 451 trẻ dưới 5 tuổi nằm viện vì tiêu chảy cấp ở Thái Bình (56,3% dưới 12 tháng): buồn nôn, nôn 49,7%; tiêu chảy phân máu 17,5%; sốt 27,1%; mất nước vừa 37,7%, nặng 4,2%. Căn nguyên hay gặp: adeno vi rút, noro vi rút, entero vi rút; vi khuẩn hay gặp nhất là Campylobacter."
