notes_vi: "Lượt R lô 3 vòng 2 tải bản PDF (26 trang, gồm quyết định và tài liệu) trên vilaphoikhoe.kcb.vn, trang của Cục Quản lý Khám, chữa bệnh, ngày 31/10/2026. Quyết định có hiệu lực từ ngày ký, bãi bỏ phần hen trẻ em của 4776/QĐ-BYT (2009). Chưa thấy văn bản thay thế. Mục 2.6, Bảng 6 (tr. 8): cơn trung bình: khó thở rõ, chỉ nói cụm từ ngắn, thở nhanh, rút lõm lồng ngực, SpO2 92–95%; cơn nặng: kích thích, vật vã, khó thở liên tục, nói từng từ, rút lõm lồng ngực rõ, SpO2 dưới 92%; nguy kịch: lơ mơ, hôn mê, cơn ngừng thở, tím tái. Phụ lục kế hoạch hành động (tr. 24): vùng đỏ 'cần cấp cứu ngay, đưa đến phòng cấp cứu gần nhất' khi thuốc cắt cơn không hiệu quả, rất khó thở, thở co kéo, không nói chuyện hoặc đi lại được, tím môi, đầu chi; vùng vàng: dùng thuốc cắt cơn, nếu nặng hơn hoặc kéo dài trên 2 giờ thì chuyển vùng đỏ. Phần hỗ trợ ở trường học: không đáp ứng thuốc cắt cơn thì gọi cấp cứu; gọi cấp cứu ngay khi khó thở nhiều, nói ngắt quãng, bứt rứt."
