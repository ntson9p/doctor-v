notes_vi: "Lượt C đọc tóm tắt qua API Europe PMC. 2.506 người đột quỵ lần đầu, hỏi trong 12 giờ đầu: 18% đau đầu; 14% ở tuần hoàn trước, 29% ở tuần hoàn sau; 16% ở nhồi máu, 36% ở xuất huyết; 9% ở nhồi máu ổ khuyết. Vị trí đau hay gặp nhất là vùng trán (41%), rồi lan tỏa (27%); đột quỵ tuần hoàn sau hay đau lan tỏa (41%) hoặc vùng chẩm (30%)."
