notes_vi: "Lượt C mở lại trang (cập nhật 20/3/2024). Sốt rét chưa biến chứng: sốt, run, vã mồ hôi, đau đầu, buồn nôn và nôn, đau mỏi người, mệt; khám có thể thấy vàng da nhẹ, gan lách to, thở nhanh. Ủ bệnh thường 7–30 ngày; P. vivax, P. ovale có thể tái phát nhiều tháng đến nhiều năm sau. Có tiêu chuẩn sốt rét nặng. Trang không nêu tần suất từng triệu chứng."
