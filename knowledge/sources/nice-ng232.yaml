notes_vi: "Xuất bản 18/5/2023. Đã đối chiếu khuyến cáo 1.2.2 (dịch vụ tư vấn từ xa gọi xe cấp cứu khi bất tỉnh hoặc không tỉnh táo hoàn toàn, có dấu hiệu thần kinh khu trú kể cả thay đổi thị lực, co giật, chấn thương năng lượng cao), 1.2.3 (chuyển khoa cấp cứu khi đau đầu dai dẳng từ sau chấn thương, nôn, mất ý thức đã hồi phục, quên, dùng thuốc chống đông...) và 1.2.4. nice.org.uk trả lỗi 403 với truy cập tự động; lượt R đã đọc các trang chính thức (Overview, Recommendations, History) qua dịch vụ đọc văn bản r.jina.ai."
