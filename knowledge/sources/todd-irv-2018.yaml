notes_vi: "Lượt C đọc toàn văn (PMC6086852) qua API Europe PMC (www.ebi.ac.uk/europepmc/webservices/rest). 1.152 người 10–70 tuổi có hội chứng giống cúm (sốt kèm ho hoặc đau họng) ở phòng khám tuyến ban đầu TP.HCM: 40,6% cúm (A 27,9%, B 11,8%); 27,8% ca âm tính với cúm có vi rút khác, hay gặp nhất rhinovirus. Bảng 1, cúm A so với ca không phải cúm: sốt 92,2% và 86%, đau đầu 92,9% và 90,9%, sổ mũi 86,3% và 69,7%, ho 95,3% và 86,2%, đau họng 89,1% và 86,3%, đau cơ 90,7% và 91,4%, triệu chứng tiêu hóa 6,8% và 8,4%, mệt 97,2% và 96,5%; nhiệt độ trung vị cúm A 38,5°C. Cúm có ở 81% số tuần, các đỉnh không cố định theo mùa."
