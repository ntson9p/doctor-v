notes_vi: "Lượt C lô 3 mở trang (rà soát 11/3/2026, hạn 11/3/2029). Đau bụng đột ngột, có thể dữ dội, ở bụng trên, một bên hoặc khắp bụng, có thể lan ra hai bên và ra sau lưng; tăng sau ăn, khi cử động hoặc khi nằm, đỡ khi cúi người ra trước. Kèm sốt, buồn nôn, nôn. Cần điều trị khẩn ở bệnh viện. Gọi 999 hoặc đến cấp cứu khi đau đột ngột dữ dội kèm đau lan ra lưng, chướng bụng kéo dài, tim đập nhanh, khó thở hoặc da quanh rốn, thắt lưng bầm tím. Nguyên nhân hay gặp: sỏi mật, uống nhiều rượu."
