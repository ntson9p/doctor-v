notes_vi: "Lượt C đọc lại toàn văn qua API Europe PMC (PMC7354908): bảng 1–2. 437 người nhiễm khuẩn huyết hoặc sốc nhiễm khuẩn ở khoa cấp cứu một bệnh viện Thái Lan (tuổi trung vị 67; 65,9% mắc ở cộng đồng; 42,8% sốc). Lý do đi khám: sốt 42,1%, khó thở 25,2%. Nói ngọng hoặc lú lẫn 22,2%; rét run dữ dội, đau cơ hoặc sốt 54,9%; sốt và/hoặc rét run 53,8%; khó thở nhiều 41,4%; cả ngày không đi tiểu 4,1%; da loang lổ 1,1%; thay đổi ý thức 13,0%; mệt mỏi 16,2%; ho có đờm 25,2%; ho khan 3,0%; tiểu buốt 4,3%; buồn nôn, nôn 5,9%. Đái tháo đường 25,2%; suy giảm miễn dịch 10,8%; ổ nhiễm ở phổi 49,9%, ổ bụng 16,0%, tiết niệu 14,2%."
