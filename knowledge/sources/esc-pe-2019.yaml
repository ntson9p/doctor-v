notes_vi: "Lượt C (phần b) mở trang OUP ngày 25/10/2026. Tỷ lệ mới mắc thuyên tắc phổi 39–115/100.000 dân mỗi năm; huyết khối tĩnh mạch ở người từ 80 tuổi cao gần 8 lần so với tuổi 40–49. Bảng 3: yếu tố thuận lợi mạnh (OR trên 10) gồm gãy xương chi dưới, nằm viện vì suy tim hoặc rung nhĩ trong 3 tháng, thay khớp háng hoặc gối, chấn thương nặng, nhồi máu cơ tim trong 3 tháng, tiền sử huyết khối tĩnh mạch, tổn thương tủy sống; trung bình (OR 2–9) gồm ung thư (cao nhất khi di căn), hóa trị, thuốc tránh thai, hậu sản, nhiễm trùng; yếu (OR dưới 2) gồm nằm trên 3 ngày, ngồi lâu khi đi xa, tuổi cao, có thai, béo phì. Khoảng 40% người thuyên tắc phổi không có yếu tố thuận lợi. Mục 4.1: nghĩ đến thuyên tắc phổi khi khó thở, đau ngực, tiền ngất hoặc ngất, ho ra máu; khó thở cấp và nặng khi tắc trung tâm, nhẹ và thoáng qua khi tắc nhỏ ngoại vi; đau ngực hay gặp, thường do kích thích màng phổi, có thể giống đau thắt ngực khi tắc trung tâm; ngất đi kèm rối loạn huyết động và rối loạn chức năng thất phải nhiều hơn; ở ca nhẹ, nhịp nhanh xoang (khoảng 40%) có thể là bất thường duy nhất. Hướng dẫn trích một nghiên cứu: thuyên tắc phổi có ở 17% người nằm viện vì ngất."
