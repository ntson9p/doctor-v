notes_vi: "Lượt C đọc lại toàn văn qua API Europe PMC (PMC5634655). Trong các nghiên cứu sốt tiến cứu ở châu Á, tỷ lệ sốt mò trung vị 23,4% (khoảng tứ phân vị 5,2–39,7%; dao động 1–96,9% tùy nơi và cách chọn bệnh nhân). Việt Nam (Nadjm, 2001–2003): 251/7.226 (3,5%) ca nhập Bệnh viện Nhiệt đới Trung ương không có chẩn đoán ngay."
