notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần b) đọc lại tóm tắt qua API Europe PMC ngày 31/10/2026; lượt B đã đọc trước đó. Hai đoàn hệ trẻ 0–16 tuổi được chẩn đoán croup ở khoa cấp cứu Canada (307 và 1.214 trẻ). Phần lớn trẻ đến khám lúc triệu chứng nặng nhất (96% và 77%). Ho ông ổng là triệu chứng kéo dài nhất: hết ở 50% trẻ sau 34 và 47 giờ, ở 90% sau 78 và 119 giờ."
