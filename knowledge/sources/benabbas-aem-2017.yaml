notes_vi: "Lượt C lô 3 đọc tóm tắt qua API Europe PMC. 21 nghiên cứu, 8605 trẻ ở khoa cấp cứu (tỷ lệ viêm ruột thừa gộp 39,2%). Ở trẻ đau bụng chưa phân loại: đau chuyển xuống hố chậu phải LR+ 4,81 (3,59–6,44); đau khi ho hoặc nhảy LR+ 7,64 (5,94–9,83). Ở trẻ đã nghi viêm ruột thừa, không có dấu hiệu bệnh sử nào có giá trị mạnh."
