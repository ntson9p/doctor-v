notes_vi: "Lượt C (Giai đoạn 3 lô 3, phần b) đọc lại toàn văn (PMC10809638) qua API Europe PMC ngày 31/10/2026; lượt A, lượt B đã đọc trước đó. 1.063 trẻ dưới 5 tuổi nằm Bệnh viện Nhi Trung ương vì ho gà xác nhận bằng xét nghiệm (2015–2018); 23,2% thể nặng; 3,2 ca trên 1.000 lượt nhập viện năm 2015; dịch theo chu kỳ 2 năm. Bảng 1: khoảng 44% dưới 2 tháng, 88% dưới 1 tuổi; 16,2% đã tiêm ít nhất 1 mũi, 6,7% từ 3 mũi. Mùa (mỗi mùa khoảng 4 tháng): tháng 4–7 có 47,9% số ca, tháng 12–3 có 37,4%, tháng 8–11 có 14,7% (tháng 10 ít ca nhất); tỷ lệ các năm 2015–2018 ở mùa tháng 8–11 từ 9,8% đến 24,6%. Mô hình hồi quy (hiệu chỉnh tuổi, tiêm chủng): tỷ lệ nhập viện vì ho gà mùa tháng 12–3 và tháng 4–7 cao hơn mùa tháng 8–11 lần lượt 15% và 21%. Ca nặng, tử vong nhiều nhất mùa tháng 12–3. Chỉ có số liệu miền Bắc, trẻ nằm viện."
