notes_vi: "Lượt C (phần b) mở trang ngày 25/10/2026. Nhiễm khuẩn huyết chưa sốc: thường sốt, tim nhanh, vã mồ hôi, thở nhanh, huyết áp còn bình thường; khi nặng lên hoặc vào sốc, dấu hiệu sớm (nhất là ở người cao tuổi, trẻ rất nhỏ) có thể là lú lẫn, giảm tỉnh táo; huyết áp tụt; người cao tuổi có thể không có phản ứng viêm rõ; về sau đầu chi lạnh, tái, tím, nổi vân; tiểu ít, khó thở. Tử vong cao hơn ở hai đầu tuổi; sốc nhiễm khuẩn tử vong khoảng 40–60%."
