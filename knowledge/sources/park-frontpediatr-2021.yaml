notes_vi: "Lượt C lô 3 đọc toàn văn trên PMC. 536 trẻ lồng ruột hồi – đại tràng ở khoa cấp cứu nhi (Ulsan, Hàn Quốc, 2008–2019), tuổi trung vị 19 tháng. Theo nhóm tuổi dưới 1 / 1–2 / từ 2 tuổi: đau từng cơn hoặc quấy khóc từng cơn 69,0 / 87,7 / 74,9% (chung 77,4%); nôn 71,8 / 42,8 / 24,0% (46,1%); phân có máu 44,8 / 18,2 / 6,9% (23,1%); tiêu chảy 17,2 / 11,2 / 9,7%; sốt 12,1 / 16,0 / 16,6%; li bì 25,9 / 8,6 / 9,1%; đủ bộ ba 9,3%. Từ khởi phát đến cấp cứu: dưới 6 giờ 33,8%, trên 24 giờ 16,8%, trung vị 11 giờ."
