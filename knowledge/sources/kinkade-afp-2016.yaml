notes_vi: "Lượt C (Giai đoạn 3 lô 3) tải lại trang toàn văn ngày 31/10/2026; lượt A, lượt B đã mở trước đó. Mục Diagnosis: ho là triệu chứng chính và định nghĩa bệnh; có thể kèm khạc đờm, khó thở, nghẹt mũi, đau đầu, sốt; vài ngày đầu khó phân biệt với cảm lạnh; có thể đau sau xương ức hoặc đau thành ngực khi ho; sau vài ngày đầu ít còn sốt, sốt trên 37,8°C nên nghĩ tới cúm hoặc viêm phổi; đờm, kể cả đờm mủ, hay gặp và không cho biết nhiễm vi khuẩn; ho thường kéo dài 2–3 tuần (một tổng quan ước 18 ngày); khám thấy sốt ở khoảng một phần ba; nghe phổi có thể có ran rít, ran ngáy; giảm ô xy máu, dấu hiệu đông đặc gợi ý viêm phổi. Bảng 1: khó thở, đờm có máu hoặc màu gỉ sắt, mạch trên 100, thở trên 24 lần/phút, nhiệt độ trên 37,8°C là chỉ định chụp phim. Mục Etiology: ít nhất 90% do vi rút; khoảng 10% người ho từ 2 tuần có bằng chứng nhiễm ho gà. Định nghĩa: ho cấp kèm dấu hiệu nhiễm trùng hô hấp dưới, không có bệnh phổi mạn tính (như bệnh phổi tắc nghẽn mạn tính) hay nguyên nhân khác. Không dùng kháng sinh thường quy; không dùng thuốc giãn phế quản trừ khi có khò khè. Bài cập nhật (Mulhem E và cs., AFP 2025) do lượt A mở có cùng nội dung chính."
