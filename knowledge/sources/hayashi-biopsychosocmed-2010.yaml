notes_vi: "Lượt C (phần b) đọc toàn văn PMC2940923 qua API Europe PMC. 70 người rối loạn hoảng sợ ở khoa Tâm thể (Nhật Bản), chia nhóm điện não bình thường (53) và bất thường (17). Bảng 3, tỷ lệ 13 triệu chứng của cơn (nhóm bình thường; nhóm bất thường): hồi hộp, tim đập nhanh 83,0%; 76,5%; vã mồ hôi 20,8%; 29,4%; run 30,2%; 29,4%; khó thở, ngột ngạt 75,5%; 76,5%; nghẹn 24,5%; 23,5%; đau, khó chịu ngực 41,5%; 41,2%; buồn nôn, khó chịu bụng 37,7%; 82,4%; chóng mặt, mất vững, choáng hoặc cảm giác sắp ngất 71,7%; 88,2%; cảm giác không thật 7,5%; 47,1%; sợ mất kiểm soát 43,4%; 64,7%; sợ chết 30,2%; 29,4%; tê bì 43,4%; 64,7%; ớn lạnh hoặc bốc hỏa 20,8%; 41,2%."
