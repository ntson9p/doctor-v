notes_vi: "Lượt C (Giai đoạn 3, lô 2, phần b) mở lại ngày 27/10/2026 (tải trang). Cơn góc đóng cấp: đau mắt dữ dội, mắt đỏ, giảm thị lực, quầng sáng màu quanh đèn, đau đầu, buồn nôn, đôi khi nôn; triệu chứng toàn thân có thể nặng đến mức bị nhầm là bệnh thần kinh hoặc tiêu hóa; người đau đầu đột ngột kèm buồn nôn, nôn thì cần khám mắt. Góc hẹp không có ở người trẻ, hẹp dần theo tuổi; nguy cơ cao hơn ở người châu Á, người có tiền sử gia đình; thuốc có tác dụng kháng cholinergic có thể gây cơn."
