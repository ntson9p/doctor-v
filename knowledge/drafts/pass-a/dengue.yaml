self_care_vi:
  - "Nghỉ ngơi, uống nhiều nước như nước trái cây, nước cháo loãng hoặc oresol."
  - "Khi sốt cao, nới lỏng quần áo và lau mát bằng nước ấm."
  - "Không tự dùng aspirin hoặc ibuprofen khi nghi sốt xuất huyết."
  - "Hỏi dược sĩ hoặc bác sĩ trước khi dùng thuốc hạ sốt."
  - "Ngủ màn, kể cả ban ngày, để tránh muỗi đốt và lây cho người khác."
see_doctor_vi:
  - "Đi khám trong 24 giờ để được xét nghiệm máu và hẹn theo dõi."
  - "Từ ngày thứ 3 đến ngày thứ 7 cần theo dõi sát, kể cả khi đã hết sốt."
  - "Đi cấp cứu ngay nếu đau bụng nhiều, nôn nhiều, chảy máu, li bì, tay chân lạnh hoặc tiểu ít."
review:
  status: draft
  authors: ["agent:pass-a"]
  updated: "2026-10-24"
  notes_vi: "Giữ urgency 3, cant_miss false theo gợi ý: 2760/QĐ-BYT cho phép điều trị ngoại trú ca chưa có dấu hiệu cảnh báo, khám lại mỗi ngày; dấu hiệu cảnh báo do quy tắc xử lý. Điểm chưa chắc: (1) prior cho 'Sốt' (P2) ngoại suy từ nghiên cứu sốt không rõ ổ, chưa có số liệu tỷ lệ dengue trên mọi người sốt ở tuyến đầu; prior 'Đau đầu', 'Đau bụng' (P4) là ước lượng. (2) Hệ số mùa, vùng lấy từ 4 tỉnh có tỷ suất cao nhất 1994–2013; dịch gần đây (2017, 2019, 2022) ở miền Bắc lớn hơn. Tây Nguyên chưa có số liệu. (3) Nhiều dấu hiệu khác nhau giữa trẻ em và người lớn (đau cơ, chảy máu niêm mạc) nhưng định dạng chỉ cho một tần suất. (4) Chấm xuất huyết đơn thuần không phải dấu hiệu cảnh báo theo 2760 nhưng quy tắc chung xếp mức 2: người bảo trì cân nhắc. (5) Tần suất dấu hiệu cảnh báo ở cộng đồng (nôn nhiều, tiểu ít) là ước lượng."
