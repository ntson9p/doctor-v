id: cystitis
names:
  vi: "Viêm bàng quang cấp"
  vi_common: ["Viêm bàng quang", "Nhiễm trùng đường tiểu", "Viêm đường tiết niệu"]
  en: "Acute cystitis (lower urinary tract infection)"
codes:
  icd10: "N30.0"
  icd10_verified: false
  mondo: "MONDO:0001650"
summary_vi:
  - "Bàng quang bị nhiễm khuẩn cấp, gặp nhiều ở phụ nữ."
  - "Hay gây đau buốt khi đi tiểu, đi tiểu nhiều lần, tức bụng dưới, đôi khi tiểu ra máu."
  - "Thường không sốt; nếu sốt hoặc đau hông lưng thì có thể nhiễm khuẩn đã lan lên thận."
urgency: 4
cant_miss: false
specialties: [general_medicine, urology, pediatrics]
priors:
  - complaint: abdominal_pain
    default: P3
    by_age: { infant_0_2m: P5, child_2m_5y: P4 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-3931-2015, byt-qd-3312-2015, viniol-fampract-2014, giesen-bmcfampract-2010]
      reported: "Chăm sóc ban đầu: nguyên nhân tiết niệu 5,3% người đau bụng (gồm cả sỏi); nữ/nam = 9/1; nhiễm trùng đường tiểu ở khoảng 5% trẻ gái, 1–2% trẻ trai"
      note: "Giesen: chỉ khoảng một nửa người bị nhiễm khuẩn tiết niệu có đau bụng dưới, nên phần lớn sẽ chọn triệu chứng tiểu buốt chứ không chọn đau bụng. Prior không khai báo được theo giới; P3 là mức chung cho cả hai giới (nữ cao hơn, nam thấp hơn nhiều). Trẻ dưới 5 tuổi bị nhiễm khuẩn tiết niệu thường biểu hiện sốt hơn là đau bụng (3312), nên P4."
findings:
  - finding: dysuria
    freq: very_frequent
    evidence:
      tier: A
      basis: numeric
      sources: [giesen-bmcfampract-2010, byt-qd-3931-2015]
      locator: "Giesen 2010, bảng 2"
      reported: "Độ nhạy 0,80 (0,74–0,86)"
      population: "phụ nữ nghi nhiễm khuẩn tiết niệu ở chăm sóc ban đầu"
  - finding: urinary_frequency
    freq: very_frequent
    evidence:
      tier: A
      basis: numeric
      sources: [giesen-bmcfampract-2010, byt-qd-3931-2015]
      locator: "Giesen 2010, bảng 2"
      reported: "Độ nhạy 0,88 (0,83–0,92)"
      population: "phụ nữ nghi nhiễm khuẩn tiết niệu ở chăm sóc ban đầu"
  - finding: hematuria
    freq: occasional
    evidence:
      tier: A
      basis: numeric
      sources: [giesen-bmcfampract-2010, byt-qd-3931-2015]
      reported: "Tiểu máu: độ nhạy 0,22–0,25"
      note: "3931: có thể tiểu máu cuối bãi."
  - finding: flank_pain
    freq: occasional
    evidence:
      tier: A
      basis: numeric
      sources: [giesen-bmcfampract-2010]
      reported: "Đau hông lưng: độ nhạy 0,26–0,29"
      note: "Nghiên cứu gộp nhiễm khuẩn tiết niệu nói chung; ở viêm bàng quang đơn thuần có lẽ thấp hơn. Đau hông lưng kèm sốt gợi ý viêm thận – bể thận."
  - finding: fever
    freq: occasional
    evidence:
      tier: A
      basis: numeric
      sources: [giesen-bmcfampract-2010, byt-qd-3931-2015]
      reported: "Sốt: độ nhạy 0,10–0,12"
      note: "3931: thường không sốt hoặc chỉ sốt nhẹ dưới 38°C."
  - finding: fever_max_temp
    dist: { lt_38: 0.75, t38_39: 0.20, ge_39: 0.05 }
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-3931-2015, byt-qd-3312-2015]
      note: "Phân bố trong số người có sốt. 3931: thường sốt nhẹ dưới 38°C; 3312 (trẻ em): nhiễm trùng tiểu thấp sốt dưới 38,5°C hoặc không sốt."
  - finding: abd_pain_location
    dist: { epigastric: 0.03, right_upper: 0.025, left_upper: 0.025, periumbilical: 0.05, right_lower: 0.07, left_lower: 0.07, suprapubic: 0.65, whole: 0.08 }
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-3931-2015, byt-qd-3312-2015]
      note: "3931: có thể đau nhẹ vùng trên khớp mu khi bàng quang căng; 3312: trẻ lớn đau vùng bụng dưới. Phân bố cụ thể là ước lượng của người soạn."
  - finding: abd_pain_severe
    freq: rare
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-3931-2015]
      note: "3931: chỉ đau nhẹ vùng trên khớp mu. Đau dữ dội gợi ý bệnh khác."
  - finding: abd_pain_onset
    dist: { sudden: 0.10, gradual: 0.90 }
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-3931-2015]
      note: "Tức bụng dưới tăng dần cùng triệu chứng tiểu buốt; khởi phát đột ngột, rất đau ít phù hợp. Ước lượng của người soạn."
  - finding: abd_pain_duration
    dist: { lt_6h: 0.10, h6_24: 0.30, d1_3: 0.40, d4_14: 0.15, gt_2w: 0.05 }
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-3931-2015, nhs-uti]
      note: "Người bệnh thường đi khám sau vài ngày có triệu chứng; NHS khuyên khám nếu không đỡ sau 48 giờ; viêm tái phát có thể chọn 'đau tái đi tái lại'. Ước lượng của người soạn."
  - finding: abd_pain_worse_movement
    freq: rare
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-3931-2015]
      note: "Không có kích thích phúc mạc; liên kết để phân biệt với viêm ruột thừa, viêm vùng chậu. Ước lượng của người soạn."
  - finding: abd_pain_meal_relation
    dist: { hungry_relieved_by_food: 0.03, worse_after_meal: 0.05, no_relation: 0.92 }
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-3931-2015]
      note: "Đau do bàng quang, không liên quan bữa ăn. Ước lượng của người soạn."
  - finding: nausea
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-uti]
      note: "NHS: trẻ em bị nhiễm khuẩn tiết niệu có thể nôn; người lớn bị viêm bàng quang ít khi buồn nôn. Ước lượng của người soạn."
  - finding: vomiting
    freq: rare
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-3931-2015, nhs-uti]
      note: "Nôn không thuộc bệnh cảnh viêm bàng quang đơn thuần ở người lớn (3931); nôn kèm sốt gợi ý nhiễm khuẩn đã lan lên thận. Ở trẻ nhỏ có thể nôn (NHS). Ước lượng của người soạn."
  - finding: diarrhea
    freq: rare
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-3931-2015]
      note: "Không thuộc bệnh cảnh ở người lớn; liên kết để phân biệt với viêm dạ dày – ruột. Ước lượng của người soạn."
warning_signs: [confusion, drowsy_hard_to_wake, cold_hands_feet]
self_care_vi:
  - "Uống đủ nước để đi tiểu đều trong ngày."
  - "Không nhịn tiểu quá 6 giờ."
  - "Hạn chế cà phê, rượu bia khi đang có triệu chứng."
see_doctor_vi:
  - "Đi khám trong 1–2 ngày để được xét nghiệm nước tiểu và điều trị nếu cần."
  - "Đi khám trong hôm nay nếu sốt, đau hông lưng, tiểu ra máu hoặc đang mang thai."
  - "Nam giới, trẻ em và người từ 65 tuổi bị tiểu buốt nên đi khám sớm."
review:
  status: draft
  authors: ["agent:pass-a"]
  updated: "2026-10-24"
  notes_vi: >-
    Giữ urgency 4 như gợi ý: 3931/QĐ-BYT điều trị viêm bàng quang thông thường ở phụ nữ bằng một đợt kháng sinh ngắn, tiên lượng tốt.
    Điểm chưa chắc chắn: (1) NHS khuyên khám gấp với nam giới, phụ nữ có thai, người từ 65 tuổi, trẻ đến 15 tuổi, hoặc khi tiểu máu, sốt, đau hông lưng; hệ thống hiện không có quy tắc riêng cho các nhóm này (ngoài rf_pregnant_abdominal_pain), đề nghị xem xét; (2) prior không khai báo được theo giới, P3 là mức chung; (3) không liên kết abnormal_vaginal_discharge: y văn cho thấy khí hư làm giảm khả năng nhiễm khuẩn tiết niệu (Bent LR 0,3; Giesen LR+ 0,65, độ nhạy 15%), nhưng leak của dấu hiệu này (5%) thấp hơn 15% nên liên kết theo đúng tần suất sẽ làm tăng sai chiều; (4) số liệu triệu chứng lấy từ phụ nữ ở chăm sóc ban đầu (Giesen), chưa có số liệu ở nam giới, trẻ em và ở Việt Nam.
