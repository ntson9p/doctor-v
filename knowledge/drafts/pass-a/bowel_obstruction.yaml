id: bowel_obstruction
names:
  vi: "Tắc ruột"
  vi_common: ["Bán tắc ruột", "Xoắn ruột", "Tắc ruột do dính"]
  en: "Intestinal obstruction"
codes:
  icd10: "K56"
  icd10_verified: false
  mondo: "MONDO:0004565"
summary_vi:
  - "Ruột bị tắc, làm thức ăn, hơi và phân không đi qua được."
  - "Hay gây đau quặn từng cơn, nôn, bụng chướng, không đi ngoài và không xì hơi được."
  - "Nguyên nhân thường gặp là dính ruột sau mổ, thoát vị hoặc khối u; cần cấp cứu sớm."
urgency: 2
cant_miss: true
specialties: [general_surgery, emergency]
priors:
  - complaint: abdominal_pain
    default: P4
    by_age: { infant_0_2m: P5, child_2m_5y: P5, child_5_12: P5, teen_13_17: P5, elder_65_74: P3, elder_75p: P3 }
    evidence:
      tier: B
      basis: numeric
      sources: [taylor-aem-2013, bohner-ejs-1998, msd-intestinal-obstruction]
      reported: "Tắc ruột non khoảng 2% người đau bụng ở cấp cứu (Taylor); tắc ruột 3,8% người đau bụng cấp ở 6 bệnh viện Đức (Böhner)"
      note: "Ở cộng đồng thấp hơn cấp cứu, nên P4 cho người dưới 65 tuổi. Böhner: tuổi trên 50 là một trong các yếu tố nhạy nhất; người cao tuổi hay tắc do u, thoát vị, nên P3. Trẻ em (lồng ruột đã có bệnh riêng): P5. Chưa có số liệu Việt Nam."
findings:
  - finding: abd_pain_location
    dist: { epigastric: 0.10, right_upper: 0.04, left_upper: 0.04, periumbilical: 0.30, right_lower: 0.06, left_lower: 0.06, suprapubic: 0.05, whole: 0.35 }
    evidence:
      tier: C
      basis: verbal
      sources: [msd-intestinal-obstruction, cartwright-afp-2008]
      note: "MSD: tắc ruột non đau quặn quanh rốn hoặc thượng vị; Cartwright xếp tắc ruột vào nhóm có thể đau ở bất kỳ vị trí nào. Phân bố cụ thể là ước lượng."
  - finding: abd_pain_colicky
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [bohner-ejs-1998, cartwright-afp-2008, tenbroek-wjes-2018]
      reported: "Đau quặn: LR+ 2,8, LR− 0,8 (Böhner)"
      note: "Bologna: đau quặn từng cơn thuộc bộ ba kinh điển. LR+ 2,8 gần bằng tỷ số giữa mức frequent (0,5) và tỷ lệ nền của dấu hiệu (0,2), nên chọn frequent dù độ nhạy suy từ cặp LR chỉ khoảng 0,3."
  - finding: no_stool_or_gas
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [bohner-ejs-1998, cartwright-afp-2008, taylor-aem-2013, tenbroek-wjes-2018]
      reported: "Táo bón: LR+ 8,8, LR− 0,6 (suy ra độ nhạy khoảng 0,43)"
      note: "Taylor: táo bón là một trong các yếu tố dự báo tốt nhất. Câu hỏi đòi cả không đi ngoài và không xì hơi; tắc không hoàn toàn vẫn có thể xì hơi."
  - finding: abdomen_hard_swollen
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [bohner-ejs-1998, cartwright-afp-2008, tenbroek-wjes-2018]
      reported: "Chướng bụng: LR+ 5,7, LR− 0,4 (suy ra độ nhạy khoảng 0,64)"
      note: "Bologna: chướng bụng thuộc bộ ba kinh điển."
  - finding: previous_abdominal_surgery
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [bohner-ejs-1998, cartwright-afp-2008, tenbroek-wjes-2018]
      reported: "Từng mổ bụng: LR+ 2,7, LR− 0,4 (suy ra độ nhạy khoảng 0,7); dính sau mổ gây khoảng 60% ca tắc ruột non"
      note: "Tắc đại tràng (u, xoắn) ít liên quan mổ cũ, nên chọn frequent cho toàn bộ tắc ruột. Tỷ lệ nền 5% của dấu hiệu này có lẽ thấp (theo Böhner khoảng 26% người đau bụng không tắc ruột từng mổ), làm LR trong mô hình cao hơn y văn."
  - finding: vomiting
    freq: very_frequent
    evidence:
      tier: C
      basis: verbal
      sources: [msd-intestinal-obstruction, bohner-ejs-1998, tenbroek-wjes-2018]
      note: "MSD: tắc ruột non nôn sớm; tắc đại tràng nôn muộn, ít hơn. Böhner: nôn là một trong sáu yếu tố nhạy nhất."
  - finding: nausea
    freq: very_frequent
    evidence:
      tier: C
      basis: verbal
      sources: [tenbroek-wjes-2018]
      note: "Bologna: buồn nôn thuộc bộ ba kinh điển."
  - finding: persistent_vomiting
    freq: frequent
    evidence:
      tier: C
      basis: judgment
      sources: [msd-intestinal-obstruction]
      note: "Tắc ruột non thường nôn nhiều lần, ăn uống gì cũng nôn. Ước lượng của người soạn."
  - finding: vomiting_bilious
    freq: frequent
    evidence:
      tier: C
      basis: judgment
      sources: [msd-intestinal-obstruction, reust-afp-2016]
      note: "Dấu hiệu đề xuất (xem proposed_findings). Tần suất trong số người đã có nôn. Reust: nôn ra mật gợi ý bệnh cần mổ ở trẻ; tắc ruột non thường nôn ra dịch mật. Chưa có số liệu, ước lượng khoảng một nửa."
  - finding: abd_pain_onset
    dist: { sudden: 0.30, gradual: 0.70 }
    evidence:
      tier: C
      basis: verbal
      sources: [msd-intestinal-obstruction]
      note: "Phần lớn đau quặn tăng dần; xoắn ruột thường khởi phát đột ngột (MSD). Tỷ lệ là ước lượng."
  - finding: abd_pain_duration
    dist: { lt_6h: 0.15, h6_24: 0.35, d1_3: 0.38, d4_14: 0.10, gt_2w: 0.02 }
    evidence:
      tier: C
      basis: judgment
      sources: [bohner-ejs-1998, msd-intestinal-obstruction]
      note: "Tắc ruột non diễn tiến trong vài giờ đến 1–2 ngày; tắc đại tràng chậm hơn. Ước lượng của người soạn."
  - finding: abd_pain_severe
    freq: frequent
    evidence:
      tier: C
      basis: judgment
      sources: [msd-intestinal-obstruction]
      note: "MSD: đau dữ dội, liên tục gợi ý thắt nghẹt (gần 25% ca tắc ruột non). Ước lượng của người soạn."
  - finding: abd_pain_worse_movement
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [msd-intestinal-obstruction]
      note: "MSD: khi chưa thắt nghẹt bụng không đau khi ấn; khi đã hoại tử thì đau khi ấn, có dấu hiệu phúc mạc. Ước lượng của người soạn."
  - finding: abd_pain_meal_relation
    dist: { hungry_relieved_by_food: 0.03, worse_after_meal: 0.35, no_relation: 0.62 }
    evidence:
      tier: C
      basis: judgment
      sources: [msd-intestinal-obstruction]
      note: "Ăn uống làm đau và nôn tăng. Ước lượng của người soạn."
  - finding: loss_of_appetite
    freq: frequent
    evidence:
      tier: C
      basis: judgment
      sources: [msd-intestinal-obstruction]
      note: "Người bệnh thường bỏ ăn vì đau và nôn. Ước lượng của người soạn."
  - finding: fever
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [msd-intestinal-obstruction]
      note: "Sốt không phải đặc điểm của tắc ruột đơn thuần; khi có sốt cần nghĩ đến thắt nghẹt hoặc hoại tử. Ước lượng của người soạn."
  - finding: diarrhea
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [msd-intestinal-obstruction, tenbroek-wjes-2018]
      note: "MSD, Bologna: tắc không hoàn toàn có thể tiêu chảy, dễ nhầm với viêm dạ dày – ruột."
warning_signs: [abd_pain_severe, abdomen_hard_swollen, persistent_vomiting, no_stool_or_gas, fainting_or_near_fainting, cold_hands_feet, fever]
self_care_vi:
  - "Không ăn uống gì trong khi chờ đến cơ sở cấp cứu."
  - "Không tự dùng thuốc nhuận tràng hoặc thụt tháo tại nhà."
see_doctor_vi:
  - "Đến cơ sở cấp cứu ngay khi đau quặn bụng kèm nôn, chướng bụng hoặc không xì hơi được."
  - "Gọi 115 nếu đau dữ dội liên tục, bụng cứng, hoặc lả đi."
proposed_findings:
  - id: vomiting_bilious
    kind: sign
    type: binary
    label_vi: "Nôn ra dịch xanh"
    question_vi: "Chất nôn có màu xanh lá hoặc vàng xanh như mật không?"
    requires:
      - any:
          - { finding: vomiting, is: present }
          - { finding: persistent_vomiting, is: present }
          - { finding: child_vomits_everything, is: present }
    leak: moderate
    notes_vi: "3312/QĐ-BYT xếp nôn ra mật vào chỉ định nhập viện ở trẻ tiêu chảy; Reust 2016: nôn ra mật là dấu hiệu gợi ý bệnh cần mổ ở trẻ. Giúp phân biệt tắc ruột, lồng ruột với viêm dạ dày – ruột, nhất là ở trẻ nhỏ. Lưu ý người lớn hay nói 'nôn ra mật xanh mật vàng' khi nôn nhiều do bất kỳ nguyên nhân nào, nên để leak moderate."
review:
  status: draft
  authors: ["agent:pass-a"]
  updated: "2026-10-24"
  notes_vi: >-
    Giữ urgency 2 và cant_miss true như gợi ý: MSD cho biết thắt nghẹt gặp gần 25% ca tắc ruột non, có thể hoại tử chỉ sau 6 giờ, cần nhập viện; Bologna: tử vong trong viện 3% mỗi đợt.
    Điểm chưa chắc chắn: (1) tần suất suy từ cặp LR của Böhner qua bảng Cartwright, chưa đọc được toàn văn; (2) bệnh gộp tắc ruột non, tắc đại tràng, thoát vị nghẹt và xoắn ruột, có đặc điểm khác nhau; (3) leak 5% của previous_abdominal_surgery có lẽ thấp so với tỷ lệ từng mổ bụng (kể cả mổ đẻ) ở người lớn, đề nghị xem lại (khoảng 0,15–0,25 có ghi lý do); (4) chưa có số liệu Việt Nam về nguyên nhân (dính sau mổ, u đại tràng, thoát vị, búi giun ở trẻ); (5) đề xuất dấu hiệu vomiting_bilious.
