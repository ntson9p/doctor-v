id: ectopic_pregnancy
names:
  vi: "Thai ngoài tử cung"
  vi_common: ["Chửa ngoài tử cung", "Mang thai ngoài tử cung"]
  en: "Ectopic pregnancy"
codes:
  icd10: "O00"
  icd10_verified: true
  mondo: "MONDO:0000755"
summary_vi:
  - "Thai làm tổ ở ngoài buồng tử cung, phần lớn ở vòi trứng."
  - "Hay gặp đau bụng dưới, chậm kinh và ra máu âm đạo ít, sẫm màu."
  - "Khối thai có thể vỡ, gây chảy máu trong bụng và nguy hiểm tính mạng."
urgency: 2
cant_miss: true
specialties: [obstetrics_gynecology, emergency]
applicability:
  sex: [female]
  age_groups: [teen_13_17, adult_18_44, adult_45_64]
  reason_vi: "Chỉ gặp ở phụ nữ trong độ tuổi có thể mang thai."
priors:
  - complaint: abdominal_pain
    default: P4
    by_age: { teen_13_17: P5, adult_45_64: P6 }
    evidence:
      tier: C
      basis: judgment
      sources: [msd-ectopic-pregnancy, byt-qd-315-2015]
      note: "Tính trong số phụ nữ (bệnh chỉ áp dụng cho nữ). Khoảng 2/100 thai được phát hiện là thai ngoài tử cung (MSD); Bộ Y tế xếp là cấp cứu sản khoa. Trong phụ nữ 18–44 tuổi đau bụng ở cộng đồng hoặc tuyến ban đầu, chỉ một phần nhỏ đang có thai 3 tháng đầu, nên ước khoảng 0,5% (P4). Tuổi 13–17 ít quan hệ tình dục và ít có thai hơn (P5); 45–64 tuổi khả năng có thai rất thấp (P6). Chưa tìm được số liệu Việt Nam ở tuyến ban đầu."
findings:
  - finding: pregnant
    freq: very_frequent
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015, msd-ectopic-pregnancy]
      note: "Mọi ca đều đang có thai, nhưng nhiều người chưa biết hoặc tin là mình không có thai (kinh không đều; ra máu trước ngày dự kiến có kinh nên tưởng là kinh, theo 315/QĐ-BYT và MSD). Cố ý chọn very_frequent, không chọn almost_always, để câu trả lời 'không' chỉ giảm khả năng khoảng 5 lần chứ không loại trừ."
  - finding: missed_period
    freq: very_frequent
    evidence:
      tier: B
      basis: numeric
      sources: [joshi-cureus-2025, nalini-cureus-2023, byt-qd-315-2015]
      reported: "mất kinh 63,4% (Joshi 2025); 97,3% (Nalini 2023)"
      population: "phụ nữ thai ngoài tử cung ở bệnh viện tuyến cuối, Ấn Độ"
      note: "Hai nghiên cứu cho 63–97%, lấy mức giữa. 315/QĐ-BYT ghi nhiều trường hợp không rõ chậm kinh vì ra máu trước ngày dự kiến có kinh. Cùng cụm 'pregnancy_signs' với 'pregnant' nên không bị đếm trùng hoàn toàn."
  - finding: gestational_age
    dist: { lt_20w: 0.98, ge_20w: 0.02 }
    evidence:
      tier: C
      basis: verbal
      sources: [msd-ectopic-pregnancy, byt-qd-315-2015]
      note: "Tần suất trong số người đã trả lời có thai. Khối thai thường vỡ khoảng tuần 6–16 (MSD); thai trong ổ bụng phát triển lớn là thể rất hiếm (315/QĐ-BYT)."
  - finding: vaginal_bleeding
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [joshi-cureus-2025, byt-qd-315-2015, msd-ectopic-pregnancy, crochet-jama-2013]
      reported: "ra máu âm đạo bất thường 46,3%"
      population: "123 ca thai ngoài tử cung, bệnh viện tuyến cuối Ấn Độ"
      note: "315/QĐ-BYT mô tả máu ra ít một, sẫm màu, dai dẳng; MSD: phần lớn có đau vùng chậu, ra máu hoặc cả hai. Trong nhóm đã có thai, ra máu và đau không giúp phân biệt thai ngoài tử cung với sẩy thai (LR dưới 1,5, Crochet 2013); dấu hiệu này chủ yếu giúp phân biệt với bệnh không liên quan thai."
  - finding: abd_pain_location
    dist: { epigastric: 0.02, right_upper: 0.02, left_upper: 0.01, periumbilical: 0.04, right_lower: 0.30, left_lower: 0.30, suprapubic: 0.21, whole: 0.10 }
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-315-2015]
      note: "Thường đau ở vị trí khối chửa (hố chậu một bên hoặc hạ vị); thể lụt máu ổ bụng đau khắp bụng (315/QĐ-BYT). Tỷ lệ cụ thể là ước lượng."
  - finding: abd_pain_onset
    dist: { sudden: 0.35, gradual: 0.65 }
    evidence:
      tier: C
      basis: judgment
      sources: [msd-ectopic-pregnancy, byt-qd-315-2015]
      note: "Khi vỡ hay đau đột ngột, dữ dội (MSD; thể lụt máu ổ bụng xuất hiện đột ngột theo 315/QĐ-BYT); thể chưa vỡ thường đau âm ỉ tăng dần. Tỷ lệ là ước lượng của người soạn."
  - finding: abd_pain_severe
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015, joshi-cureus-2025]
      note: "Đau dữ dội chủ yếu khi khối chửa vỡ. Ở bệnh viện tuyến cuối phần lớn đã vỡ (84,6%), nhưng người dùng doctor-v phần lớn đến sớm hơn, nên hạ xuống occasional."
  - finding: abdomen_hard_swollen
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-315-2015]
      note: "Thể lụt máu ổ bụng: bụng trướng, ấn đau khắp bụng, có phản ứng thành bụng. Hạ một mức so với số ca vỡ ở bệnh viện vì người dùng ở cộng đồng."
  - finding: fainting_or_near_fainting
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-315-2015, msd-ectopic-pregnancy]
      note: "Có thể choáng ngất do đau hoặc do vỡ khối chửa (315/QĐ-BYT); ngất không rõ nguyên nhân ở phụ nữ tuổi sinh đẻ cần nghĩ đến thai ngoài tử cung (MSD). Không có số liệu ở cộng đồng; chọn occasional."
  - finding: pain_with_menses
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015]
      note: "Máu âm đạo của thai ngoài tử cung có thể ra đúng khoảng ngày dự kiến có kinh và bị tưởng là kinh (315/QĐ-BYT). Chọn occasional để câu trả lời 'có' không loại bỏ thai ngoài tử cung khỏi danh sách."
  - finding: fever
    freq: rare
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015]
      note: "Phần chẩn đoán phân biệt của 315/QĐ-BYT dùng tình trạng nhiễm khuẩn để nhận ra viêm phần phụ và viêm ruột thừa; thai ngoài tử cung thường không sốt. Tần suất là ước lượng."
warning_signs: [abd_pain_severe, fainting_or_near_fainting, abdomen_hard_swollen, cold_hands_feet, severe_weakness]
self_care_vi:
  - "Nếu có que thử thai, có thể thử ngay, nhưng không chờ kết quả mới đi khám."
  - "Nhờ người thân đưa đi, không tự lái xe."
see_doctor_vi:
  - "Đến cơ sở cấp cứu sản khoa hoặc bệnh viện gần nhất ngay để được thử thai và siêu âm."
  - "Gọi 115 nếu đau dữ dội, choáng ngất, vã mồ hôi lạnh hoặc mệt lả."
review:
  status: draft
  authors: ["agent:pass-a"]
  updated: "2026-10-24"
  notes_vi: "Giữ urgency 2, cant_miss true như gợi ý: 315/QĐ-BYT xếp thai ngoài tử cung là cấp cứu sản khoa cần chẩn đoán và điều trị sớm; ca vỡ có sốc được bắt bằng quy tắc dấu hiệu nguy hiểm. Điểm chưa chắc chắn: (1) prior chỉ là ước lượng, chưa có số liệu tỷ lệ thai ngoài tử cung trong phụ nữ đau bụng ở tuyến ban đầu Việt Nam; (2) số liệu triệu chứng lấy từ bệnh viện tuyến cuối Ấn Độ, nơi phần lớn đã vỡ, nên đã hạ mức các dấu hiệu nặng; (3) chưa có nguồn đã mở nói rõ tần suất triệu chứng tiêu hóa (tiêu chảy, mót rặn) và đau lan lên vai, nên chưa liên kết các dấu hiệu này; (4) danh mục chưa có các yếu tố nguy cơ chính (từng bị thai ngoài tử cung, từng mổ vòi trứng, đang đặt vòng). Mã ICD-10 và tên chính thức đã đối chiếu trên ICD-Vietnam (icd.kcb.vn, bộ mã theo Thông tư 06/2026/TT-BYT) ngày 2026-10-24."
