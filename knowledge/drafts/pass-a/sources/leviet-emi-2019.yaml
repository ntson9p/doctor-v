notes_vi: "Quảng Nam, tháng 5–8/2016, 378 người lớn sốt cấp không rõ ổ tại 4 bệnh viện. Cúm 20,9%, dengue 7,7%, sốt mò 5,6%, sốt chuột 4,8%, xoắn khuẩn vàng da 4,8%. Sốt mò: đi rừng 47%, vết loét 47%, nổi hạch 42%, đau đầu 95%, đau cơ 58%, đau khớp 37%, ho 32%, sốt trung vị 7,5 ngày. Dengue: đau đầu 64%, ho 11%, đau bụng 18%, xuất huyết 7%, nhiệt độ cao nhất trung bình 39,6°C."
