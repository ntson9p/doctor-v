notes_vi: "Trẻ em ở nước thu nhập cao, chăm sóc ban đầu hoặc cấp cứu. Đau tai: 50% hết vào ngày 3, 90% hết vào ngày 7–8; sốt trong viêm tai giữa kéo dài trung vị khoảng 3 ngày. Cảm lạnh: khoảng 50% đỡ vào ngày 10, 90% vào khoảng ngày 15."
