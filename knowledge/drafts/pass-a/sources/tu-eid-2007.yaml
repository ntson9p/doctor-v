notes_vi: "764 trẻ nhập viện vì tay chân miệng ở TP.HCM năm 2005. Bệnh có quanh năm với 2 đỉnh: tháng 3–5 và tháng 9–12. Chủ yếu trẻ dưới 5 tuổi, đỉnh 1–2 tuổi. Loét miệng 59% (EV71) và 83% (CVA16); nôn 36% và 14%; ho 41% và 28%; đau họng 43% và 39%; sổ mũi 42% và 43%; tiêu chảy 9% và 8%; co giật 10,4% và 1,9%."
