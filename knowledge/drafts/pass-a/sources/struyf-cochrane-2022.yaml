notes_vi: "42 nghiên cứu tiến cứu, 52.608 người, phần lớn trước giai đoạn Omicron, ở khoa cấp cứu và điểm xét nghiệm ngoại trú. Độ nhạy gộp: ho 62,4% (độ đặc hiệu 45,4%), sốt 37,6%, khó thở 23,3%, mệt 40,2%, mất ngửi 26,4% (độ đặc hiệu 94,2%), mất ngửi hoặc mất vị 39,2%. Đau họng, sổ mũi gợi ý bệnh nhiễm trùng khác hơn là COVID-19 (LR+ của đau họng 0,81). Ở chăm sóc ban đầu: đau đầu 11–40%, đau cơ 26%."
