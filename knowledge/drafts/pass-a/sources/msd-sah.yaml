notes_vi: "Khoảng 85% xuất huyết dưới nhện tự phát do vỡ phình động mạch; hay gặp ở tuổi 40–65. Đau đầu dữ dội đạt đỉnh trong vài giây, người bệnh mô tả là đau nhất đời; mất ý thức thường xảy ra ngay; lúc đầu cổ thường chưa cứng, trong 24 giờ mới xuất hiện dấu hiệu màng não và nôn; có thể co giật. Khoảng 35% tử vong sau lần vỡ đầu."
