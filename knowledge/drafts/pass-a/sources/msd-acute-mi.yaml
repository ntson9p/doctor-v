notes_vi: "Đau sâu sau xương ức, kiểu đè ép, hay lan ra lưng, hàm, tay, vai; thường kèm khó thở, vã mồ hôi, buồn nôn hoặc nôn (nhất là nhồi máu thành dưới). Khoảng 20% nhồi máu cơ tim không có triệu chứng rõ (tới 30% ở người đái tháo đường). Người bệnh hay tưởng là khó tiêu. Người cao tuổi hay than khó thở hơn đau ngực. Một số người đến khám vì ngất. Giai đoạn báo trước có thể có mệt, khó thở, rối loạn tiêu hóa."
