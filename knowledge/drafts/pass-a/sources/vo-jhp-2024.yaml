notes_vi: "1362 sinh viên y ở Hà Nội (2024), bộ câu hỏi HARDSHIP, tiêu chuẩn ICHD-3. Tỷ lệ mắc trong 1 năm: đau đầu bất kỳ 82,6%; migraine 21,8% (chắc chắn 6,8%, có thể 15,0%; nữ 25,4%, nam 17,0%); đau đầu căng thẳng 54,0% (chắc chắn 35,6%); đau đầu từ 15 ngày mỗi tháng 4,1%. Nữ giới liên quan độc lập với migraine (OR hiệu chỉnh 1,77)."
