notes_vi: "Tổng quan định tính, chủ yếu số liệu bệnh viện. Ca điển hình ở người trẻ: sốt từ 38°C, đau hông lưng, ấn đau góc sườn lưng, tiểu buốt, tiểu nhiều lần. Người cao tuổi hay không điển hình: lú lẫn, tiểu ít, mệt mỏi, không đau hông lưng. Viêm thận bể thận chiếm 0,5% lượt khám cấp cứu (dữ liệu Mỹ)."
