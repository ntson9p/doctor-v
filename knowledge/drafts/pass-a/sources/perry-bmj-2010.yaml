notes_vi: "6 khoa cấp cứu ở Canada; 1999 người lớn tỉnh táo, đau đầu đạt đỉnh trong 1 giờ; 130 người (6,5%) có xuất huyết dưới nhện. Ở nhóm xuất huyết dưới nhện: đau đầu dữ dội nhất đời 93,1%, than đau hoặc cứng cổ 71,1%, cứng gáy khi khám 30,4%, nôn 58,6%, mất ý thức 16,9%, khởi phát khi gắng sức 23,1%, thời gian đạt đỉnh trung bình 3,4 phút; huyết áp tâm thu trung bình 159 (độ lệch chuẩn 29) mmHg; nhiệt độ trung bình 36,3°C. Nghiên cứu loại trừ người có dấu hiệu thần kinh khu trú mới."
