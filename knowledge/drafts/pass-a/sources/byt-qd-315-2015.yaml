notes_vi: "Bản PDF toàn văn (quyết định ký ngày 29/01/2015 kèm tài liệu hướng dẫn) do thư viện điện tử elib.bvdktuthainguyen.gov.vn lưu; trang caselaw.vn chỉ có phần quyết định. Văn bản hành chính nhà nước. Chưa kiểm tra được văn bản thay thế. Viêm phần phụ cấp: đau bụng dưới hai bên khoảng 90%, rối loạn kinh nguyệt 50%, triệu chứng kích thích (mót rặn, tiểu khó) 15–25%, khí hư nhiều hoặc có mủ 39–65%; thể bán cấp chiếm 30%. Tiền sản giật gặp ở 2–8% thai phụ."
