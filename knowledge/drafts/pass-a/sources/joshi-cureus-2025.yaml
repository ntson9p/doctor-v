notes_vi: "123 ca thai ngoài tử cung ở bệnh viện tuyến cuối: đau bụng 82,9%, mất kinh 63,4%, ra máu âm đạo bất thường 46,3%; vỡ khi mổ 84,6%. Yếu tố nguy cơ: từng sẩy hoặc phá thai 19,5%, viêm vùng chậu 17,9%, từng mổ lấy thai 11,4%, từng nạo hút 11,4%. Phần lớn đến muộn (đã vỡ), nên tần suất triệu chứng nặng cao hơn ở cộng đồng."
