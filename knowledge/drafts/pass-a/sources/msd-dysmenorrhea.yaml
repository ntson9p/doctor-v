notes_vi: "Đau bụng kinh nguyên phát thường bắt đầu trong vòng 1 năm sau lần có kinh đầu, giảm dần theo tuổi và sau lần mang thai đầu. Đau bắt đầu cùng lúc hành kinh hoặc trước 1–3 ngày, mạnh nhất sau khoảng 24 giờ, giảm sau 2–3 ngày; đau quặn từng cơn trên nền đau âm ỉ bụng dưới, có thể lan ra lưng, đùi. Hay kèm đau đầu, buồn nôn, táo bón hoặc tiêu chảy, đau thắt lưng, tiểu nhiều lần; đôi khi nôn. Dấu hiệu gợi ý nguyên nhân khác: đau mới, đột ngột hoặc liên tục, sốt, khí hư có mủ, dấu hiệu viêm phúc mạc; đau khi giao hợp gợi ý lạc nội mạc tử cung. Cần thử thai cho phụ nữ tuổi sinh đẻ đau vùng chậu."
