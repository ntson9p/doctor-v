notes_vi: "Điểm xét nghiệm cộng đồng ở San Francisco. Giai đoạn Omicron BA.1, 3.032 người có triệu chứng dương tính (so với người có triệu chứng âm tính): sốt 30,4% (14,4%), ho 67,4% (50,6%), khó thở 8,0% (6,0%), mệt 19,6% (17,0%), đau cơ 28,6% (17,8%), đau đầu 35,5% (29,9%), mất ngửi hoặc vị 5,3% (3,0%), đau họng 43,4% (37,2%), nghẹt mũi 38,8% (34,6%), buồn nôn 5,0%, tiêu chảy 4,8%."
