notes_vi: "2.820 người lớn ho cấp ở chăm sóc ban đầu tại 12 nước châu Âu; 140 người (5%) viêm phổi trên X quang. Ở người viêm phổi: có đờm 86%, khó thở 69%, không sổ mũi 44%, sốt (tự báo) 59%, đau ngực 57%, tiêu chảy 11%, đang hút thuốc 30% (toàn mẫu 28%), có bệnh nền 36%; trung bình 9 ngày bệnh trước khi khám."
