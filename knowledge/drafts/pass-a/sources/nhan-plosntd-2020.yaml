notes_vi: "1.196 trẻ đến 12 tuổi ở 3 bệnh viện TP.HCM (262 ngoại trú, 934 nội trú). Ngoại trú: sốt 42,0%, loét miệng 81,7%, tổn thương da 89,3%, phỏng nước 27,9%, ho 31,3%, sổ mũi 29,8%, tiêu chảy 3,8%, nôn 23,3%, giật mình 0% (nội trú 60,8%). Tổn thương da ở lòng bàn tay, bàn chân 88–92% với EV-A71, CV-A6, CV-A16, nhưng chỉ 35% với CV-A10. 249/262 ca ngoại trú là độ 1."
