notes_vi: "17 nghiên cứu ngoại trú ở người nghi viêm mũi xoang cấp (51% được xác nhận). Độ nhạy: sốt trên 38°C 11%, đau má một bên 30%, đau má hoặc trán 49%, đau tăng khi cúi 72%, chảy mũi mủ 71%, chảy mũi bất kỳ 75%, nghẹt mũi 83%, giảm hoặc mất ngửi 61%, đau đầu 50%, ho 69%, có nhiễm trùng hô hấp trước đó 87%, bệnh hai pha (đỡ rồi nặng lại) 74%, đau răng 34%. Thời gian kéo dài trên 5, 10 hoặc 21 ngày: độ nhạy 25–70%, không rõ xu hướng."
