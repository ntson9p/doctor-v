notes_vi: "Người lớn đã tiêm vắc xin ở Anh, tự báo cáo qua ứng dụng, giai đoạn Omicron (n = 4.990): sổ mũi 76,5%, đau đầu 74,7%, đau họng 70,5%, hắt hơi 63,0%, ho kéo dài 49,8%, khàn tiếng 42,6%; mất ngửi 16,7% (giai đoạn Delta 52,7%). Nhập viện 1,9%."
