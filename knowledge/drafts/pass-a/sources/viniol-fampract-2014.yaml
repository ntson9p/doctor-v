notes_vi: "Tổng quan 14 nghiên cứu về đau bụng ở chăm sóc ban đầu (không gồm trẻ em), chủ yếu ở châu Âu. Tóm tắt nêu tỷ lệ nguyên nhân: viêm dạ dày – ruột 7,2–18,7%, viêm dạ dày 5,2%, nguyên nhân tiết niệu 5,3%, viêm ruột thừa 1,9%, bệnh mật – tụy 4,0%."
