notes_vi: "Khảo sát cộng đồng đại diện toàn quốc ở Anh. Mất vị hoặc mất ngửi ở người dương tính có triệu chứng giảm từ 44%/45% (10/2021, Delta) xuống 16%/13% (01/2022) và 15%/12% (03/2022, Omicron). Ho, sốt, khó thở, đau cơ, mệt, đau đầu giảm; đau họng tăng khi Omicron chiếm ưu thế."
