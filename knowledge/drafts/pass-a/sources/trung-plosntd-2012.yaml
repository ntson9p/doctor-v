notes_vi: "Bệnh viện Bệnh Nhiệt đới TP.HCM, ca dengue nằm khoa nhiễm (472 trẻ em, 285 người lớn). Lúc vào viện: đau đầu 69% trẻ / 93% người lớn; đau cơ 19% / 70%; ho 16% / 24%; nôn 37% / 50%; tiêu chảy 11% / 37%; đau bụng 20% / 41%; phát ban 7% / 13%. Cả đợt bệnh: chảy máu niêm mạc nhẹ–vừa 10% / 46%. Hết sốt ngày thứ 6 (khoảng tứ phân vị 4–8). Số liệu bệnh viện."
