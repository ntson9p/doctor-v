notes_vi: "Bình Thuận 2001–2002, phòng khám tuyến cơ sở, người sốt cấp không rõ ổ (2.096 ca; 697 ca có huyết thanh kép). Dengue cấp chiếm 33,6%. Trong 234 ca dengue: đau đầu khoảng 96%, chán ăn 79%, đau cơ 60%, đau họng 42%, ho 34%, sổ mũi 19%, đau bụng 17%, nôn 12%, tiêu chảy 4%, đau khớp 13%, chảy máu tự nhiên 3%. Bệnh nhân đến sớm (trung vị 1–2 ngày sốt)."
