notes_vi: "Hay gặp từ tuần 20 của thai kỳ, đôi khi trong vài ngày hoặc vài tuần sau sinh. Dấu hiệu sớm (huyết áp cao, protein niệu) thường không tự nhận ra, phát hiện khi khám thai. Triệu chứng: đau đầu dữ dội không đỡ khi dùng thuốc giảm đau, nhìn mờ hoặc thấy chớp sáng, đau dưới bờ sườn, phù đột ngột mặt, tay hoặc chân, rất mệt, ợ nóng không đỡ khi dùng thuốc, nôn. Có triệu chứng thì liên hệ ngay cơ sở sản khoa. Yếu tố nguy cơ: đái tháo đường, tăng huyết áp, bệnh thận, bệnh tự miễn, từng bị tiền sản giật, mang thai lần đầu, từ 40 tuổi, đa thai, người thân từng bị, cách lần mang thai trước từ 10 năm, chỉ số khối cơ thể từ 35."
