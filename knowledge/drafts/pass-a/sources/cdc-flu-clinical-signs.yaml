notes_vi: "Cúm chưa biến chứng: khởi phát đột ngột với sốt, ớn lạnh, đau cơ, đau đầu, mệt, ho khan, đau họng, sổ mũi. Nhiều người, nhất là người cao tuổi và suy giảm miễn dịch, không sốt. Trẻ em có thể buồn nôn, nôn, tiêu chảy. Triệu chứng thường hết sau 3–7 ngày; ho, mệt có thể kéo dài hơn 2 tuần. Người cao tuổi có thể biểu hiện không điển hình (thay đổi tri giác, chán ăn)."
