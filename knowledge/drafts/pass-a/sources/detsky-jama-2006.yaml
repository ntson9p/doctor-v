notes_vi: "Tiêu chí POUND (đau theo nhịp mạch, kéo dài 4–72 giờ, một bên, buồn nôn, làm mất khả năng sinh hoạt): có 4/5 thì LR 24; 3/5 LR 3,5; từ 2 trở xuống LR 0,41. Dấu hiệu gợi ý tổn thương nặng trên chẩn đoán hình ảnh: kiểu đau từng chùm LR 10,7; khám thần kinh bất thường 5,3; đau đầu không xếp loại được 3,8; có aura 3,2; tăng khi gắng sức hoặc rặn 2,3; nôn 1,8."
