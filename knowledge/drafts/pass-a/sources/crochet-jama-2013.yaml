notes_vi: "14 nghiên cứu, 12 101 phụ nữ đau bụng hoặc ra máu âm đạo ở đầu thai kỳ. Mọi yếu tố bệnh sử đều có LR dương dưới 1,5 (không phân biệt được thai ngoài tử cung với các nguyên nhân khác trong nhóm đã có thai). Khám: đau khi lay cổ tử cung LR 4,9; khối phần phụ 2,4; đau phần phụ 1,9. Siêu âm đầu dò: khối phần phụ mà không thấy thai trong tử cung LR 111."
