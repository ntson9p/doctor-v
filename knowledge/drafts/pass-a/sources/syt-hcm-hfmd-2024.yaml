notes_vi: "TP.HCM năm 2023: 43.226 ca tay chân miệng (6.712 nội trú, 36.514 ngoại trú). Nhóm 1 đến dưới 3 tuổi chiếm gần một nửa số ca; dưới 1 tuổi 4%. 13.214 lượt điều trị nội trú tại bệnh viện TP.HCM (98% trẻ dưới 6 tuổi), 10,7% ca nặng. Trẻ bệnh không được đến trường đến hết thời gian lây."
