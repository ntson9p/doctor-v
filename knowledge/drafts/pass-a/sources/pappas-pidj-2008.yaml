notes_vi: "81 đợt cảm lạnh ở trẻ tuổi đi học: dấu hiệu hay gặp nhất là ho và hắt hơi; triệu chứng hay gặp nhất là nghẹt mũi, sổ mũi. Cảm giác sốt và đau đầu mỗi thứ gặp ở 15% lúc khởi phát. 73% còn triệu chứng sau 10 ngày."
