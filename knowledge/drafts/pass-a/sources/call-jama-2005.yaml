notes_vi: "Không triệu chứng nào có LR gộp trên 2 ở mọi lứa tuổi. Không sốt (LR 0,40), không ho (LR 0,42), không nghẹt mũi (LR 0,49) làm giảm khả năng cúm. Ở người từ 60 tuổi: sốt kèm ho và khởi phát cấp (LR 5,4), sốt kèm ho (LR 5,0), sốt (LR 3,8), mệt mỏi (LR 2,6), ớn lạnh (LR 2,6)."
