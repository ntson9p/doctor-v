notes_vi: "Trang ichd-3.org hiển thị tiêu chuẩn bằng JavaScript nên không đọc được; dùng bản PDF chính thức đăng trên cùng trang. Migraine không aura: cơn 4–72 giờ (dưới 18 tuổi 2–72 giờ), có 2/4 đặc điểm (một bên, theo nhịp mạch, vừa hoặc nặng, tăng khi vận động) và có buồn nôn/nôn hoặc sợ cả ánh sáng lẫn tiếng ồn. Đau đầu căng thẳng: 30 phút đến 7 ngày, có 2/4 đặc điểm (hai bên, bó chặt, nhẹ hoặc vừa, không tăng khi vận động), không buồn nôn, tối đa một trong hai: sợ ánh sáng hoặc sợ tiếng ồn."
