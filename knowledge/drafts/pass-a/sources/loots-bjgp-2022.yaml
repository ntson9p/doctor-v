notes_vi: "Hà Lan, khám tại nhà ngoài giờ, người lớn bệnh cấp nghi nhiễm khuẩn nặng (357 người, tuổi trung vị 80); 42% nhiễm khuẩn huyết. Ở nhóm nhiễm khuẩn huyết: rối loạn ý thức 54% (nhóm không: 22%), rét run 66% (60%), đái tháo đường 36% (24%), dùng thuốc ức chế miễn dịch 4% (3%); nguồn hô hấp 40%, tiết niệu 30%, ổ bụng 8%, da 7%. Nhiệt độ trung bình 39,0°C."
