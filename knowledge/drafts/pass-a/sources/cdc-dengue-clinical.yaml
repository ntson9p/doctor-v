notes_vi: "Sốt 2–7 ngày, có thể hai đợt; đau đầu nhiều, đau sau hốc mắt; đau cơ, khớp; ban; chảy máu nhẹ. Dấu hiệu cảnh báo: đau bụng, nôn kéo dài, ứ dịch, chảy máu niêm mạc, li bì, bứt rứt, gan to. Khoảng 1/4 ca nhiễm có triệu chứng; khoảng 1/20 ca bệnh tiến triển nặng."
