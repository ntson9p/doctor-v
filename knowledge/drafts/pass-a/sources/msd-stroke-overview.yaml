notes_vi: "Khoảng 80% đột quỵ là nhồi máu não, 20% là xuất huyết. Đột quỵ tuần hoàn sau (hệ đốt sống – thân nền) gây chóng mặt, rung giật nhãn cầu, nuốt khó, nhìn đôi, mù, thất điều thân hoặc chi, rối loạn ý thức. Đau đầu dữ dội đột ngột gợi ý xuất huyết dưới nhện; đau đầu, buồn nôn, nôn kèm rối loạn ý thức gợi ý tăng áp lực nội sọ. Yếu tố nguy cơ: tăng huyết áp, hút thuốc, rối loạn mỡ máu, đái tháo đường, rung nhĩ và bệnh tim gây huyết khối, uống nhiều rượu."
