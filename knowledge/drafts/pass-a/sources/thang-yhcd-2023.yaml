notes_vi: "Hồi cứu 316 sản phụ tiền sản giật nằm viện, tuổi thai từ 28 tuần, 2019–2021. Lúc đình chỉ thai: tăng huyết áp độ 1, 2, 3 lần lượt 26,9%, 36,7%, 36,4%; đau đầu đơn thuần 27,2%, đau đầu kèm rối loạn thị giác 17/316, đau đầu kèm triệu chứng khác 7/316; rối loạn thị giác đơn thuần 5,7%; đau thượng vị, nôn nhiều hoặc rối loạn khác 2,5%; khó thở 0,6%; thiểu niệu 0,3%; không phù 5,7%, phù 2 chi dưới 64,6%, phù toàn thân 29,4%; protein niệu dương tính 94,3%; tiểu cầu dưới 100 G/L 10,4%. Đây là ca nặng ở bệnh viện tuyến cuối."
