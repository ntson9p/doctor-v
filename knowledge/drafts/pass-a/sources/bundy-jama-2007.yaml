notes_vi: "Nghiên cứu bậc 1 (trẻ đau bụng chưa chọn lọc ở cấp cứu, tỷ lệ viêm ruột thừa 10%): sốt độ nhạy 0,75; nôn 0,79; tiêu chảy 0,33; tiểu buốt 0. Đau chuyển xuống hố chậu phải: độ nhạy 0,45–0,68. Thủng ruột thừa 80–100% ở trẻ dưới 4 tuổi."
