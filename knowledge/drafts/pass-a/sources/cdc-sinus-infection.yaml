notes_vi: "Triệu chứng: sổ mũi, nghẹt mũi, đau hoặc nặng mặt, đau đầu, chảy dịch xuống họng, đau họng, ho, hôi miệng. Phần lớn do vi rút. Đi khám khi: triệu chứng nặng (đau đầu, đau mặt dữ dội), nặng lên sau khi đã đỡ, kéo dài hơn 10 ngày không đỡ, sốt hơn 3–4 ngày, bị nhiều lần trong năm."
