notes_vi: "Khoảng 2/100 thai được phát hiện là thai ngoài tử cung. Phần lớn có đau vùng chậu, ra máu âm đạo hoặc cả hai; người kinh không đều có thể không biết mình có thai. Khối thai thường vỡ khoảng tuần 6–16; trước khi vỡ có thể đau đột ngột, dữ dội rồi ngất; ngất không rõ nguyên nhân ở phụ nữ tuổi sinh đẻ cần nghĩ đến thai ngoài tử cung. Yếu tố nguy cơ: từng bị thai ngoài tử cung, từng mổ vòi trứng hoặc vùng chậu, viêm vùng chậu, hút thuốc, hỗ trợ sinh sản. Khoảng 53% thai ở người đang đặt vòng tránh thai là thai ngoài tử cung."
