notes_vi: "Sổ đăng ký can thiệp mạch vành ở Việt Nam: 1168 người (82,2% hội chứng mạch vành cấp), tuổi trung bình 64,1, nữ 31,2%. Tăng huyết áp 73,1%, đái tháo đường týp 2 37,2%, đang hút thuốc 27,3% (từng hút 53,5%), từng nhồi máu cơ tim 10,2%, từng can thiệp mạch vành 10,2%, từng suy tim 8,4%. Lý do vào viện: đau ngực 83,5%, khó thở 7,4%."
