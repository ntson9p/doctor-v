notes_vi: "LR dương phân biệt migraine với đau đầu căng thẳng: buồn nôn 19,2; sợ ánh sáng 5,8; sợ tiếng ồn 5,2; tăng khi vận động 3,7; khởi phát do thức ăn 3,6. Các yếu tố khởi phát khác gặp như nhau ở hai loại. Aura thị giác có ở 84% người migraine có aura."
