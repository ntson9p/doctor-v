notes_vi: "1.152 người 10–70 tuổi có hội chứng giống cúm ở phòng khám ban đầu TP.HCM: 40,6% nhiễm cúm (A 27,9%, B 11,8%); 27,8% ca âm tính với cúm có vi rút hô hấp khác (hay gặp nhất rhinovirus). Cúm A: sốt 92%, đau đầu 93%, sổ mũi 86%, ho 95%, đau họng 89%, đau cơ 91%, triệu chứng tiêu hóa 7%, mệt 97%; nhiệt độ trung vị 38,5°C. Ca âm tính với cúm: sổ mũi 70%, ho 86%, đau họng 86%, đau đầu 91%, đau cơ 91%. Cúm có quanh năm ở phía Nam, nhiều đỉnh không cố định. 53% đã dùng kháng sinh trước khi đến khám."
