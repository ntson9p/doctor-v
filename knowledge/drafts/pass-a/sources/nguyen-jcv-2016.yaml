notes_vi: "Đoàn hệ hộ gia đình ở Hà Nam (miền Bắc), 2008–2013. Hội chứng giống cúm: sốt từ 38°C kèm ho hoặc đau họng. Rhinovirus 28% số mẫu, cúm 17%, coronavirus 8%, enterovirus 5%. Cúm chiếm 24% ca ở người dưới 18 tuổi, 13% ở người lớn hơn. 78% đợt cúm xảy ra vào mùa đông–xuân; rhinovirus chủ yếu hè–thu."
