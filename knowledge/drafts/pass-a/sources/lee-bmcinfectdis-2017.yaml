notes_vi: "Số liệu giám sát 1994–2013. Tỷ suất mắc trung bình mỗi tháng (trên 100.000 dân): Hà Nội 3,4; TP.HCM 10,3; An Giang 15,4; Khánh Hòa 23,5. Cả 4 tỉnh tăng vào nửa cuối năm, thấp nhất khoảng tháng 2–4. Hà Nội mùa vụ rất rõ: tháng 10 cao gấp khoảng 55 lần tháng 2."
