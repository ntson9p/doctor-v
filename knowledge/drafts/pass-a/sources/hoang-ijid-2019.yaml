notes_vi: "1.547 trẻ ở 3 bệnh viện TP.HCM (590 ngoại trú, 957 nội trú), tuổi trung vị 21 tháng. Ngoại trú: sốt 63,9%, ban da 91,7% (chủ yếu dát 39,7%, cả dát và phỏng nước 51,8%, chủ yếu phỏng nước 8,5%), tổn thương miệng 85,8%, nôn 24,6%, tiêu chảy 5,6%, giật mình 10,8%, quấy khóc 24,6%, ngủ gà 1,5%, ho 35,1%, sổ mũi 36,3%, đau đầu 5,5%, viêm kết mạc 2%; nhiệt độ trung vị 37,0°C; đến khám trung vị ngày 1,2 của bệnh. Theo phân độ của Bộ Y tế, từ độ 2A cần nhập viện; sốt trên 48 giờ là một tiêu chí nhập viện."
