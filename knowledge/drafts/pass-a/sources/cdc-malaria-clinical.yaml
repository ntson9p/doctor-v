notes_vi: "Triệu chứng: sốt, ớn lạnh, vã mồ hôi, đau đầu, buồn nôn và nôn, đau nhức người, mệt mỏi (không nêu tần suất). Ủ bệnh thường 7–30 ngày; P. vivax, P. ovale có thể phát bệnh nhiều tháng sau khi bị muỗi đốt."
