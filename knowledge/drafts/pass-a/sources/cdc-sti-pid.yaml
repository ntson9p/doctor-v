notes_vi: "Văn bản của chính phủ Mỹ (public domain). Điều trị theo kinh nghiệm khi phụ nữ có nguy cơ bị đau vùng chậu hoặc bụng dưới không rõ nguyên nhân khác, kèm đau khi lay cổ tử cung, đau tử cung hoặc đau phần phụ. Tiêu chí bổ sung: nhiệt độ miệng trên 38,3°C, khí hư mủ cổ tử cung. Nhiều người chỉ có triệu chứng kín đáo (ra máu bất thường, đau khi giao hợp, khí hư) nên hay bị bỏ sót. Bắt đầu điều trị ngay khi nghĩ tới bệnh. Nhập viện khi không loại trừ được bệnh cần mổ (như viêm ruột thừa), áp xe vòi trứng – buồng trứng, có thai, bệnh nặng, nôn, sốt trên 38,5°C. Biến chứng lâu dài: vô sinh do vòi trứng, thai ngoài tử cung. Bạn tình cũng cần được điều trị."
