notes_vi: "Đau rát hoặc cồn cào, thường đỡ khi ăn (loét tá tràng), có khi ăn vào lại đau (loét dạ dày); chỉ khoảng một nửa có kiểu triệu chứng điển hình. Thuốc chống viêm không steroid gây trên 50% ca loét (Mỹ). Biến chứng: chảy máu, thủng, hẹp môn vị."
