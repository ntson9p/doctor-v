notes_vi: "341 nữ sinh viên điều dưỡng 19–24 tuổi, Trường Đại học Y Hà Nội (01/2024). Đau bụng kinh nguyên phát 78,6% (bảng khác ghi 81,8%). Trong 268 người: đau nhẹ 30,6%, vừa 50,7%, nặng 18,7%; kéo dài vài giờ 21,3%, 1 ngày 42,2%, từ 2 ngày 33,2%; bắt đầu ngày đầu hành kinh 69,8%, trước 1 ngày 20,1%, trước từ 2 ngày 6,0%; đau bụng dưới 97,0%, đau thắt lưng 67,8%; mệt 60,3%, tiêu chảy 13,1%, đau đầu 12,7%, buồn nôn 12,0%, mất ngủ 11,2%, chóng mặt 10,5%; 50% không dùng biện pháp giảm đau nào."
