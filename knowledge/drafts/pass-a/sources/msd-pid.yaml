notes_vi: "Hay biểu hiện sốt, đau vùng chậu hoặc bụng dưới, khí hư, ra máu bất thường; ít gặp hơn: đau khi giao hợp, tiểu buốt, đau bụng trên, buồn nôn, nôn. Nhiều người không có hoặc chỉ có triệu chứng nhẹ. Áp xe vòi trứng – buồng trứng gặp ở khoảng 15% người viêm vòi trứng. Viêm quanh gan gây đau hạ sườn phải. Yếu tố nguy cơ: dưới 25 tuổi, quan hệ lần đầu trước 15 tuổi, bạn tình mới trong 12 tháng hoặc nhiều bạn tình."
