notes_vi: "Giai đoạn tiền triệu: sốt (có thể tới 40,5°C), mệt, ho, sổ mũi, đỏ mắt; hạt Koplik; sau đó ban dát sẩn lan từ đầu xuống thân rồi chân. Biến chứng thường gặp: viêm tai giữa, viêm phế quản phổi, viêm thanh khí quản, tiêu chảy. Nhóm nguy cơ cao: trẻ dưới 5 tuổi, người lớn trên 20 tuổi, phụ nữ có thai, suy giảm miễn dịch."
