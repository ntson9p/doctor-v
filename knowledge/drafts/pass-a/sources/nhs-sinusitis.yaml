notes_vi: "Hay gặp sau cảm lạnh hoặc cúm. Triệu chứng chính: đau, sưng, ấn đau quanh má, mắt, trán; nghẹt hoặc sổ mũi; giảm ngửi; nước mũi xanh hoặc vàng; sốt. Triệu chứng khác: đau đầu, đau răng, hôi miệng, ho, nặng tai. Thường tự hết trong 4 tuần. Tự chăm sóc: nghỉ ngơi, uống nhiều nước, rửa mũi nước muối, không hút thuốc."
