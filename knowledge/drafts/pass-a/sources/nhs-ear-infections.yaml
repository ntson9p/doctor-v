notes_vi: "Triệu chứng: đau tai, sốt, nghe kém, chảy dịch tai, cảm giác đầy tai. Trẻ nhỏ có thể dụi, kéo tai, quấy khóc, bỏ ăn. Thường đỡ trong 3 ngày, có khi tới 1 tuần. Đi khám nếu trẻ dưới 12 tháng hoặc không đỡ sau 3 ngày. Cần khám gấp nếu rất mệt, sốt rất cao, sưng quanh tai, chảy dịch tai, nôn, trẻ dưới 12 tháng đau cả hai tai, có bệnh nền."
