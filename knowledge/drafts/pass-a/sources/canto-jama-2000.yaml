notes_vi: "Sổ đăng ký 434 877 ca nhồi máu cơ tim ở Mỹ: 33% không đau ngực khi đến viện. So với nhóm đau ngực, nhóm này lớn tuổi hơn (74,2 so với 66,9), nhiều nữ hơn (49,0% so với 38,0%), nhiều người đái tháo đường hơn (32,6% so với 25,4%), từng suy tim nhiều hơn (26,4% so với 12,3%), đến viện muộn hơn (7,9 so với 5,3 giờ), tử vong trong viện cao hơn (23,3% so với 9,3%)."
