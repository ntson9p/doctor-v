notes_vi: "Ở người nhồi máu não, 14,1% không có triệu chứng FAST (méo mặt, yếu tay, nói khó) khi đến viện; trong số này 42% mất thăng bằng khi đi hoặc yếu chân, 40% có triệu chứng thị giác, 70% có ít nhất một trong hai. Thêm hai nhóm triệu chứng này (BE-FAST) giảm tỷ lệ bỏ sót còn 4,4%."
