notes_vi: "Hà Lan, 696 đợt viêm màng não vi khuẩn mắc phải ở cộng đồng (người lớn, có cấy dịch não tủy). Bộ ba sốt, cứng gáy, rối loạn ý thức chỉ có ở 44%; 95% có ít nhất 2 trong 4 dấu hiệu: đau đầu, sốt, cứng gáy, rối loạn ý thức. Lúc vào viện 14% hôn mê, 33% có dấu hiệu thần kinh khu trú."
