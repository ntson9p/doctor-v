notes_vi: "Triệu chứng chính: nghẹt hoặc sổ mũi, hắt hơi, đau họng, khàn tiếng, ho, mệt; có thể sốt. Triệu chứng xuất hiện từ từ trong 2–3 ngày. Người lớn thường đỡ sau 1–2 tuần, trẻ nhỏ lâu hơn. Đi khám nếu sốt cao hơn 3 ngày, không đỡ sau 10 ngày, khó thở, đau ngực, ho hơn 3 tuần, có bệnh nền. Không dùng aspirin cho trẻ dưới 16 tuổi; kháng sinh không được khuyên dùng."
