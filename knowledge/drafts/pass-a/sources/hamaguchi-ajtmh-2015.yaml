notes_vi: "Bệnh viện Bạch Mai 2001–2003, người từ 15 tuổi nằm viện vì sốt không rõ ổ (bệnh viện tuyến cuối, nhiều ca sốt kéo dài). Sốt mò (237 ca): vết loét 63%, nổi hạch 64%, rét run 82%, đau đầu 70%, đau cơ 68%, ho 44%, khó thở 14%, phát ban 31%, phù 28%, rối loạn ý thức 10%, sốt hơn 7 ngày 76%, mùa mưa (tháng 5–10) 75%, nghề tiếp xúc thiên nhiên 61%. Nhóm không phải sốt mò, sốt chuột: vết loét 5%."
