notes_vi: "Trẻ em, 10 nghiên cứu tiến cứu. Tiền sử: thóp phồng LR 8,0; cứng gáy LR 7,7; co giật ngoài tuổi co giật do sốt LR 4,4; bú, ăn kém LR 2,0. Khám: vàng da LR 5,9; vẻ nhiễm độc LR 5,8; dấu hiệu màng não LR 4,5; sốt trên 40°C LR 2,9. Không sốt không loại trừ được (LR 0,70)."
