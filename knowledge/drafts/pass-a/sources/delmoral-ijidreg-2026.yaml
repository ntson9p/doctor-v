notes_vi: "609 ca sởi xác định đến khám tại một bệnh viện tuyến cuối ở Jalisco (2025–2026), 423 ca không nhập viện. Ở ca không nhập viện: sốt 100%, ho 95,7%, chảy mũi 81,5%, viêm kết mạc 67,1%, ban 98,3%, hạt Koplik 55,3%, có tiếp xúc ca bệnh 22,7%. Toàn mẫu: 80,3% đủ tuổi nhưng chưa tiêm, 9,5% dưới 1 tuổi, 10,2% có ghi nhận ít nhất 1 mũi; đến khám trung vị ngày 4 từ khi khởi bệnh."
