id: preeclampsia
names:
  vi: "Tiền sản giật"
  vi_common: ["Tiền sản giật", "Nhiễm độc thai nghén"]
  en: "Preeclampsia"
codes:
  icd10: "O14"
  icd10_verified: true
  mondo: "MONDO:0005081"
summary_vi:
  - "Tăng huyết áp xuất hiện từ tuần 20 của thai kỳ hoặc sau sinh, kèm tổn thương thận, gan hoặc cơ quan khác."
  - "Nhiều người không thấy triệu chứng; khi nặng có thể đau đầu, nhìn mờ, đau vùng trên rốn."
  - "Bệnh có thể gây co giật (sản giật), đột quỵ, nguy hiểm cho cả mẹ và thai."
urgency: 2
cant_miss: true
specialties: [obstetrics_gynecology, emergency]
applicability:
  sex: [female]
  age_groups: [teen_13_17, adult_18_44, adult_45_64]
  reason_vi: "Chỉ gặp ở phụ nữ đang mang thai hoặc vừa sinh con."
priors:
  - complaint: headache
    default: P4
    by_age: { teen_13_17: P5, adult_45_64: P6 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015, thang-yhcd-2023]
      note: "Tính trong số phụ nữ cùng nhóm tuổi đau đầu, kể cả người không có thai. Tiền sản giật gặp ở 2–8% thai phụ (315/QĐ-BYT); khoảng một phần ba ca nằm viện có đau đầu (Thăng 2023). Chỉ vài phần trăm phụ nữ 18–44 tuổi đau đầu đang mang thai từ 20 tuần hoặc vừa sinh, nên ước khoảng 0,5% (P4). Kết hợp với câu hỏi có thai và tuổi thai, khả năng ở thai phụ từ 20 tuần đau đầu tăng lên khoảng 10–15%. Tuổi 13–17 ít có thai (P5); 45–64 tuổi rất hiếm có thai (P6)."
  - complaint: abdominal_pain
    default: P5
    by_age: { teen_13_17: P6, adult_45_64: P6 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015, nhs-pre-eclampsia, thang-yhcd-2023]
      note: "Đau vùng thượng vị hoặc hạ sườn phải là dấu hiệu tiền sản giật nặng (315/QĐ-BYT; NHS: đau dưới bờ sườn), nhưng ít gặp (đau thượng vị, nôn nhiều hoặc rối loạn khác chỉ 2,5% ca nằm viện theo Thăng 2023). Trong phụ nữ đau bụng nói chung, ước dưới 0,2% (P5)."
findings:
  - finding: pregnant
    freq: very_frequent
    evidence:
      tier: B
      basis: judgment
      sources: [nhs-pre-eclampsia, ihs-ichd3-2018, byt-qd-315-2015]
      note: "Bệnh chỉ có khi đang mang thai từ tuần 20 hoặc trong vài tuần sau sinh (NHS; ICHD-3 mục 10.3.4 tính tới 4 tuần sau sinh). Người sau sinh sẽ trả lời 'không có thai', nên chọn very_frequent (giả định khoảng 1/5 ca có triệu chứng xảy ra sau sinh) thay vì almost_always."
  - finding: gestational_age
    dist: { lt_20w: 0.03, ge_20w: 0.97 }
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-315-2015, nhs-pre-eclampsia]
      note: "Phân bố trong số người đang có thai. Tiêu chuẩn chẩn đoán là huyết áp từ 140/90 sau tuần 20 (315/QĐ-BYT); NHS ghi hay gặp từ tuần 20 nhưng có thể xảy ra bất kỳ lúc nào."
  - finding: recent_childbirth
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-pre-eclampsia, ihs-ichd3-2018]
      note: "Tiền sản giật có thể xuất hiện trong vài ngày hoặc vài tuần sau sinh (NHS). Ước khoảng 1/5 ca có triệu chứng là sau sinh; chưa có nguồn đã mở cho tỷ lệ này. Vì danh mục hỏi 'vừa sinh con' độc lập với 'có thai', mô hình chưa thể hiện được quan hệ 'hoặc' giữa hai dấu hiệu (xem ghi chú review)."
  - finding: bp_measured
    dist: { normal: 0.10, high: 0.45, very_high: 0.28, extreme: 0.17 }
    evidence:
      tier: B
      basis: numeric
      sources: [thang-yhcd-2023, byt-qd-315-2015]
      reported: "tăng huyết áp độ 1: 26,9%; độ 2: 36,7%; độ 3: 36,4%"
      population: "316 sản phụ tiền sản giật nằm viện tuyến cuối, lúc đình chỉ thai"
      note: "Theo định nghĩa huyết áp từ 140/90 (315/QĐ-BYT). Ca nằm viện là ca nặng nên dịch phân bố về mức thấp hơn cho cộng đồng; giữ 10% 'dưới 140/90' vì số đo gần nhất có thể đo trước khi bệnh khởi phát."
  - finding: headache
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [thang-yhcd-2023, byt-qd-315-2015]
      reported: "đau đầu khoảng 35% (đơn thuần 27,2%, kèm rối loạn thị giác 17/316, kèm triệu chứng khác 7/316)"
      population: "316 sản phụ tiền sản giật nằm viện, Bệnh viện Phụ sản Trung ương"
      note: "Chỉ có tác dụng khi triệu chứng chính là đau bụng."
  - finding: headache_location
    dist: { one_side: 0.10, both_sides: 0.30, forehead_face: 0.20, back_neck: 0.15, whole_head: 0.25 }
    evidence:
      tier: B
      basis: verbal
      sources: [ihs-ichd3-2018]
      note: "ICHD-3 (10.3.4): đau đầu do tiền sản giật thường hai bên. Chia theo lựa chọn là ước lượng."
  - finding: headache_character
    dist: { throbbing: 0.65, pressing: 0.35 }
    evidence:
      tier: B
      basis: verbal
      sources: [ihs-ichd3-2018]
      note: "ICHD-3 (10.3.4): thường đau theo nhịp mạch. Tỷ lệ là ước lượng."
  - finding: headache_severity
    dist: { mild: 0.10, moderate: 0.40, severe: 0.50 }
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-pre-eclampsia, byt-qd-315-2015]
      note: "NHS mô tả đau đầu dữ dội, không đỡ khi dùng thuốc giảm đau; 315/QĐ-BYT xếp nhức đầu vào tiêu chuẩn tiền sản giật nặng. Phân bố là ước lượng."
  - finding: headache_worse_activity
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [ihs-ichd3-2018]
      note: "Tăng khi vận động là một trong ba đặc điểm của tiêu chuẩn C3 (ICHD-3 mục 10.3.4); không có tỷ lệ."
  - finding: headache_course
    dist: { first_time: 0.70, recurrent_similar: 0.20, progressive: 0.10 }
    evidence:
      tier: C
      basis: judgment
      sources: [ihs-ichd3-2018]
      note: "Đau đầu mới xuất hiện cùng lúc với bệnh (ICHD-3 mục 10.3.4, tiêu chuẩn C1). Một phần thai phụ có sẵn đau đầu từ trước nên có thể trả lời 'đã bị nhiều lần'. Phân bố là ước lượng."
  - finding: blurred_vision
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [thang-yhcd-2023, byt-qd-315-2015, nhs-pre-eclampsia]
      reported: "rối loạn thị giác khoảng 11% (đơn thuần 5,7% và kèm đau đầu 17/316)"
      population: "316 sản phụ tiền sản giật nằm viện"
      note: "Nhìn mờ là tiêu chuẩn tiền sản giật nặng (315/QĐ-BYT); NHS mô tả nhìn mờ hoặc thấy chớp sáng."
  - finding: edema_face_hands
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [thang-yhcd-2023, nhs-pre-eclampsia]
      reported: "phù toàn thân 29,4%, phù 2 chi dưới 64,6%, không phù 5,7%"
      population: "316 sản phụ tiền sản giật nằm viện"
      note: "Câu hỏi chỉ hỏi phù mặt hoặc tay, tương ứng nhóm phù toàn thân. Phù cũng hay gặp ở thai bình thường, trong khi tỷ lệ nền của danh mục chỉ 5%, nên không nâng lên frequent."
  - finding: abdominal_pain
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015, nhs-pre-eclampsia, thang-yhcd-2023]
      reported: "đau thượng vị, nôn nhiều hoặc rối loạn khác 2,5%"
      note: "Số liệu nằm viện chỉ 2,5%, nhưng đau thượng vị hoặc hạ sườn phải là dấu hiệu nặng (hội chứng HELLP) cần nhận ra; chọn occasional để câu trả lời 'có' làm tăng chứ không giảm khả năng bệnh. Chỉ có tác dụng khi triệu chứng chính là đau đầu."
  - finding: abd_pain_location
    dist: { epigastric: 0.50, right_upper: 0.32, left_upper: 0.03, periumbilical: 0.04, right_lower: 0.02, left_lower: 0.02, suprapubic: 0.02, whole: 0.05 }
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-315-2015, nhs-pre-eclampsia]
      note: "Đau vùng thượng vị hoặc hạ sườn phải (315/QĐ-BYT); đau dưới bờ sườn (NHS). Chia theo lựa chọn là ước lượng."
  - finding: vomiting
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-pre-eclampsia, thang-yhcd-2023]
      note: "NHS liệt kê nôn trong các triệu chứng cần báo ngay; ở ca nằm viện, nôn nhiều được gộp trong nhóm 2,5%. Chọn occasional."
  - finding: heartburn
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-pre-eclampsia]
      note: "NHS: ợ nóng không đỡ khi dùng thuốc là một triệu chứng của tiền sản giật. Không có tỷ lệ."
  - finding: seizure_recent
    freq: rare
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-315-2015]
      note: "Co giật là sản giật, biến chứng của tiền sản giật, có thể xảy ra trước, trong chuyển dạ hoặc sau sinh (315/QĐ-BYT). Liên kết mức rare để câu trả lời 'có' ở thai phụ làm tăng khả năng bệnh; xử trí do quy tắc co giật đảm nhận."
  - finding: hypertension_known
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-pre-eclampsia]
      note: "Tăng huyết áp có từ trước là yếu tố nguy cơ (NHS). Chưa có tỷ lệ; tỷ lệ nền của danh mục (15%) cao hơn nhiều so với phụ nữ tuổi sinh đẻ nên tác dụng của liên kết này nhỏ."
warning_signs: [seizure_recent, blurred_vision, vision_loss_or_double, confusion, breathing_difficulty, abd_pain_severe, persistent_vomiting]
self_care_vi:
  - "Nếu có máy đo huyết áp tại nhà, đo và mang theo kết quả khi đi khám."
see_doctor_vi:
  - "Đến ngay cơ sở sản khoa hoặc bệnh viện gần nhất để đo huyết áp và thử nước tiểu."
  - "Gọi 115 nếu co giật, khó thở, lơ mơ hoặc nhìn mờ nặng."
  - "Trong 6 tuần sau sinh, đau đầu nặng hoặc nhìn mờ cũng cần đi khám ngay."
review:
  status: draft
  authors: ["agent:pass-a"]
  updated: "2026-10-24"
  notes_vi: "Giữ urgency 2, cant_miss true. 315/QĐ-BYT cho phép điều trị ngoại trú tiền sản giật nhẹ, nhưng xếp nhức đầu, nhìn mờ, đau thượng vị hoặc hạ sườn phải vào tiêu chuẩn tiền sản giật nặng. Hai triệu chứng chính của đợt thử nghiệm (đau đầu, đau bụng) vì vậy ứng với thể nặng, có nguy cơ sản giật, hội chứng HELLP, đột quỵ trong vài giờ đến vài ngày; quy tắc rf_pregnancy_hypertension_signs cũng ở mức 2. Điểm chưa chắc chắn: (1) mô hình tính 'có thai' và 'vừa sinh con' độc lập nên ca sau sinh bị ước thấp (khả năng chỉ tăng khoảng 4 lần); đề xuất cho 'recent_childbirth' điều kiện requires 'pregnant' là absent, khi đó tần suất có điều kiện sẽ gần almost_always; (2) số liệu triệu chứng Việt Nam lấy từ ca nặng nằm viện tuyến cuối; (3) chưa có nguồn đã mở về tỷ lệ tiền sản giật sau sinh và tỷ lệ đau đầu trong thai phụ đến khám ban đầu; (4) danh mục thiếu các yếu tố nguy cơ chính (mang thai lần đầu, đa thai, từng bị tiền sản giật) nhưng chúng không đủ quan trọng để đề xuất dấu hiệu mới; (5) tỷ lệ nền phù mặt, tay (5%) thấp hơn thực tế ở thai phụ."
