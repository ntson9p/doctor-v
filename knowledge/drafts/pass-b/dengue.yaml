self_care_vi:
  - "Nghỉ ngơi, uống nhiều nước như oresol, nước trái cây, nước cháo loãng có chút muối."
  - "Hạ sốt bằng cách nới lỏng quần áo, lau người bằng nước ấm."
  - "Khi nghi sốt xuất huyết, không tự dùng aspirin hoặc ibuprofen vì dễ gây chảy máu."
  - "Hỏi bác sĩ hoặc dược sĩ trước khi dùng bất kỳ thuốc hạ sốt nào."
  - "Tránh đồ ăn, uống màu đỏ hoặc nâu để dễ nhận ra nếu nôn ra máu."
see_doctor_vi:
  - "Đi khám trong 24 giờ để được xét nghiệm máu và hẹn khám lại hằng ngày."
  - "Ngày thứ 3–7 của bệnh cần theo dõi sát, kể cả khi đã hết sốt."
  - "Đến cơ sở cấp cứu ngay nếu đau bụng nhiều, nôn nhiều, chảy máu, tay chân lạnh, li bì hoặc tiểu ít."
review:
  status: draft
  authors: ["agent:pass-b"]
  updated: "2026-10-24"
  notes_vi: "Mức xử trí 3, không thuộc nhóm không được bỏ sót: giữ như gợi ý vì 2760 (mục IV.A) cho phần lớn ca điều trị ngoại trú, khám và xét nghiệm lại hằng ngày; dấu hiệu cảnh báo và sốc do các quy tắc mức 2 xử lý. Điểm chưa chắc: (1) prior cả nước P2 dựa trên một nghiên cứu ở Bình Thuận 2001–2002 và một nghiên cứu ở Singapore, chưa có số liệu theo tuổi ở Việt Nam; (2) hệ số mùa lấy từ 4 tỉnh 1994–2013, chưa có số liệu Tây Nguyên và Bắc Trung Bộ nên không đặt hệ số cho các nơi này; (3) đau khớp, đau cơ: hai nguồn lệch nhau, và tỷ lệ nền trong danh mục (đau khớp 5%, đau cơ 20%) thấp hơn nhiều so với thực tế ở người sốt (Phuong 2006: khoảng 15% và 59%), nên đã chọn mức thấp; đề nghị người bảo trì xem lại leak_by_complaint cho triệu chứng chính 'sốt'; (4) chảy máu chân răng, mũi: số liệu ngày 1–3 chỉ 3–5%, đã nâng lên occasional vì người dùng thường kiểm tra muộn hơn; (5) chưa có số liệu cho câu hỏi 'gần nhà có người bị sốt xuất huyết'. Lưu ý cho bộ suy luận: warning_signs của bệnh mức 3 hiện không được đưa vào danh sách 'Đi cấp cứu ngay nếu…' (packages/engine/src/result.ts chỉ lấy bệnh mức 1–2); dấu hiệu cảnh báo sốt xuất huyết nên được cân nhắc hiển thị. Không tra được icd.kcb.vn (giao diện cần JavaScript) nên icd10_verified: false."
