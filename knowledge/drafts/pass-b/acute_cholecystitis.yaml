id: acute_cholecystitis
names:
  vi: "Viêm túi mật cấp tính"
  vi_common: ["Viêm túi mật"]
  en: "Acute cholecystitis"
codes:
  icd10: "K81.0"
  icd10_verified: true
  mondo: "MONDO:0043994"
summary_vi:
  - "Túi mật bị viêm cấp, phần lớn do sỏi mật."
  - "Thường đau liên tục dưới sườn phải, có thể lan lên vai phải, kèm sốt, buồn nôn."
  - "Cần điều trị trong bệnh viện để tránh hoại tử, thủng túi mật."
urgency: 2
cant_miss: false
specialties: [general_surgery, gastroenterology]
priors:
  - complaint: abdominal_pain
    default: P3
    by_age: { infant_0_2m: P6, child_2m_5y: P6, child_5_12: P6, teen_13_17: P5, adult_18_44: P4 }
    evidence:
      tier: A
      basis: numeric
      sources: [viniol-fampract-2014, msd-acute-cholecystitis, nhs-acute-cholecystitis]
      reported: "Chăm sóc ban đầu: bệnh mật – tụy chiếm 4,0% người đến khám vì đau bụng"
      population: "Người lớn ở chăm sóc ban đầu (Viniol 2014)"
      note: "4,0% gồm cả cơn đau quặn mật, viêm đường mật và viêm tụy; người soạn ước viêm túi mật cấp khoảng 1–2% ở người từ 45 tuổi (P3) và thấp hơn ở 18–44 tuổi (P4), vì sỏi mật tăng theo tuổi. Rất hiếm ở trẻ em. Chưa có số liệu Việt Nam; ở Việt Nam sỏi đường mật trong gan và giun chui ống mật từng phổ biến hơn phương Tây."
  - complaint: fever
    default: P5
    by_age: { infant_0_2m: P6, child_2m_5y: P6, child_5_12: P6, teen_13_17: P6, elder_65_74: P4, elder_75p: P4 }
    evidence:
      tier: C
      basis: judgment
      sources: [msd-acute-cholecystitis, jain-2017-cholecystitis-dta]
      note: "Sốt gặp ở 31–62% (Jain 2017) nhưng đau dưới sườn phải thường nổi bật hơn, nên ít người chọn sốt làm triệu chứng chính (P5). Người già có thể đau ít, sốt hoặc biểu hiện toàn thân là chính (MSD), nên từ 65 tuổi ước P4."
findings:
  - finding: abd_pain_location
    dist: { epigastric: 0.20, right_upper: 0.62, left_upper: 0.02, periumbilical: 0.04, right_lower: 0.04, left_lower: 0.01, suprapubic: 0.01, whole: 0.06 }
    evidence:
      tier: A
      basis: numeric
      sources: [jain-2017-cholecystitis-dta, msd-acute-cholecystitis, nhs-acute-cholecystitis]
      reported: "Đau hạ sườn phải: độ nhạy 56–93%"
      note: "Một phần người bệnh tả đau ở vùng trên rốn. Tỷ lệ là ước lượng dựa trên độ nhạy trên."
  - finding: abd_pain_radiates_right_shoulder
    freq: frequent
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-acute-cholecystitis, msd-acute-cholecystitis]
      locator: "NHS: đau lan về phía vai phải; MSD: có thể lan ra bả vai phải hoặc lưng"
      note: "NHS mô tả như đặc điểm điển hình, MSD ghi 'có thể'; chọn frequent. Có tương quan với câu 'đau lan ra sau lưng', nên câu đó chỉ để mức occasional."
  - finding: abd_pain_radiates_back
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [msd-acute-cholecystitis]
      locator: "MSD: đau có thể lan ra lưng trên"
      note: "Để mức thấp vì phần lớn thông tin đã nằm trong câu 'đau lan lên vai phải hoặc sau lưng bên phải'."
  - finding: abd_pain_duration
    dist: { lt_6h: 0.10, h6_24: 0.35, d1_3: 0.38, d4_14: 0.14, gt_2w: 0.03 }
    evidence:
      tier: C
      basis: verbal
      sources: [msd-acute-cholecystitis, nhs-acute-cholecystitis]
      locator: "MSD: đau kéo dài trên 6 giờ; NHS: đau dai dẳng, không hết sau vài giờ"
      note: "Đau dưới 6 giờ hợp với cơn đau quặn mật hơn. Phân bố là ước lượng."
  - finding: abd_pain_onset
    dist: { sudden: 0.50, gradual: 0.50 }
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-acute-cholecystitis, msd-acute-cholecystitis]
      locator: "NHS: đau đột ngột, dữ dội; MSD: đạt đỉnh trong 15–60 phút"
      note: "Tỷ lệ là ước lượng."
  - finding: fever
    freq: frequent
    evidence:
      tier: A
      basis: numeric
      sources: [jain-2017-cholecystitis-dta, msd-acute-cholecystitis]
      reported: "Sốt: độ nhạy 31–62% (khoa cấp cứu)"
      note: "MSD: sốt thường nhẹ, có khi không sốt, nhất là người già."
  - finding: fever_max_temp
    dist: { lt_38: 0.45, t38_39: 0.42, ge_39: 0.13 }
    evidence:
      tier: C
      basis: verbal
      sources: [msd-acute-cholecystitis]
      locator: "MSD: sốt thường nhẹ"
      note: "Phân bố trong số người đã có sốt; sốt cao kèm rét run, vàng da gợi ý viêm đường mật. Tỷ lệ là ước lượng."
  - finding: fever_duration
    dist: { d1_2: 0.65, d3_5: 0.28, d6_7: 0.05, gt_7d: 0.02 }
    evidence:
      tier: C
      basis: judgment
      sources: [msd-acute-cholecystitis]
      note: "Bệnh cấp, thường đi khám trong vài ngày đầu. Phân bố là ước lượng."
  - finding: nausea
    freq: frequent
    evidence:
      tier: C
      basis: verbal
      sources: [msd-acute-cholecystitis, nhs-acute-cholecystitis]
      locator: "MSD: đôi khi kèm buồn nôn, nôn; nôn thường gặp"
      note: "Hai cách mô tả khác nhau trong cùng nguồn; chọn mức giữa (frequent)."
  - finding: vomiting
    freq: frequent
    evidence:
      tier: C
      basis: verbal
      sources: [msd-acute-cholecystitis, nhs-acute-cholecystitis]
      locator: "MSD: nôn thường gặp; NHS: buồn nôn, nôn"
  - finding: jaundice
    freq: occasional
    evidence:
      tier: A
      basis: numeric
      sources: [jain-2017-cholecystitis-dta, msd-acute-cholecystitis]
      reported: "Vàng da: độ nhạy 11–14%"
      note: "MSD: vàng da kèm viêm túi mật gợi ý tắc một phần ống mật chủ."
  - finding: gallstones_known
    freq: frequent
    evidence:
      tier: C
      basis: judgment
      sources: [msd-acute-cholecystitis, nhs-acute-cholecystitis]
      locator: "MSD: từ 90% có sỏi túi mật; phần lớn đã từng có cơn đau quặn mật"
      note: "Gần như ai cũng có sỏi, nhưng không phải ai cũng đã được nói là có sỏi. Siêu âm bụng phổ biến ở Việt Nam nên ước khoảng một nửa người bệnh đã biết mình có sỏi mật. Cần bác sĩ duyệt."
  - finding: pain_after_fatty_meal
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [msd-acute-cholecystitis]
      note: "Cơn đau mật hay xuất hiện sau bữa ăn nặng, nhiều mỡ, nhưng dấu hiệu này kém đặc hiệu. Ước 20%, cao hơn tỷ lệ nền 5%."
  - finding: abd_pain_worse_movement
    freq: occasional
    evidence:
      tier: A
      basis: judgment
      sources: [jain-2017-cholecystitis-dta, msd-acute-cholecystitis]
      locator: "Jain 2017: dấu Murphy (đau tăng khi hít sâu lúc ấn hạ sườn phải) độ nhạy 62%"
      note: "Dấu Murphy là dấu hiệu khi khám, không trùng với câu hỏi về đau tăng khi đi lại, ho, xe xóc; ước 20%."
  - finding: abd_pain_severe
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [msd-acute-cholecystitis, nhs-acute-cholecystitis]
      note: "Đau nặng hơn cơn đau quặn mật (MSD), NHS mô tả đau dữ dội; nhưng 'không chịu nổi' là ngưỡng cao. Ước 20–30%."
  - finding: abdominal_pain
    freq: almost_always
    evidence:
      tier: C
      basis: verbal
      sources: [msd-acute-cholecystitis, nhs-acute-cholecystitis]
      note: "Dùng khi triệu chứng chính là sốt. Người già có thể đau ít (MSD)."
warning_signs:
  - abd_pain_severe
  - jaundice
  - chills_rigors
  - abdomen_hard_swollen
  - confusion
  - persistent_vomiting
see_doctor_vi:
  - "Đến cơ sở cấp cứu ngay khi đau dưới sườn phải kéo dài hơn vài giờ, nhất là kèm sốt."
  - "Vàng da, vàng mắt kèm sốt hoặc rét run cần đi cấp cứu ngay."
review:
  status: draft
  authors: ["agent:pass-b"]
  updated: "2026-10-25"
  notes_vi: "Giữ mức xử trí 2 như gợi ý vì ca điển hình cần nhập viện, truyền dịch, kháng sinh và mổ sớm (MSD; NHS: nhiều khả năng phải nhập viện). Giữ cant_miss: false như gợi ý: phần lớn ca chưa biến chứng khi đến khám, khoảng 85% tự ổn khi điều trị nội khoa (MSD), các ca nặng được bắt bằng quy tắc sốt kèm đau dữ dội và bụng cứng; tuy vậy khoảng 10% có thể thủng nếu không điều trị và tử vong khi thủng đến 16% (MSD), lượt C có thể cân nhắc lại cho người già, người đái tháo đường. Điểm chưa chắc: (1) prior chỉ suy từ nhóm 'mật – tụy' 4,0% ở chăm sóc ban đầu, chưa có số liệu Việt Nam; (2) chưa có hệ số giới tính vì nguồn đã mở không nêu tỷ lệ nam/nữ; (3) hai câu 'lan lên vai phải hoặc sau lưng bên phải' và 'lan ra sau lưng' tương quan với nhau, nên đề nghị gom vào một cụm; (4) chưa có quy tắc cho bộ ba sốt, vàng da, đau hạ sườn phải (viêm đường mật cấp). Mã và tên ICD-10 tiếng Việt đã đối chiếu qua công cụ tra cứu của icd.kcb.vn (bộ mã theo Thông tư 06/2026/TT-BYT) ngày 24/10/2026; mã MONDO tra qua EBI OLS."
