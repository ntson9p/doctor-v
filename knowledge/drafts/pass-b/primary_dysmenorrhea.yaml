id: primary_dysmenorrhea
names:
  vi: "Đau bụng kinh nguyên phát"
  vi_common: ["Đau bụng kinh", "Thống kinh"]
  en: "Primary dysmenorrhea"
codes:
  icd10: "N94.4"
  icd10_verified: true
  mondo: "MONDO:1060206"
summary_vi:
  - "Đau quặn bụng dưới trong những ngày có kinh, không do bệnh của tử cung hay buồng trứng."
  - "Đau thường bắt đầu ngay trước hoặc khi có kinh, kéo dài vài giờ đến khoảng 3 ngày."
  - "Rất hay gặp ở nữ trẻ, có thể kèm đau thắt lưng, mệt, tiêu chảy hoặc buồn nôn."
urgency: 5
cant_miss: false
specialties: [obstetrics_gynecology]
applicability:
  sex: [female]
  age_groups: [teen_13_17, adult_18_44, adult_45_64]
  reason_vi: "Chỉ gặp ở nữ giới trong những năm có kinh nguyệt."
priors:
  - complaint: abdominal_pain
    default: P2
    by_age: { teen_13_17: P1, adult_45_64: P4 }
    evidence:
      tier: B
      basis: judgment
      sources: [pham-2025-dysmenorrhea-hanoi, jang-2013-dysmenorrhea-vietnam]
      note: "Prior tính trong số nữ cùng nhóm tuổi bị đau bụng (bệnh chỉ xét cho nữ). Ở Việt Nam, 58,8% phụ nữ 17–42 tuổi bị đau bụng kinh (Jang 2013) và 78,6% nữ sinh viên Hà Nội bị đau bụng kinh nguyên phát, 68,7% đau vừa đến nặng (Pham 2025). Phần lớn tự chịu đựng (chỉ 2,6% dùng thuốc), nên số người tự tra cứu khi đau có thể lớn. Người soạn ước: 13–17 tuổi trên 20% (P1); 18–44 tuổi 5–20% (P2, giảm sau khi đã sinh con theo Jang 2013); 45–64 tuổi thấp (P4) vì đau bụng kinh mới hoặc nặng lên ở tuổi này thường do nguyên nhân khác. Chưa có số liệu lý do đi khám; cần bác sĩ duyệt."
findings:
  - finding: pain_with_menses
    freq: almost_always
    evidence:
      tier: B
      basis: numeric
      sources: [pham-2025-dysmenorrhea-hanoi, nhs-period-pain]
      locator: "Pham 2025, bảng 1 (thời điểm bắt đầu đau)"
      reported: "Bắt đầu ngày đầu có kinh 69,8%, trước 1 ngày 20,1%, trước từ 2 ngày 6,0% (268 người có đau)."
      note: "Theo định nghĩa, đau gắn với kỳ kinh; NHS: thường bắt đầu ngay trước hoặc khi có kinh. Tỷ lệ nền của câu hỏi là 18% (kỳ kinh chiếm khoảng 5/28 ngày)."
  - finding: abd_pain_location
    dist: { epigastric: 0.02, right_upper: 0.01, left_upper: 0.01, periumbilical: 0.10, right_lower: 0.08, left_lower: 0.08, suprapubic: 0.60, whole: 0.10 }
    evidence:
      tier: B
      basis: numeric
      sources: [pham-2025-dysmenorrhea-hanoi, nhs-period-pain]
      reported: "Đau bụng dưới ở 97,0% người đau bụng kinh."
      note: "Đau thường ở giữa bụng dưới; tỷ lệ từng vùng là ước lượng."
  - finding: abd_pain_colicky
    freq: frequent
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-period-pain]
      note: "NHS mô tả là đau quặn (cramps) ở bụng, có khi đau nhói hoặc âm ỉ. Không có tỷ lệ; chọn frequent. Tỷ lệ nền của đau quặn từng cơn là 20%."
  - finding: abd_pain_radiates_back
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [pham-2025-dysmenorrhea-hanoi, nhs-period-pain]
      reported: "Đau thắt lưng kèm theo ở 67,8%."
      note: "Câu hỏi hỏi đau lan ra sau lưng, hẹp hơn 'có đau thắt lưng kèm theo', nên chọn frequent thay vì very_frequent. NHS: đau có thể lan ra lưng và đùi."
  - finding: abd_pain_duration
    dist: { lt_6h: 0.19, h6_24: 0.37, d1_3: 0.29, d4_14: 0.02, gt_2w: 0.13 }
    evidence:
      tier: B
      basis: numeric
      sources: [pham-2025-dysmenorrhea-hanoi, nhs-period-pain]
      reported: "Đau kéo dài vài giờ 21,3%, 1 ngày 42,2%, từ 2 ngày 33,2%; NHS: thường tối đa khoảng 3 ngày."
      note: "Lựa chọn 'hơn 2 tuần, hoặc đau tái đi tái lại' gồm cả người trả lời theo kiểu đau mỗi tháng; người soạn để 0,13 cho nhóm này."
  - finding: abd_pain_severe
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [pham-2025-dysmenorrhea-hanoi]
      reported: "Đau nặng 18,7%, vừa 50,7%, nhẹ 30,6%."
  - finding: nausea
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [pham-2025-dysmenorrhea-hanoi]
      reported: "Buồn nôn kèm theo ở 12,0%."
      note: "Tỷ lệ nền của buồn nôn ở người đau bụng là 35%, nên trả lời 'Có' làm giảm nhẹ khả năng bệnh, đúng với số liệu."
  - finding: diarrhea
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [pham-2025-dysmenorrhea-hanoi]
      reported: "Tiêu chảy kèm theo ở 13,1%."
  - finding: headache
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [pham-2025-dysmenorrhea-hanoi]
      reported: "Đau đầu kèm theo ở 12,7%."
  - finding: fatigue
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [pham-2025-dysmenorrhea-hanoi]
      reported: "Mệt kèm theo ở 60,3%."
  - finding: fever
    freq: rare
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-period-pain]
      note: "Đau bụng kinh nguyên phát không gây sốt; NHS không nêu sốt. Đau bụng dưới kèm sốt nên nghĩ viêm vùng chậu, viêm ruột thừa, nhiễm khuẩn tiết niệu."
  - finding: vaginal_bleeding
    freq: rare
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-period-pain]
      note: "Câu hỏi hỏi ra máu ngoài kỳ kinh; máu trong bệnh này là máu kinh. NHS khuyên đi khám khi ra máu giữa các kỳ kinh (gợi ý nguyên nhân khác)."
  - finding: missed_period
    freq: rare
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-period-pain]
      note: "Đau xảy ra khi có kinh nên hầu như không đi kèm chậm kinh. Chậm kinh kèm đau bụng phải nghĩ đến thai, nhất là thai ngoài tử cung."
  - finding: pregnant
    freq: rare
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-period-pain, jang-2013-dysmenorrhea-vietnam]
      note: "Không có kinh khi đang có thai nên không thể có đau bụng kinh. Mức rare là mức thấp nhất dưới tỷ lệ nền 5% của câu hỏi; câu hỏi gồm cả 'có thể đang có thai'."
  - finding: abd_pain_worse_movement
    freq: rare
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-period-pain]
      note: "Đau tăng khi đi lại, khi ho, khi xe xóc là dấu hiệu kích thích phúc mạc (viêm ruột thừa, viêm vùng chậu, máu trong ổ bụng). Đau bụng kinh thường không như vậy; NHS còn khuyên vận động nhẹ để đỡ đau. Ước lượng của người soạn."
warning_signs: [abd_pain_severe, fainting_or_near_fainting, abdomen_hard_swollen]
self_care_vi:
  - "Chườm ấm bụng dưới bằng túi chườm hoặc chai nước ấm bọc khăn."
  - "Tắm nước ấm, xoa nhẹ bụng và lưng."
  - "Đi bộ hoặc tập nhẹ nhàng có thể giúp đỡ đau."
  - "Hỏi dược sĩ về thuốc giảm đau phù hợp và dùng đúng hướng dẫn trên hộp."
see_doctor_vi:
  - "Đi khám trong hôm nay nếu đau dữ dội hơn mọi lần và thuốc giảm đau không đỡ."
  - "Đặt lịch khám phụ khoa nếu đau kinh nặng dần, ra máu ngoài kỳ kinh hoặc đau khi quan hệ."
  - "Nếu có thể đang có thai mà bị đau bụng, cần đi khám ngay."
review:
  status: draft
  authors: ["agent:pass-b"]
  updated: "2026-10-24"
  notes_vi: "Giữ mức xử trí 5 như gợi ý (NHS: tự chăm sóc; khám khẩn khi đau dữ dội hơn mọi lần, thuốc giảm đau không đỡ). Văn bản 315/QĐ-BYT không có bài đau bụng kinh; nguồn chính là nghiên cứu Việt Nam (Pham 2025, Jang 2013) và NHS. Điểm chưa chắc: (1) prior chưa có số liệu lý do đi khám; (2) số liệu triệu chứng kèm lấy từ nữ sinh viên điều dưỡng, có thể khác cộng đồng; (3) chưa liên kết nôn vì nguồn Việt Nam không báo cáo; (4) applicability chỉ từ 13 tuổi theo các câu hỏi về kinh nguyệt trong danh mục, nhưng 17,8% nữ sinh có kinh từ 9–12 tuổi (Pham 2025): đề nghị người bảo trì cân nhắc mở 'pain_with_menses' cho nhóm 5–12 tuổi."
