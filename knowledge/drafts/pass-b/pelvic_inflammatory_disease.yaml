id: pelvic_inflammatory_disease
names:
  vi: "Bệnh viêm tiểu khung ở nữ giới"
  vi_common: ["Viêm vùng chậu", "Viêm phần phụ", "Viêm vòi trứng"]
  en: "Pelvic inflammatory disease"
codes:
  icd10: "N73.9"
  icd10_verified: true
  mondo: "MONDO:0000922"
summary_vi:
  - "Nhiễm khuẩn tử cung, vòi trứng hoặc buồng trứng, thường do vi khuẩn lây qua quan hệ tình dục."
  - "Hay gặp đau bụng dưới hai bên, khí hư bất thường, có thể sốt."
  - "Cần điều trị sớm để tránh vô sinh, thai ngoài tử cung và đau vùng chậu kéo dài."
urgency: 3
cant_miss: false
specialties: [obstetrics_gynecology]
applicability:
  sex: [female]
  age_groups: [teen_13_17, adult_18_44, adult_45_64, elder_65_74, elder_75p]
  reason_vi: "Chỉ gặp ở nữ giới; hầu như không gặp trước tuổi dậy thì."
priors:
  - complaint: abdominal_pain
    default: P3
    by_age: { teen_13_17: P4, adult_45_64: P4, elder_65_74: P6, elder_75p: P6 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015, msd-pid, cdc-sti-2021-pid]
      locator: "315/QĐ-BYT, bài Viêm phần phụ, mục 1; MSD: Etiology, Risk factors"
      note: "Prior tính trong số phụ nữ cùng nhóm tuổi bị đau bụng (bệnh chỉ xét cho nữ). 315/QĐ-BYT coi viêm nhiễm đường sinh dục là bệnh phổ biến ở phụ nữ; MSD: hay gặp ở phụ nữ trẻ (dưới 25 tuổi là yếu tố nguy cơ), hiếm sau mãn kinh; CDC: nhiều đợt bệnh không được nhận ra. Chưa có số liệu Việt Nam về tỷ lệ trong người đau bụng; người soạn ước 1–5% ở phụ nữ 18–44 tuổi (P3), thấp hơn ở 13–17 tuổi (ít người đã có quan hệ tình dục) và 45–64 tuổi (P4), rất hiếm từ 65 tuổi (P6)."
  - complaint: fever
    default: P4
    by_age: { teen_13_17: P5, adult_45_64: P5, elder_65_74: P6, elder_75p: P6 }
    evidence:
      tier: B
      basis: judgment
      sources: [msd-pid, byt-qd-315-2015]
      note: "Người viêm vùng chậu thường chọn đau bụng là triệu chứng chính; một số chọn sốt (sốt là triệu chứng thường gặp theo MSD, có thể tới 39°C theo 315/QĐ-BYT). Người soạn ước 0,2–1% phụ nữ 18–44 tuổi bị sốt (P4)."
findings:
  - finding: abd_pain_location
    dist: { epigastric: 0.02, right_upper: 0.04, left_upper: 0.02, periumbilical: 0.05, right_lower: 0.17, left_lower: 0.15, suprapubic: 0.40, whole: 0.15 }
    evidence:
      tier: B
      basis: numeric
      sources: [byt-qd-315-2015, nhs-pid]
      locator: "315/QĐ-BYT, Viêm phần phụ, mục 2.1.1 và 2.2.2 (hội chứng Fitz-Hugh-Curtis)"
      reported: "Đau vùng bụng dưới, thường đau cả hai bên (90%); viêm quanh gan gây đau hạ sườn phải."
      note: "Đau bụng dưới hai bên có thể được chọn là 'bụng dưới, ở giữa' hoặc 'khắp bụng'. Tỷ lệ từng vùng là ước lượng."
  - finding: abd_pain_duration
    dist: { lt_6h: 0.05, h6_24: 0.12, d1_3: 0.33, d4_14: 0.35, gt_2w: 0.15 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015, cdc-sti-2021-pid]
      locator: "315/QĐ-BYT, Viêm phần phụ, mục 2.1–2.3 (thể cấp, bán cấp chiếm 30%, mạn tính)"
      note: "Có thể cấp, bán cấp (đau âm ỉ) hoặc mạn tính; CDC ghi triệu chứng thường mơ hồ nên người bệnh hay đi khám muộn. Phân bố là ước lượng của người soạn: thường đau đã vài ngày, hiếm khi dưới 6 giờ."
  - finding: fever
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-315-2015, msd-pid, cdc-sti-2021-pid]
      locator: "315/QĐ-BYT, mục 2.1.1 (sốt tới 39°C) và 2.2.1 (sốt nhẹ 37,5–38°C); CDC: tiêu chuẩn bổ sung nhiệt độ trên 38,3°C"
      note: "MSD xếp sốt vào triệu chứng thường gặp; CDC dùng sốt làm tiêu chuẩn bổ sung chứ không phải tối thiểu vì nhiều người không sốt. Chọn frequent."
  - finding: abnormal_vaginal_discharge
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [byt-qd-315-2015, msd-pid, nhs-pid]
      locator: "315/QĐ-BYT, Viêm phần phụ, mục 2.1.1 (đặt mỏ vịt)"
      reported: "Nhiều khí hư, có khi là mủ: 39–65% các trường hợp."
      note: "Tỷ lệ nền của dấu hiệu là 15% (viêm âm đạo hay gặp), nên khí hư chỉ tăng vừa phải khả năng bệnh."
  - finding: vaginal_bleeding
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [byt-qd-315-2015, nhs-pid, msd-pid]
      locator: "315/QĐ-BYT, mục 2.1.1 (rối loạn kinh nguyệt 50%) và 2.2.1 (rong kinh)"
      reported: "Rối loạn kinh nguyệt khoảng 50% (gồm cả rong kinh, kinh nhiều)."
      note: "Câu hỏi chỉ hỏi ra máu ngoài kỳ kinh (NHS: ra máu giữa kỳ kinh hoặc sau quan hệ), nên chọn mức thấp hơn 50%: occasional."
  - finding: pain_with_intercourse
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [msd-pid, nhs-pid]
      note: "MSD xếp đau khi giao hợp vào nhóm ít gặp hơn; NHS liệt kê đau sâu khi quan hệ. Chọn occasional."
  - finding: dysuria
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [byt-qd-315-2015, msd-pid]
      locator: "315/QĐ-BYT, Viêm phần phụ, mục 2.1.1"
      reported: "Dấu hiệu kích thích vùng tiểu khung như mót rặn, đi nặng, tiểu khó, tiểu không hết: 15–25%."
  - finding: abd_pain_worse_movement
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-315-2015]
      locator: "315/QĐ-BYT, Viêm phần phụ, mục 2.1.1 (đau tăng khi đi lại) và 2.3.2 (đi lại nhiều, làm việc nặng đau tăng)"
      note: "Văn bản nêu đây là đặc điểm nổi bật của đau nhưng không cho tỷ lệ; chọn frequent."
  - finding: abd_pain_severe
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-pid, msd-pid]
      note: "Đau dữ dội gặp ở thể nặng hoặc có áp xe vòi – buồng trứng (khoảng 15% người viêm vòi trứng theo MSD); NHS khuyên đi cấp cứu khi đau dữ dội. Ước occasional."
  - finding: new_sexual_partner
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [msd-pid, cdc-sti-2021-pid]
      note: "MSD: bạn tình mới trong 12 tháng hoặc từ 2 bạn tình là yếu tố nguy cơ. Câu hỏi chỉ hỏi 3 tháng qua và đây là câu nhạy cảm, nhiều người không trả lời thật. Người soạn ước occasional."
  - finding: pregnant
    freq: rare
    evidence:
      tier: C
      basis: verbal
      sources: [msd-pid, cdc-sti-2021-pid]
      note: "MSD: bệnh hiếm gặp khi có thai. CDC: phụ nữ có thai nghi viêm vùng chậu cần nhập viện. Đau bụng khi có thai nên nghiêng về các bệnh thai kỳ."
  - finding: abd_pain_migrated_rlq
    freq: rare
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-315-2015]
      note: "Đau từ quanh rốn chuyển xuống hố chậu phải là kiểu đau của viêm ruột thừa; viêm vùng chậu thường đau bụng dưới hai bên ngay từ đầu (315/QĐ-BYT). Người soạn ước rare; tỷ lệ nền của dấu hiệu là 10%."
warning_signs: [abd_pain_severe, persistent_vomiting, abdomen_hard_swollen, cold_hands_feet]
self_care_vi:
  - "Không quan hệ tình dục cho đến khi điều trị xong và hết triệu chứng."
  - "Nghỉ ngơi, uống đủ nước."
see_doctor_vi:
  - "Đi khám phụ khoa trong vòng 24 giờ để được khám và điều trị sớm."
  - "Bạn tình cũng cần được khám và điều trị."
  - "Đến cơ sở cấp cứu ngay nếu đau bụng dữ dội, sốt cao hoặc nôn nhiều."
review:
  status: draft
  authors: ["agent:pass-b"]
  updated: "2026-10-24"
  notes_vi: "Giữ mức xử trí 3 như gợi ý: CDC cho điều trị ngoại trú thể nhẹ – vừa và đánh giá lại sau 72 giờ; NHS khuyên khám khẩn trong ngày, gọi cấp cứu khi đau dữ dội, sốt rất cao hoặc nôn. Các thể nặng đã có quy tắc mức 2 (đau bụng dữ dội, bụng cứng, sốt kèm đau bụng dữ dội). Tên chính thức theo ICD-10 (Thông tư 06/2026): N73.9 'Bệnh viêm tiểu khung ở nữ giới, không xác định'. Điểm chưa chắc: (1) không có số liệu Việt Nam cho prior; (2) tỷ lệ sốt ở người bệnh ngoại trú dao động lớn giữa các nguồn; (3) không liên kết buồn nôn, nôn (tỷ lệ nền ở người đau bụng đã cao) và đau trùng kỳ kinh (315 có nêu rối loạn kinh nguyệt nhưng không cho tỷ lệ đau khởi phát quanh kỳ kinh); (4) applicability loại trẻ dưới 13 tuổi và nam giới."
