id: influenza
names:
  vi: "Cúm mùa"
  vi_common: ["Cúm", "Cảm cúm"]
  en: "Seasonal influenza"
codes:
  icd10: "J11"
  icd10_verified: true
  mondo: "MONDO:0005812"
summary_vi:
  - "Bệnh nhiễm vi rút cúm cấp tính, lây qua giọt bắn khi ho, hắt hơi hoặc qua tay chạm vào đồ vật nhiễm vi rút."
  - "Thường khởi phát đột ngột với sốt, ớn lạnh, đau đầu, đau nhức người, ho, đau họng."
  - "Phần lớn tự khỏi, nhưng người già, trẻ nhỏ, người có bệnh nền và phụ nữ có thai dễ bị nặng."
urgency: 5
cant_miss: false
specialties: [infectious_disease, general_medicine]
priors:
  - complaint: fever
    default: P2
    evidence:
      tier: B
      basis: judgment
      sources: [nguyen-2013-vietnam-ili-surveillance, todd-2018-hcmc-ili, byt-qd-1840-2025]
      note: "Giám sát quốc gia 2006–2010: 22% người có hội chứng giống cúm dương tính với cúm, cao nhất ở trẻ tuổi đi học (29%). Phòng khám tuyến ban đầu TP.HCM 2013–2015: khoảng 40%. Hội chứng giống cúm chỉ là một phần số người đi khám vì sốt, nên ước 5–20% (P2) cho mọi nhóm tuổi; trong mùa cúm có thể cao hơn."
  - complaint: headache
    default: P3
    evidence:
      tier: C
      basis: judgment
      sources: [ebell-2025-influenza-signs, byt-qd-1840-2025]
      note: "Đau đầu có ở khoảng 2/3 người bị cúm và là triệu chứng khởi phát (1840), nhưng hiếm khi là lý do chính đi khám. Ước 1–5% người có đau đầu là triệu chứng chính; chưa có số liệu Việt Nam."
prior_modifiers:
  - when: { regions: [north], months: [12, 1, 2, 3, 4] }
    factor: 1.5
    evidence:
      tier: B
      basis: numeric
      sources: [nguyen-2016-household-ili-vietnam, byt-qd-1840-2025]
      locator: "Nguyen 2016, bảng 3; 1840 mục I"
      reported: "55/71 đợt cúm (78%) vào mùa đông và xuân"
      population: "cộng đồng nông thôn Hà Nam (miền Bắc), 2008–2013"
      note: "1840: bệnh xảy ra quanh năm nhưng tăng cao vào mùa đông xuân. Bài báo không ghi rõ tháng của từng mùa; tạm lấy tháng 12–4. Miền Nam có cúm quanh năm với đỉnh không cố định (Todd 2018), nên không dùng hệ số theo tháng cho các vùng khác."
  - when: { regions: [north], months: [6, 7, 8, 9] }
    factor: 0.5
    evidence:
      tier: B
      basis: numeric
      sources: [nguyen-2016-household-ili-vietnam]
      locator: "bảng 3"
      reported: "16/71 đợt cúm (22%) vào mùa hè và thu"
      population: "cộng đồng nông thôn Hà Nam (miền Bắc), 2008–2013"
      note: "Hệ số đối ứng với mùa đông xuân, để trung bình cả năm gần bằng 1."
findings:
  - finding: cough
    freq: very_frequent
    evidence:
      tier: A
      basis: numeric
      sources: [ebell-2025-influenza-signs, iyadorai-2024-cccov-influenza, byt-qd-1840-2025]
      locator: "Ebell 2025 bảng 3; Iyadorai 2024 bảng 1"
      reported: "0,92 (72 nghiên cứu); 84,7% ở ngoại trú Malaysia"
      population: "người có hội chứng giống cúm hoặc nhiễm trùng hô hấp cấp, chủ yếu ngoại trú"
      note: "Nhiều nghiên cứu lấy ho làm tiêu chuẩn tuyển chọn nên 0,92 bị thổi phồng; chọn very_frequent."
  - finding: productive_cough
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-1840-2025]
      locator: "mục II.1.1"
      note: "1840 mô tả ho khan. Tần suất có điều kiện (trong số người cúm có ho) chưa có số liệu; ước occasional để phân biệt với viêm phổi (thường ho có đờm)."
  - finding: runny_nose
    freq: very_frequent
    evidence:
      tier: A
      basis: numeric
      sources: [ebell-2025-influenza-signs, byt-qd-1840-2025]
      locator: "bảng 3"
      reported: "chảy nước mũi 0,70 (39 nghiên cứu); viêm mũi 0,76"
      population: "người có triệu chứng hô hấp cấp, chủ yếu ngoại trú"
  - finding: nasal_congestion
    freq: frequent
    evidence:
      tier: A
      basis: numeric
      sources: [ebell-2025-influenza-signs, iyadorai-2024-cccov-influenza]
      reported: "0,69 (13 nghiên cứu); 39,6% ở ngoại trú Malaysia"
      population: "người có triệu chứng hô hấp cấp, ngoại trú"
      note: "Hai nguồn lệch nhau quanh ranh giới; chọn frequent."
  - finding: sore_throat
    freq: frequent
    evidence:
      tier: A
      basis: numeric
      sources: [ebell-2025-influenza-signs, iyadorai-2024-cccov-influenza]
      reported: "0,57 (62 nghiên cứu); 44,6% ở ngoại trú Malaysia"
  - finding: headache
    freq: frequent
    evidence:
      tier: A
      basis: numeric
      sources: [ebell-2025-influenza-signs, byt-qd-1840-2025]
      reported: "0,65 (55 nghiên cứu)"
      note: "Dùng khi triệu chứng chính là sốt. Trẻ nhỏ khó tự báo đau đầu."
  - finding: myalgia
    freq: frequent
    freq_by_age:
      child_2m_5y: occasional
    evidence:
      tier: A
      basis: numeric
      sources: [ebell-2025-influenza-signs, byt-qd-1840-2025]
      reported: "0,59 (59 nghiên cứu)"
      note: "Ebell 2025: mệt và đau cơ kém nhạy ở trẻ dưới 5 tuổi (không nêu số riêng cho đau cơ), nên hạ một mức cho nhóm này."
  - finding: chills_rigors
    freq: frequent
    evidence:
      tier: A
      basis: numeric
      sources: [ebell-2025-influenza-signs, byt-qd-1840-2025]
      reported: "rét run 0,61 (29 nghiên cứu)"
      note: "Tần suất trong số người cúm có sốt; 1840 nêu ớn lạnh khi khởi phát."
  - finding: fatigue
    freq: very_frequent
    freq_by_age:
      child_2m_5y: occasional
    evidence:
      tier: A
      basis: numeric
      sources: [ebell-2025-influenza-signs]
      locator: "bảng 3 và phần bàn luận"
      reported: "chung 0,69; người lớn 0,82; trẻ dưới 5 tuổi 0,27"
  - finding: loss_of_appetite
    freq: frequent
    evidence:
      tier: A
      basis: numeric
      sources: [ebell-2025-influenza-signs]
      reported: "0,51 (10 nghiên cứu)"
  - finding: arthralgia
    freq: occasional
    evidence:
      tier: A
      basis: numeric
      sources: [ebell-2025-influenza-signs]
      reported: "đau khớp 0,29 (11 nghiên cứu)"
  - finding: pleuritic_chest_pain
    freq: occasional
    evidence:
      tier: A
      basis: numeric
      sources: [ebell-2025-influenza-signs]
      reported: "đau ngực 0,25 (10 nghiên cứu)"
      note: "Nguồn ghi đau ngực chung, không riêng đau khi hít sâu, khi ho."
  - finding: diarrhea
    freq: occasional
    evidence:
      tier: A
      basis: numeric
      sources: [ebell-2025-influenza-signs, byt-qd-1840-2025]
      reported: "0,14 (29 nghiên cứu)"
      note: "1840: trẻ em có thể có buồn nôn, nôn, tiêu chảy."
  - finding: vomiting
    freq: rare
    freq_by_age:
      child_2m_5y: occasional
      child_5_12: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-1840-2025]
      locator: "mục II.1.1"
      note: "1840 chỉ nêu nôn ở trẻ em ('có thể gặp'), nên trẻ em xếp occasional; người lớn chưa có số liệu, ước rare. Cần bác sĩ duyệt."
  - finding: rash_any
    freq: rare
    evidence:
      tier: A
      basis: numeric
      sources: [ebell-2025-influenza-signs]
      reported: "phát ban 0,04 (LR+ 0,58)"
  - finding: loss_of_smell_taste
    freq: rare
    evidence:
      tier: A
      basis: numeric
      sources: [struyf-2022-cochrane-covid-symptoms]
      reported: "mất ngửi có độ đặc hiệu 94,2%, tức khoảng 6% ở người nghi COVID-19 nhưng không mắc"
      population: "người có triệu chứng hô hấp được xét nghiệm COVID-19 (2020–2021)"
      note: "Số gián tiếp: nhóm không mắc COVID-19 gồm cả cúm và các vi rút hô hấp khác."
  - finding: breathing_difficulty
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-1840-2025]
      locator: "mục II.1.2 và II.2.3"
      note: "Cúm nhẹ chỉ có triệu chứng hô hấp trên; khó thở, thở nhanh là biểu hiện cúm nặng hoặc viêm phổi. Ước occasional ở người cúm đi khám; cần số liệu."
  - finding: sick_contact_respiratory
    freq: frequent
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-1840-2025, nguyen-2016-household-ili-vietnam]
      locator: "1840 mục II.2.4.1"
      note: "Ca nghi ngờ theo 1840 gồm yếu tố dịch tễ (tiếp xúc gần người bệnh hoặc ở vùng đang có dịch). Lây trong hộ gia đình là phổ biến; chưa có tỷ lệ cụ thể."
  - finding: fever
    freq: very_frequent
    evidence:
      tier: A
      basis: numeric
      sources: [ebell-2025-influenza-signs, iyadorai-2024-cccov-influenza]
      reported: "sốt (tự cảm thấy hoặc đo) 0,87; 83,0% ở ngoại trú Malaysia"
      note: "Chỉ có tác dụng khi triệu chứng chính là đau đầu (sốt được ngầm định khi triệu chứng chính là sốt)."
  - finding: fever_max_temp
    dist: { lt_38: 0.15, t38_39: 0.45, ge_39: 0.40 }
    evidence:
      tier: B
      basis: judgment
      sources: [ebell-2025-influenza-signs, byt-qd-1840-2025]
      note: "Sốt đo được lúc khám có độ nhạy 0,60 (Ebell 2025); nhiệt độ cao nhất ở nhà thường cao hơn lúc khám. Ước phần lớn từ 38°C trở lên; cần số liệu Việt Nam."
  - finding: fever_duration
    dist: { d1_2: 0.50, d3_5: 0.42, d6_7: 0.06, gt_7d: 0.02 }
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-1840-2025]
      locator: "mục II.1.1"
      note: "Phần lớn người bệnh chỉ sốt 3–5 ngày rồi tự hồi phục. Phân bố theo thời điểm người dùng hỏi; sốt quá 7 ngày gợi ý biến chứng hoặc bệnh khác."
warning_signs:
  - es_severe_breathing
  - breathing_difficulty
  - confusion
  - drowsy_hard_to_wake
  - cold_hands_feet
  - severe_weakness
  - seizure_recent
  - child_unable_to_drink
self_care_vi:
  - "Nghỉ ngơi tại nhà, uống nhiều nước, ăn đủ chất."
  - "Không dùng thuốc hạ sốt có aspirin, nhất là cho trẻ em."
  - "Khi chưa loại trừ được sốt xuất huyết, không tự dùng ibuprofen."
  - "Đeo khẩu trang, rửa tay thường xuyên, hạn chế gặp người già và người có bệnh nền."
see_doctor_vi:
  - "Người từ 65 tuổi, trẻ dưới 5 tuổi, người có thai hoặc có bệnh nền nên đi khám sớm."
  - "Đi khám nếu sốt quá 5 ngày, hoặc đã đỡ rồi lại sốt, ho nặng lên."
  - "Đi cấp cứu ngay nếu khó thở tăng dần, đau tức ngực, lơ mơ, tím tái hoặc tay chân lạnh."
sources: [byt-qd-1840-2025, byt-qd-2760-2023]
review:
  status: draft
  authors: ["agent:pass-b"]
  updated: "2026-10-24"
  notes_vi: "Giữ urgency 5 như gợi ý: 1840 cho điều trị ngoại trú cúm nhẹ, chỉ dùng thuốc kháng vi rút cho người có yếu tố nguy cơ; các nhóm nguy cơ và dấu hiệu nặng đã có quy tắc riêng (rf_high_risk_fever, rf_flu_risk_chronic_disease, rf_high_risk_fever_breathing). ICD-10 tra trên dữ liệu icd.kcb.vn: J11 'Cúm, vi rút không được định danh' (J10 khi đã xác định vi rút); tên chính dùng 'Cúm mùa' theo tên hướng dẫn của Bộ Y tế. Chưa chắc chắn: (1) tần suất trong Ebell 2025 lấy từ người có hội chứng giống cúm nên ho, sốt bị thổi phồng; (2) prior là ước lượng, chưa có số liệu lý do đi khám ở tuyến ban đầu; (3) tháng của 'mùa đông xuân' miền Bắc là giả định; (4) chưa có hệ số theo tháng cho miền Trung, Tây Nguyên, Nam. Không dùng câu hỏi 'khởi phát đột ngột' vì danh mục chưa có (LR+ chỉ 1,3 theo Ebell 2025). 'Khó thở' được đưa vào warning_signs vì 1840 xếp khó thở, thở nhanh vào cúm nặng, trong khi quy tắc chung rf_fever_breathing chỉ ở mức 3 (mức 2 cho nhóm nguy cơ cao); người bảo trì nên xem lại cho thống nhất. Liên kết rare của loss_of_smell_taste cao hơn tỷ lệ nền 1% là có chủ ý (khoảng 6% so với 1%), để mất ngửi không làm COVID-19 vượt cúm quá mức (kb:check cảnh báo)."
