notes_vi: "Đã đọc toàn văn (PMC4994428) qua API Europe PMC. Cộng đồng nông thôn Hà Nam (miền Bắc), 263 hộ, 2008–2013, tìm ca chủ động. Trong các mẫu dương tính: rhinovirus 28%, cúm 17%, coronavirus 8%. Bảng 3: 55/71 đợt cúm (78%) vào mùa đông và xuân; 84/124 đợt rhinovirus (68%) vào mùa hè và thu."
