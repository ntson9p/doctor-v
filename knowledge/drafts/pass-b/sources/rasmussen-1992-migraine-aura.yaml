notes_vi: "Đã đọc tóm tắt qua Europe PMC (REST API). 1.000 người dân: tỷ lệ mắc trọn đời đau nửa đầu có tiền triệu 5%, không tiền triệu 8%. Có yếu tố khởi phát ở 61% (có tiền triệu) và 90% (không tiền triệu), nổi bật nhất là căng thẳng. Rối loạn thị giác ở 90% người có tiền triệu."
