notes_vi: "Đã mở trực tiếp; rà soát lần cuối 18/3/2026. Đau quặn bụng, có thể lan ra lưng và đùi; thường bắt đầu ngay trước hoặc khi có kinh, kéo dài tối đa khoảng 3 ngày. Tự chăm sóc: tắm ấm, chườm ấm bụng, xoa bụng và lưng, vận động nhẹ. Khám bác sĩ nếu đau kinh tăng dần, ra máu giữa kỳ kinh, đau khi quan hệ; khám khẩn hoặc gọi 111 nếu đau dữ dội hơn mọi lần và thuốc giảm đau không đỡ."
