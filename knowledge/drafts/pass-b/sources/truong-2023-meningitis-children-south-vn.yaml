notes_vi: "Đã đọc toàn văn qua Europe PMC (PMC10316691). Giám sát trọng điểm tại Bệnh viện Nhi đồng 1 và 2 TP.HCM: 2.560 trẻ dưới 5 tuổi có viêm màng não mủ có thể (2012–2021), 66,6% dưới 1 tuổi; phế cầu là căn nguyên chính trong ca xác định. Dẫn nghiên cứu năm 2002 ở Hà Nội: viêm màng não do Hib khoảng 12/100.000 trẻ dưới 5 tuổi trước khi có vắc xin (Việt Nam đưa vắc xin Hib vào tiêm chủng mở rộng từ 6/2010)."
