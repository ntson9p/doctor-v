notes_vi: "Đã mở trực tiếp (rà soát 5/2025, cập nhật 7/2026; tác giả Aparna Sridhar). Dữ kiện dùng: khoảng 2/100 thai; vỡ thường ở tuần 6–16; triệu chứng thay đổi, có thể không có cho đến khi vỡ; phần lớn có đau vùng chậu, ra máu âm đạo hoặc cả hai; vỡ gây đau dữ dội đột ngột, có thể ngất, sốc mất máu; người kinh nguyệt không đều có thể không biết mình có thai."
