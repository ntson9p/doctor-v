notes_vi: "Đã đọc toàn văn (Europe PMC). 839 phụ nữ 18–70 tuổi nghi nhiễm khuẩn tiết niệu dưới ở chăm sóc ban đầu (Anh); loại trừ người có buồn nôn, nôn hoặc triệu chứng toàn thân nặng. Trong 511 người có đủ số liệu, tỷ lệ có triệu chứng ở mức khá khó chịu trở lên lúc đến khám: tiểu nhiều lần ban ngày 78%, tiểu buốt 64%, tiểu gấp 63%, tiểu đêm 57%, đau bụng 47%, tiểu máu 16%. Triệu chứng bắt đầu trung vị 3 ngày trước khi khám (khoảng tứ phân vị 3–7 ngày); 13% trên 10 ngày; 71% đã từng bị viêm bàng quang."
