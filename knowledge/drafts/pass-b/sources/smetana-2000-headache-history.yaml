notes_vi: "Đã đọc tóm tắt qua Europe PMC (REST API). So sánh đau nửa đầu với đau đầu căng thẳng: LR+ của buồn nôn 19,2; sợ ánh sáng 5,8; sợ tiếng ồn 5,2; tăng khi vận động 3,7. Yếu tố khởi phát gặp như nhau ở hai bệnh (trừ thức ăn, LR 3,6). Tiền triệu thị giác có ở 84% người đau nửa đầu có tiền triệu."
