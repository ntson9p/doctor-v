notes_vi: "Đã đọc toàn văn (PMC13099529) qua API Europe PMC. Đồng Nai: tỷ lệ tiêm mũi 1 vắc xin sởi 73,1% (2021), 73,9% (2022), 91,9% (2023). Dịch bắt đầu giữa năm 2024, đỉnh tuần 50–51/2024 (khoảng 900 ca/tuần), giảm dần đến tuần 14/2025. Trong 11.434 ca: 55,9% dưới 5 tuổi, 24,3% 5–10 tuổi, 19,8% trên 10 tuổi. Định nghĩa ca nghi ngờ trong giám sát: sốt, phát ban kèm ho, sổ mũi, viêm kết mạc, hạt Koplik, nổi hạch hoặc đau khớp."
