notes_vi: "Chỉ đọc tóm tắt (qua API Europe PMC). 23 nghiên cứu ở trẻ có thể bị viêm phổi. Sốt trên 37,5°C: độ nhạy 80–92%; thở nhanh trên 40 lần/phút: độ nhạy 79%; đau ngực (các nghiên cứu có trẻ vị thành niên): độ nhạy 8–14%. Thiếu oxy và thở gắng sức có giá trị nhất."
