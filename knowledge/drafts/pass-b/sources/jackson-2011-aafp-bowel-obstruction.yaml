notes_vi: "Đã mở trang AAFP. Dấu hiệu chính của tắc ruột: đau bụng quặn cơn, buồn nôn, nôn; dính ruột sau mổ bụng chiếm khoảng 60% tắc ruột non. Bảng 1 (tắc ruột nói chung): thoát vị khoảng 10%, khối u khoảng 20%, xoắn ruột dưới 5%. Bài không có số độ nhạy, độ đặc hiệu."
