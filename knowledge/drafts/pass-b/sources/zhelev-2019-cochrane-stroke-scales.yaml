notes_vi: "Đã đọc tóm tắt qua Europe PMC (REST API). ROSIER ở khoa cấp cứu: độ nhạy gộp 0,88 (khoảng dự báo 0,75–0,95), tức bỏ sót trung bình 12% người đột quỵ hoặc cơn thiếu máu não thoáng qua; FAST có độ chính xác tương tự ROSIER; LAPSS trước viện độ nhạy 0,83."
