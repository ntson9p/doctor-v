notes_vi: "Lượt B chỉ đọc tóm tắt (Europe PMC). LR+: tiểu buốt 1,5; tiểu nhiều lần 1,8; tiểu máu 2,0; đau lưng 1,6; ấn đau góc sườn lưng 1,7. LR−: không tiểu buốt 0,5; không đau lưng 0,8. Có khí hư LR 0,3; ngứa rát âm đạo LR 0,2. Tiểu buốt kèm tiểu nhiều lần, không có khí hư hay ngứa rát: LR 24,6. Lượt B suy từ LR+ 1,5 và LR− 0,5: độ nhạy của tiểu buốt khoảng 75%."
