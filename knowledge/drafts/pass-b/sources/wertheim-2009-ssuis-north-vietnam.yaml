notes_vi: "Đã đọc toàn văn qua Europe PMC (PMC2696092). 50 ca nhiễm liên cầu lợn đầu tiên được phát hiện ở Bệnh viện Nhiệt đới Trung ương năm 2007 (phần lớn viêm màng não): nam 88%, nông dân 70%, tiếp xúc lợn 32%, uống nhiều rượu 26%; triệu chứng trung vị 4 ngày trước nhập viện; sốt 100%, đau đầu 92%, cứng gáy 88%, lú lẫn 46%, ban xuất huyết hoặc bầm 14%. Liên cầu lợn là căn nguyên hay gặp nhất của viêm màng não vi khuẩn ở người lớn tại đây."
