notes_vi: "Đã mở trực tiếp (trang rà soát lần cuối 21/9/2022). Đã đối chiếu: triệu chứng thường mơ hồ hoặc không có, nhiều đợt bệnh không được nhận ra; tiêu chuẩn tối thiểu (ấn đau khi lay cổ tử cung, ấn đau tử cung hoặc phần phụ); tiêu chuẩn bổ sung (nhiệt độ miệng trên 38,3°C, mủ nhầy cổ tử cung...); tiêu chí nhập viện (không loại trừ được cấp cứu ngoại khoa, áp xe vòi – buồng trứng, có thai, bệnh nặng, nôn, sốt trên 38,5°C); điều trị ngoại trú cho thể nhẹ – vừa, đánh giá lại sau 72 giờ; kiêng quan hệ đến khi điều trị xong; khám và điều trị bạn tình trong 60 ngày trước khởi phát."
