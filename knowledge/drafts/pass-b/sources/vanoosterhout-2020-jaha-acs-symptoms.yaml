notes_vi: "Đã đọc toàn văn (Europe PMC, bản mở). 27 nghiên cứu, hơn 1 triệu người hội chứng mạch vành cấp đã xác định (bệnh viện). Tỷ lệ gộp nam/nữ: đau ngực 79%/74%, vã mồ hôi 47%/44%, khó thở 40%/48%, đau tay hoặc vai trái 37%/38%, buồn nôn hoặc nôn 28%/39%. Nữ hay đau giữa hai bả vai, buồn nôn, khó thở hơn; đau thượng vị không khác theo giới."
