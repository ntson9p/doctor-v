notes_vi: "Đã mở trang (rà soát 16/01/2025). Triệu chứng: đau trong tai, sốt cao, nghe kém, chảy dịch tai; trẻ nhỏ hay dụi, kéo tai, quấy, ăn kém. Phần lớn đỡ trong 3 ngày, có khi đến 1 tuần. Tự chăm sóc: thuốc giảm đau, lau dịch tai bằng bông, không cho vật gì vào tai; trẻ dưới 16 tuổi không dùng aspirin. Khám bác sĩ nếu trẻ dưới 12 tháng hoặc đau không đỡ sau 3 ngày; khám gấp nếu sốt rất cao, sưng quanh tai, chảy dịch tai, nghe kém mới, nôn."
