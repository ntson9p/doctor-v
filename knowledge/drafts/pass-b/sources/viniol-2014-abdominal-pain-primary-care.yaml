notes_vi: "Đã đọc tóm tắt qua Europe PMC (REST API). 14 nghiên cứu ở chăm sóc ban đầu: đau bụng chiếm 2,8% lượt khám; khoảng 1/3 không rõ nguyên nhân; hay gặp: viêm dạ dày – ruột 7,2–18,7%, hội chứng ruột kích thích 2,6–13,2%, nguyên nhân tiết niệu 5,3%, viêm dạ dày 5,2%; khoảng 1/10 có bệnh cấp cần xử trí ngay (viêm ruột thừa 1,9%, viêm túi thừa 3,0%, mật – tụy 4,0%, ung thư 1,0%)."
