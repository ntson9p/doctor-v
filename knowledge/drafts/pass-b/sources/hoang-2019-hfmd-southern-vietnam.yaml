notes_vi: "Đã đọc toàn văn (PMC6403263) qua API Europe PMC. 1547 trẻ ở phòng khám ngoại trú và khoa nội trú của 3 bệnh viện tuyến cuối phía Nam, 7/2013–7/2015; tuổi trung vị khoảng 20 tháng; vào nghiên cứu khoảng ngày bệnh 1–2. Bảng 1, nhóm ngoại trú (n = 590): ban da 91,7% (trong đó 39,7% chủ yếu dạng dát), tổn thương miệng 85,8%, sốt 63,9%, sổ mũi 36,3%, ho 35,1%, nôn 24,6%, quấy khóc 24,6%, giật mình 10,8%, tiêu chảy 5,6%, đau đầu 5,5%, viêm kết mạc 2%; nhiệt độ trung vị lúc khám 37,0°C. Đợt dịch 2011–2012 có khoảng 200.000 ca nhập viện, phần lớn ở miền Nam."
