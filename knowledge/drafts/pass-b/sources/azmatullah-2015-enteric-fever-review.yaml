notes_vi: "Đã đọc toàn văn qua Europe PMC (PMC4672836). 180 báo cáo, 96% ở bệnh viện. Bảng 1 (người lớn): sốt 98%, đau đầu 63%, ho 41%, buồn nôn hoặc nôn 49%, tiêu chảy 46%, đau hoặc ấn đau bụng 54%, ban hồng 8%, thay đổi ý thức 29%; trẻ dưới 5 tuổi đau đầu 14%, đau bụng 20%. Bảng 3 (trẻ em, 6 nghiên cứu ngoại trú hoặc cộng đồng): đau đầu 46%, đau bụng 50%, buồn nôn hoặc nôn 23%, tiêu chảy 10%, bệnh dưới 1 tuần 36%. Sốt kiểu bậc thang chỉ có ở 25% người lớn."
