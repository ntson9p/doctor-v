notes_vi: "Lượt B chỉ đọc tóm tắt trên Europe PMC. Hồi cứu phụ nữ từ 15 tuổi đến cấp cứu với nước tiểu có bạch cầu và nghi viêm thận – bể thận: 103 người có sốt (từ 37,8°C) và 201 người không sốt. Nhóm không sốt hay có chẩn đoán khác hơn (viêm túi mật, viêm vùng chậu, viêm túi thừa); giá trị dự báo dương của định nghĩa lâm sàng là 0,98 khi có sốt và 0,84 khi không sốt."
