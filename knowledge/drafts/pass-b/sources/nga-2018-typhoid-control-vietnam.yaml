notes_vi: "Đã đọc toàn văn qua Europe PMC (PMC6128360). Tổng quan dịch tễ thương hàn ở Việt Nam trong 20 năm: tỷ lệ mắc toàn quốc ước khoảng 14,7/100.000 dân/năm quanh năm 2000 và giảm mạnh từ 1999; Huế 2002–2004 khoảng 21–24/100.000; tỷ lệ cấy máu dương tính S. Typhi tại Bệnh viện Bệnh Nhiệt đới TP.HCM giảm rõ đến 2015. Tác giả coi thương hàn gần như đã được loại trừ ở Việt Nam. Bài tổng quan, không phải số liệu giám sát mới."
