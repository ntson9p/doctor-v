notes_vi: "Đã đọc bản văn bản qua API của kho IRIS (WHO). Nghiên cứu tiến cứu tại Bệnh viện Nhi Trung ương (Hà Nội) 2002–2003, 533 trẻ dưới 2 tuổi bị lồng ruột (tuổi trung vị 9,3 tháng, nam 65%). Bảng 3 (Hà Nội): đau bụng hoặc biểu hiện tương đương 100% (Melbourne 94%); nôn không có mật 61%, nôn ra dịch mật 30%; chảy máu qua hậu môn 47%; phân như mứt dâu 15%; máu khi thăm trực tràng 55%; sờ thấy khối lồng 82%; chướng bụng 17%; da xanh tái 52%; li bì 38%; sốc 1%."
