notes_vi: "Đã đọc tóm tắt qua Europe PMC (REST API). Tỷ suất mới mắc khoảng 9,1/100.000 người-năm (Nhật Bản 22,7; Phần Lan 19,7); so với nhóm 45–55 tuổi, dưới 25 tuổi chỉ bằng 0,1 lần, trên 85 tuổi 1,6 lần; nữ cao hơn nam 1,24 lần, bắt đầu từ khoảng 55 tuổi."
