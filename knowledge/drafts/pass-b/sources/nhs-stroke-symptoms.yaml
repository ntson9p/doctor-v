notes_vi: "Đã mở trực tiếp; rà soát lần cuối 12/9/2024. Nhận biết bằng FAST: méo mặt, yếu tay, nói khó, gọi cấp cứu ngay. Triệu chứng khác: yếu hoặc tê một bên người, nhìn mờ hoặc mất thị lực, lú lẫn, chóng mặt hoặc ngã, đau đầu dữ dội, buồn nôn hoặc nôn. Gọi 999 kể cả khi triệu chứng đã tự hết; không tự lái xe đến viện."
