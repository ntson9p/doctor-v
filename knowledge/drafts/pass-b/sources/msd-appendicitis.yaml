notes_vi: "Đã mở trang (rà soát toàn bộ 7/2024). Kinh điển: đau thượng vị hoặc quanh rốn, sau đó buồn nôn, nôn, chán ăn; sau vài giờ đau chuyển xuống hố chậu phải; đau tăng khi ho và cử động. Hơn 50% người bệnh có biểu hiện khác kiểu kinh điển. Sốt nhẹ (37,7–38,3°C) thường gặp. Có thể có hồng cầu, bạch cầu trong nước tiểu. Đi ngoài thường ít đi hoặc không đi; tiêu chảy gợi ý ruột thừa sau manh tràng. Trẻ nhỏ đau có thể không khu trú; người già, phụ nữ có thai hay không điển hình. Hay gặp nhất ở tuổi vị thành niên và 20–29 tuổi."
