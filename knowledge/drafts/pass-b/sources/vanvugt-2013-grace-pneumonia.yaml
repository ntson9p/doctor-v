notes_vi: "Đã đọc toàn văn (PMC3639712) qua API Europe PMC. 2820 người lớn ho cấp ở tuyến ban đầu châu Âu, 140 người (5%) viêm phổi trên phim. Bảng 1, ở người viêm phổi: có đờm 86%, khó thở 69%, sốt (bệnh sử) 59%, đau ngực 57%, không sổ mũi 44% (tức có sổ mũi khoảng 56%), tiêu chảy 11%."
