notes_vi: "Lượt B chỉ đọc được tóm tắt (Europe PMC REST API); tóm tắt không có số liệu. Các LR của bài này được đọc qua Bảng 1 của snyder-2018-aafp-appendicitis. Tóm tắt nêu: dấu hiệu cơ thắt lưng chậu (psoas), sốt, đau di chuyển xuống hố chậu phải làm tăng khả năng viêm ruột thừa; nôn trước khi đau làm giảm khả năng; không có đau di chuyển, không đau hố chậu phải, không có phản ứng thành bụng hoặc không sốt làm giảm khả năng."
