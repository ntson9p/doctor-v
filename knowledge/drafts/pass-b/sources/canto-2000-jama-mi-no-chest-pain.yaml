notes_vi: "Đã đọc tóm tắt qua Europe PMC (REST API). Sổ bộ NRMI-2 (434.877 người nhồi máu cơ tim): 33% không đau ngực khi đến viện; nhóm này lớn tuổi hơn (74,2 so với 66,9), nhiều nữ hơn (49% so với 38%), nhiều đái tháo đường hơn (32,6% so với 25,4%), đến viện muộn hơn (7,9 so với 5,3 giờ) và tử vong trong viện cao hơn (23,3% so với 9,3%)."
