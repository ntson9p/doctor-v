notes_vi: "Đã đọc trên PMC. Số liệu 10.023 vụ dịch viêm dạ dày – ruột cấp báo cáo cho CDC (NORS 2009–2012). Bảng 1, trung vị tỷ lệ ca trong mỗi vụ: do norovirus đã xác nhận: nôn 72%, tiêu chảy 86%, sốt 22%, phân có máu 0%, thời gian bệnh 48 giờ; do vi khuẩn hoặc tác nhân không phải vi rút: nôn 39%, tiêu chảy 100%, sốt 58%, phân có máu 30%, thời gian bệnh 144 giờ."
