notes_vi: "Đã đọc tóm tắt qua Europe PMC (REST API). Nghiên cứu cộng đồng, 867 người đột quỵ giao tiếp được: 28% đau đầu lúc khởi phát; yếu tố liên quan: tuổi trẻ hơn, nữ, xuất huyết não (OR 2,8), vùng động mạch sống – nền (OR 1,7), bệnh tim thiếu máu cục bộ; đau đầu khu trú một bên ở 46%, cùng bên tổn thương ở 68% số này."
