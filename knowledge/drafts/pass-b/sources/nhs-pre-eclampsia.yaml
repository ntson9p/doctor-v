notes_vi: "Đã mở trực tiếp; rà soát lần cuối 23/3/2026. Hay gặp từ tuần 20 của thai kỳ, có thể xuất hiện vài ngày đến vài tuần sau sinh. Triệu chứng: đau đầu dữ dội không đỡ khi dùng thuốc giảm đau thông thường, nhìn mờ hoặc thấy chớp sáng, đau dưới sườn, phù mặt, tay hoặc chân đột ngột, ợ nóng không đỡ khi dùng thuốc, nôn, thấy rất mệt. Các triệu chứng này cần được kiểm tra ngay (gọi khoa sản, hoặc 111)."
