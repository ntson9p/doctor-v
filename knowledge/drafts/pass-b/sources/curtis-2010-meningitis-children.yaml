notes_vi: "Lượt B chỉ đọc tóm tắt trên Europe PMC. Tổng quan 10 nghiên cứu tiến cứu ở trẻ em: bệnh sử thóp phồng (LR 8,0), cứng gáy (LR 7,7), co giật ngoài tuổi co giật do sốt (LR 4,4), bú kém (LR 2,0) làm tăng khả năng viêm màng não vi khuẩn; khám thấy thóp phồng LR 3,5, cứng gáy LR 4,0; không sốt không loại trừ được bệnh (LR 0,70)."
