notes_vi: "Đã đọc tóm tắt qua Europe PMC (REST API). 740 người dân Đan Mạch, phỏng vấn và khám. Đau nửa đầu: theo nhịp mạch 78%, nặng 85%, một bên 62%, tăng khi vận động 96%. Đau đầu căng thẳng: ép chặt 78%, nhẹ hoặc vừa 99%, hai bên 90%, 72% không tăng khi vận động. Buồn nôn, sợ ánh sáng, tiếng ồn hay gặp và nặng ở đau nửa đầu; nếu có ở đau đầu căng thẳng thì thường nhẹ."
