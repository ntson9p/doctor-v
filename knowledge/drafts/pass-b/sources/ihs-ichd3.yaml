notes_vi: "Đã mở trực tiếp các trang 1.1 (đau nửa đầu không tiền triệu), 1.2 (có tiền triệu) và 2.2 (đau đầu căng thẳng từng đợt thường xuyên). Đã đối chiếu tiêu chuẩn: đau nửa đầu cơn 4–72 giờ (trẻ dưới 18 tuổi 2–72 giờ), ít nhất 2 trong 4 đặc điểm (một bên, theo nhịp mạch, vừa hoặc nặng, tăng khi vận động thường ngày), kèm buồn nôn/nôn hoặc sợ cả ánh sáng lẫn tiếng ồn; trẻ em hay đau hai bên hơn; tiền triệu thị giác gặp ở trên 90% người đau nửa đầu có tiền triệu. Đau đầu căng thẳng: 30 phút đến 7 ngày, ít nhất 2 trong 4 đặc điểm (hai bên, ép chặt, nhẹ hoặc vừa, không tăng khi vận động), không buồn nôn hay nôn, nhiều nhất một trong sợ ánh sáng hoặc sợ tiếng ồn."
