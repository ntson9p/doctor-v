notes_vi: "Đã đọc toàn văn (Europe PMC). 220 người viêm tụy cấp tại khoa Tiêu hóa Bệnh viện Chợ Rẫy (11/2023–6/2024), tuổi trung bình 47,3; nam 62,3%. Nguyên nhân: rượu 28,2%, sỏi mật 25,0%, tăng triglycerid 23,6%, rượu kèm tăng triglycerid 14,1%, khác 9,1%. Tiền sử dùng rượu 54,1%, hút thuốc 52,3%, đái tháo đường 26,8%. Thể nặng 25%; tử vong 7,3%."
