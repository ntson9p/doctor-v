notes_vi: "Lượt B chỉ đọc tóm tắt (Europe PMC). 336 trẻ 4–16 tuổi có triệu chứng được nội soi tại hai bệnh viện nhi tuyến cuối ở TP.HCM (2019–2021): nhiễm H. pylori 80%; loét dạ dày – tá tràng 19%, tăng theo tuổi. Đây là trẻ được chuyển nội soi nên tỷ lệ cao hơn nhiều so với trẻ đau bụng ở cộng đồng."
