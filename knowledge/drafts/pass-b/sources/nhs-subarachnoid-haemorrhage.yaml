notes_vi: "Đã mở trực tiếp; rà soát lần cuối 04/9/2025. Triệu chứng: đau đầu cực kỳ dữ dội, bắt đầu đột ngột và không hết; đau cổ hoặc cứng gáy; buồn nôn, nôn; rất sợ ánh sáng; co giật; ngất, lơ mơ hoặc lú lẫn; méo mặt, nói ngọng hoặc yếu một bên; nhìn mờ hoặc mất thị lực. Gọi 999; không tự lái xe đến viện."
