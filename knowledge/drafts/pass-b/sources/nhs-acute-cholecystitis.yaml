notes_vi: "Trang rà soát lần cuối 21/02/2023. Đau đột ngột, dữ dội ở bụng trên bên phải, lan về phía vai phải, thường kéo dài không hết sau vài giờ; có thể sốt, buồn nôn, nôn, vàng da. Nên đi khám càng sớm càng tốt khi đau bụng đột ngột và dữ dội; nhiều khả năng phải nhập viện. Sỏi mật gặp ở hơn 1/10 người lớn ở Anh."
