notes_vi: "Lượt B đọc tóm tắt và phần kết quả trên Europe PMC (PMC4073838). Tổng quan hệ thống và phân tích gộp: tỷ lệ gộp người bệnh làm nghề liên quan đến lợn 38,1%, có ăn thực phẩm nguy cơ cao (tiết canh, thịt lợn chưa chín) 37,3%; thể bệnh chính là viêm màng não (68,0%), sau đó là nhiễm khuẩn huyết; giảm thính lực 39,1%. Đến cuối 2012 có 1.584 ca được báo cáo, chủ yếu ở Thái Lan (36%), Việt Nam (30%), Trung Quốc (22%); 76,6% là nam."
