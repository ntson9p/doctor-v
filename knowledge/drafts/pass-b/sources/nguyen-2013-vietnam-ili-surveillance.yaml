notes_vi: "Chỉ đọc tóm tắt (qua API Europe PMC). Hệ thống giám sát cúm quốc gia, 15 điểm canh gác: 29.804 người có hội chứng giống cúm (sốt kèm ho hoặc đau họng, khởi phát trong 3 ngày), 22% dương tính với cúm; trẻ tuổi đi học có tỷ lệ dương tính cao nhất (29%). Cúm lưu hành quanh năm, có thể có nhiều đỉnh trong năm."
