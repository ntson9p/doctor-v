notes_vi: "Đã đọc toàn văn (Europe PMC, bản mở). 1.999 người lớn tỉnh táo, không có dấu hiệu thần kinh khu trú, đau đầu đạt đỉnh trong 1 giờ, tại 6 khoa cấp cứu Canada; 130 người xuất huyết dưới nhện. Bảng 2 (xuất huyết dưới nhện so với không): đau đầu dữ dội nhất đời 93,1% so với 77,5%; thời gian đến đỉnh trung bình 3,4 so với 9,2 phút; mất ý thức 16,9% so với 4,5%; than đau hoặc cứng cổ 71,1% so với 30,9%; nôn 58,6% so với 26,3%; khởi phát khi gắng sức 23,1%; cứng gáy khi khám 30,4%; nhiệt độ trung bình 36,3 so với 36,4°C; huyết áp trung bình 159/88 so với 141/81 mmHg."
