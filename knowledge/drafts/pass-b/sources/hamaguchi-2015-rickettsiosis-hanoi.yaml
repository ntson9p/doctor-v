notes_vi: "Đã đọc toàn văn qua Europe PMC (PMC4426587). 579 người từ 15 tuổi nằm viện Bạch Mai (2001–2003) vì sốt không rõ ổ, nghi bệnh do rickettsia; 237 người sốt mò. Bảng 1 (sốt mò): nhập viện mùa mưa tháng 5–10 là 74,7% (nhóm không do rickettsia 49,0%); nghề phơi nhiễm cao 61,2%; sốt trên 7 ngày 76,0%; đau đầu 70,5%; đau cơ 67,9%; rét run 82,3%; ho 43,9%; phát ban 31,2%; nổi hạch 64,1%; vết loét 62,9%."
