notes_vi: "Đã đọc toàn văn (PMC9121352) qua API Europe PMC. Dữ liệu đến 6/2021 (trước Omicron), chủ yếu ở khoa cấp cứu và điểm xét nghiệm. Độ nhạy gộp: ho 62,4%; sốt 37,6%; mệt 40,2%; đau cơ 37,5%; đau đầu 35,8%; đau họng 31,0%; chảy nước mũi 30,3%; khó thở 23,3%; tiêu chảy 18,5%; mất ngửi 26,4% (độ đặc hiệu 94,2%); mất ngửi hoặc mất vị 39,2% (độ đặc hiệu 92,1%). Ở trẻ em, đau đầu, đau cơ và mệt có độ nhạy thấp hơn người lớn."
