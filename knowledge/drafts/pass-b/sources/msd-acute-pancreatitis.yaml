notes_vi: "Đã mở trang (rà soát toàn bộ 8/2026). Nguyên nhân: sỏi mật 40–70%, rượu 25–35%, tăng triglycerid khoảng 1–4%. Đau vùng thượng vị hoặc hạ sườn trái, liên tục, thường dữ dội; khởi phát đột ngột khi do sỏi, tăng dần trong vài ngày khi do rượu; kéo dài vài ngày; có thể lan ra sau lưng; ho, cử động mạnh, hít sâu làm đau tăng; ngồi cúi ra trước có thể đỡ. Buồn nôn, nôn thường gặp; trên 60% có sốt; đôi khi vàng mắt; có thể chướng bụng; thể vừa và nặng có thể mạch nhanh, thở nhanh, tụt huyết áp. Thể hoại tử khoảng 5–10%."
