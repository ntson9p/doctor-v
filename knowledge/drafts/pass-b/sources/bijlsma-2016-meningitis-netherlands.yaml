notes_vi: "Lượt B chỉ đọc tóm tắt trên Europe PMC. 1.412 đợt viêm màng não vi khuẩn ở người lớn Hà Lan (2006–2014): tỷ lệ mắc giảm từ 1,72 xuống 0,94/100.000 người lớn mỗi năm; phế cầu 72%; tử vong 17%. Dùng để ước lượng thứ bậc độ lớn của prior ở người lớn."
