notes_vi: "Đã mở trang (rà soát toàn bộ 7/2026). Ủ bệnh 24–72 giờ; khởi đầu bằng ngứa hoặc đau họng, rồi hắt hơi, chảy mũi, nghẹt mũi, mệt; có thể đau đầu, đau cơ nhẹ. Nhiệt độ thường bình thường, trẻ lớn và người lớn ít khi sốt nhẹ. Dịch mũi lúc đầu trong, có thể đặc, đục; dịch đục không có nghĩa là bội nhiễm vi khuẩn. Ho thường nhẹ nhưng hay kéo dài sang tuần thứ hai; phần lớn triệu chứng hết trong 10 ngày. Kháng sinh không dùng cho cảm lạnh."
