notes_vi: "Trang rà soát lần cuối 21/12/2023. Ở người lớn và trẻ em, tiêu chảy thường hết trong 5–7 ngày, nôn thường hết trong 1–2 ngày; nguyên nhân hay gặp là nhiễm vi rút đường ruột và ngộ độc thực phẩm. Tự chăm sóc: uống nhiều nước (từng ngụm nhỏ nếu buồn nôn), dung dịch bù nước theo tư vấn dược sĩ, nghỉ học, nghỉ làm đến khi hết nôn và tiêu chảy 2 ngày. Gọi 111 khi nôn liên tục không giữ được nước, tiêu chảy có máu, trẻ dưới 5 tuổi có dấu hiệu mất nước, tiêu chảy quá 7 ngày hoặc nôn quá 2 ngày. Gọi 999 hoặc đến cấp cứu khi nôn ra máu hoặc bã cà phê, nôn dịch xanh (người lớn), cứng gáy kèm sợ ánh sáng, đau bụng đột ngột dữ dội."
