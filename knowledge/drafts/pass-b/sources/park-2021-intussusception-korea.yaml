notes_vi: "Đã đọc toàn văn (Europe PMC). 536 trẻ dưới 15 tuổi lồng ruột hồi – đại tràng tại khoa cấp cứu ở Hàn Quốc (2008–2019), tuổi trung vị 19 tháng. Đau từng cơn hoặc quấy khóc từng cơn 77,4%; nôn 46,1% (dưới 1 tuổi 71,8%, 1–2 tuổi 42,8%, từ 2 tuổi 24,0%); phân có máu 23,1% (44,8%, 18,2%, 6,9%); tiêu chảy 17,2%, 11,2%, 9,7%; sốt 12,1%, 16,0%, 16,6%; li bì 25,9%, 8,6%, 9,1%; đủ bộ ba kinh điển 9,3%. Thời gian từ khởi phát: dưới 6 giờ 33,8%, trên 24 giờ 16,8%, trung vị 11 giờ."
