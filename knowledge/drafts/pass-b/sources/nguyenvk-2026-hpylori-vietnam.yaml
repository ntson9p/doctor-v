notes_vi: "Lượt B chỉ đọc tóm tắt (Europe PMC). 25 nghiên cứu (8204 người lớn, 4641 trẻ em): tỷ lệ nhiễm H. pylori gộp 58,7% ở người lớn và 77,2% ở trẻ em; dị biệt lớn giữa các nghiên cứu, cao hơn ở nhóm thành thị và nhóm đi khám."
