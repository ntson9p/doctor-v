notes_vi: "Đã mở trang (rà soát toàn bộ 10/2025). Đau và ấn đau hạ sườn phải, đạt đỉnh trong 15–60 phút và kéo dài trên 6 giờ (dài và nặng hơn cơn đau quặn mật), có thể lan ra bả vai phải hoặc lưng; đôi khi kèm sốt, rét run, buồn nôn, nôn; nôn được mô tả là thường gặp; sốt thường nhẹ, có khi không sốt (nhất là người già). Từ 90% trở lên có sỏi túi mật; phần lớn đã từng có cơn đau quặn mật hoặc viêm túi mật. Khoảng 10% thủng nếu không điều trị; tử vong khi thủng túi mật đến 16%. Cần nhập viện."
