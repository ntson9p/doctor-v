notes_vi: "Đã đọc toàn văn qua Europe PMC (PMC10405448). Dẫn số liệu ca bệnh toàn quốc của Viện Sốt rét – Ký sinh trùng – Côn trùng Trung ương: năm 2020 làm 1.811.387 xét nghiệm, phát hiện 1.421 ca (303 ca ngoại lai); 12.498 ca giai đoạn 2017–2020 và 467 ca năm 2021. 72,3% ca có tiền sử đi lại liên quan trong 14 ngày trước khi phát hiện; 62,3% là ca nội địa."
