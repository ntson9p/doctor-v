notes_vi: "Chỉ đọc tóm tắt (qua API Europe PMC). 469 trẻ 6–35 tháng được cha mẹ nghi viêm tai giữa: 237 trẻ (50%) có viêm tai giữa cấp. Sốt (RR 1,2), nhiệt độ cao nhất, dụi tai, ngủ không yên, triệu chứng hô hấp hoặc tiêu hóa đều không dự đoán được bệnh; chỉ soi màng nhĩ mới phân biệt được."
