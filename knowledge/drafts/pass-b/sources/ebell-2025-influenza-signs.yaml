notes_vi: "Đã đọc toàn văn (PMC11877276) qua API Europe PMC. 67 nghiên cứu, phần lớn tuyển người có triệu chứng giống cúm hoặc nhiễm trùng hô hấp cấp ở ngoại trú. Bảng 3 (độ nhạy): ho 0,92; sốt tự cảm thấy hoặc đo 0,87; viêm mũi (coryza) 0,76; chảy nước mũi 0,70; nghẹt mũi 0,69; mệt 0,69; đau đầu 0,65; rét run 0,61; đau cơ 0,59; đau họng 0,57; chán ăn 0,51; đau khớp 0,29; đau ngực 0,25; tiêu chảy 0,14; phát ban 0,04. Mệt kém nhạy ở trẻ dưới 5 tuổi (0,27) so với người lớn (0,82); mệt và đau cơ kém nhạy ở trẻ nhỏ."
