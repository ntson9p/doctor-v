notes_vi: "Đã đọc tóm tắt (qua API Europe PMC). 1152 người có hội chứng giống cúm ở phòng khám tuyến ban đầu công và tư tại TP.HCM: 322 cúm A và 136 cúm B (khoảng 40%); 193 người có vi rút hô hấp khác, hay gặp nhất là rhinovirus. Cúm có mặt trong 81% số tuần, các đỉnh không cố định theo mùa. Kháng sinh được dùng ở 50,3% số ca."
