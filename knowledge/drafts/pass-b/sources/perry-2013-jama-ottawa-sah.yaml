notes_vi: "Đã đọc tóm tắt qua Europe PMC (REST API). 2.131 người lớn đau đầu đạt đỉnh trong 1 giờ, khám thần kinh bình thường, tại 10 khoa cấp cứu: 6,2% xuất huyết dưới nhện. Quy tắc Ottawa: từ 40 tuổi, đau hoặc cứng cổ, mất ý thức có người chứng kiến, khởi phát khi gắng sức, đau đạt đỉnh tức thì, hạn chế cúi cổ."
