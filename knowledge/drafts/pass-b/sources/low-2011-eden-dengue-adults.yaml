notes_vi: "Đã đọc toàn văn qua Europe PMC (PMC3104968). Nghiên cứu EDEN: 2.129 người lớn sốt dưới 72 giờ đến phòng khám ban đầu ở Singapore (2005–2010); 250 người (11,7%) mắc dengue. Bảng 3: tần suất triệu chứng ở dengue so với bệnh sốt khác (đau đầu 80,0% so với 68,7%; đau khớp 60,8% so với 42,6%; đau sau hốc mắt 26,0% so với 15,9%; phát ban 9,6% so với 3,6%; chảy máu 5,2% so với 1,8%). Bảng 7: tần suất theo nhóm tuổi."
