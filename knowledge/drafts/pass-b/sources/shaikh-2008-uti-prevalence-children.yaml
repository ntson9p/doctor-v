notes_vi: "Lượt B chỉ đọc tóm tắt trên Europe PMC. Phân tích gộp 18 nghiên cứu: nhiễm khuẩn tiết niệu ở 7,0% trẻ nhũ nhi bị sốt; trẻ gái sốt 0–3, 3–6, 6–12 tháng và trên 12 tháng lần lượt 7,5%, 5,7%, 8,3% và 2,1%; trẻ trai dưới 3 tháng chưa cắt bao quy đầu 20,1%, đã cắt 2,4%. Số liệu chủ yếu từ các nước phương Tây."
