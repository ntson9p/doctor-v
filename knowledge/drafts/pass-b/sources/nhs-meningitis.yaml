notes_vi: "Đã mở trực tiếp trang (rà soát lần cuối 12/6/2026). Triệu chứng có thể xuất hiện theo bất kỳ thứ tự nào và không phải ai cũng có đủ: sốt, tay chân rất lạnh, cứng gáy, đau khớp và cơ, đau đầu dữ dội tăng dần, đau mắt khi nhìn ánh sáng, co giật, nôn và tiêu chảy, lú lẫn, ngủ li bì khó đánh thức, nốt hoặc ban không mất khi ấn thành ly. Trẻ dưới 5 tuổi: thóp phồng, bỏ bú, người cứng hoặc mềm nhũn. Khuyên gọi 999 hoặc đến cấp cứu ngay, không tự lái xe."
