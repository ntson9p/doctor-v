notes_vi: "Đã mở trực tiếp trang (cập nhật 20/3/2024). Sốt rét chưa biến chứng: sốt, rét run, vã mồ hôi, đau đầu, buồn nôn và nôn, đau mỏi người, mệt; khám có thể thấy vàng da nhẹ, gan lách to, thở nhanh. Thời gian ủ bệnh thường 7–30 ngày. Trang không nêu tần suất của từng triệu chứng."
