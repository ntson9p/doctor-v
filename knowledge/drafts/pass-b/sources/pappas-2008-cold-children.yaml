notes_vi: "Chỉ đọc tóm tắt (qua API Europe PMC). 81 đợt cảm lạnh ở trẻ tuổi đi học (nhật ký 10 ngày): hay gặp nhất là ho, hắt hơi, nghẹt mũi, sổ mũi; cảm giác sốt và đau đầu mỗi thứ chỉ khoảng 15% lúc khởi phát; 73% trẻ vẫn còn triệu chứng sau 10 ngày."
