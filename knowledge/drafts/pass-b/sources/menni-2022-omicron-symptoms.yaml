notes_vi: "Đã đọc toàn văn (PMC8989396) qua API Europe PMC. Người tự báo triệu chứng qua ứng dụng ở cộng đồng (Anh), đã tiêm vắc xin, 16–99 tuổi. Giai đoạn Omicron (n = 4990): chảy nước mũi 76,5%, đau đầu 74,7%, đau họng 70,5%, hắt hơi 63,0%, ho kéo dài 49,8%, khàn tiếng 42,6%, mất ngửi 16,7% (giai đoạn Delta 52,7%). Thời gian có triệu chứng trung bình 6,9 ngày."
