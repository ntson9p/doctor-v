notes_vi: "Đã đọc toàn văn (PMC11462790) qua API Europe PMC. Ngoại trú nhiễm trùng hô hấp trên ở Kuala Lumpur (Malaysia), trước COVID-19, chủ yếu người lớn. Bảng 1, coronavirus gây cảm lạnh (n = 205): ho 85,9%, chảy mũi 84,9%, đau họng 72,2%, hắt hơi 70,7%, nghẹt mũi 60,5%, đau cơ 57,6%, đau đầu 56,6%, sốt 46,8%. Cúm (n = 417): sốt 83,0%, ho 84,7%, chảy mũi 59,0%, đau họng 44,6%, nghẹt mũi 39,6%, đau cơ 19,4%, đau đầu 9,8% (hồi cứu, tỷ lệ đau đầu, đau cơ thấp bất thường)."
