notes_vi: "Đã tải và đọc PDF toàn văn (thư viện điện tử Bệnh viện Đa khoa Trung ương Thái Nguyên). Trang quyết định: số 315/QĐ-BYT, Hà Nội ngày 29/01/2015, Thứ trưởng Nguyễn Viết Tiến ký. Đã đối chiếu các bài Tiền sản giật – sản giật (tr. 29–34), Viêm phần phụ (tr. 128–131), Chửa ngoài tử cung (tr. 135–140). Văn bản không có bài đau bụng kinh. Lưu ý: Bộ Y tế đã ban hành Quyết định 1154/QĐ-BYT ngày 04/5/2024 về sàng lọc, chẩn đoán và xử trí tăng huyết áp ở phụ nữ mang thai, tiền sản giật và sản giật (xác nhận qua công văn 170/SYT-NVYD ngày 13/01/2025 của Sở Y tế Khánh Hòa); chưa mở được toàn văn 1154, có thể thay thế bài tiền sản giật của 315."
