notes_vi: "Đã đọc bản PDF (bản in NXB Y học 2012, do vnras.com đăng lại; phông chữ TCVN3 được chuyển sang Unicode để đọc). Trang quyết định ghi số 4235/QĐ-BYT, Hà Nội ngày 31/10/2012 (vnras ghi nhầm 31/12/2012). Bài 'Viêm phổi mắc phải ở cộng đồng' (tr. 34–37): khởi phát đột ngột, sốt cao 39–40°C, rét run; đau ngực; ho mới, tăng dần, ho khan rồi có đờm; có khi nôn, chướng bụng, đau bụng; khó thở khi tổn thương lan tỏa; người cao tuổi triệu chứng không rầm rộ, có khi khởi đầu bằng lú lẫn; CURB65 0–1 điểm điều trị ngoại trú. URL là trang thứ cấp, cần thay bằng bản chính thức. Theo docs/research/vietnam-sources.md, phần COPD đã bị bãi bỏ (thay bằng 2767/QĐ-BYT năm 2023); lượt B chưa kiểm tra văn bản thay thế bài viêm phổi."
