notes_vi: "Đã mở trực tiếp (rà soát toàn bộ và cập nhật 7/2026; tác giả Anna Maya Powell). Dữ kiện dùng: hay gặp ở phụ nữ trẻ, hiếm trước kỳ kinh đầu, sau mãn kinh và khi có thai; triệu chứng thường gặp là sốt, đau bụng dưới, khí hư, ra máu bất thường; ít gặp hơn là đau khi giao hợp, tiểu đau, đau bụng trên, buồn nôn, nôn; nhiều người không có hoặc chỉ có triệu chứng nhẹ; áp xe vòi – buồng trứng ở khoảng 15%; yếu tố nguy cơ: dưới 25 tuổi, bạn tình mới trong 12 tháng hoặc từ 2 bạn tình."
