notes_vi: "Đã đọc toàn văn (Europe PMC). 1040 người lớn ở khoa cấp cứu được chụp CT vì nghi sỏi (đã loại người có sốt hoặc bạch cầu niệu), 515 người có sỏi niệu quản gây triệu chứng. Lượt B tính từ Bảng 2 (tỷ lệ trong số người có sỏi): đau dưới 6 giờ khoảng 57%, 6–24 giờ khoảng 27%, trên 1 tuần khoảng 4%; khởi phát đột ngột khoảng 82%; đau dữ dội (7–10/10) khoảng 86%; đau không liên tục khoảng 57%; lan xuống bẹn khoảng 44%; buồn nôn khoảng 77% (có nôn khoảng 43%); tiểu máu nhìn thấy khoảng 27%; tiểu buốt khoảng 25%; đau lưng khoảng 26%; đau khi cử động khoảng 18%; tiêu chảy khoảng 4%; tiền sử sỏi khoảng 38%; nam khoảng 72%; hồng cầu niệu khoảng 92%. Một vài số trong Bảng 2 không khớp tổng nên chỉ dùng làm ước lượng."
