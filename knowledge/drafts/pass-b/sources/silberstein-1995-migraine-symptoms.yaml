notes_vi: "Đã đọc tóm tắt qua Europe PMC (REST API). Khảo sát qua điện thoại 500 người tự báo đau nửa đầu: buồn nôn ở trên 90% (gần 1/3 có trong mọi cơn); nôn ở gần 70% (gần 1/3 trong số này nôn ở phần lớn các cơn); vấn đề thị lực nằm trong các triệu chứng hay gặp nhất."
