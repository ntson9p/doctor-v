notes_vi: "Đã đọc trên PMC. Giám sát tại bệnh viện, trẻ dưới 2 tuổi ở Bangladesh, Nepal, Pakistan, Việt Nam. Việt Nam: tuổi trung vị 12 tháng (8–17), 55% ở năm thứ hai; nôn 76%, phân có máu 20%, sốt 16%, tiêu chảy 5%, táo bón 2%; nam 60%; 99% tháo lồng bằng thụt hơi hoặc nước, 1% phải mổ; không có tử vong. Chung 4 nước: nôn 77%, phân có máu 37%, sốt 21%, tiêu chảy 12%."
