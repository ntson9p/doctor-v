notes_vi: "Đã đọc toàn văn trên PMC. Nghiên cứu bậc 1 duy nhất (O'Shea 1988, trẻ đau bụng đến cấp cứu, không chọn lọc): tỷ lệ viêm ruột thừa 10%; sốt độ nhạy 0,75 (LR+ 3,4; LR− 0,32), nôn 0,79, tiêu chảy 0,33, buồn nôn 0,29, chán ăn 0,21. Đau quanh rốn chuyển xuống hố chậu phải LR 1,9–3,1 (độ nhạy 0,45–0,68); đau hố chậu phải LR+ 1,2, LR− 0,56; đau khi gõ, nhảy, ho độ nhạy 0,78; đi lại khó khăn 0,80 (Kharbanda 2005). Thời gian đau trên hay dưới 24 giờ không làm thay đổi khả năng. Trẻ dưới 4 tuổi phần lớn đã thủng ruột thừa khi được chẩn đoán."
