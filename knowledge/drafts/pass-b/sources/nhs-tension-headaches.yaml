notes_vi: "Đã mở trực tiếp; rà soát lần cuối 01/8/2025. Đau hai bên đầu, mặt hoặc cổ, cảm giác bị ép hoặc thắt chặt quanh đầu; kéo dài ít nhất 30 phút, có khi vài ngày. Liên quan căng thẳng, rối loạn giấc ngủ, cà phê. Dùng thuốc giảm đau quá thường xuyên có thể gây đau đầu do lạm dụng thuốc. Khám bác sĩ nếu đau nhiều lần mỗi tuần, đau nặng, hoặc có đau theo nhịp mạch một bên, buồn nôn, nôn, sợ ánh sáng, tiếng ồn (gợi ý đau nửa đầu)."
