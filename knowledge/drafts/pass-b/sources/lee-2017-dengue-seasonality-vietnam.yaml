notes_vi: "Đã đọc toàn văn qua Europe PMC (PMC5359841). Số liệu giám sát ca bệnh theo tháng 1994–2013 ở Hà Nội, Khánh Hòa, TP.HCM, An Giang. Bảng 2: tỷ số tỷ lệ mắc theo tháng so với tháng 2 (Hà Nội: tháng 10 gấp 55 lần; Khánh Hòa: tháng 10 gấp 2,7 lần; TP.HCM: tháng 10 gấp 2,4 lần; An Giang: tháng 9 gấp 5,3 lần). Tỷ lệ mắc trung bình ở Hà Nội thấp hơn 3–7 lần so với 3 tỉnh còn lại."
