notes_vi: "Đã mở trang (rà soát toàn bộ 1/2025). Chỉ khoảng một nửa người bệnh có kiểu triệu chứng điển hình; nhiều người, nhất là người già, ít hoặc không có triệu chứng. Đau thường ở thượng vị, rát hoặc cồn cào, đỡ khi ăn hoặc dùng thuốc kháng axit. Loét tá tràng: không đau khi mới ngủ dậy, đỡ khi ăn, đau lại 2–3 giờ sau ăn, đau làm thức giấc ban đêm hay gặp. Loét dạ dày: ăn có khi làm đau tăng. Ổ loét xuyên thấu mặt sau tá tràng có thể đau lan ra lưng. Nguyên nhân gần như luôn là H. pylori hoặc thuốc chống viêm không steroid (ở Mỹ trên 50% do thuốc này); hút thuốc là yếu tố nguy cơ. Biến chứng hay gặp nhất là xuất huyết (nôn ra máu hoặc bã cà phê, phân đen); thủng gây đau thượng vị đột ngột, dữ dội, liên tục."
