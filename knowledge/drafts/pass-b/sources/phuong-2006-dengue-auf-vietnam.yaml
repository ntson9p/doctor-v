notes_vi: "Đã đọc toàn văn qua Europe PMC (PMC1579223). Nghiên cứu tại 12 trạm y tế xã và phòng khám trạm sốt rét tỉnh Bình Thuận (4/2001–3/2002): người sốt cấp từ 38°C, dưới 14 ngày, không có dấu hiệu cơ quan rõ, đã loại sốt rét bằng lam máu. 33,6% (234/697) có dengue cấp. Bảng 2 so sánh triệu chứng giữa dengue và các bệnh sốt khác; người bệnh đến khám sớm (trung vị 1–2 ngày sốt)."
