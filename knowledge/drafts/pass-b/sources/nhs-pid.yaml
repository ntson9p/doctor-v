notes_vi: "Đã mở trực tiếp; rà soát lần cuối 17/12/2025. Triệu chứng: đau vùng chậu hoặc bụng dưới, đau sâu khi quan hệ, kinh nhiều hoặc đau hơn, ra máu giữa kỳ kinh hoặc sau quan hệ, khí hư bất thường, sốt cao; không phải ai cũng có triệu chứng. Khám khẩn (bác sĩ gia đình hoặc 111); gọi 999 hoặc đến cấp cứu nếu đau vùng chậu dữ dội hoặc nặng dần, đau bụng dưới đột ngột, sốt rất cao, nôn."
