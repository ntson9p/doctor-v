notes_vi: "Đã đọc phần đầu toàn văn trên PMC (chẩn đoán, nguyên nhân). Người bệnh thường đau thượng vị hoặc hạ sườn trái, thường liên tục, lan ra lưng, ngực hoặc hai bên hông; đau âm ỉ, đau quặn từng cơn hoặc đau ở bụng dưới không phù hợp với viêm tụy cấp. Chẩn đoán cần 2 trong 3 tiêu chuẩn (đau điển hình, men tụy trên 3 lần giới hạn trên, hình ảnh học). Nguyên nhân: sỏi mật 40–70%, rượu 25–35%, tăng triglycerid khoảng 5%. Khoảng 15–25% là thể vừa nặng hoặc nặng."
