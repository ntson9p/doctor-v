notes_vi: "Đã mở trang PMC trực tiếp. Người ngoại trú nghi viêm mũi xoang cấp; tỷ lệ có bệnh trên phim 51%, do vi khuẩn 31%. Bảng 3 (độ nhạy): nghẹt mũi 0,83; có chảy mũi 0,75; chảy mũi mủ 0,71; đau khi cúi người 0,72; đau vùng hàm hoặc trán 0,49; đau răng 0,34; ho 0,69; đau đầu 0,50; nhiệt độ trên 38°C 0,11 (LR+ 0,94); bệnh nặng lên lần hai (double sickening) 0,74; có nhiễm trùng hô hấp trước đó 0,87. Thời gian bệnh không có ngưỡng rõ (độ nhạy 25–70%)."
