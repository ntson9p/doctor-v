notes_vi: "Trang rà soát lần cuối 17/9/2026. Đau thường bắt đầu ở bên hông bụng hoặc thắt lưng, có thể lan xuống bẹn, có thể lúc đau lúc đỡ; có thể sốt hoặc rét run, buồn nôn, nôn, đi tiểu nhiều lần, nước tiểu đục. Hẹn khám khẩn hoặc gọi 111 khi đau dữ dội hoặc có sốt, rét run. Sỏi có thể tái phát; yếu tố nguy cơ gồm đã từng bị sỏi, người trong gia đình bị sỏi, uống ít nước."
