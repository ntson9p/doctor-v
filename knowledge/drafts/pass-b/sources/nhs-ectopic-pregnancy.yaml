notes_vi: "Đã mở trực tiếp; rà soát lần cuối 23/8/2022. Khoảng 1/90 thai. Triệu chứng thường xuất hiện từ tuần 4 đến tuần 12: chậm kinh, đau bụng thấp một bên, ra máu âm đạo hoặc dịch nâu, đau đầu vai, khó chịu khi đi tiểu hoặc đi ngoài; có người không có triệu chứng. Dấu hiệu vỡ (đau bụng đột ngột dữ dội, choáng hoặc ngất, buồn nôn, da rất tái): gọi 999 hoặc đến cấp cứu; có các triệu chứng trên và có thể có thai: gọi bác sĩ hoặc 111 ngay."
