notes_vi: "Đã đọc trên PMC (phần lớn toàn văn). Tỷ lệ mới mắc trung bình 74/100.000 trẻ dưới 1 tuổi mỗi năm (9–328); Việt Nam 302/100.000 (hai nghiên cứu tại bệnh viện 2002–2004, trẻ dưới 2 tuổi). Cao nhất ở trẻ 4–7 tháng; thấp nhất ở trẻ 0–2 tháng. Tử vong ở châu Á khoảng 0,2%, ở châu Phi 9,4%."
