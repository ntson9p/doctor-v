notes_vi: "Đã đọc toàn văn qua Europe PMC (PMC7354908). 437 người bệnh nhiễm khuẩn huyết hoặc sốc nhiễm khuẩn ở khoa cấp cứu một bệnh viện Thái Lan (tuổi trung vị 67; 65,9% mắc ở cộng đồng). Lý do đi khám: sốt 42,1%, khó thở 25,2%. Triệu chứng: sốt và/hoặc rét run 53,8%; rét run dữ dội, đau cơ hoặc sốt 54,9%; khó thở nhiều 41,4%; nói ngọng hoặc lú lẫn 22,2%; cả ngày không đi tiểu 4,1%; da loang lổ 1,1%. Bệnh nền: đái tháo đường 25,2%, suy giảm miễn dịch 10,8%. Ổ nhiễm: phổi 49,9%, ổ bụng 16,0%, tiết niệu 14,2%."
