notes_vi: "Đã mở trang AAFP. Bảng 1 tổng hợp LR (người lớn theo tổng quan JAMA RCE của Wagner 1996): đau hố chậu phải LR+ 7,3–8,5, LR− 0–0,28; đau di chuyển xuống hố chậu phải LR+ 3,2, LR− 0,50; co cứng thành bụng LR+ 3,8, LR− 0,82; sốt LR+ 1,9, LR− 0,58; chán ăn LR+ 1,3, LR− 0,64; buồn nôn LR+ 0,69–1,2; nôn LR+ 0,92; không có cơn đau tương tự trước đây LR+ 1,5, LR− 0,32. Bảng không ghi độ nhạy; lượt B tự suy độ nhạy từ cặp LR+ và LR−. Nguy cơ suốt đời 8,6% ở nam, 6,7% ở nữ; thủng ruột thừa 17–32% ở người lớn."
