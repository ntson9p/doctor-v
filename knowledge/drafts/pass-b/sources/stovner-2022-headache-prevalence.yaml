notes_vi: "Đã đọc toàn văn (Europe PMC, bản mở). Tỷ lệ đang mắc toàn cầu: đau đầu nói chung 52%, đau nửa đầu 14%, đau đầu căng thẳng 26%; mỗi ngày 15,8% dân số bị đau đầu. Bảng 1: đau nửa đầu 0–9 tuổi 5,0%, 10–19 tuổi 13,4%, 20–64 tuổi 15,2% (nam 8,7%, nữ 18,6%), từ 65 tuổi 7,9%; đau đầu căng thẳng 0–9 tuổi 5,9%, 10–19 tuổi 25,1%, 20–64 tuổi 27,6% (nam 24,2%, nữ 28,8%), từ 65 tuổi 32,2%; đau đầu nói chung 20–64 tuổi nam 41,8%, nữ 56,5%."
