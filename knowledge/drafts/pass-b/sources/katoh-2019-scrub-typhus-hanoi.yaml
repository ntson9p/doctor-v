notes_vi: "Đã đọc toàn văn qua Europe PMC (PMC6917290). 1.127 người lớn nằm viện vì sốt tại Bạch Mai (6/2012–5/2013); 33 người (2,9%) sốt mò. Bảng 1 (sốt mò so với nhóm khác): nông dân 60,6% (32,7%); sốt trung vị 7 ngày trước nhập viện; đau đầu 66,7%; rét run 24,2%; ho 42,4%; đau họng 6,1%; tiêu chảy 0%; xung huyết kết mạc 39,4% (16,6%); phát ban 9,1%; vết loét 18,2% (0,7%); nhiều hạch 12,1%. Bài dẫn các nghiên cứu Việt Nam trước: vết loét 46–94%, phát ban 0–34%."
