notes_vi: "Đã mở trực tiếp trang (rà soát lần cuối 13/2/2025). Triệu chứng: sốt cao; buồn nôn hoặc nôn; đau thắt lưng hoặc hông; tiêu chảy; đau mỏi cơ như cúm; đau buốt khi đi tiểu; tiểu nhiều lần, gấp; nước tiểu sẫm hoặc đục. Trẻ dưới 2 tuổi có thể chỉ có sốt. Khám gấp trong ngày (hoặc gọi 111) khi sốt cao hay rét run, đau bụng dưới hoặc lưng dưới sườn, tiểu ra máu, nôn, cả ngày không đi tiểu, có thai. Gọi 999 khi lú lẫn, lơ mơ, khó nói. Phụ nữ dễ mắc hơn; sỏi thận làm tăng nguy cơ."
