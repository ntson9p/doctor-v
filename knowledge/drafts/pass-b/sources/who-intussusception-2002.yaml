notes_vi: "Đã đọc bản văn bản qua API của kho IRIS. Ở Việt Nam giai đoạn 1995–1999, mỗi năm có 472–722 ca lồng ruột ở trẻ dưới 12 tháng tại các bệnh viện ở Hà Nội, Huế, TP.HCM, chiếm 5–8% số trẻ nhập viện. Tỷ lệ phải cắt ruột và tử vong cao hơn rõ khi đến viện từ 48 giờ sau khởi phát. Tỷ lệ có đủ bộ ba kinh điển rất khác nhau giữa các nghiên cứu (khoảng 10–82%)."
