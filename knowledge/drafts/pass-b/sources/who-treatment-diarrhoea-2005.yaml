notes_vi: "Đã đọc bản văn bản qua API của kho IRIS (ISBN 92 4 159318 0). Bốn thể lâm sàng: tiêu chảy cấp phân nước, tiêu chảy cấp có máu (lỵ), tiêu chảy kéo dài từ 14 ngày, tiêu chảy kèm suy dinh dưỡng nặng. Dấu hiệu mất nước: khát, vật vã hoặc kích thích, mắt trũng, nếp véo da mất chậm. Chăm sóc tại nhà: uống thêm nước, tiếp tục cho ăn, bổ sung kẽm cho trẻ; đưa trẻ đi khám khi đi ngoài nhiều lần phân nước, nôn nhiều lần, rất khát, ăn uống kém, sốt, phân có máu hoặc không đỡ sau 3 ngày. Thuốc cầm tiêu chảy và thuốc chống nôn không bao giờ được dùng cho trẻ dưới 5 tuổi. Trẻ dưới 3 tuổi ở nước đang phát triển bị trung bình 3 đợt tiêu chảy mỗi năm."
