notes_vi: "Đã đọc tóm tắt và một phần toàn văn (PMC7451980) qua API Europe PMC. Hai đợt dịch lớn: 2011–2012 (trên 200.000 ca nhập viện, trên 200 tử vong) và 2018 (trên 130.000 ca nhập viện). 1196 trẻ tại 3 bệnh viện TP.HCM, tuổi trung vị 18,7 tháng. EV-A71 được phát hiện nhiều hơn vào nửa cuối mỗi năm."
