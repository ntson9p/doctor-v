notes_vi: "Đã mở trang (cập nhật 05/8/2026). Giai đoạn khởi phát: sốt có thể tới 40,5°C, mệt, ho, chảy mũi, viêm kết mạc; hạt Koplik là dấu hiệu đặc trưng. Ban dát sẩn xuất hiện khoảng 14 ngày sau phơi nhiễm, lan từ đầu xuống thân rồi chi dưới. Lây từ 4 ngày trước đến 4 ngày sau khi phát ban. Biến chứng hay gặp: viêm tai giữa, viêm phế quản phổi, viêm thanh quản, tiêu chảy; viêm não khoảng 1/1000 ca."
