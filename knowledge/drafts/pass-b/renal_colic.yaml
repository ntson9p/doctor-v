id: renal_colic
names:
  vi: "Cơn đau quặn thận"
  vi_common: ["Sỏi thận", "Sỏi niệu quản", "Đau sỏi thận"]
  en: "Renal colic (urinary stones)"
codes:
  icd10: "N23"
  icd10_verified: true
  mondo: "MONDO:0024647"
summary_vi:
  - "Cơn đau do sỏi di chuyển và làm tắc đường dẫn nước tiểu."
  - "Đau quặn dữ dội ở hông lưng một bên, lan xuống bụng dưới và bẹn, kèm buồn nôn."
  - "Nếu kèm sốt, rét run hoặc tiểu rất ít, cần đi cấp cứu ngay."
urgency: 3
cant_miss: false
specialties: [urology]
priors:
  - complaint: abdominal_pain
    default: P3
    by_age: { infant_0_2m: P6, child_2m_5y: P6, child_5_12: P5, teen_13_17: P4, elder_75p: P4 }
    evidence:
      tier: B
      basis: judgment
      sources: [viniol-fampract-2014, byt-qd-3931-2015]
      reported: "Chăm sóc ban đầu: nguyên nhân tiết niệu chiếm 5,3% người đến khám vì đau bụng"
      population: "Người lớn ở chăm sóc ban đầu (Viniol 2014)"
      locator: "3931/QĐ-BYT, bài Sỏi thận tiết niệu, mục 1 (bệnh thường gặp nhất của đường tiết niệu, tuổi 30–55, hay gặp ở vùng nóng, nhiệt đới)"
      note: "Nhóm tiết niệu 5,3% gồm cả viêm bàng quang, viêm thận – bể thận; người soạn ước cơn đau quặn thận khoảng 2% ở người lớn (P3). Việt Nam là nước nhiệt đới, sỏi rất phổ biến theo 3931/QĐ-BYT, nhưng chưa có số liệu tỷ lệ mắc trong cộng đồng. Trẻ em hiếm gặp."
prior_modifiers:
  - when: { sex: [male] }
    factor: 1.3
    evidence:
      tier: B
      basis: numeric
      sources: [byt-qd-3931-2015, moore-2014-bmj-stone-score]
      locator: "3931/QĐ-BYT, bài Sỏi thận tiết niệu, mục 1 (nam nhiều hơn nữ); STONE 2014 Bảng 2"
      reported: "Khoảng 72% người có sỏi niệu quản ở khoa cấp cứu là nam (tính từ Bảng 2 STONE)"
      note: "Chọn tỷ số nam/nữ khoảng 2/1 cho cộng đồng, tương ứng 1,3 cho nam và 0,7 cho nữ."
  - when: { sex: [female] }
    factor: 0.7
    evidence:
      tier: B
      basis: numeric
      sources: [byt-qd-3931-2015, moore-2014-bmj-stone-score]
      note: "Xem hệ số cho nam."
findings:
  - finding: abd_pain_location
    dist: { epigastric: 0.03, right_upper: 0.14, left_upper: 0.14, periumbilical: 0.04, right_lower: 0.26, left_lower: 0.26, suprapubic: 0.06, whole: 0.07 }
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-3931-2015, moore-2014-bmj-stone-score]
      locator: "3931/QĐ-BYT mục 3.1 (đau từ hố thắt lưng lan ra trước, xuống hố chậu, bộ phận sinh dục); STONE Bảng 2 (đau lệch một bên khoảng 93%)"
      note: "Đau chủ yếu ở hông lưng một bên; câu hỏi vị trí không có lựa chọn 'hông lưng', nên người bệnh thường chọn dưới sườn hoặc bụng dưới một bên. Tỷ lệ là ước lượng."
  - finding: flank_pain
    freq: very_frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-3931-2015, nhs-kidney-stones]
      locator: "3931/QĐ-BYT mục 3.1 (cơn đau quặn thận khởi phát ở vùng hố thắt lưng một bên); NHS: đau bắt đầu ở bên hông bụng hoặc thắt lưng"
  - finding: abd_pain_radiates_groin
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [moore-2014-bmj-stone-score, byt-qd-3931-2015, nhs-kidney-stones]
      locator: "STONE Bảng 2"
      reported: "Đau lan xuống bẹn: khoảng 44% người có sỏi"
      population: "Người lớn ở khoa cấp cứu được chụp CT vì nghi sỏi"
  - finding: abd_pain_colicky
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [moore-2014-bmj-stone-score, nhs-kidney-stones]
      locator: "STONE Bảng 2 (đau liên tục khoảng 43% người có sỏi); NHS: có thể lúc đau lúc đỡ"
      reported: "Đau không liên tục khoảng 57%"
  - finding: abd_pain_onset
    dist: { sudden: 0.80, gradual: 0.20 }
    evidence:
      tier: B
      basis: numeric
      sources: [moore-2014-bmj-stone-score, byt-qd-3931-2015]
      locator: "STONE Bảng 2; 3931/QĐ-BYT mục 3.1 (xuất hiện đột ngột, sau gắng sức)"
      reported: "Khởi phát đột ngột khoảng 82%"
  - finding: abd_pain_duration
    dist: { lt_6h: 0.45, h6_24: 0.25, d1_3: 0.12, d4_14: 0.06, gt_2w: 0.12 }
    evidence:
      tier: B
      basis: numeric
      sources: [moore-2014-bmj-stone-score, nhs-kidney-stones]
      locator: "STONE Bảng 2"
      reported: "Ở khoa cấp cứu: dưới 6 giờ khoảng 57%, 6–24 giờ khoảng 27%, trên 1 tuần khoảng 4%"
      note: "Hạ tỷ lệ dưới 6 giờ và tăng 'đau tái đi tái lại' (trên 2 tuần) vì sỏi hay tái phát (NHS; 38% người có sỏi trong STONE đã từng bị sỏi) và người dùng có thể kiểm tra giữa các cơn."
  - finding: abd_pain_severe
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [moore-2014-bmj-stone-score, byt-qd-3931-2015]
      locator: "STONE Bảng 2; 3931/QĐ-BYT mục 3.1 (cường độ đau thường mạnh, không có tư thế giảm đau)"
      reported: "Đau dữ dội (7–10/10): khoảng 86% người có sỏi ở khoa cấp cứu"
      note: "Hạ một mức vì số liệu ở khoa cấp cứu và câu hỏi 'không chịu nổi' là ngưỡng cao; nhiều cơn đau nhẹ hơn không đến cấp cứu."
  - finding: nausea
    freq: very_frequent
    evidence:
      tier: B
      basis: numeric
      sources: [moore-2014-bmj-stone-score, byt-qd-3931-2015]
      locator: "STONE Bảng 2; 3931/QĐ-BYT mục 3.1 (buồn nôn, nôn mửa)"
      reported: "Buồn nôn khoảng 77% (kèm nôn khoảng 43%)"
  - finding: vomiting
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [moore-2014-bmj-stone-score]
      locator: "STONE Bảng 2"
      reported: "Nôn khoảng 43%"
  - finding: hematuria
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [moore-2014-bmj-stone-score]
      locator: "STONE Bảng 2 (tiểu máu người bệnh tự thấy)"
      reported: "Tiểu máu nhìn thấy khoảng 27%; hồng cầu niệu khi xét nghiệm khoảng 92%"
      note: "Câu hỏi chỉ hỏi nước tiểu đỏ hoặc hồng nhìn thấy được."
  - finding: kidney_stones_known
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [moore-2014-bmj-stone-score, nhs-kidney-stones]
      locator: "STONE Bảng 2 (tiền sử sỏi thận)"
      reported: "Tiền sử sỏi khoảng 38% người có sỏi"
      note: "Áp dụng từ 13 tuổi theo danh mục. Tỷ lệ nền 5% nên câu trả lời 'Có' làm tăng khả năng khoảng 7–8 lần."
  - finding: dysuria
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [moore-2014-bmj-stone-score]
      locator: "STONE Bảng 2"
      reported: "Tiểu buốt khoảng 25%"
  - finding: urinary_frequency
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-kidney-stones]
      locator: "NHS: có thể đi tiểu nhiều lần"
      note: "Hay gặp khi sỏi ở đoạn niệu quản sát bàng quang. Ước 20%."
  - finding: abd_pain_radiates_back
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [moore-2014-bmj-stone-score]
      locator: "STONE Bảng 2 (có đau lưng)"
      reported: "Đau lưng khoảng 26%"
      note: "Đau sỏi thận nằm sẵn ở hông lưng, nên một phần người bệnh trả lời 'Có' với câu hỏi lan ra sau lưng."
  - finding: abd_pain_worse_movement
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [moore-2014-bmj-stone-score]
      locator: "STONE Bảng 2 (đau khi cử động)"
      reported: "Đau khi cử động khoảng 18%"
  - finding: fever
    freq: rare
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-3931-2015, moore-2014-bmj-stone-score, nhs-kidney-stones]
      locator: "3931/QĐ-BYT mục 3.1 (có thể sốt, rét run nếu có nhiễm trùng kết hợp)"
      note: "Cơn đau quặn thận chưa biến chứng thường không sốt; sốt kèm đau sỏi là dấu hiệu tắc nghẽn nhiễm khuẩn (quy tắc rf_fever_obstructing_stone, mức 2). Mức rare thấp hơn tỷ lệ nền 5%."
  - finding: diarrhea
    freq: rare
    evidence:
      tier: B
      basis: numeric
      sources: [moore-2014-bmj-stone-score]
      locator: "STONE Bảng 2"
      reported: "Tiêu chảy khoảng 4% người có sỏi (OR 0,5)"
      note: "Thấp hơn tỷ lệ nền 5%."
warning_signs:
  - fever
  - chills_rigors
  - decreased_urine
  - abd_pain_severe
  - persistent_vomiting
self_care_vi:
  - "Sau khi đã được khám, uống đủ nước mỗi ngày để giảm nguy cơ sỏi tái phát."
see_doctor_vi:
  - "Đi khám trong ngày để được giảm đau và siêu âm tìm sỏi."
  - "Đi cấp cứu ngay nếu đau kèm sốt, rét run, nôn (ói) liên tục, hoặc tiểu rất ít."
review:
  status: draft
  authors: ["agent:pass-b"]
  updated: "2026-10-25"
  notes_vi: "Giữ mức xử trí 3 như gợi ý: cơn đau chưa biến chứng cần được giảm đau và siêu âm trong ngày (3931/QĐ-BYT; NHS: khám khẩn hoặc gọi 111 khi đau dữ dội hoặc sốt); đau dữ dội đã có quy tắc mức 2, và sốt kèm cơn đau quặn hông lưng có quy tắc rf_fever_obstructing_stone (mức 2). Mã ICD-10 chọn N23 (cơn đau quặn thận không xác định); sỏi là N20. MONDO dùng mã urolithiasis vì không có mã riêng cho cơn đau quặn thận. Điểm chưa chắc: (1) tỷ lệ trong Bảng 2 của STONE do lượt B tự tính, một vài số không khớp tổng; (2) prior P3 chưa có số liệu Việt Nam; (3) thời gian đau ở cộng đồng là ước lượng; (4) 3931/QĐ-BYT khuyên giảm lượng nước uống khi đang có cơn đau, trong khi NHS khuyên uống đủ nước để phòng sỏi, nên lời khuyên tự chăm sóc chỉ nói về sau khi đã được khám; (5) tiền sử sỏi (kidney_stones_known) chỉ áp dụng từ 13 tuổi theo danh mục. Mã và tên ICD-10 tiếng Việt đã đối chiếu qua công cụ tra cứu của icd.kcb.vn (bộ mã theo Thông tư 06/2026/TT-BYT) ngày 24/10/2026; mã MONDO tra qua EBI OLS."
