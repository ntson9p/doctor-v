id: preeclampsia
names:
  vi: "Tiền sản giật"
  vi_common: ["Tiền sản giật – sản giật", "Nhiễm độc thai nghén"]
  en: "Pre-eclampsia"
codes:
  icd10: "O14.9"
  icd10_verified: true
  mondo: "MONDO:0005081"
summary_vi:
  - "Huyết áp tăng từ tuần thứ 20 của thai kỳ, kèm đạm trong nước tiểu hoặc tổn thương cơ quan khác."
  - "Có thể gây đau đầu, nhìn mờ, đau vùng trên rốn, phù mặt và tay."
  - "Có thể xuất hiện cả trong vài tuần sau sinh và có thể gây co giật (sản giật)."
urgency: 2
cant_miss: true
specialties: [obstetrics_gynecology, emergency]
applicability:
  sex: [female]
  age_groups: [teen_13_17, adult_18_44, adult_45_64]
  reason_vi: "Chỉ gặp ở phụ nữ đang có thai hoặc vừa sinh con."
priors:
  - complaint: headache
    default: P5
    by_age: { teen_13_17: P6, adult_45_64: P6 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015, ngwenya-2020-severe-pe-symptoms, yen-2011-piers-symptoms]
      locator: "315/QĐ-BYT, bài Tiền sản giật – sản giật, mục 1"
      note: "Prior tính trong số phụ nữ cùng nhóm tuổi bị đau đầu, kể cả người không có thai; việc đang có thai, tuổi thai và vừa sinh được tính qua câu hỏi riêng (đều được hỏi bắt buộc khi đau đầu). Tiền sản giật gặp ở 2–8% số thai (315/QĐ-BYT); chỉ một phần nhỏ phụ nữ 18–44 tuổi đang ở giai đoạn thai từ 20 tuần hoặc 6 tuần sau sinh; khoảng một nửa người bệnh có triệu chứng, đau đầu hay gặp nhất (Yen 2011; Ngwenya 2020). Người soạn ước 0,02–0,2% (P5) ở 18–44 tuổi; dưới 0,02% (P6) ở 13–17 tuổi và từ 45 tuổi vì ít người có thai."
  - complaint: abdominal_pain
    default: P5
    by_age: { teen_13_17: P6, adult_45_64: P6 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015, ngwenya-2020-severe-pe-symptoms]
      note: "Như prior đau đầu; đau thượng vị gặp ở 22,4% người tiền sản giật nặng (Ngwenya 2020), ít hơn đau đầu. Người soạn ước P5 ở 18–44 tuổi, P6 ở nhóm còn lại."
findings:
  - finding: pregnant
    freq: very_frequent
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015, nhs-pre-eclampsia]
      locator: "315/QĐ-BYT, mục 2.1 (huyết áp tăng sau tuần 20) và 2.2 (sản giật có thể xảy ra trong thời kỳ hậu sản); NHS: có thể xuất hiện vài ngày đến vài tuần sau sinh"
      note: "Phần lớn đang có thai; một phần khởi phát hoặc nặng lên sau sinh (khi đó trả lời 'không có thai' và 'vừa sinh con'). Không có tỷ lệ sau sinh trong các nguồn đã mở; người soạn ước khoảng 15–20%, nên chọn very_frequent."
  - finding: gestational_age
    dist: { lt_20w: 0.03, ge_20w: 0.97 }
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-315-2015, nhs-pre-eclampsia]
      locator: "315/QĐ-BYT, mục 2.1.1 (huyết áp từ 140/90 mmHg sau tuần 20)"
      note: "Theo định nghĩa xuất hiện sau tuần 20; NHS ghi hiếm khi sớm hơn. Để 0,03 cho trường hợp ước sai tuổi thai."
  - finding: recent_childbirth
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015, nhs-pre-eclampsia]
      note: "Bệnh có thể xuất hiện vài ngày đến vài tuần sau sinh (NHS), sản giật có thể xảy ra trong thời kỳ hậu sản (315/QĐ-BYT). Người soạn ước khoảng 15–20% người bệnh ở giai đoạn sau sinh: occasional."
  - finding: headache
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [ngwenya-2020-severe-pe-symptoms, byt-qd-315-2015, nhs-pre-eclampsia]
      reported: "Đau đầu ở 47,9% người tiền sản giật nặng (Ngwenya 2020)."
      note: "Chỉ có tác dụng khi triệu chứng chính là đau bụng (khi chọn đau đầu thì dấu hiệu này đã được ngầm định). Số liệu từ bệnh viện ở thể nặng, nhưng người đau bụng do tiền sản giật thường là thể nặng (315/QĐ-BYT xếp nhức đầu và đau thượng vị vào tiền sản giật nặng), nên không hạ mức."
  - finding: headache_severity
    dist: { mild: 0.15, moderate: 0.40, severe: 0.45 }
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-pre-eclampsia]
      note: "NHS: đau đầu dữ dội, không đỡ khi dùng thuốc giảm đau thông thường. Phân bố là ước lượng của người soạn."
  - finding: headache_course
    dist: { first_time: 0.70, recurrent_similar: 0.20, progressive: 0.10 }
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-pre-eclampsia]
      note: "Thường là đau đầu mới trong thai kỳ; người vốn bị đau nửa đầu có thể thấy giống cơn cũ. Ước lượng của người soạn."
  - finding: headache_duration
    dist: { lt_4h: 0.20, h4_72: 0.55, gt_3d: 0.25 }
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-pre-eclampsia]
      note: "Đau đầu thường dai dẳng, không đỡ khi dùng thuốc. Ước lượng của người soạn."
  - finding: blurred_vision
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [thangaratinam-2011-pe-symptoms, byt-qd-315-2015, nhs-pre-eclampsia]
      note: "Rối loạn thị giác (nhìn mờ, chớp sáng) là triệu chứng của tiền sản giật nặng (315/QĐ-BYT; NHS) và được xét trong tổng quan Thangaratinam 2011; không nguồn nào cho tỷ lệ chung. Chọn occasional."
  - finding: edema_face_hands
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-315-2015, nhs-pre-eclampsia]
      locator: "315/QĐ-BYT, mục 1 (triệu chứng thường gặp là phù, huyết áp tăng và protein niệu)"
      note: "315/QĐ-BYT ghi phù là triệu chứng thường gặp (mức very_frequent theo bảng); câu hỏi chỉ hỏi phù mặt, tay mới xuất hiện (NHS: phù mặt, tay hoặc chân đột ngột), nên hạ còn frequent."
  - finding: abd_pain_location
    dist: { epigastric: 0.50, right_upper: 0.35, left_upper: 0.03, periumbilical: 0.03, right_lower: 0.01, left_lower: 0.01, suprapubic: 0.02, whole: 0.05 }
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-315-2015, nhs-pre-eclampsia]
      locator: "315/QĐ-BYT, mục 2.1.2 (đau vùng thượng vị hoặc hạ sườn phải)"
      note: "NHS: đau dưới sườn. Tỷ lệ từng vùng là ước lượng của người soạn."
  - finding: heartburn
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-pre-eclampsia]
      note: "NHS liệt kê ợ nóng không đỡ khi dùng thuốc trong các triệu chứng của tiền sản giật. Chọn occasional."
  - finding: vomiting
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [thangaratinam-2011-pe-symptoms, nhs-pre-eclampsia]
      note: "Buồn nôn và nôn được xét trong tổng quan Thangaratinam 2011 và có trong danh sách triệu chứng của NHS; không có tỷ lệ chung. Chọn occasional."
  - finding: abd_pain_severe
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015, nhs-pre-eclampsia]
      note: "Đau thượng vị, hạ sườn phải là dấu hiệu tiền sản giật nặng; mức độ đau không có số liệu. Ước occasional."
  - finding: bp_measured
    dist: { normal: 0.10, high: 0.50, very_high: 0.30, extreme: 0.10 }
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-315-2015]
      locator: "315/QĐ-BYT, mục 2.1.1 (từ 140/90 mmHg) và 2.1.2 (nặng: từ 160/110 mmHg)"
      note: "Theo định nghĩa huyết áp từ 140/90 mmHg; lần đo gần nhất có thể trước khi khởi phát nên để 0,10 cho 'dưới 140/90'. Phân bố giữa các mức là ước lượng."
  - finding: fever
    freq: rare
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015, nhs-pre-eclampsia]
      note: "Sốt không phải triệu chứng của tiền sản giật trong cả hai nguồn. Có thai kèm sốt cần nghĩ đến nhiễm trùng."
warning_signs: [seizure_recent, confusion, vision_loss_or_double, blurred_vision, breathing_difficulty, abd_pain_severe, edema_face_hands]
self_care_vi:
  - "Không tự ý dùng thuốc khi chưa hỏi bác sĩ sản khoa."
  - "Mang theo sổ khám thai và các kết quả xét nghiệm khi đi khám."
see_doctor_vi:
  - "Đến khoa sản hoặc cơ sở cấp cứu ngay để được đo huyết áp và thử nước tiểu."
  - "Gọi 115 nếu co giật, lơ mơ, khó thở hoặc đau dữ dội vùng trên rốn."
  - "Trong 6 tuần sau sinh vẫn có thể bị bệnh này, cần đi khám ngay nếu có các dấu hiệu trên."
review:
  status: draft
  authors: ["agent:pass-b"]
  updated: "2026-10-24"
  notes_vi: "Giữ mức xử trí 2 và cant_miss: true. 315/QĐ-BYT cho điều trị ngoại trú tiền sản giật nhẹ (thường không triệu chứng, phát hiện khi khám thai), nhưng người tự kiểm tra vì đau đầu, đau bụng, nhìn mờ thường đã có dấu hiệu nặng (315 xếp nhức đầu, nhìn mờ, đau thượng vị vào tiền sản giật nặng; NHS: các triệu chứng cần được kiểm tra ngay); bệnh có thể chuyển sang sản giật, HELLP trong vài giờ đến vài ngày. Đã có quy tắc rf_pregnancy_hypertension_signs (mức 2). Bộ Y tế đã ban hành 1154/QĐ-BYT (04/5/2024) về tăng huyết áp thai kỳ, tiền sản giật, sản giật nhưng chưa mở được toàn văn; lượt C nên đối chiếu. Không dùng NICE NG133 vì trang NICE chặn truy cập trực tiếp. Điểm chưa chắc: (1) tỷ lệ khởi phát sau sinh; (2) phần lớn tần suất chỉ có mô tả bằng lời; (3) không liên kết co giật (sản giật là biến chứng, đã có quy tắc rf_new_seizure) và không liên kết chớp sáng trước cơn đau (câu hỏi visual_aura gắn với đau nửa đầu), dù NHS nêu thấy chớp sáng."
