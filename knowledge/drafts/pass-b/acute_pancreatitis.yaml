id: acute_pancreatitis
names:
  vi: "Viêm tụy cấp tính"
  vi_common: ["Viêm tụy cấp"]
  en: "Acute pancreatitis"
codes:
  icd10: "K85"
  icd10_verified: true
  mondo: "MONDO:0006515"
summary_vi:
  - "Tụy bị viêm cấp, ở Việt Nam hay do rượu bia, mỡ máu rất cao hoặc sỏi mật."
  - "Đau vùng trên rốn dữ dội, liên tục, thường lan ra sau lưng, kèm nôn (ói)."
  - "Cần điều trị trong bệnh viện vì một số ca diễn biến nặng nhanh."
urgency: 2
cant_miss: true
specialties: [gastroenterology, emergency]
priors:
  - complaint: abdominal_pain
    default: P4
    by_age: { infant_0_2m: P6, child_2m_5y: P6, child_5_12: P5, teen_13_17: P5 }
    evidence:
      tier: A
      basis: judgment
      sources: [viniol-fampract-2014, acg-2024-acute-pancreatitis, phan-2024-pancreatitis-vietnam, nguyen-2025-pancreatitis-vietnam]
      reported: "Chăm sóc ban đầu: bệnh mật – tụy chiếm 4,0% người đến khám vì đau bụng"
      population: "Người lớn ở chăm sóc ban đầu (Viniol 2014)"
      note: "Viêm tụy cấp chỉ là một phần nhỏ của nhóm mật – tụy; ước 0,2–1% (P4) ở người lớn. Hai nhóm bệnh nhân ở Bệnh viện Chợ Rẫy có tuổi trung bình 41,5 và 47,3, tức là gặp nhiều ở tuổi lao động. Ít gặp ở trẻ em và thiếu niên (P5)."
prior_modifiers:
  - when: { sex: [male] }
    factor: 1.3
    evidence:
      tier: B
      basis: numeric
      sources: [phan-2024-pancreatitis-vietnam, nguyen-2025-pancreatitis-vietnam]
      reported: "Nam/nữ 2,8/1 (Phan 2024); nam 62,3% (Nguyen 2025)"
      note: "Tỷ số nam/nữ chung khoảng 2/1, tương ứng hệ số 1,3 cho nam và 0,7 cho nữ so với mức trung bình hai giới. Số liệu bệnh viện tuyến cuối."
  - when: { sex: [female] }
    factor: 0.7
    evidence:
      tier: B
      basis: numeric
      sources: [phan-2024-pancreatitis-vietnam, nguyen-2025-pancreatitis-vietnam]
      reported: "Nam/nữ 2,8/1 (Phan 2024); nam 62,3% (Nguyen 2025)"
      note: "Xem hệ số cho nam."
findings:
  - finding: abd_pain_location
    dist: { epigastric: 0.60, right_upper: 0.08, left_upper: 0.12, periumbilical: 0.06, right_lower: 0.01, left_lower: 0.01, suprapubic: 0.01, whole: 0.11 }
    evidence:
      tier: B
      basis: verbal
      sources: [acg-2024-acute-pancreatitis, msd-acute-pancreatitis, nhs-acute-pancreatitis]
      locator: "ACG 2024: đau thượng vị hoặc hạ sườn trái; đau ở bụng dưới không phù hợp với viêm tụy cấp"
      note: "Tỷ lệ là ước lượng; để một phần 'khắp bụng' cho ca đau lan tỏa."
  - finding: abd_pain_radiates_back
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [acg-2024-acute-pancreatitis, nhs-acute-pancreatitis, msd-acute-pancreatitis]
      locator: "ACG 2024: đau thường liên tục, lan ra lưng, ngực hoặc hai bên hông; NHS: có thể lan ra hai bên và ra sau lưng"
      note: "Chữ 'thường' của ACG áp dụng cho cả ba hướng lan (lưng, ngực, hông), nên lan ra lưng riêng ước khoảng một nửa."
  - finding: abd_pain_radiates_right_shoulder
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-acute-pancreatitis, acg-2024-acute-pancreatitis]
      note: "Câu hỏi gồm cả 'sau lưng bên phải'; người viêm tụy đau lan ra lưng có thể trả lời 'Có'. Ước 20%."
  - finding: flank_pain
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [acg-2024-acute-pancreatitis, nhs-acute-pancreatitis]
      locator: "ACG 2024: lan ra hai bên hông; NHS: lan ra hai bên"
      note: "Ước 20%."
  - finding: abd_pain_severe
    freq: frequent
    evidence:
      tier: C
      basis: verbal
      sources: [msd-acute-pancreatitis, nhs-acute-pancreatitis]
      locator: "MSD: đau thường dữ dội đến mức cần thuốc giảm đau đường tiêm"
      note: "Mô tả 'thường dữ dội' (very_frequent) là ở người bệnh nhập viện; hạ một mức cho bối cảnh cộng đồng và vì câu hỏi 'không chịu nổi' là ngưỡng cao. Mức very_frequent làm câu trả lời 'Không' giảm khả năng viêm tụy 4 lần, quá mạnh với một bệnh 'không được bỏ sót' (lượt B thử trong mô phỏng)."
  - finding: abd_pain_onset
    dist: { sudden: 0.50, gradual: 0.50 }
    evidence:
      tier: C
      basis: verbal
      sources: [msd-acute-pancreatitis, nhs-acute-pancreatitis, phan-2024-pancreatitis-vietnam]
      locator: "MSD: khởi phát đột ngột khi do sỏi mật, tăng dần trong vài ngày khi do rượu"
      note: "Ở Việt Nam rượu và tăng triglycerid chiếm phần lớn nguyên nhân, nên khoảng một nửa khởi phát từ từ. Tỷ lệ là ước lượng."
  - finding: abd_pain_duration
    dist: { lt_6h: 0.25, h6_24: 0.38, d1_3: 0.28, d4_14: 0.07, gt_2w: 0.02 }
    evidence:
      tier: C
      basis: judgment
      sources: [msd-acute-pancreatitis, nhs-acute-pancreatitis]
      locator: "MSD: đau kéo dài vài ngày; NHS: đau đột ngột và không hết"
      note: "Đau dữ dội nên đa số đi khám trong ngày đầu. Phân bố là ước lượng."
  - finding: abd_pain_meal_relation
    dist: { hungry_relieved_by_food: 0.03, worse_after_meal: 0.45, no_relation: 0.52 }
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-acute-pancreatitis]
      locator: "NHS: đau tăng sau khi ăn, khi cử động hoặc khi nằm"
      note: "Tỷ lệ là ước lượng."
  - finding: nausea
    freq: very_frequent
    evidence:
      tier: C
      basis: verbal
      sources: [msd-acute-pancreatitis, nhs-acute-pancreatitis]
      locator: "MSD: buồn nôn, nôn thường gặp"
  - finding: vomiting
    freq: very_frequent
    evidence:
      tier: C
      basis: verbal
      sources: [msd-acute-pancreatitis, nhs-acute-pancreatitis]
      locator: "MSD: buồn nôn, nôn thường gặp"
  - finding: persistent_vomiting
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [msd-acute-pancreatitis]
      note: "Nôn nhiều lần, không giữ được nước gặp ở một phần đáng kể; ước 20–30%."
  - finding: vomiting_bilious
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [msd-acute-pancreatitis]
      note: "Tần suất trong số người có nôn. Nôn nhiều lần thường ra dịch vàng đắng; ước 20–30%."
  - finding: fever
    freq: frequent
    evidence:
      tier: C
      basis: numeric
      sources: [msd-acute-pancreatitis, nhs-acute-pancreatitis]
      reported: "Trên 60% người bệnh có sốt (MSD)"
  - finding: fever_max_temp
    dist: { lt_38: 0.45, t38_39: 0.42, ge_39: 0.13 }
    evidence:
      tier: C
      basis: judgment
      sources: [msd-acute-pancreatitis]
      note: "Phân bố trong số người đã có sốt; thường sốt nhẹ trong những ngày đầu. Tỷ lệ là ước lượng."
  - finding: fever_duration
    dist: { d1_2: 0.65, d3_5: 0.28, d6_7: 0.05, gt_7d: 0.02 }
    evidence:
      tier: C
      basis: judgment
      sources: [msd-acute-pancreatitis]
      note: "Bệnh cấp, thường đi khám trong 1–2 ngày đầu. Phân bố là ước lượng."
  - finding: heavy_alcohol
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [phan-2024-pancreatitis-vietnam, nguyen-2025-pancreatitis-vietnam, msd-acute-pancreatitis]
      reported: "Nguyên nhân có rượu (đơn thuần hoặc kèm tăng triglycerid): 37,8% (Phan 2024), 42,3% (Nguyen 2025); tiền sử dùng rượu 54,1% (Nguyen 2025)"
      population: "Người viêm tụy cấp nhập Bệnh viện Chợ Rẫy"
      note: "Cao hơn tỷ lệ nền 15%, nên câu trả lời 'Có' làm tăng khả năng khoảng 3 lần."
  - finding: gallstones_known
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [phan-2024-pancreatitis-vietnam, nguyen-2025-pancreatitis-vietnam, acg-2024-acute-pancreatitis]
      reported: "Nguyên nhân do sỏi mật: 10,8% (Phan 2024), 25,0% (Nguyen 2025); ở Mỹ 40–70% (ACG 2024)"
      note: "Không phải ai có sỏi cũng đã biết trước; ước 20% người bệnh trả lời 'Có'."
  - finding: diabetes
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [phan-2024-pancreatitis-vietnam, nguyen-2025-pancreatitis-vietnam]
      reported: "Đái tháo đường: 43,7% (Phan 2024), 26,8% (Nguyen 2025)"
      note: "Liên quan viêm tụy do tăng triglycerid, hay gặp ở Việt Nam. Hạ một mức vì số liệu từ bệnh viện tuyến cuối."
  - finding: abdomen_hard_swollen
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [msd-acute-pancreatitis, nhs-acute-pancreatitis]
      locator: "MSD: có thể chướng bụng do liệt ruột; NHS: chướng bụng kéo dài là dấu hiệu cần cấp cứu"
  - finding: abd_pain_worse_movement
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [msd-acute-pancreatitis, nhs-acute-pancreatitis]
      locator: "MSD: ho, cử động mạnh, hít sâu có thể làm đau tăng; NHS: đau tăng khi cử động"
  - finding: jaundice
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [msd-acute-pancreatitis]
      locator: "MSD: đôi khi có vàng mắt do tắc ống mật"
      note: "Ở Việt Nam viêm tụy do sỏi mật ít hơn phương Tây, nên có thể thấp hơn."
warning_signs:
  - abd_pain_severe
  - persistent_vomiting
  - abdomen_hard_swollen
  - breathing_difficulty
  - cold_hands_feet
  - confusion
  - decreased_urine
self_care_vi:
  - "Không uống rượu bia."
see_doctor_vi:
  - "Đến cơ sở cấp cứu ngay khi đau vùng trên rốn dữ dội, kéo dài, lan ra sau lưng."
  - "Bệnh cần được điều trị trong bệnh viện, không tự điều trị tại nhà."
review:
  status: draft
  authors: ["agent:pass-b"]
  updated: "2026-10-25"
  notes_vi: "Giữ mức xử trí 2 và cant_miss như gợi ý: NHS ghi bệnh cần điều trị tại bệnh viện ngay; thể vừa nặng và nặng chiếm 15–25% (ACG 2024), tử vong 7–8% ở hai nhóm bệnh nhân Chợ Rẫy (tuyến cuối). Điểm chưa chắc: (1) prior P4 suy từ nhóm 'mật – tụy' ở chăm sóc ban đầu nước ngoài; ở Việt Nam viêm tụy do rượu và tăng triglycerid có thể làm tỷ lệ cao hơn; (2) không tìm được nguồn mở cho con số 'khoảng 50% đau lan ra lưng'; mức frequent dựa trên mô tả bằng lời của ACG; (3) chưa có câu hỏi về mỡ máu cao (tăng triglycerid), là nguyên nhân hàng đầu ở Việt Nam (34,7% ở Phan 2024), người soạn ghi nhận nhưng chưa đề xuất vì người dân ít biết chỉ số này; (4) hệ số giới tính dựa trên số liệu bệnh viện. Mã và tên ICD-10 tiếng Việt đã đối chiếu qua công cụ tra cứu của icd.kcb.vn (bộ mã theo Thông tư 06/2026/TT-BYT) ngày 24/10/2026; mã MONDO tra qua EBI OLS."
