id: ectopic_pregnancy
names:
  vi: "Thai ngoài tử cung"
  vi_common: ["Chửa ngoài tử cung", "Mang thai ngoài tử cung"]
  en: "Ectopic pregnancy"
codes:
  icd10: "O00.9"
  icd10_verified: true
  mondo: "MONDO:0000755"
summary_vi:
  - "Thai làm tổ ở ngoài buồng tử cung, phần lớn ở vòi trứng."
  - "Hay gặp chậm kinh, ra máu âm đạo ít một và đau bụng dưới một bên."
  - "Khối thai có thể vỡ, gây chảy máu trong ổ bụng và nguy hiểm tính mạng."
urgency: 2
cant_miss: true
specialties: [obstetrics_gynecology, emergency]
applicability:
  sex: [female]
  age_groups: [teen_13_17, adult_18_44, adult_45_64]
  reason_vi: "Chỉ gặp ở phụ nữ trong độ tuổi có thể mang thai."
priors:
  - complaint: abdominal_pain
    default: P4
    by_age: { teen_13_17: P5, adult_45_64: P6 }
    evidence:
      tier: B
      basis: judgment
      sources: [msd-ectopic-pregnancy, nhs-ectopic-pregnancy, viniol-2014-abdominal-pain-primary-care]
      note: "Prior hiểu là tỷ lệ trong số phụ nữ cùng nhóm tuổi bị đau bụng, vì bệnh chỉ được xét cho nữ (applicability). Thai ngoài tử cung chiếm khoảng 1/90 (NHS) đến 2/100 (MSD) số lần có thai, và phần lớn có đau bụng. Đau bụng chiếm 2,8% lượt khám ban đầu, nhiều nguyên nhân lành tính (Viniol 2014), nên người soạn ước khoảng 0,5–1% phụ nữ 18–44 tuổi đau bụng là do thai ngoài tử cung (P4). Tuổi 13–17 có thai ít hơn hẳn (P5); từ 45 tuổi rất hiếm có thai (P6). Chưa có số liệu Việt Nam về lý do đi khám; cần bác sĩ duyệt."
findings:
  - finding: pregnant
    freq: very_frequent
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015, msd-ectopic-pregnancy, nhs-ectopic-pregnancy]
      locator: "315/QĐ-BYT, bài Chửa ngoài tử cung, mục 2.1; MSD: Symptoms and Signs; NHS: Symptoms"
      note: "Theo định nghĩa luôn có thai, nhưng nhiều người chưa biết: 315/QĐ-BYT ghi chậm kinh nhiều khi không rõ vì ra máu trước ngày dự kiến có kinh; MSD ghi người kinh nguyệt không đều có thể không biết có thai; NHS khuyên đi khám ngay cả khi chưa thử thai dương tính. Chọn very_frequent (không chọn almost_always) theo yêu cầu an toàn: trả lời 'không có thai' chỉ làm giảm khả năng khoảng 4–5 lần, không loại trừ."
  - finding: missed_period
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-315-2015, nhs-ectopic-pregnancy]
      locator: "315/QĐ-BYT, Chửa ngoài tử cung, mục 2.1 (cơ năng) và 2.3 (chậm kinh + đau bụng dưới + ra máu âm đạo); NHS: Symptoms"
      note: "Chậm kinh là một trong ba dấu hiệu chính, nhưng 315/QĐ-BYT nhấn mạnh nhiều trường hợp không rõ do ra máu được tưởng là kinh. Chọn frequent thay vì very_frequent để câu trả lời 'Không' không làm giảm quá mạnh một bệnh không được bỏ sót. Cùng cụm pregnancy_signs với 'pregnant' (tương quan cao) nên bộ suy luận giảm trọng số khi trả lời cả hai."
  - finding: gestational_age
    dist: { lt_20w: 0.97, ge_20w: 0.03 }
    evidence:
      tier: B
      basis: numeric
      sources: [nhs-ectopic-pregnancy, msd-ectopic-pregnancy]
      reported: "Triệu chứng thường xuất hiện từ tuần 4 đến tuần 12 (NHS); khối chửa thường vỡ ở tuần 6–16 (MSD)."
      note: "Gần như luôn dưới 20 tuần. Để 0,03 cho trường hợp người dùng ước sai tuổi thai."
  - finding: vaginal_bleeding
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-315-2015, msd-ectopic-pregnancy, nhs-ectopic-pregnancy]
      locator: "315/QĐ-BYT, Chửa ngoài tử cung, mục 2.1; MSD: Symptoms and Signs"
      note: "315/QĐ-BYT: ra máu âm đạo ít một, sẫm màu, dai dẳng; MSD: phần lớn người bệnh có đau vùng chậu, ra máu âm đạo hoặc cả hai; NHS: ra máu hoặc dịch nâu. Không nguồn nào cho tỷ lệ riêng; chọn frequent (không chọn very_frequent) để câu trả lời 'Không' không làm giảm quá mạnh khả năng bệnh."
  - finding: abd_pain_location
    dist: { epigastric: 0.03, right_upper: 0.02, left_upper: 0.02, periumbilical: 0.05, right_lower: 0.28, left_lower: 0.28, suprapubic: 0.20, whole: 0.12 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015, nhs-ectopic-pregnancy]
      locator: "315/QĐ-BYT, Chửa ngoài tử cung, mục 2.1 và 2.4.2 (thể lụt máu ổ bụng); NHS: Symptoms"
      note: "Đau thường ở vị trí khối chửa (315/QĐ-BYT), tức bụng dưới một bên (NHS). Khi máu chảy vào ổ bụng có thể đau khắp bụng. Tỷ lệ từng vùng là ước lượng của người soạn."
  - finding: abd_pain_onset
    dist: { sudden: 0.35, gradual: 0.65 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015, nhs-ectopic-pregnancy]
      locator: "315/QĐ-BYT, mục 2.4.2 (đau và choáng xuất hiện đột ngột); NHS: signs of a rupture"
      note: "Khi chưa vỡ thường đau âm ỉ, tăng dần; khi vỡ đau đột ngột, dữ dội. Tỷ lệ là ước lượng của người soạn, hơi cao hơn nền (0,25)."
  - finding: abd_pain_severe
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-ectopic-pregnancy, crochet-2013-jama-ectopic]
      note: "Đau dữ dội đột ngột là dấu hiệu vỡ; NHS ghi vỡ là không thường gặp nếu được xử trí sớm. Ở phụ nữ có thai bị đau hoặc ra máu, mức độ đau không phân biệt tốt thai ngoài tử cung (Crochet 2013: mọi yếu tố tiền sử có LR+ dưới 1,5). Có đau dữ dội thì quy tắc rf_severe_abdominal_pain đã xếp mức 2."
  - finding: fainting_or_near_fainting
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-315-2015, nhs-ectopic-pregnancy, msd-ectopic-pregnancy]
      locator: "315/QĐ-BYT, mục 2.1 (toàn thân: có thể choáng ngất do đau, do vỡ khối chửa); NHS: signs of a rupture"
      note: "Các nguồn mô tả bằng lời là 'có thể'; chọn occasional."
  - finding: abdomen_hard_swollen
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-315-2015]
      locator: "315/QĐ-BYT, mục 2.1 (phản ứng thành bụng khi có máu trong ổ bụng) và 2.4.2 (bụng trướng, ấn đau khắp bụng)"
      note: "Gặp ở thể có máu trong ổ bụng. Tỷ lệ ở người tự kiểm tra chưa rõ; chọn occasional. Tỷ lệ nền của dấu hiệu này rất thấp (1%) nên trả lời 'Có' làm tăng mạnh khả năng bệnh."
  - finding: abd_pain_worse_movement
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015]
      locator: "315/QĐ-BYT, mục 2.1 (máu trong ổ bụng gây kích thích phúc mạc, phản ứng thành bụng)"
      note: "Đau tăng khi đi lại, khi ho là biểu hiện kích thích phúc mạc, gặp khi có máu trong ổ bụng. Người soạn ước occasional."
  - finding: abd_pain_radiates_right_shoulder
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-ectopic-pregnancy]
      note: "NHS liệt kê đau ở đầu vai trong các triệu chứng có thể gặp (máu kích thích cơ hoành). Câu hỏi chỉ hỏi vai phải hoặc lưng bên phải nên có thể bỏ sót đau vai trái."
  - finding: fever
    freq: rare
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015, msd-ectopic-pregnancy, nhs-ectopic-pregnancy]
      note: "Sốt không có trong danh sách triệu chứng của cả ba nguồn. Ghi rare để câu trả lời 'Có sốt' làm giảm nhẹ (khoảng 2 lần) khả năng bệnh, nghiêng về viêm vùng chậu, viêm ruột thừa, viêm thận – bể thận."
warning_signs: [abd_pain_severe, fainting_or_near_fainting, abdomen_hard_swollen, severe_weakness, cold_hands_feet]
self_care_vi:
  - "Không tự lái xe. Nhờ người đưa đến cơ sở y tế có khoa sản hoặc khoa cấp cứu."
  - "Mang theo que thử thai hoặc kết quả siêu âm, nếu có."
see_doctor_vi:
  - "Đến cơ sở cấp cứu hoặc khoa sản ngay nếu có thể đang có thai mà đau bụng dưới hoặc ra máu âm đạo."
  - "Gọi 115 nếu đau bụng dữ dội đột ngột, choáng ngất hoặc da tái nhợt."
review:
  status: draft
  authors: ["agent:pass-b"]
  updated: "2026-10-24"
  notes_vi: "Mức xử trí 2 và cant_miss: true giữ như gợi ý: 315/QĐ-BYT chẩn đoán dựa vào siêu âm và hCG, cần xử trí ở cơ sở có sản khoa; NHS khuyên đi khám ngay khi có triệu chứng và có thể có thai, gọi cấp cứu khi có dấu hiệu vỡ. Không dùng NICE NG126 vì trang NICE chặn truy cập trực tiếp. Điểm chưa chắc: (1) prior chỉ là ước lượng, chưa có số liệu Việt Nam; (2) tỷ lệ chậm kinh và ra máu âm đạo chỉ có mô tả bằng lời, đã chọn mức thấp hơn một bậc để an toàn; (3) không liên kết buồn nôn, nôn, tiêu chảy, tiểu buốt (nguồn ghi 'có thể gặp', dễ nhầm với bệnh tiêu hóa, tiết niệu) và đau trùng kỳ kinh (người bệnh có thể tưởng ra máu là kinh), để các câu trả lời này không làm giảm khả năng bệnh; (4) đau đầu vai chỉ hỏi được bên phải."
