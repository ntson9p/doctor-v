id: peptic_ulcer_gastritis
names:
  vi: "Viêm, loét dạ dày – tá tràng"
  vi_common: ["Đau dạ dày", "Đau bao tử", "Viêm dạ dày"]
  en: "Peptic ulcer disease and gastritis"
codes:
  icd10: "K27"
  icd10_verified: true
  mondo: "MONDO:0004247"
summary_vi:
  - "Niêm mạc dạ dày hoặc tá tràng bị viêm hay loét, hay do vi khuẩn HP (Helicobacter pylori) hoặc thuốc giảm đau chống viêm."
  - "Thường đau, nóng rát vùng trên rốn, liên quan đến bữa ăn, hay tái đi tái lại."
  - "Biến chứng nguy hiểm là chảy máu dạ dày và thủng dạ dày."
urgency: 4
cant_miss: false
specialties: [gastroenterology]
priors:
  - complaint: abdominal_pain
    default: P2
    by_age: { infant_0_2m: P6, child_2m_5y: P5, child_5_12: P4, teen_13_17: P3 }
    evidence:
      tier: A
      basis: numeric
      sources: [viniol-fampract-2014, nguyenvk-2026-hpylori-vietnam, nguyentc-2023-pud-children-vietnam]
      reported: "Chăm sóc ban đầu: viêm dạ dày 5,2% người đến khám vì đau bụng; nhiễm H. pylori ở Việt Nam 58,7% người lớn, 77,2% trẻ em"
      population: "Người lớn ở chăm sóc ban đầu (Viniol 2014); người Việt Nam (tổng quan 2026)"
      note: "Người lớn: P2 (5–20%) vì riêng viêm dạ dày đã khoảng 5% ở chăm sóc ban đầu, cộng thêm loét; tỷ lệ nhiễm H. pylori ở Việt Nam cao. Trẻ em: ít gặp hơn nhiều; 19% trẻ có triệu chứng được nội soi ở bệnh viện nhi tuyến cuối có loét, nhưng đó là nhóm chọn lọc. Ước P4 cho 5–12 tuổi, P3 cho 13–17 tuổi, P5 cho trẻ dưới 5 tuổi. Lưu ý: nhiều người tự gọi là 'đau dạ dày' nhưng thực ra là khó tiêu chức năng (thuộc 'nguyên nhân khác')."
findings:
  - finding: abd_pain_location
    dist: { epigastric: 0.75, right_upper: 0.06, left_upper: 0.07, periumbilical: 0.05, right_lower: 0.01, left_lower: 0.01, suprapubic: 0.01, whole: 0.04 }
    evidence:
      tier: C
      basis: verbal
      sources: [msd-peptic-ulcer, nhs-stomach-ulcer]
      locator: "MSD: đau thường khu trú ở thượng vị; NHS: đau bụng trên"
      note: "Phần lớn đau vùng trên rốn; tỷ lệ là ước lượng."
  - finding: abd_pain_meal_relation
    dist: { hungry_relieved_by_food: 0.35, worse_after_meal: 0.30, no_relation: 0.35 }
    evidence:
      tier: C
      basis: verbal
      sources: [msd-peptic-ulcer]
      locator: "MSD: loét tá tràng đỡ khi ăn, đau lại 2–3 giờ sau ăn; loét dạ dày ăn có khi làm đau tăng; chỉ khoảng một nửa có kiểu điển hình"
      note: "Chỉ khoảng một nửa người bệnh có kiểu đau liên quan bữa ăn điển hình, nên vẫn để 35% không liên quan. Tỷ lệ là ước lượng."
  - finding: abd_pain_duration
    dist: { lt_6h: 0.05, h6_24: 0.08, d1_3: 0.15, d4_14: 0.22, gt_2w: 0.50 }
    evidence:
      tier: C
      basis: verbal
      sources: [msd-peptic-ulcer, nhs-stomach-ulcer]
      locator: "NHS: đau hay tái lại; MSD: đau loét tá tràng có tính chu kỳ, tái phát"
      note: "Bệnh hay kéo dài, tái đi tái lại; đợt viêm dạ dày cấp (sau rượu, thuốc) có thể chỉ vài ngày. Phân bố là ước lượng."
  - finding: abd_pain_onset
    dist: { sudden: 0.08, gradual: 0.92 }
    evidence:
      tier: C
      basis: judgment
      sources: [msd-peptic-ulcer]
      note: "Đau đột ngột, dữ dội ngay từ đầu gợi ý thủng ổ loét (MSD), là biến chứng ít gặp. Tỷ lệ là ước lượng."
  - finding: heartburn
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-stomach-ulcer]
      locator: "NHS: có thể kèm khó tiêu, ợ nóng, đầy bụng"
      note: "Nguồn chỉ liệt kê là triệu chứng có thể có; ước 20–30%."
  - finding: regular_painkiller_use
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [msd-peptic-ulcer, nhs-stomach-ulcer]
      locator: "MSD: ở Mỹ trên 50% ổ loét do thuốc chống viêm không steroid; NHS: nguyên nhân chính là H. pylori và thuốc giảm đau chống viêm"
      note: "Ở Việt Nam H. pylori chiếm ưu thế (58,7% người lớn nhiễm), và bệnh này gộp cả viêm dạ dày, nên ước 20% người bệnh hay dùng thuốc giảm đau, thuốc xương khớp. Cao hơn tỷ lệ nền 5%."
  - finding: abd_pain_radiates_back
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [msd-peptic-ulcer]
      locator: "MSD: ổ loét xuyên thấu mặt sau tá tràng vào tụy gây đau lan ra lưng"
      note: "Chỉ gặp ở một phần nhỏ (ổ loét xuyên thấu); ước khoảng 10%."
  - finding: abd_pain_severe
    freq: rare
    evidence:
      tier: C
      basis: judgment
      sources: [msd-peptic-ulcer]
      note: "Đau thường âm ỉ, rát, cồn cào; đau đột ngột, dữ dội gợi ý thủng (biến chứng ít gặp). Mức rare thấp hơn tỷ lệ nền 5% để câu trả lời 'Có' làm giảm khả năng bệnh."
  - finding: abd_pain_worse_movement
    freq: rare
    evidence:
      tier: C
      basis: judgment
      sources: [msd-peptic-ulcer]
      note: "Đau do loét không chưa biến chứng không tăng khi đi lại, ho; dấu hiệu này gợi ý viêm phúc mạc. Ước lượng, thấp hơn tỷ lệ nền 5%."
  - finding: fever
    freq: rare
    evidence:
      tier: C
      basis: judgment
      sources: [msd-peptic-ulcer, nhs-stomach-ulcer]
      note: "Nguồn không liệt kê sốt trong triệu chứng của loét chưa biến chứng. Ước dưới 5%, thấp hơn tỷ lệ nền 5%."
  - finding: vomiting_blood
    freq: rare
    evidence:
      tier: C
      basis: judgment
      sources: [msd-peptic-ulcer, nhs-stomach-ulcer]
      locator: "MSD: xuất huyết là biến chứng hay gặp nhất (nôn ra máu hoặc bã cà phê)"
      note: "Ý định là 'nhiều hơn nền': trong người viêm, loét dạ dày đi khám vì đau bụng, khoảng 2–5% có nôn ra máu; tỷ lệ nền 1%, nên câu trả lời 'Có' làm tăng khả năng bệnh này (đây là nguyên nhân hàng đầu của xuất huyết tiêu hóa trên). Mức xử trí do quy tắc rf_gi_bleeding quyết định."
  - finding: black_stool
    freq: rare
    evidence:
      tier: C
      basis: judgment
      sources: [msd-peptic-ulcer, nhs-stomach-ulcer]
      locator: "MSD: phân đen như hắc ín do chảy máu ổ loét"
      note: "Như nôn ra máu: ước 2–5%, cao hơn tỷ lệ nền 1% là có chủ ý. Mức xử trí do quy tắc rf_gi_bleeding quyết định."
warning_signs:
  - vomiting_blood
  - black_stool
  - abd_pain_severe
  - abdomen_hard_swollen
  - fainting_or_near_fainting
  - persistent_vomiting
self_care_vi:
  - "Ăn đúng bữa, chia nhỏ bữa ăn, tránh rượu bia và thuốc lá."
  - "Hỏi bác sĩ hoặc dược sĩ trước khi dùng thuốc giảm đau, thuốc xương khớp."
see_doctor_vi:
  - "Đặt lịch khám trong vài ngày tới để được tìm vi khuẩn HP (Helicobacter pylori) và điều trị đúng."
  - "Đi khám sớm hơn nếu sụt cân, nôn (ói) kéo dài, hoặc từ 60 tuổi mới bắt đầu đau."
  - "Đi cấp cứu ngay nếu nôn ra máu, đi ngoài phân đen, hoặc đau bụng dữ dội đột ngột."
review:
  status: draft
  authors: ["agent:pass-b"]
  updated: "2026-10-25"
  notes_vi: "Giữ mức xử trí 4 như gợi ý: ca không biến chứng cần khám trong vài ngày (NHS: đi khám khi khó tiêu không đỡ hoặc đau hay tái lại); xuất huyết, thủng đã có quy tắc mức 2 (rf_gi_bleeding, rf_severe_abdominal_pain, rf_abdomen_hard_swollen). Mã ICD-10 chọn K27 (loét dạ dày – tá tràng, vị trí không xác định); bệnh còn gồm K25, K26, K29. Điểm chưa chắc: (1) bệnh gộp cả viêm dạ dày và loét, trong khi người dân gọi chung là 'đau dạ dày', kể cả khó tiêu chức năng; prior P2 có thể cao; (2) tần suất liên quan bữa ăn, ợ nóng, dùng thuốc giảm đau là ước lượng từ mô tả bằng lời; (3) hai liên kết nôn ra máu, phân đen ở mức rare (2,5%) cao hơn tỷ lệ nền 1% là có chủ ý (bộ kiểm tra sẽ cảnh báo); (4) chưa có câu hỏi 'đau làm thức giấc ban đêm', là gợi ý tốt của loét tá tràng (MSD, NHS), nhưng người soạn chưa đề xuất vì giá trị phân biệt vừa phải. Mã và tên ICD-10 tiếng Việt đã đối chiếu qua công cụ tra cứu của icd.kcb.vn (bộ mã theo Thông tư 06/2026/TT-BYT) ngày 24/10/2026; mã MONDO tra qua EBI OLS."
