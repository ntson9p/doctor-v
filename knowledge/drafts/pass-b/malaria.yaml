id: malaria
names:
  vi: "Bệnh sốt rét"
  vi_common: ["Sốt rét"]
  en: "Malaria"
codes:
  icd10: "B54"
  icd10_verified: false
  mondo: "MONDO:0005136"
summary_vi:
  - "Bệnh do ký sinh trùng sốt rét, lây khi bị muỗi Anopheles mang mầm bệnh đốt."
  - "Thường có cơn rét run, sốt cao rồi vã mồ hôi; người mắc lần đầu có thể chỉ sốt liên tục."
  - "Ở Việt Nam hầu như chỉ gặp ở người đi rừng, ngủ rẫy hoặc từ vùng có sốt rét về."
urgency: 3
cant_miss: false
specialties: [infectious_disease]
priors:
  - complaint: fever
    default: P6
    evidence:
      tier: B
      basis: numeric
      sources: [winhanoo-2023-malaria-vietnam, byt-qd-3377-2023]
      locator: "Win Han Oo 2023: Background, Results (số liệu ca bệnh toàn quốc 2017–2021); 3377 mục I"
      reported: "Năm 2020: 1.421 ca trên 1.811.387 xét nghiệm (303 ca ngoại lai); năm 2021: 467 ca; đến 2022 còn 21 tỉnh có sốt rét lưu hành, 42 tỉnh đã được công nhận loại trừ"
      note: "Vài trăm đến hơn một nghìn ca mỗi năm trên hàng chục triệu lượt sốt cả nước, nên dưới 0,02% (P6). Theo thiết kế của doctor-v, phơi nhiễm (đi rừng, ngủ rẫy, đến vùng sốt rét) được tính bằng dấu hiệu malaria_area_exposure, không nâng prior; vì vậy không đặt hệ số theo vùng hay theo giới."
  - complaint: headache
    default: P6
    evidence:
      tier: B
      basis: judgment
      sources: [winhanoo-2023-malaria-vietnam, cdc-malaria-clinical-features]
      note: "Sốt rét rất hiếm trong cả nước; người bệnh thường chọn 'sốt' là triệu chứng chính. Giữ mức thấp nhất (P6); phơi nhiễm và sốt được hỏi riêng."
findings:
  - finding: malaria_area_exposure
    freq: almost_always
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-3377-2023, winhanoo-2023-malaria-vietnam]
      locator: "3377 mục II.1 (ca nghi sốt rét: có sốt và có yếu tố dịch tễ); Win Han Oo 2023 (Results)"
      reported: "72,3% ca sốt rét 2017–2021 có tiền sử đi lại liên quan trong 14 ngày trước khi phát hiện; 62,3% là ca nội địa"
      note: "Câu hỏi doctor-v gồm cả đi rừng, ngủ rẫy hoặc đến vùng sốt rét trong 1 tháng, rộng hơn 'đi lại trong 14 ngày', nên tỷ lệ trả lời 'có' cao hơn 72%. Theo yêu cầu thiết kế, sốt rét gần như bằng 0 khi không có phơi nhiễm. Rủi ro: người sống ngay trong vùng lưu hành có thể trả lời 'không' vì không 'đi' đâu cả."
  - finding: fever
    freq: almost_always
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-3377-2023, cdc-malaria-clinical-features]
      locator: "3377 mục II.1.a (đang sốt hoặc có sốt trong 3 ngày gần đây)"
      note: "Chỉ có tác dụng khi triệu chứng chính là đau đầu."
  - finding: chills_rigors
    freq: very_frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-3377-2023, cdc-malaria-clinical-features]
      locator: "3377 mục I, II.1.a, II.3.1 (cơn sốt rét điển hình: rét run – sốt – vã mồ hôi; cơn không điển hình: ớn lạnh, gai rét); CDC (chills)"
      note: "Tần suất trong số người sốt rét có sốt. Không có số liệu; 3377 coi rét run hoặc ớn lạnh là biểu hiện thường gặp."
  - finding: fever_cyclic
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-3377-2023]
      locator: "Mục II.1.a và II.3.1 (người mắc lần đầu thường không có cơn sốt điển hình, sốt liên tục hoặc dao động)"
      note: "Cơn sốt có chu kỳ là kiểu điển hình nhưng không thường gặp ở người mắc lần đầu và trẻ em; ước lượng occasional."
  - finding: fever_max_temp
    dist: { lt_38: 0.08, t38_39: 0.32, ge_39: 0.60 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-3377-2023]
      locator: "Mục II.3.1, II.3.2.1 (sốt cao liên tục là dấu hiệu cảnh báo sốt rét ác tính)"
      note: "Cơn sốt rét thường sốt cao; phân bố ước lượng."
  - finding: fever_duration
    dist: { d1_2: 0.40, d3_5: 0.38, d6_7: 0.12, gt_7d: 0.10 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-3377-2023]
      locator: "Mục II.1.a"
      note: "Ước lượng; ở vùng lưu hành người dân thường đi xét nghiệm sớm, nhưng ca ngoại lai có thể đến muộn."
  - finding: headache
    freq: very_frequent
    evidence:
      tier: B
      basis: judgment
      sources: [cdc-malaria-clinical-features, byt-qd-3377-2023]
      locator: "CDC: Uncomplicated malaria; 3377 mục II.3.2.1 (đau đầu dữ dội là dấu hiệu cảnh báo)"
      note: "CDC liệt kê đau đầu trong các triệu chứng chính nhưng không nêu tần suất; ước lượng very_frequent."
  - finding: myalgia
    freq: frequent
    evidence:
      tier: B
      basis: judgment
      sources: [cdc-malaria-clinical-features]
      locator: "Uncomplicated malaria (body aches)"
      note: "Có trong danh sách triệu chứng của CDC, không có tần suất; ước lượng."
  - finding: vomiting
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [cdc-malaria-clinical-features, byt-qd-3377-2023]
      locator: "CDC: nausea and vomiting; 3377 mục II.3.2.1 (nôn nhiều là dấu hiệu cảnh báo)"
      note: "Ước lượng."
  - finding: jaundice
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [cdc-malaria-clinical-features, byt-qd-3377-2023]
      locator: "CDC: physical findings (mild jaundice); 3377 mục II.3.2.2 (vàng da do tổn thương gan là biểu hiện sốt rét ác tính)"
      note: "Vàng da nhẹ có thể gặp ở sốt rét chưa biến chứng; vàng da rõ gợi ý sốt rét nặng. Ước lượng occasional, cao hơn nhiều so với tỷ lệ nền."
  - finding: rash_any
    freq: rare
    evidence:
      tier: B
      basis: judgment
      sources: [cdc-malaria-clinical-features, byt-qd-3377-2023]
      locator: "CDC: Uncomplicated malaria; 3377 mục II.3"
      note: "Cả hai nguồn không nêu phát ban; ban gợi ý sốt xuất huyết, sởi, sốt mò hơn. Đặt dưới tỷ lệ nền để trả lời 'có' làm giảm khả năng sốt rét."
warning_signs:
  - severe_weakness
  - confusion
  - drowsy_hard_to_wake
  - seizure_recent
  - jaundice
  - bleeding_gums_nose
  - breathing_difficulty
  - decreased_urine
  - persistent_vomiting
  - black_stool
self_care_vi:
  - "Không tự mua thuốc sốt rét để uống khi chưa được xét nghiệm."
  - "Uống đủ nước, nghỉ ngơi trong lúc chờ đi khám."
see_doctor_vi:
  - "Đi khám trong ngày để xét nghiệm máu tìm ký sinh trùng sốt rét; trạm y tế xã ở vùng sốt rét có làm."
  - "Nói rõ với nhân viên y tế nơi đã đi rừng, ngủ rẫy hoặc nước đã đến."
  - "Nếu lần xét nghiệm đầu âm tính mà vẫn còn sốt, cần xét nghiệm lại theo hẹn."
  - "Đến cơ sở cấp cứu ngay nếu li bì, lú lẫn, co giật, vàng da hoặc mệt lả không tự đi được."
review:
  status: draft
  authors: ["agent:pass-b"]
  updated: "2026-10-24"
  notes_vi: "Mức xử trí 3, không thuộc nhóm không được bỏ sót: giữ như gợi ý vì 3377 (mục III.2.1) điều trị sốt rét chưa biến chứng bằng thuốc uống 3 ngày; mọi ca nghi phải xét nghiệm trong ngày (quy tắc rf_fever_malaria_exposure, mức 3); sốt rét ác tính (suy sụp, rối loạn ý thức, co giật, vàng da, xuất huyết, khó thở, tiểu ít) do các quy tắc mức 2 xử lý. Điểm chưa chắc: (1) prior P6 là mức thấp nhất của thang; với phơi nhiễm 'có' (tỷ số khoảng 95 lần) xác suất ban đầu lên gần 1%, có thể vẫn hơi cao cho người đi rừng trong nước (tỷ lệ dương tính năm 2020 khoảng 0,08% số xét nghiệm) nhưng thấp cho người từ châu Phi về; (2) tỷ lệ nền 1% của malaria_area_exposure có thể quá thấp ở người dân Tây Nguyên, nơi đi rừng, ngủ rẫy là phổ biến: đề nghị người bảo trì xem xét tỷ lệ nền theo vùng; (3) chưa có số liệu tần suất triệu chứng ở người Việt Nam mắc sốt rét, các mức chủ yếu là ước lượng từ mô tả của 3377 và CDC; (4) mã ICD-10 B54 (sốt rét không đặc hiệu) chỉ đại diện, sốt rét do từng loài có mã B50–B53; chưa đối chiếu icd.kcb.vn. Không thêm liên kết dấu hiệu nặng (lú lẫn, co giật) vì tần suất ở người dùng cộng đồng chỉ vài phần trăm, gần tỷ lệ nền."
