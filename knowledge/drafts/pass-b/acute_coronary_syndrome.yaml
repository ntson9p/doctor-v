id: acute_coronary_syndrome
names:
  vi: "Hội chứng mạch vành cấp"
  vi_common: ["Nhồi máu cơ tim", "Hội chứng vành cấp", "Cơn đau tim"]
  en: "Acute coronary syndrome"
codes:
  icd10: "I24.9"
  icd10_verified: true
  mondo: "MONDO:0005542"
summary_vi:
  - "Mạch máu nuôi tim bị hẹp hoặc tắc đột ngột, làm cơ tim thiếu máu."
  - "Thường đau tức giữa ngực, nhưng người cao tuổi, người đái tháo đường có thể chỉ đau vùng trên rốn."
  - "Cần cấp cứu ngay vì có thể đe dọa tính mạng trong vài giờ."
urgency: 1
cant_miss: true
specialties: [cardiology, emergency]
priors:
  - complaint: abdominal_pain
    default: P6
    by_age: { adult_45_64: P5, elder_65_74: P4, elder_75p: P4 }
    evidence:
      tier: B
      basis: judgment
      sources: [canto-2000-jama-mi-no-chest-pain, canto-2012-jama-mi-age-sex, byt-qd-2187-2019, viniol-2014-abdominal-pain-primary-care, trinh-2025-nste-acs-vietnam, le-2025-acs-pci-vietnam]
      locator: "2187/QĐ-BYT, phần III (nhồi máu cơ tim ST chênh lên): triệu chứng không điển hình"
      note: "33% người nhồi máu cơ tim không đau ngực khi đến viện, nhóm này lớn tuổi hơn hẳn (trung bình 74 tuổi) và nhiều đái tháo đường hơn (Canto 2000); đau thượng vị là một biểu hiện không điển hình (2187/QĐ-BYT). Tổng quan đau bụng ở chăm sóc ban đầu (Viniol 2014) không có bệnh tim trong các nguyên nhân thường gặp, nên tỷ lệ chắc dưới 1% kể cả ở người cao tuổi. Người bệnh ở Việt Nam trung bình 64–66 tuổi (Trinh 2025; Le 2025). Người soạn ước: dưới 45 tuổi dưới 0,02% (P6), 45–64 tuổi 0,02–0,2% (P5), từ 65 tuổi 0,2–1% (P4). Không thêm hệ số theo giới dù nam mắc nhiều hơn (khoảng 60–70% người bệnh là nam), để không đánh giá thấp bệnh ở phụ nữ vốn hay biểu hiện không điển hình (Canto 2012). Cần bác sĩ duyệt."
findings:
  - finding: abd_pain_location
    dist: { epigastric: 0.70, right_upper: 0.05, left_upper: 0.07, periumbilical: 0.05, right_lower: 0.02, left_lower: 0.02, suprapubic: 0.02, whole: 0.07 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-2187-2019, vanoosterhout-2020-jaha-acs-symptoms]
      note: "Khi biểu hiện bằng đau bụng, vị trí điển hình là thượng vị (2187/QĐ-BYT; van Oosterhout 2020 xếp 'đau dạ dày hoặc thượng vị' vào các triệu chứng được báo cáo). Tỷ lệ từng vùng là ước lượng của người soạn."
  - finding: chest_pain_pressure
    freq: frequent
    freq_by_age: { elder_75p: occasional }
    evidence:
      tier: A
      basis: judgment
      sources: [vanoosterhout-2020-jaha-acs-symptoms, canto-2000-jama-mi-no-chest-pain, canto-2012-jama-mi-age-sex]
      note: "Trong hội chứng mạch vành cấp nói chung, đau ngực gặp ở 74–79% (van Oosterhout 2020). Ở người chọn đau bụng là triệu chứng chính, người soạn ước khoảng một nửa vẫn có tức ngực kèm theo. Tỷ lệ không đau ngực tăng theo tuổi (Canto 2000: người không đau ngực trung bình 74 tuổi; Canto 2012), nên hạ còn occasional ở người từ 75 tuổi để câu trả lời 'Không' ít làm giảm khả năng bệnh."
  - finding: pain_radiates_arm_jaw
    freq: occasional
    evidence:
      tier: A
      basis: numeric
      sources: [vanoosterhout-2020-jaha-acs-symptoms, swap-2005-jama-chest-pain-history]
      reported: "Đau tay hoặc vai trái 37–38% ở người bệnh tại viện; đau lan vai, cánh tay có LR 2,3–4,7."
      note: "Số liệu ở bệnh viện và ở mọi kiểu biểu hiện; với người chủ yếu đau bụng, người soạn hạ một mức thành occasional. Tỷ lệ nền của dấu hiệu là 1% nên trả lời 'Có' làm tăng mạnh khả năng bệnh."
  - finding: cold_sweat
    freq: frequent
    evidence:
      tier: A
      basis: numeric
      sources: [vanoosterhout-2020-jaha-acs-symptoms, byt-qd-2187-2019]
      reported: "Vã mồ hôi 44–47% (nữ/nam)."
      note: "2187/QĐ-BYT: đau kèm vã mồ hôi gợi ý nhiều đến nhồi máu cơ tim."
  - finding: breathing_difficulty
    freq: frequent
    evidence:
      tier: A
      basis: numeric
      sources: [vanoosterhout-2020-jaha-acs-symptoms, byt-qd-2187-2019]
      reported: "Khó thở 40–48% (nam/nữ)."
  - finding: nausea
    freq: frequent
    evidence:
      tier: A
      basis: numeric
      sources: [vanoosterhout-2020-jaha-acs-symptoms, byt-qd-2187-2019]
      reported: "Buồn nôn hoặc nôn 28–39% (nam/nữ)."
      note: "Ở biểu hiện đau thượng vị buồn nôn có thể nhiều hơn; chọn frequent. Tỷ lệ nền của buồn nôn ở người đau bụng là 35% nên dấu hiệu này phân biệt kém."
  - finding: fainting_or_near_fainting
    freq: occasional
    evidence:
      tier: A
      basis: verbal
      sources: [vanoosterhout-2020-jaha-acs-symptoms, byt-qd-2187-2019]
      note: "Choáng váng và ngất được báo cáo trong các nghiên cứu gộp (van Oosterhout 2020); 2187/QĐ-BYT nêu cơn ngất là lý do chuyển viện ngay. Chọn occasional."
  - finding: abd_pain_radiates_back
    freq: occasional
    evidence:
      tier: A
      basis: verbal
      sources: [vanoosterhout-2020-jaha-acs-symptoms]
      note: "Đau giữa hai bả vai là triệu chứng được báo cáo, hay gặp ở nữ hơn (OR 2,15). Người soạn ước occasional."
  - finding: abd_pain_severe
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-2187-2019]
      note: "Biểu hiện đau thượng vị thường là khó chịu, đè nặng hơn là đau dữ dội. Ước lượng của người soạn."
  - finding: abd_pain_duration
    dist: { lt_6h: 0.50, h6_24: 0.25, d1_3: 0.12, d4_14: 0.06, gt_2w: 0.07 }
    evidence:
      tier: B
      basis: judgment
      sources: [canto-2000-jama-mi-no-chest-pain, byt-qd-2187-2019]
      note: "Người nhồi máu cơ tim không đau ngực đến viện trung bình sau 7,9 giờ (Canto 2000). Cơn đau thường kéo dài trên 20–30 phút (2187/QĐ-BYT); có người đã có các cơn đau tái diễn trước đó. Phân bố là ước lượng của người soạn."
  - finding: abd_pain_meal_relation
    dist: { hungry_relieved_by_food: 0.05, worse_after_meal: 0.15, no_relation: 0.80 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-2187-2019]
      note: "Đau do thiếu máu cơ tim thường không liên quan đến bữa ăn; đau lúc đói, ăn vào đỡ gợi ý loét dạ dày – tá tràng. Ước lượng của người soạn."
  - finding: diabetes
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [canto-2000-jama-mi-no-chest-pain, trinh-2025-nste-acs-vietnam, le-2025-acs-pci-vietnam]
      reported: "Đái tháo đường 32,6% ở người nhồi máu cơ tim không đau ngực (Canto 2000); 27,6% và khoảng 33% ở hai nhóm người bệnh Việt Nam."
      note: "Nằm ở ranh giới occasional/frequent; chọn occasional. Tỷ lệ nền 7%."
  - finding: hypertension_known
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [trinh-2025-nste-acs-vietnam, le-2025-acs-pci-vietnam]
      reported: "Tăng huyết áp 74,0% (Bạch Mai) và khoảng 45% (TP. Hồ Chí Minh)."
      note: "Câu hỏi hỏi tăng huyết áp đã biết; nhiều người Việt Nam chưa được phát hiện tăng huyết áp, nên chọn frequent."
  - finding: known_heart_disease
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [canto-2000-jama-mi-no-chest-pain]
      note: "26,4% người nhồi máu cơ tim không đau ngực đã có suy tim trước đó (Canto 2000); thêm người đã biết bệnh mạch vành. Người soạn ước occasional."
  - finding: smoker
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [trinh-2025-nste-acs-vietnam, le-2025-acs-pci-vietnam]
      reported: "Hút thuốc 42,5% (Bạch Mai) và khoảng 20% (TP. Hồ Chí Minh)."
      note: "Hai nguồn lệch nhau; chọn frequent vì đa số người bệnh là nam và tỷ lệ nền 20% của câu hỏi đã gồm cả nữ (rất ít hút thuốc)."
  - finding: fever
    freq: rare
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-2187-2019]
      note: "Sốt không có trong các triệu chứng khởi phát (2187/QĐ-BYT). Đau bụng kèm sốt nghiêng về bệnh nhiễm trùng ổ bụng."
warning_signs: [es_crushing_chest_pain, chest_pain_pressure, cold_sweat, breathing_difficulty, fainting_or_near_fainting, pain_radiates_arm_jaw]
self_care_vi:
  - "Gọi 115 ngay. Không tự lái xe đến bệnh viện."
  - "Ngồi hoặc nằm nghỉ, tránh đi lại và gắng sức trong lúc chờ."
see_doctor_vi:
  - "Cần được làm điện tim và xét nghiệm máu càng sớm càng tốt."
  - "Gọi 115 cả khi cơn đau đã giảm, nếu kèm vã mồ hôi, khó thở hoặc choáng."
review:
  status: draft
  authors: ["agent:pass-b"]
  updated: "2026-10-24"
  notes_vi: "Giữ mức xử trí 1 và cant_miss: true: 2187/QĐ-BYT khuyến cáo nghi hội chứng mạch vành cấp thì liên lạc ngay 115, không tự lái xe, nằm nghỉ. Prior chỉ khai báo cho triệu chứng đau bụng (biểu hiện đau thượng vị). Không dùng NICE CG95 vì trang NICE chặn truy cập trực tiếp. Điểm chưa chắc: (1) prior là ước lượng, chưa có số liệu tỷ lệ hội chứng mạch vành cấp trong người đau bụng ở tuyến ban đầu; (2) tần suất triệu chứng kèm lấy từ người bệnh tại viện ở mọi kiểu biểu hiện, chưa có số liệu riêng cho biểu hiện đau thượng vị; (3) không liên kết ợ chua, đau tăng khi đi lại, tiêu chảy, nôn để các câu trả lời này không làm giảm khả năng bệnh (đau khi gắng sức có thể bị hiểu là 'đau tăng khi đi lại'); (4) quyết định không dùng hệ số theo giới cần bác sĩ xem lại."
