id: bowel_obstruction
names:
  vi: "Tắc ruột"
  en: "Bowel obstruction"
codes:
  icd10: "K56.7"
  icd10_verified: true
  mondo: "MONDO:0004565"
summary_vi:
  - "Ruột bị tắc, thức ăn và hơi trong ruột không đi xuống được."
  - "Thường đau quặn bụng từng cơn, nôn (ói), bụng chướng, không đi ngoài và không xì hơi được."
  - "Đây là cấp cứu ngoại khoa; người đã từng mổ bụng có nguy cơ cao hơn."
urgency: 2
cant_miss: true
specialties: [general_surgery, emergency]
priors:
  - complaint: abdominal_pain
    default: P4
    by_age: { infant_0_2m: P5, child_2m_5y: P5, child_5_12: P5, teen_13_17: P5, elder_65_74: P3, elder_75p: P3 }
    evidence:
      tier: A
      basis: numeric
      sources: [taylor-2013-sbo-meta-analysis, bohner-1998-bowel-obstruction]
      reported: "Tắc ruột non khoảng 2% người đau bụng ở khoa cấp cứu; tắc ruột 3,8% người đau bụng cấp ở bệnh viện"
      population: "Người lớn đau bụng ở khoa cấp cứu (Taylor 2013) và ở bệnh viện Đức (Böhner 1998)"
      note: "Ở cộng đồng thấp hơn ở cấp cứu: ước P4 (0,2–1%) cho người lớn dưới 65 tuổi; P3 từ 65 tuổi vì tuổi trên 50 là một trong các yếu tố nhạy nhất (Böhner 1998) và người già có thêm nguyên nhân u đại tràng, thoát vị. Trẻ em: P5 (lồng ruột được tính riêng). Chưa có số liệu Việt Nam."
findings:
  - finding: no_stool_or_gas
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [wses-asbo-2018, rami-reddy-2017-sbo-review, bohner-1998-bowel-obstruction, taylor-2013-sbo-meta-analysis]
      locator: "WSES 2018 mục Diagnosis (có hoặc không có bí trung tiện); Rami Reddy 2017 (táo bón đến bí trung đại tiện); Böhner 1998 (tiền sử táo bón)"
      note: "Tắc không hoàn toàn hoặc tắc cao lúc mới bị vẫn có thể còn đi ngoài, xì hơi (WSES), nên chọn frequent."
  - finding: abdomen_hard_swollen
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [rami-reddy-2017-sbo-review, eskelinen-1994-sbo-clinical, bohner-1998-bowel-obstruction, wses-asbo-2018]
      locator: "Eskelinen 1994: chướng bụng RR 13,1; Böhner 1998: chướng bụng là dấu hiệu nhạy nhất"
      note: "Câu hỏi gộp bụng cứng và chướng căng; tắc cao ít chướng hơn tắc thấp. Chọn frequent."
  - finding: vomiting
    freq: very_frequent
    evidence:
      tier: B
      basis: verbal
      sources: [rami-reddy-2017-sbo-review, jackson-2011-aafp-bowel-obstruction, wses-asbo-2018]
      locator: "Rami Reddy 2017 (bộ bốn kinh điển); AAFP 2011: đau quặn, buồn nôn, nôn là dấu hiệu chính"
  - finding: nausea
    freq: very_frequent
    evidence:
      tier: B
      basis: verbal
      sources: [wses-asbo-2018, jackson-2011-aafp-bowel-obstruction]
      locator: "WSES 2018: đau quặn từng cơn, chướng bụng, buồn nôn có hoặc không có nôn"
  - finding: persistent_vomiting
    freq: frequent
    evidence:
      tier: C
      basis: judgment
      sources: [rami-reddy-2017-sbo-review, wses-asbo-2018]
      note: "Nôn nhiều lần, không giữ được nước hay gặp, nhất là tắc ruột non; WSES nhấn mạnh tình trạng mất nước. Ước khoảng một nửa."
  - finding: vomiting_bilious
    freq: frequent
    evidence:
      tier: B
      basis: judgment
      sources: [bines-2006-intussusception-vietnam, nhs-stomach-ache, nhs-diarrhoea-vomiting]
      locator: "Bines 2006 Hộp 1 (nôn dịch mật là bằng chứng tắc ruột); NHS: nôn dịch xanh cần đi cấp cứu"
      note: "Tần suất trong số người có nôn. Nguồn không cho tần suất ở người lớn; ước khoảng một nửa (tắc cao nôn dịch mật, tắc thấp có thể nôn chất như phân)."
  - finding: abd_pain_colicky
    freq: very_frequent
    evidence:
      tier: B
      basis: verbal
      sources: [wses-asbo-2018, jackson-2011-aafp-bowel-obstruction, eskelinen-1994-sbo-clinical]
      locator: "WSES 2018 mục Diagnosis; AAFP 2011; Eskelinen 1994: đau quặn từng cơn RR 2,4"
      note: "Người già có thể đau ít rõ hơn (WSES)."
  - finding: previous_abdominal_surgery
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [jackson-2011-aafp-bowel-obstruction, rami-reddy-2017-sbo-review, eskelinen-1994-sbo-clinical, wses-asbo-2018]
      reported: "Dính ruột sau mổ gây khoảng 60–65% tắc ruột non; tiền sử mổ bụng RR 12,1 (Eskelinen 1994)"
      note: "Tắc ruột già (u, xoắn) và tắc do thoát vị ít liên quan mổ cũ; ở Việt Nam có thể nhiều thoát vị, u hơn. Ước 50–65%, chọn frequent; tỷ lệ nền mới 0,15 cho LR+ khoảng 3."
  - finding: hernia_lump_painful
    freq: occasional
    evidence:
      tier: C
      basis: numeric
      sources: [rami-reddy-2017-sbo-review, jackson-2011-aafp-bowel-obstruction, wses-asbo-2018]
      reported: "Thoát vị gây khoảng 10% tắc ruột (Rami Reddy 2017; AAFP 2011)"
      note: "Dấu hiệu đề xuất mới (xem proposed_findings). WSES nhắc khám tìm thoát vị thành bụng, vùng bẹn khi nghi tắc ruột."
  - finding: abd_pain_location
    dist: { epigastric: 0.10, right_upper: 0.03, left_upper: 0.03, periumbilical: 0.30, right_lower: 0.06, left_lower: 0.05, suprapubic: 0.03, whole: 0.40 }
    evidence:
      tier: C
      basis: judgment
      sources: [wses-asbo-2018, jackson-2011-aafp-bowel-obstruction]
      note: "Đau quặn lan tỏa, quanh rốn hoặc khắp bụng. Phân bố là ước lượng."
  - finding: abd_pain_onset
    dist: { sudden: 0.35, gradual: 0.65 }
    evidence:
      tier: C
      basis: judgment
      sources: [jackson-2011-aafp-bowel-obstruction]
      note: "Tắc ruột non do dính, xoắn có thể khởi phát nhanh; tắc ruột già do u thường từ từ. Ước lượng."
  - finding: abd_pain_duration
    dist: { lt_6h: 0.12, h6_24: 0.33, d1_3: 0.38, d4_14: 0.14, gt_2w: 0.03 }
    evidence:
      tier: C
      basis: judgment
      sources: [bohner-1998-bowel-obstruction, wses-asbo-2018]
      note: "Böhner 1998 chỉ gồm người đau dưới 7 ngày. Phân bố là ước lượng."
  - finding: abd_pain_severe
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [wses-asbo-2018]
      note: "Đau quặn có thể rất mạnh, nhưng người già thường đau ít (WSES); câu hỏi 'không chịu nổi' là ngưỡng cao. Ước 20–30%."
  - finding: abd_pain_worse_movement
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [rami-reddy-2017-sbo-review, wses-asbo-2018]
      note: "Dấu hiệu kích thích phúc mạc gợi ý tắc ruột tiến triển, thắt nghẹt (Rami Reddy 2017). Ước 20%."
  - finding: diarrhea
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [wses-asbo-2018]
      locator: "WSES 2018 mục Diagnosis: tắc không hoàn toàn có thể tiêu chảy phân nước, dễ nhầm với viêm dạ dày – ruột"
      note: "Liên kết để tiêu chảy không loại trừ quá mạnh tắc ruột."
warning_signs:
  - no_stool_or_gas
  - abdomen_hard_swollen
  - persistent_vomiting
  - vomiting_bilious
  - abd_pain_severe
  - fainting_or_near_fainting
see_doctor_vi:
  - "Đến cơ sở cấp cứu ngay khi đau bụng kèm nôn (ói), bụng chướng, hoặc không xì hơi được."
  - "Người đã từng mổ bụng, người cao tuổi càng cần đi khám sớm khi có các dấu hiệu này."
  - "Khối phồng ở bẹn hoặc rốn bỗng sưng đau, không đẩy lên được cần đi cấp cứu ngay."
review:
  status: draft
  authors: ["agent:pass-b"]
  updated: "2026-10-25"
  notes_vi: "Giữ mức xử trí 2 và cant_miss như gợi ý: WSES 2018 coi tắc ruột non là cấp cứu ngoại khoa, tử vong trong viện khoảng 3% mỗi đợt; tử vong chung khoảng 10%, đến 30% khi hoại tử hoặc thủng (Rami Reddy 2017). Mã ICD-10 chọn K56.7 (tắc ruột, không xác định); tắc do thoát vị thuộc nhóm K40–K46. Điểm chưa chắc: (1) không mở được toàn văn tổng quan Taylor 2013 nên chưa có độ nhạy bằng số cho táo bón, chướng bụng, tiền sử mổ; các mức dựa trên mô tả bằng lời của WSES, AAFP và RR của Eskelinen; (2) tỷ lệ tắc ruột trong người đau bụng ở cộng đồng Việt Nam chưa có số liệu; (3) đề xuất dấu hiệu mới 'khối phồng đau ở bẹn hoặc rốn' cho thoát vị nghẹt, và lượt C có thể cân nhắc quy tắc mức 2 cho dấu hiệu này; (4) nôn dịch xanh hoặc vàng đắng: tỷ lệ nền 5% có thể thấp vì sau nhiều lần nôn do bất kỳ nguyên nhân nào cũng hay có dịch vàng. Mã và tên ICD-10 tiếng Việt đã đối chiếu qua công cụ tra cứu của icd.kcb.vn (bộ mã theo Thông tư 06/2026/TT-BYT) ngày 24/10/2026; mã MONDO tra qua EBI OLS."
proposed_findings:
  - id: hernia_lump_painful
    kind: sign
    type: binary
    label_vi: "Khối phồng đau ở bẹn hoặc rốn"
    question_vi: "Có khối phồng ở bẹn, đùi hoặc rốn, sờ vào thấy đau không?"
    help_vi: "Ví dụ: chỗ thoát vị (sa ruột) trước đây đẩy lên được, nay sưng to, đau, không đẩy lên được."
    leak: specific
    notes_vi: "Lượt B lô 3 đề xuất. Thoát vị nghẹt là nguyên nhân tắc ruột hay gặp sau dính ruột (khoảng 10%), cần mổ cấp cứu; giúp phân biệt tắc ruột với các nguyên nhân đau bụng khác. Có thể cần thêm quy tắc mức 2."
