id: pneumonia
names:
  vi: "Viêm phổi mắc phải ở cộng đồng"
  vi_common: ["Viêm phổi", "Viêm phế quản phổi"]
  en: "Community-acquired pneumonia"
codes:
  icd10: "J18.9"
  icd10_verified: false
  mondo: "MONDO:0005249"
summary_vi:
  - "Nhiễm trùng ở phổi, thường do vi khuẩn hoặc vi rút, mắc phải ngoài bệnh viện."
  - "Thường sốt, ho có đờm, thở nhanh hoặc khó thở; có thể đau ngực khi hít sâu."
  - "Trẻ nhỏ và người cao tuổi dễ bị nặng; người già có khi chỉ mệt lả hoặc lú lẫn."
urgency: 3
cant_miss: false
specialties: [respiratory, general_medicine]
priors:
  - complaint: fever
    default: P3
    by_age:
      child_2m_5y: P2
      elder_65_74: P2
      elder_75p: P2
    evidence:
      tier: B
      basis: judgment
      sources: [vanvugt-bmj-2013, yoshida-jpediatr-2013, takahashi-bmcinfectdis-2013, byt-qd-3312-2015]
      reported: "5% người lớn ho cấp ở tuyến ban đầu có viêm phổi trên phim (GRACE); viêm phổi phải nhập viện ở Nha Trang: trẻ dưới 5 tuổi 3,3/1.000 (12–23 tháng 8,3/1.000), người từ 65 tuổi 4,6/1.000, gấp khoảng 10 lần người trẻ"
      note: "Thang tuyệt đối (kb-guide 2.3). Người sốt còn nhiều nguyên nhân ngoài hô hấp nên ước 1–5% (P3) ở người lớn và trẻ lớn; trẻ dưới 5 tuổi và người từ 65 tuổi mắc nhiều hơn rõ nên 5–20% (P2). Số ca ngoại trú nhiều hơn số nhập viện. Hai lượt thống nhất."
  - complaint: abdominal_pain
    default: P5
    by_age:
      child_2m_5y: P3
      child_5_12: P3
      teen_13_17: P4
      elder_65_74: P4
      elder_75p: P4
    evidence:
      tier: B
      basis: judgment
      sources: [moustaki-pedpulmonol-2003, byt-qd-4235-2012]
      reported: "34% trẻ trên 4 tuổi viêm phổi thùy có đau bụng (bệnh viện)"
      note: "Viêm phổi thùy dưới ở trẻ có thể giống bệnh bụng cấp; 4235 ghi người lớn viêm phổi có khi nôn, chướng bụng, đau bụng; người cao tuổi biểu hiện không điển hình. Ước 1–5% ở trẻ em, 0,2–1% ở vị thành niên và người cao tuổi, 0,02–0,2% ở người lớn. Hai lượt thống nhất."
  - complaint: cough
    default: P2
    by_age:
      child_5_12: P3
      teen_13_17: P3
      adult_18_44: P3
    evidence:
      tier: B
      basis: numeric
      sources: [vanvugt-bmj-2013, takahashi-bmcinfectdis-2013, byt-qd-3312-2015]
      locator: "van Vugt 2013 bảng 1"
      reported: "140/2.820 người lớn ho cấp ở tuyến ban đầu (5%) có viêm phổi trên phim (tuổi trung bình 50; người viêm phổi 54); viêm phổi nhập viện ở người từ 65 tuổi gấp khoảng 10 lần người trẻ hơn (Nha Trang)"
      population: "người lớn ho cấp ở tuyến ban đầu, 12 nước châu Âu"
      note: "Lượt B (lô 3). Thang tuyệt đối. 5% nằm ở ranh giới P3/P2; viêm phổi tăng rõ ở trẻ dưới 5 tuổi và người lớn tuổi (Takahashi; 3312: viêm phổi là bệnh hay gặp, nặng ở trẻ nhỏ), nên P2 cho trẻ dưới 5 tuổi và từ 45 tuổi, P3 cho trẻ 5–17 tuổi và người 18–44 tuổi. Ở Việt Nam viêm phổi có thể nhiều hơn châu Âu; chưa có số liệu ngoại trú Việt Nam."
  - complaint: shortness_of_breath
    default: P3
    by_age:
      infant_0_2m: P2
      child_2m_5y: P2
      elder_65_74: P2
      elder_75p: P2
    evidence:
      tier: B
      basis: numeric
      sources: [frese-jcmr-2011, byt-qd-3312-2015, takahashi-bmcinfectdis-2013]
      locator: "Frese 2011 bảng 5"
      reported: "viêm phổi 2,6% lần khám vì khó thở mới (Hà Lan), 3,2% (Đức)"
      population: "người mọi lứa tuổi đi khám bác sĩ đa khoa vì khó thở"
      note: "Lượt B (lô 3). Ở người lớn khó thở chủ yếu do viêm phế quản, hen, bệnh phổi tắc nghẽn mạn tính, suy tim; viêm phổi 1–5% (P3). Trẻ dưới 5 tuổi: thở nhanh, rút lõm lồng ngực là tiêu chuẩn chẩn đoán viêm phổi (3312), nên viêm phổi chiếm phần lớn hơn (P2). Từ 65 tuổi viêm phổi tăng khoảng 10 lần (Takahashi): P2."
  - complaint: chest_pain
    default: P3
    evidence:
      tier: B
      basis: judgment
      sources: [verdon-smw-2008, vanvugt-bmj-2013, byt-qd-4235-2012]
      locator: "Verdon 2008 tóm tắt; 4235 bài Viêm phổi mắc phải ở cộng đồng, mục 2.1.1"
      reported: "nguyên nhân hô hấp chiếm 10% người đau ngực ở tuyến ban đầu (Thụy Sĩ); đau ngực 57% người viêm phổi (GRACE)"
      note: "Lượt B (lô 3). 4235: đau ngực thường có, đôi khi là triệu chứng nổi bật. Trong 10% đau ngực do hô hấp có viêm phổi, viêm phế quản, hen; ước viêm phổi 1–5% (P3) ở mọi lứa tuổi được hỏi. Ước lượng."
findings:
  - finding: fever
    freq: frequent
    freq_by_age:
      child_2m_5y: very_frequent
      child_5_12: very_frequent
    evidence:
      tier: A
      basis: numeric
      sources: [htun-scirep-2019, vanvugt-bmj-2013, shah-jama-2017, byt-qd-3312-2015]
      reported: "người lớn: sốt theo bệnh sử 0,61 (gộp), 59% (GRACE); trẻ em: nhiệt độ trên 37,5°C 80–92%"
      note: "Chỉ có tác dụng khi triệu chứng chính là đau bụng. 3312: chẩn đoán viêm phổi trẻ em dựa trên ho, sốt kèm thở nhanh, rút lõm hoặc nghe phổi bất thường. Lượt A để very_frequent cho mọi tuổi; chọn cách tách theo tuổi của lượt B vì nguồn cho thấy khác biệt rõ."
  - finding: fever_max_temp
    dist: { lt_38: 0.15, t38_39: 0.40, ge_39: 0.45 }
    evidence:
      tier: C
      basis: verbal
      sources: [byt-qd-4235-2012, htun-scirep-2019]
      locator: "4235, bài Viêm phổi mắc phải ở cộng đồng, mục 2.1.1"
      note: "4235: khởi phát đột ngột với sốt cao 39–40°C, rét run. Nhiệt độ đo từ 38°C lúc khám có độ nhạy 0,40 (Htun); nhiệt độ cao nhất ở nhà thường cao hơn. Phân bố trong số người có sốt (lượt B). Bậc C vì bài viêm phổi của 4235 có thể đã được thay thế."
  - finding: fever_duration
    dist: { d1_2: 0.27, d3_5: 0.45, d6_7: 0.16, gt_7d: 0.12 }
    evidence:
      tier: B
      basis: judgment
      sources: [vanvugt-bmj-2013, takahashi-bmcinfectdis-2013]
      reported: "trung bình 9 ngày bệnh trước khi khám (người lớn ho cấp, GRACE); khởi phát đến nhập viện trung bình 2,7–4,2 ngày (Nha Trang)"
      note: "Viêm phổi thường xuất hiện sau vài ngày nhiễm trùng hô hấp. Phân bố là ước lượng, trung bình của hai lượt."
  - finding: chills_rigors
    freq: frequent
    evidence:
      tier: C
      basis: verbal
      sources: [byt-qd-4235-2012]
      locator: "4235, bài Viêm phổi mắc phải ở cộng đồng, mục 2.1.1"
      note: "Sốt cao kèm rét run khi khởi phát (thể điển hình ở người lớn); không có tỷ lệ. Tần suất trong số người có sốt. Chỉ lượt B có liên kết này."
  - finding: cough
    freq: very_frequent
    freq_by_age:
      elder_75p: frequent
    evidence:
      tier: A
      basis: numeric
      sources: [htun-scirep-2019, byt-qd-3312-2015, metlay-archintmed-1997]
      reported: "0,91 (6 nghiên cứu, người lớn tuyến ban đầu)"
      note: "Nhiều nghiên cứu chỉ tuyển người có ho nên số bị thổi phồng; vẫn chọn very_frequent. 3312: ho là một phần của chẩn đoán ở trẻ. Metlay: người cao tuổi báo ít triệu chứng hơn rõ, nên hạ một mức từ 75 tuổi (lượt B; thận trọng: câu 'không ho' ít loại trừ viêm phổi ở người rất già)."
  - finding: productive_cough
    freq: very_frequent
    evidence:
      tier: B
      basis: numeric
      sources: [vanvugt-bmj-2013, htun-scirep-2019]
      reported: "có đờm 86% (GRACE); khạc đờm 0,66 khi ho 0,91 (Htun), tức khoảng 73% số người có ho"
      population: "người lớn ho cấp ở tuyến ban đầu"
      note: "Tần suất trong số người có ho. Trẻ nhỏ ít khạc đờm; chưa có nguồn để tách theo tuổi."
  - finding: breathing_difficulty
    freq: frequent
    freq_by_age:
      child_2m_5y: very_frequent
    evidence:
      tier: A
      basis: numeric
      sources: [htun-scirep-2019, vanvugt-bmj-2013, shah-jama-2017, byt-qd-3312-2015]
      locator: "3312, bài Viêm phổi do vi khuẩn ở trẻ em, tr. 262"
      reported: "người lớn: khó thở 0,63 (gộp), 69% (GRACE); trẻ em: thở nhanh trên 40 lần/phút có độ nhạy 79%"
      note: "Lượt A để very_frequent cho mọi tuổi; chọn số gộp của Htun (bậc A) cho người lớn và very_frequent cho trẻ dưới 5 tuổi theo định nghĩa của 3312 (cần thở nhanh, rút lõm lồng ngực hoặc nghe phổi bất thường). Câu hỏi của danh mục gồm cả thở nhanh, rút lõm ở trẻ nhỏ."
  - finding: pleuritic_chest_pain
    freq: frequent
    freq_by_age:
      child_2m_5y: rare
      child_5_12: occasional
    evidence:
      tier: A
      basis: numeric
      sources: [htun-scirep-2019, vanvugt-bmj-2013, shah-jama-2017]
      reported: "người lớn: đau ngực 0,49 (gộp), 57% (GRACE); trẻ em (nghiên cứu có vị thành niên): đau ngực 8–14%"
      note: "Nguồn đo đau ngực chung, không riêng đau khi hít sâu. Trẻ dưới 5 tuổi gần như không tự báo được (lượt B)."
  - finding: runny_nose
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [vanvugt-bmj-2013]
      reported: "không sổ mũi 44%, tức có sổ mũi khoảng 56% (so với 71% ở mọi người ho cấp)"
      population: "người lớn ho cấp ở tuyến ban đầu"
      note: "Không sổ mũi là yếu tố dự báo độc lập của viêm phổi (OR 1,9)."
  - finding: diarrhea
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [vanvugt-bmj-2013]
      reported: "11% (so với 7% ở mọi người ho cấp)"
  - finding: abdominal_pain
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [moustaki-pedpulmonol-2003, byt-qd-4235-2012]
      reported: "34% trẻ trên 4 tuổi viêm phổi thùy"
      population: "trẻ nằm viện"
      note: "Dùng khi triệu chứng chính là sốt. Hạ một mức vì số liệu bệnh viện và người lớn viêm phổi ít đau bụng (lượt A)."
  - finding: confusion
    freq: very_rare
    freq_by_age:
      elder_65_74: occasional
      elder_75p: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-4235-2012, metlay-archintmed-1997]
      locator: "4235, bài Viêm phổi mắc phải ở cộng đồng, mục 2.1.1 (trường hợp đặc biệt)"
      note: "4235: người cao tuổi có khi khởi đầu bằng lú lẫn; người nghiện rượu có thể lú lẫn. Lượt B để rare cho mọi tuổi (cao hơn tỷ lệ nền 1%). Lượt C giữ occasional cho người từ 65 tuổi và để very_rare cho người trẻ hơn: lú lẫn ở người trẻ bị sốt cần nghĩ trước tới viêm màng não, nhiễm khuẩn huyết. Lú lẫn đã có quy tắc mức 2. Ước lượng, cần bác sĩ duyệt."
  - finding: symptoms_worsen_after_improving
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-1840-2025]
      locator: "1840 mục II.1.2"
      note: "Viêm phổi có thể là biến chứng của cúm (1840: đau tức ngực, khó thở tăng dần). Chưa có tỷ lệ; ước occasional. Chỉ lượt B có liên kết này."
  - finding: abd_pain_location
    dist:
      epigastric: 0.25
      right_upper: 0.25
      left_upper: 0.15
      periumbilical: 0.10
      right_lower: 0.08
      left_lower: 0.05
      suprapubic: 0.02
      whole: 0.10
    evidence:
      tier: C
      basis: judgment
      sources: [moustaki-pedpulmonol-2003, byt-qd-4235-2012]
      note: "Không có số liệu vị trí. Viêm phổi thùy dưới hay gây đau vùng bụng trên cùng bên; trẻ em có thể đau quanh rốn (hạch mạc treo, Moustaki). Ước lượng của lượt B, cần bác sĩ duyệt."
  - finding: abd_pain_duration
    dist: { lt_6h: 0.10, h6_24: 0.25, d1_3: 0.45, d4_14: 0.18, gt_2w: 0.02 }
    evidence:
      tier: C
      basis: judgment
      sources: [takahashi-bmcinfectdis-2013, byt-qd-4235-2012]
      note: "Bệnh cấp tính; thời gian từ khởi phát đến nhập viện trung bình 2,7–4,2 ngày (Takahashi). Đau bụng kéo dài hoặc tái đi tái lại nhiều tuần không phù hợp. Ước lượng của lượt B."
  - finding: cough_duration
    dist: { lt_1w: 0.55, w1_2: 0.30, w2_8: 0.13, gt_8w: 0.02 }
    evidence:
      tier: B
      basis: numeric
      sources: [vanvugt-bmj-2013, byt-qd-4235-2012]
      locator: "van Vugt 2013 bảng 1; 4235 mục 2.1.1"
      reported: "trung bình 9 ngày bệnh trước khi khám (độ lệch chuẩn 6) ở người viêm phổi"
      note: "Lượt B (lô 3). Phân bố trong số người có ho. 4235: ho mới xuất hiện, tăng dần. Bệnh cấp; ho từ 2 tháng không phù hợp viêm phổi cộng đồng. Ước lượng từ thời gian bệnh trung bình."
  - finding: wheeze
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-4235-2012, vanvugt-bmj-2013]
      locator: "4235 mục 2.1.1"
      note: "Lượt B (lô 3). 4235 mô tả nghe phổi có ran ẩm, ran nổ, không nêu khò khè là dấu hiệu điển hình; GRACE không đo khò khè. Viêm phổi do vi rút ở trẻ nhỏ có thể khò khè. Ước occasional, thấp hơn nhiều so với hen, đợt cấp bệnh phổi tắc nghẽn mạn tính. Cần bác sĩ duyệt."
  - finding: dyspnea_onset
    dist: { sudden: 0.08, hours_days: 0.82, weeks: 0.10 }
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-4235-2012]
      locator: "4235 bài Hướng dẫn chẩn đoán và xử trí khó thở (kiểu xuất hiện khó thở)"
      note: "Lượt B (lô 3). Phân bố trong số người có khó thở. 4235 xếp viêm phổi vào nhóm khó thở tiến triển nhanh (vài giờ đến vài ngày). Ước lượng."
  - finding: dyspnea_severity
    dist: { exertion: 0.55, rest: 0.37, cannot_speak: 0.08 }
    evidence:
      tier: B
      basis: numeric
      sources: [vanvugt-bmj-2013]
      locator: "van Vugt 2013 bảng 1"
      reported: "ở người viêm phổi: khó thở 96/140 (69%), khó thở nặng 17/140 (12%), tức khoảng 18% người có khó thở"
      note: "Lượt B (lô 3). Phân bố trong số người có khó thở. Số GRACE là người lớn tự đến tuyến ban đầu; khó thở nặng tách thành ngồi nghỉ cũng khó thở và nói không trọn câu, cộng thêm một phần người khó thở vừa. Ước lượng."
  - finding: spo2_measured
    dist: { ge_96: 0.20, s92_95: 0.13, lt_92: 0.07, not_measured: 0.60 }
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-4235-2012, byt-qd-2767-2023]
      locator: "4235 bài khó thở, mục 2.2 và 5.2"
      note: "Lượt B (lô 3). Phân bố trong số người có khó thở; 'Chưa đo' đúng bằng tỷ lệ nền 0,6. Viêm phổi gây giảm ô xy máu khi tổn thương rộng; mục tiêu điều trị giữ SpO2 từ 92% (4235). Ước lượng."
  - finding: chest_pain_duration
    dist: { seconds: 0.15, minutes: 0.15, over_15min: 0.30, days: 0.40 }
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-4235-2012, vanvugt-bmj-2013]
      locator: "4235 mục 2.1.1"
      note: "Lượt B (lô 3). Phân bố trong số người có đau ngực. Đau bên tổn thương, kéo dài theo đợt bệnh vài ngày (GRACE: trung bình 9 ngày bệnh); đau nhói theo nhịp thở có thể được kể là vài giây. Ước lượng."
  - finding: chest_pain_sudden_severe
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-4235-2012]
      locator: "4235 mục 2.1.1"
      note: "Lượt B (lô 3). Tần suất trong số người có đau ngực. 4235: khởi phát đột ngột, đau ngực đôi khi là triệu chứng nổi bật (thể điển hình do phế cầu). Ước occasional."
  - finding: chest_pain_exertional
    freq: rare
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-4235-2012]
      note: "Lượt B (lô 3). Tần suất trong số người có đau ngực. Đau ngực của viêm phổi tăng khi hít sâu, khi ho, không theo kiểu xuất hiện khi gắng sức, đỡ khi nghỉ. Mức rare thấp hơn tỷ lệ nền 5%: câu 'có' nghiêng sang bệnh mạch vành. Ước lượng."
  - finding: chest_wall_tenderness
    freq: rare
    evidence:
      tier: C
