review:
  status: draft
  authors: ["agent:pass-b"]
  doctor_reviewer: null
  updated: "2026-10-31"
  notes_vi: "Lượt B (Giai đoạn 3 lô 3) thêm, không sửa phần đã có: (a) prior Ho P2 (5–17 tuổi và 18–44 tuổi P3), Khó thở P3 (dưới 5 tuổi và từ 65 tuổi P2), Đau ngực P3; (b) liên kết cough_duration, wheeze (occasional), dyspnea_onset, dyspnea_severity, spo2_measured, chest_pain_duration, chest_pain_sudden_severe (occasional), chest_pain_exertional (rare), chest_wall_tenderness (rare), leg_swelling_both (rare), weight_loss_unintended (rare); (c) nguồn mới frese-jcmr-2011, verdon-smw-2008. Không liên kết dấu hiệu chung chest_pain (quyết định của người bảo trì). Điều cần bác sĩ xem thêm: prior Ho dựa trên GRACE (châu Âu); khò khè, đau khi ấn ngực, các phân bố mới là ước lượng; liên kết pleuritic_chest_pain cũ (frequent, có tác dụng ở cả Ho, Khó thở, Đau ngực) dựa trên số đo đau ngực chung, nay khi triệu chứng chính là Đau ngực có thể cần tách theo triệu chứng chính (lượt B không sửa). Ghi chú của bản đã đối chiếu (giữ nguyên): Cần bác sĩ xem: (1) chưa mở được hướng dẫn viêm phổi người lớn hiện hành của Bộ Y tế (4815/QĐ-BYT năm 2020; một trang thứ cấp nêu 2147/QĐ-BYT năm 2026 thay thế); mô tả triệu chứng người lớn lấy từ bài viêm phổi của 4235/QĐ-BYT (2012), các liên kết chỉ dựa vào văn bản này để bậc C; (2) prior dựa trên tỷ suất nhập viện ở Nha Trang và GRACE, chưa có số liệu ngoại trú Việt Nam; prior cho đau bụng là ước lượng; (3) tần suất người lớn lấy từ nghiên cứu chỉ tuyển người có ho; (4) bỏ liên kết li bì (lượt A, cao hơn tỷ lệ nền) và đau tăng khi cử động (lượt B, không có nguồn; dấu hiệu này đặc trưng cho bệnh bụng ngoại khoa, liên kết mạnh ở viêm phổi có thể che viêm ruột thừa); (5) lú lẫn: very_rare dưới 65 tuổi, occasional từ 65 tuổi là ước lượng; (6) mã ICD-10 chưa đối chiếu được."
