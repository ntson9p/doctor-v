      sources: [msd-panic-disorder, nhs-panic-disorder]
      note: "Lượt B (lô 3). Khó thở khi nằm phải ngồi dậy gợi ý suy tim, không phải cơn hoảng sợ. Mức rare thấp hơn tỷ lệ nền 5%. Ước lượng."
  - finding: pleuritic_chest_pain
