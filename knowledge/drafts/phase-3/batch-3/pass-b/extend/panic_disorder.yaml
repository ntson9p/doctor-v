      basis: verbal
      sources: [nhs-panic-disorder, msd-panic-disorder]
      locator: "NHS (phần lớn cơn 5–20 phút, có khi tới 1 giờ); MSD (vài phút đến 1 giờ)"
      note: "Lượt B (lô 3). Phân bố trong số người đau ngực. Lựa chọn 'từ 15 phút trở lên, hoặc vẫn đang đau' gồm cả cơn chưa qua lúc dùng app. Ước lượng."
  - finding: chest_pain_exertional
    freq: rare
    evidence:
