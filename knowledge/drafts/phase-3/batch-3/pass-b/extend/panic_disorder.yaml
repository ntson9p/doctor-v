      basis: judgment
      sources: [msd-panic-disorder, nhs-panic-disorder]
      note: "Lượt B (lô 3). Tần suất trong số người đau ngực. Cơn hoảng sợ đến không theo gắng sức; đau ngực khi gắng sức, đỡ khi nghỉ gợi ý đau thắt ngực. Mức rare thấp hơn tỷ lệ nền 5%."
