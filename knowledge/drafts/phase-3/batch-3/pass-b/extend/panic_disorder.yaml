      note: "Lượt B (lô 3). Cơn hoảng sợ không gây khò khè; khò khè gợi ý hen (MSD: hen là bệnh kèm hay gặp, cần nghĩ tới trước). Mức rare thấp hơn tỷ lệ nền 5%."
  - finding: orthopnea
