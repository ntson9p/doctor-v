warning_signs: [chest_pain_pressure, breathing_difficulty, fainting_or_near_fainting, es_self_harm]
self_care_vi:
  - "Trong cơn, ngồi yên ở chỗ an toàn, thở chậm và sâu, tự nhắc rằng cơn sẽ qua."
  - "Hạn chế cà phê, rượu bia, thuốc lá; ngủ đủ giấc và vận động đều đặn."
  - "Không tự dùng thuốc an thần, thuốc ngủ; hỏi bác sĩ hoặc dược sĩ trước khi dùng thuốc."
see_doctor_vi:
  - "Đặt lịch khám trong vài ngày, nhất là khi mới bị lần đầu hoặc các cơn lặp lại."
  - "Bác sĩ cần khám để loại trừ bệnh tim, cường giáp, hạ đường huyết."
  - "Đi cấp cứu ngay nếu đau tức ngực, khó thở nhiều hoặc ngất."
  - "Tại nhà không thể tự phân biệt cơn hoảng sợ với bệnh tim."
  - "Rối loạn hoảng sợ điều trị được bằng tâm lý trị liệu hoặc thuốc theo chỉ định của bác sĩ."
review:
  status: draft
  authors: ["agent:pass-b"]
  doctor_reviewer: null
  updated: "2026-10-31"
  notes_vi: "Lượt B (Giai đoạn 3 lô 3, phần b) thêm, không sửa phần đã có: (a) prior Khó thở P3 (5–12 tuổi và từ 75 tuổi P4; dưới 5 tuổi P6) và Đau ngực P3 (18–44 tuổi P2; từ 75 tuổi P4); (b) liên kết dyspnea_onset, dyspnea_severity, spo2_measured, chest_pain_duration (phân bố), chest_pain_exertional, wheeze, orthopnea, pleuritic_chest_pain (rare, thấp hơn tỷ lệ nền) và leg_swelling_one_side (very_rare). Hai liên kết cuối (đau khi hít sâu, sưng một bên bắp chân) có thể được hỏi ở triệu chứng chính đã phát hành nhưng chỉ làm giảm khả năng cơn hoảng sợ khi trả lời 'Có'; (c) không có nguồn mới (frese-jcmr-2011, verdon-smw-2008 có sẵn trong extend/sources của lượt B phần a). Không liên kết dấu hiệu chung chest_pain (quyết định của người bảo trì); với Đau ngực, liên kết cũ chest_pain_pressure (occasional) vẫn là bằng chứng. Không thêm sốt, ho (dấu hiệu Giai đoạn 1) để không đổi kết quả của Hồi hộp, Chóng mặt. Ý kiến về giá trị cũ (không sửa): palpitations very_frequent với tỷ lệ nền 5% làm câu hồi hộp (trong nhóm dấu hiệu nguy hiểm của Khó thở) tăng khả năng cơn hoảng sợ khoảng 16 lần ở Khó thở, Đau ngực, mạnh hơn thuyên tắc phổi, hội chứng vành cấp (occasional); lượt C nên cân nhắc freq_by_complaint cho hai triệu chứng chính mới. breathing_difficulty frequent (bản cũ hạ một mức từ 75%) nay có ý nghĩa ở Đau ngực; perioral_tingling, panic_fear, similar_episodes_before giữ nguyên là bằng chứng chính phân biệt với bệnh tim phổi. Điều cần bác sĩ xem thêm: prior Khó thở, Đau ngực suy từ châu Âu (nhóm tăng thông khí, nhóm tâm lý gồm cả bệnh khác); các phân bố mới là ước lượng. Ghi chú của bản đã đối chiếu (giữ nguyên): Lượt C (phần b) đối chiếu 18 liên kết và mở lại mọi nguồn được trích. Mức xử trí 4, không thuộc nhóm không được bỏ sót: NHS khuyên khám bác sĩ gia đình, cơn không gây hại cho cơ thể; MSD: chỉ kết luận sau khi đã khám loại trừ bệnh cơ thể. Bộ Y tế chưa có bài riêng về rối loạn hoảng sợ (Quyết định 2058/QĐ-BYT năm 2020 chỉ có lo âu lan tỏa và rối loạn hỗn hợp lo âu – trầm cảm, theo hai lượt). Bác sĩ cần xem: (1) tần suất triệu chứng lấy từ một nghiên cứu nhỏ ở khoa chuyên sâu Nhật Bản (Hayashi, 70 người); (2) prior suy từ nhóm 'tâm thần' của các nghiên cứu hồi hộp ở Mỹ, có hiệu chỉnh vì tỷ lệ mắc ở châu Á thấp hơn, chưa có số liệu Việt Nam; (3) hệ số giới là quy đổi ước lượng; (4) các triệu chứng cơ thể của cơn trùng với rối loạn nhịp, hạ đường huyết, cường giáp, nên các liên kết dễ gây nhầm (đau ngực, kiểu cơn bật tắt) được để thấp."
