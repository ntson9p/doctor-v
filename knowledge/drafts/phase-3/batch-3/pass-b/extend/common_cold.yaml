  updated: "2026-10-31"
  notes_vi: "Lượt B (Giai đoạn 3 lô 3) thêm, không sửa phần đã có: (a) prior Ho P1 (dưới 2 tháng và từ 65 tuổi P2); (b) liên kết cough_duration, wheeze (rare), hoarse_voice (occasional). Điều cần bác sĩ xem thêm: prior Ho bằng prior của viêm phế quản cấp (lượt B cũng để P1): hai bệnh gối nhau, phân biệt nhờ thời gian ho, đờm, đau ngực khi ho, khó thở; liên kết productive_cough cũ (frequent) và breathing_difficulty cũ (rare) nay có tác dụng ở Ho: breathing_difficulty rare là hợp lý (cảm lạnh không biến chứng không gây khó thở), lượt B không sửa. Ghi chú của bản đã đối chiếu (giữ nguyên): Cần bác sĩ xem: (1) prior là ước lượng từ nghiên cứu căn nguyên hội chứng giống cúm (Hà Nam, TP.HCM), chưa có tỷ lệ trong mọi người sốt đi khám; (2) bỏ liên kết mất ngửi, mất vị (hai lượt để rare, cao hơn tỷ lệ nền 1%): cảm lạnh vẫn có thể giảm ngửi (NHS), nên câu 'có' nay chỉ tăng COVID-19 và viêm xoang; (3) mức thấp hơn cho trẻ dưới 12 tuổi ở đau đầu, đau cơ, mệt là ước lượng theo khả năng tự báo; (4) đau ngực khi ho để occasional theo GRACE; (5) bài Viêm mũi họng cấp tính của 5643 gộp cả viêm họng do vi khuẩn và khuyên dùng kháng sinh, chỉ lấy phần mô tả triệu chứng; (6) mã ICD-10 chưa đối chiếu được (lượt B ghi đã tra icd.kcb.vn; trang tra cứu hiện có bản ICD-10 theo Thông tư 06/2026/TT-BYT)."
