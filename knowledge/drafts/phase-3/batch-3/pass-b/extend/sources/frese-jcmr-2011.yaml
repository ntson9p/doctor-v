notes_vi: "Lượt B (Giai đoạn 3 lô 3) tải toàn văn (PMC3279485) qua API Europe PMC. Người đi khám bác sĩ đa khoa vì khó thở ở Đức (SESAM 2, 93 người) và Hà Lan (Transition Project, 3.743 lần khám vì khó thở mới, 2.747 lần vì khó thở đã biết). Bảng 5 (khó thở mới / khó thở đã biết): viêm phế quản cấp 24,5% / 9,6% (SESAM 2: 24,7%); nhiễm trùng hô hấp trên 6,9% / 0,9%; hen phế quản 11,0% / 36,1% (SESAM 2: 5,4%); bệnh phổi tắc nghẽn mạn tính 2,2% / 15,9% (SESAM 2: 5,4%); viêm phế quản mạn 0,8% / 5,1%; suy tim 4,1% / 7,0%; viêm phổi 2,6% / 1,0% (SESAM 2: 3,2%); cúm 0,4% / 0,03% (SESAM 2: 1,1%); u ác đường hô hấp 0,12% / 0,40%; tắc mạch phổi 0,35% / 0,21%; tăng thông khí 7,6% / 4,0%. Khó thở gặp nhiều ở trẻ 0–4 tuổi và người trên 64 tuổi. Phần bàn luận: dưới 45 tuổi hen đứng đầu, viêm phế quản thứ hai; trên 45 tuổi suy tim, bệnh phổi tắc nghẽn mạn tính rồi viêm phế quản (theo Ponka)."
