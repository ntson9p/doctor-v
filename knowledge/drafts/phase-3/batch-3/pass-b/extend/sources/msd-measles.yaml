notes_vi: "Lượt B (Giai đoạn 3 lô 3, phần b) tải trang ngày 31/10/2026 (rà soát toàn bộ 10/2026). Diễn tiến điển hình: ủ bệnh 7–21 ngày; giai đoạn khởi phát 3–7 ngày (sốt, sổ mũi, ho khan, viêm kết mạc) đến khi mọc ban; hạt Koplik ở khoảng 70%; ban mọc từ mặt, sau tai rồi lan xuống thân, chi trong 24–48 giờ, kéo dài 4–7 ngày; ca không biến chứng hồi phục khoảng 7 ngày sau khi mọc ban. Lây từ 4 ngày trước đến 4 ngày sau khi mọc ban. Biến chứng chính: viêm phổi, viêm não."
