notes_vi: "Lượt B đọc tóm tắt qua API Europe PMC. 59 bác sĩ đa khoa ở Thụy Sĩ, 672 người đau ngực (2,7% số lần khám), theo dõi 12 tháng: cơ xương thành ngực 49%, tim mạch 16%, tâm lý 11%, hô hấp 10%, tiêu hóa 8%; bệnh nặng (tim, hô hấp, ung thư) chiếm 20%; 7 người tử vong vì ung thư liên quan đến đau ngực. Tóm tắt không tách hen, viêm phổi trong nhóm hô hấp."
