notes_vi: "Lượt B đọc tóm tắt qua API Europe PMC. Mẫu ngẫu nhiên người 23–72 tuổi ở miền Bắc, đo hô hấp ký (565 người): bệnh phổi tắc nghẽn mạn tính theo GOLD 7,1% (nam 10,9%, nữ 3,9%); trên 50 tuổi: nam 23,5%, nữ 6,8%; nam hút thuốc trên 60 tuổi 47,8%. Tuổi và hút thuốc là yếu tố chính; giới nam mất ý nghĩa sau khi hiệu chỉnh. Không phụ nữ nào mắc bệnh từng hút thuốc."
