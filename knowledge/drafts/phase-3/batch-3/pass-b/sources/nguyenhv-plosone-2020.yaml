notes_vi: "Lượt B tải toàn văn (PMC7179905) qua API Europe PMC. Điều tra quốc gia 2017–2018, 61.763 người từ 15 tuổi ở 82 cụm, sàng lọc bằng câu hỏi và X quang ngực. Bảng 4: tỷ lệ hiện mắc lao phổi có bằng chứng vi khuẩn 322/100.000 (nam 522, nữ 133; tỷ số nam/nữ 4,0); theo tuổi: 15–24 tuổi 63, 25–34 tuổi 203, 35–44 tuổi 287, 45–54 tuổi 423, 55–64 tuổi 618, từ 65 tuổi 689/100.000; thành thị 445, nông thôn 309, vùng xa 241; Bắc 262, Trung 316, Nam 380 (khác biệt vùng không có ý nghĩa, p = 0,297). Bảng 3 (221 ca lao, phỏng vấn sâu): ho bất kỳ 67,0%, ho dưới 2 tuần 9,1%, ho từ 2 tuần 57,9%, ho có đờm 61,1%, ho ra máu 3,2%, sốt 12,7%, sụt cân 7,7%, ra mồ hôi đêm 7,7%; không có triệu chứng 32,1%. Một nửa số ca chỉ phát hiện nhờ X quang. 86% chưa từng tiếp cận điều trị lao."
