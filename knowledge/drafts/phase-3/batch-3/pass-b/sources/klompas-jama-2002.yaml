notes_vi: "Lượt B đọc tóm tắt qua API Europe PMC. Tổng quan JAMA Rational Clinical Examination, 21 nghiên cứu (mỗi nghiên cứu từ 18 ca bóc tách động mạch chủ ngực đã xác định): đau dữ dội có độ nhạy gộp 90%, khởi phát đột ngột 84%; không có đau khởi phát đột ngột LR- 0,3. Khám: tăng huyết áp 49%, tiếng thổi tâm trương 28%, mất mạch hoặc chênh huyết áp 31% (LR+ 5,7), dấu thần kinh khu trú 17% (LR+ 6,6–33). Khám lâm sàng không đủ nhạy để loại trừ bệnh."
