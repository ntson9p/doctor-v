notes_vi: "Lượt B mở trang (rà soát toàn bộ 02/2026, cập nhật 10/2026). Khoảng 85% ca liên quan hút thuốc; 15–20% người bệnh chưa từng hoặc ít hút. Khoảng 25% người bệnh không có triệu chứng, phát hiện tình cờ. U tại chỗ gây ho (thường ho khan, kéo dài); ít gặp hơn là khó thở, sốt khi viêm phổi sau tắc; ho ra máu ít gặp hơn và thường ít máu, là triệu chứng đầu tiên ở khoảng 30%; có thể khò khè; khoảng 18% đau ngực âm ỉ. Lan rộng: đau ngực kiểu màng phổi, tràn dịch, khàn tiếng. Di căn: chán ăn, sụt cân, mệt."
