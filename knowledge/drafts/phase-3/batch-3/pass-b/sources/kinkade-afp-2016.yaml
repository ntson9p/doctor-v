notes_vi: "Lượt B mở trang toàn văn. Viêm phế quản cấp phần lớn do vi rút (ít nhất 90%); ngoài ho còn khạc đờm, khó thở, nghẹt mũi, đau đầu, sốt; vài ngày đầu khó phân biệt với cảm lạnh; có thể đau sau xương ức hoặc thành ngực khi ho. Sốt có ở khoảng một phần ba người bệnh và thường không còn sau vài ngày đầu; sốt trên 37,8°C gợi ý cúm hoặc viêm phổi. Đờm, kể cả đờm mủ, thường gặp và không phản ánh nhiễm vi khuẩn. Ho thường kéo dài 2–3 tuần (ước tính gộp 18 ngày). Nghe phổi có thể có ran rít, ran ngáy. Khoảng 10% người ho từ 2 tuần có bằng chứng nhiễm ho gà. Không nên dùng kháng sinh thường quy."
