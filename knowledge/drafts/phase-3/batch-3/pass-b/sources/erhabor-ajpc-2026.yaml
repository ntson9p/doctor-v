notes_vi: "Lượt B tải toàn văn PMC13329584 qua API Europe PMC. 22.171 người lớn ở cộng đồng (Mỹ), theo dõi 20,2 năm, 97 ca bóc tách: 21,8/100.000 người-năm (dưới 60 tuổi 15,6; từ 60 tuổi 33,0; tăng huyết áp 29,9 so với 14,1). Yếu tố độc lập: tuổi (HR 2,13 mỗi 10 năm), nam (HR 1,67), tăng huyết áp (HR 2,60), đang hút thuốc (HR 4,26 với 1–9 gói-năm; 6,11 với từ 10 gói-năm); đái tháo đường có xu hướng nguy cơ thấp hơn (HR 0,25, p = 0,052). Người bị bóc tách: nam 55,7%, tăng huyết áp 53%, đang hút thuốc từ 10 gói-năm 41,2% (so với 45,6%, 39% và 18,6% ở người không bị)."
