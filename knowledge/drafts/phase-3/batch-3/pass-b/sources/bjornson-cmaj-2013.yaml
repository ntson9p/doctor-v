notes_vi: "Lượt B tải toàn văn trên PMC ngày 31/10/2026. Bệnh là nguyên nhân thứ hai gây suy hô hấp ở trẻ dưới 10 tuổi (Canada); nam nhiều hơn nữ (1,4:1); hay gặp nhất ở trẻ 6 tháng–3 tuổi, ít hơn ở nhũ nhi nhỏ, trẻ lớn và vị thành niên. Thường có 24–72 giờ ho, sổ mũi, sốt không đặc hiệu trước, rồi đột ngột ho ông ổng, khàn tiếng, thường có thở rít khi hít vào, hay về đêm; triệu chứng nặng hơn khi trẻ quấy khóc. Khoảng 60% hết ho ông ổng trong 48 giờ, dưới 2% kéo dài quá 5 đêm. Ít nhất hai phần ba ca nhẹ khi đến khám (không thở rít lúc nghỉ); 1–5% phải nằm viện. Ca điển hình: ho ông ổng, khàn tiếng, thở rít, thường có sốt. Phân biệt: viêm khí quản do vi khuẩn, viêm nắp thanh quản (khó nuốt, chảy dãi, sốt, không ho ông ổng), dị vật (không có triệu chứng viêm long, sốt), áp xe sau họng, phản ứng dị ứng, phù mạch (có mề đay). Corticoid có lợi cả ở ca nhẹ (giảm nửa số lần phải khám lại)."
