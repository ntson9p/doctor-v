notes_vi: "Lượt B tải toàn văn (PMC10809638) qua API Europe PMC. 1.063 trẻ dưới 5 tuổi nằm Bệnh viện Nhi Trung ương vì ho gà có xét nghiệm dương tính (2015–2018). Bảng 1: dưới 2 tháng 44,0%; 2 đến dưới 3 tháng 19,5%; 3 đến dưới 4 tháng 11,0%; 4 đến dưới 5 tháng 4,8%; 5 đến dưới 12 tháng 8,7%; 1 đến dưới 5 tuổi 12,0% (dưới 1 tuổi 88%); chưa tiêm mũi nào 83,8%, tiêm từ 3 mũi 6,7%; ho kéo dài 96,8%; ho nặng (cơn ho dữ dội) 71,8%; nặng (cần oxy, thở máy) 23,2%; tử vong 1,9%; từ khởi phát đến xét nghiệm trung vị 10 ngày (khoảng tứ phân vị 7–15). Theo mùa (mỗi mùa khoảng 4 tháng): tháng 12–3 37,4%, tháng 4–7 47,9%, tháng 8–11 14,7%; đỉnh tháng 5–7, thấp nhất tháng 10. Định nghĩa triệu chứng khởi phát: ho thành cơn, tiếng rít khi hít vào, nôn sau ho hoặc ngừng thở (có hay không tím). Bệnh viện tuyến cuối nên tỷ lệ ca nặng cao hơn cộng đồng."
