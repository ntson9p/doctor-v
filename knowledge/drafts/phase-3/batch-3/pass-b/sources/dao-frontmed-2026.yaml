notes_vi: "Lượt B tải toàn văn PMC13477947 qua API Europe PMC. Đồng thuận Delphi đầu tiên của Hội Tiêu hóa Việt Nam (28 chuyên gia, 20 khuyến cáo). Triệu chứng điển hình: ợ nóng (nóng rát sau xương ức, hay nặng sau ăn hoặc khi nằm), ợ trớ; đồng thuận Lyon 2.0 coi đau ngực không do tim là triệu chứng điển hình thứ ba. Ở Việt Nam: người nội soi vì triệu chứng tiêu hóa trên có ợ nóng 9,2%, ợ trớ 27%; người được chẩn đoán sơ bộ trào ngược có ợ nóng 68,4–78,6%, ợ trớ 71,5–77,4%. Biểu hiện ngoài thực quản chiếm 7–23,1%; một nghiên cứu Việt Nam ở người trào ngược: ho 49,1%, cảm giác vướng họng 46,7%, đau ngực không do tim 45,3%, khàn tiếng 9,9%, khò khè 9,4%. Bệnh trào ngược không viêm trợt chiếm ưu thế (khoảng 50% ở người Việt có triệu chứng); biến chứng nặng (chảy máu, loét, hẹp, ung thư) tương đối hiếm ở Việt Nam. Nội soi khi có dấu hiệu báo động (nuốt khó, nuốt đau, nôn kéo dài, sụt cân, xuất huyết tiêu hóa, thiếu máu). Đây là hướng dẫn của hội chuyên ngành, không phải văn bản của Bộ Y tế."
