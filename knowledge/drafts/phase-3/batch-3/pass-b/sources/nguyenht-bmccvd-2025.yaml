notes_vi: "Lượt B tải toàn văn (PMC12853784) qua API Europe PMC. 277 người từ 60 tuổi nhập viện vì suy tim cấp ở 3 bệnh viện phía Nam (6/2023–5/2024; đã loại hội chứng vành cấp); tuổi trung vị 76, nam 46,2%. Bảng 1: tăng huyết áp 73,3%; đái tháo đường 37,2%; hội chứng vành mạn 76,2%; rung nhĩ 34,7%; bệnh phổi mạn 5,8%. Bảng 2: lý do nhập viện khó thở 75,5%, đau ngực 36,1%, phù chân 40,4%; suy tim mạn mất bù 85,2%, suy tim mới xuất hiện 14,8%."
