notes_vi: "Lượt B tải toàn văn (PMC11140950) qua API Europe PMC. 531 người từ 16 tuổi đến khoa cấp cứu vì phản vệ độ II trở lên (Bern, 2013–2018); tuổi trung vị 38, nữ 53,3%; 10,9% có hen; 33,7% từng bị phản vệ. Tác nhân nghi ngờ: thuốc 31,8%, thức ăn 25,6%, côn trùng đốt 17,1%; khoảng một phần tư không rõ nguyên nhân. Bảng 3: da 88,7% (phù mạch 44,4%, mề đay 36,2%, đỏ da khác 40,7%); hô hấp 70,2% (khó thở, co thắt phế quản, khò khè 68,0%; hen nặng lên 6,4%; nghẹt mũi 3,8%; chảy mũi 3,2%; ho, đau họng 14,9%); tim mạch 46,1% (huyết áp tâm thu dưới 100 mmHg 19,2%, tim nhanh 14,5%, ngất 10,0%; chóng mặt, vã mồ hôi lạnh, đau ngực và khác 21,5%); tiêu hóa 31,1% (buồn nôn 15,3%, nôn 9,6%, đau bụng 8,9%, tiêu chảy 5,8%). Khởi phát dưới 30 phút sau tiếp xúc 46,5%, 30–120 phút 6,4%, trên 120 phút 9,2%, không rõ 36,9%. Phản vệ chiếm 0,04–0,96% số lượt đến cấp cứu (các nghiên cứu được trích); hiếm sau 65 tuổi."
