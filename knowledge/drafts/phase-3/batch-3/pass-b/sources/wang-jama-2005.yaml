notes_vi: "Lượt B đọc tóm tắt qua API Europe PMC. 22 nghiên cứu ở người lớn khó thở đến khoa cấp cứu. Làm tăng khả năng suy tim: tiền sử suy tim (LR dương 5,8), cơn khó thở kịch phát về đêm (LR dương 2,6), tiếng ngựa phi (LR 11), phim phổi ứ huyết (LR 12), điện tim rung nhĩ (LR 3,8). Làm giảm khả năng: không có tiền sử suy tim (LR âm 0,45), không khó thở khi gắng sức (LR âm 0,48), không có ran (LR âm 0,51). Hiệu chỉnh khi dùng cho cộng đồng."
