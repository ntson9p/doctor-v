notes_vi: "Lượt B (Giai đoạn 3 lô 3, phần b) đọc tóm tắt qua API Europe PMC; không có toàn văn mở. Tổng quan 53 nghiên cứu so sánh người có và không có xét nghiệm dương tính với Bordetella pertussis. Người lớn: ho từng cơn có độ nhạy 93,2% (độ đặc hiệu 20,6%); không sốt có độ nhạy 81,8% (đặc hiệu 18,8%); nôn sau ho độ nhạy 32,5% (đặc hiệu 77,7%); tiếng rít khi hít vào độ nhạy 29,8% (đặc hiệu 79,5%). Trẻ em: nôn sau ho độ nhạy 60,0%, đặc hiệu 66,0%. Kết luận: ở người lớn, tiếng rít hoặc nôn sau ho làm nghĩ nhiều tới ho gà; không có cơn ho hoặc có sốt làm ít nghĩ tới."
