notes_vi: "Lượt B tải trang bằng curl (rà soát lần cuối 23/11/2023, hạn rà soát 23/11/2026). Dấu hiệu đầu tiên: châm chích hoặc đau ở một vùng da, nhức đầu hoặc thấy mệt; ban thường mọc vài ngày sau; hiếm khi đau mà không có ban. Ban hay ở ngực và bụng, một bên người; ban hai bên ít có khả năng là zona. Không khẩn: gặp dược sĩ, cố gắng trong 3 ngày từ khi nổi ban (người từ 18 tuổi). Khám khẩn hoặc gọi 111: ban ở mắt, mũi, thay đổi thị lực, suy giảm miễn dịch nặng, đang cho con bú mà ban ở vú, từ 17 tuổi trở xuống. Tự chăm sóc: giữ ban sạch, khô; mặc đồ rộng; chườm mát; không để băng dính vào ban. Không lây zona nhưng có thể lây thủy đậu cho người chưa mắc (phụ nữ có thai, người suy giảm miễn dịch, trẻ dưới 1 tháng) khi ban còn chảy dịch."
