notes_vi: "Lượt B đọc tóm tắt qua API Europe PMC. 183 người lao phổi mới, AFB dương tính, nằm viện ở Việt Nam; tuổi trung bình 56; 80,3% nam (tỷ số nam/nữ 4,1); 42% từ 65 tuổi. Ra mồ hôi đêm 34,9% ở người dưới 65 tuổi và 20,8% ở người từ 65 tuổi; đau cơ, khớp 7,6% và 22,1%. Các triệu chứng khác không khác nhau theo tuổi (tóm tắt không cho tỷ lệ)."
