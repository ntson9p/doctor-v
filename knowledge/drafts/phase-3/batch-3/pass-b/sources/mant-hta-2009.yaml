notes_vi: "Lượt B đọc tóm tắt qua API Europe PMC. Tổng quan hệ thống và phân tích gộp dữ liệu từng người bệnh, người nghi suy tim ở tuyến ban đầu. Khó thở là triệu chứng duy nhất có độ nhạy cao (89%) nhưng độ đặc hiệu thấp (51%). Độ đặc hiệu tương đối cao: tiền sử nhồi máu cơ tim 89%, khó thở khi nằm 89%, phù 72%, tĩnh mạch cổ nổi 70%; độ nhạy của các dấu hiệu này thấp, từ 11% đến 53% (phù 53%)."
