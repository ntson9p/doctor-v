notes_vi: "Lượt B tải toàn văn PMC6556594 qua API Europe PMC. Đan Mạch 2009–2014, đọc lại hồ sơ mọi người đến 40 tuổi: tỷ lệ mới mắc tràn khí màng phổi tự phát nguyên phát 7,3/100.000/năm; nam 12,3, nữ 2,2 (tỷ số 5,9); nam cao nhất 16–20 tuổi (28,1) và 21–25 tuổi (24,7); 11–15 tuổi 2,1; dưới 11 tuổi không có ca. Bảng 4 (514 người): 85% nam, tuổi trung vị 25, BMI trung vị 20,4; hút thuốc hằng ngày 58%, hằng tuần 2%, chưa từng hút 27%. Bảng 5: khởi phát đột ngột 95%; vào viện trong 24 giờ 75%; lúc khởi phát đang nghỉ 70%, đang ngủ 16%, sinh hoạt thường ngày 11%, gắng sức 3%; 86% cần dẫn lưu."
