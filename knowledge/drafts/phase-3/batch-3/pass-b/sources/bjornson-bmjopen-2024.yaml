notes_vi: "Lượt B đọc tóm tắt qua API Europe PMC. Hai đoàn hệ trẻ 0–16 tuổi được chẩn đoán viêm thanh quản cấp ở khoa cấp cứu Canada (307 và 1.214 trẻ), gọi điện hằng ngày: triệu chứng nặng nhất ngay lúc đến khám ở 96% và 77%; ho ông ổng là triệu chứng kéo dài nhất, hết ở 50% trẻ sau 34 và 47 giờ, ở 90% sau 78 và 119 giờ."
