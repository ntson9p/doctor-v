notes_vi: "Lượt B tải toàn văn (PMC7678343) qua API Europe PMC. Sổ đăng ký u ngực toàn quốc Tây Ban Nha, 9.876 người ung thư phổi (74% nam, tuổi trung vị 64; 12% chưa từng hút thuốc, phần còn lại đã bỏ hoặc đang hút), 2016–2019. Bảng 1, triệu chứng lúc chẩn đoán: ho 33,9%, khó thở 26,7%, đau 23,8%, sụt cân 21,0%, ho ra máu 11,3%, mệt 10,0%, chán ăn 6,1%, thay đổi giọng 3,2%. 59% ca giai đoạn I và 27,7% ca giai đoạn IV không có triệu chứng. Ho ra máu gặp ở người từng hút thuốc gấp đôi người chưa hút (12% so với 6%). Người bệnh ở bệnh viện chuyên khoa."
