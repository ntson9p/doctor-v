notes_vi: "Lượt B tải trang ngày 31/10/2026 (rà soát lần cuối 20/8/2026). Triệu chứng hay gặp: ho không hết, khó thở, ho ra máu, đau ngực hoặc vai, hay bị nhiễm trùng ngực hoặc nhiễm trùng không đỡ, sụt cân, chán ăn, mệt. Ít gặp: sưng mặt cổ, nuốt khó, khàn tiếng kéo dài, ngón tay dùi trống. Giai đoạn sớm có thể không có triệu chứng. 'See a GP' (không khẩn): ho trên 3 tuần hoặc có triệu chứng khác; 'Urgent GP / 111': ho ra máu; 'Call 999 or A&E': khó thở đến không nói được, đau ngực hoặc lưng trên. Trang nhấn mạnh các triệu chứng này rất hay gặp và thường do bệnh khác, nhưng nên đi khám để kiểm tra."
