notes_vi: "Lượt B đọc tóm tắt qua API Europe PMC. Người không hút thuốc từ 40 tuổi ở Việt Nam và Indonesia (1.506 người, có hô hấp ký): bệnh phổi tắc nghẽn mạn tính 6,9% (Việt Nam 8,1%, thành thị Việt Nam 11,1%); 94% số ca chưa từng được chẩn đoán. Ước tính 25–40% người bệnh chưa từng hút thuốc."
