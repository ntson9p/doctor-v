notes_vi: "Lượt B đọc toàn văn đăng lại trên vnras.com (trang thứ cấp, có liên kết PDF). Trang quyết định: số 75/QĐ-BYT, Hà Nội ngày 13/01/2015, KT. Bộ trưởng Nguyễn Thị Xuyên ký. Chương 3, bài Bệnh zona: ban đỏ, mụn nước, bọng nước thành đám, thành chùm dọc theo đường đi của dây thần kinh ngoại biên, thường một bên, không vượt quá đường giữa; hay gặp ở người già, người suy giảm miễn dịch (HIV, thuốc ức chế miễn dịch, bệnh máu, đái tháo đường, ung thư, stress). Tiền triệu 1–5 ngày: bỏng rát, nóng rát, châm chích, tê, đau trên một vùng da, nhất là về đêm; có thể nhức đầu, sợ ánh sáng, khó chịu. Đau xuất hiện sớm, có thể trước cả tổn thương da; trẻ em, người trẻ đau ít, người cao tuổi đau nhiều, kéo dài (đau sau zona). Hạch lân cận sưng to. Zona liên sườn và ngực bụng là thể hay gặp nhất (50%); zona mắt 10–15%. Giai đoạn khởi phát cần phân biệt với đau do bệnh tim, viêm màng phổi, viêm túi mật, cơn đau quặn thận… Thuốc kháng vi rút nên dùng sớm, tốt nhất trong 72 giờ đầu. Chưa kiểm tra văn bản thay thế."
