notes_vi: "Lượt B tải toàn văn PMC12045574 qua API Europe PMC. Tổng quan hệ thống và phân tích gộp nghiên cứu quan sát ở người lớn châu Á – Thái Bình Dương (có tìm cả Việt Nam nhưng các nghiên cứu gộp đến từ Úc, Trung Quốc, Nhật Bản, Hàn Quốc, New Zealand, Đài Loan). Tỷ lệ mới mắc zona ở người lớn nói chung: gộp 6,49/1.000 người-năm (0,75–16,69); từ 50 tuổi 8,73; dưới 50 tuổi 2,80. Người suy giảm miễn dịch hoặc bệnh tự miễn: 16,53/1.000 người-năm, tỷ số so với người không có các bệnh này 1,98 (1,43–2,74). Tái phát khoảng 3%. Nghiên cứu có tài trợ của hãng vắc xin."
