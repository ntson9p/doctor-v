notes_vi: "Lượt B đọc tóm tắt qua API Europe PMC. 464 người bóc tách động mạch chủ cấp ở 12 trung tâm chuyển tuyến (1996–1998): tuổi trung bình 63, nam 65,3%, týp A 62,3%. Đau đột ngột, dữ dội, sắc là than phiền hay gặp nhất nhưng biểu hiện rất đa dạng; hở van động mạch chủ 31,6%, mất mạch 15,1%; X quang ngực và điện tim bình thường ở 12,4% và 31,3%. Tử vong trong viện 27,4%. Tóm tắt không có tỷ lệ từng triệu chứng (bảng triệu chứng chưa mở được)."
