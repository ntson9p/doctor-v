notes_vi: "Lượt B (lô 3 phần c) tải toàn văn PMC4655927 qua API Europe PMC. 11 nghiên cứu, khoảng 6.500 người đau ngực đi khám bác sĩ đa khoa ở Bắc Mỹ, châu Âu; bảng 3 (6 nghiên cứu nguy cơ sai lệch thấp): hội chứng thành ngực 24,5–49,8%; tim mạch 13,8–16,1%; bệnh mạch vành (mọi loại) 9,7–14,8%; bệnh mạch vành ổn định 6,6–11,2%; hội chứng vành cấp hoặc nhồi máu cơ tim 1,5–3,6%; hô hấp 10,3–18,2%; tâm lý 9,5–18,2%; tiêu hóa 5,6–9,7%; thực quản 6,0–7,1%; chấn thương 1,8–3,9%. Bảng 1: tỷ lệ nam 46–51% ở phần lớn nghiên cứu; tuổi trung bình 41–60; hai nghiên cứu chỉ nhận người từ 35 tuổi. Ở khoa cấp cứu, bệnh mạch vành chiếm tỷ lệ cao hơn hẳn (phần bàn luận)."
