notes_vi: "Lượt B tải trang bằng curl (rà soát lần cuối 14/8/2026). Viêm chỗ xương sườn nối với xương ức; đau nhói ở trước hoặc bên ngực, tăng khi cử động, khi thở, khi ấn vào giữa ngực hoặc xương sườn; thường tự khỏi sau vài tuần đến vài tháng; liên quan với động tác lặp lại phần thân trên như mang vác. Luôn cần hỏi ý kiến y tế khi đau ngực không rõ nguyên nhân, không hết; 'urgent advice: NHS 111' khi nghĩ mình bị viêm sụn sườn, để loại trừ bệnh nặng hơn. Gọi 999 khi đau ngực đột ngột, lan tay, cổ, hàm, tức ngực; đau ngực kèm khó thở, tim nhanh, ho ra máu; đau ngực hoặc lưng đột ngột như xé kèm khó thở, khó đi lại, nhìn, nói. Không tự lái xe đến cấp cứu."
