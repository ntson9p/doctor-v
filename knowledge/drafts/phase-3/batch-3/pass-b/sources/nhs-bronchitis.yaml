notes_vi: "Lượt B tải trang ngày 31/10/2026 (rà soát lần cuối 18/8/2026). Viêm phế quản thường do nhiễm trùng, tự khỏi sau khoảng 3 tuần. Triệu chứng: ho (có thể có đờm), đau ngực khi ho, khó thở, đau họng, sổ mũi, sốt. Tự chăm sóc: nghỉ ngơi, uống đủ nước, mật ong pha nước ấm (không cho trẻ dưới 1 tuổi), che miệng khi ho, rửa tay, không hút thuốc. 'Urgent GP / 111': ho trên 3 tuần không đỡ; ho ra máu; đau ngực từng cơn hoặc khi thở, ho; trên 65 tuổi; có thai; bệnh mạn tính; suy giảm miễn dịch; quá mệt; khó thở. 'Call 999': khó thở đến không nói được; môi, da tím tái; đột ngột lú lẫn. Kháng sinh chỉ khi nhiễm trùng nặng hơn."
