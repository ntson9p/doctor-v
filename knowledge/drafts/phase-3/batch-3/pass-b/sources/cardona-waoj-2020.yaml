notes_vi: "Lượt B tải toàn văn (PMC7607509) qua API Europe PMC. Tỷ lệ mắc toàn cầu 50–112 đợt trên 100.000 người-năm; trẻ em 1–761 trên 100.000. Không có triệu chứng da ở 10–20% cơn phản vệ (hay gặp ở ca tử vong). Tiêu chuẩn chẩn đoán: khởi phát cấp (vài phút đến vài giờ) có tổn thương da, niêm mạc (mề đay toàn thân, ngứa, đỏ bừng, sưng môi, lưỡi, lưỡi gà) kèm tổn thương hô hấp (khó thở, khò khè, thở rít, giảm SpO2), tụt huyết áp hoặc tiêu hóa nặng; hoặc tụt huyết áp, co thắt phế quản, tổn thương thanh quản (thở rít, đổi giọng, đau khi nuốt) sau tiếp xúc dị nguyên đã biết, kể cả khi không có triệu chứng da. Không rõ nguyên nhân ở 6,5–35% ca. Tác nhân hay gặp: thức ăn, nọc côn trùng, thuốc (kháng sinh, thuốc chống viêm không steroid); ở châu Á hải sản có vỏ là thức ăn hay gây phản vệ ở người lớn. Chẩn đoán phân biệt gồm cơn hen, mề đay cấp toàn thân, nhồi máu cơ tim. Khoảng một nửa phản ứng hai pha xảy ra trong 6–12 giờ đầu; người bệnh cần được theo dõi."
