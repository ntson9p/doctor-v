notes_vi: "Lượt B tải trang bằng curl (rà soát lần cuối 05/11/2024). Khám bác sĩ gia đình sớm (khẩn) hoặc hỏi dược sĩ khi có dấu hiệu đầu tiên: châm chích, đau ở một vùng da, nhất là gần mắt; nhức đầu, mệt; ban thường mọc vài ngày sau. Ban một bên người, hay ở ngực, bụng. Thuốc kháng vi rút tốt nhất trong 3 ngày từ khi nổi ban. Đến khoa cấp cứu ngay nếu zona quanh mắt."
