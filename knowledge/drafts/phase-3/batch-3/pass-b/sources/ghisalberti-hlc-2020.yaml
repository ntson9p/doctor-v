notes_vi: "Lượt B đọc tóm tắt qua API Europe PMC (tìm thấy qua một lần WebSearch). Tổng quan y văn (265 bài) về tuổi khởi phát và triệu chứng của tràn khí màng phổi tự phát nguyên phát: hai đỉnh tuổi 15–30 và 40–45, phần lớn dưới 45 tuổi; đau ở trung bình 69,25% (9–100%), khó thở 54,55% (27–77,1%); hầu như không có thể không triệu chứng; hút thuốc lá là yếu tố nguy cơ ngoại sinh quan trọng nhất. Không phải tổng quan hệ thống chính thức (không có phân tích gộp), nên dùng bậc B."
