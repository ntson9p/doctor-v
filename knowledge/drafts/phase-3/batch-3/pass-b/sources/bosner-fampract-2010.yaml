notes_vi: "Lượt B đọc tóm tắt qua API Europe PMC. 1.212 người đau ngực từ 35 tuổi ở 74 phòng khám đa khoa (Đức): đau có nguồn gốc thành ngực 46,6%. Ở người hội chứng thành ngực: đau sau xương ức 52,0%, đau bên trái 69,2%; đau dai dẳng 28,0%; phần lớn (72,3%) không có liên quan thời gian rõ; 55,4% vẫn còn đau sau 6 tháng. Điểm 4 yếu tố: căng cơ khu trú, đau nhói, đau tái hiện khi ấn, không ho (AUC 0,78)."
