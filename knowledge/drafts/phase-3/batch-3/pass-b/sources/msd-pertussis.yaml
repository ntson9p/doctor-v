notes_vi: "Lượt B tải trang ngày 31/10/2026 (rà soát toàn bộ 6/2024, cập nhật 9/2026). Gặp nhiều ở trẻ em, vị thành niên; người lớn, vị thành niên đã tiêm mà miễn dịch giảm thường bệnh nhẹ, hay bị bỏ sót, và là nguồn lây cho trẻ nhỏ chưa được bảo vệ. Ủ bệnh 7–10 ngày. Bệnh không biến chứng kéo dài 6–10 tuần, trung bình khoảng 7 tuần (3 tuần đến hơn 3 tháng). Giai đoạn viêm long: hắt hơi, chảy nước mắt, chán ăn, ho khan về đêm rồi cả ngày; có thể khàn tiếng; sốt hiếm. Sau 10–14 ngày vào giai đoạn cơn: từng tràng ho liên tiếp rồi hít vào rít; nôn là đặc trưng; ở nhũ nhi cơn nghẹn (có hay không tím) có thể gặp nhiều hơn tiếng rít. Biến chứng hô hấp (ngạt ở nhũ nhi) hay gặp nhất; co giật hay gặp ở nhũ nhi. Nghi ho gà khi ho từ 2 tuần kèm dấu hiệu khác. Kháng sinh ở giai đoạn viêm long giúp bệnh nhẹ hơn; sau đó chủ yếu để giảm lây. Người điều trị tại nhà cần cách ly, nhất là với nhũ nhi, ít nhất 4 tuần từ khi khởi bệnh. Thuốc long đờm, giảm ho ít tác dụng. Người tiếp xúc trong nhà nên được dùng kháng sinh dự phòng trong vòng 21 ngày."
