notes_vi: "Lượt B đọc tóm tắt qua API Europe PMC. Người 21–70 tuổi ở nội thành Hà Nội và huyện Ba Vì: từng mắc hen 5,6% (Hà Nội) và 3,9% (Ba Vì), không khác biệt lớn giữa nam và nữ; ho kéo dài là triệu chứng hay gặp nhất (18,1% và 12,0%), rồi khạc đờm. Nam hút thuốc 49,7% (Hà Nội), 67,8% (Ba Vì); nữ 1–4%."
