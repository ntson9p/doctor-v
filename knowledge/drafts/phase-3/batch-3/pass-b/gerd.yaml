      basis: numeric
      sources: [dao-frontmed-2026]
      locator: "VNAGE 2026 khuyến cáo 1"
      reported: "Khàn tiếng 9,9% người trào ngược (nghiên cứu Việt Nam)."
      note: "Mức occasional (7,5–33%) cao hơn tỷ lệ nền 0,05."
  - finding: productive_cough
    freq: rare
    evidence:
      tier: C
      basis: judgment
      sources: [dao-frontmed-2026]
      note: "Tính trong số người đã ho. Ho do trào ngược chủ yếu là ho khan, kèm cảm giác vướng họng (46,7%); ho có đờm gợi ý nhiễm trùng đường hô hấp. Mức rare thấp hơn tỷ lệ nền 0,2. Ước lượng; bệnh lành tính nên liên kết giảm khả năng này an toàn."
  - finding: runny_nose
    freq: rare
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-heartburn-reflux]
      note: "Không phải triệu chứng của trào ngược; giúp phân biệt ho do trào ngược với ho do cảm lạnh, viêm phế quản. Mức rare thấp hơn tỷ lệ nền. Ước lượng."
  - finding: fever
    freq: rare
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-heartburn-reflux, dao-frontmed-2026]
      note: "Không có sốt; mức rare thấp hơn tỷ lệ nền 0,05."
  - finding: breathing_difficulty
    freq: rare
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-heartburn-reflux]
      note: "Khó thở không phải triệu chứng thường gặp (khò khè chỉ 9,4% ở bệnh viện, VNAGE). Mức rare thấp hơn tỷ lệ nền 0,05; câu trả lời 'Có' nghiêng về bệnh tim, phổi. Ước lượng."
  - finding: cold_sweat
    freq: rare
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-heartburn-reflux]
      note: "Vã mồ hôi lạnh không phải triệu chứng của trào ngược mà gợi ý hội chứng vành cấp. Mức rare thấp hơn tỷ lệ nền 0,05. Ước lượng."
  - finding: weight_loss_unintended
    freq: rare
    evidence:
      tier: B
      basis: verbal
      sources: [dao-frontmed-2026, nhs-heartburn-reflux]
      locator: "VNAGE 2026 khuyến cáo 3 (dấu hiệu báo động); NHS: đi khám nếu sụt cân không rõ lý do"
      note: "Sụt cân là dấu hiệu báo động cần nội soi tìm bệnh khác; trào ngược đơn thuần không gây sụt cân. Mức rare thấp hơn tỷ lệ nền 0,05."
warning_signs: [es_crushing_chest_pain, pain_radiates_arm_jaw, cold_sweat, vomiting_blood, black_stool, breathing_difficulty]
self_care_vi:
  - "Ăn bữa nhỏ, không ăn quá no; không ăn trong 3–4 giờ trước khi đi ngủ."
  - "Kê cao đầu giường khoảng 10–20 cm; không chỉ chồng thêm gối."
  - "Hạn chế rượu bia, cà phê, đồ nhiều dầu mỡ, đồ cay chua nếu thấy làm nặng hơn."
  - "Bỏ thuốc lá; tránh mặc quần áo chật ở bụng."
  - "Hỏi dược sĩ hoặc bác sĩ trước khi dùng thuốc dạ dày."
  - "Không tự cho là trào ngược khi đau ngực kiểu đè nặng, lan lên tay, hàm hoặc kèm vã mồ hôi: gọi 115."
see_doctor_vi:
  - "Đặt lịch khám nếu ợ nóng gần như ngày nào cũng có, hoặc tự chăm sóc 2–4 tuần không đỡ."
  - "Đi khám sớm hơn nếu nuốt vướng, nuốt đau, nôn nhiều, sụt cân hoặc người từ 50 tuổi mới bị lần đầu."
  - "Đau ngực lần đầu, nhất là người lớn tuổi, nên được bác sĩ khám để loại trừ bệnh tim."
  - "Đến cơ sở cấp cứu ngay nếu nôn ra máu hoặc đi ngoài phân đen."
review:
  status: draft
  authors: ["agent:pass-b"]
  updated: "2026-10-31"
  notes_vi: "Lượt B (lô 3 phần c). Mức xử trí 5, không thuộc nhóm không được bỏ sót, giữ như gợi ý: NHS khuyên tự chăm sóc, hỏi dược sĩ, chỉ khám bác sĩ (không khẩn) khi ợ nóng gần như hằng ngày, không đỡ hoặc có nuốt vướng, nôn nhiều, sụt cân; VNAGE: phần lớn là thể nhẹ – vừa, biến chứng nặng hiếm ở Việt Nam. Đau ngực mới do bệnh tim được quy tắc và hội chứng vành cấp (ngưỡng 1%) xử lý. Bộ Y tế chưa có hướng dẫn riêng về trào ngược (4235/QĐ-BYT chỉ nêu trong nguyên nhân đau ngực); nguồn Việt Nam chính là đồng thuận của Hội Tiêu hóa Việt Nam (2026). Prior Đau bụng: P3 cho người lớn, thấp hơn viêm, loét dạ dày (P2), vì bệnh đó đã gồm viêm dạ dày và người đau bụng ít khi là trào ngược đơn thuần; ba câu giúp phân biệt: ợ nóng (very_frequent so với occasional), đau nặng sau ăn (0,55 so với 0,325), có ho (occasional so với không liên kết). Bác sĩ cần xem: (1) prior Ho và Đau bụng là ước lượng; (2) tần suất ho, khàn tiếng lấy từ người trào ngược ở bệnh viện Việt Nam (qua VNAGE), đã hạ cho cộng đồng; (3) câu ợ nóng gộp ợ chua và nóng rát sau xương ức, mà hội chứng vành cấp cũng có liên kết occasional với câu này; (4) mã ICD-10 K21 chưa đối chiếu; (5) chưa có câu hỏi 'đau tăng khi nằm, cúi' và 'nuốt vướng, nuốt đau', vốn giúp phân biệt thêm."
