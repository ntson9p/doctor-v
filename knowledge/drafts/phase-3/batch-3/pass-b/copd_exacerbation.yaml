id: copd_exacerbation
names:
  vi: "Đợt cấp bệnh phổi tắc nghẽn mạn tính"
  vi_common: ["Phổi tắc nghẽn", "Bệnh phổi tắc nghẽn mạn tính (COPD) nặng lên", "Viêm phế quản mạn đợt cấp"]
  en: "Acute exacerbation of chronic obstructive pulmonary disease (COPD)"
codes:
  icd10: "J44.1"
  icd10_verified: false
  mondo: "MONDO:0005002"
summary_vi:
  - "Bệnh phổi tắc nghẽn mạn tính hay gặp ở người trên 40 tuổi hút thuốc lá, thuốc lào hoặc hít khói bụi lâu năm."
  - "Đợt cấp là khi khó thở, ho, khạc đờm nặng lên rõ trong vài ngày, thường do nhiễm trùng hoặc ô nhiễm."
  - "Phần lớn điều trị ngoại trú, nhưng cần được bác sĩ khám sớm."
urgency: 3
cant_miss: false
specialties: [respiratory, general_medicine]
applicability:
  age_groups: [adult_18_44, adult_45_64, elder_65_74, elder_75p]
  reason_vi: "Bệnh phổi tắc nghẽn mạn tính hình thành sau nhiều năm phơi nhiễm, gần như không gặp ở trẻ em, vị thành niên."
priors:
  - complaint: shortness_of_breath
    default: P2
    by_age:
      adult_18_44: P5
    evidence:
      tier: B
      basis: numeric
      sources: [frese-jcmr-2011, byt-qd-4235-2012, byt-qd-2767-2023, lam-copd-2014]
      locator: "Frese 2011 bảng 5; 4235 bài khó thở; 2767 mục 1.1"
      reported: "bệnh phổi tắc nghẽn mạn tính 2,2% lần khám vì khó thở mới, 15,9% vì khó thở đã biết (cộng viêm phế quản mạn 0,8% và 5,1%), mọi lứa tuổi (Hà Lan); trên 45 tuổi là chẩn đoán đứng thứ hai sau suy tim (Ponka, theo Frese); tỷ lệ mắc ở người trên 40 tuổi 4,2% (2767), 7,1% người 23–72 tuổi miền Bắc, nam trên 50 tuổi 23,5% (Lâm 2014)"
      note: "Thang tuyệt đối. Số của Frese gộp mọi lứa tuổi; ở người từ 45 tuổi, nhất là nam hút thuốc ở Việt Nam, tỷ lệ cao hơn. Ước 5–20% (P2) từ 45 tuổi. Lượt B cân nhắc P1 cho người từ 65 tuổi nhưng giữ P2 vì suy tim, viêm phổi cũng hay gặp. Người 18–44 tuổi rất ít mắc (2767: hay gặp trên 40 tuổi): P5. 4235: phần lớn cơn khó thở ở phòng khám cấp cứu là đợt cấp hen hoặc bệnh phổi tắc nghẽn mạn tính."
  - complaint: cough
    default: P3
    by_age:
      adult_18_44: P6
      elder_65_74: P2
      elder_75p: P2
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-2767-2023, lam-copd-2014, lam-respmed-2011, byt-qd-4235-2012]
      locator: "2767 mục 1.2.1 và 3.3.1"
      reported: "ho kéo dài gặp ở 12–18% người lớn miền Bắc (Lâm 2011); bệnh phổi tắc nghẽn mạn tính 7,1% (Lâm 2014)"
      note: "Đợt cấp làm ho, khạc đờm tăng (2767). Người đi khám vì ho phần lớn bị nhiễm trùng hô hấp cấp; ước đợt cấp chiếm 1–5% (P3) ở người 45–64 tuổi và 5–20% (P2) từ 65 tuổi, khi bệnh hay gặp hơn. Dưới 45 tuổi rất hiếm (P6). Ước lượng."
prior_modifiers:
  - when: { regions: [north], months: [12, 1, 2] }
    factor: 1.3
    evidence:
      tier: C
      basis: verbal
      sources: [byt-qd-2767-2023, nhs-copd-symptoms]
      locator: "2767 mục 3.2"
      note: "2767: nhiệt độ môi trường giảm đột ngột là yếu tố khởi phát đợt cấp; nhiễm vi rút cúm, cảm lạnh là nguyên nhân hay gặp. NHS: đợt cấp hay gặp vào mùa đông. Hệ số nhỏ, chỉ cho các tháng lạnh ở miền Bắc; không có số liệu Việt Nam. Không đặt hệ số giới tính: Lâm 2014 cho thấy giới nam mất ý nghĩa sau khi tính hút thuốc, mà hút thuốc đã là câu hỏi riêng."
findings:
  - finding: copd_known
    freq: frequent
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-2767-2023, nguyenviet-respirology-2015, lam-copd-2014]
      locator: "2767 mục 3.3.1"
      reported: "94% người không hút thuốc mắc bệnh chưa từng được chẩn đoán (Việt Nam, Indonesia)"
      note: "2767 dùng chẩn đoán đợt cấp cả cho người trung niên chưa được chẩn đoán có triệu chứng tương tự. Ở Việt Nam nhiều người bệnh chưa được chẩn đoán; người đi khám vì đợt nặng lên thì nhiều người đã được nói bệnh. Ước khoảng một nửa (frequent); tỷ lệ nền 4%. Cần bác sĩ duyệt."
  - finding: breathing_difficulty
    freq: very_frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-2767-2023, gold-2026, byt-qd-4235-2012]
      locator: "2767 mục 3.1, 3.3.1; 4235 Bảng 10.1"
      note: "Chỉ có tác dụng khi triệu chứng chính là Ho. Đợt cấp đặc trưng bởi khó thở và/hoặc ho khạc đờm tăng (2767, GOLD); khó thở tăng là tiêu chuẩn chính Anthonisen."
  - finding: cough
    freq: very_frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-2767-2023, byt-qd-4235-2012]
      locator: "2767 mục 3.3.1; 4235 Bảng 10.1"
      note: "Chỉ có tác dụng khi triệu chứng chính là Khó thở. Ho tăng là triệu chứng hô hấp của đợt cấp."
  - finding: productive_cough
    freq: very_frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-2767-2023, byt-qd-4235-2012]
      locator: "2767 mục 3.3.1, 3.3.3"
      note: "Tần suất trong số người có ho. Khạc đờm tăng, đờm chuyển màu là tiêu chuẩn chính Anthonisen; bệnh nền đã có ho khạc đờm kéo dài, thường buổi sáng (2767 mục 1.2.1)."
  - finding: wheeze
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-2767-2023, nhs-copd-symptoms]
      locator: "2767 mục 1.2.1, 3.3.1, 3.3.4"
      note: "2767: thở khò khè; trong đợt cấp nghe phổi có ran rít, ran ngáy; khò khè tăng là tiêu chuẩn phụ Anthonisen. NHS: khò khè kéo dài. Không có tỷ lệ; ước frequent."
  - finding: smoker
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [lam-copd-2014, nguyenviet-respirology-2015, byt-qd-2767-2023]
      reported: "nam hút thuốc trên 60 tuổi: 47,8% mắc bệnh; nữ mắc bệnh không ai hút thuốc (Lâm 2014); 25–40% người bệnh chưa từng hút thuốc (Nguyen Viet 2015)"
      note: "Hút thuốc lá, thuốc lào là yếu tố nguy cơ chính (2767). Nhiều người bệnh đã bỏ thuốc (câu former_smoker) hoặc chưa từng hút; ước khoảng một nửa đang hút. Tỷ lệ nền 20%."
  - finding: former_smoker
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-2767-2023, nguyenviet-respirology-2015]
      note: "Người đã bỏ thuốc vẫn mang nguy cơ; với smoker frequent và 25–40% chưa từng hút, phần đã bỏ thuốc khoảng 20–30% (occasional). Tỷ lệ nền 15% nên câu này tăng khả năng bệnh ít. Ước lượng."
  - finding: biomass_smoke_exposure
    freq: frequent
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-2767-2023, nguyenviet-respirology-2015, lam-copd-2014]
      locator: "2767 mục 1.2.1"
      note: "2767 nêu ô nhiễm trong nhà (khói bếp, khói chất đốt) và bụi nghề nghiệp là yếu tố nguy cơ; bệnh gặp ở 6,9% người không hút thuốc từ 40 tuổi, phụ nữ mắc bệnh ở miền Bắc không hút thuốc (Lâm 2014), gợi ý vai trò khói bếp. Không có tỷ lệ phơi nhiễm trong người bệnh; ước frequent. Tỷ lệ nền 20%. Cần bác sĩ duyệt."
  - finding: dyspnea_onset
    dist: { sudden: 0.10, hours_days: 0.75, weeks: 0.15 }
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-2767-2023, gold-2026]
      locator: "2767 mục 3.1; GOLD 2026 tr. 39"
      note: "Phân bố trong số người có khó thở. Đợt cấp là tình trạng nặng lên trong vòng 14 ngày; khó thở tăng dần nhiều tháng là diễn tiến của bệnh nền, không phải đợt cấp. Ước lượng."
  - finding: dyspnea_severity
    dist: { exertion: 0.50, rest: 0.42, cannot_speak: 0.08 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-2767-2023, gold-2026]
      locator: "2767 mục 3.4.1, Bảng 3.2"
      reported: "hơn 80% đợt cấp được điều trị ngoại trú"
      note: "Phân bố trong số người có khó thở. Đợt nhẹ khó thở khi gắng sức; khó thở khi nghỉ là triệu chứng nặng cần nhập viện (2767). Người bệnh nền đã khó thở khi gắng sức nên mức nghỉ ngơi cũng khó thở cao hơn nền. Ước lượng."
  - finding: spo2_measured
    dist: { ge_96: 0.15, s92_95: 0.17, lt_92: 0.08, not_measured: 0.60 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-2767-2023]
      locator: "2767 mục 3.3.4, Bảng 3.2"
      note: "Phân bố trong số người có khó thở; 'Chưa đo' đúng bằng tỷ lệ nền 0,6. Đợt nhẹ có SpO2 từ 92%; dưới 92% là đợt trung bình, nặng (2767). Người bệnh nặng thường có SpO2 nền thấp. Ước lượng."
  - finding: reliever_no_relief
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-2767-2023, byt-qd-4235-2012]
      locator: "2767 Bảng 3.2; 4235 bài 10, sơ đồ 1"
      note: "Tần suất trong số người đã biết bị hen hoặc bệnh phổi tắc nghẽn mạn tính. Xử trí ban đầu là tăng thuốc giãn phế quản rồi đánh giá lại sau 1–3 giờ; đáp ứng không tốt thì nhập viện. Ước occasional; đã có quy tắc mức 2."
  - finding: fever
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-2767-2023, byt-qd-4235-2012]
      locator: "2767 mục 3.3.1, 3.3.3; 4235 Bảng 10.1"
      note: "Sốt có thể có hoặc không (2767, 4235); sốt không rõ nguyên nhân khác là tiêu chuẩn phụ Anthonisen. Ước occasional."
  - finding: cough_duration
    dist: { lt_1w: 0.25, w1_2: 0.20, w2_8: 0.20, gt_8w: 0.35 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-2767-2023]
      locator: "2767 mục 1.2.1"
      note: "Phân bố trong số người có ho. Bệnh nền có ho dai dẳng, ho hằng ngày; nhiều người sẽ trả lời theo thời gian ho của bệnh nền (từ 2 tháng), người khác theo thời gian ho tăng của đợt cấp. Ước lượng, cần bác sĩ duyệt."
  - finding: orthopnea
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-4235-2012, nhs-copd-symptoms]
      locator: "4235 bài khó thở (hoàn cảnh xuất hiện)"
      note: "4235: khó thở khi nằm cũng có thể gặp trong bệnh phổi tắc nghẽn mạn tính; NHS: có khi thức dậy ban đêm vì khó thở. Ước occasional."
  - finding: night_respiratory_symptoms
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-copd-symptoms]
      note: "Tần suất trong số người có ho hoặc khó thở. NHS: có khi thức dậy ban đêm vì khó thở. Ho đờm của bệnh này hay vào buổi sáng (2767). Ước occasional."
  - finding: leg_swelling_both
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-2767-2023, nhs-copd-symptoms]
      locator: "2767 mục 1.2.1, 3.3.1"
      note: "Phù hai chân là dấu hiệu tâm phế mạn, gặp ở giai đoạn muộn hoặc trong đợt cấp (2767); NHS xếp phù mắt cá vào nhóm ít gặp. Ước occasional."
  - finding: chest_pain_pressure
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-2767-2023, byt-qd-4235-2012]
      locator: "2767 mục 3.3.1; 4235 Bảng 10.1"
      note: "Nặng ngực có thể có tùy mức nặng (2767, 4235). Ước occasional; tức ngực kèm khó thở đã có quy tắc mức 2."
  - finding: weight_loss_unintended
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-2767-2023, nhs-copd-symptoms]
      locator: "2767 mục 1.2.1"
      note: "Sụt cân, teo cơ gặp ở giai đoạn muộn; 2767 lưu ý đó cũng có thể là dấu hiệu lao phổi, ung thư phổi đồng mắc. NHS: ít gặp, giai đoạn nặng. Ước occasional."
  - finding: hemoptysis
    freq: very_rare
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-copd-symptoms]
      note: "NHS: ho ra máu thường do bệnh khác như nhiễm trùng ngực hoặc ung thư phổi. Mức very_rare thấp hơn tỷ lệ nền 1%: câu 'có' nghiêng sang lao, ung thư phổi, tắc mạch phổi."
  - finding: similar_episodes_before
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [nhs-copd-symptoms, byt-qd-2767-2023]
      locator: "2767 mục 3.3.4 (nguy cơ: từ 2 đợt cấp trong năm trước)"
      note: "NHS: nhiều người có vài đợt cấp mỗi năm. Câu hỏi về cơn giống hệt lần này; ước frequent. Tỷ lệ nền 20%."
warning_signs:
  - es_severe_breathing
  - reliever_no_relief
  - confusion
  - drowsy_hard_to_wake
  - cold_hands_feet
self_care_vi:
  - "Dùng thuốc xịt, thuốc hít đúng theo kế hoạch bác sĩ đã dặn cho đợt nặng lên."
  - "Ngồi tư thế dễ thở, tập thở chúm môi, nghỉ ngơi."
  - "Không hút thuốc, tránh khói bếp, khói bụi; giữ ấm khi trời lạnh."
  - "Không tự ý ngừng thuốc duy trì, không tự mua kháng sinh hoặc thuốc ngủ, thuốc an thần."
  - "Hỏi bác sĩ về tiêm phòng cúm, phế cầu."
see_doctor_vi:
  - "Đi khám trong 24 giờ khi khó thở, ho, khạc đờm tăng hơn thường ngày, hoặc đờm chuyển vàng, xanh."
  - "Người ho, khạc đờm, khó thở kéo dài mà chưa từng được bác sĩ nói bị bệnh này nên đi đo chức năng hô hấp."
  - "Đi cấp cứu ngay nếu khó thở khi ngồi nghỉ, nói không trọn câu, môi tím, lơ mơ, hoặc xịt thuốc không đỡ."
sources: [byt-qd-2767-2023, byt-qd-4235-2012, gold-2026, nhs-copd-symptoms]
review:
  status: draft
  authors: ["agent:pass-b"]
  updated: "2026-10-31"
  notes_vi: "Cần bác sĩ xem: (1) urgency 3 như gợi ý: 2767/QĐ-BYT và GOLD 2026 ghi hơn 80% đợt cấp điều trị ngoại trú nhưng cần được đánh giá và điều chỉnh thuốc; đợt nặng (khó thở khi nghỉ, SpO2 dưới 92%, xịt thuốc không đỡ, lú lẫn) do quy tắc mức 1–2 xử lý; (2) applicability từ 18 tuổi, cùng phạm vi với câu copd_known; prior 18–44 tuổi rất thấp; (3) prior dựa trên Frese (Hà Lan, Đức, mọi lứa tuổi) và tỷ lệ mắc ở Việt Nam; chưa có số liệu theo lý do đi khám ở Việt Nam; (4) copd_known frequent là ước lượng (nhiều người Việt Nam chưa được chẩn đoán); (5) không đặt hệ số giới tính vì hút thuốc đã được hỏi; hệ số mùa lạnh miền Bắc 1,3 chỉ dựa trên mô tả bằng lời; (6) biomass_smoke_exposure frequent là ước lượng; (7) MONDO ghi mã của bệnh nền (chronic obstructive pulmonary disease), MONDO không có mục riêng cho đợt cấp; mã ICD-10 chưa đối chiếu."
