id: asthma
names:
  vi: "Hen phế quản (cơn hen)"
  vi_common: ["Hen suyễn", "Hen", "Suyễn"]
  en: "Asthma (asthma attack or exacerbation)"
codes:
  icd10: "J45.9"
  icd10_verified: false
  mondo: "MONDO:0004979"
summary_vi:
  - "Bệnh viêm mạn tính đường thở, làm phế quản co hẹp từng lúc."
  - "Thường có khò khè, khó thở, nặng ngực, ho; hay nặng về đêm, gần sáng, khi cảm cúm, gắng sức hoặc gặp khói bụi."
  - "Cơn hen có thể nhẹ hoặc nặng; cơn nặng cần cấp cứu."
urgency: 3
cant_miss: false
specialties: [respiratory, pediatrics]
applicability:
  age_groups: [child_2m_5y, child_5_12, teen_13_17, adult_18_44, adult_45_64, elder_65_74, elder_75p]
  reason_vi: "Trẻ dưới 2 tháng tuổi khò khè, khó thở thường do bệnh khác (viêm tiểu phế quản, dị tật); chưa chẩn đoán hen ở tuổi này."
priors:
  - complaint: shortness_of_breath
    default: P2
    by_age:
      child_5_12: P1
      teen_13_17: P1
      elder_65_74: P3
      elder_75p: P3
    evidence:
      tier: B
      basis: numeric
      sources: [frese-jcmr-2011, byt-qd-4235-2012, lam-respmed-2011]
      locator: "Frese 2011 bảng 5 và phần bàn luận; 4235 bài Hướng dẫn chẩn đoán và xử trí khó thở"
      reported: "hen phế quản 11,0% lần khám vì khó thở mới và 36,1% lần khám vì khó thở đã biết (Hà Lan), 5,4% (Đức); dưới 45 tuổi hen là chẩn đoán đứng đầu; người lớn Việt Nam từng mắc hen 3,9–5,6%"
      population: "người đi khám bác sĩ đa khoa vì khó thở ở Đức, Hà Lan"
      note: "Thang tuyệt đối. Người đi khám vì khó thở gồm cả người đã biết bị hen nên ước 5–20% (P2) cho người lớn và trẻ 2 tháng–5 tuổi (ở trẻ nhỏ viêm tiểu phế quản, viêm phổi chiếm nhiều hơn). Trẻ 5–17 tuổi: hen là nguyên nhân hàng đầu của khó thở (Frese, theo Ponka), ước từ 20% (P1). Từ 65 tuổi, bệnh phổi tắc nghẽn mạn tính, suy tim chiếm ưu thế nên P3. 4235: phần lớn cơn khó thở ở phòng khám cấp cứu là đợt cấp hen hoặc bệnh phổi tắc nghẽn mạn tính. Chưa có số liệu Việt Nam theo lý do đi khám."
  - complaint: cough
    default: P3
    by_age:
      child_5_12: P2
      teen_13_17: P2
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-4235-2012, lam-respmed-2011, byt-qd-1851-2020]
      locator: "4235 bài Hướng dẫn chẩn đoán và điều trị ho kéo dài, mục 2.2"
      reported: "hen là nguyên nhân thứ hai của ho kéo dài sau bệnh mũi xoang (4235); người lớn Việt Nam từng mắc hen 3,9–5,6% (Lâm 2011)"
      note: "Phần lớn người đi khám vì ho bị nhiễm trùng hô hấp cấp; hen chiếm phần nhỏ hơn, chủ yếu ở người ho kéo dài, ho về đêm. Ước 1–5% (P3) cho người lớn và trẻ dưới 5 tuổi, 5–20% (P2) cho trẻ 5–17 tuổi, lứa tuổi hen hay gặp. Ước lượng, cần bác sĩ duyệt."
  - complaint: chest_pain
    default: P3
    evidence:
      tier: C
      basis: judgment
      sources: [verdon-smw-2008, byt-qd-1851-2020, nhs-asthma-attack]
      locator: "Verdon 2008 tóm tắt; 1851 mục 2.3.2, Bảng 1"
      reported: "nguyên nhân hô hấp chiếm 10% người đau ngực ở tuyến ban đầu (Thụy Sĩ)"
      note: "Nặng ngực, tức ngực là một trong bốn triệu chứng điển hình của hen (1851, NHS). Trong 10% đau ngực do hô hấp có cả viêm phổi, viêm phế quản; ước hen 1–5% (P3) ở mọi lứa tuổi được hỏi. Ước lượng."
findings:
  - finding: wheeze
    freq: very_frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-1851-2020, byt-qd-4888-2016, gina-2026, nhs-asthma-attack]
      locator: "1851 mục 1, 2.1 và Bảng 1"
      note: "1851: thở khò khè là triệu chứng điển hình; trong cơn có tiếng cò cử người khác cũng nghe được, nghe phổi có ran rít lan tỏa. Không có tỷ lệ; chọn very_frequent vì là dấu hiệu chính của cơn hen."
  - finding: breathing_difficulty
    freq: very_frequent
    freq_by_complaint: { cough: frequent }
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-1851-2020, nhs-asthma-attack, byt-qd-4235-2012]
      locator: "1851 mục 2.1 và Bảng 1; 4235 bài ho kéo dài, mục 2.2"
      note: "Chỉ có tác dụng khi triệu chứng chính là Ho hoặc Đau ngực. Khó thở thì thở ra là triệu chứng chính của cơn hen. Ở người đi khám vì ho, một phần là ho do hen chưa có cơn khó thở rõ (4235: chỉ trường hợp điển hình mới có khó thở cò cử), nên hạ xuống frequent. Ước lượng."
  - finding: cough
    freq: very_frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-1851-2020, gina-2026, nhs-asthma-attack]
      locator: "1851 Bảng 1"
      note: "Chỉ có tác dụng khi triệu chứng chính là Khó thở hoặc Đau ngực. Ho là một trong bốn triệu chứng điển hình; cơn hen thường kết thúc bằng ho, khạc đờm trong, quánh (1851)."
  - finding: night_respiratory_symptoms
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-1851-2020, byt-qd-4235-2012, nhs-asthma-attack]
      locator: "1851 mục 2.1, Bảng 1; 4235 bài ho kéo dài, mục 2.2"
      note: "Triệu chứng thường xảy ra hoặc nặng hơn về đêm, lúc thức giấc (1851, NHS); ho do hen thường về nửa đêm, gần sáng (4235). Không có tỷ lệ; chọn frequent vì không phải cơn nào cũng về đêm. Tần suất trong số người có ho hoặc khó thở."
  - finding: asthma_known
    freq: very_frequent
    freq_by_age:
      child_2m_5y: frequent
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-1851-2020, byt-qd-4888-2016]
      locator: "1851 mục 4.1"
      note: "Phần lớn người lên cơn hen đã được chẩn đoán; 1851: đợt cấp đôi khi là biểu hiện đầu tiên của hen. Trẻ dưới 5 tuổi khó chẩn đoán hen (4888) nên nhiều bé khò khè lần đầu chưa được nói là hen: frequent. Ước lượng; tỷ lệ nền 6%."
  - finding: similar_episodes_before
    freq: very_frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-1851-2020, nhs-asthma-attack]
      locator: "1851 mục 2.1"
      note: "Bệnh tái đi tái lại, triệu chứng đến rồi đi (NHS); 1851: tiền sử có cơn khó thở kiểu hen. Câu hỏi về cơn giống hệt lần này. Ước very_frequent vì phần lớn người lên cơn đã từng có cơn trước."
  - finding: reliever_no_relief
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-1851-2020, nhs-asthma-attack]
      locator: "1851 mục 4.4"
      note: "Tần suất trong số người đã biết bị hen hoặc bệnh phổi tắc nghẽn mạn tính. Phần lớn cơn nhẹ, vừa đỡ khi xịt thuốc cắt cơn; không đỡ là dấu hiệu cơn nặng (NHS: gọi cấp cứu). Ước occasional cho người đi tìm hiểu hoặc đi khám; đã có quy tắc mức 1."
  - finding: dyspnea_onset
    dist: { sudden: 0.30, hours_days: 0.60, weeks: 0.10 }
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-4235-2012, byt-qd-1851-2020]
      locator: "4235 bài Hướng dẫn chẩn đoán và xử trí khó thở (kiểu xuất hiện khó thở; cơn hen phế quản); 1851 mục 2.1"
      note: "Phân bố trong số người có khó thở. 4235 xếp cơn hen vào nhóm khó thở tiến triển nhanh và mô tả cơn khó thở xảy ra đột ngột; 1851: lúc đầu khó thở chậm, tăng dần, cơn kéo dài từ vài phút đến hàng giờ, hàng ngày. Khó thở tăng dần nhiều tuần ít phù hợp một cơn hen. Ước lượng."
  - finding: dyspnea_severity
    dist: { exertion: 0.50, rest: 0.42, cannot_speak: 0.08 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-1851-2020, byt-qd-4888-2016, gina-2026]
      locator: "1851 mục 4.4, Bảng 9; 4888 Bảng 6"
      note: "Phân bố trong số người có khó thở. Phần lớn cơn hen ở cộng đồng là cơn nhẹ hoặc vừa; cơn nặng khi chỉ nói từng từ (1851). Ước lượng, cần bác sĩ duyệt."
  - finding: spo2_measured
    dist: { ge_96: 0.25, s92_95: 0.11, lt_92: 0.04, not_measured: 0.60 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-4888-2016, gina-2026, byt-qd-1851-2020]
      locator: "4888 Bảng 6; GINA 2026 tr. 179"
      note: "Phân bố trong số người có khó thở; 'Chưa đo' đúng bằng tỷ lệ nền 0,6. Cơn vừa ở trẻ có SpO2 92–95%, cơn nặng dưới 92% (4888, GINA). Phần lớn cơn ở cộng đồng nhẹ hoặc vừa. Ước lượng."
  - finding: chest_pain_pressure
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-1851-2020, nhs-asthma-attack]
      locator: "1851 mục 1, Bảng 1"
      note: "Nặng ngực, tức ngực là triệu chứng điển hình (1851, NHS). Câu hỏi gồm cả tức nặng giữa ngực. Không có tỷ lệ; ước frequent."
  - finding: chest_pain_duration
    dist: { seconds: 0.05, minutes: 0.30, over_15min: 0.40, days: 0.25 }
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-1851-2020]
      locator: "1851 mục 2.1"
      note: "Phân bố trong số người có đau ngực. 1851: cơn khó thở kéo dài 5–15 phút, có khi hàng giờ, hàng ngày; nặng ngực kéo dài theo cơn. Ước lượng."
  - finding: chest_pain_exertional
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-1851-2020, nhs-asthma-attack]
      locator: "1851 Bảng 1"
      note: "Tần suất trong số người có đau ngực. Triệu chứng hen hay khởi phát khi gắng sức (1851, NHS), nhưng không phải kiểu đau đỡ ngay khi nghỉ như cơn đau thắt ngực. Ước occasional."
  - finding: chest_pain_sudden_severe
    freq: rare
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-1851-2020]
      locator: "1851 mục 2.1"
      note: "Tần suất trong số người có đau ngực. Nặng ngực do hen tăng dần theo cơn khó thở, ít khi đau dữ dội ngay từ đầu. Mức rare thấp hơn tỷ lệ nền 5%: câu 'có' nghiêng sang bệnh tim mạch, tràn khí màng phổi. Ước lượng."
  - finding: orthopnea
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-4235-2012]
      locator: "4235 bài Hướng dẫn chẩn đoán và xử trí khó thở (hoàn cảnh xuất hiện khó thở)"
      note: "4235: khó thở khi nằm gợi ý suy tim trái nhưng cũng có thể gặp trong hen phế quản, bệnh phổi tắc nghẽn mạn tính. Không có tỷ lệ; ước occasional."
  - finding: leg_swelling_both
    freq: rare
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-4235-2012, byt-qd-1851-2020]
      note: "Phù hai chân không thuộc bệnh cảnh hen; khó thở kèm phù gợi ý suy tim (4235). Mức rare thấp hơn tỷ lệ nền 5%. Ước lượng."
  - finding: fever
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-1851-2020, byt-qd-4235-2012]
      locator: "1851 mục 4.1 (yếu tố khởi phát đợt cấp)"
      note: "Nhiễm vi rút hô hấp hay khởi phát cơn hen (1851) nên có thể kèm sốt, nhưng cơn hen tự nó không gây sốt; sốt kèm khó thở gợi ý viêm phổi (4235). Ước occasional."
  - finding: allergen_exposure
    freq: rare
    evidence:
      tier: B
      basis: numeric
      sources: [byt-qd-1851-2020]
      locator: "1851 mục bệnh đồng mắc (dị ứng thức ăn và phản vệ; bệnh hô hấp bùng phát do aspirin)"
      reported: "dị ứng thức ăn là yếu tố khởi phát ở dưới 2% người hen; bệnh hô hấp bùng phát do aspirin 7% người hen"
      note: "Câu hỏi về ăn món lạ, dùng thuốc mới, bị đốt trong khoảng 2 giờ trước, nhằm phát hiện phản vệ. Cơn hen thường do vi rút, khói bụi, thời tiết; mức rare thấp hơn tỷ lệ nền 5% để câu 'có' nghiêng sang phản vệ."
  - finding: cough_duration
    dist: { lt_1w: 0.30, w1_2: 0.20, w2_8: 0.30, gt_8w: 0.20 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-4235-2012, byt-qd-1851-2020]
      locator: "4235 bài ho kéo dài, mục 2.2"
      note: "Phân bố trong số người có ho. Ho trong một cơn hen ngắn, nhưng hen là nguyên nhân hay gặp thứ hai của ho kéo dài trên 3 tuần (4235), nên tỷ lệ ho từ 2 tuần cao hơn nền. Ước lượng."
warning_signs:
  - es_severe_breathing
  - reliever_no_relief
  - confusion
  - drowsy_hard_to_wake
  - chest_indrawing
self_care_vi:
  - "Khi lên cơn: ngồi thẳng, giữ bình tĩnh, dùng thuốc cắt cơn theo kế hoạch bác sĩ đã dặn."
  - "Nếu xịt thuốc cắt cơn mà không đỡ, hoặc mệt hơn, gọi 115 ngay."
  - "Không tự ý ngừng thuốc dự phòng hen, kể cả khi đã thấy khỏe."
  - "Tránh khói thuốc lá, khói bếp, bụi và những thứ đã biết làm lên cơn."
  - "Mang theo thuốc cắt cơn khi ra ngoài."
see_doctor_vi:
  - "Đi khám trong 24 giờ nếu cơn hen phải dùng thuốc cắt cơn nhiều hơn thường lệ."
  - "Sau một cơn hen, dù đã đỡ, nên đi khám trong 2 ngày để chỉnh thuốc."
  - "Đi khám nếu hay ho, khò khè hoặc khó thở về đêm mà chưa từng được bác sĩ nói là hen."
  - "Đi cấp cứu ngay nếu khó thở đến mức nói không trọn câu, môi tím hoặc lơ mơ."
sources: [byt-qd-1851-2020, byt-qd-4888-2016, gina-2026, nhs-asthma-attack]
review:
  status: draft
  authors: ["agent:pass-b"]
  updated: "2026-10-31"
  notes_vi: "Cần bác sĩ xem: (1) urgency 3 như gợi ý: bệnh này là cơn hen hoặc đợt hen nặng lên; 1851/QĐ-BYT cho xử trí cơn nhẹ, vừa ở tuyến ban đầu, NHS khuyên khám trong 2 ngày sau cơn hen; cơn nặng, xịt thuốc không đỡ do quy tắc mức 1–2 xử lý. Người chỉ ho kéo dài do hen cũng nhận mức 3, có thể hơi cao; (2) applicability bỏ trẻ dưới 2 tháng, cùng phạm vi với câu asthma_known; (3) prior Khó thở dựa trên Frese (Đức, Hà Lan), prior Ho và Đau ngực là ước lượng; chưa có số liệu Việt Nam theo lý do đi khám; (4) asthma_known very_frequent là ước lượng, quyết định nhiều nhất tới kết quả: người hen chưa được chẩn đoán sẽ ra khả năng thấp; (5) các tần suất từ hướng dẫn (1851, 4888, GINA, NHS) chỉ mô tả bằng lời; (6) mã ICD-10 chưa đối chiếu."
