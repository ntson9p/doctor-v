id: herpes_zoster
names:
  vi: "Bệnh zona"
  vi_common: ["Zona thần kinh", "Giời leo", "Zona"]
  en: "Herpes zoster (shingles)"
codes:
  icd10: "B02"
  icd10_verified: false
  mondo: "MONDO:0005609"
summary_vi:
  - "Vi rút thủy đậu nằm im trong rễ thần kinh nhiều năm, rồi hoạt động lại khi sức đề kháng giảm."
  - "Thường đau rát, châm chích một bên ngực hoặc lưng vài ngày trước khi nổi mụn nước thành dải."
  - "Hay gặp ở người cao tuổi và người suy giảm miễn dịch; nên khám sớm trong 3 ngày đầu sau khi nổi ban."
urgency: 4
cant_miss: false
specialties: [dermatology, general_medicine]
priors:
  - complaint: chest_pain
    default: P4
    by_age:
      child_5_12: P5
      teen_13_17: P5
      adult_45_64: P3
      elder_65_74: P3
      elder_75p: P3
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-75-2015, cdc-shingles-hcp, kawai-bmjopen-2014, byt-qd-4235-2012, verdon-smw-2008, bosner-bmcfampract-2009]
      locator: "75/QĐ-BYT bài Bệnh zona mục 1, 3; CDC Clinical overview (Epidemiology); Kawai 2014 tóm tắt; 4235/QĐ-BYT tr. 25–26 (zona trong nguyên nhân đau ngực từ thành ngực); Verdon 2008, Bösner 2009 (nhóm 'khác' 2–8%)"
      reported: "Zona 3–5/1.000 người-năm ở châu Á – Thái Bình Dương (Kawai), 2–9/1.000 tùy tuổi, tăng mạnh sau 50 tuổi (CDC); zona liên sườn và ngực bụng chiếm 50% (75/QĐ-BYT); đau ngực chiếm 0,7–2,7% lượt khám đa khoa"
      note: "Lượt A, lô 3. 4235/QĐ-BYT dặn khám thành ngực tìm zona khi đau ngực. Khoảng một nửa ca zona ở ngực, bụng; đau có trước ban 1–5 ngày nên nhiều người đi khám vì đau ngực. Ước từ tỷ lệ mới mắc so với số lượt khám đau ngực: từ 45 tuổi 1–5% (P3), 18–44 tuổi 0,2–1% (P4), trẻ 5–17 tuổi 0,02–0,2% (P5; trẻ, người trẻ ít đau, 75/QĐ-BYT). Người đã nổi ban có thể chọn tìm theo ban thay vì Đau ngực. Ước lượng, chưa có số liệu ở người đau ngực."
findings:
  - finding: rash_any
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-75-2015, cdc-shingles-hcp, nhs-shingles]
      locator: "75/QĐ-BYT mục 3a (tiền triệu 1–5 ngày, mảng đỏ rồi mụn nước); CDC Clinical features; NHS Symptoms"
      note: "Lượt A, lô 3. Có tác dụng khi triệu chứng chính là Đau ngực. Đau có trước ban vài ngày; người đi khám trong giai đoạn tiền triệu chưa có ban, còn người đã nổi ban thì có. Ước khoảng một nửa người zona chọn Đau ngực đã có ban; hiếm khi đau mà không bao giờ có ban (NHS). Tỷ lệ nền 5%."
  - finding: dermatomal_rash
    freq: almost_always
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-75-2015, cdc-shingles-hcp, nhs-shingles]
      locator: "75/QĐ-BYT mục 3a (thường một bên, không vượt đường giữa, theo đường đi của dây thần kinh); CDC (một hoặc hai khoanh da kề nhau); NHS (chỉ một bên người)"
      note: "Lượt A, lô 3. Tính trong số người đã có ban. Đặc trưng của bệnh; zona lan tỏa ở người suy giảm miễn dịch là ngoại lệ hiếm. Tỷ lệ nền 1%."
  - finding: hives
    freq: rare
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-75-2015, cdc-shingles-hcp]
      note: "Lượt A, lô 3. Tính trong số người đã có ban. Ban zona là mảng đỏ có mụn nước, không phải mề đay gồ ngứa lan nhanh. Mức rare thấp hơn tỷ lệ nền 5%; giúp phân biệt với phản vệ, dị ứng."
  - finding: chest_pain_duration
    dist: { seconds: 0.1, minutes: 0.1, over_15min: 0.25, days: 0.55 }
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-75-2015, nhs-shingles]
      locator: "75/QĐ-BYT mục 3a (đau xuất hiện sớm, thay đổi suốt thời gian bệnh; người cao tuổi đau thành từng cơn, kéo dài)"
      note: "Lượt A, lô 3. Tính trong số người đã đau ngực. Đau rát âm ỉ nhiều ngày, có khi giật từng cơn như kim châm. Phân bố là ước lượng."
  - finding: chest_wall_tenderness
    freq: frequent
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-75-2015, nhs-shingles]
      locator: "75/QĐ-BYT mục 3a (bỏng rát, châm chích, đau trên một vùng da); NHS (da còn đau tới khi ban hết)"
      note: "Lượt A, lô 3. Tính trong số người đã đau ngực. Da vùng bị zona rất nhạy cảm, chạm hoặc ấn vào thấy đau đúng chỗ, nên nhiều người sẽ trả lời 'Có'. Ước khoảng một nửa; cần bác sĩ duyệt."
  - finding: chest_pain_radiates_back
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-75-2015, cdc-shingles-hcp]
      locator: "75/QĐ-BYT mục 3a (zona liên sườn và ngực bụng; theo đường đi của một dây thần kinh từ cột sống)"
      note: "Lượt A, lô 3. Tính trong số người đã đau ngực. Khoanh da ngực chạy vòng từ lưng ra trước ngực một bên, nên một phần người bệnh thấy đau cả ở lưng. Ước lượng. Đau ngực lan ra lưng vẫn bị quy tắc xếp mức 1."
  - finding: chest_pain_pressure
    freq: rare
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-75-2015, nhs-shingles]
      note: "Lượt A, lô 3. Đau zona ở một bên, theo dải, không vượt đường giữa; ít khi là đau, tức nặng ở giữa ngực. Mức rare thấp hơn tỷ lệ nền 5%. Ước lượng."
  - finding: chest_pain_exertional
    freq: rare
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-75-2015]
      note: "Lượt A, lô 3. Tính trong số người đã đau ngực. Đau ở da, thần kinh, không liên quan gắng sức. Mức rare thấp hơn tỷ lệ nền 5%."
  - finding: chest_pain_sudden_severe
    freq: rare
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-75-2015]
      note: "Lượt A, lô 3. Tính trong số người đã đau ngực. Đau khởi đầu bằng cảm giác bất thường trên da rồi tăng dần (75/QĐ-BYT). Mức rare thấp hơn tỷ lệ nền 5%."
  - finding: fever
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [byt-qd-75-2015, cdc-shingles-hcp, nhs-shingles]
      locator: "75/QĐ-BYT mục 3a (có thể nhức đầu, sợ ánh sáng, khó chịu); CDC (mệt); NHS (cảm thấy không khỏe)"
      note: "Lượt A, lô 3. Nguồn mô tả mệt, khó chịu trong tiền triệu; sốt nhẹ có ở một phần người bệnh. Ước khoảng 10–20%. Tỷ lệ nền 5%."
  - finding: lymph_node_swelling
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-75-2015]
      locator: "75/QĐ-BYT mục 3a (hạch bạch huyết vùng lân cận sưng to)"
      note: "Lượt A, lô 3. Câu hỏi hỏi hạch ở cổ, nách, bẹn; zona ngực có thể sưng hạch nách. Tần suất là ước lượng. Tỷ lệ nền 5%."
  - finding: immunocompromised
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-75-2015, cdc-shingles-hcp]
      locator: "75/QĐ-BYT mục 1, 2b; CDC Who is at risk"
      note: "Lượt A, lô 3. Suy giảm miễn dịch (HIV, ung thư, thuốc ức chế miễn dịch) làm tăng nguy cơ zona, nhưng phần lớn người bệnh chỉ là người cao tuổi. Ước 10–20%. Tỷ lệ nền 5%."
  - finding: breathing_difficulty
    freq: rare
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-75-2015]
      note: "Lượt A, lô 3. Có tác dụng khi triệu chứng chính là Đau ngực. Zona không gây khó thở (có thể thở nông vì đau). Mức rare thấp hơn tỷ lệ nền 5%. Ước lượng."
  - finding: similar_episodes_before
    freq: rare
    evidence:
      tier: A
      basis: numeric
      sources: [kawai-bmjopen-2014, cdc-shingles-hcp]
      locator: "Kawai 2014 tóm tắt; CDC (đa số chỉ bị một lần)"
      reported: "Tái phát 1–6%"
      note: "Lượt A, lô 3. Mức rare thấp hơn tỷ lệ nền 0,2: đã từng có những cơn đau giống hệt nghiêng về đau thành ngực, bệnh tim, trào ngược."
warning_signs: [es_crushing_chest_pain, pain_radiates_arm_jaw, cold_sweat, breathing_difficulty, fainting_or_near_fainting, confusion, vision_loss_or_double]
self_care_vi:
  - "Giữ vùng ban sạch, khô; mặc quần áo rộng, mềm; có thể chườm mát."
  - "Không chọc vỡ mụn nước, không đắp lá hay bôi thuốc không rõ nguồn gốc."
  - "Tránh tiếp xúc người có thai chưa từng bị thủy đậu, trẻ sơ sinh, người suy giảm miễn dịch khi mụn nước còn chảy dịch."
  - "Hỏi bác sĩ hoặc dược sĩ trước khi dùng thuốc giảm đau."
see_doctor_vi:
  - "Đi khám sớm, tốt nhất trong 3 ngày đầu sau khi nổi ban. Thuốc kháng vi rút dùng sớm có hiệu quả hơn."
  - "Khám trong ngày nếu ban ở mắt, mũi, trán, nếu đang có thai hoặc đang suy giảm miễn dịch."
  - "Đau ngực chưa có ban mà kèm tức nặng, khó thở, vã mồ hôi thì gọi 115, không chờ ban mọc."
review:
  status: draft
  authors: ["agent:pass-a"]
  updated: "2026-10-31"
  notes_vi: "Lượt A, lô 3 (phần c). Mức xử trí 4, không thuộc nhóm không được bỏ sót (giữ gợi ý): NHS khuyên gặp dược sĩ trong 3 ngày từ khi nổi ban (không khẩn), khám khẩn hoặc gọi 111 khi ban ở mắt, mũi, nhìn thay đổi, có thai, suy giảm miễn dịch nặng hoặc dưới 18 tuổi; 75/QĐ-BYT: thuốc kháng vi rút nên dùng sớm, tốt nhất trong 72 giờ đầu. Trường hợp cần khám khẩn (zona mắt, suy giảm miễn dịch) chưa có quy tắc riêng; đề xuất người bảo trì cân nhắc. Đau ngực thường có trước ban 1–5 ngày: giai đoạn này bệnh khó nhận ra (CDC), và dấu hiệu da rát, châm chích theo dải chưa có trong danh mục (đề xuất skin_burning_band). Điểm cần bác sĩ xem: (1) prior là ước lượng từ tỷ lệ mới mắc, chưa có số liệu zona trong người đau ngực; (2) tần suất có ban ở người chọn Đau ngực (frequent) và ấn vào đau (frequent) là ước lượng; (3) chưa tra được bảng ICD-10 của Bộ Y tế (tên theo 75/QĐ-BYT)."
proposed_findings:
  - id: skin_burning_band
    kind: symptom
    type: binary
    label_vi: "Da rát, châm chích theo dải một bên"
    question_vi: "Da ở vùng đau có rát bỏng, châm chích, chạm nhẹ cũng đau không?"
    requires:
      - { finding: chest_pain, is: present }
    leak: 0.03
    leak_note: "Ước lượng: đau ngực do nguyên nhân khác ít khi kèm đau rát ở da khi chạm nhẹ."
    notes_vi: "Tiền triệu của zona: bỏng rát, châm chích, tê, đau trên một vùng da, nhất là về đêm, 1–5 ngày trước khi nổi ban (75/QĐ-BYT; NHS; CDC). Giúp nhận ra zona khi chưa có ban, phân biệt với đau thành ngực (đau ở cơ, sụn khi ấn sâu) và bệnh tim. Lượt A, lô 3."
