id: pulmonary_tuberculosis
names:
  vi: "Lao phổi"
  vi_common: ["Bệnh lao phổi", "Bệnh lao"]
  en: "Pulmonary tuberculosis"
codes:
  icd10: "A15"
  icd10_verified: false
summary_vi:
  - "Bệnh do vi khuẩn lao ở phổi, lây qua đường hô hấp khi người bệnh ho, khạc, hắt hơi."
  - "Thường ho kéo dài từ 2 tuần, có thể kèm sốt nhẹ về chiều, ra mồ hôi đêm, sụt cân."
  - "Bệnh chữa khỏi được nếu dùng thuốc đều và đủ thời gian theo hướng dẫn."
urgency: 4
cant_miss: false
specialties: [respiratory, infectious_disease]
priors:
  - complaint: cough
    default: P4
    by_age:
      infant_0_2m: P6
      child_2m_5y: P5
      child_5_12: P5
      teen_13_17: P5
      elder_65_74: P3
      elder_75p: P3
    evidence:
      tier: C
      basis: judgment
      sources: [nguyen-plosone-2020, byt-qd-162-2024]
      reported: "322 ca lao phổi có bằng chứng vi khuẩn trên 100.000 người lớn (điều tra quốc gia 2017–2018)"
      note: "Thang tuyệt đối. Khoảng 0,3–0,5% người lớn đang mắc lao phổi; phần lớn người ho do nhiễm vi rút ngắn ngày, nên lao chiếm ước 0,2–1% người lớn ho (P4) và tăng theo tuổi: từ 65 tuổi ước 1–5% (P3). Trẻ em ít có lao phổi có vi khuẩn: P5, dưới 2 tháng P6. Ho từ 2 tuần (cough_duration) làm tăng khả năng rõ. Ước lượng, cần so với dữ liệu tầm soát tại Việt Nam."
  - complaint: fever
    default: P4
    by_age:
      infant_0_2m: P6
      child_2m_5y: P5
      child_5_12: P5
      teen_13_17: P5
    evidence:
      tier: C
      basis: judgment
      sources: [nguyen-plosone-2020, vanthoog-cochrane-2022, byt-qd-162-2024]
      reported: "sốt ở khoảng 35% người lao phát hiện qua sàng lọc (một bảng trong tài liệu sàng lọc)"
      note: "Sốt chủ yếu là sốt cấp do vi rút, sốt xuất huyết, nhiễm trùng; lao chỉ chiếm phần nhỏ, chủ yếu ở người sốt kéo dài. Ước 0,2–1% người lớn sốt (P4), ngang sốt mò, Leptospira; trẻ em P5. Với prior này, sốt 1–2 ngày gần như loại lao, còn sốt hơn 7 ngày kèm ho, sụt cân, ra mồ hôi đêm làm khả năng tăng rõ. Cần chạy lại bộ ca Sốt để xem ảnh hưởng."
  - complaint: shortness_of_breath
    default: P5
    by_age:
      infant_0_2m: P6
      child_2m_5y: P6
      child_5_12: P6
    evidence:
      tier: C
      basis: judgment
      sources: [nguyen-plosone-2020, byt-qd-162-2024]
      note: "Khó thở ít khi là triệu chứng chính của lao phổi (thường ở bệnh lan rộng hoặc tràn dịch màng phổi). Ước 0,02–0,2% (P5), trẻ em P6."
prior_modifiers:
  - when: { sex: [male] }
    factor: 1.5
    evidence:
      tier: C
      basis: numeric
      sources: [nguyen-plosone-2020]
      reported: "tỷ số nam/nữ 4,0 (2,8–5,8)"
      note: "Chọn 1,5 và 0,5 (tỷ số 3) thay vì 4 vì câu hút thuốc đã mang một phần khác biệt giữa nam và nữ."
  - when: { sex: [female] }
    factor: 0.5
    evidence:
      tier: C
      basis: numeric
      sources: [nguyen-plosone-2020]
      reported: "tỷ số nam/nữ 4,0"
      note: "Xem hệ số cho nam."
findings:
  - finding: cough
    freq: very_frequent
    evidence:
      tier: C
      basis: numeric
      sources: [vanthoog-cochrane-2022, nguyen-plosone-2020, byt-qd-162-2024]
      reported: "ho bất kỳ: độ nhạy 51% khi sàng lọc chủ động (gồm cả ca chưa có triệu chứng)"
      note: "Dùng khi triệu chứng chính là sốt hoặc khó thở. Số sàng lọc thấp vì gồm nhiều ca chưa có triệu chứng (32% không có triệu chứng ở điều tra Việt Nam); người đã có sốt hoặc khó thở mà tự đi khám thì phần lớn có ho. Ước very_frequent; cần bác sĩ duyệt."
  - finding: cough_duration
    dist: { lt_1w: 0.05, w1_2: 0.12, w2_8: 0.55, gt_8w: 0.28 }
    evidence:
      tier: C
      basis: numeric
      sources: [nguyen-plosone-2020, vanthoog-cochrane-2022, byt-qd-162-2024]
      reported: "57,9% người lao (điều tra Việt Nam) có ho từ 2 tuần; ho từ 2 tuần độ nhạy 42% so với ho bất kỳ 51% (Cochrane)"
      note: "Trong số người có ho: 42/51, tức khoảng 80% ho từ 2 tuần (Cochrane); nên khoảng 83% ở mốc từ 2 tuần, phần lớn dưới 2 tháng. Ước lượng."
  - finding: productive_cough
    freq: frequent
    evidence:
      tier: C
      basis: verbal
      sources: [byt-qd-162-2024]
      note: "Ho khạc đờm kéo dài là triệu chứng nghi lao hay được nhắc; một phần người bệnh ho khan. Tần suất trong số người có ho; ước frequent. Chưa đối chiếu văn bản."
  - finding: fever
    freq: frequent
    evidence:
      tier: C
      basis: numeric
      sources: [vanthoog-cochrane-2022, byt-qd-162-2024]
      reported: "sốt: độ nhạy 35% khi sàng lọc chủ động"
      note: "Dùng khi triệu chứng chính là ho hoặc khó thở. Người tự đi khám có triệu chứng nhiều hơn người được sàng lọc (một nghiên cứu ở Bệnh viện Phạm Ngọc Thạch ghi sốt 65,8%, chỉ thấy qua kết quả tìm kiếm). Ước frequent."
  - finding: fever_duration
    dist: { d1_2: 0.04, d3_5: 0.08, d6_7: 0.08, gt_7d: 0.8 }
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-162-2024]
      note: "Sốt do lao thường kéo dài nhiều tuần, sốt nhẹ về chiều. Phân bố trong số người có sốt; ước lượng. Sốt hơn 7 ngày đã có quy tắc mức 3."
  - finding: fever_max_temp
    dist: { lt_38: 0.45, t38_39: 0.4, ge_39: 0.15 }
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-162-2024]
      note: "Sốt thường nhẹ, về chiều; sốt cao ít hơn. Phân bố trong số người có sốt; ước lượng."
  - finding: night_sweats
    freq: frequent
    evidence:
      tier: C
      basis: numeric
      sources: [vanthoog-cochrane-2022, byt-qd-162-2024]
      reported: "ra mồ hôi đêm: độ nhạy 39% khi sàng lọc chủ động"
      note: "Người có triệu chứng tự đi khám có lẽ cao hơn số sàng lọc. Chọn frequent (từ 33%)."
  - finding: weight_loss_unintended
    freq: frequent
    evidence:
      tier: C
      basis: numeric
      sources: [vanthoog-cochrane-2022, byt-qd-162-2024]
      reported: "sụt cân: độ nhạy 55% khi sàng lọc chủ động"
  - finding: hemoptysis
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-162-2024, nhs-coughing-up-blood]
      reported: "ho ra máu 15–34% (một đoàn hệ ở Mỹ, chỉ thấy qua kết quả tìm kiếm)"
      note: "Phần lớn là máu lẫn đờm. Ước occasional."
  - finding: breathing_difficulty
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-162-2024]
      note: "Khó thở gặp khi tổn thương lan rộng hoặc tràn dịch màng phổi. Dùng khi triệu chứng chính là ho hoặc sốt. Ước occasional."
  - finding: dyspnea_onset
    dist: { sudden: 0.03, hours_days: 0.17, weeks: 0.8 }
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-162-2024]
      note: "Bệnh diễn tiến từ từ nhiều tuần. Trong số người có khó thở; ước lượng."
  - finding: dyspnea_severity
    dist: { exertion: 0.75, rest: 0.22, cannot_speak: 0.03 }
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-162-2024]
      note: "Khó thở thường khi gắng sức. Trong số người có khó thở; ước lượng."
  - finding: pleuritic_chest_pain
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-162-2024]
      note: "Đau ngực có thể gặp, nhất là khi có tổn thương màng phổi. Ước occasional."
  - finding: chest_pain
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-162-2024]
      note: "Như pleuritic_chest_pain; hai câu hỏi trùng một phần."
  - finding: fatigue
    freq: frequent
    evidence:
      tier: C
      basis: verbal
      sources: [byt-qd-162-2024]
      note: "Mệt mỏi, chán ăn hay gặp trong lao. Tỷ lệ nền của mệt khi sốt là 50% nên ở triệu chứng chính Sốt liên kết này gần như trung tính."
  - finding: tb_contact
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-162-2024, nguyen-plosone-2020]
      note: "Người tiếp xúc gần với người bệnh lao, nhất là sống cùng nhà, có nguy cơ mắc cao; nhưng phần lớn người bệnh không biết mình đã tiếp xúc với ai. Ước khoảng 10–20% người bệnh biết có người tiếp xúc đang bị lao (tỷ lệ nền 2%). Cần số liệu Việt Nam."
  - finding: smoker
    freq: frequent
    evidence:
      tier: C
      basis: judgment
      sources: [nguyen-plosone-2020, who-steps-vn-2021]
      reported: "tỷ số nam/nữ 4,0; hút thuốc 41,1% nam, 0,6% nữ"
      note: "Khoảng 80% người bệnh là nam, gần một nửa nam giới hút thuốc, và hút thuốc làm tăng nguy cơ lao, nên ước khoảng 40–50% người bệnh đang hút (frequent; tỷ lệ nền 20%)."
  - finding: diabetes
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-162-2024, who-steps-vn-2021]
      note: "Đái tháo đường làm tăng nguy cơ lao khoảng 2–3 lần (hiểu biết chung, chưa có nguồn mở được); đái tháo đường ở 7,1% người 18–69 tuổi (STEPS 2021). Ước 10–20% người bệnh lao (occasional), tỷ lệ nền 7%."
  - finding: immunocompromised
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-162-2024]
      note: "Nhiễm HIV, dùng corticoid kéo dài, thuốc ức chế miễn dịch làm tăng nguy cơ lao rõ. Ước occasional (tỷ lệ nền 5%)."
warning_signs:
  - hemoptysis_large
  - es_severe_breathing
  - drowsy_hard_to_wake
self_care_vi:
  - "Đeo khẩu trang, che miệng khi ho, hắt hơi; không khạc nhổ bừa bãi."
  - "Ở phòng thoáng khí; hạn chế tiếp xúc gần với trẻ nhỏ cho đến khi bác sĩ cho biết hết lây."
  - "Khi đã điều trị, uống thuốc đều mỗi ngày, đủ thời gian; không tự ý ngừng thuốc dù đã thấy đỡ."
  - "Không hút thuốc, không uống rượu bia; ăn uống đủ chất."
see_doctor_vi:
  - "Đi khám trong vài ngày nếu ho từ 2 tuần, nhất là khi kèm sốt, ra mồ hôi đêm hoặc sụt cân."
  - "Có thể đến trạm y tế hoặc phòng khám lao của quận, huyện để được xét nghiệm đờm, chụp phổi."
  - "Người sống cùng nhà với người bệnh lao nên đi khám, kể cả khi chưa có triệu chứng."
  - "Đi cấp cứu ngay nếu ho ra nhiều máu hoặc khó thở nhiều."
sources: [byt-qd-162-2024, nguyen-plosone-2020, vanthoog-cochrane-2022]
review:
  status: draft
  authors: ["agent:pass-a"]
  updated: "2026-10-31"
  notes_vi: "Giai đoạn 3, lô 3, lượt A (31/10/2026). Phiên làm việc chặn WebFetch và curl, nên lượt A không mở được 162/QĐ-BYT, điều tra quốc gia hay tổng quan Cochrane: các con số lấy từ tóm tắt của công cụ tìm kiếm; mọi nguồn mới để verified: false, bậc C. Cần bác sĩ xem: (1) urgency 4 như gợi ý: lao chưa biến chứng cần xét nghiệm trong vài ngày; ho ra nhiều máu, khó thở do quy tắc xử lý; quy tắc rf_cough_2_weeks (mức 4) khớp; (2) prior cho Sốt (đã phát hành): P4 ở người lớn, P5 ở trẻ em; cần chạy lại bộ ca dev của Sốt; (3) tần suất triệu chứng lấy từ sàng lọc chủ động (thấp hơn người tự đi khám) rồi nâng lên theo ước lượng; (4) hệ số giới 1,5 và 0,5 (thấp hơn tỷ số 4) để bớt đếm trùng với câu hút thuốc; (5) không liên kết ho ra nhiều máu (tỷ lệ trong số người ho ra máu khoảng bằng tỷ lệ nền 15%); (6) mã ICD-10 A15 chưa đối chiếu."
