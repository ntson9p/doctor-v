id: pulmonary_tuberculosis
names:
  vi: "Lao phổi"
  vi_common: ["Bệnh lao phổi", "Bệnh lao"]
  en: "Pulmonary tuberculosis"
codes:
  icd10: "A15"
  icd10_verified: false
summary_vi:
  - "Bệnh do vi khuẩn lao ở phổi, lây qua đường hô hấp khi người bệnh ho, khạc, hắt hơi."
  - "Thường ho kéo dài từ 2 tuần, có thể kèm sốt nhẹ về chiều, ra mồ hôi đêm, sụt cân."
  - "Bệnh chữa khỏi được nếu dùng thuốc đều và đủ thời gian theo hướng dẫn."
urgency: 4
cant_miss: false
specialties: [respiratory, infectious_disease]
priors:
  - complaint: cough
    default: P4
    by_age:
      infant_0_2m: P6
      child_2m_5y: P5
      child_5_12: P5
      teen_13_17: P5
      elder_65_74: P3
      elder_75p: P3
    evidence:
      tier: B
      basis: judgment
      sources: [nguyen-plosone-2020, byt-qd-162-2024]
      reported: "322 ca lao phổi có bằng chứng vi khuẩn trên 100.000 người từ 15 tuổi (điều tra quốc gia 2017–2018), tăng theo tuổi"
      note: "Thang tuyệt đối. Khoảng 0,3–0,5% người lớn đang mắc lao phổi; phần lớn người ho do nhiễm vi rút ngắn ngày, nên lao chiếm ước 0,2–1% người lớn ho (P4) và tăng theo tuổi: từ 65 tuổi ước 1–5% (P3). Trẻ em ít có lao phổi có vi khuẩn: P5, dưới 2 tháng P6. Ho từ 2 tuần (cough_duration) làm tăng khả năng rõ. Ước lượng, cần so với dữ liệu tầm soát tại Việt Nam."
  - complaint: fever
    default: P4
    by_age:
      infant_0_2m: P6
      child_2m_5y: P5
      child_5_12: P5
      teen_13_17: P5
    evidence:
      tier: B
      basis: judgment
      sources: [nguyen-plosone-2020, wang-kjms-2008, byt-qd-162-2024]
      reported: "sốt 12,7% ở người lao phát hiện qua điều tra cộng đồng (Việt Nam); 27,9% ở người lao đến khám tại bệnh viện (Đài Loan)"
      note: "Sốt chủ yếu là sốt cấp do vi rút, sốt xuất huyết, nhiễm trùng; lao chỉ chiếm phần nhỏ, chủ yếu ở người sốt kéo dài (162/QĐ-BYT: sốt kéo dài trên 2 tuần không rõ nguyên nhân là dấu hiệu nghi lao), và chỉ khoảng 13–28% người bệnh lao có sốt. Ước 0,2–1% người lớn sốt (P4), ngang sốt mò, Leptospira; trẻ em P5. Với prior này, sốt 1–2 ngày gần như loại lao, còn sốt hơn 7 ngày kèm ho, sụt cân, ra mồ hôi đêm làm khả năng tăng rõ. Cần chạy lại bộ ca Sốt để xem ảnh hưởng."
  - complaint: shortness_of_breath
    default: P5
    by_age:
      infant_0_2m: P6
      child_2m_5y: P6
      child_5_12: P6
    evidence:
      tier: B
      basis: judgment
      sources: [nguyen-plosone-2020, byt-qd-162-2024]
      note: "162/QĐ-BYT: lao phổi đôi khi có khó thở. Khó thở ít khi là triệu chứng chính của lao phổi (thường ở bệnh lan rộng hoặc tràn dịch màng phổi). Ước 0,02–0,2% (P5), trẻ em P6."
prior_modifiers:
  - when: { sex: [male] }
    factor: 1.5
    evidence:
      tier: B
      basis: numeric
      sources: [nguyen-plosone-2020]
      locator: "Bảng 6"
      reported: "tỷ số chênh nam/nữ 4,0 (2,8–5,8)"
      note: "Chọn 1,5 và 0,5 (tỷ số 3) thay vì 4 vì câu hút thuốc đã mang một phần khác biệt giữa nam và nữ."
  - when: { sex: [female] }
    factor: 0.5
    evidence:
      tier: B
      basis: numeric
      sources: [nguyen-plosone-2020]
      locator: "Bảng 6"
      reported: "tỷ số chênh nam/nữ 4,0"
      note: "Xem hệ số cho nam."
findings:
  - finding: cough
    freq: very_frequent
    evidence:
      tier: B
      basis: numeric
      sources: [wang-kjms-2008, nguyen-plosone-2020, vanthoog-cochrane-2022, byt-qd-162-2024]
      reported: "ho 90,3% ở người lao đến khám bệnh viện (Đài Loan); ho bất kỳ 67,0% ở ca phát hiện qua điều tra cộng đồng Việt Nam; độ nhạy gộp 51,3% khi sàng lọc chủ động (Cochrane)"
      note: "Dùng khi triệu chứng chính là sốt hoặc khó thở. Số sàng lọc thấp vì gồm nhiều ca chưa có triệu chứng (32,1% không có triệu chứng nghi lao ở điều tra Việt Nam); người tự đi khám thì phần lớn có ho (90% ở bệnh viện). Chọn very_frequent, giữa hai bối cảnh."
  - finding: cough_duration
    dist: { lt_1w: 0.05, w1_2: 0.12, w2_8: 0.55, gt_8w: 0.28 }
    evidence:
      tier: B
      basis: numeric
      sources: [nguyen-plosone-2020, vanthoog-cochrane-2022, byt-qd-162-2024]
      locator: "Nguyen 2020, Bảng 3; Cochrane, tóm tắt"
      reported: "điều tra Việt Nam: ho bất kỳ 67,0%, ho từ 2 tuần 57,9%, tức khoảng 86% người có ho đã ho từ 2 tuần; Cochrane: độ nhạy ho từ 2 tuần 42,1% so với ho bất kỳ 51,3%, tức khoảng 82%"
      note: "Phân bố trong số người có ho: khoảng 83% ở mốc từ 2 tuần, khớp với hai nguồn; phần chia giữa 2 tuần–2 tháng và trên 2 tháng là ước lượng."
  - finding: productive_cough
    freq: very_frequent
    evidence:
      tier: B
      basis: numeric
      sources: [nguyen-plosone-2020, byt-qd-162-2024]
      locator: "Nguyen 2020, Bảng 3; 162/QĐ-BYT, Phần II mục 1.1"
      reported: "ho có đờm 61,1% so với ho bất kỳ 67,0% ở ca phát hiện qua điều tra Việt Nam, tức khoảng 90% người có ho"
      note: "Tần suất trong số người có ho. 162/QĐ-BYT nêu ho khan hoặc ho có đờm. Đổi frequent thành very_frequent theo số của điều tra Việt Nam; không chọn almost_always vì số ở biên 90% và người bệnh có thể ho khan."
  - finding: fever
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [wang-kjms-2008, nguyen-plosone-2020, byt-qd-162-2024]
      reported: "sốt 27,9% ở người lao đến khám bệnh viện (Đài Loan); 12,7% ở ca phát hiện qua điều tra cộng đồng Việt Nam"
      note: "Dùng khi triệu chứng chính là ho hoặc khó thở. 162/QĐ-BYT: có thể kèm sốt nhẹ về chiều. Đổi frequent thành occasional: số 35% của vòng 1 không có trong tổng quan Cochrane, còn hai nguồn đã mở đều dưới 33%."
  - finding: fever_duration
    dist: { d1_2: 0.04, d3_5: 0.08, d6_7: 0.08, gt_7d: 0.8 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-162-2024]
      locator: "Phần II, mục 1.1"
      note: "162/QĐ-BYT: sốt nhẹ về chiều, sốt kéo dài trên 2 tuần không rõ nguyên nhân. Phân bố trong số người có sốt; ước lượng. Sốt hơn 7 ngày đã có quy tắc mức 3."
  - finding: fever_max_temp
    dist: { lt_38: 0.45, t38_39: 0.4, ge_39: 0.15 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-162-2024]
      note: "162/QĐ-BYT: sốt nhẹ về chiều; sốt cao ít hơn (ước lượng). Phân bố trong số người có sốt; ước lượng."
  - finding: night_sweats
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [nguyen-plosone-2020, byt-qd-162-2024]
      locator: "Nguyen 2020, Bảng 3; 162/QĐ-BYT, Phần II mục 1.1"
      reported: "ra mồ hôi đêm 7,7% ở ca phát hiện qua điều tra cộng đồng Việt Nam"
      note: "162/QĐ-BYT: có thể kèm ra mồ hôi đêm ('có thể có' ứng với occasional). Người tự đi khám có lẽ cao hơn số điều tra. Đổi frequent thành occasional: số 39% của vòng 1 không có trong tổng quan Cochrane; chưa mở được nguồn có tỷ lệ ở người tự đi khám."
  - finding: weight_loss_unintended
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [nguyen-plosone-2020, byt-qd-162-2024]
      locator: "Nguyen 2020, Bảng 3; 162/QĐ-BYT, Phần II mục 1.1"
      reported: "sụt cân 7,7% ở ca phát hiện qua điều tra cộng đồng Việt Nam"
      note: "162/QĐ-BYT: có thể kèm gầy sút, kém ăn. Người tự đi khám có lẽ cao hơn số điều tra. Đổi frequent thành occasional: số 55% của vòng 1 không có trong tổng quan Cochrane; chưa mở được nguồn có tỷ lệ ở người tự đi khám."
  - finding: hemoptysis
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [wang-kjms-2008, nguyen-plosone-2020, byt-qd-162-2024, nhs-coughing-up-blood]
      reported: "ho ra máu 14,9% ở người lao đến khám bệnh viện (Đài Loan); 3,2% ở ca phát hiện qua điều tra cộng đồng Việt Nam"
      note: "Phần lớn là máu lẫn đờm. Người tự kiểm tra có triệu chứng nằm giữa hai bối cảnh; chọn occasional. Bỏ số 15–34% của vòng 1 (chưa xác định được nguồn)."
  - finding: breathing_difficulty
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-162-2024]
      locator: "Phần II, mục 1.1 và 3.2.1"
      note: "162/QĐ-BYT: đôi khi khó thở. Khó thở gặp khi tổn thương lan rộng hoặc tràn dịch màng phổi. Dùng khi triệu chứng chính là ho hoặc sốt. 'Đôi khi' ứng với occasional."
  - finding: dyspnea_onset
    dist: { sudden: 0.03, hours_days: 0.17, weeks: 0.8 }
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-162-2024]
      note: "Bệnh diễn tiến từ từ nhiều tuần. Trong số người có khó thở; ước lượng."
  - finding: dyspnea_severity
    dist: { exertion: 0.75, rest: 0.22, cannot_speak: 0.03 }
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-162-2024]
      note: "Khó thở thường khi gắng sức. Trong số người có khó thở; ước lượng."
  - finding: pleuritic_chest_pain
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-162-2024]
      locator: "Phần II, mục 1.1 và 3.2.1"
      note: "162/QĐ-BYT: có thể đau ngực, nhất là khi có tổn thương màng phổi. 'Có thể có' ứng với occasional. Liên kết với dấu hiệu chung chest_pain đã bỏ (quyết định của người bảo trì)."
  - finding: fatigue
    freq: frequent
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-162-2024]
      note: "162/QĐ-BYT liệt kê mệt mỏi, kém ăn trong các triệu chứng có thể kèm theo, không cho tỷ lệ; giữ frequent theo ước lượng. Tỷ lệ nền của mệt khi sốt là 50% nên ở triệu chứng chính Sốt liên kết này gần như trung tính."
  - finding: tb_contact
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-162-2024, nguyen-plosone-2020]
      note: "162/QĐ-BYT (Phần II mục 1.3): tiếp xúc trực tiếp với nguồn lây là yếu tố nguy cơ. Người tiếp xúc gần với người bệnh lao, nhất là sống cùng nhà, có nguy cơ mắc cao; nhưng phần lớn người bệnh không biết mình đã tiếp xúc với ai. Ước khoảng 10–20% người bệnh biết có người tiếp xúc đang bị lao (tỷ lệ nền 2%). Cần số liệu Việt Nam."
  - finding: smoker
    freq: frequent
    evidence:
      tier: C
      basis: judgment
      sources: [nguyen-plosone-2020, who-steps-vn-2021]
      reported: "tỷ số chênh nam/nữ 4,0; đang hút thuốc 41,1% nam, 0,6% nữ từ 15 tuổi (STEPS 2021)"
      note: "Khoảng 80% người bệnh là nam, gần một nửa nam giới hút thuốc, và hút thuốc có thể làm tăng nguy cơ lao (điều tra Việt Nam bàn tới cơ chế này), nên ước khoảng 40–50% người bệnh đang hút (frequent; tỷ lệ nền 20%)."
  - finding: diabetes
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [wang-kjms-2008, byt-qd-162-2024, who-steps-vn-2021]
      reported: "đái tháo đường 31,2% ở người lao đến khám bệnh viện (Đài Loan); đường huyết cao hoặc đang điều trị 7,1% người 18–69 tuổi ở Việt Nam (STEPS 2021)"
      note: "162/QĐ-BYT (Phần II mục 1.3) xếp đái tháo đường vào yếu tố nguy cơ. Số bệnh viện Đài Loan (người bệnh lớn tuổi, nơi đái tháo đường phổ biến hơn) vẫn dưới 33%; ở Việt Nam có lẽ thấp hơn. Giữ occasional, tỷ lệ nền 7%."
  - finding: immunocompromised
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-162-2024]
      note: "162/QĐ-BYT (Phần II mục 1.3): suy giảm miễn dịch, kể cả HIV, là yếu tố nguy cơ. Nhiễm HIV, dùng corticoid kéo dài, thuốc ức chế miễn dịch làm tăng nguy cơ lao rõ. Ước occasional (tỷ lệ nền 5%)."
warning_signs:
  - hemoptysis_large
  - es_severe_breathing
  - drowsy_hard_to_wake
self_care_vi:
  - "Đeo khẩu trang, che miệng khi ho, hắt hơi; không khạc nhổ bừa bãi."
  - "Ở phòng thoáng khí; hạn chế tiếp xúc gần với trẻ nhỏ cho đến khi bác sĩ cho biết hết lây."
  - "Khi đã điều trị, uống thuốc đều mỗi ngày, đủ thời gian; không tự ý ngừng thuốc dù đã thấy đỡ."
  - "Không hút thuốc, không uống rượu bia; ăn uống đủ chất."
see_doctor_vi:
  - "Đi khám trong vài ngày nếu ho từ 2 tuần, nhất là khi kèm sốt, ra mồ hôi đêm hoặc sụt cân."
  - "Có thể đến trạm y tế hoặc phòng khám lao của quận, huyện để được xét nghiệm đờm, chụp phổi."
  - "Người sống cùng nhà với người bệnh lao nên đi khám, kể cả khi chưa có triệu chứng."
  - "Đi cấp cứu ngay nếu ho ra nhiều máu hoặc khó thở nhiều."
sources: [byt-qd-162-2024, nguyen-plosone-2020, vanthoog-cochrane-2022, wang-kjms-2008]
review:
  status: draft
  authors: ["agent:pass-a"]
  updated: "2026-10-31"
  notes_vi: "Lượt A vòng 2 (31/10/2026): đã đọc toàn văn điều tra lao quốc gia (Nguyen 2020) và tổng quan Cochrane 2022 qua Europe PMC, đặt verified: true; bỏ bản nháp nguồn byt-qd-162-2024, dùng bản trong sổ nguồn (lượt R đã xác minh); thêm wang-kjms-2008 (tóm tắt, người lao đến khám bệnh viện ở Đài Loan). Cochrane chỉ gộp độ nhạy của ho từ 2 tuần (42,1%), ho bất kỳ (51,3%) và có bất kỳ triệu chứng nào (70,6%), không có số riêng cho sốt, ra mồ hôi đêm, sụt cân: các số 35%, 39%, 55% của vòng 1 đã bỏ. Đã sửa: sốt, ra mồ hôi đêm, sụt cân frequent thành occasional; ho có đờm frequent thành very_frequent; bỏ liên kết chest_pain; nâng bậc C lên B cho prior, hệ số giới và các liên kết có số liệu hoặc có trong 162/QĐ-BYT. Ghi chú vòng 1: phiên làm việc chặn WebFetch và curl. Cần bác sĩ xem: (1) urgency 4 như gợi ý: lao chưa biến chứng cần xét nghiệm trong vài ngày; ho ra nhiều máu, khó thở do quy tắc xử lý; quy tắc rf_cough_2_weeks (mức 4) khớp; (2) prior cho Sốt (đã phát hành): P4 ở người lớn, P5 ở trẻ em; cần chạy lại bộ ca dev của Sốt; (3) tần suất triệu chứng toàn thân (sốt, ra mồ hôi đêm, sụt cân) chỉ có số ở ca phát hiện qua điều tra (thấp hơn người tự đi khám) và một loạt ca bệnh viện; có thể đang thấp; (4) hệ số giới 1,5 và 0,5 (thấp hơn tỷ số 4) để bớt đếm trùng với câu hút thuốc; (5) không liên kết ho ra nhiều máu (tỷ lệ trong số người ho ra máu khoảng bằng tỷ lệ nền 15%); (6) mã ICD-10 A15 chưa đối chiếu."
