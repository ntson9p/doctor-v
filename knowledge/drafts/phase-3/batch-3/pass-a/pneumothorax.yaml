  notes_vi: "Lượt A, lô 3 (phần c). Mức xử trí 2, không được bỏ sót (giữ gợi ý): 4235/QĐ-BYT xếp tràn khí màng phổi áp lực vào nhóm đau ngực đe dọa tính mạng, chẩn đoán cần phim phổi, điều trị bằng hút khí hoặc dẫn lưu tùy lượng khí; MSD: tràn khí áp lực gây ngừng tim trong vài phút. Ca điển hình (đau ngực đột ngột một bên, khó thở) cần chụp phim ngay nên là mức 2; ca nặng do màn sàng lọc và các quy tắc xử lý. Trang NHS về tràn khí đã bị gỡ (lượt R) nên không dùng. Lượt A mở toàn văn 4235/QĐ-BYT (bản PDF vnras.com, phông TCVN3 chuyển sang Unicode): bài Đau ngực tr. 24–28, bài Khó thở tr. 16–17, bài Tràn khí màng phổi tr. 139–143; chưa kiểm tra văn bản mới thay thế bài này. Điểm cần bác sĩ xem: (1) prior là ước lượng, các nghiên cứu đau ngực ở tuyến ban đầu không tách riêng tràn khí; (2) tần suất triệu chứng lấy từ bệnh viện (Singapore 1985, thiếu niên Israel) và mô tả bằng lời; (3) hút thuốc frequent chưa có số liệu; (4) danh mục chưa có câu hỏi về dáng người cao gầy hay tiền sử tràn khí (dùng câu 'đã từng có cơn giống hệt' thì tỷ lệ nền 0,2 làm mất giá trị), nên không liên kết; (5) không liên kết ho (4235/QĐ-BYT có ho khan) vì không có tần suất và tỷ lệ nền của ho là 0,2."
