notes_vi: "Lượt A đọc toàn văn PDF do vnras.com đăng lại (https://vnras.com/wp-content/uploads/2026/01/vmj-pdf-8967.pdf). Hồi cứu 119 người bệnh phản vệ theo Thông tư 51 (2018–2022), tuổi trung bình 34,5, nữ 63%. Nguyên nhân: thuốc 53,8% (kháng viêm không steroid 26,6%, kháng sinh 23,5%), thức ăn 38,7% (hải sản 40% số ca do thức ăn), côn trùng 2,5%. Triệu chứng: da, niêm mạc 92,4% (mày đay, ban đỏ, phù mạch, ngứa); hô hấp 67,2% (nghẹt mũi, chảy mũi, ho, khó thở); tim mạch 39,5% (hồi hộp, đau ngực); tiêu hóa 29,4%; thần kinh 26,1%; tụt huyết áp khi chẩn đoán 23,5%. Thời gian từ tiếp xúc đến triệu chứng trung bình 56,5 phút (1 phút đến 5 giờ); dưới 5 phút 10,9%, 5–30 phút 46,2%, trên 60 phút 19,3%. Độ II 69,7%. Triệu chứng đầu tiên ở da 87,4%. Bối cảnh bệnh viện tư tuyến cuối."
