notes_vi: "Lượt A đọc toàn văn PMC8114995 qua API Europe PMC. 1.947 người từ 18 tuổi có triệu chứng tiêu hóa trên được nội soi ngoại trú (TP. Hồ Chí Minh), tuổi trung bình 42,5: 511 (26,2%) trào ngược dạ dày – thực quản (47,4% không có tổn thương niêm mạc). Ợ nóng và/hoặc ợ trớ ở 74,2% người trào ngược. Than phiền chính của người trào ngược: đau vùng thượng vị 36,8%, ợ trớ 27,0%, ợ nóng 9,2%. Bảng 1 (có/không trào ngược): nam 57,1%/41,6%; đang hoặc từng hút thuốc 31,9%/19,3%; uống rượu bia từ 1 lần/tuần 37,4%/26,0%; nhiễm H. pylori 29,0%/34,5%."
