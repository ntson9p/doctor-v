notes_vi: "Lượt A vòng 2 tải báo cáo quốc gia (PDF 118 trang, mục Reports, Country Report trên trang tài liệu của catalog 948) ngày 31/10/2026. Điều tra STEPS lần 3, thu thập 01–03/2021, chọn mẫu cụm nhiều tầng, 4.738 người. Tóm tắt kết quả và Bảng 5: đang hút thuốc 20,8% người từ 15 tuổi, gồm 41,1% nam và 0,6% nữ; nam 45–64 tuổi 55,0%, nam từ 65 tuổi 30,4%; 37,3% hút thuốc thụ động tại nhà trong 30 ngày. Đường huyết lúc đói từ 7,0 mmol/L hoặc đang dùng thuốc hạ đường huyết: 7,1% (18–69 tuổi)."
