notes_vi: "Lượt A vòng 2 đọc toàn văn (PMC6988682) qua API Europe PMC ngày 31/10/2026. 27.795 người ung thư phổi (tuổi trung bình 72) trong dữ liệu CPRD có liên kết ghi nhận ung thư, Anh, 2000–2017. Bảng 2 (triệu chứng có mã trong hồ sơ bác sĩ gia đình trong năm trước chẩn đoán): có ít nhất một triệu chứng 63,5%; ho 33,5%; khó thở 27,1%; đau ngực 13,8%; ho ra máu 7,8%; mệt 6,5%; sụt cân 5,7%; chán ăn 1,8%. Ho là triệu chứng đầu tiên hay gặp nhất (24,4%). Số đếm theo mã chẩn đoán nên thấp hơn thực tế (triệu chứng ghi bằng chữ tự do không được đếm)."
