notes_vi: "Lượt A vòng 2 đọc toàn văn (PMC5634369) qua API Europe PMC ngày 31/10/2026. Bài khảo sát kiến thức của bác sĩ tuyến ban đầu ở TP.HCM và Tiền Giang, không đo tỷ lệ hen. Phần mở đầu dẫn lại các nghiên cứu khác: hen ở 3,9–5,6% người 21–70 tuổi tại Việt Nam; ở TP.HCM, từng bị hen 10,9% ở trẻ 6–7 tuổi và khò khè 29,5% ở trẻ 13–14 tuổi; hen 6% ở Tiền Giang; kiểm soát hen ở Việt Nam kém (một nghiên cứu trước: không quá 1% người bệnh đạt mức kiểm soát). Các số trên là số dẫn lại (nguồn thứ cấp)."
