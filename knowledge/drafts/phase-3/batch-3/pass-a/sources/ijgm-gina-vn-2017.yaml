notes_vi: "Lượt A chỉ đọc tóm tắt do công cụ tìm kiếm trả về (WebFetch bị chặn); chưa xác định tên tác giả. Bài nêu tỷ lệ hen ở người 21–70 tuổi tại Việt Nam ước khoảng 3,9–5,6%. Các kết quả tìm kiếm khác về trẻ em: từng bị hen 10,9% ở trẻ 6–7 tuổi và khò khè 29,5% ở trẻ 13–14 tuổi (TP.HCM), 6% ở Tiền Giang; 5,1% ở trẻ 6 tuổi (đoàn hệ Nha Trang); 14,9% ở trẻ 5–11 tuổi (Hà Nội, 1999). Lượt C cần mở toàn văn để đối chiếu."
