notes_vi: "Lượt A đọc toàn văn qua Europe PMC. 277 người từ 60 tuổi nhập viện vì suy tim cấp ở 3 bệnh viện (TP Hồ Chí Minh, Vĩnh Long; 2023–2024; đã loại hội chứng vành cấp), tuổi trung vị 76, nam 46,2%. Lý do nhập viện: khó thở 75,5%, đau ngực 36,1%, phù chân 40,4%. Suy tim mạn mất bù 85,2%, mới mắc 14,8%. Tăng huyết áp 73,3%, đái tháo đường 37,2%, bệnh mạch vành mạn 76,2%, rung nhĩ 34,7%."
