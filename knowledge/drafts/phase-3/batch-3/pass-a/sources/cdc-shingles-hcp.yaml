notes_vi: "Lượt A tải hai trang cho nhân viên y tế ngày 31/10/2026 (Clinical overview 27/6/2024; Clinical features https://www.cdc.gov/shingles/hcp/clinical-signs/index.html, 10/5/2024). Tỷ lệ mới mắc khoảng 2–9/1.000 dân mỗi năm tùy tuổi; nguy cơ tăng mạnh sau 50 tuổi và khi suy giảm miễn dịch; khoảng 1/3 người Mỹ bị zona trong đời; có thể tái phát. Đau, ngứa hoặc châm chích ở vùng sắp nổi ban; vài ngày trước ban có thể đau đầu, sợ ánh sáng, mệt. Ban ở một hoặc hai khoanh da kề nhau, hay gặp nhất ở thân theo khoanh ngực hoặc ở mặt, thường không vượt đường giữa; mụn nước mới mọc trong 3–5 ngày, lành sau 2–4 tuần. Chẩn đoán lâm sàng dễ khi đã có ban, khó khi chưa có ban. Đau sau zona ở 10–18%."
