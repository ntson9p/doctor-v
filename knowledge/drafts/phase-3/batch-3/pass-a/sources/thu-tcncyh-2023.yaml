notes_vi: "Lượt A đọc toàn văn PDF. 273 người nghi ho gà, 52 (19%) dương tính B. pertussis bằng PCR; 86,6% dưới 1 tuổi, nam/nữ 1,9/1; ca có quanh năm, nhiều nhất tháng 3–6. Ở 52 ca: ho cơn kéo dài 100%, viêm long 73,1%, nôn trớ 28,8%, sốt 23,1%, ho đỏ mặt tím tái 21,2%, tiếng rít 19,2%. Thời gian bệnh khi nhập viện: dưới 7 ngày 23,1%, 7–14 ngày 42,3%, trên 14 ngày 34,6% (trung bình 13,6 ngày). Viêm phế quản – phổi bội nhiễm 55,7% (theo bảng). Tiêm chủng: chưa tiêm 11,5%, chưa đủ 3 mũi 51,9%, đủ 3 mũi 36,5%."
