notes_vi: "Lượt A (lô 3, phần c) đọc toàn văn PMC4655927 qua API Europe PMC. 11 nghiên cứu, khoảng 6.500 người đau ngực ở phòng khám đa khoa (châu Âu, Bắc Mỹ, 1982–2010); không gộp vì dị biệt lớn. Bảng 3 (6 nghiên cứu ít sai lệch): hội chứng thành ngực 24,5–49,8%; tim mạch 13,8–16,1%; bệnh mạch vành ổn định 6,6–11,2%; hội chứng vành cấp hoặc nhồi máu cơ tim 1,5–3,6%; hô hấp 10,3–18,2%; tâm lý 9,5–18,2%; tiêu hóa 5,6–9,7%; thực quản 6,0–7,1% (Buntinx 1991, Verdon 2008); chấn thương 1,8–3,9%. Ở cấp cứu, trung vị hội chứng vành cấp là 37% (phần Bàn luận)."
