notes_vi: "Lượt A vòng 2 đọc toàn văn (PMC7179905) qua API Europe PMC ngày 31/10/2026. Điều tra 2017–2018 ở 82 cụm, người từ 15 tuổi, sàng lọc bằng câu hỏi và phim phổi kỹ thuật số: 61.763 người tham gia, 221 ca lao phổi có bằng chứng vi khuẩn; tỷ lệ hiện mắc 322 trên 100.000 người lớn (KTC 95% 260–399), tăng theo tuổi; tỷ số chênh nam/nữ 4,0 (2,8–5,8). Bảng 3 (phỏng vấn sâu 221 ca): ho bất kỳ 67,0%, ho dưới 2 tuần 9,1%, ho từ 2 tuần 57,9%, ho có đờm 61,1%, ho ra máu 3,2%, sốt 12,7%, sụt cân 7,7%, ra mồ hôi đêm 7,7%; 32,1% không có triệu chứng nghi lao; 97,7% có phim phổi bất thường gợi ý lao. Đây là ca phát hiện chủ động ở cộng đồng, nên tỷ lệ triệu chứng thấp hơn ở người tự đi khám."
