notes_vi: "Lượt A đọc toàn văn PMC13477947 qua API Europe PMC. Hướng dẫn của hội chuyên ngành Việt Nam (không phải văn bản của Bộ Y tế), 20 khuyến cáo theo GRADE. Triệu chứng điển hình: ợ nóng (nóng rát sau xương ức, tăng sau ăn hoặc khi nằm), ợ trớ; Lyon 2.0 coi đau ngực không do tim là triệu chứng điển hình thứ ba. Ở người có chẩn đoán trào ngược: ợ nóng 68,4–78,6%, ợ trớ 71,5–77,4%. Biểu hiện ngoài thực quản ở 7–23,1% người trào ngược; một nghiên cứu Việt Nam ở nhóm này: ho 49,1%, cảm giác vướng họng 46,7%, đau ngực không do tim 45,3%, khàn tiếng 9,9%, khò khè 9,4%. Nội soi khi có dấu hiệu báo động (nuốt khó, nuốt đau, nôn kéo dài, sụt cân, xuất huyết tiêu hóa, thiếu máu) hoặc không đỡ sau dùng thuốc. Khuyến cáo 12: thay đổi ăn uống, lối sống (giảm cân, kê cao đầu giường, bỏ thuốc lá, tránh ăn sát giờ ngủ, tránh ăn quá no). Chồng lấp với khó tiêu chức năng 41–51%."
