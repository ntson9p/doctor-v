notes_vi: "Lượt A chỉ đọc tóm tắt do công cụ tìm kiếm trả về (WebFetch bị chặn). Ho trong viêm phế quản cấp thường kéo dài 2–3 tuần (một tổng quan hệ thống ước trung bình 18 ngày); có thể kèm khạc đờm, khó thở, nghẹt mũi, đau đầu, sốt (thường sốt nhẹ). Không dùng thuốc giãn phế quản thường quy trừ khi có khò khè. Kháng sinh không được khuyên dùng thường quy. Lượt C cần mở bài."
