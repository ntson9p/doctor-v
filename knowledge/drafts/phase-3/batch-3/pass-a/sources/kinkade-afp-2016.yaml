notes_vi: "Lượt A vòng 2 tải trang bài báo ngày 31/10/2026. Mục Diagnosis: ho là triệu chứng chính; có thể kèm khạc đờm, khó thở, nghẹt mũi, đau đầu, sốt; vài ngày đầu khó phân biệt với cảm lạnh; có thể đau sau xương ức hoặc đau thành ngực khi ho; sau vài ngày đầu ít còn sốt, sốt trên 37,8°C nên nghĩ tới cúm hoặc viêm phổi; đờm, kể cả đờm mủ, hay gặp và không cho biết nhiễm vi khuẩn; ho thường kéo dài 2–3 tuần (một tổng quan gộp ước 18 ngày); khám thấy sốt ở khoảng một phần ba số người bệnh; nghe phổi có thể có ran rít. Bảng 1: khó thở, đờm có máu hoặc màu gỉ sắt, mạch trên 100, thở trên 24 lần/phút, nhiệt độ trên 37,8°C là chỉ định chụp phim. Mục Etiology và Antibiotics: phần lớn do vi rút (ít nhất 90%), vi khuẩn gặp ở 1–10%; không dùng kháng sinh thường quy; không dùng thuốc giãn phế quản thường quy trừ khi có khò khè. Trang ghi đã có bài mới hơn (Mulhem E và cs., Am Fam Physician 2025;111(3):214–217): lượt A mở bài này, bài vẫn nêu ho kéo dài 2–3 tuần và không khuyên dùng kháng sinh."
