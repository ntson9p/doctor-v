notes_vi: "Lượt A đọc toàn văn qua Europe PMC. 1.063 trẻ dưới 5 tuổi nhập Bệnh viện Nhi Trung ương (2015–2018) có xét nghiệm xác nhận ho gà: khoảng 44% dưới 2 tháng tuổi, 88% dưới 1 tuổi; 96,8% ho kéo dài; 23,2% ca nặng. Dịch theo chu kỳ khoảng 2 năm. Gần một nửa số ca vào mùa nóng (tháng 4–7); ca nặng và tử vong tăng vào mùa đông xuân (tháng 12–3). Định nghĩa ca: ho thành cơn, hoặc tiếng rít khi hít vào, hoặc nôn sau ho, hoặc cơn ngừng thở có hay không tím."
