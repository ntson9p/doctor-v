notes_vi: "Lượt A đọc trang (Full Review 3/2026). Chủ yếu ở trẻ 6 tháng–3 tuổi, trai nhiều hơn gái; hay do vi rút á cúm típ 1. Thường có triệu chứng viêm đường hô hấp trên trước; sau đó ho ông ổng (như hải cẩu), khàn tiếng, hay về đêm; có thể thở rít khi hít vào, trẻ thức giấc vì khó thở, thở nhanh, co kéo. Nhiều trẻ có sốt. Ca nặng có tím. Viêm nắp thanh môn, áp xe sau họng, viêm khí quản do vi khuẩn trông nhiễm độc hơn và không có ho ông ổng."
