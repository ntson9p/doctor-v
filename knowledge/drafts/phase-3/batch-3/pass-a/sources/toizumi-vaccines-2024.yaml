notes_vi: "Lượt A đọc tóm tắt trên Europe PMC. Hai điều tra cắt ngang ở Nha Trang (2017) và Quảng Ngãi (2019): tỷ lệ có kháng thể chứng tỏ nhiễm ho gà trong 12 tháng trước, ở người trên 2 tuổi, từ 2,1% (26–35 tuổi) đến 9,6% (3–5 tuổi) ở Nha Trang và từ 7,2% đến 11,4% (6–15 tuổi) ở Quảng Ngãi. Ho, ho kéo dài có cơn hoặc tiếng rít liên quan với nhiễm gần đây. Vi khuẩn ho gà lưu hành ở mọi nhóm tuổi tại Việt Nam."
