notes_vi: "Lượt A chỉ đọc tóm tắt do công cụ tìm kiếm trả về (WebFetch bị chặn). Năm 2022, ung thư phổi đứng thứ hai ở cả nam và nữ: 17.007 ca mới ở nam (17,8% số ca ung thư nam) và 7.419 ca mới ở nữ (8,7%); tổng 24.426 ca. Năm ghi là năm phát hành bản tin (ước lượng); lượt C cần mở PDF để đối chiếu."
