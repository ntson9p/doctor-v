notes_vi: "Lượt A vòng 2 tải trang ngày 31/10/2026 (trang không ghi ngày). Nguyên nhân chính là khói thuốc lá (hút chủ động hoặc hút thụ động), chiếm 3/4 số ca; yếu tố khác là ô nhiễm không khí trong và ngoài nhà, bụi và khói nghề nghiệp. Ở Việt Nam, bệnh gặp ở 7,1% nam và 1,9% nữ từ 40 tuổi. Trang không nêu tỷ lệ chưa được chẩn đoán: số 94% mà lượt A vòng 1 thấy qua kết quả tìm kiếm không có ở đây và đã bị bỏ khỏi bản nháp."
