notes_vi: "Lượt A chỉ đọc tóm tắt do công cụ tìm kiếm trả về (WebFetch bị chặn). Trang nêu: bệnh phổi tắc nghẽn mạn tính gặp ở 7,1% nam và 1,9% nữ từ 40 tuổi ở Việt Nam; khoảng 3/4 số ca do khói thuốc lá (kể cả hút thụ động). Kết quả tìm kiếm còn nêu một luận án ở miền Bắc (Karolinska): tỷ lệ 7,1% (nam 10,9%, nữ 3,9%), tăng rõ theo tuổi; và nghiên cứu ở người chưa từng hút thuốc từ 40 tuổi (Respirology 2015): 94% số ca chưa từng được chẩn đoán. Lượt C cần mở trang để đối chiếu."
