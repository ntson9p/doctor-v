notes_vi: "Lượt A (lô 3, phần c) đọc tóm tắt qua API Europe PMC. 59 bác sĩ đa khoa ở Thụy Sĩ: 672/24.620 lượt khám có đau ngực (2,7%), 52% nữ, tuổi trung bình 55. Nguyên nhân: cơ xương (gồm hội chứng thành ngực) 49%, tim mạch 16%, tâm lý 11%, hô hấp 10%, tiêu hóa 8%; hội chứng thành ngực 43%, bệnh mạch vành 12%, lo âu 7%; đau thắt ngực không ổn định 6, nhồi máu cơ tim 4, thuyên tắc phổi 2 người (cộng lại 1,8%)."
