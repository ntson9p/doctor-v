notes_vi: "Lượt A đọc toàn văn qua Europe PMC. 423 người lớn nhập Bệnh viện Đa khoa Trung ương Cần Thơ vì suy tim cấp (5–12/2024), tuổi trung bình 69,7, nam 48%. Bảng 1: tăng huyết áp khoảng 80% (340/423), đã có suy tim từ trước khoảng 48% (204/423), bệnh mạch vành khoảng 29%, đái tháo đường khoảng 30%, rung nhĩ khoảng 4,5%. Tử vong trong viện 5%, sau 30 ngày 17,1% trong số được theo dõi."
