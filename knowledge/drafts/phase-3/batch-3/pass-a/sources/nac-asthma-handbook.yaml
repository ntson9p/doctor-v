notes_vi: "Lượt A chỉ đọc tóm tắt do công cụ tìm kiếm trả về (WebFetch bị chặn). Đặc điểm làm tăng khả năng hen: có nhiều hơn một triệu chứng (khò khè, khó thở, tức ngực, ho), tái đi tái lại hoặc theo mùa, nặng hơn về đêm hoặc sáng sớm, khởi phát do gắng sức, không khí lạnh, chất kích thích, thuốc, dị ứng hoặc nhiễm vi rút. Đặc điểm làm giảm khả năng hen: chóng mặt, choáng; ho đơn độc không kèm triệu chứng hô hấp khác; khạc đờm mạn tính; đo chức năng hô hấp bình thường lúc có triệu chứng. Lượt C cần mở tài liệu."
