notes_vi: "Lượt A đọc tóm tắt qua API Europe PMC. 464 người ở 12 trung tâm chuyển tuyến: tuổi trung bình 63, nam 65,3%, týp A 62,3%. Đau đột ngột, dữ dội, như dao đâm là than phiền hay gặp nhất, nhưng biểu hiện rất đa dạng; hở van động mạch chủ 31,6%, mạch chênh lệch 15,1%; tử vong trong viện 27,4%. Tóm tắt không nêu tỷ lệ từng kiểu đau."
