notes_vi: "Lượt A đọc tóm tắt trên Europe PMC. 10.171 người nhập viện vì suy tim mất bù ở 8 nước châu Á – Thái Bình Dương (2006–2008), tuổi trung vị 67, nam 57%, 90% người châu Á. Khó thở là triệu chứng khi đến khám ở 95%; ran phổi 80%. Tử vong trong viện 4,8%. Bệnh nhân khu vực này trẻ hơn và nặng hơn các sổ đăng ký khác."
