notes_vi: "Lượt A đọc trang (Full Review 6/2024). Bệnh gặp nhiều nhất và dễ tử vong nhất ở trẻ dưới 6 tháng; người lớn chiếm 45,6% số ca báo cáo ở Mỹ năm 2022; nhiễm lại ở người đã tiêm thường nhẹ, hay bị bỏ sót. Lây cho trên 80% người tiếp xúc gần. Ủ bệnh 7–10 ngày. Ba giai đoạn, tổng 6–10 tuần: viêm long (hắt hơi, chảy nước mắt, ho khan về đêm, sốt hiếm gặp), sau 10–14 ngày là giai đoạn ho cơn (từ 5 tiếng ho liền trong một hơi thở ra, tiếp theo là tiếng rít khi hít vào; nôn là đặc trưng; ở nhũ nhi hay gặp cơn sặc, tím hơn là tiếng rít), rồi hồi phục, thường trong vòng 4 tuần; trung bình bệnh khoảng 7 tuần. Nghĩ đến ho gà khi ho từ 2 tuần kèm cơn ho, tiếng rít hoặc nôn sau ho. Thuốc ho, long đờm ít giá trị. Người bệnh điều trị tại nhà cần tránh tiếp xúc nhũ nhi chưa có miễn dịch."
