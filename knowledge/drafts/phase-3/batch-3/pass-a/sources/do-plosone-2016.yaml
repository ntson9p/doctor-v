notes_vi: "Lượt A đọc tóm tắt trên Europe PMC. 632 trẻ dưới 2 tuổi nằm viện vì nhiễm trùng hô hấp dưới ở hai bệnh viện nhi TP Hồ Chí Minh (5/2009–12/2010): 48% dương tính RSV; RSV gặp ở trẻ nhỏ hơn các vi rút khác, nhiều hơn rõ trong 6 tháng đầu; tuổi nhỏ và sốt lúc nhập viện liên quan với bệnh nặng; phân nhóm RSV đổi giữa hai mùa mưa liên tiếp."
