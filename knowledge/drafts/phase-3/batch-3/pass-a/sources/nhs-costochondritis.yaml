notes_vi: "Lượt A tải trang ngày 31/10/2026 (rà soát lần cuối 14/8/2026). Viêm chỗ sụn sườn nối xương ức: đau nhói ở trước hoặc bên ngực, tăng khi cử động phần trên cơ thể, khi nằm, khi hít sâu, khi ấn vào giữa ngực hoặc xương sườn. Thường tự khỏi trong vài tuần đến vài tháng. Đau ngực không rõ nguyên nhân không hết thì luôn cần khám; nghĩ mình bị viêm sụn sườn thì gọi 111 (khám khẩn) để loại trừ bệnh nặng hơn. Gọi 999 khi đau ngực đột ngột, lan tay, cổ, hàm, tức ngực; đau ngực kèm khó thở, tim nhanh, ho ra máu; đau ngực, lưng đột ngột như xé. Không tự lái xe đến cấp cứu. Liên quan chấn thương ngực, động tác lặp lại (mang vác), ho nhiều, nhiễm trùng."
