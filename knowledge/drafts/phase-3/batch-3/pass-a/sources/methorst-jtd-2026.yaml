notes_vi: "Lượt A đọc toàn văn PMC13460135 qua API Europe PMC. 369 người bóc tách týp A được mổ ở một trung tâm (Hà Lan, 1992–2025), nam 60%, tuổi trung bình 61; tăng huyết áp 40% (nam 35%, nữ 47%); bệnh mạch máu 18%. Bảng 2 (nam/nữ): đau ngực 64%/63%; đau giữa hai bả vai 16%/16%; đau lưng không rõ vị trí 13%/21%; đau cổ, họng khoảng 9%/13%; đau tay khoảng 6%/9%; đau hàm 3%/9%; đau bụng 13%/8%. Bảng 3: khó thở 7%/17%; buồn nôn 9%/12%; ngất, gục 14%/23%; vã mồ hôi 13%/10%; liệt nửa người khoảng 4%/6%; nói khó 3%/1%; sốc 2%/1%; 5% không triệu chứng. Số liệu ghi theo hồ sơ nên có thể thấp hơn thực tế."
