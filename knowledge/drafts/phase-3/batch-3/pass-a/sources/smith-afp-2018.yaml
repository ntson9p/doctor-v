notes_vi: "Lượt A đọc toàn văn trên aafp.org. Croup gặp ở 3% trẻ 6 tháng–3 tuổi mỗi năm, có thể đến 6 tuổi; trai/gái 1,5/1; chủ yếu mùa thu, đông (ở nước ôn đới). Khoảng 85% ca nhẹ, dưới 1% nặng; dưới 5% phải nằm viện. Khởi đầu 12–72 giờ sốt nhẹ, sổ mũi; rồi thở rít khi hít vào, thở nhanh, co kéo, ho ông ổng; nặng hơn về đêm, đỉnh ở giờ 24–48, tự khỏi trong 48 giờ đến 1 tuần. Nhiều trẻ khó thở, sốt nhưng không sốt cũng không loại trừ. Khò khè nếu có thường nhẹ; khò khè rõ cần nghĩ bệnh khác. Bảng Westley: croup nhẹ không thở rít lúc nằm yên."
