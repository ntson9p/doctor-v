notes_vi: "Lượt A không mở được văn bản (WebFetch bị chặn, tải bằng curl bị proxy từ chối). Số hiệu, ngày ký và văn bản bị thay thế lấy từ docs/research/vietnam-sources.md (mục Lao) và kết quả tìm kiếm. Các ý dùng trong bản nháp (ho, khạc đờm kéo dài từ 2 tuần là triệu chứng nghi lao quan trọng nhất; có thể ho ra máu, sốt nhẹ về chiều, ra mồ hôi đêm, chán ăn, mệt mỏi, sụt cân, đau ngực, khó thở; phải điều trị đủ thời gian) là mô tả chung của các hướng dẫn lao Việt Nam, chưa đối chiếu với văn bản này: lượt C cần mở PDF và ghi số mục."
