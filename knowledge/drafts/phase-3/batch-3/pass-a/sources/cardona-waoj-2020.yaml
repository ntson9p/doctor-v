notes_vi: "Lượt A đọc toàn văn qua Europe PMC (fullTextXML). Tỷ lệ mắc toàn cầu 50–112 lượt trên 100.000 người-năm; tỷ lệ mắc suốt đời 0,3–5,1%. Không có biểu hiện da ở 10–20% ca phản vệ, hay gặp trong ca tử vong. Tiêu chuẩn chẩn đoán 2020: khởi phát cấp (vài phút đến vài giờ) có da niêm mạc kèm hô hấp, tụt huyết áp hoặc triệu chứng tiêu hóa nặng; hoặc tụt huyết áp, co thắt phế quản, tổn thương thanh quản sau tiếp xúc dị nguyên đã biết, kể cả khi không có biểu hiện da. Tác nhân hay gặp nhất: thức ăn, nọc côn trùng, thuốc (kháng sinh, kháng viêm không steroid); hải sản là tác nhân thức ăn hay gặp ở người lớn châu Á. Phản vệ không rõ nguyên nhân chiếm 6,5–35%. Khoảng một nửa phản ứng hai pha xảy ra trong 6–12 giờ đầu; cần theo dõi người bệnh."
