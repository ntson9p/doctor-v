notes_vi: "Lượt A đọc toàn văn PMC2072948 qua API Europe PMC. 300/672 người đau ngực ở 58 phòng khám (Thụy Sĩ) là hội chứng thành ngực (44,6%), mọi lứa tuổi kể cả thiếu niên và người trên 75 tuổi, nam nữ như nhau, tuổi trung bình 50. Mới 62%, cũ hoặc tái lại 35%; 57% bị lại trong năm theo dõi. Đau vừa 75%, nặng 23%; 71% tăng khi đổi tư thế, cử động, nằm hoặc thở; từng cơn vài giây đến vài ngày 50%, liên tục hàng giờ đến hàng tuần 35%, cấp và dữ dội 9%. Có điểm đau khi ấn ở 214/300 người. Lan tay trái 18, tay phải 4, lưng 5, cổ 3, bụng 3 người. Kèm ho hoặc khó thở kéo dài 10%, lo âu 7%. Bảng 2: đau không kiểu bóp nghẹt, đè ép (OR 2,53), khu trú rõ, không do gắng sức (OR 1,58), thay đổi theo cử động (OR 1,54), ấn vào đau (OR 5,72)."
