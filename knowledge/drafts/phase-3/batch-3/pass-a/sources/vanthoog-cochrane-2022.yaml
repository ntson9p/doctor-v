notes_vi: "Lượt A chỉ đọc tóm tắt do công cụ tìm kiếm trả về (WebFetch bị chặn). Sàng lọc lao ở cộng đồng (chủ yếu điều tra tỷ lệ hiện mắc): độ nhạy gộp của ho từ 2 tuần 42,1% (36,6–47,7%; 41 nghiên cứu), ho bất kỳ 51,3% (42,8–59,7%; 21 nghiên cứu). Trang hướng dẫn sàng lọc của WHO (2021) nêu: có bất kỳ triệu chứng lao nào (ho, sốt, ra mồ hôi đêm, sụt cân, ho ra máu) độ nhạy khoảng 71%, độ đặc hiệu 64%. Một bảng trong tài liệu khác (chưa xác định được nghiên cứu gốc) ghi sốt 35%, ra mồ hôi đêm 39%, sụt cân 55%. Số đo ở người được sàng lọc chủ động, gồm nhiều ca chưa có triệu chứng, nên thấp hơn ở người tự đi khám. Lượt C cần mở bản tóm tắt chính thức."
