notes_vi: "Lượt A vòng 2 đọc toàn văn (PMC9109771) qua API Europe PMC ngày 31/10/2026. Tóm tắt, mục Main results: 59 nghiên cứu sàng lọc chủ động (nhiều nhất là điều tra tỷ lệ hiện mắc quốc gia); độ nhạy gộp của ho từ 2 tuần 42,1% (KTC 95% 36,6–47,7; 41 nghiên cứu), ho bất kỳ 51,3% (42,8–59,7; 21 nghiên cứu), có bất kỳ triệu chứng lao nào 70,6% (61,7–78,2; 29 nghiên cứu); độ đặc hiệu lần lượt 94,4%, 87,6%, 65,1%. Tổng quan không gộp riêng sốt, ra mồ hôi đêm, sụt cân hay ho ra máu: các số 35%, 39%, 55% mà lượt A vòng 1 gán cho nguồn này không có trong bài và đã bị bỏ khỏi bản nháp."
