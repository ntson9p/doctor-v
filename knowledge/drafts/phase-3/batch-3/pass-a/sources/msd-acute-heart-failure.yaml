notes_vi: "Lượt A đọc trang (Full Review 10/2025). Suy tim cấp gồm suy tim mới mắc và đợt mất bù của suy tim mạn. Triệu chứng hay gặp nhất là khó thở (khi gắng sức hoặc khi nghỉ) và mệt; khò khè hoặc thở rít có thể có do phù phổi; người già hay lú lẫn hơn. Nghĩ đến khi khó thở gắng sức, mệt, khó thở khi nằm hoặc phù mới xuất hiện hay nặng lên, nhất là ở người có nhồi máu cơ tim cũ, tăng huyết áp, bệnh van tim. Cần nhập viện ngay khi phù phổi, triệu chứng nặng, suy tim mới mắc hoặc không đáp ứng điều trị ngoại trú."
