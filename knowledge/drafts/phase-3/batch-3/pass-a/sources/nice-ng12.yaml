notes_vi: "Lượt A chỉ đọc tóm tắt do công cụ tìm kiếm trả về (WebFetch bị chặn); hướng dẫn được sửa nhiều lần sau 2015. Ung thư phổi: chuyển khám theo đường nghi ung thư nếu phim phổi gợi ý, hoặc người từ 40 tuổi ho ra máu không rõ nguyên nhân. Chụp phim phổi trong 2 tuần cho người từ 40 tuổi có từ 2 triệu chứng không rõ nguyên nhân (hoặc 1 triệu chứng nếu đã từng hút thuốc) trong số: ho, mệt, khó thở, đau ngực, sụt cân, chán ăn. Phim phổi bình thường không loại trừ được ung thư. Lượt C cần mở trang."
