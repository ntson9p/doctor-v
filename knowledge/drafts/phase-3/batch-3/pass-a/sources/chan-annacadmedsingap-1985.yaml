notes_vi: "Lượt A đọc tóm tắt qua API Europe PMC. 80 người tràn khí tự phát ở khoa nội một bệnh viện đa khoa Singapore (1981–1983), 75 nam, 15–92 tuổi: khó thở là triệu chứng chính ở 74%, đau ngực 59%, 1 người mất ý thức. Không có bệnh phổi 45%, bệnh phổi tắc nghẽn mạn tính 43%, lao phổi 5 người, hen 2 người. Tái phát 20%. Phân bố tuổi hai đỉnh: người trẻ thường không có bệnh phổi."
