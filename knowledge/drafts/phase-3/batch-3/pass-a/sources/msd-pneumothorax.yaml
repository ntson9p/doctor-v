notes_vi: "Lượt A tải trang ngày 31/10/2026 (rà soát toàn bộ 7/2025, cập nhật 9/2026). Tràn khí tự phát nguyên phát điển hình ở nam trẻ, cao gầy, tuổi thiếu niên và 20; liên quan hút thuốc; thường xảy ra lúc nghỉ. Thứ phát hay gặp nhất ở bệnh phổi tắc nghẽn mạn tính nặng. Triệu chứng: khó thở và đau ngực kiểu màng phổi; khó thở đột ngột hoặc từ từ tùy tốc độ và kích thước; đau có thể lan vai hoặc bụng, có thể giống thiếu máu cơ tim; tràn khí nhỏ đôi khi không triệu chứng. Tràn khí áp lực gây tụt huyết áp, ngừng tim trong vài phút. Tái phát 19–29% sau 1 năm."
