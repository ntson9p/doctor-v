notes_vi: "Lượt A (lô 3, phần c) đọc toàn văn PMC2801475 qua API Europe PMC. 1.212 người từ 35 tuổi đau ngực ở 74 phòng khám đa khoa (Đức), 56% nữ. Bảng 2 (nữ/nam): hội chứng thành ngực 48,6%/44,0%; bệnh mạch vành (ổn định và cấp) 13,0%/17,2%; tâm lý 11,2%/7,3%; nhiễm trùng hô hấp trên 7,4%/9,0%; hội chứng vành cấp 2,9%/4,5%; trào ngược dạ dày – thực quản 3,7%/3,2%; chấn thương 1,8%/5,1%; bệnh dạ dày lành tính 2,8%/1,3%; viêm phổi hoặc viêm màng phổi 1,3%/3,0%; bệnh phổi tắc nghẽn hoặc hen 1,5%/2,4%; khác 8,7%/7,5%. Bảng 3 (180 người bệnh mạch vành, nữ/nam): đau kiểu đè ép 61%/64%; đau tăng khi gắng sức 39%/48%; đau khi hít vào 5,7%/4,3%; đau lan ra lưng 11%/14%; lan tay trái 16%/14%; khó thở 31%/37%; buồn nôn, nôn 5,7%/4,3%; ho 4,5%/3,3%; ấn vào đau 18,5%/6,3%; thời gian cơn đau dưới 1 phút 14%/11%, 1–30 phút 36%/46%, 30–60 phút 10%/23%, 1–12 giờ 24%/9%, liên tục 10%/9%."
