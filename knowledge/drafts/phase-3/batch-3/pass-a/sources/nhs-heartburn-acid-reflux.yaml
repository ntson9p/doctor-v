notes_vi: "Lượt A tải trang ngày 31/10/2026 (rà soát lần cuối 20/11/2023). Triệu chứng chính: nóng rát giữa ngực, vị chua trong miệng; có thể ho hoặc nấc tái đi tái lại, khàn tiếng, hôi miệng, đầy bụng, buồn nôn; thường nặng hơn sau ăn, khi nằm, khi cúi. Yếu tố làm nặng: một số đồ ăn uống (cà phê, rượu, đồ béo, cay), thừa cân, hút thuốc, có thai, căng thẳng, thuốc giảm đau kháng viêm. Tự xử trí: ăn bữa nhỏ, giảm cân, không ăn trong 3–4 giờ trước khi ngủ, không mặc đồ bó bụng, không hút thuốc, hạn chế rượu, kê cao đầu giường 10–20 cm (không dùng thêm gối). Hỏi dược sĩ; khám bác sĩ (không khẩn) khi ợ nóng hầu hết các ngày, không đỡ, hoặc kèm nuốt vướng, nôn nhiều, sụt cân."
