notes_vi: "Lượt A tải trang ngày 31/10/2026 (rà soát toàn bộ 12/2024). Nguy cơ cao ở nam, người lớn tuổi, người tăng huyết áp; đỉnh 50–65 tuổi (20–40 tuổi ở bệnh mô liên kết như Marfan). Tăng huyết áp góp phần ở hơn hai phần ba người bệnh. Đau dữ dội ở trước ngực hoặc giữa hai bả vai, như xé, khởi phát đột ngột, hay di chuyển theo đường bóc tách; tới 20% ngất; 20–30% mất hoặc yếu mạch lớn. Nghĩ tới bệnh ở mọi người đau ngực, đau lưng ngực, ngất, đau bụng không giải thích được, đột quỵ. Khoảng 20% tử vong trước khi tới viện; không điều trị thì tử vong khoảng 1–2% mỗi giờ đầu."
