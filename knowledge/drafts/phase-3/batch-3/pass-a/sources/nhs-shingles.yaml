notes_vi: "Lượt A tải trang ngày 31/10/2026 (rà soát lần cuối 23/11/2023). Dấu hiệu đầu: châm chích hoặc đau ở một vùng da, đau đầu hoặc mệt; ban thường xuất hiện vài ngày sau; hiếm khi đau mà không có ban. Ban thường ở ngực và bụng, chỉ một bên người; ban ở cả hai bên ít khả năng là zona; thành mụn nước rồi đóng vảy, lành trong tới 4 tuần. Gặp dược sĩ (không khẩn) nếu từ 18 tuổi, cố gắng trong 3 ngày từ khi nổi ban; khám khẩn hoặc gọi 111 nếu có thai, ban ở mắt hoặc mũi, nhìn thay đổi, suy giảm miễn dịch nặng, từ 17 tuổi trở xuống. Tự chăm sóc: giữ ban sạch khô, mặc đồ rộng, chườm mát; không để băng dính vào ban. Tránh tiếp xúc người có thai chưa mắc thủy đậu, người suy giảm miễn dịch, trẻ dưới 1 tháng."
