notes_vi: "Lượt A vòng 2 đọc toàn văn (PMC7125807) qua API Europe PMC ngày 31/10/2026 và xác nhận tên bài, tác giả (McManus và cs., Belfast, Bắc Ireland); giữ id cũ vì bản nháp đã dùng. Mục Methods: 136 người nhập viện vì đợt cấp bệnh phổi tắc nghẽn mạn tính, tuyển trong 24 giờ đầu; tuổi trung bình 70, FEV1 trung bình 39% dự đoán, phần lớn khó thở MRC độ 5 trong đợt cấp. Bảng 3 (triệu chứng ghi có/không): tăng khó thở 99%, khò khè 81%, tăng ho 77%, tăng lượng đờm 65%, đờm mủ tăng 60%, chảy mũi hoặc nghẹt mũi 55%, sốt 28%, đau họng 25%. Bối cảnh bệnh viện, bệnh nặng: cần hạ mức cho người tự kiểm tra ở cộng đồng."
