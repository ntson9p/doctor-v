notes_vi: "Lượt A chỉ thấy bảng 'Patient symptoms during exacerbations' qua kết quả tìm kiếm (WebFetch bị chặn); chưa xác nhận được tên bài, tác giả. 136 người trong đợt cấp: tăng khó thở 99%, khò khè 81%, tăng ho 77%, tăng lượng đờm 65%, đờm mủ hơn 60%, sốt 28%, đau họng 25%. Bối cảnh tuyển chọn chưa rõ (có thể gồm người nằm viện). Lượt C cần mở PMC7125807, ghi tên bài và kiểm tra bối cảnh."
