notes_vi: "Lượt A đọc tóm tắt qua API Europe PMC. 1.212 người từ 35 tuổi đau ngực ở 74 phòng khám (Đức): đau từ thành ngực 46,6%. Vị trí sau xương ức 52,0% và/hoặc bên trái 69,2%; đau liên tục 28,0%; 72,3% không liên quan thời điểm; 55,4% còn đau sau 6 tháng. Điểm 4 dấu hiệu: căng cơ khu trú, đau nhói, ấn vào đau, không ho."
