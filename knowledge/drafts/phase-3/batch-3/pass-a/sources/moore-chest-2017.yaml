notes_vi: "Lượt A chỉ đọc tóm tắt trên Europe PMC (toàn văn không mở). 53 nghiên cứu có xét nghiệm xác nhận. Người lớn: ho từng cơn độ nhạy 93,2%, độ đặc hiệu 20,6%; không sốt độ nhạy 81,8%, độ đặc hiệu 18,8%; nôn sau ho độ nhạy 32,5%, độ đặc hiệu 77,7%; tiếng rít (whoop) độ nhạy 29,8%, độ đặc hiệu 79,5%. Trẻ em: nôn sau ho độ nhạy 60,0%, độ đặc hiệu 66,0%."
