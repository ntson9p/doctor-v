notes_vi: "Lượt A đọc toàn văn đăng lại trên vnras.com (trang thứ cấp, có liên kết PDF); Quyết định ký ngày 13/01/2015 (Thứ trưởng ký thay Bộ trưởng). Chương 3, bài Bệnh zona: ban đỏ, mụn nước, bọng nước thành đám, thành chùm dọc đường đi của dây thần kinh ngoại biên, thường một bên, không vượt đường giữa; hay gặp ở người già, người suy giảm miễn dịch. Tiền triệu 1–5 ngày: bỏng rát, châm chích, tê, đau trên một vùng da, nhất là về đêm, có thể nhức đầu, sợ ánh sáng, khó chịu; mảng đỏ xuất hiện khoảng nửa ngày đến một ngày sau, rồi mụn nước; lành sẹo sau khoảng 2–4 tuần; hạch vùng lân cận sưng to. Đau xuất hiện sớm, có thể trước tổn thương da; trẻ em, người trẻ đau ít, người cao tuổi đau từng cơn, kéo dài. Zona liên sườn và ngực bụng là thể hay gặp nhất (50%); zona mắt 10–15%. Giai đoạn khởi phát cần phân biệt với viêm màng phổi, đau do bệnh tim, viêm túi mật, cơn đau quặn thận… Thuốc kháng vi rút nên dùng sớm, tốt nhất trong 72 giờ đầu. Chưa kiểm tra văn bản thay thế."
