id: pertussis
names:
  vi: "Ho gà"
  vi_common: ["Ho gà", "Ho kéo dài 100 ngày"]
  en: "Pertussis (whooping cough)"
codes:
  icd10: "A37.9"
  icd10_verified: false
  mondo: "MONDO:0005077"
summary_vi:
  - "Bệnh nhiễm khuẩn đường hô hấp, lây rất mạnh, gặp ở mọi lứa tuổi."
  - "Lúc đầu giống cảm lạnh, sau 1–2 tuần thành từng cơn ho dồn dập, có thể rít khi hít vào hoặc nôn sau ho."
  - "Trẻ dưới 6 tháng dễ bị nặng: ngừng thở, tím tái, viêm phổi."
urgency: 3
cant_miss: false
specialties: [infectious_disease, pediatrics, respiratory]
priors:
  - complaint: cough
    default: P4
    by_age:
      infant_0_2m: P3
      child_5_12: P3
      teen_13_17: P3
    evidence:
      tier: B
      basis: judgment
      sources: [toizumi-vaccines-2024, pham-bmcpublichealth-2024, pham-actapaediatr-2020, wang-bmj-2014, msd-pertussis]
      locator: "Toizumi 2024 tóm tắt; Pham 2024 phần Results; Pham 2020 tóm tắt; Wang 2014 tóm tắt"
      reported: "Nhiễm ho gà trong 12 tháng trước ở người trên 2 tuổi: 2,1–9,6% (Nha Trang 2017), 7,2–11,4% (Quảng Ngãi 2019). Trẻ nằm Bệnh viện Nhi Trung ương vì ho gà: khoảng 44% dưới 2 tháng tuổi, 88% dưới 1 tuổi. 20% trẻ 5–15 tuổi đi khám vì ho 2–8 tuần có nhiễm ho gà gần đây (Anh)."
      note: "Thang tuyệt đối (kb-guide 2.3). Vi khuẩn lưu hành ở mọi lứa tuổi tại Việt Nam (Toizumi), nhưng ca ở trẻ lớn và người lớn thường nhẹ, hay bị bỏ sót (MSD). Trẻ dưới 2 tháng chưa đến tuổi tiêm và chiếm gần một nửa số ca nằm viện, nên P3 (1–5% trẻ nhỏ ho). Trẻ 5–17 tuổi: khoảng một phần năm số trẻ ho từ 2 tuần là ho gà (Wang), mà ho kéo dài chỉ là một phần các lần ho, nên P3. Trẻ 2 tháng–5 tuổi phần lớn đã tiêm 3 mũi, người lớn ho phần lớn do vi rút: P4 (0,2–1%). Câu thời gian ho và các câu kiểu ho mang phần lớn thông tin. Dịch theo chu kỳ 2–3 năm, nên trong vụ dịch prior cao hơn nhiều. Chưa có số liệu ho gà trong số người ho đi khám ban đầu ở Việt Nam. Không dùng hệ số theo tháng: mùa cao điểm ở miền Bắc (tháng 4–7) chỉ cao hơn mùa khác khoảng 15–20% (Pham 2024)."
findings:
  - finding: cough_duration
    dist: { lt_1w: 0.15, w1_2: 0.30, w2_8: 0.50, gt_8w: 0.05 }
    evidence:
      tier: B
      basis: numeric
      sources: [thu-tcncyh-2023, msd-pertussis, wang-bmj-2014]
      locator: "Thư 2023 bảng 4; MSD Pertussis (Symptoms and Signs)"
      reported: "Thời gian bệnh khi nhập viện: dưới 7 ngày 23,1%, 7–14 ngày 42,3%, trên 14 ngày 34,6% (52 ca xác định, phần lớn dưới 1 tuổi)"
      note: "Giai đoạn viêm long 1–2 tuần, giai đoạn ho cơn bắt đầu sau 10–14 ngày, bệnh kéo dài trung bình khoảng 7 tuần, có khi tới 3 tháng (MSD). Trẻ nhỏ nằm viện được đưa đi khám sớm hơn trẻ lớn và người lớn (Wang: trẻ đi khám vì ho 2–8 tuần), nên nghiêng về từ 2 tuần hơn số liệu bệnh viện. Ước lượng."
  - finding: cough_paroxysms
    freq: very_frequent
    evidence:
      tier: A
      basis: numeric
      sources: [moore-chest-2017, thu-tcncyh-2023, pham-actapaediatr-2020, msd-pertussis]
      locator: "Moore 2017 tóm tắt; Thư 2023 biểu đồ 1; Pham 2020 tóm tắt"
      reported: "Ho từng cơn: độ nhạy 93,2% ở người lớn (gộp); ho cơn kéo dài 100% (52 ca, Việt Nam); ho dữ dội 87% (trẻ dưới 2 tháng nằm viện)"
      note: "Không chọn almost_always vì người dùng có thể đang ở giai đoạn viêm long (tuần đầu), khi chưa có cơn ho. Câu trả lời 'không ho từng cơn' giảm khả năng ho gà khoảng 4 lần; Cornia: LR− 0,52."
  - finding: inspiratory_whoop
    freq: occasional
    evidence:
      tier: A
      basis: numeric
      sources: [moore-chest-2017, cornia-jama-2010, thu-tcncyh-2023, nhs-whooping-cough]
      locator: "Moore 2017 tóm tắt; Cornia 2010 tóm tắt; Thư 2023 biểu đồ 1"
      reported: "Tiếng rít: độ nhạy 29,8% ở người lớn, độ đặc hiệu 79,5%; LR+ 1,9; 19,2% (52 ca, Việt Nam)"
      note: "NHS: trẻ dưới 3 tháng và một số người lớn không có tiếng rít. Tỷ lệ nền 1% (đặc hiệu) nên trả lời 'Có' tăng khả năng nhiều; câu hỏi của app mô tả rõ tiếng rít cuối cơn ho, khác thở rít liên tục của viêm thanh quản."
  - finding: post_tussive_vomiting
    freq: frequent
    evidence:
      tier: A
      basis: numeric
      sources: [moore-chest-2017, cornia-jama-2010, thu-tcncyh-2023, msd-pertussis]
      locator: "Moore 2017 tóm tắt; Thư 2023 biểu đồ 1; MSD (nôn là đặc trưng)"
      reported: "Nôn sau ho: độ nhạy 32,5% ở người lớn, 60,0% ở trẻ em; LR+ 1,8; nôn trớ 28,8% (52 ca, Việt Nam)"
      note: "Trung bình người lớn và trẻ em khoảng 35–60%, chọn frequent. Tần suất trong số người có ho."
  - finding: apnea_cyanosis_spells
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [thu-tcncyh-2023, msd-pertussis, nhs-whooping-cough, pham-bmcpublichealth-2024]
      locator: "Thư 2023 biểu đồ 1; MSD (Symptoms and Signs); NHS (Symptoms)"
      reported: "Ho đỏ mặt, tím tái 21,2% (52 ca, 86,6% dưới 1 tuổi)"
      note: "Chỉ hỏi ở trẻ dưới 5 tuổi. Ở nhũ nhi, cơn sặc có hoặc không tím hay gặp hơn tiếng rít (MSD); NHS: trẻ nhỏ có thể tím tái sau cơn ho. Ngừng thở là tiêu chuẩn ca bệnh ở trẻ nhỏ (Pham 2024). Số liệu bệnh viện gộp cả đỏ mặt; ở cộng đồng ước khoảng 20%. Có dấu hiệu này thì quy tắc rf_infant_apnea đã xếp mức 1."
  - finding: fever
    freq: occasional
    evidence:
      tier: A
      basis: numeric
      sources: [moore-chest-2017, thu-tcncyh-2023, nhs-whooping-cough, msd-pertussis]
      locator: "Moore 2017 tóm tắt; Thư 2023 biểu đồ 1"
      reported: "Không sốt: độ nhạy 81,8% ở người lớn, tức khoảng 18% có sốt; sốt 23,1% (52 ca nằm viện, nhiều ca có viêm phổi bội nhiễm)"
      note: "NHS: sốt cao ít gặp; MSD: sốt hiếm. Mức occasional ngang cảm lạnh và thấp hơn cúm, viêm phổi, nên câu trả lời 'có sốt' nghiêng về các bệnh đó. Không chọn rare để câu 'có sốt nhẹ' không loại ho gà (người lớn có số liệu khoảng 18%)."
  - finding: fever_max_temp
    dist: { lt_38: 0.60, t38_39: 0.32, ge_39: 0.08 }
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-whooping-cough, msd-pertussis]
      locator: "NHS (high temperature is uncommon); MSD (fever is rare)"
      note: "Tính trong số người có sốt: thường chỉ sốt nhẹ; sốt từ 39°C gợi ý viêm phổi hoặc bệnh khác. Ước lượng."
  - finding: runny_nose
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [thu-tcncyh-2023, nhs-whooping-cough, msd-pertussis]
      locator: "Thư 2023 biểu đồ 1; NHS (first signs similar to a cold)"
      reported: "Viêm long 73,1% (52 ca)"
      note: "Sổ mũi rõ ở giai đoạn đầu và giảm dần khi đã ho cơn; người dùng hỏi app sau 1–2 tuần nên hạ một mức (frequent). Tỷ lệ nền 0,2."
  - finding: breathing_difficulty
    freq: occasional
    freq_by_age:
      infant_0_2m: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [nhs-whooping-cough, pham-actapaediatr-2020, msd-pertussis]
      locator: "NHS (may have difficulty breathing after a coughing bout); Pham 2020 tóm tắt (viêm phổi 91% ở trẻ dưới 2 tháng nằm viện)"
      note: "Người lớn, trẻ lớn giữa các cơn ho thường thở bình thường. Trẻ dưới 2 tháng hay khó thở sau cơn ho và hay biến chứng viêm phổi (số liệu bệnh viện nên chỉ chọn frequent). Ước lượng."
  - finding: sick_contact_respiratory
    freq: frequent
    evidence:
      tier: C
      basis: verbal
      sources: [msd-pertussis, pham-bmcpublichealth-2024]
      locator: "MSD (Etiology: lây cho trên 80% người tiếp xúc gần; vị thành niên, người lớn là nguồn lây cho nhũ nhi)"
      note: "Nguồn lây thường là người nhà ho kéo dài, nhưng thời gian ủ bệnh 7–10 ngày (tới 3 tuần) dài hơn khoảng 7 ngày mà câu hỏi nhắc, và nhiều người lớn không biết mình bị ho gà. Ước khoảng một nửa. Tỷ lệ nền 0,2."
  - finding: wheeze
    freq: rare
    evidence:
      tier: C
      basis: judgment
      sources: [msd-pertussis, nhs-croup]
      locator: "MSD (Symptoms and Signs); NHS Croup (bảng phân biệt: khò khè là của viêm tiểu phế quản)"
      note: "Ho gà gây cơn ho và tiếng rít khi hít vào, không gây khò khè khi thở ra; giữa các cơn trẻ thở bình thường. Mức rare thấp hơn tỷ lệ nền 5%, để khò khè nghiêng về viêm tiểu phế quản, hen. Ước lượng."
  - finding: child_feeding_reduced
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-whooping-cough, msd-pertussis]
      locator: "NHS (dehydration in babies under 6 months)"
      note: "Chỉ hỏi ở trẻ 2 tháng–5 tuổi. Nôn sau ho và cơn ho làm trẻ bú, ăn kém; mất nước là biến chứng ở trẻ dưới 6 tháng. Ước lượng."
  - finding: pleuritic_chest_pain
    freq: occasional
    freq_by_age:
      infant_0_2m: rare
      child_2m_5y: rare
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-whooping-cough]
      locator: "NHS (coughing may cause sore ribs in older children and adults)"
      note: "Ho dữ dội nhiều tuần làm đau sườn khi ho ở trẻ lớn, người lớn. Trẻ dưới 5 tuổi gần như không tự báo được. Ước lượng."
warning_signs:
  - apnea_cyanosis_spells
  - es_severe_breathing
  - chest_indrawing
  - child_unable_to_drink
  - young_infant_not_feeding
  - seizure_recent
  - drowsy_hard_to_wake
self_care_vi:
  - "Nghỉ ngơi, uống đủ nước; trẻ nhỏ bú, ăn ít một và nhiều lần, nhất là sau cơn ho."
  - "Không tự cho trẻ nhỏ uống thuốc ho; hỏi bác sĩ hoặc dược sĩ trước khi dùng thuốc."
  - "Giữ người bệnh tránh xa trẻ sơ sinh, trẻ chưa tiêm đủ vắc xin và phụ nữ có thai."
  - "Nghỉ học, nghỉ làm cho đến khi bác sĩ cho đi lại hoặc ho đã được 3 tuần."
see_doctor_vi:
  - "Đi khám trong 24 giờ để được xét nghiệm và điều trị kháng sinh khi cần, giúp hạn chế lây."
  - "Trẻ dưới 6 tháng nghi ho gà cần được khám ngay trong ngày; nhiều trẻ phải nằm viện."
  - "Đi cấp cứu ngay nếu trẻ ngừng thở, tím tái, co giật, lơ mơ hoặc không bú được."
  - "Người nhà, nhất là phụ nữ có thai, nên hỏi cơ sở y tế về tiêm vắc xin và thuốc phòng."
sources: [msd-pertussis, nhs-whooping-cough, moore-chest-2017, pham-bmcpublichealth-2024]
proposed_findings:
  - id: dtp_vaccinated
    kind: risk_factor
    type: binary
    label_vi: "Đã tiêm đủ vắc xin ho gà theo tuổi"
    question_vi: "Bé đã tiêm đủ các mũi vắc xin có ho gà theo lịch chưa?"
    help_vi: "Vắc xin 5 trong 1 hoặc 6 trong 1, tiêm lúc 2, 3, 4 tháng tuổi. Xem sổ tiêm chủng."
    applies_to:
      age_groups: [child_2m_5y]
    leak: 0.85
    leak_note: "Ước lượng theo độ bao phủ tiêm chủng mở rộng; cần số liệu chính thức."
    notes_vi: "Tình trạng tiêm chủng phân biệt mạnh ho gà với các nguyên nhân ho khác ở trẻ nhỏ: trẻ trên 2 tháng chưa tiêm có tỷ lệ nằm viện vì ho gà cao gấp 106 lần trẻ đã tiêm (Pham 2020); trong 52 ca xác định chỉ 36,5% đã tiêm đủ 3 mũi (Thư 2023). Lượt A, lô 3."
review:
  status: draft
  authors: ["agent:pass-a"]
  updated: "2026-10-31"
  notes_vi: "Mức xử trí 3, không thuộc nhóm không được bỏ sót (giữ gợi ý): NHS khuyên khám bác sĩ gấp hoặc gọi 111 khi trẻ dưới 6 tháng có triệu chứng hoặc ho nặng dần, gọi cấp cứu khi tím, khó thở, co giật; kháng sinh trong 3 tuần đầu chủ yếu để hạn chế lây. Ca nặng ở trẻ nhỏ do quy tắc rf_pertussis_infant (mức 2) và rf_infant_apnea (mức 1) xử lý. Bộ Y tế chưa có hướng dẫn chẩn đoán, điều trị riêng cho ho gà (lượt A tìm 1 lần; 5642/QĐ-BYT và 3312/QĐ-BYT năm 2015 không có bài ho gà). Lượt A đã tự mở trang NHS Whooping cough (rà soát 06/8/2026; mục 'Urgent advice' và 'Call 999' như trên). Điểm cần bác sĩ xem: (1) prior chỉ là ước lượng từ huyết thanh học và ca nằm viện, chưa có tỷ lệ ho gà trong số người ho đi khám ban đầu ở Việt Nam; (2) tần suất triệu chứng ở người lớn lấy từ tổng quan Moore (độ nhạy), ở trẻ nhỏ từ ca nằm viện; (3) sốt để occasional theo số liệu (khoảng 18–23%), trong khi NHS, MSD mô tả là ít gặp; (4) danh mục chưa có câu tiêm vắc xin ho gà (đề xuất dtp_vaccinated) và câu ho nặng hơn về đêm."
