  # ---------- Giai đoạn 3, lô 2 (lượt C): dấu hiệu mới của lô 2 ----------
  - finding: atrial_fibrillation_known
    freq: occasional
    freq_by_complaint: { palpitations: frequent }
    evidence:
      tier: B
      basis: numeric
      sources: [salbach-bmcem-2025, weber-amjmed-1996, raviele-europace-2011, nhs-atrial-fibrillation, esc-af-2024, esc-syncope-2018, ton-jcdd-2024]
      locator: "Salbach 2025 kết quả; Weber 1996 (theo EHRA 2011); NHS Atrial fibrillation; ESC 2024 mục 3.3; ESC 2018 bảng 6; Ton 2024 tóm tắt"
      reported: "27% người đến cấp cứu vì rung nhĩ là lần đầu phát hiện, tức khoảng 73% đã biết từ trước (Salbach); trong người hồi hộp: rung, cuồng nhĩ 16%, nhịp nhanh trên thất 10%, nhịp nhanh thất 2% (Weber)"
      population: "Khoa cấp cứu ở Đức; trung tâm đại học ở Mỹ"
      note: "Lượt C: hai lượt cùng frequent với Hồi hộp và occasional với Ngất; lệch một mức với Chóng mặt (A occasional, B frequent). Với Hồi hộp, từ 45 tuổi rung, cuồng nhĩ chiếm khoảng một nửa số rối loạn nhịp và khoảng ba phần tư người rung nhĩ đã biết bệnh, nên khoảng 35–50% trả lời 'Có': frequent (tăng khả năng khoảng 12 lần so với tỷ lệ nền 0,04, phù hợp với số liệu). Với Ngất và Chóng mặt, rối loạn nhịp ở người cao tuổi phần lớn là nhịp chậm (ESC 2018), nên chọn occasional như lượt A cho Chóng mặt (ngang nguồn, ước lượng). Áp dụng từ 45 tuổi; cùng cụm heart_history với bệnh tim đã biết. Cần bác sĩ duyệt."
  # ---------- Giai đoạn 3, lô 3 (lượt A): dấu hiệu mới của lô 3 ----------
  - finding: dyspnea_onset
    dist: { sudden: 0.45, hours_days: 0.35, weeks: 0.2 }
    evidence:
      tier: B
      basis: verbal
      sources: [esc-svt-2019, nhs-svt, nhs-atrial-fibrillation, esc-af-2024]
      locator: "ESC 2019 mục 7 (cơn nhịp nhanh khởi phát, kết thúc đột ngột); NHS SVT, Atrial fibrillation"
      note: "Giai đoạn 3 lô 3 (lượt A). Tính trong số người đã khó thở. Cơn nhịp nhanh trên thất, rung nhĩ kịch phát bắt đầu đột ngột, khó thở xuất hiện cùng cơn; rung nhĩ dai dẳng, nhịp chậm có thể làm khó thở khi gắng sức tăng dần nhiều tuần. Ước lượng; tỷ lệ nền 'đột ngột' 0,15."
  - finding: dyspnea_severity
