      locator: "NHS SVT (cơn thường vài phút, có khi vài giờ); NHS Atrial fibrillation"
      note: "Giai đoạn 3 lô 3 (lượt A). Tính trong số người đã đau ngực. Đau, tức ngực kéo dài cùng cơn nhịp nhanh: vài phút đến vài giờ. Ước lượng."
warning_signs: [chest_pain_pressure, breathing_difficulty, fainting_or_near_fainting, confusion, cold_hands_feet, transient_neuro_symptoms]
self_care_vi:
  - "Khi đang hồi hộp mà vẫn tỉnh táo, ngồi hoặc nằm nghỉ, thở chậm."
  - "Nếu có máy đo huyết áp hoặc đồng hồ thông minh, ghi lại mạch lúc đang có cơn."
  - "Hạn chế rượu bia, cà phê, nước tăng lực và thuốc lá."
  - "Không lái xe hay làm việc trên cao khi đang có cơn."
  - "Không tự uống thuốc tim mạch của người khác."
see_doctor_vi:
  - "Đi khám trong 24 giờ để được đo điện tim, tốt nhất là khi đang có cơn."
  - "Gọi 115 hoặc nhờ người đưa đi cấp cứu nếu cơn không dứt, hoặc kèm đau ngực, khó thở, choáng, ngất."
  - "Không tự lái xe đến bệnh viện."
  - "Nếu cơn hay tái lại, bác sĩ có thể cho đeo máy ghi điện tim nhiều ngày (Holter)."
review:
  status: draft
  authors: ["agent:pass-a"]
  updated: "2026-10-31"
  notes_vi: "Giai đoạn 3, lô 3, lượt A phần c (31/10/2026). Không sửa phần đã có (mọi giá trị cũ giữ nguyên; ghi chú của lượt C trước đây xem knowledge/conditions/cardiac_arrhythmia.yaml). Đã thêm: (a) prior Khó thở P4 (trẻ dưới 5 tuổi P6, 5–17 tuổi P5, từ 65 tuổi P3) theo Frese 2011; (b) prior Đau ngực P4 (5–17 tuổi P5, từ 65 tuổi P3) theo Haasenritter 2015; (c) 4 liên kết mới: kiểu khởi phát khó thở (đột ngột 0,45), mức khó thở, khó thở khi nằm occasional, thời gian cơn đau ngực. Không liên kết dấu hiệu chung chest_pain (quyết định của người bảo trì). Liên kết cũ tức nặng giữa ngực (occasional) và khó thở (occasional) dùng chung cho các triệu chứng chính mới. Lượt A phần c đã mở lại hai trang NHS Atrial fibrillation (rà soát 13/01/2025) và SVT (12/06/2024): đau, tức ngực, khó thở, choáng là triệu chứng; kèm các dấu hiệu này thì gọi 999. ESC 2019, ESC 2024 dùng ghi chú đã kiểm tra trong sổ nguồn. Bác sĩ cần xem: prior là ước lượng, chưa có số liệu rối loạn nhịp ở người đau ngực, khó thở tại Việt Nam."
