      sources: [esc-af-2024, nhs-atrial-fibrillation]
      locator: "ESC 2024 mục 3.3; NHS Atrial fibrillation (khó gắng sức)"
      note: "Giai đoạn 3 lô 3 (lượt A). Tính trong số người đã khó thở. Gần với tỷ lệ nền; khó thở lúc nghỉ trong cơn nhịp nhanh hơi nhiều hơn. Ước lượng."
  - finding: orthopnea
    freq: occasional
