      note: "Giai đoạn 3 lô 3 (lượt A). Rung nhĩ hay đi kèm suy tim, nên một phần người bệnh khó thở khi nằm; ước khoảng 20% (tỷ lệ nền 5%), thấp hơn hẳn suy tim. Ước lượng."
  - finding: chest_pain_duration
    dist: { seconds: 0.08, minutes: 0.42, over_15min: 0.4, days: 0.1 }
