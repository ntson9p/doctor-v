notes_vi: "Lượt A đọc tóm tắt qua API Europe PMC. Thuần tập 672 người đau ngực ở phòng khám (Thụy Sĩ), kiểm định ngoài ở 1.212 người (Đức). 71% (201/284) người hội chứng thành ngực có cơn đau tái hiện khi ấn; dấu hiệu này quan trọng nhất nhưng không đặc hiệu tuyệt đối. Sáu dấu hiệu: đau không ở sau xương ức, không đè ép; đau nhói; khu trú rõ; không có tiền sử bệnh mạch vành; bác sĩ không lo ngại; ấn vào đau."
