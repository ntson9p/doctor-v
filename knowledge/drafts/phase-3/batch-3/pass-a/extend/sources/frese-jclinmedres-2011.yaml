notes_vi: "Lượt A (lô 3, phần c) đọc toàn văn PMC3279485 qua API Europe PMC. SESAM 2 (Đức, 93 người) và Transition Project (Hà Lan, 7.855 lượt). Bảng 5, lượt khám đầu vì khó thở mới (n = 3.743): viêm phế quản cấp 24,5%; khó thở chưa rõ nguyên nhân 14,1%; hen 11,0%; thở nhanh do lo âu (tăng thông khí) 7,6%; nhiễm trùng hô hấp trên 6,9%; suy tim 4,1%; viêm thanh khí quản 3,9%; viêm phổi 2,6%; bệnh phổi tắc nghẽn mạn tính 2,2%; bệnh tim thiếu máu cục bộ 1,2%; rung, cuồng nhĩ 0,49%; thuyên tắc phổi 0,35%; thiếu máu thiếu sắt 0,20%; rối loạn nhịp khác 0,15%; nhồi máu cơ tim 0 (SESAM 2: 1/93). Bệnh cấp cứu hiếm gặp ở phòng khám đa khoa."
