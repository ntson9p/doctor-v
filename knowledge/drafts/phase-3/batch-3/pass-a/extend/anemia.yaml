  notes_vi: "Giai đoạn 3, lô 3, lượt A phần c (31/10/2026). Không sửa phần đã có (mọi giá trị cũ giữ nguyên; ghi chú của lượt C trước đây xem knowledge/conditions/anemia.yaml). Đã thêm: (a) prior Khó thở P4 (trẻ dưới 2 tháng P6) theo Frese 2011 và 1832/QĐ-BYT; (b) 2 liên kết mới: mức khó thở (chỉ khi gắng sức 0,8) và kiểu khởi phát khó thở (tăng dần nhiều tuần 0,75). Liên kết cũ hụt hơi khi gắng sức (frequent), da xanh, mệt mỏi dùng chung cho Khó thở. Lượt A phần c đã mở lại 1832/QĐ-BYT (caselaw.vn). Bác sĩ cần xem: (1) prior Khó thở là ước lượng; (2) hụt hơi khi gắng sức và mức khó thở 'chỉ khi gắng sức' hỏi gần cùng một điều, có thể đếm trùng một phần (đề xuất người bảo trì cân nhắc gộp cụm)."
