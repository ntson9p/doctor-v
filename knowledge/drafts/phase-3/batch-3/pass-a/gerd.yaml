  notes_vi: "Lượt A, lô 3 (phần c). Mức xử trí 5, không thuộc nhóm không được bỏ sót (giữ gợi ý): NHS khuyên tự thay đổi lối sống, hỏi dược sĩ, khám bác sĩ không khẩn khi ợ nóng hầu hết các ngày, không đỡ hoặc kèm nuốt vướng, nôn nhiều, sụt cân; VNAGE 2026: thay đổi ăn uống, lối sống là bước đầu, nội soi khi có dấu hiệu báo động. Đau ngực có đặc điểm của bệnh tim do các quy tắc đau ngực xử lý (mức 1–2). Chưa tìm được hướng dẫn trào ngược của Bộ Y tế; VNAGE là hướng dẫn của Hội Tiêu hóa Việt Nam. Prior Đau bụng (P3) làm đổi kết quả Đau bụng đã phát hành: cần chạy bộ dev trước và sau; viêm, loét dạ dày giữ P2 và tách được nhờ ợ chua, nóng rát, liên quan bữa ăn, ho, khàn tiếng. Điểm cần bác sĩ xem: (1) prior Đau ngực dựa trên số liệu châu Âu (3,5–7%), chưa có số liệu ở người đau ngực tại Việt Nam; (2) đau tức giữa ngực frequent khi Đau ngực là ước lượng (Bộ Y tế chỉ mô tả bằng lời); (3) ho có đờm rare là ước lượng; (4) danh mục chưa có câu ợ trớ riêng (trào dịch chua lên miệng) và câu 'đau tăng sau ăn hoặc khi nằm' cho người đau ngực; câu ợ chua hiện có đã gộp hai triệu chứng điển hình nên không đề xuất."
