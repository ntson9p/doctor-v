notes_vi: "Lượt A đọc tóm tắt qua API Europe PMC. 1897 người (966 bóc tách động mạch cổ, 651 nhồi máu não do nguyên nhân khác cùng tuổi, giới, 280 người khỏe): 40,5% người bóc tách động mạch cổ có chấn thương vùng cổ trong tháng trước (88% là nhẹ, như động tác cổ mạnh, nắn cổ), nhiều hơn ở người nhồi máu não do nguyên nhân khác (OR thô 5,6, tức khoảng 11% ở nhóm này). Tác giả đề nghị gọi là 'sự kiện cơ học khởi phát'."
