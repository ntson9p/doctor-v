notes_vi: "Lượt A đọc toàn văn PMC11432014 qua API Europe PMC. Sổ đăng ký chất lượng điều trị đột quỵ RES-Q tại 66 bệnh viện Việt Nam (2017–2023): 94.144 người nhồi máu não hoặc cơn thiếu máu não thoáng qua, 15,1% có rung nhĩ (đã biết từ trước hoặc phát hiện khi nhập viện); người có rung nhĩ lớn tuổi hơn (trung bình 69,5 so với 66,3), đột quỵ nặng hơn, tử vong cao hơn; chỉ 15,8% người rung nhĩ đang dùng thuốc chống đông trước khi bị đột quỵ. Phần mở đầu: tỷ lệ rung nhĩ ở người Việt Nam khoảng 1%."
