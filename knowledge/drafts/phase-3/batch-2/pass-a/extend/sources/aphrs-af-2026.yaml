notes_vi: "Lượt A đọc toàn văn PMC13687576 qua API Europe PMC (phần dịch tễ). Tỷ lệ rung nhĩ ở Việt Nam khoảng 1,0% (Lien 2013, theo bảng dịch tễ châu Á); ở người châu Á bị rung nhĩ, nguy cơ nhồi máu não khoảng 3%/năm (1,6–4,95%); ở người rung nhĩ chưa dùng thuốc chống đông tại Hàn Quốc, Đài Loan khoảng 3,3–3,4%/năm, cao gấp khoảng 3 lần người không rung nhĩ; dẫn sổ đăng ký đột quỵ Việt Nam về dùng thuốc chống đông ở người đột quỵ có rung nhĩ."
