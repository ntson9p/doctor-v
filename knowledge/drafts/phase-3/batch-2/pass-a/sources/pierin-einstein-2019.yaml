notes_vi: "Khoa cấp cứu công ở São Paulo (Brazil): 312 ca tăng huyết áp khẩn cấp, 83 ca cấp cứu, 40 ca giả cơn. Bảng 1, thể khẩn cấp: đau đầu 35,9%, mệt khó chịu 19,1%, đau ngực 17,8%, đau (chỗ khác) 16,4%, chóng mặt 15,8%, buồn nôn 14,1%, khó thở 8,7%, dấu hiệu thần kinh 5,0%; huyết áp lần đo đầu trung bình 197/125 mmHg. Thể cấp cứu: dấu hiệu thần kinh 48,1%, khó thở 27,2%, đau ngực 8,6%, chóng mặt 7,4%, đau đầu 2,5%. Đã có chẩn đoán tăng huyết áp: 33,7% (khẩn cấp), 54,2% (cấp cứu). 57% ca khẩn cấp được cho về, 21% nhập viện."
