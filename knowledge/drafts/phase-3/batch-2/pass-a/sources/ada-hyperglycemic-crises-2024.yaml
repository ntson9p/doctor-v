notes_vi: "Lượt A mở toàn văn trên PMC. Nhiễm toan ceton: khát, tiểu nhiều, sụt cân, nôn, mất nước, thay đổi ý thức; buồn nôn, nôn, đau bụng gặp ở hơn 50%; thở nhanh sâu kiểu Kussmaul và hơi thở mùi trái cây, mùi aceton là đặc trưng; diễn biến trong vài giờ đến vài ngày. Tăng áp lực thẩm thấu: diễn biến vài ngày đến vài tuần, buồn nôn, nôn, đau bụng ít gặp, thường có thay đổi ý thức. Yếu tố khởi phát: nhiễm khuẩn 14–58% ca nhiễm toan ceton và 30–60% ca tăng áp lực thẩm thấu; bỏ insulin 41–60%; đái tháo đường mới phát hiện 17–24% ca nhiễm toan ceton ở Mỹ. Khoảng 10% ca nhiễm toan ceton có đường huyết dưới 200 mg/dL (chủ yếu do thuốc ức chế SGLT2). Tử vong tại viện: nhiễm toan ceton 0,2–1%, tăng áp lực thẩm thấu khoảng 0,8–5%."
