notes_vi: "Lượt A đọc tóm tắt qua API Europe PMC. Nghiên cứu tiến cứu ở 5 bệnh viện Pháp: 496 phụ nữ đau vùng chậu cấp (mức đau trên 4/10), 31 người xoắn phần phụ (6,25%). Năm dấu hiệu độc lập gợi ý xoắn: đau một bên lưng hoặc bụng (aDOR 23,3), không ra khí hư và không ra máu âm đạo (7,0), đau vùng buồng trứng (5,5), đau không chịu nổi (5,0), nôn (3,7)."
