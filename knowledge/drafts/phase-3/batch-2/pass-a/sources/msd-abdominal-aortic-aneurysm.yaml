notes_vi: "Lượt A mở trang (rà soát 12/2024). Tỷ lệ 0,4–7,6% tùy quần thể, ở nam gấp 3 lần nữ, đỉnh 70–80 tuổi; tiền sử gia đình 15–25%; hút thuốc là yếu tố nguy cơ mạnh nhất, cùng tăng huyết áp, xơ vữa. Phần lớn không triệu chứng; phình đang to ra gây đau sâu, liên tục, chủ yếu vùng thắt lưng – cùng; vỡ: đau bụng hoặc lưng, tụt huyết áp, mạch nhanh. Phần lớn người vỡ phình tử vong trước khi tới cơ sở y tế; tới viện còn khoảng 50% tử vong; vỡ phình cần mổ hoặc đặt stent ngay."
