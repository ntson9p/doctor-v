notes_vi: "Rà soát toàn bộ 3/2025. Góc hẹp không có ở người trẻ, hẹp dần theo tuổi; nguy cơ cao hơn khi có tiền sử gia đình, tuổi cao, người châu Á và Inuit. Giãn đồng tử (kể cả do thuốc kháng cholinergic) có thể gây cơn cấp ở người góc hẹp. Cơn cấp: đau mắt dữ dội, mắt đỏ, giảm thị lực, quầng sáng màu quanh đèn, đau đầu, buồn nôn, đôi khi nôn; có người bị nhầm là bệnh thần kinh hoặc tiêu hóa. Phải điều trị ngay vì thị lực có thể mất nhanh và vĩnh viễn; mắt còn lại có khoảng 80% nguy cơ lên cơn nên được làm laser cả hai mắt. Thể từng đợt: cơn tự hết sau vài giờ, thường sau khi ngủ nằm ngửa."
