notes_vi: "Lượt A đọc toàn văn PMC12968706 qua API Europe PMC. 106 người lớn áp xe gan do vi khuẩn có cấy dương tính tại TP. Hồ Chí Minh (2021–2024), 78% do Klebsiella pneumoniae: tuổi trung bình 59,2; nam 67%; đái tháo đường 50% (55% ở nhóm Klebsiella); sốt 81%; đau dưới sườn phải 61%; vàng da 8,5%; nhiễm khuẩn phổi kèm theo 27%; tử vong tại viện 10,4%. Phần mở đầu dẫn tỷ lệ mắc áp xe gan 14–18/100.000 ở châu Á so với 2,3–3,6/100.000 ở châu Âu, châu Mỹ."
