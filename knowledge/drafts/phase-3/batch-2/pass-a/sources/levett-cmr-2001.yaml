notes_vi: "Tổng quan. Bảng 7 (triệu chứng lúc nhập viện ở 8 loạt ca lớn, trong đó Việt Nam 1973, 150 người bệnh thể không vàng da): vàng da 0–95% (Việt Nam 1,5%); đau đầu 70–98% (Việt Nam 98%); đỏ kết mạc 28,5–99% (Việt Nam 42%); nôn 18–69% (Việt Nam 33%); đau cơ 40–100% (Việt Nam 79%); đau bụng 26–43% (Việt Nam 28%); buồn nôn 29–75% (Việt Nam 41%); ho 20–57% (Việt Nam 20%); ho ra máu 9–51%; gan to 15–83%; nổi hạch 19–49% (Việt Nam 21%); tiêu chảy 11–36% (Việt Nam 29%); phát ban 0–7% (Việt Nam 7%). Thể không vàng da: sốt khởi phát đột ngột, có thể hai pha; đau đầu thường dữ dội, giống sốt xuất huyết, kèm đau sau hốc mắt và sợ ánh sáng; đau cơ dữ dội ở thắt lưng, đùi, bắp chân; viêm màng não vô khuẩn ở tới 25% ca; kéo dài khoảng một tuần; tử vong gần như bằng 0. Thể vàng da chiếm 5–10% số người bệnh, diễn biến rất nhanh; suy thận cấp ở 16–40% ca vàng da; tử vong 5–15%."
