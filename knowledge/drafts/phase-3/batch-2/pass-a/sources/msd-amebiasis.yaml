notes_vi: "Lượt A mở trang (rà soát 5/2024). Áp xe gan do amip gặp ở nam nhiều hơn nữ 7–9 lần, chủ yếu người trẻ ở vùng lưu hành (áp xe do vi khuẩn hay gặp ở người lớn tuổi hơn); có thể không có tiền sử lỵ; sốt từng cơn kèm vã mồ hôi, rét run; đau hoặc tức vùng gan, đôi khi lan lên vai phải; vàng da ít gặp và nhẹ; sụt cân, buồn nôn, nôn, mệt; có thể khởi phát âm ỉ; ổ áp xe có thể vỡ vào màng phổi, phổi, màng ngoài tim."
