notes_vi: "Văn bản hành chính, bản trên kcb.vn (19 trang). Tăng huyết áp khi huyết áp tâm thu từ 140 và/hoặc tâm trương từ 90 mmHg; độ 3 khi từ 180 và/hoặc từ 110 mmHg. Thuốc hạ áp đường tĩnh mạch dùng trong tình huống khẩn cấp như tăng huyết áp ác tính, tách thành động mạch chủ, suy thận tiến triển nhanh, sản giật, tăng huyết áp kèm nhồi máu cơ tim cấp hoặc suy tim trái cấp. Phụ lục 2 (quy trình đo): nghỉ trong phòng yên tĩnh ít nhất 5–10 phút trước khi đo; không dùng cà phê, thuốc lá, rượu bia trong 2 giờ trước; đo ít nhất 2 lần, cách nhau 1–2 phút. Theo docs/research/vietnam-sources.md, chưa thấy văn bản thay thế; tuyến xã dùng thêm 5904/QĐ-BYT (2019), chưa mở."
