notes_vi: "Lượt A đọc toàn văn PMC12597153 qua API Europe PMC. 64 trẻ mới chẩn đoán đái tháo đường típ 1 tại Bệnh viện Nhi Trung ương năm 2023: tuổi trung bình 9,1; tỷ lệ mới mắc ở trẻ miền Bắc 0,77/100.000 trẻ (tính tại bệnh viện, có thể thấp hơn thực tế); 57,8% đã nhiễm toan ceton khi được chẩn đoán; mọi trẻ có khát nhiều, tiểu nhiều (89,1% kèm sụt cân); chẩn đoán muộn hay gặp."
