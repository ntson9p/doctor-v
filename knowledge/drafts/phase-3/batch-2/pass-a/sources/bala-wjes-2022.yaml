notes_vi: "Lượt A đọc toàn văn PMC9580452 qua API Europe PMC. Nguyên nhân: tắc mạch do cục máu đông từ tim (khoảng 50%, gần đây còn 25%; gần một nửa người tắc mạch có rung nhĩ), huyết khối trên nền xơ vữa (25–40%; hay có tiền sử đau sau ăn, sụt cân, sợ ăn), không tắc mạch (khoảng 25%), huyết khối tĩnh mạch mạc treo (dưới 10%; chảy máu tiêu hóa 10%). Tỷ lệ mắc tăng theo hàm mũ với tuổi: từ 75 tuổi, gặp nhiều hơn viêm ruột thừa trong số người đau bụng cấp; ở 80 tuổi gấp khoảng 10 lần ở 60 tuổi. Biểu hiện: đau bụng 95%, buồn nôn 44%, nôn 35%, tiêu chảy 35%, đi ngoài ra máu 16%; khoảng 1/3 có đau bụng, sốt và máu ẩn trong phân. Đau bụng dữ dội không tương xứng với khám thì phải coi là thiếu máu mạc treo cho tới khi loại trừ. Tử vong 30–70%; mỗi 6 giờ chậm chẩn đoán làm tử vong tăng gấp đôi."
