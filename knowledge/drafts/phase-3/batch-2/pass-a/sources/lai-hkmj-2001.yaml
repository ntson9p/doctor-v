notes_vi: "72 người bệnh glôcôm góc đóng cấp nguyên phát tại một bệnh viện đại học Hồng Kông (3/1998–2/2000). Tỷ lệ mới mắc 10,4/100.000 người từ 30 tuổi mỗi năm; từ 70 tuổi 58,7/100.000. Nữ có nguy cơ gấp 3,8 lần nam. 23,6% bị nhiễm trùng hô hấp trên và 34,7% dùng thuốc ho trước cơn."
