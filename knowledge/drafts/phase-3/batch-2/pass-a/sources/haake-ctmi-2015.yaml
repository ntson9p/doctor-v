notes_vi: "Tổng quan. Phần lớn nhiễm Leptospira ở vùng lưu hành là nhẹ hoặc không triệu chứng. Dịch lớn xảy ra sau mưa lớn, lũ lụt; chuột là nguồn lây chính, tiếp xúc chuột trong nhà làm tăng nguy cơ (OR 5,29); người trồng lúa là nhóm nguy cơ. Ho khan gặp ở 20–57% người bệnh; phát ban ít gặp; chảy máu gặp ở phần lớn ca nặng; hội chứng xuất huyết phổi nặng tử vong trên 50%. Ủ bệnh trung bình 7–12 ngày (3 ngày đến 1 tháng)."
