notes_vi: "Lượt A đọc tóm tắt qua API Europe PMC. 577 người lớn áp xe gan ở Pakistan: 82% do amip, 18% do vi khuẩn. Áp xe do amip hay gặp ở nam trẻ tuổi, ổ đơn độc ở gan phải, ấn đau; áp xe do vi khuẩn hay gặp từ 50 tuổi, có đái tháo đường, vàng da, dấu hiệu ở phổi, nhiều ổ."
