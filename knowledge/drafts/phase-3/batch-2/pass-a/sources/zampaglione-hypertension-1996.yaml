notes_vi: "Khoa cấp cứu ở Ý, 12 tháng: cơn tăng huyết áp chiếm hơn 1/4 số ca cấp cứu nội khoa (76% khẩn cấp, 24% cấp cứu). Triệu chứng hay gặp nhất ở thể khẩn cấp: đau đầu 22%, chảy máu mũi 17%, choáng ngất 10%, kích động 10%; ở thể cấp cứu: đau ngực 27%, khó thở 22%, dấu hiệu thần kinh khu trú 21%. Tổn thương ở thể cấp cứu: nhồi máu não 24%, phù phổi cấp 23%, bệnh não do tăng huyết áp 16%, xuất huyết não 4,5%. Tuổi trung bình 60 (khẩn cấp) và 67 (cấp cứu). Tăng huyết áp chưa từng được biết ở 28% ca khẩn cấp và 8% ca cấp cứu."
