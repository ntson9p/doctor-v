notes_vi: "Lượt A đọc tóm tắt qua API Europe PMC. 200 đợt cấp liên tiếp ở một bệnh viện tại Atlanta (189 nhiễm toan ceton, 11 tăng áp lực thẩm thấu): đau bụng ở 86/189 người nhiễm toan ceton (46%), liên quan với mức toan nặng chứ không với mức tăng đường huyết hay mất nước; ở 30 người, đau bụng do chính bệnh khởi phát (5 người cần mổ: viêm túi mật, viêm ruột thừa, áp xe...)."
