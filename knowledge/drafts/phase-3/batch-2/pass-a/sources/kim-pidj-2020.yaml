notes_vi: "Khảo sát toàn quốc Hàn Quốc 2015–2017: 15.378 ca Kawasaki; tuổi trung bình lúc chẩn đoán 33 tháng (0–205 tháng); tỷ lệ nam/nữ 1,41; tỷ lệ mới mắc 196,9/100.000 trẻ dưới 5 tuổi mỗi năm; tái phát 4,85%; hay gặp vào mùa đông (tháng 12–1) và cuối xuân (tháng 5–6); 95% được truyền globulin miễn dịch; phình động mạch vành 1,7%."
