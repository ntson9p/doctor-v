notes_vi: "Tổng quan phạm vi về phản ứng tại sẹo tiêm BCG trong bệnh Kawasaki (dưới 18 tuổi). Tỷ lệ báo cáo dao động 11,8–49,9% tùy nghiên cứu (khác nhau theo tuổi, thể điển hình hay không điển hình); hay gặp nhất ở nhũ nhi và trẻ nhỏ, thường xuất hiện sớm trong giai đoạn sốt, có khi trước khi đủ tiêu chuẩn chẩn đoán. Bệnh chủ yếu ở trẻ dưới 5 tuổi, phần lớn trong 2 năm đầu; hướng dẫn Nhật Bản 2020 đưa dấu hiệu này vào tiêu chuẩn hỗ trợ chẩn đoán."
