notes_vi: "164 trẻ viêm não (định nghĩa ca của Hiệp hội Viêm não Quốc tế: rối loạn ý thức từ 24 giờ kèm ít nhất 2 tiêu chí như sốt, co giật, dấu hiệu khu trú) tại Bệnh viện Nhi Đồng 1, TP.HCM. Căn nguyên xác định: viêm não tự miễn kháng thụ thể NMDA 14,0%, vi rút viêm não Nhật Bản 8,5%, vi rút herpes 2,4%; 75% không rõ căn nguyên. Bảng 1: sốt 75,6% (nhóm rõ căn nguyên) và 68,3% (nhóm không rõ); viêm não Nhật Bản sốt 100%, tuổi trung vị 4,5; nhiệt độ cao nhất trung vị 39,0°C; số ngày bệnh trước nhập viện trung vị 4 (3–7); co giật 61,8–65,9% (viêm não Nhật Bản 42,9%); dấu hiệu thần kinh khu trú 18,7–36,6%; tử vong 1,6–2,4%, di chứng 31,7–61%."
