notes_vi: "Lượt A đọc tóm tắt qua API Europe PMC. Hồ sơ bệnh viện tỉnh Thừa Thiên Huế 4/1990–4/1998: 2031 ca áp xe gan do amip, tỷ lệ mắc ít nhất 21/100.000 dân mỗi năm, khác nhau giữa các huyện (theo mật độ dân số); 95% là người lớn, trên 80% là nam; nguy cơ cao hơn vào mùa hè; dùng nước sông là yếu tố nguy cơ nhiễm amip."
