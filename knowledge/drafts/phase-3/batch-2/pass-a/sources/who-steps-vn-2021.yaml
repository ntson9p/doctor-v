notes_vi: "Lượt A đọc bản PDF của báo cáo (URL trả về tệp Viet_Nam_STEP_2021_Report.pdf). Mục kết quả sinh hóa, bảng 39–41 (tr. 35–37): người 18–69 tuổi có đường huyết lúc đói từ 7,0 mmol/L hoặc đang dùng thuốc điều trị đái tháo đường 7,1% (13,4% ở 50–69 tuổi); trong số đó chỉ 34,9% đã từng được chẩn đoán và 23,3% đang được điều trị tại cơ sở y tế."
