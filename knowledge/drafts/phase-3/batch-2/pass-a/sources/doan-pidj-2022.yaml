notes_vi: "Hồi cứu ở bệnh viện nhi San Diego (2001–2019): 20 trẻ gốc Việt trong 978 ca Kawasaki. Ngày chẩn đoán trung vị: ngày 6 (trẻ gốc Việt), 5,5 (trẻ gốc châu Á khác), 7 (trẻ không phải gốc châu Á). Nổi hạch cổ rõ lúc chẩn đoán: 20% (gốc Việt), 40% (châu Á khác), 12,5% (không phải châu Á). Phình động mạch vành 60% ở trẻ gốc Việt so với 27,5%. Phỏng vấn bác sĩ Bệnh viện Nhi Đồng 1 và tổng hợp tài liệu tiếng Việt gợi ý tỷ lệ mắc và mức nặng cao ở trẻ Việt Nam (tóm tắt không có số)."
