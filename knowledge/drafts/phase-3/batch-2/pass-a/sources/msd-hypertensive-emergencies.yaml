notes_vi: "Rà soát toàn bộ 2/2025, cập nhật 4/2026. Tăng huyết áp cấp cứu: huyết áp rất cao (thường tâm thu từ 180 và/hoặc tâm trương từ 120 mmHg) kèm tổn thương cơ quan đích (não, tim mạch, thận); triệu chứng thần kinh thay đổi nhanh (lú lẫn, mù vỏ não thoáng qua, liệt nửa người, co giật), đau ngực, khó thở; cần điều trị đường tĩnh mạch và nhập viện. Tăng huyết áp khẩn cấp (huyết áp rất cao, không có tổn thương cơ quan đích): biến chứng cấp ít xảy ra nên không cần hạ áp ngay; dùng thuốc uống và theo dõi ngoại trú. Lo âu là nguyên nhân hay gặp nhất của tăng huyết áp khẩn cấp."
