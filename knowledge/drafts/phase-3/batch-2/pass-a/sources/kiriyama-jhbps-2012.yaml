notes_vi: "Lượt A đọc toàn văn PMC3429782 qua API Europe PMC. 1432 ca nghi viêm đường mật ở các trung tâm Nhật Bản; 794 ca viêm đường mật (tuổi trung bình 71,7; nam 62%): đủ tam chứng Charcot (đau bụng, sốt hoặc rét run, vàng da) 18,5%; đau bụng 54,8% (48,4% ở người không viêm đường mật). Tam chứng Charcot có độ nhạy 26,4%, độ đặc hiệu 95,9%; y văn trước ghi 50–70%. Tiêu chuẩn chẩn đoán: sốt hoặc rét run (hoặc xét nghiệm viêm), vàng da (hoặc xét nghiệm gan bất thường), hình ảnh giãn hoặc tắc đường mật; đau bụng và tiền sử bệnh đường mật là yếu tố gợi ý."
