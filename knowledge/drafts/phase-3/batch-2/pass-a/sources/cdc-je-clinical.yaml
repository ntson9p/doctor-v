notes_vi: "Trang dành cho nhân viên y tế (cập nhật 19/11/2025). Dưới 1% người nhiễm vi rút có bệnh; viêm não cấp là thể hay được nhận ra nhất. Khởi phát đột ngột với sốt, đau đầu, nôn; vài ngày sau có thể thay đổi ý thức, dấu hiệu thần kinh khu trú, co giật (hay gặp ở trẻ em), hội chứng giống Parkinson, liệt mềm cấp. Tử vong khoảng 20–30%; 30–50% người sống sót có di chứng thần kinh, nhận thức hoặc tâm thần."
