notes_vi: "Trang cho người lao động (cập nhật 03/3/2026). Sốc nhiệt là bệnh do nóng nặng nhất: thân nhiệt có thể lên tới 41°C trong 10–15 phút; triệu chứng lú lẫn, nói lắp, mất ý thức, da nóng khô hoặc ra nhiều mồ hôi, co giật, thân nhiệt rất cao; có thể tử vong nếu chậm điều trị. Xử trí: gọi cấp cứu; đưa vào chỗ mát, có bóng râm, cởi bớt quần áo; làm mát nhanh bằng nước lạnh, khăn ướt lạnh, quạt. Kiệt sức do nóng (mất nước và muối do ra nhiều mồ hôi): đau đầu, buồn nôn, chóng mặt, mệt yếu, cáu gắt, khát, ra nhiều mồ hôi, thân nhiệt tăng, tiểu ít; đưa ra khỏi chỗ nóng, cho uống nước từng ngụm, cởi bớt quần áo, chườm lạnh đầu, mặt, cổ, đưa đi khám. Ngất do nóng: ngất ngắn, chóng mặt, choáng khi đứng lâu hoặc đứng dậy đột ngột; cho ngồi hoặc nằm ở chỗ mát, uống từ từ nước. Chuột rút do nóng: chuột rút, đau cơ ở bụng, tay, chân khi làm việc nặng, ra nhiều mồ hôi."
