notes_vi: "Lượt A đọc toàn văn PMC12403838 qua API Europe PMC. 20 người vỡ phình động mạch chủ bụng bị bỏ sót khi gọi trực ngoài giờ của tuyến ban đầu ở Hà Lan (2013–2023), so với 80 người chứng cùng tuổi, giới, lý do gọi. Tuổi trung vị 66, nữ 25%. Lý do gọi: đau bụng 40%, đau lưng 35%, chóng mặt 10%, còn lại mệt, đau tay, đau chân. Đau bắt đầu dưới 12 giờ 85% (OR 15,2); vã mồ hôi 11/12 người được hỏi (OR 10,1); buồn nôn hoặc nôn 11/16; đau trên 7/10 ở 5/6 người được hỏi; choáng, suýt ngất 3/8; khó thở 3/10; tiền sử phình động mạch chủ 1/6 người được hỏi; 90% có ít nhất một triệu chứng thần kinh tự chủ (tái, buồn nôn, vã mồ hôi)."
