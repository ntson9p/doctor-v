notes_vi: "Giám sát tiến cứu 1.241 người nhiễm trùng thần kinh trung ương ở 13 bệnh viện tỉnh, huyện miền Trung và miền Nam (8/2007–4/2010). Bảng 2: trẻ em (n = 624) có viêm não, viêm màng não do vi rút 432 ca so với viêm màng não vi khuẩn 150 ca; người lớn (n = 617) 209 so với 302. Bảng 7: trong nhóm viêm não, viêm màng não do vi rút, vi rút viêm não Nhật Bản chiếm 33% ở trẻ em và 5% ở người lớn; vi rút herpes 3% và 11%; dengue 3% và 11%; vi rút đường ruột 8% và 10%; còn lại chưa rõ căn nguyên. 81–85% người bệnh sống ở nông thôn."
