notes_vi: "Tổng quan (Malaysia). Bệnh hay gặp ở trẻ dưới 5 tuổi, hiếm sau tuổi này; tỷ lệ mắc ở Đông Bắc Á (Nhật, Hàn, Đài Loan, Trung Quốc) cao gấp 10–30 lần Mỹ, châu Âu. Ban thường xuất hiện ở thân rồi lan ra tay chân. Triệu chứng hô hấp hay gặp: ho 69% và chảy mũi 58% (Đài Loan, tiến cứu); ho 46%, chảy mũi 31%, khạc đờm 15% (Hàn Quốc). Triệu chứng tiêu hóa 38% (Iran) và 6% (Malaysia). Bảng 1 dẫn nghiên cứu ở Bệnh viện Trung ương Huế (Son và cs. 2020, 167 trẻ): phình động mạch vành 29,2%."
