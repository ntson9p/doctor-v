notes_vi: "Lượt A đọc tóm tắt qua API Europe PMC. 87 phụ nữ xoắn buồng trứng được mổ xác nhận ở 2 bệnh viện (1984–1999), 14–82 tuổi (trung bình 32): 12 đang mang thai, 15 đã mãn kinh; 25% từng biết có nang buồng trứng; đau khởi phát đột ngột 59%, đau nhói như dao đâm 70%, lan ra hông, lưng hoặc bẹn 51%; buồn nôn hoặc nôn 70%; sốt rất hiếm (2 người); chỉ 3 người có dấu hiệu viêm phúc mạc; buồng trứng to trên 5 cm ở 89%."
