notes_vi: "Hồi cứu 103 trẻ viêm não, viêm màng não cấp ở Bệnh viện Nhi Trung ương và Bệnh viện Đa khoa Bắc Giang (miền Bắc); 60 ca do vi rút viêm não Nhật Bản (tuổi trung vị 6, từ 0,8 đến 21 tuổi; 12% đã tiêm vắc xin). Bảng 2, nhóm viêm não Nhật Bản: đau đầu 50%, nôn 33%, rối loạn ý thức 97%, co giật 73%, dấu hiệu màng não 68%, dấu hiệu thần kinh khu trú 17%, liệt nửa người 25%, khó thở 17%, mệt 37%, triệu chứng bụng 5%, đau cổ lưng 2%, phát ban 2%; nhiệt độ cao nhất trung vị 38,8°C; số ngày sốt trung vị 2 (1–7). Tử vong 12%, di chứng 10%. Cả hai nhóm hay gặp vào mùa hè, tháng 5–7."
