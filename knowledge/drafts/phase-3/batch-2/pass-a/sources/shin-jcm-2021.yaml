notes_vi: "4.488 người tăng huyết áp khẩn cấp (từ 180/110 mmHg, không tổn thương cơ quan đích cấp) ở khoa cấp cứu một bệnh viện Hàn Quốc. Bảng 1: tuổi trung bình 59; đã biết tăng huyết áp 48,4%; đang dùng thuốc hạ áp 55,4%; đái tháo đường 23,3%; huyết áp lúc phân loại trung bình 186/108 mmHg. Phần bàn luận: nhiều người bệnh chỉ có triệu chứng nhẹ, không đặc hiệu như chóng mặt, đau đầu."
