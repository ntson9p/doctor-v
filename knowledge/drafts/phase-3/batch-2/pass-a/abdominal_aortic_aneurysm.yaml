self_care_vi:
  - "Gọi 115 ngay; nằm yên chờ, không tự lái xe đến viện."
  - "Không ăn uống gì trong lúc chờ, vì có thể phải mổ cấp cứu."
  - "Không tự uống thuốc giảm đau rồi chờ xem cơn đau có qua không."
  - "Nếu đã biết có phình động mạch chủ, báo ngay cho nhân viên cấp cứu."
see_doctor_vi:
  - "Người từ 60 tuổi đau bụng hoặc đau lưng đột ngột, dữ dội cần đi cấp cứu ngay, kể cả khi từng bị sỏi thận."
  - "Người đã biết có phình động mạch chủ cần tái khám, siêu âm theo đúng hẹn của bác sĩ."
review:
  status: draft
  authors: ["agent:pass-a"]
  updated: "2026-10-26"
  notes_vi: "Lượt A. Mức 1, không được bỏ sót, như gợi ý: NHS khuyên gọi 999 khi đau bụng hoặc lưng đột ngột dữ dội, da tái xám, mất ý thức; MSD: vỡ phình cần mổ hoặc đặt stent ngay, phần lớn tử vong trước khi tới viện. Bệnh gồm cả phình có triệu chứng chưa vỡ (mã I71.4) vì triệu chứng giống nhau và đều cần chuyển viện khẩn; mã chính ghi I71.3 (vỡ), chưa đối chiếu được bảng ICD-10 của Bộ Y tế vì icd.kcb.vn đã chuyển sang medsen.vn và không truy cập tự động được. MONDO tra qua EBI OLS. Điểm cần xem: (1) prior là ước lượng từ tỷ lệ phình ở người châu Á (Chan 2021) và tỷ lệ vỡ ở phương Tây, chưa có số liệu Việt Nam; (2) tần suất triệu chứng chủ yếu từ hai tổng quan ở bệnh viện (Azhar 2014, Fernando 2022) và một nghiên cứu nhỏ ở tuyến ban đầu (20 ca, van den Dries 2025); (3) đau lan xuống bẹn, vị trí đau, hoàn cảnh ngất, mạch là ước lượng; (4) không liên kết đau quặn từng cơn (MSD tả đau liên tục nhưng không có số liệu; để tỷ lệ nền) và tiểu ra máu, sốt (không có nguồn); (5) ca dev d-from-h-syncope-017 (người bảo trì sẽ đổi bệnh đúng sang bệnh này) có tiền sử sỏi thận: câu này không liên kết nên giữ tỷ lệ nền, nhưng làm cơn đau quặn thận tăng 10 lần khi triệu chứng chính là Đau bụng; (6) StatPearls và hướng dẫn ESVS 2024 không mở được (bị chặn), nên chưa dùng."
