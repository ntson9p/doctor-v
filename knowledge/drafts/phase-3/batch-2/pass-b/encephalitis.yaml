id: encephalitis
names:
  vi: "Viêm não cấp"
  vi_common: ["Viêm não"]
  en: "Acute encephalitis"
codes:
  icd10: "A86"
  icd10_verified: false
summary_vi:
  - "Tình trạng viêm cấp ở não, phần lớn do vi rút, như vi rút viêm não Nhật Bản hoặc vi rút herpes."
  - "Thường khởi đầu bằng sốt, đau đầu, nôn; sau đó lơ mơ, lú lẫn, co giật hoặc yếu liệt."
  - "Đây là bệnh cấp cứu, cần được điều trị tại bệnh viện càng sớm càng tốt."
urgency: 1
cant_miss: true
specialties: [emergency, infectious_disease, neurology, pediatrics]
priors:
  - complaint: fever
    default: P6
    by_age: { child_2m_5y: P5, child_5_12: P5 }
    evidence:
      tier: B
      basis: judgment
      sources: [brindle-bmcinfectdis-2023, hodangtrung-plosone-2012, huong-ofid-2024, byt-qd-3312-2015]
      locator: "Brindle 2023 phần Results (tỷ suất toàn quốc); Ho Dang Trung 2012 bảng 2–4; Huong 2024 phần Results; 3312/QĐ-BYT (2015) bài Viêm não, mục 2 (tr. 489)"
      reported: "Hội chứng viêm não cấp toàn quốc giảm từ 3,0 xuống 1,1 ca/100.000 dân/năm (1998–2016), cao nhất ở các tỉnh Tây Bắc; ở 13 bệnh viện tỉnh miền Trung, miền Nam: trẻ em viêm não, viêm màng não do vi rút 69% so với viêm màng não vi khuẩn 24% (vi rút viêm não Nhật Bản 23%), người lớn 34% so với 49%"
      note: "Với vài ca trên 100.000 dân mỗi năm so với hàng chục nghìn lượt sốt, tính tuyệt đối thì dưới 0,02% người sốt là viêm não (P6). Tuy vậy ở bệnh viện tỉnh, trẻ em viêm não, viêm màng não do vi rút nhiều gấp khoảng 3 lần viêm màng não vi khuẩn (đang để P5 ở trẻ 2 tháng–5 tuổi), và viêm não Nhật Bản tập trung ở trẻ 2–8 tuổi (3312/QĐ-BYT). Để giữ đúng thứ tự giữa hai bệnh cùng không được bỏ sót, chọn P5 cho trẻ 2 tháng–12 tuổi (mức an toàn hơn); người lớn ít gặp hơn viêm màng não vi khuẩn nên giữ P6. Lượt B thử P6 cho trẻ em: trẻ 6 tuổi sốt kèm lú lẫn, li bì bị xếp sau sốt xuất huyết trong danh sách cần loại trừ. Ở bệnh viện nhi tuyến cuối, viêm não tự miễn (thường không sốt) chiếm phần đáng kể (Huong 2024); bệnh ở đây chủ yếu đại diện cho viêm não nhiễm trùng. Cần bác sĩ duyệt."
  - complaint: headache
    default: P5
    by_age: { child_2m_5y: P6 }
    evidence:
      tier: B
      basis: judgment
      sources: [ngan-bmcinfectdis-2024, hodangtrung-plosone-2012, byt-qd-5642-2015]
      locator: "Ngan 2024 phần Introduction và bảng 1; Ho Dang Trung 2012 bảng 2; 5642/QĐ-BYT bài Viêm não do vi rút Herpes simplex, mục 1, 3.1 (tr. 13)"
      reported: "Viêm não do herpes khoảng 3% nhiễm trùng thần kinh trung ương nghi ngờ ở người lớn Việt Nam; ở người lớn, viêm não, viêm màng não do vi rút 34% so với viêm màng não vi khuẩn 49%"
      note: "Người lớn viêm não (nhất là do herpes, tản phát, không theo mùa) thường khởi đầu bằng sốt, đau đầu (5642/QĐ-BYT) nên có thể chọn Đau đầu làm triệu chứng chính. Ở người lớn, viêm não ít hơn viêm màng não vi khuẩn khoảng 1,5–2 lần (gộp cả viêm màng não do vi rút trong 34%); viêm màng não vi khuẩn đang để P5 cho Đau đầu, nên viêm não ở giữa P5 và P6, chọn P5 (mức an toàn hơn). Lượt B thử P6: người 50 tuổi đau đầu kèm lú lẫn không có viêm não trong danh sách cần loại trừ. Trẻ dưới 5 tuổi ít khi chọn Đau đầu: P6. Câu sốt, lú lẫn được hỏi bắt buộc nên sẽ tách nhóm này. Cần bác sĩ duyệt."
prior_modifiers:
  - when: { regions: [north], months: [5, 6, 7] }
    factor: 1.5
    evidence:
      tier: B
      basis: judgment
      sources: [brindle-bmcinfectdis-2023, byt-qd-3312-2015, cdc-yellow-book-japanese-encephalitis]
      locator: "Brindle 2023 phần Results và Discussion; 3312/QĐ-BYT (2015) bài Viêm não, mục 2; CDC Yellow Book phần Epidemiology"
      reported: "Ở miền Bắc, viêm não cấp đạt đỉnh vào các tháng hè; tháng cao nhất (6/2004) chiếm 0,8/100.000 trong một tháng so với 2–3/100.000 cả năm; viêm não Nhật Bản gây dịch tháng 5–7"
      note: "Riêng tháng 6/2004 đã chiếm khoảng một phần ba số ca cả năm toàn quốc, chủ yếu do miền Bắc. Đỉnh mùa này chủ yếu do viêm não Nhật Bản ở trẻ em; hệ số áp dụng cho mọi tuổi, còn ở người lớn viêm não chủ yếu do herpes, không theo mùa. Lượt B thử 2,5 trên bộ dev: người lớn 52 tuổi sốt kèm cứng gáy ở miền Bắc tháng 6 có viêm não xếp ngang viêm màng não vi khuẩn, không hợp lý; nên chọn 1,5. Miền Nam tương đối đều quanh năm nên không có hệ số."
  - when: { regions: [north], months: [11, 12, 1, 2, 3] }
    factor: 0.6
    evidence:
      tier: B
      basis: judgment
      sources: [brindle-bmcinfectdis-2023, byt-qd-3312-2015]
      locator: "Brindle 2023 phần Results; 3312/QĐ-BYT (2015) bài Viêm não, mục 2"
      note: "Ở miền Bắc, mùa đông lạnh, khô, ít muỗi; viêm não cấp tăng từ tháng 3 đến tháng 8 (3312/QĐ-BYT). Giữ 0,6 (không thấp hơn) vì viêm não do herpes và các vi rút khác vẫn gặp quanh năm."
findings:
  - finding: fever
    freq: very_frequent
    evidence:
      tier: B
      basis: numeric
      sources: [ngan-bmcinfectdis-2024, zhang-fneurol-2023, kakoti-biomedres-2013, huong-ofid-2024]
      locator: "Ngan 2024 bảng 1; Zhang 2023 bảng 1; Kakoti 2013 bảng 2; Huong 2024 bảng 1"
      reported: "Sốt 100% (viêm não do herpes, người lớn Việt Nam); 100% (viêm não Nhật Bản); 70% toàn bộ trẻ viêm não ở Bệnh viện Nhi Đồng 1 (gồm cả viêm não tự miễn)"
      note: "Chỉ có tác dụng khi triệu chứng chính là Đau đầu. Không chọn almost_always vì viêm não tự miễn và giai đoạn sớm có thể không sốt, người bệnh có thể đã dùng thuốc hạ sốt."
  - finding: headache
    freq: very_frequent
    freq_by_age: { child_2m_5y: occasional, child_5_12: frequent }
    evidence:
      tier: B
      basis: numeric
      sources: [byt-qd-5642-2015, byt-qd-3312-2015, cdc-yellow-book-japanese-encephalitis, zhang-fneurol-2023, kakoti-biomedres-2013]
      locator: "5642/QĐ-BYT bài Viêm não do Herpes, mục 3.1; 3312/QĐ-BYT (2015) bài Viêm não, mục 3.2.1; CDC Yellow Book phần Clinical Presentation; Zhang 2023 bảng 1; Kakoti 2013 bảng 2"
      reported: "Đau đầu lúc nhập viện: người lớn viêm não Nhật Bản 64,4%, trẻ em 46,8%; trẻ em Ấn Độ 41,8%"
      note: "Chỉ có tác dụng khi triệu chứng chính là Sốt (tỷ lệ nền 0,7). Số liệu nhập viện thấp hơn thực tế vì nhiều người đã lơ mơ, không kể được; CDC và 5642/QĐ-BYT đều nêu bệnh khởi đầu bằng sốt, đau đầu. Người lớn very_frequent; trẻ 5–12 tuổi frequent; trẻ dưới 5 tuổi khó kể đau đầu (3312: quấy khóc, kích thích) nên occasional."
  - finding: confusion
    freq: very_frequent
    evidence:
      tier: B
      basis: numeric
      sources: [ngan-bmcinfectdis-2024, kakoti-biomedres-2013, zhang-fneurol-2023, huong-ofid-2024, nhs-encephalitis]
      locator: "Ngan 2024 bảng 1; Kakoti 2013 bảng 2; Zhang 2023 bảng 1; Huong 2024 phần Methods (định nghĩa ca); NHS Encephalitis"
      reported: "Rối loạn ý thức 95,5% (herpes, người lớn Việt Nam); rối loạn tri giác 83,6% (viêm não Nhật Bản, trẻ em); 68,2% (viêm não Nhật Bản, Trung Quốc)"
      note: "Rối loạn tri giác là tiêu chuẩn chính của định nghĩa ca viêm não, không phải biến chứng, nên không hạ mức như dấu hiệu của ca nặng. Người dùng hỏi ở giai đoạn khởi phát (chỉ sốt, đau đầu, nôn) sẽ chưa có dấu hiệu này; khi đó app không nhận ra được bệnh, và lời dặn theo dõi tri giác nằm ở phần đi khám. Câu hỏi chỉ hỏi từ 5 tuổi. Có lú lẫn thì quy tắc mức 1 đã áp dụng."
  - finding: drowsy_hard_to_wake
    freq: frequent
    freq_by_age: { child_2m_5y: very_frequent }
    evidence:
      tier: B
      basis: numeric
      sources: [byt-qd-3312-2015, kakoti-biomedres-2013, huong-ofid-2024]
      locator: "3312/QĐ-BYT (2015) bài Viêm não, mục 3.2.2; Kakoti 2013 phần Results; Huong 2024 bảng 1"
      reported: "Glasgow từ 8 trở xuống ở 40,3% trẻ viêm não Nhật Bản; Glasgow trung vị 8 (viêm não Nhật Bản) và 7 (herpes) ở trẻ em Việt Nam"
      note: "3312/QĐ-BYT: rối loạn tri giác từ ngủ gà, li bì, lơ mơ đến hôn mê. Ở trẻ dưới 5 tuổi không hỏi câu lú lẫn, nên li bì là dấu hiệu rối loạn tri giác chính: very_frequent. Cùng cụm với lú lẫn."
  - finding: seizure_recent
    freq: occasional
    freq_by_age: { child_2m_5y: frequent, child_5_12: frequent }
    evidence:
      tier: B
      basis: numeric
      sources: [ngan-bmcinfectdis-2024, zhang-fneurol-2023, kakoti-biomedres-2013, huong-ofid-2024, byt-qd-3312-2015, cdc-yellow-book-japanese-encephalitis]
      locator: "Ngan 2024 bảng 1; Zhang 2023 bảng 1; Kakoti 2013 bảng 2; Huong 2024 bảng 1; 3312/QĐ-BYT (2015) mục 3.2.2; CDC Yellow Book"
      reported: "Co giật: người lớn 20% (viêm não Nhật Bản), 36,4% (herpes, Việt Nam); trẻ em 54,8% (Trung Quốc), 82,1% (Ấn Độ), khoảng 63% toàn bộ trẻ viêm não ở Bệnh viện Nhi Đồng 1"
      note: "3312/QĐ-BYT: thường có co giật; CDC: co giật hay gặp, nhất là trẻ em. Trẻ em frequent (giữa các số liệu bệnh viện, đã tính phần ca nhẹ ở cộng đồng); thiếu niên và người lớn occasional. Với Sốt, tỷ lệ nền co giật chỉ 0,2% nên trả lời 'Có' làm tăng mạnh khả năng bệnh; trẻ dưới 5 tuổi co giật khi sốt đã ở mức 2 theo quy tắc dấu hiệu nguy hiểm chung."
  - finding: vomiting
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [zhang-fneurol-2023, kakoti-biomedres-2013, byt-qd-3312-2015, cdc-yellow-book-japanese-encephalitis]
      locator: "Zhang 2023 bảng 1; Kakoti 2013 bảng 2; 3312/QĐ-BYT (2015) mục 3.2.1; CDC Yellow Book"
      reported: "Buồn nôn, nôn 16,8% (Trung Quốc); nôn 29,9% (trẻ em Ấn Độ)"
      note: "Bệnh thường bắt đầu bằng sốt, đau đầu, nôn (CDC); số liệu bệnh viện 17–30%."
  - finding: neck_stiffness
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [ngan-bmcinfectdis-2024, kakoti-biomedres-2013, byt-qd-5642-2015]
      locator: "Ngan 2024 bảng 1; Kakoti 2013 bảng 2; 5642/QĐ-BYT bài Viêm não do Herpes, mục 3.1"
      reported: "Dấu hiệu màng não khi bác sĩ khám: 86,4% (herpes, người lớn), 55,2% (viêm não Nhật Bản, trẻ em)"
      note: "Số liệu là bác sĩ khám ở bệnh viện; người dùng tự nhận biết cứng gáy kém hơn nhiều, nên hạ còn occasional. Giữ thấp hơn viêm màng não vi khuẩn (frequent ở người lớn) để sốt kèm cứng gáy mà tỉnh táo vẫn nghiêng về viêm màng não. Có cứng gáy thì quy tắc mức 2 đã áp dụng."
  - finding: es_stroke_signs
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [huong-ofid-2024, ngan-bmcinfectdis-2024, zhang-fneurol-2023, nhs-encephalitis]
      locator: "Huong 2024 bảng 1; Ngan 2024 bảng 1; Zhang 2023 bảng 1; NHS Encephalitis"
      reported: "Dấu thần kinh khu trú 23% toàn bộ trẻ viêm não (50% ở viêm não Nhật Bản); rối loạn ngôn ngữ 19,7%, liệt nửa người 7,6% (herpes); yếu chi 5,6% (viêm não Nhật Bản, Trung Quốc)"
      note: "Câu hỏi gộp méo miệng, yếu một bên, nói khó; NHS nêu khó nói, yếu là triệu chứng nặng của viêm não. Trả lời 'Có' ở màn sàng lọc đã dừng ở mức 1."
  - finding: fever_max_temp
    dist: { lt_38: 0.08, t38_39: 0.32, ge_39: 0.60 }
    evidence:
      tier: B
      basis: numeric
      sources: [byt-qd-3312-2015, huong-ofid-2024]
      locator: "3312/QĐ-BYT (2015) bài Viêm não, mục 3.2.1; Huong 2024 bảng 1"
      reported: "Sốt đột ngột, liên tục 39–40°C, có khi không cao; nhiệt độ cao nhất trung vị 39,0°C (viêm não Nhật Bản) và 39,4°C (herpes)"
      note: "Phân bố trong số người có sốt; ước lượng từ trung vị khoảng 39°C."
  - finding: fever_duration
    dist: { d1_2: 0.35, d3_5: 0.45, d6_7: 0.12, gt_7d: 0.08 }
    evidence:
      tier: B
      basis: numeric
      sources: [ngan-bmcinfectdis-2024, huong-ofid-2024, kakoti-biomedres-2013, cdc-yellow-book-japanese-encephalitis]
      locator: "Ngan 2024 phần Results; Huong 2024 bảng 1; Kakoti 2013 phần Results; CDC Yellow Book"
      reported: "Từ khởi bệnh đến nhập viện trung vị 5,5 ngày (herpes), 4–5 ngày (trẻ em), trung bình 5,4 ngày (Ấn Độ)"
      note: "Phân bố theo thời điểm người dùng hỏi: giai đoạn khởi phát vài ngày rồi xuất hiện dấu hiệu thần kinh; người dùng hỏi sớm hơn lúc nhập viện. Ước lượng."
  - finding: headache_severity
    dist: { mild: 0.08, moderate: 0.32, severe: 0.60 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-5642-2015, nhs-encephalitis]
      locator: "5642/QĐ-BYT bài Viêm não do Herpes, mục 3.1; NHS Encephalitis"
      note: "Nguồn không có tỷ lệ; bệnh cấp tính, nặng dần, nên lệch về đau nhiều. Ước lượng như viêm màng não."
  - finding: headache_course
    dist: { first_time: 0.90, recurrent_similar: 0.06, progressive: 0.04 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-5642-2015, byt-qd-3312-2015]
      locator: "5642/QĐ-BYT mục 3.1 (khởi phát đột ngột); 3312/QĐ-BYT (2015) mục 3.2"
      note: "Bệnh cấp tính, khởi phát đột ngột, nên phần lớn là đau đầu kiểu mới. Ước lượng."
  - finding: headache_duration
    dist: { lt_4h: 0.08, h4_72: 0.62, gt_3d: 0.30 }
    evidence:
      tier: B
      basis: judgment
      sources: [ngan-bmcinfectdis-2024, cdc-yellow-book-japanese-encephalitis]
      locator: "Ngan 2024 phần Results; CDC Yellow Book"
      note: "Dấu hiệu thần kinh xuất hiện sau vài ngày khởi phát; ước lượng theo thời gian từ khởi bệnh đến nhập viện."
  - finding: headache_location
    dist: { one_side: 0.10, both_sides: 0.15, forehead_face: 0.15, back_neck: 0.15, whole_head: 0.45 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-5642-2015]
      locator: "5642/QĐ-BYT bài Viêm não do Herpes, mục 3.1"
      note: "Nguồn không mô tả vị trí đau; ước lượng đau lan tỏa như viêm màng não, giữ một phần đau một bên vì tổn thương do herpes thường ở thùy thái dương một bên."
warning_signs:
  - confusion
  - drowsy_hard_to_wake
  - seizure_recent
  - es_unresponsive_or_seizing
  - es_stroke_signs
  - neck_stiffness
  - breathing_difficulty
self_care_vi:
  - "Không tự điều trị tại nhà và không chờ xem có đỡ không."
  - "Trong lúc chờ xe cấp cứu, đặt người bệnh nằm nghiêng nếu lơ mơ hoặc co giật."
  - "Không cho ăn uống và không nhét bất cứ vật gì vào miệng người đang co giật."
  - "Phòng bệnh: tiêm đủ vắc xin viêm não Nhật Bản theo lịch tiêm chủng, ngủ màn và diệt muỗi."
see_doctor_vi:
  - "Gọi 115 ngay nếu sốt kèm lơ mơ, lú lẫn, co giật, nói khó hoặc yếu tay chân."
  - "Nếu mới sốt, đau đầu, nôn mà vẫn tỉnh táo, đi khám ngay trong ngày."
  - "Theo dõi sát: người bệnh ngủ li bì, khó đánh thức hoặc nói năng lẫn lộn thì gọi 115."
proposed_findings:
  - id: behavior_change_new
    kind: sign
    type: binary
    label_vi: "Mới thay đổi tính tình, hành vi lạ"
    question_vi: "Mấy ngày nay có thay đổi tính tình, nói năng, hành vi lạ không?"
    help_vi: "Ví dụ hay quên, nói lẫn lộn, cáu gắt hoặc làm những việc khác hẳn thường ngày."
    leak: specific
    notes_vi: "5642/QĐ-BYT (viêm não do herpes: thay đổi tính cách, mất trí nhớ), NHS Encephalitis (thay đổi tính cách là triệu chứng nặng); Ngan 2024: rối loạn hành vi 13,6%, rối loạn trí nhớ 31,8% ở người lớn viêm não do herpes. Giúp nhận ra viêm não ở người lớn trước khi lơ mơ; câu lú lẫn hiện tại chỉ hỏi lú lẫn, không nhận ra người quen. Nếu được thêm: viêm não frequent ở người lớn."
