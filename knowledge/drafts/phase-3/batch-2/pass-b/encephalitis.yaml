  notes_vi: "Lượt B (Giai đoạn 3, lô 2, phần b). Mức xử trí 1, không được bỏ sót, giữ như gợi ý: NHS Encephalitis khuyên gọi 999 khi có triệu chứng nặng (lú lẫn, co giật, thay đổi tính cách, khó nói, yếu, mất ý thức); 3312/QĐ-BYT và 5642/QĐ-BYT: bệnh khởi phát cấp, diễn biến nặng, tử vong và di chứng cao, cần điều trị sớm. Bệnh gộp viêm não do vi rút (viêm não Nhật Bản, herpes, enterovirus) vì cách xử trí tại nhà như nhau; viêm não tự miễn (thường không sốt) chưa được mô tả riêng. Mã ICD-10 A86 (viêm não do vi rút không đặc hiệu) chưa đối chiếu được với bộ mã của Bộ Y tế; các mã cụ thể: A83.0 (viêm não Nhật Bản), B00.4 (viêm não do herpes), G04. Điểm cần bác sĩ xem: (1) prior là ước lượng từ tỷ suất mắc toàn quốc, không có số liệu ở người đi khám vì sốt; (2) tần suất triệu chứng lấy từ người bệnh nằm viện (Việt Nam, Trung Quốc, Ấn Độ); lú lẫn để very_frequent vì là tiêu chuẩn định nghĩa ca, nên người hỏi ở giai đoạn khởi phát (chưa lơ mơ) sẽ bị xếp thấp; (3) chưa có câu hỏi về tiêm vắc xin viêm não Nhật Bản, thay đổi tính cách, rối loạn trí nhớ (gợi ý viêm não do herpes ở người lớn); (4) liên kết đau đầu very_frequent ở người lớn cao hơn số liệu nhập viện (64%) vì người hôn mê không kể được đau đầu."
