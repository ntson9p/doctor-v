id: heat_stroke
names:
  vi: "Sốc nhiệt"
  vi_common: ["Say nóng thể nặng", "Say nắng thể nặng"]
  en: "Heat stroke"
codes:
  icd10: "T67.0"
  icd10_verified: false
summary_vi:
  - "Cấp cứu do thân nhiệt tăng quá cao khi ở nơi nắng nóng hoặc gắng sức, làm tổn thương não và nhiều cơ quan."
  - "Dấu hiệu chính là lú lẫn, nói lắp, đi loạng choạng, co giật hoặc mê man; da rất nóng, có thể không ra mồ hôi."
  - "Cần gọi 115 và làm mát người bệnh ngay trong lúc chờ."
urgency: 1
cant_miss: true
specialties: [emergency]
priors:
  - complaint: fever
    default: P6
    by_age: { elder_65_74: P5, elder_75p: P5 }
    evidence:
      tier: B
      basis: judgment
      sources: [mori-scirep-2026, kuo-bmcpublichealth-2025, msd-heatstroke]
      locator: "Mori 2026 phần Results (mức độ, tuổi); Kuo 2025 phần Discussion; MSD Heatstroke (thể cổ điển, thể gắng sức)"
      reported: "Ở Nhật Bản, trong số người bệnh do nóng được xe cấp cứu chở đi: 2,4% nặng (nằm viện trên 3 tuần), 33% cần nằm viện, 63,5% nhẹ; người từ 65 tuổi chiếm 50,7%"
      note: "Sốc nhiệt thật sự (rối loạn thần kinh trung ương, thân nhiệt trên 40°C) chỉ chiếm vài phần trăm bệnh do nóng, tức khoảng 1/20–1/50 so với kiệt sức do nóng (để P5 ở Sốt); trong số người sốt chỉ dưới 0,02%: P6. Thể cổ điển gặp chủ yếu ở người cao tuổi, người có bệnh nền khi nắng nóng kéo dài (MSD), và người từ 65 tuổi chiếm một nửa số ca phải chở cấp cứu (Mori 2026): P5 từ 65 tuổi. Người bị sốc nhiệt thường lơ mơ, nên người hỏi thường là người nhà và có thể chọn Sốt. Cần bác sĩ duyệt."
  - complaint: headache
    default: P6
    evidence:
      tier: B
      basis: judgment
      sources: [mori-scirep-2026, msd-heatstroke, nhs-heat-exhaustion-heatstroke]
      locator: "Mori 2026 phần Results; MSD Heatstroke; NHS Heat exhaustion and heatstroke"
      note: "Đau đầu là triệu chứng của giai đoạn kiệt sức do nóng trước khi chuyển thành sốc nhiệt; khi đã sốc nhiệt, người bệnh ít khi tự kể đau đầu. Rất hiếm trong số người đi khám vì đau đầu: P6."
  - complaint: dizziness
    default: P6
    evidence:
      tier: B
      basis: judgment
      sources: [mori-scirep-2026, msd-heatstroke]
      locator: "Mori 2026 phần Results; MSD Heatstroke (đi loạng choạng có thể là dấu hiệu sớm)"
      note: "Chóng mặt, đi loạng choạng có thể là dấu hiệu sớm; rất hiếm trong số người chóng mặt: P6."
  - complaint: syncope
    default: P6
    by_age: { elder_65_74: P5, elder_75p: P5 }
    evidence:
      tier: B
      basis: judgment
      sources: [mori-scirep-2026, nhs-heat-exhaustion-heatstroke, msd-heatstroke]
      locator: "Mori 2026 phần Results; NHS (mất ý thức là dấu hiệu sốc nhiệt)"
      note: "Gục ngã, mất ý thức sau khi ở nơi nóng có thể là sốc nhiệt; phần lớn ngất do nóng là ngất phản xạ hoặc kiệt sức do nóng. Người từ 65 tuổi nguy cơ cao hơn (Mori 2026, MSD): P5."
prior_modifiers:
  - when: { regions: [north], months: [5, 6, 7, 8] }
    factor: 2
    evidence:
      tier: B
      basis: judgment
      sources: [kuo-bmcpublichealth-2025, mori-scirep-2026, brindle-bmcinfectdis-2023]
      locator: "Kuo 2025 phần Results (67,9% vào tháng 6–8); Mori 2026 (đỉnh tháng 7–8); Brindle 2023 (khí hậu theo vĩ độ)"
      note: "Như kiệt sức do nóng: bệnh do nóng tập trung vào mùa hè ở vùng có mùa đông; miền Bắc Việt Nam có mùa hè nóng ẩm, mùa đông lạnh. Miền Nam nóng quanh năm nên không có hệ số."
  - when: { regions: [north], months: [11, 12, 1, 2] }
    factor: 0.2
    evidence:
      tier: B
      basis: judgment
      sources: [kuo-bmcpublichealth-2025, brindle-bmcinfectdis-2023]
      locator: "Kuo 2025 phần Results; Brindle 2023 phần Results"
      note: "Mùa đông ở miền Bắc lạnh; sốc nhiệt vẫn có thể gặp khi gắng sức nặng trong môi trường nóng, nên không thấp hơn 0,2."
findings:
  - finding: heat_exposure
    freq: almost_always
    evidence:
      tier: B
      basis: verbal
      sources: [who-bec-2018, msd-heatstroke, nhs-heat-exhaustion-heatstroke]
      locator: "WHO BEC Module 5 (sốc nhiệt: phơi nóng, nắng kéo dài); MSD Heatstroke (chẩn đoán thường rõ nhờ hoàn cảnh gắng sức, nóng)"
      note: "Bệnh do định nghĩa là hậu quả của nóng hoặc gắng sức nơi nóng. Không có phơi nhiễm thì gần như loại trừ; sốt kèm lú lẫn khi đó nghĩ nhiễm trùng (WHO BEC)."
  - finding: confusion
    freq: very_frequent
    evidence:
      tier: B
      basis: verbal
      sources: [msd-heatstroke, who-bec-2018, nhs-heat-exhaustion-heatstroke]
      locator: "MSD Heatstroke (rối loạn thần kinh trung ương là dấu hiệu chủ chốt); WHO BEC Module 5; NHS (lú lẫn, mất phối hợp)"
      note: "Rối loạn tri giác là tiêu chuẩn phân biệt với kiệt sức do nóng; có thể biểu hiện bằng lú lẫn, hành vi lạ, mê sảng, co giật hoặc hôn mê (MSD). Không chọn almost_always vì một phần biểu hiện bằng li bì, hôn mê hoặc co giật, và câu lú lẫn chỉ hỏi từ 5 tuổi."
  - finding: drowsy_hard_to_wake
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [msd-heatstroke, nhs-heat-exhaustion-heatstroke]
      locator: "MSD Heatstroke (mê sảng, hôn mê); NHS (mất ý thức)"
      note: "Không có tỷ lệ; ước khoảng một nửa. Cùng cụm với lú lẫn."
  - finding: seizure_recent
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [msd-heatstroke, nhs-heat-exhaustion-heatstroke]
      locator: "MSD Heatstroke; NHS (co giật)"
      note: "Nguồn nêu co giật trong các biểu hiện thần kinh; không có tỷ lệ. Ước lượng."
  - finding: fever
    freq: very_frequent
    evidence:
      tier: B
      basis: verbal
      sources: [msd-heatstroke, who-bec-2018, nhs-heat-exhaustion-heatstroke]
      locator: "MSD (thân nhiệt trên 40°C); WHO BEC (thân nhiệt cao, da rất nóng); NHS (thân nhiệt rất cao)"
      note: "Có tác dụng khi triệu chứng chính không phải Sốt. Người nhà có thể chưa đo nhiệt độ nhưng sờ thấy da rất nóng; không chọn almost_always vì có người đã được làm mát trước khi hỏi."
  - finding: fever_max_temp
    dist: { lt_38: 0.03, t38_39: 0.12, ge_39: 0.85 }
    evidence:
      tier: B
      basis: verbal
      sources: [msd-heatstroke]
      locator: "MSD Heatstroke (thân nhiệt trung tâm trên 40°C)"
      note: "Phân bố trong số người có sốt; nhiệt độ đo ở nách hoặc sau khi đã làm mát có thể thấp hơn nhiệt độ trung tâm. Ước lượng."
  - finding: fever_duration
    dist: { d1_2: 0.85, d3_5: 0.12, d6_7: 0.02, gt_7d: 0.01 }
    evidence:
      tier: B
      basis: verbal
      sources: [msd-heatstroke]
      locator: "MSD Heatstroke (thể gắng sức khởi phát trong vài giờ, thể cổ điển trong 2–3 ngày)"
      note: "Thể cổ điển ở người cao tuổi diễn biến 2–3 ngày nắng nóng nên giữ 12% cho 3–5 ngày. Ước lượng."
  - finding: dizziness
    freq: frequent
    evidence:
      tier: C
      basis: verbal
      sources: [msd-heatstroke, nhs-heat-exhaustion-heatstroke]
      locator: "MSD Heatstroke (đi loạng choạng có thể là dấu hiệu sớm); NHS (chóng mặt là dấu hiệu của kiệt sức do nóng, có thể tiến triển thành sốc nhiệt)"
      note: "Có tác dụng khi triệu chứng chính không phải Chóng mặt. Ước lượng."
  - finding: fainting_or_near_fainting
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [nhs-heat-exhaustion-heatstroke, msd-heatstroke]
      locator: "NHS (mất ý thức là dấu hiệu sốc nhiệt); MSD (hôn mê)"
      note: "Có tác dụng khi triệu chứng chính không phải Ngất. Gục ngã, mất ý thức hay gặp; không có tỷ lệ."
  - finding: not_recovered_after_faint
    freq: very_frequent
    evidence:
      tier: B
      basis: verbal
      sources: [nhs-heat-exhaustion-heatstroke, nhs-fainting, msd-heatstroke]
      locator: "NHS Heat (vẫn không khỏe sau 30 phút làm mát; mất ý thức); NHS Fainting (chưa hồi phục hẳn thì gọi 999)"
      note: "Tần suất trong số người đã ngất hoặc suýt ngất. Rối loạn tri giác của sốc nhiệt kéo dài, không hồi phục nhanh như ngất phản xạ; đây là điểm phân biệt chính với ngất do nóng và kiệt sức do nóng."
  - finding: syncope_trigger
    dist: { standing_heat: 0.45, emotion_pain: 0.01, standing_up: 0.07, toilet_cough: 0.01, exertion: 0.35, lying: 0.03, no_trigger: 0.08 }
    evidence:
      tier: B
      basis: judgment
      sources: [msd-heatstroke]
      locator: "MSD Heatstroke (thể cổ điển khi nắng nóng kéo dài; thể gắng sức khi vận động nặng)"
      note: "Ước lượng theo hai thể bệnh: gục khi đang ở nơi nóng, hoặc khi đang lao động, tập luyện nặng."
  - finding: syncope_warning
    dist: { prodrome: 0.65, palpitations_first: 0.05, no_warning: 0.30 }
    evidence:
      tier: B
      basis: judgment
      sources: [nhs-heat-exhaustion-heatstroke, msd-heatstroke]
      locator: "NHS (kiệt sức do nóng có thể tiến triển thành sốc nhiệt)"
      note: "Thường có giai đoạn mệt, chóng mặt, vã mồ hôi trước; một phần gục đột ngột. Ước lượng."
  - finding: dizziness_pattern
    dist: { brief_episodes: 0.03, long_episodes: 0.12, continuous: 0.80, chronic: 0.05 }
    evidence:
      tier: B
      basis: judgment
      sources: [msd-heatstroke]
      locator: "MSD Heatstroke"
      note: "Chóng mặt, loạng choạng liên tục trong cơn nóng cấp; ước lượng."
  - finding: breathing_difficulty
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [msd-heatstroke, nhs-heat-exhaustion-heatstroke]
      locator: "MSD (thở nhanh hay gặp); NHS (thở nhanh hoặc khó thở)"
      note: "MSD ghi thở nhanh hay gặp; hạ một mức vì người nhà không phải lúc nào cũng nhận ra. Ước lượng."
  - finding: palpitations
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [msd-heatstroke, nhs-heat-exhaustion-heatstroke]
      locator: "MSD (tim nhanh hay gặp, kể cả khi nằm); NHS (tim đập nhanh)"
      note: "Tim nhanh hay gặp khi khám, nhưng người lơ mơ khó tự kể hồi hộp; ước occasional."
  - finding: severe_weakness
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [msd-heatstroke, nhs-heat-exhaustion-heatstroke]
      locator: "MSD (đi loạng choạng, hôn mê); NHS (mất phối hợp, mất ý thức)"
      note: "Người bệnh thường gục, không tự đi lại được; ước lượng."
warning_signs:
  - confusion
  - drowsy_hard_to_wake
  - seizure_recent
  - es_unresponsive_or_seizing
  - not_recovered_after_faint
  - breathing_difficulty
  - severe_weakness
self_care_vi:
  - "Gọi 115 ngay; trong lúc chờ, đưa người bệnh vào chỗ mát, thoáng gió."
  - "Cởi bớt quần áo; lau hoặc xịt nước mát khắp người và quạt liên tục."
  - "Có thể đắp khăn ướt mát lên người, chườm mát ở cổ, nách, bẹn."
  - "Nếu người bệnh lơ mơ hoặc co giật, đặt nằm nghiêng và không cho ăn uống gì."
  - "Không để người bệnh tự đi lại hoặc tự lái xe đến bệnh viện."
see_doctor_vi:
  - "Đây là cấp cứu: cần đến bệnh viện ngay, kể cả khi người bệnh có vẻ đỡ hơn sau khi làm mát."
  - "Người cao tuổi, trẻ nhỏ, người có bệnh tim, tiểu đường cần được để ý nhiều hơn trong những ngày nắng nóng."
proposed_findings:
  - id: hot_dry_skin
    kind: sign
    type: binary
    label_vi: "Da nóng ran, không ra mồ hôi"
    question_vi: "Da người bệnh có nóng ran mà không ra mồ hôi không?"
    help_vi: "Sờ trán, ngực, lưng thấy rất nóng và khô, dù trời nóng hoặc vừa làm việc nặng."
    leak: specific
    notes_vi: "NHS Heat exhaustion and heatstroke (gọi 999 khi da nóng không ra mồ hôi), WHO BEC Module 5, MSD Heatstroke (thể cổ điển da nóng, khô). Giúp phân biệt sốc nhiệt với kiệt sức do nóng (vã mồ hôi, da tái, ẩm). Lượt R cũng đã đề xuất. Nếu được thêm: sốc nhiệt frequent (thể gắng sức thường còn mồ hôi), kiệt sức do nóng very_rare."
  - id: not_better_after_cooling
    kind: history
    type: binary
    label_vi: "Đã nghỉ mát, uống nước 30 phút mà chưa đỡ"
    question_vi: "Nghỉ chỗ mát, làm mát, uống nước 30 phút mà vẫn chưa đỡ không?"
    requires:
      - { finding: heat_exposure, is: present }
    leak: 0.1
    leak_note: "Tính trong số người có phơi nắng; phần lớn người kiệt sức do nóng đỡ trong 30 phút (NHS), nên chỉ khoảng 1/10 người không bị sốc nhiệt vẫn chưa đỡ. Ước lượng, cần bác sĩ duyệt."
    notes_vi: "NHS: tiêu chí đầu tiên của 'Call 999 now' (sốc nhiệt); MSD Heat Exhaustion: không đỡ sau 30–60 phút bù nước thì đến cấp cứu. Tính trong số người có phơi nắng; tỷ lệ nền 0,1 là ước lượng (nhiều người chưa thử làm mát sẽ trả lời 'Không rõ'). Có thể dùng cho quy tắc rf_heat_stroke_signs (lượt R đã đề xuất). Nếu được thêm: sốc nhiệt very_frequent, kiệt sức do nóng rare."
review:
  status: draft
  authors: ["agent:pass-b"]
  updated: "2026-10-26"
  notes_vi: "Lượt B (Giai đoạn 3, lô 2, phần b). Mức xử trí 1, không được bỏ sót, giữ như gợi ý: NHS 'Call 999 now' khi có dấu hiệu sốc nhiệt; MSD: tử vong, di chứng đáng kể, phụ thuộc thời gian làm mát; WHO BEC: sốc nhiệt là một nguyên nhân rối loạn ý thức. Lời dặn trong lúc chờ theo NHS và WHO BEC (chỗ mát, cởi bớt quần áo, lau, xịt nước mát, quạt; nằm nghiêng khi bất tỉnh); không dặn cho uống vì người lú lẫn, co giật dễ sặc. Phân biệt với kiệt sức do nóng dựa vào rối loạn tri giác và ngất không hồi phục hẳn (rf_heat_stroke_signs, mức 1). Chưa tìm được hướng dẫn của Bộ Y tế về sốc nhiệt. Điểm cần bác sĩ xem: (1) prior là ước lượng từ số liệu Nhật Bản, Đài Loan; chưa có số liệu Việt Nam; (2) các tần suất là chuyển từ mô tả của MSD, NHS (không có tỷ lệ); (3) catalog chưa có câu 'da nóng, khô, không ra mồ hôi' và 'đã làm mát, uống nước 30 phút mà chưa đỡ' (lượt R đã đề xuất); (4) chưa liên kết đau đầu, nôn: đây là triệu chứng của giai đoạn trước, người đã sốc nhiệt ít khi kể được."
