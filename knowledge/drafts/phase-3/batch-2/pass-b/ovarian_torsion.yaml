id: ovarian_torsion
names:
  vi: "Xoắn phần phụ, vỡ nang buồng trứng"
  vi_common: ["Xoắn buồng trứng", "Xoắn u nang buồng trứng", "Vỡ nang buồng trứng"]
  en: "Adnexal (ovarian) torsion or ruptured ovarian cyst"
codes:
  icd10: "N83.5"
  icd10_verified: false
summary_vi:
  - "Buồng trứng, thường đang có nang hoặc khối u, bị xoắn quanh cuống làm tắc mạch máu, hoặc nang bị vỡ gây chảy máu."
  - "Thường đau đột ngột, dữ dội ở bụng dưới một bên, kèm buồn nôn, nôn."
  - "Cần khám cấp cứu sản phụ khoa ngay, vì mổ muộn khó giữ được buồng trứng."
urgency: 2
cant_miss: true
specialties: [obstetrics_gynecology, emergency]
applicability:
  sex: [female]
  reason_vi: "Bệnh của buồng trứng, chỉ gặp ở nữ giới."
priors:
  - complaint: abdominal_pain
    default: P5
    by_age: { infant_0_2m: P6, child_2m_5y: P6, adult_18_44: P4, elder_65_74: P6, elder_75p: P6 }
    evidence:
      tier: B
      basis: judgment
      sources: [guthrie-pediatrics-2010, houry-annemergmed-2001, huchon-humreprod-2012, byt-qd-315-2015]
      locator: "Guthrie 2010 tóm tắt; Houry 2001 tóm tắt; Huchon 2012 tóm tắt; 315/QĐ-BYT bài U nang buồng trứng, mục 2.1.1, 2.1.2 và 3 (tr. 150–153)"
      reported: "Xoắn buồng trứng ở nữ 1–20 tuổi nhập viện 4,9/100.000/năm (Mỹ); 31/496 phụ nữ đau vùng chậu cấp (đau từ 5/10) ở khoa cấp cứu Pháp là xoắn phần phụ; tuổi 14–82, trung bình 32 (87 ca)"
      population: "Nhập viện ở Mỹ; cấp cứu phụ khoa ở Pháp, Mỹ"
      note: "Prior tính trong số nữ cùng nhóm tuổi bị đau bụng (applicability chỉ giới hạn giới). Bệnh gồm cả vỡ nang buồng trứng (nang hoàng thể, nang noãn), hay gặp hơn xoắn ở tuổi sinh đẻ (315/QĐ-BYT: nang cơ năng có thể xoắn hoặc vỡ gây bệnh cảnh cấp cứu). Ở phụ nữ đau vùng chậu cấp đến cấp cứu, xoắn chiếm khoảng 6%; ở người đau bụng tự kiểm tra hoặc khám ban đầu thấp hơn nhiều: ước 0,2–0,6% với 18–44 tuổi (P4, ở cận dưới; tính cả vỡ nang chảy máu). Ở 13–17 tuổi xoắn hay gặp (Guthrie 2010: 4,9/100.000 nữ 1–20 tuổi mỗi năm) nhưng đau bụng ở tuổi này rất phổ biến (đau bụng kinh) và vỡ nang ít hơn người lớn, nên ước 0,02–0,2% (P5), như 5–12 và 45–64 tuổi; trẻ dưới 5 tuổi và từ 65 tuổi rất hiếm (P6). Chưa có số liệu Việt Nam; cần bác sĩ duyệt."
findings:
  - finding: abd_pain_location
    dist: { epigastric: 0.02, right_upper: 0.02, left_upper: 0.02, periumbilical: 0.05, right_lower: 0.34, left_lower: 0.27, suprapubic: 0.18, whole: 0.1 }
    evidence:
      tier: B
      basis: judgment
      sources: [huchon-humreprod-2012, huchon-humreprod-2010, byt-qd-315-2015]
      locator: "Huchon 2012 tóm tắt; Huchon 2010 tóm tắt"
      reported: "Đau một bên bụng hoặc thắt lưng: tỷ số chênh chẩn đoán hiệu chỉnh 23,3 (Huchon 2012), 4,1 (Huchon 2010)"
      note: "Đau bụng dưới một bên là dấu hiệu gợi ý mạnh nhất; bên phải hay gặp hơn bên trái một chút. Phân bố là ước lượng."
  - finding: abd_pain_onset
    dist: { sudden: 0.6, gradual: 0.4 }
    evidence:
      tier: B
      basis: numeric
      sources: [houry-annemergmed-2001, byt-qd-315-2015, nhs-ovarian-cyst]
      locator: "Houry 2001 tóm tắt; 315/QĐ-BYT mục 3 (xoắn nang: đau đột ngột, dữ dội); NHS Ovarian cyst (đau từ âm ỉ, nặng tức tới đột ngột, dữ dội)"
      reported: "Khởi phát đột ngột ở 59%"
      population: "87 phụ nữ được mổ xác nhận xoắn buồng trứng (Mỹ)"
  - finding: abd_pain_duration
    dist: { lt_6h: 0.42, h6_24: 0.27, d1_3: 0.18, d4_14: 0.09, gt_2w: 0.04 }
    evidence:
      tier: B
      basis: judgment
      sources: [huchon-humreprod-2010, houry-annemergmed-2001]
      locator: "Huchon 2010 tóm tắt (đau dưới 8 giờ lúc đến khám: aOR 8,0); Houry 2001 (chỉ 26/87 được mổ trong 24 giờ)"
      note: "Đau ngắn dưới 8 giờ gợi ý xoắn; một phần người bệnh đau âm ỉ, xoắn không hoàn toàn nhiều ngày; đau tái đi tái lại trên 2 tuần ít gặp (xoắn từng lúc). Phân bố là ước lượng."
  - finding: abd_pain_severe
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [huchon-humreprod-2012, byt-qd-315-2015, bridwell-ajem-2022, nhs-ovarian-cyst]
      locator: "Huchon 2012 tóm tắt (đau không chịu nổi: aDOR 5,0); 315/QĐ-BYT mục 3; Bridwell 2022 tóm tắt (đau không phải lúc nào cũng đột ngột, dữ dội); NHS Ovarian cyst"
      note: "Tính trong số người đã đau bụng. Ước khoảng một nửa trả lời đau không chịu nổi."
  - finding: nausea
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [houry-annemergmed-2001, bridwell-ajem-2022]
      locator: "Houry 2001 tóm tắt; Bridwell 2022 tóm tắt"
      reported: "Buồn nôn hoặc nôn ở 70%"
      note: "Số 70% gộp buồn nôn và nôn, đo ở bệnh viện; chọn frequent cho riêng buồn nôn. Cùng cụm vomiting."
  - finding: vomiting
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [houry-annemergmed-2001, huchon-humreprod-2010, byt-qd-315-2015]
      locator: "Houry 2001 tóm tắt; Huchon 2010 tóm tắt (nôn: aOR 7,9); 315/QĐ-BYT mục 3"
      reported: "Buồn nôn hoặc nôn 70%; nôn là yếu tố dự báo độc lập của xoắn"
      note: "Ước khoảng một nửa có nôn thật sự."
  - finding: abd_pain_radiates_back
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [houry-annemergmed-2001]
      locator: "Houry 2001 tóm tắt"
      reported: "Đau lan ra hông, lưng hoặc bẹn ở 51%"
      note: "Tính trong số người đã đau bụng. Số 51% gộp ba hướng lan; chia cho từng câu hỏi, mỗi hướng khoảng 20%."
  - finding: abd_pain_radiates_groin
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [houry-annemergmed-2001]
      locator: "Houry 2001 tóm tắt"
      reported: "Đau lan ra hông, lưng hoặc bẹn ở 51%"
      note: "Như liên kết đau lan ra sau lưng. Tỷ lệ nền 1%."
  - finding: flank_pain
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [houry-annemergmed-2001, huchon-humreprod-2012]
      locator: "Houry 2001 tóm tắt; Huchon 2012 tóm tắt (đau một bên bụng hoặc thắt lưng)"
      reported: "Đau lan ra hông, lưng hoặc bẹn ở 51%"
      note: "Ước khoảng 20%."
  - finding: fever
    freq: rare
    evidence:
      tier: B
      basis: numeric
      sources: [houry-annemergmed-2001]
      locator: "Houry 2001 tóm tắt"
      reported: "Sốt ở 2/87 (khoảng 2%)"
      note: "Thấp hơn tỷ lệ nền 5%: sốt nghiêng về viêm vùng chậu, viêm ruột thừa, viêm thận – bể thận."
  - finding: ovarian_cyst_known
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [houry-annemergmed-2001, huchon-humreprod-2010, byt-qd-315-2015]
      locator: "Houry 2001 tóm tắt; Huchon 2010 tóm tắt (nang buồng trứng trên 5 cm khi siêu âm: aOR 10,6); 315/QĐ-BYT mục 3 (xoắn hay gặp ở khối u nhỏ, cuống dài)"
      reported: "25% đã biết có nang buồng trứng; 89% có buồng trứng to trên 5 cm khi mổ"
      note: "Phần lớn có nang hoặc khối u nhưng chỉ khoảng một phần tư biết trước. Tỷ lệ nền 0,05."
  - finding: pregnant
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [houry-annemergmed-2001, byt-qd-315-2015]
      locator: "Houry 2001 tóm tắt; 315/QĐ-BYT mục 3 (xoắn nang có thể xảy ra khi mang thai, nhất là những tháng đầu)"
      reported: "12/87 (14%) đang mang thai"
      note: "Tỷ lệ nền 5%; vẫn thấp hơn nhiều so với chửa ngoài tử cung (very_frequent)."
  - finding: missed_period
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-315-2015]
      locator: "315/QĐ-BYT mục 2.1.2 (nang hoàng thể gây vô kinh hoặc chậm kinh, dễ nhầm với chửa ngoài tử cung, có thể xoắn, vỡ gây chảy máu)"
      note: "Cùng cụm với có thai. Ước khoảng 20%."
  - finding: fainting_or_near_fainting
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-315-2015]
      locator: "315/QĐ-BYT mục 2.1.2 (vỡ nang gây chảy máu phải soi ổ bụng hoặc mở bụng cầm máu) và mục 3 (xoắn nang: vã mồ hôi, choáng)"
      note: "Choáng do đau dữ dội hoặc do chảy máu trong ổ bụng khi nang vỡ. Không có tỷ lệ; ước khoảng 20%."
  - finding: cold_sweat
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-315-2015]
      locator: "315/QĐ-BYT mục 3 (xoắn nang: đau đột ngột, dữ dội, vã mồ hôi, choáng, nôn)"
      note: "Không có tỷ lệ; ước khoảng 20% (tỷ lệ nền 5%)."
  - finding: abdomen_hard_swollen
    freq: rare
    above_leak_ok: true
    evidence:
      tier: B
      basis: numeric
      sources: [houry-annemergmed-2001]
      locator: "Houry 2001 tóm tắt"
      reported: "Dấu hiệu viêm phúc mạc lúc đến khám ở 3/87 (khoảng 3%)"
      note: "Cao hơn tỷ lệ nền 1% một chút là đúng với nguồn (above_leak_ok); vỡ nang chảy máu nhiều có thể làm bụng chướng."
warning_signs:
  - abd_pain_severe
  - fainting_or_near_fainting
  - cold_hands_feet
  - severe_weakness
  - persistent_vomiting
  - abdomen_hard_swollen
self_care_vi:
  - "Không chờ cơn đau tự hết, vì mổ càng muộn càng khó giữ được buồng trứng."
  - "Nếu có thể đang có thai, báo ngay cho nhân viên y tế khi đến viện."
  - "Hỏi bác sĩ trước khi dùng thuốc giảm đau."
see_doctor_vi:
  - "Đến cơ sở cấp cứu có khoa sản phụ khoa ngay khi đau bụng dưới đột ngột, dữ dội, nhất là kèm nôn."
  - "Người đã biết có u nang buồng trứng nên tái khám theo hẹn và đi khám sớm khi đau bụng dưới."
review:
  status: draft
  authors: ["agent:pass-b"]
  updated: "2026-10-27"
  notes_vi: "Lượt B (Giai đoạn 3 lô 2, phần a). Bệnh gồm xoắn phần phụ (buồng trứng, vòi trứng) và vỡ nang buồng trứng có chảy máu. Mức xử trí 2, không được bỏ sót: giữ như gợi ý. 315/QĐ-BYT: xoắn nang gây đau đột ngột, dữ dội, vã mồ hôi, choáng, nôn, xử trí là mổ cấp cứu; nang vỡ gây chảy máu phải soi ổ bụng hoặc mở bụng cầm máu. Huchon 2010: xoắn cần mổ ngay; Bridwell 2022: cần hội chẩn phụ khoa cấp cứu. Trang NHS Ovarian cyst chỉ khuyên khám khẩn hoặc gọi 111 (mức 3) khi đau vùng chậu đột ngột, dữ dội, hoặc đau bụng kèm buồn nôn, nôn; doctor-v chọn mức 2 theo 315/QĐ-BYT và quy tắc đau bụng dữ dội hiện có. Mã N83.5 (xoắn buồng trứng, cuống buồng trứng, vòi trứng) chọn cho cả bệnh; vỡ nang là N83.0–N83.2; chưa đối chiếu được bảng ICD-10 của Bộ Y tế; chưa tìm được mã MONDO tương ứng. Điểm chưa chắc: (1) prior là ước lượng, chưa có số liệu Việt Nam và chưa có số liệu riêng cho vỡ nang; (2) tần suất lấy từ người được mổ xác nhận xoắn (Houry 2001) và người đến cấp cứu vì đau vùng chậu (Huchon 2010, 2012); (3) không liên kết khí hư bất thường và ra máu âm đạo: Huchon thấy không có hai dấu hiệu này gợi ý xoắn, nhưng người xoắn chỉ có tỷ lệ như phụ nữ nói chung, nên để tỷ lệ nền; viêm vùng chậu đã liên kết khí hư ở mức frequent; (4) phân bố vị trí đau là ước lượng (bên phải hơi nhiều hơn)."
