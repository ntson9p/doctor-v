id: abdominal_aortic_aneurysm
names:
  vi: "Phình động mạch chủ bụng dọa vỡ hoặc vỡ"
  vi_common: ["Vỡ phình động mạch chủ bụng", "Phình động mạch chủ bụng", "Phình mạch chủ bụng"]
  en: "Symptomatic or ruptured abdominal aortic aneurysm"
codes:
  icd10: "I71.3"
  icd10_verified: false
  mondo: "MONDO:0005350"
summary_vi:
  - "Đoạn động mạch chủ ở bụng bị phình to, thành mạch yếu và có thể rách, gây chảy máu ồ ạt trong bụng."
  - "Hay gặp ở nam giới cao tuổi hút thuốc, tăng huyết áp; thường không có triệu chứng cho tới khi sắp vỡ."
  - "Đau bụng hoặc đau lưng đột ngột, dữ dội, kèm choáng, ngất hoặc da tái lạnh là dấu hiệu vỡ, cần gọi 115 ngay."
urgency: 1
cant_miss: true
specialties: [emergency, general_surgery]
priors:
  - complaint: abdominal_pain
    default: P6
    by_age: { elder_65_74: P5, elder_75p: P5 }
    evidence:
      tier: B
      basis: judgment
      sources: [hai-medarh-2025, chan-jvs-2021, karkkainen-jgs-2015, msd-abdominal-aortic-aneurysm, fernando-aem-2022]
      locator: "Hai 2025 tóm tắt và phần Bàn luận; Chan 2021 tóm tắt; Kärkkäinen 2015 tóm tắt; MSD (phần dịch tễ)"
      reported: "Việt Nam (Phú Thọ, Nghệ An, 810 người từ 60 tuổi, sàng lọc siêu âm cộng đồng): phình động mạch chủ bụng 0,12% (1 ca), nghiên cứu khác ở Việt Nam 0,85%; châu Á 0,61% ở quần thể không chọn lọc, 2,56% ở người có yếu tố nguy cơ tim mạch; Phần Lan: vỡ phình ít gặp hơn thiếu máu mạc treo cấp (7,3/100.000/năm) ở người đau bụng cấp; MSD: đỉnh tuổi 70–80"
      population: "Cộng đồng Việt Nam và châu Á (tỷ lệ hiện mắc); bệnh viện Phần Lan (tỷ lệ mới mắc)"
      note: "Ước tính thô: tỷ lệ hiện mắc ở người Việt từ 60 tuổi khoảng 0,1–0,9%, thấp hơn nhiều so với phương Tây; mỗi năm vài phần trăm khối phình to lên, gây đau hoặc vỡ, nên số ca phình có triệu chứng hoặc vỡ chỉ khoảng vài đến vài chục trên 100.000 người cao tuổi mỗi năm, chia cho số người cao tuổi đau bụng đi khám hoặc tự kiểm tra (vài nghìn trên 100.000 mỗi năm) cho khoảng 0,05–0,1%: P5 từ 65 tuổi. Dưới 65 tuổi rất hiếm (P6). Kärkkäinen 2015: ngay cả ở Phần Lan (phình động mạch chủ phổ biến hơn châu Á), vỡ phình ít hơn thiếu máu mạc treo cấp, nên prior không cao hơn bệnh đó. Hệ số giới (nam) điều chỉnh thêm. Chưa có số liệu theo triệu chứng chính; cần bác sĩ duyệt."
  - complaint: syncope
    default: P6
    by_age: { elder_65_74: P5, elder_75p: P5 }
    evidence:
      tier: B
      basis: judgment
      sources: [fernando-aem-2022, hai-medarh-2025, esc-syncope-2018]
      locator: "Fernando 2022 tóm tắt; Hai 2025 tóm tắt; ESC 2018 bảng 6"
      reported: "Ngất gặp ở khoảng 28% người vỡ phình động mạch chủ bụng (Fernando 2022)"
      note: "Ước tính thô: khoảng một phần tư người vỡ phình có ngất, nên ở người từ 65 tuổi ngất hoặc suýt ngất, tỷ lệ do vỡ phình khoảng 0,05–0,2% (số ca vỡ phình có ngất chia cho số người cao tuổi ngất đi khám hoặc tự kiểm tra): P5. Dưới 65 tuổi P6. ESC 2018 (bảng 6) xếp ngất kèm đau bụng mới xuất hiện, hoặc huyết áp tâm thu dưới 90 mmHg không rõ lý do, vào nhóm nguy cơ cao. Ca dev d-from-h-syncope-017 (nam 74 tuổi) là vỡ phình biểu hiện bằng ngất. Cần bác sĩ duyệt."
  - complaint: dizziness
    default: P6
    evidence:
      tier: B
      basis: judgment
      sources: [fernando-aem-2022, hai-medarh-2025]
      note: "Người vỡ phình biểu hiện chủ yếu bằng choáng (do tụt huyết áp) mà không chọn đau bụng hay ngất là rất hiếm so với vô số nguyên nhân chóng mặt lành tính: P6 cho mọi tuổi. Prior này chỉ để bệnh được xét khi người chóng mặt có đau bụng, đau lưng, da tái lạnh. Ước lượng, cần bác sĩ duyệt."
prior_modifiers:
  - when: { sex: [male] }
    factor: 1.6
    evidence:
      tier: C
      basis: numeric
      sources: [msd-abdominal-aortic-aneurysm, nhs-abdominal-aortic-aneurysm, hai-medarh-2025]
      locator: "MSD (phần dịch tễ: nam gấp khoảng 3 lần nữ); NHS Causes (nam từ 65 tuổi nguy cơ cao nhất); Hai 2025 (giới nam liên quan với đường kính động mạch chủ lớn hơn)"
      reported: "Tỷ lệ nam/nữ khoảng 3/1"
      note: "Với tỷ lệ 3/1 và khoảng 40% người cao tuổi là nam (Hai 2025: 40,2% mẫu từ 60 tuổi), hệ số so với trung bình hai giới là khoảng 1,6 cho nam và 0,55 cho nữ."
  - when: { sex: [female] }
    factor: 0.55
    evidence:
      tier: C
      basis: numeric
      sources: [msd-abdominal-aortic-aneurysm]
      reported: "Tỷ lệ nam/nữ khoảng 3/1"
      note: "Đi cặp với hệ số 1,6 cho nam."
findings:
  - finding: abdominal_pain
    freq: frequent
    evidence:
      tier: A
      basis: numeric
      sources: [fernando-aem-2022, azhar-jet-2014]
      locator: "Fernando 2022 tóm tắt; Azhar 2014 tóm tắt"
      reported: "Độ nhạy gộp của đau bụng 61,7% (Fernando 2022); đau bụng ở 61% người vỡ phình (Azhar 2014)"
      population: "Người vỡ phình động mạch chủ bụng ở khoa cấp cứu, bệnh viện"
      note: "Chỉ có tác dụng khi triệu chứng chính là Ngất hoặc Chóng mặt (với Đau bụng là dấu hiệu ngầm định). Khoảng 40% chỉ đau lưng, hông hoặc chỉ ngất, choáng, nên không chọn very_frequent."
  - finding: flank_pain
    freq: frequent
    evidence:
      tier: A
      basis: numeric
      sources: [fernando-aem-2022, nhs-abdominal-aortic-aneurysm, msd-abdominal-aortic-aneurysm]
      locator: "Fernando 2022 tóm tắt; NHS Call 999; MSD (phần triệu chứng)"
      reported: "Độ nhạy gộp của đau lưng 53,6%"
      note: "Câu hỏi 'đau hông lưng' gần với đau lưng của nguồn. MSD: khối phình đang to gây đau sâu, âm ỉ, rõ nhất vùng thắt lưng – cùng. Với Ngất, câu này được hỏi ngay sau nhóm dấu hiệu nguy hiểm."
  - finding: abd_pain_radiates_back
    freq: frequent
    evidence:
      tier: A
      basis: judgment
      sources: [fernando-aem-2022, msd-abdominal-aortic-aneurysm]
      locator: "Fernando 2022 tóm tắt; MSD (phần triệu chứng)"
      note: "Tính trong số người đã đau bụng. Đau lưng gặp ở khoảng một nửa người vỡ phình (53,6%), phần lớn cùng lúc với đau bụng; ước khoảng một nửa trả lời đau lan ra sau lưng."
  - finding: abd_pain_severe
    freq: frequent
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-abdominal-aortic-aneurysm, msd-abdominal-aortic-aneurysm]
      locator: "NHS Call 999 (đau bụng hoặc lưng đột ngột, dữ dội); MSD (phần triệu chứng)"
      note: "Tính trong số người đã đau bụng. Vỡ phình thường đau dữ dội; phình chưa vỡ có triệu chứng thì đau âm ỉ (MSD), và người cao tuổi có thể không tả là 'không chịu nổi'. Không chọn very_frequent để câu trả lời 'Không' chỉ giảm khả năng khoảng 2 lần, vì đây là bệnh không được bỏ sót."
  - finding: abd_pain_onset
    dist: { sudden: 0.75, gradual: 0.25 }
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-abdominal-aortic-aneurysm, msd-abdominal-aortic-aneurysm]
      locator: "NHS Call 999; MSD (phần triệu chứng)"
      note: "Vỡ phình khởi phát đột ngột (NHS); phình đang to có thể đau âm ỉ tăng dần (MSD). Phân bố là ước lượng."
  - finding: abd_pain_duration
    dist: { lt_6h: 0.5, h6_24: 0.22, d1_3: 0.13, d4_14: 0.08, gt_2w: 0.07 }
    evidence:
      tier: C
      basis: judgment
      sources: [msd-abdominal-aortic-aneurysm, azhar-jet-2014]
      locator: "MSD (phần triệu chứng); Azhar 2014 tóm tắt"
      note: "Vỡ phình làm người bệnh đi viện trong vài giờ; phình chưa vỡ có triệu chứng có thể đau vài ngày đến vài tuần. Phân bố là ước lượng."
  - finding: abd_pain_location
    dist: { epigastric: 0.12, right_upper: 0.03, left_upper: 0.07, periumbilical: 0.25, right_lower: 0.06, left_lower: 0.17, suprapubic: 0.08, whole: 0.22 }
    evidence:
      tier: C
      basis: judgment
      sources: [msd-abdominal-aortic-aneurysm, azhar-jet-2014]
      locator: "MSD (vỡ hay xảy ra ở thành sau bên trái, dưới động mạch thận 2–4 cm); Azhar 2014 (hay bị nhầm với cơn đau quặn niệu quản)"
      note: "Đau giữa bụng, quanh rốn hoặc lan tỏa; khối máu tụ sau phúc mạc bên trái gây đau bụng dưới hoặc hông trái giống cơn đau quặn thận. Phân bố là ước lượng."
  - finding: abd_pain_radiates_groin
    freq: occasional
    evidence:
      tier: A
      basis: judgment
      sources: [azhar-jet-2014]
      locator: "Azhar 2014 tóm tắt"
      reported: "Chẩn đoán nhầm ban đầu ở 42% người vỡ phình (32% từ sau 1990); nhầm nhiều nhất với cơn đau quặn niệu quản và nhồi máu cơ tim"
      note: "Máu tụ sau phúc mạc có thể gây đau lan xuống bẹn như sỏi niệu quản, là lý do hay bị chẩn đoán nhầm. Nguồn không cho tỷ lệ; ước khoảng 10–20%. Tỷ lệ nền 1% nên 'Có' làm tăng khả năng khoảng 20 lần, vẫn thấp hơn cơn đau quặn thận (frequent)."
  - finding: fainting_or_near_fainting
    freq: occasional
    freq_by_complaint: { dizziness: frequent }
    evidence:
      tier: A
      basis: numeric
      sources: [fernando-aem-2022, azhar-jet-2014, nhs-abdominal-aortic-aneurysm]
      locator: "Fernando 2022 tóm tắt; Azhar 2014 tóm tắt; NHS Call 999 (mất ý thức)"
      reported: "Ngất 27,8%, tụt huyết áp 30,9% (Fernando 2022); sốc 46% (Azhar 2014)"
      population: "Người vỡ phình ở khoa cấp cứu, bệnh viện"
      note: "Với Đau bụng: occasional (khoảng 20–30%, tính cả phình chưa vỡ không gây choáng). Với Chóng mặt: người vỡ phình chọn chóng mặt là nhóm đang tụt huyết áp, nên choáng như sắp ngất là frequent. Với Ngất là dấu hiệu ngầm định."
  - finding: not_recovered_after_faint
    freq: frequent
    evidence:
      tier: B
      basis: judgment
      sources: [nhs-fainting, azhar-jet-2014, fernando-aem-2022]
      locator: "NHS Fainting (Call 999 khi không hồi phục hẳn); Azhar 2014 (sốc 46%); Fernando 2022 (tụt huyết áp 30,9%)"
      note: "Tính trong số người đã ngất hoặc suýt ngất. Ngất do mất máu trong ổ bụng thường kèm tụt huyết áp kéo dài, khác ngất phản xạ (hồi phục trong vài phút). Ước khoảng một nửa; tỷ lệ nền 5% nên đây là dấu hiệu phân biệt mạnh với ngất lành tính."
  - finding: cold_hands_feet
    freq: occasional
    freq_by_complaint: { syncope: frequent, dizziness: frequent }
    evidence:
      tier: A
      basis: numeric
      sources: [azhar-jet-2014, fernando-aem-2022, nhs-abdominal-aortic-aneurysm]
      locator: "Azhar 2014 tóm tắt; Fernando 2022 tóm tắt; NHS Call 999 (da tái hoặc xám)"
      reported: "Sốc 46% (Azhar 2014); tụt huyết áp 30,9% (Fernando 2022)"
      note: "Câu hỏi gồm tay chân lạnh, da tái. Với Đau bụng hạ một mức (occasional) vì nguồn đo ở bệnh viện và bệnh gồm cả phình chưa vỡ. Người vỡ phình chọn Ngất hoặc Chóng mặt là nhóm đang tụt huyết áp: frequent (tỷ lệ nền khi ngất 0,15)."
  - finding: dizziness_on_standing
    freq: frequent
    evidence:
      tier: B
      basis: judgment
      sources: [fernando-aem-2022, azhar-jet-2014]
      locator: "Fernando 2022 (tụt huyết áp 30,9%); Azhar 2014 (sốc 46%)"
      note: "Mất máu làm tụt huyết áp khi ngồi dậy, đứng dậy. Ước khoảng một nửa; tỷ lệ nền 0,15. Có ý nghĩa chủ yếu với Ngất và Chóng mặt."
  - finding: syncope_trigger
    dist: { standing_heat: 0.05, emotion_pain: 0.25, standing_up: 0.3, toilet_cough: 0.15, exertion: 0.08, lying: 0.04, no_trigger: 0.13 }
    evidence:
      tier: C
      basis: judgment
      sources: [msd-abdominal-aortic-aneurysm, fernando-aem-2022]
      locator: "MSD (phần triệu chứng: vỡ có thể xảy ra sau gắng sức nín thở, như nâng vật nặng)"
      note: "Tính trong số người đã ngất hoặc suýt ngất. Ngất do mất máu hay xảy ra khi vừa đứng dậy, khi đang đau dữ dội, khi rặn (đi ngoài) hoặc sau gắng sức nâng vật nặng (MSD). Phân bố là ước lượng."
  - finding: syncope_warning
    dist: { prodrome: 0.65, palpitations_first: 0.07, no_warning: 0.28 }
    evidence:
      tier: C
      basis: judgment
      sources: [fernando-aem-2022, msd-abdominal-aortic-aneurysm]
      note: "Tính trong số người đã ngất hoặc suýt ngất. Ngất do tụt huyết áp vì mất máu thường có choáng, vã mồ hôi, tối sầm mắt trước; ít khi hồi hộp đi trước. Phân bố là ước lượng."
  - finding: pulse_measured
    dist: { lt_40: 0.004, n40_100: 0.186, n100_150: 0.18, gt_150: 0.03, not_measured: 0.6 }
    evidence:
      tier: C
      basis: judgment
      sources: [msd-abdominal-aortic-aneurysm]
      locator: "MSD (phần triệu chứng: vỡ phình gây tụt huyết áp, mạch nhanh)"
      note: "'Chưa đo' giữ đúng tỷ lệ nền 0,6. Trong số người đã đo: mạch nhanh khi mất máu, nhưng gần một nửa chưa nhanh lúc đo (phình chưa vỡ, chảy máu ít, người dùng thuốc chẹn beta). Ước lượng."
  - finding: dizziness_pattern
    dist: { brief_episodes: 0.15, long_episodes: 0.2, continuous: 0.6, chronic: 0.05 }
    evidence:
      tier: C
      basis: judgment
      sources: [fernando-aem-2022]
      note: "Tính trong số người đã chóng mặt. Choáng do mất máu kéo dài liên tục từ khi bắt đầu đau; có thể nặng lên khi đứng. Phân bố là ước lượng."
  - finding: vertigo_spinning
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [fernando-aem-2022]
      note: "Tính trong số người đã chóng mặt. Chóng mặt do tụt huyết áp là choáng, tối sầm mắt chứ không phải cảm giác quay. Mức occasional thấp hơn tỷ lệ nền 0,4, nên 'quay cuồng' làm giảm nhẹ khả năng bệnh."
  - finding: abdomen_hard_swollen
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [who-bec-2018, fernando-aem-2022]
      locator: "WHO BEC Module 4 (dấu hiệu chảy máu trong ổ bụng: đau bụng, bụng rất cứng); Fernando 2022 (khối đập ở bụng khi khám 47,1%)"
      note: "Khối đập ở bụng do bác sĩ phát hiện ở khoảng một nửa; người nhà có thể thấy bụng chướng hoặc cứng khi máu chảy nhiều. Ước khoảng 20%, hạ so với số khám của bác sĩ."
  - finding: breathing_difficulty
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-abdominal-aortic-aneurysm]
      locator: "NHS Call 999 (khó thở hoặc ngừng thở)"
      note: "NHS liệt kê khó thở trong dấu hiệu vỡ phình. Không có tỷ lệ; ước khoảng 20% (thở nhanh khi sốc)."
  - finding: known_aaa
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [hai-medarh-2025, nhs-abdominal-aortic-aneurysm]
      locator: "Hai 2025 (sàng lọc cộng đồng phát hiện ít ca); NHS (Anh sàng lọc bằng siêu âm mọi nam giới 65 tuổi)"
      note: "Việt Nam chưa có chương trình sàng lọc, nên phần lớn người vỡ phình chưa từng được phát hiện; ước 10–20% đã biết có phình (phát hiện tình cờ khi siêu âm, chụp cắt lớp). Tỷ lệ nền 1% nên 'Có' làm tăng khả năng khoảng 20 lần. Áp dụng từ 45 tuổi theo danh mục."
  - finding: smoker
    freq: frequent
    evidence:
      tier: B
      basis: judgment
      sources: [nhs-abdominal-aortic-aneurysm, msd-abdominal-aortic-aneurysm, hai-medarh-2025]
      locator: "NHS Causes; MSD (hút thuốc là yếu tố nguy cơ mạnh nhất); Hai 2025 (đang hút thuốc liên quan với đường kính động mạch chủ)"
      note: "Câu hỏi chỉ hỏi đang hút (thuốc lá, thuốc lào), không hỏi đã từng hút, nên ước khoảng một nửa thay vì đa số. Tỷ lệ nền 0,2."
  - finding: hypertension_known
    freq: frequent
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-abdominal-aortic-aneurysm, msd-abdominal-aortic-aneurysm]
      locator: "NHS Causes; MSD (yếu tố nguy cơ)"
      note: "Tăng huyết áp là yếu tố nguy cơ (NHS, MSD). Không có tỷ lệ trong nguồn; ước khoảng một nửa đã biết mình tăng huyết áp (tỷ lệ nền 0,15)."
  - finding: known_heart_disease
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-abdominal-aortic-aneurysm]
