review:
  status: draft
  authors: ["agent:pass-b"]
  updated: "2026-10-27"
  notes_vi: "Lượt B (Giai đoạn 3 lô 2, phần a). Bệnh gồm phình động mạch chủ bụng có triệu chứng (dọa vỡ) và đã vỡ. Mức xử trí 1, không được bỏ sót: giữ như gợi ý. NHS gọi 999 khi đau bụng hoặc lưng đột ngột dữ dội, khó thở, da tái xám, mất ý thức; MSD: phình có triệu chứng cần chụp ngay trước khi vỡ, vỡ phình cần mổ hoặc đặt ống ghép ngay, phần lớn tử vong trước khi tới viện. Mã I71.3 (vỡ) chọn cho cả bệnh; phình chưa vỡ có triệu chứng là I71.4; chưa đối chiếu được bảng ICD-10 của Bộ Y tế. Điểm chưa chắc: (1) prior P5 từ 65 tuổi là ước tính thô từ tỷ lệ hiện mắc ở Việt Nam (Hai 2025: 0,12%, một nghiên cứu khác 0,85%) và châu Á, chưa có số liệu theo triệu chứng chính; (2) tần suất triệu chứng lấy từ người vỡ phình ở bệnh viện (Fernando 2022, Azhar 2014), đã hạ một mức với dấu hiệu sốc khi triệu chứng chính là Đau bụng; (3) đau lan xuống bẹn (occasional) và đã biết có phình (occasional) là ước lượng, mỗi câu 'Có' làm tăng khả năng khoảng 20 lần; (4) không liên kết vã mồ hôi lạnh và da xanh: nguồn đã mở không nêu, và câu tay chân lạnh đã gồm da tái; (5) không liên kết tiểu ra máu: không có nguồn, để tỷ lệ nền giúp cơn đau quặn thận vẫn đứng trên khi có tiểu máu; (6) chưa mở được hướng dẫn ESVS 2024 (lượt R ghi bị chặn); (7) không có lựa chọn huyết áp thấp trong câu đo huyết áp, nên không liên kết bp_measured."
proposed_findings:
  - id: back_pain_sudden_severe
    kind: symptom
    type: binary
    label_vi: "Đau lưng, hông lưng đột ngột, dữ dội"
    question_vi: "Cơn đau lưng, hông lưng có đến đột ngột và rất dữ dội không?"
    alt_question:
      text_vi: "Đau lưng đến mức không đi lại hay nằm yên được không?"
    requires:
      - { finding: flank_pain, is: present }
    leak: 0.15
    leak_note: "Tính trong số người đã đau hông lưng; cơn đau quặn thận cũng đau đột ngột, dữ dội. Lượt B ước lượng."
    sources: [nhs-abdominal-aortic-aneurysm, fernando-aem-2022]
    notes_vi: "Lượt B lô 2 đề xuất (lượt R cũng đã nêu trong biên bản, mục 7.1). NHS gọi 999 khi đau bụng hoặc đau lưng đột ngột, dữ dội; câu đau hông lưng hiện không hỏi mức độ, nên người ngất hoặc chóng mặt chỉ đau lưng (khoảng một nửa người vỡ phình đau lưng, Fernando 2022) không phân biệt được vỡ phình với đau lưng mạn. Nếu thêm: liên kết với vỡ phình động mạch chủ bụng, cơn đau quặn thận, và cân nhắc dùng trong quy tắc rf_aaa_rupture_signs thay cho điều kiện kèm da tái lạnh."
