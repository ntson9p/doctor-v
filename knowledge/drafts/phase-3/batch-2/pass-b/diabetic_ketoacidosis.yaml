id: diabetic_ketoacidosis
names:
  vi: "Nhiễm toan ceton, tăng áp lực thẩm thấu do đái tháo đường"
  vi_common: ["Nhiễm toan ceton do tiểu đường", "Tăng áp lực thẩm thấu do tiểu đường", "Đường huyết tăng quá cao"]
  en: "Diabetic ketoacidosis and hyperglycaemic hyperosmolar state"
codes:
  icd10: "E14.1"
  icd10_verified: false
  mondo: "MONDO:0012819"
summary_vi:
  - "Biến chứng cấp của đái tháo đường khi thiếu insulin hoặc đường huyết tăng rất cao, làm cơ thể mất nước nặng."
  - "Thường khát nhiều, tiểu nhiều, mệt, buồn nôn, nôn, đau bụng; có thể thở nhanh sâu, lơ mơ."
  - "Có thể là dấu hiệu đầu tiên của bệnh tiểu đường, nhất là ở trẻ em; cần đến cấp cứu ngay."
urgency: 2
cant_miss: true
specialties: [endocrinology, emergency]
priors:
  - complaint: abdominal_pain
    default: P5
    by_age: { infant_0_2m: P6, child_2m_5y: P6, child_5_12: P6, teen_13_17: P6 }
    evidence:
      tier: B
      basis: judgment
      sources: [umpierrez-jcc-2002, bich-apem-2025, byt-qd-3879-2014, byt-qd-3312-2015]
      locator: "Umpierrez 2002 tóm tắt; Bich 2025 tóm tắt; 3879/QĐ-BYT bài Nhiễm toan ceton và bài Hôn mê tăng áp lực thẩm thấu; 3312/QĐ-BYT (2015) bài Toan xeton do đái tháo đường"
      reported: "Đau bụng ở 46% người nhiễm toan ceton, không gặp ở người tăng áp lực thẩm thấu (Umpierrez 2002); đái tháo đường típ 1 mới mắc ở trẻ miền Bắc Việt Nam 0,77/100.000 trẻ mỗi năm, 57,8% có nhiễm toan ceton lúc chẩn đoán (Bich 2025)"
      population: "Bệnh viện ở Mỹ; Bệnh viện Nhi Trung ương"
      note: "Người lớn: đái tháo đường gặp ở khoảng 7% người 18–69 tuổi (STEPS 2021, theo danh mục), biến chứng tăng đường huyết cấp chỉ gặp ở một phần nhỏ mỗi năm và chỉ khoảng một nửa có đau bụng, nên trong số người lớn đau bụng ước khoảng 0,02–0,1% (P5). Trẻ em, thiếu niên: đái tháo đường típ 1 hiếm ở Việt Nam (0,77/100.000 trẻ mỗi năm) nên dù hơn một nửa khởi phát bằng nhiễm toan ceton, tỷ lệ trong số trẻ đau bụng dưới 0,02% (P6). Chưa có số liệu theo triệu chứng chính; cần bác sĩ duyệt."
  - complaint: fever
    default: P6
    by_age: { elder_65_74: P5, elder_75p: P5 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-3879-2014, byt-qd-3312-2015]
      locator: "3879/QĐ-BYT bài Nhiễm toan ceton mục I.2 và bài Hôn mê tăng áp lực thẩm thấu mục I.2 (nhiễm trùng là yếu tố thuận lợi); 3312/QĐ-BYT (2015) (sốt khi có nhiễm trùng)"
      note: "Nhiễm trùng (viêm phổi, nhiễm khuẩn tiết niệu, nhiễm trùng tiêu hóa…) là yếu tố khởi phát hay gặp, nên một số người chọn triệu chứng chính Sốt. Tăng áp lực thẩm thấu thường gặp ở người đái tháo đường típ 2 trên 60 tuổi, ngay sau một nhiễm trùng cấp: P5 từ 65 tuổi. Người trẻ hơn: P6. Ước lượng, cần bác sĩ duyệt."
  - complaint: dizziness
    default: P6
    by_age: { elder_65_74: P5, elder_75p: P5 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-3879-2014]
      locator: "3879/QĐ-BYT bài Hôn mê tăng áp lực thẩm thấu mục I.1–I.2 và bảng 2 (mất nước nặng, hay gặp trên 60 tuổi, diễn biến vài ngày đến vài tuần) và bài Nhiễm toan ceton mục II.1.2 (mất nước, hạ huyết áp)"
      note: "Mất nước, tụt huyết áp gây choáng, mệt lả; người cao tuổi tăng áp lực thẩm thấu có thể chỉ thấy choáng, yếu trong nhiều ngày. P5 từ 65 tuổi, P6 ở người trẻ hơn. Ước lượng, cần bác sĩ duyệt."
findings:
  - finding: thirst_polyuria
    freq: very_frequent
    evidence:
      tier: B
      basis: numeric
      sources: [byt-qd-5481-2020, byt-qd-3879-2014, bich-apem-2025, nhs-diabetic-ketoacidosis, nhs-type-1-diabetes, byt-qd-3312-2015]
      locator: "5481/QĐ-BYT Phần 7 mục 2.1 (tiểu nhiều, khát nước là triệu chứng phổ biến); 3879/QĐ-BYT bài Nhiễm toan ceton mục II.1.1 (khát nhiều, uống nhiều, đái nhiều); Bich 2025 phần Bàn luận; NHS DKA; NHS Type 1 diabetes"
      reported: "Khát nhiều, tiểu nhiều trước khi vào viện ở 89,1% trẻ đái tháo đường típ 1 mới mắc (Bich 2025)"
      population: "Trẻ em Việt Nam mới mắc đái tháo đường típ 1 (57,8% có nhiễm toan ceton)"
      note: "Là triệu chứng chính trong cả hướng dẫn của Bộ Y tế và NHS. Người cao tuổi tăng áp lực thẩm thấu có thể giảm cảm giác khát (3879/QĐ-BYT, bảng yếu tố thuận lợi), nên không chọn almost_always. Tỷ lệ nền 5%."
  - finding: ketone_breath
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-5481-2020, byt-qd-3879-2014, nhs-diabetic-ketoacidosis, who-bec-2018]
      locator: "5481/QĐ-BYT Phần 7 mục 2.1 (hơi thở mùi ketone, giống mùi thuốc tẩy móng tay); 3879/QĐ-BYT bài Nhiễm toan ceton mục II.1.2; NHS DKA (hơi thở mùi trái cây); WHO BEC Module 3, 4 (hơi thở mùi ngọt)"
      note: "Nguồn không cho tỷ lệ. 5481/QĐ-BYT xếp mùi ketone vào triệu chứng phổ biến khi bác sĩ khám, nhưng người nhà không phải lúc nào cũng nhận ra, và tăng áp lực thẩm thấu không có ceton; ước khoảng 20% người tự kiểm tra trả lời 'Có'. Để occasional cũng để câu trả lời 'Không' (người nhà không để ý mùi) chỉ giảm khả năng nhẹ. Tỷ lệ nền 1% nên 'Có' làm tăng khả năng khoảng 20 lần."
  - finding: vomiting
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-3879-2014, byt-qd-5481-2020, nhs-diabetic-ketoacidosis, byt-qd-3312-2015]
      locator: "3879/QĐ-BYT bài Nhiễm toan ceton mục II.1.1 (buồn nôn và nôn); 5481/QĐ-BYT Phần 7 mục 2.1 (một số người bệnh, nhất là trẻ em, đau bụng, nôn, buồn nôn); 3312/QĐ-BYT (2015) bài Toan xeton (bệnh sử: đau bụng, nôn)"
      note: "Nguồn đã mở không có tỷ lệ; buồn nôn và nôn được kể đầu tiên trong triệu chứng (3879), nhưng 5481/QĐ-BYT chỉ ghi 'một số người bệnh, nhất là trẻ em'. Ước khoảng một nửa (cận dưới của frequent), ít hơn ở tăng áp lực thẩm thấu; giữ frequent vì đây là bệnh không được bỏ sót và nôn là một điều kiện của quy tắc rf_dka_suspected."
  - finding: nausea
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-3879-2014, nhs-diabetic-ketoacidosis]
      locator: "3879/QĐ-BYT bài Nhiễm toan ceton mục II.1.1"
      note: "Như liên kết nôn; cùng cụm vomiting."
  - finding: persistent_vomiting
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-3879-2014, nhs-type-1-diabetes]
      locator: "3879/QĐ-BYT bài Nhiễm toan ceton mục I.1.3 (nôn làm mất nước, điện giải)"
      note: "Nôn nhiều làm mất nước nặng thêm. Ước khoảng 20%; cùng cụm vomiting. Kèm khát nhiều, tiểu nhiều đã có quy tắc rf_dka_suspected (mức 2)."
  - finding: abdominal_pain
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [umpierrez-jcc-2002, byt-qd-3879-2014, byt-qd-5481-2020, byt-qd-3312-2015]
      locator: "Umpierrez 2002 tóm tắt; 3879/QĐ-BYT mục II.1.1; 5481/QĐ-BYT Phần 7 mục 2.1 (một số người bệnh, nhất là trẻ em, đau bụng); 3312/QĐ-BYT (2015) (đau bụng giống bệnh ngoại khoa cấp)"
      reported: "Đau bụng ở 46% người nhiễm toan ceton (86/189), không gặp ở 11 người tăng áp lực thẩm thấu; gặp ở 86% khi bicarbonat dưới 5 mmol/L"
      population: "Người lớn nhập viện vì cơn tăng đường huyết cấp (Mỹ)"
      note: "Chỉ có tác dụng khi triệu chứng chính là Sốt hoặc Chóng mặt (với Đau bụng là dấu hiệu ngầm định)."
  - finding: abd_pain_location
    dist: { epigastric: 0.3, right_upper: 0.04, left_upper: 0.03, periumbilical: 0.15, right_lower: 0.03, left_lower: 0.02, suprapubic: 0.03, whole: 0.4 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-3312-2015, umpierrez-jcc-2002]
      locator: "3312/QĐ-BYT (2015) bài Toan xeton (đau bụng giống bệnh cấp tính vùng bụng)"
      note: "Đau thường lan tỏa hoặc vùng trên rốn, không khu trú. Phân bố là ước lượng."
  - finding: abd_pain_onset
    dist: { sudden: 0.2, gradual: 0.8 }
    evidence:
      tier: B
      basis: judgment
      sources: [nhs-diabetic-ketoacidosis, byt-qd-3879-2014]
      locator: "NHS DKA (triệu chứng thường xuất hiện trong 24 giờ); 3879/QĐ-BYT bảng 2 (diễn biến vài giờ hoặc vài ngày)"
      note: "Triệu chứng tăng dần trong vài giờ đến một ngày. Phân bố là ước lượng."
  - finding: abd_pain_duration
    dist: { lt_6h: 0.15, h6_24: 0.35, d1_3: 0.35, d4_14: 0.12, gt_2w: 0.03 }
    evidence:
      tier: B
      basis: judgment
      sources: [nhs-diabetic-ketoacidosis, byt-qd-3879-2014, byt-qd-5481-2020]
      locator: "NHS DKA; 3879/QĐ-BYT bảng 2; 5481/QĐ-BYT Phần 7 mục 2.1 (nhiễm toan ketone diễn biến nhanh trong vài giờ; tăng áp lực thẩm thấu âm thầm, kéo dài vài ngày)"
      note: "Phân bố là ước lượng."
  - finding: abd_pain_severe
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [umpierrez-jcc-2002, byt-qd-3312-2015]
      locator: "Umpierrez 2002 tóm tắt (đau bụng có khi giống bụng ngoại khoa); 3312/QĐ-BYT (2015)"
      note: "Tính trong số người đã đau bụng. Đau nặng khi toan nhiều; ước khoảng 20%."
  - finding: breathing_difficulty
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-5481-2020, who-bec-2018, byt-qd-3879-2014, nhs-type-1-diabetes]
      locator: "5481/QĐ-BYT Phần 7 mục 2.1 (thở sâu kiểu Kussmaul là triệu chứng phổ biến); WHO BEC Module 3 (thở nhanh, sâu, người bệnh có thể kể là khó thở); 3879/QĐ-BYT mục II.1.2; NHS Type 1 diabetes (thở nhanh, sâu)"
      note: "Thở nhanh sâu là triệu chứng phổ biến của nhiễm toan ceton (5481/QĐ-BYT) nhưng không có ở tăng áp lực thẩm thấu, và không phải ai cũng kể là khó thở; ước khoảng một nửa (tỷ lệ nền 5%). Câu khó thở gộp nhiều kiểu, nên quy tắc rf_dka_suspected chỉ tính khó thở khi kèm khát nhiều, tiểu nhiều hoặc đường huyết cao."
  - finding: fatigue
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-3879-2014, nhs-diabetic-ketoacidosis, nhs-type-1-diabetes]
      locator: "3879/QĐ-BYT mục II.1.1 (mệt mỏi và/hoặc chán ăn); NHS DKA, NHS Type 1 diabetes (rất mệt)"
      note: "Ước khoảng một nửa trả lời 'mệt hơn hẳn bình thường'. Với Sốt, tỷ lệ nền 0,5 nên liên kết gần trung tính."
  - finding: drowsy_hard_to_wake
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-3879-2014, nhs-diabetic-ketoacidosis]
      locator: "3879/QĐ-BYT mục II.1.1 (ngủ gà, mơ màng) và bài Hôn mê tăng áp lực thẩm thấu (rối loạn ý thức); NHS DKA (buồn ngủ)"
      note: "Gặp ở ca nặng; người còn tự kiểm tra được thường tỉnh. Ước khoảng 20%. Đã có quy tắc mức 1 cho li bì, lú lẫn."
  - finding: confusion
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [nhs-diabetic-ketoacidosis, byt-qd-3879-2014]
      locator: "NHS DKA (lú lẫn); 3879/QĐ-BYT bài Hôn mê tăng áp lực thẩm thấu"
      note: "Như liên kết li bì; cùng cụm altered_consciousness."
  - finding: blurred_vision
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-3879-2014, nhs-diabetic-ketoacidosis]
      locator: "3879/QĐ-BYT mục II.1.1 (nhìn mờ); NHS DKA (nhìn mờ)"
      note: "Không có tỷ lệ; ước khoảng 20% (tỷ lệ nền 5%)."
  - finding: weight_loss_unintended
    freq: occasional
    freq_by_age: { child_2m_5y: frequent, child_5_12: frequent, teen_13_17: frequent }
    evidence:
      tier: B
      basis: numeric
      sources: [bich-apem-2025, byt-qd-3879-2014, byt-qd-3312-2015, nhs-type-1-diabetes]
      locator: "Bich 2025 phần Bàn luận; 3879/QĐ-BYT mục II.1.2 (sụt cân); 3312/QĐ-BYT (2015) (bệnh sử thường có sụt cân)"
      reported: "Sụt cân ở 57% trẻ đái tháo đường típ 1 mới mắc ở Việt Nam"
      note: "Trẻ em, thiếu niên (đái tháo đường típ 1 mới khởi phát): frequent. Người lớn phần lớn đã biết bệnh, nhiễm toan khởi phát trong 1–2 ngày: occasional."
  - finding: diabetes
    freq: very_frequent
    freq_by_age: { teen_13_17: frequent, elder_65_74: frequent, elder_75p: frequent }
    evidence:
      tier: B
      basis: numeric
      sources: [byt-qd-3879-2014, bich-apem-2025, nhs-diabetic-ketoacidosis]
      locator: "3879/QĐ-BYT bài Hôn mê tăng áp lực thẩm thấu mục I.2 (tới 40% là lúc phát hiện đái tháo đường típ 2); Bich 2025 (57,8% trẻ có nhiễm toan ceton ngay lúc được chẩn đoán)"
      reported: "Tới 40% ca tăng áp lực thẩm thấu là lần đầu phát hiện đái tháo đường; 57,8% trẻ có nhiễm toan ceton lúc chẩn đoán típ 1"
      note: "Áp dụng từ 13 tuổi theo danh mục. Người lớn nhiễm toan ceton phần lớn đã biết bệnh: very_frequent. Thiếu niên (hay khởi phát bằng nhiễm toan) và người từ 65 tuổi (tăng áp lực thẩm thấu, tới 40% chưa biết bệnh): frequent. Tỷ lệ nền 0,07."
  - finding: glucose_measured
    dist: { low: 0.003, normal: 0.027, high: 0.37, not_measured: 0.6 }
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-3879-2014, byt-qd-5481-2020, nhs-diabetic-ketoacidosis]
      locator: "3879/QĐ-BYT bài Nhiễm toan ceton mục II.2 (glucose máu trên 13,9 mmol/L) và bài Hôn mê tăng áp lực thẩm thấu mục II.1 (từ 33,3 mmol/L); 5481/QĐ-BYT Phần 7 mục 2.2 (nhiễm toan ketone do thuốc ức chế SGLT-2 có thể có đường huyết bình thường)"
      note: "'Chưa đo' giữ đúng tỷ lệ nền 0,6. Trong số người đã đo, hầu hết trên 11 mmol/L; một phần nhỏ nhiễm toan ceton có đường huyết gần bình thường (ví dụ người dùng thuốc ức chế SGLT2), nên để 'bình thường' khoảng 7%."
  - finding: fever
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-3312-2015, byt-qd-3879-2014]
      locator: "3312/QĐ-BYT (2015) bài Toan xeton (sốt khi có nhiễm trùng); 3879/QĐ-BYT bài Nhiễm toan ceton mục I.2 (nhiễm trùng là yếu tố thuận lợi)"
      note: "Sốt chỉ có khi nhiễm trùng khởi phát; ước khoảng 20% (tỷ lệ nền 5%). Có ý nghĩa với Đau bụng và Chóng mặt."
  - finding: dizziness_on_standing
    freq: frequent
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-3879-2014]
      locator: "3879/QĐ-BYT bài Nhiễm toan ceton mục II.1.2 (mất nước, hạ huyết áp) và bài Hôn mê tăng áp lực thẩm thấu (mất nước nặng)"
      note: "Mất nước gây tụt huyết áp tư thế. Ước khoảng một nửa (tỷ lệ nền 0,15)."
  - finding: dizziness_pattern
    dist: { brief_episodes: 0.1, long_episodes: 0.2, continuous: 0.55, chronic: 0.15 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-3879-2014]
      locator: "3879/QĐ-BYT bảng 2 (nhiễm toan ceton diễn biến vài giờ đến vài ngày; tăng áp lực thẩm thấu vài ngày đến vài tuần)"
      note: "Tính trong số người đã chóng mặt. Choáng do mất nước kéo dài liên tục; tăng áp lực thẩm thấu có thể kéo dài nhiều tuần. Phân bố là ước lượng."
  - finding: vertigo_spinning
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [byt-qd-3879-2014]
      note: "Tính trong số người đã chóng mặt. Chóng mặt do mất nước là choáng, không phải cảm giác quay; occasional thấp hơn tỷ lệ nền 0,4. Ước lượng."
