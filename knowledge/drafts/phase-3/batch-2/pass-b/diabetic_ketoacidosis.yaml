review:
  status: draft
  authors: ["agent:pass-b"]
  updated: "2026-10-27"
  notes_vi: "Lượt B (Giai đoạn 3 lô 2, phần a). Bệnh gồm nhiễm toan ceton và tăng áp lực thẩm thấu do đái tháo đường (gộp vì cùng cách xử trí tại nhà: đến cấp cứu). Mức xử trí 2, không được bỏ sót: giữ như gợi ý. 3879/QĐ-BYT: nhiễm toan ceton là biến chứng đe dọa tính mạng, cấp cứu nội khoa cần theo dõi tại khoa điều trị tích cực; tăng áp lực thẩm thấu tiên lượng xấu, tử vong cao. 5481/QĐ-BYT (2020, Phần 7): nhiễm toan ketone và tăng áp lực thẩm thấu là biến chứng cấp tính đe dọa tính mạng; nhiễm toan ketone diễn biến nhanh trong vài giờ, tăng áp lực thẩm thấu âm thầm vài ngày, tử vong cao hơn. NHS DKA: gọi 999 hoặc đến cấp cứu (mức 2) khi có triệu chứng mà không biết mức ceton hoặc chưa được chẩn đoán đái tháo đường. Mã E14.1 (đái tháo đường không xác định típ, có nhiễm toan ceton) chọn cho bệnh gộp; theo típ là E10.1, E11.1; tăng áp lực thẩm thấu E11.0; chưa đối chiếu được bảng ICD-10 của Bộ Y tế. Điểm chưa chắc: (1) prior là ước lượng, chưa có số liệu theo triệu chứng chính; (2) không mở được đồng thuận ADA/EASD 2024 về cơn tăng đường huyết (diabetesjournals.org chặn), nên tần suất nôn, thở nhanh sâu, mùi ceton dựa trên mô tả bằng lời của 5481/QĐ-BYT, 3879/QĐ-BYT, NHS, WHO BEC; 5481/QĐ-BYT (bản hiện hành về đái tháo đường típ 2) chỉ ghi đau bụng, nôn ở 'một số người bệnh, nhất là trẻ em', thấp hơn số 46% của Umpierrez 2002; (3) hơi thở mùi ceton để occasional (ước lượng); (4) người dùng insulin, thuốc ức chế SGLT2 chưa có câu hỏi riêng (lượt R đã đề xuất tách insulin); (5) câu khó thở gộp nhiều kiểu (để frequent theo 5481/QĐ-BYT, nhưng chỉ có ý nghĩa khi kèm khát nhiều, tiểu nhiều); (6) không liên kết tay chân lạnh (mất nước nặng) và tiểu ít vì nguồn không cho tần suất, quy tắc dấu hiệu sốc đã xử lý."
proposed_findings:
  - id: deep_rapid_breathing
    kind: sign
    type: binary
    label_vi: "Thở nhanh, sâu bất thường"
    question_vi: "Có thở nhanh và sâu bất thường dù đang ngồi hoặc nằm nghỉ không?"
    help_vi: "Người nhà thường thấy rõ: ngực, bụng phập phồng mạnh, thở như vừa chạy xong."
    alt_question:
      text_vi: "Người nhà có thấy người bệnh thở dồn dập, hít thở sâu liên tục không?"
    leak: 0.03
    leak_note: "Thở nhanh sâu khi nghỉ ít gặp ngoài nhiễm toan, sốt cao, viêm phổi, cơn hoảng sợ. Lượt B ước lượng."
    sources: [byt-qd-5481-2020, who-bec-2018, nhs-diabetic-ketoacidosis]
    notes_vi: "Lượt B lô 2 đề xuất (lượt R cũng đã nêu, mục 7.1). Câu khó thở hiện có gộp khó thở do phổi, tim, hen; thở nhanh sâu kiểu Kussmaul là triệu chứng phổ biến của nhiễm toan ketone (5481/QĐ-BYT Phần 7; NHS: thở sâu hơn bình thường; WHO BEC: người bệnh có thể kể là khó thở). Câu riêng giúp quy tắc rf_dka_suspected không phải dựa vào câu khó thở chung."
