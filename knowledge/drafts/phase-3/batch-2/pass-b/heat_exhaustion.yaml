id: heat_exhaustion
names:
  vi: "Kiệt sức do nóng"
  vi_common: ["Say nắng", "Say nóng"]
  en: "Heat exhaustion"
codes:
  icd10: "T67.5"
  icd10_verified: false
summary_vi:
  - "Cơ thể mất nước, mất muối và quá tải nhiệt sau khi ở nơi nắng nóng hoặc làm việc nặng."
  - "Thường mệt, chóng mặt, đau đầu, buồn nôn, vã mồ hôi, rất khát, có thể chuột rút; người vẫn tỉnh táo."
  - "Thường đỡ trong khoảng 30 phút nếu được đưa vào chỗ mát, làm mát và uống nước."
urgency: 5
cant_miss: false
specialties: [general_medicine, emergency]
priors:
  - complaint: dizziness
    default: P4
    evidence:
      tier: B
      basis: judgment
      sources: [kuo-bmcpublichealth-2025, mori-scirep-2026, msd-heat-exhaustion, nhs-heat-exhaustion-heatstroke]
      locator: "Kuo 2025 phần Results; Mori 2026 phần Results; MSD Heat Exhaustion; NHS Heat exhaustion and heatstroke"
      reported: "Bệnh do nóng được chẩn đoán 1,76–4,17 ca/10.000 dân/năm ở Đài Loan (người từ 20 tuổi, 60% khám ở phòng khám, 67,9% vào mùa hè); ở Nhật Bản 63,5% người bệnh do nóng được xe cấp cứu chở đi là thể nhẹ, không cần nằm viện"
      note: "Chóng mặt là triệu chứng chính của kiệt sức do nóng (NHS, MSD). Nếu khoảng 40 ca/100.000 dân/năm đi khám (Đài Loan, khí hậu gần với Việt Nam) và một nửa chọn Chóng mặt, so với vài nghìn lượt khám chóng mặt trên 100.000 dân mỗi năm, thì khoảng 0,5% người chóng mặt là do nóng: P4. Nhiều người say nắng nhẹ ở Việt Nam tự xử trí, không đi khám, nên con số thật có thể cao hơn; hệ số mùa ở miền Bắc nâng lên mức P3 vào mùa hè. Cần bác sĩ duyệt."
  - complaint: syncope
    default: P4
    evidence:
      tier: B
      basis: judgment
      sources: [msd-heat-exhaustion, kuo-bmcpublichealth-2025, nhs-heat-exhaustion-heatstroke]
      locator: "MSD Heat Exhaustion (ngất do nóng khi đứng lâu nơi nóng); Kuo 2025 bảng 2 (ngất do nóng là một thể bệnh do nóng)"
      note: "Ngất khi đứng lâu nơi nóng phần lớn đã được tính ở ngất phản xạ (lựa chọn 'khi đứng lâu, ở nơi nóng'); bệnh này đại diện cho ngất, choáng kèm các dấu hiệu kiệt sức do nóng (mất nước, mệt, vã mồ hôi sau phơi nắng, lao động nặng). Hai bệnh cùng lành tính và chồng lấn nhau, nên để P4 thay vì cao hơn. Ước lượng."
  - complaint: headache
    default: P4
    by_age: { child_2m_5y: P5 }
    evidence:
      tier: B
      basis: judgment
      sources: [kuo-bmcpublichealth-2025, nhs-heat-exhaustion-heatstroke, msd-heat-exhaustion]
      locator: "Kuo 2025 phần Results; NHS Heat exhaustion and heatstroke; MSD Heat Exhaustion"
      note: "Đau đầu là triệu chứng hay gặp của kiệt sức do nóng; nhóm người đi khám vì đau đầu lớn và phần lớn là đau đầu căng thẳng, đau nửa đầu, nên ước khoảng 0,2–1% (P4). Trẻ dưới 5 tuổi khó kể đau đầu: P5. Ước lượng."
  - complaint: fever
    default: P5
    evidence:
      tier: B
      basis: judgment
      sources: [nhs-heat-exhaustion-heatstroke, msd-heat-exhaustion, kuo-bmcpublichealth-2025]
      locator: "NHS Heat exhaustion and heatstroke (nhiệt độ cao là một dấu hiệu); MSD Heat Exhaustion (thân nhiệt thường bình thường, nếu tăng thì thường không quá 40°C)"
      note: "Người say nắng hay thấy nóng người, có thể sốt nhẹ, nhưng nhóm người sốt chủ yếu do nhiễm trùng (hàng chục nghìn lượt trên 100.000 dân mỗi năm), nên chỉ khoảng 0,02–0,2%: P5. Câu phơi nắng, số ngày sốt, nhiệt độ sẽ tách nhóm này. Ước lượng."
prior_modifiers:
  - when: { regions: [north], months: [5, 6, 7, 8] }
    factor: 2
    evidence:
      tier: B
      basis: judgment
      sources: [kuo-bmcpublichealth-2025, mori-scirep-2026, brindle-bmcinfectdis-2023]
      locator: "Kuo 2025 phần Results (67,9% vào tháng 6–8); Mori 2026 (đỉnh tháng 8, tháng 7); Brindle 2023 phần Results (khí hậu theo vĩ độ)"
      note: "Ở vùng cận nhiệt đới có mùa đông (Đài Loan), khoảng hai phần ba bệnh do nóng xảy ra trong 3 tháng hè (gấp khoảng 2,7 lần trung bình). Miền Bắc Việt Nam có mùa hè nóng, ẩm và mùa đông lạnh rõ rệt (Brindle 2023), nên áp dụng hệ số tương tự; chọn 2 (thận trọng) cho tháng 5–8. Miền Nam nóng quanh năm nên không có hệ số."
  - when: { regions: [north], months: [11, 12, 1, 2] }
    factor: 0.2
    evidence:
      tier: B
      basis: judgment
      sources: [kuo-bmcpublichealth-2025, brindle-bmcinfectdis-2023]
      locator: "Kuo 2025 phần Results; Brindle 2023 phần Results"
      note: "Mùa đông ở miền Bắc lạnh, khô; bệnh do nóng rất ít gặp (Đài Loan: phần lớn ca vào mùa hè). Vẫn còn có thể gặp khi lao động nặng trong môi trường nóng (lò, xưởng), nên không thấp hơn 0,2."
findings:
  - finding: heat_exposure
    freq: almost_always
    evidence:
      tier: C
      basis: verbal
      sources: [msd-heat-exhaustion, nhs-heat-exhaustion-heatstroke]
      locator: "MSD Heat Exhaustion (định nghĩa: do phơi nhiễm nóng); NHS Heat exhaustion and heatstroke"
      note: "Bệnh do định nghĩa là hậu quả của nắng nóng hoặc lao động nặng nơi nóng. Không có phơi nhiễm thì gần như loại trừ (trả lời 'Không' giảm khả năng khoảng 17 lần)."
  - finding: dizziness
    freq: very_frequent
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-heat-exhaustion-heatstroke, msd-heat-exhaustion]
      locator: "NHS (dấu hiệu kiệt sức do nóng); MSD (triệu chứng)"
      note: "NHS và MSD đều liệt kê chóng mặt trong các triệu chứng chính; không có tỷ lệ. Có tác dụng khi triệu chứng chính là Đau đầu, Ngất hoặc Sốt."
  - finding: headache
    freq: frequent
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-heat-exhaustion-heatstroke, msd-heat-exhaustion]
      locator: "NHS (dấu hiệu kiệt sức do nóng); MSD (triệu chứng)"
      note: "Nguồn liệt kê đau đầu nhưng không có tỷ lệ; ước khoảng một nửa. Với Sốt (tỷ lệ nền 0,7), liên kết này gần như không đổi khả năng bệnh."
  - finding: nausea
    freq: frequent
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-heat-exhaustion-heatstroke, msd-heat-exhaustion]
      locator: "NHS (buồn nôn hoặc nôn); MSD (buồn nôn, đôi khi nôn)"
      note: "Nguồn liệt kê buồn nôn; ước khoảng một nửa."
  - finding: vomiting
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [msd-heat-exhaustion, nhs-heat-exhaustion-heatstroke]
      locator: "MSD (đôi khi nôn)"
      note: "MSD: đôi khi nôn; chuyển theo bảng 2.1 thành occasional."
  - finding: persistent_vomiting
    freq: rare
    evidence:
      tier: C
      basis: judgment
      sources: [msd-heat-exhaustion]
      locator: "MSD Heat Exhaustion (nôn nhiều không uống được thì truyền dịch)"
      note: "Kiệt sức do nóng thường đỡ khi được bù nước đường uống; nôn liên tục ít gặp và là lý do phải đi khám. Thấp hơn tỷ lệ nền 5%."
  - finding: fatigue
    freq: very_frequent
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-heat-exhaustion-heatstroke, msd-heat-exhaustion]
      locator: "NHS (mệt); MSD (mệt, yếu, khó chịu toàn thân)"
      note: "Triệu chứng chính theo cả hai nguồn; không có tỷ lệ."
  - finding: cold_sweat
    freq: frequent
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-heat-exhaustion-heatstroke, msd-heat-exhaustion]
      locator: "NHS (ra nhiều mồ hôi, da tái và ẩm); MSD (vã mồ hôi)"
      note: "Câu hỏi 'vã mồ hôi lạnh' gần với 'da tái, ẩm, ra nhiều mồ hôi' của NHS. Đây là điểm phân biệt với sốc nhiệt (da nóng, có thể không ra mồ hôi). Ước lượng."
  - finding: fainting_or_near_fainting
    freq: occasional
    freq_by_complaint: { dizziness: frequent }
    evidence:
      tier: C
      basis: verbal
      sources: [msd-heat-exhaustion, nhs-heat-exhaustion-heatstroke]
      locator: "MSD Heat Exhaustion (ngất do nóng khi đứng lâu nơi nóng; mệt, yếu, chóng mặt)"
      note: "Có tác dụng khi triệu chứng chính không phải Ngất. Ở người chọn Chóng mặt, cảm giác choáng như sắp ngất là một phần hay gặp của chóng mặt do mất nước, nóng, nên để frequent (tỷ lệ nền với Chóng mặt là 0,25). Ước lượng."
  - finding: dizziness_on_standing
    freq: frequent
    evidence:
      tier: C
      basis: verbal
      sources: [msd-heat-exhaustion]
      locator: "MSD Heat Exhaustion (có thể hạ huyết áp tư thế; thường mất nước)"
      note: "Mất nước gây choáng khi đứng dậy; ước lượng."
  - finding: palpitations
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [msd-heat-exhaustion]
      locator: "MSD Heat Exhaustion (tim nhanh)"
      note: "Tim nhanh là dấu hiệu thường thấy khi khám; người bệnh không phải lúc nào cũng nhận ra. Ước lượng."
  - finding: decreased_urine
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [msd-heat-exhaustion, nhs-heat-exhaustion-heatstroke]
      locator: "MSD Heat Exhaustion (thường mất nước); NHS (rất khát)"
      note: "Mất nước làm nước tiểu ít, sẫm màu; ước lượng."
  - finding: fever
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-heat-exhaustion-heatstroke, msd-heat-exhaustion]
      locator: "NHS (nhiệt độ cao); MSD (thân nhiệt thường bình thường, có thể tăng nhẹ)"
      note: "Có tác dụng khi triệu chứng chính không phải Sốt. Hai nguồn khác nhau (NHS liệt kê nhiệt độ cao, MSD ghi thường bình thường), nên chọn occasional."
  - finding: fever_max_temp
    dist: { lt_38: 0.55, t38_39: 0.35, ge_39: 0.10 }
    evidence:
      tier: C
      basis: verbal
      sources: [msd-heat-exhaustion]
      locator: "MSD Heat Exhaustion (nếu tăng thì thường không quá 40°C)"
      note: "Phân bố trong số người có sốt: phần lớn sốt nhẹ. Ước lượng."
  - finding: fever_duration
    dist: { d1_2: 0.96, d3_5: 0.03, d6_7: 0.005, gt_7d: 0.005 }
    evidence:
      tier: C
      basis: verbal
      sources: [msd-heat-exhaustion, nhs-heat-exhaustion-heatstroke]
      locator: "MSD (đỡ khi nghỉ, làm mát, bù nước); NHS (thường đỡ trong 30 phút)"
      note: "Nóng người do say nắng hết trong ngày khi được làm mát; sốt nhiều ngày gợi ý nhiễm trùng."
  - finding: confusion
    freq: very_rare
    evidence:
      tier: C
      basis: verbal
      sources: [msd-heat-exhaustion, msd-heatstroke, nhs-heat-exhaustion-heatstroke]
      locator: "MSD Heat Exhaustion (tri giác bình thường là điểm phân biệt chính với sốc nhiệt); NHS (lú lẫn là dấu hiệu sốc nhiệt)"
      note: "Theo định nghĩa, kiệt sức do nóng không có rối loạn thần kinh trung ương; có lú lẫn thì nghĩ sốc nhiệt (quy tắc mức 1). Thấp hơn tỷ lệ nền 1%."
  - finding: drowsy_hard_to_wake
    freq: very_rare
    evidence:
      tier: C
      basis: verbal
      sources: [msd-heat-exhaustion, nhs-heat-exhaustion-heatstroke]
      locator: "MSD Heat Exhaustion; NHS (mất ý thức là dấu hiệu sốc nhiệt)"
      note: "Như lú lẫn; cùng cụm rối loạn tri giác."
  - finding: not_recovered_after_faint
    freq: rare
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-heat-exhaustion-heatstroke, msd-heat-exhaustion]
      locator: "NHS (vẫn không khỏe sau 30 phút làm mát là dấu hiệu sốc nhiệt)"
      note: "Tần suất trong số người đã ngất hoặc suýt ngất. Kiệt sức do nóng hồi phục nhanh khi nằm nghỉ chỗ mát; chưa hồi phục hẳn thì nghĩ sốc nhiệt. Thấp hơn tỷ lệ nền 5%."
  - finding: vertigo_spinning
    freq: occasional
    evidence:
      tier: C
      basis: judgment
      sources: [msd-heat-exhaustion, nhs-heat-exhaustion-heatstroke]
      locator: "MSD Heat Exhaustion; NHS"
      note: "Tần suất trong số người đã chóng mặt. Nguồn mô tả chóng mặt, choáng do mất nước, không mô tả cảm giác quay tròn; ước occasional, thấp hơn tỷ lệ nền 0,4 để trả lời 'quay tròn' nghiêng về bệnh tiền đình."
  - finding: dizziness_pattern
    dist: { brief_episodes: 0.15, long_episodes: 0.30, continuous: 0.50, chronic: 0.05 }
    evidence:
      tier: C
      basis: judgment
      sources: [msd-heat-exhaustion, nhs-heat-exhaustion-heatstroke]
      locator: "MSD Heat Exhaustion; NHS"
      note: "Chóng mặt xuất hiện trong ngày phơi nắng, kéo dài đến khi được làm mát, bù nước; ít khi kéo dài nhiều tuần. Ước lượng."
  - finding: syncope_trigger
    dist: { standing_heat: 0.60, emotion_pain: 0.02, standing_up: 0.20, toilet_cough: 0.03, exertion: 0.10, lying: 0.01, no_trigger: 0.04 }
    evidence:
      tier: C
      basis: judgment
      sources: [msd-heat-exhaustion, nhs-heat-exhaustion-heatstroke]
      locator: "MSD Heat Exhaustion (ngất khi đứng lâu nơi nóng; hạ huyết áp tư thế)"
      note: "Phần lớn ngất khi đứng lâu nơi nóng hoặc khi đứng dậy; một phần khi đang lao động nặng. Ngất khi gắng sức vẫn ở mức 2 theo quy tắc chung. Ước lượng."
  - finding: syncope_warning
    dist: { prodrome: 0.85, palpitations_first: 0.05, no_warning: 0.10 }
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-heat-exhaustion-heatstroke, msd-heat-exhaustion]
      locator: "NHS (mệt, chóng mặt, vã mồ hôi, buồn nôn trước đó)"
      note: "Thường có dấu hiệu báo trước như nóng người, vã mồ hôi, buồn nôn, tối sầm mắt. Ước lượng."
  - finding: headache_severity
    dist: { mild: 0.45, moderate: 0.45, severe: 0.10 }
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-heat-exhaustion-heatstroke]
      locator: "NHS Heat exhaustion and heatstroke"
      note: "Bệnh nhẹ, đỡ nhanh khi làm mát; đau rất nặng ít gặp. Ước lượng."
  - finding: headache_course
    dist: { first_time: 0.55, recurrent_similar: 0.40, progressive: 0.05 }
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-heat-exhaustion-heatstroke]
      locator: "NHS Heat exhaustion and heatstroke"
      note: "Người làm việc ngoài trời có thể từng bị đau đầu do nắng nóng nhiều lần; ước lượng."
  - finding: headache_duration
    dist: { lt_4h: 0.50, h4_72: 0.48, gt_3d: 0.02 }
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-heat-exhaustion-heatstroke, msd-heat-exhaustion]
      locator: "NHS (thường đỡ trong 30 phút); MSD (đỡ khi nghỉ, bù nước)"
      note: "Đau đầu do nóng thường hết trong ngày; hơn 3 ngày gợi ý nguyên nhân khác. Ước lượng."
warning_signs:
  - confusion
  - drowsy_hard_to_wake
  - seizure_recent
  - es_unresponsive_or_seizing
  - not_recovered_after_faint
  - breathing_difficulty
  - persistent_vomiting
self_care_vi:
  - "Đưa ngay vào chỗ mát, thoáng gió; cho nằm nghỉ, kê cao chân nếu thấy choáng."
  - "Cởi bớt quần áo; lau hoặc xịt nước mát lên da và quạt liên tục."
  - "Nếu tỉnh táo và không nôn, cho uống từng ngụm nước mát."
  - "Ở bên cạnh người bệnh; thường đỡ trong khoảng 30 phút."
  - "Không uống rượu bia; không làm việc nặng tiếp trong ngày hôm đó."
  - "Phòng bệnh: tránh nắng gắt buổi trưa, đội nón, mặc áo thoáng và uống nước thường xuyên."
see_doctor_vi:
  - "Gọi 115 nếu sau 30 phút nghỉ chỗ mát, được làm mát và uống nước mà vẫn chưa đỡ."
  - "Gọi 115 ngay nếu lú lẫn, nói lắp, đi loạng choạng, co giật, ngất chưa tỉnh hẳn hoặc da nóng không ra mồ hôi."
  - "Đi khám trong ngày nếu nôn nhiều, không uống được, hoặc người bệnh là người già, trẻ nhỏ, người có bệnh tim, tiểu đường."
review:
  status: draft
  authors: ["agent:pass-b"]
  updated: "2026-10-26"
  notes_vi: "Lượt B (Giai đoạn 3, lô 2, phần b). Tách khỏi sốc nhiệt theo scope.yaml. Mức xử trí 5, không thuộc nhóm không được bỏ sót, giữ như gợi ý: NHS (kiệt sức do nóng thường không cần cấp cứu nếu làm mát được trong 30 phút) và MSD (không đe dọa tính mạng; tri giác bình thường; triệu chứng không hết sau 30–60 phút bù nước thì đến cấp cứu). Lời khuyên sơ cứu theo 4 bước của NHS; không ghi thuốc. Ranh giới với sốc nhiệt: lú lẫn, li bì, co giật, ngất chưa hồi phục để very_rare hoặc rare ở bệnh này và very_frequent hoặc frequent ở sốc nhiệt; quy tắc rf_heat_stroke_signs (mức 1) bắt các dấu hiệu này. Không liên kết co giật vì tỷ lệ nền của co giật khi Sốt (0,2%) thấp hơn mức very_rare; sốc nhiệt đã đảm nhận. Tên thường gọi 'say nắng' trong dân gian thường chỉ thể nhẹ này, nhưng ICD-10 có thể dùng 'say nắng' cho mã T67.0 (sốc nhiệt); chưa đối chiếu được bộ mã của Bộ Y tế (T67.5 kiệt sức do nóng, không đặc hiệu; T67.1 ngất do nóng). Chưa tìm được hướng dẫn chẩn đoán, điều trị của Bộ Y tế về bệnh do nóng; nguồn chính là NHS, MSD (bậc C) và số liệu dịch tễ Đài Loan, Nhật Bản. Điểm cần bác sĩ xem: (1) prior và hệ số mùa là ước lượng, chưa có số liệu Việt Nam; miền Trung (gió Lào) chưa có hệ số riêng; (2) với Ngất, bệnh này chồng lấn với ngất phản xạ (ngất khi đứng lâu nơi nóng); (3) catalog chưa có câu 'rất khát', 'chuột rút', 'đã làm mát, uống nước 30 phút mà chưa đỡ'."
