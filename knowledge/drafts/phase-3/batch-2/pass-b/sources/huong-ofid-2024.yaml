notes_vi: "Lượt B đọc toàn văn (PMC11651147) qua API Europe PMC ngày 26/10/2026. Nghiên cứu tiến cứu tại Bệnh viện Nhi Đồng 1, TP.HCM (3/2020–12/2022): 164 trẻ (đến 16 tuổi) thỏa định nghĩa ca viêm não (rối loạn tri giác từ 24 giờ kèm ít nhất 2 tiêu chuẩn phụ: sốt từ 38°C trong 72 giờ, co giật, dấu thần kinh khu trú, tăng bạch cầu dịch não tủy, hình ảnh não, điện não). Căn nguyên: viêm não tự miễn kháng thụ thể NMDA 14,0%, vi rút viêm não Nhật Bản 8,5%, vi rút herpes 2,4%; 43,3% nghĩ do vi rút chưa xác định. Bảng 1: sốt 70% toàn mẫu (viêm não Nhật Bản 100%, herpes 100%, tự miễn NMDA 56,5%); co giật khoảng 63% toàn mẫu (Nhật Bản 42,9%); dấu thần kinh khu trú 23% (Nhật Bản 50%); số ngày bệnh trước nhập viện trung vị 4–5; nhiệt độ cao nhất trung vị 39,0°C (Nhật Bản 39,0, herpes 39,4); tuổi trung vị viêm não Nhật Bản 4,5 tuổi."
