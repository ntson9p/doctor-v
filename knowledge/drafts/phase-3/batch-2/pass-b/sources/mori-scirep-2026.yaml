notes_vi: "Lượt B đọc toàn văn (PMC13473147) qua API Europe PMC ngày 26/10/2026. Số liệu xe cấp cứu chở người bệnh do nóng (gồm cả sốc nhiệt, chuột rút do nóng, kiệt sức do nóng) ở Nhật Bản tháng 6–9, 2010–2024: đỉnh tháng 8 rồi tháng 7; người từ 65 tuổi chiếm trung bình 50,7%, 18–64 tuổi 36,6%; 63,5% nhẹ (không cần nằm viện), 33% vừa (cần nằm viện), 2,4% nặng (nằm viện trên 3 tuần), 0,1–0,3% tử vong khi khám lần đầu; 39,9% xảy ra trong nhà."
