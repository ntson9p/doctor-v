notes_vi: "Lượt B đọc toàn văn (PMC12461986) qua API Europe PMC ngày 26/10/2026. Cơ sở dữ liệu bảo hiểm y tế toàn dân Đài Loan 2000–2018, người từ 20 tuổi: 101.614 ca bệnh do nóng; tỷ suất mắc tăng từ 1,76 lên 4,17/10.000 dân/năm; 56,2% nam; tuổi trung bình 48,2; 44,8% ở tuổi 20–44; 67,9% xảy ra vào mùa hè (tháng 6–8); 59,9% được khám ở phòng khám; dưới 1% kèm co giật, tiêu cơ vân hoặc sốc. Mã 'sốc nhiệt' được dùng nhiều nhất, nhưng tác giả lưu ý có thể bị mã hóa nhầm từ các thể nhẹ (nghiên cứu trước ở khoa cấp cứu thấy kiệt sức do nóng là thể hay gặp nhất). Tử vong 3 tháng ở người được mã sốc nhiệt 1,0%."
