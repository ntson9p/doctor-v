notes_vi: "Lượt B (Giai đoạn 3 lô 2) đọc tóm tắt qua API Europe PMC. Tổng quan 163 nghiên cứu: tỷ lệ mới mắc trung bình 6,2 (khoảng tin cậy 95% 1,9–12,9) trên 100.000 người-năm ở người lớn; 5,0 trên 10.000 lượt nhập viện; tắc động mạch chiếm 68,6% (tắc do cục máu đông và huyết khối tại chỗ gần bằng nhau); tử vong ngắn hạn 59,6% (55,0% từ năm 2000), huyết khối tĩnh mạch 24,6%, thể không tắc mạch 58,4%."
