notes_vi: "Lượt B (Giai đoạn 3 lô 2) tải toàn văn qua API Europe PMC (PMC11449771). 67 trẻ được mổ vì xoắn tinh hoàn ở Trung Quốc (2018–2023): bên trái 68,7%; đau bìu 95,5%, sưng đỏ bìu 91,0%, buồn nôn hoặc nôn 11,9%. Phần bàn luận tổng hợp các nghiên cứu: đau bìu 70–90%, sưng bìu 60–75%, đau bụng 7–28%, buồn nôn hoặc nôn 5–43%. Thời gian triệu chứng là yếu tố quyết định giữ được tinh hoàn."
