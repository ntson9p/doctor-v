notes_vi: "Lượt B (Giai đoạn 3 lô 2) tải toàn văn qua API Europe PMC (PMC3429782). Bài xây dựng tiêu chuẩn chẩn đoán, phân độ viêm đường mật cấp của Tokyo 2013 (Tokyo 2018 giữ nguyên tiêu chuẩn này; chưa mở được toàn văn Tokyo 2018 vì Wiley chặn). 1.432 người nghi viêm đường mật ở các trung tâm Nhật Bản; 794 người viêm đường mật (402 do sỏi ống mật chủ, 392 do u ác), tuổi trung bình 71,7, nam 62%: tam chứng Charcot 18,5%, đau bụng 54,8%. Tam chứng Charcot có độ nhạy 26,4%, độ đặc hiệu 95,9%. Tiêu chuẩn: A (sốt và/hoặc rét run; xét nghiệm viêm), B (vàng da; men gan bất thường), C (giãn đường mật, thấy nguyên nhân trên chẩn đoán hình ảnh); đau bụng và tiền sử bệnh đường mật bị bỏ khỏi tiêu chuẩn vì cũng hay gặp ở viêm túi mật. Phân độ trung bình gồm sốt từ 39°C."
