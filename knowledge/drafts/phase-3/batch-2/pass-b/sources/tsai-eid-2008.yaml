notes_vi: "Lượt B (Giai đoạn 3 lô 2) tải toàn văn qua API Europe PMC (PMC2609891). 29.703 ca áp xe gan do vi khuẩn trong dữ liệu bảo hiểm y tế Đài Loan 1996–2004: tỷ lệ mới mắc chung 14,87/100.000/năm (nam 17,94, nữ 11,65), tăng từ 11,15 lên 17,59; nam 61,7%; tuổi trung vị 61, đỉnh 60–69; đái tháo đường 33,3%, sỏi mật 14,6%, xơ gan 10,4%; đái tháo đường và ung thư làm tăng nguy cơ khoảng 10 lần; tử vong 10,9%."
