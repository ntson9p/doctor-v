notes_vi: "Lượt B (Giai đoạn 3 lô 2) mở trang bằng WebFetch (rà soát toàn bộ 5/2024). Áp xe gan do amip: nam gặp nhiều hơn nữ 7–9 lần; có thể khởi phát âm ỉ, kể cả ở người chưa từng có triệu chứng ở ruột; đau hoặc khó chịu vùng gan, có khi lan lên vai phải; sốt từng đợt, vã mồ hôi, rét run; buồn nôn, nôn, mệt, sụt cân; vàng da ít gặp và nhẹ. Ổ áp xe có thể vỡ hoặc lan lên dưới cơ hoành, màng phổi phải, phổi phải hoặc các cơ quan lân cận như màng ngoài tim."
