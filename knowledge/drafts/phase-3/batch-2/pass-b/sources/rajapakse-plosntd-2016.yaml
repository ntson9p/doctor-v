notes_vi: "Lượt B đọc toàn văn (PMC4917116) qua API Europe PMC ngày 26/10/2026. 592 người nằm viện vì nghi bệnh do Leptospira ở 2 bệnh viện Sri Lanka (từ 6/2012, 24 tháng); 232 xác định bằng MAT. Bảng 3 (nhóm phát triển: Leptospira so với sốt do nguyên nhân khác): sốt 95% / 93,7%; rét run 73,9% / 69,6%; có phơi nhiễm 74,6% / 53,0%; đau đầu 81,7% / 77,4%; đau cơ 88,3% / 80,0%; xung huyết kết mạc 55% / 43,3%; vàng da 27,2% / 17,8%; sợ ánh sáng 8,9%; cứng gáy 13,3% / 13,7%; ấn đau cơ 67,8% / 61,9%; tiểu ít 31,1% / 18,5%; xuất huyết phổi 0,6%. 58% người bệnh Leptospira cần lọc máu (nhóm nặng ở bệnh viện). Tác giả: ngoài phơi nhiễm, không triệu chứng lâm sàng nào phân biệt đáng tin cậy."
