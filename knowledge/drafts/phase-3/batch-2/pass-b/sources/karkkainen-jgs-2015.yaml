notes_vi: "Lượt B (Giai đoạn 3 lô 2) đọc tóm tắt qua API Europe PMC. Nghiên cứu dân số ở một vùng của Phần Lan, 2009–2013: tỷ lệ mới mắc thiếu máu mạc treo cấp nhập viện 7,3/100.000/năm (tắc mạch 4,5; không tắc mạch 2,0). Thiếu máu mạc treo cấp hay gặp hơn vỡ phình động mạch chủ bụng; ở người đau bụng cấp từ 75 tuổi, tỷ lệ mới mắc theo tuổi cao hơn viêm ruột thừa. Khuyến cáo chụp cắt lớp cản quang khẩn ở người cao tuổi đau bụng cấp."
