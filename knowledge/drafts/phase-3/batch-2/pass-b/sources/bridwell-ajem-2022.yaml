notes_vi: "Lượt B (Giai đoạn 3 lô 2) đọc tóm tắt qua API Europe PMC. Bài tổng quan tường thuật cho bác sĩ cấp cứu: xoắn buồng trứng hiếm, hay bị chẩn đoán nhầm; yếu tố nguy cơ là nang hoặc khối buồng trứng; hay gặp ở tuổi sinh đẻ nhưng cũng gặp ở trẻ chưa có kinh, phụ nữ có thai, phụ nữ mãn kinh; đau bụng hoặc vùng chậu hay gặp nhưng không phải lúc nào cũng đột ngột, dữ dội; buồn nôn và nôn ở 70%; siêu âm bình thường không loại trừ; cần hội chẩn phụ khoa cấp cứu để mổ tháo xoắn."
