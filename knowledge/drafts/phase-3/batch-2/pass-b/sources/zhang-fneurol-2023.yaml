notes_vi: "Lượt B đọc toàn văn (PMC10160806) qua API Europe PMC ngày 26/10/2026. 107 người viêm não Nhật Bản nằm viện ở miền Bắc Trung Quốc (2006–2019; 62 trẻ em, 45 người lớn). Bảng 1: sốt 100%; rối loạn ý thức 68,2% (trẻ em 71%, người lớn 64,4%); đau đầu 54,2% (trẻ em 46,8%, người lớn 64,4%); co giật 40,2% (trẻ em 54,8%, người lớn 20%); buồn nôn, nôn 16,8%; yếu chi 5,6%; khởi bệnh tháng 7–10."
