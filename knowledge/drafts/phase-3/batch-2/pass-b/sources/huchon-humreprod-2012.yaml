notes_vi: "Lượt B (Giai đoạn 3 lô 2) đọc tóm tắt qua API Europe PMC. Nghiên cứu tiến cứu ở 5 bệnh viện Pháp: 496 phụ nữ đau vùng chậu cấp (điểm đau trên 4/10), 31 người xoắn phần phụ (khoảng 6%). Dùng bộ câu hỏi tự đánh giá; yếu tố độc lập: đau một bên bụng hoặc thắt lưng (aDOR 23,3), không có khí hư và không ra máu âm đạo (7,0), đau buồng trứng (5,5), đau không chịu nổi (5,0), nôn (3,7)."
