notes_vi: "Lượt B (Giai đoạn 3 lô 2) đọc tóm tắt qua API Europe PMC. 20 nghiên cứu (2.077 người), 11 nghiên cứu về triệu chứng, dấu hiệu. Độ nhạy gộp: đau bụng 61,7%, đau lưng 53,6%, ngất 27,8%, tụt huyết áp 30,9%, khối đập ở bụng 47,1% (độ chắc chắn thấp). Chụp cắt lớp mạch máu độ nhạy 91,4%, độ đặc hiệu 93,6%. Kết luận: triệu chứng kinh điển có độ nhạy kém, không có chúng cũng không loại trừ được vỡ phình."
