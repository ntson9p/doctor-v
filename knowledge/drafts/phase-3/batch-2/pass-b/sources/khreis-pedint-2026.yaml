notes_vi: "Lượt B đọc toàn văn (PMC13691512) qua API Europe PMC ngày 26/10/2026. Tổng quan phạm vi 40 nghiên cứu (10 cohort hồi cứu). Tỷ lệ sẹo BCG tấy đỏ lại trong bệnh Kawasaki 11,8–49,9% tùy cohort: Nhật Bản 44% (7.549/17.181) và 49,9% (7.745/15.524); Hàn Quốc 25,6% (121/473; 89% ở trẻ từ 3 tháng trở xuống, 22,9% ở trẻ lớn hơn); Đài Loan 49,2% và 31,7%; Mexico 24,3%; Singapore 42,7% ở trẻ Kawasaki so với 9,9% ở trẻ sốt do nguyên nhân khác; Ấn Độ 11,8%. Hay gặp nhất ở trẻ dưới 2 tuổi, nhiều nhất dưới 6–12 tháng; thường xuất hiện sớm trong giai đoạn sốt."
