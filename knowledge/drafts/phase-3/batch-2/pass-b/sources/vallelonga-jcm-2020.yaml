notes_vi: "Lượt B đọc toàn văn (PMC7408741) qua API Europe PMC ngày 26/10/2026. 718 người đến cấp cứu ở Turin (1–6/2018) có huyết áp tâm thu trên 180 và/hoặc tâm trương trên 110 mmHg: 79 (11%) cấp cứu tăng huyết áp (có tổn thương cơ quan đích cấp), 639 tăng huyết áp không kiểm soát. Nhóm không kiểm soát (tuổi trung bình 69,5; 78% đã biết tăng huyết áp; huyết áp lúc vào trung bình 188/98): đau đầu 13%, chóng mặt 10%, chảy máu mũi 3%, ngất hoặc suýt ngất 4%, buồn nôn, nôn 8%, hồi hộp 8%, đau ngực 12%, khó thở 11%, lú lẫn 10%, giảm thị lực 3%, không triệu chứng 10%. Nhóm cấp cứu: khó thở 32%, dấu thần kinh khu trú 38%, đau ngực 17%, đau đầu 8%. Rối loạn tăng huyết áp cấp chiếm khoảng 1,76–2% lượt đến cấp cứu ở Ý; thuật ngữ 'tăng huyết áp khẩn cấp' (không tổn thương cơ quan) không còn được khuyến khích vì tiên lượng và xử trí không khác tăng huyết áp không kiểm soát không triệu chứng."
