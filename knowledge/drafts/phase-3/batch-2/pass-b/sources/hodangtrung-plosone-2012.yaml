notes_vi: "Lượt B đọc toàn văn (PMC3360608) qua API Europe PMC ngày 26/10/2026. 1.241 người nghi nhiễm trùng thần kinh trung ương ở 13 bệnh viện tuyến tỉnh miền Trung và miền Nam (8/2007–4/2010). Trẻ em (624, tuổi trung vị 4): viêm não, viêm màng não do vi rút 69%, viêm màng não vi khuẩn 24%; vi rút viêm não Nhật Bản là căn nguyên hàng đầu (23%), enterovirus 6%, herpes 2%, dengue 2%. Người lớn (617): viêm màng não vi khuẩn 49%, viêm não, viêm màng não do vi rút 34%; liên cầu lợn hàng đầu (24%). Tử vong trong viện 12% ở người lớn, 7% ở trẻ em."
