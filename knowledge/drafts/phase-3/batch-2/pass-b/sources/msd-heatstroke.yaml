notes_vi: "Lượt B mở trang ngày 26/10/2026. Sốc nhiệt: thân nhiệt trung tâm trên 40°C kèm rối loạn tri giác; có thể còn hoặc hết mồ hôi. Rối loạn thần kinh trung ương là dấu hiệu chủ chốt, từ lú lẫn, hành vi kỳ lạ đến mê sảng, co giật, hôn mê; đi loạng choạng có thể là dấu hiệu sớm; tim nhanh, thở nhanh hay gặp. Thể cổ điển (khởi phát 2–3 ngày) ở người cao tuổi ít vận động, trẻ nhỏ, người có bệnh nền, khi nắng nóng kéo dài; thể gắng sức (vài giờ) ở người khỏe vận động nặng như vận động viên, bộ đội, công nhân. Phân biệt với kiệt sức do nóng bằng rối loạn thần kinh trung ương và thân nhiệt trên 40°C. Chẩn đoán phân biệt: nhiễm khuẩn (nhiễm khuẩn huyết, sốt rét, viêm màng não), thuốc, đột quỵ, cơn bão giáp. Cần hạ thân nhiệt dưới 39°C trong 30 phút; ngâm nước lạnh hoặc xịt nước mát kèm quạt mạnh rất hiệu quả; không dùng thuốc hạ sốt."
