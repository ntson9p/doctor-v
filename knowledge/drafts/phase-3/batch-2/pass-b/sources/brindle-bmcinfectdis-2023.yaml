notes_vi: "Lượt B đọc toàn văn (PMC10262680) qua API Europe PMC ngày 26/10/2026. Số liệu giám sát hội chứng viêm não cấp của Cục Y tế dự phòng 1998–2016: tỷ suất mắc toàn quốc giảm 63,3%, từ 3,0 xuống 1,1 ca/100.000 dân/năm; tháng cao nhất là tháng 6/2004 (0,8/100.000 trong 1 tháng). Ở miền Bắc, bệnh đạt đỉnh vào các tháng hè; ở miền Nam tương đối đều quanh năm; cao nhất ở các tỉnh Tây Bắc (Sơn La, Lai Châu; Sơn La 5,7 lên 11,3/100.000). Viêm não Nhật Bản gây dịch theo mùa ở các tỉnh phía Bắc tháng 5–7 và rải rác quanh năm ở miền Nam; herpes không theo mùa. Khí hậu: miền Nam nóng, ẩm quanh năm; càng lên phía Bắc mùa càng rõ (đông lạnh, khô; hè nóng, ẩm); Tây Nguyên mát hơn do độ cao."
