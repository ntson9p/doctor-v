notes_vi: "Lượt B (Giai đoạn 3 lô 2) đọc tóm tắt qua API Europe PMC. Phần mở đầu: tới 22% trẻ xoắn tinh hoàn lúc đầu chỉ đau bụng dưới, sau đó mới đau bìu. 92 người lớn xoắn tinh hoàn ở khoa cấp cứu (Ý): 7 người (6,4%) chỉ đau bụng lúc đầu; 4/7 mất tinh hoàn do chẩn đoán muộn. Khuyên luôn khám tinh hoàn ở nam giới đau bụng dưới."
