notes_vi: "Lượt B (Giai đoạn 3 lô 2) tải toàn văn qua API Europe PMC (PMC12968706). 106 người lớn áp xe gan do vi khuẩn có cấy dương tính ở Bệnh viện Nhân dân Gia Định, TP. Hồ Chí Minh (6/2021–6/2024): Klebsiella pneumoniae 78,3%; tuổi trung bình 59,2; nam 67%; đái tháo đường 50%; sốt 81,1%; đau hạ sườn phải 61,3%; vàng da 8,5%; nhiễm trùng phổi kèm theo 27,4%; ổ áp xe ở gan phải 56,6%; một ổ 79,2%; tử vong 10,4%. Phần mở đầu dẫn: tỷ lệ mới mắc áp xe gan 2,3–3,6/100.000 ở châu Âu, châu Mỹ, 14–18/100.000 ở châu Á."
