notes_vi: "Lượt B đọc toàn văn (PMC6911871) qua API Europe PMC ngày 26/10/2026. Cơ sở dữ liệu bảo hiểm y tế quốc gia Hàn Quốc: 11.043 người từ 20 tuổi mới mắc glôcôm góc đóng cấp (2011–2015), 72,6% là nữ; tỷ suất chuẩn hóa 59,95/1.000.000 người-năm; tăng mạnh theo tuổi, đỉnh 75–79 tuổi (nữ đỉnh 70–74 tuổi); nữ gấp 2,56 lần nam."
