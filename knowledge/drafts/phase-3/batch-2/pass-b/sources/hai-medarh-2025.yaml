notes_vi: "Lượt B (Giai đoạn 3 lô 2) tải toàn văn qua API Europe PMC (PMC12253584). Khảo sát dân số chọn ngẫu nhiên ở Phú Thọ và Nghệ An (2022–2023): 810 người từ 60 tuổi (40,2% nam, tuổi trung bình 70,9), siêu âm động mạch chủ bụng: chỉ 1 ca phình dưới động mạch thận (0,12%); bài dẫn một nghiên cứu khác ở Việt Nam 0,85%, Trung Quốc 0,11%, Nhật Bản 0,35%. Tuổi, giới nam, diện tích da và đang hút thuốc liên quan với đường kính động mạch chủ lớn hơn."
