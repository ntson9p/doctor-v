notes_vi: "Lượt B đọc toàn văn (PMC4341001) qua API Europe PMC ngày 26/10/2026. Điều tra toàn quốc lần thứ 22 ở Nhật Bản: 26.691 ca (2011–2012), 15.442 nam và 11.249 nữ (tỉ số khoảng 1,37); tỷ suất mắc 243,1 (2011) và 264,8 (2012) trên 100.000 trẻ 0–4 tuổi mỗi năm; 80,2% thể đủ tiêu chuẩn, 19,8% thể không đủ (67,8% trong số này có 4/6 biểu hiện chính); tỷ suất theo tuổi đạt đỉnh ở nửa sau năm đầu đời; đỉnh theo tháng vào tháng 1 và thấp hơn vào mùa hè; 4,6% có tổn thương tim ở lần khám đầu."
