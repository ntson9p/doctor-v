notes_vi: "Lượt B (Giai đoạn 3 lô 2) tải toàn văn qua API Europe PMC (PMC9725916). 606 người áp xe gan do vi khuẩn mắc ở cộng đồng (Yên Đài, Trung Quốc): nam/nữ 1,3/1; tuổi trung bình 60,3; đái tháo đường 38,7%; bệnh hoặc mổ đường mật lành tính 22,3%; ung thư 11,1%. Bảng 1: sốt 92,9% (57,3% số người sốt có nhiệt độ cao nhất trên 39°C); sợ lạnh, rét run 74,7%; đau bụng 44,7%; buồn nôn, nôn 33,3%; mệt, ăn kém 18,2%; vàng da 6,3%; khó thở 5,7%; đau đầu, chóng mặt 4,1%; mất ý thức 1,8%. Klebsiella pneumoniae chiếm 74,9% cấy máu, 84,1% cấy mủ."
