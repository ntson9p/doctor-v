notes_vi: "Lượt B chỉ đọc được tóm tắt qua API Europe PMC ngày 26/10/2026. Trẻ gốc Việt ở San Diego (2001–2019, 20 ca) được chẩn đoán sớm hơn (ngày 6) và có tỷ lệ phình động mạch vành cao hơn trẻ không gốc châu Á (60% so với 27,5%); hạch cổ nổi rõ 20% ở trẻ gốc Việt. Phỏng vấn bác sĩ tim mạch Bệnh viện Nhi Đồng 1 TP.HCM và tổng quan tài liệu tiếng Việt gợi ý tỷ suất mắc và mức độ nặng cao ở trẻ Việt Nam (không có số liệu cụ thể trong tóm tắt)."
