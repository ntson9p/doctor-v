notes_vi: "Lượt B tải và đọc bản PDF toàn văn trên hkmj.org ngày 26/10/2026. 72 người cơn glôcôm góc đóng nguyên phát cấp (3/1998–2/2000), tuổi trung bình 68,2; nữ/nam 3,8:1 (nguy cơ tương đối của nữ 3,8); không có ca nào hai mắt cùng lúc. Tỷ suất mắc 10,4/100.000/năm ở người từ 30 tuổi; từ 70 tuổi 58,7/100.000/năm (gấp 12 lần người dưới 70). Bảng 1 (triệu chứng lúc đến khám): giảm thị lực 62 (86,1%), đau nhức mắt 59 (81,9%), đau đầu 26 (36,1%), triệu chứng khác như buồn nôn, nôn 20 (27,8%), triệu chứng mơ hồ 2 (2,8%). 73,6% khởi phát từ trưa đến nửa đêm; 68,1% đi khám trong 24 giờ, 11,1% sau hơn 1 tuần; 80,6% thị lực từ 20/200 trở xuống; 23,6% có đái tháo đường và/hoặc tăng huyết áp; 23,6% bị nhiễm trùng hô hấp trên trước cơn (một phần đã dùng thuốc ho)."
