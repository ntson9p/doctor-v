notes_vi: "Lượt B chỉ đọc tóm tắt qua API Europe PMC ngày 26/10/2026. Điều tra toàn đảo Singapore (3/1995–2/1996): 189 người mới mắc, tỷ suất 12,2/100.000/năm ở người từ 30 tuổi; yếu tố nguy cơ: nữ (nguy cơ tương đối 2,4), gốc Hoa (2,8), từ 60 tuổi (9,1). Một nửa đến khám sau 3 ngày trở lên từ khi khởi phát; cơn hay gặp hơn vào ngày nóng."
