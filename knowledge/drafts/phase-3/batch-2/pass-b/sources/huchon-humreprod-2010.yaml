notes_vi: "Lượt B (Giai đoạn 3 lô 2) đọc tóm tắt qua API Europe PMC. Phụ nữ đau vùng chậu cấp (142 hồi cứu, 35 tiến cứu, Pháp). Năm yếu tố độc lập gợi ý xoắn phần phụ: đau một bên bụng hoặc thắt lưng (aOR 4,1), đau dưới 8 giờ lúc đến khám (aOR 8,0), nôn (aOR 7,9), không có khí hư và không ra máu âm đạo (aOR 12,6), nang buồng trứng trên 5 cm khi siêu âm (aOR 10,6). Xoắn phần phụ cần mổ ngay."
