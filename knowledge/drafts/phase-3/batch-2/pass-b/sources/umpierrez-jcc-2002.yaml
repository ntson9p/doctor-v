notes_vi: "Lượt B (Giai đoạn 3 lô 2) đọc tóm tắt qua API Europe PMC. 200 người nhập viện vì cơn tăng đường huyết cấp ở Atlanta (189 nhiễm toan ceton, 11 tăng áp lực thẩm thấu): đau bụng ở 46% người nhiễm toan ceton, không ai trong nhóm tăng áp lực thẩm thấu; đau bụng liên quan mức toan (86% khi bicarbonat dưới 5 mmol/L, 13% khi 15–18 mmol/L), không liên quan mức đường huyết hay mất nước; ở 30 người đau do chính bệnh khởi phát (5 người cần mổ); người đau bụng hay có tiền sử uống rượu (51% so với 24%)."
