notes_vi: "Lượt B (Giai đoạn 3 lô 2) đọc tóm tắt qua API Europe PMC. 87 phụ nữ được mổ xác nhận xoắn buồng trứng ở 2 bệnh viện đô thị Mỹ (1984–1999), tuổi 14–82 (trung bình 32): 12 đang mang thai, 15 đã mãn kinh; 25% đã biết có nang buồng trứng; khởi phát đột ngột 59%; đau nhói như dao đâm 70%; đau lan ra hông, lưng hoặc bẹn 51%; chỉ 3 người có dấu hiệu viêm phúc mạc; buồn nôn hoặc nôn 70%; sốt hiếm (2 người); 89% có buồng trứng to trên 5 cm; chỉ 26 người được mổ trong 24 giờ, tháo xoắn giữ được buồng trứng ở 8 người (9%)."
