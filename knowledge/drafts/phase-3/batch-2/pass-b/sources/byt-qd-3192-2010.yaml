notes_vi: "Văn bản hành chính. Lượt B tải bản PDF trên kcb.vn (Cục Quản lý Khám, chữa bệnh) ngày 26/10/2026; trang đầu ghi 'Ban hành kèm theo Quyết định số 3192/QĐ-BYT ngày 31 tháng 08 năm 2010'. Chưa kiểm tra được văn bản thay thế mới hơn. Phân độ: tăng huyết áp độ 3 khi huyết áp tâm thu từ 180 và/hoặc tâm trương từ 110 mmHg. Nguyên tắc: không nên hạ huyết áp quá nhanh để tránh thiếu máu cơ quan đích, trừ tình huống cấp cứu; dùng thuốc hạ áp đường tĩnh mạch trong tình huống khẩn cấp như tăng huyết áp ác tính, tách thành động mạch chủ, suy thận tiến triển nhanh, sản giật, tăng huyết áp kèm nhồi máu cơ tim cấp hoặc suy tim trái cấp. Thay đổi lối sống: giảm muối dưới 6 g/ngày, hạn chế rượu bia, ngừng thuốc lá, vận động đều. Chuyển tuyến khi tăng huyết áp tiến triển, đe dọa biến chứng, kháng trị."
