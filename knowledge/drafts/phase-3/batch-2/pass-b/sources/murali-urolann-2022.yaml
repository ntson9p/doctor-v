notes_vi: "Lượt B (Giai đoạn 3 lô 2) tải toàn văn qua API Europe PMC (PMC9197001). 101 ca mổ thám sát bìu cấp ở một bệnh viện đại học ở Ấn Độ: 64 ca xoắn tinh hoàn (63,4%). Ở xoắn tinh hoàn: đau bìu 92,2%, đau bụng 18,8%, nôn hoặc buồn nôn 18,8%, sốt 9,4%, triệu chứng tiết niệu 3,1%; bên trái 65,6%; đỉnh 11–15 tuổi; trung vị thời gian triệu chứng 36 giờ. Mọi ca đến trong 6 giờ đều giữ được tinh hoàn; tỷ lệ giữ được chung 28,1%; sau 24 giờ chỉ 7,7%."
