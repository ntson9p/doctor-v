notes_vi: "Lượt B (Giai đoạn 3 lô 2) đọc tóm tắt qua API Europe PMC. 111 trẻ từ 18 tuổi trở xuống được mổ vì xoắn tinh hoàn (Mỹ, 2005–2021): mất tinh hoàn 35%; 41% có biểu hiện không điển hình (đau bụng, đau chân hoặc hông, tiểu buốt, tiểu nhiều lần, chấn thương, hoặc không đau tinh hoàn); hay gặp nhất là đau bụng (26%). Trẻ đau bụng hay có buồn nôn, nôn và ấn bụng đau hơn, nhưng vẫn đau, sưng tinh hoàn như trẻ khác. Biểu hiện không điển hình làm chậm thời gian từ phân loại ở cấp cứu đến mổ."
