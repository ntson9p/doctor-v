notes_vi: "Lượt B (Giai đoạn 3 lô 2) tải toàn văn qua API Europe PMC (PMC2784515). Hướng dẫn Tokyo 2007 (đã được thay bằng bản 2013, 2018; dùng cho phần tổng hợp tần suất triệu chứng). Viêm đường mật cấp có thể nhanh chóng chuyển nặng với suy tạng do hội chứng đáp ứng viêm toàn thân, nhiễm khuẩn huyết, cần chẩn đoán, phân độ kịp thời và dẫn lưu mật khẩn ở ca nặng. Bảng 1 (các loạt ca): sốt và đau bụng là hai biểu hiện hay gặp nhất, mỗi cái tới 80% hoặc hơn; vàng da 60–70%; tam chứng Charcot 15,4–72%; ngũ chứng Reynolds 3,5–7,7%; sốc 7–16%, rối loạn ý thức 2–16% (ví dụ Boey: sốt 93,9%, vàng da 78,8%, đau bụng 87,9%). Tiền sử sỏi mật, mổ đường mật, đặt stent đường mật gợi ý viêm đường mật. Tiêu chuẩn: sốt và/hoặc rét run; vàng da; đau hạ sườn phải hoặc bụng trên."
