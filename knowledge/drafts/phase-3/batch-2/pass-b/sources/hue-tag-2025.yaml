notes_vi: "Lượt B (Giai đoạn 3 lô 2) tải toàn văn qua API Europe PMC (PMC12035265). Ở Việt Nam viêm đường mật cấp là cấp cứu nội khoa hay gặp; Bệnh viện Trung ương Quân đội 108 nhận khoảng 20 ca viêm đường mật do sỏi mỗi ngày. Hồi cứu 708 người viêm đường mật do sỏi được làm ERCP (2021–2022), chia nhóm ERCP sớm (453) và muộn (255): tuổi trung bình khoảng 64; nam 51,2% và 54,9%; đau bụng 89% và 87,1%; vàng da 55,8% và 49,8%; bệnh tim mạch khoảng 30%; đái tháo đường khoảng 13%; đã cắt túi mật 19% và 14,9%; đã làm ERCP 21,9% và 16,5%; nặng theo Tokyo 19,6% và 15,7%. Thực hành tại Việt Nam theo Tokyo 2018 và hướng dẫn quy trình kỹ thuật của Bộ Y tế."
