notes_vi: "Lượt B mở trang ngày 26/10/2026. Kiệt sức do nóng là hội chứng không đe dọa tính mạng: yếu, mệt, buồn nôn, ngất và các triệu chứng không đặc hiệu do nóng; điều hòa thân nhiệt và chức năng thần kinh trung ương không bị ảnh hưởng; người bệnh thường mất nước. Thân nhiệt thường bình thường, nếu tăng thì thường không quá 40°C; tri giác bình thường (điểm phân biệt chính với sốc nhiệt). Triệu chứng sớm: khát nhiều, chuột rút; sau đó mệt, yếu, chóng mặt, đau đầu, buồn nôn, đôi khi nôn; ngất do nóng khi đứng lâu nơi nóng. Dấu hiệu: mệt, vã mồ hôi, tim nhanh, có thể hạ huyết áp tư thế. Xử trí: ngừng gắng sức, đưa đến chỗ mát, nằm thẳng hoặc kê cao chân, uống bù dịch; triệu chứng không hết sau 30–60 phút bù dịch đường uống thì đến khoa cấp cứu."
