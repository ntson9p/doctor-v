notes_vi: "Lượt B (Giai đoạn 3 lô 2) đọc tóm tắt qua API Europe PMC. 555 trẻ 0–17 tuổi bìu cấp ở Litva (2011–2020), 196 xoắn tinh hoàn (35%). Yếu tố dự báo độc lập: tuổi 13–17 (OR 8,39), triệu chứng dưới 7 giờ (OR 3,41), tinh hoàn cứng khi sờ (OR 4,65), sưng bìu (OR 2,37), buồn nôn hoặc nôn (OR 4,37), đau bụng (OR 2,38). Siêu âm Doppler còn dòng máu ở 41,7% ca xoắn."
