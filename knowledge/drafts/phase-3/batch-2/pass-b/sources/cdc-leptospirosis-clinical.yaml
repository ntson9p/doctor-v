notes_vi: "Lượt B mở trang ngày 26/10/2026 (rà soát lần cuối 02/6/2026). Ủ bệnh 5–14 ngày, dao động 2–30 ngày. Triệu chứng không đặc hiệu: sốt, đau cơ, đau đầu, nôn, buồn nôn, vàng da, tiêu chảy, rét run, đau bụng, mệt, xung huyết kết mạc, đôi khi phát ban; có người không triệu chứng. Không điều trị có thể suy thận, vàng da, suy hô hấp, suy gan, viêm màng não; 5–10% suy đa cơ quan và tử vong. Phơi nhiễm: tiếp xúc nước nhiễm nước tiểu động vật (lội, tắm, bơi, uống), nhất là sau bão, lũ, mưa lớn; tiếp xúc động vật nhiễm bệnh (gia súc, vật nuôi, loài gặm nhấm). Trang không có tỷ lệ từng triệu chứng."
