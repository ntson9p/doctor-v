notes_vi: "Lượt B đọc toàn văn (PMC7790725) qua API Europe PMC ngày 26/10/2026. Bệnh viện nhi tuyến cuối ở Hàn Quốc. Nhóm Kawasaki chứng (91 trẻ, tuổi trung vị 2,3, sốt trung vị 8 ngày): đỏ kết mạc 91,2%, thay đổi môi, khoang miệng 81,3%, ban đa dạng 84,6%, sưng hạch cổ 44,0%, thay đổi đầu chi 67,0%; triệu chứng tiêu hóa 26,4%, hô hấp 9,9%, thần kinh 2,2%."
