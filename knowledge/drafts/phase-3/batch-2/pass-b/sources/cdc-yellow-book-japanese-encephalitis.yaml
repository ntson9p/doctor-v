notes_vi: "Lượt B mở trang ngày 26/10/2026 (ngày trang 20/02/2026). Phần lớn nhiễm vi rút viêm não Nhật Bản không triệu chứng; dưới 1% người nhiễm bị bệnh thần kinh. Ủ bệnh 5–15 ngày. Bệnh thường bắt đầu bằng sốt, đau đầu, nôn; vài ngày sau có thể thay đổi tri giác, dấu hiệu thần kinh khu trú, yếu toàn thân, rối loạn vận động (kiểu Parkinson), liệt mềm cấp; co giật hay gặp, nhất là ở trẻ em. Tử vong khoảng 20–30% ở người bị viêm não; 30–50% người sống sót có di chứng thần kinh, nhận thức, tâm thần nặng. Ở nước lưu hành, người lớn đã có miễn dịch nên bệnh chủ yếu gặp ở trẻ em. Lây theo mùa ở vùng ôn đới châu Á (đỉnh mùa hè, mùa thu); ở vùng nhiệt đới, cận nhiệt đới thay đổi theo mùa mưa, tưới tiêu, có thể kéo dài quanh năm."
