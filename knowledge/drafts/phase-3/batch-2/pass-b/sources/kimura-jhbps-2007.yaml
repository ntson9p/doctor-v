notes_vi: "Lượt B (Giai đoạn 3 lô 2) tải toàn văn qua API Europe PMC (PMC2784509). Viêm đường mật và viêm túi mật cấp phần lớn do sỏi; nhiễm trùng đường mật cấp là bệnh nhiễm trùng toàn thân cần điều trị kịp thời. Tử vong của viêm đường mật cấp 2,5–65% trong các báo cáo; trước 1980 khoảng 50%, sau 1980 khoảng 10–30%; nguyên nhân tử vong chính là suy đa tạng, sốc không hồi phục. Viêm túi mật cấp chiếm 3–10% người đau bụng. Ở vùng dịch tễ như Trung Quốc, Đông Nam Á, giun đũa là nguyên nhân hay gặp của sỏi mật và có thể gây viêm đường mật."
