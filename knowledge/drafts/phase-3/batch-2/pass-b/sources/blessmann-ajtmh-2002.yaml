notes_vi: "Lượt B (Giai đoạn 3 lô 2) đọc tóm tắt qua API Europe PMC. Hồi cứu hồ sơ bệnh viện ở Thừa Thiên Huế 4/1990–4/1998: 2.031 ca áp xe gan do amip, tỷ lệ mới mắc ít nhất 21/100.000 dân mỗi năm, khác nhau theo huyện, tăng theo mật độ dân số; nhiều hơn vào mùa hè; 95% là người lớn, trên 80% trong số đó là nam. Số liệu cũ (thập niên 1990)."
