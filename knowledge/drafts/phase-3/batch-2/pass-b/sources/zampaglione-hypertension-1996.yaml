notes_vi: "Lượt B chỉ đọc tóm tắt qua API Europe PMC ngày 26/10/2026. Khoa cấp cứu ở Ý, 12 tháng: cơn tăng huyết áp (76% khẩn cấp, 24% cấp cứu) chiếm hơn một phần tư các ca cấp cứu nội khoa. Tăng huyết áp khẩn cấp hay biểu hiện bằng đau đầu (22%), chảy máu mũi (17%), choáng ngất, kích động (10%); tăng huyết áp cấp cứu bằng đau ngực (27%), khó thở (22%), dấu thần kinh khu trú (21%). Tăng huyết áp chưa từng được biết có ở 28% ca khẩn cấp và 8% ca cấp cứu; tuổi trung bình 60 (khẩn cấp) và 67 (cấp cứu)."
