notes_vi: "Lượt B (Giai đoạn 3 lô 2) mở trang bằng WebFetch (rà soát toàn bộ 12/2024). Phình động mạch chủ bụng gặp ở 0,4–7,6% dân số tùy quần thể; nam gấp khoảng 3 lần nữ; đỉnh 70–80 tuổi; hút thuốc là yếu tố nguy cơ mạnh nhất, tăng huyết áp là yếu tố nguy cơ; tiền sử gia đình ở 15–25%. Phần lớn không có triệu chứng; khối phình đang to có thể gây đau sâu, âm ỉ, rõ nhất vùng thắt lưng – cùng, có thể thấy bụng đập bất thường; biến chứng có thể gây sốt, mệt, sụt cân. Vỡ hay xảy ra ở thành sau bên trái, dưới động mạch thận 2–4 cm; phần lớn người vỡ phình tử vong trước khi tới cơ sở y tế; người tới viện thường đau bụng hoặc lưng, tụt huyết áp, mạch nhanh, có thể sau gắng sức nín thở như nâng vật nặng; khoảng 50% tử vong dù đã tới viện. Nên nghĩ tới bệnh ở người cao tuổi đau bụng hoặc lưng cấp, dù không sờ thấy khối đập. Có triệu chứng thì chụp ngay; vỡ phình cần mổ hoặc đặt ống ghép ngay."
