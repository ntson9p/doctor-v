notes_vi: "Lượt B (Giai đoạn 3 lô 2) tải toàn văn qua API Europe PMC (PMC12597153). 64 trẻ mới được chẩn đoán đái tháo đường típ 1 tại Bệnh viện Nhi Trung ương năm 2023, tuổi trung bình 9,1: tỷ lệ mới mắc ở trẻ miền Bắc 0,77/100.000 (Hà Nội 0,91); nhiễm toan ceton lúc chẩn đoán 57,8%. Phần bàn luận: triệu chứng chính trước khi vào viện là khát nhiều, tiểu nhiều (89,1%), rồi sụt cân (57%) (phần kết quả ghi 89,1% có khát nhiều, tiểu nhiều kèm sụt cân, hai chỗ không khớp); nhiều trẻ được chẩn đoán muộn."
