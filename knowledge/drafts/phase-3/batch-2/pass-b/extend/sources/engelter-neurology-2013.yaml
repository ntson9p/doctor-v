notes_vi: "Lượt B (Giai đoạn 3 lô 2) đọc tóm tắt qua API Europe PMC. 1.897 người: 966 bóc tách động mạch cổ, 651 nhồi máu não do nguyên nhân khác (cùng tuổi, giới), 280 người khỏe mạnh; hỏi chấn thương cổ trong 1 tháng trước bằng bộ câu hỏi chuẩn. Người bóc tách có chấn thương cổ trước đó ở 40,5% (88% là nhẹ); nhiều hơn người nhồi máu não khác (OR thô 5,6; hiệu chỉnh 7,6) và người khỏe mạnh (OR thô 2,8; hiệu chỉnh 3,7). Người có chấn thương trẻ hơn, hay đau cổ hơn, ít đột quỵ hơn. Tác giả đề nghị gọi là 'sự kiện cơ học khởi phát' thay vì chấn thương."
