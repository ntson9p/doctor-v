notes_vi: "Lượt B (Giai đoạn 3 lô 2) tải toàn văn qua API Europe PMC (PMC11432014). Dữ liệu sổ đăng ký chất lượng chăm sóc đột quỵ RES-Q tại 66 bệnh viện Việt Nam, 2017–2023: 94.144 người nhồi máu não hoặc cơn thiếu máu não thoáng qua; 14.185 người (15,1%) đã biết có rung nhĩ hoặc được phát hiện rung nhĩ lúc nhập viện (bài không tách hai nhóm). Người rung nhĩ lớn tuổi hơn, đột quỵ nặng hơn, tử vong trong viện cao hơn; chỉ 15,8% đã dùng thuốc chống đông trước khi đột quỵ, 82,4% khi ra viện. Bài dẫn tỷ lệ rung nhĩ ở dân số chung Việt Nam khoảng 1%."
