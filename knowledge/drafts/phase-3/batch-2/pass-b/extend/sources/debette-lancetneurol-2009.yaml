notes_vi: "Lượt B (Giai đoạn 3 lô 2) đọc tóm tắt qua API Europe PMC. Bài tổng quan: bóc tách động mạch cổ là nguyên nhân chính của thiếu máu não ở người trẻ; có thể chỉ gây triệu chứng lành tính (đau đầu, đau cổ, hội chứng Horner, liệt dây thần kinh sọ) nhưng phần lớn người bệnh bị đột quỵ hoặc cơn thiếu máu não thoáng qua; ngoài chấn thương cổ, các yếu tố được nêu là nhiễm trùng, đau nửa đầu, tăng homocystein; tỷ lệ mới mắc trong dân số bị đánh giá thấp. Tóm tắt không cho tỷ lệ bóc tách trong số người đột quỵ."
