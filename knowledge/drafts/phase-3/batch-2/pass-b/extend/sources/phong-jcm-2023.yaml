notes_vi: "Lượt B (Giai đoạn 3 lô 2) đọc tóm tắt qua API Europe PMC. Nghiên cứu cắt ngang 2.038 người liên tiếp nhập Bệnh viện Bạch Mai vì cơn thiếu máu não thoáng qua hoặc nhồi máu não: rung nhĩ (phát hiện bằng điện tim hoặc Holter) ở 18,1% (khoảng tin cậy 95% 16,46–19,85). Yếu tố liên quan: tuổi (OR 1,39 mỗi 10 tuổi), giảm mức lọc cầu thận, bệnh van tim (OR 9,59), phân suất tống máu dưới 50% (OR 2,61). Cao hơn các nước Đông Nam Á khác."
