  authors: ["agent:pass-a"]
  updated: "2026-10-25"
  notes_vi: "Bản mở rộng của lượt A (Giai đoạn 3, lô 1); mọi phần đã có từ Giai đoạn 1 giữ nguyên. Đã thêm: (1) prior cho triệu chứng chính 'dizziness' (mặc định P3; 5–44 tuổi P2; 65 tuổi trở lên P4), đại diện cho đau nửa đầu tiền đình; (2) 8 liên kết: vertigo_spinning (frequent), dizziness_positional (occasional), dizziness_pattern (phân bố, chủ yếu 'vài phút đến vài giờ'), hearing_loss_tinnitus (occasional), similar_episodes_before (very_frequent), headache (frequent; không thuộc lô 1 nhưng có trong nhóm dizziness_associated), cannot_walk_unaided (rare), transient_neuro_symptoms (rare, above_leak_ok); (3) nguồn mới trong extend/sources: dieterich-jneurol-2016, lempert-jvestibres-2022, vonbrevern-jnnp-2007, tarnutzer-cmaj-2011. Đề nghị xem lại (không tự sửa): các liên kết đặt cho cơn đau đầu như nausea, photophobia, phonophobia, headache_worse_activity (very_frequent) cũng áp dụng khi triệu chứng chính là chóng mặt; trong cơn chóng mặt của đau nửa đầu tiền đình các triệu chứng này ít hơn (dưới 50% có cả đau đầu và chóng mặt ở mọi cơn, Dieterich 2016), nên trả lời 'Không' có thể hạ khả năng bệnh quá mạnh. Trẻ em: chóng mặt kịch phát lành tính ở trẻ nhỏ là một dạng đau nửa đầu, cơn chỉ vài giây đến vài phút (Dieterich 2016), nên kiểu chóng mặt ở trẻ có thể ngắn hơn phân bố đã khai báo."
