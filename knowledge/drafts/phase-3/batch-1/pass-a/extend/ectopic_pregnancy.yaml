id: ectopic_pregnancy
names:
  vi: "Thai ngoài tử cung"
  vi_common: ["Chửa ngoài tử cung", "Mang thai ngoài tử cung"]
  en: "Ectopic pregnancy"
codes:
  icd10: "O00"
  icd10_verified: true
  mondo: "MONDO:0000755"
summary_vi:
  - "Thai làm tổ ở ngoài buồng tử cung, phần lớn ở vòi trứng."
  - "Hay gặp chậm kinh, đau bụng dưới một bên và ra máu âm đạo ít, sẫm màu."
  - "Khối thai có thể vỡ, gây chảy máu trong ổ bụng và nguy hiểm tính mạng."
urgency: 2
cant_miss: true
specialties: [obstetrics_gynecology, emergency]
applicability:
  sex: [female]
  age_groups: [teen_13_17, adult_18_44, adult_45_64]
  reason_vi: "Chỉ gặp ở phụ nữ trong độ tuổi có thể mang thai."
priors:
  - complaint: abdominal_pain
    default: P4
    by_age: { teen_13_17: P5, adult_45_64: P6 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015, msd-ectopic-pregnancy, nhs-ectopic-pregnancy, viniol-fampract-2014]
      note: "Prior tính trong số phụ nữ cùng nhóm tuổi bị đau bụng (bệnh chỉ xét cho nữ, applicability), nên khi so với tổng prior của mọi bệnh trong cột đau bụng cần nhớ mẫu số chỉ gồm nữ. Thai ngoài tử cung chiếm khoảng 1/90 (NHS) đến 2/100 (MSD) số thai và là cấp cứu sản khoa (315/QĐ-BYT); phần lớn có đau bụng. Ở chăm sóc ban đầu, đau bụng có nhiều nguyên nhân lành tính (Viniol 2014). Ước tính thô của lượt C: khoảng 2% phụ nữ 18–44 tuổi đang có thai 3 tháng đầu tại một thời điểm, với 1–2% số thai là thai ngoài tử cung, cho tỷ lệ khoảng 0,5–1% trong số phụ nữ 18–44 tuổi đau bụng đi khám hoặc tự kiểm tra (P4). Tuổi 13–17 có thai ít hơn khoảng 8–10 lần (P5); từ 45 tuổi rất hiếm có thai (P6). Hai lượt độc lập cùng chọn các mức này. Chưa có số liệu Việt Nam về lý do đi khám; cần bác sĩ duyệt."
  - complaint: syncope
    default: P4
    by_age: { teen_13_17: P5, adult_45_64: P6 }
    evidence:
      tier: B
      basis: judgment
      sources: [nhs-ectopic-pregnancy, msd-ectopic-pregnancy]
      locator: "NHS: Symptoms, signs of a rupture; MSD: Symptoms and Signs"
      note: "Lượt A Giai đoạn 3 (lô 1) thêm. Prior tính trong số phụ nữ cùng nhóm tuổi bị ngất (applicability). NHS: khoảng 1/90 thai; chóng mặt nhiều hoặc ngất là dấu hiệu vỡ; MSD: khoảng 2/100 thai, khối thai vỡ gây đau dữ dội đột ngột rồi có thể ngất, sốc mất máu. Ước tính thô: ngất rất hay gặp ở phụ nữ trẻ (phần lớn là ngất phản xạ), còn phần lớn người thai ngoài tử cung vỡ chọn đau bụng là triệu chứng chính; ước 0,2–1% phụ nữ 18–44 tuổi ngất (P4), 13–17 tuổi P5 (ít có thai hơn), từ 45 tuổi P6, cùng cách tính với prior đau bụng. Chưa có số liệu; cần bác sĩ duyệt."
  - complaint: dizziness
    default: P5
    by_age: { teen_13_17: P6, adult_45_64: P6 }
    evidence:
      tier: B
      basis: judgment
      sources: [nhs-ectopic-pregnancy, msd-ectopic-pregnancy]
      locator: "NHS: signs of a rupture"
      note: "Lượt A Giai đoạn 3 (lô 1) thêm. Chóng mặt là triệu chứng chính rất hay gặp và có nhiều nguyên nhân lành tính; thai ngoài tử cung gây chóng mặt chủ yếu khi đã chảy máu trong (NHS). Ước 0,02–0,2% phụ nữ 18–44 tuổi chóng mặt (P5), thấp hơn ở 13–17 tuổi và từ 45 tuổi (P6). Ước lượng."
findings:
  - finding: pregnant
    freq: very_frequent
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015, msd-ectopic-pregnancy, nhs-ectopic-pregnancy]
      locator: "315/QĐ-BYT, bài Chửa ngoài tử cung, mục 2.1; MSD: Symptoms and Signs; NHS: Symptoms"
      note: "Theo định nghĩa luôn có thai, nhưng nhiều người chưa biết: 315/QĐ-BYT ghi chậm kinh nhiều khi không rõ vì ra máu trước ngày dự kiến có kinh; MSD ghi người kinh không đều có thể không biết mình có thai; NHS khuyên đi khám ngay cả khi chưa thử thai dương tính. Cố ý chọn very_frequent, không chọn almost_always (theo ghi chú lô 4), để câu trả lời 'không có thai' chỉ làm giảm khả năng khoảng 5 lần chứ không loại trừ."
  - finding: missed_period
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [joshi-cureus-2025, nalini-cureus-2023, byt-qd-315-2015, nhs-ectopic-pregnancy]
      locator: "Joshi 2025 và Nalini 2023: tóm tắt; 315/QĐ-BYT mục 2.1 và 2.3"
      reported: "Mất kinh 63,4% (Joshi 2025, n = 123) và 97,3% (Nalini 2023, n = 75)."
      population: "Phụ nữ thai ngoài tử cung ở bệnh viện tuyến cuối Ấn Độ, phần lớn đã vỡ"
      note: "Lượt C: hai lượt lệch một mức (A very_frequent, B frequent). Số liệu bệnh viện (trung bình khoảng 80%) được hạ một mức theo kb-guide mục 2.1 vì người tự kiểm tra thường đến sớm hơn, khi kinh mới chậm vài ngày hoặc ra máu bị tưởng là kinh (315/QĐ-BYT: chậm kinh nhiều khi không rõ). Cùng cụm pregnancy_signs với 'pregnant' (tương quan cao) nên không bị đếm trùng hoàn toàn."
  - finding: gestational_age
    dist: { lt_20w: 0.97, ge_20w: 0.03 }
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-315-2015, nhs-ectopic-pregnancy, msd-ectopic-pregnancy]
      note: "Phân bố trong số người đã trả lời có thai. Triệu chứng thường xuất hiện từ tuần 4 đến tuần 12 (NHS); khối thai thường vỡ sau khoảng 6–16 tuần (MSD); thai trong ổ bụng phát triển lớn là thể rất hiếm (315/QĐ-BYT). Để 0,03 cho trường hợp người dùng ước sai tuổi thai."
  - finding: vaginal_bleeding
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [joshi-cureus-2025, byt-qd-315-2015, msd-ectopic-pregnancy, nhs-ectopic-pregnancy]
      locator: "Joshi 2025: tóm tắt; 315/QĐ-BYT mục 2.1"
      reported: "Ra máu âm đạo bất thường 46,3% (123 ca)."
      population: "Bệnh viện tuyến cuối Ấn Độ"
      note: "315/QĐ-BYT: máu ra ít một, sẫm màu, dai dẳng; MSD: phần lớn có đau vùng chậu, ra máu âm đạo hoặc cả hai; NHS: ra máu hoặc dịch nâu loãng. Trong nhóm đã có thai, đau và ra máu không phân biệt được thai ngoài tử cung với nguyên nhân khác (mọi yếu tố bệnh sử có LR+ dưới 1,5, Crochet 2013); dấu hiệu này chủ yếu giúp phân biệt với bệnh không liên quan thai."
  - finding: abd_pain_location
    dist: { epigastric: 0.03, right_upper: 0.02, left_upper: 0.02, periumbilical: 0.04, right_lower: 0.29, left_lower: 0.29, suprapubic: 0.20, whole: 0.11 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015, nhs-ectopic-pregnancy]
      locator: "315/QĐ-BYT, mục 2.1 và 2.4.2 (thể lụt máu ổ bụng); NHS: Symptoms"
      note: "Thường đau ở vị trí khối chửa, tức hố chậu một bên hoặc hạ vị (315/QĐ-BYT; NHS: đau bụng dưới một bên); thể lụt máu ổ bụng đau khắp bụng. Tỷ lệ từng vùng là ước lượng (trung bình hai lượt, lệch rất nhỏ)."
  - finding: abd_pain_onset
    dist: { sudden: 0.35, gradual: 0.65 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015, msd-ectopic-pregnancy, nhs-ectopic-pregnancy]
      locator: "315/QĐ-BYT, mục 2.4.2 (đau và choáng xuất hiện đột ngột); MSD và NHS: dấu hiệu vỡ"
      note: "Thể chưa vỡ thường đau âm ỉ, tăng dần; khi vỡ đau đột ngột, dữ dội. Hai lượt cùng ước 0,35 (cao hơn nền 0,25)."
  - finding: abd_pain_severe
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015, nhs-ectopic-pregnancy, joshi-cureus-2025]
      note: "Đau dữ dội chủ yếu khi khối chửa vỡ. Ở bệnh viện tuyến cuối phần lớn đã vỡ (84,6% khi mổ, Joshi 2025), nhưng người tự kiểm tra thường đến sớm hơn và NHS ghi vỡ không thường gặp nếu được xử trí sớm, nên chọn occasional. Có đau dữ dội thì quy tắc rf_severe_abdominal_pain đã xếp mức 2."
  - finding: abdomen_hard_swollen
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-315-2015]
      locator: "315/QĐ-BYT, mục 2.1 (phản ứng thành bụng khi có máu trong ổ bụng) và 2.4.2 (bụng trướng, ấn đau khắp bụng)"
      note: "Gặp ở thể có máu trong ổ bụng; tỷ lệ ở người tự kiểm tra chưa rõ. Tỷ lệ nền của dấu hiệu là 1% nên trả lời 'Có' làm tăng mạnh khả năng bệnh."
  - finding: fainting_or_near_fainting
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-315-2015, msd-ectopic-pregnancy, nhs-ectopic-pregnancy]
      locator: "315/QĐ-BYT, mục 2.1 (toàn thân: có thể choáng ngất do đau, do vỡ khối chửa); MSD; NHS: signs of a rupture"
      note: "Các nguồn mô tả là 'có thể' (choáng, ngất khi vỡ); chọn occasional."
  - finding: abd_pain_worse_movement
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015]
      locator: "315/QĐ-BYT, mục 2.1 (máu trong ổ bụng gây kích thích phúc mạc, phản ứng thành bụng)"
      note: "Chỉ lượt B có. Lượt C giữ vì nguồn ủng hộ: đau tăng khi đi lại, ho, xe xóc là biểu hiện kích thích phúc mạc khi có máu trong ổ bụng. Tần suất là ước lượng."
  - finding: abd_pain_radiates_right_shoulder
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-ectopic-pregnancy]
      note: "Chỉ lượt B có. NHS liệt kê đau ở đầu vai trong các triệu chứng (máu kích thích cơ hoành). Câu hỏi chỉ hỏi vai phải hoặc lưng bên phải nên tần suất thật của câu trả lời 'Có' thấp hơn tần suất đau vai nói chung; chọn occasional."
  - finding: pain_with_menses
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015]
      locator: "315/QĐ-BYT, mục 2.1 (chậm kinh không rõ vì ra máu trước thời điểm dự báo có kinh)"
      note: "Chỉ lượt A có. Máu âm đạo của thai ngoài tử cung có thể ra đúng khoảng ngày dự kiến có kinh và bị tưởng là kinh. Mức occasional (20%) gần bằng tỷ lệ nền 18% của câu hỏi, nên câu trả lời 'Có' (đau trùng kỳ kinh) không làm giảm khả năng bệnh. Lượt B không liên kết với cùng mục đích; hai cách cho kết quả gần như nhau."
  - finding: fever
    freq: rare
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-315-2015, msd-ectopic-pregnancy, nhs-ectopic-pregnancy]
      locator: "315/QĐ-BYT, mục 3 (chẩn đoán phân biệt: viêm phần phụ, viêm ruột thừa có tình trạng nhiễm khuẩn)"
      note: "Sốt không có trong triệu chứng của cả ba nguồn; 315/QĐ-BYT dùng tình trạng nhiễm khuẩn để nhận ra viêm phần phụ, viêm ruột thừa. Mức rare (thấp hơn tỷ lệ nền 5%) làm câu trả lời 'Có sốt' giảm nhẹ khả năng bệnh."
  - finding: abdominal_pain
    freq: very_frequent
    evidence:
      tier: C
      basis: verbal
      sources: [msd-ectopic-pregnancy, nhs-ectopic-pregnancy]
      locator: "MSD: Symptoms and Signs; NHS: Symptoms"
      note: "Lượt A Giai đoạn 3 (lô 1) thêm. Chỉ dùng khi triệu chứng chính là ngất hoặc chóng mặt (khi triệu chứng chính là đau bụng, dấu hiệu này đã được ngầm định). MSD: phần lớn người bệnh đau vùng chậu, ra máu âm đạo hoặc cả hai; khi vỡ đau dữ dội đột ngột rồi có thể ngất. NHS: đau bụng dưới một bên. Ngất kèm đau bụng đã được quy tắc rf_fainting_with_pain xếp mức 2."
  - finding: dizziness
    freq: frequent
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-ectopic-pregnancy]
      locator: "Signs of a rupture"
      note: "Lượt A Giai đoạn 3 (lô 1) thêm. Chỉ dùng khi triệu chứng chính là ngất. NHS: chóng mặt nhiều hoặc ngất là dấu hiệu vỡ. Tần suất là ước lượng."
  - finding: dizziness_on_standing
    freq: frequent
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-ectopic-pregnancy, msd-ectopic-pregnancy]
      note: "Lượt A Giai đoạn 3 (lô 1) thêm. Chảy máu trong ổ bụng gây choáng khi đứng dậy; người thai ngoài tử cung đến khám vì ngất, chóng mặt thường đã chảy máu (NHS, MSD: dấu hiệu vỡ, sốc mất máu). Ước lượng."
  - finding: pallor
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-ectopic-pregnancy]
      locator: "Signs of a rupture"
      note: "Lượt A Giai đoạn 3 (lô 1) thêm. NHS: da rất tái là dấu hiệu vỡ. Câu hỏi của danh mục hỏi da xanh, niêm mạc nhợt (thường để hỏi thiếu máu), nên chỉ chọn occasional."
  - finding: syncope_trigger
    dist: { standing_heat: 0.05, emotion_pain: 0.30, standing_up: 0.25, toilet_cough: 0.15, exertion: 0.03, lying: 0.02, no_trigger: 0.20 }
    evidence:
      tier: C
      basis: judgment
      sources: [msd-ectopic-pregnancy, nhs-ectopic-pregnancy]
      locator: "MSD: Symptoms and Signs; NHS: Symptoms"
      note: "Lượt A Giai đoạn 3 (lô 1) thêm. Phân bố trong số người đã ngất hoặc suýt ngất. MSD: đau dữ dội đột ngột rồi ngất; NHS: khó chịu khi đi tiểu, đi ngoài là một triệu chứng; chảy máu trong gây choáng khi vừa đứng dậy. Chưa có số liệu; ước lượng."
  - finding: pulse_measured
    dist: { lt_40: 0.004, n40_100: 0.24, n100_150: 0.144, gt_150: 0.012, not_measured: 0.6 }
    evidence:
      tier: C
      basis: judgment
      sources: [msd-ectopic-pregnancy]
      note: "Lượt A Giai đoạn 3 (lô 1) thêm. Mất máu (sốc mất máu, MSD) làm mạch nhanh; thể chưa vỡ mạch bình thường. Phân bố là ước lượng. Lựa chọn 'Chưa đo' là trung tính nên để 0,6 như nền; bốn mức đo được đã nhân 0,4 (người bảo trì, 25/10/2026)."
warning_signs: [abd_pain_severe, fainting_or_near_fainting, abdomen_hard_swollen, cold_hands_feet, severe_weakness]
self_care_vi:
  - "Nhờ người thân đưa đi khám, không tự lái xe."
  - "Nếu có sẵn que thử thai, có thể thử ngay, nhưng không chờ kết quả mới đi khám."
  - "Mang theo kết quả siêu âm hoặc xét nghiệm, nếu có."
see_doctor_vi:
  - "Đến ngay khoa cấp cứu hoặc khoa sản của bệnh viện gần nhất để được thử thai và siêu âm."
  - "Gọi 115 nếu đau bụng dữ dội đột ngột, choáng ngất, vã mồ hôi lạnh hoặc da tái nhợt."
review:
  status: draft
  authors: ["agent:pass-a"]
  updated: "2026-10-25"
  notes_vi: "Bản mở rộng của lượt A (Giai đoạn 3, lô 1). Giữ nguyên toàn bộ nội dung đã đối chiếu ở Giai đoạn 1 (ghi chú của lượt C xem knowledge/conditions/ectopic_pregnancy.yaml). Đã thêm: (1) prior cho Ngất (mặc định P4; 13–17 tuổi P5; 45–64 tuổi P6) và Chóng mặt (mặc định P5; 13–17 và 45–64 tuổi P6), tính trong số phụ nữ cùng nhóm tuổi như prior đau bụng; (2) sáu liên kết: abdominal_pain (very_frequent; dấu hiệu cũ của danh mục, thêm vì dưới Ngất và Chóng mặt đau bụng không còn được ngầm định, nếu không liên kết thì câu trả lời 'có đau bụng' không làm tăng khả năng bệnh), và năm dấu hiệu lô 1: dizziness (frequent), dizziness_on_standing (frequent), pallor (occasional), syncope_trigger (phân bố), pulse_measured (phân bố). Không đổi mức xử trí 2. Nhận xét về giá trị cũ (không sửa): fainting_or_near_fainting occasional hợp với Đau bụng nhưng có thể thấp khi triệu chứng chính là Chóng mặt; khi người dùng chọn Ngất, câu hỏi có thai và chậm kinh được hỏi sớm (red_flags), nên liên kết pregnant very_frequent làm thai ngoài tử cung tăng mạnh ở người có thai ở mọi tuổi thai cho tới khi hỏi tuổi thai; quy tắc rf_syncope_pregnancy (mức 3) và câu hỏi tuổi thai giúp phân biệt với ngất do hạ huyết áp ở thai lớn. Điểm chưa chắc: prior dưới Ngất, Chóng mặt chỉ là ước lượng; các phân bố hoàn cảnh ngất và mạch chưa có số liệu. Lưu ý cho lượt C: các liên kết mới (chóng mặt, choáng khi đứng dậy, da xanh, mạch) cũng có thể được hỏi thích ứng khi triệu chứng chính là Đau bụng; cần chạy lại bộ ca dev của Đau bụng."
