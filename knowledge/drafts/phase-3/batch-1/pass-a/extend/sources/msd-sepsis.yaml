notes_vi: "Lượt A mở trang (rà soát toàn bộ 3/2026, cập nhật 4/2026). Nhiễm khuẩn huyết thường có sốt; dưới 36°C là một tiêu chí hội chứng đáp ứng viêm toàn thân; tim nhanh trên 90 lần/phút, thở nhanh trên 20 lần/phút; huyết áp giảm khi vào sốc; lú lẫn, giảm tỉnh táo là dấu hiệu sớm, nhất là ở người cao tuổi và trẻ nhỏ; tiểu ít; đầu sốc da còn ấm, sau đó chi lạnh, tái, tím, nổi vân. Người cao tuổi có thể lú lẫn trước khi sốt, phản ứng viêm yếu nên sốt và các dấu hiệu khác có thể không rõ; dễ nhầm với bệnh tim, thuyên tắc phổi, mê sảng."
