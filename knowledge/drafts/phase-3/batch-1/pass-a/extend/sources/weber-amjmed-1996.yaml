notes_vi: "190 người liên tiếp đến trung tâm y khoa đại học vì hồi hộp (gồm cấp cứu, phòng khám, nội trú). Nguyên nhân: do tim 43%, tâm thần 31%, khác 10%, không rõ 16%. Theo bảng tóm tắt của EHRA 2011 (raviele-europace-2011): rối loạn nhịp 41% (rung, cuồng nhĩ 16%, nhịp nhanh trên thất 10%, nhịp nhanh thất 2%), tâm thần (chủ yếu hoảng sợ, lo âu) 31%, thuốc và chất kích thích 6%, nguyên nhân toàn thân (cường giáp, thiếu máu, sốt) 4%, bệnh tim cấu trúc 3%, không rõ 16%. Tử vong 1 năm 1,6%; 75% bị hồi hộp lại trong năm đầu."
