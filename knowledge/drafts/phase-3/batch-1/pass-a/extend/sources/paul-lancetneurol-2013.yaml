notes_vi: "Nghiên cứu dân số Oxford: 59/275 (22%) người đột quỵ tuần hoàn sau có cơn thiếu máu thoáng qua hoặc triệu chứng thần kinh thoáng qua trong 90 ngày trước, trung vị 4 ngày; 45 người là triệu chứng thân não đơn độc, hay gặp nhất là chóng mặt đơn độc (23 người). 9% có cơn trong 0–2 ngày, 2% trong 3–7 ngày trước đột quỵ. Chỉ 8% đạt tiêu chuẩn kinh điển của cơn thiếu máu não thoáng qua; 22% có đi khám. Tác giả cho rằng người chóng mặt đơn độc có yếu tố nguy cơ mạch máu nên được chuyên khoa đánh giá."
