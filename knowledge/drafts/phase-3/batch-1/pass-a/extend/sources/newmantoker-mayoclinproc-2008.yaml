notes_vi: "Mẫu đại diện quốc gia Mỹ 1993–2005: chóng mặt chiếm 3,3% lượt cấp cứu; nữ 61,4% số ca. Chẩn đoán: tai – tiền đình 32,9%, tim mạch 21,1%, hô hấp 11,5%, thần kinh 11,2% (mạch máu não 4%), chuyển hóa 11,0%, chỉ ghi triệu chứng 22,1%. Chẩn đoán cụ thể: ngất phế vị 6,6%, rối loạn nước – điện giải 5,6%, rối loạn nhịp 3,2%, cơn thiếu máu não thoáng qua 1,7%, thiếu máu 1,6%, hạ đường huyết 1,4%, hạ huyết áp tư thế 0,6%, đột quỵ, xuất huyết não 0,5%, hoảng sợ 0,5%, ngộ độc CO 0,2% (16 ca, ước lượng không ổn định). Chẩn đoán nguy hiểm 15%: 20,9% ở người trên 50 tuổi so với 9,3% ở người từ 50 tuổi trở xuống."
