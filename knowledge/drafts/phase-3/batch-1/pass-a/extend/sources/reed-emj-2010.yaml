notes_vi: "289 người lớn đến cấp cứu sau ngất (Scotland), theo dõi 1 tháng. Nhồi máu cơ tim cấp ở 4 người (1,4%); cả 4 đều có thay đổi thiếu máu cục bộ trên điện tim lúc vào cấp cứu. Troponin tăng ở 7% người nằm viện, 1% người cho về."
