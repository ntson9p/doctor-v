notes_vi: "Tổng quan hệ thống về hội chứng tiền đình cấp (chóng mặt cấp kèm buồn nôn hoặc nôn, đi không vững, rung giật nhãn cầu, không chịu được cử động đầu, kéo dài từ 1 ngày). Khoảng 25% ± 15% do đột quỵ (ước tính), còn lại chủ yếu viêm thần kinh tiền đình. Mất điều hòa thân nặng (không tự ngồi được) 33% ở đột quỵ, 0% ở viêm thần kinh tiền đình; đi không vững 55% nguyên nhân trung ương; 67% nhồi máu động mạch tiểu não trên không tự đứng, đi được. Đau đầu, đau cổ 38% trung ương so với 12% ngoại biên (LR+ 3,2). Triệu chứng tai cấp hiếm ở cả hai (2/69 đột quỵ, 0/25 viêm). 29% đột quỵ có cơn báo trước; đau nửa đầu tiền đình có tới 27% cơn trên 24 giờ. Gần 2/3 đột quỵ không có dấu hiệu thần kinh khu trú mà người không chuyên nhận ra; chẩn đoán ban đầu bỏ sót 35% (44% khi chóng mặt đơn độc). Bối cảnh: cấp cứu, bệnh viện."
