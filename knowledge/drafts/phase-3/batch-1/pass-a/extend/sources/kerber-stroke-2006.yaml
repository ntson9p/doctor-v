notes_vi: "Dự án BASIC (Texas, Mỹ, 2000–2003): 1.666 người trên 44 tuổi đến cấp cứu hoặc nhập viện vì chóng mặt, quay cuồng, mất thăng bằng. Đột quỵ hoặc cơn thiếu máu não thoáng qua 3,2% (53 ca: 33 nhồi máu, 17 cơn thoáng qua, 1 xuất huyết); ở người chóng mặt đơn độc chỉ 0,7%. Trong 53 ca: yếu vận động 60%, rối loạn cảm giác 31%, rối loạn ngôn ngữ 21%, thị giác 24%, chóng mặt đơn độc 17%; tăng huyết áp 72%, bệnh mạch vành 40%, đái tháo đường 32%, từng bị cơn thoáng qua hoặc đột quỵ 28%, hút thuốc 23%, rung nhĩ 6%. Nam giới OR 2,47; mất thăng bằng so với chóng mặt OR 3,71; chóng mặt đơn độc OR 0,05. Bác sĩ cấp cứu bỏ sót 35%."
