notes_vi: "Tiêu chuẩn đau nửa đầu tiền đình: ít nhất 5 cơn triệu chứng tiền đình mức vừa hoặc nặng, mỗi cơn 5 phút–72 giờ; có tiền sử đau nửa đầu theo ICHD-3; ít nhất 50% số cơn có một đặc điểm đau nửa đầu (đau đầu kiểu đau nửa đầu, sợ ánh sáng và tiếng ồn, hoặc tiền triệu thị giác). Triệu chứng tiền đình gồm chóng mặt tự phát, chóng mặt tư thế, chóng mặt do kích thích thị giác, do cử động đầu. Bệnh có thể chỉ biểu hiện chóng mặt tư thế, giống chóng mặt tư thế kịch phát lành tính. ICHD-3 chỉ đưa đau nửa đầu tiền đình vào phụ lục."
