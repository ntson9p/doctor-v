notes_vi: "417 người 65–95 tuổi đi khám bác sĩ gia đình ở Hà Lan vì chóng mặt kéo dài từ 2 tuần. Kiểu chóng mặt: tiền ngất (choáng như sắp ngất) 69%, quay 41%, mất thăng bằng 40%; 44% có từ 2 kiểu. Nguyên nhân chính: tim mạch (gồm cả mạch não) 57%, tiền đình ngoại biên 14%, tâm thần 10%. Tác dụng phụ của thuốc là nguyên nhân góp phần ở khoảng một phần tư số người (23–25%). 62% có hơn 1 nguyên nhân góp phần."
