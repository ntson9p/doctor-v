notes_vi: "Lượt A mở toàn văn trên trang OUP. Hồi hộp chiếm 16% triệu chứng khiến người dân đi khám bác sĩ đa khoa; là lý do chuyển khám tim mạch đứng thứ hai sau đau ngực. Nguyên nhân theo Weber và Kapoor: rối loạn nhịp 41% (rung, cuồng nhĩ 16%; nhịp nhanh trên thất 10%; nhịp nhanh thất 2%), tâm thần 31%, thuốc và chất kích thích 6%, toàn thân 4% (cường giáp, thiếu máu, sốt), bệnh tim cấu trúc 3%, không rõ 16%; lo âu và cơn hoảng sợ gặp ở 15–31% người hồi hộp. Bảng 2 phân kiểu hồi hộp: kiểu ngoại tâm thu (hẫng một nhịp, không đều, khởi phát và kết thúc đột ngột, thường lúc nghỉ); kiểu nhịp nhanh (đều hoặc không đều, rất nhanh, bắt đầu và dừng đột ngột, có thể kèm ngất, khó thở, đau ngực); kiểu lo âu (đều, hơi nhanh, bắt đầu và dừng từ từ, kèm tê tay, mặt, nghẹn cổ, thở dài); kiểu đập mạnh (đều, tần số bình thường, từ từ, khi gắng sức). Gợi ý do rối loạn nhịp: bệnh tim cấu trúc hoặc bệnh điện học, điện tim lúc nghỉ bất thường, gia đình có người đột tử, tuổi cao, kiểu nhịp nhanh, kèm rối loạn huyết động; tiền sử rối loạn hoảng sợ và cơn dưới 5 phút làm giảm khả năng rối loạn nhịp đáng kể (số liệu nhỏ)."
