notes_vi: "Rà soát lần cuối 01/5/2026. Dấu hiệu mất nước ở người lớn và trẻ em: khát, nước tiểu vàng sẫm, đi tiểu ít hơn, chóng mặt hoặc choáng váng, mệt, khô miệng, môi, lưỡi, mắt trũng. Nguyên nhân: nôn hoặc tiêu chảy, uống nhiều rượu, đổ nhiều mồ hôi, sốt cao, đái tháo đường. Khám khẩn hoặc gọi 111 khi: mệt bất thường (trẻ li bì), chóng mặt khi đứng dậy mà không hết, thở nhanh hoặc tim đập nhanh. Gọi 999 hoặc đến cấp cứu khi có dấu hiệu mất nước kèm lú lẫn, buồn ngủ hơn bình thường hoặc khó đánh thức, khó thở, da lạnh, da, môi hoặc lưỡi xanh tái, xám, nhợt hoặc loang lổ."
