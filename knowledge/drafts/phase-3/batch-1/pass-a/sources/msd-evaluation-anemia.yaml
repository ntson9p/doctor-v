notes_vi: "Rà soát toàn bộ 5/2024, cập nhật 9/2024. Triệu chứng hay gặp: mệt, yếu, khó thở khi gắng sức, da xanh; ngoài ra buồn ngủ, đau thắt ngực, ngất, chóng mặt, nhức đầu, ù tai theo nhịp mạch, mất kinh. Triệu chứng thường xuất hiện khi huyết sắc tố giảm nhiều so với mức nền, rõ hơn khi dự trữ tim phổi kém hoặc thiếu máu xảy ra nhanh; triệu chứng không nhạy, không đặc hiệu. Da xanh hay gặp khi Hb < 7 g/dL. Đi ngoài phân đen, chảy máu mũi, nôn ra máu, rong kinh gợi ý chảy máu; sụt cân gợi ý ung thư."
