notes_vi: "Khoảng 90% người rung nhĩ có triệu chứng với mức độ khác nhau; có thể có cơn không triệu chứng. Triệu chứng đặc hiệu cho tim như hồi hộp ít gặp hơn triệu chứng không đặc hiệu như mệt. Tỷ lệ rung nhĩ dự kiến tăng gấp đôi trong vài thập kỷ tới. Phần lượt A đọc không có số liệu tỷ lệ theo tuổi."
