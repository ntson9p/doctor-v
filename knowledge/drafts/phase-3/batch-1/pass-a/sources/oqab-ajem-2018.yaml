notes_vi: "12 nghiên cứu (ngoài PESIT): 9 nghiên cứu ở cấp cứu (6.608 người, tuổi trung bình 62) và 3 nghiên cứu ở người nằm viện (975 người, tuổi trung bình 67). Tỷ lệ thuyên tắc phổi gộp: 0,8% (KTC 95% 0,5–1,3%) ở người ngất đến cấp cứu và 1,0% (0,5–1,9%) ở người nằm viện vì ngất. PESIT (Prandoni) cho 3,8% và 17,3%, cao hơn hẳn các nghiên cứu khác."
