notes_vi: "Thử nghiệm ngẫu nhiên ở phòng khám đa khoa Hà Lan: người liên tiếp đến khám vì hồi hộp hoặc choáng váng, chăm sóc thường quy có hoặc không kèm máy ghi biến cố do người bệnh tự bấm. Nhóm có máy: không tìm được nguyên nhân 17% (nhóm chứng 38%), có chẩn đoán về tim 67% (27%), rối loạn nhịp đáng kể 22% (7%). Tóm tắt không nêu thành phần của các chẩn đoán về tim không đáng kể (có lẽ chủ yếu là ngoại tâm thu)."
