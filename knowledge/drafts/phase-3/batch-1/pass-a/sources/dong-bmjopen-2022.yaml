notes_vi: "4.754 người khám ngoại trú ở một bệnh viện tuyến cuối ở Trung Quốc, đeo Holter 24 giờ vì hồi hộp. Có ngoại tâm thu thất ở 67,7% (nam 69,9%, nữ 66,0%); ngoại tâm thu thất dày (từ 5% tổng số nhịp) ở 7,7%. Người lớn tuổi hay có ngoại tâm thu thất hơn, nhưng người trẻ có ngoại tâm thu thì số nhịp sớm nhiều hơn. Cho thấy ngoại tâm thu thất ghi được trên Holter rất hay gặp, phần lớn có thể chỉ là tình cờ, không phải nguyên nhân của hồi hộp."
