notes_vi: "243 người từ 16 tuổi đến 10 khoa cấp cứu ở Anh vì hồi hộp (90,5%) hoặc tiền ngất, chưa rõ nguyên nhân sau lần khám đầu; tuổi 17–74, trung bình 39,5. Nhóm dùng máy ghi điện tim qua điện thoại ghi được nhịp lúc có triệu chứng ở 55,6% (nhóm chứng 9,5%). Trong 80 người ghi được nhịp lúc có triệu chứng (cả hai nhóm): nhịp xoang 66,3%, nhịp nhanh xoang 23,8%, ngoại tâm thu 16,3% (13 người); 12 người có rối loạn nhịp đáng kể (rung hoặc cuồng nhĩ, nhịp nhanh trên thất, nhịp chậm xoang). Phần mở đầu: khi ghi được, khoảng 9/10 cơn là nhịp lành tính (nhịp xoang, nhịp nhanh xoang hoặc ngoại tâm thu dày), khoảng 1/10 là rối loạn nhịp."
