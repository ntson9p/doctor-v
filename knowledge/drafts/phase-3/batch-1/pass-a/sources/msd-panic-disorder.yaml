notes_vi: "Lượt A mở trang (rà soát toàn bộ 4/2026). Cơn hoảng sợ gặp ở 8–23% người trong đời; rối loạn hoảng sợ khoảng 2–3% dân số trong 12 tháng; nữ gấp khoảng 2 lần nam; thường bắt đầu cuối tuổi vị thành niên hoặc đầu tuổi trưởng thành. Triệu chứng kéo dài vài phút đến 1 giờ. Cần từ 4 trong 13 triệu chứng: sợ chết, sợ mất kiểm soát, cảm giác không thật; đau tức ngực, chóng mặt hoặc choáng, nghẹn, nóng bừng hoặc ớn lạnh, buồn nôn hoặc khó chịu ở bụng, tê bì, hồi hộp, khó thở, vã mồ hôi, run. Cơn có thể xảy ra trong tình huống đã biết hoặc bất ngờ, không có yếu tố khởi phát. Người bệnh hay khám lại nhiều lần ở cơ sở ban đầu, cấp cứu vì lo bệnh tim, phổi, thần kinh. Cần loại trừ bệnh cơ thể gây hoặc giống lo âu như cường giáp, hội chứng mạch vành cấp; bệnh đi kèm có rối loạn nhịp, cường giáp, hen, bệnh phổi tắc nghẽn."
