notes_vi: "Điều tra dân số Đức (1.003 người phỏng vấn, kiểm chứng bằng khám). Tỷ lệ mắc trọn đời 2,4% (nữ 3,2%, nam 1,6%); trong 1 năm 1,6% (nữ 2,3%, nam 0,9%): 0,5% ở 18–39 tuổi, 1,7% ở 40–59 tuổi, 3,4% từ 60 tuổi; mới mắc 0,6%/năm. 80 ca: chóng mặt quay 86%; khởi phát khi trở mình trên giường 85%, nằm xuống 74%, ngồi dậy 58%, cúi người 55%, ngửa đầu 41%; buồn nôn 33%, nôn 14%, mất thăng bằng 49%, ngã 1%; 56% tái phát nhiều đợt; mỗi đợt trung vị 2 tuần (đợt cuối trên 4 tuần ở 31%); 78% có đi khám, chỉ 8% được điều trị đúng. Đi kèm: đau nửa đầu 34% (đối chứng 10%), tăng huyết áp 52%."
