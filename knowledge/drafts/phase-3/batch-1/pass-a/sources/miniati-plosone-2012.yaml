notes_vi: "800 người thuyên tắc phổi đã xác định ở Ý (Pisa 440, bệnh viện; Firenze 360, 90% ngoại trú lúc chẩn đoán). Bảng 4, toàn bộ mẫu: khó thở đột ngột 80%, khó thở từ từ 3%, đau ngực 49% (ở Firenze 84% đau một bên kiểu màng phổi), ngất hoặc xỉu 24%, ho ra máu 6%, sưng đau một bên tay hoặc chân 30%, sốt trên 38°C 5%, ung thư đang tiến triển 11%, bệnh tim mạch có từ trước 27%; ở Firenze ho 4%. Người có quá tải thất phải trên điện tim ngất nhiều hơn (35% so với 15%). 94% có ít nhất 1 trong 4 triệu chứng (khó thở đột ngột, đau ngực, ngất, ho ra máu); 3% chỉ có dấu hiệu huyết khối tĩnh mạch sâu; 1% không triệu chứng; hồi hộp đơn độc chỉ ở 5 người. Một nửa là thuyên tắc không có yếu tố thuận lợi."
