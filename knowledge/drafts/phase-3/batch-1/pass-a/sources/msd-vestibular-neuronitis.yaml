notes_vi: "Rà soát toàn bộ 10/2025, cập nhật 9/2026. Thường do nhiễm vi rút hoặc viêm sau nhiễm vi rút; tỷ lệ mới mắc 11,7–15,5/100.000 mỗi năm, tuổi khởi phát trung bình 52,3. Một cơn chóng mặt nặng duy nhất kèm buồn nôn, nôn; rung giật nhãn cầu tự phát 7–10 ngày; không nghe kém, không ù tai; có thể đi không vững nhưng vẫn đi lại được. Triệu chứng giảm dần trong vài ngày đến vài tuần, một số người còn mất thăng bằng khi cử động đầu nhanh. Ở cấp cứu dùng nghiệm pháp HINTS để phân biệt với đột quỵ; có triệu chứng thần kinh thì cần khám cấp cứu. Truyền dịch khi nôn kéo dài."
