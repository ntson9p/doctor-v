notes_vi: "Lượt A mở toàn văn trên trang OUP (chưa đối chiếu DOI nên không ghi). Mục 6: nhịp nhanh trên thất có tỷ lệ hiện mắc 2,25/1.000 người, mới mắc 35/100.000 người-năm; nữ có nguy cơ gấp đôi nam; nhịp nhanh vòng vào lại nút nhĩ thất gặp ở nữ nhiều hơn (khoảng 70:30). Mục 7: biểu hiện là hồi hộp, mệt, choáng váng, tức ngực, khó thở, thay đổi ý thức; khởi phát đột ngột gợi ý nhịp nhanh vòng vào lại; cảm giác đập ở cổ ('dấu hiệu con ếch') gợi ý vòng vào lại nút nhĩ thất; choáng váng không hiếm, tiền ngất và ngất ít gặp hơn; nguy hiểm trực tiếp hiếm. Đặc điểm lâm sàng có thể giống rối loạn hoảng sợ; lo âu, cơn hoảng sợ là nguyên nhân của nhịp nhanh xoang."
