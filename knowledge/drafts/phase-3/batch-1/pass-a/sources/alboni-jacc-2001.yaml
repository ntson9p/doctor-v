notes_vi: "341 người ngất được đánh giá tiến cứu (Ý): do tim 23%, qua trung gian thần kinh (phản xạ) 58%, thần kinh hoặc tâm thần 1%, không rõ 18%. Có bệnh tim là yếu tố dự báo độc lập duy nhất của ngất do tim (OR 16; độ nhạy 95%, độ đặc hiệu 45%); không có bệnh tim loại trừ được ngất do tim ở 97% số người. Ở người có bệnh tim, gợi ý ngất do tim: ngất khi nằm, khi gắng sức, nhìn mờ, ngất kèm co giật. Gợi ý ngất phản xạ: các cơn cách nhau hơn 4 năm, khó chịu ở bụng trước khi mất ý thức, buồn nôn và vã mồ hôi khi tỉnh lại. Ở người không có bệnh tim, hồi hộp là yếu tố dự báo duy nhất của ngất do tim."
