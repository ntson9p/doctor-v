notes_vi: "Lượt A mở trang (rà soát toàn bộ 6/2025, cập nhật 11/2025). Nguyên nhân xuất huyết tiêu hóa trên: loét tá tràng 15–29%, loét dạ dày 14–16%, cả hai tới 50%; giãn tĩnh mạch 5–33%; rách tâm vị 6–15%; trợt dạ dày tá tràng 3–15%. Nôn ra máu đỏ gợi ý chảy máu đường tiêu hóa trên; nôn dịch như bã cà phê gợi ý chảy máu đã chậm hoặc ngừng; phân đen cần khoảng 100–200 mL máu và có thể kéo dài vài ngày sau khi ngừng chảy; sắt, bismuth làm phân đen mà không có máu; chảy máu trên ồ ạt có thể đi ngoài ra máu đỏ. Ngất, tụt huyết áp, da tái, vã mồ hôi, tim nhanh, tiểu ít gợi ý mất máu nhiều; tụt huyết áp tư thế thường xuất hiện khi mất trên 2 đơn vị máu; người cao tuổi chịu mất máu kém. Yếu tố nguy cơ: thuốc chống đông, aspirin, thuốc chống viêm không steroid, clopidogrel, bệnh gan mạn, rượu. Nôn ra máu, phân đen hoặc đi ngoài ra máu cần được coi là cấp cứu tiềm tàng."
