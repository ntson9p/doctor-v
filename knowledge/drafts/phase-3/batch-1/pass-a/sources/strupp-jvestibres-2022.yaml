notes_vi: "Tiêu chuẩn của Hội Bárány: khởi phát cấp hoặc bán cấp chóng mặt quay hoặc không quay liên tục, mức vừa đến nặng, kéo dài ít nhất 24 giờ rồi giảm dần; buồn nôn và thường có nôn; mất thăng bằng, xu hướng ngã về bên tổn thương; không có triệu chứng thần kinh trung ương, không nghe kém, ù tai cấp. Mức vừa nghĩa là vẫn đi được quãng ngắn. Tới 25% có cơn chóng mặt vài giờ trong 2 ngày trước khởi phát; cơn chóng mặt nhiều ngày trước đó gợi ý Ménière, đau nửa đầu tiền đình, cơn thiếu máu não thoáng qua. Tỷ lệ mới mắc 3,5–15,5/100.000 mỗi năm; tái phát 1,9–10,7%. Nguyên nhân vi rút có khả năng nhưng chưa được chứng minh."
