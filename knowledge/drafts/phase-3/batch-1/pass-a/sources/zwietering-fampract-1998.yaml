notes_vi: "762 người đến bác sĩ đa khoa ở Hà Lan trong 2 năm vì triệu chứng mới có thể do rối loạn nhịp, được hỏi bệnh theo mẫu và ghi điện tim qua điện thoại. Có rối loạn nhịp ở 28,3%, rối loạn nhịp đáng kể về lâm sàng ở 8,8%. Tuổi, nam giới, hồi hộp và khó thở lúc khám, dùng thuốc tim mạch liên quan với có rối loạn nhịp; dùng thuốc tác động thần kinh trung ương và hay than triệu chứng cơ thể do tâm lý liên quan ngược với rối loạn nhịp đáng kể. Tóm tắt không tách riêng loại rối loạn nhịp không đáng kể (phần lớn có lẽ là ngoại tâm thu)."
