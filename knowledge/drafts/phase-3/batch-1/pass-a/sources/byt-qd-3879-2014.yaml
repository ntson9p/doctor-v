notes_vi: "Văn bản hành chính. Lượt A đọc toàn văn đăng trên luatvietnam.vn (cơ sở dữ liệu văn bản pháp luật); caselaw.vn xác nhận số, ngày 30/9/2014, Thứ trưởng Nguyễn Thị Xuyên ký, còn hiệu lực, sửa đổi lần 1 ngày 19/7/2017 (phần đái tháo đường đã có hướng dẫn riêng). Chưa tìm thấy PDF ký số trên cổng Bộ Y tế. Bài 'Cường chức năng tuyến giáp': Basedow là thể điển hình, hay gặp nhất; nữ/nam khoảng 7–10/1. Triệu chứng: ăn nhiều nhưng sụt cân, sợ nóng, ra nhiều mồ hôi, bàn tay ẩm; tiêu chảy không đau quặn (văn bản ghi khoảng 50%); hồi hộp, nhịp tim nhanh 100–140 lần/phút; rung nhĩ ở khoảng 10–25%, nhất là người cao tuổi; bồn chồn, mất ngủ, run tay, yếu cơ; bướu giáp lan tỏa, mềm; khoảng 50% có bệnh mắt (lồi mắt, nhìn đôi). Người cao tuổi: biểu hiện tim mạch nổi bật, bướu giáp vừa phải, run biên độ lớn, ít triệu chứng mắt. Cơn bão giáp (khoảng 1–2% người nhiễm độc giáp nhập viện, tử vong 20–30%): sốt cao 39–40°C, nhịp tim trên 140 lần/phút, nôn, tiêu chảy, vàng da, lú lẫn, kích động, co giật, hôn mê; yếu tố khởi phát gồm ngừng thuốc kháng giáp đột ngột, nhiễm trùng, phẫu thuật, stress."
