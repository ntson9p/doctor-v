notes_vi: "Điều tra quốc gia 01–03/2021, 4.738 người 18–69 tuổi. Đường huyết lúc đói từ 7,0 mmol/L hoặc đang dùng thuốc điều trị đái tháo đường: 7,1% (nam 7,3%, nữ 6,9%); 3,0% ở 18–29 tuổi, 5,6% ở 30–49 tuổi, 13,4% ở 50–69 tuổi (bảng 39). Đang dùng thuốc điều trị đái tháo đường: 2,9% chung; 0,8% ở 18–29 tuổi, 1,4% ở 30–49 tuổi, 7,5% ở 50–69 tuổi. Chỉ 34,9% người tăng đường huyết đã được chẩn đoán, 23,3% đang được quản lý ở cơ sở y tế (bảng 41). Huyết áp cao 26,2%."
