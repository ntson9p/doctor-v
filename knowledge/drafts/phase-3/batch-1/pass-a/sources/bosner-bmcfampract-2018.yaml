notes_vi: "31 nghiên cứu ở chăm sóc ban đầu (chủ yếu châu Âu, Mỹ). Chóng mặt chiếm 1–15,5% lượt khám. Nguyên nhân (khoảng dao động giữa các nghiên cứu): tim mạch 3,8–56,8%, ngoại biên tiền đình 5,4–42,1% (chóng mặt tư thế kịch phát lành tính 4,3–39,5%, viêm dây thần kinh tiền đình 0,6–24%), thần kinh trung ương 1,4–11,4%, tâm lý 1,8–21,6%, không rõ chẩn đoán 0–80,2%. Hai nghiên cứu ít sai lệch nhất đều ở người cao tuổi: tim mạch là nguyên nhân chính (56,8% và 48%), sau đó là tiền đình ngoại biên; tâm lý 9,8%, do thuốc 2,4% (Maarsingh 2010). Ở người chóng mặt kiểu quay (vertigo), nguyên nhân tim mạch hầu như không có. Dị biệt giữa các nghiên cứu rất lớn nên tác giả không gộp số."
