notes_vi: "Lượt A mở trang (rà soát lần cuối 15/10/2026). Triệu chứng: khó thở đột ngột, đau ngực tăng khi hít vào, ho ra máu, đau sưng một bên chân hoặc tay. Gọi 999 hoặc đến cấp cứu khi khó thở đột ngột, đau ngực hoặc lưng trên, tim đập rất nhanh, hoặc có người bất tỉnh; không tự lái xe. Hẹn khám gấp hoặc gọi 111 khi ho ra máu. Nguy cơ huyết khối tăng sau đi xe, máy bay từ 4 giờ, nằm viện."
