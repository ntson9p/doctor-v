notes_vi: "Tổng quan hệ thống JAMA Rational Clinical Examination (7 nghiên cứu về độ chính xác, 16 về hiệu suất thăm dò). Ở người hồi hộp: tiền sử bệnh tim (LR 2,03), hồi hộp bị ảnh hưởng khi ngủ (LR 2,29) hoặc xảy ra lúc đang làm việc (LR 2,17) làm tăng nhẹ khả năng rối loạn nhịp; tiền sử rối loạn hoảng sợ (LR 0,26) hoặc cơn dưới 5 phút (LR 0,38) làm giảm nhẹ. Cảm giác đập nhanh, đều, mạnh ở cổ (LR 177) hoặc thấy mạch cổ đập (LR 2,68) gợi ý nhịp nhanh vòng vào lại nút nhĩ thất; không có cảm giác này thì LR 0,07. Khám lâm sàng không đủ để loại trừ rối loạn nhịp; cần ghi điện tim lúc có triệu chứng (máy ghi biến cố cho hiệu suất 34–84%)."
