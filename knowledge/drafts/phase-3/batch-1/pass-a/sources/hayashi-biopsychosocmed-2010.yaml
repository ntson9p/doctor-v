notes_vi: "70 người rối loạn hoảng sợ 18–65 tuổi (50 nữ) khám lần đầu tại khoa Tâm thể, Bệnh viện Đại học Toho (Nhật Bản), đã loại trừ rối loạn nhịp, đau thắt ngực, cường giáp, bệnh phổi. Bảng 3, tỷ lệ triệu chứng cơn hoảng sợ theo DSM-IV ở nhóm điện não bình thường (53 người) và bất thường (17 người): hồi hộp, tim đập nhanh 83,0% và 76,5%; chóng mặt, choáng, cảm giác sắp ngất 71,7% và 88,2%; khó thở, nghẹt thở 75,5% và 76,5%; đau, tức ngực 41,5% và 41,2%; tê bì 43,4% và 64,7%; sợ mất kiểm soát 43,4% và 64,7%; sợ chết 30,2% và 29,4%; run 30,2% và 29,4%; vã mồ hôi 20,8% và 29,4%. Phần mở đầu: rối loạn hoảng sợ thường khởi phát ở tuổi 20–30, nữ gấp đôi nam; 6,7% người khám ban đầu đủ tiêu chuẩn rối loạn hoảng sợ (Katon); 28% người bệnh đến cấp cứu."
