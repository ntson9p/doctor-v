notes_vi: "Rà soát toàn bộ 10/2025. Nguyên nhân hay gặp nhất của chóng mặt tai trong tái diễn; tỷ lệ mắc trọn đời 2,4%, nữ nhiều hơn, tăng theo tuổi, gây ngã ở người già. Cơn ngắn dưới 60 giây, cảm giác quay khi cử động đầu (trở mình, cúi người); có thể buồn nôn, nôn; không nghe kém, không ù tai; cơn hay nặng buổi sáng. Thường tự hết sau vài tuần đến vài tháng, có thể tái phát. Chẩn đoán dựa trên triệu chứng điển hình, nghiệm pháp Dix-Hallpike và không có bất thường thần kinh khác; chữa bằng động tác đặt lại sỏi tai (Epley, Semont), không khuyên dùng thuốc thường quy."
