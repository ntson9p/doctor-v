notes_vi: "Triệu chứng hay gặp nhất của ngộ độc CO là đau đầu, chóng mặt, yếu, khó chịu dạ dày, nôn, đau ngực, lú lẫn; thường được mô tả giống cúm. Người đang ngủ hoặc say có thể tử vong trước khi có triệu chứng. CO tích tụ trong nhà và gây ngộ độc cả người lẫn vật nuôi. Mỹ: hơn 100.000 lượt cấp cứu, hơn 14.000 ca nhập viện và hơn 400 ca tử vong mỗi năm do ngộ độc CO không liên quan đến cháy."
