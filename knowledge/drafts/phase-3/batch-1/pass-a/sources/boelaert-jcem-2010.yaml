notes_vi: "3.049 người cường giáp liên tiếp tại một phòng khám chuyên khoa (Anh). Tuổi càng cao, phần lớn triệu chứng kinh điển càng ít gặp, trừ sụt cân và khó thở; người trên 61 tuổi ít khi có từ 5 triệu chứng. Bệnh nặng hơn và hút thuốc làm tăng triệu chứng. Tuổi cao, nam, bướu nhân độc và FT4 cao liên quan với rung nhĩ. Tác giả đề nghị xét nghiệm tuyến giáp sớm ở người trên 60 tuổi có rung nhĩ, sụt cân hoặc khó thở. Tóm tắt không có tỷ lệ từng triệu chứng."
