notes_vi: "Tổng quan tường thuật. Đau nửa đầu tiền đình: tỷ lệ mắc trọn đời khoảng 1%, trong 1 năm 0,9%; chiếm khoảng 7% người khám ở phòng khám chóng mặt, 9% ở phòng khám đau đầu; gặp ở nữ nhiều gấp 1,5–5 lần. Là nguyên nhân chóng mặt hay gặp nhất ở trẻ em (39%), tiếp theo là chóng mặt chức năng, tâm lý (21%). Chóng mặt tự phát 21–83%, chóng mặt tư thế 17–65%, không chịu được cử động đầu 31–77%; điều tra dân số: 67% chóng mặt quay tự phát, 24% chóng mặt tư thế. Cơn từ vài giây đến vài ngày; dưới 50% có cả đau đầu và chóng mặt ở mọi cơn. Triệu chứng tai (nghe kém, ù tai, đầy tai) 38%, thường nhẹ, thoáng qua. Cơn 5–60 phút kiểu tiền triệu ở 10–30%."
