notes_vi: "Lượt A lô 1 (Giai đoạn 3) mở toàn văn trên trang OUP. Phần dịch tễ: ngất lần đầu có hai đỉnh, rất hay gặp ở tuổi 10–30, ít gặp quanh 40 tuổi, tăng lại sau 65 tuổi; khoảng một nửa dân số ngất ít nhất một lần trong đời; chỉ khoảng 25–50 trên 100 người ngất đi khám, 2–10 người đến cấp cứu. Ngất phản xạ là nguyên nhân hay gặp nhất ở mọi bối cảnh và mọi lứa tuổi; ngất do tim đứng thứ hai, hay gặp hơn ở cấp cứu và người cao tuổi, rất hiếm ở trẻ em, thiếu niên và người trẻ; hạ huyết áp tư thế hiếm dưới 40 tuổi, hay gặp ở người rất cao tuổi; người cao tuổi thường có nhiều nguyên nhân cùng lúc. Bảng tỷ lệ từng nguyên nhân theo tuổi nằm ở phụ lục trực tuyến, lượt A không mở được."
