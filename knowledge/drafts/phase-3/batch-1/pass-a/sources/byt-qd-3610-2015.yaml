notes_vi: "Văn bản hành chính. Lượt A đọc toàn văn đăng lại trên vnras.com (trang thứ cấp, có liên kết tải PDF): Quyết định số 3610/QĐ-BYT ngày 31/8/2015, KT. Bộ trưởng, Thứ trưởng Nguyễn Thị Xuyên ký. Bài “Ngộ độc khí carbon monoxide (CO)”: ở Việt Nam hay gặp do đốt than (nhất là bếp than tổ ong), củi, ga trong phòng kín để nấu ăn, sưởi, đun nước (bình nóng lạnh dùng ga), chạy máy phát điện, động cơ trong phòng kín, cháy nhà; thường nhiều người trong nhà cùng bị, cả vật nuôi. Khởi đầu đau đầu, mệt, chóng mặt, buồn nôn, nhìn mờ, rối loạn hành vi; nặng thì hôn mê. Ngộ độc nhẹ dễ nhầm với cảm cúm, nhất là mùa đông; ngộ độc vừa dễ nhầm với ngộ độc thức ăn, đau thắt ngực. Thể thần kinh – tâm thần khởi đầu đi loạng choạng; trẻ em có thể co giật; người già lẫn lộn. Loạn nhịp tim 5–6%. Xử trí: đưa khỏi nguồn khí, thở oxy càng sớm càng tốt; tổn thương thần kinh muộn 2–40 ngày sau. Chưa thấy văn bản thay thế; cần thay URL bằng bản chính thức."
