notes_vi: "Nghiên cứu tiến cứu đa trung tâm ở bệnh viện tuyến cuối tại Việt Nam: 395 người lớn đến cấp cứu vì xuất huyết tiêu hóa trên không do giãn tĩnh mạch (đã loại trừ ca chuyển tuyến sau hồi sức). Tuổi trung bình 50,8 ± 19,2; nam 74,4%. Biểu hiện lúc vào viện: nôn ra máu đỏ 28,6%, nôn dịch nâu đen như bã cà phê 48,1%, chỉ đi ngoài phân đen 23,3%. Nguyên nhân khi nội soi: loét dạ dày 37,7%, loét tá tràng 35,9%, rách tâm vị (Mallory–Weiss) 9,6%, viêm trợt dạ dày 5,3%, ung thư dạ dày 1,8%, không xác định 7,1%. Bệnh gan mạn 6,1%, suy tim 2,8%."
