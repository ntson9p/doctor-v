notes_vi: "Tổng quan tường thuật (Hàn Quốc). Bệnh ngoại biên tiền đình hay gặp thứ ba sau chóng mặt tư thế kịch phát lành tính và Ménière; không khác biệt rõ theo giới; gặp nhiều ở người trên 70 tuổi. Nhiễm vi rút đường hô hấp trên trước đó hoặc cùng lúc ở 43–46% ca. Điển hình: chóng mặt quay thật sự trên 24 giờ, buồn nôn, nôn, không nghe kém, ù tai hay triệu chứng thần kinh; phần lớn buồn nôn, nôn nhiều, đỡ rõ sau 1–3 ngày. Trong 3 ngày đầu vẫn tự đi được nhưng phần lớn phải có người dìu vì nghiêng, ngã về bên bệnh. Tới 1/4 có cơn chóng mặt vài phút trong vài ngày trước khởi phát."
