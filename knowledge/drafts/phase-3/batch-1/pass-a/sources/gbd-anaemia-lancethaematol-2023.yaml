notes_vi: "Toàn cầu năm 2021: thiếu máu 24,3% mọi lứa tuổi; nam 17,5%, nữ 31,2%; ở tuổi 15–49: nữ 33,7%, nam 11,3%. Khác biệt theo giới lớn nhất ở tuổi 10–64, nhỏ ở trẻ dưới 5 tuổi (41,4%). Nguyên nhân hàng đầu là thiếu sắt do ăn uống, rồi bệnh hemoglobin và tan máu; ở người già, bệnh thận mạn là nguyên nhân quan trọng. Số liệu ở nam giới trưởng thành và người trên 60 tuổi còn thưa."
