notes_vi: "Phân tích phụ thử nghiệm ACCORD (đái tháo đường típ 2): các cơn hạ đường huyết nặng (cần người khác giúp). Triệu chứng được ghi: yếu, mệt 29–30%, vã mồ hôi 26–27%, lú lẫn, mất định hướng 22–29%, run 19–21%, chóng mặt 14–16%, tim đập nhanh 4%. Yếu tố trước cơn: ăn muộn hoặc bỏ bữa 31–44%, ăn ít tinh bột hơn thường lệ 25–26% (khoảng một nửa liên quan ăn uống), vận động nhiều hơn thường lệ khá hay gặp, uống rượu 2–3%. Hậu quả: lú lẫn 34–37%, mất ý thức 25%, co giật 2–3%, nhập viện 18–24%. 10–11% cơn xảy ra 0–4 giờ sáng. Bối cảnh: thử nghiệm lâm sàng, cơn nặng; cơn nhẹ ở cộng đồng có thể khác."
