notes_vi: "868 người ở 20 phòng khám đa khoa Hà Lan (dân số gần 50.000), 1989–1991, có triệu chứng hoặc dấu hiệu nghi do rối loạn nhịp, được ghi điện tim 12 chuyển đạo qua điện thoại. Có rối loạn nhịp ở 32%; trong số đó 31% là rối loạn nhịp đáng kể cần điều trị (khoảng 10% tổng số). Rối loạn nhịp tăng rõ theo tuổi, gặp nhiều hơn ở nam và khi có dấu hiệu rối loạn huyết động. Tóm tắt không tách riêng ngoại tâm thu."
