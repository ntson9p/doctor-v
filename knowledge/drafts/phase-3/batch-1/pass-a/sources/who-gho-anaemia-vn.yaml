notes_vi: "Ước tính mô hình của WHO (bản cập nhật 29/4/2025) cho Việt Nam: thiếu máu ở phụ nữ 15–49 tuổi 20,5% năm 2023 (khoảng bất định 8,5–38,7%); không mang thai 20,4%, mang thai 25,3%. Trẻ 6–59 tháng năm 2019: 22,9% (vừa 7,4%, nặng 0,5%) (chỉ số NUTRITION_ANAEMIA_CHILDREN_PREV). Không có số liệu cho nam giới và người cao tuổi."
