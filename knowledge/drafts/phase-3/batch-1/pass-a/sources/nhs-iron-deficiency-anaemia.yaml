notes_vi: "Rà soát lần cuối 26/01/2024. Triệu chứng: mệt, thiếu năng lượng, khó thở, cảm nhận rõ tim đập (hồi hộp), da nhợt hơn bình thường, nhức đầu. Kinh nguyệt nhiều và có thai là nguyên nhân rất hay gặp; chảy máu dạ dày, ruột (do thuốc giảm đau chống viêm, loét dạ dày, trĩ, hiếm hơn là ung thư) cũng hay gặp. Lời khuyên không khẩn: khám bác sĩ nếu nghĩ mình bị thiếu máu thiếu sắt. Ăn thêm rau lá xanh đậm, ngũ cốc và bánh mì bổ sung sắt, thịt, trái cây sấy, các loại đậu; bớt trà, cà phê, sữa và thực phẩm nhiều phytat vì làm giảm hấp thu sắt. Viên sắt dùng khoảng 6 tháng, có thể làm phân sẫm màu; để xa tầm tay trẻ em vì quá liều sắt có thể gây tử vong ở trẻ nhỏ."
