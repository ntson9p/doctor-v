notes_vi: "125 người ngoại trú được chỉ định ghi điện tim lưu động vì hồi hộp: 43 người (34%) có rối loạn nhịp có ý nghĩa; trong 82 người còn lại, 24 người (29%) có rối loạn tâm thần hiện tại, 83% trong số đó là trầm cảm nặng hoặc rối loạn hoảng sợ. Nhóm này trẻ hơn, cơn hồi hộp kéo dài hơn 15 phút, kèm nhiều triệu chứng khác và cảm nhận dữ dội hơn. Sau 3 tháng, khoảng 90% ở cả hai nhóm vẫn còn hồi hộp."
