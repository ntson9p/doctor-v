notes_vi: "Lượt A mở trang (rà soát toàn bộ và cập nhật 9/2024; tác giả L. Brent Mitchell). Mục ngoại tâm thu nhĩ: là các xung động sớm từng lúc, hay gặp, có thể có ở tim bình thường; ngoại tâm thu nhĩ thỉnh thoảng ở người có vẻ khỏe mạnh thường được coi là lành tính, hầu như ai cũng có. Yếu tố thúc đẩy: cà phê, rượu, pseudoephedrin. Đôi khi gây hồi hộp. Có thể là dấu hiệu của bệnh tim phổi, hay gặp ở người bệnh phổi tắc nghẽn mạn tính. Ngoại tâm thu nhĩ dày liên quan tăng nguy cơ đột quỵ, tử vong chung, tử vong tim mạch và rung nhĩ; chưa rõ đó là quan hệ nhân quả hay do cùng yếu tố nguy cơ như tuổi cao. Trang không nêu cách điều trị riêng."
