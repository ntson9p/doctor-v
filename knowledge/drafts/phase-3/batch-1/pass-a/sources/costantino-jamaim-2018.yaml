notes_vi: "Dữ liệu hành chính của 1.671.944 người lớn đến cấp cứu vì ngất ở Canada, Đan Mạch, Ý, Mỹ (2000–2016). Tỷ lệ thuyên tắc phổi khi ra viện: 0,06–0,55% ở mọi người, 0,15–2,10% ở người nằm viện; sau 90 ngày 0,14–0,83%. Kết luận: thuyên tắc phổi hiếm khi là nguyên nhân ngất."
