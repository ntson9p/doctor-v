notes_vi: "184 người hồi hộp ở mạng lưới 12 bác sĩ đa khoa và một khoa tim mạch ở Đức (hồi cứu), tuổi trung bình 57,5, nữ 56,5%; tự ghi điện tim 2 lần mỗi ngày và khi hồi hộp, tối đa 4 tuần. Rối loạn nhịp được coi là đáng kể ở 38,5%: rung nhĩ cơn đã biết tái phát 14,7%, rung nhĩ mới 10,3%, ngoại tâm thu hoặc nhịp đôi 7,1%, nhịp nhanh xoang 3,8%, nhịp nhanh vòng vào lại nút nhĩ thất 1,6%, nhịp nhanh thất 1,1%. Mẫu có nhiều người đã biết rung nhĩ, nên tỷ lệ rung nhĩ cao hơn người hồi hộp nói chung."
