notes_vi: "Khoảng 15.200 lượt cấp cứu mỗi năm vì phơi nhiễm CO không do cháy. Nhiều nhất vào tháng 12 (2.157 lượt không tử vong) và tháng 1 (2.511), ít nhất vào tháng 6 (510) và tháng 7 (524). 64,3% xảy ra ở nhà. Trong số ca có ghi triệu chứng: đau đầu 37,5%, chóng mặt 18,0%, buồn nôn 17,3%, mất ý thức 7,7%, khó thở 6,7%, mất kiểm soát vận động 3,5%. Tỷ lệ không tử vong ở nam và nữ tương đương."
