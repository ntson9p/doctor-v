notes_vi: "Tỷ lệ mới mắc thuyên tắc phổi 39–115/100.000 dân mỗi năm; huyết khối tĩnh mạch ở người từ 80 tuổi gần gấp 8 lần người 40–49 tuổi. Bảng 3 yếu tố thuận lợi: mạnh (gãy xương chi dưới, nằm viện vì suy tim hoặc rung nhĩ trong 3 tháng, thay khớp háng hoặc gối, chấn thương nặng, nhồi máu cơ tim trong 3 tháng, tiền sử huyết khối tĩnh mạch, tổn thương tủy sống); trung bình (ung thư, hóa trị, thuốc tránh thai, hậu sản, nhiễm trùng, bệnh tự miễn, đột quỵ liệt, suy tim…); yếu (nằm trên 3 ngày, ngồi lâu như đi xa, tuổi cao, béo phì, có thai, đái tháo đường, tăng huyết áp, giãn tĩnh mạch). Nghĩ đến thuyên tắc phổi khi khó thở, đau ngực, tiền ngất hoặc ngất, ho ra máu; biểu hiện không đặc hiệu; khó thở có thể nặng và đột ngột khi tắc lớn, nhẹ và thoáng qua khi tắc nhỏ ngoại vi; đau ngực hay gặp, thường do kích thích màng phổi; ngất đi kèm rối loạn huyết động và suy thất phải nhiều hơn; nhịp nhanh xoang gặp ở khoảng 40% ca nhẹ; có thể không triệu chứng. Hướng dẫn trích nghiên cứu PESIT: 17% người nằm viện vì ngất có thuyên tắc phổi (các nghiên cứu sau ở cấp cứu cho tỷ lệ thấp hơn nhiều, xem oqab-ajem-2018)."
