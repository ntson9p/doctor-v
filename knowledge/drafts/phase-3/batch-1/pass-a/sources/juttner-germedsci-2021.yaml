notes_vi: "Hướng dẫn S2k của Đức. Triệu chứng không đặc hiệu, từ chóng mặt, đau đầu, đau thắt ngực đến bất tỉnh và tử vong; biểu hiện hay gặp nhất khi vào viện là đau đầu, buồn nôn, nôn, khó thở, chóng mặt và ngất. Cần nghĩ đến ngộ độc CO ở người có triệu chứng không đặc hiệu như lơ mơ, chóng mặt, buồn nôn, nôn; tình huống điển hình gồm khói cháy, mất ý thức không rõ lý do trong phòng kín có bếp lửa. Khi nghi ngờ, cho thở oxy 100% ngay từ trước khi đến viện; người sơ cứu đưa nạn nhân ra khỏi vùng nguy hiểm."
