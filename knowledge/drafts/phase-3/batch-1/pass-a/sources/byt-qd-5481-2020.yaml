notes_vi: "Văn bản hành chính. Lượt A đọc toàn văn trên caselaw.vn (trang thứ cấp): Quyết định 5481/QĐ-BYT ngày 30/12/2020, KT. Bộ trưởng, Thứ trưởng Nguyễn Trường Sơn ký; Điều 3 thay thế 3319/QĐ-BYT ngày 19/7/2017. Phần 6 “Hạ đường huyết”: biến chứng cấp thường gặp; người tỉnh, tự uống được (glucose < 3,9 mmol/L) dùng 15–20 g glucose hoặc thức ăn có đường, thử lại sau 15 phút, nhắc lại nếu còn thấp, rồi ăn nhẹ; mức 1: 3,0–3,9 mmol/L, mức 2: < 3,0 mmol/L, mức 3: rối loạn ý thức, cần cấp cứu; nhiều cơn hoặc cơn nặng cần rà soát phác đồ. Phụ lục: hạ đường huyết hay gặp nhất khi tiêm insulin (quá liều, bỏ bữa, ăn muộn, vận động nhiều); dấu hiệu sớm: đói, bồn chồn, hoa mắt, vã mồ hôi, tay chân lạnh; quanh 3 mmol/L: tim nhanh, hồi hộp, đổ mồ hôi, lạnh run, buồn nôn; dưới 2,8 mmol/L: bứt rứt, lú lẫn, nhìn mờ, mệt, nhức đầu, nói khó; nặng hơn: hôn mê, co giật. Sulfonylurea gây hạ đường huyết, nguy cơ cao ở người già ăn kém, suy thận; metformin, pioglitazone, ức chế α-glucosidase, ức chế DPP-4 dùng đơn độc không gây hạ đường huyết. Cần thay URL bằng bản chính thức (trang kcb.vn mục đái tháo đường típ 2 chỉ có bản 3280/QĐ-BYT năm 2011)."
