notes_vi: "139 người trên 18 tuổi hồi hộp mới xuất hiện, do 62 bác sĩ đa khoa ở Anh tuyển, được đeo máy ghi biến cố 2 tuần. Tóm tắt nêu dưới một nửa số người hồi hộp có rối loạn nhịp. Gợi ý nguyên nhân tim: nam (OR 2,1), hồi hộp đều (OR 2,5), hồi hộp lúc làm việc (OR 3,0), hồi hộp bị ảnh hưởng khi ngủ (OR 3,3). Có xu hướng liều – đáp ứng giữa tần số, thời gian cơn và khả năng rối loạn nhịp đáng kể."
