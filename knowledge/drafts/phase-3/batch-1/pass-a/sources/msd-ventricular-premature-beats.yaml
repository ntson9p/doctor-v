notes_vi: "Lượt A mở trang (rà soát toàn bộ và cập nhật 9/2024; tác giả L. Brent Mitchell, người duyệt Jonathan G. Howlett). Ngoại tâm thu thất rất hay gặp ở cả người khỏe và người bệnh tim (không nêu số). Tăng lên khi lo âu, căng thẳng, uống rượu, cà phê, dùng thuốc cường giao cảm, thiếu oxy, rối loạn điện giải; tăng khi gắng sức có thể gợi ý thiếu máu cơ tim; có thể là biểu hiện của bệnh tim cấu trúc. Có thể không có triệu chứng hoặc gây hồi hộp; người bệnh thấy như hẫng một nhịp vì không cảm nhận được nhịp sớm, chỉ cảm nhận nhịp xoang tiếp theo. Nhịp đôi (cứ một nhịp thường một nhịp sớm) có thể gây triệu chứng huyết động nhẹ. Không có bệnh tim cấu trúc: tiên lượng lành tính, thường chỉ cần trấn an, không cần điều trị ngoài tránh yếu tố khởi phát rõ; chỉ điều trị khi triệu chứng gây khó chịu. Có bệnh tim cấu trúc: ngoại tâm thu thất dày (trên 10 nhịp mỗi phút) liên quan tăng tử vong. Trang không nêu mạch hụt hay sóng a đại bác."
