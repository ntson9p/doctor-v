notes_vi: "Rà soát lần cuối 06/8/2026. Thường do nhiễm vi rút như cảm lạnh, cúm. Triệu chứng: chóng mặt, quay cuồng, đứng không vững, buồn nôn hoặc nôn; nghe kém, ù tai chỉ có ở viêm mê nhĩ, không có ở viêm dây thần kinh tiền đình. Thường đỡ sau vài ngày; thăng bằng hồi phục trong 2–6 tuần, có khi lâu hơn. Tự chăm sóc: nằm yên trong phòng tối khi chóng mặt nhiều, uống từng ngụm nước nếu nôn, tránh ồn và ánh sáng mạnh, tập đi lại sớm có người hỗ trợ, không lái xe, không uống rượu khi còn chóng mặt. Khám bác sĩ (không khẩn) nếu sau vài ngày không đỡ hoặc nặng lên; khám khẩn hoặc gọi 111 nếu đột ngột nghe kém một tai."
