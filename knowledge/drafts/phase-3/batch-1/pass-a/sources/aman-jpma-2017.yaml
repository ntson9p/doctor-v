notes_vi: "107 trẻ trên 5 tuổi (trung vị 10 tuổi, 5–18 tuổi) hồi hộp từng cơn, khám tim cơ bản bình thường, ở một bệnh viện nhi tuyến cuối (Lahore, Pakistan), đeo Holter 48 giờ. Holter có bất thường ở 37%; hay gặp nhất là ngoại tâm thu thất dày (11,2%) và ngoại tâm thu nhĩ (8,4%). Triệu chứng kèm theo: ngất hoặc tiền ngất 32,7%, đau ngực 20,5%, khó thở 19,6%, tái da 10,3%; bất thường trên Holter hay gặp hơn khi có khó thở và tái da lúc hồi hộp."
