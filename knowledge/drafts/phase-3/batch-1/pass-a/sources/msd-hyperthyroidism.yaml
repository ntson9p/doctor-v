notes_vi: "Lượt A mở trang (rà soát toàn bộ 1/2026). Cường giáp gặp ở khoảng 1% dân số Mỹ, hay gặp hơn ở nữ 20–50 tuổi; tuổi cao, hút thuốc là yếu tố nguy cơ. Nguyên nhân hay gặp nhất là bệnh Graves (Basedow), sau đó là bướu giáp đa nhân, nhân độc, viêm tuyến giáp. Triệu chứng: bồn chồn, hồi hộp, tăng hoạt động, ra nhiều mồ hôi, sợ nóng, mất ngủ, run; mệt, yếu, ăn nhiều mà sụt cân, đi ngoài nhiều lần (đôi khi tiêu chảy), kinh ít. Dấu hiệu: da ấm ẩm, tim nhanh, rung nhĩ; bướu giáp có thể có. Người cao tuổi, nhất là bướu đa nhân độc, có thể biểu hiện lặng lẽ, giống trầm cảm hoặc sa sút trí tuệ, thường không lồi mắt, không run; hay gặp rung nhĩ, ngất, thay đổi ý thức, suy tim, yếu. Cơn bão giáp: sốt, yếu nhiều, kích động, lú lẫn, buồn nôn, nôn, tiêu chảy, vàng da nhẹ, tim nhanh, trụy tim mạch."
