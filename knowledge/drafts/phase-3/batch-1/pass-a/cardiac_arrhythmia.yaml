id: cardiac_arrhythmia
names:
  vi: "Rối loạn nhịp tim"
  vi_common: ["Loạn nhịp tim", "Tim đập loạn nhịp", "Rung nhĩ", "Nhịp tim chậm"]
  en: "Cardiac arrhythmia (tachyarrhythmia or bradyarrhythmia)"
codes:
  icd10: "I49.9"
  icd10_verified: true
  mondo: "MONDO:0007263"
summary_vi:
  - "Tim đập quá nhanh, quá chậm hoặc không đều do rối loạn hệ thống điện của tim."
  - "Có thể gây hồi hộp, choáng váng, khó thở hoặc ngất; người cao tuổi hay bị rung nhĩ hoặc nhịp chậm."
  - "Cần làm điện tim, tốt nhất ngay lúc đang có triệu chứng, để biết đúng loại rối loạn nhịp."
urgency: 3
cant_miss: false
specialties: [cardiology]
priors:
  - complaint: palpitations
    default: P1
    by_age: { child_5_12: P2, teen_13_17: P2 }
    evidence:
      tier: B
      basis: numeric
      sources: [weber-amjmed-1996, raviele-europace-2011, summerton-fampract-2001, esc-svt-2019]
      locator: "Weber và Kapoor: tóm tắt; EHRA 2011: mục nguyên nhân hồi hộp; Summerton: tóm tắt; ESC 2019 mục 6"
      reported: "Rối loạn nhịp 41% người hồi hộp ở trung tâm y khoa đại học (rung, cuồng nhĩ 16%, nhịp nhanh trên thất 10%, nhịp nhanh thất 2%, phần còn lại chủ yếu ngoại tâm thu); ở chăm sóc ban đầu, dưới một nửa người hồi hộp có rối loạn nhịp."
      population: "Người lớn hồi hộp ở bệnh viện đại học (Mỹ) và ở phòng khám đa khoa (Anh)"
      note: "Bệnh gộp mọi rối loạn nhịp, kể cả ngoại tâm thu, nhịp nhanh trên thất, rung nhĩ, nhịp chậm (theo docs/phase-3/scope.md). Ước từ 20% trở lên ở người lớn (P1). Trẻ em, thiếu niên hồi hộp phần lớn do nhịp nhanh xoang, lo âu; nhịp nhanh trên thất là rối loạn nhịp hay gặp nhất ở lứa tuổi này, ước 5–20% (P2). Chưa có số liệu Việt Nam."
  - complaint: syncope
    default: P3
    by_age: { child_5_12: P4, teen_13_17: P4, adult_45_64: P2, elder_65_74: P2, elder_75p: P2 }
    evidence:
      tier: B
      basis: numeric
      sources: [soteriades-nejm-2002, berecki-plosone-2013, esc-syncope-2018-practical, alboni-jacc-2001]
      locator: "Soteriades: tóm tắt; Berecki bảng 1 và 2; ESC 2018 Practical Instructions: mục dịch tễ"
      reported: "Ngất do tim 9,5% ở cộng đồng (Framingham); 5–21% ở cấp cứu và phòng khám chuyên khoa (4 bộ dữ liệu của Berecki); 23% ở đơn vị ngất (Alboni). Trong số người ngất do tim, 77% từ 60 tuổi và chỉ 1% dưới 40 tuổi."
      note: "ESC 2018: ngất do tim là nguyên nhân hay gặp thứ hai, hay gặp hơn ở người cao tuổi, rất hiếm ở trẻ em, thiếu niên, người trẻ. Rối loạn nhịp là phần lớn của ngất do tim (phần còn lại là bệnh tim cấu trúc như hẹp van động mạch chủ, chưa có trong cơ sở tri thức). Ước: từ 45 tuổi 5–20% (P2); 18–44 tuổi 1–5% (P3); dưới 18 tuổi dưới 1% (P4). Ở cộng đồng tỷ lệ thấp hơn ở bệnh viện; chưa có số liệu Việt Nam."
  - complaint: dizziness
    default: P3
    by_age: { child_5_12: P4, teen_13_17: P4, elder_65_74: P2, elder_75p: P2 }
    evidence:
      tier: B
      basis: judgment
      sources: [bosner-bmcfampract-2018, maarsingh-annfammed-2010]
      locator: "Bösner bảng 3 và 4; Maarsingh: kết quả"
      reported: "Nguyên nhân tim mạch 3,8–56,8% người chóng mặt ở chăm sóc ban đầu; 57% ở người 65–95 tuổi chóng mặt kéo dài."
      note: "Nhóm tim mạch gồm hạ huyết áp tư thế, rối loạn nhịp, suy tim, bệnh mạch não; hai tổng quan không tách riêng rối loạn nhịp. Ước 5–20% ở người từ 65 tuổi (P2), 1–5% ở người lớn trẻ hơn (P3), dưới 1% ở trẻ em và thiếu niên (P4). Ước lượng."
findings:
  - finding: palpitation_rhythm
    dist: { fast_regular: 0.30, irregular: 0.35, skipped_beats: 0.30, forceful: 0.05 }
    evidence:
      tier: B
      basis: verbal
      sources: [raviele-europace-2011, weber-amjmed-1996]
      locator: "EHRA 2011 bảng 2; Weber và Kapoor theo EHRA"
      note: "Tính trong số người đã hồi hộp. EHRA: kiểu ngoại tâm thu là hẫng một nhịp; kiểu nhịp nhanh có thể đều (nhịp nhanh trên thất) hoặc không đều (rung nhĩ); kiểu đập mạnh với tần số bình thường không phải do rối loạn nhịp. Weber: rung, cuồng nhĩ 16%, nhịp nhanh trên thất 10% người hồi hộp. Bệnh gồm cả ngoại tâm thu nên 'hẫng nhịp' giữ bằng nền. Tỷ lệ là ước lượng."
  - finding: palpitation_abrupt_onset
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [raviele-europace-2011, esc-svt-2019]
      locator: "EHRA 2011 bảng 2; ESC 2019 mục 7"
      note: "Tính trong số người đã hồi hộp. EHRA: hồi hộp kiểu nhịp nhanh và kiểu ngoại tâm thu bắt đầu, kết thúc đột ngột; kiểu lo âu bắt đầu và dừng từ từ. ESC 2019: khởi phát đột ngột gợi ý nhịp nhanh vòng vào lại. Rung nhĩ dai dẳng và nhịp chậm không thành cơn rõ, nên chọn frequent cho cả nhóm."
  - finding: pulse_measured
    dist: { lt_40: 0.032, n40_100: 0.168, n100_150: 0.128, gt_150: 0.072, not_measured: 0.6 }
    evidence:
      tier: B
      basis: judgment
      sources: [esc-svt-2019, esc-syncope-2018]
      note: "Mạch đo lúc có triệu chứng. Nhịp nhanh trên thất thường trên 150 lần/phút; rung nhĩ thường 100–150; nhịp chậm do blốc nhĩ thất, suy nút xoang có thể dưới 40; ngoại tâm thu (khoảng 1/3 số rối loạn nhịp gây hồi hộp theo Weber) thường cho mạch bình thường. ESC 2018 bảng 5 nêu nhịp chậm xoang 40–50 lần/phút không giải thích được là dấu hiệu gợi ý ngất do tim. Phân bố là ước lượng. Lựa chọn 'Chưa đo' là trung tính nên để 0,6 như nền; bốn mức đo được đã nhân 0,4 (người bảo trì, 25/10/2026)."
  - finding: syncope_trigger
    dist: { standing_heat: 0.08, emotion_pain: 0.05, standing_up: 0.12, toilet_cough: 0.03, exertion: 0.13, lying: 0.10, no_trigger: 0.49 }
    evidence:
      tier: B
      basis: numeric
      sources: [berecki-plosone-2013, esc-syncope-2018]
      locator: "Berecki bảng 2; ESC 2018 bảng 5"
      reported: "Ngất khi gắng sức 13% và khi nằm 10% ở ngất do tim, so với 2% và 2% ở ngất không do tim."
      note: "Phân bố trong số người đã ngất hoặc suýt ngất. ESC 2018: ngất khi gắng sức hoặc khi nằm gợi ý ngất do tim. Ngất do rối loạn nhịp thường không có yếu tố khởi phát rõ, nên 'không có gì đặc biệt' cao hơn nền. Các lựa chọn khác là ước lượng."
  - finding: syncope_warning
    dist: { prodrome: 0.25, palpitations_first: 0.20, no_warning: 0.55 }
    evidence:
      tier: B
      basis: numeric
      sources: [berecki-plosone-2013, esc-syncope-2018, alboni-jacc-2001]
      locator: "Berecki bảng 2; ESC 2018 bảng 5; Alboni: tóm tắt"
      reported: "Có dấu hiệu báo trước (kéo dài) 39% ở ngất do tim so với 63% ở ngất không do tim; hồi hộp 8% so với 11%."
      note: "Phân bố trong số người đã ngất hoặc suýt ngất. ESC 2018: hồi hộp ngay trước khi ngất gợi ý ngất do tim; Alboni: ở người không có bệnh tim, hồi hộp là dấu hiệu dự báo duy nhất của ngất do tim. Số liệu gộp của Berecki không thấy khác biệt về hồi hộp (phần lớn là nhịp chậm ở người cao tuổi), nên chỉ để 20% (gấp đôi nền); 'ngất đột ngột' 55%."
  - finding: palpitations
    freq: occasional
    freq_by_age: { child_5_12: frequent, teen_13_17: frequent, adult_18_44: frequent }
    evidence:
      tier: B
      basis: numeric
      sources: [berecki-plosone-2013, esc-af-2024, esc-svt-2019]
      locator: "Berecki bảng 2; ESC 2024 mục triệu chứng; ESC 2019 mục 7"
      reported: "Hồi hộp 8% ở ngất do tim (Berecki)."
      note: "Chỉ dùng khi triệu chứng chính là ngất hoặc chóng mặt. Người cao tuổi rối loạn nhịp thường là nhịp chậm hoặc rung nhĩ, và ESC 2024: hồi hộp ít gặp hơn mệt; vì vậy để occasional, để câu trả lời 'không hồi hộp' không làm giảm mạnh khả năng ngất do nhịp chậm. Người dưới 45 tuổi chủ yếu là nhịp nhanh trên thất, biểu hiện chính là hồi hộp (ESC 2019), nên để frequent; mức theo tuổi là ước lượng."
  - finding: dizziness
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [esc-svt-2019, esc-af-2024]
      locator: "ESC 2019 mục 7"
      note: "Chỉ dùng khi triệu chứng chính là ngất hoặc hồi hộp. ESC 2019: choáng váng khi có nhịp nhanh trên thất không hiếm; nhịp chậm và rung nhĩ nhanh cũng hay gây choáng. Tần suất là ước lượng."
  - finding: fainting_or_near_fainting
    freq: frequent
    evidence:
      tier: B
      basis: judgment
      sources: [esc-svt-2019, esc-syncope-2018]
      locator: "ESC 2019 mục 7; ESC 2018 bảng 5"
      note: "Chỉ dùng khi triệu chứng chính là hồi hộp hoặc chóng mặt. ESC 2019: tiền ngất và ngất ít gặp hơn ở nhịp nhanh trên thất, nhưng nhịp chậm nặng và rung nhĩ nhanh ở người cao tuổi hay gây choáng như sắp ngất. Câu hỏi gộp cả suýt ngất nên chọn frequent. Hồi hộp kèm choáng ngất đã được quy tắc rf_palpitations_danger xếp mức 2. Ước lượng."
  - finding: known_heart_disease
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [berecki-plosone-2013, thavendiranathan-jama-2009, alboni-jacc-2001]
      locator: "Berecki bảng 2; Thavendiranathan: tóm tắt; Alboni: tóm tắt"
      reported: "Bệnh tim cấu trúc 87% ở ngất do tim so với 26% ở ngất không do tim (Berecki); tiền sử bệnh tim LR 2,03 cho rối loạn nhịp ở người hồi hộp (Thavendiranathan)."
      note: "Câu hỏi chỉ hỏi bệnh tim người bệnh đã biết, nên thấp hơn tỷ lệ bệnh tim phát hiện khi khám; ngoại tâm thu, nhịp nhanh trên thất thường gặp trên tim bình thường. Với tỷ lệ nền 5%, mức occasional cho tỷ số khả dĩ khoảng 4 khi trả lời 'Có', gần với LR 2,03 (Thavendiranathan) và tỷ số 87%/26% (Berecki); mức frequent sẽ cho tỷ số khoảng 10, quá mạnh. Ước lượng."
  - finding: similar_episodes_before
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [berecki-plosone-2013, weber-amjmed-1996]
      locator: "Berecki bảng 2; Weber: tóm tắt"
      reported: "Trên 2 cơn ngất: 30% ở ngất do tim; 75% người hồi hộp bị lại trong năm đầu (Weber)."
      note: "Rối loạn nhịp kịch phát (nhịp nhanh trên thất, rung nhĩ cơn) hay tái diễn; ngất do tim thường chỉ có ít cơn. Chọn frequent, thấp hơn ngất phản xạ."
  - finding: family_sudden_death
    freq: rare
    above_leak_ok: true
    freq_by_age: { child_5_12: occasional, teen_13_17: occasional, adult_18_44: occasional }
    evidence:
      tier: B
      basis: judgment
      sources: [esc-syncope-2018, raviele-europace-2011]
      locator: "ESC 2018 bảng 5; EHRA 2011: gợi ý do rối loạn nhịp"
      note: "ESC 2018 và EHRA: gia đình có người đột tử khi còn trẻ gợi ý ngất, hồi hộp do rối loạn nhịp (bệnh kênh ion, bệnh cơ tim di truyền). Ở người trẻ có rối loạn nhịp, tỷ lệ này cao hơn hẳn nền 2%; ở người cao tuổi chỉ nhỉnh hơn nền (rare, above_leak_ok: trả lời 'Có' làm tăng nhẹ khả năng bệnh). Ước lượng, chưa có số liệu."
  - finding: breathless_on_exertion
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [esc-af-2024, esc-svt-2019]
      note: "Rung nhĩ, nhịp chậm làm giảm sức gắng sức; ESC 2024: khoảng 90% người rung nhĩ có triệu chứng, hay gặp là triệu chứng không đặc hiệu như mệt; ESC 2019: khó thở gặp khi đã có bệnh cơ tim do nhịp nhanh. Ước lượng."
  - finding: panic_fear
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [esc-svt-2019, thavendiranathan-jama-2009]
      note: "Cơn nhịp nhanh có thể gây sợ hãi; ESC 2019: đặc điểm của nhịp nhanh trên thất có thể giống rối loạn hoảng sợ. Thavendiranathan: tiền sử rối loạn hoảng sợ làm giảm khả năng rối loạn nhịp (LR 0,26). Để occasional, thấp hơn nhiều so với cơn hoảng sợ, để câu trả lời 'Có' nghiêng về hoảng sợ nhưng không loại trừ rối loạn nhịp. Ước lượng."
  - finding: perioral_tingling
    freq: rare
    evidence:
      tier: B
      basis: verbal
      sources: [raviele-europace-2011]
      locator: "Bảng 2"
      note: "EHRA: tê bì tay, mặt, nghẹn cổ, thở dài đi kèm hồi hộp kiểu lo âu, không phải kiểu rối loạn nhịp. Mức rare thấp hơn tỷ lệ nền 5%."
  - finding: vertigo_spinning
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [bosner-bmcfampract-2018]
      note: "Tính trong số người đã chóng mặt. Chóng mặt do nhịp tim là choáng, tối sầm mắt hơn là cảm giác quay; Bösner: ở người chóng mặt kiểu quay, nguyên nhân tim mạch hầu như không có. Mức occasional thấp hơn tỷ lệ nền 30%."
  - finding: dizziness_positional
    freq: rare
    evidence:
      tier: B
      basis: judgment
      sources: [bosner-bmcfampract-2018]
      note: "Tính trong số người đã chóng mặt. Chóng mặt khi trở mình, nằm xuống, ngửa cổ là kiểu của bệnh tiền đình ngoại biên, không phải của rối loạn nhịp. Mức rare thấp hơn tỷ lệ nền 10%. Ước lượng."
  - finding: dizziness_pattern
    dist: { brief_episodes: 0.35, long_episodes: 0.40, continuous: 0.10, chronic: 0.15 }
    evidence:
      tier: B
      basis: judgment
      sources: [esc-svt-2019, raviele-europace-2011]
      note: "Phân bố trong số người đã chóng mặt. Ngoại tâm thu, nhịp chậm thoáng qua gây choáng vài giây; cơn nhịp nhanh trên thất, rung nhĩ cơn kéo dài vài phút đến vài giờ; nhịp chậm dai dẳng hoặc rung nhĩ kéo dài có thể gây choáng liên tục. Ước lượng."
  - finding: neck_pounding
    freq: occasional
    evidence:
      tier: A
      basis: numeric
      sources: [thavendiranathan-jama-2009, esc-svt-2019]
      locator: "Thavendiranathan: tóm tắt; ESC 2019 mục 7 ('dấu hiệu con ếch')"
      reported: "Cảm giác đập nhanh, đều, mạnh ở cổ: LR 177 cho nhịp nhanh vòng vào lại nút nhĩ thất; không có cảm giác này: LR 0,07."
      note: "Dấu hiệu đề xuất (proposed_findings), tính trong số người đã hồi hộp. Gặp ở phần lớn người nhịp nhanh vòng vào lại nút nhĩ thất, nhưng thể này chỉ là một phần nhỏ của nhóm rối loạn nhịp (nhịp nhanh trên thất khoảng 1/4 số rối loạn nhịp gây hồi hộp theo Weber), nên tần suất cho cả nhóm là occasional."
warning_signs: [chest_pain_pressure, breathing_difficulty, fainting_or_near_fainting, confusion]
self_care_vi:
  - "Ngồi hoặc nằm nghỉ khi tim đập nhanh; không lái xe, không làm việc trên cao."
  - "Nếu có máy đo huyết áp hoặc đồng hồ thông minh, ghi lại nhịp tim lúc có triệu chứng."
  - "Hạn chế cà phê, rượu bia, thuốc lá; ngủ đủ giấc."
see_doctor_vi:
  - "Đi khám trong 24 giờ để được làm điện tim."
  - "Nếu cơn hay tái lại, có thể cần đeo máy ghi điện tim nhiều ngày (Holter)."
  - "Gọi 115 nếu tim đập nhanh không dứt, hoặc kèm đau ngực, khó thở, choáng ngất."
review:
  status: draft
  authors: ["agent:pass-a"]
  updated: "2026-10-25"
  notes_vi: "Giữ mức xử trí 3, không thuộc nhóm không được bỏ sót, như gợi ý: ca điển hình chưa biến chứng (rung nhĩ cơn, nhịp nhanh trên thất đã hết, ngoại tâm thu) cần làm điện tim sớm nhưng không cần cấp cứu (ESC 2019: nguy hiểm trực tiếp của nhịp nhanh trên thất hiếm; NHS: khám bác sĩ khi hồi hộp tái lại, kéo dài, có bệnh tim). Các tình huống nguy hiểm (ngất khi gắng sức, khi nằm, hồi hộp ngay trước khi ngất, mạch dưới 40 hoặc trên 150, hồi hộp kèm đau ngực, khó thở, choáng ngất, ngất ở người có bệnh tim) đã có quy tắc mức 1–2. Bệnh gộp nhịp nhanh, nhịp chậm và ngoại tâm thu theo docs/phase-3/scope.md; mã I49.9 ('Rối loạn nhịp tim, không xác định', bộ mã Thông tư 06/2026/TT-BYT) dùng cho cả nhóm, các thể riêng là I44–I49 (rung nhĩ I48, nhịp nhanh trên thất I47.1). Điểm chưa chắc: (1) ngoại tâm thu lành tính chỉ cần khám trong vài ngày; nếu muốn mức xử trí chính xác hơn, nên tách ngoại tâm thu thành bệnh riêng mức 4; (2) prior lấy từ bệnh viện Mỹ (Weber) và số liệu ngất ở châu Âu, Mỹ, chưa có số liệu Việt Nam; (3) một tần suất cho mọi triệu chứng chính: hồi hộp ít gặp ở ngất do nhịp chậm nhưng là triệu chứng chính của nhịp nhanh trên thất, nên dùng tần suất theo tuổi (ước lượng); (4) bệnh tim cấu trúc gây ngất (hẹp van động mạch chủ, bệnh cơ tim phì đại) chưa có trong cơ sở tri thức; (5) đề xuất dấu hiệu mới neck_pounding (cổ đập nhanh, mạnh khi hồi hộp; LR 177 cho nhịp nhanh vòng vào lại nút nhĩ thất)."
