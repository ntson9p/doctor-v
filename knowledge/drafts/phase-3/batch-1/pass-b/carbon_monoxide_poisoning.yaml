id: carbon_monoxide_poisoning
names:
  vi: "Ngộ độc khí carbon monoxide (CO)"
  vi_common: ["Ngộ độc khí CO", "Ngộ độc khí than"]
  en: "Carbon monoxide poisoning"
codes:
  icd10: "T58"
  icd10_verified: false
  mondo: "MONDO:0800373"
summary_vi:
  - "Khí CO không màu, không mùi, sinh ra khi đốt than, củi, gas hoặc chạy máy nổ trong chỗ kín."
  - "Thường gây đau đầu, chóng mặt, buồn nôn, mệt; nặng có thể ngất, co giật, hôn mê."
  - "Hay nhiều người cùng nhà bị một lúc; cần ra chỗ thoáng ngay và đến bệnh viện để thở oxy."
urgency: 2
cant_miss: true
specialties: [emergency]
priors:
  - complaint: dizziness
    default: P5
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-3610-2015, nhs-carbon-monoxide-poisoning, cdc-co-basics, pepe-sjtrem-2011]
      locator: "3610/QĐ-BYT bài 33 mục 2.2, 3.1; Pepe 2011 bảng 2"
      reported: "Chóng mặt ở 20,1% người ngộ độc khí CO đến cấp cứu (Ý); Mỹ: hơn 100.000 lượt cấp cứu mỗi năm"
      note: "Chưa có số liệu Việt Nam. 3610/QĐ-BYT: hay gặp khi đốt than (nhất là bếp than tổ ong), củi, gas trong phòng kín để nấu ăn, sưởi ấm, đun nước, hoặc chạy máy phát điện, động cơ trong phòng kín. Ít gặp so với các nguyên nhân chóng mặt khác nhưng nguy hiểm, nên P5 (0,02–0,2%); câu hỏi phơi nhiễm (co_exposure, tỷ lệ nền 2%) mang phần lớn thông tin. Mùa đông tăng (hệ số tháng)."
  - complaint: syncope
    default: P5
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-3610-2015, pepe-sjtrem-2011, nhs-carbon-monoxide-poisoning]
      locator: "Pepe 2011 bảng 2; 3610/QĐ-BYT bài 33 mục 3.1"
      reported: "Mất ý thức thoáng qua ở 40,9% người ngộ độc khí CO đến cấp cứu (Ý)"
      note: "Ngất, mất ý thức là biểu hiện hay gặp của ngộ độc vừa và nặng, nhưng ngộ độc khí CO vẫn hiếm so với ngất phản xạ. Ước P5 như Chóng mặt."
prior_modifiers:
  - when: { months: [12, 1, 2] }
    factor: 2
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-3610-2015]
      locator: "Bài 33 mục 2.2 (sưởi ấm bằng than, củi), mục 3.4 (ngộ độc nhẹ dễ lầm với cảm cúm, nhất là về mùa đông)"
      note: "3610/QĐ-BYT nêu sưởi ấm bằng than, củi trong phòng kín và ngộ độc nhẹ hay bị nhầm với cảm cúm vào mùa đông. Chưa có số liệu theo tháng ở Việt Nam; hệ số 2 là ước lượng, áp dụng cả nước. Phơi nhiễm vẫn được hỏi riêng (co_exposure), không tính vào hệ số."
findings:
  - finding: co_exposure
    freq: very_frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-3610-2015, nhs-carbon-monoxide-poisoning]
      locator: "3610/QĐ-BYT bài 33 mục 2.2, 3.3"
      note: "Chẩn đoán dựa vào tiền sử tiếp xúc với nguồn khí CO (3610/QĐ-BYT). Không chọn almost_always vì nguồn khí có thể không được nhận ra (bình nóng lạnh chạy gas, thiết bị hỏng ở phòng khác) hoặc phơi nhiễm đã quá 24 giờ."
  - finding: others_same_symptoms
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-3610-2015]
      locator: "Bài 33 mục 3.1"
      note: "3610/QĐ-BYT: ngộ độc thường xảy ra với nhiều người sống trong nhà, cả vật nuôi. Không có tỷ lệ; ước khoảng một nửa (người ở một mình thì không có). Cùng cụm co_source với câu phơi nhiễm."
  - finding: headache
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [pepe-sjtrem-2011, byt-qd-3610-2015, nhs-carbon-monoxide-poisoning, cdc-co-basics]
      locator: "Pepe 2011 bảng 2"
      reported: "Đau đầu 58,5% (347 người đến cấp cứu)"
      population: "Khoa cấp cứu ở Ý"
      note: "Triệu chứng khởi đầu hay gặp nhất (3610/QĐ-BYT, NHS, CDC). Đau đầu là triệu chứng của ca nhẹ nên không hạ mức."
  - finding: vomiting
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [pepe-sjtrem-2011, byt-qd-3610-2015]
      reported: "Buồn nôn hoặc nôn 25,0%"
      note: "Riêng nôn ước 10–25%; tỷ lệ nền 5%."
  - finding: palpitations
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [pepe-sjtrem-2011]
      reported: "Hồi hộp 18,4%; nhịp nhanh xoang 25,9%"
      note: "Có tác dụng khi triệu chứng chính là Chóng mặt hoặc Ngất."
  - finding: fainting_or_near_fainting
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [pepe-sjtrem-2011, nhs-carbon-monoxide-poisoning]
      reported: "Mất ý thức thoáng qua 40,9% ở khoa cấp cứu"
      note: "Có tác dụng khi triệu chứng chính là Chóng mặt. Ở người dùng app thấp hơn người đến cấp cứu, nhưng câu hỏi gồm cả choáng như sắp ngất; giữ frequent."
  - finding: confusion
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [pepe-sjtrem-2011, byt-qd-3610-2015]
      reported: "Glasgow 9–14 điểm ở 15,2% người đến cấp cứu"
      note: "3610/QĐ-BYT: người già có thể khởi đầu bằng lẫn lộn. Lú lẫn đã có quy tắc mức 1."
  - finding: drowsy_hard_to_wake
    freq: rare
    above_leak_ok: true
    evidence:
      tier: B
      basis: numeric
      sources: [pepe-sjtrem-2011]
      reported: "Glasgow dưới 9 điểm ở 8,3% người đến cấp cứu"
      note: "Người còn dùng được app (hoặc người thân dùng hộ) hiếm khi li bì; hạ một mức so với cấp cứu. Mức rare cao hơn tỷ lệ nền 1% là có chủ ý: li bì ở người chóng mặt, ngất làm tăng khả năng ngộ độc khí CO; quy tắc mức 1 vẫn quyết định mức xử trí."
  - finding: seizure_recent
    freq: rare
    above_leak_ok: true
    evidence:
      tier: B
      basis: numeric
      sources: [pepe-sjtrem-2011, byt-qd-3610-2015]
      reported: "Co giật 6,9% ở cấp cứu"
      note: "3610/QĐ-BYT: trẻ em, đôi khi cả người lớn, có thể khởi đầu bằng co giật. Hạ một mức cho cộng đồng; cao hơn tỷ lệ nền 1% là có chủ ý."
  - finding: cannot_walk_unaided
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [pepe-sjtrem-2011, byt-qd-3610-2015]
      reported: "Mất vững tư thế 10,6%"
      note: "3610/QĐ-BYT: dạng thần kinh – tâm thần khởi đầu bằng đi loạng choạng."
  - finding: blurred_vision
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-3610-2015, nhs-carbon-monoxide-poisoning]
      note: "Nhìn mờ là một triệu chứng khởi đầu (3610/QĐ-BYT); NHS: mất thị lực. Không có tỷ lệ, ước 20%."
  - finding: chest_pain_pressure
    freq: rare
    evidence:
      tier: B
      basis: numeric
      sources: [pepe-sjtrem-2011]
      reported: "Đau ngực kiểu tim 1,7%"
      note: "Thấp hơn tỷ lệ nền 5%: đau ngực nghiêng về hội chứng vành cấp, dù ngộ độc vừa có thể gây thiếu máu cơ tim (3610/QĐ-BYT). Đau ngực đã có quy tắc mức 1–2."
  - finding: fever
    freq: rare
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-3610-2015]
      locator: "Bài 33 mục 3.4"
      note: "Ngộ độc nhẹ dễ lầm với cảm cúm nhất là mùa đông, nhưng không gây sốt. Thấp hơn tỷ lệ nền 5%."
  - finding: dizziness_pattern
    dist: { brief_episodes: 0.05, long_episodes: 0.35, continuous: 0.5, chronic: 0.1 }
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-carbon-monoxide-poisoning, byt-qd-3610-2015]
      note: "NHS: triệu chứng có thể lúc có lúc không, nặng hơn khi ở trong phòng nhiễm khí và đỡ khi ra ngoài; sưởi than nhiều đêm có thể gây triệu chứng kéo dài. Phân bố là ước lượng."
  - finding: syncope_trigger
    dist: { standing_heat: 0.12, emotion_pain: 0.02, standing_up: 0.12, toilet_cough: 0.04, exertion: 0.05, lying: 0.15, no_trigger: 0.5 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-3610-2015]
      locator: "Bài 33 mục 2.2"
      note: "Ngất do thiếu oxy, không theo hoàn cảnh của ngất phản xạ; có thể xảy ra khi đang nằm ngủ trong phòng đốt than, hoặc khi tắm với bình nóng lạnh chạy gas (nơi nóng). Phân bố là ước lượng."
  - finding: syncope_warning
    dist: { prodrome: 0.5, palpitations_first: 0.1, no_warning: 0.4 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-3610-2015, cdc-co-basics]
      note: "Trước đó thường có đau đầu, chóng mặt, buồn nôn, nhìn mờ; người đang ngủ hoặc ngộ độc nặng có thể mất ý thức không báo trước (CDC). Phân bố là ước lượng."
  - finding: not_recovered_after_faint
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-3610-2015, nhs-carbon-monoxide-poisoning]
      locator: "3610/QĐ-BYT bài 33 mục 3.1"
      note: "Sau mất ý thức do khí CO, lẫn lộn, mệt, đau đầu có thể còn kéo dài (3610/QĐ-BYT: thời gian và mức độ hôn mê rất thay đổi). Ước 20%, cao hơn tỷ lệ nền 5%; đã có quy tắc mức 2."
  - finding: better_away_from_room
    freq: frequent
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-carbon-monoxide-poisoning]
      note: "Dấu hiệu đề xuất (xem proposed_findings). NHS: triệu chứng nặng hơn khi ở trong phòng nhiễm khí, đỡ khi ra ngoài. Tần suất trong số người đã có phơi nhiễm; ước khoảng một nửa."
warning_signs: [breathing_difficulty, confusion, drowsy_hard_to_wake, chest_pain_pressure, severe_weakness, seizure_recent, not_recovered_after_faint]
self_care_vi:
  - "Đưa mọi người ra chỗ thoáng khí ngay; mở cửa, tắt bếp hoặc máy nổ nếu làm được an toàn."
  - "Không quay lại phòng đó cho đến khi đã được thông khí và kiểm tra."
  - "Không đốt than, củi, chạy máy phát điện hoặc nổ máy xe trong phòng kín."
  - "Không tự lái xe đến viện."
see_doctor_vi:
  - "Đến cơ sở cấp cứu ngay để được đo khí CO trong máu và thở oxy, kể cả khi đã đỡ."
  - "Gọi 115 nếu người bệnh khó thở, lú lẫn, li bì, ngất, co giật hoặc đau ngực."
  - "Người đang có thai bị ngộ độc cần được đưa đến bệnh viện ngay, kể cả khi triệu chứng nhẹ."
  - "Đi khám lại nếu vài ngày đến vài tuần sau có giảm trí nhớ, thay đổi tính cách hoặc cử động bất thường."
proposed_findings:
  - id: better_away_from_room
    kind: history
    type: binary
    label_vi: "Đỡ hẳn khi ra khỏi phòng đó"
    question_vi: "Khi ra khỏi phòng đó hoặc ra chỗ thoáng, có thấy đỡ hẳn không?"
    requires:
      - { finding: co_exposure, is: present }
    cluster: co_source
    leak: 0.15
    leak_note: "Tính trong số người đã ở phòng kín có đốt than, củi hoặc chạy máy nổ. Người đau đầu, chóng mặt vì nguyên nhân khác đôi khi cũng thấy đỡ khi ra chỗ thoáng; lượt B ước lượng."
    notes_vi: "NHS Carbon monoxide poisoning: triệu chứng nặng hơn khi ở trong phòng nhiễm khí và đỡ khi ra ngoài. Giúp phân biệt ngộ độc khí CO với người tình cờ có phơi nhiễm nhưng chóng mặt vì nguyên nhân khác. Lượt B lô 1 phần a đề xuất."
review:
  status: draft
  authors: ["agent:pass-b"]
  updated: "2026-10-25"
  notes_vi: "Đổi mức xử trí gợi ý 1 thành 2 (vẫn 'không được bỏ sót'): NHS khuyên gọi 111 khi có triệu chứng, gọi 999 hoặc đến cấp cứu khi khó thở, lú lẫn, mất ý thức, đau ngực; người ngộ độc cần được kiểm tra ở bệnh viện. 3610/QĐ-BYT: đưa khỏi nguồn độc, thở oxy càng sớm càng tốt, oxy cao áp khi mất ý thức hoặc có thai. Ca điển hình (đau đầu, chóng mặt, còn tỉnh) cần đến cấp cứu ngay (mức 2), khớp quy tắc rf_co_exposure; lú lẫn, li bì, ngất kèm khó thở đã có quy tắc mức 1. Với mức 1 và ngưỡng 1%, mọi người chóng mặt có phơi nhiễm sẽ bị khuyên gọi 115. Điểm cần bác sĩ xem: (1) prior P5 và hệ số mùa đông 2 là ước lượng, chưa có số liệu Việt Nam (3610 chỉ mô tả); có thể cần hệ số riêng cho miền Bắc; (2) tần suất triệu chứng lấy từ một nghiên cứu cấp cứu ở Ý, nên các dấu hiệu nặng đã hạ mức; (3) đề xuất dấu hiệu mới 'đỡ hẳn khi ra khỏi phòng đó'; (4) mã T58 chưa đối chiếu với ICD-10 của Bộ Y tế; (5) URL của 3610/QĐ-BYT là bản đăng lại trên vnras.com."
