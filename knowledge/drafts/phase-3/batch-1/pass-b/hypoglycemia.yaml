id: hypoglycemia
names:
  vi: "Hạ glucose máu (hạ đường huyết)"
  vi_common: ["Hạ đường huyết", "Tụt đường huyết"]
  en: "Hypoglycaemia"
codes:
  icd10: "E16.2"
  icd10_verified: false
  mondo: "MONDO:0004946"
summary_vi:
  - "Đường trong máu xuống quá thấp, thường dưới 4 mmol/L, hay gặp ở người đang dùng thuốc tiểu đường."
  - "Thường gây đói, vã mồ hôi, run tay, hồi hộp, chóng mặt; nặng có thể lú lẫn, co giật, bất tỉnh."
  - "Nếu còn tỉnh và nuốt được, ăn hoặc uống ngay đồ ngọt thường đỡ nhanh."
urgency: 3
cant_miss: false
specialties: [endocrinology, general_medicine, emergency]
priors:
  - complaint: dizziness
    default: P3
    by_age: { child_5_12: P5, teen_13_17: P4 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-5481-2020, nhs-hypoglycaemia, vo-jpma-2019]
      locator: "5481/QĐ-BYT phần 6; NHS Low blood sugar mục Causes"
      reported: "Khoảng một nửa số ca hạ đường huyết nằm viện ở Lâm Đồng có chóng mặt (Vo 2019)"
      note: "Chưa có số liệu về tỷ lệ hạ đường huyết ở người đi khám vì chóng mặt. 5481/QĐ-BYT: biến chứng cấp tính thường gặp ở người đái tháo đường, nhất là người dùng insulin, sulfonylurea; NHS: hiếm ở người không bị đái tháo đường. Tỷ lệ nền của câu hỏi đái tháo đường là 7% (STEPS 2021). Ước P3 (1–5%) cho người lớn; câu hỏi đái tháo đường và thuốc hạ đường huyết mang phần lớn thông tin. Trẻ 5–12 tuổi P5, thiếu niên P4 (đái tháo đường típ 1 ít gặp; trẻ dưới 13 tuổi không được hỏi đái tháo đường). Cần bác sĩ duyệt."
  - complaint: syncope
    default: P3
    by_age: { child_5_12: P5, teen_13_17: P4 }
    evidence:
      tier: B
      basis: judgment
      sources: [nhs-hypoglycaemia, byt-qd-5481-2020, vo-jpma-2019]
      reported: "Mất ý thức ở 13% ca hạ đường huyết nằm viện (Vo 2019)"
      note: "Mất ý thức do hạ đường huyết không phải ngất thật (không tự hồi phục nhanh), nhưng người bệnh và người nhà vẫn chọn 'Ngất, suýt ngất', nhất là khi choáng, vã mồ hôi như sắp ngất. Ước như Chóng mặt."
  - complaint: palpitations
    default: P4
    by_age: { child_5_12: P5 }
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-hypoglycaemia, nhs-heart-palpitations]
      note: "NHS: hồi hộp là triệu chứng thường gặp của hạ đường huyết, nhưng trang NHS về hồi hộp không nêu hạ đường huyết trong các nguyên nhân; hiếm khi là lý do chính để đi khám. Ước P4."
findings:
  - finding: diabetes
    freq: very_frequent
    evidence:
      tier: B
      basis: verbal
      sources: [nhs-hypoglycaemia, byt-qd-5481-2020]
      locator: "NHS Low blood sugar mục Causes"
      note: "NHS: hạ đường huyết hiếm ở người không bị đái tháo đường (suy dinh dưỡng, bệnh Addison, u tụy). Không chọn almost_always vì còn hạ đường huyết do rượu, nhịn đói, bệnh nặng. Câu hỏi chỉ hỏi người từ 13 tuổi."
  - finding: on_glucose_lowering_meds
    freq: almost_always
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-5481-2020, nhs-hypoglycaemia]
      locator: "5481/QĐ-BYT phần 6 mục 1"
      note: "Tần suất trong số người đái tháo đường. 5481/QĐ-BYT: người dùng insulin, sulfonylurea có nguy cơ; NHS: hay gặp ở người dùng insulin hoặc một số thuốc tiểu đường. Câu hỏi gộp cả thuốc ít gây hạ đường huyết (lượt R đề xuất tách insulin, sulfonylurê)."
  - finding: glucose_measured
    dist: { low: 0.37, normal: 0.025, high: 0.005, not_measured: 0.6 }
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-5481-2020, nhs-hypoglycaemia]
      locator: "5481/QĐ-BYT phần 6 mục 2 (phân mức)"
      note: "Định nghĩa: glucose dưới 3,9 mmol/L (5481/QĐ-BYT; NHS: dưới 4 mmol/L). 'Chưa đo' bằng tỷ lệ nền 0,6 (lựa chọn trung tính); phần còn lại gần hết là 'dưới 4'; để một phần nhỏ cho số đo sau khi đã ăn đồ ngọt."
  - finding: cold_sweat
    freq: very_frequent
    evidence:
      tier: C
      basis: numeric
      sources: [vo-jpma-2019, nhs-hypoglycaemia]
      reported: "Vã mồ hôi 83% (483 ca nằm viện)"
      population: "Người đái tháo đường típ 2 nằm viện ở Lâm Đồng"
      note: "Số liệu bệnh viện, nhưng vã mồ hôi là triệu chứng giao cảm có cả ở ca nhẹ (NHS), nên không hạ mức. Cùng cụm adrenergic với run tay."
  - finding: tremor
    freq: frequent
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-hypoglycaemia]
      note: "NHS: run là triệu chứng thường gặp; không có tỷ lệ, ước khoảng một nửa. Cùng cụm adrenergic."
  - finding: missed_meal
    freq: frequent
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-hypoglycaemia]
      locator: "Mục Causes"
      note: "NHS: bỏ bữa, ăn muộn hoặc ăn ít tinh bột làm dễ hạ đường huyết. Ước 50%; tỷ lệ nền 20%."
  - finding: better_after_sugar
    freq: very_frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-5481-2020, nhs-hypoglycaemia]
      locator: "5481/QĐ-BYT phần 6 mục 1c"
      note: "5481/QĐ-BYT và NHS: người tỉnh, uống được thì ăn uống đồ ngọt, thử lại sau 15 phút, nhắc lại nếu còn thấp; phần lớn đỡ sau một đến hai lần. Đa số người chưa thử sẽ trả lời 'Không rõ'."
  - finding: palpitations
    freq: frequent
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-hypoglycaemia]
      note: "NHS: hồi hộp là triệu chứng thường gặp. Có tác dụng khi triệu chứng chính là Chóng mặt hoặc Ngất."
  - finding: dizziness
    freq: frequent
    evidence:
      tier: C
      basis: numeric
      sources: [vo-jpma-2019, nhs-hypoglycaemia]
      reported: "Khoảng một nửa ca nằm viện có chóng mặt"
      note: "Có tác dụng khi triệu chứng chính là Ngất hoặc Hồi hộp."
  - finding: fatigue
    freq: frequent
    evidence:
      tier: C
      basis: numeric
      sources: [vo-jpma-2019, nhs-hypoglycaemia]
      reported: "Mệt yếu 55% ca nằm viện"
  - finding: confusion
    freq: occasional
    evidence:
      tier: C
      basis: numeric
      sources: [vo-jpma-2019, nhs-hypoglycaemia]
      reported: "Lú lẫn ở khoảng một nửa ca nằm viện"
      note: "Hạ hai mức cho người dùng app (ca nhẹ hơn). Lú lẫn đã có quy tắc mức 1."
  - finding: drowsy_hard_to_wake
    freq: occasional
    evidence:
      tier: C
      basis: numeric
      sources: [vo-jpma-2019, byt-qd-5481-2020]
      reported: "Li bì 70% ca nằm viện"
      note: "Hạ hai mức. 5481/QĐ-BYT: mức 3 là hạ đường huyết có rối loạn ý thức, cần cấp cứu. Người thân có thể dùng app cho người đang li bì; cùng cụm với lú lẫn."
  - finding: seizure_recent
    freq: rare
    above_leak_ok: true
    evidence:
      tier: C
      basis: numeric
      sources: [vo-jpma-2019, nhs-hypoglycaemia]
      reported: "Co giật 22% ca nằm viện"
      note: "NHS: co giật là dấu hiệu hạ đường huyết nặng. Hạ hai mức cho cộng đồng; cao hơn tỷ lệ nền 1% là có chủ ý (co giật ở người dùng thuốc tiểu đường làm tăng khả năng hạ đường huyết)."
  - finding: perioral_tingling
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-hypoglycaemia]
      note: "NHS: tê môi. Ước 20%; tỷ lệ nền 5%."
  - finding: blurred_vision
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-hypoglycaemia]
      note: "NHS: nhìn mờ, thay đổi thị lực. Ước 20%."
  - finding: panic_fear
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-hypoglycaemia]
      note: "NHS: lo lắng hoặc cáu gắt; cơn sợ hãi dữ dội đặc trưng cho cơn hoảng sợ hơn. Ước 20%."
  - finding: heavy_alcohol
    freq: occasional
    evidence:
      tier: C
      basis: verbal
      sources: [nhs-hypoglycaemia]
      locator: "Mục Causes"
      note: "NHS: uống nhiều rượu, nhất là khi không ăn, làm dễ hạ đường huyết. Ước 20%, hơi cao hơn tỷ lệ nền 15%."
  - finding: fainting_or_near_fainting
    freq: occasional
    evidence:
      tier: C
      basis: numeric
      sources: [vo-jpma-2019, nhs-hypoglycaemia]
      reported: "Mất ý thức 13% ca nằm viện"
      note: "Có tác dụng khi triệu chứng chính là Chóng mặt hoặc Hồi hộp. Gồm cả choáng như sắp ngất; ước 20%."
  - finding: not_recovered_after_faint
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-5481-2020]
      locator: "Phần 6 mục 3a"
      note: "5481/QĐ-BYT: rối loạn ý thức do thiếu glucose não có thể mất một thời gian mới hồi phục; mất ý thức do hạ đường huyết không tự hết nhanh như ngất. Ước 20%; tỷ lệ nền 5%."
  - finding: similar_episodes_before
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-5481-2020]
      locator: "Phần 6 mục 1a, 1e"
      note: "5481/QĐ-BYT: người có nguy cơ cần được hỏi các cơn trước mỗi lần khám; nhiều người có nhiều cơn. Ước 50%; tỷ lệ nền 20%."
  - finding: dizziness_pattern
    dist: { brief_episodes: 0.08, long_episodes: 0.7, continuous: 0.12, chronic: 0.1 }
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-hypoglycaemia, byt-qd-5481-2020]
      note: "Cơn kéo dài đến khi được ăn uống đồ ngọt, thường vài phút đến vài giờ. Phân bố là ước lượng."
  - finding: syncope_trigger
    dist: { standing_heat: 0.07, emotion_pain: 0.02, standing_up: 0.08, toilet_cough: 0.02, exertion: 0.16, lying: 0.1, no_trigger: 0.55 }
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-hypoglycaemia]
      note: "NHS: vận động nhiều mà không ăn thêm làm dễ hạ đường huyết; có cơn về đêm. Phần lớn không theo hoàn cảnh của ngất phản xạ. Phân bố là ước lượng."
  - finding: syncope_warning
    dist: { prodrome: 0.72, palpitations_first: 0.14, no_warning: 0.14 }
    evidence:
      tier: B
      basis: judgment
      sources: [nhs-hypoglycaemia, byt-qd-5481-2020]
      note: "Thường có vã mồ hôi, run, đói báo trước; người không nhận biết được cơn (5481/QĐ-BYT) có thể không thấy báo trước. Phân bố là ước lượng."
  - finding: pulse_measured
    dist: { lt_40: 0.002, n40_100: 0.25, n100_150: 0.14, gt_150: 0.008, not_measured: 0.6 }
    evidence:
      tier: C
      basis: judgment
      sources: [nhs-hypoglycaemia]
      note: "Hồi hộp, tim nhanh do phản ứng giao cảm (NHS); nhịp trên 150 hiếm. 'Chưa đo' giữ đúng 0,6 (lựa chọn trung tính). Phân bố là ước lượng."
warning_signs: [confusion, drowsy_hard_to_wake, es_unresponsive_or_seizing, seizure_recent, not_recovered_after_faint]
self_care_vi:
  - "Nếu còn tỉnh và nuốt được, ăn hoặc uống ngay đồ ngọt, ví dụ một cốc nhỏ nước hoa quả hoặc nước ngọt có đường."
  - "Sau 10–15 phút chưa đỡ thì ăn, uống đồ ngọt lần nữa; đỡ rồi thì ăn thêm bữa nhẹ."
  - "Nếu lơ mơ hoặc không nuốt được, không cho ăn uống; đặt nằm nghiêng và gọi 115."
  - "Nếu có máy, đo đường huyết và ghi lại kết quả."
  - "Không lái xe trong ít nhất 45 phút sau khi đường huyết trở lại bình thường."
see_doctor_vi:
  - "Đi khám trong 24 giờ để bác sĩ xem lại thuốc và cách ăn uống, vì cơn có thể tái lại."
  - "Người dùng thuốc tiểu đường mà bị cơn nặng cần được theo dõi tại bệnh viện, vì cơn có thể kéo dài."
  - "Gọi 115 nếu lơ mơ, co giật, bất tỉnh hoặc không nuốt được."
  - "Người không bị tiểu đường mà có các cơn như vậy cần đi khám để tìm nguyên nhân."
review:
  status: draft
  authors: ["agent:pass-b"]
  updated: "2026-10-25"
  notes_vi: "Đổi mức xử trí gợi ý 2 ('không được bỏ sót') thành 3 (không thuộc nhóm 'không được bỏ sót'). Lý do: ca điển hình là người còn tỉnh; 5481/QĐ-BYT (phần 6 mục 1c) và NHS đều cho người tỉnh, nuốt được tự ăn uống đồ ngọt rồi thử lại sau 15 phút; chỉ hạ đường huyết mức 3 (rối loạn ý thức) mới cần cấp cứu, và các dấu hiệu này đã có quy tắc mức 1–2 (lú lẫn, li bì, chưa hồi phục sau ngất). Mức 2 kèm ngưỡng 1% sẽ khuyên đi viện ngay mọi người tiểu đường có chóng mặt, làm chậm việc ăn đồ ngọt (lượt R cũng nêu điểm này). Mức 3 khớp quy tắc rf_hypoglycemia_suspected (khám trong 24 giờ để xem lại thuốc). Điểm cần bác sĩ xem: (1) 5481/QĐ-BYT ghi người dùng sulfonylurea hoặc insulin tác dụng chậm cần được theo dõi trong bệnh viện (trong phần xử trí cấp cứu); bác sĩ quyết định có cần mức 2 cho nhóm này không; (2) prior là ước lượng, chưa có số liệu về hạ đường huyết ở người đi khám vì chóng mặt, ngất, hồi hộp; (3) tần suất triệu chứng: số liệu Việt Nam duy nhất là bài hồi cứu chất lượng thấp ở bệnh viện tỉnh (Vo 2019), đã hạ mức cho cộng đồng; run tay, hồi hộp, tê môi theo mô tả của NHS; (4) câu hỏi thuốc hạ đường huyết chưa tách insulin, sulfonylurê với thuốc ít gây hạ đường huyết; (5) mã E16.2 chưa đối chiếu với ICD-10 của Bộ Y tế."
