notes_vi: "Lượt B mở trang (rà soát 12/01/2026). Triệu chứng hay gặp: đau đầu, chóng mặt, mệt yếu, khó chịu dạ dày, nôn, đau ngực, lú lẫn; thường được mô tả 'giống cúm'; người đang ngủ hoặc say có thể tử vong trước khi có triệu chứng. Ai cũng có nguy cơ; trẻ nhỏ, người già, người bệnh tim mạn, thiếu máu hoặc bệnh hô hấp dễ bị nặng hơn. Mỹ: hơn 400 người chết, hơn 100.000 lượt cấp cứu, hơn 14.000 ca nhập viện mỗi năm do ngộ độc khí CO không liên quan cháy. Chỉ dùng máy phát điện ngoài trời, cách xa cửa. Trang không nói về mùa."
