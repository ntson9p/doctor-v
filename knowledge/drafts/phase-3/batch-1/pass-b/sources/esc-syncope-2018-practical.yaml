notes_vi: "Lượt B (Giai đoạn 3, lô 1) mở phần chữ trên OUP; các bảng tỷ lệ nguyên nhân theo bối cảnh và theo tuổi nằm ở dữ liệu bổ sung, không đọc được. Mục 2.2: ngất phản xạ là nguyên nhân hay gặp nhất ở mọi bối cảnh và mọi lứa tuổi; ngất do tim đứng thứ hai; hạ huyết áp thế đứng hiếm trước 40 tuổi, hay gặp ở người rất cao tuổi. Bảng web 2: trong 100 người ngất ở cộng đồng, khoảng 25–50 người đi khám, 10–20 người được chuyển chuyên khoa, 2–10 người đến khoa cấp cứu. Tỷ lệ mắc có hai đỉnh: 10–30 tuổi và trên 65 tuổi; ít gặp quanh 40 tuổi. Tiền triệu có ở hầu hết các cơn ngất phản xạ khi làm nghiệm pháp bàn nghiêng, mất ý thức trung bình khoảng 1 phút sau khi tiền triệu bắt đầu; sau ngất thông thường chỉ ngơ ngác khoảng 5–10 giây. Hạ huyết áp thế đứng ban đầu: triệu chứng trong vài bước sau khi đứng dậy, kéo dài dưới 40 giây. Thuốc hạ huyết áp, chống trầm cảm, an thần kinh có thể gây hạ huyết áp thế đứng."
