notes_vi: "Lượt B đọc tóm tắt qua API Europe PMC. Nghiên cứu tiến cứu đa trung tâm (châu Âu) ở người lớn đến khoa cấp cứu vì ngất, được đánh giá có hệ thống: thuyên tắc phổi lúc vào viện 19/1.397 người (1,4%; khoảng tin cậy 0,87–2,11%); ở nhóm nhập viện (47%) là 2,3%. Kết luận: thuyên tắc phổi là nguyên nhân ngất khá hiếm ở khoa cấp cứu; không cần sàng lọc cho mọi người ngất."
