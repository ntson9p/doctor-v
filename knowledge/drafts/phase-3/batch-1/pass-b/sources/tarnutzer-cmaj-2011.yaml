notes_vi: "Lượt B đọc toàn văn trên PMC (trang cmaj.ca trả lỗi 403). Hội chứng tiền đình cấp ở khoa cấp cứu: đột quỵ chiếm khoảng 25% ± 15% (ước tính cho Mỹ). Gần hai phần ba người đột quỵ không có dấu hiệu thần kinh khu trú mà người không chuyên thần kinh nhận ra được. Thất điều thân nặng: 33% ở đột quỵ so với 0% ở viêm dây thần kinh tiền đình; mất thăng bằng khi đến khám OR 3,71 cho đột quỵ. Đau đầu hoặc đau cổ: 38% nguyên nhân trung ương so với 12% ngoại biên (LR+ 3,2 cho đau vùng đầu cổ). Kiểu chóng mặt (quay hay không quay) không giúp phân biệt đột quỵ. Tuổi trên 50 dự báo mạnh đột quỵ, nhưng 25% nhồi máu não trong nghiên cứu xảy ra dưới 50 tuổi. Nghiệm pháp HINTS do chuyên gia làm có độ nhạy 98%, đặc hiệu 85% (gộp)."
