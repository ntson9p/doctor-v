notes_vi: "Lượt B đọc tóm tắt qua API Europe PMC; toàn văn trên OUP cần đăng nhập nên không có tỷ lệ từng triệu chứng. 3.049 người cường giáp liên tiếp ở một phòng khám chuyên khoa (Anh). Tuổi càng cao, khả năng có phần lớn các triệu chứng kinh điển càng giảm, trừ sụt cân và khó thở; người trên 61 tuổi phần lớn có từ 2 triệu chứng nhưng ít khi có từ 5 triệu chứng. Tuổi cao, FT4 cao, nam giới và bướu nhân độc liên quan với rung nhĩ. Tác giả khuyên xét nghiệm tuyến giáp dễ dàng hơn ở người trên 60 tuổi, nhất là khi có rung nhĩ, sụt cân hoặc khó thở."
