notes_vi: "Lượt B đọc toàn văn trên PMC. Hồi cứu 347 người ngộ độc khí CO đến khoa cấp cứu Bệnh viện Careggi (Florence, Ý), 1992–2007. Bảng 2 (dấu hiệu khi đến viện): đau đầu 58,5%; mất ý thức thoáng qua 40,9%; nhịp nhanh xoang 25,9%; buồn nôn hoặc nôn 25,0%; mệt yếu 20,1%; chóng mặt 20,1%; hồi hộp 18,4%; tổn thương cơ tim 17,2%; Glasgow 9–14 điểm 15,2%; mất vững tư thế 10,6%; Glasgow dưới 9 điểm 8,3%; co giật 6,9%; khó thở 6,3%; đau ngực kiểu tim 1,7%; huyết áp tâm thu dưới 90 mmHg 1,7%. Bối cảnh cấp cứu nên các dấu hiệu nặng cao hơn ở cộng đồng. Không báo cáo nguồn khí, mùa hay số người cùng nhà."
