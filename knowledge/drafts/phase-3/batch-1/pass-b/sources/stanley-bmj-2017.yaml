notes_vi: "Lượt B đọc tóm tắt (Europe PMC) và bảng 1 trên PMC. 3.012 người xuất huyết tiêu hóa trên liên tiếp ở 6 bệnh viện lớn (châu Âu, Bắc Mỹ, Singapore, New Zealand): tuổi trung vị 65; nam 58%; bệnh tim thiếu máu cục bộ 19%; bệnh gan 15%; ung thư 14%; mạch trung vị 89 lần/phút (95% số người trong khoảng 61–126); huyết áp tâm thu trung vị 125 mmHg. Nội soi (2.075 người): loét dạ dày, tá tràng 28%, viêm trợt thực quản, dạ dày, tá tràng 28%, giãn tĩnh mạch 7%, ung thư 3%, bình thường 14%; 31% không nội soi. Điểm Glasgow Blatchford từ 1 trở xuống dự báo không cần can thiệp, có thể xử trí ngoại trú (độ nhạy 98,6%)."
