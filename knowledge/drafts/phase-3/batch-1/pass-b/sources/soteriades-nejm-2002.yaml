notes_vi: "Lượt B đọc tóm tắt qua API Europe PMC. Nghiên cứu Framingham (cộng đồng, Mỹ, 1971–1998): 822/7.814 người có ngất, 6,2 ca/1.000 người-năm. Nguyên nhân hay gặp: phế vị (phản xạ) 21,2%, do tim 9,5%, hạ huyết áp thế đứng 9,4%; không rõ nguyên nhân 36,6%. Ngất phế vị không làm tăng tử vong hay biến cố tim mạch; ngất do tim làm tăng tử vong."
