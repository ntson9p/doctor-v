notes_vi: "Lượt B tải PDF toàn văn và trích chữ (bảng 1–3). Mô tả cắt ngang 70 người xuất huyết tiêu hóa do loét dạ dày tá tràng điều trị tại khoa Nội tiêu hóa (1/2023–12/2023): nam/nữ 2,2/1; tuổi trung bình 56,6 ± 16,6; dùng thuốc chống viêm không steroid 37,1%; H. pylori 21,4%; rượu hoặc thuốc lá 44,2%; tiền sử xuất huyết tiêu hóa hoặc loét 82,9%. Bảng 3: đi ngoài phân đen 63/70 (90,0%); nôn ra máu 35/70 (50,0%); đau, nóng rát vùng thượng vị 49/70 (70%); hoa mắt, chóng mặt 59/70 (84,3%); ngất 4/70 (5,7%); da xanh, niêm mạc nhợt 51/70 (72,9%). Ổ loét tá tràng 54,3%. Là người bệnh nằm viện nên tần suất cao hơn ở cộng đồng."
