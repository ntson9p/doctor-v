notes_vi: "Lượt B mở trang (rà soát lần cuối 12/6/2024, hạn 12/6/2027). Tim bỗng đập nhanh hẳn, trên 100 lần/phút; cơn thường vài phút, có khi vài giờ; có thể vài lần mỗi ngày hoặc một lần mỗi năm. Kèm theo có thể đau, tức ngực, mệt yếu, khó thở, choáng váng hoặc chóng mặt. Hay bắt đầu ở trẻ em và người trẻ; nhiều người có triệu chứng đầu tiên ở tuổi 25–40. Cà phê, rượu, chất gây nghiện có thể khởi phát cơn, nhưng thường không rõ yếu tố khởi phát. Thường không nghiêm trọng, hiếm khi đe dọa tính mạng. Gọi 999 khi cơn dài hơn thường lệ ở người đã được chẩn đoán, hoặc tim nhanh kèm khó thở, đau ngực, choáng."
