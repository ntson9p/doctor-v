notes_vi: "Lượt B đọc tóm tắt qua API Europe PMC. 880 người cường giáp ở Honolulu (Hawaii), mỗi người ghép cặp với một người chứng bình giáp theo tuổi, giới, chủng tộc. Phần lớn triệu chứng và dấu hiệu ít thay đổi theo tuổi cho đến sau 50 tuổi rồi giảm dần; sụt cân và rung nhĩ tăng theo tuổi; ăn nhiều và tăng cân giảm nhiều nhất theo tuổi. Tóm tắt không cho tỷ lệ từng triệu chứng."
