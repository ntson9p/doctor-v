notes_vi: "Lượt B mở toàn văn trên PMC. Khảo sát quốc gia ở Mỹ: từng có cơn hoảng sợ 28,3%, rối loạn hoảng sợ suốt đời 4,7%. So với nam, nữ có OR 2,3 với rối loạn hoảng sợ không kèm sợ khoảng rộng và 1,4 với cơn hoảng sợ đơn lẻ. Bài không cho tỷ lệ từng triệu chứng của cơn."
