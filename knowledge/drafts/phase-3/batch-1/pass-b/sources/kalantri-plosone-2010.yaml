notes_vi: "Lượt B đọc toàn văn qua API Europe PMC (PMC2797134). 390 người từ 12 tuổi ở bệnh viện dạy học tại Ấn Độ (ngoại trú và nội trú). Các nghiên cứu trước ở người lớn: độ nhạy của da, niêm mạc nhợt 19–70%, độ đặc hiệu 70–100%. Trong nghiên cứu: ở ngưỡng huyết sắc tố 9 g/dL không vị trí nào loại trừ hay khẳng định được thiếu máu (diện tích dưới đường cong 0,66–0,70); không nhợt lưỡi, kết mạc gần như loại trừ thiếu máu nặng dưới 7 g/dL. Hai người khám đánh giá rất khác nhau (kappa 0,07 với kết mạc). Ý nghĩa: người dùng tự nhận xét da xanh còn kém chính xác hơn."
