notes_vi: "Lượt B đọc toàn văn trên caselaw.vn (cơ sở dữ liệu văn bản pháp luật; Điều 3 thay thế 3319/QĐ-BYT ngày 19/07/2017; theo docs/research/vietnam-sources.md, 1353/QĐ-BYT năm 2021 chỉ bổ sung thành viên ban soạn thảo). Phần 6 'Hạ đường huyết': biến chứng cấp tính thường gặp ở người đái tháo đường; người dùng insulin, sulfonylurea có nguy cơ và có thể không nhận biết cơn. Người tỉnh, tự uống được (glucose dưới 3,9 mmol/L) thì uống 15–20 g glucose hoặc thức ăn có đường, thử lại sau 15 phút, nhắc lại nếu còn thấp, rồi ăn nhẹ để tránh tái phát. Phân mức: mức 1 dưới 3,9 và từ 3,0 mmol/L; mức 2 dưới 3,0 mmol/L; mức 3 là hạ đường huyết nặng có rối loạn ý thức hoặc thay đổi toàn thân, cần cấp cứu. Người nhiều cơn, cơn không triệu chứng hoặc cơn nặng cần rà soát phác đồ. Phần xử trí cấp cứu: rối loạn ý thức do thiếu glucose não có thể mất một thời gian mới hồi phục; người dùng insulin tác dụng chậm hoặc sulfonylurea cần được theo dõi trong bệnh viện. Phần này không liệt kê triệu chứng của cơn."
