notes_vi: "Lượt B đọc toàn văn trên PMC. Khảo sát Sức khỏe tâm thần thế giới (WHO), nhiều nước: rối loạn hoảng sợ suốt đời 1,7%; nước thu nhập thấp và trung bình thấp 0,8%, trung bình cao 1,1%, thu nhập cao 2,2%; Trung Quốc 0,3–0,4%, Nhật Bản 0,8%. Nữ giới liên quan với rối loạn hoảng sợ suốt đời (OR 1,8). Tuổi khởi phát trung vị 32 (khoảng tứ phân vị 20–47); nguy cơ đến 75 tuổi 2,7%. Bài liệt kê 13 triệu chứng theo DSM-IV nhưng không cho tỷ lệ từng triệu chứng. Không có số liệu Việt Nam."
