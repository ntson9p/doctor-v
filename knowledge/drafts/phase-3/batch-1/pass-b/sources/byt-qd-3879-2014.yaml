notes_vi: "Văn bản hành chính. Lượt B tải bản PDF toàn văn (sách NXB Y học, Hà Nội 2015) do cổng NCD của WHO lưu (tên tệp ghi 'P247-254' nhưng chứa cả sách) và trích chữ. Trang quyết định: số 3879/QĐ-BYT, Hà Nội ngày 30/9/2014, Thứ trưởng Nguyễn Thị Xuyên ký. Trang caselaw.vn ghi văn bản còn hiệu lực và có một lần sửa đổi ngày 19/7/2017 (chưa đối chiếu nội dung sửa đổi; phần đái tháo đường đã có hướng dẫn riêng). Bài 'Cường chức năng tuyến giáp' (tr. 51–58): bệnh Basedow là thể điển hình và hay gặp nhất; nữ/nam 7–10/1; ăn nhiều, mau đói, gầy sút cân, luôn nóng bức, ra nhiều mồ hôi, có thể sốt nhẹ; khoảng 50% tiêu chảy không đau quặn; hồi hộp, đánh trống ngực, nhịp tim nhanh thường xuyên ở hầu hết người bệnh, 100–140 lần/phút, đôi khi có cơn nhịp nhanh kịch phát trên thất; rung nhĩ là biến chứng hay gặp, thường ở người cao tuổi, bệnh nặng; bồn chồn, dễ cáu gắt, rối loạn giấc ngủ, có thể chóng mặt; run tay đầu ngón; bướu giáp to lan tỏa; khoảng 50% có bệnh mắt trên lâm sàng; người cao tuổi biểu hiện tim mạch rầm rộ, bướu vừa phải, ít triệu chứng mắt; thể vô cảm ở người già chủ yếu gầy sút. Iod, thuốc có iod (amiodaron), thai sản, stress là yếu tố nguy cơ. Bài 'Cơn nhiễm độc giáp cấp' (tr. 71–73): sốt cao 39–40°C, thở nhanh, vã mồ hôi, tim nhanh trên 140 lần/phút, rung nhĩ, suy tim, kích thích, vật vã, rối loạn tâm thần; ngừng đột ngột thuốc kháng giáp là yếu tố thuận lợi."
