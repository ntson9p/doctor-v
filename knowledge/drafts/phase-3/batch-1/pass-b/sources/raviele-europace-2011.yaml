notes_vi: "Lượt B mở phần chữ trên OUP. Bảng 2, bốn kiểu hồi hộp: ngoại tâm thu (cảm giác hẫng, mất một nhịp; không đều, xen giữa các nhịp bình thường; khởi phát đột ngột, thường lúc nghỉ); nhịp nhanh (như cánh vỗ trong ngực; đều hoặc không đều, rất nhanh; khởi phát đột ngột, có khi sau gắng sức; có thể kèm ngất, khó thở, mệt, đau ngực); do lo âu (đều, hơi nhanh; khởi phát từ từ, sau căng thẳng; kèm tê bì, nghẹn ở họng, thở dài); kiểu đập mạnh (đều, tần số bình thường; khởi phát từ từ, sau gắng sức; kèm mệt). Hồi hộp chiếm 16% triệu chứng khiến đi khám ở tuyến ban đầu. Nghiên cứu Weber và Kapoor (190 người, trung tâm đại học): rối loạn nhịp 41% (rung, cuồng nhĩ 16%; nhịp nhanh trên thất 10%; nhịp nhanh thất 2%), tâm lý 31%, thuốc và chất kích thích 6%, bệnh toàn thân 4%, bệnh tim cấu trúc 3%, không rõ 16%. Lo âu, cơn hoảng sợ chiếm 15–31% số người hồi hộp; khoảng hai phần ba người có nhịp nhanh trên thất từng bị nhầm là rối loạn hoảng sợ. Ngoại tâm thu nhĩ, thất hay gặp khi theo dõi điện tim và thường lành tính. Hồi hộp kèm ngất, tiền ngất hoặc chóng mặt gợi ý rối loạn huyết động; ngất hay gặp hơn khi có bệnh tim cấu trúc. Thiếu máu, sốt gây kiểu đập mạnh; cường giáp gây nhịp nhanh xoang."
