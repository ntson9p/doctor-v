notes_vi: "Lượt B đọc tóm tắt qua API Europe PMC. Dữ liệu hành chính của 5 cơ sở dữ liệu ở Canada, Đan Mạch, Ý, Mỹ (2000–2016): 1.671.944 người lớn đến khoa cấp cứu vì ngất. Thuyên tắc phổi khi ra viện: 0,06–0,55% ở mọi người ngất; 0,15–2,10% ở người phải nhập viện. Sau 90 ngày: 0,14–0,83% (mọi người), 0,35–2,63% (nhập viện). Kết luận: thuyên tắc phổi hiếm gặp ở người ngất; cần nghĩ tới nhưng không cần làm xét nghiệm cho mọi người."
