notes_vi: "Lượt B đọc tóm tắt qua API Europe PMC. 762 người đi khám bác sĩ gia đình (Hà Lan) vì triệu chứng mới nghi do rối loạn nhịp, được ghi điện tim qua điện thoại: có rối loạn nhịp 28,3%, rối loạn nhịp có ý nghĩa lâm sàng 8,8%. Yếu tố liên quan chính là tuổi; ngoài ra nam giới, hồi hộp, khó thở lúc khám, đang dùng thuốc tim mạch; tiền sử rối loạn nhịp liên quan với rối loạn nhịp có ý nghĩa. Dùng thuốc thần kinh trung ương và hay than nhiều triệu chứng tâm lý thì ít khả năng có rối loạn nhịp có ý nghĩa. Tóm tắt không nêu loại rối loạn nhịp cụ thể."
