notes_vi: "Lượt B đọc tóm tắt qua API Europe PMC. Nghiên cứu dựa trên dân số (Texas, Mỹ), người trên 44 tuổi đến cấp cứu hoặc nhập viện vì chóng mặt, choáng váng hoặc mất thăng bằng: đột quỵ hoặc cơn thiếu máu não thoáng qua chiếm 3,2% (53/1666); chỉ 0,7% (9/1297) ở người chóng mặt đơn độc, không kèm triệu chứng hay dấu hiệu thần kinh khác. Như vậy 44/53 người đột quỵ hoặc cơn thiếu máu não thoáng qua có kèm triệu chứng thần kinh khác. Người đột quỵ hơi lớn tuổi hơn (69,3 so với 65,3); nam giới và triệu chứng mất thăng bằng liên quan với đột quỵ, chóng mặt đơn độc liên quan ngược."
