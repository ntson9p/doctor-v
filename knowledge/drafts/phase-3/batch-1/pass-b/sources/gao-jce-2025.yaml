notes_vi: "Lượt B đọc tóm tắt (Europe PMC) và toàn văn PMC11726996. Một bệnh viện ở Từ Châu, Trung Quốc (9/2022–5/2023): 214 người ngoại tâm thu thất dày, không có rối loạn nhịp khác hay bệnh tim cấu trúc; tuổi trung bình 56,6; nữ 57,0%. 57,9% có hồi hộp; nhóm có hồi hộp nhiều nữ hơn (63,7% so với 47,8%) và nhiều lo âu hơn (44,4% so với 14,4%). Chỉ 33,6% có hồi hộp trùng đúng lúc có ngoại tâm thu; hồi hộp chỉ kéo dài vài giây gợi ý do ngoại tâm thu (29,2% so với 11,5%)."
