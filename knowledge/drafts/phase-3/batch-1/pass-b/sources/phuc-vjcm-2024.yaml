notes_vi: "Lượt B tải PDF toàn văn và trích chữ. 110 người xơ gan vỡ giãn tĩnh mạch thực quản (5/2021–8/2022): nam 94,5%; tuổi trung bình 55,3; nghiện rượu 79,1%; nhiễm vi rút viêm gan B, C 14,5%; xuất huyết mức vừa 46,4%, nặng 29,5%; nôn ra máu 71,8%; trên 70% có nôn ra máu, đi ngoài phân đen, cổ chướng, tuần hoàn bàng hệ; 100% thiếu máu (50,9% nặng)."
