notes_vi: "Lượt B mở phần chữ trên OUP (xuất bản trực tuyến 31/8/2019). Mục 4.1: phần lớn ca được nghĩ tới khi có khó thở, đau ngực, tiền ngất hoặc ngất, hoặc ho ra máu; khó thở thường cấp và nặng ở thuyên tắc trung tâm, nhẹ và thoáng qua ở thuyên tắc nhỏ ngoại vi; đau ngực hay gặp, thường do kích thích màng phổi, ở thuyên tắc trung tâm có thể giống đau thắt ngực; ngất liên quan với rối loạn huyết động và suy thất phải; huyết động không ổn định là kiểu biểu hiện hiếm nhưng quan trọng; nhịp nhanh xoang gặp khoảng 40%, có thể có rung nhĩ; một số người không có triệu chứng. Mục 3.2, bảng 3: khoảng 40% người thuyên tắc phổi không có yếu tố thuận lợi; yếu tố mạnh (OR trên 10): chấn thương lớn, gãy xương chi dưới, thay khớp háng hoặc gối, chấn thương tủy sống, từng bị huyết khối tĩnh mạch, mới nằm viện vì suy tim hoặc rung nhĩ; trung bình (OR 2–9): ung thư (cao nhất khi di căn), hóa trị, nhiễm trùng, sau sinh, thuốc tránh thai kết hợp; yếu (OR dưới 2): nằm tại giường trên 3 ngày, ngồi bất động lâu (đi ô tô, máy bay đường dài), có thai, tuổi cao, mổ nội soi. Tỷ lệ mắc thuyên tắc phổi 39–115/100.000 dân mỗi năm; huyết khối tĩnh mạch ở người từ 80 tuổi cao gần 8 lần so với tuổi 40–49. Thang Geneva sửa đổi: từng bị thuyên tắc phổi hoặc huyết khối tĩnh mạch sâu, nhịp tim 75–94 hoặc từ 95, mổ hoặc gãy xương trong 1 tháng, ho ra máu, ung thư đang tiến triển, đau một chân, đau khi ấn dọc tĩnh mạch sâu và phù một chân, tuổi trên 65."
