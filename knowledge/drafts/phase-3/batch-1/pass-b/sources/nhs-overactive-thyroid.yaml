notes_vi: "Lượt B mở trang (rà soát lần cuối 11/4/2023, hạn rà soát 11/4/2026 đã qua, chưa thấy bản mới). Gặp ở nữ khoảng gấp 10 lần nam, thường ở tuổi 20–40. Triệu chứng: bồn chồn, lo âu, dễ cáu; thay đổi cảm xúc; khó ngủ; mệt, yếu kéo dài; sợ nóng; sưng ở cổ do tuyến giáp to (bướu cổ); tim đập không đều hoặc nhanh (hồi hộp); giật hoặc run; sụt cân. Khoảng 4/5 người cường giáp là do bệnh Graves (Basedow); nguyên nhân khác: nhân tuyến giáp tiết hormon, thuốc như amiodarone. Biến chứng: bệnh mắt (cộm, nhìn đôi, lồi mắt), biến chứng thai kỳ, cơn bão giáp (đợt bùng phát đột ngột, đe dọa tính mạng). Khám bác sĩ gia đình khi có triệu chứng để làm xét nghiệm máu."
