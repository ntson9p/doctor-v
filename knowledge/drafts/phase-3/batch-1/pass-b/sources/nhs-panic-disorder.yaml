notes_vi: "Lượt B mở trang (rà soát lần cuối 22/8/2023, hạn rà soát 22/8/2026 đã qua, chưa thấy bản mới). Triệu chứng thể chất của cơn hoảng sợ: tim đập nhanh, cảm giác sắp ngất, vã mồ hôi, buồn nôn, đau ngực, khó thở, run, nóng bừng, ớn lạnh, run chân tay, cảm giác nghẹn, chóng mặt, tê hoặc châm chích, khô miệng, mót đi vệ sinh, ù tai, cảm giác sợ hãi hoặc sợ chết, cồn cào bụng, tê bì đầu ngón tay, cảm giác tách rời cơ thể. Phần lớn cơn kéo dài 5–20 phút, có khi tới 1 giờ. Cơn rất đáng sợ nhưng không nguy hiểm, không gây hại cho cơ thể; nhiều triệu chứng có thể do bệnh khác nên bác sĩ có thể khám để loại trừ. Trong cơn: ở yên chỗ, thở chậm và sâu, tự nhắc rằng cơn sẽ qua. Khám bác sĩ gia đình khi có triệu chứng rối loạn hoảng sợ. Trang không cho tỷ lệ mắc."
