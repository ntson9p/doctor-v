notes_vi: "Lượt B chỉ đọc được tóm tắt qua API Europe PMC (trang SAGE không truy cập được). Định nghĩa: rối loạn tai trong với các cơn chóng mặt tái diễn khi thay đổi tư thế. Khuyến cáo mạnh: chẩn đoán bằng nghiệm pháp Dix–Hallpike, điều trị bằng thủ thuật đưa sỏi tai về chỗ cũ; không hạn chế tư thế sau thủ thuật. Khuyến cáo: phân biệt với các nguyên nhân chóng mặt, mất thăng bằng khác; đánh giá nguy cơ ngã; khám lại trong 1 tháng; tìm nguyên nhân khác khi triệu chứng kéo dài. Khuyến cáo không chụp hình ảnh, không đo chức năng tiền đình khi đủ tiêu chuẩn và không có dấu hiệu khác thường; không dùng thường quy thuốc ức chế tiền đình. Có thể theo dõi kèm hẹn khám lại làm xử trí ban đầu."
