notes_vi: "Lượt B đọc toàn văn qua API Europe PMC (PMC9661346). Tiêu chuẩn: chóng mặt quay hoặc không quay, khởi phát cấp, liên tục, vừa đến nặng, kéo dài ít nhất 24 giờ; rung giật nhãn cầu tự phát kiểu ngoại biên; giảm phản xạ tiền đình – mắt một bên; không có triệu chứng thần kinh trung ương hay triệu chứng thính giác cấp (nghe kém, ù tai, đau tai). Tới 25% có một cơn chóng mặt vài giờ trong 2 ngày trước. Chóng mặt liên tục cả khi nghỉ, tăng khi cử động đầu; kèm nhìn mờ do chuyển động, mất thăng bằng xu hướng ngã về bên bệnh, buồn nôn và thường nôn. Dịch tễ: mới mắc 3,5–15,5/100.000 người/năm; nguyên nhân chóng mặt đứng thứ 6, bệnh tiền đình ngoại biên thứ 3 (sau chóng mặt tư thế kịch phát lành tính và bệnh Ménière) trong hơn 36.000 người ở trung tâm chóng mặt, kể cả trẻ em; tuổi khởi phát thường 30–60; không khác theo giới, không theo mùa; tái phát 1,9–10,7%. Căn nguyên vi rút (HSV-1) có khả năng nhưng chưa chứng minh. Bệnh sử gợi ý nguyên nhân trung ương: yếu tố nguy cơ tim mạch, trên 60 tuổi, nhìn đôi, yếu, tê nửa người, thất điều; nhồi máu động mạch tiểu não trước dưới thường kèm nghe kém."
