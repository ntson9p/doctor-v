notes_vi: "Lượt B mở trang (rà soát toàn bộ 10/2025). Tỷ lệ mắc trọn đời 2,4% (điều tra ở Đức); nữ nhiều hơn nam; tăng theo tuổi, làm người cao tuổi dễ ngã. Chóng mặt quay ngắn khi cử động đầu (trở mình trên giường, cúi người); cơn kéo dài vài giây đến vài phút, hay nặng hơn vào buổi sáng; có thể buồn nôn, nôn; không có nghe kém, ù tai. Khám thần kinh bình thường. Thường tự hết sau vài tuần đến vài tháng, có thể tái lại. Điều trị chính là thủ thuật đưa sỏi tai về chỗ cũ (Epley, Semont); thuốc không được khuyên dùng thường quy."
