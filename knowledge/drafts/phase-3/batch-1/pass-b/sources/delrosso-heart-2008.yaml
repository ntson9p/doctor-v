notes_vi: "Lượt B đọc tóm tắt qua API Europe PMC (toàn văn trên heart.bmj.com trả lỗi 403). 516 người ngất không rõ nguyên nhân ở khoa cấp cứu của 14 bệnh viện đa khoa (Ý). Yếu tố dự báo ngất do tim: điện tim bất thường và/hoặc bệnh tim, hồi hộp trước ngất, ngất khi gắng sức hoặc khi nằm; không có tiền triệu thần kinh thực vật và không có yếu tố thuận lợi, khởi phát làm giảm điểm theo chiều ngược lại. Điểm từ 3 trở lên: độ nhạy 92–95%, độ đặc hiệu 61–69%. Tóm tắt không cho tần suất từng dấu hiệu."
