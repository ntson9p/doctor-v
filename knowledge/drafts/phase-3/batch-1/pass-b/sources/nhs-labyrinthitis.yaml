notes_vi: "Lượt B mở trang (rà soát lần cuối 06/8/2026). Triệu chứng: chóng mặt quay, đứng không vững, buồn nôn hoặc nôn, nghe kém, ù tai; viêm dây thần kinh tiền đình có triệu chứng rất giống nhưng không gây nghe kém hay ù tai. Thường do nhiễm vi rút như cảm lạnh, cúm. Triệu chứng đỡ dần sau vài ngày; thăng bằng thường hồi phục sau 2–6 tuần, có khi lâu hơn. Tự chăm sóc: nằm yên trong phòng tối khi chóng mặt nhiều, uống nước từng ngụm nếu nôn, tránh tiếng ồn và ánh sáng mạnh, ngủ đủ, tránh rượu; không lái xe, đi xe đạp, vận hành máy khi đang chóng mặt. Khám không khẩn khi sau vài ngày không đỡ hoặc nặng lên; khám khẩn hoặc gọi 111 khi đột ngột nghe kém một tai. Trang không có mục gọi 999 hay đến cấp cứu."
