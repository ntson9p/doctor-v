notes_vi: "Lượt B mở trang (rà soát lần cuối 13/1/2025, hạn 13/1/2028). Nguy cơ cao hơn ở người từ 55 tuổi, nam giới, béo phì, hút thuốc, vận động viên sức bền; bệnh liên quan: tăng huyết áp, suy tim, bệnh van hai lá, hội chứng Wolff-Parkinson-White, nhồi máu cơ tim cũ, bệnh thận mạn, cường giáp, đái tháo đường, ngưng thở khi ngủ. Triệu chứng: tim đập không đều hoặc nhanh, hồi hộp, mệt, giảm sức gắng sức, đau hoặc tức ngực, khó thở, chóng mặt hoặc choáng váng; đôi khi không có triệu chứng. Gọi 999 khi tim nhanh hoặc không đều kèm đau ngực, khó thở, vã mồ hôi, buồn nôn, ngất hoặc chóng mặt, đau đầu dữ dội, yếu tê một bên, nhìn mờ, lú lẫn hoặc nói khó. Rung nhĩ có thể gây cục máu đông và đột quỵ."
