notes_vi: "Lượt B đọc toàn văn trên vnras.com (trang đăng lại; có bản Quyết định ký ngày 31/8/2015, Thứ trưởng Nguyễn Thị Xuyên). Chưa thấy văn bản thay thế (docs/research/vietnam-sources.md); cần thay URL bằng bản chính thức. Bài 33 'Ngộ độc khí carbon monoxide (CO)': nguồn khí hay gặp ở Việt Nam là đốt than (nhất là bếp than tổ ong), củi, gỗ, gas trong phòng kín để nấu ăn, sưởi ấm hoặc đun nước (bình nóng lạnh chạy gas trong nhà tắm); chạy máy phát điện, động cơ trong phòng kín; cháy nhà. Ngộ độc thường xảy ra với nhiều người sống trong nhà, cả vật nuôi. Khởi đầu bằng đau đầu, mệt mỏi, chóng mặt, buồn nôn, nhìn mờ, rối loạn hành vi; nặng thì hôn mê; tổn thương cơ tim, loạn nhịp (5–6%). Ngộ độc nhẹ dễ lầm với cảm cúm, nhất là về mùa đông; ngộ độc vừa dễ nhầm với ngộ độc thức ăn hoặc đau thắt ngực. Dạng thần kinh – tâm thần: đi loạng choạng, khó tập trung, rối loạn thị giác; trẻ em có thể khởi đầu bằng co giật; người già bằng lẫn lộn. Chẩn đoán dựa vào tiền sử tiếp xúc nguồn khí CO kèm lâm sàng, xét nghiệm HbCO. Điều trị: đưa khỏi nguồn độc, thở oxy càng sớm càng tốt; oxy cao áp trong 24 giờ (tốt nhất 4–6 giờ) khi mất ý thức, có thai, toan nặng. Di chứng thần kinh có thể xuất hiện 2–40 ngày sau ngộ độc."
