notes_vi: "Lượt B mở trang (rà soát toàn bộ, cập nhật 4/2026). Cơn hoảng sợ: khởi phát đột ngột một khoảng ngắn khó chịu, lo âu hoặc sợ hãi dữ dội, cần ít nhất 4 trong 13 triệu chứng; kéo dài vài phút đến 1 giờ; không nguy hiểm về mặt y khoa. Triệu chứng nhận thức: sợ chết, sợ phát điên hoặc mất kiểm soát, cảm giác không thật. Triệu chứng cơ thể: đau, tức ngực; hồi hộp, tim nhanh; khó thở, ngột ngạt; chóng mặt, mất vững, choáng; tê hoặc châm chích; nghẹn; nóng bừng hoặc ớn lạnh; buồn nôn, khó chịu ở bụng; vã mồ hôi; run. Tỷ lệ cơn hoảng sợ suốt đời 8–23%; rối loạn hoảng sợ 2–3% dân số trong 12 tháng; nữ gấp khoảng 2 lần nam; thường bắt đầu ở cuối tuổi vị thành niên hoặc đầu tuổi trưởng thành. Bệnh hay đi kèm: rối loạn nhịp tim, cường giáp, hen, bệnh phổi tắc nghẽn mạn tính; chỉ xếp là rối loạn hoảng sợ sau khi đã khám loại trừ bệnh cơ thể. Người bệnh thường lo sợ cơn tiếp theo và tránh nơi từng bị."
