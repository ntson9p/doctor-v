notes_vi: "Lượt B đọc toàn văn qua API Europe PMC (PMC10465717). Năm 2021, thiếu máu ở 24,3% dân số thế giới; nam 17,5%, nữ 31,2% (mọi lứa tuổi); ở 15–49 tuổi nữ 33,7% so với nam 11,3%. Chênh lệch theo giới lớn nhất ở 10–64 tuổi, nhỏ hơn ở trẻ dưới 5 tuổi và thu hẹp lại từ 80 tuổi. Đông Á có tỷ số nữ/nam về gánh nặng (YLD) khoảng 4,2. Nguyên nhân hàng đầu: thiếu sắt do ăn uống (66,2% số ca), bệnh hemoglobin và tan máu; bệnh phụ khoa và mất máu sản khoa quan trọng ở phụ nữ tuổi sinh đẻ; ở người trên 80 tuổi, bệnh thận mạn đứng thứ hai."
