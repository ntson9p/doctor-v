notes_vi: "Lượt B đọc tóm tắt trên cổng Cục Thông tin KH&CN Quốc gia (chưa đọc toàn văn). Mô tả cắt ngang người bệnh rung nhĩ điều trị nội trú tại Viện Tim mạch Quốc gia, Bệnh viện Bạch Mai (8/2021–10/2022): 39,6% có rối loạn lo âu; ở nhóm này, triệu chứng kích thích thần kinh thực vật gặp ở 100%, hay gặp nhất là tim mạch (100%), hô hấp (99,5%), tiêu hóa (96,4%). Dùng để ghi nhận: lo âu và triệu chứng giống cơn hoảng sợ hay đi kèm rung nhĩ ở người Việt Nam."
