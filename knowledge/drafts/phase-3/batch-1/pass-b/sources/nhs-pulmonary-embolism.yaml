notes_vi: "Lượt B mở trang (rà soát lần cuối 15/10/2026, hạn 15/10/2029). Triệu chứng: khó thở đột ngột, đau ngực tăng khi hít vào, ho ra máu; đau, sưng một chân (thường ở bắp chân) hoặc một tay, da đỏ, xanh hoặc sẫm màu là dấu hiệu cục máu đông. 'Call 999 or go to A&E' (gọi 999 hoặc đến cấp cứu): khó thở đột ngột, đau ngực hoặc lưng trên, tim đập rất nhanh, người bệnh ngất; không tự lái xe, mang theo thuốc đang dùng. Khám khẩn hoặc gọi 111: ho ra máu, triệu chứng khác gây lo lắng. Yếu tố nguy cơ nêu trên trang: đi máy bay, tàu, ô tô từ 4 giờ trở lên; đang nằm viện vì bệnh khác."
