notes_vi: "Lượt B mở trang bài (phụ bản). Hồi cứu hồ sơ điện tử 2016–2018 ở Bệnh viện Đa khoa tỉnh Lâm Đồng: 483 người đái tháo đường típ 2 nằm viện có hạ đường huyết (glucose dưới 3,3 mmol/L, không phải ca nào cũng đo). Vã mồ hôi 83%, li bì 70%; khoảng một nửa có chóng mặt, mệt yếu (55%), kích động, lú lẫn, đói nhiều; co giật 22%, mất ý thức 13%, đau đầu dưới 25%. Không báo cáo run tay, hồi hộp, nhìn mờ, yếu tố khởi phát. Thuốc: chỉ thuốc uống 32,3%, chỉ insulin 18%, phối hợp 13,5%. Hạn chế: bài trong phụ bản, số liệu không thống nhất, bối cảnh nằm viện (ca nặng); dùng làm số liệu tham khảo duy nhất của Việt Nam và hạ mức cho cộng đồng."
