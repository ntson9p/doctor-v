notes_vi: "Lượt B đọc tóm tắt qua API Europe PMC. 341 người ngất ở bệnh viện (Ý), hỏi bệnh theo bộ câu hỏi chuẩn: do tim 23%, qua trung gian thần kinh (phản xạ) 58%, thần kinh hoặc tâm thần 1%, không rõ 18%. Có bệnh tim là yếu tố dự báo độc lập duy nhất của ngất do tim (OR 16; độ nhạy 95%, độ đặc hiệu 45%); không có bệnh tim loại trừ được ngất do tim ở 97% người. Gợi ý phản xạ: cơn đầu và cơn cuối cách nhau trên 4 năm, khó chịu ở bụng trước khi mất ý thức, buồn nôn và vã mồ hôi lúc hồi phục. Ở người không có bệnh tim, hồi hộp trước ngất là yếu tố dự báo duy nhất của ngất do tim."
