notes_vi: "Lượt B mở trang (rà soát lần cuối 28/10/2024, hạn 28/10/2027). Ba kiểu: nhịp nhanh, nhịp chậm, nhịp không đều; nêu rung nhĩ và nhịp nhanh trên thất. Triệu chứng: hồi hộp (đập thình thịch, dồn dập, rung, hẫng nhịp), khó thở, choáng váng hoặc chóng mặt, cảm giác sắp ngất, mệt, đau hoặc tức ngực. Gọi 999 hoặc đến cấp cứu khi hồi hộp kèm đau ngực, khó thở, chóng mặt, choáng hoặc ngất, suýt ngất; khám bác sĩ khi nghĩ mình có rối loạn nhịp, hoặc hồi hộp hay tái lại, nặng dần. Yếu tố khởi phát: cà phê, rượu, thuốc lá, chất gây nghiện, thuốc, vi rút; bệnh nền: tăng huyết áp, bệnh mạch vành, bệnh van tim, nhồi máu cơ tim, hội chứng Wolff-Parkinson-White."
