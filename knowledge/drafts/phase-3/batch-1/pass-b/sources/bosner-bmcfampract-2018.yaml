notes_vi: "Lượt B (Giai đoạn 3, lô 1) đọc toàn văn qua API Europe PMC (PMC5819275). 31 nghiên cứu ở tuyến ban đầu (phần lớn châu Âu, 5 ở Mỹ). Bảng 3 (chóng mặt): tai – tiền đình ngoại biên 5,4–42,1% (10 nghiên cứu); chóng mặt tư thế kịch phát lành tính 4,3–39,5% (6 nghiên cứu); viêm dây thần kinh tiền đình 0,6–24,0% (6 nghiên cứu); bệnh Ménière 1,4–2,7%; tim mạch 3,8–56,8%; thần kinh trung ương 1,4–11,4%; tâm lý 1,8–21,6%; không xác định được nguyên nhân tới 80,2%. Bảng 4 (hai nghiên cứu ít sai lệch, đều ở người cao tuổi): Maarsingh 2010 (417 người từ 65 tuổi): tiền đình ngoại biên 14,4%, tim mạch (gồm mạch máu não) 56,8%, tâm lý 9,8%, do thuốc 2,4%; Lawson 1999 (50 người trên 60 tuổi): chóng mặt tư thế kịch phát lành tính 8,0%, viêm dây thần kinh tiền đình 24,0%, mạch máu não 4,0%. Tỷ lệ nữ trong các nghiên cứu: 58–83% (khoảng hai phần ba). Kết quả rất không đồng nhất, không gộp số liệu."
