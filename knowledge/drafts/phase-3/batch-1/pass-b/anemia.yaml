id: anemia
names:
  vi: "Thiếu máu"
  vi_common: ["Thiếu máu", "Thiếu máu thiếu sắt"]
  en: "Anaemia"
codes:
  icd10: "D64.9"
  icd10_verified: false
  mondo: "MONDO:0002280"
summary_vi:
  - "Máu thiếu hồng cầu hoặc huyết sắc tố, hay gặp nhất do thiếu sắt."
  - "Thường gây mệt, da xanh, hoa mắt, chóng mặt, hồi hộp, hụt hơi khi gắng sức."
  - "Hay gặp ở phụ nữ có kinh nhiều, phụ nữ có thai và trẻ em; cần xét nghiệm máu để tìm nguyên nhân."
urgency: 4
cant_miss: false
specialties: [general_medicine]
priors:
  - complaint: dizziness
    default: P3
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-1832-2022, who-gho-anaemia, gbd-anaemia-lancethaematol-2023, bosner-bmcfampract-2018]
      locator: "1832/QĐ-BYT bài Tiếp cận chẩn đoán thiếu máu mục 3.1; GHO (Việt Nam); GBD 2021 phần Kết quả"
      reported: "Việt Nam: thiếu máu ở 20,5% phụ nữ 15–49 tuổi (2023), 25,3% phụ nữ có thai, 22,9% trẻ 6–59 tháng (2019; phần lớn thể nhẹ); thế giới: nam 17,5%, nữ 31,2%"
      note: "Thiếu máu rất phổ biến ở Việt Nam nhưng phần lớn ở mức nhẹ, ít khi là nguyên nhân chính của chóng mặt; các nghiên cứu tuyến ban đầu trong Bösner 2018 không tách riêng thiếu máu. 1832/QĐ-BYT: thiếu máu gây hoa mắt, chóng mặt, mệt mỏi tùy mức độ. Ước P3 cho mọi nhóm tuổi; chênh lệch theo giới bằng hệ số. Không có số liệu tuyến ban đầu; cần bác sĩ duyệt."
  - complaint: palpitations
    default: P3
    evidence:
      tier: B
      basis: judgment
      sources: [nhs-heart-palpitations, byt-qd-1832-2022]
      note: "NHS: thiếu máu thiếu sắt là một nguyên nhân bệnh lý của hồi hộp; 1832/QĐ-BYT: hồi hộp, đánh trống ngực là biểu hiện của thiếu máu. Không có tỷ lệ; ước P3."
  - complaint: syncope
    default: P4
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-1832-2022, nhs-fainting]
      locator: "1832/QĐ-BYT bài Thiếu máu thiếu sắt mục 3.1"
      note: "1832/QĐ-BYT: thiếu máu mức độ nặng có thể gây choáng, ngất. Ngất do mất máu cấp thuộc xuất huyết tiêu hóa trên và chửa ngoài tử cung, không thuộc bệnh này. Ước P4."
prior_modifiers:
  - when: { sex: [female] }
    factor: 1.2
    evidence:
      tier: B
      basis: numeric
      sources: [gbd-anaemia-lancethaematol-2023, bosner-bmcfampract-2018]
      locator: "GBD 2021 phần Kết quả (theo giới); Bösner 2018 bảng 1 (tỷ lệ nữ)"
      reported: "Thiếu máu ở nữ 31,2% so với nam 17,5% (mọi tuổi), 33,7% so với 11,3% ở 15–49 tuổi; 58–83% người đi khám vì chóng mặt là nữ"
      note: "Hệ số so với các nguyên nhân khác của cùng triệu chứng chính: người đi khám vì chóng mặt, hồi hộp vốn đã phần lớn là nữ, nên chênh lệch thực nhỏ hơn tỷ số tỷ lệ mắc. Chọn 1,2 cho nữ và 0,7 cho nam (tỷ số khoảng 1,7). Chênh lệch nhỏ hơn ở trẻ dưới 5 tuổi và người từ 80 tuổi (GBD), nhưng hệ số không tách theo tuổi."
  - when: { sex: [male] }
    factor: 0.7
    evidence:
      tier: B
      basis: numeric
      sources: [gbd-anaemia-lancethaematol-2023, bosner-bmcfampract-2018]
      reported: "Như hệ số cho nữ."
      note: "Đi cặp với hệ số 1,2 cho nữ."
findings:
  - finding: fatigue
    freq: very_frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-1832-2022]
      locator: "Bài Tiếp cận chẩn đoán thiếu máu mục 3.1; bài Thiếu máu thiếu sắt mục 3.1"
      note: "Mệt mỏi là biểu hiện đầu tiên được liệt kê, có cả ở giai đoạn thiếu sắt chưa thiếu máu. Không có tỷ lệ; tỷ lệ nền 20%."
  - finding: pallor
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [kalantri-plosone-2010, byt-qd-1832-2022]
      locator: "Kalantri 2010 phần Giới thiệu, Bàn luận"
      reported: "Độ nhạy của da, niêm mạc nhợt ở người lớn 19–70%, độ đặc hiệu 70–100%"
      population: "Người bệnh nội trú, ngoại trú ở Ấn Độ và các nghiên cứu trước"
      note: "Người chóng mặt, hồi hộp vì thiếu máu thường đã thiếu máu vừa trở lên, nên ước khoảng một nửa; người dùng tự nhận xét kém chính xác hơn bác sĩ (tỷ lệ nền 15%). Cùng cụm anemia_signs."
  - finding: breathless_on_exertion
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-1832-2022]
      locator: "Bài Tiếp cận chẩn đoán thiếu máu mục 3.1"
      note: "Khó thở nhất là khi gắng sức hoặc đi lại nhiều. Không có tỷ lệ; ước khoảng một nửa (tỷ lệ nền 15%)."
  - finding: palpitations
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-1832-2022, nhs-heart-palpitations]
      note: "1832/QĐ-BYT: hồi hộp, đánh trống ngực. Có tác dụng khi triệu chứng chính là Chóng mặt hoặc Ngất. Ước khoảng một nửa."
  - finding: dizziness
    freq: frequent
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-1832-2022]
      note: "Hoa mắt, chóng mặt. Có tác dụng khi triệu chứng chính là Hồi hộp hoặc Ngất."
  - finding: dizziness_on_standing
    freq: frequent
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-1832-2022, nhs-dizziness]
      note: "1832/QĐ-BYT: hoa mắt, chóng mặt; NHS Dizziness nêu thiếu máu thiếu sắt là một nguyên nhân chóng mặt. Choáng, tối sầm mắt khi đứng dậy hay gặp khi lượng huyết sắc tố thấp. Ước khoảng một nửa (tỷ lệ nền 15%)."
  - finding: fainting_or_near_fainting
    freq: occasional
    evidence:
      tier: B
      basis: verbal
      sources: [byt-qd-1832-2022]
      locator: "Bài Thiếu máu thiếu sắt mục 3.1"
      note: "Thiếu máu nặng có thể gây choáng, ngất. Có tác dụng khi triệu chứng chính là Chóng mặt hoặc Hồi hộp. Ước 20%."
  - finding: anemia_known
    freq: frequent
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-1832-2022]
      note: "Thiếu máu thiếu sắt diễn biến từ từ, hay tái lại khi nguyên nhân (kinh nhiều, ăn thiếu sắt) còn; nhiều người đã từng được nói là thiếu máu. Không có tỷ lệ; ước khoảng một nửa (tỷ lệ nền 8%)."
  - finding: heavy_periods
    freq: frequent
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-1832-2022, gbd-anaemia-lancethaematol-2023]
      locator: "1832/QĐ-BYT bài Thiếu máu thiếu sắt mục 2; GBD 2021 phần Kết quả"
      note: "Áp dụng cho nữ 13–64 tuổi. Mất máu do kinh nguyệt nhiều là nguyên nhân thiếu sắt (1832/QĐ-BYT); bệnh phụ khoa là nguyên nhân quan trọng ở phụ nữ tuổi sinh đẻ (GBD). Không có tỷ lệ; ước khoảng một nửa (tỷ lệ nền 10%)."
  - finding: black_stool
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-1832-2022]
      locator: "Bài Thiếu máu thiếu sắt mục 2.2"
      note: "Chảy máu tiêu hóa mạn là nguyên nhân thiếu sắt; người đang uống viên sắt cũng có phân đen. Ước 20%, cao hơn tỷ lệ nền 1%. Phân đen đã có quy tắc rf_gi_bleeding (mức 2); chảy máu cấp nhiều thuộc xuất huyết tiêu hóa trên."
  - finding: weight_loss_unintended
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-1832-2022]
      locator: "Bài Thiếu máu thiếu sắt mục 4.3 (thiếu máu trong suy dinh dưỡng, viêm mạn)"
      note: "Gặp khi thiếu máu do suy dinh dưỡng, bệnh mạn tính, chảy máu tiêu hóa do khối u. Ước 20% (tỷ lệ nền 5%)."
  - finding: dizziness_pattern
    dist: { brief_episodes: 0.2, long_episodes: 0.25, continuous: 0.1, chronic: 0.45 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-1832-2022]
      note: "Thiếu máu diễn biến từ từ nên chóng mặt thường âm ỉ nhiều tuần, hoặc thành cơn ngắn khi đứng dậy. Phân bố là ước lượng."
  - finding: syncope_trigger
    dist: { standing_heat: 0.25, emotion_pain: 0.07, standing_up: 0.33, toilet_cough: 0.05, exertion: 0.1, lying: 0.02, no_trigger: 0.18 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-1832-2022, esc-syncope-2018]
      note: "Thiếu máu làm dễ ngất khi đứng lâu, nơi nóng hoặc khi vừa đứng dậy (hoàn cảnh nguy cơ thấp theo ESC 2018); gắng sức làm thiếu oxy mô rõ hơn. Phân bố là ước lượng."
  - finding: syncope_warning
    dist: { prodrome: 0.7, palpitations_first: 0.12, no_warning: 0.18 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-1832-2022]
      note: "Thường có hoa mắt, tối sầm mắt, hồi hộp trước khi choáng. Phân bố là ước lượng."
  - finding: pulse_measured
    dist: { lt_40: 0.001, n40_100: 0.26, n100_150: 0.135, gt_150: 0.004, not_measured: 0.6 }
    evidence:
      tier: B
      basis: judgment
      sources: [byt-qd-1832-2022]
      note: "Tim nhanh để bù thiếu oxy (hồi hộp, đánh trống ngực), nhất là khi thiếu máu vừa, nặng. 'Chưa đo' giữ đúng 0,6 (lựa chọn trung tính). Phân bố là ước lượng."
warning_signs: [black_stool, vomiting_blood, breathing_difficulty, chest_pain_pressure, fainting_or_near_fainting]
self_care_vi:
  - "Ăn uống đủ bữa, chọn nhiều thức ăn giàu sắt."
  - "Đứng dậy từ từ; ngồi hoặc nằm xuống ngay khi thấy choáng."
  - "Hỏi bác sĩ hoặc dược sĩ trước khi tự uống viên sắt, vì cần biết đúng nguyên nhân."
see_doctor_vi:
  - "Đặt lịch khám trong vài ngày để được xét nghiệm máu và tìm nguyên nhân thiếu máu."
  - "Đi khám sớm hơn nếu kinh nguyệt ra rất nhiều, đang có thai hoặc sụt cân không rõ lý do."
  - "Đến cấp cứu ngay nếu ngất, khó thở khi nghỉ, đau ngực, nôn ra máu hoặc đi ngoài phân đen."
review:
  status: draft
  authors: ["agent:pass-b"]
  updated: "2026-10-25"
  notes_vi: "Mức xử trí 4 giữ như gợi ý: thiếu máu mạn, thường do thiếu sắt, cần xét nghiệm máu và tìm nguyên nhân trong vài ngày (1832/QĐ-BYT); mất máu cấp, khó thở, đau ngực, phân đen do quy tắc an toàn và các bệnh xuất huyết tiêu hóa, chửa ngoài tử cung xử trí. Điểm cần bác sĩ xem: (1) prior là ước lượng: thiếu máu rất phổ biến (20,5% phụ nữ 15–49 tuổi theo GHO) nhưng phần lớn nhẹ, chưa có số liệu về tỷ lệ là nguyên nhân chính của chóng mặt, hồi hộp, ngất; (2) tần suất triệu chứng theo mô tả của 1832/QĐ-BYT, không có tỷ lệ; (3) hệ số giới 1,2/0,7 tính tương đối với các nguyên nhân khác, áp dụng mọi lứa tuổi; (4) 'thiếu máu não' trong tiếng Việt thường dùng cho chóng mặt nói chung, không phải bệnh này, nên không đưa vào tên thường gọi; (5) mã D64.9 (thiếu máu không đặc hiệu) chưa đối chiếu với ICD-10 của Bộ Y tế; (6) lời khuyên ăn uống chỉ theo ý chung của 1832/QĐ-BYT (bổ sung sắt qua thức ăn), lời khuyên ngồi, nằm khi choáng theo NHS Fainting; cần bác sĩ duyệt."
