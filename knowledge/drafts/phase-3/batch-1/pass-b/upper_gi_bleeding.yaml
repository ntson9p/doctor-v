id: upper_gi_bleeding
names:
  vi: "Xuất huyết tiêu hóa trên"
  vi_common: ["Chảy máu dạ dày", "Xuất huyết dạ dày tá tràng", "Nôn ra máu, đi ngoài phân đen"]
  en: "Upper gastrointestinal bleeding"
codes:
  icd10: "K92.2"
  icd10_verified: true
summary_vi:
  - "Chảy máu ở thực quản, dạ dày hoặc tá tràng, hay gặp nhất do loét dạ dày tá tràng."
  - "Thường đi ngoài phân đen như hắc ín, nôn ra máu hoặc chất như bã cà phê, kèm choáng váng, da xanh."
  - "Mất máu nhiều có thể gây ngất, sốc, nguy hiểm tính mạng."
urgency: 2
cant_miss: true
specialties: [emergency, gastroenterology]
priors:
  - complaint: syncope
    default: P5
    by_age: { child_5_12: P6, teen_13_17: P6, adult_45_64: P4, elder_65_74: P4, elder_75p: P4 }
    evidence:
      tier: B
      basis: judgment
      sources: [esc-syncope-2018, anh-vjcm-2025, stanley-bmj-2017, esc-syncope-2018-practical]
      locator: "ESC 2018 bảng 6 (nghi chảy máu tiêu hóa: nguy cơ cao); Anh 2025 bảng 1, 3; Stanley 2017 bảng 1"
      reported: "Người xuất huyết do loét ở Nghệ An: ngất 5,7%, hoa mắt chóng mặt 84,3%, tuổi trung bình 56,6; nhóm quốc tế: tuổi trung vị 65"
      note: "Chưa có nghiên cứu về tỷ lệ xuất huyết tiêu hóa trong số người ngất ở cộng đồng. ESC xếp chảy máu tiêu hóa vào nguyên nhân ngất do giảm thể tích máu và là đặc điểm nguy cơ cao. Người xuất huyết tiêu hóa thường đi khám vì phân đen, nôn ra máu; chỉ một phần chọn Ngất làm triệu chứng chính. Ở Việt Nam, nhiễm H. pylori, dùng thuốc giảm đau chống viêm, rượu và xơ gan do viêm gan B hay gặp. Ước: người 18–44 tuổi P5; từ 45 tuổi P4; trẻ em, thanh thiếu niên P6. Cần bác sĩ duyệt."
  - complaint: dizziness
    default: P5
    by_age: { child_5_12: P6, teen_13_17: P6, elder_65_74: P4, elder_75p: P4 }
    evidence:
      tier: B
      basis: judgment
      sources: [anh-vjcm-2025, bosner-bmcfampract-2018, stanley-bmj-2017]
      reported: "Hoa mắt, chóng mặt 84,3% người xuất huyết do loét (Nghệ An)"
      note: "Phần lớn người xuất huyết tiêu hóa có hoa mắt, chóng mặt, nhưng chóng mặt ở tuyến ban đầu rất hay gặp và có nhiều nguyên nhân khác (Bösner), nên tỷ lệ xuất huyết trong số người chóng mặt thấp. Người dưới 65 tuổi P5; từ 65 tuổi P4; trẻ em, thanh thiếu niên P6. Ước lượng."
prior_modifiers:
  - when: { sex: [male] }
    factor: 1.4
    evidence:
      tier: B
      basis: numeric
      sources: [anh-vjcm-2025, stanley-bmj-2017, phuc-vjcm-2024]
      reported: "Nam/nữ 2,2/1 (Nghệ An); nam 58% (nhóm quốc tế); nam 94,5% ở xuất huyết do vỡ giãn tĩnh mạch (Thái Bình)"
      note: "Nam gấp khoảng 2 lần nữ: hệ số 1,4 cho nam, 0,7 cho nữ so với mức chung."
  - when: { sex: [female] }
    factor: 0.7
    evidence:
      tier: B
      basis: numeric
      sources: [anh-vjcm-2025, stanley-bmj-2017]
      reported: "Nam/nữ 2,2/1"
      note: "Xem hệ số của nam."
findings:
  - finding: black_stool
    freq: very_frequent
    evidence:
      tier: B
      basis: numeric
      sources: [anh-vjcm-2025, nhs-stomach-ulcer]
      locator: "Anh 2025 bảng 3; NHS Stomach ulcer (Call 999 or go to A&E)"
      reported: "Đi ngoài phân đen 63/70 (90,0%)"
      population: "Người xuất huyết do loét dạ dày tá tràng nằm viện ở Nghệ An"
      note: "Số liệu bệnh viện ở mức almost_always; hạ một mức (kb-guide mục 2.1) vì người tự kiểm tra có thể đến sớm, khi phân chưa kịp đen. Cùng cụm xuất huyết tiêu hóa với nôn ra máu."
  - finding: vomiting_blood
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [anh-vjcm-2025, phuc-vjcm-2024, nhs-stomach-ulcer]
      reported: "Nôn ra máu 50,0% (loét, Nghệ An); 71,8% (vỡ giãn tĩnh mạch thực quản, Thái Bình)"
      note: "Xuất huyết do loét hay gặp hơn do vỡ giãn tĩnh mạch nên chọn frequent. Tỷ lệ nền 1%."
  - finding: dizziness
    freq: very_frequent
    evidence:
      tier: B
      basis: numeric
      sources: [anh-vjcm-2025]
      reported: "Hoa mắt, chóng mặt 59/70 (84,3%)"
      note: "Có ý nghĩa với triệu chứng chính Ngất. Người nằm viện, nhưng chóng mặt là triệu chứng của mất máu ở mọi mức nên không hạ mức."
  - finding: fainting_or_near_fainting
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [anh-vjcm-2025, esc-syncope-2018]
      reported: "Ngất 4/70 (5,7%); hoa mắt, chóng mặt 59/70 (84,3%)"
      note: "Chỉ có ý nghĩa với Chóng mặt (với Ngất là dấu hiệu ngầm định; bệnh không có prior cho Hồi hộp). Câu hỏi gồm cả choáng như sắp ngất, hay gặp hơn ngất thật. Người xuất huyết tiêu hóa chọn Chóng mặt chủ yếu bị choáng do mất máu (ESC 2018: chảy máu gây giảm thể tích tuần hoàn), nên chọn frequent, cao hơn tỷ lệ nền 0,25 của danh mục khi Chóng mặt. Ước lượng."
  - finding: pallor
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [anh-vjcm-2025]
      reported: "Da xanh, niêm mạc nhợt 51/70 (72,9%)"
      note: "Số liệu bệnh viện ở mức very_frequent, hạ một mức cho người tự kiểm tra (người dùng tự nhận xét da nhợt kém chính xác). Tỷ lệ nền 0,15."
  - finding: abdominal_pain
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [anh-vjcm-2025, nhs-stomach-ulcer]
      reported: "Đau, nóng rát vùng thượng vị 49/70 (70%)"
      note: "Với Ngất và Chóng mặt, đau bụng không phải dấu hiệu ngầm định. Số liệu bệnh viện ở mức very_frequent, hạ một mức; xuất huyết do vỡ giãn tĩnh mạch thường không đau. Kèm ngất thì quy tắc rf_fainting_with_pain đã xếp mức 2."
  - finding: abd_pain_location
    dist: { epigastric: 0.7, right_upper: 0.08, left_upper: 0.06, periumbilical: 0.06, right_lower: 0.02, left_lower: 0.02, suprapubic: 0.01, whole: 0.05 }
    evidence:
      tier: B
      basis: verbal
      sources: [anh-vjcm-2025, nhs-stomach-ulcer]
      note: "Phân bố trong số người đã đau bụng. Đau vùng thượng vị (Nghệ An), bụng trên (NHS). Tỷ lệ từng vùng là ước lượng."
  - finding: regular_painkiller_use
    freq: frequent
    evidence:
      tier: B
      basis: numeric
      sources: [anh-vjcm-2025, nhs-stomach-ulcer]
      reported: "Dùng thuốc chống viêm không steroid 37,1%"
      note: "Thuốc giảm đau chống viêm là nguyên nhân loét (NHS). Tỷ lệ nền 0,05."
  - finding: chronic_liver_disease
    freq: occasional
    evidence:
      tier: B
      basis: numeric
      sources: [stanley-bmj-2017, phuc-vjcm-2024]
      reported: "Bệnh gan 15%, giãn tĩnh mạch 7% số người được nội soi (nhóm quốc tế)"
      note: "Xơ gan gây xuất huyết do vỡ giãn tĩnh mạch thực quản; ở Việt Nam viêm gan B và rượu hay gặp nên tỷ lệ có thể cao hơn nhóm quốc tế. Tỷ lệ nền 0,06."
  - finding: dizziness_on_standing
    freq: frequent
    evidence:
      tier: B
      basis: judgment
      sources: [anh-vjcm-2025, esc-syncope-2018]
      note: "Mất máu làm giảm thể tích tuần hoàn, gây hạ huyết áp khi đứng (ESC 2018: chảy máu là nguyên nhân hạ huyết áp thế đứng do giảm thể tích); 84,3% có hoa mắt, chóng mặt (Nghệ An). Ước khoảng một nửa. Tỷ lệ nền 0,15."
  - finding: syncope_trigger
    dist: { standing_heat: 0.1, emotion_pain: 0.05, standing_up: 0.3, toilet_cough: 0.2, exertion: 0.05, lying: 0.05, no_trigger: 0.25 }
    evidence:
      tier: B
      basis: judgment
      sources: [esc-syncope-2018]
      note: "Phân bố trong số người đã ngất hoặc suýt ngất. Ngất do giảm thể tích máu hay xảy ra khi vừa đứng dậy; người phân đen hay choáng, ngất khi đang đi ngoài. Ước lượng."
  - finding: not_recovered_after_faint
    freq: occasional
    evidence:
      tier: B
      basis: judgment
      sources: [esc-syncope-2018, anh-vjcm-2025]
      note: "Tính trong số người đã ngất hoặc suýt ngất. Mất máu tiếp diễn làm người bệnh mệt lả, choáng kéo dài sau ngất. Ước 20%. Tỷ lệ nền 0,05."
  - finding: pulse_measured
    dist: { lt_40: 0.003, n40_100: 0.24, n100_150: 0.15, gt_150: 0.007, not_measured: 0.6 }
    evidence:
      tier: B
      basis: numeric
      sources: [stanley-bmj-2017]
      reported: "Mạch trung vị 89 lần/phút; 95% số người trong khoảng 61–126"
      note: "'Chưa đo' giữ đúng tỷ lệ nền 0,6. Khoảng 35–40% số người đo được có mạch trên 100. Ước lượng."
  - finding: dizziness_pattern
    dist: { brief_episodes: 0.2, long_episodes: 0.25, continuous: 0.4, chronic: 0.15 }
    evidence:
      tier: C
      basis: judgment
      sources: [anh-vjcm-2025]
      note: "Tính trong số người chóng mặt. Chóng mặt do mất máu thường liên tục, nặng hơn khi đứng; chảy máu rỉ rả kéo dài gây thiếu máu, chóng mặt âm ỉ. Ước lượng."
warning_signs: [vomiting_blood, black_stool, fainting_or_near_fainting, cold_hands_feet, severe_weakness, confusion]
self_care_vi:
  - "Nằm nghỉ, nhờ người đưa đến khoa cấp cứu ngay; không tự lái xe."
  - "Không tự uống thêm thuốc giảm đau chống viêm."
  - "Mang theo các thuốc đang dùng, nhất là thuốc giảm đau, thuốc chống đông hoặc aspirin."
see_doctor_vi:
  - "Cần đến khoa cấp cứu ngay để được xét nghiệm máu và nội soi dạ dày."
  - "Gọi 115 nếu ngất, choáng nhiều, vã mồ hôi, da tái lạnh hoặc nôn ra nhiều máu."
review:
  status: draft
  authors: ["agent:pass-b"]
  updated: "2026-10-25"
  notes_vi: "Lượt B (Giai đoạn 3, lô 1, phần b). Đổi mức xử trí từ gợi ý 1 xuống 2, giữ không được bỏ sót. Lý do: NHS Stomach ulcer khuyên gọi 999 hoặc đến cấp cứu khi nôn ra máu, phân đen (theo quy ước của lượt R là mức 2); Stanley 2017: người có điểm Glasgow Blatchford từ 1 trở xuống có thể xử trí ngoại trú, nên ca điển hình chưa biến chứng chưa phải 'gọi 115'; ca có ngất, choáng, da tái lạnh, mệt lả đã được quy tắc nâng lên mức 1 (rf_syncope_gi_bleeding, rf_shock_cold_and_weak). Mức 2 kèm không được bỏ sót vẫn làm khả năng từ 1% đủ để khuyên đi cấp cứu. Điểm chưa chắc chắn: (1) prior là ước lượng, chưa có số liệu về xuất huyết tiêu hóa trong số người ngất, chóng mặt ở cộng đồng; (2) tần suất triệu chứng lấy từ 70 người nằm viện ở Nghệ An, đã hạ một mức với dấu hiệu nặng; (3) danh mục chưa có câu hỏi về uống viên sắt (làm phân đen); (4) chưa tìm thấy hướng dẫn của Bộ Y tế riêng về xuất huyết tiêu hóa trên; NICE CG141 không mở được nên không trích."
