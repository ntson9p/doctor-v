  notes_vi: "Lượt B Giai đoạn 3 lô 1 (phần b) bổ sung, giữ nguyên mọi giá trị đã có. Đã thêm: (1) prior cho Ngất (mặc định P4; 5–44 tuổi P6), Hồi hộp (mặc định P6; từ 45 tuổi P5), Chóng mặt (mặc định P6; 45–74 tuổi P5, từ 75 tuổi P4); (2) freq_by_complaint cho chest_pain_pressure: Ngất và Chóng mặt occasional, thêm nguồn georgeson-jgim-1992 và một đoạn ghi chú cuối note; freq_by_complaint cho fainting_or_near_fainting: Chóng mặt frequent (danh mục mới đặt tỷ lệ nền 0,25 cho dấu hiệu này khi Chóng mặt), thêm một đoạn ghi chú cuối note; (3) 5 liên kết mới: palpitations (occasional), syncope_trigger, syncope_warning, pulse_measured, dizziness_pattern. Nguồn mới: georgeson-jgim-1992; nguồn chép từ bản nháp mới: esc-syncope-2018-practical, maarsingh-annfammed-2010, weber-amjmed-1996 (trong extend/sources). Điểm chưa chắc chắn: prior cho ba triệu chứng mới là ước lượng, không có số liệu cộng đồng hay Việt Nam; với Ngất, mọi đau ngực đã là mức 1 (rf_chest_pain_with_features), và với Chóng mặt là rf_dizziness_chest_pain. Không sửa giá trị cũ. Ghi chú của lượt C trước đây: Lượt C đã đối chiếu 20 liên kết và mở lại mọi nguồn được trích. Bỏ hai liên kết chỉ có ở lượt A: 'nôn' (mức occasional bằng đúng tỷ lệ nền 20% khi đau bụng, không mang thông tin) và 'mệt mỏi' (nguồn chỉ mô tả bằng lời, câu trả lời 'Không' sẽ làm giảm một bệnh không được bỏ sót). Bác sĩ cần xem: (1) prior là ước lượng, chưa có số liệu tỷ lệ hội chứng mạch vành cấp trong người đau bụng ở tuyến ban đầu; (2) tần suất triệu chứng kèm lấy từ người bệnh tại viện ở mọi kiểu biểu hiện, chưa có số liệu riêng cho biểu hiện đau thượng vị (vã mồ hôi hạ một mức, khó thở giữ mức); (3) không dùng hệ số theo giới; (4) tỷ lệ nền của đái tháo đường, tăng huyết áp, hút thuốc trong danh mục không đổi theo tuổi và giới, làm các liên kết yếu tố nguy cơ kém chính xác."
