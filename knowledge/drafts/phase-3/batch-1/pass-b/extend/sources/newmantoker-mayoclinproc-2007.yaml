notes_vi: "Lượt B đọc tóm tắt qua API Europe PMC. 872 người chóng mặt ở 2 khoa cấp cứu (Mỹ). 62% chọn nhiều kiểu chóng mặt cùng lúc; khi chọn một kiểu duy nhất, 52% đổi câu trả lời khi hỏi lại sau khoảng 6 phút; trong 218 người không nêu cảm giác quay, 70% xác nhận 'quay hoặc chuyển động' khi được hỏi thẳng. Ngược lại, người bệnh kể thời gian kéo dài và yếu tố khởi phát của chóng mặt rõ ràng, nhất quán và tin cậy. Ý nghĩa cho doctor-v: câu hỏi kiểu cảm giác (vertigo_spinning) phân biệt kém; câu hỏi thời gian (dizziness_pattern) và yếu tố tư thế (dizziness_positional) đáng tin hơn."
