notes_vi: "Lượt B đọc tóm tắt qua API Europe PMC. NHAMCS 1993–2005 (Mỹ): chóng mặt chiếm 3,3% lượt cấp cứu (người từ 16 tuổi). Nhóm chẩn đoán: tai – tiền đình 32,9%, tim mạch 21,1%, hô hấp 11,5%, thần kinh 11,2% (gồm 4% mạch máu não), chuyển hóa 11,0%, chấn thương – ngộ độc 10,6%, tâm thần 7,2%, tiêu hóa 7,0%, tiết niệu – sinh dục 5,1%, nhiễm trùng 2,9%. Bệnh nguy hiểm định trước chiếm 15%, cao hơn ở người trên 50 tuổi (20,9% so với 9,3%)."
