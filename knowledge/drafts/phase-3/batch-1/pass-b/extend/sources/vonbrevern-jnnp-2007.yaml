notes_vi: "Lượt B đọc tóm tắt qua API Europe PMC và toàn văn trên PMC. Điều tra dân số trưởng thành ở Đức (sàng lọc 4869 người, phỏng vấn thần kinh – tai 1003 người chóng mặt vừa hoặc nặng). Tiêu chuẩn: ít nhất 5 cơn chóng mặt tiền đình dưới 1 phút, luôn do thay đổi tư thế đầu, không kèm triệu chứng thần kinh. Chóng mặt tư thế kịch phát lành tính chiếm 8% người chóng mặt vừa hoặc nặng, khoảng một phần ba người chóng mặt do tiền đình. Tỷ lệ mắc trọn đời 2,4%, 1 năm 1,6%, mới mắc 1 năm 0,6%. Bảng 2: tỷ lệ 1 năm 0,5% ở 18–39 tuổi, 1,7% ở 40–59 tuổi, 3,4% từ 60 tuổi; nữ 2,3% so với nam 0,9%; tuổi khởi phát trung bình 49,4. Bảng 4: cảm giác quay 86%, mất thăng bằng 49%, buồn nôn 33%, nôn 14%; yếu tố khởi phát: trở mình trên giường 85%, nằm xuống 74%, ngồi dậy từ tư thế nằm 58%, cúi người 55%, ngửa đầu 41%; mọi người bệnh đều bị khi ở trên giường. Đợt bệnh kéo dài trung vị 2 tuần (12,5% quá 12 tuần); 56% có nhiều đợt. 86% phải đi khám, nghỉ việc hoặc gián đoạn sinh hoạt. Liên quan độc lập với tuổi, đau nửa đầu (34% so với 10% ở nhóm chứng), tăng huyết áp, rối loạn mỡ máu, đột quỵ."
