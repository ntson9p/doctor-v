notes_vi: "Lượt B đọc toàn văn qua API Europe PMC (PMC9249276). Tiêu chuẩn: ít nhất 5 đợt triệu chứng tiền đình mức vừa hoặc nặng, mỗi đợt 5 phút đến 72 giờ; có tiền sử đau nửa đầu theo ICHD-3; ít nhất một nửa số đợt có đặc điểm đau nửa đầu (đau đầu có ít nhất 2 trong 4 đặc điểm, sợ ánh sáng và sợ tiếng ồn, hoặc tiền triệu thị giác). Triệu chứng tiền đình gồm chóng mặt tự phát, chóng mặt tư thế, chóng mặt do kích thích thị giác, chóng mặt khi cử động đầu kèm buồn nôn. Thời gian đợt: khoảng 30% vài phút, 30% vài giờ, 30% vài ngày, 10% chỉ vài giây (lặp lại khi cử động đầu, đổi tư thế). Có thể có nghe kém dao động, ù tai, đầy tai. Ảnh hưởng 1–2,7% dân số, 11% người khám ở trung tâm chóng mặt, 13% ở phòng khám đau đầu; 65–85% là nữ; hơn 50% có rối loạn tâm thần đi kèm. Chẩn đoán phân biệt: chóng mặt tư thế kịch phát lành tính, bệnh Ménière, cơn thiếu máu não thoáng qua ở người cao tuổi có yếu tố nguy cơ mạch máu."
