notes_vi: "Lượt B đọc tóm tắt qua API Europe PMC. Sáu khoa cấp cứu ở New England (Mỹ), trong 5.762 người có triệu chứng nghi thiếu máu cơ tim: 251 người ngất không đau ngực; 18 người (7%) có thiếu máu cơ tim cấp, và cả 18 người đều có thay đổi thiếu máu trên điện tim lúc vào viện. Liên quan với thiếu máu cơ tim: điện tim bất thường, đau tay hoặc vai, ran phổi, tiền sử đau thắt ngực khi gắng sức, nhồi máu cơ tim cũ. Nhóm được chọn vì nghi thiếu máu cơ tim nên tỷ lệ cao hơn ở mọi người ngất."
