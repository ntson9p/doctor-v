notes_vi: "Lượt B đọc tóm tắt qua API Europe PMC. 190 người hồi hộp liên tiếp ở một trung tâm y khoa đại học (Mỹ), theo dõi 1 năm: tìm được nguyên nhân ở 84%; do tim 43%, tâm thần 31%, nguyên nhân khác 10%, không rõ 16%. Tử vong sau 1 năm 1,6%, đột quỵ 1,1%; 75% bị hồi hộp lại trong năm đầu. Chi tiết từng loại rối loạn nhịp lấy theo bản tóm tắt trong raviele-europace-2011."
