notes_vi: "Lượt B đọc tóm tắt (Europe PMC) và toàn văn trên annfammed.org (bảng 3, 5 không hiện chữ). 417 người 65–95 tuổi đi khám bác sĩ gia đình ở Hà Lan vì chóng mặt kéo dài: kiểu tiền ngất (choáng như sắp ngất) 69%, chóng mặt quay 41%, mất thăng bằng 40%, 44% có từ 2 kiểu. Nguyên nhân chính hay gặp nhất là bệnh tim mạch (gồm mạch máu não) 57%, tiếp đến bệnh tiền đình ngoại biên 14%, bệnh tâm thần 10%; tác dụng phụ của thuốc là nguyên nhân phụ hay gặp nhất (23%); 62% có nhiều hơn một nguyên nhân; 33% dùng trên 5 thuốc. Bài không tách riêng hạ huyết áp thế đứng, rối loạn nhịp hay thiếu máu."
