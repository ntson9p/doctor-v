notes_vi: "Lượt B đọc toàn văn trên PMC (bản 2). Nghiên cứu tiến cứu 150 người lớn sốt xuất huyết Dengue nằm viện ở Mangalore (Ấn Độ), 2011–2015; 23 người (15,3%) thành Dengue nặng. Huyết áp tâm thu giảm khi đứng trung bình 14,83% ở nhóm nặng so với 8,36% ở nhóm không nặng; giảm hơn 10,33% dự báo Dengue nặng (độ nhạy 87%, độ đặc hiệu 82,7%). Bài ghi hướng dẫn của CDC và PAHO xếp hạ huyết áp tư thế vào dấu hiệu cảnh báo, còn hướng dẫn WHO thì không. Không báo cáo tỷ lệ chóng mặt hay ngất."
