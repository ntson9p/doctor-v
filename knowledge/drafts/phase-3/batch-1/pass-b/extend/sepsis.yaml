  notes_vi: "Lượt B Giai đoạn 3 lô 1 (phần b) bổ sung, giữ nguyên mọi giá trị đã có. Đã thêm: (1) prior cho Ngất (mặc định P5; 5–17 tuổi P6; từ 65 tuổi P4) và Chóng mặt (mặc định P5; 5–17 tuổi P6; từ 75 tuổi P4); (2) 6 liên kết mới: fever (frequent; với hai triệu chứng chính này sốt không được ngầm định), pulse_measured, syncope_trigger, dizziness_on_standing (frequent), not_recovered_after_faint (occasional), dizziness_pattern. (3) freq_by_complaint cho fainting_or_near_fainting: Chóng mặt frequent (danh mục mới đặt tỷ lệ nền 0,25 cho dấu hiệu này khi Chóng mặt), thêm một đoạn ghi chú cuối note. Nguồn chép từ bản nháp mới: esc-syncope-2018-practical; bosner-bmcfampract-2018 dùng bản đã có trong extend/sources. Điểm chưa chắc chắn: prior là ước lượng, không có số liệu về nhiễm khuẩn huyết trong số người ngất, chóng mặt; tần suất sốt lấy từ khoa cấp cứu Thái Lan (tuổi trung vị 67); các liên kết có sẵn (lú lẫn, khó thở, tay chân lạnh...) lấy từ người bệnh đi khám vì sốt. Không sửa giá trị cũ. Ghi chú trước đây: Mức xử trí 1, thuộc nhóm không được bỏ sót (kb-guide mục 2.5; 5642: tử vong 20–50%; NHS: gọi 999 khi có dấu hiệu). Lượt C bỏ: tiểu buốt (4,3% khi đến khám, không phân biệt), nôn liên tục (không có số liệu; đã có quy tắc mức 3), để tránh làm mọi ca nhiễm trùng tiết niệu, tiêu chảy có sốt bị đẩy lên mức cấp cứu chỉ vì xác suất. Không liên kết ăn tiết canh, giết mổ lợn: chưa có số liệu tỷ lệ liên cầu lợn trong toàn bộ nhiễm khuẩn huyết. Không dùng NICE NG253/NG254 vì nice.org.uk chặn truy cập trực tiếp. Điểm cần bác sĩ xem: (1) prior hoàn toàn là ước lượng, nhất là trẻ 2 tháng–5 tuổi (P4 hay P5); (2) tần suất triệu chứng lấy từ nghiên cứu ở khoa cấp cứu Thái Lan và người cao tuổi Hà Lan; (3) mô hình một bệnh: nhiễm khuẩn huyết thường đi kèm viêm phổi, viêm thận – bể thận, nên xác suất bị chia với bệnh nguồn; (4) MONDO:0005229 là 'bacterial infectious disease with sepsis'."
