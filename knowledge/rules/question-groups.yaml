# Nhóm câu hỏi chọn nhiều. Mục được chọn = "có"; mục không chọn = "không có";
# chọn "Tôi không rõ" (khi allow_unknown) = mọi mục "không rõ". Tối đa 7 mục mỗi nhóm.
- id: young_infant_danger_signs
  title_vi: "Bé có dấu hiệu nào sau đây không?"
  findings:
    - young_infant_not_feeding
    - seizure_recent
    - young_infant_fast_breathing
    - young_infant_low_temp
    - young_infant_reduced_movement
    - bulging_fontanelle
    - fever
  none_label_vi: "Không có dấu hiệu nào ở trên"
  allow_unknown: true
  applies_to:
    age_groups: [infant_0_2m]
- id: child_danger_signs
  title_vi: "Bé có dấu hiệu nào sau đây không?"
  findings: [child_unable_to_drink, child_vomits_everything, seizure_recent, drowsy_hard_to_wake, bulging_fontanelle]
  none_label_vi: "Không có dấu hiệu nào ở trên"
  allow_unknown: true
  applies_to:
    age_groups: [child_2m_5y]
- id: fever_red_flags
  title_vi: "Có dấu hiệu nào sau đây không?"
  findings:
    - neck_stiffness
    - confusion
    - drowsy_hard_to_wake
    - breathing_difficulty
    - persistent_vomiting
    - cold_hands_feet
    - severe_weakness
  none_label_vi: "Không có dấu hiệu nào ở trên"
  allow_unknown: true
  applies_to:
    age_groups: [child_2m_5y, child_5_12, teen_13_17, adult_18_44, adult_45_64, elder_65_74, elder_75p]
  # Hỏi cho mọi triệu chứng chính khi có sốt: nhiễm khuẩn huyết có thể bắt đầu từ đau bụng (viêm đường
  # mật, viêm thận – bể thận) hoặc đau đầu (viêm màng não) (lượt C lô 2).
  requires:
    - { finding: fever, is: present }
# Dấu hiệu nguy hiểm toàn thân cho đau bụng và đau đầu (sốt đã có nhóm fever_red_flags). Hỏi một lần
# ở đầu phiên: khi lú lẫn, li bì và dấu hiệu sốc là quy tắc mức 1, chúng có giá trị câu hỏi rất cao, nên
# nếu không hỏi trước thì bị hỏi lẻ từng câu giữa phiên ở mọi ca, kể cả đau bụng kinh (người bảo trì,
# 25/10/2026).
- id: general_danger_signs
  title_vi: "Có dấu hiệu nào sau đây không?"
  findings:
    - confusion
    - drowsy_hard_to_wake
    - breathing_difficulty
    - cold_hands_feet
    - severe_weakness
  none_label_vi: "Không có dấu hiệu nào ở trên"
  allow_unknown: true
  applies_to:
    age_groups: [child_2m_5y, child_5_12, teen_13_17, adult_18_44, adult_45_64, elder_65_74, elder_75p]
- id: fever_associated
  title_vi: "Ngoài sốt, còn có triệu chứng nào sau đây không?"
  findings: [cough, sore_throat, runny_nose, headache, abdominal_pain, diarrhea, rash_any]
  none_label_vi: "Không có triệu chứng nào ở trên"
- id: abdominal_red_flags
  title_vi: "Có dấu hiệu nào sau đây không?"
  findings:
    - abd_pain_severe
    - abdomen_hard_swollen
    - vomiting_blood
    - black_stool
    - fainting_or_near_fainting
    - no_stool_or_gas
    - persistent_vomiting
  none_label_vi: "Không có dấu hiệu nào ở trên"
  allow_unknown: true
  # Hỏi cả khi triệu chứng chính là sốt mà có đau bụng (viêm ruột thừa ở trẻ hay khởi đầu bằng sốt).
  requires:
    - { finding: abdominal_pain, is: present }
- id: abdominal_associated
  title_vi: "Ngoài đau bụng, còn có triệu chứng nào sau đây không?"
  findings: [fever, nausea, vomiting, diarrhea, dysuria, vaginal_bleeding, heartburn]
  none_label_vi: "Không có triệu chứng nào ở trên"
- id: headache_red_flags
  title_vi: "Có dấu hiệu nào sau đây không?"
  findings:
    - headache_thunderclap
    - neck_stiffness
    - confusion
    - seizure_recent
    - vision_loss_or_double
    - sudden_loss_of_balance
    - headache_after_head_injury
  none_label_vi: "Không có dấu hiệu nào ở trên"
  allow_unknown: true
- id: headache_associated
  title_vi: "Ngoài đau đầu, còn có triệu chứng nào sau đây không?"
  findings: [fever, nausea, vomiting, photophobia, nasal_congestion, stress_poor_sleep]
  none_label_vi: "Không có triệu chứng nào ở trên"
- id: fever_exposures
  title_vi: "Có điều nào sau đây không?"
  findings:
    - malaria_area_exposure
    - bush_exposure
    - dengue_nearby
    - sick_contact_respiratory
    - measles_contact
    - flood_mud_exposure
    - heat_exposure
  none_label_vi: "Không có điều nào ở trên"
  # Tiền sử dịch tễ khi có sốt (sốt rét, sốt mò, sốt xuất huyết, cúm, sởi): hỏi cho mọi triệu chứng chính.
  requires:
    - { finding: fever, is: present }
- id: chronic_conditions
  title_vi: "Có bệnh nền hoặc tình trạng nào sau đây không?"
  findings: [diabetes, hypertension_known, known_heart_disease, immunocompromised]
  none_label_vi: "Không có bệnh nào ở trên"
  allow_unknown: true
  applies_to:
    age_groups: [teen_13_17, adult_18_44, adult_45_64, elder_65_74, elder_75p]

# ---------- Giai đoạn 3, lô 1: chóng mặt, ngất, hồi hộp ----------
# Lượt R (25/10/2026): thêm "ngất hoặc choáng như sắp ngất" vào nhóm của Chóng mặt (NHS Dizziness, ESC 2018:
# tiền ngất xử trí như ngất; là điều kiện của nhiều quy tắc ngất) và "hồi hộp" vào nhóm của Ngất (NHS Fainting:
# người ngất có hồi hộp thì gọi 999; ESC 2018: hồi hộp lúc ngất là nguy cơ cao).
- id: dizziness_red_flags
  title_vi: "Cùng với chóng mặt, có dấu hiệu nào sau đây không?"
  findings:
    - vision_loss_or_double
    - cannot_walk_unaided
    - transient_neuro_symptoms
    - chest_pain_pressure
    - breathing_difficulty
    - fainting_or_near_fainting
    - black_stool
  none_label_vi: "Không có dấu hiệu nào ở trên"
  allow_unknown: true
- id: syncope_red_flags
  title_vi: "Lần ngất hoặc suýt ngất này có kèm dấu hiệu nào sau đây không?"
  findings:
    - chest_pain_pressure
    - breathing_difficulty
    - palpitations
    - abdominal_pain
    - headache
    - black_stool
    - vomiting_blood
  none_label_vi: "Không có dấu hiệu nào ở trên"
  allow_unknown: true
- id: palpitations_red_flags
  title_vi: "Khi tim đập nhanh, có dấu hiệu nào sau đây không?"
  findings:
    - chest_pain_pressure
    - breathing_difficulty
    - fainting_or_near_fainting
  none_label_vi: "Không có dấu hiệu nào ở trên"
  allow_unknown: true
- id: dizziness_associated
  title_vi: "Ngoài chóng mặt, còn có triệu chứng nào sau đây không?"
  findings: [vomiting, hearing_loss_tinnitus, headache, palpitations, diarrhea, fever]
  none_label_vi: "Không có triệu chứng nào ở trên"
- id: syncope_associated
  title_vi: "Gần đây còn có triệu chứng nào sau đây không?"
  findings: [palpitations, dizziness, vomiting, diarrhea, fever]
  none_label_vi: "Không có triệu chứng nào ở trên"
- id: palpitations_associated
  title_vi: "Ngoài hồi hộp, còn có triệu chứng nào sau đây không?"
  findings: [dizziness, tremor, panic_fear, weight_loss_unintended, breathless_on_exertion, cold_sweat]
  none_label_vi: "Không có triệu chứng nào ở trên"

# ---------- Giai đoạn 3, lô 2 ----------
- id: kawasaki_signs
  title_vi: "Trẻ có dấu hiệu nào sau đây không?"
  findings:
    - red_eyes
    - red_lips_strawberry_tongue
    - hands_feet_swelling_peeling
    - lymph_node_swelling
    - bcg_scar_red
  none_label_vi: "Không có dấu hiệu nào ở trên"
  allow_unknown: true
  # Sốt từ 3 ngày ở trẻ: bệnh Kawasaki cần điều trị trong 10 ngày đầu (AHA 2017; lượt C lô 2 phần b đề xuất).
  applies_to:
    age_groups: [child_2m_5y, child_5_12]
  requires:
    - { finding: fever, is: present }
    - { finding: fever_duration, in: [d3_5, d6_7, gt_7d] }
- id: child_diabetes_signs
  title_vi: "Gần đây trẻ có dấu hiệu nào sau đây không?"
  findings:
    - thirst_polyuria
    - weight_loss_unintended
  none_label_vi: "Không có dấu hiệu nào ở trên"
  allow_unknown: true
  # Đau bụng kèm nôn ở trẻ có thể là nhiễm toan ceton, cách đái tháo đường típ 1 hay khởi phát
  # (NICE NG18; lượt C lô 2 phần a đề xuất).
  applies_to:
    age_groups: [child_2m_5y, child_5_12, teen_13_17]
  requires:
    - { finding: vomiting, is: present }
