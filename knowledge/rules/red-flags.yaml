# Quy tắc mức xử trí (docs/kb-guide.md, mục 4.7). Mức xử trí cuối cùng là mức khẩn nhất
# trong các quy tắc thỏa mãn và mức suy ra từ xác suất (docs/engine-spec.md).
# Trạng thái: người bảo trì soạn; agent lượt R (agent:pass-r, 2026-10-24) đã đối chiếu nguồn,
# sửa mức, điều kiện, nguồn và thêm quy tắc. Biên bản: knowledge/drafts/review-rules.md.
# Vẫn cần bác sĩ duyệt trước khi phát hành.
#
# `conditions`: bệnh mà quy tắc nhằm phát hiện. Khi quy tắc mức 1–2 thỏa, các bệnh này luôn đứng đầu
# danh sách "Bác sĩ cần loại trừ", kể cả khi rất hiếm (não mô cầu khi có ban xuất huyết). Chỉ dùng để hiển thị.
#
# Quy tắc không ghi `complaints` áp dụng cho mọi triệu chứng chính, và dấu hiệu của nó có thể được
# hỏi thích ứng ở mọi triệu chứng chính. Quy tắc chỉ hợp với một số triệu chứng chính (thoát vị,
# phân nhầy máu, dấu hiệu đột quỵ B–E…) phải ghi phạm vi, nếu không người sốt sẽ bị hỏi về khối
# thoát vị (lượt C lô 2, người bảo trì).

# ---------- Trẻ nhỏ ----------
- id: rg_young_infant_any
  level: 3
  when: { age_groups: [infant_0_2m] }
  reason_vi: "Trẻ dưới 2 tháng tuổi bị bệnh cần được nhân viên y tế khám sớm."
  evidence:
    tier: B
    basis: judgment
    sources: [who-imci-chart-booklet-2014]
    locator: "IMCI Chart booklet: Assess and classify the sick young infant"
    note: "Chính sách an toàn của doctor-v (docs/plan.md, mục 3.1): trẻ dưới 2 tháng luôn được khuyên đi khám, không xếp hạng bệnh. IMCI cho phép chăm sóc tại nhà khi không có dấu hiệu bệnh rất nặng hay nhiễm khuẩn tại chỗ, nên mức 3 thận trọng hơn nguồn; chờ bác sĩ duyệt."
- id: rg_young_infant_danger_sign
  level: 2
  conditions: [sepsis, bacterial_meningitis, pneumonia]
  when:
    all:
      - { age_groups: [infant_0_2m] }
      - any:
          - { finding: young_infant_not_feeding, is: present }
          - { finding: seizure_recent, is: present }
          - { finding: young_infant_fast_breathing, is: present }
          - { finding: young_infant_low_temp, is: present }
          - { finding: young_infant_reduced_movement, is: present }
          - { finding: bulging_fontanelle, is: present }
  reason_vi: "Trẻ dưới 2 tháng có dấu hiệu nguy hiểm cần được đưa đi cấp cứu ngay."
  evidence:
    tier: B
    basis: verbal
    sources: [who-imci-chart-booklet-2014, nice-ng143]
    locator: "IMCI: Check for very severe disease and local bacterial infection (young infant); NG143 bảng 2"
    note: "IMCI 2014: bú kém, co giật, thở nhanh từ 60 lần/phút hoặc rút lõm lồng ngực nặng, nhiệt độ dưới 35,5°C (đo ở nách), chỉ cử động khi bị kích thích hoặc không cử động là bệnh rất nặng, chuyển viện khẩn. Thóp phồng không có trong danh sách IMCI 2014; lượt R thêm NG143 (thóp phồng: nhóm đỏ). Sốt từ 37,5°C (IMCI) do quy tắc rg_fever_under_3_months xử lý."
- id: rg_fever_under_3_months
  level: 2
  conditions: [sepsis, bacterial_meningitis, acute_pyelonephritis]
  when:
    all:
      - { age_months_lt: 3 }
      - { finding: fever, is: present }
  reason_vi: "Trẻ dưới 3 tháng tuổi bị sốt cần được khám cấp cứu ngay."
  evidence:
    tier: B
    basis: verbal
    sources: [nice-ng143, who-imci-chart-booklet-2014, nice-ng254]
    locator: "NG143 khuyến cáo 1.2.12, 1.3.3, bảng 2; IMCI young infant; NG254 bảng 1"
    note: "NG143 xếp trẻ dưới 3 tháng có nhiệt độ từ 38°C vào nhóm nguy cơ cao (đỏ); khi đánh giá từ xa, trẻ có dấu hiệu đỏ cần được khám trực tiếp trong 2 giờ. IMCI coi sốt từ 37,5°C (đo ở nách) ở trẻ dưới 2 tháng là bệnh rất nặng. doctor-v định nghĩa sốt từ 37,5°C nên với trẻ 2–3 tháng có thể xếp cao hơn NICE một chút (chấp nhận để an toàn)."
- id: rg_child_general_danger_sign
  level: 2
  conditions: [sepsis, bacterial_meningitis, pneumonia]
  when:
    all:
      - { age_groups: [child_2m_5y] }
      - any:
          - { finding: child_unable_to_drink, is: present }
          - { finding: child_vomits_everything, is: present }
          - { finding: seizure_recent, is: present }
          - { finding: drowsy_hard_to_wake, is: present }
  reason_vi: "Trẻ có dấu hiệu nguy hiểm toàn thân cần được đưa đi cấp cứu ngay."
  evidence:
    tier: B
    basis: verbal
    sources: [who-imci-chart-booklet-2014]
    locator: "IMCI Chart booklet: Check for general danger signs"
    note: "Bất kỳ dấu hiệu nguy hiểm toàn thân nào (không uống hoặc không bú được, nôn tất cả, co giật, li bì hoặc hôn mê) cần xử trí khẩn và chuyển viện khẩn."
- id: rf_bulging_fontanelle
  level: 2
  conditions: [bacterial_meningitis]
  when: { finding: bulging_fontanelle, is: present }
  reason_vi: "Thóp phồng căng có thể là viêm màng não, cần đưa bé đi cấp cứu ngay."
  evidence:
    tier: B
    basis: judgment
    sources: [nice-ng143, nhs-meningitis, curtis-pediatrics-2010]
    locator: "NG143 bảng 2; NHS Meningitis (triệu chứng ở trẻ dưới 5 tuổi); Curtis 2010 (tóm tắt)"
    note: "Lượt C lô 2 đề xuất. NG143 xếp thóp phồng ở trẻ sốt vào nhóm đỏ; NHS liệt kê thóp phồng trong các dấu hiệu viêm màng não cần gọi 999 hoặc đến cấp cứu; Curtis 2010: bệnh sử thóp phồng LR 8,0. Quy tắc không đòi hỏi sốt vì không sốt chưa loại trừ được viêm màng não (Curtis 2010: LR 0,70) và thóp phồng còn gặp khi áp lực trong sọ tăng do nguyên nhân khác; phần mở rộng này là nhận định, chờ bác sĩ duyệt. Trẻ dưới 2 tháng đã có quy tắc rg_young_infant_danger_sign."
- id: rf_child_dehydration
  level: 3
  when:
    all:
      - { age_groups: [child_2m_5y, child_5_12] }
      - any:
          - { finding: diarrhea, is: present }
          - { finding: persistent_vomiting, is: present }
      - any:
          - { finding: sunken_eyes, is: present }
          - { finding: decreased_urine, is: present }
  reason_vi: "Trẻ có dấu hiệu mất nước cần được khám trong hôm nay."
  evidence:
    tier: B
    basis: judgment
    sources: [who-imci-chart-booklet-2014, nice-ng143]
    locator: "IMCI: Does the child have diarrhoea? (phân loại mất nước); NG143 bảng 2 (tiểu ít: vàng)"
    note: "IMCI: 'có mất nước' cần 2 dấu hiệu (vật vã, mắt trũng, uống háo hức, nếp véo da mất chậm) và được bù dịch tại cơ sở y tế (phác đồ B); mất nước nặng kèm li bì hoặc không uống được đã do quy tắc dấu hiệu nguy hiểm bắt (mức 2). Tiểu ít không có trong IMCI, lấy từ NG143 (nhóm vàng). Chỉ cần 1 dấu hiệu là lựa chọn thận trọng; lượt R đổi cơ sở thành judgment, chờ bác sĩ duyệt."
- id: rf_hfmd_startle
  level: 2
  conditions: [hand_foot_mouth_disease]
  when:
    all:
      - any:
          - { finding: hand_foot_blisters, is: present }
          - { finding: mouth_ulcers, is: present }
      - { finding: startle_myoclonus, is: present }
  reason_vi: "Trẻ nghi tay chân miệng mà hay giật mình, chới với cần được khám ngay."
  evidence:
    tier: B
    basis: verbal
    sources: [byt-qd-292-2024]
    locator: "292/QĐ-BYT mục II.6.2 (độ 2a, 2b), III.2 (phân tuyến), III.3.1 (dấu hiệu cần tái khám ngay)"
    note: "Bệnh sử có giật mình dưới 2 lần/30 phút và không thấy khi khám là độ 2a; từ 2 lần/30 phút hoặc thấy khi khám là độ 2b nhóm 1. Từ độ 2a phải điều trị nội trú; trạm y tế xã và phòng khám tư nhân phải chuyển tuyến. Giật mình là dấu hiệu cần đưa trẻ tái khám ngay."
- id: rf_hfmd_warning_signs
  level: 2
  conditions: [hand_foot_mouth_disease]
  when:
    all:
      - { age_groups: [child_2m_5y, child_5_12] }
      - any:
          - { finding: hand_foot_blisters, is: present }
          - { finding: mouth_ulcers, is: present }
      - any:
          - { finding: fever_max_temp, in: [ge_39] }
          - { finding: fever_duration, in: [d3_5, d6_7, gt_7d] }
          - { finding: persistent_vomiting, is: present }
          - { finding: breathing_difficulty, is: present }
  reason_vi: "Trẻ nghi tay chân miệng có sốt cao, sốt trên 2 ngày, nôn nhiều hoặc thở nhanh cần được khám ngay."
  evidence:
    tier: B
    basis: verbal
    sources: [byt-qd-292-2024]
    locator: "292/QĐ-BYT mục III.3.1 (dấu hiệu cần tái khám ngay), II.6.2.1 (độ 2a), II.6.3 (độ 3)"
    note: "Quy tắc mới của lượt R. Hướng dẫn dặn đưa trẻ tái khám ngay khi sốt trên 39°C hoặc kéo dài trên 48 giờ, nôn ói nhiều, thở nhanh, khó thở; các dấu hiệu khác trong danh sách (lừ đừ, bỏ bú, giật mình, da nổi bông, co giật, hôn mê) đã có quy tắc riêng. Sốt cao hoặc trên 2 ngày kèm nôn nhiều, lừ đừ là độ 2a; thở nhanh, khó thở là độ 3. Lựa chọn 'từ 39°C' gồm cả đúng 39°C (thận trọng hơn nguồn một chút)."
- id: rf_hfmd_infant
  level: 3
  when:
    all:
      - { age_months_lt: 12 }
      - any:
          - { finding: hand_foot_blisters, is: present }
          - { finding: mouth_ulcers, is: present }
  reason_vi: "Trẻ dưới 12 tháng nghi tay chân miệng cần được khám ở bệnh viện sớm."
  evidence:
    tier: B
    basis: verbal
    sources: [byt-qd-292-2024]
    locator: "292/QĐ-BYT mục III.2.1 (phân tuyến: trạm y tế xã và phòng khám tư nhân)"
    note: "Quy tắc mới của lượt R. Trạm y tế xã và phòng khám tư nhân phải chuyển tuyến bệnh tay chân miệng độ 1 ở trẻ dưới 12 tháng."

# ---------- Sốt và nhiễm trùng nặng ----------
- id: rf_neck_stiffness
  level: 2
  conditions: [bacterial_meningitis, subarachnoid_hemorrhage]
  when: { finding: neck_stiffness, is: present }
  reason_vi: "Cứng gáy có thể là dấu hiệu viêm màng não hoặc chảy máu trong não."
  evidence:
    tier: B
    basis: verbal
    sources: [nice-ng240, nice-ng143, nice-ng228, who-imci-chart-booklet-2014]
    locator: "NG240 bảng 1–2, khuyến cáo 1.1.7; NG143 bảng 2 (đỏ); NG228 khuyến cáo 1.1.3, 1.1.5; IMCI: Fever (very severe febrile disease)"
    note: "Lượt R bỏ CG150 khỏi nguồn vì CG150 không nêu cứng gáy. Cứng gáy là dấu hiệu của viêm màng não (NG240: chuyển viện cấp cứu; IMCI: chuyển viện khẩn) và của xuất huyết dưới nhện (NG228: chuyển ngay đến khoa cấp cứu)."
- id: rf_fever_non_blanching_rash
  level: 2
  conditions: [bacterial_meningitis, sepsis, dengue]
  when:
    all:
      - { finding: fever, is: present }
      - { finding: rash_non_blanching, is: present }
  reason_vi: "Sốt kèm nốt đỏ tím không mất khi ấn cần được khám ngay để loại trừ bệnh nặng."
  evidence:
    tier: B
    basis: verbal
    sources: [nice-ng143, nice-ng240, nice-ng253, nice-ng254, byt-qd-2760-2023]
    locator: "NG143 bảng 2, khuyến cáo 1.2.18; NG240 khuyến cáo 1.1.9, 1.1.13; NG253 bảng 1; NG254 bảng 1–3; 2760 mục III.2"
    note: "NICE: sốt kèm ban không mất khi ấn là nguy cơ cao, nghĩ bệnh não mô cầu, chuyển viện cấp cứu. Theo 2760, chấm xuất huyết dưới da lại là biểu hiện của sốt xuất huyết chưa có dấu hiệu cảnh báo (điều trị ngoại trú); 2760 chỉ hỗ trợ việc nghĩ đến nhiễm khuẩn huyết do não mô cầu, liên cầu lợn trong chẩn đoán phân biệt. Giữ mức 2 để không bỏ sót nhiễm khuẩn huyết, chấp nhận xếp cao hơn cần ở một số ca sốt xuất huyết."
- id: rf_non_blanching_rash
  level: 2
  conditions: [bacterial_meningitis, sepsis]
  when: { finding: rash_non_blanching, is: present }
  reason_vi: "Nốt đỏ tím không mất khi ấn cần được khám cấp cứu, kể cả khi không sốt."
  evidence:
    tier: B
    basis: verbal
    sources: [nice-ng240, nhs-stomach-ache, nhs-headaches]
    locator: "NG240 khuyến cáo 1.1.9, 1.1.10, 1.1.13; NHS Stomach ache và Headaches (Call 999 or go to A&E)"
    note: "Quy tắc mới của lượt R. NG240: ban xuất huyết lan nhanh hoặc nốt trên 2 mm thì nghĩ nhiều bệnh não mô cầu và chuyển viện cấp cứu; không loại trừ bệnh chỉ vì chưa sốt. NHS: đau bụng hoặc đau đầu kèm ban không mất khi ấn thì gọi 999 hoặc đến cấp cứu."
- id: rf_altered_consciousness
  level: 1
  conditions: [bacterial_meningitis, sepsis, stroke, hypoglycemia, carbon_monoxide_poisoning]
  when:
    any:
      - { finding: confusion, is: present }
      - { finding: drowsy_hard_to_wake, is: present }
  reason_vi: "Lú lẫn hoặc li bì là dấu hiệu bệnh nặng: gọi 115 hoặc nhờ người đưa đi cấp cứu ngay."
  evidence:
    tier: B
    basis: judgment
    sources: [nice-ng253, nice-ng254, who-imci-chart-booklet-2014, byt-qd-2760-2023, nhs-sepsis]
    locator: "NG253 bảng 1; NG254 bảng 1–3; IMCI general danger signs; 2760 Phụ lục 2, mục IV.A.3.b; NHS Sepsis"
    note: "Lượt R thay NG51 (đã bị thay thế) bằng NG253 và NG254: thay đổi ý thức mới là tiêu chí nguy cơ cao. IMCI: li bì hoặc hôn mê là dấu hiệu nguy hiểm toàn thân. 2760: vật vã, lừ đừ, li bì là dấu hiệu cảnh báo; lú lẫn là dấu hiệu cần đến khám lại ngay. Người bảo trì nâng mức 2 lên mức 1 (25/10/2026): NHS khuyên gọi 999 khi lú lẫn, li bì (Sepsis, Meningitis); người lú lẫn, li bì không tự đến viện an toàn được, và hành động của mức 1 gồm cả nhờ người đưa đến cấp cứu. Lần chạy đầu bộ ca giữ kín: 5/8 ca cần mức 1 mà app ra mức 2 có lú lẫn hoặc li bì. Chờ bác sĩ duyệt."
- id: rf_shock_signs
  level: 2
  conditions: [sepsis, dengue]
  when:
    any:
      - { finding: cold_hands_feet, is: present }
      - { finding: severe_weakness, is: present }
  reason_vi: "Tay chân lạnh hoặc mệt lả có thể là dấu hiệu sốc."
  evidence:
    tier: B
    basis: verbal
    sources: [byt-qd-2760-2023, nice-ng253, nice-ng254, byt-qd-3377-2023]
    locator: "2760 mục II.2.1, IV.A.3.b; NG253 bảng 1; NG254 bảng 1–2; 3377 mục 3.2.2"
    note: "2760: tay chân lạnh, ẩm và mệt lả, bứt rứt là dấu hiệu cần đến khám lại ngay; lạnh đầu chi, da nổi vân tím là biểu hiện sốc. NICE: da loang lổ hoặc xám tái là nguy cơ cao; tay chân lạnh là nguy cơ trung bình–cao ở trẻ dưới 12 tuổi. 3377: suy sụp (không tự ngồi, đứng, đi được) là tiêu chuẩn sốt rét ác tính. Lượt R thay NG51 bằng NG253, NG254."
- id: rf_shock_multiple_signs
  level: 1
  conditions: [sepsis, dengue, ectopic_pregnancy]
  # Chóng mặt, Ngất, Hồi hộp dùng rf_shock_cold_and_weak: ở đó ngất hoặc choáng luôn có hoặc rất hay gặp,
  # nên nhánh "ngất" sẽ đẩy người còn tái sau một lần ngất thông thường lên mức 1 (lượt R lô 1).
  complaints: [abdominal_pain, fever, headache]
  when:
    all:
      - { finding: cold_hands_feet, is: present }
      - any:
          - { finding: severe_weakness, is: present }
          - { finding: decreased_urine, is: present }
          - { finding: fainting_or_near_fainting, is: present }
  reason_vi: "Tay chân lạnh, da tái kèm mệt lả, tiểu ít hoặc ngất là dấu hiệu sốc: gọi 115 ngay."
  evidence:
    tier: B
    basis: judgment
    sources: [byt-qd-2760-2023, nice-ng253, nice-ng254, nhs-sepsis]
    locator: "2760 mục II.2.1, IV.A.3.b, Phụ lục 2; NG253 bảng 1; NG254 bảng 1–3; NHS Sepsis"
    note: "Người bảo trì thêm (25/10/2026). 2760: lạnh đầu chi, da nổi vân tím là biểu hiện sốc; tiểu ít, mệt lả là dấu hiệu cảnh báo. NICE: da loang lổ hoặc xám tái, không tiểu 18 giờ là nguy cơ cao. Từng dấu hiệu vẫn ở mức 2 (rf_shock_signs); dấu hiệu tuần hoàn kèm một hậu quả (mệt lả, tiểu ít, ngất) được coi là sốc. Câu hỏi tay chân lạnh đã ghi rõ lạnh ngắt, da tái hoặc nổi vân tím, để không tính cảm giác lạnh khi đang rét run. Chờ bác sĩ duyệt."
- id: rf_sepsis_multiple_signs
  level: 1
  conditions: [sepsis, bacterial_meningitis]
  when:
    all:
      - { finding: fever, is: present }
      - at_least: 2
        of:
          - any:
              - { finding: confusion, is: present }
              - { finding: drowsy_hard_to_wake, is: present }
          - { finding: breathing_difficulty, is: present }
          - any:
              - { finding: cold_hands_feet, is: present }
              - { finding: severe_weakness, is: present }
          - { finding: rash_non_blanching, is: present }
  reason_vi: "Sốt kèm nhiều dấu hiệu nặng cùng lúc có thể là nhiễm khuẩn huyết: gọi 115 ngay."
  evidence:
    tier: B
    basis: judgment
    sources: [nhs-sepsis, nice-ng253, nice-ng254, byt-qd-5642-2015]
    locator: "NHS Sepsis (Call 999 or go to A&E); NG253 bảng 1; NG254 bảng 1–3; 5642 bài Nhiễm khuẩn huyết, tr. 79–81"
    note: "Lượt C lô 2 đề xuất. NHS khuyên gọi 999 khi có một trong các dấu hiệu: lú lẫn hoặc li bì, thở rất nhanh hoặc khó thở, da tái hoặc loang lổ, ban không mất khi ấn; NICE xếp các dấu hiệu này vào nhóm nguy cơ cao. doctor-v xếp từng dấu hiệu ở mức 2 (các quy tắc riêng) và nâng lên mức 1 khi có từ 2 trong 4 nhóm: ý thức; hô hấp; tuần hoàn hoặc mệt lả; ban xuất huyết, theo cách qSOFA đếm rối loạn ở nhiều cơ quan. Lú lẫn gộp với li bì, tay chân lạnh gộp với mệt lả, để hai câu trả lời về cùng một tình trạng không tự đủ 2 nhóm (người đang rét run cũng thấy lạnh tay chân và mệt). Ngưỡng 2 nhóm là nhận định, chờ bác sĩ duyệt."
- id: rf_fever_mucosal_bleeding
  level: 2
  conditions: [dengue]
  when:
    all:
      - { finding: fever, is: present }
      - { finding: bleeding_gums_nose, is: present }
  reason_vi: "Sốt kèm chảy máu chân răng hoặc chảy máu mũi cần được khám ngay."
  evidence:
    tier: B
    basis: verbal
    sources: [byt-qd-2760-2023, who-arbovirus-2025]
    locator: "2760 Phụ lục 2 (dấu hiệu cảnh báo: xuất huyết niêm mạc), mục IV.A.3.b; WHO 2025 mục 2.7"
    note: "Xuất huyết niêm mạc là dấu hiệu cảnh báo, người bệnh được cho nhập viện. 2760 cũng ghi chảy máu chân răng, chảy máu mũi có thể gặp ở giai đoạn sốt; giữ mức 2 vì không phân biệt được tại nhà."
- id: rf_fever_severe_abdominal_pain
  level: 2
  conditions: [dengue, acute_appendicitis, acute_cholecystitis]
  when:
    all:
      - { finding: fever, is: present }
      - { finding: abd_pain_severe, is: present }
  reason_vi: "Sốt kèm đau bụng dữ dội cần được khám ngay."
  evidence:
    tier: B
    basis: verbal
    sources: [byt-qd-2760-2023, who-arbovirus-2025]
    locator: "2760 Phụ lục 2 (đau bụng nhiều và liên tục hoặc tăng cảm giác đau vùng gan); WHO 2025 mục 2.7"
- id: rf_fever_vomiting_critical_phase
  level: 2
  conditions: [dengue]
  when:
    all:
      - { finding: fever, is: present }
      - { finding: persistent_vomiting, is: present }
      - { finding: fever_duration, in: [d3_5, d6_7] }
  reason_vi: "Nôn nhiều vào ngày thứ 3–7 của sốt có thể là dấu hiệu cảnh báo sốt xuất huyết."
  evidence:
    tier: B
    basis: verbal
    sources: [byt-qd-2760-2023, who-arbovirus-2025]
    locator: "2760 mục II.2 (giai đoạn nguy hiểm thường ngày 3–7), Phụ lục 2 (nôn ói nhiều từ 3 lần/1 giờ hoặc 4 lần/6 giờ); WHO 2025 mục 2.7 (nôn liên tục, không uống được)"
    note: "Ngoài ngày 3–7, nôn liên tục vẫn được bắt ở mức 3 (rf_persistent_vomiting), hoặc mức 2 ở trẻ 2 tháng–5 tuổi nôn tất cả."
- id: rf_fever_critical_phase_signs
  level: 2
  conditions: [dengue]
  when:
    all:
      - { finding: fever, is: present }
      - { finding: fever_duration, in: [d3_5, d6_7] }
      - any:
          - { finding: decreased_urine, is: present }
          # Khó thở không kèm ho gợi ý ứ dịch do thoát huyết tương; khó thở kèm ho (viêm phổi)
          # do rf_fever_breathing (mức 3) xử lý (lượt C lô 1: quy tắc cũ đẩy viêm phổi lên mức 2).
          # "is: absent" chứ không phải "not present": ho chưa được hỏi thì chưa kết luận (lượt C lô 2).
          - all:
              - { finding: breathing_difficulty, is: present }
              - { finding: cough, is: absent }
  reason_vi: "Sốt ngày thứ 3–7 kèm tiểu ít hoặc khó thở có thể là dấu hiệu nặng của sốt xuất huyết."
  evidence:
    tier: B
    basis: verbal
    sources: [byt-qd-2760-2023, who-arbovirus-2025]
    locator: "2760 Phụ lục 2 (tiểu ít: dấu hiệu cảnh báo; ứ dịch kèm suy hô hấp: sốt xuất huyết nặng), mục IV.A.3.b (không tiểu trên 6 giờ); WHO 2025 mục 2.7 (khó thở)"
    note: "Quy tắc mới của lượt R. Câu hỏi khó thở hiện gộp nhiều mức độ; trong giai đoạn nguy hiểm vẫn chọn mức 2."
- id: rf_persistent_vomiting
  level: 3
  when: { finding: persistent_vomiting, is: present }
  reason_vi: "Nôn liên tục dễ gây mất nước, cần được khám trong hôm nay."
  evidence:
    tier: B
    basis: judgment
    sources: [who-imci-chart-booklet-2014, byt-qd-2760-2023]
    locator: "IMCI general danger signs (nôn tất cả); 2760 Phụ lục 2, mục IV.A.3.b"
    note: "Nôn tất cả là dấu hiệu nguy hiểm ở trẻ (IMCI) và nôn nhiều là dấu hiệu cảnh báo trong sốt xuất huyết; ở người lớn chọn mức 3 để kịp bù nước."
- id: rf_fever_breathing
  level: 3
  when:
    all:
      - { finding: fever, is: present }
      - { finding: breathing_difficulty, is: present }
  reason_vi: "Sốt kèm khó thở cần được khám trong hôm nay."
  evidence:
    tier: B
    basis: judgment
    sources: [who-imci-chart-booklet-2014, nice-ng143, nice-ng253, nice-ng254, byt-qd-1840-2025]
    locator: "IMCI: Cough or difficult breathing; NG143 bảng 2; NG253 bảng 1; NG254 bảng 1–3; 1840 mục II.2.3"
    note: "Khó thở dữ dội đã được bắt ở màn sàng lọc cấp cứu. Các nguồn không thống nhất: IMCI xếp thở nhanh, rút lõm lồng ngực ở trẻ 2 tháng–5 tuổi là viêm phổi điều trị ngoại trú; NICE xếp thở nhanh là vàng hoặc đỏ tùy mức; 1840 xếp cúm kèm khó thở vào cúm nặng. Câu hỏi hiện gộp nhiều mức độ nên giữ mức 3 cho người chung; nhóm nguy cơ cao và giai đoạn nguy hiểm của sốt xuất huyết được nâng lên mức 2 ở quy tắc riêng. Lượt R thay NG51 bằng NG253, NG254."
- id: rf_high_risk_fever_breathing
  level: 2
  conditions: [pneumonia, sepsis]
  when:
    all:
      - { finding: fever, is: present }
      - { finding: breathing_difficulty, is: present }
      - any:
          - { finding: immunocompromised, is: present }
          - { finding: pregnant, is: present }
          - { age_years_gte: 65 }
  reason_vi: "Người có nguy cơ cao bị sốt kèm khó thở cần được khám cấp cứu."
  evidence:
    tier: B
    basis: judgment
    sources: [byt-qd-1840-2025, nice-ng253]
    locator: "1840 mục II.2.3 (cúm nặng; yếu tố nguy cơ cúm nặng); NG253 bảng 1"
    note: "Quy tắc mới của lượt R. 1840 xếp khó thở, thở nhanh vào cúm nặng và nêu nhóm nguy cơ cúm nặng (trên 65 tuổi, suy giảm miễn dịch, có thai). NG253: nhịp thở từ 25 lần/phút là nguy cơ cao. Chờ bác sĩ duyệt."
- id: rf_high_risk_fever
  level: 3
  when:
    all:
      - { finding: fever, is: present }
      - any:
          - { finding: immunocompromised, is: present }
          - { finding: pregnant, is: present }
          - { finding: recent_childbirth, is: present }
          - { age_years_gte: 65 }
  reason_vi: "Người có nguy cơ cao bị sốt nên được khám sớm."
  evidence:
    tier: B
    basis: verbal
    sources: [byt-qd-1840-2025, nice-ng253, who-arbovirus-2025]
    locator: "1840 mục I và II.2.3; NG253 bảng 1 (suy giảm miễn dịch: nguy cơ trung bình); WHO 2025 mục 2.7 (có thai)"
    note: "Lượt R hạ mốc tuổi từ 75 xuống 65 theo 1840 (yếu tố nguy cơ cúm nặng: trên 65 tuổi) và thêm người mới sinh (1840: mới sinh 2 tuần; câu hỏi doctor-v hỏi 6 tuần). Thay NG51 bằng NG253. 1840 còn nêu trẻ dưới 5 tuổi và người có bệnh nền; chưa đưa vào quy tắc (xem báo cáo)."
- id: rf_prolonged_fever
  level: 3
  when: { finding: fever_duration, in: [d6_7, gt_7d] }
  reason_vi: "Sốt từ 6 ngày trở lên cần đi khám để tìm nguyên nhân."
  evidence:
    tier: B
    basis: judgment
    sources: [nice-ng143, who-imci-chart-booklet-2014]
    locator: "NG143 khuyến cáo 1.2.14, bảng 2; IMCI: Fever (sốt mỗi ngày quá 7 ngày thì chuyển khám)"
    note: "NICE NG143 coi sốt từ 5 ngày ở trẻ là dấu hiệu vàng, cần đánh giá bệnh Kawasaki. IMCI: sốt mỗi ngày quá 7 ngày thì chuyển khám. Người bảo trì hạ mốc từ hơn 7 ngày xuống từ 6 ngày cho mọi lứa tuổi (25/10/2026): lựa chọn số ngày sốt không tách được mốc 5 ngày; sốt xuất huyết ngày 3–7 cũng cần được khám theo dõi (2760); cúm thường hết sốt trong 3–5 ngày. Chờ bác sĩ duyệt."
- id: rf_fever_malaria_exposure
  level: 3
  when:
    all:
      - { finding: fever, is: present }
      - { finding: malaria_area_exposure, is: present }
  reason_vi: "Sốt sau khi đi rừng, ngủ rẫy hoặc đến vùng sốt rét cần xét nghiệm sốt rét trong ngày."
  evidence:
    tier: B
    basis: verbal
    sources: [byt-qd-3377-2023]
    note: "Người bảo trì thêm theo đề xuất của lượt A lô 2: 3377/QĐ-BYT yêu cầu xét nghiệm mọi trường hợp nghi sốt rét; sốt rét do P. falciparum có thể chuyển nặng nhanh."
- id: rf_fever_jaundice_malaria_exposure
  level: 2
  conditions: [malaria]
  when:
    all:
      - { finding: fever, is: present }
      - { finding: jaundice, is: present }
      - { finding: malaria_area_exposure, is: present }
  reason_vi: "Sốt kèm vàng da sau khi đi rừng hoặc đến vùng sốt rét có thể là sốt rét nặng, cần đi cấp cứu ngay."
  evidence:
    tier: B
    basis: verbal
    sources: [byt-qd-3377-2023]
    locator: "3377 mục 3.2.2 (sốt rét ác tính)"
    note: "Lượt C lô 2 đề xuất. 3377 nêu vàng da trong các biểu hiện của sốt rét ác tính, là thể bệnh cần cấp cứu và điều trị tại bệnh viện. Sốt kèm vàng da và đau bụng đã có quy tắc rf_cholangitis_triad."
- id: rf_fever_obstructing_stone
  level: 2
  conditions: [acute_pyelonephritis, renal_colic]
  when:
    all:
      - { finding: fever, is: present }
      - { finding: flank_pain, is: present }
      - any:
          - { finding: abd_pain_radiates_groin, is: present }
          - { finding: abd_pain_colicky, is: present }
  reason_vi: "Sốt kèm cơn đau quặn hông lưng có thể là sỏi gây tắc và nhiễm khuẩn, cần khám cấp cứu."
  evidence:
    tier: B
    basis: judgment
    sources: [eau-urolithiasis-2026, nhs-kidney-stones]
    locator: "EAU Urolithiasis 2026, mục 3.4.2; NHS Kidney stones (urgent GP appointment or NHS 111)"
    note: "Người bảo trì thêm theo đề xuất của lượt A lô 3. Lượt C lô 3 chỉ ra 3931/QĐ-BYT không nêu đây là cấp cứu; người bảo trì thay bằng EAU: thận tắc nghẽn kèm dấu hiệu nhiễm khuẩn tiết niệu là cấp cứu tiết niệu, cần giải áp khẩn. Tại nhà không xác định được tắc nghẽn; quy tắc dùng sốt kèm cơn đau quặn thận làm dấu hiệu thay thế (nhận định). NHS khuyên hẹn khám khẩn (mức 3) khi đau dữ dội hoặc sốt; giữ mức 2 vì cần siêu âm và xét nghiệm ngay để loại trừ thận tắc nghẽn nhiễm khuẩn. Chờ bác sĩ duyệt."
- id: rf_uti_high_risk
  level: 3
  when:
    all:
      - { finding: dysuria, is: present }
      - any:
          - { sex: male }
          - { finding: pregnant, is: present }
          - { age_months_lt: 192 }
          - { age_years_gte: 65 }
          - { finding: diabetes, is: present }
          - { finding: immunocompromised, is: present }
          - { finding: fever, is: present }
          - { finding: hematuria, is: present }
          - { finding: flank_pain, is: present }
  reason_vi: "Tiểu buốt ở nhóm dễ biến chứng, hoặc kèm sốt, tiểu ra máu, đau hông lưng, cần được khám trong hôm nay."
  evidence:
    tier: C
    basis: verbal
    sources: [nhs-utis]
    locator: "NHS Urinary tract infections (UTIs): Ask for an urgent GP appointment or get help from NHS 111"
    note: "Người bảo trì thêm theo đề xuất của lượt A lô 3. Lượt C lô 3 mở trang: NHS khuyên hẹn khám khẩn khi từ 65 tuổi, trẻ từ 15 tuổi trở xuống, nam giới, có thai, đái tháo đường, suy giảm miễn dịch, sốt hoặc run, tiểu ra máu, đau bụng dưới hoặc đau lưng dưới sườn; người bảo trì bổ sung đủ các nhóm (trước chỉ có nam giới, có thai, trẻ dưới 12 tuổi)."
- id: rf_sudden_balance_loss
  level: 2
  conditions: [stroke]
  complaints: [headache]
  when: { finding: sudden_loss_of_balance, is: present }
  reason_vi: "Đột ngột mất thăng bằng có thể là dấu hiệu đột quỵ, cần khám cấp cứu."
  evidence:
    tier: B
    basis: verbal
    sources: [byt-qd-3312-2024]
    note: "Chữ B trong BE-FAST; 3312/QĐ-BYT (2024) nêu thất điều, chóng mặt ở đột quỵ hệ sau (lượt A lô 4 đề xuất). Nguồn chưa xác minh bản chính thức."
- id: rf_befast_high_risk
  level: 1
  conditions: [stroke]
  complaints: [headache]
  when:
    all:
      - any:
          - { finding: sudden_loss_of_balance, is: present }
          - { finding: vision_loss_or_double, is: present }
      - any:
          - { age_years_gte: 50 }
          - { finding: hypertension_known, is: present }
          - { finding: diabetes, is: present }
          - { finding: known_heart_disease, is: present }
          - { finding: neck_injury_or_manipulation, is: present }
  reason_vi: "Đột ngột mất thăng bằng hoặc mất thị lực ở người có nguy cơ đột quỵ: gọi 115 ngay."
  evidence:
    tier: B
    basis: verbal
    sources: [byt-qd-3312-2024, biller-stroke-2014]
    note: "BE-FAST (Balance, Eyes): dấu hiệu đột quỵ cần gọi cấp cứu. 3312/QĐ-BYT (2024): yếu tố nguy cơ tuổi cao, tăng huyết áp, đái tháo đường, bệnh tim. Lượt C lô 4 đề xuất vì 2 ca đột quỵ chỉ được xếp mức 2. Lượt R Giai đoạn 3 lô 2 thêm 'bị bẻ, nắn cổ hoặc chấn thương cổ trong 1 tháng qua', như hai quy tắc đột quỵ của Chóng mặt: Biller 2014 (tóm tắt): bóc tách động mạch cổ hay gây đột quỵ ở người trẻ và trung niên, thường biểu hiện bằng đau đầu một bên, đau gáy; liên quan với nắn chỉnh cột sống cổ. Phạm vi lô 2 liên kết dấu hiệu này với đột quỵ ở Chóng mặt và Đau đầu."
- id: rf_ear_pain_complicated
  level: 3
  when:
    all:
      - { finding: ear_pain, is: present }
      - any:
          - { finding: fever_max_temp, in: [ge_39] }
          - { finding: ear_discharge, is: present }
          - { finding: vomiting, is: present }
  reason_vi: "Đau tai kèm sốt cao, nôn hoặc chảy mủ tai cần được khám trong hôm nay."
  evidence:
    tier: B
    basis: judgment
    sources: [byt-qd-5643-2015]
    note: "Viêm tai giữa có sốt cao, chảy mủ hoặc toàn thân không khỏe cần khám sớm để quyết định điều trị (lượt C lô 1 đề xuất)."
- id: rf_fever_severe_headache
  level: 3
  when:
    all:
      - { finding: fever, is: present }
      - { finding: headache_severity, in: [severe] }
  reason_vi: "Sốt kèm đau đầu dữ dội cần được khám trong hôm nay."
  evidence:
    tier: C
    basis: judgment
    sources: [nhs-headaches]
    note: "Đau đầu dữ dội kèm sốt cần loại trừ viêm màng não, sốt xuất huyết, sốt rét (lượt C lô 1 đề xuất); các dấu hiệu nặng hơn (cứng gáy, lú lẫn, ban xuất huyết) đã có quy tắc mức 2."
- id: rf_cholangitis_triad
  level: 2
  conditions: [acute_cholecystitis]
  when:
    all:
      - { finding: fever, is: present }
      - { finding: jaundice, is: present }
      - { finding: abdominal_pain, is: present }
  reason_vi: "Sốt kèm vàng da và đau bụng có thể là viêm đường mật, cần khám cấp cứu."
  evidence:
    tier: C
    basis: verbal
    sources: [msd-choledocholithiasis-cholangitis]
    note: "Tam chứng Charcot; MSD: viêm đường mật cấp là cấp cứu (lượt B lô 3 đề xuất). Cần nguồn hướng dẫn chính thức (Tokyo Guidelines 2018)."
- id: rf_painful_hernia
  level: 2
  conditions: [bowel_obstruction]
  complaints: [abdominal_pain]
  when: { finding: hernia_lump_painful, is: present }
  reason_vi: "Khối phồng đau ở bẹn hoặc rốn không đẩy lên được có thể là thoát vị nghẹt, cần khám cấp cứu."
  evidence:
    tier: B
    basis: judgment
    sources: [wses-asbo-2018]
    note: "Thoát vị nghẹt gây tắc ruột cần mổ cấp cứu (lượt B lô 3 đề xuất finding). Nguồn WSES về tắc ruột; cần thêm hướng dẫn về thoát vị."
- id: rf_flu_risk_chronic_disease
  level: 3
  when:
    all:
      - { finding: fever, is: present }
      - any:
          - { finding: cough, is: present }
          - { finding: sore_throat, is: present }
      - any:
          - { finding: diabetes, is: present }
          - { finding: known_heart_disease, is: present }
  reason_vi: "Người có bệnh tim hoặc đái tháo đường bị sốt, ho nên được khám trong ngày."
  evidence:
    tier: B
    basis: verbal
    sources: [byt-qd-1840-2025]
    note: "1840/QĐ-BYT liệt kê người có bệnh mạn tính vào nhóm nguy cơ cúm nặng (lượt R đã ghi nhận, lượt A lô 1 đề xuất quy tắc)."
- id: rf_swelling_behind_ear
  level: 2
  conditions: [acute_otitis_media]
  complaints: [fever]
  when: { finding: swelling_behind_ear, is: present }
  reason_vi: "Sưng đỏ, đau sau tai có thể là viêm xương chũm, cần khám cấp cứu."
  evidence:
    tier: C
    basis: judgment
    sources: [byt-qd-5643-2015]
    note: "Viêm xương chũm là biến chứng nặng của viêm tai giữa (lượt A lô 1 đề xuất). Nguồn do lượt A thêm; lượt C cần xác minh và chuyển vào sổ đăng ký."
- id: rf_periorbital_swelling
  level: 2
  conditions: [acute_sinusitis]
  complaints: [fever, headache]
  when: { finding: periorbital_swelling, is: present }
  reason_vi: "Sưng nề, đỏ quanh mắt có thể là nhiễm trùng hốc mắt, cần khám cấp cứu."
  evidence:
    tier: C
    basis: judgment
    sources: [byt-qd-5643-2015]
    note: "Biến chứng hốc mắt của viêm xoang có thể gây mất thị lực (lượt A lô 1 đề xuất). Cần xác minh nguồn."
- id: rf_child_bilious_vomiting
  level: 2
  conditions: [bowel_obstruction, intussusception]
  when:
    all:
      - { age_groups: [infant_0_2m, child_2m_5y, child_5_12] }
      - { finding: vomiting_bilious, is: present }
  reason_vi: "Trẻ nôn ra dịch xanh có thể bị tắc ruột, cần khám cấp cứu."
  evidence:
    tier: C
    basis: verbal
    sources: [nhs-diarrhoea-vomiting, wses-asbo-2018, bines-bwho-2006]
    locator: "NHS Diarrhoea and vomiting (Call 999 or go to A&E); Bines 2006 bảng 3"
    note: "Nôn dịch mật ở trẻ là dấu hiệu tắc ruột cần loại trừ ngay (lượt A lô 3 đề xuất finding). Lượt C lô 3 mở trang NHS: gọi 999 hoặc đến cấp cứu khi nôn dịch xanh (trẻ em: vàng xanh hoặc xanh). Bines 2006: 30% trẻ lồng ruột ở Hà Nội nôn dịch mật. Vẫn cần nguồn nhi khoa Việt Nam."
- id: rf_fever_3_6_months_high_temp
  level: 2
  conditions: [sepsis, acute_pyelonephritis, bacterial_meningitis]
  when:
    all:
      - { age_months_lt: 6 }
      - { finding: fever, is: present }
      - { finding: fever_max_temp, in: [ge_39] }
  reason_vi: "Trẻ dưới 6 tháng tuổi sốt từ 39°C cần được khám ngay."
  evidence:
    tier: B
    basis: judgment
    sources: [nice-ng143, nice-ng254, nhs-sepsis]
    locator: "NG143 khuyến cáo 1.2.13, bảng 2; NG254 bảng 1; NHS Sepsis (Call 999 or go to A&E)"
    note: "Quy tắc mới của lượt R. NICE xếp trẻ 3–6 tháng có nhiệt độ từ 39°C vào nhóm vàng (NG143) hoặc nguy cơ trung bình–cao (NG254): cần khám trực tiếp, mức khẩn do nhân viên y tế quyết định. NHS khuyên gọi 999 hoặc đến cấp cứu. Chọn mức 2 vì không khám trực tiếp được; trẻ dưới 3 tháng đã có quy tắc riêng. Chờ bác sĩ duyệt."

- id: rf_nasal_over_10_days
  level: 4
  when: { finding: nasal_symptoms_over_10_days, is: present }
  reason_vi: "Sổ mũi, nghẹt mũi hơn 10 ngày không đỡ nên đi khám."
  evidence:
    tier: C
    basis: verbal
    sources: [cdc-sinus-infection, nhs-sinusitis]
    locator: "CDC Sinus Infection (When to seek medical care); NHS Sinusitis"
    note: "Người bảo trì thêm (25/10/2026). CDC: đi khám khi triệu chứng kéo dài hơn 10 ngày không đỡ. NHS: khám khi không đỡ sau 3 tuần, hay tái phát, hoặc trẻ từ 11 tuổi trở xuống."
- id: rf_frequent_headache
  level: 4
  when: { finding: headache_frequent, is: present }
  reason_vi: "Đau đầu nhiều lần mỗi tuần nên đi khám để tìm nguyên nhân và cách phòng cơn đau."
  evidence:
    tier: C
    basis: verbal
    sources: [nhs-tension-headaches, nice-cg150]
    locator: "NHS Tension-type headaches (See a GP); NICE CG150 (đau đầu do lạm dụng thuốc)"
    note: "Người bảo trì thêm (25/10/2026). NHS: khám bác sĩ nếu đau nhiều lần mỗi tuần; dùng thuốc giảm đau quá thường xuyên có thể gây đau đầu do lạm dụng thuốc."

# ---------- Đau bụng ----------
- id: rf_peritoneal_irritation
  level: 3
  conditions: [acute_appendicitis]
  when:
    all:
      - { finding: abdominal_pain, is: present }
      - { finding: abd_pain_worse_movement, is: present }
      - any:
          - { finding: fever, is: present }
          - { finding: vomiting, is: present }
  reason_vi: "Đau bụng tăng khi đi lại hoặc khi ho, kèm sốt hoặc nôn, cần khám trong hôm nay để loại trừ viêm ruột thừa."
  evidence:
    tier: B
    basis: judgment
    sources: [nhs-appendicitis, benabbas-aem-2017, reust-afp-2016]
    locator: "NHS Appendicitis (urgent GP appointment or NHS 111); Benabbas 2017 (tóm tắt); Reust 2016"
    note: "Người bảo trì thêm (25/10/2026). Đau tăng khi cử động, ho là dấu hiệu kích thích phúc mạc: Benabbas 2017, trẻ đau bụng chưa phân loại, đau khi ho hoặc nhảy LR+ 7,64. NHS mô tả đau viêm ruột thừa tăng khi cử động, ho; khuyên hẹn khám khẩn khi đau tăng dần hoặc không hết. Tiêu chảy hay làm viêm ruột thừa bị nhầm với viêm dạ dày – ruột, nên quy tắc không dựa vào xác suất."
- id: rf_child_peritoneal_irritation
  level: 2
  conditions: [acute_appendicitis, intussusception]
  when:
    all:
      - { age_months_lt: 60 }
      - { finding: abdominal_pain, is: present }
      - { finding: abd_pain_worse_movement, is: present }
      - any:
          - { finding: fever, is: present }
          - { finding: vomiting, is: present }
  reason_vi: "Trẻ dưới 5 tuổi đau bụng tăng khi đi lại, kèm sốt hoặc nôn, cần được khám cấp cứu."
  evidence:
    tier: B
    basis: judgment
    sources: [reust-afp-2016, nhs-appendicitis, benabbas-aem-2017]
    locator: "Reust 2016; NHS Appendicitis (trẻ nhỏ hay không điển hình); Benabbas 2017"
    note: "Người bảo trì thêm (25/10/2026). Reust 2016: sốt xuất hiện sau khi đau hoặc nôn phù hợp với viêm phúc mạc đang tiến triển. NHS: trẻ nhỏ hay có biểu hiện không điển hình. Trẻ nhỏ không tả được vị trí đau, và ruột thừa thủng sớm hơn người lớn, nên chọn mức 2. Đây là nhận định, chờ bác sĩ duyệt."
- id: rf_severe_abdominal_pain
  level: 2
  when: { finding: abd_pain_severe, is: present }
  reason_vi: "Đau bụng dữ dội cần được khám cấp cứu."
  evidence:
    tier: B
    basis: verbal
    sources: [who-bec-2018, nhs-stomach-ache]
    locator: "WHO BEC: Shock – check for severe abdominal pain or a very firm abdomen; NHS Stomach ache (Call 999 or go to A&E)"
    note: "Lượt R thêm nguồn chính thức WHO: đau bụng dữ dội hoặc bụng rất cứng có thể là chảy máu hay nhiễm trùng trong ổ bụng; ở người có thể có thai thì nghĩ chửa ngoài tử cung. NHS: đau bụng đột ngột và dữ dội thì gọi 999 hoặc đến cấp cứu."
- id: rf_abdomen_hard_swollen
  level: 2
  conditions: [bowel_obstruction, acute_appendicitis, acute_pancreatitis]
  complaints: [abdominal_pain]
  when: { finding: abdomen_hard_swollen, is: present }
  reason_vi: "Bụng cứng hoặc chướng căng có thể là dấu hiệu bệnh cấp cứu trong ổ bụng."
  evidence:
    tier: B
    basis: verbal
    sources: [who-bec-2018, wses-asbo-2018]
    locator: "WHO BEC: Shock (very firm abdomen; abdominal bleeding); WSES ASBO 2018: Diagnosis"
    note: "Lượt R thay NHS (trang hiện hành không nêu dấu hiệu này) bằng nguồn chính thức. Câu hỏi gộp hai dấu hiệu: bụng cứng (chảy máu, nhiễm trùng trong ổ bụng theo WHO BEC) và chướng căng (tắc ruột, cấp cứu ngoại khoa theo WSES)."
- id: rf_gi_bleeding
  level: 2
  conditions: [upper_gi_bleeding, peptic_ulcer_gastritis]
  complaints: [abdominal_pain, fever, dizziness, syncope, palpitations]
  when:
    any:
      - { finding: vomiting_blood, is: present }
      - { finding: black_stool, is: present }
  reason_vi: "Nôn ra máu hoặc đi ngoài phân đen là dấu hiệu chảy máu đường tiêu hóa."
  evidence:
    tier: B
    basis: verbal
    sources: [nice-cg141, who-bec-2018, nhs-stomach-ache, byt-qd-2760-2023, esc-syncope-2018]
    locator: "CG141 khuyến cáo 1.1.1–1.1.2; WHO BEC: Shock (bleeding in the stomach or intestines); NHS Stomach ache; 2760 Phụ lục 2; ESC 2018 bảng 6"
    note: "CG141 là hướng dẫn trong bệnh viện: mọi ca xuất huyết tiêu hóa trên cấp cần được đánh giá nguy cơ bằng thang Blatchford, chỉ cân nhắc cho về sớm khi điểm bằng 0. NHS: nôn ra máu hoặc như bã cà phê, phân đen dính thì gọi 999 hoặc đến cấp cứu. 2760: nôn ra máu, phân đen là dấu hiệu cảnh báo sốt xuất huyết. Giai đoạn 3 lô 1 mở rộng phạm vi cho Chóng mặt, Ngất, Hồi hộp; lượt R đối chiếu: ESC 2018 xếp nghi chảy máu tiêu hóa vào đặc điểm nguy cơ cao của ngất. Kèm ngất hoặc choáng thì lên mức 1 (rf_syncope_gi_bleeding). Người đang uống viên sắt (hay gặp ở người thiếu máu) có thể đi ngoài phân đen nhưng không dính như hắc ín; câu hỏi đã nêu 'như hắc ín'."
- id: rf_fainting_with_pain
  level: 2
  conditions: [ectopic_pregnancy, acute_coronary_syndrome]
  # Không áp cho Chóng mặt, Hồi hộp: ở đó choáng rất hay gặp; chửa ngoài tử cung vỡ và đau ngực có quy tắc riêng.
  complaints: [abdominal_pain, fever, headache, syncope]
  when:
    all:
      - { finding: fainting_or_near_fainting, is: present }
      - any:
          - { finding: abdominal_pain, is: present }
          - { finding: chest_pain_pressure, is: present }
  reason_vi: "Ngất hoặc choáng kèm đau bụng hoặc đau ngực cần được khám cấp cứu."
  evidence:
    tier: B
    basis: judgment
    sources: [nice-cg95, nice-ng126, who-bec-2018, esc-syncope-2018]
    locator: "CG95 khuyến cáo 1.2.1.3; NG126 khuyến cáo 1.4.1, 1.4.3; WHO BEC: Shock; ESC 2018 bảng 6 (nguy cơ cao loại nặng: mới xuất hiện đau ngực, đau bụng)"
    note: "Lượt R thay NHS bằng nguồn chính thức. Ngất hoặc choáng kèm đau gợi ý mất máu trong (chửa ngoài tử cung, xuất huyết tiêu hóa) hoặc hội chứng vành cấp có rối loạn huyết động. Đau ngực kèm ngất được nâng lên mức 1 ở rf_chest_pain_with_features. Lượt R Giai đoạn 3 lô 1 tách phần đau đầu sang rf_fainting_with_headache (giữ nguyên tác dụng với Đau bụng, Sốt, Đau đầu) để phần đau đầu không áp dụng cho Chóng mặt và Hồi hộp, và thêm ESC 2018: ngất kèm đau ngực hoặc đau bụng mới xuất hiện là đặc điểm nguy cơ cao, cần đánh giá tại khoa cấp cứu (tiền ngất xử trí như ngất). Quy tắc vẫn không ghi phạm vi nên áp dụng cho mọi triệu chứng chính."
- id: rf_fainting_with_headache
  level: 2
  conditions: [subarachnoid_hemorrhage]
  complaints: [abdominal_pain, fever, headache, syncope]
  when:
    all:
      - { finding: fainting_or_near_fainting, is: present }
      - { finding: headache, is: present }
  reason_vi: "Ngất hoặc choáng kèm đau đầu cần được khám cấp cứu."
  evidence:
    tier: B
    basis: judgment
    sources: [nice-ng228, esc-syncope-2018]
    locator: "NG228 khuyến cáo 1.1.3; ESC 2018 bảng 6 (nguy cơ cao loại nặng: mới xuất hiện đau đầu)"
    note: "Lượt R Giai đoạn 3 lô 1 tách từ rf_fainting_with_pain: cùng mức, cùng điều kiện như phần đau đầu của quy tắc gốc. NG228 là căn cứ của quy tắc gốc cho xuất huyết dưới nhện (lượt R trước đã đối chiếu; lần này nice.org.uk chặn truy cập tự động nên chưa mở lại). ESC 2018: ngất kèm đau đầu mới xuất hiện là đặc điểm nguy cơ cao. Phạm vi gồm 3 triệu chứng chính cũ và Ngất. Không áp dụng cho Chóng mặt và Hồi hộp: ở đó 'choáng như sắp ngất' gần như là chính triệu chứng chính, còn đau đầu kèm chóng mặt rất hay gặp; NHS Vertigo chỉ khuyên khám khẩn (mức 3) khi chóng mặt kèm đau đầu dữ dội (rf_dizziness_fever_or_severe_headache), và đau đầu đột ngột, dữ dội vẫn ở mức 1 (rf_thunderclap_headache). Khi thêm triệu chứng chính mới, cân nhắc thêm vào phạm vi."
- id: rf_bowel_obstruction_signs
  level: 2
  conditions: [bowel_obstruction]
  complaints: [abdominal_pain]
  when:
    all:
      - { finding: no_stool_or_gas, is: present }
      - any:
          - { finding: vomiting, is: present }
          - { finding: persistent_vomiting, is: present }
          - { finding: abdomen_hard_swollen, is: present }
  reason_vi: "Không đi ngoài, không xì hơi kèm nôn hoặc chướng bụng có thể là tắc ruột."
  evidence:
    tier: B
    basis: verbal
    sources: [wses-asbo-2018, nhs-stomach-ache]
    locator: "WSES ASBO 2018: Diagnosis (đau bụng, nôn, chướng bụng, bí trung đại tiện); NHS Stomach ache"
    note: "Lượt R thêm hướng dẫn của Hội Phẫu thuật cấp cứu thế giới: tắc ruột non là cấp cứu ngoại khoa."
- id: rf_no_stool_or_gas
  level: 2
  conditions: [bowel_obstruction]
  when:
    all:
      - { finding: abdominal_pain, is: present }
      - { finding: no_stool_or_gas, is: present }
  reason_vi: "Đau bụng kèm không đi ngoài và không xì hơi được cần được khám cấp cứu."
  evidence:
    tier: B
    basis: verbal
    sources: [nhs-stomach-ache, wses-asbo-2018]
    locator: "NHS Stomach ache (Call 999 or go to A&E: cannot poo or fart at all); WSES ASBO 2018: Diagnosis"
    note: "Lượt R nâng từ mức 3 lên mức 2: trang NHS (rà soát 20/10/2026) xếp đau bụng kèm hoàn toàn không đi ngoài, không xì hơi vào nhóm gọi 999 hoặc đến cấp cứu; WSES coi tắc ruột non là cấp cứu ngoại khoa. Thêm điều kiện có đau bụng vì nguồn chỉ nói về người đau bụng."
- id: rf_pregnant_pain_bleeding
  level: 2
  conditions: [ectopic_pregnancy]
  when:
    all:
      - { finding: abdominal_pain, is: present }
      - { finding: vaginal_bleeding, is: present }
      - any:
          - { finding: pregnant, is: present }
          - { finding: missed_period, is: present }
  reason_vi: "Đau bụng kèm ra máu khi đang có thai hoặc chậm kinh cần được khám cấp cứu."
  evidence:
    tier: B
    basis: verbal
    sources: [nice-ng126, who-bec-2018]
    locator: "NG126 khuyến cáo 1.4.1, 1.4.3, 1.4.7, 1.4.9; WHO BEC: Shock (ectopic pregnancy)"
    note: "NG126: thai sớm có đau và ra máu cần chuyển đơn vị cấp cứu thai sớm, chuyển ngay nếu ấn đau bụng hoặc tiểu khung, chuyển thẳng cấp cứu nếu huyết động không ổn định hoặc đau, ra máu nhiều. Ở Việt Nam tương ứng cấp cứu sản."
- id: rf_ectopic_rupture_signs
  level: 1
  conditions: [ectopic_pregnancy]
  # Chửa ngoài tử cung vỡ có thể biểu hiện trước hết bằng ngất hoặc choáng (lần chấm giữ kín đầu tiên của lô 1).
  complaints: [abdominal_pain, syncope, dizziness]
  when:
    all:
      - { finding: fainting_or_near_fainting, is: present }
      - any:
          - { finding: abd_pain_severe, is: present }
          - { finding: cold_hands_feet, is: present }
      - any:
          - { finding: pregnant, is: present }
          - { finding: missed_period, is: present }
  reason_vi: "Đau bụng kèm ngất ở người có thể đang có thai có thể là chửa ngoài tử cung vỡ: gọi 115 ngay."
  evidence:
    tier: C
    basis: judgment
    sources: [nhs-ectopic-pregnancy]
    locator: "NHS Ectopic pregnancy: symptoms of a ruptured ectopic pregnancy"
    note: "Người bảo trì thêm (25/10/2026). NHS: dấu hiệu vỡ gồm đau bụng đột ngột, dữ dội, chóng mặt nhiều hoặc ngất, da rất tái; gọi 999 hoặc đến cấp cứu ngay. Đòi thêm đau dữ dội hoặc da tái vì choáng váng đơn thuần hay gặp khi có thai. Ngất kèm đau bụng đã ở mức 2 (rf_fainting_with_pain); mức 1 vì chảy máu trong ổ bụng có thể gây sốc nhanh. Cần nguồn sản khoa Việt Nam."
- id: rf_dysmenorrhea_dyspareunia
  level: 4
  complaints: [abdominal_pain]
  when:
    all:
      - { finding: pain_with_menses, is: present }
      - { finding: pain_with_intercourse, is: present }
  reason_vi: "Đau bụng kinh kèm đau khi quan hệ nên đi khám phụ khoa."
  evidence:
    tier: C
    basis: verbal
    sources: [nhs-period-pain]
    locator: "NHS Period pain (See a GP)"
    note: "Người bảo trì thêm (25/10/2026). NHS: khám bác sĩ khi đau bụng kinh tăng, ảnh hưởng sinh hoạt, đau khi quan hệ, khi đi tiểu, đi ngoài, hoặc ra máu giữa kỳ kinh; có thể là đau bụng kinh thứ phát (lạc nội mạc tử cung, viêm vùng chậu)."
- id: rf_pregnant_abdominal_pain
  level: 3
  when:
    all:
      - { finding: abdominal_pain, is: present }
      - { finding: pregnant, is: present }
  reason_vi: "Phụ nữ có thai bị đau bụng cần được khám trong hôm nay."
  evidence:
    tier: B
    basis: judgment
    sources: [nice-ng126, nhs-stomach-ache]
    locator: "NG126 khuyến cáo 1.4.7–1.4.9; NHS Stomach ache (urgent GP / NHS 111: you're pregnant)"
    note: "Đau bụng khi có thai cần loại trừ chửa ngoài tử cung và các biến chứng thai kỳ. NHS: đau bụng khi có thai thì hẹn khám khẩn hoặc gọi 111 (tương ứng mức 3). Đau dữ dội, ra máu, ngất đã có quy tắc mức 2."
- id: rf_abdominal_pain_vaginal_bleeding
  level: 3
  when:
    all:
      - { finding: abdominal_pain, is: present }
      - { finding: vaginal_bleeding, is: present }
  reason_vi: "Đau bụng kèm ra máu âm đạo bất thường cần được khám trong hôm nay."
  evidence:
    tier: B
    basis: verbal
    sources: [nhs-stomach-ache, nice-ng126]
    locator: "NHS Stomach ache (urgent GP / NHS 111: unusual bleeding from your vagina); NG126 khuyến cáo 1.4.5"
    note: "Quy tắc mới của lượt R. NG126: với phụ nữ trong độ tuổi sinh đẻ luôn nghĩ đến khả năng có thai; triệu chứng chửa ngoài tử cung có thể giống bệnh khác. Khi đã biết có thai hoặc chậm kinh thì áp dụng rf_pregnant_pain_bleeding (mức 2)."
- id: rf_bloody_diarrhea
  level: 3
  when: { finding: diarrhea_bloody, is: present }
  reason_vi: "Tiêu chảy có máu cần được khám trong hôm nay."
  evidence:
    tier: B
    basis: verbal
    sources: [who-imci-chart-booklet-2014, nhs-stomach-ache]
    locator: "IMCI: Does the child have diarrhoea? (blood in the stool: dysentery); NHS Stomach ache (urgent GP: blood in your poo)"
    note: "Quy tắc mới của lượt R. IMCI: phân có máu là lỵ (nhóm vàng), dùng kháng sinh và hẹn khám lại sau 3 ngày. NHS: đau bụng kèm phân có máu thì hẹn khám khẩn hoặc gọi 111. Phân nhầy máu như mứt dâu ở trẻ nhỏ có quy tắc mức 2 riêng."
- id: rf_red_jelly_stool
  level: 2
  conditions: [intussusception]
  complaints: [abdominal_pain]
  when: { finding: red_jelly_stool, is: present }
  reason_vi: "Trẻ đi ngoài phân nhầy máu như mứt dâu có thể bị lồng ruột, cần khám cấp cứu."
  evidence:
    tier: B
    basis: judgment
    sources: [byt-qd-3312-2015, who-intussusception-2002, bines-bwho-2006]
    locator: "3312/QĐ-BYT (2015), chương Tiêu hóa, bài Xuất huyết tiêu hóa (xuất huyết tiêu hóa dưới); WHO 2002; Bines 2006 bảng 3"
    note: "Văn bản không có bài riêng về lồng ruột; bài Xuất huyết tiêu hóa nêu lồng ruột là nguyên nhân xuất huyết tiêu hóa dưới ở trẻ, cần khám bụng loại trừ nguyên nhân ngoại khoa và điều trị phẫu thuật. Hình ảnh 'phân như mứt dâu' và mức 2 là đánh giá của người soạn; cần nguồn ngoại nhi chính thức và bác sĩ duyệt. IMCI xếp phân có máu do lỵ ở mức điều trị ngoại trú; câu hỏi nhấn mạnh 'giống mứt dâu' để phân biệt."
- id: rf_chest_pain
  level: 2
  conditions: [acute_coronary_syndrome]
  complaints: [abdominal_pain, dizziness, syncope, palpitations]
  when: { finding: chest_pain_pressure, is: present }
  reason_vi: "Đau hoặc tức nặng giữa ngực cần được khám cấp cứu để loại trừ bệnh tim."
  evidence:
    tier: B
    basis: verbal
    sources: [nice-cg95, nhs-chest-pain]
    locator: "CG95 khuyến cáo 1.2.1.3, 1.2.1.7; NHS Chest pain"
    note: "CG95: nghi hội chứng vành cấp và đang đau, hoặc đau trong 12 giờ qua, thì chuyển viện cấp cứu. NHS: đau ngực đột ngột không hết thì gọi 999; đau lúc có lúc không hoặc đã hết nhanh thì khám bác sĩ. Câu hỏi chưa phân biệt đang đau hay đã hết nên giữ mức 2; đau thắt dữ dội kèm vã mồ hôi đã được bắt ở màn sàng lọc cấp cứu (mức 1). Giai đoạn 3 lô 1 mở rộng phạm vi cho Chóng mặt, Ngất, Hồi hộp; lượt R đối chiếu: NHS Heart palpitations (hồi hộp kèm đau ngực: gọi 999 hoặc đến cấp cứu), ESC 2018 bảng 6 (ngất kèm đau ngực mới: nguy cơ cao). Với Ngất và Chóng mặt, mức 1 đến từ rf_chest_pain_with_features và rf_dizziness_chest_pain."
- id: rf_chest_pain_with_features
  level: 1
  conditions: [acute_coronary_syndrome]
  complaints: [abdominal_pain, dizziness, syncope, palpitations]
  when:
    all:
      - { finding: chest_pain_pressure, is: present }
      - any:
          - { finding: cold_sweat, is: present }
          - { finding: pain_radiates_arm_jaw, is: present }
          - { finding: breathing_difficulty, is: present }
          - { finding: nausea, is: present }
          - { finding: vomiting, is: present }
          - { finding: fainting_or_near_fainting, is: present }
  reason_vi: "Đau ngực kèm vã mồ hôi, đau lan, khó thở, buồn nôn hoặc choáng có thể là nhồi máu cơ tim."
  evidence:
    tier: B
    basis: verbal
    sources: [nice-cg95, nhs-chest-pain]
    locator: "CG95 khuyến cáo 1.2.1.3, 1.2.1.7; NHS Chest pain (Call 999)"
    note: "CG95: đau lan ra tay, lưng, hàm; đau kèm buồn nôn, nôn, vã mồ hôi, khó thở; đau kèm rối loạn huyết động gợi ý hội chứng vành cấp. NHS: đau ngực kèm vã mồ hôi, buồn nôn, choáng váng hoặc khó thở thì gọi 999. Lượt R thêm buồn nôn, nôn, ngất hoặc choáng theo hai nguồn này. Giai đoạn 3 lô 1 mở rộng phạm vi cho Chóng mặt, Ngất, Hồi hộp; lượt R đối chiếu NHS Fainting (người ngất bị đau ngực: gọi 999): với Ngất, ngất được ngầm định nên mọi đau ngực đều thành mức 1."

# ---------- Đau đầu, thần kinh ----------
- id: rf_thunderclap_headache
  level: 1
  conditions: [subarachnoid_hemorrhage]
  complaints: [headache, dizziness, syncope]
  when: { finding: headache_thunderclap, is: present }
  reason_vi: "Đau đầu đột ngột, dữ dội nhất từ trước tới nay có thể là chảy máu não."
  evidence:
    tier: B
    basis: verbal
    sources: [nice-ng228, nice-cg150, nhs-headaches]
    locator: "NG228 khuyến cáo 1.1.3, 1.1.5; CG150 khuyến cáo 1.1.1; NHS Headaches"
    note: "NG228: đau đầu sét đánh (đột ngột, dữ dội, thường đạt đỉnh trong 1–5 phút) là dấu hiệu nguy hiểm của xuất huyết dưới nhện; người nghi xuất huyết dưới nhện ở ngoài bệnh viện cần được chuyển ngay đến khoa cấp cứu. NHS: đau đầu đột ngột, cực kỳ dữ dội thì gọi 999 hoặc đến cấp cứu. Chọn mức 1 vì nguy cơ chảy máu lại và diễn biến xấu nhanh. Giai đoạn 3 lô 1 mở rộng phạm vi cho Chóng mặt và Ngất; lượt R đối chiếu: 3312/QĐ-BYT (2024) nêu chảy máu tiểu não gây nhức đầu dữ dội vùng chẩm, thất điều, nôn; ESC 2018 xếp ngất kèm đau đầu mới vào nguy cơ cao. Với Chóng mặt, câu đau đầu được hỏi ngay trong phần dấu hiệu nguy hiểm để câu này được hỏi khi có đau đầu."
- id: rf_new_seizure
  level: 2
  conditions: [bacterial_meningitis]
  complaints: [fever, headache]
  when: { finding: seizure_recent, is: present }
  reason_vi: "Co giật trong lần bệnh này cần được khám cấp cứu."
  evidence:
    tier: B
    basis: verbal
    sources: [who-imci-chart-booklet-2014, nice-ng143, nice-ng240, nhs-headaches]
    locator: "IMCI general danger signs; NG143 bảng 2 (trạng thái động kinh, co giật cục bộ: đỏ); NG240 bảng 1–2; NHS Headaches"
    note: "Lượt R bỏ CG150 khỏi nguồn vì CG150 không nêu co giật. IMCI: co giật trong lần bệnh này là dấu hiệu nguy hiểm toàn thân, chuyển viện khẩn. NHS: đau đầu kèm co giật thì gọi 999 hoặc đến cấp cứu. Đang co giật được bắt ở màn sàng lọc cấp cứu (mức 1)."
- id: rf_vision_loss
  level: 2
  conditions: [stroke]
  complaints: [headache]
  when: { finding: vision_loss_or_double, is: present }
  reason_vi: "Đột ngột mất thị lực hoặc nhìn đôi cần được khám cấp cứu."
  evidence:
    tier: B
    basis: verbal
    sources: [nice-cg150, nhs-headaches]
    locator: "CG150 khuyến cáo 1.1.1, 1.2.4; NHS Headaches (Call 999 or go to A&E: loss of vision)"
    note: "CG150 nêu dấu hiệu thần kinh khu trú mới, nhìn đôi, triệu chứng thị giác ở một mắt, glôcôm góc đóng cấp là dấu hiệu cần thăm dò hoặc chuyển tuyến, nhưng không nêu mức khẩn. Mức 2 dựa theo NHS: đau đầu kèm mất thị lực thì gọi 999 hoặc đến cấp cứu."
- id: rf_head_injury
  level: 2
  complaints: [headache]
  when: { finding: headache_after_head_injury, is: present }
  reason_vi: "Đau đầu từ sau khi bị va đập đầu cần được khám cấp cứu để loại trừ tổn thương trong sọ."
  evidence:
    tier: B
    basis: verbal
    sources: [nice-ng232, nhs-headaches]
    locator: "NG232 khuyến cáo 1.2.3, 1.2.4; NHS Headaches"
    note: "Lượt R nâng từ mức 3 lên mức 2: NG232 khuyến cáo dịch vụ tư vấn từ xa chuyển người bị chấn thương đầu đến khoa cấp cứu khi đau đầu dai dẳng từ sau chấn thương hoặc có nôn; NHS: đau đầu sau chấn thương đầu trong 3 tháng qua thì gọi 999 hoặc đến cấp cứu. Chưa có câu hỏi về mất ý thức, quên, thuốc chống đông (xem báo cáo)."
- id: rf_head_injury_with_signs
  level: 1
  complaints: [headache]
  when:
    all:
      - { finding: headache_after_head_injury, is: present }
      - any:
          - { finding: confusion, is: present }
          - { finding: drowsy_hard_to_wake, is: present }
          - { finding: seizure_recent, is: present }
          - { finding: vision_loss_or_double, is: present }
  reason_vi: "Đau đầu sau va đập đầu kèm lơ mơ, lú lẫn, co giật hoặc rối loạn thị lực cần được cấp cứu ngay."
  evidence:
    tier: B
    basis: verbal
    sources: [nice-ng232]
    locator: "NG232 khuyến cáo 1.2.2; mục Terms used: focal neurological deficit (gồm thay đổi thị lực)"
    note: "Lượt R nâng từ mức 2 lên mức 1 và sửa điều kiện: NG232 khuyến cáo dịch vụ tư vấn từ xa gọi xe cấp cứu (999) khi người bị chấn thương đầu không tỉnh táo hoàn toàn, có dấu hiệu thần kinh khu trú (kể cả thay đổi thị lực) hoặc co giật từ sau chấn thương. Nôn sau chấn thương được tính ở rf_head_injury (mức 2)."
- id: rf_pregnancy_hypertension_signs
  level: 2
  conditions: [preeclampsia]
  when:
    all:
      - { finding: pregnant, is: present }
      - { finding: gestational_age, in: [ge_20w] }
      - any:
          - { finding: headache, is: present }
          - { finding: blurred_vision, is: present }
          - { finding: edema_face_hands, is: present }
          - { finding: vomiting, is: present }
          - { finding: persistent_vomiting, is: present }
          - { finding: abd_pain_location, in: [epigastric, right_upper] }
  reason_vi: "Thai từ 20 tuần kèm đau đầu, nhìn mờ, phù, nôn hoặc đau trên rốn cần khám ngay vì nguy cơ tiền sản giật."
  evidence:
    tier: B
    basis: verbal
    sources: [nice-ng133]
    locator: "NG133 khuyến cáo 1.1.1"
    note: "NG133: phụ nữ có thai cần gặp nhân viên y tế ngay khi đau đầu dữ dội, nhìn mờ hoặc chớp sáng trước mắt, đau dữ dội ngay dưới sườn, nôn, phù mặt, tay hoặc chân đột ngột. Lượt R thêm nôn và đau vùng trên rốn, dưới sườn phải. Quy tắc giữ mọi mức đau đầu (nguồn nói 'dữ dội') để thận trọng; chờ bác sĩ duyệt."
- id: rf_postpartum_headache
  level: 3
  when:
    all:
      - { finding: recent_childbirth, is: present }
      - any:
          - { finding: headache, is: present }
          - { finding: blurred_vision, is: present }
  reason_vi: "Đau đầu hoặc nhìn mờ trong 6 tuần sau sinh cần được khám sớm."
  evidence:
    tier: B
    basis: judgment
    sources: [nice-ng194, nice-ng133]
    locator: "NG194 khuyến cáo 1.2.4; NG133 khuyến cáo 1.1.1"
    note: "Mức nền cho mọi đau đầu sau sinh. Đau đầu dai dẳng, đau nhiều hoặc rối loạn thị lực được nâng lên mức 2 ở rf_postpartum_severe_headache. Chờ bác sĩ duyệt."
- id: rf_postpartum_severe_headache
  level: 2
  conditions: [preeclampsia]
  when:
    all:
      - { finding: recent_childbirth, is: present }
      - any:
          - { finding: headache_severity, in: [moderate, severe] }
          - { finding: headache_duration, in: [h4_72, gt_3d] }
          - { finding: blurred_vision, is: present }
          - { finding: vision_loss_or_double, is: present }
  reason_vi: "Đau đầu dai dẳng, đau nhiều hoặc nhìn mờ trong 6 tuần sau sinh cần được khám ngay."
  evidence:
    tier: B
    basis: judgment
    sources: [nice-ng194, nice-ng133]
    locator: "NG194 khuyến cáo 1.2.4; NG133 khuyến cáo 1.1.1"
    note: "Quy tắc mới của lượt R. NG194: người mẹ cần đi khám không chậm trễ khi đau đầu dai dẳng hoặc dữ dội (tăng huyết áp, tiền sản giật, bệnh nội sọ...). doctor-v hiểu 'dai dẳng' là kéo dài từ 4 giờ và 'dữ dội' là mức đau vừa trở lên; chờ bác sĩ duyệt."
- id: rf_pregnancy_severe_bp
  level: 2
  conditions: [preeclampsia]
  when:
    all:
      - { finding: pregnant, is: present }
      - { finding: bp_measured, in: [very_high, extreme] }
  reason_vi: "Huyết áp từ 160/110 khi đang có thai cần được khám cấp cứu."
  evidence:
    tier: B
    basis: verbal
    sources: [nice-ng133]
    locator: "NG133 mục Terms used (severe hypertension); bảng xử trí tăng huyết áp thai kỳ (nhập viện)"
    note: "NG133 định nghĩa tăng huyết áp nặng là trên 160 mmHg tâm thu hoặc trên 110 mmHg tâm trương và khuyến cáo nhập viện (khi dưới 160/110 thì xử trí như tăng huyết áp thường). Lựa chọn 'từ 160/110' của doctor-v gồm cả đúng 160/110 (thận trọng hơn một chút)."
- id: rf_extreme_bp_with_symptoms
  level: 2
  conditions: [stroke]
  when:
    all:
      - { finding: bp_measured, in: [extreme] }
      - any:
          - { finding: confusion, is: present }
          - { finding: blurred_vision, is: present }
          - { finding: chest_pain_pressure, is: present }
          - { finding: breathing_difficulty, is: present }
  reason_vi: "Huyết áp từ 180/120 kèm lú lẫn, nhìn mờ, đau ngực hoặc khó thở cần được khám cấp cứu."
  evidence:
    tier: B
    basis: verbal
    sources: [nice-ng136]
    locator: "NG136 khuyến cáo 1.5.2"
    note: "NG136: huyết áp từ 180/120 kèm xuất huyết võng mạc, phù gai thị, hoặc triệu chứng đe dọa tính mạng (lú lẫn mới, đau ngực, dấu hiệu suy tim, tổn thương thận cấp) thì khám chuyên khoa trong ngày. Lượt R thay đau đầu bằng lú lẫn vì NICE không xếp đau đầu đơn thuần vào nhóm này; đau đầu kèm huyết áp từ 180/120 vẫn ở mức 3 (rf_extreme_bp). Nhìn mờ thay cho dấu hiệu võng mạc không tự đánh giá được; khó thở thay cho dấu hiệu suy tim."
- id: rf_extreme_bp
  level: 3
  when: { finding: bp_measured, in: [extreme] }
  reason_vi: "Huyết áp từ 180/120 cần được khám trong hôm nay."
  evidence:
    tier: B
    basis: judgment
    sources: [nice-ng136]
    locator: "NG136 khuyến cáo 1.5.1"
    note: "NG136: huyết áp từ 180/120 không kèm triệu chứng thì thăm dò tổn thương cơ quan đích càng sớm càng tốt và đo lại trong 7 ngày. doctor-v chọn mức 3 (thận trọng hơn) vì người dùng tự đo và không được khám đáy mắt."
- id: rf_new_headache_over_50
  level: 3
  when:
    all:
      - { age_years_gte: 50 }
      - { finding: headache_course, in: [first_time, progressive] }
  reason_vi: "Đau đầu kiểu mới ở người từ 50 tuổi cần được khám sớm."
  evidence:
    tier: B
    basis: judgment
    sources: [nice-cg150]
    locator: "CG150 khuyến cáo 1.1.1"
    note: "CG150 không nêu riêng mốc 50 tuổi; khuyến cáo 1.1.1 nêu triệu chứng gợi ý viêm động mạch tế bào khổng lồ và thay đổi rõ tính chất đau đầu là dấu hiệu cần đánh giá. Mốc 50 tuổi là lựa chọn của người soạn, chờ bác sĩ duyệt."
- id: rf_progressive_headache
  level: 3
  when: { finding: headache_course, in: [progressive] }
  reason_vi: "Đau đầu nặng dần trong nhiều tuần cần được khám sớm."
  evidence:
    tier: B
    basis: judgment
    sources: [nice-cg150, nhs-headaches]
    locator: "CG150 khuyến cáo 1.1.1 (thay đổi rõ tính chất đau đầu); NHS Headaches (urgent GP: trẻ đau đầu tăng dần)"
    note: "CG150 không nêu riêng 'đau tăng dần trong nhiều tuần'; gần nhất là 'thay đổi rõ tính chất đau đầu'. NHS: trẻ đau đầu tăng dần hoặc đau thức giấc ban đêm thì hẹn khám khẩn hoặc gọi 111."
- id: rf_immunocompromised_headache
  level: 3
  when:
    all:
      - { finding: immunocompromised, is: present }
      - { finding: headache, is: present }
  reason_vi: "Người suy giảm sức đề kháng bị đau đầu cần được khám sớm."
  evidence:
    tier: B
    basis: verbal
    sources: [nice-cg150]
    locator: "CG150 khuyến cáo 1.1.2"
    note: "CG150: đau đầu mới xuất hiện ở người suy giảm miễn dịch (HIV, thuốc ức chế miễn dịch) cần cân nhắc thăm dò hoặc chuyển tuyến. Quy tắc áp dụng cho mọi đau đầu, rộng hơn nguồn một chút."
- id: rf_new_headache_vomiting
  level: 3
  when:
    all:
      - { finding: headache_course, in: [first_time, progressive] }
      - any:
          - { finding: vomiting, is: present }
          - { finding: persistent_vomiting, is: present }
  reason_vi: "Đau đầu kiểu mới kèm nôn cần được khám sớm."
  evidence:
    tier: B
    basis: verbal
    sources: [nice-cg150, nhs-headaches]
    locator: "CG150 khuyến cáo 1.1.2; NHS Headaches (urgent GP: headache and being sick)"
    note: "Quy tắc mới của lượt R. CG150: đau đầu mới xuất hiện kèm nôn không rõ nguyên nhân khác thì cân nhắc thăm dò hoặc chuyển tuyến. NHS: đau đầu kèm nôn thì hẹn khám khẩn hoặc gọi 111. Giới hạn ở đau đầu lần đầu hoặc nặng dần để không xếp cao cơn đau nửa đầu quen thuộc."

# ---------- Chóng mặt, ngất, hồi hộp (Giai đoạn 3, lô 1) ----------
# Người bảo trì soạn; lượt R (agent:pass-r, 25/10/2026) đối chiếu từng quy tắc với văn bản gốc, sửa mức,
# điều kiện, phạm vi, nguồn và thêm 5 quy tắc (4 trong khối này và rf_fainting_with_headache, tách từ
# rf_fainting_with_pain). Biên bản: knowledge/drafts/phase-3/batch-1/review-rules.md.
# Mức theo nguồn: NHS "Call 999" (chỉ gọi 999) tương ứng mức 1; NHS "Call 999 or go to A&E" và ESC 2018
# "đánh giá tại khoa cấp cứu" tương ứng mức 2. Ngoại lệ ghi rõ trong note.
# Sau lượt C, thêm các bệnh mới vào `conditions` (danh sách ở knowledge/drafts/phase-3/batch-1/scope.yaml).

- id: rf_dizziness_central_signs
  level: 2
  conditions: [stroke]
  complaints: [dizziness]
  when:
    any:
      - { finding: vision_loss_or_double, is: present }
      - all:
          - { finding: cannot_walk_unaided, is: present }
          - { finding: dizziness_pattern, in: [long_episodes, continuous] }
  reason_vi: "Chóng mặt kèm nhìn đôi, mất thị lực hoặc mất thăng bằng không tự đi được có thể do đột quỵ. Cần khám cấp cứu ngay."
  evidence:
    tier: B
    basis: verbal
    sources: [grace3-dizziness-2023, byt-qd-3312-2024, nhs-vertigo, nhs-stroke-symptoms]
    locator: "GRACE-3 khuyến cáo 2, 4 (trang SAEM); 3312/QĐ-BYT (2024) bài 2 mục 3.1, 3.4; NHS Vertigo (Call 999 or go to A&E); NHS Symptoms of a stroke"
    note: "GRACE-3: ở hội chứng tiền đình cấp, mức độ đi không vững giúp phân biệt nguyên nhân trung ương (đột quỵ) với ngoại biên (khuyến cáo 4); HINTS cần người được đào tạo. 3312/QĐ-BYT (2024): nhồi máu não khởi phát đột ngột với mất thị lực, nhìn đôi, thất điều, chóng mặt (chóng mặt hiếm khi đơn độc); viêm mê đạo có thể nhầm với đột quỵ tiểu não. NHS Vertigo: chóng mặt quay kèm nhìn đôi hoặc mất thị lực thì gọi 999 hoặc đến cấp cứu (mức 2). Lượt R sửa điều kiện: 'không tự đi được' chỉ tính khi chóng mặt liên tục hoặc thành cơn vài phút đến vài giờ, không tính cơn ngắn dưới 1 phút, vì trong cơn chóng mặt tư thế kịch phát lành tính người bệnh có thể không đứng được vài giây rồi hết; kiểu chóng mặt 'không rõ' thì quy tắc ở trạng thái không rõ (ít nhất mức 3); chóng mặt âm ỉ nhiều tuần không tính (không phải cấp cứu). Bỏ nguồn NHS Dizziness: trang này chỉ khuyên khám không khẩn khi nhìn đôi, tê yếu tay chân."

- id: rf_dizziness_central_signs_high_risk
  level: 1
  conditions: [stroke]
  complaints: [dizziness]
  when:
    all:
      - any:
          - { finding: vision_loss_or_double, is: present }
          - all:
              - { finding: cannot_walk_unaided, is: present }
              - { finding: dizziness_pattern, in: [long_episodes, continuous] }
      - any:
          - { age_years_gte: 50 }
          - { finding: hypertension_known, is: present }
          - { finding: diabetes, is: present }
          - { finding: known_heart_disease, is: present }
          - { finding: neck_injury_or_manipulation, is: present }
  reason_vi: "Chóng mặt kèm nhìn đôi, mất thị lực hoặc không tự đi được ở người có nguy cơ đột quỵ: gọi 115 ngay."
  evidence:
    tier: B
    basis: judgment
    sources: [byt-qd-3312-2024, grace3-dizziness-2023, nhs-stroke-symptoms, biller-stroke-2014, rothwell-stroke-2001]
    locator: "3312/QĐ-BYT (2024) bài 2 mục 3.1, 4.1; GRACE-3 khuyến cáo 2, 4; NHS Symptoms of a stroke (Call 999 now if); Biller 2014 (tóm tắt); Rothwell 2001 (tóm tắt)"
    note: "Cùng cấu trúc với rf_befast_high_risk (Đau đầu): dấu hiệu B (thăng bằng) và E (mắt) của BE-FAST ở người từ 50 tuổi hoặc có tăng huyết áp, đái tháo đường, bệnh tim. 3312/QĐ-BYT (2024): khi phát hiện đột quỵ cấp cần vận chuyển nhanh, an toàn đến cơ sở điều trị được đột quỵ. NHS: nghĩ đang bị đột quỵ thì gọi 999; dấu hiệu gồm chóng mặt hoặc ngã, nhìn mờ hoặc mất thị lực. Cùng giới hạn kiểu chóng mặt như rf_dizziness_central_signs. Mức 1 và ngưỡng 50 tuổi là nhận định (như quy tắc của Đau đầu), chờ bác sĩ duyệt. Lô 2: thêm 'bị bẻ, nắn cổ hoặc chấn thương cổ trong 1 tháng qua' vào yếu tố nguy cơ. Lượt R đối chiếu (26/10/2026, chỉ đọc được tóm tắt): Biller 2014 (AHA/ASA): bóc tách động mạch cổ là một trong những nguyên nhân hay gặp nhất của đột quỵ ở người trẻ và trung niên; lực cơ học có thể gây tổn thương nội mạc động mạch đốt sống và động mạch cảnh trong; phần lớn nghiên cứu bệnh–chứng dân số thấy liên quan giữa nắn chỉnh cột sống cổ và đột quỵ do bóc tách động mạch đốt sống ở người trẻ. Rothwell 2001: người dưới 45 tuổi bị đột quỵ hệ sống–nền có khả năng đã đi nắn chỉnh cột sống trong 1 tuần trước cao gấp khoảng 5 lần nhóm chứng. Bản nháp ghi 'ở mọi lứa tuổi'; nguồn chỉ nói người trẻ và trung niên (người lớn tuổi đã được tính qua tuổi và bệnh nền)."

- id: rf_acute_vertigo_vascular_risk
  level: 2
  conditions: [stroke]
  complaints: [dizziness]
  when:
    all:
      - { finding: dizziness_pattern, in: [continuous] }
      - any:
          - { age_years_gte: 60 }
          - { finding: hypertension_known, is: present }
          - { finding: diabetes, is: present }
          - { finding: known_heart_disease, is: present }
          - { finding: neck_injury_or_manipulation, is: present }
  reason_vi: "Chóng mặt liên tục mới xuất hiện ở người có nguy cơ đột quỵ cần khám cấp cứu. Tại nhà không phân biệt được với đột quỵ."
  evidence:
    tier: B
    basis: judgment
    sources: [grace3-dizziness-2023, byt-qd-3312-2024, biller-stroke-2014, rothwell-stroke-2001]
    locator: "GRACE-3: định nghĩa hội chứng tiền đình cấp, khuyến cáo 2–7 (trang SAEM); 3312/QĐ-BYT (2024) bài 2 mục 3.4; Biller 2014 (tóm tắt); Rothwell 2001 (tóm tắt)"
    note: "GRACE-3: chóng mặt liên tục, khởi phát cấp, kéo dài trên 24 giờ là hội chứng tiền đình cấp; cần người được đào tạo khám HINTS hoặc chụp cộng hưởng từ để phân biệt đột quỵ với viêm dây thần kinh tiền đình, chụp cắt lớp vi tính không dùng để phân biệt. GRACE-3 phân loại theo thời gian và yếu tố khởi phát, không theo cảm giác, nên lựa chọn 'liên tục không dứt, mới bắt đầu vài ngày nay' tương ứng định nghĩa này dù là chóng mặt quay hay choáng váng. 3312/QĐ-BYT (2024): viêm mê đạo có thể nhầm với đột quỵ tiểu não. Ở Việt Nam ít nơi khám được HINTS, nên người có nguy cơ mạch máu được khuyên đi cấp cứu ở bệnh viện điều trị được đột quỵ. Ngưỡng 60 tuổi do người bảo trì chọn (phần GRACE-3 đọc được không nêu ngưỡng tuổi); chờ bác sĩ duyệt. Lô 2: thêm 'bị bẻ, nắn cổ hoặc chấn thương cổ trong 1 tháng qua' vào yếu tố nguy cơ. Lượt R đối chiếu (26/10/2026, chỉ đọc được tóm tắt): Biller 2014 (AHA/ASA): bóc tách động mạch cổ là một trong những nguyên nhân hay gặp nhất của đột quỵ ở người trẻ và trung niên, biểu hiện bằng đau đầu một bên, đau gáy, thiếu máu não; phần lớn nghiên cứu bệnh–chứng dân số thấy liên quan giữa nắn chỉnh cột sống cổ và đột quỵ do bóc tách động mạch đốt sống ở người trẻ. Rothwell 2001: người dưới 45 tuổi bị đột quỵ hệ sống–nền có khả năng đã đi nắn chỉnh cột sống trong 1 tuần trước cao gấp khoảng 5 lần nhóm chứng. Chóng mặt tư thế sau chấn thương đầu cổ là từng cơn ngắn, không thuộc quy tắc này."

- id: rf_transient_neuro
  level: 2
  conditions: [transient_ischemic_attack, stroke]
  complaints: [dizziness, syncope, palpitations]
  when: { finding: transient_neuro_symptoms, is: present }
  reason_vi: "Yếu, tê nửa người hoặc nói khó rồi tự hết có thể là cơn thiếu máu não thoáng qua. Đây là dấu hiệu báo trước đột quỵ: cần khám cấp cứu ngay. Nếu mới xảy ra trong 24 giờ qua hoặc đang tái lại, gọi 115."
  evidence:
    tier: B
    basis: verbal
    sources: [byt-qd-3312-2024, nhs-tia, nhs-stroke-symptoms]
    locator: "3312/QĐ-BYT (2024) bài 1 mục 1.1.2, 3.1, 3.4, 4.2, 4.3.1; NHS TIA (When to get medical advice); NHS Symptoms of a stroke (Call 999 now if)"
    note: "3312/QĐ-BYT (2024): cơn thiếu máu não thoáng qua là triệu chứng thần kinh khu trú khởi phát đột ngột do thiếu máu não hoặc võng mạc, kéo dài không quá 24 giờ; nguy cơ tái phát sớm rất cao; điều trị dự phòng ngay, tối ưu trong 24 giờ đầu, có thể đến 7 ngày đầu; cần phân biệt với ngất, đau nửa đầu, động kinh, hạ đường huyết. NHS: có dấu hiệu thì gọi 999 ngay, kể cả khi đã hết trong lúc chờ xe; dấu hiệu đột quỵ trong 24 giờ qua dù đã hết cũng gọi 999; cần khám chuyên khoa trong 24 giờ kể từ khi khởi phát; từng bị mà đã qua, chưa đi khám thì hẹn khám khẩn. Câu hỏi gộp cả 7 ngày qua (khoảng có nguy cơ tái phát cao nhất theo 3312), nên giữ mức 2 cho cả nhóm và dặn gọi 115 trong câu lý do khi triệu chứng trong 24 giờ qua; cần thêm câu hỏi về thời điểm (xem biên bản). Lượt R bỏ NICE NG128 khỏi nguồn vì chưa mở được, và sửa câu hỏi để không tính lúc tối sầm mắt khi sắp ngất."

- id: rf_syncope_exertion_or_lying
  level: 2
  conditions: [cardiac_arrhythmia, acute_coronary_syndrome]
  complaints: [syncope]
  when: { finding: syncope_trigger, in: [exertion, lying] }
  reason_vi: "Ngất khi đang gắng sức hoặc đang nằm có thể do bệnh tim, cần khám cấp cứu ngay. Nhờ người đưa đi, không tự lái xe."
  evidence:
    tier: B
    basis: verbal
    sources: [esc-syncope-2018, nhs-fainting]
    locator: "ESC 2018 bảng 6 (nguy cơ cao loại nặng), hình 6, khuyến cáo xử trí ngất tại khoa cấp cứu (I, B), mục 4.2.9; NHS Fainting (Call 999 if someone)"
    note: "ESC 2018: ngất khi gắng sức hoặc khi nằm là đặc điểm nguy cơ cao loại nặng; người có đặc điểm này cần được đánh giá sớm, tích cực tại khoa cấp cứu hoặc đơn vị ngất, không cho về thẳng; tiền ngất xử trí như ngất. NHS Fainting: ngất khi tập luyện hoặc khi đang nằm thì gọi 999, không tự lái xe đến cấp cứu. Lượt R giữ mức 2 theo ESC vì người dùng app thường đã tỉnh lại, và câu hỏi gộp cả suýt ngất; câu lý do nhắc nhờ người đưa đi như NHS. Ngất sau khi đã dừng gắng sức thường do phản xạ (ESC mục 4.2.9) nhưng câu hỏi không tách được; chấp nhận xếp cao hơn cần. Lượt R thu hẹp phạm vi về Ngất: với Chóng mặt, lựa chọn 'khi đang nằm' dễ bị chọn khi chóng mặt tư thế kịch phát lành tính lúc trở mình, nên dùng rf_dizziness_faint_on_exertion (chỉ gắng sức); với Hồi hộp, rf_palpitations_danger đã ở mức 2 khi có choáng hoặc ngất. Bỏ NICE CG109 khỏi nguồn vì chưa mở được (theo bản tóm tắt RCEM 2012, CG109 chuyển khám tim mạch trong 24 giờ người mất ý thức khi gắng sức). Chờ bác sĩ duyệt mức 1 hay 2."

- id: rf_dizziness_faint_on_exertion
  level: 2
  conditions: [cardiac_arrhythmia, acute_coronary_syndrome]
  complaints: [dizziness]
  when: { finding: syncope_trigger, in: [exertion] }
  reason_vi: "Choáng như sắp ngất hoặc ngất khi đang gắng sức có thể do bệnh tim, cần khám cấp cứu ngay. Nhờ người đưa đi, không tự lái xe."
  evidence:
    tier: B
    basis: verbal
    sources: [esc-syncope-2018, nhs-fainting]
    locator: "ESC 2018 bảng 6, khuyến cáo xử trí ngất tại khoa cấp cứu, mục 4.2.9; NHS Fainting (Call 999 if someone)"
    note: "Quy tắc mới của lượt R, tách từ rf_syncope_exertion_or_lying cho triệu chứng chính Chóng mặt và chỉ giữ lựa chọn gắng sức. ESC 2018: ngất khi gắng sức là đặc điểm nguy cơ cao loại nặng, ngất trong lúc gắng sức thường do tim; tiền ngất xử trí như ngất. Bỏ lựa chọn 'khi đang nằm' vì ở người chóng mặt, chóng mặt tư thế kịch phát lành tính khi nằm, trở mình rất hay gặp và dễ được trả lời là 'choáng như sắp ngất khi đang nằm'."

- id: rf_syncope_palpitations_first
  level: 2
  conditions: [cardiac_arrhythmia]
  complaints: [syncope, dizziness, palpitations]
  when: { finding: syncope_warning, in: [palpitations_first] }
  reason_vi: "Tim đập nhanh hoặc loạn ngay trước khi ngất có thể do rối loạn nhịp tim, cần khám cấp cứu ngay. Nhờ người đưa đi, không tự lái xe."
  evidence:
    tier: B
    basis: verbal
    sources: [esc-syncope-2018, nhs-fainting]
    locator: "ESC 2018 bảng 6 (hồi hộp đột ngột rồi ngất ngay), bảng 7; NHS Fainting (Call 999 if someone)"
    note: "ESC 2018: hồi hộp xuất hiện đột ngột rồi ngất ngay sau đó là đặc điểm nguy cơ cao loại nặng, cần đánh giá tại khoa cấp cứu. NHS Fainting: người ngất có tim đập thình thịch, rung hoặc không đều thì gọi 999. Giữ mức 2 theo ESC vì 'tim đập nhanh' cũng gặp trong tiền triệu của ngất phản xạ; câu lý do nhắc nhờ người đưa đi. Chờ bác sĩ duyệt."

- id: rf_syncope_heart_disease
  level: 2
  conditions: [cardiac_arrhythmia, acute_coronary_syndrome]
  complaints: [syncope]
  when:
    all:
      - { finding: fainting_or_near_fainting, is: present }
      - { finding: known_heart_disease, is: present }
  reason_vi: "Ngất hoặc suýt ngất ở người có bệnh tim cần khám cấp cứu. Nhờ người đưa đi, không tự lái xe."
  evidence:
    tier: B
    basis: verbal
    sources: [esc-syncope-2018]
    locator: "ESC 2018 bảng 6 (tiền sử: bệnh tim cấu trúc hoặc bệnh mạch vành nặng), khuyến cáo xử trí ngất tại khoa cấp cứu (I, B)"
    note: "ESC 2018: bệnh tim cấu trúc hoặc bệnh mạch vành nặng (suy tim, phân suất tống máu thấp, nhồi máu cơ tim cũ) là đặc điểm nguy cơ cao loại nặng. Câu hỏi 'bệnh tim đã biết, như bệnh mạch vành hoặc suy tim' gần với tiêu chí này nhưng rộng hơn (có thể gồm bệnh tim nhẹ); chấp nhận. Lượt R bỏ NICE CG109 khỏi nguồn vì chưa mở được."

- id: rf_syncope_breathing
  level: 1
  conditions: [pulmonary_embolism, acute_coronary_syndrome, cardiac_arrhythmia]
  complaints: [syncope]
  when:
    all:
      - { finding: fainting_or_near_fainting, is: present }
      - { finding: breathing_difficulty, is: present }
  reason_vi: "Ngất hoặc suýt ngất kèm khó thở có thể do bệnh tim, phổi nguy hiểm: gọi 115 ngay."
  evidence:
    tier: B
    basis: judgment
    sources: [esc-syncope-2018, nhs-fainting]
    locator: "ESC 2018 bảng 6 (mới xuất hiện khó thở), hình 5; NHS Fainting (Call 999 if someone: chưa hồi phục hoàn toàn)"
    note: "ESC 2018: ngất kèm khó thở mới xuất hiện là đặc điểm nguy cơ cao loại nặng; hình 5 lấy thuyên tắc phổi (khó thở, đau ngực kiểu màng phổi, ngất) làm ví dụ ngất là triệu chứng của một bệnh cấp nặng hơn. NHS Fainting không nêu riêng khó thở, nhưng gọi 999 khi người ngất chưa hồi phục hoàn toàn; khó thở còn kéo dài sau ngất thuộc nhóm này. ESC chỉ nói đánh giá tại khoa cấp cứu; mức 1 là nhận định của người bảo trì, lượt R giữ vì thuyên tắc phổi và hội chứng vành cấp có ngất có thể xấu đi rất nhanh. Lượt R thu hẹp phạm vi về Ngất: với Chóng mặt dùng rf_dizziness_near_syncope_breathing (mức 2) vì choáng kèm thở nhanh hay gặp trong cơn hoảng sợ; với Hồi hộp dùng rf_palpitations_danger (mức 2, theo NHS). Khó thở dữ dội đã được bắt ở màn sàng lọc cấp cứu. Chờ bác sĩ duyệt."

- id: rf_dizziness_near_syncope_breathing
  level: 2
  conditions: [pulmonary_embolism, acute_coronary_syndrome, cardiac_arrhythmia]
  complaints: [dizziness]
  when:
    all:
      - { finding: fainting_or_near_fainting, is: present }
      - { finding: breathing_difficulty, is: present }
  reason_vi: "Chóng mặt, choáng như sắp ngất kèm khó thở cần được khám cấp cứu. Nếu khó thở nặng lên, đau ngực hoặc ngất: gọi 115."
  evidence:
    tier: B
    basis: judgment
    sources: [esc-syncope-2018]
    locator: "ESC 2018 bảng 6 (mới xuất hiện khó thở), lời khuyên kèm khuyến cáo xử trí tại khoa cấp cứu (tiền ngất)"
    note: "Quy tắc mới của lượt R, thay cho rf_syncope_breathing (mức 1) ở triệu chứng chính Chóng mặt. ESC 2018: tiền ngất xử trí như ngất; ngất kèm khó thở mới xuất hiện là đặc điểm nguy cơ cao loại nặng, cần đánh giá tại khoa cấp cứu. Chọn mức 2 vì ở người chọn Chóng mặt, choáng kèm thở nhanh hay gặp trong cơn hoảng sợ; khó thở dữ dội vẫn ở mức 1 qua màn sàng lọc cấp cứu, đau ngực qua rf_chest_pain_with_features và rf_dizziness_chest_pain. Chờ bác sĩ duyệt."

- id: rf_dizziness_chest_pain
  level: 1
  conditions: [acute_coronary_syndrome, pulmonary_embolism]
  complaints: [dizziness]
  when: { finding: chest_pain_pressure, is: present }
  reason_vi: "Đau, tức ngực kèm chóng mặt, choáng váng có thể là nhồi máu cơ tim: gọi 115 ngay."
  evidence:
    tier: B
    basis: verbal
    sources: [nice-cg95, nhs-chest-pain]
    locator: "CG95 khuyến cáo 1.2.1.3; NHS Chest pain (Call 999)"
    note: "Quy tắc mới của lượt R. NHS Chest pain: đau ngực kèm vã mồ hôi, buồn nôn, choáng váng hoặc khó thở thì gọi 999 (lượt R mở lại trang ngày 25/10/2026). Với triệu chứng chính Chóng mặt, choáng váng là chính triệu chứng chính nên mọi đau ngực đều lên mức 1, như rf_chest_pain_with_features đã làm với ngất hoặc choáng. CG95: đau ngực kèm rối loạn huyết động gợi ý hội chứng vành cấp. Viết thành quy tắc riêng thay vì thêm 'chóng mặt' vào rf_chest_pain_with_features, để không làm thay đổi cách hỏi ở triệu chứng chính Đau bụng."

- id: rf_syncope_gi_bleeding
  level: 1
  conditions: [upper_gi_bleeding, peptic_ulcer_gastritis]
  complaints: [syncope, dizziness, palpitations]
  when:
    all:
      - { finding: fainting_or_near_fainting, is: present }
      - any:
          - { finding: black_stool, is: present }
          - { finding: vomiting_blood, is: present }
  reason_vi: "Ngất hoặc choáng kèm nôn ra máu, đi ngoài phân đen là dấu hiệu mất máu nhiều: gọi 115 ngay."
  evidence:
    tier: B
    basis: judgment
    sources: [nice-cg141, esc-syncope-2018, who-bec-2018]
    locator: "CG141 khuyến cáo 1.1.1–1.1.2; ESC 2018 bảng 6 (nghi chảy máu tiêu hóa); WHO BEC: Shock"
    note: "ESC 2018: nghi chảy máu tiêu hóa là đặc điểm nguy cơ cao loại nặng của ngất. WHO BEC: nôn ra máu, phân đen là chảy máu đường tiêu hóa, một nguyên nhân gây sốc. CG141 (lượt R trước đã đối chiếu) khuyến cáo đánh giá nguy cơ mọi ca xuất huyết tiêu hóa trên bằng thang Blatchford; lần này không mở được nội dung thang. Riêng xuất huyết tiêu hóa đã ở mức 2 (rf_gi_bleeding); mức 1 khi kèm ngất hoặc choáng là nhận định (nguy cơ sốc mất máu), chờ bác sĩ duyệt."

- id: rf_syncope_family_sudden_death
  level: 3
  complaints: [syncope]
  when:
    all:
      - { finding: fainting_or_near_fainting, is: present }
      - { finding: family_sudden_death, is: present }
  reason_vi: "Ngất ở người có bố mẹ, anh chị em hoặc con đột tử trước 40 tuổi cần được khám tim trong 24 giờ."
  evidence:
    tier: B
    basis: judgment
    sources: [esc-syncope-2018, nhs-heart-palpitations]
    locator: "ESC 2018 bảng 6 (nguy cơ cao loại nhẹ: gia đình có người đột tử do tim khi còn trẻ); NHS Heart palpitations (See a GP)"
    note: "ESC 2018: đây là đặc điểm nguy cơ cao loại nhẹ, chỉ thành nguy cơ cao khi kèm bệnh tim cấu trúc hoặc điện tim bất thường, nên cần đo điện tim sớm. NHS Heart palpitations: gia đình có bệnh tim thì khám bác sĩ (không khẩn). NICE CG109 chưa mở được; theo bản tóm tắt RCEM 2012, CG109 chuyển khám tim mạch trong 24 giờ người mất ý thức thoáng qua có người nhà đột tử do tim dưới 40 tuổi. Mức 3 do người bảo trì chọn, phù hợp các nguồn trên; chờ bác sĩ duyệt."

- id: rf_syncope_pregnancy
  level: 3
  conditions: [ectopic_pregnancy]
  complaints: [syncope, dizziness]
  when:
    all:
      - { finding: fainting_or_near_fainting, is: present }
      - any:
          - { finding: pregnant, is: present }
          - { finding: missed_period, is: present }
  reason_vi: "Ngất hoặc choáng khi đang có thai hoặc chậm kinh cần được khám trong 24 giờ để loại trừ chửa ngoài tử cung."
  evidence:
    tier: B
    basis: verbal
    sources: [nice-ng126, nhs-ectopic-pregnancy]
    locator: "NG126 khuyến cáo 1.4.1, 1.4.3; NHS Ectopic pregnancy (When to get medical advice; When to get emergency help)"
    note: "NHS (lượt R mở lại ngày 25/10/2026): gọi 999 hoặc đến cấp cứu khi có kết hợp đau bụng đột ngột dữ dội, chóng mặt nhiều hoặc ngất, buồn nôn, da rất tái; có các triệu chứng chửa ngoài tử cung khác và có thể đang có thai thì khám bác sĩ gia đình hoặc gọi 111, kể cả khi chưa thử thai dương tính. Ngất hoặc choáng đơn thuần khi có thai chưa đủ tiêu chí cấp cứu nên giữ mức 3. Kèm đau bụng đã có rf_fainting_with_pain (mức 2); kèm da tái, tay chân lạnh đã có rf_shock_signs (mức 2) và rf_shock_multiple_signs (mức 1)."

- id: rf_palpitations_danger
  level: 2
  conditions: [cardiac_arrhythmia, acute_coronary_syndrome, pulmonary_embolism]
  complaints: [palpitations, dizziness, syncope]
  when:
    all:
      - { finding: palpitations, is: present }
      - any:
          - { finding: chest_pain_pressure, is: present }
          - { finding: breathing_difficulty, is: present }
          - { finding: fainting_or_near_fainting, is: present }
  reason_vi: "Hồi hộp kèm đau ngực, khó thở, choáng hoặc ngất cần khám cấp cứu ngay. Nhờ người đưa đi hoặc gọi 115, không tự lái xe."
  evidence:
    tier: B
    basis: verbal
    sources: [nhs-heart-palpitations, esc-syncope-2018, nhs-fainting]
    locator: "NHS Heart palpitations (Call 999 or go to A&E); ESC 2018 bảng 6, bảng 7; NHS Fainting (Call 999 if someone)"
    note: "Lượt R hạ từ mức 1 xuống mức 2 và thêm điều kiện 'có hồi hộp' để dùng chung cho Chóng mặt và Ngất. NHS: đang hồi hộp mà cơn không hết, hoặc kèm đau ngực, khó thở, choáng hoặc ngất thì gọi 999 hoặc đến cấp cứu (quy ước doctor-v: mức 2); nếu các triệu chứng đó đã hết thì hẹn khám khẩn hoặc gọi 111; không tự lái xe, nhờ người chở hoặc gọi xe cấp cứu. Câu hỏi không phân biệt cơn đang có hay đã hết nên giữ mức 2. ESC 2018: hồi hộp lúc ngất, ngất kèm đau ngực hoặc khó thở mới là đặc điểm nguy cơ cao (đánh giá tại khoa cấp cứu). Đau ngực kèm khó thở, vã mồ hôi, buồn nôn hoặc choáng vẫn ở mức 1 qua rf_chest_pain_with_features. Với Ngất, NHS Fainting khuyên gọi 999 khi người ngất có hồi hộp; giữ mức 2 vì tim đập nhanh còn gặp trong tiền triệu của ngất phản xạ. Mức 1 cũ làm mọi cơn hoảng sợ có khó thở hoặc choáng thành 'gọi 115'. Chờ bác sĩ duyệt."

- id: rf_pulse_extreme
  level: 2
  conditions: [cardiac_arrhythmia]
  complaints: [palpitations, dizziness, syncope]
  when: { finding: pulse_measured, in: [lt_40, gt_150] }
  reason_vi: "Mạch dưới 40 hoặc trên 150 lần mỗi phút lúc nghỉ, khi đang có triệu chứng, cần khám cấp cứu."
  evidence:
    tier: B
    basis: judgment
    sources: [esc-syncope-2018]
    locator: "ESC 2018 bảng 6 (khám thực thể: nhịp chậm dai dẳng dưới 40 lần/phút lúc thức, không do luyện tập; điện tim: nhịp xoang chậm hoặc rung nhĩ chậm dưới 40 lần/phút)"
    note: "Ngưỡng dưới 40 lần/phút theo ESC 2018 (nguy cơ cao loại nặng; ESC không tính người luyện tập thể thao). Ngưỡng trên 150 lần/phút không có trong các nguồn đã mở; người bảo trì chọn vì nhịp nhanh như vậy lúc nghỉ thường là cơn nhịp nhanh cần làm điện tim ngay (nhận định, chờ bác sĩ duyệt). Lượt R sửa câu gợi ý của pulse_measured: đo lúc ngồi hoặc nằm nghỉ, không đo ngay sau vận động. Trẻ 5–12 tuổi có nhịp tim lúc nghỉ cao hơn người lớn; ngưỡng 150 vẫn là bất thường khi nghỉ. Lưu ý: khoảng 60% người dùng chưa đo mạch sẽ chọn 'Không rõ'; khi đó quy tắc ở trạng thái 'không rõ' nên mức xử trí ít nhất là 3, và là 2 nếu từ 75 tuổi, có thai hoặc suy giảm miễn dịch. Ngôn ngữ quy tắc hiện không cho viết 'không rõ thì bỏ qua' với dấu hiệu nhiều lựa chọn (xem biên bản)."

- id: rf_hypoglycemia_suspected
  level: 3
  complaints: [dizziness, syncope, palpitations]
  when:
    all:
      - { finding: on_glucose_lowering_meds, is: present }
      - any:
          - { finding: tremor, is: present }
          - { finding: cold_sweat, is: present }
          - { finding: missed_meal, is: present }
          - { finding: glucose_measured, in: [low] }
          - { finding: better_after_sugar, is: present }
  reason_vi: "Đang dùng thuốc tiểu đường mà run tay, vã mồ hôi hoặc bỏ bữa có thể là hạ đường huyết. Nếu còn tỉnh và nuốt được, ăn hoặc uống ngay đồ ngọt, ví dụ một cốc nhỏ nước hoa quả hoặc nước ngọt có đường. Sau 10–15 phút chưa đỡ thì ăn, uống đồ ngọt lần nữa; đỡ rồi thì ăn thêm bữa nhẹ. Nếu lơ mơ hoặc không nuốt được, không cho ăn uống và gọi 115. Nên đi khám trong 24 giờ để xem lại thuốc."
  evidence:
    tier: C
    basis: judgment
    sources: [nhs-hypoglycaemia, who-bec-2018]
    locator: "NHS Low blood sugar (How to treat low blood sugar yourself; How to treat severe low blood sugar; Call 999 if; See a GP if); WHO BEC: Altered mental status (disposition)"
    note: "NHS: người dùng insulin hoặc một số thuốc tiểu đường dễ hạ đường huyết; còn tỉnh thì tự xử trí: ăn uống ngay thứ làm tăng đường huyết nhanh (một cốc nhỏ nước hoa quả hoặc nước ngọt có đường), đo lại sau 10–15 phút, chưa lên thì lặp lại và đo lại sau 10 phút, đỡ rồi ăn thêm bánh hoặc bữa ăn; bất tỉnh thì không cho ăn uống; gọi 999 khi đáp ứng không bình thường hoặc bất tỉnh mà không có glucagon, đã tiêm mà không hồi phục trong 10 phút, hoặc đã uống rượu; khám không khẩn khi hay bị, từng bị nặng hoặc bị về đêm. Như vậy NHS cho người còn tỉnh tự xử trí; doctor-v giữ mức 3 (không nâng lên mức 2) để không làm chậm việc ăn đồ ngọt ngay, và khuyên khám trong 24 giờ vì nhiều người không có máy đo đường huyết và hạ đường huyết có thể tái lại (WHO BEC: hạ đường huyết hay tái phát). Lú lẫn, li bì đã ở mức 1 (rf_altered_consciousness). Lượt R thêm 'đỡ hẳn sau khi ăn đồ ngọt' vào điều kiện và sửa câu lý do theo NHS (bản trước khuyên gọi 115 khi không đỡ sau 15 phút; NHS khuyên ăn đồ ngọt lần nữa). Lưu ý cho lượt C: nếu bệnh hạ đường huyết được khai báo mức 2 và 'không được bỏ sót', xác suất sẽ đẩy người tiểu đường có chóng mặt lên mức 2, lệch với NHS."

- id: rf_co_exposure
  level: 2
  conditions: [carbon_monoxide_poisoning]
  complaints: [dizziness, syncope]
  when: { finding: co_exposure, is: present }
  reason_vi: "Chóng mặt hoặc ngất khi ở phòng kín có đốt than, củi hoặc chạy máy nổ có thể là ngộ độc khí CO. Đưa mọi người ra chỗ thoáng khí ngay, rồi đến cơ sở cấp cứu. Không quay lại phòng đó và không tự lái xe."
  evidence:
    tier: C
    basis: judgment
    sources: [nhs-carbon-monoxide-poisoning, who-bec-2018]
    locator: "NHS Carbon monoxide poisoning (What to do; Urgent advice: Call NHS 111; Call 999 or go to A&E; Treatments); WHO BEC: Altered mental status (ngộ độc khí ở nhiều người)"
    note: "NHS: nghi ngộ độc thì ra ngoài, ngừng thiết bị phát khí nếu được, xin tư vấn y tế càng sớm càng tốt, không quay lại trước khi được tư vấn; có triệu chứng thì gọi 111; kèm khó thở, đột ngột lú lẫn, mất ý thức, mệt yếu, đau ngực hoặc đau cơ thì gọi 999 hoặc đến cấp cứu; người ngộ độc khí CO cần được kiểm tra ở bệnh viện (đo CO trong máu, thở oxy); không tự lái xe. WHO BEC: ngộ độc khí như CO gây rối loạn ý thức ở nhiều người cùng nơi, hay gặp khi sưởi trong nhà. Với Ngất (mất ý thức), mức 2 đúng theo NHS. Với Chóng mặt, NHS chỉ khuyên gọi 111 (tương ứng mức 3); doctor-v chọn mức 2 vì Việt Nam không có dịch vụ 111, đo CO trong máu và thở oxy chỉ làm được ở bệnh viện, và người ở cùng có thể đang nhiễm độc. Lú lẫn, li bì đã ở mức 1 (rf_altered_consciousness). Chưa có nguồn bậc A/B về mức xử trí (chưa tìm thấy hướng dẫn của Bộ Y tế về ngộ độc khí CO); chờ bác sĩ duyệt. Triệu chứng chính Đau đầu sẽ được thêm ở lô 2."

- id: rf_dizziness_fever_or_severe_headache
  level: 3
  complaints: [dizziness]
  when:
    any:
      - { finding: fever, is: present }
      - { finding: headache_severity, in: [severe] }
  reason_vi: "Chóng mặt kèm sốt hoặc đau đầu rất nặng cần được khám trong 24 giờ."
  evidence:
    tier: C
    basis: verbal
    sources: [nhs-vertigo]
    locator: "NHS Vertigo (Urgent advice: ask for an urgent GP appointment or get help from NHS 111)"
    note: "Quy tắc mới của lượt R. NHS Vertigo: chóng mặt quay kèm đau đầu dữ dội, nôn hoặc rất buồn nôn, sốt rất cao hoặc thấy nóng, lạnh, rét run thì hẹn khám khẩn hoặc gọi 111 (tương ứng mức 3). Nôn liên tục đã có rf_persistent_vomiting (mức 3); nôn thường không đưa vào vì hay gặp trong cơn chóng mặt tư thế kịch phát lành tính. Đau đầu đột ngột, dữ dội đã ở mức 1 (rf_thunderclap_headache). Áp dụng cho mọi kiểu chóng mặt, không chỉ chóng mặt quay."

- id: rf_shock_cold_and_weak
  level: 1
  conditions: [sepsis, dengue, ectopic_pregnancy, upper_gi_bleeding]
  complaints: [dizziness, syncope, palpitations]
  when:
    all:
      - { finding: cold_hands_feet, is: present }
      - any:
          - { finding: severe_weakness, is: present }
          - { finding: decreased_urine, is: present }
  reason_vi: "Tay chân lạnh, da tái kèm mệt lả hoặc tiểu ít là dấu hiệu sốc: gọi 115 ngay."
  evidence:
    tier: B
    basis: judgment
    sources: [byt-qd-2760-2023, nice-ng253, nice-ng254, nhs-sepsis]
    note: "Như rf_shock_multiple_signs nhưng bỏ nhánh ngất, choáng: với ba triệu chứng chính này, ngất hoặc choáng luôn có hoặc rất hay gặp, còn da tái thoáng qua sau một lần ngất thông thường không phải là sốc (người bảo trì, theo đề xuất của lượt R lô 1)."

- id: rf_syncope_not_recovered
  level: 2
  conditions: [acute_coronary_syndrome, ectopic_pregnancy]
  complaints: [syncope]
  when:
    all:
      - { finding: fainting_or_near_fainting, is: present }
      - { finding: not_recovered_after_faint, is: present }
  reason_vi: "Ngất mà đến giờ vẫn chưa tỉnh táo, chưa đứng dậy được như bình thường cần khám cấp cứu ngay."
  evidence:
    tier: B
    basis: verbal
    sources: [esc-syncope-2018, nhs-fainting]
    note: "ESC 2018: ngất là mất ý thức thoáng qua và tự hồi phục hoàn toàn; không hồi phục hẳn thì phải tìm nguyên nhân khác, nặng hơn. Người bảo trì thêm theo đề xuất của lượt R lô 1 (dấu hiệu 'hồi phục hoàn toàn sau ngất')."

- id: rf_vertigo_sudden_hearing_loss
  level: 2
  conditions: [stroke, vestibular_neuritis]
  complaints: [dizziness]
  when:
    all:
      - { finding: dizziness, is: present }
      - { finding: hearing_loss_sudden, is: present }
  reason_vi: "Chóng mặt kèm đột ngột nghe kém một bên tai cần khám cấp cứu ngay. Có thể do đột quỵ hoặc tổn thương tai trong cần điều trị sớm."
  evidence:
    tier: C
    basis: verbal
    sources: [nhs-vertigo]
    note: "NHS Vertigo: chóng mặt quay kèm nghe kém thì gọi 999 hoặc đến cấp cứu. Người bảo trì thêm theo đề xuất của lượt A và lượt R lô 1; cần nguồn bậc B (ví dụ hướng dẫn điếc đột ngột)."

- id: rf_dengue_fainting_defervescence
  level: 2
  conditions: [dengue]
  complaints: [dizziness, syncope]
  when:
    all:
      - { finding: fever, is: present }
      - { finding: fever_duration, in: [d3_5, d6_7] }
      - any:
          - { finding: fainting_or_near_fainting, is: present }
          - { finding: dizziness_on_standing, is: present }
  reason_vi: "Sốt ngày thứ 3–7 mà choáng, tối sầm mắt khi đứng dậy hoặc ngất có thể là giai đoạn nguy hiểm của sốt xuất huyết. Cần đến cơ sở y tế ngay."
  evidence:
    tier: B
    basis: verbal
    sources: [who-dengue-2009, byt-qd-2760-2023]
    locator: "WHO 2009, Textbox D (hạ huyết áp tư thế là dấu hiệu sốc còn bù) và Textbox E (tiêu chí nhập viện)"
    note: "WHO 2009 Textbox E: choáng váng hoặc hạ huyết áp tư thế; vã mồ hôi, ngất, lả khi hết sốt là tiêu chí nhập viện. Người bảo trì thêm theo đề xuất của lượt C lô 1 phần a; triệu chứng chính Sốt sẽ được xét ở lô 2."

- id: rf_dehydration_dizzy
  level: 3
  complaints: [dizziness, syncope]
  when:
    all:
      - any:
          - { finding: diarrhea, is: present }
          - { finding: vomiting, is: present }
      - any:
          - { finding: decreased_urine, is: present }
          - { finding: fainting_or_near_fainting, is: present }
  reason_vi: "Tiêu chảy hoặc nôn kèm tiểu ít hoặc ngất là dấu hiệu mất nước. Uống bù nước từng ngụm nhỏ và đi khám trong 24 giờ."
  evidence:
    tier: C
    basis: judgment
    sources: [nhs-diarrhoea-vomiting, who-dengue-2009]
    note: "NHS Diarrhoea and vomiting: cần tư vấn khẩn (gọi 111) khi nôn liên tục không giữ được nước; với người lớn, NHS không nêu choáng khi đứng dậy là lý do khám khẩn, nên quy tắc chỉ dùng tiểu ít hoặc ngất. Người bảo trì thêm theo đề xuất của lượt C lô 1 phần a; ước lượng mức 3."

- id: rf_breathless_leg_swelling
  level: 1
  conditions: [pulmonary_embolism]
  complaints: [palpitations, dizziness, syncope]
  when:
    all:
      - { finding: breathing_difficulty, is: present }
      - { finding: leg_swelling_one_side, is: present }
  reason_vi: "Khó thở kèm sưng đau một bên bắp chân có thể là cục máu đông trôi lên phổi: gọi 115 ngay."
  evidence:
    tier: B
    basis: judgment
    sources: [nhs-pulmonary-embolism, esc-pe-2019]
    note: "NHS: khó thở đột ngột (có thể kèm sưng đau bắp chân) thì gọi 999 hoặc đến cấp cứu. ESC 2019: dấu hiệu huyết khối tĩnh mạch sâu kèm khó thở là khả năng thuyên tắc phổi cao. Chọn mức gọi 115 (phương án 999 của NHS) theo nguyên tắc an toàn trước hết, vì có cả hai dấu hiệu. Người bảo trì thêm theo đề xuất của lượt C lô 1 phần b; khi đã ở mức 2, bộ suy luận hỏi tiếp câu sưng chân."

- id: rf_palpitations_ongoing
  level: 2
  conditions: [cardiac_arrhythmia]
  complaints: [palpitations]
  when:
    all:
      - { finding: palpitation_duration, in: [ongoing] }
      - { finding: palpitation_abrupt_onset, is: present }
  reason_vi: "Cơn hồi hộp đến đột ngột mà chưa hết cần đến cấp cứu để đo điện tim ngay lúc đang có cơn. Nhờ người đưa đi, không tự lái xe."
  evidence:
    tier: C
    basis: verbal
    sources: [nhs-heart-palpitations]
    note: "NHS Heart palpitations (lượt R đã mở): đang hồi hộp và cơn không hết thì gọi 999 hoặc đến cấp cứu (mức 2 theo quy ước của lượt R). Người bảo trì thêm theo đề xuất của lượt C lô 1 phần b. Cần thêm 'cơn đến đột ngột': người tim nhanh âm ỉ nhiều tuần (cường giáp, thiếu máu) cũng trả lời 'đến giờ vẫn còn', nhưng đó không phải một cơn chưa dứt (lần chạy dev đầu tiên của lô 1)."

- id: rf_recurrent_vertigo
  level: 4
  complaints: [dizziness]
  when:
    all:
      - { finding: vertigo_spinning, is: present }
      - any:
          - { finding: similar_episodes_before, is: present }
          - { finding: dizziness_pattern, in: [long_episodes, chronic] }
  reason_vi: "Chóng mặt quay cuồng hay tái lại hoặc kéo dài cần đi khám để tìm nguyên nhân."
  evidence:
    tier: C
    basis: verbal
    sources: [nhs-vertigo]
    note: "NHS Vertigo (lượt R đã mở): đi khám (không khẩn) khi chóng mặt quay không hết hoặc hay tái lại. Người bảo trì thêm theo đề xuất của lượt C lô 1 phần a. Lô 2: tính cả kiểu 'từng cơn, mỗi cơn vài phút đến vài giờ', vì đó đã là nhiều cơn; phiên hỏi thường dừng trước khi hỏi 'đã từng bị như vậy' (ca d-from-h-dizzy-015). Lượt R lô 2 đối chiếu: phù hợp NHS Vertigo ('keeps coming back': mức 4); cơn chóng mặt kéo dài kèm nhìn đôi, không tự đi được hoặc dấu hiệu thần kinh vẫn do các quy tắc mức 1–2 xử lý, nên mức 4 ở đây chỉ là mức sàn."

- id: rf_co_exposure_syncope
  level: 1
  conditions: [carbon_monoxide_poisoning]
  complaints: [syncope]
  when: { finding: co_exposure, is: present }
  reason_vi: "Ngất hoặc choáng khi ở phòng kín có đốt than, củi hoặc chạy máy nổ có thể là ngộ độc khí CO nặng. Đưa mọi người ra chỗ thoáng khí và gọi 115 ngay."
  evidence:
    tier: C
    basis: verbal
    sources: [nhs-carbon-monoxide-poisoning]
    note: "NHS Carbon monoxide poisoning: đã phơi nhiễm kèm mất ý thức hoặc lú lẫn đột ngột thì gọi 999. Triệu chứng chính Ngất gồm cả suýt ngất; chọn mức 1 vì không phân biệt được tại nhà và khí CO vẫn còn trong phòng."

- id: rf_febrile_shock_signs
  level: 1
  conditions: [dengue, sepsis]
  complaints: [dizziness, syncope, palpitations]
  when:
    all:
      - { finding: fever, is: present }
      - { finding: cold_hands_feet, is: present }
      - any:
          - { finding: fainting_or_near_fainting, is: present }
          - { finding: dizziness_on_standing, is: present }
          - { finding: severe_weakness, is: present }
          - { finding: decreased_urine, is: present }
  reason_vi: "Sốt hoặc vừa hết sốt mà tay chân lạnh, da tái kèm choáng, ngất, mệt lả hoặc tiểu ít là dấu hiệu sốc: gọi 115 ngay."
  evidence:
    tier: B
    basis: judgment
    sources: [byt-qd-2760-2023, who-dengue-2009, nhs-sepsis]
    note: "Sốc sốt xuất huyết, sốc nhiễm khuẩn: chi lạnh kèm hạ huyết áp tư thế, ngất hoặc lả khi hết sốt (WHO 2009 Textbox D, E; 2760/QĐ-BYT). Khác rf_shock_cold_and_weak: có sốt nên da tái, chi lạnh không còn là da tái thoáng qua sau một lần ngất thông thường."

- id: rf_syncope_multiple_high_risk
  level: 1
  conditions: [cardiac_arrhythmia, acute_coronary_syndrome]
  complaints: [syncope]
  when:
    at_least: 2
    of:
      - { finding: syncope_trigger, in: [exertion, lying] }
      - { finding: syncope_warning, in: [palpitations_first] }
      - { finding: family_sudden_death, is: present }
      - { finding: known_heart_disease, is: present }
      - { finding: chest_pain_pressure, is: present }
  reason_vi: "Ngất kèm từ hai dấu hiệu nguy cơ cao của bệnh tim có thể là rối loạn nhịp tim nguy hiểm: gọi 115 ngay."
  evidence:
    tier: B
    basis: judgment
    sources: [esc-syncope-2018]
    note: "ESC 2018 bảng 6: các đặc điểm nguy cơ cao loại nặng (ngất khi gắng sức hoặc khi nằm, hồi hộp ngay trước khi ngất, bệnh tim nặng, đau ngực mới) và tiền sử gia đình đột tử. Mỗi đặc điểm riêng lẻ đã ở mức 2; có từ hai đặc điểm thì chọn mức 1 (người bảo trì) vì nguy cơ đột tử trước khi đến viện."

- id: rf_symptomatic_bradycardia
  level: 1
  conditions: [cardiac_arrhythmia]
  complaints: [dizziness, syncope, palpitations]
  when:
    all:
      - { finding: pulse_measured, in: [lt_40] }
      - any:
          - { finding: fainting_or_near_fainting, is: present }
          - { finding: breathing_difficulty, is: present }
          - { finding: chest_pain_pressure, is: present }
          - { finding: confusion, is: present }
  reason_vi: "Mạch dưới 40 lần mỗi phút kèm choáng, ngất, khó thở hoặc đau ngực có thể do tim đập quá chậm: gọi 115 ngay."
  evidence:
    tier: B
    basis: judgment
    sources: [esc-syncope-2018]
    note: "ESC 2018 bảng 6: nhịp chậm kéo dài dưới 40 lần mỗi phút khi thức là đặc điểm nguy cơ cao loại nặng. Có triệu chứng thiếu máu não, khó thở hoặc đau ngực thì chọn mức 1 (người bảo trì)."

# ---------- Giai đoạn 3, lô 2 ----------
# Người bảo trì soạn; lượt R (agent:pass-r, 26/10/2026) mở từng nguồn, sửa điều kiện, nguồn, câu lý do.
# Biên bản: knowledge/drafts/phase-3/batch-2/review-rules.md. Quy ước mức như lô 1: NHS "Call 999" (chỉ
# gọi 999) là mức 1; "Call 999 or go to A&E" là mức 2; "urgent GP / NHS 111" là mức 3.
# Sau lượt C, thêm các bệnh mới vào `conditions` (danh sách ở knowledge/drafts/phase-3/batch-2/scope.yaml).
- id: rf_scrotal_pain
  level: 2
  complaints: [abdominal_pain]
  when: { finding: scrotal_pain, is: present }
  reason_vi: "Đau bụng kèm đau hoặc sưng bìu có thể là xoắn tinh hoàn. Cần đến cấp cứu ngay, vì chậm vài giờ có thể mất tinh hoàn."
  evidence:
    tier: B
    basis: verbal
    sources: [nhs-testicle-pain, eau-paediatric-urology-2026]
    locator: "NHS Testicle pain (Go to A&E immediately or call 999); EAU Paediatric Urology 2026, chương Acute scrotum (mục 8, 8.3.2)"
    note: "Lượt R mở hai nguồn (26/10/2026). NHS: đau tinh hoàn kèm buồn nôn, nôn hoặc đau bụng, đau đột ngột dữ dội, hoặc đau quá 1 giờ thì đến cấp cứu ngay hoặc gọi 999 (mức 2). Với triệu chứng chính Đau bụng, mọi đau bìu đều thuộc nhóm này. EAU: bìu cấp là cấp cứu tiết niệu nhi; đau đột ngột dữ dội kèm buồn nôn, nôn là điển hình của xoắn; tổn thương phụ thuộc thời gian, cửa sổ quyết định khoảng 4–6 giờ; mọi ca xoắn trong 24 giờ đầu phải mổ thám sát khẩn; xoắn hay gặp nhất ở sơ sinh và tuổi dậy thì. Lượt R thay 'phải mổ trong vài giờ' bằng 'chậm vài giờ có thể mất tinh hoàn' cho đúng với nguồn. Không mở rộng cho Sốt: câu đau bìu (tỷ lệ nền 1%) sẽ bị hỏi ở mọi nam giới sốt, và theo EAU chỉ 11–19% ca viêm mào tinh hoàn có sốt."

- id: rf_acute_glaucoma_signs
  level: 2
  complaints: [headache]
  when:
    all:
      - { finding: eye_pain_one_side, is: present }
      - any:
          - { finding: red_eyes, is: present }
          - { finding: halos_around_lights, is: present }
  reason_vi: "Đau đầu kèm đau nhức một bên mắt, đỏ mắt hoặc thấy quầng sáng quanh đèn có thể là cơn glôcôm cấp. Cần khám mắt cấp cứu ngay, vì chậm có thể mất thị lực."
  evidence:
    tier: B
    basis: verbal
    sources: [byt-qd-40-2015, nhs-glaucoma, nice-cg150]
    locator: "40/QĐ-BYT (2015) bài Glôcôm góc đóng nguyên phát, mục 1, 3a (cơn cấp), tr. 78–79; NHS Glaucoma (Call 999 or go to A&E); CG150 khuyến cáo 1.1.1"
    note: "Lượt R mở các nguồn (26/10/2026). 40/QĐ-BYT: cơn cấp khởi phát đột ngột, thường về chiều tối hoặc sau xúc động mạnh, với đau nhức mắt, nhức quanh hốc mắt lan lên nửa đầu cùng bên, nhìn mờ như qua màn sương, nhìn đèn thấy quầng xanh đỏ, sợ ánh sáng, chảy nước mắt; có thể buồn nôn, nôn, đau bụng, vã mồ hôi, sốt; khám thấy mắt cương tụ, thị lực giảm nhiều, nhãn áp rất cao; tổn thương thần kinh thị giác không hồi phục được nên phải điều trị kịp thời. NHS: triệu chứng glôcôm xuất hiện đột ngột (đau mắt dữ dội, mắt đỏ, đau quanh mắt, vòng sáng nhiều màu quanh đèn, nhìn mờ, buồn nôn, nôn, đau đầu) là cấp cứu: gọi 999 hoặc đến cấp cứu (mức 2). CG150: triệu chứng, dấu hiệu glôcôm góc đóng cấp là dấu hiệu cần đánh giá khi đau đầu. Không dùng 'nhìn mờ' làm điều kiện vì nhìn mờ, đốm sáng hay gặp trong đau nửa đầu có tiền triệu. Cơn đau đầu từng cụm (đau quanh một mắt kèm đỏ mắt, chảy nước mắt) cũng thỏa quy tắc; chấp nhận vì tại nhà không phân biệt được."

- id: rf_heat_stroke_signs
  level: 1
  complaints: [fever, headache, dizziness, syncope]
  when:
    all:
      - { finding: heat_exposure, is: present }
      - any:
          - { finding: confusion, is: present }
          - { finding: drowsy_hard_to_wake, is: present }
          - { finding: seizure_recent, is: present }
          - { finding: not_recovered_after_faint, is: present }
  reason_vi: "Lú lẫn, lơ mơ, co giật hoặc ngất chưa tỉnh hẳn sau khi ở nơi nắng nóng có thể là sốc nhiệt. Gọi 115 ngay. Trong lúc chờ, đưa vào chỗ mát, cởi bớt quần áo, lau hoặc xịt nước mát lên người và quạt liên tục."
  evidence:
    tier: B
    basis: verbal
    sources: [nhs-heat-exhaustion-heatstroke, who-bec-2018, nhs-fainting]
    locator: "NHS Heat exhaustion and heatstroke (Call 999 now if; What to do while waiting for help with heatstroke); WHO BEC Module 5 (Altered mental status: heat stroke; fever with altered mental status); NHS Fainting (Call 999 if someone)"
    note: "Lượt R mở các nguồn (26/10/2026). NHS: gọi 999 (chỉ 999, mức 1) khi có dấu hiệu sốc nhiệt: vẫn không khỏe sau 30 phút nghỉ chỗ mát, được làm mát và uống nước; thân nhiệt rất cao; da nóng không ra mồ hôi; tim đập nhanh; thở nhanh hoặc khó thở; lú lẫn, mất phối hợp; co giật; mất ý thức. Trong lúc chờ: quấn khăn ướt mát, hoặc quạt, lau người bằng nước lạnh; bất tỉnh thì đặt nằm nghiêng an toàn. Trang không nêu ngưỡng nhiệt độ (bản nháp ghi 'sốt từ 40°C' là không có trong nguồn). WHO BEC: sốc nhiệt (phơi nóng, nắng kéo dài; thân nhiệt cao, da rất nóng, có thể còn mồ hôi) là nguyên nhân rối loạn ý thức; thân nhiệt rất cao thì xịt nước mát, quạt. NHS Fainting: ngất mà chưa hồi phục hẳn thì gọi 999; lượt R thêm dấu hiệu này cho Ngất (NHS Heat: mất ý thức là dấu hiệu sốc nhiệt). Lú lẫn, li bì đã ở mức 1 (rf_altered_consciousness); quy tắc này thêm co giật, ngất chưa tỉnh hẳn và lời dặn làm mát. Không đưa thở nhanh, sốt cao, tim nhanh vào điều kiện: người sốt do nhiễm trùng làm việc ngoài trời cũng có các dấu hiệu này (tỷ lệ nền phơi nắng 15%). Chưa có câu hỏi 'đã làm mát 30 phút mà không đỡ' (xem biên bản). Lưu ý: khi lú lẫn đã đưa mức lên 1 thì phiên dừng, nên lời dặn làm mát chỉ hiện khi câu phơi nắng đã được hỏi trước đó."

- id: rf_kawasaki_signs
  level: 3
  complaints: [fever]
  when:
    all:
      - { age_groups: [child_2m_5y, child_5_12] }
      - { finding: fever_duration, in: [d3_5, d6_7, gt_7d] }
      - at_least: 2
        of:
          - { finding: red_eyes, is: present }
          - { finding: red_lips_strawberry_tongue, is: present }
          - { finding: hands_feet_swelling_peeling, is: present }
          - { finding: rash_any, is: present }
          - { finding: lymph_node_swelling, is: present }
          - { finding: bcg_scar_red, is: present }
  reason_vi: "Trẻ sốt từ 3 ngày kèm đỏ mắt, môi đỏ nứt, phát ban, sưng tay chân hoặc nổi hạch cổ có thể bị bệnh Kawasaki. Cần khám trong 24 giờ để được điều trị sớm, tránh tổn thương tim."
  evidence:
    tier: B
    basis: judgment
    sources: [byt-qd-3312-2015, nhs-kawasaki-disease]
    locator: "3312/QĐ-BYT (2015) bài Chẩn đoán và điều trị bệnh Kawasaki, mục 3.1, 3.3, 3.4, 4.2b (tr. 311–314); NHS Kawasaki disease (Urgent advice)"
    note: "Lượt R đối chiếu (26/10/2026). 3312/QĐ-BYT (2015): 6 biểu hiện chính (sốt liên tục từ 5 ngày; viêm kết mạc 2 bên; môi đỏ, khô nứt hoặc rỉ máu, lưỡi dâu tây; phù mu tay chân, đỏ lòng bàn tay chân, sau đó bong da đầu ngón; ban đa dạng; hạch góc hàm trên 1,5 cm); thể điển hình cần từ 5/6 biểu hiện, hoặc 4 biểu hiện kèm giãn động mạch vành; theo AHA, sốt từ 5 ngày là bắt buộc; thể không điển hình có ít biểu hiện hơn, cần xét nghiệm viêm và siêu âm tim; có thể tấy đỏ sẹo BCG; globulin miễn dịch nên dùng sớm trong 10 ngày đầu; tổn thương động mạch vành gặp ở khoảng một phần ba số ca không điều trị hoặc điều trị muộn; cần phân biệt với sởi, sốt tinh hồng nhiệt, dị ứng thuốc, nhiễm Leptospira, sốt xuất huyết. NHS: sốt từ 5 ngày là triệu chứng chính; có triệu chứng bệnh Kawasaki thì hẹn khám khẩn hoặc gọi 111 (mức 3). Ngưỡng 3 ngày và 2 dấu hiệu do người bảo trì chọn để không bỏ sót thể không điển hình (lựa chọn số ngày sốt không tách được mốc 5 ngày). Lượt R giữ: trẻ sốt 3–5 ngày kèm 2 dấu hiệu da, niêm mạc vẫn nên được khám trong 24 giờ dù là bệnh khác (sởi, sốt tinh hồng nhiệt, sốt xuất huyết); tay chân miệng sốt trên 2 ngày đã ở mức 2 (rf_hfmd_warning_signs); câu sưng, bong da tay chân đã loại trừ nốt phỏng của tay chân miệng. Sốt từ 6 ngày đã ở mức 3 (rf_prolonged_fever). Lượt R bỏ AHA 2017 khỏi nguồn vì chưa mở được toàn văn (xem nguồn aha-kawasaki-2017); tiêu chuẩn AHA lấy qua 3312/QĐ-BYT."

- id: rf_dka_suspected
  level: 2
  complaints: [abdominal_pain, fever, headache, dizziness, syncope]
  when:
    any:
      # Khát nhiều, tiểu nhiều kèm dấu hiệu nhiễm toan ceton, kể cả khi chưa biết bị đái tháo đường.
      - all:
          - { finding: thirst_polyuria, is: present }
          - any:
              - { finding: ketone_breath, is: present }
              - { finding: vomiting, is: present }
              - { finding: persistent_vomiting, is: present }
              - { finding: breathing_difficulty, is: present }
              # Đau bụng chỉ tính khi kèm mệt nhiều, như NHS (tiểu nhiều, rất khát và mệt, kèm đau bụng).
              - all:
                  - { finding: abdominal_pain, is: present }
                  - { finding: fatigue, is: present }
      # Đã biết đái tháo đường: hơi thở mùi ceton, hoặc đường huyết đo được cao kèm nôn, thở nhanh sâu.
      - all:
          - { finding: diabetes, is: present }
          - any:
              - { finding: ketone_breath, is: present }
              - all:
                  - { finding: glucose_measured, in: [high] }
                  - any:
                      - { finding: vomiting, is: present }
                      - { finding: persistent_vomiting, is: present }
                      - { finding: breathing_difficulty, is: present }
  reason_vi: "Khát nhiều, tiểu nhiều hoặc đường huyết cao kèm nôn, thở nhanh sâu, hơi thở mùi trái cây có thể là nhiễm toan ceton. Đây là biến chứng nặng của tiểu đường. Cần đến cấp cứu ngay."
  evidence:
    tier: B
    basis: judgment
    sources: [nhs-diabetic-ketoacidosis, nhs-type-1-diabetes, who-bec-2018, byt-qd-3312-2015]
    locator: "NHS Diabetic ketoacidosis (Call 999 or go to A&E; Urgent advice); NHS Type 1 diabetes: Symptoms (Call 999 or go to A&E); WHO BEC Module 3, 4 (diabetic ketoacidosis); 3312/QĐ-BYT (2015) bài Toan xeton do đái tháo đường, mục 1 (tr. 632)"
    note: "Lượt R mở các nguồn (26/10/2026). NHS DKA: triệu chứng gồm khát, tiểu nhiều; đau bụng, buồn nôn, nôn; tiêu chảy; thở sâu hơn bình thường; hơi thở mùi trái cây (như kẹo lê, nước rửa móng tay); mệt, buồn ngủ, lú lẫn; nhìn mờ; thường xuất hiện trong 24 giờ. Gọi 999 hoặc đến cấp cứu (mức 2) khi xeton cao, khi không biết mức xeton mà có triệu chứng nhiễm toan ceton, hoặc khi có triệu chứng mà chưa được chẩn đoán đái tháo đường; đường huyết cao mà insulin không làm giảm thì gọi nhóm chăm sóc đái tháo đường hoặc 111. NHS Type 1 diabetes: đang tiểu nhiều, rất khát và mệt, kèm đau bụng, tiêu chảy, buồn nôn, nôn, buồn ngủ, lú lẫn, thở nhanh sâu hoặc nặng lên nhanh thì gọi 999 hoặc đến cấp cứu. WHO BEC: nhiễm toan ceton gây thở nhanh, sâu (người bệnh có thể kể là khó thở), tiểu nhiều, hơi thở mùi ngọt, đường huyết cao, mất nước; người bệnh rất nặng, cần chuyển gấp. 3312/QĐ-BYT (2015): trẻ nhiễm toan ceton thường có sụt cân, đau bụng, nôn, đái nhiều, uống nhiều; thở nhanh sâu kiểu Kussmaul; đau bụng giống bệnh ngoại khoa cấp; li bì, hôn mê. Lượt R thu hẹp điều kiện: bản nháp tính mọi khó thở ở người đái tháo đường, nên người đái tháo đường cảm lạnh thở mệt cũng lên mức 2. Nay nôn, khó thở chỉ tính khi kèm khát nhiều, tiểu nhiều hoặc đường huyết đo được trên 11 mmol/L. Người đái tháo đường nôn vì ngộ độc thức ăn mà không khát nhiều, tiểu nhiều và chưa đo đường huyết thì không thuộc quy tắc này; nôn liên tục vẫn ở mức 3 (rf_persistent_vomiting). Đau bụng kèm khát nhiều, tiểu nhiều chỉ tính khi kèm mệt nhiều, đúng như tiêu chí của NHS Type 1 diabetes: người lớn đau bụng dưới kèm 'tiểu nhiều' dễ là viêm bàng quang (đi tiểu nhiều lần). Bản thử không đòi mệt (chỉ cho trẻ em, thiếu niên) làm câu khát nhiều bị hỏi thêm ở trẻ đau bụng và đẩy một ca đau bụng kinh ở bộ dev chạm giới hạn 30 câu. Lú lẫn, li bì đã ở mức 1 (rf_altered_consciousness). Chờ bác sĩ duyệt."

- id: rf_new_diabetes_child
  level: 3
  complaints: [abdominal_pain, fever, headache, dizziness]
  when:
    all:
