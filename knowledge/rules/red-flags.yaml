      - { finding: thirst_polyuria, is: present }
      - any:
          - { finding: weight_loss_unintended, is: present }
          - { finding: fatigue, is: present }
  reason_vi: "Trẻ khát nhiều, tiểu nhiều kèm sụt cân hoặc mệt có thể bị tiểu đường. Cần khám và thử đường máu ngay trong ngày."
  evidence:
    tier: B
    basis: verbal
    sources: [nhs-type-1-diabetes, byt-qd-3312-2015]
    locator: "NHS Type 1 diabetes: Symptoms (Urgent advice; How type 1 diabetes is diagnosed); 3312/QĐ-BYT (2015) bài Toan xeton do đái tháo đường, mục 1 (tr. 632)"
    note: "Lượt R mở các nguồn (26/10/2026). NHS: 4 dấu hiệu thường gặp là đi tiểu nhiều (nhất là ban đêm; trẻ có thể tã nặng hơn, đái dầm trở lại), rất khát, rất mệt, sụt cân; xuất hiện nhanh trong vài ngày đến vài tuần; nghĩ mình hoặc con bị đái tháo đường típ 1 thì hẹn khám khẩn hoặc gọi 111 (mức 3); xét nghiệm nghi típ 1 thì thường được khám chuyên khoa ở bệnh viện ngay trong ngày; trẻ có thể đồng thời bị cảm, viêm amidan, đau bụng nên dễ bỏ sót. 3312/QĐ-BYT (2015): bệnh sử của trẻ nhiễm toan ceton thường có sụt cân, đái nhiều, uống nhiều. Bản nháp dựa vào NICE NG18 (chuyển ngay trong ngày tới nhóm đái tháo đường nhi); lượt R chưa mở được NG18 (nice.org.uk chặn truy cập tự động) nên thay bằng hai nguồn trên, mức không đổi. Kèm nôn, thở nhanh sâu hoặc đau bụng thì lên mức 2 (rf_dka_suspected)."

- id: rf_aaa_rupture_signs
  level: 1
  complaints: [abdominal_pain, syncope, dizziness]
  when:
    all:
      - any:
          - { age_years_gte: 60 }
          - { finding: known_aaa, is: present }
      - any:
          - all:
              - { finding: abd_pain_severe, is: present }
              - any:
                  - { finding: fainting_or_near_fainting, is: present }
                  - { finding: cold_hands_feet, is: present }
          # Câu đau hông lưng, đau lan ra sau lưng không hỏi mức độ: chỉ tính khi kèm da tái lạnh hoặc
          # ngất chưa hồi phục hẳn (với Ngất, ngất luôn có; người cao tuổi hay đau lưng mạn tính).
          - all:
              - any:
                  - { finding: flank_pain, is: present }
                  - { finding: abd_pain_radiates_back, is: present }
              - any:
                  - { finding: cold_hands_feet, is: present }
                  - { finding: not_recovered_after_faint, is: present }
  reason_vi: "Đau bụng hoặc đau lưng dữ dội kèm ngất, choáng hoặc da tái lạnh có thể là vỡ phình động mạch chủ. Nguy cơ cao ở người từ 60 tuổi hoặc đã biết có phình động mạch chủ. Gọi 115 ngay."
  evidence:
    tier: B
    basis: judgment
    sources: [nhs-abdominal-aortic-aneurysm, who-bec-2018, nhs-fainting]
    locator: "NHS Abdominal aortic aneurysm (Call 999; Causes); WHO BEC Module 4 (Shock: severe abdominal pain, abdominal bleeding); NHS Fainting (Call 999 if someone)"
    note: "Lượt R mở các nguồn (26/10/2026). NHS AAA: gọi 999 (mức 1) khi đau bụng hoặc đau lưng đột ngột, dữ dội; khó thở hoặc ngừng thở; da tái hoặc xám; mất ý thức (dấu hiệu vỡ phình). Nguy cơ cao: nam từ 65 tuổi (Anh sàng lọc mọi nam giới 65 tuổi), đang hoặc từng hút thuốc, tăng huyết áp, mỡ máu cao, người thân bị phình động mạch chủ bụng, bệnh mạch vành hoặc động mạch ngoại biên, bệnh phổi tắc nghẽn mạn tính, hội chứng Marfan. WHO BEC: đau bụng dữ dội có thể là chảy máu trong ổ bụng, một nguyên nhân gây sốc. NHS Fainting: ngất chưa hồi phục hẳn thì gọi 999. Lượt R sửa điều kiện: (1) bỏ 'vã mồ hôi lạnh' khỏi dấu hiệu đi kèm, vì người cao tuổi đau quặn thận cũng hay vã mồ hôi (bản nháp đưa phần lớn cơn đau quặn thận ở người từ 60 tuổi lên mức 1); (2) đau hông lưng hoặc đau lan ra sau lưng chỉ tính khi kèm tay chân lạnh, da tái hoặc ngất chưa hồi phục hẳn, vì với triệu chứng chính Ngất, ngất luôn có, nên bản nháp đưa mọi người từ 60 tuổi có đau lưng mạn tính và một lần ngất tư thế lên mức 1; (3) thêm người đã biết có phình động mạch chủ ở mọi tuổi. Đau bụng dữ dội kèm choáng như sắp ngất ở người từ 60 tuổi đau quặn thận vẫn lên mức 1: NHS khuyên gọi 999 khi đau bụng, lưng đột ngột dữ dội ở người có thể bị phình, và tại nhà không phân biệt được với vỡ phình (chấp nhận xếp cao hơn cần). Ngưỡng 60 tuổi do người bảo trì chọn (NHS nêu nam từ 65 tuổi), để có khoảng an toàn cho người hút thuốc lâu năm; chờ bác sĩ duyệt. Đau bụng dữ dội đơn thuần vẫn ở mức 2 (rf_severe_abdominal_pain)."

- id: rf_lepto_severe
  level: 2
  complaints: [fever, headache]
  when:
    all:
      - { finding: fever, is: present }
      - { finding: flood_mud_exposure, is: present }
      - any:
          - { finding: jaundice, is: present }
          - { finding: decreased_urine, is: present }
          - { finding: bleeding_gums_nose, is: present }
          - { finding: hemoptysis, is: present }
          - { finding: breathing_difficulty, is: present }
  reason_vi: "Sốt sau khi lội nước bẩn, kèm vàng da, tiểu ít, chảy máu hoặc khó thở có thể là bệnh Leptospira thể nặng. Cần khám cấp cứu ngay."
  evidence:
    tier: B
    basis: verbal
    sources: [who-leptospirosis-2003, byt-qd-5642-2015]
    locator: "WHO 2003 chương II (Clinical manifestations; Cause of death; Is it leptospirosis?; Incubation period; Antibiotic treatment), tr. 4–7; 5642/QĐ-BYT bài Sốt mò, mục 3.4 (tr. 62)"
    note: "Lượt R mở WHO 2003 (bản PDF trên IRIS, 26/10/2026): bệnh có 4 nhóm biểu hiện: giống cúm nhẹ; hội chứng Weil (vàng da, suy thận, xuất huyết, viêm cơ tim kèm loạn nhịp); viêm màng não, viêm não màng não; xuất huyết phổi kèm suy hô hấp. Tử vong chủ yếu do suy thận, suy tim phổi, xuất huyết lan tỏa; thể nặng cần nhập viện, lọc máu khi suy thận; dùng kháng sinh ngay khi nghi, tốt nhất trước ngày thứ 5, không chờ xét nghiệm; người cao tuổi, nhiều bệnh nền dễ bị nặng; nghi khi có phơi nhiễm với động vật hoặc môi trường nhiễm nước tiểu động vật; ủ bệnh thường 5–14 ngày, dao động 2–30 ngày. 5642/QĐ-BYT: bệnh do Leptospira gây sốt, đau cơ, có thể phát ban, vàng da, tổn thương phổi, suy thận. Tiểu ít đại diện cho suy thận; khó thở, ho ra máu đại diện cho xuất huyết phổi. Khó thở ở người sốt làm ruộng có thể chỉ do viêm phổi (mức 3 theo rf_fever_breathing); lượt R giữ mức 2 vì xuất huyết phổi kèm suy hô hấp là thể nặng (WHO) và tại nhà không phân biệt được; đây là điểm có thể xếp cao hơn cần, chờ bác sĩ duyệt. Lú lẫn (viêm não màng não) đã ở mức 1, cứng gáy ở mức 2 theo quy tắc chung. Chưa tìm được hướng dẫn chẩn đoán, điều trị riêng của Bộ Y tế về bệnh này."

- id: rf_fever_jaundice
  level: 3
  complaints: [fever, abdominal_pain, headache]
  when:
    all:
      - { finding: fever, is: present }
      - { finding: jaundice, is: present }
  reason_vi: "Sốt kèm vàng da, vàng mắt cần khám trong 24 giờ để tìm nguyên nhân."
  evidence:
    tier: C
    basis: verbal
    sources: [nhs-jaundice, nhs-jaundice-in-babies]
    locator: "NHS Jaundice (Urgent advice); NHS Jaundice in babies (Urgent advice; Call 999 or go to A&E)"
    note: "Lượt R mở hai trang (26/10/2026). NHS Jaundice: da hoặc lòng trắng mắt vàng thì hẹn khám khẩn hoặc gọi 111 (mức 3), có sốt hay không; có thể kèm ngứa, nước tiểu sẫm, phân bạc màu. NHS Jaundice in babies: vàng da sơ sinh hay gặp, rõ nhất khoảng ngày thứ 3, thường hết sau khoảng 2 tuần; trẻ vàng da kèm thân nhiệt từ 38°C hoặc từ 36°C trở xuống, bú kém, li bì, khó thở, không có tã ướt, hoặc trẻ dưới 24 giờ tuổi thì gọi 999 hoặc đến cấp cứu; trẻ trên 24 giờ tuổi vàng da, không đỡ, nước tiểu sẫm hoặc phân bạc màu thì khám khẩn. Các mức này đã có sẵn: trẻ dưới 3 tháng sốt ở mức 2 (rg_fever_under_3_months), trẻ dưới 2 tháng luôn ở mức 3 (rg_young_infant_any) và lên mức 2 khi có dấu hiệu nguy hiểm (rg_young_infant_danger_sign); vì vậy quy tắc không cần nhánh riêng cho trẻ nhỏ, và vàng da sinh lý không làm trẻ bị xếp cao hơn. Sốt kèm vàng da và đau bụng ở mức 2 (rf_cholangitis_triad); sau khi đi rừng ở mức 2 (rf_fever_jaundice_malaria_exposure); sau khi lội nước bẩn ở mức 2 (rf_lepto_severe). Vàng da không sốt chưa có quy tắc (xem biên bản)."

