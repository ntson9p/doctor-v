  when: { finding: cough_duration, in: [w2_8, gt_8w] }
  reason_vi: "Ho từ 2 tuần trở lên cần được khám trong vài ngày, kể cả để xét nghiệm lao."
  evidence:
    tier: B
    basis: verbal
    sources: [byt-qd-162-2024, nhs-cough, who-imci-chart-booklet-2014]
    locator: "162/QĐ-BYT Phần II mục 1.1, Bảng 1; NHS Cough (See a GP: ho trên 3 tuần); IMCI Module 3 mục 3.4"
    note: "Lượt R vòng 2 mở nguồn. Văn bản hiện hành là 162/QĐ-BYT ngày 19/01/2024 (thay 1314/QĐ-BYT ngày 24/3/2020): ho kéo dài trên 2 tuần (ho khan, ho có đờm, ho ra máu) là triệu chứng nghi lao quan trọng nhất ở người lớn; ở trẻ em, bệnh kéo dài trên 2 tuần với ho, khò khè kéo dài. IMCI: trẻ ho trên 2 tuần thì chuyển khám lao, hen. NHS Cough: ho trên 3 tuần, sụt cân không rõ lý do, suy giảm miễn dịch thì khám bác sĩ gia đình (không khẩn, mức 4). Mức 4 hợp với cả ba nguồn; ho ra máu, khó thở đã có quy tắc riêng."

