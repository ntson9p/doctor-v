  reason_vi: "Ho từng cơn dồn dập kéo dài, rít khi hít vào hoặc nôn sau ho có thể là ho gà. Cần được khám trong 24 giờ."
  evidence:
    tier: B
    basis: verbal
    sources: [nhs-whooping-cough, who-emro-pertussis-surveillance]
    locator: "NHS Whooping cough (Urgent advice; Treatment); WHO EMRO, Pertussis disease surveillance (ca xác định lâm sàng)"
    note: "Lượt R vòng 2 mở nguồn. WHO (trang giám sát ho gà của Văn phòng khu vực Đông Địa Trung Hải): ca xác định lâm sàng là người ho ít nhất 2 tuần kèm ít nhất một trong ho từng cơn, rít khi hít vào, nôn ngay sau ho, không do nguyên nhân khác: đúng nhánh thứ hai của quy tắc. Định nghĩa riêng cho trẻ dưới 1 tuổi mà lượt trước ghi theo trí nhớ không có trên trang này (chưa xác minh, đã bỏ). NHS Whooping cough: trẻ dưới 6 tháng có triệu chứng ho gà, hoặc ho rất nặng và nặng dần, thì hẹn khám khẩn hoặc gọi 111 (mức 3); kháng sinh dùng khi chẩn đoán trong 3 tuần đầu kể từ khi ho, để giảm lây; ho có thể kéo dài nhiều tuần, nhiều tháng. Lượt R lô 3: bỏ ho từ 2 tháng (gt_8w) khỏi nhánh ho kéo dài (sau 3 tuần kháng sinh không còn giúp giảm lây); thêm nhánh trẻ dưới 6 tháng có cơn ho dồn dập hoặc nôn sau ho (mức 3, đúng mục khám khẩn của NHS)."
