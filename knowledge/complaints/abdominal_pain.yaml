id: abdominal_pain
label_vi: "Đau bụng"
icon: abdomen
synonyms_vi:
  - "đau bao tử"
  - "đau dạ dày"
  - "đau thượng vị"
  - "đau quặn bụng"
  - "đau quanh rốn"
  - "đau bụng dưới"
  - "đau bụng kinh"
  - "chướng bụng"
  - "đầy bụng"
description_vi: "Đau ở bất kỳ vùng nào của bụng, từ dưới ngực đến bẹn."
implies: [abdominal_pain]
red_flags:
  - group: young_infant_danger_signs
  - group: child_danger_signs
  - group: abdominal_red_flags
  # Lô 2: xoắn tinh hoàn ở trẻ trai, nam trẻ có thể chỉ biểu hiện bằng đau bụng (nhóm trên đã đủ 7 mục).
  - finding: scrotal_pain
  - group: general_danger_signs
  - finding: red_jelly_stool
  - finding: pregnant
  # Chậm kinh là câu then chốt cho chửa ngoài tử cung khi người bệnh chưa biết mình có thai (lượt C lô 4).
  - finding: missed_period
  # Khi có sốt: dấu hiệu nặng của nhiễm khuẩn huyết và số ngày sốt (cần cho các quy tắc giai đoạn
  # nguy hiểm của sốt xuất huyết), như với triệu chứng chính "Sốt" (lượt C lô 2).
  - group: fever_red_flags
  - finding: fever_duration
intake: [abdominal_associated, child_diabetes_signs, fever_exposures, chronic_conditions]
# Bệnh "không được bỏ sót" (mức 1–2) có prior cho triệu chứng chính này; danh sách để kiểm tra an toàn.
cant_miss: [acute_appendicitis, acute_coronary_syndrome, acute_pancreatitis, bowel_obstruction, ectopic_pregnancy, intussusception, preeclampsia, abdominal_aortic_aneurysm, acute_mesenteric_ischemia, ovarian_torsion, testicular_torsion, diabetic_ketoacidosis, acute_cholangitis]
safety_net:
  - abd_pain_severe
  - abdomen_hard_swollen
  - vomiting_blood
  - black_stool
  - fainting_or_near_fainting
  - persistent_vomiting
  - no_stool_or_gas
sources: [nhs-stomach-ache, who-bec-2018, wses-asbo-2018, nice-ng126]
