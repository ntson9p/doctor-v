id: headache
label_vi: "Đau đầu"
icon: head
synonyms_vi:
  - "nhức đầu"
  - "đau nửa đầu"
  - "căng đầu"
  - "nặng đầu"
  - "đau sau gáy"
  - "đau thái dương"
description_vi: "Đau ở vùng đầu, trán, thái dương hoặc sau gáy."
implies: [headache]
age_groups: [child_2m_5y, child_5_12, teen_13_17, adult_18_44, adult_45_64, elder_65_74, elder_75p]
red_flags:
  - group: child_danger_signs
  # Lô 2: hỏi trước nhóm dấu hiệu nguy hiểm. Người lú lẫn dừng ngay ở mức 1, nên nếu hỏi sau thì sốc nhiệt
  # không bao giờ vào danh sách cần loại trừ, và người nhà không được nhắc làm mát (như ở Ngất, Chóng mặt).
  - finding: heat_exposure
  - group: headache_red_flags
  # Lô 2: dấu hiệu glôcôm cấp là dấu hiệu cảnh báo của đau đầu (NICE CG150; nhóm trên đã đủ 7 mục).
  - finding: eye_pain_one_side
  - group: general_danger_signs
  # Lượt R: ban không mất khi ấn kèm đau đầu là dấu hiệu bệnh não mô cầu (NG240; NHS Headaches).
  - finding: rash_any
  - finding: rash_non_blanching
  - finding: pregnant
  - finding: gestational_age
  - finding: recent_childbirth
  # Khi có sốt: dấu hiệu nặng của nhiễm khuẩn huyết và số ngày sốt (cần cho các quy tắc giai đoạn
  # nguy hiểm của sốt xuất huyết), như với triệu chứng chính "Sốt" (lượt C lô 2).
  - group: fever_red_flags
  - finding: fever_duration
intake: [headache_associated, fever_exposures, chronic_conditions]
# Bệnh "không được bỏ sót" (mức 1–2) có prior cho triệu chứng chính này; danh sách để kiểm tra an toàn.
cant_miss: [bacterial_meningitis, preeclampsia, stroke, subarachnoid_hemorrhage, encephalitis, acute_angle_closure_glaucoma, heat_stroke]
safety_net:
  - headache_thunderclap
  - neck_stiffness
  - confusion
  - vision_loss_or_double
  - seizure_recent
  - es_stroke_signs
  - rash_non_blanching
sources: [nice-cg150, nice-ng228, nice-ng232, nice-ng240, nhs-headaches]
