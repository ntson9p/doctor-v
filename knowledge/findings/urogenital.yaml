# Tiết niệu, sinh dục, thai sản.
- id: dysuria
  kind: symptom
  type: binary
  label_vi: "Đau buốt khi đi tiểu"
  question_vi: "Có đau buốt hoặc nóng rát khi đi tiểu không?"
  cluster: lower_urinary
  leak: moderate
- id: urinary_frequency
  kind: symptom
  type: binary
  label_vi: "Đi tiểu nhiều lần, mỗi lần ít"
  question_vi: "Có phải đi tiểu nhiều lần, mỗi lần ít không?"
  cluster: lower_urinary
  leak: moderate
- id: flank_pain
  kind: symptom
  type: binary
  label_vi: "Đau hông lưng"
  question_vi: "Có đau vùng hông lưng, một hoặc hai bên không?"
  alt_question:
    text_vi: "Có đau ở lưng, ngang thắt lưng hoặc hai bên sườn không?"
  leak: moderate
- id: hematuria
  kind: sign
  type: binary
  label_vi: "Tiểu ra máu"
  question_vi: "Nước tiểu có màu đỏ, hoặc hồng như nước rửa thịt không?"
  leak: specific
- id: pregnant
  kind: risk_factor
  type: binary
  label_vi: "Đang mang thai"
  question_vi: "Hiện có đang mang thai, hoặc có thể đang có thai không?"
  help_vi: "Chọn 'Không rõ' nếu bị chậm kinh mà chưa thử thai."
  applies_to:
    sex: [female]
    age_groups: [teen_13_17, adult_18_44, adult_45_64]
  cluster: pregnancy_signs
  leak: moderate
- id: gestational_age
  kind: history
  type: categorical
  label_vi: "Tuổi thai"
  question_vi: "Thai được bao nhiêu tuần?"
  options:
    - { id: lt_20w, label_vi: "Dưới 20 tuần (dưới 5 tháng)" }
    - { id: ge_20w, label_vi: "Từ 20 tuần trở lên" }
  baseline: { lt_20w: 0.5, ge_20w: 0.5 }
  requires:
    - { finding: pregnant, is: present }
- id: recent_childbirth
  kind: history
  type: binary
  label_vi: "Vừa sinh con trong 6 tuần"
  question_vi: "Có sinh con trong vòng 6 tuần qua không?"
  # Hỏi lại khi "Không rõ": sau sinh là dữ kiện then chốt của tiền sản giật sau sinh (người bảo trì, 25/10/2026).
  alt_question:
    text_vi: "Trong khoảng một tháng rưỡi qua, có sinh em bé không?"
  applies_to:
    sex: [female]
    age_groups: [teen_13_17, adult_18_44, adult_45_64]
  # Không hỏi khi đang mang thai (lượt C lô 4).
  requires:
    - { not: { finding: pregnant, is: present } }
  leak: specific
- id: missed_period
  kind: history
  type: binary
  label_vi: "Chậm kinh"
  question_vi: "Lần này có bị chậm kinh hoặc mất kinh không?"
  # Hỏi lại khi "Không rõ" (kinh không đều): câu then chốt cho chửa ngoài tử cung (người bảo trì, lô 2).
  alt_question:
    text_vi: "Từ lần có kinh gần nhất đến nay đã hơn 4 tuần chưa?"
  applies_to:
    sex: [female]
    age_groups: [teen_13_17, adult_18_44, adult_45_64]
  cluster: pregnancy_signs
  leak: moderate
- id: vaginal_bleeding
  kind: sign
  type: binary
  label_vi: "Ra máu âm đạo bất thường"
  question_vi: "Có ra máu âm đạo bất thường (không phải kỳ kinh) không?"
  alt_question:
    text_vi: "Ngoài kỳ kinh, có thấy máu ở quần lót hoặc băng vệ sinh không?"
  applies_to:
    sex: [female]
    age_groups: [teen_13_17, adult_18_44, adult_45_64, elder_65_74, elder_75p]
  leak: moderate
- id: abnormal_vaginal_discharge
  kind: sign
  type: binary
  label_vi: "Khí hư bất thường"
  question_vi: "Có ra khí hư (huyết trắng) nhiều, có mùi hoặc màu lạ không?"
  applies_to:
    sex: [female]
    age_groups: [teen_13_17, adult_18_44, adult_45_64, elder_65_74, elder_75p]
  leak: 0.15
  leak_note: "Khí hư bất thường khá phổ biến ở phụ nữ (viêm âm đạo do nấm, vi khuẩn); 5% là thấp. Ước lượng, cần bác sĩ duyệt."
- id: pain_with_menses
  kind: history
  type: binary
  label_vi: "Đau trùng với kỳ kinh"
  question_vi: "Cơn đau có xuất hiện đúng vào kỳ kinh không?"
  requires:
    - { finding: abdominal_pain, is: present }
  applies_to:
    sex: [female]
    age_groups: [teen_13_17, adult_18_44, adult_45_64]
  leak: 0.18
  leak_note: "Kỳ kinh chiếm khoảng 5/28 ngày, nên cơn đau do nguyên nhân khác vẫn trùng kỳ kinh khoảng 18% (lượt A lô 3)."
- id: pain_with_intercourse
  kind: symptom
  type: binary
  label_vi: "Đau khi quan hệ tình dục"
  question_vi: "Có đau bụng dưới khi quan hệ tình dục không?"
  applies_to:
    sex: [female]
    age_groups: [teen_13_17, adult_18_44, adult_45_64]
  cost: 3
  sensitive: true
  leak: moderate
- id: new_sexual_partner
  kind: exposure
  type: binary
  label_vi: "Có bạn tình mới"
  question_vi: "Trong 3 tháng qua, có bạn tình mới hoặc nhiều bạn tình không?"
  applies_to:
    sex: [female]
    age_groups: [teen_13_17, adult_18_44, adult_45_64]
  cost: 3
  sensitive: true
  leak: moderate

# ---------- Giai đoạn 3, lô 1 ----------
- id: heavy_periods
  kind: symptom
  type: binary
  label_vi: "Kinh nguyệt ra nhiều hoặc kéo dài"
  question_vi: "Kinh nguyệt có ra rất nhiều hoặc kéo dài hơn 7 ngày không?"
  help_vi: "Ra rất nhiều nghĩa là phải thay băng vệ sinh sau mỗi 1–2 giờ."
  applies_to:
    sex: [female]
    age_groups: [teen_13_17, adult_18_44, adult_45_64]
  leak: 0.1
  leak_note: "Ra kinh nhiều khá phổ biến ở phụ nữ tuổi sinh đẻ; người bảo trì ước lượng."

# ---------- Giai đoạn 3, lô 2 ----------
- id: scrotal_pain
  kind: symptom
  type: binary
  label_vi: "Đau hoặc sưng bìu, tinh hoàn"
  question_vi: "Có đau hoặc sưng ở bìu, tinh hoàn không?"
  cluster: groin_scrotal
  help_vi: "Trẻ trai có thể ngại nói. Hãy hỏi kỹ, hoặc xem bìu có sưng, đỏ không."
  alt_question:
    text_vi: "Bìu có một bên to hơn, đỏ, hoặc chạm vào thấy đau không?"
  applies_to:
    sex: [male]
  leak: 0.01
  leak_note: "Ít gặp ở người đau bụng không do bệnh ở bìu; cơn đau quặn thận có thể lan xuống bìu (đã có dấu hiệu đau lan xuống bẹn). Người bảo trì ước lượng."
- id: ovarian_cyst_known
  kind: history
  type: binary
  label_vi: "Đã biết có u nang buồng trứng"
  question_vi: "Bác sĩ đã từng nói có u nang hoặc khối u ở buồng trứng chưa?"
  applies_to:
    sex: [female]
    age_groups: [teen_13_17, adult_18_44, adult_45_64, elder_65_74, elder_75p]
  leak: 0.05
  leak_note: "Nang buồng trứng hay được phát hiện tình cờ khi siêu âm; người bảo trì ước lượng."
