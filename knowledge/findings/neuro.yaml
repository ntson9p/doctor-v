# Thần kinh, đau đầu, mắt.
- id: headache
  kind: symptom
  type: binary
  label_vi: "Đau đầu"
  question_vi: "Có đau đầu không?"
  alt_question:
    text_vi: "Có thấy đau, nhức hoặc nặng ở đầu không?"
  leak: nonspecific
  leak_by_complaint: { abdominal_pain: moderate, fever: 0.7 }
  leak_note: "Người sốt không do sốt xuất huyết vẫn đau đầu khoảng 70% (Phuong 2006 bảng 2, Low 2011 bảng 3, Le-Viet 2019 bảng 1; lượt C lô 2); 20% làm kết quả quá tự tin (lượt B lô 2). Ước lượng, cần bác sĩ duyệt."
- id: headache_thunderclap
  kind: symptom
  type: binary
  label_vi: "Đau đầu đột ngột, dữ dội nhất từ trước tới nay"
  question_vi: "Cơn đau đầu có đến đột ngột, dữ dội nhất từ trước tới nay không?"
  help_vi: "Đau lên mức mạnh nhất trong vòng 5 phút, như bị đánh mạnh vào đầu."
  alt_question:
    text_vi: "Cơn đau có bùng lên rất mạnh chỉ trong vài phút không?"
  requires:
    - { finding: headache, is: present }
  leak: 0.002
  leak_note: "Ở tuyến cơ sở, 25% người đau đầu đột ngột, dữ dội là xuất huyết dưới nhện (Linn 1994), nên kiểu đau này rất hiếm ở người không có bệnh liên kết; 1% làm xuất huyết dưới nhện tụt hạng (lượt C lô 4). Bệnh lành tính không cần liên kết với dấu hiệu này."
- id: headache_course
  kind: history
  type: categorical
  label_vi: "Kiểu đau đầu"
  question_vi: "Trước đây đã từng bị kiểu đau đầu này chưa?"
  options:
    - { id: first_time, label_vi: "Lần đầu bị như vậy" }
    - { id: recurrent_similar, label_vi: "Đã bị nhiều lần, giống lần này" }
    - { id: progressive, label_vi: "Nặng dần lên trong vài tuần nay" }
  baseline: { first_time: 0.35, recurrent_similar: 0.55, progressive: 0.10 }
  requires:
    - { finding: headache, is: present }
- id: headache_frequent
  kind: history
  type: binary
  label_vi: "Đau đầu nhiều lần mỗi tuần"
  question_vi: "Mấy tuần nay có bị đau đầu nhiều lần mỗi tuần không?"
  requires:
    - { finding: headache, is: present }
  leak: nonspecific
  leak_note: "Người đi khám vì đau đầu hay có đau đầu tái diễn. Câu này chỉ dùng cho quy tắc khám (NHS: đau nhiều lần mỗi tuần thì khám bác sĩ), chưa liên kết với bệnh nào (người bảo trì, 25/10/2026). Ước lượng."
- id: headache_duration
  kind: history
  type: categorical
  label_vi: "Thời gian đau đầu"
  question_vi: "Cơn đau đầu lần này đã kéo dài bao lâu?"
  options:
    - { id: lt_4h, label_vi: "Dưới 4 giờ" }
    - { id: h4_72, label_vi: "Từ 4 giờ đến 3 ngày" }
    - { id: gt_3d, label_vi: "Hơn 3 ngày" }
  baseline: { lt_4h: 0.35, h4_72: 0.45, gt_3d: 0.20 }
  requires:
    - { finding: headache, is: present }
- id: headache_location
  kind: symptom
  type: categorical
  label_vi: "Vị trí đau đầu"
  question_vi: "Đau ở vùng nào của đầu?"
  options:
    - { id: one_side, label_vi: "Một bên đầu" }
    - { id: both_sides, label_vi: "Cả hai bên đầu" }
    - { id: forehead_face, label_vi: "Vùng trán, quanh mắt hoặc mặt" }
    - { id: back_neck, label_vi: "Phía sau đầu, gáy" }
    - { id: whole_head, label_vi: "Khắp đầu" }
  baseline: { one_side: 0.20, both_sides: 0.25, forehead_face: 0.20, back_neck: 0.15, whole_head: 0.20 }
  requires:
    - { finding: headache, is: present }
- id: headache_character
  kind: symptom
  type: categorical
  label_vi: "Cảm giác đau đầu"
  question_vi: "Cảm giác đau đầu giống kiểu nào hơn?"
  options:
    - { id: throbbing, label_vi: "Giật giật theo nhịp mạch" }
    - { id: pressing, label_vi: "Bó chặt hoặc đè nặng" }
  baseline: { throbbing: 0.4, pressing: 0.6 }
  requires:
    - { finding: headache, is: present }
- id: headache_severity
  kind: symptom
  type: categorical
  label_vi: "Mức độ đau đầu"
  question_vi: "Đau đầu ở mức nào?"
  options:
    - { id: mild, label_vi: "Nhẹ, vẫn làm việc được" }
    - { id: moderate, label_vi: "Vừa, phải nghỉ ngơi" }
    - { id: severe, label_vi: "Rất đau, không làm gì được" }
  baseline: { mild: 0.4, moderate: 0.4, severe: 0.2 }
  requires:
    - { finding: headache, is: present }
- id: headache_worse_activity
  kind: symptom
  type: binary
  label_vi: "Đau đầu tăng khi vận động"
  question_vi: "Đau đầu có tăng lên khi đi lại, leo cầu thang không?"
  requires:
    - { finding: headache, is: present }
  leak: moderate
- id: photophobia
  kind: symptom
  type: binary
  label_vi: "Sợ ánh sáng"
  question_vi: "Ánh sáng có làm khó chịu hơn hẳn bình thường không?"
  cluster: light_sound
  leak: moderate
- id: phonophobia
  kind: symptom
  type: binary
  label_vi: "Sợ tiếng ồn"
  question_vi: "Tiếng ồn có làm khó chịu hơn hẳn bình thường không?"
  cluster: light_sound
  leak: moderate
- id: visual_aura
  kind: symptom
  type: binary
  label_vi: "Thấy chớp sáng trước cơn đau"
  question_vi: "Trước cơn đau, có thấy chớp sáng hoặc đường gợn sóng không?"
  requires:
    - { finding: headache, is: present }
  cluster: visual
  leak: specific
- id: blurred_vision
  kind: symptom
  type: binary
  label_vi: "Nhìn mờ, thấy đốm sáng"
  question_vi: "Có nhìn mờ, hoặc thấy đốm sáng, đom đóm trước mắt không?"
  cluster: visual
  leak: moderate
- id: vision_loss_or_double
  kind: symptom
  type: binary
  label_vi: "Đột ngột mất thị lực hoặc nhìn đôi"
  question_vi: "Có đột ngột mất một phần thị lực, hoặc nhìn một thành hai không?"
  alt_question:
    text_vi: "Mắt có đột ngột nhìn kém hẳn đi so với trước không?"
  cluster: visual
  leak: specific
- id: neck_stiffness
  kind: sign
  type: binary
  label_vi: "Cứng gáy"
  question_vi: "Có cứng gáy (cổ cứng, khó cúi đầu xuống) không?"
  help_vi: "Cứng gáy là khi cổ cứng, đau, không cúi được cằm chạm ngực."
  alt_question:
    text_vi: "Có cúi đầu cho cằm chạm ngực được không?"
    inverted: true
  leak: specific
  leak_by_complaint: { abdominal_pain: 0.001 }
  leak_note: "Cứng gáy rất hiếm ở người đau bụng và không phải dấu hiệu nguy hiểm của đau bụng; với 1%, câu này bị hỏi ở người đau bụng (người bảo trì, 25/10/2026). Ước lượng."
- id: headache_after_head_injury
  kind: history
  type: binary
  label_vi: "Đau đầu sau va đập đầu"
  question_vi: "Đau đầu có xuất hiện sau khi bị ngã hoặc va đập đầu không?"
  requires:
    - { finding: headache, is: present }
  leak: specific
- id: stress_poor_sleep
  kind: history
  type: binary
  label_vi: "Căng thẳng hoặc thiếu ngủ"
  question_vi: "Trong tuần qua có căng thẳng, lo lắng hoặc thiếu ngủ không?"
  leak: nonspecific

# ---------- Chóng mặt (Giai đoạn 3, lô 1) ----------
- id: dizziness
  kind: symptom
  type: binary
  label_vi: "Chóng mặt"
  question_vi: "Có bị chóng mặt, choáng váng hoặc mất thăng bằng không?"
  help_vi: "Gồm cảm giác quay cuồng, chòng chành như đứng trên thuyền, hoặc choáng váng như sắp ngất."
  leak: nonspecific
- id: vertigo_spinning
  kind: symptom
  type: binary
  label_vi: "Cảm giác mọi vật quay tròn"
  question_vi: "Có cảm giác mọi vật quay tròn quanh mình, hoặc mình đang quay tròn không?"
  requires:
    - { finding: dizziness, is: present }
  leak: 0.4
  leak_note: "Tính trong số người đã chóng mặt (dấu hiệu có điều kiện). Mô tả của người bệnh về kiểu chóng mặt không đáng tin (Newman-Toker 2007), nhiều người không bị bệnh tiền đình vẫn nói là quay; lượt B lô 1 phần a cho rằng 0,3 là thấp. Người bảo trì ước lượng."
- id: dizziness_positional
  kind: symptom
  type: binary
  label_vi: "Chóng mặt khi trở mình, nằm xuống hoặc ngửa cổ"
  question_vi: "Có chóng mặt ngay khi trở mình, nằm xuống hoặc ngửa cổ không?"
  help_vi: "Thường là cơn quay cuồng ngắn khi đổi tư thế đầu. Không tính choáng, tối sầm mắt khi vừa đứng dậy."
  requires:
    - { finding: dizziness, is: present }
  leak: 0.1
  leak_note: "Tính trong số người đã chóng mặt. Kiểu chóng mặt do tư thế đầu là đặc trưng của chóng mặt tư thế kịch phát lành tính; người bảo trì ước lượng tỷ lệ ở người không có bệnh liên kết, lượt A/B/C đối chiếu."
- id: dizziness_pattern
  kind: history
  type: categorical
  label_vi: "Kiểu chóng mặt"
  question_vi: "Chóng mặt diễn ra thế nào?"
  options:
    - { id: brief_episodes, label_vi: "Từng cơn ngắn, mỗi cơn dưới 1 phút" }
    - { id: long_episodes, label_vi: "Từng cơn, mỗi cơn vài phút đến vài giờ" }
    - { id: continuous, label_vi: "Liên tục không dứt, mới bị vài giờ hoặc vài ngày nay" }
    - { id: chronic, label_vi: "Âm ỉ gần như suốt ngày, đã nhiều tuần" }
  baseline: { brief_episodes: 0.25, long_episodes: 0.3, continuous: 0.2, chronic: 0.25 }
  requires:
    - { finding: dizziness, is: present }
- id: hearing_loss_tinnitus
  kind: symptom
  type: binary
  label_vi: "Ù tai hoặc nghe kém một bên"
  question_vi: "Có ù tai, nghe kém hoặc đầy tức ở một bên tai không?"
  leak: moderate
- id: hearing_loss_sudden
  kind: symptom
  type: binary
  label_vi: "Đột ngột nghe kém hẳn một bên tai"
  question_vi: "Tai đó có đột ngột nghe kém hẳn đi trong mấy ngày nay không?"
  alt_question:
    text_vi: "So với tai kia, tai đó có nghe kém hẳn từ mấy ngày nay không?"
  requires:
    - { finding: hearing_loss_tinnitus, is: present }
  leak: 0.2
  leak_note: "Tính trong số người đã có ù tai, nghe kém hoặc đầy tai. Người bảo trì ước lượng."
- id: cannot_walk_unaided
  kind: sign
  type: binary
  label_vi: "Không tự đứng vững hoặc tự đi được"
  question_vi: "Có mất thăng bằng đến mức không tự đứng hoặc đi được không?"
  help_vi: "Nghĩa là phải có người đỡ hoặc phải vịn mới đứng, đi được, kể cả khi mở mắt nhìn. Không tính lúc đang trong cơn quay cuồng ngắn dưới 1 phút."
  alt_question:
    text_vi: "Có tự đi được vài bước mà không cần vịn hay người đỡ không?"
    inverted: true
  cluster: imbalance
  leak: moderate
- id: transient_neuro_symptoms
  kind: history
  type: binary
  label_vi: "Yếu, tê nửa người hoặc nói khó, dù đã tự hết"
  question_vi: "7 ngày qua, có lúc yếu, tê nửa người, nói khó rồi tự hết không?"
  help_vi: "Tính các lần trong 7 ngày qua, kể cả khi chỉ kéo dài vài phút. Gồm cả méo miệng, mất thị lực một mắt hoặc nhìn đôi rồi tự hết. Không tính lúc tối sầm mắt khi sắp ngất."
  leak: specific
- id: perioral_tingling
  kind: symptom
  type: binary
  label_vi: "Tê bì quanh miệng hoặc đầu ngón tay"
  question_vi: "Trong cơn, có bị tê bì quanh miệng hoặc ở đầu các ngón tay không?"
  cluster: panic_attack
  leak: moderate

# ---------- Giai đoạn 3, lô 2 ----------
- id: eye_pain_one_side
  kind: symptom
  type: binary
  label_vi: "Đau nhức dữ dội ở một bên mắt"
  question_vi: "Có đau nhức dữ dội trong hoặc quanh một bên mắt không?"
  help_vi: "Không tính cảm giác cộm, ngứa hay mỏi mắt."
  leak: 0.03
  leak_note: "Đau nửa đầu có thể đau quanh một mắt; đau nhức dữ dội trong mắt ít gặp ở các bệnh khác. Người bảo trì ước lượng; lượt A/B/C đối chiếu."
- id: halos_around_lights
  kind: symptom
  type: binary
  label_vi: "Thấy quầng sáng nhiều màu quanh bóng đèn"
  question_vi: "Khi nhìn bóng đèn, có thấy vòng sáng nhiều màu quanh đèn không?"
  cluster: visual
  leak: 0.02
  leak_note: "Quầng sáng quanh đèn do giác mạc phù trong cơn glôcôm cấp; cũng gặp khi đục thủy tinh thể. Người bảo trì ước lượng."
- id: neck_injury_or_manipulation
  kind: history
  type: binary
  label_vi: "Vừa bị bẻ, nắn cổ hoặc chấn thương cổ"
  question_vi: "Vài tuần gần đây có bị bẻ, nắn cổ hoặc chấn thương vùng cổ không?"
  help_vi: "Ví dụ bẻ cổ khi gội đầu, xoa bóp, nắn chỉnh cột sống, ngã hoặc tai nạn xe."
  leak: 0.02
  leak_note: "Người bảo trì ước lượng. Bóc tách động mạch cổ sau bẻ, nắn cổ hoặc chấn thương là nguyên nhân đột quỵ ở người trẻ."
