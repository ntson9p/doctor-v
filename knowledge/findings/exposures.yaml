# Phơi nhiễm dịch tễ (đặc thù Việt Nam).
- id: dengue_nearby
  kind: exposure
  type: binary
  label_vi: "Hai tuần qua có người bị sốt xuất huyết gần nơi ở"
  question_vi: "Hai tuần qua, nhà hoặc khu phố có người bị sốt xuất huyết không?"
  leak: moderate
- id: malaria_area_exposure
  kind: exposure
  type: binary
  label_vi: "Tháng qua đi rừng, ngủ rẫy hoặc đến vùng sốt rét"
  question_vi: "Tháng qua có đi rừng, ngủ rẫy, hoặc đến vùng sốt rét không?"
  help_vi: "Vùng sốt rét: rừng núi, biên giới ở Tây Nguyên, Nam Trung Bộ, Đông Nam Bộ; hoặc từ nước có sốt rét về."
  leak: 0.02
  leak_note: "Người sống hoặc làm việc ở vùng rừng núi trả lời 'có' khá thường xuyên; 1% là thấp (lượt B lô 2). Ước lượng."
- id: bush_exposure
  kind: exposure
  type: binary
  label_vi: "Hai tuần qua làm rẫy, phát cỏ, ngồi nằm trên cỏ"
  question_vi: "Hai tuần qua có làm rẫy, phát cỏ, hoặc ngồi nằm trên cỏ không?"
  help_vi: "Ấu trùng mò sống ở bụi rậm, bãi cỏ và bám vào người khi tiếp xúc."
  leak: 0.10
  leak_note: "Làm vườn, làm rẫy, cắt cỏ rất phổ biến ở nông thôn; 5% là thấp (lượt B lô 2). Ước lượng."
