# Phơi nhiễm dịch tễ (đặc thù Việt Nam).
- id: dengue_nearby
  kind: exposure
  type: binary
  label_vi: "Hai tuần qua có người bị sốt xuất huyết gần nơi ở"
  question_vi: "Hai tuần qua, nhà hoặc khu phố có người bị sốt xuất huyết không?"
  leak: moderate
- id: malaria_area_exposure
  kind: exposure
  type: binary
  label_vi: "Tháng qua đi rừng, ngủ rẫy hoặc đến vùng sốt rét"
  question_vi: "Tháng qua có đi rừng, ngủ rẫy, hoặc đến vùng sốt rét không?"
  help_vi: "Vùng sốt rét: rừng núi, biên giới ở Tây Nguyên, Nam Trung Bộ, Đông Nam Bộ; hoặc từ nước có sốt rét về."
  cluster: forest_field
  leak: 0.02
  leak_note: "Người sống hoặc làm việc ở vùng rừng núi trả lời 'có' khá thường xuyên; 1% là thấp (lượt B lô 2). Ước lượng."
- id: bush_exposure
  kind: exposure
  type: binary
  label_vi: "Hai tuần qua làm rẫy, phát cỏ, ngồi nằm trên cỏ"
  question_vi: "Hai tuần qua có làm rẫy, phát cỏ, hoặc ngồi nằm trên cỏ không?"
  help_vi: "Ấu trùng mò sống ở bụi rậm, bãi cỏ và bám vào người khi tiếp xúc."
  cluster: forest_field
  leak: 0.10
  leak_note: "Làm vườn, làm rẫy, cắt cỏ rất phổ biến ở nông thôn; 5% là thấp (lượt B lô 2). Ước lượng."

# ---------- Giai đoạn 3, lô 1 ----------
- id: co_exposure
  kind: exposure
  type: binary
  label_vi: "Ở phòng kín có đốt than, củi hoặc chạy máy nổ"
  question_vi: "24 giờ qua, có ở phòng kín đốt than, củi hoặc chạy máy nổ không?"
  help_vi: "Ví dụ đốt than sưởi, bếp củi, chạy máy phát điện hoặc nổ máy xe trong phòng kín. Bình nóng lạnh chạy gas và đám cháy cũng sinh ra khí độc này."
  cluster: co_source
  leak: 0.02
  leak_note: "Ít gặp nhưng có ở miền Bắc mùa lạnh (đốt than sưởi) và khi chạy máy phát điện trong nhà; người bảo trì ước lượng."
- id: others_same_symptoms
  kind: exposure
  type: binary
  label_vi: "Người ở cùng cũng có triệu chứng giống vậy"
  question_vi: "Người ở cùng có ai cũng đau đầu, chóng mặt, buồn nôn như vậy không?"
  cluster: co_source
  leak: 0.03
  leak_note: "Nhiều người cùng chỗ ở có triệu chứng giống nhau gợi ý nguồn chung (khí CO); người bảo trì ước lượng."
- id: better_away_from_place
  kind: history
  type: binary
  label_vi: "Đỡ hơn khi ra khỏi nhà hoặc phòng đó"
  question_vi: "Khi ra khỏi nhà hoặc căn phòng đó một lúc, có thấy đỡ hơn không?"
  cluster: co_source
  leak: 0.05
  leak_note: "Gợi ý nguồn khí độc trong nhà (lượt B lô 1 phần a đề xuất); người bảo trì ước lượng."
- id: stimulant_intake
  kind: exposure
  type: binary
  label_vi: "Uống nhiều cà phê, trà đặc, nước tăng lực, rượu bia"
  question_vi: "Hôm nay có uống nhiều cà phê, trà đặc, nước tăng lực hoặc rượu bia không?"
  leak: nonspecific
  notes_vi: "Hay làm khởi phát ngoại tâm thu, cơn rung nhĩ, cơn hồi hộp (lượt A lô 1, ngoại tâm thu, đề xuất)."

# ---------- Giai đoạn 3, lô 2 ----------
- id: heat_exposure
  kind: exposure
  type: binary
  label_vi: "Phơi nắng lâu hoặc làm việc nặng nơi nóng bức"
  question_vi: "24 giờ qua có phơi nắng lâu hoặc làm việc nặng nơi nóng bức không?"
  help_vi: "Ví dụ làm đồng, làm công trường, chạy bộ giữa trưa hè, hoặc ở lâu trong phòng, xe kín nóng bức. Người già, trẻ nhỏ dễ bị hơn."
  leak: 0.15
  leak_note: "Việt Nam nóng quanh năm ở miền Nam và vào mùa hè ở miền Bắc; nhiều người làm việc ngoài trời. Người bảo trì ước lượng."
- id: flood_mud_exposure
  kind: exposure
  type: binary
  label_vi: "Lội nước lũ, bùn, ruộng hoặc tiếp xúc chuột"
  question_vi: "Trong 3 tuần qua có lội nước lũ, bùn, ruộng hoặc tiếp xúc chuột không?"
  help_vi: "Ví dụ cấy lúa, dọn dẹp sau lũ, khơi cống, bắt chuột, hoặc ở nhà có nhiều chuột."
  leak: 0.2
  leak_note: "Ở nông thôn, làm ruộng và lội nước rất phổ biến; người bảo trì ước lượng khoảng 20% người sốt, lượt A/B/C đối chiếu."
