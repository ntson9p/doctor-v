# Dấu hiệu toàn thân: sốt, đau nhức, da, tri giác, mất nước.
- id: fever
  kind: symptom
  type: binary
  label_vi: "Sốt"
  question_vi: "Có sốt không?"
  help_vi: "Sốt là khi nhiệt độ đo ở nách từ 37,5°C trở lên, hoặc sờ thấy người nóng hơn bình thường."
  alt_question:
    text_vi: "Sờ trán, ngực có thấy nóng hơn bình thường không?"
  leak: moderate
- id: fever_max_temp
  kind: measurement
  type: categorical
  label_vi: "Nhiệt độ cao nhất"
  question_vi: "Nhiệt độ cao nhất đo được là bao nhiêu?"
  help_vi: "Chọn 'Không rõ' nếu chưa đo nhiệt độ."
  options:
    - { id: lt_38, label_vi: "Dưới 38°C" }
    - { id: t38_39, label_vi: "Từ 38°C đến dưới 39°C" }
    - { id: ge_39, label_vi: "Từ 39°C trở lên" }
  baseline: { lt_38: 0.35, t38_39: 0.40, ge_39: 0.25 }
  requires:
    - { finding: fever, is: present }
  cost: 2
  unknown_rate: 0.3
- id: fever_duration
  kind: history
  type: categorical
  label_vi: "Số ngày sốt"
  question_vi: "Đã sốt bao nhiêu ngày?"
  options:
    - { id: d1_2, label_vi: "1–2 ngày" }
    - { id: d3_5, label_vi: "3–5 ngày" }
    - { id: d6_7, label_vi: "6–7 ngày" }
    - { id: gt_7d, label_vi: "Hơn 7 ngày" }
  baseline: { d1_2: 0.50, d3_5: 0.30, d6_7: 0.10, gt_7d: 0.10 }
  requires:
    - { finding: fever, is: present }
- id: chills_rigors
  kind: symptom
  type: binary
  label_vi: "Rét run"
  question_vi: "Có cơn rét run, lạnh run cầm cập không?"
  help_vi: "Rét run là cảm giác lạnh và run người không kiểm soát được, thường ngay trước khi sốt cao."
  requires:
    - { finding: fever, is: present }
  leak: nonspecific
- id: fever_cyclic
  kind: history
  type: binary
  label_vi: "Sốt thành cơn cách ngày"
  question_vi: "Có sốt thành từng cơn, cách 1–2 ngày lại lên cơn không?"
  requires:
    - { finding: fever, is: present }
  leak: moderate
- id: myalgia
  kind: symptom
  type: binary
  label_vi: "Đau nhức cơ, mỏi người"
  question_vi: "Có đau nhức cơ, mỏi khắp người không?"
  cluster: aches
  leak: nonspecific
  leak_by_complaint: { abdominal_pain: moderate, headache: moderate, fever: 0.55 }
  leak_note: "Đau nhức người rất thường gặp khi sốt do bất kỳ nguyên nhân nào (lượt B lô 2); khoảng 55% ở người sốt không do sốt xuất huyết (Phuong 2006, Low 2011, Le-Viet 2019; lượt C lô 2). Ước lượng, cần bác sĩ duyệt."
- id: arthralgia
  kind: symptom
  type: binary
  label_vi: "Đau khớp"
  question_vi: "Có đau các khớp như cổ tay, cổ chân, đầu gối không?"
  cluster: aches
  leak: moderate
  leak_by_complaint: { fever: nonspecific }
  leak_note: "Đau khớp hay đi kèm sốt do vi rút (lượt B lô 2)."
- id: retro_orbital_pain
  kind: symptom
  type: binary
  label_vi: "Đau sau hốc mắt"
  question_vi: "Có đau nhức sau hốc mắt, đau tăng khi đảo mắt không?"
  leak: moderate
  leak_by_complaint: { fever: 0.15 }
  leak_note: "Khoảng 15% người sốt không do sốt xuất huyết có đau sau hốc mắt (Phuong 2006, Low 2011, Le-Viet 2019; lượt C lô 2). Ước lượng, cần bác sĩ duyệt."
- id: fatigue
  kind: symptom
  type: binary
  label_vi: "Mệt mỏi nhiều"
  question_vi: "Có mệt mỏi, uể oải hơn hẳn bình thường không?"
  leak: nonspecific
  leak_by_complaint: { fever: 0.5 }
  leak_note: "Mệt mỏi gặp ở phần lớn người đang sốt, bất kể nguyên nhân. Ước lượng, cần bác sĩ duyệt."
- id: severe_weakness
  kind: sign
  type: binary
  label_vi: "Mệt lả, không tự đi lại được"
  question_vi: "Có mệt lả đến mức gần như không tự đi lại được không?"
  alt_question:
    text_vi: "Có tự đứng dậy và đi lại trong nhà được không?"
    inverted: true
  cluster: shock_signs
  leak: specific
- id: loss_of_appetite
  kind: symptom
  type: binary
  label_vi: "Chán ăn"
  question_vi: "Có chán ăn, ăn ít hơn hẳn bình thường không?"
  leak: nonspecific
  leak_by_complaint: { abdominal_pain: 0.3, fever: 0.65 }
  leak_note: "Chán ăn rất thường gặp khi đau bụng hoặc khi sốt do bất kỳ nguyên nhân nào (lượt A lô 3, lượt B lô 2); khoảng 60–70% ở người sốt không do sốt xuất huyết (Phuong 2006, Low 2011, Le-Viet 2019; lượt C lô 2). Ước lượng, cần bác sĩ duyệt."
- id: rash_any
  kind: sign
  type: binary
  label_vi: "Phát ban, nổi mẩn"
  question_vi: "Có nổi ban hoặc nổi mẩn đỏ trên da không?"
  alt_question:
    text_vi: "Trên da có chỗ nào mới nổi đỏ, nổi chấm hoặc nổi mụn không?"
  leak: moderate
- id: rash_non_blanching
  kind: sign
  type: binary
  label_vi: "Nốt đỏ tím không mất khi ấn"
  question_vi: "Trên da có nốt đỏ hoặc tím, ấn vào không mất đi không?"
  help_vi: "Nốt phẳng màu đỏ hoặc tím, như chấm máu hay vết bầm. Ấn thành ly thủy tinh lên nốt: vẫn thấy rõ nốt là không mất màu. Nốt phỏng nước (như tay chân miệng) không tính."
  alt_question:
    text_vi: "Có chấm đỏ li ti hoặc mảng tím bầm mới xuất hiện trên da không?"
  requires:
    - { finding: rash_any, is: present }
  leak: moderate
- id: rash_spreads_from_face
  kind: sign
  type: binary
  label_vi: "Ban mọc từ mặt lan xuống người"
  question_vi: "Ban có mọc từ sau tai, mặt rồi lan dần xuống người không?"
  requires:
    - { finding: rash_any, is: present }
  leak: moderate
- id: mouth_ulcers
  kind: sign
  type: binary
  label_vi: "Loét hoặc phỏng nước trong miệng"
  question_vi: "Có vết loét hoặc nốt phỏng nước trong miệng không?"
  help_vi: "Trẻ nhỏ có thể chảy nhiều nước dãi hoặc bỏ ăn vì đau miệng."
  cluster: hfmd_lesions
  leak: moderate
- id: hand_foot_blisters
  kind: sign
  type: binary
  label_vi: "Phỏng nước ở lòng bàn tay, bàn chân"
  question_vi: "Có nốt phỏng nước ở lòng bàn tay, bàn chân hoặc mông không?"
  cluster: hfmd_lesions
  leak: specific
- id: red_eyes
  kind: sign
  type: binary
  label_vi: "Đỏ mắt"
  question_vi: "Có bị đỏ mắt không?"
  help_vi: "Có thể kèm chảy nước mắt hoặc khó chịu khi nhìn ánh sáng."
  leak: moderate
- id: eschar
  kind: sign
  type: binary
  label_vi: "Vết loét đóng vảy đen"
  question_vi: "Trên da có vết loét tròn, đóng vảy đen, không đau không?"
  help_vi: "Hay ở nách, bẹn, thắt lưng hoặc vùng da kín. Cần xem kỹ khắp người."
  cost: 1.5
  unknown_rate: 0.3
  leak: specific
- id: jaundice
  kind: sign
  type: binary
  label_vi: "Vàng da, vàng mắt"
  question_vi: "Da hoặc lòng trắng mắt có bị vàng không?"
  leak: specific
- id: bleeding_gums_nose
  kind: sign
  type: binary
  label_vi: "Chảy máu chân răng, chảy máu mũi"
  question_vi: "Có chảy máu chân răng hoặc chảy máu mũi không?"
  alt_question:
    text_vi: "Khi đánh răng hoặc xì mũi, có thấy máu không?"
  leak: specific
- id: cold_hands_feet
  kind: sign
  type: binary
  label_vi: "Tay chân lạnh, da tái"
  question_vi: "Tay chân có lạnh ngắt, da tái hoặc nổi vân tím không?"
  alt_question:
    text_vi: "Sờ bàn tay, bàn chân có thấy lạnh hơn hẳn bình thường không?"
  cluster: shock_signs
  leak: specific
- id: decreased_urine
  kind: sign
  type: binary
  label_vi: "Tiểu ít"
  question_vi: "Trong 12 giờ qua, lượng nước tiểu có ít hẳn đi không?"
  help_vi: "Ví dụ: cả buổi không đi tiểu, hoặc nước tiểu ít và sẫm màu."
  leak: moderate
- id: persistent_vomiting
  kind: symptom
  type: binary
  label_vi: "Nôn liên tục"
  question_vi: "Có nôn nhiều lần, uống gì cũng nôn ra không?"
  help_vi: "Ví dụ: nôn từ 3 lần trong 1 giờ, hoặc từ 4 lần trong 6 giờ."
  alt_question:
    text_vi: "Trong 6 giờ qua, có giữ được nước uống mà không nôn ra không?"
    inverted: true
  cluster: vomiting
  leak: moderate
- id: confusion
  kind: sign
  type: binary
  label_vi: "Lú lẫn"
  question_vi: "Có mới bị lú lẫn, nói năng lẫn lộn, không nhận ra người quen không?"
  help_vi: "Không tính tình trạng hay quên đã có từ trước."
  alt_question:
    text_vi: "Có nói đúng tên mình và biết đang ở đâu không?"
    inverted: true
  applies_to:
    age_groups: [child_5_12, teen_13_17, adult_18_44, adult_45_64, elder_65_74, elder_75p]
  cluster: altered_consciousness
  leak: specific
- id: drowsy_hard_to_wake
  kind: sign
  type: binary
  label_vi: "Li bì, khó đánh thức"
  question_vi: "Có ngủ li bì, lơ mơ, khó đánh thức không?"
  alt_question:
    text_vi: "Khi gọi hoặc lay nhẹ, có tỉnh dậy và đáp lại ngay không?"
    inverted: true
  cluster: altered_consciousness
  leak: specific
- id: seizure_recent
  kind: history
  type: binary
  label_vi: "Co giật"
  question_vi: "Trong lần bị bệnh này, có lên cơn co giật không?"
  help_vi: "Co giật là khi người co cứng hoặc giật tay chân không kiểm soát, thường kèm mất ý thức."
  alt_question:
    text_vi: "Có lúc nào người co cứng, giật tay chân, mắt trợn ngược không?"
  leak: specific
  leak_by_complaint: { fever: 0.002 }
  leak_note: "Co giật do sốt chủ yếu ở trẻ 6 tháng–5 tuổi, nhóm đã được hỏi trong nhóm dấu hiệu nguy hiểm; ở người lớn sốt, co giật rất hiếm. 1% làm câu này bị hỏi ở mọi người sốt (người bảo trì, lượt C lô 2). Ước lượng; cần tỷ lệ nền theo tuổi."
- id: fainting_or_near_fainting
  kind: symptom
  type: binary
  label_vi: "Ngất hoặc choáng như sắp ngất"
  question_vi: "Có bị ngất, hoặc choáng váng như sắp ngất không?"
  alt_question:
    text_vi: "Có lúc nào tối sầm mắt, phải ngồi hoặc nằm xuống ngay không?"
  leak: moderate

# ---------- Giai đoạn 3, lô 1 ----------
- id: tremor
  kind: symptom
  type: binary
  label_vi: "Run tay"
  question_vi: "Có bị run tay không?"
  help_vi: "Tay run khi cầm đồ vật hoặc khi duỗi thẳng tay ra trước."
  cluster: adrenergic
  leak: moderate
- id: pallor
  kind: sign
  type: binary
  label_vi: "Da xanh, môi và mí mắt nhợt"
  question_vi: "Da có xanh xao, môi và mí mắt có nhợt nhạt không?"
  help_vi: "Nhìn mặt trong mí mắt dưới: bình thường màu hồng đỏ, khi thiếu máu thì nhợt."
  cluster: anemia_signs
  leak: 0.15
  leak_note: "Người dùng tự nhận xét da xanh, nhợt không chính xác, nên nhiều người không thiếu máu vẫn trả lời có; 5% là quá thấp (lượt A lô 1 phần a). Người bảo trì ước lượng."
- id: weight_loss_unintended
  kind: symptom
  type: binary
  label_vi: "Sụt cân không rõ lý do"
  question_vi: "Vài tháng gần đây có sụt cân mà không do ăn kiêng không?"
  leak: moderate
- id: heat_intolerance
  kind: symptom
  type: binary
  label_vi: "Sợ nóng hơn trước"
  question_vi: "Gần đây có thấy sợ nóng hơn hẳn người xung quanh không?"
  help_vi: "Ví dụ người khác thấy mát mà bạn vẫn nóng, dễ đổ mồ hôi."
  leak: moderate
- id: goiter_visible
  kind: sign
  type: binary
  label_vi: "Bướu cổ"
  question_vi: "Phía trước cổ có to ra hoặc nổi một khối không?"
  leak: 0.03
  leak_note: "Bướu cổ nhìn thấy được ít gặp ở người không có bệnh tuyến giáp; người bảo trì ước lượng."
- id: panic_fear
  kind: symptom
  type: binary
  label_vi: "Cơn sợ hãi dữ dội"
  question_vi: "Trong cơn, có sợ hãi dữ dội như sắp chết hoặc mất kiểm soát không?"
  cluster: panic_attack
  leak: moderate
- id: similar_episodes_before
  kind: history
  type: binary
  label_vi: "Đã từng có những cơn giống hệt"
  question_vi: "Trước đây đã từng có những cơn giống hệt như lần này chưa?"
  leak: nonspecific
- id: missed_meal
  kind: history
  type: binary
  label_vi: "Bỏ bữa hoặc ăn ít hơn thường lệ"
  question_vi: "Hôm nay có bỏ bữa hoặc ăn ít hơn thường lệ không?"
  leak: nonspecific
- id: better_after_sugar
  kind: history
  type: binary
  label_vi: "Đỡ nhanh sau khi ăn hoặc uống đồ ngọt"
  question_vi: "Sau khi ăn hoặc uống đồ ngọt, có đỡ hẳn trong vòng 15 phút không?"
  leak: 0.05
  leak_note: "Phần lớn người chưa thử thì trả lời 'Không rõ'. Đỡ hẳn sau khi ăn đồ ngọt gợi ý hạ đường huyết; người bảo trì ước lượng."
  unknown_rate: 0.5
- id: recent_viral_illness
  kind: history
  type: binary
  label_vi: "Bị cảm, đau họng trong 2 tuần trước"
  question_vi: "Trong 2 tuần trước đó có bị cảm, sổ mũi hoặc đau họng không?"
  leak: nonspecific
- id: glucose_measured
  kind: measurement
  type: categorical
  label_vi: "Đường huyết đo được"
  question_vi: "Đường huyết đo bằng máy ở nhà lúc có triệu chứng là bao nhiêu?"
  help_vi: "Máy đo đường huyết hiện số theo mmol/L hoặc mg/dL: 4 mmol/L bằng 70 mg/dL, 11 mmol/L bằng 200 mg/dL."
  options:
    - { id: low, label_vi: "Dưới 4 mmol/L (dưới 70 mg/dL)" }
    - { id: normal, label_vi: "Từ 4 đến 11 mmol/L (70–200 mg/dL)" }
    - { id: high, label_vi: "Trên 11 mmol/L (trên 200 mg/dL)" }
    - { id: not_measured, label_vi: "Chưa đo", neutral: true }
  # "Chưa đo" là lựa chọn trung tính: mọi phân bố phải ghi 0,6 như tỷ lệ nền.
  baseline: { low: 0.02, normal: 0.28, high: 0.1, not_measured: 0.6 }
  requires:
    - { finding: diabetes, is: present }
  cost: 2
- id: anemia_known
  kind: history
  type: binary
  label_vi: "Đã từng được nói là bị thiếu máu"
  question_vi: "Đã từng được bác sĩ nói là bị thiếu máu chưa?"
  leak: 0.08
  leak_note: "Thiếu máu hay gặp ở phụ nữ và trẻ em Việt Nam; người bảo trì ước lượng tỷ lệ người từng được nói là thiếu máu."
- id: eyes_bulging
  kind: sign
  type: binary
  label_vi: "Mắt lồi"
  question_vi: "Mắt có lồi ra hơn trước không?"
  leak: specific
