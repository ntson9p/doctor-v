# Tim mạch, huyết áp.
- id: chest_pain_pressure
  kind: symptom
  type: binary
  label_vi: "Đau, tức nặng giữa ngực"
  question_vi: "Có đau hoặc tức nặng ở giữa ngực không?"
  alt_question:
    text_vi: "Có cảm giác bị đè ép hoặc thắt chặt ở ngực không?"
  cluster: chest_pain
  leak: moderate
- id: pain_radiates_arm_jaw
  kind: symptom
  type: binary
  label_vi: "Đau lan lên cổ, hàm, vai, tay"
  question_vi: "Cơn đau có lan lên cổ, hàm, vai hoặc cánh tay không?"
  # Lô 3: câu này được hỏi trong nhóm dấu hiệu nguy hiểm của Đau ngực, nên cần câu hỏi thay thế.
  alt_question:
    text_vi: "Lúc đau, có thấy đau hoặc tê lan lên cổ, hàm, vai, tay không?"
  requires:
    - any:
        - { finding: chest_pain_pressure, is: present }
        - { finding: abdominal_pain, is: present }
        - { finding: chest_pain, is: present }
  leak: specific
- id: cold_sweat
  kind: sign
  type: binary
  label_vi: "Vã mồ hôi lạnh"
  question_vi: "Có vã mồ hôi lạnh không?"
  alt_question:
    text_vi: "Có toát mồ hôi đầm đìa, người lạnh và ướt không?"
  cluster: adrenergic
  leak: moderate
- id: bp_measured
  kind: measurement
  type: categorical
  label_vi: "Huyết áp đo được"
  question_vi: "Huyết áp đo được gần nhất là bao nhiêu?"
  help_vi: "Chọn 'Không rõ' nếu chưa đo. Ví dụ 150/95 nghĩa là số trên 150, số dưới 95. Nếu hai số thuộc hai mức khác nhau, chọn mức cao hơn."
  options:
    - { id: normal, label_vi: "Dưới 140/90 mmHg" }
    - { id: high, label_vi: "Từ 140/90 đến dưới 160/110 mmHg" }
    - { id: very_high, label_vi: "Từ 160/110 đến dưới 180/120 mmHg" }
    - { id: extreme, label_vi: "Từ 180/120 mmHg trở lên" }
  baseline: { normal: 0.75, high: 0.18, very_high: 0.05, extreme: 0.02 }
  applies_to:
    age_groups: [teen_13_17, adult_18_44, adult_45_64, elder_65_74, elder_75p]
  cost: 2
  unknown_rate: 0.5
- id: edema_face_hands
  kind: sign
  type: binary
  label_vi: "Phù mặt, phù tay mới xuất hiện"
  question_vi: "Có sưng phù mặt hoặc bàn tay mới xuất hiện không?"
  leak: moderate

# ---------- Hồi hộp, ngất (Giai đoạn 3, lô 1) ----------
- id: palpitations
  kind: symptom
  type: binary
  label_vi: "Tim đập nhanh, mạnh hoặc không đều"
  question_vi: "Có thấy tim đập nhanh, mạnh hoặc không đều (hồi hộp) không?"
  alt_question:
    text_vi: "Có thấy tim đập thình thịch trong ngực, ở cổ hoặc họng không?"
  leak: moderate
- id: palpitation_rhythm
  kind: symptom
  type: categorical
  label_vi: "Nhịp tim khi hồi hộp"
  question_vi: "Khi hồi hộp, tim đập thế nào?"
  options:
    - { id: fast_regular, label_vi: "Nhanh và đều" }
    - { id: irregular, label_vi: "Lộn xộn, không đều" }
    - { id: skipped_beats, label_vi: "Thỉnh thoảng hẫng hoặc thịch mạnh một nhịp" }
    - { id: forceful, label_vi: "Đập mạnh nhưng không nhanh lắm" }
  baseline: { fast_regular: 0.3, irregular: 0.15, skipped_beats: 0.3, forceful: 0.25 }
  requires:
    - { finding: palpitations, is: present }
- id: palpitation_abrupt_onset
  kind: symptom
  type: binary
  label_vi: "Cơn tim nhanh bắt đầu và dừng đột ngột"
  question_vi: "Cơn tim nhanh có đến và dừng đột ngột như bật tắt công tắc không?"
  requires:
    - { finding: palpitations, is: present }
  leak: 0.15
  leak_note: "Tính trong số người đã hồi hộp. Bắt đầu và dừng đột ngột gợi ý nhịp nhanh kịch phát; người bảo trì ước lượng tỷ lệ ở người không có bệnh liên kết, lượt A/B/C đối chiếu."
- id: pulse_measured
  kind: measurement
  type: categorical
  label_vi: "Mạch đo được"
  question_vi: "Mạch (nhịp tim) đo được lúc có triệu chứng là bao nhiêu lần mỗi phút?"
  help_vi: "Có thể đọc trên máy đo huyết áp, đồng hồ thông minh, hoặc đếm mạch ở cổ tay trong 1 phút. Đo lúc đang ngồi hoặc nằm nghỉ, không đo ngay sau khi vận động."
  options:
    - { id: lt_40, label_vi: "Dưới 40 lần" }
    - { id: n40_100, label_vi: "Từ 40 đến 100 lần" }
    - { id: n100_150, label_vi: "Trên 100 đến 150 lần" }
    - { id: gt_150, label_vi: "Trên 150 lần" }
    - { id: not_measured, label_vi: "Chưa đo", neutral: true }
  # Phần lớn người dùng chưa đo mạch. "Chưa đo" là lựa chọn trung tính: mọi phân bố phải ghi 0,6 như tỷ lệ nền,
  # nên câu trả lời này không mang thông tin và không bị coi là "không rõ" ở quy tắc rf_pulse_extreme.
  baseline: { lt_40: 0.004, n40_100: 0.316, n100_150: 0.068, gt_150: 0.012, not_measured: 0.6 }
  cost: 2
- id: dizziness_on_standing
  kind: symptom
  type: binary
  label_vi: "Choáng, tối sầm mắt khi vừa đứng dậy"
  question_vi: "Có choáng, tối sầm mắt ngay khi vừa đứng dậy không?"
  leak: 0.15
  leak_note: "Choáng khi đứng dậy hay gặp, nhất là ở người cao tuổi và người đang uống thuốc hạ áp; người bảo trì ước lượng, lượt A/B/C đối chiếu."
- id: syncope_trigger
  kind: history
  type: categorical
  label_vi: "Hoàn cảnh lúc ngất"
  question_vi: "Lần ngất hoặc suýt ngất này xảy ra khi nào?"
  options:
    - { id: standing_heat, label_vi: "Khi đứng lâu, ở nơi nóng hoặc đông người" }
    - { id: emotion_pain, label_vi: "Khi đang đau, sợ hãi hoặc thấy máu" }
    - { id: standing_up, label_vi: "Ngay khi vừa ngồi dậy hoặc đứng dậy" }
    - { id: toilet_cough, label_vi: "Khi đang đi tiểu, đi ngoài hoặc ho" }
    - { id: exertion, label_vi: "Khi đang gắng sức: làm việc nặng, chạy, leo dốc" }
    - { id: lying, label_vi: "Khi đang nằm" }
    - { id: no_trigger, label_vi: "Khi đang ngồi yên, hoặc không có gì đặc biệt" }
  baseline: { standing_heat: 0.25, emotion_pain: 0.15, standing_up: 0.2, toilet_cough: 0.08, exertion: 0.04, lying: 0.03, no_trigger: 0.25 }
  requires:
    - { finding: fainting_or_near_fainting, is: present }
- id: syncope_warning
  kind: history
  type: categorical
  label_vi: "Dấu hiệu ngay trước khi ngất"
  question_vi: "Ngay trước khi ngất hoặc suýt ngất, có thấy gì không?"
  options:
    - { id: prodrome, label_vi: "Nóng người, vã mồ hôi, buồn nôn hoặc tối sầm mắt" }
    - { id: palpitations_first, label_vi: "Tim đập nhanh hoặc đập loạn" }
    - { id: no_warning, label_vi: "Không thấy gì, ngất đột ngột" }
  baseline: { prodrome: 0.6, palpitations_first: 0.1, no_warning: 0.3 }
  requires:
    - { finding: fainting_or_near_fainting, is: present }
- id: not_recovered_after_faint
  kind: symptom
  type: binary
  label_vi: "Chưa hồi phục hẳn sau khi ngất"
  question_vi: "Đến giờ vẫn chưa tỉnh táo hẳn hoặc chưa đứng dậy được như bình thường?"
  help_vi: "Sau ngất thông thường, người bệnh tỉnh lại trong vòng 1 phút và hồi phục hẳn sau vài phút đến nửa giờ."
  alt_question:
    text_vi: "Đến giờ đã tự đi lại, nói chuyện được như trước khi ngất chưa?"
    inverted: true
  requires:
    - { finding: fainting_or_near_fainting, is: present }
  leak: 0.05
  leak_note: "Tính trong số người đã ngất hoặc suýt ngất. Phần lớn người ngất phản xạ hồi phục hẳn trong vài phút; người bảo trì ước lượng."
- id: family_sudden_death
  kind: history
  type: binary
  label_vi: "Bố mẹ, anh chị em hoặc con đột tử trước 40 tuổi"
  question_vi: "Bố mẹ, anh chị em hoặc con có ai đột tử trước 40 tuổi không?"
  help_vi: "Đột tử là chết đột ngột không rõ lý do, không phải do tai nạn."
  leak: 0.02
  leak_note: "Hiếm; người bảo trì ước lượng. Là dấu hiệu nguy cơ của ngất do tim (lượt R đối chiếu với hướng dẫn về ngất)."
  cost: 1.5
- id: leg_swelling_one_side
  kind: symptom
  type: binary
  label_vi: "Sưng đau một bên bắp chân"
  question_vi: "Có bị sưng, đau ở một bên bắp chân không?"
  alt_question:
    text_vi: "Một bên bắp chân có to hơn bên kia, sờ vào đau không?"
  leak: 0.03
  leak_note: "Ít gặp ở người không có huyết khối tĩnh mạch hay bệnh liên kết khác; người bảo trì ước lượng."
- id: breathless_on_exertion
  kind: symptom
  type: binary
  label_vi: "Mệt, hụt hơi khi gắng sức nhẹ"
  question_vi: "Gần đây có hụt hơi khi làm việc nhẹ hoặc leo vài bậc thang không?"
  cluster: anemia_signs
  leak: 0.15
  leak_note: "Người cao tuổi, người ít vận động hay hụt hơi khi gắng sức dù không có bệnh liên kết; 5% là quá thấp (lượt A lô 1 phần a). Người bảo trì ước lượng."
- id: neck_pounding
  kind: symptom
  type: binary
  label_vi: "Mạch ở cổ đập thình thịch khi hồi hộp"
  question_vi: "Khi hồi hộp, có thấy mạch ở cổ đập thình thịch không?"
  requires:
    - { finding: palpitations, is: present }
  leak: 0.1
  leak_note: "Tính trong số người đã hồi hộp. Gợi ý nhịp nhanh kịch phát trên thất (lượt A lô 1 phần b đề xuất); người bảo trì ước lượng."
- id: palpitation_duration
  kind: history
  type: categorical
  label_vi: "Thời gian mỗi cơn hồi hộp"
  question_vi: "Mỗi cơn hồi hộp thường kéo dài bao lâu?"
  options:
    - { id: seconds, label_vi: "Vài giây, chỉ vài nhịp" }
    - { id: minutes_hours, label_vi: "Vài phút đến vài giờ" }
    - { id: ongoing, label_vi: "Kéo dài liên tục, đến giờ vẫn còn" }
  # Lượt A (ngoại tâm thu) đề xuất: phân biệt ngoại tâm thu (vài nhịp) với cơn nhịp nhanh (vài phút đến vài giờ).
  baseline: { seconds: 0.45, minutes_hours: 0.4, ongoing: 0.15 }
  requires:
    - { finding: palpitations, is: present }

# ---------- Giai đoạn 3, lô 3 ----------
- id: chest_pain
  kind: symptom
  type: binary
  label_vi: "Đau ngực"
  question_vi: "Có đau ngực không?"
  help_vi: "Kể cả đau nhói, đau rát, tức hoặc khó chịu ở ngực."
  cluster: chest_pain
  leak: moderate
- id: chest_pain_duration
  kind: history
  type: categorical
  label_vi: "Cơn đau ngực kéo dài bao lâu"
  question_vi: "Cơn đau ngực lần này đã kéo dài bao lâu?"
  options:
    - { id: seconds, label_vi: "Chỉ vài giây rồi hết" }
    - { id: minutes, label_vi: "Vài phút, dưới 15 phút" }
    - { id: over_15min, label_vi: "Từ 15 phút trở lên, hoặc vẫn đang đau" }
    - { id: days, label_vi: "Âm ỉ nhiều ngày nay" }
  baseline: { seconds: 0.2, minutes: 0.3, over_15min: 0.25, days: 0.25 }
  requires:
    - { finding: chest_pain, is: present }
- id: chest_pain_exertional
  kind: symptom
  type: binary
  label_vi: "Đau ngực khi gắng sức, đỡ khi nghỉ"
  question_vi: "Đau ngực có xuất hiện khi gắng sức và đỡ khi nghỉ không?"
  help_vi: "Ví dụ đau khi đi nhanh, leo dốc, mang vác, ngồi nghỉ vài phút thì hết."
  requires:
    - { finding: chest_pain, is: present }
  leak: moderate
- id: chest_pain_sudden_severe
  kind: symptom
  type: binary
  label_vi: "Đau ngực đột ngột, dữ dội ngay từ đầu"
  question_vi: "Cơn đau ngực đến đột ngột và dữ dội ngay từ đầu không?"
  alt_question:
    text_vi: "Cơn đau ngực có ập đến bất ngờ, mạnh nhất ngay lúc bắt đầu không?"
  requires:
    - { finding: chest_pain, is: present }
  leak: moderate
- id: chest_pain_radiates_back
  kind: symptom
  type: binary
  label_vi: "Đau ngực lan ra sau lưng"
  question_vi: "Đau ngực có lan ra sau lưng, giữa hai bả vai không?"
  alt_question:
    text_vi: "Lúc đau ngực, phía sau lưng giữa hai bả vai có đau theo không?"
  requires:
    - { finding: chest_pain, is: present }
  cluster: pain_radiation
  leak: moderate
- id: chest_wall_tenderness
  kind: sign
  type: binary
  label_vi: "Ấn vào ngực thấy đau đúng chỗ"
  question_vi: "Ấn tay vào chỗ đau ở ngực có đau nhói lên đúng chỗ đó không?"
  requires:
    - { finding: chest_pain, is: present }
  leak: moderate
- id: leg_swelling_both
  kind: sign
  type: binary
  label_vi: "Phù hai chân"
  question_vi: "Hai bàn chân, cổ chân có phù, ấn vào để lại vết lõm không?"
  leak: moderate
