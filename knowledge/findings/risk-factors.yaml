# Yếu tố nguy cơ và bệnh nền (hỏi một lần, dùng cho nhiều bệnh).
- id: immunocompromised
  kind: risk_factor
  type: binary
  label_vi: "Sức đề kháng suy giảm"
  question_vi: "Có bệnh hoặc dùng thuốc làm giảm sức đề kháng không?"
  help_vi: "Ví dụ: đang điều trị ung thư, dùng thuốc corticoid kéo dài, nhiễm HIV, đã ghép tạng."
  leak: moderate
- id: diabetes
  kind: risk_factor
  type: binary
  label_vi: "Đái tháo đường (tiểu đường)"
  question_vi: "Có bị đái tháo đường (tiểu đường) không?"
  applies_to:
    age_groups: [teen_13_17, adult_18_44, adult_45_64, elder_65_74, elder_75p]
  leak: 0.07
  leak_note: "STEPS 2021: 7,1% người 18–69 tuổi có đái tháo đường (docs/research/vietnam-sources.md)."
- id: hypertension_known
  kind: risk_factor
  type: binary
  label_vi: "Tăng huyết áp"
  question_vi: "Có bị tăng huyết áp (cao huyết áp) không?"
  applies_to:
    age_groups: [adult_18_44, adult_45_64, elder_65_74, elder_75p]
  leak: 0.15
  leak_note: "STEPS 2021: 26,2% có huyết áp cao, khoảng 6/10 chưa từng được phát hiện; tỷ lệ tự biết ước khoảng 10–15%."
- id: known_heart_disease
  kind: risk_factor
  type: binary
  label_vi: "Bệnh tim đã biết"
  question_vi: "Có bệnh tim đã biết, như bệnh mạch vành hoặc suy tim không?"
  applies_to:
    age_groups: [adult_18_44, adult_45_64, elder_65_74, elder_75p]
  leak: moderate
- id: smoker
  kind: risk_factor
  type: binary
  label_vi: "Hút thuốc lá, thuốc lào"
  question_vi: "Có đang hút thuốc lá hoặc thuốc lào không?"
  applies_to:
    age_groups: [teen_13_17, adult_18_44, adult_45_64, elder_65_74, elder_75p]
  leak: 0.2
  leak_note: "Ước tính chung cho người trưởng thành (nam hút nhiều, nữ rất ít); cần thay bằng số liệu GATS Việt Nam."
- id: heavy_alcohol
  kind: risk_factor
  type: binary
  label_vi: "Uống nhiều rượu bia"
  question_vi: "Có hay uống nhiều rượu bia, hoặc vừa uống rất nhiều không?"
  applies_to:
    age_groups: [teen_13_17, adult_18_44, adult_45_64, elder_65_74, elder_75p]
  leak: 0.15
  leak_note: "Ước tính chung cho người trưởng thành; cần thay bằng số liệu STEPS về uống rượu bia ở mức có hại."
- id: regular_painkiller_use
  kind: risk_factor
  type: binary
  label_vi: "Hay dùng thuốc giảm đau, thuốc xương khớp"
  question_vi: "Có hay uống thuốc giảm đau hoặc thuốc xương khớp không?"
  applies_to:
    age_groups: [teen_13_17, adult_18_44, adult_45_64, elder_65_74, elder_75p]
  leak: moderate
- id: gallstones_known
  kind: history
  type: binary
  label_vi: "Đã biết có sỏi mật"
  question_vi: "Đã từng được bác sĩ nói là có sỏi mật không?"
  applies_to:
    age_groups: [teen_13_17, adult_18_44, adult_45_64, elder_65_74, elder_75p]
  leak: moderate
- id: previous_abdominal_surgery
  kind: history
  type: binary
  label_vi: "Đã từng mổ bụng"
  question_vi: "Đã từng mổ bụng (kể cả mổ đẻ) không?"
  leak: 0.15
  leak_note: "Người trưởng thành từng mổ bụng (kể cả mổ đẻ, mổ ruột thừa) khá phổ biến; 5% là thấp (lượt A lô 3). Ước lượng, cần số liệu."

# ---------- Giai đoạn 3, lô 1 ----------
- id: on_glucose_lowering_meds
  kind: risk_factor
  type: binary
  label_vi: "Đang dùng insulin hoặc thuốc hạ đường huyết"
  question_vi: "Có đang tiêm insulin hoặc uống thuốc hạ đường huyết (thuốc tiểu đường) không?"
  requires:
    - { finding: diabetes, is: present }
  leak: 0.7
  leak_note: "Tính trong số người đã biết mình bị đái tháo đường: phần lớn đang dùng thuốc. Người bảo trì ước lượng."
- id: bp_lowering_meds
  kind: risk_factor
  type: binary
  label_vi: "Đang uống thuốc hạ huyết áp hoặc lợi tiểu"
  question_vi: "Có đang uống thuốc hạ huyết áp hoặc thuốc lợi tiểu không?"
  leak: 0.15
  leak_note: "STEPS 2021: 26,2% người 18–69 tuổi bị huyết áp cao, 30,7% trong số đó đang dùng thuốc; tỷ lệ cao hơn ở người cao tuổi, nhóm hay bị chóng mặt. Người bảo trì ước lượng."
- id: recent_immobility
  kind: risk_factor
  type: binary
  label_vi: "Mới phẫu thuật, nằm lâu hoặc ngồi xe lâu"
  question_vi: "4 tuần qua có mổ, bó bột, nằm lâu hoặc đi xe trên 4 giờ không?"
  help_vi: "Nằm lâu là nằm một chỗ nhiều ngày; đi xe hoặc máy bay trên 4 giờ liền."
  leak: 0.08
  leak_note: "Yếu tố nguy cơ huyết khối; người bảo trì ước lượng tỷ lệ ở người không có bệnh liên kết."
- id: previous_clot
  kind: history
  type: binary
  label_vi: "Từng bị cục máu đông ở chân hoặc tắc mạch phổi"
  question_vi: "Đã từng bị cục máu đông ở chân hoặc tắc mạch phổi chưa?"
  leak: 0.01
  leak_note: "Ít gặp; người bảo trì ước lượng (lượt A lô 1 phần b đề xuất)."
- id: active_cancer
  kind: risk_factor
  type: binary
  label_vi: "Đang mắc ung thư"
  question_vi: "Có đang mắc ung thư hoặc đang điều trị ung thư không?"
  cost: 3
  leak: 0.02
  leak_note: "Người bảo trì ước lượng (lượt A lô 1 phần b đề xuất)."
- id: antithrombotic_use
  kind: risk_factor
  type: binary
  label_vi: "Đang uống thuốc chống đông hoặc aspirin"
  question_vi: "Có đang uống thuốc chống đông máu hoặc aspirin hằng ngày không?"
  leak: 0.05
  leak_note: "Người cao tuổi bị bệnh tim mạch hay dùng; người bảo trì ước lượng (lượt A lô 1 phần b đề xuất)."
- id: chronic_liver_disease
  kind: risk_factor
  type: binary
  label_vi: "Bị xơ gan hoặc viêm gan mạn"
  question_vi: "Có bị xơ gan hoặc viêm gan B, viêm gan C mạn tính không?"
  leak: 0.06
  leak_note: "Viêm gan B lưu hành cao ở Việt Nam; người bảo trì ước lượng (lượt A lô 1 phần b đề xuất)."

# ---------- Giai đoạn 3, lô 2 ----------
- id: known_aaa
  kind: history
  type: binary
  label_vi: "Đã biết có phình động mạch chủ"
  question_vi: "Bác sĩ đã từng nói có phình động mạch chủ chưa?"
  help_vi: "Động mạch chủ là mạch máu lớn nhất, chạy qua ngực và bụng."
  applies_to:
    age_groups: [adult_45_64, elder_65_74, elder_75p]
  leak: 0.01
  leak_note: "Người bảo trì ước lượng."
- id: atrial_fibrillation_known
  kind: history
  type: binary
  label_vi: "Bị rung nhĩ"
  question_vi: "Bác sĩ đã từng nói bị rung nhĩ (một kiểu loạn nhịp tim) chưa?"
  applies_to:
    age_groups: [adult_45_64, elder_65_74, elder_75p]
  leak: 0.04
  leak_note: "Rung nhĩ tăng theo tuổi (vài phần trăm ở người cao tuổi); người bảo trì ước lượng."
