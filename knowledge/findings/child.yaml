# Dấu hiệu riêng ở trẻ em (dấu hiệu nguy hiểm theo IMCI của WHO, mất nước, tay chân miệng, lồng ruột).
- id: child_unable_to_drink
  kind: sign
  type: binary
  label_vi: "Không uống được, không bú được"
  question_vi: "Bé có không uống được hoặc không bú được không?"
  alt_question:
    text_vi: "Khi cho uống nước hoặc cho bú, bé có uống, bú được không?"
    inverted: true
  applies_to:
    age_groups: [child_2m_5y]
  leak: specific
- id: child_vomits_everything
  kind: sign
  type: binary
  label_vi: "Nôn ra tất cả mọi thứ"
  question_vi: "Bé có nôn ra tất cả mọi thứ ăn, uống vào không?"
  alt_question:
    text_vi: "Trong vài giờ qua, bé có giữ được chút sữa hoặc nước nào không?"
    inverted: true
  applies_to:
    age_groups: [child_2m_5y]
  cluster: vomiting
  leak: specific
- id: young_infant_not_feeding
  kind: sign
  type: binary
  label_vi: "Bú kém hoặc bỏ bú"
  question_vi: "Bé có bú kém hoặc bỏ bú không?"
  alt_question:
    text_vi: "Hôm nay bé có bú được như mọi ngày không?"
    inverted: true
  applies_to:
    age_groups: [infant_0_2m]
  leak: specific
- id: young_infant_fast_breathing
  kind: sign
  type: binary
  label_vi: "Thở nhanh, rút lõm lồng ngực"
  question_vi: "Bé có thở nhanh, hoặc lồng ngực rút lõm khi thở không?"
  help_vi: "Thở nhanh là từ 60 lần/phút trở lên khi bé nằm yên. Rút lõm lồng ngực là khi bé hít vào, phần dưới lồng ngực lõm sâu xuống."
  alt_question:
    text_vi: "Khi bé nằm yên, có thấy bé thở gấp hơn bình thường không?"
  applies_to:
    age_groups: [infant_0_2m]
  leak: specific
- id: young_infant_low_temp
  kind: sign
  type: binary
  label_vi: "Người lạnh, nhiệt độ thấp"
  question_vi: "Người bé có lạnh, nhiệt độ dưới 35,5°C không?"
  help_vi: "Đo nhiệt độ ở nách. Nếu không có nhiệt kế, sờ bụng hoặc nách bé xem có lạnh bất thường không."
  alt_question:
    text_vi: "Sờ ngực, bụng bé có thấy lạnh hơn bình thường không?"
  applies_to:
    age_groups: [infant_0_2m]
  leak: specific
- id: young_infant_reduced_movement
  kind: sign
  type: binary
  label_vi: "Ít cử động"
  question_vi: "Bé chỉ cử động khi bị kích thích, hoặc không cử động không?"
  alt_question:
    text_vi: "Khi thức, bé có tự cử động chân tay như mọi ngày không?"
    inverted: true
  applies_to:
    age_groups: [infant_0_2m]
  leak: specific
- id: bulging_fontanelle
  kind: sign
  type: binary
  label_vi: "Thóp phồng"
  question_vi: "Thóp (chỗ mềm trên đỉnh đầu) của bé có phồng căng không?"
  alt_question:
    text_vi: "Khi bé nằm yên, sờ nhẹ đỉnh đầu có thấy căng phồng không?"
  applies_to:
    age_groups: [infant_0_2m, child_2m_5y]
  # Thóp trước thường đóng trước 18–24 tháng tuổi.
  requires:
    - { age_months_lt: 24 }
  leak: specific
- id: sunken_eyes
  kind: sign
  type: binary
  label_vi: "Mắt trũng"
  question_vi: "Mắt bé có trũng sâu hơn bình thường không?"
  applies_to:
    age_groups: [child_2m_5y, child_5_12]
  leak: specific
- id: startle_myoclonus
  kind: sign
  type: binary
  label_vi: "Giật mình, chới với"
  question_vi: "Bé có hay giật mình, chới với, nhất là khi ngủ không?"
  help_vi: "Là những cơn giật mình ngắn 1–2 giây ở tay chân, hay gặp lúc mới ngủ hoặc khi nằm ngửa."
  applies_to:
    age_groups: [child_2m_5y, child_5_12]
  leak: specific
- id: red_jelly_stool
  kind: sign
  type: binary
  label_vi: "Phân nhầy máu như mứt dâu"
  question_vi: "Phân có nhầy lẫn máu đỏ, giống mứt dâu không?"
  alt_question:
    text_vi: "Tã hoặc bô của bé có dính chất nhầy màu đỏ sẫm không?"
  applies_to:
    age_groups: [child_2m_5y, child_5_12]
  leak: specific
- id: episodic_crying_legs_drawn
  kind: sign
  type: binary
  label_vi: "Khóc thét từng cơn, co chân lên bụng"
  question_vi: "Bé có khóc thét từng cơn, co chân lên bụng rồi lại nằm yên không?"
  applies_to:
    age_groups: [child_2m_5y]
  cluster: colicky_pain
  leak: 0.10
  leak_note: "Ở nhóm chứng của nghiên cứu lồng ruột tại Hà Nội (Bines 2006, phần lớn viêm dạ dày – ruột), khoảng 18% trẻ có \"đau bụng\" (tiêu chuẩn phụ; bài báo không tách riêng khóc từng cơn); 1% là quá thấp (lượt B lô 3; lượt C lô 3 sửa câu chữ)."
- id: measles_vaccinated
  kind: risk_factor
  type: binary
  label_vi: "Đã tiêm đủ vắc xin sởi"
  question_vi: "Đã tiêm đủ 2 mũi vắc xin phòng sởi chưa?"
  help_vi: "Xem sổ tiêm chủng. Chọn 'Không rõ' nếu không nhớ."
  applies_to:
    age_groups: [child_2m_5y, child_5_12, teen_13_17]
  # Trẻ dưới 18 tháng chưa đến lịch tiêm đủ 2 mũi, nên câu trả lời "chưa" không mang thông tin (lượt A lô 1).
  requires:
    - { not: { age_months_lt: 18 } }
  unknown_rate: 0.3
  leak: 0.85
  leak_note: "Tỷ lệ tiêm vắc xin sởi trong tiêm chủng mở rộng ở Việt Nam cao; giá trị này là ước tính, cần thay bằng số liệu chính thức."
- id: measles_contact
  kind: exposure
  type: binary
  label_vi: "3 tuần qua tiếp xúc người bị sởi"
  question_vi: "Trong 3 tuần qua, có tiếp xúc người bị sởi không?"
  leak: specific
- id: hfmd_contact
  kind: exposure
  type: binary
  label_vi: "Gần trẻ bị tay chân miệng"
  question_vi: "Ở nhà hoặc lớp học có trẻ đang bị tay chân miệng không?"
  applies_to:
    age_groups: [child_2m_5y, child_5_12]
  leak: specific

# ---------- Giai đoạn 3, lô 2 ----------
- id: red_lips_strawberry_tongue
  kind: sign
  type: binary
  label_vi: "Môi đỏ, khô nứt hoặc lưỡi đỏ như quả dâu tây"
  question_vi: "Môi có đỏ, khô nứt, hoặc lưỡi đỏ rực như quả dâu tây không?"
  applies_to:
    age_groups: [child_2m_5y, child_5_12]
  leak: 0.08
  leak_note: "Môi khô nứt khá hay gặp ở trẻ sốt vì mất nước; người bảo trì ước lượng."
- id: hands_feet_swelling_peeling
  kind: sign
  type: binary
  label_vi: "Bàn tay, bàn chân sưng đỏ hoặc bong da đầu ngón"
  question_vi: "Bàn tay, bàn chân có sưng phù, đỏ, hoặc bong da ở đầu ngón không?"
  help_vi: "Không tính các nốt phỏng nước của bệnh tay chân miệng."
  applies_to:
    age_groups: [child_2m_5y, child_5_12]
  leak: 0.02
  leak_note: "Người bảo trì ước lượng."
- id: bcg_scar_red
  kind: sign
  type: binary
  label_vi: "Chỗ tiêm phòng lao sưng đỏ lại"
  question_vi: "Vết tiêm phòng lao (BCG) ở vai, cánh tay có sưng đỏ lại không?"
  help_vi: "Vết tiêm phòng lao lúc mới sinh thường để lại một sẹo nhỏ ở vai hoặc phía trên cánh tay."
  applies_to:
    age_groups: [child_2m_5y]
  leak: 0.05
  leak_note: "Tổng quan Khreis 2026 (Pediatrics International, lượt B lô 2 đọc toàn văn): ở Singapore, 9,9% trẻ sốt do nguyên nhân khác cũng có thay đổi ở sẹo BCG, so với 42,7% ở trẻ Kawasaki. Ở cộng đồng có lẽ thấp hơn nhóm nằm viện, nên chọn 5%; ước lượng ban đầu 0,5% của người bảo trì là quá thấp."

# ---------- Giai đoạn 3, lô 3 ----------
- id: chest_indrawing
  kind: sign
  type: binary
  label_vi: "Ngực dưới lõm sâu mỗi lần hít vào (rút lõm lồng ngực)"
  question_vi: "Khi bé hít vào, phần ngực dưới (vùng bờ sườn) có lõm sâu vào không?"
  help_vi: "Nhìn khi bé nằm yên, không khóc, không bú: phần ngực dưới bị kéo lõm vào mỗi lần hít vào. Chỉ hõm nhẹ giữa các xương sườn thì chưa tính."
  alt_question:
    text_vi: "Khi bé hít vào, vùng bờ sườn có bị hút lõm vào không?"
  applies_to:
    age_groups: [child_2m_5y]
  leak: specific
- id: apnea_cyanosis_spells
  kind: sign
  type: binary
  label_vi: "Có lúc ngừng thở, tím tái"
  question_vi: "Bé có lúc ngừng thở, hoặc tím tái môi, mặt từng lúc không?"
  help_vi: "Kể cả lúc đang ho hoặc đang ngủ."
  alt_question:
    text_vi: "Có lúc nào bé đang thở bỗng ngưng lại, mặt tái hoặc tím đi không?"
  applies_to:
    age_groups: [infant_0_2m, child_2m_5y]
  leak: specific
- id: child_feeding_reduced
  kind: sign
  type: binary
  label_vi: "24 giờ qua chỉ bú, ăn được khoảng một nửa"
  question_vi: "Trong 24 giờ qua, bé chỉ bú, ăn được khoảng một nửa mọi ngày không?"
  alt_question:
    text_vi: "Mỗi cữ bú, bữa ăn, bé có bỏ dở nhiều hơn mọi ngày không?"
  applies_to:
    age_groups: [child_2m_5y]
  leak: moderate
