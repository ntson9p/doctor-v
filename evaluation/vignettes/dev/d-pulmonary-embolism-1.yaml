source:
  basis: "Thuyên tắc phổi điển hình: khó thở đột ngột, đau ngực kiểu màng phổi, ngất, dấu hiệu huyết khối tĩnh mạch sâu sau ngồi xe lâu (ESC 2019 mục 4.1, bảng 3; Miniati 2012). NHS: khó thở đột ngột, ngất thì gọi 999 hoặc đến cấp cứu. Quy tắc rf_syncope_breathing (mức 1)."
