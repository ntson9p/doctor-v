title_vi: "Nam 55 tuổi sau chuyến xe 10 giờ, đột ngột khó thở, đau ngực khi hít sâu rồi ngất"
narrative_vi: "Ông C., 55 tuổi, ba ngày trước đi xe khách 10 giờ liền. Từ hôm qua bắp chân trái sưng đau. Sáng nay đột ngột khó thở, đau nhói ngực khi hít sâu, tim đập nhanh, rồi ngất khi vừa đứng dậy, vài giây sau tỉnh. Hiện vẫn còn khó thở. Không ho ra máu. Không có ung thư, chưa từng bị cục máu đông."
