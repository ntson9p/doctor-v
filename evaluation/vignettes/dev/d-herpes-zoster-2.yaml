source:
  basis: "Giai đoạn tiền triệu của zona: bỏng rát, châm chích, đau trên một vùng da 1–5 ngày trước khi nổi ban (75/QĐ-BYT); dấu hiệu đầu là châm chích hoặc đau ở một vùng da, ban mọc vài ngày sau (NHS Shingles). Khi chưa có ban, bệnh khó phân biệt với đau thành ngực; đau ngực lúc có lúc không, không có dấu hiệu nguy hiểm thì khám bác sĩ gia đình (NHS Chest pain): mức 4."
  references: [byt-qd-75-2015, nhs-shingles, nhs-chest-pain]
author: "agent:pass-c"
notes_vi: "Ca không điển hình (giai đoạn sớm, chưa nổi ban); đau thành ngực là chẩn đoán chấp nhận được khi chưa có ban."
