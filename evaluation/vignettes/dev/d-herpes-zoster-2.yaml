id: d-herpes-zoster-2
set: dev
title_vi: "Nam 58 tuổi 2 ngày nay đau rát, châm chích một dải da ngực trái, áo cọ vào cũng đau, chưa nổi ban"
narrative_vi: "Ông V., 58 tuổi, ở Long An. Hai ngày nay thấy đau rát, châm chích ở một dải da bên ngực trái, từ dưới vú vòng ra nách, áo cọ vào cũng đau, đêm khó ngủ. Da chỗ đó chưa thấy nổi gì. Chạm vào thì đau. Đau âm ỉ suốt, không tức nặng giữa ngực, không lan ra tay hay hàm, không đau khi đi lại nhanh. Không khó thở, không vã mồ hôi, không buồn nôn, không choáng. Không sốt, không ho, không ợ chua. Không hút thuốc, không tăng huyết áp, không đái tháo đường, không có bệnh tim."
