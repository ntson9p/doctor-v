id: d-benign-paroxysmal-positional-vertigo-3
set: dev
title_vi: "Nữ 66 tuổi, uống thuốc huyết áp, quay cuồng khi nằm xuống và khi ngồi dậy buổi sáng"
narrative_vi: "Bà L., 66 tuổi, tăng huyết áp, uống thuốc hạ áp đều. Năm ngày nay, sáng nào ngồi dậy khỏi giường cũng thấy quay cuồng, phải ngồi yên khoảng nửa phút mới hết; khi nằm xuống hoặc trở mình cũng bị. Bà nghĩ do thuốc huyết áp làm tụt huyết áp vì hay bị lúc vừa dậy. Có buồn nôn, không nôn. Không ngất, không tối sầm mắt. Không đau đầu, không nhìn đôi, không yếu tê, không ù tai. Chưa bị lần nào trước đây."
