source:
  basis: "Dễ nhầm với hạ huyết áp tư thế do thuốc hạ áp (reflex_orthostatic_syncope): cả hai xuất hiện khi vừa ngồi dậy. Điểm phân biệt là cảm giác quay, cơn dưới 1 phút và cơn có cả khi nằm xuống, trở mình (von Brevern 2007: ngồi dậy 58%, nằm xuống 74%, trở mình 85%), còn hạ huyết áp tư thế gây choáng, tối sầm mắt khi đứng, không khi nằm xuống (NHS Dizziness). Mức xử trí theo NHS Vertigo (khám không khẩn)."
  references: [vonbrevern-jnnp-2007, msd-bppv, nhs-dizziness, nhs-vertigo]
author: "agent:pass-c"
notes_vi: "Ca dễ nhầm với bệnh của phần b (ngất phản xạ, hạ huyết áp tư thế)."
