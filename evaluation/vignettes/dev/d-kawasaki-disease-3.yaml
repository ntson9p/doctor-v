source:
  basis: "Dễ nhầm với sởi (sốt, đỏ mắt, ho, phát ban). Điểm gợi ý Kawasaki: ban bắt đầu ở thân, không mọc từ mặt (Lee 2022; sởi mọc từ sau tai, mặt theo 1019/QĐ-BYT), môi đỏ nứt, phù đỏ đầu chi (3312/QĐ-BYT 2015, bảng 1; sởi là chẩn đoán phân biệt), đã tiêm đủ 2 mũi vắc xin sởi (NHS Measles: khó là sởi). Khám trong 24 giờ (mức 3)."
