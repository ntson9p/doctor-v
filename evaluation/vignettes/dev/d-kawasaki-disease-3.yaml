id: d-kawasaki-disease-3
set: dev
title_vi: "Bé trai 3 tuổi, sốt 5 ngày, đỏ mắt, ho ít, nổi ban, môi đỏ nứt, sưng mu bàn tay; đã tiêm sởi"
narrative_vi: "Bé Đ., 3 tuổi, ở Đà Nẵng. Bé sốt 39,5°C đã 5 ngày, ho húng hắng vài tiếng. Hai mắt đỏ, không có ghèn. Từ hôm qua nổi ban đỏ ở bụng, lưng rồi lan ra tay chân, mặt không có ban. Môi đỏ, khô nứt, lưỡi đỏ. Mu bàn tay sưng, lòng bàn tay đỏ. Bé không sổ mũi. Bé đã tiêm đủ 2 mũi vắc xin sởi, không tiếp xúc ai bị sởi. Không có phỏng nước ở tay chân, không loét miệng. Bé vẫn uống được, chơi được lúc hạ sốt."
