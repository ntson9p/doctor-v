title_vi: Nam 38 tuổi đau đầu, đau gáy bên phải sau khi bẻ cổ ở tiệm gội đầu, đột ngột mất thăng bằng
narrative_vi: Anh J., 38 tuổi, khỏe mạnh. Ba ngày trước được bẻ cổ mạnh khi gội đầu ở tiệm. Từ hôm qua đau đầu vùng gáy và sau đầu bên phải, đau vừa. Sáng nay đột ngột chóng mặt, đi loạng choạng, xiêu sang phải. Không méo miệng, không yếu tay chân, nói bình thường, không nhìn đôi. Không sốt, không cứng gáy, không nôn, không ngất.
