source:
  basis: "Bóc tách động mạch đốt sống sau bẻ, nắn cổ gây đột quỵ tuần hoàn sau ở người trẻ: đau gáy, đau đầu một bên kèm mất thăng bằng (Biller 2014; Engelter 2013: 40,5% có chấn thương cổ trong tháng trước). Mất thăng bằng đột ngột (chữ B của BE-FAST) ở người có yếu tố cơ học: quy tắc rf_befast_high_risk mức 1; NHS: nghĩ đột quỵ thì gọi 999."
