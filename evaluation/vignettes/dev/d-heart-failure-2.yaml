id: d-heart-failure-2
set: dev
title_vi: "Nữ 80 tuổi ho về đêm 2 tuần, hơi khó thở khi đi lại, phù cổ chân, chưa biết bệnh tim"
narrative_vi: "Bà N., 80 tuổi, ở Long An, bị tăng huyết áp và đái tháo đường, chưa từng được nói có bệnh tim. Hai tuần nay bà ho khan, ho nhiều về đêm, gần sáng; đi lại trong nhà thấy hụt hơi, nằm thấp thì khó chịu nên phải kê cao gối. Hai cổ chân phù. Bà mệt hơn mọi khi. Sáng nay con gái đo huyết áp cho bà được 150/85 mmHg. Không sốt, không khạc đờm, không ho ra máu, không đau ngực, không khò khè. Không sụt cân, không ra mồ hôi đêm, không hút thuốc. Nhà không ai bị lao."
