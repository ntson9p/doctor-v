source:
  basis: "Suy tim mới mắc ở người cao tuổi có tăng huyết áp, đái tháo đường, biểu hiện không điển hình bằng ho về đêm (1857/QĐ-BYT Bảng 3: ho về đêm là triệu chứng ít điển hình), kèm khó thở khi gắng sức, khó thở khi nằm, phù mắt cá chân. NHS Heart failure: khó thở khi nằm thì khám khẩn hoặc gọi 111 (mức 3); MSD: suy tim mới mắc cần được đánh giá sớm."
