source:
  basis: "Dễ nhầm với sốc nhiệt: cùng phơi nắng, gắng sức, người nóng, nhưng tỉnh táo, nói năng bình thường, đi lại vững, ra nhiều mồ hôi, chuột rút: kiệt sức do nóng (NHS Heat exhaustion and heatstroke; MSD: tri giác bình thường là điểm phân biệt chính, thân nhiệt nếu tăng thường không quá 40°C). NHS: làm mát, uống nước, thường đỡ trong 30 phút (mức 5)."
