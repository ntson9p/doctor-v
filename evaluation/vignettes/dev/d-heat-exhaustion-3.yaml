id: d-heat-exhaustion-3
set: dev
title_vi: "Nam 28 tuổi chạy bộ giữa trưa hè ở Hà Nội, đau đầu, chóng mặt, buồn nôn, người nóng, vẫn tỉnh táo"
narrative_vi: "Anh Q., 28 tuổi, ở Hà Nội. Trưa nay trời 38°C, anh chạy bộ 10 km. Về nhà anh đau đầu vùng trán, chóng mặt, buồn nôn, mệt, vã mồ hôi đầm đìa, người nóng, đo nách 37,8°C, chuột rút ở bắp chân. Anh vẫn tỉnh táo, nói chuyện bình thường, tự đi lại vững, không ngất. Không đau ngực, không khó thở. Anh chưa từng đau đầu kiểu này. Không có bệnh nền."
