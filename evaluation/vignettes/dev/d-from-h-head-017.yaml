  basis: "Đau đầu do lạm dụng thuốc giảm đau (dùng từ 15 ngày mỗi tháng trở lên ở người có sẵn đau đầu): cần gặp bác sĩ trong vài ngày để ngừng thuốc có kế hoạch (NICE CG150; NHS Headaches: hay bị đau đầu, uống quá nhiều thuốc giảm đau)."
