notes_vi: "Ngoài danh mục bệnh. Danh mục chưa có câu hỏi về số ngày dùng thuốc giảm đau mỗi tháng và đau đầu khi ngủ dậy. Chuyển từ bộ giữ kín (h-head-017) ngày 25/10/2026: ca được dùng làm căn cứ cho vòng sửa thứ hai sau lần chấm thứ hai (bị xếp thấp hơn mức cần), theo quy tắc giữ kín của docs/evaluation.md. Người bảo trì thêm câu trả lời cho dấu hiệu mới headache_frequent (có) theo lời kể đau đầu gần như ngày nào."
