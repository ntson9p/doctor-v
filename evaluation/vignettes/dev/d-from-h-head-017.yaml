title_vi: "Nữ 45 tuổi, đau đầu gần như hằng ngày 4 tháng, uống thuốc giảm đau khoảng 20 ngày mỗi tháng"
narrative_vi: "Chị H., 45 tuổi, ở Hà Nội, bị đau nửa đầu từ trẻ. Bốn tháng nay chị đau đầu gần như ngày nào, đau âm ỉ, bó chặt cả hai bên, thường có sẵn khi ngủ dậy, mức vừa. Mỗi tháng chị uống thuốc giảm đau có caffeine khoảng 20 ngày. Chị căng thẳng, ngủ kém. Chị không buồn nôn, không nhìn mờ, không yếu tay chân, không sốt."
