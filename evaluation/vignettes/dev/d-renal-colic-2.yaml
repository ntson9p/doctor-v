title_vi: "Nữ 30 tuổi, 2 ngày đau từng đợt bụng dưới bên phải lan ra hông lưng, tiểu nhiều lần, nước tiểu hồng"
narrative_vi: "Chị G., 30 tuổi. Hai ngày nay đau âm ỉ từng đợt bụng dưới bên phải, có lúc lan ra hông lưng phải, đi tiểu nhiều lần, nước tiểu hồng. Không đau buốt khi đi tiểu, không sốt, không buồn nôn. Không có thai, không chậm kinh, không ra máu âm đạo, không ra khí hư bất thường. Đau không dữ dội, không tăng khi đi lại."
