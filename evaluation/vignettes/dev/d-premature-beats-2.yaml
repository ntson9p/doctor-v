source:
  basis: "Ca không điển hình (thiếu niên, tả là 'lộn xộn' thay vì hẫng nhịp): ngoại tâm thu hay gặp cả ở người trẻ và thường lành tính (EHRA 2011); ở trẻ hồi hộp, ngoại tâm thu thất và nhĩ là bất thường hay gặp nhất trên Holter (Aman 2017). Không có ngất, đau ngực, khó thở, tiền sử gia đình đột tử; NHS: khám bác sĩ gia đình (không khẩn)."
  references: [raviele-europace-2011, aman-jpma-2017, nhs-heart-palpitations]
