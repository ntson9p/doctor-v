id: d-premature-beats-2
set: dev
title_vi: "Nữ 15 tuổi thấy tim đập lộn xộn vài nhịp khi nằm trên giường buổi tối"
narrative_vi: "Em M., 15 tuổi, học sinh, mấy tuần nay ôn thi, buổi tối nằm trên giường hay thấy tim đập lộn xộn vài nhịp rồi lại đều, mỗi lần vài giây. Em lo lắng nhưng không sợ hãi dữ dội. Không đau ngực, không khó thở, không choáng, không ngất. Không run tay, không sụt cân. Chưa có kinh nguyệt bất thường, không chậm kinh, không có thai. Không ai trong gia đình đột tử. Chưa đo mạch."
