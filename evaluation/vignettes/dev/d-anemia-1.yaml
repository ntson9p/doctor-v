source:
  basis: "Ca điển hình của thiếu máu thiếu sắt do kinh nguyệt nhiều (NHS Iron deficiency anaemia; 1832/QĐ-BYT): mệt, hoa mắt, chóng mặt, khó thở khi gắng sức, hồi hộp, da xanh, niêm mạc nhợt. NHS: khám bác sĩ (không khẩn) để xét nghiệm máu và tìm nguyên nhân."
