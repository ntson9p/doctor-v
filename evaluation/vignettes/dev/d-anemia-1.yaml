id: d-anemia-1
set: dev
title_vi: "Nữ 32 tuổi, kinh nguyệt ra nhiều nửa năm, mệt, da xanh, hụt hơi khi leo cầu thang, chóng mặt âm ỉ"
narrative_vi: "Chị A., 32 tuổi. Nửa năm nay kinh nguyệt ra nhiều, kéo dài 8–9 ngày, phải thay băng liên tục. Mấy tuần nay hay choáng váng, hoa mắt âm ỉ gần như suốt ngày, nhất là khi vừa đứng dậy; mệt, leo một tầng cầu thang đã hụt hơi, tim đập nhanh khi làm việc nặng. Người nhà bảo chị da xanh, môi nhợt. Không thấy quay, không ngất. Không đi ngoài phân đen, không sụt cân. Không có thai, không chậm kinh. Chưa từng xét nghiệm máu. Không có bệnh nền."
