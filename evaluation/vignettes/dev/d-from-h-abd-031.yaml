title_vi: "Nữ 31 tuổi chậm kinh 6 tuần, đột ngột đau dữ dội bụng dưới phải, ngất, da tái"
narrative_vi: "Chị H., 31 tuổi, ở Đắk Lắk, chậm kinh khoảng 6 tuần nhưng chưa thử thai. Khoảng 1 giờ trước chị đột ngột đau dữ dội bụng dưới bên phải, rồi ngất trong nhà vệ sinh. Hiện chị tỉnh nhưng da tái, vã mồ hôi lạnh, tay chân lạnh, rất mệt, choáng váng khi ngồi dậy. Bụng đau, không cho sờ vào. Chị ra ít máu âm đạo."
