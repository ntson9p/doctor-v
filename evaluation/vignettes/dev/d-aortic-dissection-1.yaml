  basis: "Bóc tách động mạch chủ điển hình: đau ngực đột ngột, dữ dội, như xé, lan ra lưng giữa hai bả vai, ở người tăng huyết áp (MSD; HSE; Klompas 2002). NHS Chest pain: đau ngực đột ngột lan ra lưng thì gọi 999; bệnh tử vong 1–2% mỗi giờ nếu không điều trị (MSD): mức 1."
