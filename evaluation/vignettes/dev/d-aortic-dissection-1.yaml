id: d-aortic-dissection-1
set: dev
title_vi: "Nam 64 tuổi tăng huyết áp, đột ngột đau ngực dữ dội như xé, lan ra sau lưng giữa hai bả vai 40 phút"
narrative_vi: "Ông S., 64 tuổi, ở Đà Nẵng, bị tăng huyết áp nhiều năm nhưng uống thuốc thất thường, hút thuốc lá. Khoảng 40 phút trước, đang ngồi uống trà thì đột ngột đau ngực dữ dội ngay từ đầu, cảm giác như bị xé bên trong, đau lan ra sau lưng giữa hai bả vai, đến giờ vẫn đau. Đau ở giữa ngực. Không vã mồ hôi, không buồn nôn, không khó thở, không choáng hay ngất. Không yếu tay chân, không nói khó. Đau không tăng khi hít thở, ấn vào ngực không đau thêm. Chưa từng đau như vậy, không bị đái tháo đường, chưa được nói có bệnh tim hay phình động mạch chủ."
