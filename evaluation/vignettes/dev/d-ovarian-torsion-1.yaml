title_vi: Nữ 27 tuổi có u nang buồng trứng, đột ngột đau dữ dội bụng dưới bên phải, buồn nôn, nôn
narrative_vi: Chị V., 27 tuổi, năm ngoái siêu âm được nói có u nang buồng trứng phải. Bốn giờ trước, sau khi bê chậu nước, chị đột ngột đau dữ dội bụng dưới bên phải, không đi lại được, buồn nôn và nôn 2 lần. Không chậm kinh, kỳ kinh gần nhất 2 tuần trước, chắc chắn không có thai. Không sốt, không ra máu âm đạo, không khí hư bất thường, không tiểu buốt, không tiêu chảy.
