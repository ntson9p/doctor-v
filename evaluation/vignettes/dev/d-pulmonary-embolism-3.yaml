source:
  basis: "Dễ nhầm với cơn hoảng sợ (hồi hộp, khó thở, lo sợ, từng có cơn hoảng sợ), nhưng có đau ngực kiểu màng phổi, sưng đau một bên bắp chân sau chuyến bay dài, không có tê bì (ESC 2019 mục 4.1, bảng 3; Miniati 2012; NHS Pulmonary embolism: khó thở đột ngột, đau ngực thì gọi 999 hoặc đến cấp cứu). doctor-v xếp thuyên tắc phổi mức 1."
