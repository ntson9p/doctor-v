title_vi: "Nữ 30 tuổi sau chuyến bay dài, hồi hộp, khó thở, lo sợ, tưởng là cơn hoảng sợ"
narrative_vi: "Chị K., 30 tuổi, hai ngày trước bay một chuyến 12 giờ. Tối nay bỗng thấy tim đập nhanh, khó thở, đau nhói ngực bên phải khi hít sâu, rất lo sợ, choáng váng nhưng không như sắp ngất. Chị từng có cơn hoảng sợ hồi đi học nên nghĩ lại bị như vậy. Bắp chân trái hơi sưng đau. Không ho ra máu. Không run tay, không tê bì. Không có thai, kinh nguyệt đều. Chưa đo mạch."
