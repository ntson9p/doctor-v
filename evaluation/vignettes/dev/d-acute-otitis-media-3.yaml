source:
  basis: "Dễ nhầm với viêm màng não (sốt cao, quấy khóc, nôn ở trẻ nhỏ). Không cứng gáy, không li bì, không co giật, không ban xuất huyết (NICE NG240). Viêm tai kèm sốt rất cao hoặc nôn cần khám gấp trong ngày (NHS Ear infections); sốt từ 39°C là tiêu chí dùng kháng sinh (MSD)."
