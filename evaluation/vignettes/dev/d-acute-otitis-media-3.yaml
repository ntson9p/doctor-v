title_vi: "Bé gái 28 tháng sốt 39,6°C, đau tai, nôn 1 lần, quấy khóc"
narrative_vi: "Bé E., 28 tháng, ở Nha Trang, đã tiêm đủ 2 mũi vắc xin sởi. Bé sổ mũi vài ngày, từ hôm qua sốt cao 39,6°C, kêu đau tai, khóc nhiều, nôn 1 lần sau khi uống sữa. Bé vẫn uống nước được, cổ mềm, không li bì, không co giật, không phát ban."
