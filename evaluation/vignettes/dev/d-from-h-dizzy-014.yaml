source:
  basis: "Viêm dạ dày – ruột cấp (nghi ngộ độc thức ăn, người ăn cùng cũng bị) có mất nước mức vừa: khát, mắt trũng, môi khô, tiểu ít, choáng khi đứng dậy; vẫn tỉnh, uống được, không li bì, tay chân không lạnh. WHO (2005): khát, mắt trũng là dấu hiệu mất nước; mất nước có dấu hiệu (chưa nặng) thì bù nước bằng ORS dưới sự theo dõi của nhân viên y tế; đưa trẻ đến nhân viên y tế khi đi ngoài nhiều lần phân nước, nôn nhiều lần, rất khát. NHS Diarrhoea and vomiting: chưa có dấu hiệu cần gọi cấp cứu (li bì, lú lẫn, da tím tái, nôn ra máu, đau bụng dữ dội). Mức 3 (khám trong ngày)."
  references:
    - who-diarrhoea-2005
    - nhs-diarrhoea-vomiting
author: "agent:vignette-holdout"
notes_vi: "Bệnh đã có trong danh mục, nay thêm triệu chứng chính 'Chóng mặt'. Người nhà chọn 'Chóng mặt' vì bé kêu choáng mỗi khi đứng dậy."
