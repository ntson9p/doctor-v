id: d-from-h-dizzy-014
set: dev
title_vi: "Bé trai 8 tuổi nôn và tiêu chảy toàn nước từ tối qua sau ăn cỗ, đứng dậy là choáng, khát, mắt trũng, tiểu ít"
narrative_vi: "Bé Kh., trai, 8 tuổi, ở Tam Kỳ (Quảng Nam). Trưa qua cả nhà đi ăn cỗ đám cưới; từ tối qua bé nôn 4 lần, đi ngoài phân toàn nước 7–8 lần, đau quặn bụng từng cơn quanh rốn; em gái 5 tuổi của bé cũng bị tiêu chảy. Từ sáng nay bé uống được oresol từng ngụm nhỏ, không nôn thêm, nhưng vẫn đi ngoài phân lỏng. Bé kêu chóng mặt; mỗi lần đứng dậy đi vệ sinh là choáng, tối sầm mắt, phải ngồi xuống. Bé khát, đòi uống nước liên tục, môi khô, mắt trũng; từ sáng mới đi tiểu 1 lần, ít, nước tiểu sẫm màu. Mẹ đo nhiệt độ 37,8°C. Bé vẫn tỉnh, nói chuyện được, không li bì, không co giật, tay chân không lạnh, không khó thở. Phân không có máu, bụng không chướng."
