source:
  basis: "Trào ngược dạ dày – thực quản ở phụ nữ có yếu tố nguy cơ tim mạch, dễ nhầm với bệnh tim: nóng rát sau xương ức, ợ chua, nặng sau ăn no và khi nằm, ho khan về đêm, đã từng bị (VNAGE 2026; NHS Heartburn and acid reflux); đau sau bữa ăn có thể do dạ dày, thực quản hoặc cơn đau thắt ngực, đau sau gắng sức thường do bệnh mạch vành (4235/QĐ-BYT). Không đau khi gắng sức, không có dấu hiệu nguy hiểm. NHS Chest pain: đau ngực lúc có lúc không thì khám bác sĩ gia đình: mức 4."
