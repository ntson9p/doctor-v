id: d-gerd-3
set: dev
title_vi: "Nữ 52 tuổi tăng huyết áp, nóng rát sau xương ức về đêm, sau bữa tối no, sợ bị bệnh tim"
narrative_vi: "Bà T., 52 tuổi, ở Quảng Ngãi, bị tăng huyết áp, đã mãn kinh. Hai tuần nay hay thấy nóng rát sau xương ức, ợ chua lên miệng, nhất là sau bữa tối no và khi nằm xuống đi ngủ; mỗi lần kéo dài vài phút đến hơn nửa giờ, ngồi dậy uống nước thì đỡ. Mấy năm trước cũng từng bị như vậy. Bà sợ bị bệnh tim. Đi chợ, leo cầu thang không thấy đau. Không phải tức nặng ở ngực, không lan ra tay, hàm, lưng, không vã mồ hôi, không khó thở, không buồn nôn, không choáng. Hít sâu không đau hơn, ấn vào ngực không đau. Thỉnh thoảng ho khan về đêm. Không sốt. Không nuốt vướng, không sụt cân, không đi ngoài phân đen. Không hút thuốc, không đái tháo đường."
