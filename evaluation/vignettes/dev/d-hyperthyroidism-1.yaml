  basis: "Bệnh Basedow điển hình: nhịp tim nhanh thường xuyên 100–140, sợ nóng, ra nhiều mồ hôi, ăn nhiều mà gầy sút, run tay, bướu giáp (3879/QĐ-BYT bài Bệnh Basedow; NHS Overactive thyroid). Không có dấu hiệu cơn bão giáp; NHS: khám bác sĩ gia đình để xét nghiệm máu."
