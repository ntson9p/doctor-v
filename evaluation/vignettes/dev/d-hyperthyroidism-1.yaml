title_vi: "Nữ 32 tuổi hai tháng nay tim đập nhanh liên tục, sợ nóng, sụt cân dù ăn nhiều, run tay"
narrative_vi: "Chị Q., 32 tuổi, hai tháng nay lúc nào cũng thấy tim đập nhanh, cả khi ngồi nghỉ; đo máy huyết áp thấy mạch khoảng 115. Chị sợ nóng, ra nhiều mồ hôi, ăn nhiều nhưng sụt 5 kg, run tay, khó ngủ, hay cáu gắt. Người nhà thấy cổ chị to ra. Không đau ngực, không khó thở, không ngất. Không có thai, không chậm kinh."
