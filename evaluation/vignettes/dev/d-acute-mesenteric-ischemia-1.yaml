id: d-acute-mesenteric-ischemia-1
set: dev
title_vi: Nữ 78 tuổi rung nhĩ, đột ngột đau bụng dữ dội quanh rốn, nôn, đi ngoài phân lỏng
narrative_vi: Bà N., 78 tuổi, bị rung nhĩ và tăng huyết áp, hay quên uống thuốc chống đông. Ba giờ trước đột ngột đau bụng dữ dội quanh rốn, đau liên tục, không lan ra lưng. Bà nôn 2 lần, đi ngoài phân lỏng 3 lần, không có máu. Ấn bụng thấy mềm. Không sốt, không ngất, không đau ngực, không khó thở, không lú lẫn.
