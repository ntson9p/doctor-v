source:
  basis: "Tắc mạch mạc treo do cục máu đông ở người rung nhĩ: đau bụng dữ dội đột ngột không tương xứng với khám (bụng mềm), nôn, tiêu chảy (WSES 2022: gần 50% có rung nhĩ; buồn nôn 44%, nôn 35%, tiêu chảy 35%). WSES: phải coi là thiếu máu mạc treo cho tới khi loại trừ, cứ chậm 6 giờ tử vong tăng gấp đôi; mức 1 như bệnh phụ thuộc thời gian."
