source:
  basis: "Hội chứng mạch vành cấp không đau ngực biểu hiện bằng ngất khi gắng sức ở người già, đái tháo đường (Canto 2000: 33% không đau ngực, già hơn, nhiều đái tháo đường; 2187/QĐ-BYT: triệu chứng không điển hình, có cơn ngất thì chuyển viện ngay). ESC 2018 bảng 6: ngất khi gắng sức, kèm khó thở mới là nguy cơ cao; quy tắc rf_syncope_breathing (mức 1). Chấp nhận rối loạn nhịp tim (ngất khi gắng sức do loạn nhịp thất trong thiếu máu cơ tim)."
  references: [canto-jama-2000, byt-qd-2187-2019, esc-syncope-2018, msd-acute-mi]
