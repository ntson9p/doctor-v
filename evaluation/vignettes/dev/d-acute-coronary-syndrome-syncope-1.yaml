id: d-acute-coronary-syndrome-syncope-1
set: dev
title_vi: "Nam 66 tuổi đái tháo đường ngất khi đang leo cầu thang, sau đó buồn nôn, vã mồ hôi, hơi khó thở"
narrative_vi: "Ông P., 66 tuổi, đái tháo đường, tăng huyết áp, hút thuốc. Chiều nay đang leo cầu thang thì đột ngột ngất, không thấy báo trước, khoảng nửa phút sau tỉnh lại. Từ đó ông buồn nôn, vã mồ hôi lạnh, hơi khó thở, mệt. Không đau ngực, không hồi hộp, không đau đầu, không đau bụng. Không đi ngoài phân đen. Chưa đo mạch."
