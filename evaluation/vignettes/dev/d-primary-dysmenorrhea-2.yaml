title_vi: "Nữ 14 tuổi, đau quặn quanh rốn trước kỳ kinh 1 ngày, buồn nôn, đi ngoài phân lỏng"
narrative_vi: "Em A., 14 tuổi, có kinh lần đầu năm 12 tuổi. Từ chiều qua, trước ngày có kinh 1 ngày, đau quặn vùng quanh rốn và bụng dưới, buồn nôn, đi ngoài phân lỏng 3 lần, hơi nhức đầu. Không sốt, không nôn, không ai ăn cùng bị đau bụng."
