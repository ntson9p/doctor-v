source:
  basis: "Ung thư phổi ở phụ nữ chưa từng hút thuốc (15–20% người bệnh, MSD): ho kéo dài, khó thở tăng dần, sụt cân, mệt; NICE NG12 mục 1.1.2: người từ 40 tuổi có từ 2 triệu chứng này cần chụp phim phổi khẩn. NHS Lung cancer: ho quá 3 tuần hoặc có triệu chứng khác thì khám bác sĩ gia đình (không khẩn)."
