title_vi: "Nữ 58 tuổi không hút thuốc, ho khan hơn 2 tháng, hụt hơi tăng dần, sụt cân"
narrative_vi: "Bà H., 58 tuổi, giáo viên về hưu ở TP.HCM, chưa từng hút thuốc, không đun bếp củi. Hơn 2 tháng nay ho khan dai dẳng, vài tuần nay hụt hơi khi leo cầu thang, tăng dần, ngồi nghỉ thì bình thường. Người mệt, sụt 4 kg không rõ lý do. Không sốt, không ra mồ hôi đêm, không ho ra máu, không đau ngực, không khò khè, không phù chân. Không ai quanh mình bị lao. Đã mãn kinh, không có thai."
