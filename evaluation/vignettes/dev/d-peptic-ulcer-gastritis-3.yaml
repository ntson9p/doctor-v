source:
  basis: "Uống nhiều rượu và đau thượng vị dễ gợi ý viêm tụy cấp, nhưng đau kéo dài nhiều tuần, đỡ khi ăn, không lan ra lưng, không dữ dội, không nôn (ACG 2024: đau viêm tụy liên tục, thường dữ dội, lan ra lưng); kiểu đau phù hợp viêm, loét dạ dày (MSD). Không có dấu hiệu báo động: khám trong vài ngày (NHS)."
