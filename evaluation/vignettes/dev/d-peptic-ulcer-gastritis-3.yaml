title_vi: "Nam 42 tuổi, uống rượu hằng ngày, 3 tuần đau rát vùng trên rốn lúc đói (dễ nhầm viêm tụy)"
narrative_vi: "Anh D., 42 tuổi, uống rượu gần như hằng ngày. Ba tuần nay đau rát vùng trên rốn, đau tăng lúc đói, ăn vào đỡ, hay ợ chua; hôm qua sau bữa nhậu đau nhiều hơn, buồn nôn. Đau không lan ra sau lưng, không dữ dội. Không nôn, không sốt, không vàng da, không tiêu chảy, không đi ngoài phân đen."
