title_vi: "Nữ 60 tuổi, từng mổ bụng, đau quặn quanh rốn, nôn dịch xanh, bụng chướng, không xì hơi"
narrative_vi: "Bà N., 60 tuổi, từng mổ đẻ và mổ ruột thừa. Từ hôm qua đau quặn từng cơn quanh rốn, buồn nôn, nôn nhiều lần ra dịch xanh, uống gì cũng nôn, bụng chướng căng; từ sáng không đi ngoài và không xì hơi được. Không sốt, không tiêu chảy. Đã mãn kinh, không ra máu âm đạo."
