  basis: "Ca điển hình tắc ruột non do dính: đau quặn từng cơn, nôn, chướng bụng, bí trung đại tiện ở người từng mổ bụng (WSES 2018; AAFP 2011). Tắc ruột non là cấp cứu ngoại khoa (WSES); NHS: đau bụng kèm không đi ngoài, không xì hơi được thì gọi 999 hoặc đến cấp cứu."
