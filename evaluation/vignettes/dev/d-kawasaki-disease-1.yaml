title_vi: "Bé trai 2 tuổi, sốt cao 6 ngày, mắt đỏ, môi đỏ nứt, phát ban, sưng đỏ tay chân, nổi hạch cổ"
narrative_vi: "Bé A., 2 tuổi, ở Hà Nội. Bé sốt cao 39,5–40°C liên tục 6 ngày, uống thuốc hạ sốt chỉ đỡ ít. Hai mắt bé đỏ nhưng không có ghèn, môi đỏ sẫm, khô nứt, lưỡi đỏ như quả dâu tây. Người nổi ban đỏ ở ngực, bụng. Mu bàn tay, bàn chân sưng phù, lòng bàn tay đỏ. Cổ bên phải có một hạch to. Bé quấy khóc nhiều nhưng vẫn uống được, không li bì. Không ho, không sổ mũi, không có phỏng nước ở tay chân hay loét miệng. Bé đã tiêm đủ 2 mũi vắc xin sởi."
