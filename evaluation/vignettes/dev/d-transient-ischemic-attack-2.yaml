source:
  basis: "Ca không điển hình: cơn thiếu máu thoáng qua tuần hoàn sau chỉ có chóng mặt đơn độc, kiểu hay gặp nhất trong những ngày trước đột quỵ tuần hoàn sau (Paul 2013), không đủ tiêu chuẩn kinh điển. GRACE-3: cơn chóng mặt tự phát cần nghĩ cơn thiếu máu não thoáng qua; rung nhĩ là nguồn huyết khối (NHS TIA). 3312/QĐ-BYT: nguy cơ tái phát sớm rất cao, điều trị ngay; nên đến cơ sở cấp cứu."
  references: [paul-lancetneurol-2013, grace3-dizziness-2023, nhs-tia, byt-qd-3312-2024, lempert-jvestibres-2022]
author: "agent:pass-c"
notes_vi: "Ca khó: không có triệu chứng nào trong câu hỏi 'yếu, tê nửa người, nói khó rồi tự hết'; mức xử trí phải dựa vào xác suất và ngưỡng 'không được bỏ sót'."
