id: d-transient-ischemic-attack-2
set: dev
title_vi: "Nữ 72 tuổi, rung nhĩ, 3 ngày nay 2 cơn quay cuồng tự phát khoảng 10 phút, không triệu chứng khác"
narrative_vi: "Bà G., 72 tuổi, bị rung nhĩ và tăng huyết áp. Ba ngày nay có 2 cơn đang ngồi yên bỗng thấy mọi vật quay tròn, mỗi cơn khoảng 10 phút rồi tự hết; không do trở mình hay ngửa cổ. Trong cơn không yếu tê tay chân, không nói khó, không nhìn đôi, không méo miệng. Hiện đã hết, đi lại bình thường. Không đau đầu, không buồn nôn, không ù tai, không ngất. Không sốt."
