title_vi: Nam 24 tuổi tiểu đường tiêm insulin, khát nhiều, nôn, đau bụng, thở sâu, hơi thở mùi lạ
narrative_vi: Anh C., 24 tuổi, bị tiểu đường từ năm 15 tuổi, tiêm insulin. Ba ngày nay bị cảm, ăn kém nên tự bỏ vài mũi insulin. Từ hôm qua khát nước nhiều, đi tiểu nhiều, mệt lả người, buồn nôn, nôn 4 lần, đau bụng khắp bụng. Người nhà thấy anh thở sâu, nhanh và hơi thở có mùi như trái cây chín. Máy đo đường huyết báo "HI". Anh vẫn tỉnh táo. Không tiêu chảy, không sốt.
