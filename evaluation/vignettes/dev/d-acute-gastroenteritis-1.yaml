source:
  basis: "Ca điển hình: tiêu chảy, nôn, đau quặn bụng sau bữa ăn chung, người ăn cùng cũng bị (5642/QĐ-BYT, bài Bệnh tiêu chảy do vi khuẩn; CDC). Không có dấu hiệu cần đi khám của CDC và NHS (sốt dưới 38,9°C, giữ được nước, không có máu), nên tự chăm sóc tại nhà bằng uống nhiều nước, dung dịch bù nước (NHS, WHO 2005)."
