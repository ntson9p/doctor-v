title_vi: "Nam 28 tuổi, đau quặn quanh rốn, tiêu chảy, nôn sau bữa cỗ, người ăn cùng cũng bị"
narrative_vi: "Anh H., 28 tuổi, ở TP.HCM. Tối qua ăn cỗ, từ sáng nay đau quặn quanh rốn, đi ngoài phân lỏng 5 lần, nôn 2 lần, buồn nôn, chán ăn, hơi sốt 37,8°C. Hai người ăn cùng cũng bị tiêu chảy. Ăn vào là đau quặn, mót đi ngoài. Vẫn uống được nước, đi tiểu bình thường. Đau không dữ dội, không tăng khi đi lại, không chuyển xuống bụng dưới bên phải."
