id: d-testicular-torsion-3
set: dev
title_vi: Nam 15 tuổi đau bụng dưới bên phải, nôn, đau lan xuống bìu (dễ nhầm viêm ruột thừa)
narrative_vi: Em Đ., 15 tuổi, 8 giờ nay đau bụng dưới bên phải, nôn 2 lần, chán ăn. Bố mẹ nghĩ viêm ruột thừa. Khi được hỏi, em nói đau lan xuống bìu phải và bìu phải đau khi chạm. Đau không bắt đầu từ quanh rốn, không sốt, không tiêu chảy, không tiểu buốt, không dữ dội.
