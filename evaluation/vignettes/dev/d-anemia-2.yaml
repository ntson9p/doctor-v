source:
  basis: "Ca không điển hình: nam cao tuổi, không có kinh nguyệt nhiều, thiếu máu do bệnh thận mạn (nguyên nhân quan trọng ở người cao tuổi, GBD 2021); triệu chứng thiếu oxy mô: mệt, chóng mặt, khó thở khi gắng sức (1832/QĐ-BYT; MSD). Không có dấu hiệu chảy máu hay dấu hiệu nặng: khám trong vài ngày để xét nghiệm máu và tìm nguyên nhân (NHS)."
