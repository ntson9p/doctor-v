title_vi: "Nam 74 tuổi, đã biết thiếu máu, vài tuần nay choáng váng âm ỉ, mệt, hụt hơi khi đi bộ"
narrative_vi: "Ông C., 74 tuổi, bị bệnh thận mạn, đã được bác sĩ nói là thiếu máu từ năm ngoái nhưng không tái khám. Vài tuần nay choáng váng âm ỉ gần như cả ngày, mệt nhiều, đi bộ một đoạn ngắn là hụt hơi. Không thấy quay, không ngất, không đau ngực, không khó thở khi ngồi nghỉ. Không đi ngoài phân đen, không nôn ra máu, không sụt cân. Không tự biết da có xanh không. Không đau đầu, không yếu tê tay chân. Không tăng huyết áp, không đái tháo đường."
