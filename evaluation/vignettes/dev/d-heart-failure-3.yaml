id: d-heart-failure-3
set: dev
title_vi: "Nam 68 tuổi từng hút thuốc, khó thở 5 ngày, khò khè, ho, phù hai chân, dễ nhầm đợt cấp bệnh phổi"
narrative_vi: "Ông H., 68 tuổi, ở Thái Bình, hút thuốc lá 30 năm, bỏ được 5 năm; chưa từng được nói bị bệnh phổi tắc nghẽn mạn tính hay hen. Ông bị tăng huyết áp, rung nhĩ. Năm ngày nay ông khó thở tăng dần, đi lại là hụt hơi, đêm phải kê cao gối, nghe khò khè trong ngực, ho khan về đêm. Hai cẳng chân phù. Không sốt, không khạc đờm vàng, không đau ngực, không ho ra máu. Ngồi nghỉ vẫn nói được trọn câu. Chưa đo SpO2."
