source:
  basis: "Đợt nặng lên của suy tim ở người có tăng huyết áp, rung nhĩ: khó thở tăng dần, khó thở khi nằm, phù hai chân; khò khè do phù phổi ('hen tim'; 1857/QĐ-BYT Bảng 3: thở rít là triệu chứng ít điển hình; MSD). Dễ nhầm với đợt cấp bệnh phổi tắc nghẽn mạn tính ở người từng hút thuốc, nhưng chưa có chẩn đoán bệnh phổi và có phù hai chân, khó thở khi nằm. NHS Heart failure: khám khẩn (mức 3)."
  references: [byt-qd-1857-2022, msd-acute-heart-failure, nhs-heart-failure, wang-jama-2005]
author: "agent:pass-c"
notes_vi: "Ca dễ nhầm với đợt cấp bệnh phổi tắc nghẽn mạn tính, hen (lô 3, phần a)."
