title_vi: "Nam 80 tuổi, đái tháo đường, sốt 2 ngày, mệt, chán ăn, nôn, tức nhẹ dưới sườn phải"
narrative_vi: "Ông T., 80 tuổi, bị đái tháo đường. Hai ngày nay sốt 38,2°C, mệt, chán ăn, buồn nôn, nôn 2 lần. Hỏi kỹ thì có tức âm ỉ dưới sườn phải, không lan, không dữ dội. Không ho, không khó thở, không đau khi đi tiểu, không đau hông lưng, không tiêu chảy, không vàng da, không rét run, vẫn tỉnh táo."
