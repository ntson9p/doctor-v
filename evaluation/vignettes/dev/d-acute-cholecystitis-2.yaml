source:
  basis: "Ca không điển hình ở người già: triệu chứng toàn thân (chán ăn, nôn, mệt, sốt) nổi bật hơn đau (MSD). Viêm túi mật cấp cần nhập viện; người từ 65 tuổi được lợi khi mổ (Gallaher 2022), nên cần đến cơ sở cấp cứu."
  references: [msd-acute-cholecystitis, gallaher-jama-2022]
author: "agent:pass-c"
notes_vi: "Ca không điển hình: người từ 75 tuổi, triệu chứng chính người nhà chọn là \"Sốt\"."
