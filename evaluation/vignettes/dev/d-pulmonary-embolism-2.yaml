source:
  basis: "Ca không điển hình (người rất cao tuổi, chỉ hồi hộp và khó thở nhẹ, không đau ngực): ESC 2019: khó thở có thể nhẹ, nhịp nhanh xoang có thể là bất thường duy nhất; thay khớp háng là yếu tố thuận lợi mạnh, huyết khối tăng mạnh theo tuổi. NHS: khó thở đột ngột, tim đập rất nhanh thì gọi 999 hoặc đến cấp cứu; doctor-v xếp thuyên tắc phổi mức 1."
