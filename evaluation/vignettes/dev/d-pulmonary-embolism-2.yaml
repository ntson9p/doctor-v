title_vi: "Nữ 80 tuổi hai tuần sau mổ thay khớp háng, tim đập nhanh, hụt hơi nhẹ, không đau ngực"
narrative_vi: "Bà G., 80 tuổi, hai tuần trước mổ thay khớp háng, từ đó nằm nhiều. Từ sáng bà thấy tim đập nhanh, hơi khó thở, đi vài bước đã hụt hơi; chân phải hơi sưng. Không đau ngực, không ho ra máu, không ngất, không choáng như sắp ngất. Không run tay, không sụt cân. Chưa đo mạch."
