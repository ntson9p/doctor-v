  basis: "Dễ nhầm với sốt xuất huyết Dengue (sốt phát ban trong mùa mưa, có ca sốt xuất huyết gần nhà). Viêm long đường hô hấp, viêm kết mạc và ban mọc từ mặt lan xuống, mất khi căng da là sởi (1019/QĐ-BYT mục 2.1.1, 2.5). Sởi không biến chứng cần khám trong 24 giờ (mục 3.2.1)."
