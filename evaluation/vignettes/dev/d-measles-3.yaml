title_vi: "Bé gái 9 tuổi mới tiêm 1 mũi sởi, mùa mưa, sốt ngày 4 kèm phát ban"
narrative_vi: "Bé A., 9 tuổi, ở Bình Dương, mới tiêm 1 mũi vắc xin sởi. Tháng 7, nhà bên cạnh có người bị sốt xuất huyết. Bé sốt 39°C đã 4 ngày, ho, chảy mũi, đỏ mắt; hôm nay nổi ban đỏ từ mặt lan xuống thân, ấn vào ban thì mất màu. Không chảy máu chân răng, không đau bụng, không nôn, không đau nhức người."
