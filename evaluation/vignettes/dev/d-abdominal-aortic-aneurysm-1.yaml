title_vi: Nam 72 tuổi hút thuốc, đột ngột đau dữ dội quanh rốn lan ra sau lưng, vã mồ hôi, choáng
narrative_vi: Ông T., 72 tuổi, hút thuốc lá 40 năm, bị tăng huyết áp. Một giờ trước đang ngồi thì đột ngột đau dữ dội quanh rốn, lan ra sau lưng, đau liên tục. Ông vã mồ hôi lạnh, buồn nôn, đứng dậy thì choáng muốn ngất, da tái, tay chân lạnh. Không sốt, không nôn, không tiêu chảy, không tiểu buốt, không đau ngực, không khó thở. Chưa ai nói ông có phình động mạch chủ.
