source:
  basis: "Vỡ phình động mạch chủ bụng điển hình: nam cao tuổi hút thuốc, tăng huyết áp, đau bụng lan ra lưng đột ngột, dữ dội, kèm vã mồ hôi, choáng, da tái lạnh (Fernando 2022; van den Dries 2025). NHS: đau bụng hoặc lưng đột ngột dữ dội, da tái, mất ý thức thì gọi 999 (mức 1)."
