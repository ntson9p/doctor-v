id: d-copd-exacerbation-1
set: dev
title_vi: "Nam 67 tuổi hút thuốc, bị phổi tắc nghẽn, 3 ngày khó thở tăng, đờm vàng nhiều sau cảm lạnh"
narrative_vi: "Ông B., 67 tuổi, ở Thái Bình, hút thuốc lào 40 năm, được chẩn đoán bệnh phổi tắc nghẽn mạn tính 5 năm nay, ho khạc đờm buổi sáng nhiều năm. Ba ngày nay sau khi bị cảm lạnh, khó thở tăng rõ, đi lại trong nhà đã thấy mệt, ho nhiều hơn, đờm vàng đặc, khò khè. Ngồi nghỉ thì đỡ, nói được cả câu. Đã xịt thuốc giãn phế quản, đỡ một phần. Không sốt, không đau ngực, không phù chân, nằm được đầu thấp. Năm ngoái có một đợt tương tự phải đi viện. Vợ ông đun bếp củi."
