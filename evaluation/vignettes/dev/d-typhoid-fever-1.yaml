narrative_vi: "Anh V., 19 tuổi, sinh viên ở An Giang, hay ăn hàng rong. Chín ngày nay sốt, lúc đầu nhẹ rồi tăng dần, nay 39,5°C liên tục. Đau đầu, mệt nhiều, chán ăn, đau bụng âm ỉ khắp bụng, mấy ngày nay đi ngoài phân lỏng 3–4 lần mỗi ngày. Không ho, không sổ mũi, không đau họng, không nổi ban, không nôn. Tỉnh táo. Không đi rừng, không làm rẫy."
