source:
  basis: "Đợt mất bù của suy tim ở người có bệnh mạch vành, tăng huyết áp, bỏ thuốc: khó thở khi gắng sức, khó thở khi nằm, phù mắt cá chân, tăng cân trên 2 kg (1857/QĐ-BYT Bảng 3, Phần III mục 3). NHS Heart failure: khó thở khi nằm, tăng cân đột ngột thì khám khẩn hoặc gọi 111 (mức 3); chưa có dấu hiệu gọi 999 (khó thở dữ dội, tím, ngất)."
