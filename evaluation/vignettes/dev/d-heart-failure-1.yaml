id: d-heart-failure-1
set: dev
title_vi: "Nam 72 tuổi từng nhồi máu cơ tim, khó thở tăng dần 1 tuần, nằm phải kê cao gối, phù hai chân"
narrative_vi: "Ông T., 72 tuổi, ở Bình Định, bị tăng huyết áp và từng nhồi máu cơ tim cách đây 3 năm. Một tuần nay ông khó thở tăng dần: đi vài bước hay leo cầu thang là hụt hơi, đêm nằm phải kê hai gối, có đêm phải ngồi dậy mới thở được. Hai cổ chân, bàn chân phù, ấn lõm. Năm ngày nay ông tăng 3 kg. Ông mệt, ăn kém. Ngồi nghỉ thì thở được, nói trọn câu. Không sốt, không ho, không đau ngực, không hồi hộp, không ngất. Tuần trước ông hết thuốc huyết áp, chưa mua lại. Chưa đo SpO2."
