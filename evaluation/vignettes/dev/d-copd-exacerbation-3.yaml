id: d-copd-exacerbation-3
set: dev
title_vi: "Nữ 63 tuổi bị phổi tắc nghẽn, 3 ngày ho đờm mủ, khó thở tăng, sốt nhẹ, dễ nhầm viêm phổi"
narrative_vi: "Bà G., 63 tuổi, ở Quảng Nam, đun bếp rơm, củi nhiều năm, được chẩn đoán bệnh phổi tắc nghẽn mạn tính 3 năm nay, không hút thuốc. Bốn ngày trước sổ mũi; ba ngày nay ho nhiều, đờm vàng xanh, khò khè, khó thở tăng khi đi lại, nhiệt độ 37,7°C trong 2 ngày. Ngồi nghỉ thì đỡ, nói được cả câu. Không rét run, không đau ngực khi thở, không phù chân. Xịt thuốc cắt cơn thì đỡ một phần. Năm trước có một đợt giống vậy. Bác sĩ khám sau đó: phim phổi không có tổn thương viêm phổi."
