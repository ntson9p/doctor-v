  basis: "Đợt cấp bệnh phổi tắc nghẽn mạn tính do nhiễm vi rút, có sốt nhẹ (2767/QĐ-BYT mục 3.3.1: sốt có thể có; McManus 2008: sốt 28%), dễ nhầm với viêm phổi; không có dấu hiệu nặng nên khám trong 24 giờ (2767 Bảng 3.2)."
