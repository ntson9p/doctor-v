source:
  basis: "Ca không điển hình: trẻ nhỏ có thể chỉ li bì, xanh tái từng lúc (Bines 2006; Park 2021: li bì 25,9% ở trẻ dưới 1 tuổi), không rõ cơn khóc. Phân nhầy máu như mứt dâu ở trẻ nhỏ cần nghĩ lồng ruột và khám cấp cứu (3312/QĐ-BYT, bài Xuất huyết tiêu hóa; WHO 2002)."
  references: [bines-bwho-2006, park-frontpediatr-2021, byt-qd-3312-2015, who-intussusception-2002]
author: "agent:pass-c"
notes_vi: "Ca không điển hình: thiếu cơn khóc thét."
