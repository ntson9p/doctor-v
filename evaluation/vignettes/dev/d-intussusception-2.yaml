id: d-intussusception-2
set: dev
title_vi: "Bé gái 5 tháng, lừ đừ, nôn, tái từng lúc, đi ngoài phân nhầy máu như mứt dâu"
narrative_vi: "Bé H., 5 tháng tuổi (gái). Từ sáng bé lừ đừ hơn, bú kém hơn, nôn 2 lần, mặt tái từng lúc; chiều nay đi ngoài phân nhầy lẫn máu đỏ sẫm như mứt dâu. Mẹ không thấy bé khóc thét từng cơn rõ. Không sốt, không tiêu chảy. Bé vẫn bú được, gọi vẫn tỉnh."
