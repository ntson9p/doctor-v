narrative_vi: "Chị H., 24 tuổi, sống ở TP.HCM. Ba ngày nay sốt cao đột ngột, đo được 39,5°C, đau đầu nhiều, đau nhức sau hốc mắt, đau mỏi người, mệt, chán ăn, hơi buồn nôn. Không ho, không sổ mũi, không đau họng, không đau bụng, không nôn, không tiêu chảy. Chưa thấy nổi ban hay chảy máu. Hàng xóm vừa bị sốt xuất huyết tuần trước. Không đi rừng, không làm rẫy."
