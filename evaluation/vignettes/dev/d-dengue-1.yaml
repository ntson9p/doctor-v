  basis: "Ca điển hình giai đoạn sốt theo 2760/QĐ-BYT mục II.1.1 (sốt cao đột ngột, nhức đầu, chán ăn, buồn nôn, đau cơ, nhức hai hố mắt) và Phụ lục 2 (sống ở vùng có dịch, sốt không quá 7 ngày). Chưa có dấu hiệu cảnh báo nên điều trị ngoại trú, khám và xét nghiệm lại hằng ngày (mục IV.A): đi khám trong 24 giờ."
