source:
  basis: "Sốt kèm rét run dữ dội sau ngủ lán trong rừng ở Khánh Hòa (vùng còn lây truyền) là ca nghi sốt rét (3377 mục II.1). Dễ nhầm với nhiễm khuẩn huyết và viêm thận – bể thận (sốt cao rét run, nôn) và với sốt mò (cùng phơi nhiễm). Chưa có dấu hiệu ác tính: xét nghiệm trong ngày."
