title_vi: "Nam 58 tuổi ở Khánh Hòa, sốt 2 ngày, rét run dữ dội, nôn, đau mỏi"
narrative_vi: "Ông P., 58 tuổi, ở Khánh Hòa, làm rẫy và ngủ lại lán trong rừng hai tuần trước. Hai ngày nay rét run dữ dội rồi sốt cao 40°C, vã mồ hôi, đau đầu, đau mỏi người, buồn nôn, nôn 2 lần, mệt. Không đau hông lưng, không tiểu buốt, không ho, không đau bụng, không tiêu chảy. Không vàng da, không lú lẫn, vẫn tự đi lại được. Không có vết loét đóng vảy đen."
