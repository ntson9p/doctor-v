source:
  basis: "Ca điển hình: người dùng insulin và thuốc hạ đường huyết, bỏ bữa, có triệu chứng cường giao cảm (run, vã mồ hôi, tim nhanh, đói), glucose dưới 3,9 mmol/L, còn tỉnh (5481/QĐ-BYT phần 6 và phần thuốc insulin; NHS Low blood sugar). Người tỉnh tự ăn uống đồ ngọt, thử lại sau 15 phút; nên khám trong 24 giờ để xem lại thuốc (quy tắc rf_hypoglycemia_suspected, mức 3)."
  references: [byt-qd-5481-2020, nhs-hypoglycaemia, bonds-bmcendocrdisord-2012]
