id: d-hypoglycemia-1
set: dev
title_vi: "Nam 62 tuổi, đái tháo đường tiêm insulin, bỏ bữa trưa, chóng mặt, run tay, vã mồ hôi, đường huyết 3,1"
narrative_vi: "Ông B., 62 tuổi, đái tháo đường típ 2, tiêm insulin và uống thuốc hạ đường huyết. Hôm nay bận việc nên bỏ bữa trưa. Khoảng nửa giờ nay thấy chóng mặt, hoa mắt, run tay, vã mồ hôi lạnh, tim đập nhanh, đói cồn cào. Đo đường huyết bằng máy ở nhà được 3,1 mmol/L. Chưa ăn gì. Vẫn tỉnh táo, nói chuyện bình thường. Không thấy quay, không đau đầu, không yếu tê, không ngất. Không tăng huyết áp, không bệnh tim."
