title_vi: "Nam 40 tuổi chọn Ho: ho đờm 4 ngày, sốt 39°C, rét run, đau ngực khi hít sâu, hụt hơi khi đi lại"
narrative_vi: "Anh N., 40 tuổi, ở Huế, không hút thuốc. Bốn ngày nay ho nhiều, khạc đờm vàng đặc; ba ngày nay sốt cao 39,2°C, rét run. Đau nhói ngực bên phải khi hít sâu và khi ho, mấy ngày nay chưa hết. Đi lại thấy hụt hơi, ngồi nghỉ thì đỡ, nói được cả câu. Không sổ mũi, không đau họng. Tỉnh táo. Không có bệnh nền. Tự xét nghiệm COVID-19 âm tính."
