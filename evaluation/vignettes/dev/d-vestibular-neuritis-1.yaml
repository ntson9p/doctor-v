source:
  basis: "Ca điển hình theo tiêu chuẩn Bárány (Strupp 2022): chóng mặt quay liên tục khởi phát cấp trên 24 giờ, buồn nôn, nôn, mất thăng bằng ngã về một bên, không triệu chứng thần kinh trung ương hay triệu chứng tai; sau nhiễm vi rút (Bae 2022; NHS). Người trẻ không có yếu tố nguy cơ mạch máu: NHS Vertigo khuyên khám khẩn khi nôn, rất buồn nôn; GRACE-3 cần người được đào tạo khám để loại trừ đột quỵ: khám trong 24 giờ."
