id: d-vestibular-neuritis-1
set: dev
title_vi: "Nam 42 tuổi, sau cảm 10 ngày, quay cuồng liên tục từ hôm qua, nôn, đi loạng choạng"
narrative_vi: "Anh K., 42 tuổi, khỏe mạnh. Mười ngày trước bị cảm, sổ mũi. Sáng hôm qua thức dậy thấy mọi vật quay tròn liên tục, cử động đầu thì nặng hơn, nôn nhiều lần hôm qua; hôm nay còn buồn nôn nhưng uống được nước. Đi lại loạng choạng, hay xiêu về bên trái nhưng vẫn tự đi được. Không ù tai, không nghe kém, không đau đầu, không nhìn đôi, không nói khó, không yếu tê tay chân. Không sốt. Chưa từng bị như vậy. Không tăng huyết áp, không đái tháo đường."
