title_vi: "Nữ 78 tuổi, đái tháo đường, sốt vừa, mệt, nôn, tiểu ít, không tiểu buốt"
narrative_vi: "Bà G., 78 tuổi, ở Huế, bị đái tháo đường. Hai ngày nay sốt 38,5°C, mệt, chán ăn, buồn nôn, nôn 1 lần, đi tiểu nhiều lần hơn nhưng không buốt, tức bụng dưới. Từ sáng đến giờ tiểu ít. Không kêu đau lưng. Vẫn tỉnh táo, nói chuyện bình thường, tự đi lại được. Không ho, không tiêu chảy."
