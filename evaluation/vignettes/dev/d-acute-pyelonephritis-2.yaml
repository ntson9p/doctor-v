  basis: "Biểu hiện không điển hình ở người cao tuổi có đái tháo đường: không tiểu buốt, không đau hông lưng rõ, chỉ sốt, mệt, nôn, tiểu nhiều lần, tiểu ít (Chițu 2026; Scholes 2005: đái tháo đường là yếu tố nguy cơ). NHS Kidney infection: nôn, tiểu ít thì khám gấp trong ngày; chưa có lú lẫn, lơ mơ."
