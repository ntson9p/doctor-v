id: d-heat-stroke-1
set: dev
title_vi: "Nam 22 tuổi gục ngã khi chạy việt dã giữa trưa nắng, đến giờ vẫn lú lẫn, người rất nóng, thở nhanh"
narrative_vi: "Anh V., 22 tuổi, tân binh ở Bình Dương. Trưa nay đơn vị chạy việt dã 5 km dưới trời nắng gắt. Gần về đích anh đi loạng choạng rồi gục ngã. Đồng đội khiêng vào bóng râm đã hơn 15 phút mà anh vẫn chưa tỉnh táo hẳn, nói lảm nhảm, không biết mình đang ở đâu. Da anh rất nóng, đo nách 40,2°C, thở nhanh, tim đập nhanh. Không co giật. Trước đó anh khỏe mạnh, không có bệnh nền. Người dùng app là đồng đội."
