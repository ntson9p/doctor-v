source:
  basis: "Sốc nhiệt do gắng sức: gục ngã khi vận động nặng nơi nóng, lú lẫn kéo dài, thân nhiệt rất cao, thở nhanh, tim nhanh (MSD Heatstroke: thể gắng sức ở bộ đội, vận động viên; CDC NIOSH). NHS: 'Call 999 now' khi lú lẫn, mất ý thức, thân nhiệt rất cao; làm mát trong lúc chờ (mức 1)."
