source:
  basis: "Sốc nhiệt thể cổ điển: người cao tuổi, ít vận động, ở nơi nóng không thông gió trong đợt nắng nóng 2–3 ngày; thân nhiệt cao, da nóng khô, rối loạn tri giác (MSD Heatstroke; NHS: người cao tuổi dễ bị; 'Call 999 now' khi lú lẫn). Lú lẫn, li bì: gọi 115 (mức 1)."
  references: [msd-heatstroke, nhs-heat-exhaustion-heatstroke, who-bec-2018]
author: "agent:pass-c"
notes_vi: "Ca không điển hình: người cao tuổi, ở trong nhà, không gắng sức; nhiễm khuẩn huyết là chẩn đoán phân biệt cần loại trừ ở bệnh viện."
