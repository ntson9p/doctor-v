id: d-heat-stroke-2
set: dev
title_vi: "Bà 80 tuổi ở một mình trong phòng nóng ngột ngạt giữa đợt nắng nóng, người nóng ran, lơ mơ, nói lẫn lộn"
narrative_vi: "Bà G., 80 tuổi, sống một mình trong căn phòng mái tôn ở Hà Nội. Ba ngày nay nắng nóng gay gắt, phòng không có điều hòa, quạt hỏng. Chiều nay con gái đến thấy bà nằm trên giường, người nóng ran, da khô, gọi thì bà mở mắt nhưng nói lẫn lộn, không nhận ra con. Đo nách 39,8°C. Bà không ho, không khó thở, không nôn, không tiêu chảy, không kêu đau bụng, đi tiểu bình thường. Bà bị tăng huyết áp, đang uống thuốc. Không co giật. Người dùng app là con gái."
