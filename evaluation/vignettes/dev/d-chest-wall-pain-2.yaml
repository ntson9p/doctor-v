  basis: "Đau thành ngực ở thiếu niên: cơn nhói vài giây khi cử động, ấn vào đau; trẻ em đau ngực phần lớn do cơ xương hoặc không rõ nguyên nhân, nguyên nhân tim hiếm (Sallam 2026; Chun 2015). Đau ngực không rõ nguyên nhân nên được khám, không khẩn (NHS Costochondritis; NHS Chest pain): mức 4."
