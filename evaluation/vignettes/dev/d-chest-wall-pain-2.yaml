title_vi: "Nam 15 tuổi chơi bóng rổ, 2 tuần nay có cơn nhói ngực vài giây, ấn cạnh xương ức thấy đau"
narrative_vi: "Em B., nam, 15 tuổi, ở Hà Nội, chơi bóng rổ ở trường. Hai tuần nay thỉnh thoảng có cơn nhói ở ngực trái, mỗi cơn chỉ vài giây rồi hết, hay bị khi cúi người hoặc xoay người. Ấn vào cạnh xương ức bên trái thì đau nhói. Đau không xuất hiện khi chạy rồi đỡ khi nghỉ, không lan đi đâu. Không khó thở, không hồi hộp, không choáng, không ngất. Không sốt, không ho. Không nổi ban. Không hút thuốc. Bố mẹ khỏe, không ai đột tử."
