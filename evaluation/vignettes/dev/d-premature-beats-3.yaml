source:
  basis: "Dễ nhầm với rung nhĩ ở người lớn tuổi, nhưng kiểu hồi hộp là hẫng nhịp xen nhịp bình thường, từng cơn vài giây, mạch bình thường lúc có triệu chứng (EHRA 2011 bảng 2; Thavendiranathan 2009: cơn dưới 5 phút làm giảm khả năng rối loạn nhịp đáng kể). MSD: ngoại tâm thu ở người không có bệnh tim cấu trúc lành tính. NHS: khám bác sĩ gia đình (không khẩn) để đo điện tim."
  references: [raviele-europace-2011, thavendiranathan-jama-2009, msd-ventricular-premature-beats, nhs-heart-palpitations]
