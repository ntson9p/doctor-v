id: d-premature-beats-3
set: dev
title_vi: "Nam 62 tuổi tăng huyết áp lo bị rung nhĩ vì thấy tim hẫng nhịp, mạch đo 76"
narrative_vi: "Ông S., 62 tuổi, tăng huyết áp. Gần đây hay thấy tim hẫng một nhịp rồi đập thịch mạnh, có lúc vài nhịp liền như lộn xộn, mỗi lần chỉ vài giây. Hàng xóm bị rung nhĩ nên ông lo. Đo bằng máy huyết áp lúc đang thấy hẫng nhịp: mạch 76. Không tim nhanh kéo dài, không đau ngực, không khó thở, không choáng. Uống trà đặc buổi sáng. Không có bệnh tim đã biết."
