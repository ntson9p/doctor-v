title_vi: Nam 66 tuổi đã biết rung nhĩ, từ sáng tim đập nhanh, loạn nhịp, mạch 120
narrative_vi: Ông Z., 66 tuổi, được chẩn đoán rung nhĩ kịch phát 2 năm trước, thỉnh thoảng có cơn. Từ sáng nay thấy tim đập nhanh, lộn xộn, đến giờ vẫn còn, hơi mệt khi đi lại. Máy đo huyết áp báo mạch 120 lần/phút. Không đau ngực, không khó thở, không choáng, không ngất. Không uống cà phê hay rượu bia.
