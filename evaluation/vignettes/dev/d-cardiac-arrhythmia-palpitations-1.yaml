source:
  basis: "Cơn rung nhĩ ở người đã biết bệnh (Salbach 2025: khoảng 73% người đến cấp cứu vì rung nhĩ đã biết từ trước): hồi hộp không đều kéo dài, mạch 100–150, không có dấu hiệu nguy hiểm. NHS Atrial fibrillation: khám bác sĩ khẩn; gọi 999 hoặc đến cấp cứu khi kèm đau ngực, khó thở, ngất (không có). Mức 3."
