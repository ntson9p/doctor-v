source:
  basis: "Vỡ phình động mạch chủ bụng (không có trong danh mục) giống cơn đau quặn thận: nam 74 tuổi hút thuốc, tăng huyết áp, đột ngột đau dữ dội liên tục vùng hông lưng trái lan xuống bẹn, rồi ngất khi đứng dậy, sau đó da tái, vã mồ hôi lạnh, tay chân lạnh, không tự đứng được, huyết áp 85/50 mmHg, mạch 120 (sốc mất máu), điều mà cơn đau quặn thận không gây ra. ESC 2018: ngất kèm đau bụng mới xuất hiện, huyết áp tâm thu dưới 90 mmHg không rõ lý do là đặc điểm nguy cơ cao loại nặng; NHS Fainting: chưa hồi phục hẳn sau ngất thì gọi 999, nên mức 1."
  references:
    - esc-syncope-2018
    - nhs-fainting
author: "agent:vignette-holdout"
notes_vi: "Ngoài danh mục, ca cấp cứu khó: từng bị sỏi thận và đau lan xuống bẹn nên người nhà tưởng sỏi thận tái phát; ngất khi đứng dậy, có tiền triệu dễ bị coi là ngất tư thế. Huyết áp 85/50 mmHg nên câu huyết áp chọn 'Dưới 140/90 mmHg' (câu hỏi chưa có mức huyết áp thấp). Trang NHS Abdominal aortic aneurysm (chưa có trong danh mục nguồn) ghi: đau bụng hoặc lưng đột ngột dữ dội, da tái xám, mất ý thức thì gọi 999; người hay mắc là nam từ 65 tuổi, hút thuốc, tăng huyết áp."
