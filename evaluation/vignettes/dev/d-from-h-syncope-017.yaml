id: d-from-h-syncope-017
set: dev
title_vi: "Nam 74 tuổi hút thuốc lào, từng bị sỏi thận, đột ngột đau dữ dội hông lưng trái lan xuống bẹn rồi ngất; huyết áp 85/50"
narrative_vi: "Ông Th., 74 tuổi, ở Nam Định, hút thuốc lào hơn 50 năm, bị tăng huyết áp nhưng uống thuốc lúc nhớ lúc quên. Tám năm trước ông bị sỏi thận trái, đã tán sỏi. Khoảng 1 giờ trước, đang ngồi xem ti vi, ông đột ngột đau dữ dội vùng hông lưng trái, lan ra bụng dưới bên trái và xuống bẹn trái, đau liên tục không lúc nào dứt. Ông nghĩ sỏi thận tái phát nên uống viên giảm đau còn ở nhà. Lúc đứng dậy đi vệ sinh, ông choáng, vã mồ hôi, tối sầm mắt rồi ngã gục, bất tỉnh khoảng 1 phút. Hiện ông nằm trên giường, tỉnh, trả lời được nhưng da tái nhợt, vã mồ hôi lạnh, tay chân lạnh, khát nước; cứ ngồi dậy là choáng muốn ngất, không tự đứng lên được; vẫn đau dữ dội. Con trai đo huyết áp được 85/50 mmHg, mạch 120 lần/phút. Ông hơi buồn nôn, không nôn. Ông không sốt, không tiểu buốt, nước tiểu không đỏ, không đi ngoài phân đen, không đau ngực, không khó thở, không uống thuốc chống đông hay aspirin."
