source:
  basis: "Nhiễm khuẩn huyết từ viêm phổi ở người cao tuổi có đái tháo đường: sốt rét run, thở nhanh, thay đổi ý thức, tiểu ít (5642/QĐ-BYT bài Nhiễm khuẩn huyết; NICE NG253: nhịp thở từ 25 lần/phút, lú lẫn mới là tiêu chí nguy cơ cao). NHS Sepsis: lú lẫn, thở rất nhanh thì gọi 999 (mức 1)."
  references: [byt-qd-5642-2015, nice-ng253, nhs-sepsis]
author: "agent:pass-c"
notes_vi: "Ca của bản mở rộng lô 3: nhiễm khuẩn huyết ở triệu chứng chính Khó thở. Chấp nhận viêm phổi vì là ổ nhiễm khởi điểm; mô hình một bệnh chia xác suất giữa hai tình trạng."
