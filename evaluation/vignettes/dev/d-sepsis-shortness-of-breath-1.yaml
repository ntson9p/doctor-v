id: d-sepsis-shortness-of-breath-1
set: dev
title_vi: "Nữ 70 tuổi đái tháo đường, sốt rét run 2 ngày, ho đờm, nay thở nhanh, khó thở lúc nghỉ, lú lẫn"
narrative_vi: "Bà K., 70 tuổi, ở Nam Định, bị đái tháo đường. Hai ngày nay bà sốt 39°C, rét run, ho có đờm vàng. Từ sáng nay bà thở nhanh, ngồi nghỉ cũng khó thở, nói chuyện lẫn lộn, không nhận ra cháu; đi tiểu ít hơn hẳn. Con gái chọn Khó thở vì thấy bà thở rất mệt. Không đau ngực, không sưng chân, không khò khè, không ngất. Chưa đo SpO2."
