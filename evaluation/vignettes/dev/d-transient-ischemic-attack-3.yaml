id: d-transient-ischemic-attack-3
set: dev
title_vi: "Nữ 52 tuổi có tiền sử đau nửa đầu, sáng nay chóng mặt kèm tê tay phải, nói khó 30 phút, không đau đầu"
narrative_vi: "Chị V., 52 tuổi, bị đau nửa đầu từ trẻ và tăng huyết áp mới phát hiện năm ngoái. Sáng nay đang nấu cơm bỗng chóng mặt quay, tê bàn tay phải và nói khó, khoảng 30 phút thì hết. Lần này không đau đầu, không sợ ánh sáng, không thấy chớp sáng trước mắt. Chị nghĩ là cơn đau nửa đầu. Chưa từng bị chóng mặt kiểu này. Không nhìn đôi, không ngất, đi lại bình thường. Không có thai, không chậm kinh."
