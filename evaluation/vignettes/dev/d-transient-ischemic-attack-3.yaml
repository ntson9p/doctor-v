source:
  basis: "Dễ nhầm với tiền triệu của đau nửa đầu (migraine) ở người có tiền sử đau nửa đầu. Lempert 2022: cần nghĩ cơn thiếu máu não thoáng qua ở người có yếu tố nguy cơ mạch máu, khởi phát đột ngột, cơn mới xuất hiện; 3312/QĐ-BYT: cần phân biệt cơn thiếu máu não thoáng qua với đau nửa đầu. Cơn lần này không có đau đầu, không có tiền triệu thị giác. Mức xử trí theo 3312/QĐ-BYT và NHS TIA."
  references: [lempert-jvestibres-2022, byt-qd-3312-2024, nhs-tia, nhs-migraine]
author: "agent:pass-c"
notes_vi: "Ca dễ nhầm với đau nửa đầu (phần mở rộng của lô này)."
