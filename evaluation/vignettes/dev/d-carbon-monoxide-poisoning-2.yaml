source:
  basis: "Ca không điển hình: người già có thể khởi đầu bằng lẫn lộn (3610/QĐ-BYT mục 3.5); bình nóng lạnh chạy gas trong nhà tắm kín là nguồn khí CO hay gặp ở Việt Nam (mục 2.2); mất ý thức trong phòng kín có thiết bị đốt là tình huống điển hình (Jüttner 2021). NHS: đã phơi nhiễm kèm đột ngột lú lẫn hoặc mất ý thức thì gọi 999; người lú lẫn không tự đến viện an toàn được (quy tắc rf_altered_consciousness, mức 1)."
