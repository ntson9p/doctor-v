id: d-carbon-monoxide-poisoning-2
set: dev
title_vi: "Nam 78 tuổi sống một mình, ngất trong nhà tắm kín có bình nóng lạnh chạy gas, tỉnh lại còn lẫn lộn"
narrative_vi: "Ông Q., 78 tuổi, sống một mình. Tối nay con gái sang thăm thấy ông nằm gục trong nhà tắm đóng kín, bình nóng lạnh chạy gas đang bật. Đưa ra ngoài thì vài phút sau ông tỉnh, nhưng đến giờ vẫn lẫn lộn, hỏi lại nhiều lần, chưa đi lại vững như trước. Ông kêu đau đầu. Không co giật, không méo miệng, không yếu nửa người. Không khó thở, không đau ngực. Không biết trước khi ngất ông có thấy gì không."
