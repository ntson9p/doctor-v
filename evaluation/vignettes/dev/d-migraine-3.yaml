title_vi: "Nữ 32 tuổi, thấy chớp sáng gợn sóng 20 phút rồi đau nửa đầu trái"
narrative_vi: "Chị X., 32 tuổi. Sáng nay thấy những đường chớp sáng gợn sóng trước mắt khoảng 20 phút, sau đó đau giật giật nửa đầu trái, buồn nôn, khó chịu với ánh sáng và tiếng ồn. Chị từng bị vài cơn giống vậy. Chớp sáng đã hết hẳn; không yếu tay chân, không nói khó, không mất thị lực."
