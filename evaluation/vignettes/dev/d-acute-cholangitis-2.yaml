source:
  basis: "Người rất cao tuổi viêm đường mật hay có biểu hiện kín đáo: sốt vừa, đau nhẹ, không rét run; vàng mắt kèm sốt và đau bụng vẫn là tam chứng Charcot (Wada 2007; Kiriyama 2012: người cao tuổi đau bụng ít hơn). Đã mổ sỏi mật vẫn có thể có sỏi ống mật. Quy tắc rf_cholangitis_triad mức 2."
  references:
    - wada-jhbps-2007
    - kiriyama-jhbps-2012
    - msd-choledocholithiasis-cholangitis
author: agent:pass-c
notes_vi: "Ca không điển hình: người rất cao tuổi, triệu chứng chính là sốt, đau nhẹ."
