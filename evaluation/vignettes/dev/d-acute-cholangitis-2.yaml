id: d-acute-cholangitis-2
set: dev
title_vi: Nữ 82 tuổi sốt, tức nhẹ bụng trên, người nhà thấy vàng mắt, không rét run
narrative_vi: Cụ X., 82 tuổi, mổ sỏi mật 10 năm trước. Hôm qua cụ sốt khoảng 38,5°C, ăn kém, mệt. Cụ chỉ kêu tức nhẹ vùng trên rốn. Sáng nay con cháu thấy lòng trắng mắt cụ vàng. Không rét run, không nôn, không tiêu chảy, không ho, không tiểu buốt. Cụ vẫn nhận ra người nhà, nói chuyện bình thường.
