id: d-acute-cholecystitis-3
set: dev
title_vi: "Nữ 58 tuổi, tăng huyết áp, đái tháo đường, đau tức dưới sườn phải và trên rốn 8 giờ (dễ nhầm hội chứng vành cấp)"
narrative_vi: "Bà H., 58 tuổi, bị tăng huyết áp và đái tháo đường. Từ 8 giờ trước đau tức dưới sườn phải lan sang vùng trên rốn, đau liên tục, tăng sau bữa trưa, buồn nôn, nôn 1 lần. Không đau ngực, không khó thở, không vã mồ hôi, không sốt, không vàng da. Đau không lan lên vai, cổ, tay, không dữ dội. Chưa từng được nói có sỏi mật."
