source:
  basis: "Phụ nữ cao tuổi, đái tháo đường có thể bị hội chứng vành cấp biểu hiện đau thượng vị, buồn nôn (2187/QĐ-BYT); ở đây đau khu trú dưới sườn phải, liên tục trên 6 giờ, tăng sau ăn, kèm nôn, không có đau ngực, khó thở, vã mồ hôi, phù hợp viêm túi mật cấp (MSD; Cartwright 2008). Cần đến cơ sở cấp cứu (MSD: cần nhập viện)."
  references: [msd-acute-cholecystitis, cartwright-afp-2008, byt-qd-2187-2019]
author: "agent:pass-c"
notes_vi: "Ca dễ nhầm với hội chứng vành cấp (lô 4)."
