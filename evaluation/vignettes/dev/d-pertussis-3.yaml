source:
  basis: "Ho gà ở vị thành niên đã tiêm lúc nhỏ (miễn dịch giảm dần): ho từ 2 tuần kèm ho từng cơn và nôn sau ho, đủ định nghĩa ca lâm sàng của WHO; tiếng rít có thể không có (NHS). Viêm phế quản cấp cũng ho 1–3 tuần sau cảm, nhưng nôn sau ho làm tăng khả năng ho gà (Cornia 2010: LR dương 1,8). Mức 3: khám để xét nghiệm, kháng sinh giúp hạn chế lây (NHS Whooping cough)."
  references: [who-emro-pertussis-surveillance, cornia-jama-2010, nhs-whooping-cough, toizumi-vaccines-2024]
author: "agent:pass-c"
notes_vi: "Ca dễ nhầm với viêm phế quản cấp (lô 3, phần a)."
