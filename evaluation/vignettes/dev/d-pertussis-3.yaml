id: d-pertussis-3
set: dev
title_vi: "Nam 15 tuổi ho 2 tuần rưỡi sau cảm, từng cơn, nôn sau ho, dễ nhầm viêm phế quản"
narrative_vi: "Em T., nam, 15 tuổi, ở Đà Nẵng, tiêm chủng đầy đủ khi nhỏ. Khoảng 17 ngày trước em sổ mũi, đau họng nhẹ, ho khan. Hết sổ mũi nhưng ho ngày càng nặng: ho thành từng tràng dài liên tiếp, ho đến chảy nước mắt, hai lần nôn sau cơn ho, đêm ho nhiều không ngủ được. Em không để ý có tiếng rít khi hít vào. Không sốt, không khạc đờm, không khò khè, không khó thở, không đau ngực. Không sụt cân, không ra mồ hôi đêm, không hút thuốc. Trong lớp có vài bạn cũng ho lâu."
