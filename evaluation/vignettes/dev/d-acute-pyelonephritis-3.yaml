source:
  basis: "Đau dưới sườn phải lan ra lưng kèm sốt, nôn dễ nhầm với bệnh túi mật và với sốt xuất huyết giai đoạn nguy hiểm; tiểu buốt, tiểu nhiều lần, đau hông lưng và rét run gợi ý viêm thận – bể thận (3931 mục 2). Không có thai, không ra máu âm đạo. NHS Kidney infection: khám gấp trong ngày."
