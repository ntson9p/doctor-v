id: d-acute-pyelonephritis-3
set: dev
title_vi: "Nữ 31 tuổi, đau bụng dưới sườn phải lan ra lưng, sốt rét run, nôn, tiểu buốt"
narrative_vi: "Chị Y., 31 tuổi, ở Quy Nhơn. Hai ngày nay đau âm ỉ dưới sườn phải, lan ra sau lưng, kèm sốt 38,8°C, rét run, buồn nôn, nôn 2 lần. Đi tiểu buốt, nhiều lần. Không đau quặn, không lan xuống bẹn, không tiêu chảy. Không ra máu âm đạo, không chậm kinh, không có khí hư lạ. Không đau sau bữa ăn nhiều mỡ."
