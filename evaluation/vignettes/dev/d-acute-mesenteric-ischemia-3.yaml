id: d-acute-mesenteric-ischemia-3
set: dev
title_vi: Nam 80 tuổi rung nhĩ, đột ngột đau bụng, nôn và đi ngoài phân lỏng nhiều lần (dễ nhầm viêm dạ dày – ruột)
narrative_vi: Cụ L., 80 tuổi, bị rung nhĩ, đã tự ngừng thuốc chống đông. Sáng nay đột ngột đau bụng nhiều, đau khắp bụng, sau đó nôn 3 lần và đi ngoài phân lỏng 4 lần, không có máu. Con cháu nghĩ cụ ăn phải đồ ăn hỏng, nhưng những người ăn cùng không ai bị. Không sốt, không ngất, không lú lẫn, không đau ngực.
