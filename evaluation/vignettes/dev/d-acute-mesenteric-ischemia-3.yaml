source:
  basis: "Người cao tuổi rung nhĩ ngừng thuốc chống đông, đau bụng dữ dội đột ngột kèm nôn, tiêu chảy (phản ứng tống rỗng ruột; WSES 2022: tiêu chảy 35%), người ăn cùng không bị: dễ nhầm viêm dạ dày – ruột. Kärkkäinen 2015: từ 75 tuổi bệnh hay gặp hơn viêm ruột thừa ở người đau bụng cấp. Mức 1."
