id: d-cardiac-arrhythmia-shortness-of-breath-1
set: dev
title_vi: "Nam 72 tuổi 3 ngày nay hụt hơi khi đi lại, mệt, tim đập nhanh không đều, máy đo mạch 130"
narrative_vi: "Ông G., 72 tuổi, ở Bắc Ninh, bị tăng huyết áp. Ba ngày nay thấy hụt hơi khi đi lại, leo vài bậc cầu thang đã phải dừng, ngồi nghỉ thì đỡ; khó thở tăng dần, không đột ngột. Kèm mệt, thấy tim đập nhanh, lộn xộn, đến giờ vẫn còn. Con trai đo bằng máy đo huyết áp thấy mạch 130 lần mỗi phút. Không đau ngực, không choáng, không ngất. Không sốt, không ho. Nằm không khó thở hơn, không phù chân. Chưa được nói có bệnh tim hay rung nhĩ. Không hút thuốc."
