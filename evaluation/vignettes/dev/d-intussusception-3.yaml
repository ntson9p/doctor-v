id: d-intussusception-3
set: dev
title_vi: "Bé trai 14 tháng, nôn, tiêu chảy, khóc thét từng cơn co chân lên bụng (dễ nhầm viêm dạ dày – ruột)"
narrative_vi: "Bé P., 14 tháng tuổi (trai). Từ đêm qua nôn 4 lần, đi ngoài phân lỏng 3 lần không có máu; từ sáng có những cơn khóc thét, co chân lên bụng, mỗi cơn vài phút. Không sốt. Bé vẫn uống được nước, chưa li bì, còn đi tiểu, mắt không trũng. Không ai trong nhà bị tiêu chảy."
