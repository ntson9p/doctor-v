source:
  basis: "Lồng ruột có thể kèm tiêu chảy (Park 2021: 9,7–17,2%), dễ nhầm với viêm dạ dày – ruột; cơn khóc thét, co chân từng cơn ở trẻ 14 tháng (đỉnh mắc ở năm thứ hai, Burnett 2018) cần khám cấp cứu để loại trừ lồng ruột (WHO 2002; Reust 2016)."
  references: [park-frontpediatr-2021, burnett-vaccine-2018, who-intussusception-2002, reust-afp-2016]
