source:
  basis: "Tràn khí màng phổi nguyên phát ở thiếu niên, đến muộn, đau vừa: thiếu niên tràn khí phần lớn chỉ đau ngực, một phần ba kèm khó thở (Klin 2021); ở thiếu niên lớn, đau liên tục 1–2 ngày (Chun 2015); 25% vào viện sau 24 giờ (Olesen 2019). Đau ngực kèm khó thở cần chụp X quang phổi ở cơ sở cấp cứu (4235/QĐ-BYT): mức 2."
  references: [klin-medicine-2021, chun-kjp-2015, olesen-erjor-2019, byt-qd-4235-2012]
author: "agent:pass-c"
notes_vi: "Ca không điển hình: thiếu niên, đến muộn sau 2 ngày, đau không dữ dội, khó thở tăng dần."
