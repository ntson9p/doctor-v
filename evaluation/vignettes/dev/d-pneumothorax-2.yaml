id: d-pneumothorax-2
set: dev
title_vi: "Nam 16 tuổi, 2 ngày nay đau âm ỉ ngực trái, tăng khi hít sâu, leo cầu thang hụt hơi"
narrative_vi: "Em K., nam, 16 tuổi, học sinh ở Cần Thơ, người gầy, cao. Hai ngày trước đang ngồi xem điện thoại thì thấy nhói ở ngực trái; từ đó đau âm ỉ suốt, không dữ dội, hít sâu thì đau hơn. Hôm nay leo cầu thang lên lớp thấy hụt hơi hơn bạn bè, ngồi nghỉ thì đỡ. Khó thở tăng dần từ hôm qua, không phải đột ngột. Ấn vào ngực không đau thêm. Không sốt, không ho, không sổ mũi, không đau họng. Không hút thuốc, không bị hen. Không choáng, không vã mồ hôi. Nhà không có máy đo SpO2."
