title_vi: "Nữ 24 tuổi bị hen, khó thở, khò khè từ tối qua, ho về đêm, xịt thuốc đỡ một phần"
narrative_vi: "Chị T., 24 tuổi, ở Hà Nội, bị hen từ nhỏ, có bình xịt cắt cơn. Từ tối qua sau khi dọn nhà nhiều bụi thì khó thở, khò khè, ho nhiều về đêm, gần sáng phải ngồi dậy. Đã xịt thuốc cắt cơn 2 lần, đỡ một phần. Hiện khó thở khi đi lại, ngồi yên thì dễ chịu hơn, nói được cả câu. Không sốt, không đau hay tức ngực, không sổ mũi. Mấy năm nay từng có vài cơn giống hệt. Không có thai, không chậm kinh."
