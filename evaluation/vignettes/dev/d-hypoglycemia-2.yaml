id: d-hypoglycemia-2
set: dev
title_vi: "Nam 15 tuổi, đái tháo đường típ 1 tiêm insulin, sau đá bóng tim đập nhanh, run tay, vã mồ hôi, tê môi"
narrative_vi: "Em T., 15 tuổi, bị đái tháo đường típ 1, tiêm insulin hằng ngày. Chiều nay đá bóng 2 tiếng mà không ăn thêm. Vừa về nhà thấy tim đập nhanh, đều, run tay, vã mồ hôi lạnh, tê quanh môi, hơi choáng váng. Không đau ngực, không khó thở, không ngất, vẫn tỉnh táo. Không sợ hãi gì đặc biệt. Chưa đo đường huyết, chưa đo mạch. Ăn trưa bình thường."
