source:
  basis: "Ca không điển hình: thiếu niên đái tháo đường típ 1, biểu hiện bằng hồi hộp; vận động nhiều mà không ăn thêm làm dễ hạ đường huyết (NHS; 5481/QĐ-BYT: vận động nhiều là nguyên nhân hay gặp khi tiêm insulin). Triệu chứng cường giao cảm và tê môi (NHS). Còn tỉnh: tự ăn uống đồ ngọt ngay, khám trong 24 giờ để xem lại liều insulin (quy tắc rf_hypoglycemia_suspected)."
