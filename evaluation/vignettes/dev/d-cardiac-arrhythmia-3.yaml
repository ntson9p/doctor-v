id: d-cardiac-arrhythmia-3
set: dev
title_vi: "Nữ 28 tuổi, nhiều năm có cơn tim nhanh đều bật tắt, kèm sợ hãi, từng được nói là lo âu"
narrative_vi: "Chị P., 28 tuổi, từ vài năm nay thỉnh thoảng bỗng tim đập rất nhanh và đều, cổ đập thình thịch, kéo dài 15–30 phút rồi dừng đột ngột như tắt công tắc. Trong cơn chị sợ hãi, hơi choáng nhưng không như sắp ngất. Từng đi khám được nói là do lo âu. Cơn hôm qua đã hết. Không đau ngực, không khó thở. Không run tay, không tê bì, không sụt cân. Không uống nhiều cà phê. Không có thai, kinh nguyệt đều. Chưa đo mạch lúc có cơn."
