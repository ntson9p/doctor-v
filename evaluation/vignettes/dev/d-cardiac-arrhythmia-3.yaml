source:
  basis: "Nhịp nhanh vòng vào lại nút nhĩ thất dễ nhầm với cơn hoảng sợ: cơn nhanh, đều, bật tắt, mạch cổ đập thình thịch (Thavendiranathan 2009: LR 177; EHRA 2011: hai phần ba người nhịp nhanh trên thất từng bị chẩn đoán nhầm là hoảng sợ; ESC 2019: có thể giống rối loạn hoảng sợ). NHS SVT: hay bị tim nhanh thì khám bác sĩ để làm điện tim; doctor-v xếp mức 3 (mức của bệnh)."
