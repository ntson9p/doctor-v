title_vi: "Nam 45 tuổi, từng mổ bụng, đau quặn quanh rốn, nôn dịch vàng xanh, đi ngoài phân nước (dễ nhầm viêm dạ dày – ruột)"
narrative_vi: "Anh K., 45 tuổi, 5 năm trước mổ bụng vì vỡ lách. Từ chiều qua đau quặn từng cơn quanh rốn, buồn nôn, nôn 3 lần ra dịch vàng xanh, đi ngoài phân lỏng toàn nước 3 lần, chán ăn. Bụng không chướng rõ, vẫn còn xì hơi. Không sốt. Không ai ăn cùng bị bệnh. Đau không dữ dội."
