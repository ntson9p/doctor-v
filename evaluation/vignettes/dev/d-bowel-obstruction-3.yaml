source:
  basis: "Tắc ruột non không hoàn toàn có thể tiêu chảy phân nước, dễ bị chẩn đoán nhầm là viêm dạ dày – ruột (WSES 2018; MSD). Người từng mổ bụng, đau quặn, nôn dịch mật, không sốt, không có người ăn cùng bị bệnh: cần khám cấp cứu để loại trừ tắc ruột (WSES; Böhner 1998)."
  references: [wses-asbo-2018, msd-intestinal-obstruction, bohner-ejs-1998]
