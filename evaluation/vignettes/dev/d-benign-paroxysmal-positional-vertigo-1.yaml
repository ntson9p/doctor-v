source:
  basis: "Ca điển hình: cơn quay dưới 1 phút luôn do đổi tư thế đầu, hay khi trở mình trên giường, có thể buồn nôn, không nghe kém, khám thần kinh bình thường, hay tái lại (von Brevern 2007, MSD, 5643/QĐ-BYT). NHS Vertigo: chóng mặt quay hay tái lại thì khám bác sĩ (không khẩn); GRACE-3: cơn có yếu tố khởi phát làm nghiệm pháp Dix-Hallpike, không cần chụp."
  references: [vonbrevern-jnnp-2007, msd-bppv, byt-qd-5643-2015, nhs-vertigo, grace3-dizziness-2023]
