id: d-benign-paroxysmal-positional-vertigo-1
set: dev
title_vi: "Nữ 57 tuổi, quay cuồng vài giây mỗi khi trở mình, nằm xuống, ngửa cổ"
narrative_vi: "Bà H., 57 tuổi. Ba ngày nay, mỗi lần trở mình trên giường, nằm xuống hoặc ngửa cổ phơi đồ thì thấy mọi vật quay tròn, kéo dài vài giây rồi hết, kèm buồn nôn nhưng không nôn. Giữa các cơn đi lại bình thường. Hai năm trước cũng bị một đợt giống vậy, tự hết sau vài tuần. Không ù tai, không nghe kém, không đau đầu, không nhìn đôi, không yếu tê tay chân, không ngất. Không choáng khi đứng dậy. Không sốt. Không có bệnh nền."
