title_vi: "Nữ 70 tuổi, sốt nhẹ về chiều 3 tuần, mệt, chán ăn, sụt cân, ho ít, có tiểu đường"
narrative_vi: "Bà S., 70 tuổi, ở Sóc Trăng, bị đái tháo đường nhiều năm. Ba tuần nay chiều tối hay sốt nhẹ, đo cao nhất 37,9°C, người mệt, chán ăn, sụt 3 kg. Có ho ít, ho khan rồi khạc chút đờm, cũng khoảng 3 tuần. Đêm hay ra mồ hôi. Không rét run, không đau bụng, không tiểu buốt, không khó thở, không ho ra máu, không đau đầu, không phát ban. Tỉnh táo, vẫn tự đi lại được."
