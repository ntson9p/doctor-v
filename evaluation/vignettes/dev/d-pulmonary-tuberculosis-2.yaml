source:
  basis: "Lao phổi ở người cao tuổi có đái tháo đường, biểu hiện chủ yếu bằng sốt nhẹ về chiều kéo dài trên 2 tuần, mệt, sụt cân, ho ít (162/QĐ-BYT phần II mục 1.1, 1.3). Người từ 65 tuổi sốt kéo dài cần được khám trong 24 giờ để tìm nguyên nhân (IMCI: sốt quá 7 ngày thì chuyển khám)."
