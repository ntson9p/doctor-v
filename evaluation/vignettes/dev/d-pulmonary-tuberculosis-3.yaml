title_vi: "Nam 55 tuổi hút thuốc, ho 4 tuần, đờm lẫn máu 3 ngày, mồ hôi đêm, sụt cân"
narrative_vi: "Ông P., 55 tuổi, ở Hà Nội, hút thuốc lá 30 năm. Bốn tuần nay ho có đờm; ba ngày nay đờm có lẫn vài vệt máu. Đêm hay ra mồ hôi, sụt 3 kg trong tháng qua, hơi mệt. Không sốt, không khó thở, không đau ngực. Không biết có ai quanh mình bị lao. Chưa từng được nói bị bệnh phổi. Bác sĩ khám sau đó: xét nghiệm đờm tìm thấy vi khuẩn lao."
