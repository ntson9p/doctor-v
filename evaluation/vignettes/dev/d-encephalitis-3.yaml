source:
  basis: "Dễ nhầm với co giật do sốt: co giật do sốt đơn thuần thường ngắn và trẻ tỉnh lại nhanh, còn ở đây co giật lặp lại và li bì kéo dài sau cơn. 3312/QĐ-BYT (2015, bài Viêm não, mục 3.2.2, 3.4): rối loạn tri giác, thường có co giật; cần phân biệt với co giật do sốt cao, viêm màng não mủ. Li bì, khó đánh thức là dấu hiệu nguy hiểm toàn thân (IMCI), gọi cấp cứu (mức 1)."
  references: [byt-qd-3312-2015, who-imci-chart-booklet-2014, nhs-encephalitis]
author: "agent:pass-c"
notes_vi: "Viêm màng não do vi khuẩn được chấp nhận vì tại nhà không phân biệt được (trẻ dưới 5 tuổi ít có cứng gáy)."
