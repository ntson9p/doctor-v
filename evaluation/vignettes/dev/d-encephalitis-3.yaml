title_vi: "Bé gái 3 tuổi ở Sơn La, tháng 7, sốt 2 ngày, co giật 2 lần, sau cơn vẫn li bì"
narrative_vi: "Bé M., 3 tuổi, ở Sơn La. Hai ngày nay bé sốt 39°C, quấy khóc, nôn 1 lần. Sáng nay bé co giật toàn thân 2 lần, mỗi lần khoảng 3 phút. Đã hơn 1 giờ sau cơn mà bé vẫn ngủ li bì, gọi không mở mắt, chỉ ú ớ. Hiện bé không còn co giật. Mẹ thấy cổ bé vẫn mềm. Bé không nổi ban, không ho, không tiêu chảy, không có nốt phỏng ở tay chân hay loét miệng."
