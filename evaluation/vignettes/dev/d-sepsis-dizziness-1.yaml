  basis: "Nhiễm khuẩn huyết từ đường tiết niệu ở người cao tuổi, đái tháo đường, biểu hiện bằng choáng váng: sốt, rét run, mệt lả, tay chân lạnh, da tái là dấu hiệu sốc (5642/QĐ-BYT bài Nhiễm khuẩn huyết; NHS Sepsis; MSD: người cao tuổi có thể không có phản ứng viêm rõ). Quy tắc rf_shock_cold_and_weak (mức 1)."
