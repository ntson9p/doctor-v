title_vi: "Nữ 79 tuổi đái tháo đường, sốt, rét run, tiểu buốt, nay choáng váng, mệt lả, tay chân lạnh"
narrative_vi: "Bà R., 79 tuổi, đái tháo đường. Hai ngày nay sốt, rét run, tiểu buốt. Hôm nay bà choáng váng, đứng dậy là muốn ngã, mệt lả không tự đi lại được, tay chân lạnh, da tái. Bà vẫn tỉnh, trả lời đúng. Không đau ngực, không khó thở, không đau đầu, không nôn. Chưa đo mạch."
