source:
  basis: "Đau quanh rốn, nôn, sốt dễ nhầm với giai đoạn đầu viêm ruột thừa, nhưng tiêu chảy nhiều lần, đau không khu trú, không chuyển xuống hố chậu phải, không tăng khi cử động (NHS Appendicitis; Bundy 2007). Sốt dưới 38,9°C, giữ được nước, không có máu trong phân: tự chăm sóc tại nhà (NHS, CDC), đi khám nếu đau chuyển xuống bụng dưới bên phải hoặc tăng dần."
  references: [nhs-diarrhoea-vomiting, cdc-food-poisoning, nhs-appendicitis, bundy-jama-2007]
author: "agent:pass-c"
notes_vi: "Ca dễ nhầm với viêm ruột thừa cấp (bệnh không được bỏ sót, lô 3)."
