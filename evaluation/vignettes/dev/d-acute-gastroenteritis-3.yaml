id: d-acute-gastroenteritis-3
set: dev
title_vi: "Nữ 22 tuổi, đau quanh rốn, nôn, sốt 38,2°C, tiêu chảy (dễ nhầm viêm ruột thừa)"
narrative_vi: "Chị L., 22 tuổi. Từ chiều qua đau quặn quanh rốn, buồn nôn, nôn 3 lần, sốt 38,2°C, chán ăn, đi ngoài phân lỏng 4 lần. Đau không chuyển xuống bụng dưới bên phải, không tăng khi đi lại hay khi ho, không dữ dội. Không ai ăn cùng bị bệnh. Không có thai, không chậm kinh, không ra máu âm đạo, không ra khí hư bất thường, không đau khi đi tiểu."
