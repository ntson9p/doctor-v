source:
  basis: "Nhồi máu não tuần hoàn sau: 3312/QĐ-BYT (2024) (mất thị lực, rối loạn thị trường khởi phát đột ngột); MSD (rung nhĩ là nguồn huyết khối); NHS Stroke (mất thị lực đột ngột: gọi cấp cứu). Dễ nhầm với đau nửa đầu có tiền triệu thị giác."
