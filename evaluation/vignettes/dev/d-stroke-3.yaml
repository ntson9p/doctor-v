id: d-stroke-3
set: dev
title_vi: "Nam 72 tuổi, rung nhĩ, đột ngột không nhìn thấy nửa bên trái, đau đầu vùng gáy, buồn nôn"
narrative_vi: "Ông Ph., 72 tuổi, bị tăng huyết áp và rung nhĩ. Sáng nay đột ngột không nhìn thấy nửa bên trái, kèm đau đầu vùng sau gáy mức vừa, buồn nôn. Ông chưa từng bị đau đầu kiểu này, trước đó không thấy chớp sáng. Không yếu tay chân, nói rõ, đi lại vững."
