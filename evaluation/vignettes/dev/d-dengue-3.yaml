source:
  basis: "Sốt xuất huyết ở giai đoạn nguy hiểm (ngày 3–7) có dấu hiệu cảnh báo: đau tăng vùng gan, tiểu ít (2760 mục II.2, Phụ lục 2). Theo 2760 mục IV.B2, người lớn có dấu hiệu cảnh báo được cho nhập viện: đến cơ sở cấp cứu ngay. Dễ nhầm với viêm thận – bể thận (sốt, đau dưới sườn, nôn, tiểu ít) và bệnh gan mật."
