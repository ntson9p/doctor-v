title_vi: "Nữ 27 tuổi ở Đà Nẵng, tháng 10, đau dưới sườn phải, sốt ngày thứ 5, nôn, tiểu ít"
narrative_vi: "Chị T., 27 tuổi, ở Đà Nẵng. Sốt cao 39°C từ 5 ngày nay, đau đầu, đau mỏi người, chán ăn. Hai ngày nay đau âm ỉ liên tục dưới sườn phải và vùng trên rốn, buồn nôn, nôn 3 lần trong ngày nhưng vẫn uống được nước. Từ sáng đến chiều chỉ đi tiểu một ít. Không tiểu buốt, không đau hông lưng, không tiêu chảy. Không ra máu âm đạo, không chậm kinh. Chưa thấy chảy máu chân răng hay nổi chấm đỏ. Không rõ quanh nhà có ai bị sốt xuất huyết không."
