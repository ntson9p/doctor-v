source:
  basis: "Đau thành ngực sau mang vác ở người có yếu tố nguy cơ tim mạch: đau giữa ngực, ấn vào đau, tăng khi cử động, không theo gắng sức (Verdon 2007; Ronga 2012), nhưng đau ngực giữa ở nam 55 tuổi hút thuốc, tăng huyết áp vẫn cần loại trừ hội chứng vành cấp: đau trong 12–72 giờ qua thì cần được đánh giá trong ngày (NICE CG95 khuyến cáo 1.2.1.8); NHS Costochondritis: gọi 111 để loại trừ bệnh nặng hơn: mức 3."
  references: [verdon-bmcfampract-2007, ronga-bmcfampract-2012, nice-cg95, nhs-costochondritis]
