id: d-chest-wall-pain-3
set: dev
title_vi: "Nam 55 tuổi hút thuốc, tăng huyết áp, đau giữa ngực 2 ngày sau khiêng bao xi măng, ấn vào xương ức đau"
narrative_vi: "Ông N., 55 tuổi, thợ xây ở Nghệ An, hút thuốc lá, bị tăng huyết áp. Hai ngày trước khiêng nhiều bao xi măng; từ tối hôm đó đau âm ỉ ở giữa ngực, chỗ xương ức, kéo dài cả ngày. Cử động tay, xoay người hoặc hít sâu thì đau nhói hơn; ấn vào xương ức thì đau đúng chỗ. Đi bộ nhanh, leo cầu thang không thấy đau hơn. Đau không lan ra tay, hàm hay lưng. Không vã mồ hôi, không khó thở, không buồn nôn, không choáng. Không sốt, không ho, không ợ chua. Chưa được nói có bệnh tim, không đái tháo đường."
