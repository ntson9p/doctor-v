title_vi: "Bé trai 6 tuổi ở Thái Bình, tháng 6, sốt cao 3 ngày, đau đầu, nôn, nay li bì, nói lẫn lộn"
narrative_vi: "Bé K., 6 tuổi, ở Thái Bình, nhà gần ruộng lúa. Ba ngày nay bé sốt cao 39,6°C, kêu đau đầu nhiều, nôn 2 lần. Từ chiều nay bé ngủ li bì, gọi mãi mới mở mắt, nói lẫn lộn, không nhận ra bà. Bé chưa co giật. Cổ vẫn cúi được. Không ho, không sổ mũi, không tiêu chảy, không nổi ban. Bé đã tiêm đủ 2 mũi vắc xin sởi; mẹ không nhớ đã tiêm vắc xin viêm não Nhật Bản đủ chưa."
