title_vi: "Nam 35 tuổi, ho có đờm 9 ngày sau cảm lạnh, không sốt, không khó thở"
narrative_vi: "Anh K., 35 tuổi, nhân viên văn phòng ở Hà Nội, không hút thuốc. Chín ngày trước bị sổ mũi, đau họng, rồi ho nhiều, khạc đờm trắng đục, ho cả ngày. Nay sổ mũi còn ít. Không sốt, không khó thở, không đau ngực, không khò khè. Đồng nghiệp cùng phòng cũng đang ho. Không có bệnh phổi, chưa từng bị hen."
