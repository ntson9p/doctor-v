source:
  basis: "Đột quỵ tuần hoàn sau ở người trẻ, nghi do bóc tách động mạch đốt sống sau nắn vặn cổ: đau gáy và vùng sau đầu mới xuất hiện từ khi bị bẻ cổ, rồi đột ngột chóng mặt quay liên tục, nôn, không tự đứng, đi được kể cả khi mở mắt, dù không méo miệng, không yếu tay, không nói khó. GRACE-3: ở hội chứng tiền đình cấp, đi không vững nặng gợi ý nguyên nhân trung ương; Tarnutzer (CMAJ 2011): đau đầu hoặc đau cổ mới làm tăng khả năng đột quỵ, 25% đột quỵ xảy ra dưới 50 tuổi, thất điều nặng có khi là dấu hiệu rõ duy nhất; 3312/QĐ-BYT (2024): nhồi máu não có thể biểu hiện chóng mặt, thất điều, cần vận chuyển nhanh đến nơi điều trị được đột quỵ; NHS Symptoms of a stroke: chóng mặt hoặc ngã là triệu chứng đột quỵ, gọi 999, nên mức 1."
  references:
    - grace3-dizziness-2023
    - tarnutzer-cmaj-2011
    - byt-qd-3312-2024
    - nhs-stroke-symptoms
author: "agent:vignette-holdout"
notes_vi: "Ca cấp cứu khó: người trẻ, không có yếu tố nguy cơ mạch máu, các câu sàng lọc đột quỵ đều 'không'; dấu hiệu then chốt là chóng mặt liên tục, không tự đi được và đau gáy mới sau nắn vặn cổ. Đau khi quay cổ nhưng vẫn cúi được cằm chạm ngực nên câu cứng gáy trả lời 'không'. Danh mục chưa có câu hỏi về nắn, vặn cổ."
