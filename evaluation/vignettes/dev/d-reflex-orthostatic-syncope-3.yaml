id: d-reflex-orthostatic-syncope-3
set: dev
title_vi: "Nam 60 tuổi ngất khi rặn đi ngoài lúc táo bón, phân bình thường"
narrative_vi: "Ông K., 60 tuổi, bị táo bón mấy ngày. Sáng nay rặn mạnh khi đi ngoài thì thấy nóng người, vã mồ hôi, buồn nôn rồi ngất gục trong nhà vệ sinh, vài giây sau tỉnh, sau đó tỉnh táo hoàn toàn. Phân màu vàng nâu bình thường, không đen. Không nôn ra máu, không đau bụng, không đau ngực, không khó thở, không hồi hộp. Không uống thuốc giảm đau thường xuyên. Chưa đo mạch."
