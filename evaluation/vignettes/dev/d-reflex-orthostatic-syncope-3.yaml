source:
  basis: "Ngất tình huống khi đi ngoài, có tiền triệu thần kinh thực vật (ESC 2018 bảng 5: khi ho, đi ngoài, đi tiểu là nguy cơ thấp). Dễ nhầm với xuất huyết tiêu hóa trên (người đi ngoài phân đen hay ngất trong nhà vệ sinh), nhưng không có phân đen, nôn ra máu, da xanh. NHS Fainting: khám bác sĩ gia đình. Ca thứ hai kiểm tra người 50–70 tuổi ngất lành tính."
