source:
  basis: "Dễ nhầm với sốt xuất huyết (WHO 2003: bệnh dễ bị nhầm với sốt xuất huyết; Levett 2001: đau đầu giống sốt xuất huyết). Điểm gợi ý Leptospira: lội ruộng ngập trong tháng qua, đau nhiều bắp chân, đỏ kết mạc, không ban, không chảy máu. Chưa có dấu hiệu thể nặng: khám trong 24 giờ (mức 3)."
