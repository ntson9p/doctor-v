id: d-leptospirosis-3
set: dev
title_vi: "Nữ 30 tuổi ở Cần Thơ, tháng 9, sốt 3 ngày, đau đầu, đau mỏi người, đỏ mắt, mới lội ruộng ngập"
narrative_vi: "Chị L., 30 tuổi, ở Cần Thơ. Khoảng 2 tuần trước chị lội ruộng ngập nước để gặt lúa. Ba ngày nay chị sốt 39°C, đau đầu, đau mỏi khắp người, hai bắp chân đau nhiều, mắt đỏ. Chị nghĩ mình bị sốt xuất huyết vì đang mùa mưa. Không đau sau hốc mắt, không chảy máu chân răng, không nổi chấm đỏ, không đau bụng, không nôn. Không ho, không sổ mũi. Chị không có thai, kinh nguyệt đều. Không rõ quanh nhà có ai bị sốt xuất huyết không."
