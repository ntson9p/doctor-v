id: d-premature-beats-1
set: dev
title_vi: "Nam 40 tuổi uống nhiều cà phê, thiếu ngủ, hay thấy tim hẫng một nhịp vài giây"
narrative_vi: "Anh D., 40 tuổi, nhân viên văn phòng, dạo này làm việc căng thẳng, ngủ ít, mỗi ngày uống 3–4 cốc cà phê. Hai tuần nay nhiều lần trong ngày thấy tim hẫng một nhịp rồi thịch mạnh một cái, chỉ trong vài giây, sau đó bình thường. Không thấy tim đập nhanh kéo dài. Không đau ngực, không khó thở, không choáng, không ngất. Không có bệnh tim, gia đình không ai đột tử. Chưa đo mạch."
