id: d-acute-coronary-syndrome-chest-pain-1
set: dev
title_vi: "Nam 59 tuổi hút thuốc, tăng huyết áp, tức nặng giữa ngực 25 phút lan xuống tay trái, buồn nôn"
narrative_vi: "Ông K., 59 tuổi, ở Thanh Hóa, hút thuốc lá, bị tăng huyết áp. Khoảng 25 phút trước, sau khi leo dốc về nhà, thấy tức nặng ở giữa ngực, lan xuống tay trái; ngồi nghỉ đã 20 phút vẫn không đỡ. Kèm buồn nôn. Không vã mồ hôi, không khó thở, không choáng. Cơn đau tăng dần, không dữ dội ngay từ đầu, không như xé, không lan ra sau lưng. Đau không tăng khi hít thở, ấn vào ngực không đau. Không sốt, không ho, không ợ chua. Chưa từng đau như vậy, không đái tháo đường, chưa được nói có bệnh tim."
