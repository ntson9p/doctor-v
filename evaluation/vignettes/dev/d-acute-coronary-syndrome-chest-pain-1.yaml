source:
  basis: "Hội chứng mạch vành cấp điển hình: tức nặng giữa ngực trên 15 phút, lan tay trái, buồn nôn, không đỡ khi nghỉ (NICE CG95 khuyến cáo 1.2.1.3; 2187/QĐ-BYT). NHS Chest pain: đau ngực lan ra tay, kèm buồn nôn thì gọi 999; NICE CG95 1.2.1.7: đang đau thì chuyển cấp cứu: mức 1."
