source:
  basis: "Dễ nhầm với viêm màng não (sốt kèm đau đầu dữ dội). Không cứng gáy, không thay đổi ý thức, không ban xuất huyết (NICE NG240); bệnh hai pha, chảy mũi mủ, đau mặt tăng khi cúi là viêm mũi xoang cấp (5643). Đau đầu, đau mặt dữ dội cần được khám sớm (CDC; NHS: khám gấp nếu đau nặng hoặc thuốc giảm đau không đỡ)."
