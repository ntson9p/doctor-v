title_vi: "Nam 40 tuổi đau đầu vùng trán dữ dội, sốt 38,5°C, chảy mũi mủ 11 ngày, không cứng gáy"
narrative_vi: "Anh M., 40 tuổi, ở TP.HCM. Bị sổ mũi hơn 10 ngày, đã đỡ rồi 2 ngày nay nặng lên: chảy mũi mủ đặc, nghẹt mũi, sốt 38,5°C, đau đầu dữ dội vùng trán và quanh mắt, tăng khi cúi. Cúi đầu được, cằm chạm ngực, không sợ ánh sáng, không nôn, không lú lẫn, không nhìn mờ, quanh mắt không sưng đỏ."
