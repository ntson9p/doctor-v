source:
  basis: "Dễ nhầm với đột quỵ, xuất huyết dưới nhện (đau đầu nhiều, buồn nôn ở người tăng huyết áp không điều trị), nhưng đau tăng dần, không đột ngột, không dấu hiệu thần kinh khu trú. Huyết áp từ 180/120 kèm nhìn mờ (có thể do tổn thương võng mạc): NICE NG136 khuyến cáo 1.5.2 qua quy tắc rf_extreme_bp_with_symptoms (mức 2); ICHD-3 mục 10.3; MSD (cần đánh giá tổn thương cơ quan đích)."
