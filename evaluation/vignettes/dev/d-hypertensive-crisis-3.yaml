id: d-hypertensive-crisis-3
set: dev
title_vi: "Nam 47 tuổi đau đầu nhiều vùng gáy, buồn nôn, nhìn mờ, huyết áp đo 205/125"
narrative_vi: "Anh M., 47 tuổi, ở Hà Nội, được nói là huyết áp cao từ 2 năm trước nhưng không uống thuốc. Tối nay anh đau đầu nhiều vùng gáy, tăng dần trong 3 giờ, buồn nôn, mắt nhìn mờ cả hai bên. Vợ đo huyết áp 205/125 mmHg. Đau không đến đột ngột, không phải đau dữ dội nhất từ trước tới nay. Anh tỉnh táo, nói rõ, không méo miệng, không yếu tay chân, đi lại vững. Không đau ngực, không khó thở. Không sốt, không cứng gáy."
