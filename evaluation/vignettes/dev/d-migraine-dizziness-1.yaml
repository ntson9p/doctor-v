source:
  basis: "Đau nửa đầu tiền đình theo tiêu chuẩn Bárány – IHS (Lempert 2022): ít nhất 5 đợt chóng mặt vừa hoặc nặng, mỗi đợt 5 phút đến 72 giờ, có tiền sử đau nửa đầu, phần lớn số đợt kèm đau đầu kiểu đau nửa đầu, sợ ánh sáng, sợ tiếng ồn. NHS Vertigo: chóng mặt quay hay tái lại thì khám bác sĩ (không khẩn); đau đầu không dữ dội."
