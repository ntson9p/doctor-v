id: d-migraine-dizziness-1
set: dev
title_vi: "Nữ 28 tuổi bị đau nửa đầu, một năm nay nhiều đợt quay cuồng 2–3 giờ kèm đau đầu, sợ ánh sáng"
narrative_vi: "Chị Y., 28 tuổi, bị đau nửa đầu từ năm 16 tuổi. Một năm nay có khoảng chục đợt chóng mặt quay, mỗi đợt 2–3 giờ, thường kèm đau giật giật một bên đầu, buồn nôn, khó chịu với ánh sáng và tiếng ồn. Đợt này bắt đầu một giờ trước, giống hệt các đợt trước, đau đầu mức vừa. Không ù tai, không nghe kém, không yếu tê tay chân, không nói khó, không nhìn đôi. Không do trở mình hay ngửa cổ. Không có thai, không chậm kinh."
