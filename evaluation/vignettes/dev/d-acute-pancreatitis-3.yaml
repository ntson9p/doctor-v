title_vi: "Nam 48 tuổi, hay đau dạ dày, uống bia rượu, đau vùng trên rốn liên tục lan ra sau lưng (dễ nhầm viêm loét dạ dày)"
narrative_vi: "Anh B., 48 tuổi, hay ợ chua, uống bia rượu thường xuyên. Từ sáng nay đau vùng trên rốn, liên tục, ngày càng tăng, lan ra sau lưng, ăn vào đau hơn, buồn nôn, nôn 2 lần. Đau nhiều nhưng còn chịu được. Không sốt, không tiêu chảy, không đi ngoài phân đen, không nôn ra máu."
