  basis: "Đau thượng vị ở người hay ợ chua dễ bị coi là đau dạ dày, nhưng đau liên tục, tăng dần, lan ra lưng, kèm nôn ở người uống rượu nhiều gợi ý viêm tụy cấp (ACG 2024; MSD; Nguyen 2025: rượu là nguyên nhân hàng đầu ở Chợ Rẫy). Bệnh cần điều trị tại bệnh viện (NHS)."
