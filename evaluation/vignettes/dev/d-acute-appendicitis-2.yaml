  basis: "Ca không điển hình ở người cao tuổi: đau ít hơn, không sốt, không rõ đau di chuyển (MSD: người già hay không điển hình; NHS). Người già và trẻ nhỏ thủng ruột thừa tới 97% do chẩn đoán muộn (Humes 2006), nên cần khám cấp cứu."
