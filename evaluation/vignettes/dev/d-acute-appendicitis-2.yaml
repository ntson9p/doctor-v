title_vi: "Nữ 77 tuổi, 2 ngày đau âm ỉ bụng dưới bên phải, chán ăn, không sốt"
narrative_vi: "Bà K., 77 tuổi. Hai ngày nay đau âm ỉ bụng dưới bên phải, tăng dần, ăn kém, buồn nôn, mệt. Không nhớ rõ lúc đầu đau ở đâu. Hơi đau thêm khi đi lại. Không sốt (37,2°C), không nôn, không tiêu chảy; đi ngoài ít hơn mọi ngày nhưng vẫn xì hơi được. Đau không dữ dội, không đau ngực, không đau khi đi tiểu."
