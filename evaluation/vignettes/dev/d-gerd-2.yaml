id: d-gerd-2
set: dev
title_vi: "Nữ 47 tuổi ho khan 2 tháng, nặng hơn khi nằm và về đêm, khàn tiếng, thỉnh thoảng ợ chua"
narrative_vi: "Chị V., 47 tuổi, bán hàng ở Huế. Hai tháng nay ho khan dai dẳng, ho nhiều hơn khi nằm xuống buổi tối và gần sáng, giọng khàn đi. Thỉnh thoảng thấy ợ chua, nóng rát sau xương ức sau bữa ăn. Không sốt, không sổ mũi, không đau họng, không khò khè, không khó thở. Không ho ra máu, không ra mồ hôi đêm, không sụt cân. Không hút thuốc, không đun bếp củi. Không ai trong nhà bị lao. Chưa từng bị hen. Không đau ngực. Không có thai, kinh nguyệt đều."
