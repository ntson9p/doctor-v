source:
  basis: "Ho mạn tính do trào ngược, biểu hiện ngoài thực quản: ho, khàn tiếng, nặng khi nằm, kèm ợ chua thưa (VNAGE 2026; NHS Heartburn and acid reflux). Ho từ 2 tuần thì cần khám để tìm nguyên nhân, kể cả sàng lọc lao (162/QĐ-BYT); NHS Cough: ho trên 3 tuần thì khám bác sĩ gia đình: mức 4."
