title_vi: "Nam 45 tuổi uống nhiều rượu, viêm gan B, ngất khi đi ngoài, phân đen sệt"
narrative_vi: "Anh N., 45 tuổi, uống rượu nhiều, có viêm gan B mạn. Tối qua đang đi ngoài thì nóng người, vã mồ hôi rồi ngất gục trong nhà vệ sinh, vài giây sau tỉnh. Vợ anh thấy phân đen sệt. Anh nghĩ chỉ là cường phế vị. Sáng nay vẫn còn choáng khi đứng dậy. Không nôn ra máu, không đau bụng, không đau ngực, không khó thở. Chưa đo mạch."
