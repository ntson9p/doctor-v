  basis: "Dễ nhầm với ngất tình huống khi đi ngoài (có tiền triệu, tỉnh nhanh), nhưng phân đen và bệnh gan mạn, rượu gợi ý xuất huyết tiêu hóa trên, có thể do vỡ giãn tĩnh mạch thực quản (MSD; Phuc 2024; ESC 2018: nghi chảy máu tiêu hóa là nguy cơ cao). Ngất kèm phân đen: quy tắc rf_syncope_gi_bleeding (mức 1)."
