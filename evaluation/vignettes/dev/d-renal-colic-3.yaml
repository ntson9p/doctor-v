  basis: "Sỏi niệu quản đoạn thấp có thể gây đau hố chậu phải, dễ nhầm viêm ruột thừa; đau quặn từng cơn, khởi phát đột ngột, lan xuống bẹn, không đau di chuyển từ quanh rốn, không tăng khi cử động, không chán ăn gợi ý cơn đau quặn thận (3931/QĐ-BYT mục 3.1: cơn đau niệu quản lan dọc đường đi của niệu quản xuống hố chậu, bộ phận sinh dục; STONE 2014). Khám trong ngày (NHS)."
