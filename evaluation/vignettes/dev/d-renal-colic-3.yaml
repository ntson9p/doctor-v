narrative_vi: "Anh E., 26 tuổi. Bốn giờ nay đột ngột đau quặn từng cơn bụng dưới bên phải, có lúc lan xuống bẹn phải, buồn nôn. Đau không bắt đầu từ quanh rốn, không tăng khi đi lại, không dữ dội. Không đau hông lưng, không sốt, không nôn, không tiêu chảy, không đau khi đi tiểu, vẫn ăn được. Không để ý màu nước tiểu."
