source:
  basis: "Ca điển hình theo 3610/QĐ-BYT bài 33: đốt than tổ ong sưởi trong phòng kín, nhiều người trong nhà cùng bị, khởi đầu bằng đau đầu, mệt, chóng mặt, buồn nôn; ngộ độc nhẹ dễ lầm với cảm cúm mùa đông. NHS: triệu chứng đỡ khi ra ngoài; người ngộ độc cần được kiểm tra ở bệnh viện (đo CO trong máu, thở oxy). Mức 2 theo quy tắc rf_co_exposure."
