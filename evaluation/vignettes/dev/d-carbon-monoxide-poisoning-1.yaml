id: d-carbon-monoxide-poisoning-1
set: dev
title_vi: "Nữ 45 tuổi ở Hà Nội, tháng 1, đốt than sưởi trong phòng ngủ đóng kín, sáng dậy đau đầu, chóng mặt, buồn nôn"
narrative_vi: "Chị M., 45 tuổi, ở Hà Nội. Đêm qua trời rét, cả nhà đốt than tổ ong sưởi trong phòng ngủ, đóng kín cửa. Sáng dậy chị đau đầu vừa, chóng mặt, choáng váng suốt từ sáng, buồn nôn, mệt; chồng chị cũng đau đầu. Ra sân một lúc thấy đỡ hơn. Không nôn, không ngất, không khó thở, không đau ngực, tỉnh táo, nói chuyện bình thường. Không sốt, không ho, không sổ mũi. Không có thai, không chậm kinh. Không có bệnh nền."
