source:
  basis: "Viêm phổi mắc phải ở cộng đồng điển hình ở người lớn (4235/QĐ-BYT: sốt cao, rét run, ho có đờm, đau ngực; GRACE). Tỉnh táo, dưới 65 tuổi: CURB-65 thấp, có thể điều trị ngoại trú nhưng cần khám, nghe phổi, chụp phổi trong ngày."
