notes_vi: "Quy tắc rf_fever_critical_phase_signs (sốt ngày 3–7 kèm khó thở, dành cho sốt xuất huyết) có thể nâng ca này lên mức 2; mức đúng theo hướng dẫn viêm phổi là 3."
