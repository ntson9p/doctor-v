title_vi: "Nam 52 tuổi hút thuốc, sốt 39°C ngày 3, rét run, ho đờm vàng, khó thở, đau ngực khi hít sâu"
narrative_vi: "Ông S., 52 tuổi, ở Nghệ An, hút thuốc lá 20 năm. Ba ngày nay sốt 39°C, rét run, ho nhiều, khạc đờm vàng đặc, đau ngực phải khi hít sâu và khi ho, thở mệt khi đi lại. Không sổ mũi, không đau họng. Tỉnh táo. Tự xét nghiệm COVID-19 âm tính."
