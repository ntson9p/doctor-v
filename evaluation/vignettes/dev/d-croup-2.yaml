source:
  basis: "Viêm thanh quản cấp không điển hình: trẻ lớn (tới 6 tuổi là thường gặp, Smith 2018), không sốt, tái phát (croup co thắt: MSD), ho ông ổng, khàn tiếng, nặng về đêm, không thở rít lúc ngồi yên. NHS Croup: khám khẩn hoặc gọi 111 (mức 3); chỉ đi cấp cứu khi thở rất vất vả, tím, li bì."
