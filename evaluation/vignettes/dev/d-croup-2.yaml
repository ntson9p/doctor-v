title_vi: "Bé gái 7 tuổi khó thở về đêm, ho ông ổng, khàn tiếng, không sốt"
narrative_vi: "Bé N., 7 tuổi, ở Hải Phòng, tháng 10. Từ chiều qua bé hơi khàn tiếng; đến đêm bé thức dậy vì ho ông ổng, khó thở hơn, khó thở tăng dần trong vài giờ. Bé chỉ thấy hụt hơi khi chạy nhảy, ngồi yên thì nói chuyện được bình thường; ngồi yên không có tiếng rít. Không sốt, không sổ mũi. Không khò khè, không đau ngực, không ăn uống gì lạ, không bị ong đốt, không nổi mẩn. Không sặc, hóc. Năm ngoái bé từng bị một lần giống vậy. Chưa từng được nói bị hen."
