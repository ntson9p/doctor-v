id: d-panic-disorder-2
set: dev
title_vi: "Nữ 17 tuổi lần đầu có cơn hồi hộp, run, tê tay trong giờ thi, không sợ chết"
narrative_vi: "Em H., 17 tuổi, đang làm bài thi thì bỗng tim đập nhanh, run tay, tê bì đầu ngón tay và quanh miệng, choáng váng, phải gục xuống bàn; không thấy sợ chết hay mất kiểm soát. Khoảng 20 phút sau thì hết. Đây là lần đầu. Không đau ngực, không khó thở, không ngất. Không sụt cân, không sợ nóng, không bị tiểu đường. Không có thai, không chậm kinh. Chưa đo mạch."
