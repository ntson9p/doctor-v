  basis: "Ca không điển hình (thiếu niên, cơn đầu tiên, không có cảm giác sợ chết): tiêu chuẩn cơn hoảng sợ chỉ cần 4 trong 13 triệu chứng (MSD); hồi hộp kiểu lo âu sau căng thẳng, kèm tê tay, mặt (EHRA 2011 bảng 2); cơn 5–20 phút (NHS). Không có dấu hiệu nguy hiểm; NHS, MSD: khám bác sĩ để loại trừ bệnh khác."
