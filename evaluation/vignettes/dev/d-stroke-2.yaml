title_vi: "Nữ 66 tuổi, đau vùng gáy tăng nhanh, chóng mặt, đứng không vững, nôn, không yếu liệt"
narrative_vi: "Bà Đ., 66 tuổi, bị tăng huyết áp. Hai giờ trước bắt đầu đau đầu vùng sau gáy, tăng dần trong khoảng nửa giờ thành rất đau, chóng mặt, đứng không vững, đi bị xiêu sang một bên, buồn nôn và nôn. Không méo miệng, không yếu tay chân, nói rõ, không cứng gáy."
