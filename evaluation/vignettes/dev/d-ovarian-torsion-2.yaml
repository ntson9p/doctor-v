source:
  basis: "Xoắn phần phụ ở trẻ gái hay gặp với buồng trứng bình thường, đau có thể từng đợt (xoắn không hoàn toàn), không phải lúc nào cũng dữ dội (Bridwell 2022); nôn và đau một bên gợi ý xoắn (Huchon 2012). 315/QĐ-BYT: xoắn cần mổ cấp cứu, mổ muộn khó giữ được buồng trứng; mức 2."
