title_vi: Nữ 14 tuổi đau bụng dưới bên trái từng đợt 1 ngày, nôn, không sốt
narrative_vi: Em M., 14 tuổi, đã có kinh 1 năm, kỳ kinh gần nhất cách đây 10 ngày. Từ hôm qua đau bụng dưới bên trái từng đợt, mỗi đợt đến đột ngột rồi đỡ, đau lan xuống bẹn trái, kèm buồn nôn và nôn 2 lần. Em vẫn đi lại được, không đau dữ dội. Không sốt, không tiêu chảy, không tiểu buốt, không đau khi đi tiểu. Em chưa quan hệ tình dục, không có thai. Chưa từng siêu âm buồng trứng.
