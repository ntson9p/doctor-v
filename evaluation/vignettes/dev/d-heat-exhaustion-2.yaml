source:
  basis: "Ngất do nóng (một thể của bệnh do nóng): ngất ngắn khi đứng lâu nơi nóng, có dấu hiệu báo trước, tỉnh lại ngay và hồi phục hoàn toàn (CDC NIOSH: Heat syncope; MSD Heat Exhaustion). NHS Heat: làm mát, uống nước, thường đỡ trong 30 phút; ESC 2018: ngất phản xạ có hoàn cảnh điển hình, hồi phục hoàn toàn, không có dấu hiệu nguy cơ cao thì không cần cấp cứu. Ngất lần đầu: đi khám trong vài ngày (NHS Fainting: khám bác sĩ khi ngất; mức 4, như các ca ngất phản xạ của bộ dev)."
  references: [cdc-niosh-heat-illness, msd-heat-exhaustion, nhs-heat-exhaustion-heatstroke, esc-syncope-2018, nhs-fainting]
author: "agent:pass-c"
notes_vi: "Ca không điển hình: biểu hiện bằng ngất ở thiếu niên. Ngất phản xạ được chấp nhận vì hai bệnh chồng lấn (ngất khi đứng lâu nơi nóng)."
