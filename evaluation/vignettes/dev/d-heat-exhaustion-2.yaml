id: d-heat-exhaustion-2
set: dev
title_vi: "Nữ 15 tuổi ngất khi đứng xếp hàng dưới nắng trưa ở trường, tỉnh lại ngay, còn mệt, khát"
narrative_vi: "Em N., nữ, 15 tuổi, ở Biên Hòa. Trưa nay em đứng xếp hàng tập văn nghệ ngoài sân nắng gần 2 tiếng, uống ít nước. Em thấy nóng bừng, vã mồ hôi, buồn nôn, tối sầm mắt rồi ngã xuống, bất tỉnh chưa đến 1 phút. Bạn đưa em vào phòng mát, cho uống nước; em tỉnh táo hẳn, nói chuyện, đi lại bình thường, chỉ còn mệt, khát nhiều, không đau đầu. Không co giật, không đau ngực, không hồi hộp, không khó thở. Em chưa từng ngất. Em không có thai, chưa từng quan hệ tình dục, kinh nguyệt đều."
