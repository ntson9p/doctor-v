id: d-bacterial-meningitis-2
set: dev
title_vi: "Bé trai 11 tháng, sốt cao 1 ngày, quấy khóc, nôn, thóp phồng, chưa cứng gáy"
narrative_vi: "Bé T., 11 tháng tuổi, ở TP.HCM. Từ sáng hôm qua sốt cao 39,5°C, quấy khóc, ôm vào lại khóc nhiều hơn, nôn 2 lần, bú ít hơn nhưng vẫn bú được. Mẹ sờ thấy thóp căng phồng. Bé vẫn thức, nhìn theo mẹ, không li bì, không co giật. Cổ vẫn cúi được. Không ho, không sổ mũi, không tiêu chảy, không nổi ban."
