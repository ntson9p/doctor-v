source:
  basis: "Ở trẻ nhỏ, viêm màng não thường không có cứng gáy rõ; thóp phồng là dấu hiệu gợi ý mạnh (Curtis 2010: bệnh sử thóp phồng LR 8,0; Nguyen-Huu 2022: thóp phồng 21%, cứng gáy 42%). NHS Meningitis: trẻ dưới 5 tuổi có thóp phồng thì gọi 999 hoặc đến cấp cứu; 5642: bệnh cấp cứu."
  references: [curtis-pediatrics-2010, nguyenhuu-phmt-2022, nhs-meningitis, byt-qd-5642-2015]
author: "agent:pass-c"
notes_vi: "Trẻ dưới 18 tháng nên không hỏi tiêm vắc xin sởi. Chưa có quy tắc riêng cho thóp phồng ở trẻ từ 2 tháng; mức xử trí phải đến từ xác suất của bệnh không được bỏ sót."
