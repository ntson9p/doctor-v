title_vi: Nam 20 tuổi đau bụng dưới bên phải từ 5 giờ, hỏi kỹ mới thấy tức nhẹ bìu phải
narrative_vi: Anh S., 20 tuổi. Năm giờ trước đột ngột đau bụng dưới bên phải, đau âm ỉ liên tục, lan xuống bẹn, buồn nôn. Khi được hỏi kỹ, anh nói bìu bên phải cũng tức nhẹ và hơi sưng, ngại nên không kể. Đau không bắt đầu từ quanh rốn, không tăng khi đi lại. Không sốt, không nôn, không tiêu chảy, không tiểu buốt, không đau hông lưng.
