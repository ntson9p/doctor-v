id: d-carbon-monoxide-poisoning-3
set: dev
title_vi: "Nam 38 tuổi, ăn lẩu than trong phòng kín cùng gia đình, 2 giờ sau nhiều người đau đầu, chóng mặt, nôn"
narrative_vi: "Anh S., 38 tuổi, ở Lạng Sơn. Tối nay cả nhà 5 người ăn lẩu nấu bằng bếp than trong phòng kín vì trời rét. Khoảng 2 giờ sau anh đau đầu vừa, chóng mặt liên tục, buồn nôn và nôn một lần; vợ và mẹ anh cũng đau đầu, buồn nôn, con gái nôn. Mọi người nghĩ bị ngộ độc thức ăn. Không đau bụng, không tiêu chảy, không sốt. Không ngất, không khó thở, không đau ngực, vẫn tỉnh táo. Mọi người vẫn ở trong phòng nên chưa biết ra ngoài có đỡ không."
