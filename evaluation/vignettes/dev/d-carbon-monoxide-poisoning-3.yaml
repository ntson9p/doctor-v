source:
  basis: "Dễ nhầm với ngộ độc thức ăn (viêm dạ dày – ruột cấp) vì nhiều người cùng bữa cùng buồn nôn, nôn: 3610/QĐ-BYT mục 3.4 ghi ngộ độc khí CO mức vừa dễ nhầm với ngộ độc thức ăn; bếp lẩu than trong phòng kín là nguồn khí CO (Lu 2015). Không đau bụng, không tiêu chảy, đau đầu nổi bật. Mức 2 theo NHS (người ngộ độc cần được kiểm tra ở bệnh viện) và quy tắc rf_co_exposure."
