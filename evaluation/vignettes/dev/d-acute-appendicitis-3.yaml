title_vi: "Bé trai 9 tuổi, đau bụng dưới bên phải, nôn, sốt, tiêu chảy (dễ nhầm viêm dạ dày – ruột)"
narrative_vi: "Bé M., 9 tuổi. Từ đêm qua đau bụng, sáng nay bé chỉ vào bụng dưới bên phải, đi lại khom người, kêu đau khi nhảy và khi ho. Bé nôn 2 lần, sốt 38,3°C, chán ăn, đi ngoài phân lỏng 3 lần, không có máu. Cha mẹ không rõ lúc đầu bé đau ở đâu. Không ai trong nhà bị tiêu chảy. Không ho, không đau khi đi tiểu."
