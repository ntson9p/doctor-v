source:
  basis: "Trẻ viêm ruột thừa hay sốt (độ nhạy 0,75), nôn (0,79) và có thể tiêu chảy (0,33) (Bundy 2007), dễ bị nhầm với viêm dạ dày – ruột; đau khu trú hố chậu phải, đau khi nhảy, ho (Bundy, Benabbas 2017) gợi ý viêm ruột thừa. Cần khám cấp cứu (NHS; kb-guide mục 2.5)."
