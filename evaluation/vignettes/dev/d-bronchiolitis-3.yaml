id: d-bronchiolitis-3
set: dev
title_vi: "Bé trai 9 tháng khó thở, khò khè lần đầu sau 4 ngày cảm, sốt nhẹ, dễ nhầm hen hoặc viêm phổi"
narrative_vi: "Bé Q., 9 tháng tuổi, ở Nghệ An, tháng 2. Bốn ngày trước bé sổ mũi, ho; hai ngày nay bé thở nhanh, thở mệt, nghe khò khè rõ khi thở ra. Đây là lần đầu bé khò khè, chưa từng được nói bị hen. Bé sốt nhẹ 37,8°C. Bé vẫn bú được khoảng hai phần ba, vẫn tiểu đều. Ngực không lõm sâu, không thở rên, không tím, không lúc nào ngừng thở. Không bị sặc hay hóc gì trước đó. Không ho ông ổng, không khàn tiếng. Bố hút thuốc trong nhà."
