source:
  basis: "Viêm tiểu phế quản ở trẻ dưới 1 tuổi: viêm long rồi ho, thở nhanh, khò khè lần đầu, sốt nhẹ (NICE NG9 1.1.1–1.1.4). Hen, khò khè sau nhiễm vi rút gợi ý khi khò khè tái diễn từng đợt ở trẻ lớn hơn (NG9 1.1.7); viêm phổi gợi ý khi sốt trên 39°C, ran nổ khu trú (NG9 1.1.6). Không có dấu hiệu chuyển cấp cứu (NG9 1.2.1). Mức 3: khám trong ngày (NG9 1.1.8; 3312/QĐ-BYT)."
  references: [nice-ng9, byt-qd-3312-2015]
author: "agent:pass-c"
notes_vi: "Ca dễ nhầm với hen, viêm phổi, viêm thanh quản cấp ở triệu chứng chính Khó thở."
