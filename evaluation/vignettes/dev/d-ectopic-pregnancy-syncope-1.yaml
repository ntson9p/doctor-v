title_vi: "Nữ 27 tuổi có thai 6 tuần, đau bụng dưới đột ngột dữ dội rồi ngất, da xanh"
narrative_vi: "Chị Y., 27 tuổi, chậm kinh 2 tuần, tuần trước thử que 2 vạch, chưa đi siêu âm. Sáng nay bỗng đau bụng dưới bên trái rất dữ dội rồi ngất ở nhà, khoảng một phút sau tỉnh. Hiện vẫn đau bụng, choáng khi đứng dậy, da xanh. Có ra ít máu sẫm màu ở âm đạo. Không sốt, không đau ngực, không khó thở. Tay chân không lạnh. Chưa đo mạch."
