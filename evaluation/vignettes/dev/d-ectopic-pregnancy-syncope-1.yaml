source:
  basis: "Chửa ngoài tử cung vỡ biểu hiện bằng ngất: đau bụng dưới đột ngột dữ dội, ngất, da xanh, ra máu sẫm ở người chậm kinh, thử thai dương tính (315/QĐ-BYT: choáng ngất do đau, do vỡ khối chửa; NHS Ectopic pregnancy: kết hợp đau bụng đột ngột dữ dội, ngất, da rất tái thì gọi 999 hoặc đến cấp cứu; MSD). Quy tắc rf_fainting_with_pain và rf_severe_abdominal_pain (mức 2)."
