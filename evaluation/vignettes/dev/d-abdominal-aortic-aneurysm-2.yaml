source:
  basis: "Phình động mạch chủ bụng vỡ biểu hiện không điển hình bằng choáng, đau lưng (van den Dries 2025: 10% gọi vì chóng mặt; Fernando 2022: đau lưng 53,6%, tụt huyết áp 30,9%). Người từ 60 tuổi đau hông lưng kèm da tái, tay chân lạnh: NHS gọi 999 (da tái hoặc xám), quy tắc rf_aaa_rupture_signs mức 1."
