id: d-abdominal-aortic-aneurysm-2
set: dev
title_vi: Nam 68 tuổi chóng mặt, choáng khi đứng, đau lưng hông trái từ sáng, tay chân lạnh
narrative_vi: Ông H., 68 tuổi, hút thuốc lào, bị tăng huyết áp. Từ sáng, cứ ngồi dậy hoặc đứng lên là choáng, tối sầm mắt vài giây, phải ngồi xuống; nằm yên thì đỡ. Kèm đau âm ỉ vùng hông lưng trái, không đau bụng nhiều. Người nhà thấy ông tái, sờ tay chân lạnh. Không thấy mọi vật quay, không nhìn đôi, không yếu tay chân, không nói khó, không đau đầu, không đau ngực, không khó thở, không sốt, không đi ngoài phân đen, không nôn. Chưa đo mạch, huyết áp.
