id: d-pertussis-1
set: dev
title_vi: "Bé gái 8 tuổi ho 3 tuần, từng cơn dồn dập, rít khi hít vào, nôn sau ho"
narrative_vi: "Bé L., 8 tuổi, ở Hà Nội, đã tiêm đủ các mũi vắc xin 5 trong 1 khi còn nhỏ. Ba tuần trước bé sổ mũi, ho nhẹ như cảm lạnh. Từ tuần thứ hai bé ho thành từng cơn dồn dập, ho đỏ mặt, chảy nước mắt; cuối cơn hít vào có tiếng rít như gà gáy, có lần nôn ra sau cơn ho. Cơn ho hay nặng về đêm. Giữa các cơn bé chơi bình thường, không khó thở, không sốt, không khò khè. Nay hết sổ mũi. Anh trai 12 tuổi cũng đang ho kéo dài."
