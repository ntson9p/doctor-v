source:
  basis: "Ho gà điển hình ở trẻ đi học đã tiêm lúc nhỏ: giai đoạn viêm long rồi ho từng cơn, tiếng rít khi hít vào, nôn sau ho, kéo dài từ 2 tuần (định nghĩa ca lâm sàng của WHO; MSD Pertussis). Wang 2014: 20% trẻ 5–15 tuổi ho 2–8 tuần là ho gà, kể cả trẻ đã tiêm đủ. Mức 3: khám trong 24 giờ để được xét nghiệm, kháng sinh trong 3 tuần đầu giúp hạn chế lây (NHS Whooping cough); không có dấu hiệu cần cấp cứu."
  references: [who-emro-pertussis-surveillance, msd-pertussis, nhs-whooping-cough, wang-bmj-2014]
