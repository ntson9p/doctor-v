source:
  basis: "Dễ nhầm với cường giáp (cùng run tay, vã mồ hôi, hồi hộp), nhưng triệu chứng thành cơn rời rạc 10–20 phút, có cảm giác sợ hãi dữ dội và tê bì, giữa các cơn bình thường, không sụt cân, không sợ nóng, không bướu cổ (NHS Panic disorder; 3879/QĐ-BYT: cường giáp có nhịp tim nhanh thường xuyên, sụt cân, sợ nóng). MSD: khám để loại trừ cường giáp."
