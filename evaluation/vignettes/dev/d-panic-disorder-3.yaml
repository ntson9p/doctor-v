id: d-panic-disorder-3
set: dev
title_vi: "Nữ 30 tuổi hay có cơn hồi hộp, run, vã mồ hôi từng lúc, giữa các cơn bình thường"
narrative_vi: "Chị V., 30 tuổi, ba tháng nay hay có cơn bỗng sợ hãi dữ dội, tim đập nhanh, run tay, vã mồ hôi, tê bì đầu ngón tay, mỗi cơn khoảng 10–20 phút rồi hết; giữa các cơn chị hoàn toàn bình thường. Người nhà nghi chị bị cường giáp. Chị không sụt cân, không sợ nóng, cổ không to, mắt không lồi, không tiêu chảy. Không đau ngực, không khó thở, không ngất. Không có thai, kinh nguyệt đều. Chưa đo mạch."
