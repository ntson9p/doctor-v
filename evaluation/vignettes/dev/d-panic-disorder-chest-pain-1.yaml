id: d-panic-disorder-chest-pain-1
set: dev
title_vi: "Nữ 27 tuổi đau nhói ngực trái vài phút trong cơn sợ hãi, tim đập nhanh, run, tê tay; đã từng bị"
narrative_vi: "Chị H., 27 tuổi, ở Thành phố Hồ Chí Minh, đang lo lắng vì công việc. Chiều nay khi đang họp, chị đột ngột sợ hãi dữ dội, tim đập nhanh, run tay, tê bì đầu ngón tay, kèm đau nhói ở ngực trái. Cơn đau kéo dài khoảng 5 phút rồi hết, không lan đi đâu, ấn vào ngực không đau. Chị không khó thở, không vã mồ hôi, không buồn nôn, không choáng. Đau không liên quan gắng sức, không tăng khi hít sâu. Hai tháng nay chị có ba cơn giống vậy. Không hút thuốc, không dùng thuốc tránh thai, không sưng chân. Không có thai, kinh nguyệt đều."
