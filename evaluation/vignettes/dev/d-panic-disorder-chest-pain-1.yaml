  basis: "Cơn hoảng sợ tái diễn có đau ngực ngắn: sợ hãi dữ dội đột ngột, tim nhanh, run, tê bì (NHS Panic disorder; MSD). NHS Chest pain: đau ngực đã hết nhanh, đến rồi đi, không kèm khó thở, vã mồ hôi, buồn nôn, đau lan thì khám bác sĩ gia đình; NHS Panic disorder: khám bác sĩ gia đình (mức 4)."
