source:
  basis: "Người đái tháo đường sốt cao rét run 6 ngày, đau hạ sườn phải, không ban, không xuất huyết: áp xe gan do vi khuẩn (Yu 2022: rét run 74,7%; Mai-Phan 2026). Sốt xuất huyết ngày 6 cũng có đau vùng gan, nhưng rét run kéo dài, không ban, đái tháo đường gợi ý áp xe gan. Cần siêu âm, xét nghiệm trong ngày (mức 3)."
