title_vi: Nữ 60 tuổi tiểu đường, sốt 6 ngày, rét run, đau tức dưới sườn phải, không vàng da (dễ nhầm sốt xuất huyết)
narrative_vi: Bà I., 60 tuổi, bị tiểu đường, sống ở TP. Hồ Chí Minh, mùa mưa. Sáu ngày nay sốt cao kèm rét run, đau nhức người, mệt. Ba ngày nay đau tức dưới sườn phải. Khu phố có vài người bị sốt xuất huyết. Không phát ban, không chảy máu chân răng, không nôn, không vàng da, không ho, không tiểu ít.
