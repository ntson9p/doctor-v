title_vi: "Nam 52 tuổi ở Phú Thọ, sốt 8 ngày, ho, hơi khó thở, có vết loét vảy đen ở nách"
narrative_vi: "Ông T., 52 tuổi, làm vườn đồi ở Phú Thọ. Tám ngày nay sốt cao, đau đầu, đau mỏi người, ho khan, hai ngày nay thấy hơi khó thở khi đi lại nhưng vẫn nói trọn câu. Vợ thấy ở nách có vết loét đóng vảy đen không đau và hạch nhỏ ở nách. Không đau ngực, không đau họng, không sổ mũi, không đau bụng, không nổi ban. Tỉnh táo, tự đi lại được, tay chân ấm."
