title_vi: "Nữ 72 tuổi không hút thuốc, đun bếp củi 40 năm, ho đờm nhiều năm, 5 ngày ho và khó thở tăng"
narrative_vi: "Bà N., 72 tuổi, ở Phú Thọ, không hút thuốc, nấu bếp củi trong nhà hơn 40 năm. Bà ho khạc đờm mỗi sáng đã nhiều năm, đi nhanh hay hụt hơi, nhưng chưa từng đi khám phổi. Năm ngày nay ho nhiều hơn, đờm đặc và nhiều hơn, khò khè, đi lại trong nhà cũng mệt. Ngồi nghỉ thì đỡ, nói được cả câu. Không sốt, không đau ngực, không phù chân, không sụt cân, không ra mồ hôi đêm, không ho ra máu."
