title_vi: Nam 16 tuổi chưa biết bị tiểu đường, nôn, đau bụng, mệt, gầy sút, khát nhiều (dễ nhầm viêm dạ dày – ruột)
narrative_vi: Em H., 16 tuổi, chưa từng được nói bị tiểu đường. Ba tuần nay em hay khát, uống nhiều nước, đi tiểu nhiều cả đêm, gầy đi rõ. Từ hôm qua đau bụng âm ỉ khắp bụng, buồn nôn, nôn 3 lần, rất mệt. Mẹ nghĩ em bị ngộ độc thức ăn. Không tiêu chảy, không sốt, người ăn cùng không ai bị. Chưa đo đường huyết.
