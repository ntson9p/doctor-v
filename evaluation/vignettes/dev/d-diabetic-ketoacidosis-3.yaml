  basis: "Đái tháo đường típ 1 khởi phát bằng nhiễm toan ceton ở thiếu niên (Bich 2025: 57,8% trẻ Việt Nam có nhiễm toan lúc chẩn đoán; 89,1% uống nhiều, đái nhiều, sụt cân); 3312/QĐ-BYT: đau bụng, nôn giống bệnh ngoại khoa. NHS Type 1 diabetes: tiểu nhiều, khát, mệt kèm đau bụng, nôn thì gọi 999 hoặc đến cấp cứu (mức 2)."
