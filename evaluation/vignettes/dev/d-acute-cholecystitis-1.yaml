id: d-acute-cholecystitis-1
set: dev
title_vi: "Nữ 52 tuổi, có sỏi mật, đau dưới sườn phải 14 giờ lan lên vai phải, sốt, nôn"
narrative_vi: "Chị V., 52 tuổi, đã được siêu âm thấy sỏi túi mật. Tối qua sau bữa ăn nhiều dầu mỡ bắt đầu đau dưới sườn phải, tăng dần, đến nay đã liên tục 14 giờ, lan lên vai phải. Sốt 38,3°C, buồn nôn, nôn 2 lần, chán ăn; ăn vào đau hơn. Không vàng da, không tiêu chảy, không rét run. Đau nhiều nhưng vẫn chịu được. Đã mãn kinh, không có thai, không ra máu âm đạo."
