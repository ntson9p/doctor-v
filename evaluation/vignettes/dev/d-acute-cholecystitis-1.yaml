source:
  basis: "Ca điển hình: đau hạ sườn phải kéo dài trên 6 giờ, lan lên vai phải, sốt, nôn, có sỏi túi mật (MSD; NHS Acute cholecystitis). Bệnh cần nhập viện, truyền dịch, kháng sinh và thường mổ cắt túi mật sớm (MSD; Gallaher 2022), nên cần đến cơ sở cấp cứu."
