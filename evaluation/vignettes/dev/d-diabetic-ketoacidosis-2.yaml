id: d-diabetic-ketoacidosis-2
set: dev
title_vi: "Nữ 79 tuổi tiểu đường, sốt 2 ngày, khát nhiều, tiểu nhiều, mệt, choáng khi đứng, đường huyết rất cao"
narrative_vi: "Bà G., 79 tuổi, bị tiểu đường típ 2 uống thuốc, sống một mình. Hai ngày nay bà sốt nhẹ, mệt, chán ăn. Bà khát nước nhiều, đi tiểu nhiều, đứng dậy là choáng, tối sầm mắt. Con gái đến thăm đo đường huyết được 32 mmol/L. Bà vẫn nhận ra người nhà, trả lời đúng. Không nôn, không đau bụng, không ho, không khó thở, không tiểu buốt, không đau đầu, không phát ban."
