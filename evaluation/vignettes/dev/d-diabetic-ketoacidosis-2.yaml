source:
  basis: "Tăng áp lực thẩm thấu ở người cao tuổi đái tháo đường típ 2, khởi phát sau một nhiễm trùng: khát, tiểu nhiều, mất nước gây choáng tư thế, đường huyết rất cao, chưa rối loạn ý thức (3879/QĐ-BYT bài Hôn mê tăng áp lực thẩm thấu: hay gặp trên 60 tuổi, ngay sau nhiễm trùng cấp; 5481/QĐ-BYT Phần 7: biến chứng cấp đe dọa tính mạng). Cần đến cấp cứu (mức 2)."
  references: [byt-qd-3879-2014, byt-qd-5481-2020]
author: "agent:pass-c"
notes_vi: "Ca không điển hình: thể tăng áp lực thẩm thấu ở người rất cao tuổi, triệu chứng chính là sốt nhẹ, không nôn, không đau bụng. Bản đầu của lượt C chọn triệu chứng chính Chóng mặt với kiểu chóng mặt liên tục; khi đó quy tắc chóng mặt liên tục ở người có nguy cơ mạch máu dừng phiên trước khi hỏi khát nhiều, nên đổi sang bối cảnh nhiễm trùng khởi phát (xem biên bản)."
