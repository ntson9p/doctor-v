id: d-anaphylaxis-1
set: dev
title_vi: "Nam 28 tuổi, 20 phút sau ăn tôm nổi mề đay khắp người, khó thở, khò khè, tức ngực"
narrative_vi: "Anh D., 28 tuổi, ở Quảng Ninh. Khoảng 20 phút sau bữa tối có tôm, anh nổi mẩn đỏ gồ thành mảng, rất ngứa, lan nhanh khắp người, hai mí mắt sưng. Vài phút sau anh thấy khó thở, thở khò khè, tức nặng ngực, ngồi nghỉ cũng khó thở; chóng mặt như muốn ngất khi đứng dậy. Môi, lưỡi không sưng. Người nhà thấy anh khó thở ngay sau khi ăn nên chọn mục dị ứng nặng ở màn đầu tiên."
