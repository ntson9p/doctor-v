title_vi: "Nam 35 tuổi, từng bị sỏi, đột ngột đau quặn hông lưng trái lan xuống bẹn, nước tiểu hồng"
narrative_vi: "Anh C., 35 tuổi, hai năm trước từng bị sỏi thận. Cách đây 3 giờ đột ngột đau quặn từng cơn ở hông lưng trái, lan ra bụng dưới bên trái và xuống bìu, đi lại không yên. Buồn nôn, nôn 1 lần, nước tiểu hơi hồng. Không sốt, không đau khi đi tiểu, không tiêu chảy. Đau nhiều nhưng vẫn chịu được."
