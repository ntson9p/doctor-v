source:
  basis: "Ca điển hình: cơn đau quặn thận đột ngột ở hố thắt lưng một bên, lan ra trước, xuống bẹn, bộ phận sinh dục, không có tư thế giảm đau, buồn nôn, nôn (3931/QĐ-BYT, bài Sỏi thận tiết niệu; STONE 2014). Không sốt: khám trong ngày để giảm đau, siêu âm (NHS Kidney stones: khám khẩn hoặc gọi 111)."
