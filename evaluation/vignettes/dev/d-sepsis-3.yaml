title_vi: "Nam 35 tuổi ở Bình Dương, tháng 9, sốt rét run 2 ngày như cúm, nay tay chân lạnh, da nổi vân"
narrative_vi: "Anh B., 35 tuổi, ở Bình Dương. Hai ngày nay sốt cao 39,8°C, rét run, đau đầu, đau mỏi khắp người như cúm, nôn 2 lần. Chiều nay tay chân lạnh, da tay chân nổi vân tím, thở nhanh, vẫn tỉnh và trả lời được. Không ho, không đau họng, không sổ mũi, không đau bụng, không tiêu chảy. Không nổi chấm đỏ, không chảy máu chân răng. Khu phố đang có sốt xuất huyết."
