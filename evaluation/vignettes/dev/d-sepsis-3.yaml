source:
  basis: "Nhiễm khuẩn huyết có dấu hiệu giảm tưới máu (tay chân lạnh, da nổi vân) và thở nhanh ngay ngày thứ 2 của sốt; dễ nhầm với sốc sốt xuất huyết (thường ngày 3–7, 2760 mục II.2) giữa mùa dịch. NHS Sepsis: da tái, xám hoặc loang lổ, thở rất nhanh thì gọi 999; 5642: sốc nhiễm khuẩn, tử vong 20–50%."
