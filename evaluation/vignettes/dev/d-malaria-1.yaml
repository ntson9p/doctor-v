title_vi: "Nam 32 tuổi ở Gia Lai, ngủ rẫy trong rừng, sốt thành cơn kèm rét run"
narrative_vi: "Anh K., 32 tuổi, ở Gia Lai, tuần trước ngủ lại rẫy trong rừng nhiều đêm để phát cỏ. Bốn ngày nay có cơn rét run cầm cập, sau đó sốt cao 39,5°C rồi vã mồ hôi, cách ngày lại lên cơn. Đau đầu, đau mỏi người, mệt, chán ăn, buồn nôn. Không ho, không sổ mũi, không đau họng, không đau bụng, không tiêu chảy, không nổi ban. Đã xem khắp người, không thấy vết loét đóng vảy đen. Không vàng da."
