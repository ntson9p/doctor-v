title_vi: "Nam 35 tuổi ở Quảng Nam, đi rừng lấy măng, sốt 5 ngày, không thấy vết loét"
narrative_vi: "Anh D., 35 tuổi, ở Quảng Nam. Hai tuần trước vào rừng lấy măng, không phát cỏ. Năm ngày nay sốt cao 39°C, đau đầu, đau mỏi người, ho khan, hai mắt đỏ. Đã tự xem nhưng không thấy vết loét nào, chưa nhờ ai xem lưng và bẹn. Không rét run thành cơn, không đau họng, không sổ mũi, không đau bụng, không tiêu chảy, không nổi ban. Không khó thở."
