source:
  basis: "Ca không điển hình: không tìm thấy vết loét (5642: khi không có vết loét, chẩn đoán khó, dễ nhầm với nhiều bệnh sốt cấp), phơi nhiễm là đi rừng thay vì phát cỏ (Le-Viet 2019: 47% người sốt mò ở Quảng Nam có đi rừng). Sốt kèm phơi nhiễm vùng rừng cần xét nghiệm sốt rét trong ngày (3377); sốt mò điều trị kháng sinh uống: đi khám trong 24 giờ."
