source:
  basis: "Hạ đường huyết nặng ở người cao tuổi tiêm insulin sau bữa tối ăn rất ít: vã mồ hôi đầm đìa, run, lú lẫn, nói không rõ, lơ mơ lúc sáng sớm, không tự ngồi dậy được. NHS Low blood sugar: hạ đường huyết nặng, đáp ứng không bình thường hoặc bất tỉnh mà không có hoặc không biết tiêm glucagon thì gọi 999; người không tỉnh táo thì không cho ăn uống, đặt nằm nghiêng an toàn. Mức 1."
  references:
    - nhs-hypoglycaemia
author: "agent:vignette-holdout"
notes_vi: "Ca cấp cứu khó: người nhà trả lời 'có' câu dấu hiệu đột quỵ vì ông nói không rõ; hạ đường huyết có thể giống đột quỵ. Người bệnh đang lơ mơ nên không kể được dấu hiệu trước khi lịm đi. Ông vẫn mở mắt khi gọi nên câu bất tỉnh trả lời 'không'."
