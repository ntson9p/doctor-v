title_vi: "Nam 70 tuổi tiêm insulin, tối qua ăn rất ít; 5 giờ sáng vợ thấy vã mồ hôi đầm đìa, run, ú ớ nói không rõ, lúc mở mắt lúc lịm đi"
narrative_vi: "Ông L., 70 tuổi, ở Hạ Long (Quảng Ninh), bị đái tháo đường típ 2, tiêm insulin hai lần mỗi ngày. Tối qua ông mệt, ăn rất ít, nhưng vẫn tiêm đủ liều insulin buổi tối. Khoảng 5 giờ sáng nay, vợ thấy ông nằm vã mồ hôi đầm đìa, người run, gọi thì ông ú ớ, nói không rõ, lẫn lộn, không tự ngồi dậy được, lúc mở mắt lúc lịm đi. Bà lo ông bị đột quỵ. Nhà không có máy đo đường huyết, cũng không có thuốc tiêm glucagon. Ông không co giật, vẫn thở đều, không sốt."
