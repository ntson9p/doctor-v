id: d-herpes-zoster-3
set: dev
title_vi: "Nam 63 tuổi hút thuốc, tăng huyết áp, đau rát ngực trái 2 ngày, sáng nay thấy vài đám nốt đỏ dưới vú trái"
narrative_vi: "Ông Đ., 63 tuổi, ở Hà Nam, hút thuốc lá, bị tăng huyết áp, sợ bị bệnh tim. Hai ngày nay đau rát, nhói từng cơn ở ngực trái, đau cả ngày, chạm vào da cũng đau. Sáng nay vợ thấy vài đám nốt đỏ có mụn nước nhỏ ở dưới vú trái, chỉ một bên. Đau không phải tức nặng giữa ngực, không lan ra tay hay hàm, không tăng khi gắng sức. Không khó thở, không vã mồ hôi, không buồn nôn, không choáng. Không sốt, không ho. Không đái tháo đường, chưa được nói có bệnh tim."
