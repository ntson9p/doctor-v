source:
  basis: "Zona vùng ngực ở người có yếu tố nguy cơ tim mạch, dễ nhầm với đau do bệnh tim: giai đoạn khởi phát cần phân biệt với đau do bệnh tim (75/QĐ-BYT); khám thành ngực tìm zona khi đau ngực (4235/QĐ-BYT). Đã nổi mụn nước thành đám một bên theo dải; không có dấu hiệu nguy hiểm. NHS Shingles: gặp dược sĩ trong 3 ngày từ khi nổi ban: mức 4."
  references: [byt-qd-75-2015, byt-qd-4235-2012, nhs-shingles]
