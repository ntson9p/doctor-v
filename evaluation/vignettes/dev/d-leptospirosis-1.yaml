source:
  basis: "Bệnh do Leptospira thể không vàng da: sốt đột ngột, rét run, đau đầu, đau cơ khi ấn rõ nhất ở bắp chân, đỏ kết mạc, sau lội nước bùn sau lũ (WHO 2003 chương II; CDC). Chưa có vàng da, tiểu ít, chảy máu, khó thở nên không thuộc thể nặng (rf_lepto_severe). WHO: dùng kháng sinh ngay khi nghi, tốt nhất trước ngày thứ 5: khám trong 24 giờ (mức 3)."
  references: [who-leptospirosis-2003, cdc-leptospirosis-clinical, levett-cmr-2001]
