id: d-leptospirosis-1
set: dev
title_vi: "Nam 40 tuổi ở Quảng Nam, tháng 10, dọn bùn sau lũ, sốt cao 4 ngày, đau nhiều bắp chân, đỏ mắt"
narrative_vi: "Anh S., 40 tuổi, làm ruộng ở Quảng Nam. Khoảng 10 ngày trước anh lội nước, dọn bùn sau trận lũ, chân có vết xước. Bốn ngày nay anh sốt đột ngột 39,5°C, rét run, đau đầu nhiều, đau nhức khắp người, đau nhất ở hai bắp chân, bóp vào rất đau; hai mắt đỏ nhưng không có ghèn. Không vàng da, nước tiểu bình thường, không chảy máu chân răng, không nổi ban. Không ho, không khó thở, không nôn, không tiêu chảy, không đau bụng. Không đi rừng, quanh nhà không ai bị sốt xuất huyết."
