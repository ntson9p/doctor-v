id: d-transient-ischemic-attack-1
set: dev
title_vi: "Nam 69 tuổi, tăng huyết áp, đái tháo đường, 2 ngày trước chóng mặt kèm nói ngọng, tê tay 20 phút"
narrative_vi: "Ông Đ., 69 tuổi, bị tăng huyết áp và đái tháo đường, uống thuốc hạ đường huyết. Hai ngày trước đang ngồi xem ti vi thì đột ngột thấy mọi vật quay, nói ngọng, tê bàn tay trái, khoảng 20 phút thì hết hẳn. Hôm nay không còn triệu chứng nhưng con cái lo nên kiểm tra. Không đau đầu, không nhìn đôi, đi lại bình thường, không ngất. Không run tay, không vã mồ hôi, ăn uống đều bữa. Chưa đo đường huyết."
