source:
  basis: "Cơn thiếu máu não thoáng qua điển hình: triệu chứng thần kinh khu trú khởi phát đột ngột (nói ngọng, tê nửa người, chóng mặt), hết trong 24 giờ (3312/QĐ-BYT bài 1; NHS TIA). Nguy cơ cao (ABCD2: tuổi, huyết áp, đái tháo đường, rối loạn lời nói, kéo dài 10–59 phút): 3312/QĐ-BYT khuyên điều trị dự phòng ngay, tối ưu trong 24 giờ đầu, tối đa 7 ngày đầu, nên đến cơ sở cấp cứu ngay (quy tắc rf_transient_neuro). Đột quỵ nhẹ là chẩn đoán phân biệt chấp nhận được."
