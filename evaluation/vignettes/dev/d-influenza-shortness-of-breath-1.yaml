id: d-influenza-shortness-of-breath-1
set: dev
title_vi: "Nữ 45 tuổi chọn Khó thở: cúm ngày 3, sốt, ho, đau nhức người, nay hụt hơi khi đi lại"
narrative_vi: "Chị D., 45 tuổi, ở Hải Dương, tháng 2. Ba ngày nay sốt 38,8°C, rét run, đau nhức khắp người, mệt, ho khan, đau họng, sổ mũi; chồng vừa được chẩn đoán cúm. Từ hôm qua thấy hụt hơi khi đi lại, tăng dần, ngồi nghỉ thì đỡ, nói được cả câu. Không đau ngực, không khò khè, không phù chân. Không có thai, không chậm kinh. Không có bệnh nền, không hút thuốc. Tự xét nghiệm COVID-19 âm tính."
