source:
  basis: "Cúm có khó thở khi gắng sức từ ngày thứ 3: 1840/QĐ-BYT xếp khó thở vào dấu hiệu cúm nặng hoặc biến chứng, cần khám để loại viêm phổi; chưa có khó thở lúc nghỉ, không thuộc nhóm nguy cơ: khám trong 24 giờ (quy tắc rf_fever_breathing)."
