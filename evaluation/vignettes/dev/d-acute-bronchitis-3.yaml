source:
  basis: "Viêm phế quản cấp gây hụt hơi khi gắng sức, dễ nhầm với cơn hen (khò khè) và viêm phổi; viêm phế quản cấp là chẩn đoán hay gặp nhất ở người đi khám vì khó thở (Frese 2011). NHS Bronchitis: khó thở thì khám bác sĩ gia đình khẩn hoặc gọi 111 (mức 3)."
  references: [frese-jcmr-2011, kinkade-afp-2016, nhs-bronchitis]
author: "agent:pass-c"
notes_vi: "Ca dễ nhầm với hen (khò khè, khó thở) nhưng không có tiền sử hen, không có cơn tái lại, không nặng về đêm, có bối cảnh nhiễm vi rút."
