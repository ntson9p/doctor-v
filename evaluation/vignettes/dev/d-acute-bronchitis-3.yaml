id: d-acute-bronchitis-3
set: dev
title_vi: "Nữ 40 tuổi chọn Khó thở: hụt hơi khi leo cầu thang, ho đờm 6 ngày sau cảm, hơi khò khè"
narrative_vi: "Chị V., 40 tuổi, ở Đà Nẵng, không hút thuốc. Sáu ngày nay ho có đờm sau một đợt sổ mũi, đau họng; hai ngày nay thấy hụt hơi khi leo cầu thang, ngồi nghỉ thì bình thường, nói chuyện được bình thường. Lúc ho nhiều nghe hơi khò khè. Khó thở tăng dần trong vài ngày, không đột ngột. Không sốt, không đau ngực, không tức ngực, không hồi hộp, không sưng chân. Chưa từng bị hen, chưa từng có cơn khó thở như vậy, không khó thở về đêm. Không có thai, không chậm kinh. Bác sĩ khám sau đó: nghe phổi có ít ran rít, không có ran nổ, SpO2 98%."
