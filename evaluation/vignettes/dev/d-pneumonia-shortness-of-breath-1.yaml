title_vi: "Nữ 76 tuổi chọn Khó thở: 2 ngày sốt 38,5°C, ho đờm, khó thở cả khi ngồi nghỉ"
narrative_vi: "Bà K., 76 tuổi, ở Bắc Ninh, có tăng huyết áp. Hai ngày nay sốt 38,5°C, ho khạc đờm đục, mệt nhiều. Từ hôm qua khó thở tăng dần, nay ngồi nghỉ cũng thở mệt nhưng vẫn nói được cả câu. Không đau ngực, không khò khè, không phù chân, nằm đầu thấp được. Vẫn tỉnh táo, trả lời đúng. Không hút thuốc, không có bệnh phổi."
