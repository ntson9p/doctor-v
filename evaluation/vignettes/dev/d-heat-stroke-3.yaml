source:
  basis: "Dễ nhầm với đột quỵ, viêm não: lú lẫn, đi loạng choạng (MSD: dấu hiệu sớm của sốc nhiệt), sốt cao sau nhiều giờ lao động dưới nắng, không có dấu hiệu đột quỵ khu trú, khởi phát cùng lúc với phơi nắng (MSD Heatstroke; NHS: lú lẫn, mất phối hợp là dấu hiệu sốc nhiệt, 'Call 999 now'). Mức 1."
