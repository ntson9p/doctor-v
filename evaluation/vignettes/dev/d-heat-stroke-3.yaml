id: d-heat-stroke-3
set: dev
title_vi: "Nam 45 tuổi làm đồng giữa trưa ở Đồng Tháp, đau đầu, rồi nói lảm nhảm, đi loạng choạng, người rất nóng"
narrative_vi: "Ông C., 45 tuổi, làm ruộng ở Đồng Tháp. Trưa nay ông phun thuốc ngoài đồng nhiều giờ dưới nắng gắt. Ông về nhà kêu đau đầu, chóng mặt, sau đó nói lảm nhảm, đi loạng choạng không vững, người rất nóng, đo nách 40°C. Vợ thấy mặt không méo, hai tay vẫn giơ lên đều, nhưng ông trả lời không đúng câu hỏi. Không co giật. Ông chưa từng đau đầu kiểu này, không đột ngột dữ dội. Không có bệnh nền. Ông mặc đồ bảo hộ, đeo khẩu trang khi phun, không nôn, không chảy nước dãi, không vã mồ hôi."
