source:
  basis: "Sởi giai đoạn khởi phát (viêm long: sốt cao, ho, chảy mũi, viêm kết mạc) trước khi mọc ban, ở trẻ chưa tiêm vắc xin, có tiếp xúc người bệnh sởi trong thời gian ủ bệnh (1019/QĐ-BYT mục 2.1.1, 2.4.1). NHS Measles: nghĩ con bị sởi hoặc chưa tiêm mà tiếp xúc gần thì khám khẩn (mức 3); rf_measles_contact_fever."
