id: d-measles-fever-1
set: dev
title_vi: "Bé gái 2 tuổi chưa tiêm vắc xin sởi, sốt cao 3 ngày, ho, chảy mũi, đỏ mắt, chưa nổi ban; anh trai đang bị sởi"
narrative_vi: "Bé P., 2 tuổi, ở Hà Nội, chưa được tiêm vắc xin sởi. Anh trai 5 tuổi bị sởi, mọc ban cách đây 11 ngày. Ba ngày nay bé sốt 39,2°C, ho nhiều, chảy nước mũi, hai mắt đỏ, chảy nước mắt, quấy khóc. Bé chưa nổi ban. Bé vẫn bú, uống được, không nôn, không tiêu chảy, không thở nhanh, không li bì, không co giật. Không có phỏng nước ở tay chân, không loét miệng."
