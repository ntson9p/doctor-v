narrative_vi: "Bé F., 24 tháng, đi nhà trẻ ở TP.HCM, đã tiêm đủ 2 mũi vắc xin sởi. Lớp bé có 2 bạn đang nghỉ vì tay chân miệng. Hôm nay bé sốt 38,2°C, chảy nhiều nước dãi, bỏ ăn vì đau miệng; trong miệng có vài vết loét, lòng bàn tay, bàn chân và mông có nốt phỏng nước nhỏ. Bé không giật mình, không nôn, không li bì, vẫn uống được."
