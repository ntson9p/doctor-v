source:
  basis: "Nhiễm khuẩn huyết từ đường tiết niệu ở người cao tuổi có đái tháo đường (5642 bài Nhiễm khuẩn huyết: yếu tố nguy cơ, sốt rét run, thở nhanh, thay đổi ý thức, thiểu niệu). NHS Sepsis: lú lẫn, thở rất nhanh thì gọi 999 (tương ứng gọi 115)."
  references: [byt-qd-5642-2015, nhs-sepsis]
author: "agent:pass-c"
notes_vi: "Chấp nhận viêm thận – bể thận vì là ổ nhiễm khuẩn khởi điểm; mô hình một bệnh chia xác suất giữa hai tình trạng."
