id: d-sepsis-1
set: dev
title_vi: "Nữ 72 tuổi, đái tháo đường, sốt rét run 2 ngày, nay lú lẫn, thở nhanh"
narrative_vi: "Bà S., 72 tuổi, ở Nghệ An, bị đái tháo đường. Ba ngày trước tiểu buốt, tiểu rắt. Hai ngày nay sốt cao 39,5°C kèm rét run, hôm nay nói lẫn lộn, không nhận ra con cháu, thở nhanh, đi tiểu rất ít. Không ho, không đau ngực, không nổi ban."
