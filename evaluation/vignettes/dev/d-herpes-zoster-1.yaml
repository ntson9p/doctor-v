source:
  basis: "Bệnh zona vùng ngực điển hình: tiền triệu đau rát, châm chích trên một vùng da 1–5 ngày, rồi mảng đỏ, mụn nước thành đám theo dải, một bên (75/QĐ-BYT bài Bệnh zona; NHS Shingles). NHS: người từ 18 tuổi gặp dược sĩ, cố gắng trong 3 ngày từ khi nổi ban (không khẩn); thuốc kháng vi rút tốt nhất trong 72 giờ (75/QĐ-BYT): mức 4."
