id: d-herpes-zoster-1
set: dev
title_vi: "Nữ 68 tuổi đau rát thành dải ngực phải 3 ngày, hôm qua nổi mụn nước thành đám một bên"
narrative_vi: "Bà C., 68 tuổi, ở Nam Định. Ba ngày nay thấy đau rát, châm chích ở một dải da bên ngực phải, áo cọ vào cũng đau, đau nhiều về đêm. Hôm qua chỗ đó nổi các mảng đỏ có mụn nước thành đám, chỉ ở bên phải, không ngứa nhiều. Chạm hoặc ấn vào chỗ đó thấy đau. Đau không lan ra tay, hàm, không tức nặng giữa ngực, không đau khi gắng sức. Không khó thở, không vã mồ hôi, không buồn nôn. Không sốt, không ho. Không có bệnh làm giảm sức đề kháng, không đái tháo đường. Chưa từng bị như vậy. Mắt bình thường."
