title_vi: "Nữ 34 tuổi, tức bụng dưới lệch phải, tiểu buốt, tiểu nhiều lần, buồn nôn (dễ nhầm viêm ruột thừa)"
narrative_vi: "Chị S., 34 tuổi. Từ hôm qua tức bụng dưới, lệch sang bên phải, đi tiểu buốt và nhiều lần, hơi buồn nôn. Không sốt, không đau hông lưng, không nôn, vẫn ăn được. Đau không chuyển từ quanh rốn xuống, không tăng khi đi lại, không dữ dội. Không có thai, không chậm kinh, không ra khí hư bất thường, không ra máu âm đạo, không đau khi quan hệ."
