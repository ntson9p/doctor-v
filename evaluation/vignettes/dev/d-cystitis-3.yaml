source:
  basis: "Đau bụng dưới lệch phải kèm buồn nôn dễ nhầm viêm ruột thừa, nhưng tiểu buốt, tiểu nhiều lần, không sốt, không đau di chuyển, không đau tăng khi cử động, không chán ăn phù hợp viêm bàng quang (3931/QĐ-BYT; Bent 2002; NHS Appendicitis). Phụ nữ không có thai, không sốt: khám trong vài ngày (NHS: hỏi dược sĩ; kb-guide mục 2.5)."
  references: [byt-qd-3931-2015, bent-jama-2002, nhs-utis, nhs-appendicitis]
author: "agent:pass-c"
notes_vi: "Ca dễ nhầm với viêm ruột thừa cấp."
