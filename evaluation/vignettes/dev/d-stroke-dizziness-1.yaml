title_vi: "Nam 67 tuổi, tăng huyết áp, 5 giờ nay đột ngột quay cuồng liên tục, nôn, không tự đi được, đau vùng gáy"
narrative_vi: "Ông X., 67 tuổi, bị tăng huyết áp. Năm giờ trước đang ngồi ăn cơm bỗng quay cuồng liên tục, nôn 3 lần, đau đầu vừa vùng sau gáy. Đứng lên là xiêu về một bên, phải có người đỡ mới đi được. Không méo miệng, không yếu tê tay chân, nói rõ, không nhìn đôi. Không ù tai, không nghe kém. Chưa từng bị như vậy."
