source:
  basis: "Đột quỵ tuần hoàn sau (tiểu não) biểu hiện bằng chóng mặt: hội chứng tiền đình cấp ở người trên 50 tuổi có tăng huyết áp, không tự đi được, đau đầu vùng gáy, không có dấu hiệu FAST (Tarnutzer 2011: thất điều nặng, đau đầu cổ gợi ý trung ương; 3312/QĐ-BYT: chảy máu tiểu não gây nhức đầu vùng chẩm, thất điều, nôn). NHS Stroke: chóng mặt hoặc ngã đột ngột là dấu hiệu đột quỵ, gọi 999 (quy tắc rf_dizziness_central_signs_high_risk, mức 1)."
