id: d-covid19-shortness-of-breath-1
set: dev
title_vi: "Nam 68 tuổi có tiểu đường chọn Khó thở: COVID-19 ngày 4, sốt, ho, nay hụt hơi khi đi lại"
narrative_vi: "Ông L., 68 tuổi, ở Hà Nội, bị đái tháo đường. Bốn ngày nay sốt 38,3°C, ho khan, đau họng, mệt; que thử nhanh COVID-19 dương tính từ ngày đầu, cháu nội cũng dương tính. Từ hôm qua hụt hơi khi đi lại trong nhà, tăng dần, ngồi nghỉ thì đỡ, nói được cả câu. Không đau ngực, không khò khè, không phù chân. Vẫn tỉnh táo. Không hút thuốc, không có bệnh phổi."
