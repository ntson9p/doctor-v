source:
  basis: "COVID-19 ở người trên 60 tuổi có đái tháo đường (nhóm nguy cơ diễn tiến nặng, 2671/QĐ-BYT bảng 5), xuất hiện khó thở từ ngày thứ 4: khó thở là mức trung bình trở lên, cần được đánh giá tại cơ sở y tế ngay (2671; quy tắc rf_high_risk_fever_breathing)."
  references: [byt-qd-2671-2023, marquez-jamanetwopen-2022]
author: "agent:pass-c"
notes_vi: "Viêm phổi cũng chấp nhận được: khó thở từ ngày thứ 4 ở người cao tuổi bị COVID-19 thường là viêm phổi do vi rút, mà bệnh viêm phổi của hệ thống gồm cả viêm phổi do vi rút; chỉ khám, chụp phổi mới phân biệt được."
