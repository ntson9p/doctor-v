id: d-from-h-syncope-001
set: dev
title_vi: "Nữ 24 tuổi sinh con 8 ngày, đêm sưởi than dưới gầm giường trong phòng kín, dậy đi vệ sinh thì ngất; mẹ ngủ cùng phòng nhức đầu"
narrative_vi: "Chị H., 24 tuổi, ở Nghệ An, sinh thường con thứ hai được 8 ngày. Theo phong tục, mấy đêm nay gia đình đặt chậu than hồng dưới gầm giường để sưởi cho hai mẹ con, cửa phòng đóng kín vì trời rét. Khoảng 3 giờ sáng chị dậy cho con bú rồi đứng lên đi vệ sinh thì choáng, tối sầm mắt và ngã xuống chiếu, không đập đầu; mẹ chị ngủ cùng phòng thấy chị nằm im khoảng 1 phút rồi tỉnh lại. Hiện chị tỉnh, trả lời được, nhưng đau đầu, chóng mặt suốt từ lúc dậy, buồn nôn, người rất mệt, đứng dậy là choáng. Mẹ chị cũng kêu nhức đầu, buồn nôn từ đêm. Em bé ngủ li bì hơn mọi khi, bú yếu. Sau sinh chị ra huyết ít dần như bình thường; chị không sốt, không đau bụng, không khó thở, không đau ngực, không đau bắp chân, không co giật, không thấy tim đập nhanh."
