source:
  basis: "Ngộ độc khí CO do tục sưởi than cho sản phụ trong phòng kín: sản phụ ngất khi đứng dậy lúc nửa đêm, sau đó đau đầu, chóng mặt, buồn nôn, rất mệt; người ngủ cùng phòng nhức đầu, buồn nôn; trẻ sơ sinh li bì, bú yếu. NHS Carbon monoxide poisoning: đã phơi nhiễm mà mất ý thức thì gọi 999 hoặc đến cấp cứu; không tự lái xe. Báo Pháp Luật (01/2016): ở Nghệ An, gia đình đốt than sưởi cho sản phụ mới sinh trong phòng kín khoảng 15 m², cả 5 người ngộ độc, một trẻ 18 tháng tử vong. Đã mất ý thức, trẻ sơ sinh cùng phơi nhiễm nên gọi 115 (mức 1)."
  references:
    - nhs-carbon-monoxide-poisoning
    - "https://baophapluat.vn/suoi-am-bang-than-cui-be-gai-18-thang-tuoi-tu-vong-post211573.html"
author: "agent:vignette-holdout"
notes_vi: "Ca khó: ngất khi đứng dậy ban đêm ở sản phụ dễ bị coi là ngất tư thế hoặc thiếu máu sau sinh; manh mối là chậu than trong phòng kín và người cùng phòng cũng có triệu chứng. Sản dịch sau sinh bình thường nên câu ra máu âm đạo bất thường trả lời 'không'."
