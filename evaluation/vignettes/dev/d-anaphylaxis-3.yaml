source:
  basis: "Phản vệ do thuốc (thuốc chống viêm không steroid là nguyên nhân thuốc hay gặp nhất: Ninh 2024) ở người có hen: mày đay, phù mạch kèm khó thở, khò khè khởi phát trong vài phút sau dùng thuốc (51/2017/TT-BYT Phụ lục I bệnh cảnh 1). Dễ nhầm với cơn hen; ban mề đay, sưng mí mắt và mốc thời gian sau dùng thuốc gợi ý phản vệ. NHS Anaphylaxis: gọi 999 (mức 1)."
  references: [byt-tt-51-2017, ninh-vmj-2024, nhs-anaphylaxis]
