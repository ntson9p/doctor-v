id: d-anaphylaxis-3
set: dev
title_vi: "Nữ 22 tuổi có hen, khó thở, khò khè đột ngột 15 phút sau uống thuốc giảm đau, kèm mề đay ở cổ"
narrative_vi: "Chị V., 22 tuổi, ở Huế, bị hen từ nhỏ, ít khi lên cơn. Chị uống một viên thuốc giảm đau mua ở hiệu thuốc vì đau bụng kinh. Khoảng 15 phút sau, chị đột ngột khó thở, khò khè, ngồi nghỉ cũng khó thở, cổ và ngực nổi mẩn gồ, ngứa, mí mắt hơi sưng. Chị nghĩ là lên cơn hen nên không chọn mục nào ở màn sàng lọc đầu tiên, chưa kịp xịt thuốc cắt cơn. Không sốt, không ho có đờm, không sổ mũi, không đau ngực, không choáng. Đang có kinh, không có thai."
