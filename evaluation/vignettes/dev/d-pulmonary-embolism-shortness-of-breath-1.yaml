id: d-pulmonary-embolism-shortness-of-breath-1
set: dev
title_vi: "Nữ 44 tuổi dùng thuốc tránh thai, sau chuyến xe 9 giờ, sáng nay đột ngột khó thở, đau ngực phải khi hít sâu, sưng bắp chân trái"
narrative_vi: "Chị H., 44 tuổi, ở Gia Lai, đang uống thuốc tránh thai. Ba ngày trước đi xe khách 9 giờ. Từ hôm qua bắp chân trái sưng, đau. Sáng nay đang ngồi thì đột ngột khó thở, ngồi yên cũng thở mệt nhưng vẫn nói được cả câu, kèm đau nhói ngực phải khi hít sâu. Không ho ra máu, không sốt, không ho. Không choáng, không ngất. Không khò khè, không nổi mẩn. Không đau, tức nặng giữa ngực. Chưa từng bị cục máu đông, không có ung thư. Nhà không có máy đo SpO2. Không có thai, không chậm kinh."
