source:
  basis: "Thuyên tắc phổi điển hình, chưa có sốc, ngất: khó thở đột ngột, đau ngực kiểu màng phổi, sưng đau một bên bắp chân, sau ngồi xe lâu, đang dùng thuốc tránh thai (ESC 2019 bảng 3, mục 4.1; Miniati 2012). NHS Pulmonary embolism: 'Call 999 or go to A&E', theo quy ước của lượt R là mức 2 (quy tắc rf_pe_signs mức 2); ca có ngất, sốc, tức ngực kèm khó thở là mức 1."
