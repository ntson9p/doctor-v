source:
  basis: "Ca sốt xuất huyết ở trẻ nhỏ, giai đoạn sớm, không kể được đau đầu, đau cơ; có yếu tố dịch tễ (2760 Phụ lục 2, Phụ lục 22: trẻ em gặp nhiều nhất, dịch nhiều vào tháng 7–10). Nôn 1 lần, đau bụng nhẹ chưa phải dấu hiệu cảnh báo (cảnh báo khi nôn từ 3 lần/1 giờ hoặc 4 lần/6 giờ, đau bụng nhiều). Không có dấu hiệu nguy hiểm toàn thân theo IMCI. Theo dõi ngoại trú, khám lại hằng ngày (mục IV.A): đi khám trong 24 giờ."
