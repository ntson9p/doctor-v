title_vi: "Bé gái 4 tuổi ở Cần Thơ, tháng 7, sốt cao 3 ngày, chán ăn, nôn 1 lần, đau bụng nhẹ"
narrative_vi: "Bé N., 4 tuổi, ở Cần Thơ. Ba ngày nay sốt cao 39,2°C, mệt, bỏ ăn, nôn 1 lần hôm qua, kêu đau bụng quanh rốn nhưng vẫn chơi được. Bé không kể được đau đầu hay đau mỏi. Không ho, không sổ mũi, không tiêu chảy, không nổi ban, không chảy máu chân răng. Vẫn uống nước được, không li bì, không co giật. Anh họ ở cùng xóm đang nằm viện vì sốt xuất huyết. Bé đã tiêm đủ 2 mũi vắc xin sởi."
