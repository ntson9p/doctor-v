narrative_vi: "Bà E., 76 tuổi, uống aspirin hằng ngày sau đặt stent mạch vành. Ba ngày nay mệt, đứng dậy là choáng váng, da xanh. Hôm nay con gái thấy phân bà màu đen. Bà không đau bụng, không nôn ra máu, không ngất, không choáng như sắp ngất. Không đau ngực, không khó thở, không sốt. Chưa đo mạch."
