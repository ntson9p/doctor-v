id: d-benign-paroxysmal-positional-vertigo-2
set: dev
title_vi: "Nam 79 tuổi, tăng huyết áp, choáng chao đảo vài giây khi trở mình, không thấy quay"
narrative_vi: "Ông T., 79 tuổi, bị tăng huyết áp, đang uống thuốc hạ áp. Một tuần nay, mỗi khi trở mình hoặc ngửa cổ lên thì thấy choáng, chao đảo vài giây rồi hết. Ông không tả được là mọi vật quay, chỉ thấy chòng chành. Không buồn nôn. Đứng dậy từ ghế không thấy choáng. Giữa các cơn đi lại bình thường, chỉ sợ ngã. Đây là lần đầu bị. Không đau đầu, không nhìn đôi, không yếu tê tay chân, không nói khó, không ù tai, không ngất."
