source:
  basis: "Ca không điển hình: người rất cao tuổi, mô tả choáng, chòng chành thay vì quay (14% người bệnh không thấy quay, von Brevern 2007), nhưng cơn vẫn ngắn và luôn do đổi tư thế đầu. Bệnh tăng theo tuổi và làm người già dễ ngã (MSD). Cơn có yếu tố khởi phát, không có dấu hiệu thần kinh: GRACE-3 khuyên nghiệm pháp Dix-Hallpike; NHS Vertigo: khám bác sĩ (không khẩn)."
  references: [vonbrevern-jnnp-2007, msd-bppv, grace3-dizziness-2023, nhs-vertigo]
author: "agent:pass-c"
notes_vi: "Kiểm tra người từ 75 tuổi (ngưỡng mức xử trí giảm một nửa) có tăng huyết áp nhưng chóng mặt tư thế điển hình."
