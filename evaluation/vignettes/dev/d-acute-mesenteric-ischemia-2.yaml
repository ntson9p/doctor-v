source:
  basis: "Thể cấp trên nền mạn: tiền sử đau sau ăn, sợ ăn, sụt cân (thiếu máu mạc treo mạn; Park 2002: 43%), nay đau tăng dần, đi ngoài ra máu, sốt nhẹ (WSES 2022: một phần ba có bộ ba đau bụng, sốt, máu trong phân). WSES: cần chụp cắt lớp mạch máu ngay. Người bệnh còn ổn định, không đau dữ dội, không dấu hiệu sốc nên đến cơ sở cấp cứu ngay (mức 2); thể điển hình đau dữ dội đột ngột mới cần gọi 115."
