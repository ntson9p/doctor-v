id: d-acute-mesenteric-ischemia-2
set: dev
title_vi: Nam 66 tuổi bệnh tim, đau bụng âm ỉ tăng dần 1 ngày, đi ngoài phân lỏng có máu, sụt cân vì sợ ăn
narrative_vi: Ông P., 66 tuổi, bị bệnh mạch vành và tăng huyết áp, hút thuốc. Mấy tháng nay cứ ăn xong khoảng nửa giờ là đau bụng nên ông sợ ăn, sụt cân. Từ hôm qua đau quanh rốn tăng dần, đau liên tục, đi ngoài phân lỏng 2 lần, lần sau có lẫn máu đỏ sẫm. Đau nhiều nhưng ông vẫn chịu được. Hơi sốt nhẹ. Không nôn, không ngất, không đau ngực, không khó thở.
