id: d-hypoglycemia-3
set: dev
title_vi: "Nữ 50 tuổi, đái tháo đường uống thuốc, chờ bữa trưa thì hồi hộp, run, vã mồ hôi, sợ hãi, ăn kẹo thì đỡ"
narrative_vi: "Chị D., 50 tuổi, đái tháo đường típ 2, uống thuốc hạ đường huyết. Trưa nay bữa ăn bị muộn hơn 2 tiếng. Đang chờ thì đột ngột tim đập nhanh, run tay, vã mồ hôi, tê quanh môi, sợ hãi như sắp có chuyện gì, hơi choáng. Chị nghĩ mình bị cơn hoảng loạn. Ăn mấy viên kẹo thì khoảng 10 phút sau đỡ hẳn. Không đau ngực, không khó thở, không ngất. Chưa đo đường huyết. Trước đây chưa bị như vậy. Không có thai, không chậm kinh."
