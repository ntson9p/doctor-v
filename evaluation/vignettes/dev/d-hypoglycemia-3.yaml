source:
  basis: "Dễ nhầm với cơn hoảng sợ (panic_disorder): cả hai có hồi hộp, run, vã mồ hôi, tê môi, lo sợ (NHS Low blood sugar: lo lắng, tê môi). Điểm phân biệt: đang dùng thuốc hạ đường huyết, ăn muộn, đỡ hẳn sau khi ăn đồ ngọt (5481/QĐ-BYT phần 6; NHS). Mức xử trí: khám trong 24 giờ để xem lại thuốc (quy tắc rf_hypoglycemia_suspected)."
  references: [nhs-hypoglycaemia, byt-qd-5481-2020]
author: "agent:pass-c"
notes_vi: "Ca dễ nhầm với bệnh của phần b (cơn hoảng sợ)."
