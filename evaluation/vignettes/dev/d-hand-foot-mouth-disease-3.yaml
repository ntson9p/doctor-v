title_vi: "Bé trai 3 tuổi tay chân miệng ngày 3, sốt 39,5°C, giật mình khi ngủ, nôn"
narrative_vi: "Bé H., 3 tuổi, ở Long An, đã tiêm đủ 2 mũi vắc xin sởi. Bé bị loét miệng, phỏng nước ở tay chân từ 3 ngày nay. Hôm nay sốt 39,5°C, nôn 2 lần, quấy khóc khó ngủ; đêm qua giật mình chới với 2 lần lúc mới ngủ. Cổ bé mềm, vẫn gọi tỉnh, uống được nước, không thở nhanh, không phát ban xuất huyết."
