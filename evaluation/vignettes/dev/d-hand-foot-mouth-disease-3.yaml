source:
  basis: "Dễ nhầm với viêm màng não, nhiễm khuẩn huyết (sốt cao, nôn, dấu hiệu thần kinh). Tay chân miệng có giật mình theo bệnh sử và sốt trên 39°C là độ 2a (292/QĐ-BYT mục II.6.2.1): điều trị nội trú, giật mình là dấu hiệu cần tái khám ngay (mục III.3.1), nên đến bệnh viện ngay."
