source:
  basis: "Phản vệ không điển hình ở trẻ, biểu hiện chủ yếu bằng ho: sau ăn dị nguyên thức ăn (lạc) có mày đay kèm triệu chứng hô hấp (khò khè, khàn tiếng, ho) (51/2017/TT-BYT Phụ lục I bệnh cảnh 1; WAO 2020: triệu chứng thanh quản gồm đổi giọng). NHS Anaphylaxis: khò khè, ho, khàn tiếng sau tiếp xúc dị nguyên là dấu hiệu phản vệ, gọi 999 (mức 1). Quy tắc rf_anaphylaxis_signs (mề đay kèm khò khè)."
  references: [byt-tt-51-2017, cardona-waoj-2020, nhs-anaphylaxis]
author: "agent:pass-c"
notes_vi: "Ca không điển hình (trẻ em, triệu chứng chính Ho, chưa khó thở rõ, không qua màn sàng lọc cấp cứu)."
