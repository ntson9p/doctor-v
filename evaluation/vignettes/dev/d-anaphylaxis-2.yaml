id: d-anaphylaxis-2
set: dev
title_vi: "Bé trai 9 tuổi ho liên tục, khàn tiếng, nổi mề đay sau khi ăn bánh có lạc ở tiệc sinh nhật"
narrative_vi: "Bé P., 9 tuổi, ở Hà Nội. Khoảng 30 phút sau khi ăn bánh có lạc (đậu phộng) ở tiệc sinh nhật, bé ho khan liên tục, kêu ngứa họng, giọng khàn đi, trên bụng và lưng nổi mảng mẩn gồ, ngứa. Mẹ nghe tiếng thở khò khè nhẹ. Bé vẫn nói được trọn câu, chưa thấy khó thở rõ, môi lưỡi không sưng, không nôn, không choáng. Bé không sốt, không sổ mũi. Mẹ chọn Ho vì bé ho nhiều, không chọn mục nào ở màn sàng lọc đầu tiên."
