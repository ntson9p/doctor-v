source:
  basis: "Cơn glôcôm góc đóng cấp ở người cao tuổi biểu hiện nổi bật bằng triệu chứng toàn thân (đau đầu, buồn nôn, nôn, đau bụng, vã mồ hôi), dễ bị nhầm là bệnh tiêu hóa hoặc thần kinh (MSD; 40/QĐ-BYT mục 3a); thuốc cảm, thuốc ho có tác dụng giãn đồng tử có thể gây cơn (MSD). Mắt đỏ, đau nhức một bên, nhìn mờ: đến cấp cứu ngay (NHS Glaucoma; rf_acute_glaucoma_signs, mức 2)."
  references: [msd-angle-closure-glaucoma, byt-qd-40-2015, nhs-glaucoma]
author: "agent:pass-c"
notes_vi: "Ca không điển hình: nam giới, rất cao tuổi, triệu chứng toàn thân nổi bật."
