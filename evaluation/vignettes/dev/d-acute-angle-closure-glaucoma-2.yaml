id: d-acute-angle-closure-glaucoma-2
set: dev
title_vi: "Nam 78 tuổi đau đầu, nôn, vã mồ hôi, đau bụng từ chiều; hỏi kỹ thì mắt phải đỏ, nhức, nhìn mờ"
narrative_vi: "Ông B., 78 tuổi, ở Nam Định. Từ chiều ông kêu đau đầu bên phải, buồn nôn, nôn 2 lần, vã mồ hôi, đau lâm râm vùng bụng. Hôm trước ông có uống thuốc cảm, thuốc ho. Con trai hỏi kỹ thì ông nói mắt phải nhức nhiều, nhìn mờ; nhìn thấy mắt phải đỏ. Ông không để ý có quầng sáng quanh đèn không. Ông tỉnh táo, nói rõ, không yếu tay chân, không sốt, không cứng gáy. Ông không bị tăng huyết áp, không tiêu chảy."
