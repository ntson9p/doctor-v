  basis: "Ca điển hình viêm bàng quang cấp thông thường ở phụ nữ: tiểu buốt, tiểu dắt, đau nhẹ trên khớp mu, không sốt (3931/QĐ-BYT); tiểu buốt kèm tiểu nhiều lần, không có khí hư hay ngứa rát: LR 24,6 (Bent 2002). Phụ nữ 16–64 tuổi không có thai có thể hỏi dược sĩ (NHS); kb-guide mục 2.5 xếp viêm bàng quang không sốt ở mức 4."
