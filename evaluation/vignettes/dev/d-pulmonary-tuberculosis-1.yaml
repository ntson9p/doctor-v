title_vi: "Nam 48 tuổi hút thuốc, ho đờm 6 tuần, ra mồ hôi đêm, sụt 4 kg, mệt"
narrative_vi: "Anh Đ., 48 tuổi, thợ xây ở Đồng Nai, hút thuốc lá 25 năm. Sáu tuần nay ho có đờm, không đỡ dù đã mua thuốc ho uống. Hay ra mồ hôi ướt áo về đêm, người mệt, ăn kém, sụt khoảng 4 kg trong 2 tháng. Không sốt, không ho ra máu, không khó thở, không đau ngực. Không biết có ai quanh mình bị lao. Không có bệnh nền."
