source:
  basis: "Lao phổi điển hình ở người lớn: ho kéo dài trên 2 tuần có đờm, ra mồ hôi đêm, sụt cân, mệt, kém ăn (162/QĐ-BYT phần II mục 1.1). Người nghi lao cần được chụp phim, xét nghiệm đờm trong vài ngày; NHS TB: ho trên 3 tuần, mồ hôi đêm, sụt cân thì khám bác sĩ gia đình (không khẩn)."
