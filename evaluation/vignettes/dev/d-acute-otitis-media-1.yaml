  basis: "Viêm tai giữa cấp điển hình (5643/QĐ-BYT: trẻ đang sổ mũi, ngạt mũi đột nhiên đau tai, sốt). Cần soi tai để quyết định điều trị; không có dấu hiệu nặng nên có thể khám trong vài ngày (MSD: theo dõi nếu tái khám được trong 48–72 giờ; NHS Ear infections)."
