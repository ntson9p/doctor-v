title_vi: "Bé trai 20 tháng sốt 38,6°C, kéo tai, quấy khóc đêm, sổ mũi"
narrative_vi: "Bé B., 20 tháng, ở Hà Nội, đã tiêm đủ 2 mũi vắc xin sởi. Bé sổ mũi, nghẹt mũi, ho 4 ngày; từ hôm qua sốt 38,6°C, hay kéo tai phải, quấy khóc nhiều khi nằm, ngủ không yên. Tai không chảy dịch, sau tai không sưng. Bé vẫn bú, uống được, không nôn, không li bì, không thở nhanh."
