source:
  basis: "Hội chứng mạch vành cấp không điển hình ở nữ cao tuổi đái tháo đường: khó thở, buồn nôn, vã mồ hôi, không đau ngực (2187/QĐ-BYT: khó thở là triệu chứng không điển hình, người già, người đái tháo đường có thể không đau ngực; MSD: người cao tuổi hay than khó thở hơn đau ngực). Nghi nhồi máu cơ tim thì gọi cấp cứu: mức 1."
