id: d-acute-coronary-syndrome-shortness-of-breath-1
set: dev
title_vi: "Nữ 79 tuổi đái tháo đường, 3 giờ nay khó thở cả khi ngồi nghỉ, mệt lả, buồn nôn, vã mồ hôi, không đau ngực"
narrative_vi: "Bà Y., 79 tuổi, ở Vĩnh Long, bị đái tháo đường và tăng huyết áp nhiều năm. Khoảng 3 giờ nay thấy khó thở, ngồi nghỉ cũng thở mệt nhưng vẫn nói được cả câu, kèm buồn nôn, vã mồ hôi lạnh, người mệt. Không đau ngực, không tức ngực. Không sốt, không ho, không khò khè. Nằm xuống không khó thở hơn, không phù chân. Không hồi hộp, không choáng. Chưa từng bị suy tim. Nhà không có máy đo SpO2."
