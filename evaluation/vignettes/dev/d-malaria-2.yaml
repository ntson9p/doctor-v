id: d-malaria-2
set: dev
title_vi: "Nam 41 tuổi ở Hà Nội, vừa đi làm ở châu Phi về, sốt cao liên tục 2 ngày"
narrative_vi: "Anh Q., 41 tuổi, ở Hà Nội, vừa về nước 10 ngày sau 2 năm làm việc ở Angola. Hai ngày nay sốt cao liên tục 39,5°C, chỉ thấy ớn lạnh chứ không rét run, không thành cơn. Đau đầu, đau mỏi người, mệt, buồn nôn, nôn 2 lần. Không ho, không sổ mũi, không đau họng, không đau bụng, không tiêu chảy, không nổi ban. Không vàng da, không khó thở, tỉnh táo."
