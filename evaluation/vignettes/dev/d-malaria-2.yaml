source:
  basis: "Sốt rét ngoại lai: 3377/QĐ-BYT mục I (ca mắc do đi làm việc ở quốc gia có sốt rét lưu hành trở về) và mục II.1 (người mắc lần đầu thường sốt không thành cơn, sốt cao liên tục, ớn lạnh). CDC: ủ bệnh thường 7–30 ngày. Chưa có dấu hiệu ác tính: xét nghiệm tìm ký sinh trùng sốt rét trong ngày."
  references: [byt-qd-3377-2023, cdc-malaria-clinical, winhanoo-malarj-2023]
author: "agent:pass-c"
notes_vi: "Ca không điển hình: không rét run, không sốt thành cơn, người ở miền Bắc. Câu hỏi phơi nhiễm gộp người đi rừng trong nước (nguy cơ thấp) với người từ châu Phi về (nguy cơ cao), nên khả năng sốt rét có thể bị đánh giá thấp."
