title_vi: Nữ 67 tuổi có sỏi mật, sốt cao rét run, đau dưới sườn phải, vàng mắt
narrative_vi: Bà Y., 67 tuổi, đã biết có sỏi ống mật chủ, chưa điều trị. Hai ngày nay đau âm ỉ dưới sườn phải, hôm nay sốt cao 39,5°C kèm rét run, con cháu thấy mắt bà vàng. Bà buồn nôn, chán ăn. Vẫn tỉnh táo, không khó thở, không tay chân lạnh. Không tiêu chảy, không tiểu buốt.
