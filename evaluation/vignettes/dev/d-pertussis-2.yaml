id: d-pertussis-2
set: dev
title_vi: "Bé trai 4 tháng ho 10 ngày, từng cơn đỏ mặt, nôn trớ sau ho, không sốt, chưa có tiếng rít"
narrative_vi: "Bé K., 4 tháng tuổi, ở Hải Dương, mới tiêm 1 mũi vắc xin 5 trong 1. Mười ngày nay bé ho, mấy ngày đầu chỉ ho nhẹ kèm sổ mũi; năm ngày nay bé ho thành từng cơn dài, ho đỏ mặt, sau cơn hay nôn trớ ra sữa. Mẹ không nghe thấy tiếng rít cuối cơn. Giữa các cơn bé thở bình thường, không tím môi, không lúc nào ngừng thở, không thở rên, ngực không lõm. Bé không sốt, vẫn bú được hơn một nửa so với mọi ngày, không li bì. Chị gái 6 tuổi ho gần một tháng nay."
