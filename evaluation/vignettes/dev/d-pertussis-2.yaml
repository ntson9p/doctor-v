source:
  basis: "Ho gà ở trẻ nhỏ chưa tiêm đủ: ho từng cơn kèm nôn sau ho, nguồn lây là anh chị ho kéo dài (MSD Pertussis; Pham 2020: trẻ chưa tiêm nhập viện gấp 106 lần). NHS Whooping cough: trẻ dưới 6 tháng có triệu chứng ho gà thì khám khẩn (mức 3), thường phải điều trị ở bệnh viện. Quy tắc rf_pertussis_infant của doctor-v xếp mức 2 (nhận định, chờ bác sĩ duyệt), nên ca này dự kiến khuyên quá mức."
  references: [nhs-whooping-cough, msd-pertussis, pham-actapaediatr-2020]
author: "agent:pass-c"
notes_vi: "Ca không điển hình theo tuổi (trẻ dưới 6 tháng, chưa có tiếng rít). Mức đúng theo NHS là 3; ứng dụng cho mức 2 qua rf_pertussis_infant."
