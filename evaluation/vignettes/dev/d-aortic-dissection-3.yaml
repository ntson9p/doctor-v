source:
  basis: "Bóc tách động mạch chủ dễ nhầm với hội chứng mạch vành cấp: cả hai đều đau ngực dữ dội, đè ép, buồn nôn (4235/QĐ-BYT: đau dữ dội, đè ép cần tìm nhồi máu cơ tim, phình tách). Đặc điểm nghiêng về bóc tách: đau dữ dội ngay từ đầu, như xé, lan ra lưng (Klompas 2002; MSD; HSE). Gọi 115 (mức 1) như cả hai bệnh."
