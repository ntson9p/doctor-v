id: d-aortic-dissection-3
set: dev
title_vi: "Nam 57 tuổi hút thuốc, đột ngột đau đè ép giữa ngực dữ dội, lan ra sau lưng, buồn nôn, tưởng nhồi máu cơ tim"
narrative_vi: "Ông T., 57 tuổi, ở Hải Phòng, hút thuốc lá 30 năm, bị tăng huyết áp. Khoảng 30 phút trước, đang khiêng đồ thì đột ngột đau dữ dội ngay từ đầu, đè ép ở giữa ngực, lan ra sau lưng, cảm giác như có gì bị xé trong ngực. Ông buồn nôn nhưng không nôn, không vã mồ hôi, không khó thở, không ngất. Đau không lan lên hàm hay xuống tay. Trước đây chưa từng đau ngực khi gắng sức. Không yếu tay chân, không nói khó. Không đái tháo đường, chưa được nói có bệnh tim."
