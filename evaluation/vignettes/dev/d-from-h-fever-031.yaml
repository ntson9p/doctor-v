title_vi: "Nam 16 tuổi, sốt cao đột ngột, ban tím không mất khi ấn, tay chân lạnh"
narrative_vi: "Em T., nam, 16 tuổi, học sinh nội trú ở Hà Nội. Sáng nay em sốt cao đột ngột 39,8°C, đau đầu, buồn nôn, nôn, đau nhức hai chân. Chiều nay em mệt lả không tự đi được, tay chân lạnh. Ở cẳng chân và bụng xuất hiện nhiều nốt tím, ấn ly thủy tinh lên vẫn thấy rõ. Em còn tỉnh, chưa thấy cứng gáy."
