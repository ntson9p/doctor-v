id: d-encephalitis-2
set: dev
title_vi: "Nam 55 tuổi ở Hà Nội, sốt, đau đầu 4 ngày, người nhà thấy hay quên, nói năng lạ"
narrative_vi: "Ông T., 55 tuổi, ở Hà Nội. Bốn ngày nay ông sốt 38,5°C, đau đầu cả đầu mức vừa, chưa từng đau kiểu này. Hai ngày nay vợ thấy ông hay quên chuyện vừa nói, gọi nhầm tên con, có lúc nói những câu không đâu vào đâu, không biết đang ở đâu. Ông vẫn tự đi lại được, chưa co giật, không li bì. Cổ cúi được. Không ho, không sổ mũi, không nôn, không nổi ban. Không méo miệng, không yếu tay chân. Không có bệnh nền, không phơi nắng, không lội nước."
