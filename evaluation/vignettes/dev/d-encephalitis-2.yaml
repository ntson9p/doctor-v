source:
  basis: "Viêm não do vi rút Herpes simplex ở người lớn: khởi phát với sốt, đau đầu, thay đổi tính cách, mất trí nhớ (5642/QĐ-BYT, bài Viêm não do Herpes simplex, mục 3.1); bệnh tản phát, không theo mùa. NHS Encephalitis: lú lẫn, thay đổi tính cách, hành vi thì gọi 999 (mức 1)."
  references: [byt-qd-5642-2015, nhs-encephalitis, ngan-bmcinfectdis-2024]
author: "agent:pass-c"
notes_vi: "Ca không điển hình: người lớn, viêm não do herpes, biểu hiện bằng thay đổi trí nhớ, hành vi hơn là li bì, co giật."
