source:
  basis: "Dễ nhầm với rối loạn nhịp tim và cường giáp (phần b): tim nhanh đều lúc nghỉ. Ở đây tim nhanh xoang để bù thiếu oxy (1832/QĐ-BYT: hồi hộp, đánh trống ngực), kèm mệt, da xanh, hụt hơi khi gắng sức và kinh nguyệt nhiều (NHS Iron deficiency anaemia); không có dấu hiệu cường giáp, cơn không bắt đầu, dừng đột ngột. NHS: khám bác sĩ (không khẩn); mạch dưới 150 lúc nghỉ, không có dấu hiệu nặng."
