title_vi: "Nữ 38 tuổi, hồi hộp tim nhanh đều cả khi nghỉ, mạch 108, mệt, da xanh, kinh nguyệt ra nhiều"
narrative_vi: "Chị E., 38 tuổi. Hai tháng nay hay thấy tim đập nhanh, đều, cả khi ngồi nghỉ, nặng hơn khi làm việc. Đếm mạch lúc ngồi nghỉ được 108 lần mỗi phút. Mệt, da xanh, leo cầu thang là hụt hơi, hơi choáng váng. Kinh nguyệt hơn một năm nay ra nhiều. Cơn tim nhanh không bắt đầu hay dừng đột ngột. Không run tay, không sợ nóng, không sụt cân, không mắt lồi, không bướu cổ. Không đau ngực, không khó thở khi nghỉ, không ngất. Không có thai, không chậm kinh."
