title_vi: "Nữ 35 tuổi, đái tháo đường, không uống rượu, 2 ngày đau tăng dần vùng trên rốn lệch trái, nôn"
narrative_vi: "Chị Y., 35 tuổi, bị đái tháo đường, không uống rượu. Hai ngày nay đau âm ỉ rồi tăng dần vùng trên rốn lệch trái, đau liên tục, ăn vào đau hơn, buồn nôn, nôn 3 lần. Đau nhiều nhưng chưa đến mức không chịu nổi, không lan ra sau lưng. Không sốt, không tiêu chảy, không vàng da. Không có thai, không chậm kinh, không ra máu âm đạo. Chưa từng được nói có sỏi mật."
