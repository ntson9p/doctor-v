  basis: "Ca không điển hình: nữ, không uống rượu, đau tăng dần không dữ dội, không lan ra lưng. Ở Việt Nam tăng triglycerid là nguyên nhân hàng đầu (34,7%) và 43,7% người bệnh có đái tháo đường (Phan 2024); đau thượng vị liên tục kèm nôn phù hợp viêm tụy cấp (ACG 2024). Bệnh cần điều trị tại bệnh viện (NHS)."
