source:
  basis: "Viêm phế quản cấp ở thiếu niên, giai đoạn ho kéo dài (ho thường 2–3 tuần, có thể có ran rít; Kinkade 2016). Ho từ 2 tuần là triệu chứng nghi lao cần được khám trong vài ngày (162/QĐ-BYT); NHS Cough: ho quá 3 tuần thì khám bác sĩ gia đình."
