id: d-acute-bronchitis-2
set: dev
title_vi: "Nữ 16 tuổi, ho có đờm 16 ngày sau cảm, đôi khi khò khè nhẹ, không sốt"
narrative_vi: "Em L., 16 tuổi, học sinh ở TP.HCM. Hơn hai tuần trước bị cảm, sổ mũi, đau họng; mấy hôm sau bắt đầu ho, lúc đầu ho khan rồi ho có đờm, nay đã 16 ngày, ho đang bớt dần. Thỉnh thoảng thấy hơi khò khè khi ho nhiều. Không sốt, không khó thở, không đau ngực, không ho ra máu. Không có cơn ho dồn dập, không nôn sau ho. Chưa từng bị hen, chưa từng có đợt ho, khò khè như vậy. Không sụt cân, không ra mồ hôi đêm. Không có thai, không chậm kinh."
