source:
  basis: "Đau nửa đầu không tiền triệu: cơn quen thuộc, một bên, theo nhịp mạch, vừa đến nặng, tăng khi vận động, buồn nôn, sợ ánh sáng và tiếng ồn (ICHD-3 mục 1.1); vị trí đau hay gặp nhất là vùng quanh mắt (Kelman 2005). Không có đỏ mắt, nhìn mờ, quầng sáng nên không nghĩ glôcôm cấp. Cơn quen thuộc không có dấu hiệu nguy hiểm: tự chăm sóc (NHS Migraine, mức 5)."
  references: [ihs-ichd3-2018, kelman-headache-2005, nhs-migraine]
author: "agent:pass-c"
notes_vi: "Ca của bản mở rộng lô 2: đau quanh một mắt ở người đau nửa đầu, không có dấu hiệu glôcôm."
