id: d-migraine-headache-1
set: dev
title_vi: "Nữ 27 tuổi, cơn đau nửa đầu quen thuộc, đau nhức quanh mắt phải, buồn nôn, sợ ánh sáng; mắt không đỏ"
narrative_vi: "Chị V., 27 tuổi, nhân viên văn phòng ở Hà Nội, bị đau nửa đầu từ thời sinh viên, mỗi tháng 1–2 cơn giống nhau. Sáng nay sau một đêm thiếu ngủ, chị đau giật giật nửa đầu bên phải, đau nhức dữ dội quanh mắt phải, buồn nôn, sợ ánh sáng, sợ tiếng ồn, đi lại thì đau tăng. Đau đã khoảng 5 giờ. Mắt không đỏ, nhìn rõ, không thấy quầng sáng quanh đèn, trước cơn không thấy chớp sáng. Không sốt, không cứng gáy, không yếu tay chân, không nói khó. Chị không có thai, kinh nguyệt đều."
