id: d-cardiac-arrhythmia-1
set: dev
title_vi: "Nam 68 tuổi tăng huyết áp, nhiều cơn tim đập nhanh, lộn xộn kéo dài 1–2 giờ rồi tự hết"
narrative_vi: "Ông H., 68 tuổi, tăng huyết áp. Hai tuần nay có ba lần bỗng thấy tim đập nhanh, lộn xộn, mỗi lần kéo dài 1–2 giờ rồi tự hết; lúc có cơn thấy mệt, hơi choáng nhưng không như sắp ngất. Lần gần nhất con trai đo bằng máy huyết áp thấy mạch khoảng 130. Hiện đã hết cơn. Không đau ngực, không khó thở, không ngất. Không run tay, không sụt cân, không sợ nóng."
