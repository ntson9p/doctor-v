source:
  basis: "Rung nhĩ kịch phát điển hình ở người cao tuổi: tim đập không đều, nhanh trên 100, cơn tự hết, mệt (NHS Atrial fibrillation; ESC 2024). Không có đau ngực, khó thở, ngất nên không cần cấp cứu (NHS: gọi 999 khi kèm các dấu hiệu đó). NHS khuyên khám bác sĩ gia đình; doctor-v xếp mức 3 (mức của bệnh) vì rung nhĩ mới cần được ghi điện tim sớm và đánh giá nguy cơ đột quỵ (ESC 2024, EHRA 2011)."
