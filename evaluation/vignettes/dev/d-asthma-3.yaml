source:
  basis: "Đợt cấp hen nhẹ khởi phát do nhiễm vi rút ở người đã biết bị hen (1851/QĐ-BYT mục 4.1; GINA 2026); dễ nhầm với viêm phế quản cấp, cảm lạnh vì có sổ mũi, ho đờm. NHS Asthma: sau cơn hen dù đã đỡ cần khám khẩn trong 2 ngày."
  references: [byt-qd-1851-2020, gina-2026, nhs-asthma-attack]
author: "agent:pass-c"
notes_vi: "Ca dễ nhầm với viêm phế quản cấp: bối cảnh cảm lạnh, ho có đờm; phân biệt nhờ tiền sử hen, khò khè, khó thở về đêm, cơn tương tự trước đây."
