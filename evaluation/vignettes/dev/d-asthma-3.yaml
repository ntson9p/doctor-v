id: d-asthma-3
set: dev
title_vi: "Nam 30 tuổi bị hen, ho đờm và khò khè 4 ngày sau cảm, khó thở về đêm"
narrative_vi: "Anh H., 30 tuổi, ở Cần Thơ, bị hen từ thời đi học, lâu nay ít lên cơn. Năm ngày trước bị cảm, sổ mũi; bốn ngày nay ho nhiều, có đờm trắng, khò khè, đêm phải dậy xịt thuốc vì khó thở. Ban ngày hụt hơi khi đi nhanh, ngồi yên thì bình thường, nói được cả câu. Xịt thuốc cắt cơn thì đỡ. Không sốt, không đau ngực, không tức ngực. Đã từng có những đợt giống hệt khi bị cảm. Không hút thuốc."
