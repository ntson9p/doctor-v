id: d-lung-cancer-1
set: dev
title_vi: "Nam 66 tuổi hút thuốc 40 năm, ho hơn 2 tháng, đờm lẫn máu, sụt 5 kg"
narrative_vi: "Ông M., 66 tuổi, ở Nam Định, hút thuốc lá 40 năm, vẫn đang hút. Hơn 2 tháng nay ho không hết, ho khan là chính, gần đây đờm có lẫn vài vệt máu. Sụt khoảng 5 kg trong 3 tháng, ăn kém, mệt. Không sốt, không ra mồ hôi đêm, không khó thở, không đau ngực. Không có ai quanh mình bị lao. Chưa từng được nói bị bệnh phổi."
