source:
  basis: "Ung thư phổi điển hình: người từ 40 tuổi hút thuốc, ho kéo dài, ho ra máu, sụt cân (NICE NG12 mục 1.1.1: chuyển khám theo đường nghi ung thư; Hamilton 2005). NHS Lung cancer và Coughing up blood: ho ra máu thì khám bác sĩ khẩn hoặc gọi 111 (mức 3)."
