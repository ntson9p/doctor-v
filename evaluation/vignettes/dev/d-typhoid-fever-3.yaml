title_vi: "Nữ 30 tuổi ở Sóc Trăng, tháng 8, sốt 7 ngày, đau bụng, nôn, đau đầu"
narrative_vi: "Chị L., 30 tuổi, ở Sóc Trăng. Bảy ngày nay sốt tăng dần, nay 39–40°C, đau đầu, mệt lừ, chán ăn, đau bụng âm ỉ vùng bụng dưới bên phải và quanh rốn, bụng hơi chướng, buồn nôn, nôn 1 lần. Đi ngoài phân lỏng 2 ngày nay. Không chảy máu chân răng, không nổi ban, không đau mỏi khớp, không đau sau hốc mắt. Tỉnh táo. Khu phố đang có sốt xuất huyết nhưng nhà không ai bị."
