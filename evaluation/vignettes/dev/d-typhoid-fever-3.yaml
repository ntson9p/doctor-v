source:
  basis: "Thương hàn tuần thứ 2 (5642: sốt tăng dần rồi cao liên tục, bụng chướng, đau hố chậu phải, tiêu chảy) xảy ra giữa mùa sốt xuất huyết, dễ nhầm với sốt xuất huyết ở giai đoạn nguy hiểm và với bệnh ngoại khoa vùng hố chậu phải. Chưa có biến chứng (không đau bụng dữ dội, bụng không cứng, không đi ngoài phân đen): khám và cấy máu trong ngày."
