title_vi: "Nữ 26 tuổi, cơn sợ hãi dữ dội kèm tim đập nhanh, run, tê đầu ngón tay, tự hết sau 15 phút"
narrative_vi: "Chị T., 26 tuổi, dạo này căng thẳng công việc. Tối qua đang ngồi xe buýt thì bỗng sợ hãi dữ dội như sắp chết, tim đập nhanh và mạnh, run tay, vã mồ hôi, tê bì đầu ngón tay, choáng váng nhưng không như sắp ngất. Cơn lên mạnh nhất trong vài phút, khoảng 15 phút sau đỡ dần. Tháng trước chị cũng có một cơn giống hệt. Không đau ngực, không khó thở. Không có thai, kinh nguyệt đều. Không sụt cân, không sợ nóng. Chưa đo mạch."
