  basis: "Cơn hoảng sợ điển hình: sợ hãi dữ dội đến đột ngột, đạt đỉnh trong vài phút, kèm tim đập nhanh, run, vã mồ hôi, tê bì, chóng mặt; kéo dài 5–20 phút; tái diễn (NHS Panic disorder; MSD). Không có đau ngực, khó thở, ngất; NHS: khám bác sĩ gia đình."
