  basis: "Thuyên tắc phổi sau bất động (bó bột, nằm lâu, ESC 2019 bảng 3): đau ngực kiểu màng phổi đột ngột, khó thở, tim nhanh; chân bó bột nên không tự thấy sưng bắp chân; chưa có ngất, sốc. NHS Pulmonary embolism: 'Call 999 or go to A&E', theo quy ước của lượt R là mức 2 (quy tắc rf_chest_pain_breathless, rf_pe_signs mức 2)."
