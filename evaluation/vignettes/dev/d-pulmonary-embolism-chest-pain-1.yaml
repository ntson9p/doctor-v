id: d-pulmonary-embolism-chest-pain-1
set: dev
title_vi: "Nam 36 tuổi bó bột chân 2 tuần, 6 giờ nay đau nhói ngực trái khi hít sâu, hơi khó thở, tim đập nhanh"
narrative_vi: "Anh T., 36 tuổi, ở Hải Dương, bị gãy xương cẳng chân phải, đang bó bột, nằm nhiều 2 tuần nay. Khoảng 6 giờ trước đột ngột đau nhói ngực trái, hít sâu thì đau hơn, đau vừa phải, đến giờ vẫn đau. Kèm hơi khó thở khi đi lại, ngồi nghỉ thì đỡ, tim đập nhanh. Không ho ra máu, không ho, không sốt. Không vã mồ hôi, không buồn nôn, không choáng. Ấn vào ngực không đau thêm. Không đau lan ra tay, hàm, lưng. Chưa từng bị cục máu đông, không có ung thư. Không hút thuốc."
