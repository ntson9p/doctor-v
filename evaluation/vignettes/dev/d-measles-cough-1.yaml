source:
  basis: "Sởi ở trẻ chưa tiêm, có tiếp xúc trong thời gian ủ bệnh: giai đoạn khởi phát 2–4 ngày (sốt cao, ho, chảy mũi, viêm kết mạc) rồi phát ban từ sau tai, mặt lan xuống (1019/QĐ-BYT mục 2.1.1; MSD Measles). Mức 3: khám trong 24 giờ để được xác định bệnh, uống vitamin A và hướng dẫn cách ly (1019/QĐ-BYT); không có dấu hiệu nặng."
