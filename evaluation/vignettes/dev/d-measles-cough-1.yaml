id: d-measles-cough-1
set: dev
title_vi: "Bé trai 3 tuổi chưa tiêm sởi, ho 4 ngày, sốt cao, đỏ mắt, hôm nay nổi ban sau tai lan xuống mặt"
narrative_vi: "Bé Đ., 3 tuổi, ở Đồng Nai, chưa được tiêm vắc xin sởi. Bốn ngày nay bé ho nhiều, chảy nước mũi, hai mắt đỏ, chảy nước mắt, sốt cao 39,4°C. Mẹ chọn Ho vì bé ho suốt đêm. Hôm nay bé nổi ban đỏ ở sau tai, rồi lan ra mặt, cổ; ấn vào ban thì mất màu. Hai tuần trước bé chơi với một bạn bị sởi. Bé vẫn uống được, không nôn, không thở nhanh, không li bì, không co giật. Không ho ông ổng, không khàn tiếng."
