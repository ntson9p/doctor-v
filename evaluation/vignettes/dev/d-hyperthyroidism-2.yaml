source:
  basis: "Ca không điển hình (cường giáp vô cảm ở người cao tuổi): sụt cân, rung nhĩ, khó thở là biểu hiện chính, không run, không lồi mắt (MSD; 3879/QĐ-BYT: người cao tuổi biểu hiện tim mạch rầm rộ, thể vô cảm chủ yếu gầy sút; Boelaert 2010: sụt cân, khó thở không giảm theo tuổi). Rung nhĩ là chẩn đoán đồng thời nên chấp nhận rối loạn nhịp tim. Rung nhĩ mới ở người cao tuổi cần điện tim và xét nghiệm sớm (ESC 2024): mức 3."
  references: [msd-hyperthyroidism, byt-qd-3879-2014, boelaert-jcem-2010, esc-af-2024]
