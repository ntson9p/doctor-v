id: d-hyperthyroidism-2
set: dev
title_vi: "Nam 72 tuổi sụt cân, mệt, tim đập không đều, hụt hơi khi gắng sức, không run tay"
narrative_vi: "Ông B., 72 tuổi, ba tháng nay sụt 6 kg, mệt, hay thấy tim đập không đều, đi lên vài bậc thang đã hụt hơi. Con trai đo máy thấy mạch khoảng 120, không đều. Ông không run tay, không sợ nóng, mắt không lồi, không thấy cổ to. Không đau ngực, không khó thở lúc nghỉ, không ngất. Không có bệnh tim đã biết."
