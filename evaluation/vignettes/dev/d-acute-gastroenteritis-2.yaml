source:
  basis: "Ca không điển hình về tuổi và triệu chứng chính (cha mẹ chọn \"Sốt\"). Tiêu chảy cấp không mất nước ở trẻ: điều trị tại nhà theo phác đồ A, hướng dẫn cha mẹ dấu hiệu cần đưa trẻ đi khám ngay (3312/QĐ-BYT, bài Tiêu chảy cấp; WHO 2005 mục 4.2). Trẻ trên 12 tháng, uống được, không có dấu hiệu nguy hiểm nên theo dõi tại nhà (NHS)."
  references: [byt-qd-3312-2015, who-diarrhoea-2005, nhs-diarrhoea-vomiting]
author: "agent:pass-c"
notes_vi: "Kiểm tra lời dặn của lô 3: viêm dạ dày – ruột có sốt không được đẩy lên mức 2 chỉ vì viêm ruột thừa."
