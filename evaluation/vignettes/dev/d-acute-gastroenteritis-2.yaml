title_vi: "Bé trai 18 tháng, sốt 38,5°C, nôn, tiêu chảy, chưa mất nước"
narrative_vi: "Bé T., 18 tháng tuổi. Sốt 38,5°C từ hôm qua, nôn 3 lần, từ đêm qua đi ngoài phân lỏng toé nước 6 lần, không có máu. Bé hay quấy, có vẻ đau bụng nhưng không khóc thét từng cơn. Bé vẫn bú và uống nước được, còn đi tiểu, mắt không trũng, tỉnh táo. Không ho, không sổ mũi, không phát ban."
