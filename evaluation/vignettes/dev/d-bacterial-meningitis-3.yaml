title_vi: "Nữ 38 tuổi, đau đầu tăng dần từ hôm qua, sốt, nôn, sợ ánh sáng, cứng gáy"
narrative_vi: "Chị P., 38 tuổi, ở Bắc Ninh. Đau đầu từ chiều hôm qua, tăng dần chứ không đột ngột, nay rất đau khắp đầu và gáy. Sốt 38,8°C, buồn nôn, nôn 2 lần, sợ ánh sáng, cổ cứng khó cúi. Chưa từng đau đầu kiểu này. Tỉnh táo, không co giật, không yếu tay chân, không nhìn mờ, không bị va đập đầu. Không nổi ban."
