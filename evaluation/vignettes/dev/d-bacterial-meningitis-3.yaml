source:
  basis: "Đau đầu tăng dần trong một ngày kèm sốt, nôn, sợ ánh sáng, cứng gáy là hội chứng màng não (5642). Dễ nhầm với xuất huyết dưới nhện (cũng cứng gáy, nôn) nhưng không có kiểu khởi phát sét đánh. Cứng gáy cần chuyển cấp cứu (5642: bệnh cấp cứu; NHS Meningitis)."
