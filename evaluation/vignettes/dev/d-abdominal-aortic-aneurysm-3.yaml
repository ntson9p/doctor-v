id: d-abdominal-aortic-aneurysm-3
set: dev
title_vi: Nam 74 tuổi từng bị sỏi thận, đột ngột đau dữ dội hông trái lan xuống bẹn, vã mồ hôi, da tái (dễ nhầm cơn đau quặn thận)
narrative_vi: Ông K., 74 tuổi, hút thuốc, tăng huyết áp, 5 năm trước bị sỏi thận trái. Hai giờ trước đột ngột đau dữ dội hông lưng trái, lan ra bụng dưới trái và xuống bẹn, đau liên tục không dứt. Ông nghĩ sỏi thận tái phát. Ông vã mồ hôi lạnh, buồn nôn, người nhà thấy da tái, tay chân lạnh. Chưa ngất. Không sốt, không tiểu buốt, nước tiểu không đỏ, không nôn, không đau ngực.
