  basis: "Vỡ phình hay bị chẩn đoán nhầm nhất là cơn đau quặn niệu quản (Azhar 2014). Người cao tuổi hút thuốc, đau liên tục (không thành cơn), không tiểu máu, kèm vã mồ hôi, da tái, tay chân lạnh gợi ý mất máu. NHS: đau bụng hoặc lưng đột ngột dữ dội, da tái thì gọi 999 (mức 1)."
