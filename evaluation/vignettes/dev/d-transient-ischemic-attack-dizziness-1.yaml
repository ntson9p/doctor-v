source:
  basis: "Cơn thiếu máu não thoáng qua tuần hoàn sau (chóng mặt, nhìn đôi, đi không vững, hết trong 20 phút) ở người rung nhĩ ngừng thuốc chống đông (Ton 2024: 15,1% người nhồi máu não, cơn thoáng qua ở Việt Nam có rung nhĩ). 3312/QĐ-BYT (2024): điều trị dự phòng ngay, tối ưu trong 24 giờ đầu; quy tắc rf_transient_neuro mức 2."
