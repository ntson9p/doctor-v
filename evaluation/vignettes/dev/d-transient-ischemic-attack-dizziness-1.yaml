title_vi: Nữ 71 tuổi rung nhĩ, hôm qua chóng mặt kèm nhìn đôi 20 phút rồi tự hết
narrative_vi: Bà W., 71 tuổi, bị rung nhĩ 3 năm, đã tự ngừng thuốc chống đông vì sợ chảy máu. Hôm qua đang nấu cơm thì đột ngột chóng mặt, nhìn một thành hai, chân đi không vững, khoảng 20 phút thì hết hẳn. Hôm nay bình thường. Không đau đầu, không yếu tay chân, nói bình thường, không ngất, không đau ngực, không hồi hộp lúc đó.
