source:
  basis: "Ca không điển hình (người rất cao tuổi, không hồi hộp): ngất không báo trước khi đang ngồi, mạch dưới 40 lần/phút lúc thức. ESC 2018 bảng 6: nhịp chậm dai dẳng dưới 40 lần/phút là đặc điểm nguy cơ cao loại nặng, cần đánh giá tại khoa cấp cứu; ngất không báo trước, khi đang ngồi là đặc điểm nguy cơ loại nhẹ. Quy tắc rf_pulse_extreme (mức 2)."
