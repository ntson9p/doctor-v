title_vi: "Nữ 78 tuổi ngất đột ngột khi đang ngồi, không báo trước, con đo mạch 38"
narrative_vi: "Bà N., 78 tuổi, đang ngồi xem ti vi thì bỗng gục xuống, không có dấu hiệu gì trước, khoảng mười giây sau tỉnh lại, tỉnh táo hoàn toàn. Mấy tuần nay bà hay mệt, có lúc choáng thoáng qua. Con gái đo bằng máy huyết áp thấy mạch 38 lần mỗi phút. Không hồi hộp, không đau ngực, không khó thở, không đau đầu. Không đi ngoài phân đen. Chưa từng được nói có bệnh tim."
