id: d-heat-exhaustion-1
set: dev
title_vi: "Nam 35 tuổi làm công trường ở TP.HCM, tháng 4, chóng mặt, đau đầu, buồn nôn, vã mồ hôi sau buổi trưa nắng gắt"
narrative_vi: "Anh D., 35 tuổi, thợ xây ở TP.HCM. Trưa nay anh làm việc ngoài nắng gắt nhiều giờ, uống ít nước. Đầu giờ chiều anh thấy choáng váng, đứng dậy thì tối sầm mắt, đau đầu, buồn nôn, mệt rã rời, ra rất nhiều mồ hôi, rất khát. Anh vẫn tỉnh táo, nói chuyện bình thường, tự đi vào chỗ râm ngồi được. Không thấy mọi vật quay, không ngất, không sốt. Không đau ngực, không khó thở, không hồi hộp. Không có bệnh nền."
