source:
  basis: "Kiệt sức do nóng: mệt, chóng mặt, đau đầu, buồn nôn, ra nhiều mồ hôi, rất khát sau làm việc nặng nơi nắng nóng; vẫn tỉnh táo (NHS Heat exhaustion and heatstroke; CDC NIOSH; MSD). NHS: thường không cần cấp cứu nếu được làm mát trong 30 phút; tự xử trí bằng 4 bước làm mát (mức 5); không đỡ sau 30 phút thì gọi cấp cứu."
