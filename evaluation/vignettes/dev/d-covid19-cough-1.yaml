narrative_vi: "Chị P., 31 tuổi, ở Hà Nội. Hai ngày nay ho khan, đau họng, sổ mũi, nghẹt mũi, đau đầu, mệt, sốt nhẹ 37,8°C. Đồng nghiệp ngồi cạnh vừa dương tính COVID-19; que thử nhanh của chị lên 2 vạch. Không khó thở, không đau ngực, không mất ngửi. Không có thai, không chậm kinh. Không có bệnh nền, đã tiêm vắc xin."
