source:
  basis: "Hen dạng ho ở trẻ: ho khan kéo dài, nặng về đêm, khò khè khi gắng sức, tái lại theo mùa (GINA 2026; Australian Asthma Handbook). Ho từ 2 tuần cần được khám trong vài ngày để tìm nguyên nhân (162/QĐ-BYT; IMCI: trẻ ho trên 2 tuần chuyển khám lao, hen); không có dấu hiệu khó thở cấp."
  references: [gina-2026, nac-asthma-handbook, byt-qd-162-2024, who-imci-chart-booklet-2014]
author: "agent:pass-c"
notes_vi: "Ca không điển hình: trẻ chưa được chẩn đoán hen, ho là triệu chứng chính, không có cơn khó thở."
