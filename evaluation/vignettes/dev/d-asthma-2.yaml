id: d-asthma-2
set: dev
title_vi: "Bé trai 7 tuổi ho khan về đêm 3 tuần, khò khè khi chạy nhảy, chưa được chẩn đoán hen"
narrative_vi: "Bé Q., 7 tuổi, ở Hải Phòng. Ba tuần nay ho khan, ho nhiều về đêm và gần sáng, chạy nhảy thì ho và khò khè, nghỉ một lúc thì đỡ. Năm ngoái cũng có hai đợt ho kéo dài như vậy khi trời chuyển lạnh. Bé không sốt, không sổ mũi, không đau họng, ban ngày vẫn chơi bình thường, không khó thở lúc ngồi yên. Không ho thành cơn dồn dập, không nôn sau ho. Bé chưa được bác sĩ nói là hen. Bố bị viêm mũi dị ứng."
