title_vi: Nam 42 tuổi ở Huế, đau âm ỉ dưới sườn phải 1 tuần, đau khi hít sâu, sốt nhẹ
narrative_vi: Anh F., 42 tuổi, làm nông ở Thừa Thiên Huế, hay uống rượu. Một tuần nay đau âm ỉ dưới sườn phải, đau tăng khi hít sâu hoặc ho, có lúc lan lên vai phải. Sốt nhẹ về chiều, vã mồ hôi, sụt 2 kg. Không vàng da, không tiêu chảy, không nôn, không ho đờm, không khó thở. Không bị tiểu đường.
