source:
  basis: "Áp xe gan do amip ở nam giới miền Trung (Blessmann 2002: Huế lưu hành cao, trên 80% là nam): khởi phát âm ỉ, đau vùng gan lan lên vai phải, đau khi hít sâu do ổ sát cơ hoành, sốt nhẹ, sụt cân (MSD). Cần siêu âm gan trong ngày (mức 3)."
