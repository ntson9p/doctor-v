source:
  basis: "Đau thượng vị rát, cồn cào, đỡ khi ăn, đau về đêm, tái đi tái lại; dùng thuốc chống viêm không steroid là nguyên nhân chính (MSD; NHS Stomach ulcer). Không có dấu hiệu báo động (nôn ra máu, phân đen, sụt cân, nôn kéo dài), nên khám trong vài ngày (NHS: khám bác sĩ khi đau hay tái lại; kb-guide mục 2.5)."
