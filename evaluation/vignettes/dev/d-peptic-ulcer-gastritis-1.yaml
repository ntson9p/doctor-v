title_vi: "Nam 45 tuổi, 3 tháng đau rát vùng trên rốn lúc đói, ăn vào đỡ, hay dùng thuốc giảm đau"
narrative_vi: "Anh P., 45 tuổi. Ba tháng nay hay đau rát, cồn cào vùng trên rốn, đau lúc đói và về đêm, ăn vào thì đỡ, thỉnh thoảng ợ chua. Hay uống thuốc giảm đau vì đau khớp gối. Không buồn nôn, không nôn, không nôn ra máu, không đi ngoài phân đen, không sốt, không sụt cân. Đau không dữ dội, không lan ra sau lưng. Không hút thuốc, ít uống rượu."
