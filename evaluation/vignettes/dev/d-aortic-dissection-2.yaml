source:
  basis: "Bóc tách động mạch chủ ở nữ cao tuổi, biểu hiện không điển hình: đau lưng, đau bụng, gục hoặc ngất hay gặp hơn ở nữ (Methorst 2026); đau như xé không phải mô tả phổ biến (IRAD, Evangelista 2016); đau bụng làm chẩn đoán muộn hơn. Đau ngực, lưng đột ngột dữ dội kèm ngất là cấp cứu (HSE; NHS Chest pain: gọi 999): mức 1."
