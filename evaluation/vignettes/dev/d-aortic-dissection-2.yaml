id: d-aortic-dissection-2
set: dev
title_vi: "Nữ 74 tuổi tăng huyết áp, đột ngột đau lưng trên và ngực, đau bụng, suýt ngất; không tả là đau như xé"
narrative_vi: "Bà H., 74 tuổi, ở TP.HCM, bị tăng huyết áp. Khoảng 1 giờ trước, đang tưới cây thì đột ngột đau dữ dội ở lưng trên lan ra trước ngực rồi xuống bụng, đến giờ vẫn đau. Bà không tả được là đau như xé hay như dao đâm. Lúc đó bà choáng váng như sắp ngất, phải ngồi xuống. Không vã mồ hôi, không buồn nôn, không khó thở. Đau không phải tức nặng ở giữa ngực, không tăng khi hít thở, ấn vào không đau. Không yếu tay chân, không nói khó. Không sốt. Không bị đái tháo đường, chưa được nói có bệnh tim hay phình động mạch chủ."
