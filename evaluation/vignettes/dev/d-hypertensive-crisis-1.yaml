id: d-hypertensive-crisis-1
set: dev
title_vi: "Nam 58 tuổi tăng huyết áp bỏ thuốc 1 tuần, đau đầu vùng gáy, huyết áp đo 195/120"
narrative_vi: "Ông L., 58 tuổi, ở TP.HCM, bị tăng huyết áp 5 năm. Tuần trước hết thuốc nên ông tự ngừng uống. Từ sáng ông đau đầu vùng gáy mức vừa, nặng đầu, đo huyết áp ở nhà 195/120 mmHg, nghỉ 10 phút đo lại vẫn 190/118. Ông tỉnh táo, nói rõ, không đau ngực, không khó thở, không nhìn mờ, không yếu tay chân. Không buồn nôn, không nôn. Ông từng đau đầu kiểu này khi huyết áp lên."
