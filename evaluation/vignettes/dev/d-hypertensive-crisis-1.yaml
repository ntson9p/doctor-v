source:
  basis: "Tăng huyết áp nặng (từ 180/120) không có dấu hiệu tổn thương cơ quan đích (không lú lẫn, đau ngực, khó thở, nhìn mờ, yếu liệt): MSD (biến chứng cấp ít xảy ra, không cần hạ áp ngay); 3192/QĐ-BYT (không hạ huyết áp quá nhanh); ICHD-3 mục 10.3. Khám trong hôm nay (rf_extreme_bp, mức 3)."
