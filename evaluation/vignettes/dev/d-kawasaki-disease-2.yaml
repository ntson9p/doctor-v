title_vi: "Bé gái 7 tháng, sốt cao 4 ngày, mắt đỏ, môi đỏ, chỗ tiêm phòng lao sưng đỏ lại, chưa nổi ban"
narrative_vi: "Bé H., 7 tháng tuổi, ở TP.HCM. Bé sốt 39°C liên tục 4 ngày, quấy khóc nhiều, bú kém hơn nhưng vẫn bú được. Hai mắt đỏ, không có ghèn; môi đỏ, khô. Mẹ thấy vết tiêm phòng lao ở vai trái sưng đỏ lại. Bé chưa nổi ban, tay chân không sưng, không sờ thấy hạch. Không ho, không sổ mũi, không tiêu chảy, không nôn. Bé không li bì, không co giật."
