source:
  basis: "Bệnh Kawasaki thể không điển hình ở nhũ nhi: sốt kèm ít biểu hiện chính (đỏ mắt, thay đổi môi) và sẹo BCG tấy đỏ lại (3312/QĐ-BYT 2015, mục 3.1b, 3.3b; Khreis 2026: hay gặp ở trẻ nhỏ, xuất hiện sớm). Sốt từ 3 ngày kèm 2 dấu hiệu da, niêm mạc ở trẻ: khám trong 24 giờ (rf_kawasaki_signs; NHS Kawasaki disease, mức 3)."
  references: [byt-qd-3312-2015, khreis-pedint-2026, nhs-kawasaki-disease]
