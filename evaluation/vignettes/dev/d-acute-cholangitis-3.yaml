source:
  basis: "Viêm túi mật và viêm đường mật cùng sốt, đau hạ sườn phải ở người có sỏi; sốt cao kèm rét run và vàng da gợi ý viêm đường mật (Wada 2007: vàng da 60–70%; viêm túi mật vàng da 11–14%). Tam chứng Charcot: quy tắc rf_cholangitis_triad mức 2."
