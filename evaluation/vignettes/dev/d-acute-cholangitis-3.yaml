id: d-acute-cholangitis-3
set: dev
title_vi: Nam 55 tuổi có sỏi mật, sốt cao rét run, đau dưới sườn phải, vàng mắt nhẹ (dễ nhầm viêm túi mật)
narrative_vi: Ông R., 55 tuổi, biết có sỏi mật 3 năm nay. Từ hôm qua sốt 39°C kèm rét run, đau dưới sườn phải lan lên vai phải, buồn nôn. Vợ ông thấy mắt ông hơi vàng. Không nôn, không tiêu chảy, không ho, không tiểu buốt. Ông vẫn tỉnh táo, đi lại được.
