id: d-chest-wall-pain-1
set: dev
title_vi: "Nữ 34 tuổi đau nhói ngực trái 3 ngày sau khi khiêng đồ, ấn vào đau, tăng khi cử động và hít sâu"
narrative_vi: "Chị M., 34 tuổi, ở Đà Nẵng. Ba ngày trước chị chuyển nhà, khiêng nhiều đồ nặng. Từ hôm sau thấy đau nhói ở ngực trái, đau âm ỉ suốt ngày, xoay người, với tay hoặc hít sâu thì nhói hơn. Ấn tay vào chỗ đau giữa các xương sườn thì đau nhói đúng chỗ đó. Đau không lan ra tay, hàm hay lưng, không tức nặng giữa ngực, không đau khi đi bộ nhanh rồi hết khi nghỉ. Không khó thở, không vã mồ hôi, không buồn nôn, không choáng. Không sốt, không ho. Da chỗ đau bình thường, không nổi ban. Chưa từng bị như vậy. Không hút thuốc, không dùng thuốc tránh thai. Không có thai, không chậm kinh."
