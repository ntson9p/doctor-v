id: d-pneumothorax-1
set: dev
title_vi: "Nam 22 tuổi cao gầy, hút thuốc, đang ngồi học thì đột ngột đau nhói ngực phải khi hít sâu, hơi khó thở"
narrative_vi: "Anh Q., 22 tuổi, sinh viên ở Hà Nội, người cao gầy, hút thuốc lá mỗi ngày nửa bao. Khoảng 3 giờ trước, đang ngồi học thì đột ngột đau nhói ở ngực bên phải, đau vừa phải, không dữ dội. Từ đó vẫn đau, hít sâu hoặc ho thì đau tăng. Đi lại thấy hơi khó thở, ngồi yên thì đỡ, vẫn nói được cả câu. Ấn tay vào ngực không thấy đau thêm. Không sốt, không ho, không vã mồ hôi, không buồn nôn, không choáng. Đau không lan ra tay, hàm hay sau lưng. Chưa từng bị như vậy, không có bệnh phổi. Không có máy đo SpO2."
