source:
  basis: "Tràn khí màng phổi tự phát nguyên phát điển hình: nam trẻ, cao gầy, hút thuốc, đau ngực một bên đột ngột lúc nghỉ, đau kiểu màng phổi, khó thở (4235/QĐ-BYT bài Tràn khí màng phổi; Olesen 2019; MSD). Cần chụp X quang phổi ở cơ sở cấp cứu, hút khí hoặc dẫn lưu tùy lượng khí (4235/QĐ-BYT): mức 2."
