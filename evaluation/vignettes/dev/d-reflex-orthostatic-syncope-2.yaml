id: d-reflex-orthostatic-syncope-2
set: dev
title_vi: "Nam 67 tuổi tăng huyết áp, vừa tăng liều thuốc hạ áp, ngất thoáng qua khi vừa đứng dậy"
narrative_vi: "Ông T., 67 tuổi, tăng huyết áp, tuần trước được bác sĩ tăng liều thuốc hạ áp. Mấy hôm nay cứ đứng dậy là choáng, tối sầm mắt. Sáng nay vừa ngồi dậy rồi đứng lên khỏi giường thì tối sầm mắt, khuỵu xuống, mất ý thức vài giây rồi tỉnh, sau đó tỉnh táo hoàn toàn. Không đau ngực, không khó thở, không hồi hộp. Không đi ngoài phân đen, không nôn ra máu. Chưa từng được nói có bệnh tim. Chưa đo mạch."
