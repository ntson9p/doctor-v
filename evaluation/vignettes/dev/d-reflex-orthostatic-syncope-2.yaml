source:
  basis: "Ca không điển hình (người cao tuổi, hạ huyết áp tư thế do thuốc): ngất ngay khi vừa đứng dậy, có tiền triệu, mới tăng liều thuốc hạ áp (ESC 2018 bảng 5; hướng dẫn thực hành ESC 2018 bảng web 1: thuốc vận mạch, lợi tiểu gây hạ huyết áp tư thế). Không có đặc điểm nguy cơ cao của bảng 6 ESC; NHS Fainting và NHS Low blood pressure: khám bác sĩ gia đình (không khẩn), có thể cần đổi thuốc. Ca kiểm tra lo ngại của lượt B: người 50–70 tuổi ngất lành tính không bị đẩy lên mức 2 chỉ vì xác suất."
