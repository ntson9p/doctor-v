id: d-acute-angle-closure-glaucoma-1
set: dev
title_vi: "Nữ 62 tuổi, tối nay đột ngột đau nhức dữ dội mắt phải lan lên nửa đầu, mắt đỏ, nhìn mờ, thấy quầng sáng quanh đèn, nôn"
narrative_vi: "Bà H., 62 tuổi, ở Hải Phòng. Tối nay sau khi xem phim trong phòng tối, bà đột ngột đau nhức dữ dội trong mắt phải, đau lan lên nửa đầu bên phải. Mắt phải đỏ, nhìn mờ như qua màn sương, nhìn bóng đèn thấy vòng sáng xanh đỏ. Bà buồn nôn, đã nôn 1 lần, chói mắt, chảy nước mắt. Đau đã khoảng 2 giờ, chưa từng đau như vậy. Không sốt, không cứng gáy, không yếu tay chân, nói rõ. Bà bị tăng huyết áp, uống thuốc đều."
