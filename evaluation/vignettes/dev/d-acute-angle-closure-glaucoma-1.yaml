  basis: "Glôcôm góc đóng cơn cấp điển hình: khởi phát đột ngột về chiều tối, đau nhức mắt lan lên nửa đầu cùng bên, nhìn mờ như qua màn sương, nhìn đèn có quầng xanh đỏ, buồn nôn, nôn (40/QĐ-BYT 2015, bài Glôcôm góc đóng nguyên phát, mục 3a). NHS Glaucoma: triệu chứng xuất hiện đột ngột thì gọi 999 hoặc đến cấp cứu (mức 2)."
