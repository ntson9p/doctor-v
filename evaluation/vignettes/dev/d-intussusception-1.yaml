  basis: "Ca điển hình ở Việt Nam: trẻ dưới 2 tuổi đau bụng từng cơn (98,9%), nôn (84,5%), phân máu chỉ 17% (Tran 2013; Bines 2006). Cần đưa trẻ đến viện sớm để tháo lồng, vì đến sau 48 giờ tỷ lệ phải cắt ruột và tử vong cao hơn rõ (WHO 2002)."
