id: d-bronchiolitis-1
set: dev
title_vi: "Bé trai 4 tháng, sổ mũi 3 ngày rồi ho, thở nhanh, khò khè, sốt nhẹ"
narrative_vi: "Bé A., 4 tháng tuổi, ở Hà Nội, tháng 12. Ba ngày trước bé sổ mũi, nghẹt mũi, hắt hơi; anh trai 3 tuổi đang bị cảm. Hai ngày nay bé ho nhiều, thở nhanh hơn bình thường, nghe khò khè trong ngực. Hôm qua sốt 38,2°C. Bé vẫn bú được khoảng ba phần tư so với mọi ngày, vẫn đi tiểu đều. Ngực không lõm sâu khi thở, không thở rên, không lúc nào ngừng thở hay tím môi, không li bì. Không ho thành cơn rít, không ho ông ổng. Chưa đo ô xy."
