source:
  basis: "Viêm tiểu phế quản điển hình: trẻ dưới 1 tuổi, viêm long 1–3 ngày rồi ho dai dẳng, thở nhanh, khò khè; sốt dưới 39°C (NICE NG9 khuyến cáo 1.1.1–1.1.4; 3312/QĐ-BYT bài Viêm tiểu phế quản). Không có dấu hiệu chuyển cấp cứu (ngừng thở, thở rên, rút lõm rõ, tím: NG9 1.2.1). Mức 3: khám trong ngày để đếm nhịp thở, đo SpO2 (NG9 1.1.8); NHS Bronchiolitis khuyên khám khẩn khi bé thở nhanh, bú ít."
