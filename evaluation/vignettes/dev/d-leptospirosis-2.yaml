source:
  basis: "Bệnh do Leptospira thể nặng (hội chứng Weil: vàng da, suy thận) ở người làm ruộng (WHO 2003 chương II: thể nặng cần nhập viện, lọc máu khi suy thận; Levett 2001: thể vàng da diễn biến nhanh, tử vong 5–15%). Sốt sau lội nước kèm vàng da, tiểu ít: đến cấp cứu ngay (rf_lepto_severe, mức 2)."
