title_vi: "Nam 52 tuổi ở An Giang, cấy lúa, sốt ngày thứ 6, vàng mắt, tiểu ít"
narrative_vi: "Ông P., 52 tuổi, cấy lúa ở An Giang, nhà nhiều chuột. Sáu ngày nay ông sốt 39°C, đau đầu, đau mỏi người, đau hai bắp chân. Từ hôm qua vợ thấy lòng trắng mắt ông vàng, nước tiểu sẫm và ít hẳn, cả buổi sáng chỉ đi tiểu một lần. Ông mệt nhiều nhưng vẫn tỉnh táo, tự đi lại được. Không chảy máu chân răng, không ho ra máu, không khó thở. Không nổi ban, không nôn."
