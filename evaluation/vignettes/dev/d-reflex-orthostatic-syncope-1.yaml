source:
  basis: "Ngất phế vị điển hình: đứng lâu nơi nóng, có tiền triệu nóng người, vã mồ hôi, buồn nôn, hồi phục nhanh, tái diễn từ trẻ, không có đặc điểm nguy cơ cao (ESC 2018 bảng 5–6). NHS Fainting: mọi người đã ngất nên khám bác sĩ gia đình (không khẩn)."
