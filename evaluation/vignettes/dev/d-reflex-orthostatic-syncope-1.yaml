id: d-reflex-orthostatic-syncope-1
set: dev
title_vi: "Nữ 22 tuổi ngất khi đứng lâu dưới nắng, có báo trước, tỉnh lại ngay"
narrative_vi: "Chị L., 22 tuổi, đứng xếp hàng ngoài nắng gần một giờ thì thấy nóng người, vã mồ hôi, buồn nôn, tối sầm mắt rồi ngã xuống. Người xung quanh đỡ nằm, chị tỉnh lại sau khoảng nửa phút, vài phút sau đi lại bình thường. Hồi học cấp ba chị cũng từng ngất như vậy hai lần. Không đau ngực, không khó thở, không thấy tim đập loạn, không đau bụng, không đau đầu. Không có thai, kinh nguyệt đều."
