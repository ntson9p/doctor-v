id: d-upper-gi-bleeding-1
set: dev
title_vi: "Nam 58 tuổi uống thuốc xương khớp, hai ngày đi ngoài phân đen, hôm nay suýt ngất"
narrative_vi: "Ông L., 58 tuổi, hay uống thuốc xương khớp vì đau gối. Hai ngày nay đi ngoài phân đen như hắc ín, hơi đau vùng trên rốn. Sáng nay vừa đứng dậy thì choáng, tối sầm mắt, suýt ngã trong nhà vệ sinh, phải ngồi xuống. Da xanh. Không nôn ra máu, không đau ngực, không khó thở. Không có xơ gan, không uống thuốc chống đông. Chưa đo mạch."
