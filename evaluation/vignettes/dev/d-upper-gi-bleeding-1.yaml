source:
  basis: "Xuất huyết tiêu hóa trên điển hình do thuốc chống viêm không steroid: phân đen, đau thượng vị, choáng, suýt ngất khi đứng, da xanh (MSD; Anh 2025). NHS Stomach ulcer: phân đen thì gọi 999 hoặc đến cấp cứu; ESC 2018: nghi chảy máu tiêu hóa là nguy cơ cao. Kèm choáng, suýt ngất là dấu hiệu mất máu nhiều: quy tắc rf_syncope_gi_bleeding (mức 1). Chấp nhận viêm, loét dạ dày – tá tràng (nguồn chảy máu)."
