title_vi: "Nữ 20 tuổi, sốt xuất huyết ngày 5, hết sốt nhưng mệt lả, chân tay lạnh, tiểu ít"
narrative_vi: "Chị U., 20 tuổi, sinh viên ở Đà Nẵng, không mang thai. Khu trọ có nhiều người bị sốt xuất huyết. Chị sốt cao 39,5°C 4 ngày, kèm đau đầu, đau sau hốc mắt, đau mỏi người. Hôm nay là ngày thứ 5, chị hết sốt nhưng đau bụng nhiều, nôn liên tục, mệt lả không đứng dậy nổi, choáng váng như sắp ngất. Tay chân lạnh, vã mồ hôi, từ sáng đến giờ gần như không đi tiểu."
