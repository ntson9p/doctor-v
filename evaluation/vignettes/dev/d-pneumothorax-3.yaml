id: d-pneumothorax-3
set: dev
title_vi: "Nam 68 tuổi bị bệnh phổi tắc nghẽn mạn tính, đang ngồi nghỉ đột ngột khó thở nặng hơn, đau ngực phải khi hít vào"
narrative_vi: "Ông L., 68 tuổi, ở Thái Bình, bị bệnh phổi tắc nghẽn mạn tính nhiều năm, vẫn hút thuốc lào. Mấy tuần nay bệnh ổn, vẫn đi lại quanh nhà được. Khoảng 1 giờ trước, đang ngồi xem ti vi thì đột ngột khó thở hơn hẳn, ngồi yên cũng thở mệt nhưng vẫn nói được cả câu, kèm đau nhói ngực phải, hít vào thì đau. Ông chưa xịt thuốc. Không sốt, không ho nhiều hơn mọi ngày, đờm không đổi màu, không khò khè hơn. Không vã mồ hôi, không buồn nôn, không choáng. Không sưng chân. Nhà không có máy đo SpO2."
