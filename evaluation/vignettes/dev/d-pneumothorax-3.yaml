source:
  basis: "Tràn khí màng phổi thứ phát trên nền bệnh phổi tắc nghẽn mạn tính: nghĩ tới khi người bệnh đang ổn định đột nhiên suy hô hấp nặng (4235/QĐ-BYT); khó thở đột ngột kèm đau kiểu màng phổi, không có dấu hiệu nhiễm trùng của đợt cấp (sốt, đờm đổi màu). Mọi tràn khí thứ phát phải dẫn lưu (4235/QĐ-BYT): cấp cứu ngay, mức 2."
  references: [byt-qd-4235-2012, msd-pneumothorax, chan-annacadmedsingap-1985]
author: "agent:pass-c"
notes_vi: "Ca dễ nhầm với đợt cấp bệnh phổi tắc nghẽn mạn tính (phần a) và thuyên tắc phổi."
