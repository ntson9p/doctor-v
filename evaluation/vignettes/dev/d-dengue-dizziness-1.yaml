title_vi: "Nam 24 tuổi ở TP.HCM, tháng 8, sốt ngày thứ 4, chóng mặt từ sáng, choáng khi đứng, tiểu ít"
narrative_vi: "Anh H., 24 tuổi, ở TP.HCM. Sốt 4 ngày nay, cao nhất 39°C, nay còn khoảng 38°C, đau đầu, đau mỏi người. Từ sáng nay chóng mặt suốt, đứng dậy thì choáng, suýt ngất, phải ngồi xuống. Từ sáng đến chiều chỉ đi tiểu một lần, ít. Không chảy máu chân răng, không chảy máu mũi, không nổi chấm đỏ, không đau bụng, không nôn, không khó thở. Không ho, không sổ mũi, không đau họng. Không thấy quay. Không rõ quanh nhà có ai bị sốt xuất huyết không."
