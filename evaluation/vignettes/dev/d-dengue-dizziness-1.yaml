source:
  basis: "Sốt xuất huyết ở giai đoạn nguy hiểm (ngày 3–7) có dấu hiệu cảnh báo: tiểu ít (2760 Phụ lục 2); choáng váng hoặc hạ huyết áp tư thế là tiêu chí nhập viện (WHO 2009 Textbox E), là dấu hiệu cảnh báo theo CDC, PAHO (Mahabala 2023). Theo 2760, người có dấu hiệu cảnh báo được cho nhập viện: đến cơ sở cấp cứu ngay (quy tắc rf_fever_critical_phase_signs)."
