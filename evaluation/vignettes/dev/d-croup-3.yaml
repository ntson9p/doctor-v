source:
  basis: "Viêm thanh quản cấp: ho ông ổng, khàn tiếng sau 1–3 ngày viêm long, sốt nhẹ (Smith 2018; MSD Croup). Cha mẹ có thể gọi tiếng rít khi khóc là 'khò khè'; khò khè thật nếu có thường nhẹ (Smith 2018), còn viêm tiểu phế quản không có ho ông ổng. Không thở rít lúc nằm yên, không rút lõm: thể nhẹ. NHS Croup: khám khẩn (mức 3)."
  references: [smith-afp-2018, msd-croup, nhs-croup]
author: "agent:pass-c"
notes_vi: "Ca dễ nhầm với viêm tiểu phế quản (người nhà trả lời có khò khè)."
