title_vi: "Bé gái 13 tháng sổ mũi 2 ngày, ho ông ổng, khóc khàn, mẹ tả là thở khò khè"
narrative_vi: "Bé M., 13 tháng tuổi, ở Cần Thơ, tháng 9. Hai ngày nay bé sổ mũi, sốt 38,3°C. Đêm qua bé ho ông ổng như tiếng chó sủa, tiếng khóc khàn đi; mẹ nghe ngực bé có tiếng khò khè khi bé khóc. Khi nằm yên, bé thở êm, không rít, không thở nhanh, ngực không lõm, không thở rên, môi hồng. Bé vẫn bú được, không chảy dãi, không li bì. Không sặc, hóc gì. Không ho thành cơn dài, không nôn sau ho."
