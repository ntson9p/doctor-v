narrative_vi: "Anh Q., 34 tuổi, ở Hà Nội. Từ hôm kia đột ngột sốt cao 39,3°C, rét run, đau nhức khắp người, đau đầu, mệt, ho khan nhiều, đau họng. Vợ và con cùng nhà đang bị cúm. Không khó thở, không đau ngực, không nôn. Không có bệnh nền, không hút thuốc. Tự xét nghiệm COVID-19 âm tính."
