id: d-acute-angle-closure-glaucoma-3
set: dev
title_vi: "Nữ 52 tuổi có tiền sử đau nửa đầu, tối nay đau nhức mắt trái và nửa đầu trái, buồn nôn, sợ ánh sáng; mắt trái đỏ"
narrative_vi: "Chị T., 52 tuổi, ở Huế. Chị bị đau nửa đầu từ trẻ, mỗi năm vài cơn. Tối nay chị đau đầu bên trái, buồn nôn, sợ ánh sáng, nghĩ là cơn đau nửa đầu nên uống thuốc giảm đau nhưng không đỡ. Lần này khác mọi lần: đau nhức dữ dội ngay trong mắt trái, mắt trái đỏ, nhìn mờ, nhìn đèn thấy vòng sáng nhiều màu. Trước cơn không thấy chớp sáng. Không sốt, không cứng gáy, không yếu tay chân. Chị không có thai, kinh nguyệt vẫn đều, không chậm kinh."
