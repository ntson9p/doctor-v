source:
  basis: "Dễ nhầm với cơn đau nửa đầu (đau một bên, buồn nôn, sợ ánh sáng). Điểm gợi ý glôcôm cấp: đau nhức trong mắt, mắt đỏ, nhìn mờ, quầng sáng nhiều màu quanh đèn, đau kiểu mới (40/QĐ-BYT mục 3a; NHS Glaucoma; ICHD-3 mục 11.3.1). Đến cấp cứu ngay (rf_acute_glaucoma_signs, mức 2)."
