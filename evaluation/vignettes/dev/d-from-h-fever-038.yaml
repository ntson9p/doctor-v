notes_vi: "Ngoài danh mục bệnh; gần giống viêm màng não do vi khuẩn nên dễ bị xếp vào bệnh đó. Chuyển từ bộ giữ kín (h-fever-038) ngày 25/10/2026: ca được dùng để sửa dữ liệu sau lần chạy đầu bộ giữ kín (cần mức 1, app ra mức 2), theo quy tắc giữ kín của docs/evaluation.md."
