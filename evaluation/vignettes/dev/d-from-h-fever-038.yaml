narrative_vi: "Bé L., 7 tuổi, ở Bắc Giang, nhà gần chuồng lợn và ruộng lúa. Hai ngày nay bé sốt 39,5°C, đau đầu nhiều, nôn nhiều lần. Sáng nay bé co giật toàn thân khoảng 2 phút, sau đó ngủ li bì, khi tỉnh thì nói lẫn lộn. Mẹ thấy cổ bé cứng, khó cúi. Bé không nổi ban, không ho, không có loét miệng."
