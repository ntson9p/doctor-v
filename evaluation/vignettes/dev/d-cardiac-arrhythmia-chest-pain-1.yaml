id: d-cardiac-arrhythmia-chest-pain-1
set: dev
title_vi: "Nữ 29 tuổi bỗng tim đập rất nhanh và đều, tức ngực, hơi choáng, cơn kéo dài 40 phút rồi dừng đột ngột"
narrative_vi: "Chị L., 29 tuổi, ở Vũng Tàu. Tối nay đang ngồi thì tim bỗng đập rất nhanh và đều, cổ đập thình thịch, kèm tức ngực, hơi choáng nhưng không như sắp ngất. Cơn kéo dài khoảng 40 phút rồi dừng đột ngột như tắt công tắc; giờ chỉ còn hơi mệt. Mấy năm nay đã có vài cơn giống vậy nhưng ngắn hơn. Không khó thở, không vã mồ hôi, không buồn nôn. Tức ngực không lan ra tay, hàm, lưng; không tăng khi hít thở; ấn vào không đau. Không run tay, không sụt cân. Không uống cà phê hay nước tăng lực. Chưa đo mạch. Không có thai, không chậm kinh."
