narrative_vi: "Chị A., 28 tuổi, ở Hà Nội. Ba ngày trước tiểu buốt, tiểu rắt. Hai ngày nay sốt cao 39,5°C kèm rét run, đau âm ỉ hông lưng bên phải, buồn nôn. Không nôn, không đau quặn, không lan xuống bẹn. Không ho, không sổ mũi, không đau họng, không tiêu chảy. Không có thai, kinh nguyệt đều."
