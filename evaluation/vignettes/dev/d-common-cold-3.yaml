  basis: "Dễ nhầm với viêm phổi. IMCI: trẻ ho hoặc khó thở, không thở nhanh, không rút lõm lồng ngực, không dấu hiệu nguy hiểm toàn thân là 'không viêm phổi: ho hoặc cảm lạnh', chăm sóc tại nhà. NICE NG143: không có dấu hiệu vàng hoặc đỏ."
