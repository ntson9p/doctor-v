title_vi: "Bé trai 3 tuổi sốt 38,5°C 2 ngày, ho, sổ mũi, không thở nhanh"
narrative_vi: "Bé K., 3 tuổi, đi nhà trẻ ở TP.HCM, đã tiêm đủ 2 mũi vắc xin sởi. Hai ngày nay sốt, cao nhất 38,5°C, ho, sổ mũi, nghẹt mũi. Bé vẫn chơi, uống nước và ăn được. Mẹ đếm nhịp thở lúc bé nằm yên khoảng 30 lần/phút, không thấy rút lõm lồng ngực. Không nôn, không co giật, không li bì, không phát ban. Bé không kêu đau tai. Trong lớp có nhiều bạn sổ mũi."
