source:
  basis: "Tăng huyết áp nặng (tâm thu từ 180) kèm triệu chứng không đặc hiệu (nặng đầu, chảy máu mũi; Zampaglione 1996, Vallelonga 2020), không có dấu hiệu tổn thương cơ quan đích: MSD (không cần hạ áp ngay, đánh giá ngoại trú); 3192/QĐ-BYT. Khám trong hôm nay (rf_extreme_bp, mức 3)."
  references: [msd-hypertensive-emergencies, byt-qd-3192-2010, zampaglione-hypertension-1996, vallelonga-jcm-2020]
author: "agent:pass-c"
notes_vi: "Ca không điển hình: lý do chính là chảy máu mũi, đau đầu nhẹ. Bản đầu dùng triệu chứng chính Chóng mặt nhưng chóng mặt ở người 66 tuổi tăng huyết áp đã đúng là mức 2 theo quy tắc rf_acute_vertigo_vascular_risk (liên tục) hoặc khả năng cơn thiếu máu não thoáng qua (từng cơn), nên đổi sang Đau đầu."
