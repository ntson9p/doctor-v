id: d-hypertensive-crisis-2
set: dev
title_vi: "Nữ 66 tuổi nặng đầu nhẹ, chảy máu mũi, hơi choáng, huyết áp đo 185/110"
narrative_vi: "Bà K., 66 tuổi, ở Đà Nẵng, bị tăng huyết áp, uống thuốc không đều. Chiều nay bà thấy nặng đầu, đau âm ỉ cả đầu mức nhẹ, hơi choáng, rồi chảy máu mũi bên trái khoảng 10 phút thì tự cầm. Con gái đo huyết áp 185/110 mmHg. Bà từng bị nặng đầu như vậy những lần huyết áp lên. Bà không thấy mọi vật quay, không ngất, đi lại vững, nói rõ, không yếu tay chân, không nhìn mờ. Không đau ngực, không khó thở, không hồi hộp. Không sốt, không buồn nôn."
