source:
  basis: "Viêm thanh quản cấp điển hình, thể nhẹ: trẻ 6 tháng–3 tuổi, sau 12–72 giờ sốt nhẹ, sổ mũi thì đột ngột ho ông ổng, khàn tiếng, nặng về đêm; chỉ rít khi khóc (Smith 2018; MSD Croup). NHS Croup: nghĩ trẻ bị viêm thanh quản cấp thì khám khẩn hoặc gọi 111 (mức 3), vì bác sĩ có thể cho thuốc; 3312/QĐ-BYT: khó thở thanh quản độ 1 điều trị ngoại trú, tái khám hằng ngày."
