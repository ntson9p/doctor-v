title_vi: "Bé trai 2 tuổi, sau 2 ngày cảm, đêm nay ho ông ổng, khàn tiếng, sốt nhẹ"
narrative_vi: "Bé T., 2 tuổi, ở Hà Nội, tháng 11. Hai ngày trước bé sổ mũi, sốt nhẹ 38,1°C. Tối nay bé bỗng ho ông ổng như chó sủa, giọng khàn, khóc khàn. Khi khóc bé có tiếng rít lúc hít vào, nằm yên thì không rít. Bé không thở nhanh, ngực không lõm, môi hồng, không chảy dãi, vẫn uống nước được, không li bì. Không bị sặc, hóc gì. Không khò khè."
