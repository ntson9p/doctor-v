source:
  basis: "Đau trùng kỳ kinh, lặp lại mỗi tháng, không sốt, không có dấu hiệu kích thích phúc mạc (MSD; NHS Period pain: tự chăm sóc). Dễ nhầm với viêm ruột thừa vì đau hố chậu phải kèm buồn nôn."
  references: [msd-dysmenorrhea, nhs-period-pain]
