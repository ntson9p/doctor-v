id: d-primary-dysmenorrhea-3
set: dev
title_vi: "Nữ 19 tuổi, đau quặn bụng dưới bên phải ngày đầu có kinh, buồn nôn nhẹ"
narrative_vi: "Em K., 19 tuổi, tháng nào cũng đau bụng khi có kinh. Hôm nay là ngày thứ nhất của kỳ kinh, đau quặn nhiều ở bụng dưới bên phải, buồn nôn nhẹ. Không sốt, đau không tăng khi đi lại, không bắt đầu từ quanh rốn, vẫn ăn uống được."
