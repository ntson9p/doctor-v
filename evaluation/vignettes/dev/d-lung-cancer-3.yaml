id: d-lung-cancer-3
set: dev
title_vi: "Nam 70 tuổi bị phổi tắc nghẽn, ho tăng 2 tháng, đờm lẫn máu, sụt 6 kg, khó thở như mọi khi"
narrative_vi: "Ông T., 70 tuổi, ở Thanh Hóa, hút thuốc lào 45 năm, được chẩn đoán bệnh phổi tắc nghẽn mạn tính 4 năm nay, lúc nào cũng hơi khó thở khi đi nhanh. Hai tháng nay ho nhiều hơn hẳn, không đỡ khi dùng thuốc xịt; tuần này đờm có lẫn vài vệt máu. Sụt 6 kg trong 3 tháng, ăn kém, mệt. Khó thở khi gắng sức như mọi khi, không nặng thêm đột ngột, ngồi nghỉ thì bình thường. Không sốt, không ra mồ hôi đêm, không đau ngực, không khò khè hơn thường ngày. Bác sĩ khám sau đó: phim phổi có khối u."
