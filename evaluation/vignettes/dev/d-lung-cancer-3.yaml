source:
  basis: "Ung thư phổi ở người bệnh phổi tắc nghẽn mạn tính hút thuốc lâu năm (bệnh đồng mắc, 2767/QĐ-BYT mục 1.2.1): ho thay đổi kéo dài, ho ra máu, sụt cân (NICE NG12). NHS Coughing up blood: ho ra máu kèm khó thở thì gọi 999 hoặc đến cấp cứu (mức 2); quy tắc rf_hemoptysis_severe."
  references: [nice-ng12, nhs-coughing-up-blood, byt-qd-2767-2023, hamilton-thorax-2005]
