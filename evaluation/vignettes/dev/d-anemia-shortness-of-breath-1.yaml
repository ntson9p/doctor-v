id: d-anemia-shortness-of-breath-1
set: dev
title_vi: "Nữ 29 tuổi kinh nguyệt nhiều, 2 tháng nay hụt hơi tăng dần khi leo cầu thang, mệt, da xanh"
narrative_vi: "Chị N., 29 tuổi, công nhân ở Bình Dương. Gần một năm nay kinh nguyệt ra nhiều, kéo dài 8 ngày. Hai tháng nay hụt hơi tăng dần, leo một tầng cầu thang đã phải dừng thở, ngồi nghỉ thì bình thường. Mệt, hay hoa mắt khi đứng dậy; người nhà bảo da xanh, môi nhợt. Không hồi hộp, không đau ngực, không ho, không sốt, không khò khè. Nằm không khó thở hơn, không phù chân. Không đi ngoài phân đen, không sụt cân. Chưa từng xét nghiệm máu. Nhà không có máy đo SpO2. Không có thai, không chậm kinh."
