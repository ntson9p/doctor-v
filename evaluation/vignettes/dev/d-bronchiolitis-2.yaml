source:
  basis: "Viêm tiểu phế quản biểu hiện bằng sốt (khoảng 30% ca sốt, thường dưới 39°C: NICE NG9 1.1.4), ho, thở nhanh sau viêm long; người nhà chưa nghe khò khè (tiêu chuẩn là khò khè hoặc ran nổ khi bác sĩ nghe phổi, NG9 1.1.3). Tại nhà không phân biệt được với viêm phổi (sốt kèm thở nhanh ở trẻ dưới 5 tuổi là viêm phổi theo IMCI), nên chấp nhận viêm phổi. Mức 3: sốt kèm thở nhanh cần khám trong ngày (IMCI; quy tắc rf_fever_breathing)."
  references: [nice-ng9, who-imci-chart-booklet-2014, nhs-bronchiolitis]
author: "agent:pass-c"
notes_vi: "Ca không điển hình (triệu chứng chính Sốt, chưa có khò khè), kiểm tra prior Sốt P3 của bệnh mới ở triệu chứng chính đã phát hành."
