id: d-bronchiolitis-2
set: dev
title_vi: "Bé gái 10 tháng, người nhà chọn Sốt: sốt 38,6°C 2 ngày, ho, sổ mũi, thở nhanh, chưa nghe khò khè"
narrative_vi: "Bé H., 10 tháng tuổi, ở Thành phố Hồ Chí Minh, tháng 8. Người nhà lo nhất là sốt nên chọn Sốt. Bé sốt 38,6°C hai ngày nay, sổ mũi, nghẹt mũi, ho từ hôm qua, thở nhanh hơn mọi ngày. Mẹ không nghe thấy khò khè. Bé bú ít hơn một chút nhưng vẫn được hơn một nửa, không nôn, không tiêu chảy, không li bì, không co giật. Không nổi ban, không có phỏng nước ở tay chân hay loét miệng. Ngực không lõm sâu, không thở rên. Chị họ học mẫu giáo đang bị cảm."
