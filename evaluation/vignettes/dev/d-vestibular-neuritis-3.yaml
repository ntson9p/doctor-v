source:
  basis: "Viêm mê nhĩ sau nhiễm vi rút (gộp trong vestibular_neuritis): chóng mặt quay liên tục kèm nghe kém, ù tai một bên (NHS Labyrinthitis; MSD). Dễ nhầm với đột quỵ động mạch tiểu não trước dưới, cũng gây chóng mặt kèm nghe kém (Tarnutzer 2011). NHS Vertigo: chóng mặt quay kèm nghe kém thì gọi 999 hoặc đến cấp cứu (mức 2; quy tắc rf_vertigo_sudden_hearing_loss)."
  references: [nhs-labyrinthitis, nhs-vertigo, msd-vestibular-neuronitis, tarnutzer-cmaj-2011]
author: "agent:pass-c"
notes_vi: "Ca dễ nhầm với đột quỵ (phần mở rộng của lô này); kiểm tra phần gộp viêm mê nhĩ."
