id: d-vestibular-neuritis-3
set: dev
title_vi: "Nữ 35 tuổi, sau cúm 1 tuần, quay cuồng liên tục kèm ù tai, nghe kém tai trái đột ngột"
narrative_vi: "Chị P., 35 tuổi. Một tuần trước bị cúm, sốt, đau họng, nay đã hết sốt. Từ sáng hôm qua đột ngột quay cuồng liên tục, nôn nhiều lần, đồng thời tai trái ù và nghe kém hẳn đi. Đi lại loạng choạng nhưng vẫn tự đi được. Không đau đầu, không đau tai, không chảy mủ tai, không nhìn đôi, không nói khó, không yếu tê tay chân. Không có thai, không chậm kinh. Chưa từng bị như vậy. Không có bệnh nền."
