source:
  basis: "Vỡ nang hoàng thể: đau đột ngột một bên bụng dưới ngay sau quan hệ, ở nửa sau chu kỳ, có khi choáng, ngất (Chen 2026: 78,6% có yếu tố khởi phát rõ, ngất 3,2%). Không chậm kinh, thử thai âm tính nên ít nghĩ chửa ngoài tử cung. Ngất hoặc choáng kèm đau bụng: mức 2 (315/QĐ-BYT: vỡ nang chảy máu có khi phải mổ cầm máu)."
