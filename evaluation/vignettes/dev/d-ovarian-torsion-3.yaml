title_vi: Nữ 23 tuổi đột ngột đau bụng dưới bên phải sau khi quan hệ, choáng muốn ngất, thử thai âm tính (dễ nhầm chửa ngoài tử cung)
narrative_vi: Chị Q., 23 tuổi, kỳ kinh đều, kỳ gần nhất cách 3 tuần, sáng nay thử thai que 1 vạch. Tối qua ngay sau khi quan hệ, chị đột ngột đau bụng dưới bên phải, đau tăng dần, lúc đi vệ sinh thấy choáng muốn ngất, vã mồ hôi. Đi lại hay xe xóc thì đau hơn. Không chậm kinh, không ra máu âm đạo, không sốt, không nôn, không tiêu chảy, không tiểu buốt.
