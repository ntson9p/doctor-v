source:
  basis: "Đau đầu cũ, giống mọi lần, đặc điểm đau đầu căng thẳng (ICHD-3; NHS: tự chăm sóc); huyết áp 150/95 ở người đang điều trị không phải tình trạng cấp (NICE NG136: chỉ cần khám trong ngày khi từ 180/120 kèm triệu chứng). Dễ nhầm với đột quỵ hoặc cơn tăng huyết áp."
  references: [ihs-ichd3-2018, nhs-tension-headaches, nice-ng136]
author: "agent:pass-c"
notes_vi: "Ca dễ nhầm với đột quỵ (bệnh nguy hiểm). Nên hẹn khám định kỳ để chỉnh thuốc huyết áp, không cần khám gấp."
