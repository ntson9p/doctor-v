title_vi: "Nam 62 tuổi, tăng huyết áp, đau đầu ê ẩm hai bên như mọi lần, huyết áp 150/95"
narrative_vi: "Ông C., 62 tuổi, bị tăng huyết áp đang uống thuốc. Nhiều năm nay thỉnh thoảng đau đầu ê ẩm hai bên, như đè nặng, nhất là khi mất ngủ. Hôm nay đau như mọi lần, mức vừa, đo huyết áp 150/95. Không yếu tay chân, không nói khó, không đi loạng choạng, không nôn."
