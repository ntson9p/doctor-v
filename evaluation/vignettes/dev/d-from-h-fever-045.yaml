title_vi: "Bé trai 4 tuổi, đau bụng quanh rốn rồi mới sốt, nôn, đi ngoài lỏng ít một, đau tăng khi đi lại"
narrative_vi: "Bé T., 4 tuổi, ở Long An. Sáng hôm qua bé kêu đau bụng quanh rốn, bỏ ăn, đến trưa nôn 2 lần. Chiều hôm qua bé bắt đầu sốt, đo được 38,6°C. Đêm qua bé đi ngoài phân lỏng 3 lần, mỗi lần ít, không có máu, nôn thêm 1 lần. Sáng nay bé mệt, không chịu chạy nhảy, đi lom khom ôm bụng; ngồi xe máy qua chỗ xóc là bé khóc vì đau bụng. Bé vẫn uống được nước, đi tiểu bình thường, tỉnh táo. Bé không ho, không sổ mũi. Trong nhà không ai bị đau bụng hay tiêu chảy. Bé đã tiêm đủ 2 mũi vắc xin sởi."
