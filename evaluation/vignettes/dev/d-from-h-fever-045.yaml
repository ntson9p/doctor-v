source:
  basis: "Viêm ruột thừa ở trẻ nhỏ không điển hình: đau quanh rốn có trước, sau đó nôn rồi mới sốt, đi ngoài lỏng ít một, đau tăng khi đi lại và khi xe xóc. Sốt xuất hiện sau đau gợi ý viêm phúc mạc đang tiến triển, trẻ nhỏ hay thủng ruột thừa sớm nên cần đến cấp cứu ngoại khoa ngay (NHS Appendicitis; Reust 2016; Humes 2006)."
  references:
    - nhs-appendicitis
    - reust-afp-2016
    - humes-bmj-2006
    - msd-appendicitis
author: "agent:vignette-holdout"
notes_vi: "Dễ nhầm viêm dạ dày – ruột cấp; manh mối là đau có trước sốt, đau tăng khi vận động, không ai ăn cùng bị bệnh. Trẻ 4 tuổi chưa tả được đau chuyển xuống bụng dưới bên phải nên câu này để 'không rõ'. Chuyển từ bộ giữ kín (h-fever-045) ngày 25/10/2026: ca được dùng làm căn cứ cho vòng sửa thứ hai sau lần chấm thứ hai (bị xếp thấp hơn mức cần), theo quy tắc giữ kín của docs/evaluation.md."
