title_vi: "Nữ 48 tuổi ở Thái Nguyên, phát cỏ, sốt 6 ngày, có vết loét vảy đen ở bẹn"
narrative_vi: "Bà M., 48 tuổi, làm ruộng ở Thái Nguyên. Mười ngày trước đi phát cỏ bờ ruộng. Sáu ngày nay sốt cao 39,5°C, có lúc rét run, đau đầu nhiều, đau mỏi người, ho khan nhẹ. Con gái phát hiện ở bẹn có vết loét tròn đóng vảy đen, không đau, kèm một cục hạch nhỏ gần đó. Không đau họng, không sổ mũi, không đau bụng, không tiêu chảy, không nổi ban. Không khó thở, tỉnh táo."
