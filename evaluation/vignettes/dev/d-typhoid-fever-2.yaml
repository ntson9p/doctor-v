title_vi: "Bé trai 7 tuổi ở Đồng Tháp, chỉ sốt kéo dài 9 ngày, đau đầu, mệt"
narrative_vi: "Bé K., 7 tuổi, ở Đồng Tháp, nhà dùng nước giếng. Chín ngày nay sốt mỗi ngày, có hôm 39°C, đau đầu, mệt, ăn kém. Không đau bụng, không tiêu chảy, không nôn, không ho, không sổ mũi, không đau họng, không nổi ban. Vẫn uống được, tỉnh táo, chơi ít hơn. Bé đã tiêm đủ 2 mũi vắc xin sởi."
