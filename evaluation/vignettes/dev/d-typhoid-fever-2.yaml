source:
  basis: "Thể không điển hình theo 5642/QĐ-BYT bài Thương hàn mục 3.4 (chỉ sốt kéo dài đơn thuần, rối loạn tiêu hóa thoáng qua hoặc không có). Ở trẻ khám ngoại trú, đau bụng chỉ có ở khoảng một nửa (Azmatullah 2015). Sốt mỗi ngày quá 7 ngày cần đi khám tìm nguyên nhân (IMCI)."
  references: [byt-qd-5642-2015, azmatullah-jgh-2015, who-imci-chart-booklet-2014]
author: "agent:pass-c"
notes_vi: "Ca khó: thương hàn hiện rất hiếm ở Việt Nam (prior P6) và ca chỉ có sốt kéo dài; mục tiêu chính là mức xử trí an toàn (mức 3), không kỳ vọng thương hàn đứng đầu."
