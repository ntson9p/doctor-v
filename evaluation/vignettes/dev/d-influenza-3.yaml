narrative_vi: "Anh P., 20 tuổi, sinh viên ở ký túc xá tại Hà Nội, nhiều bạn cùng phòng đang sốt, ho. Sáng nay đột ngột sốt 39,5°C, rét run, đau đầu dữ dội khắp đầu, đau nhức người, mệt, ho, đau họng. Cúi đầu được, cằm chạm ngực. Không sợ ánh sáng, không nôn, không lơ mơ, không phát ban. Chưa xét nghiệm COVID-19."
