title_vi: "Nam 35 tuổi, tiêu chảy, nôn từ hôm qua, hôm nay choáng khi đứng dậy rồi hết"
narrative_vi: "Anh R., 35 tuổi. Từ trưa hôm qua đi ngoài phân lỏng 6–7 lần, nôn 2 lần hôm qua, đau quặn bụng nhẹ quanh rốn. Hôm nay hết nôn, uống được nước, nhưng mỗi lần đứng dậy thì choáng, tối sầm mắt vài giây, ngồi xuống là hết. Miệng khô, khát. Vẫn đi tiểu bình thường. Không sốt, không ngất, không thấy quay, không đi ngoài ra máu, không đau bụng dữ dội. Người ăn cùng không ai bị. Không có bệnh nền."
