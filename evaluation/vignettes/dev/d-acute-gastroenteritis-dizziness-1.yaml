source:
  basis: "Mất nước nhẹ do viêm dạ dày – ruột cấp: tiêu chảy, nôn, khát, khô miệng, choáng khi đứng dậy rồi hết (NHS Dehydration; NHS Diarrhoea and vomiting). NHS: uống nhiều nước, dùng dung dịch bù nước; chỉ khám khẩn khi chóng mặt khi đứng dậy không hết, tiểu ít, tim nhanh. Không có dấu hiệu đó nên theo dõi tại nhà."
