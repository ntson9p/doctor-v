source:
  basis: "Ca không điển hình: người cao tuổi, giai đoạn sớm (mới 6 giờ, chưa đủ 24 giờ: 'đang tiến triển' theo Strupp 2022), không có cảm trước. Chẩn đoán cuối cùng là viêm dây thần kinh tiền đình, nhưng hội chứng tiền đình cấp ở người có yếu tố nguy cơ mạch máu không phân biệt được với đột quỵ tại nhà (GRACE-3; Tarnutzer 2011: 25% ± 15% là đột quỵ; 3312/QĐ-BYT: viêm mê đạo có thể nhầm với đột quỵ tiểu não), nên mức xử trí đúng là đến cấp cứu ngay (quy tắc rf_acute_vertigo_vascular_risk)."
  references: [strupp-jvestibres-2022, grace3-dizziness-2023, tarnutzer-cmaj-2011, byt-qd-3312-2024]
author: "agent:pass-c"
notes_vi: "Đột quỵ là kết quả chấp nhận được vì tại nhà ca này thật sự không phân biệt được với đột quỵ tuần hoàn sau (GRACE-3, Tarnutzer 2011); phiên dừng cấp cứu ở mức 2 chỉ hiện danh sách 'bác sĩ cần loại trừ' (bệnh mức 1–2), nên viêm dây thần kinh tiền đình (mức 3) không thể có mặt."
