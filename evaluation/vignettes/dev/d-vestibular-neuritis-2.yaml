id: d-vestibular-neuritis-2
set: dev
title_vi: "Nữ 70 tuổi, tăng huyết áp, quay cuồng liên tục từ sáng nay, nôn, chưa có cảm trước đó"
narrative_vi: "Bà N., 70 tuổi, bị tăng huyết áp, uống thuốc đều. Sáng nay khoảng 6 giờ trước, vừa thức dậy thấy mọi vật quay tròn liên tục, buồn nôn, nôn 2 lần, nằm yên thì đỡ hơn một chút. Đi lại chao đảo nhưng vẫn tự đi được vài bước không cần vịn. Không đau đầu, không nhìn đôi, không nói khó, không yếu tê tay chân, không ù tai, không nghe kém. Không sốt. Không bị cảm trước đó. Chưa từng bị như vậy. Không đái tháo đường, không bệnh tim."
