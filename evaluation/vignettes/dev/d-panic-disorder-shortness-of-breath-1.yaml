id: d-panic-disorder-shortness-of-breath-1
set: dev
title_vi: "Nữ 24 tuổi đột ngột khó thở, ngột ngạt, tim đập nhanh, tê đầu ngón tay, sợ sắp chết, SpO2 98%"
narrative_vi: "Chị M., 24 tuổi, nhân viên văn phòng ở Hà Nội, dạo này căng thẳng, mất ngủ. Tối nay đang ngồi xem điện thoại thì đột ngột thấy ngột ngạt, hít không đủ hơi, tim đập nhanh, run tay, tê đầu ngón tay và quanh miệng, sợ như sắp chết. Cơn nặng nhất trong vài phút; sau khoảng 15 phút đỡ dần. Ba tháng trước chị cũng có một cơn giống hệt. Máy kẹp ngón tay đo SpO2 98%. Không đau ngực, không ho, không sốt, không khò khè, không sưng chân, không ngất, không dùng thuốc tránh thai. Gần đây không đi xa, không nằm lâu. Không có thai, kinh nguyệt đều."
