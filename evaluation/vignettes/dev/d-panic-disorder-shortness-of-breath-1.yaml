source:
  basis: "Cơn hoảng sợ tái diễn: khởi phát đột ngột, đạt đỉnh trong vài phút, kèm khó thở, ngột ngạt, tim nhanh, run, tê bì, sợ chết; tự hết sau 5–20 phút (NHS Panic disorder; MSD). Tại nhà không phân biệt được với thuyên tắc phổi hay rối loạn nhịp: NHS Heart palpitations xếp hồi hộp kèm khó thở vào 'Call 999 or go to A&E' (mức 2)."
  references: [nhs-panic-disorder, msd-panic-disorder, nhs-heart-palpitations]
author: "agent:pass-c"
notes_vi: "Ca của bản mở rộng lô 3: cơn hoảng sợ ở triệu chứng chính Khó thở. Mức đúng 2 vì hồi hộp kèm khó thở chưa loại trừ được bệnh tim phổi tại nhà."
