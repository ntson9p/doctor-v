source:
  basis: "Dễ nhầm với lo âu, cơn hoảng sợ: bồn chồn, khó ngủ, run tay, hồi hộp gặp ở cả hai; nhưng tim nhanh liên tục (không thành cơn), sụt cân dù ăn nhiều, sợ nóng gợi ý cường giáp (3879/QĐ-BYT; NHS Overactive thyroid). MSD (cơn hoảng sợ): cần loại trừ cường giáp. NHS: khám bác sĩ gia đình để xét nghiệm máu."
