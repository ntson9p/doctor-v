title_vi: "Nữ 24 tuổi lo lắng, hồi hộp, run tay, nghĩ là lo âu, nhưng sụt cân và sợ nóng"
narrative_vi: "Chị A., 24 tuổi, hai tháng nay hay bồn chồn, lo lắng, khó ngủ, tim lúc nào cũng đập nhanh, run tay. Chị nghĩ mình bị rối loạn lo âu. Tuy vậy chị ăn nhiều hơn mà vẫn sụt 4 kg, rất sợ nóng, hay đổ mồ hôi. Không có cơn sợ hãi dữ dội, không tê bì. Không đau ngực, không khó thở, không ngất. Không có thai, kinh nguyệt ít hơn trước nhưng không chậm kinh. Chưa đo mạch."
