title_vi: "Nam 41 tuổi, 3 tuần nay gần như ngày nào cũng nóng rát sau xương ức, ợ chua sau ăn no và khi nằm"
narrative_vi: "Anh D., 41 tuổi, nhân viên văn phòng ở Hà Nội, hơi thừa cân, hay ăn tối muộn và uống bia. Ba tuần nay gần như ngày nào cũng thấy nóng rát sau xương ức, ợ chua lên miệng, nhất là sau bữa ăn no hoặc khi nằm xuống. Mỗi lần rát kéo dài khoảng nửa giờ đến một giờ rồi đỡ. Đã từng bị như vậy vài lần mấy năm trước. Không đau khi gắng sức, đi bộ nhanh không sao. Không phải tức nặng ở ngực, không lan ra tay, hàm hay lưng, không vã mồ hôi, không khó thở, không buồn nôn. Đau không tăng khi hít sâu, ấn vào ngực không đau. Không ho, không sốt. Không nuốt vướng, không sụt cân, không đi ngoài phân đen. Không hút thuốc."
