source:
  basis: "Sốt mò ở trẻ: sốt hơn 7 ngày, đau đầu, đau cơ, hạch bẹn sưng đau gần vết loét đóng vảy đen không đau, phơi nhiễm bãi cỏ mùa mưa ở Tây Nguyên. Chưa có dấu hiệu nặng nhưng cần khám trong 24 giờ để được điều trị kháng sinh đặc hiệu (5642/QĐ-BYT)."
