id: h-fever-048
set: holdout
title_vi: "Bé trai 10 tuổi ở Kon Tum, hay chăn bò trên đồi cỏ, sốt 8 ngày, hạch bẹn sưng đau, vết loét vảy đen"
narrative_vi: "Bé Y., nam, 10 tuổi, ở một xã của tỉnh Kon Tum. Hè này bé hay theo bố đi chăn bò trên đồi cỏ, ngồi nghỉ trên bãi cỏ, nhưng không vào rừng, không ngủ lại ở rẫy. Bé sốt 8 ngày nay, 38,5–39,5°C, có lúc rét run, đau đầu, đau mỏi người, mệt, chán ăn. Mẹ thấy ở bẹn trái có hạch sưng to bằng đầu ngón tay, ấn đau. Khi tắm cho bé, mẹ thấy gần chỗ hạch có một vết loét tròn bằng hạt đậu, đóng vảy đen, bé không thấy đau. Bé không ho, không nổi ban, mắt không đỏ, không vàng da, vẫn tỉnh táo, ăn uống được ít."
