id: h-cough-003
set: holdout
title_vi: "Bé trai 7 tuổi ho khan về đêm 6 tuần, chạy nhiều thì khò khè, hắt hơi buổi sáng, bố bị hen"
narrative_vi: "Bé K., nam, 7 tuổi, học lớp 2 ở TP.HCM, đã tiêm chủng đầy đủ theo lịch. Khoảng 6 tuần nay bé ho khan, chủ yếu về đêm và gần sáng, có đêm ho thức giấc. Ban ngày bé ít ho, nhưng chạy nhảy giờ ra chơi hoặc đá bóng một lúc là ho, thở khò khè, hụt hơi, ngồi nghỉ vài phút thì đỡ. Sáng ngủ dậy bé hay hắt hơi, ngứa mũi, chảy nước mũi trong. Bé không sốt, ăn uống, chơi bình thường, không sụt cân, không ra mồ hôi trộm. Ho không thành cơn dồn dập, không nôn sau ho. Bé không bị hóc, sặc gì trước khi ho. Bố bé bị hen suyễn từ nhỏ. Trong nhà không ai bị lao. Bé chưa được bác sĩ nói là bị hen."
