source:
  basis: "Hen phế quản chưa được chẩn đoán ở trẻ 7 tuổi, biểu hiện chủ yếu bằng ho: ho khan về đêm, gần sáng 6 tuần, khò khè và hụt hơi khi gắng sức, kèm viêm mũi dị ứng, bố bị hen; không sốt, không sụt cân, không ho cơn kiểu ho gà, không có dị vật. GINA 2026 (trẻ 6–11 tuổi): triệu chứng hô hấp thay đổi theo thời gian, nặng về đêm, khi gắng sức gợi ý hen, cần khám để chẩn đoán. WHO IMCI: ho trên 2 tuần hoặc khò khè tái diễn thì chuyển khám hen, lao. Không có dấu hiệu nặng nên đặt lịch khám trong vài ngày."
