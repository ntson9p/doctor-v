narrative_vi: "Anh B., 20 tuổi, sinh viên ở Hà Nội. Khoảng 14 giờ trước anh thấy đau âm ỉ quanh rốn, sau đó đau chuyển xuống bụng dưới bên phải, tăng dần. Đi lại, ho hay xe xóc đều làm đau hơn. Anh buồn nôn, nôn 1 lần, chán ăn, sốt nhẹ 37,9°C. Anh không tiêu chảy, không tiểu buốt, vẫn xì hơi được."
