narrative_vi: "Chị P., 50 tuổi, làm nương ngô ở Yên Bái, hay phát cỏ quanh nương. Sáu ngày nay chị sốt cao 39,5°C, có lúc rét run, đau đầu nhiều, đau mỏi người, hai mắt đỏ, ho khan ít. Chị mệt, chán ăn. Khi tắm, chị thấy ở bẹn có một vết loét tròn, đóng vảy đen, không đau. Chị không nổi ban, không khó thở."
