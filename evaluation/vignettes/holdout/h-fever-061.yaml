id: h-fever-061
set: holdout
title_vi: "Bé gái 7 tháng sốt 6 ngày, quấy khóc khó dỗ, mắt đỏ không ghèn, ban thoáng qua, sẹo tiêm phòng lao ở vai sưng đỏ lại"
narrative_vi: "Bé A., gái, 7 tháng, ở Hải Phòng. Bé sốt 6 ngày nay, 38,5–39,5°C, quấy khóc, khó dỗ hơn hẳn mọi lần ốm. Phòng khám nói bé bị viêm họng do vi rút, cho thuốc hạ sốt nhưng bé vẫn sốt. Hai mắt bé đỏ, không có ghèn. Ngày thứ 3 người bé nổi ban đỏ nhạt ở bụng, lưng, ấn vào thì mất, nay đã mờ. Hôm qua mẹ thấy vết sẹo tiêm phòng lao ở vai trái của bé sưng đỏ lên. Môi bé không nứt, lưỡi không đỏ, tay chân không sưng, không sờ thấy hạch. Bé không ho, không sổ mũi, không tiêu chảy, không nôn, vẫn bú được nhưng bú ít hơn, vẫn đi tiểu bình thường. Bé không li bì, không co giật, thóp không phồng."
