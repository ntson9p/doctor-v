source:
  basis: "Bệnh Kawasaki không điển hình ở bé gái 7 tháng: sốt 6 ngày, quấy khóc nhiều, mắt đỏ không ghèn, ban thoáng qua, sẹo tiêm phòng lao sưng đỏ lại; chưa đủ các biểu hiện chính. Bộ Y tế 3312/QĐ-BYT 2015: có thể tấy đỏ sẹo BCG; thể không điển hình có ít biểu hiện hơn, chẩn đoán dựa vào xét nghiệm viêm và tổn thương mạch vành; Kawasaki hay gặp ở nhũ nhi. AHA 2017: có thuật toán chẩn đoán khi tiêu chuẩn lâm sàng không đủ. NICE NG143: sốt từ 5 ngày là dấu hiệu 'vàng', cần được khám trực tiếp; NHS Kawasaki disease: khám khẩn. Mức 3."
  references:
    - byt-qd-3312-2015
    - aha-kawasaki-2017
    - nice-ng143
    - nhs-kawasaki-disease
author: "agent:vignette-holdout"
notes_vi: "Ca khó: nhũ nhi, thể không điển hình. Danh mục chưa có câu hỏi về quấy khóc, khó dỗ bất thường ở trẻ nhỏ, hay sốt không đỡ dù đã dùng kháng sinh."
