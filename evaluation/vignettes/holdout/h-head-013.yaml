title_vi: "Nữ 70 tuổi, đột ngột đau đầu dữ dội khi rặn, ngất 1 phút, nôn, cứng gáy"
narrative_vi: "Bà H., 70 tuổi, ở Nghệ An, bị tăng huyết áp. Khoảng 30 phút trước, khi đang rặn đi ngoài, bà đột ngột đau đầu dữ dội như búa bổ, rồi ngất đi khoảng 1 phút, ngồi gục xuống, không bị đập đầu. Hiện bà đã tỉnh, nói được nhưng vẫn đau đầu dữ dội, nôn 2 lần, kêu đau cứng gáy. Con trai đo huyết áp 190/100 mmHg. Bà không yếu tay chân, không méo miệng."
