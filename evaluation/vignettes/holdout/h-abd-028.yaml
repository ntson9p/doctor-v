narrative_vi: "Ông T., 58 tuổi, ở Thành phố Hồ Chí Minh, hút thuốc lá, bị tăng huyết áp. Khoảng 40 phút trước, khi đang leo cầu thang, ông đột ngột đau tức vùng trên rốn và giữa ngực như bị đè nặng, lan lên vai và tay trái. Ông vã mồ hôi lạnh, buồn nôn, hơi khó thở. Nghỉ ngơi mà không đỡ."
