    - nhs-croup
    - who-imci-chart-booklet-2014
author: "agent:vignette-holdout"
notes_vi: "Ca khó hơn: trẻ 5 tuổi (lớn hơn tuổi hay gặp) và thở rít khi nghỉ. Câu sàng lọc đầu có 'thở rít' nên mẹ trả lời 'có'. Viêm nắp thanh môn được loại trừ một phần vì không chảy dãi, nuốt được, có ho ông ổng."
