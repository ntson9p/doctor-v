id: h-sob-006
set: holdout
title_vi: "Bé gái 5 tuổi cảm 2 ngày, khàn tiếng; 1 giờ sáng thức dậy ho ông ổng, ngồi yên vẫn thở rít to, thở vất vả"
narrative_vi: "Bé A., gái, 5 tuổi, ở Đà Nẵng, đã tiêm chủng đầy đủ. Hai ngày nay bé sổ mũi, khàn tiếng, sốt nhẹ, cao nhất 38,2°C. Khoảng 1 giờ sáng nay bé đột ngột thức dậy, ho ông ổng như tiếng chó sủa, mỗi lần hít vào có tiếng rít to, kể cả khi ngồi yên trong lòng mẹ, không khóc. Bé thở vất vả hơn hẳn, hoảng sợ. Bé vẫn tỉnh, nói được, uống được vài ngụm nước, không chảy dãi, nuốt được, môi hồng. Trước đó bé không bị hóc, sặc gì, không ăn món lạ hay uống thuốc mới. Bé chưa bị hen."
