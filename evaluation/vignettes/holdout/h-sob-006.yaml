source:
  basis: "Viêm thanh quản cấp (croup) mức trung bình ở trẻ 5 tuổi: sau cảm, khàn tiếng, nửa đêm đột ngột ho ông ổng, thở rít khi ngồi yên, thở vất vả; không chảy dãi, nuốt được, môi hồng, tỉnh. WHO IMCI: thở rít khi trẻ nằm yên là bệnh rất nặng, chuyển viện khẩn cấp. NHS Croup: trẻ thở rất vất vả thì gọi 999 hoặc đến cấp cứu. Chưa tím, chưa li bì nên đến cơ sở cấp cứu ngay (mức 2)."
