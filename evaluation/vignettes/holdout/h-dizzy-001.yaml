source:
  basis: "Chóng mặt tư thế kịch phát lành tính điển hình: cơn quay cuồng ngắn dưới 1 phút, khởi phát khi đổi tư thế đầu (trở mình, nằm xuống, ngửa cổ), giữa các cơn bình thường, không có dấu hiệu thần kinh, đã từng có đợt tương tự. GRACE-3 xếp vào nhóm cơn chóng mặt có yếu tố khởi phát: làm nghiệm pháp Dix–Hallpike, không chụp chiếu thường quy, điều trị bằng nghiệm pháp Epley. NHS Vertigo: chóng mặt quay không hết hoặc hay tái lại thì đi khám bác sĩ (không khẩn); không có dấu hiệu cần khám khẩn (đau đầu dữ dội, nôn nhiều, sốt cao) hay cấp cứu (nhìn đôi, nghe kém, nói khó, tê yếu tay chân)."
  references:
    - grace3-dizziness-2023
    - nhs-vertigo
    - https://www.aafp.org/pubs/afp/issues/2017/0201/p154.html
author: "agent:vignette-holdout"
notes_vi: "Ca điển hình. Ngồi dậy cũng gây cơn quay vì đầu đổi tư thế, nhưng người bệnh không bị choáng, tối sầm mắt khi đứng dậy nên trả lời 'không' câu hạ huyết áp tư thế."
