id: h-dizzy-001
set: holdout
title_vi: "Nữ 58 tuổi, từng cơn quay cuồng dưới 1 phút mỗi khi trở mình, nằm xuống, ngửa cổ"
narrative_vi: "Bà H., 58 tuổi, nội trợ ở Hải Phòng, đã mãn kinh. Sáng nay vừa trở mình sang phải trên giường, bà thấy mọi vật quay tròn dữ dội khoảng 20–30 giây rồi hết. Từ sáng đến giờ bà bị thêm nhiều cơn giống vậy mỗi khi nằm xuống, ngồi dậy, cúi nhặt đồ hoặc ngửa cổ phơi quần áo, mỗi cơn dưới 1 phút. Trong cơn bà buồn nôn nhưng không nôn. Giữa các cơn bà đi lại bình thường, chỉ sợ quay đầu nhanh. Bà không đau đầu, không ù tai, không nghe kém, không nhìn đôi, không nói khó, không tê yếu tay chân, không choáng tối sầm mắt khi đứng dậy. Hai năm trước bà từng bị một đợt giống hệt, tự hết sau khoảng 2 tuần. Bà không bị tăng huyết áp, không bị đái tháo đường, không uống thuốc gì."
