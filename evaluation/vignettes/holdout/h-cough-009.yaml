source:
  basis: "Suy tim nặng lên, biểu hiện chủ yếu bằng ho về đêm ở người từng nhồi máu cơ tim: ho khan khi nằm, phải kê cao gối, khó thở khi gắng sức, phù hai cổ chân, tăng 3 kg trong 1 tuần. 1857/QĐ-BYT (2022): ho về đêm, khó thở khi nằm, cơn khó thở kịch phát về đêm, phù mắt cá, tăng cân trên 2 kg/tuần là triệu chứng suy tim. NHS Heart failure: khó thở khi nằm, tăng cân đột ngột thì hẹn khám khẩn hoặc gọi 111; chỉ gọi 999 khi khó thở dữ dội, tím, ngất. Ngồi yên thở bình thường nên mức 3."
