id: h-cough-009
set: holdout
title_vi: "Nam 81 tuổi từng đặt stent mạch vành, 3 tuần ho khan về đêm, phải kê 3 gối mới ngủ được, phù hai cổ chân, tăng 3 kg"
narrative_vi: "Ông K., 81 tuổi, ở Hà Tĩnh, bị tăng huyết áp, 5 năm trước bị nhồi máu cơ tim được đặt stent, uống thuốc đều. Khoảng 3 tuần nay đêm nào ông cũng ho khan, ho nhiều khi vừa nằm xuống, có đêm phải ngồi dậy mới đỡ; giờ ông phải kê 3 gối mới ngủ được. Ông nghĩ mình bị ho do trời lạnh. Đi ra vườn một đoạn ngắn là ông hụt hơi, phải đứng nghỉ; ngồi yên thì thở bình thường. Hai cổ chân phù, ấn vào lõm, buổi chiều phù nhiều hơn. Tuần qua ông lên 3 kg dù ăn kém. Ông mệt. Ông không sốt, không khạc đờm, không khò khè, không đau ngực, không ho ra máu. Ông bỏ thuốc lá đã 20 năm."
