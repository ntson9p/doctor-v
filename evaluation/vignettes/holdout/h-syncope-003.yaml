source:
  basis: "Ngất phản xạ (phế vị) điển hình ở thiếu niên: đứng lâu ngoài nắng, có tiền triệu nóng bừng, vã mồ hôi, buồn nôn, tối sầm mắt; mất ý thức dưới 1 phút, tỉnh hoàn toàn ngay, không co giật, không đau ngực, không hồi hộp trước ngất, gia đình không có người đột tử. ESC 2018: tiền triệu điển hình, ngất khi đứng lâu nơi nóng hoặc đông người là đặc điểm nguy cơ thấp; ca này không có đặc điểm nguy cơ cao. NHS Fainting: người đã ngất nên đi khám bác sĩ (không khẩn) để tìm nguyên nhân; không có dấu hiệu cần gọi 999. Mức 4."
  references:
    - esc-syncope-2018
    - nhs-fainting
author: "agent:vignette-holdout"
notes_vi: "Ca điển hình. Chưa thử ăn đồ ngọt (chỉ uống nước lọc) nên câu đỡ sau khi ăn đồ ngọt trả lời 'không rõ'."
