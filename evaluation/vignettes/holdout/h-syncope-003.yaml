id: h-syncope-003
set: holdout
title_vi: "Nữ 14 tuổi ngất khi đứng chào cờ lâu dưới nắng, trước đó nóng bừng, vã mồ hôi, tối sầm mắt; tỉnh lại dưới 1 phút"
narrative_vi: "Em N., nữ, 14 tuổi, học lớp 8 ở TP.HCM. Sáng thứ Hai, em đứng chào cờ ngoài sân trường khoảng 30 phút dưới nắng; sáng đó em đã ăn sáng. Em thấy nóng bừng người, vã mồ hôi, buồn nôn, mắt tối sầm rồi ngã xuống. Cô giáo kể em bất tỉnh chưa đến 1 phút, không co giật, rồi tỉnh lại, nói chuyện bình thường ngay. Em được đưa vào phòng y tế nằm nghỉ, uống nước lọc, giờ đã hết mệt, không bị thương. Em không đau ngực, không đau đầu, không thấy tim đập nhanh trước khi ngất, không khó thở. Năm ngoái em từng một lần choáng, tối sầm mắt khi xếp hàng lâu. Kinh nguyệt đều, không ra nhiều. Trong gia đình không có ai đột tử."
