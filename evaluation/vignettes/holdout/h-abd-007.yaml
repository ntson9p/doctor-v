narrative_vi: "Anh N., 40 tuổi, ở Thành phố Hồ Chí Minh, hút thuốc lá, công việc căng thẳng, ăn uống thất thường. Ba tháng nay anh hay đau rát vùng trên rốn, đau lúc đói và về đêm, ăn vào thì đỡ. Anh hay ợ chua, nóng rát sau xương ức, đôi khi buồn nôn. Không nôn ra máu, phân vàng bình thường, không sụt cân. Anh không dùng thuốc giảm đau thường xuyên."
