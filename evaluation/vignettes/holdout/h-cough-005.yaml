id: h-cough-005
set: holdout
title_vi: "Nam 63 tuổi hút thuốc lào 40 năm, ho 2 tháng khác hẳn mọi khi, đờm lẫn vệt máu, khàn tiếng, sụt 5 kg"
narrative_vi: "Ông H., 63 tuổi, làm ruộng ở Thái Bình, hút thuốc lào khoảng 40 năm, đến nay vẫn hút. Trước đây sáng nào ông cũng ho vài tiếng, nhưng khoảng 2 tháng nay ông ho nhiều hơn hẳn, ho cả ngày, khạc đờm trắng. Tuần này có 3–4 lần ông thấy vài vệt máu đỏ lẫn trong đờm, không ho ra máu tươi. Ba tuần nay giọng ông khàn đi. Ông mệt, ăn kém, 2 tháng nay sụt khoảng 5 kg. Ông không sốt, không ra mồ hôi đêm, không khó thở, không đau ngực. Trong nhà, xóm không ai bị lao. Ông chưa từng được nói là có bệnh phổi tắc nghẽn mạn tính."
