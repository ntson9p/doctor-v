notes_vi: "Ho ra máu ít (vài vệt), không phải ho ra máu tươi lượng nhiều. Lao phổi có thể có cùng bệnh cảnh nhưng không sốt, không mồ hôi đêm, không tiếp xúc nguồn lây."
