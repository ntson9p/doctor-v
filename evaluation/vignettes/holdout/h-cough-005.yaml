source:
  basis: "Gợi ý ung thư phổi ở người hút thuốc lâu năm: ho thay đổi tính chất 2 tháng, đờm lẫn vệt máu, khàn tiếng 3 tuần, sụt cân, mệt, không sốt (NICE NG12: người từ 40 tuổi ho ra máu không rõ nguyên nhân thì chuyển khám theo đường nghi ung thư; ho, sụt cân, khàn tiếng ở người hút thuốc là dấu hiệu cần chụp phổi khẩn). NHS Coughing up blood: ho ra vài vệt máu trong đờm thì hẹn khám khẩn hoặc gọi 111, nên mức 3. Lao phổi là chẩn đoán phân biệt (162/QĐ-BYT)."
