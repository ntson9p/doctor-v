id: h-palp-012
set: holdout
title_vi: "Nữ 20 tuổi, 4 tháng sau đợt sốt vi rút, cứ đứng vài phút là tim đập nhanh, lâng lâng, nằm xuống thì hết"
narrative_vi: "Em V., nữ, 20 tuổi, sinh viên ở Đà Nẵng. Khoảng 4 tháng trước em bị một đợt sốt cao, đau họng, mệt khoảng 1 tuần rồi khỏi. Từ đó đến nay, ngày nào cũng vậy: vừa đứng dậy đã hơi choáng, đứng thêm vài phút, nhất là khi xếp hàng, đứng tắm hoặc đứng thuyết trình, thì tim đập nhanh thình thịch, lâng lâng, mệt; ngồi hoặc nằm xuống vài phút thì đỡ hẳn. Đồng hồ thông minh của em báo nhịp tim khoảng 75 lần/phút khi nằm, đứng 5 phút thì lên 120–125 lần/phút; em đo huyết áp lúc đang đứng được 110/75 mmHg. Buổi sáng em hay mệt hơn, học khó tập trung. Em chưa lần nào ngất hay tối sầm mắt, không đau ngực, không khó thở, leo cầu thang không hụt hơi. Em không sụt cân, không run tay, không sợ nóng, cổ không to, không xanh xao, kinh nguyệt đều, không ra nhiều, không có thai. Em ít uống nước, không uống cà phê hay nước tăng lực, không dùng thuốc gì. Trong nhà không ai bị bệnh tim hay đột tử."
