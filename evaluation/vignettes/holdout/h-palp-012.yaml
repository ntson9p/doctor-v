source:
  basis: "Hội chứng nhịp nhanh tư thế đứng (không có trong danh mục) sau một đợt nhiễm vi rút: 4 tháng nay ngày nào cứ đứng vài phút là tim nhanh, lâng lâng, mệt, nằm xuống thì hết; nhịp tim tăng từ khoảng 75 lên 120–125 lần/phút khi đứng, huyết áp không tụt; chưa từng ngất, không đau ngực, không khó thở, không có dấu hiệu cường giáp, thiếu máu hay cơn hoảng sợ. ESC 2018 xếp hội chứng này vào nhóm không dung nạp tư thế đứng, cùng hạ huyết áp tư thế và ngất phế vị; NHS Heart palpitations: hồi hộp hay tái lại mà vẫn khỏe thì khám bác sĩ (không khẩn), nên mức 4."
  references:
    - esc-syncope-2018
    - nhs-heart-palpitations
author: "agent:vignette-holdout"
notes_vi: "Ngoài danh mục. Tiêu chuẩn thường dùng: nhịp tim tăng từ 30 lần/phút trở lên trong 10 phút đứng (từ 40 lần/phút ở tuổi 12–19), không tụt huyết áp. Mạch ghi theo lần đo lúc có triệu chứng (đang đứng). Lâng lâng nhưng chưa tối sầm mắt nên câu ngất, suýt ngất trả lời 'không'. Đợt sốt cách đây 4 tháng nên câu bị cảm trong 2 tuần trước trả lời 'không'. Trang NHS Postural tachycardia syndrome (chưa có trong danh mục nguồn) khuyên khám bác sĩ gia đình (không khẩn) khi có triệu chứng, không có mục gọi cấp cứu."
