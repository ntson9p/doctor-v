id: h-syncope-018
set: holdout
title_vi: "Nam 30 tuổi sốt cao 4 ngày, vừa hết sốt thì đau dưới sườn phải, nôn, ngất khi đứng dậy; tay chân lạnh, tiểu ít"
narrative_vi: "Anh Ph., 30 tuổi, thợ điện ở Biên Hòa (Đồng Nai), người to béo, nặng 92 kg, không có bệnh mạn tính. Anh sốt cao 39–40°C từ 4 ngày trước, đau đầu vùng trán, nhức hai hốc mắt, đau mỏi khắp người, ăn uống kém, tự uống thuốc hạ sốt; dãy trọ có mấy người đang bị sốt xuất huyết. Sáng nay anh hết sốt, tưởng đã khỏi nên đi làm lại. Gần trưa anh đau tức dưới sườn phải, buồn nôn, nôn 3 lần, người mệt rã rời. Đang ngồi nghỉ, anh đứng dậy thì choáng, vã mồ hôi, tối sầm mắt rồi ngất khoảng nửa phút, đồng nghiệp đỡ kịp. Hiện anh đã tỉnh, nói chuyện được nhưng mệt lả, không tự đứng dậy được, vã mồ hôi, tay chân lạnh ẩm, khát nước; cứ ngồi dậy là choáng. Từ sáng anh mới đi tiểu 1 lần, rất ít. Anh không chảy máu chân răng, không chảy máu cam, không thấy nốt đỏ trên da, không đi ngoài phân đen, không ho, không sổ mũi, không tiêu chảy, không khó thở."
