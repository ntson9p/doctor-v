source:
  basis: "Sốt xuất huyết Dengue vào giai đoạn nguy hiểm, có sốc: sốt cao 4 ngày, đau đầu, nhức hốc mắt, đau mỏi người, xung quanh có người bệnh; vừa hết sốt thì đau dưới sườn phải, nôn, mệt lả, ngất khi đứng dậy, sau đó vẫn vã mồ hôi, tay chân lạnh ẩm, tiểu rất ít, dù không chảy máu, không phát ban. 2760/QĐ-BYT: giai đoạn nguy hiểm thường vào ngày 3–7 của bệnh; WHO 2009: choáng váng, hạ huyết áp tư thế, ngất, lả khi hết sốt là dấu hiệu liên quan tụt huyết áp cần nhập viện, hạ huyết áp tư thế là dấu hiệu sốc còn bù; CDC: giai đoạn nguy hiểm bắt đầu khi hết sốt; đã có dấu hiệu sốc nên mức 1."
  references:
    - byt-qd-2760-2023
    - who-dengue-2009
    - cdc-dengue-clinical
author: "agent:vignette-holdout"
notes_vi: "Ca cấp cứu khó: không chảy máu, không phát ban; người bệnh hết sốt, tưởng khỏi nên đi làm lại, đến khám vì ngất. Người bệnh vẫn trả lời 'có' câu sốt vì vừa sốt 4 ngày, sáng nay mới hết. Uống thuốc hạ sốt vài ngày không tính là hay dùng thuốc giảm đau. Danh mục chưa có câu hỏi về béo phì."
