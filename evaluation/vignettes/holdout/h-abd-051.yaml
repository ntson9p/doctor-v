id: h-abd-051
set: holdout
title_vi: "Nam 74 tuổi hút thuốc, đái tháo đường, từng đặt stent mạch vành: nhiều tháng đau quanh rốn sau ăn, sợ ăn, sụt cân; nay đau liên tục tăng dần 10 giờ, nôn"
narrative_vi: "Ông K., 74 tuổi, ở Đà Nẵng, hút thuốc lá hơn 50 năm, bị tăng huyết áp, đái tháo đường típ 2 và từng đặt stent mạch vành, đang uống aspirin. Khoảng 4 tháng nay, cứ ăn xong chừng nửa giờ là ông đau âm ỉ quanh rốn, kéo dài 1–2 giờ, nên ông sợ ăn, mỗi bữa chỉ ăn vài thìa, sụt 6 kg. Ông nghĩ bị đau dạ dày, tự mua thuốc uống không đỡ. Từ khoảng 10 giờ trước, cơn đau quanh rốn không hết như mọi lần mà tăng dần, rất đau, liên tục, ông nằm co người, trở mình liên tục. Ông nôn 3 lần ra dịch vàng nhạt, đi ngoài 1 lần phân nhão, không có máu. Không sốt, không vàng da, không nôn ra máu, không đi ngoài phân đen. Ông vẫn tỉnh táo, không khó thở, không đau ngực."
