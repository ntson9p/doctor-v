source:
  basis: "Thiếu máu mạc treo ruột cấp trên nền mạn (huyết khối động mạch mạc treo) ở nam 74 tuổi hút thuốc, đái tháo đường, bệnh mạch vành: 4 tháng đau quanh rốn sau ăn, sợ ăn, sụt 6 kg, nay đau liên tục, tăng dần 10 giờ, rất đau, kèm nôn. WSES 2022 (Bala và cộng sự): người bị huyết khối động mạch mạc treo thường có tiền sử đau bụng sau ăn kéo dài, sụt cân, 'sợ ăn'; thể cấp trên nền mạn hay gặp và hay bị bỏ sót; chậm chẩn đoán là yếu tố chính gây tử vong 30–70%, mỗi 6 giờ chậm chụp mạch thì tử vong tăng gấp đôi. Đau bụng dữ dội ở người cao tuổi có bệnh mạch máu: gọi 115."
  references:
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC9580452/"
    - nhs-stomach-ache
author: "agent:vignette-holdout"
notes_vi: "Ca khó: khởi phát tăng dần chứ không đột ngột, không rung nhĩ; tiền sử đau sau ăn và sụt cân dễ làm nghĩ loét dạ dày hoặc ung thư. Danh mục chưa có câu hỏi về 'sợ ăn vì ăn vào là đau'."
