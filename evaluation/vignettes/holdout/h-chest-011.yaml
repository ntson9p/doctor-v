id: h-chest-011
set: holdout
title_vi: "Nam 69 tuổi 3 tuần sau mổ thay khớp gối, bắp chân trái sưng đau; 3 giờ nay đột ngột đau nhói ngực trái khi hít thở, hụt hơi, đờm lẫn máu"
narrative_vi: "Ông C., 69 tuổi, ở Đà Nẵng, bị tăng huyết áp. Ba tuần trước ông được mổ thay khớp gối trái, về nhà chủ yếu ngồi, nằm, ít đi lại. Năm ngày nay bắp chân trái sưng, căng đau hơn chân phải. Khoảng 3 giờ trước, đang ngồi, ông đột ngột đau nhói khá dữ dội ở ngực trái, đau tăng mỗi khi hít sâu hoặc ho, đến giờ vẫn đau. Từ lúc đó ông hụt hơi khi đi vài bước; ngồi yên thì thở được, nói trọn câu. Ông ho vài tiếng, khạc ra đờm có lẫn vệt máu đỏ. Ông không sốt, không vã mồ hôi, không ngất. Ông chưa từng bị cục máu đông, không mắc ung thư, không hút thuốc."
