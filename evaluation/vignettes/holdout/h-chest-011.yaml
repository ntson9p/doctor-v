source:
  basis: "Thuyên tắc phổi sau mổ thay khớp gối: huyết khối tĩnh mạch sâu bắp chân, rồi đột ngột đau ngực kiểu màng phổi, khó thở, ho ra ít máu. ESC 2019 Bảng 3: thay khớp háng hoặc gối là yếu tố thuận lợi mạnh; mục 4.1: đau ngực màng phổi, khó thở, ho ra máu. NHS Pulmonary embolism: khó thở đột ngột, đau ngực thì gọi 999 hoặc đến cấp cứu. Còn nói trọn câu, không ngất nên mức 2."
