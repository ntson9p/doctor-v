title_vi: "Nam 38 tuổi, đột ngột đau quặn hông lưng trái lan xuống bẹn, tiểu hồng"
narrative_vi: "Anh P., 38 tuổi, thợ xây ở Đồng Nai, làm ngoài trời nắng nóng, ít uống nước. Khoảng 3 giờ trước anh đột ngột đau quặn từng cơn ở hông lưng trái, lan xuống bụng dưới bên trái và bẹn. Trong cơn đau dữ dội, anh đi lại không yên. Nước tiểu màu hồng. Anh buồn nôn, nôn 1 lần. Không sốt, không tiểu buốt."
