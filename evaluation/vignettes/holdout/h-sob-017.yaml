source:
  basis: "Phản vệ sau ong đốt: trong 15 phút có mề đay lan nhanh kèm khò khè, tức ngực, khó thở, choáng. 51/2017/TT-BYT Phụ lục I (bệnh cảnh 1: triệu chứng da kèm triệu chứng hô hấp vài phút sau tiếp xúc) và Phụ lục II (độ II: mề đay kèm khó thở, tức ngực), Điều 6: tiêm bắp adrenalin ngay từ độ II. NHS Anaphylaxis: khò khè, khó thở sau côn trùng đốt thì gọi 999. Mức 1."
