id: h-sob-017
set: holdout
title_vi: "Nam 45 tuổi bị ong đốt khi hái cà phê, 15 phút sau nổi mề đay khắp người, khò khè, tức ngực, choáng; ở màn đầu trả lời không"
narrative_vi: "Anh Y., 45 tuổi, ở Đắk Lắk, đang hái cà phê thì bị một đàn ong vò vẽ đốt 3 nốt ở cổ và cánh tay. Khoảng 15 phút sau anh thấy ngứa khắp người, nổi nhiều mảng mề đay đỏ gồ lan nhanh ra ngực, lưng, đùi; thở khò khè, nặng ngực, hụt hơi dù đang ngồi, ho khan, choáng váng. Môi và lưỡi không sưng, nuốt bình thường, chưa khàn tiếng. Khi app hỏi câu đầu về sưng môi, lưỡi hoặc khó thở sau khi bị đốt, anh nghĩ mình chỉ hơi khó thở nên trả lời 'không'. Anh vẫn tỉnh, nói được câu. Anh không bị hen, không hút thuốc, chưa từng bị ong đốt nặng."
