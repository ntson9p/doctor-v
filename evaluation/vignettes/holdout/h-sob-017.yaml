author: "agent:vignette-holdout"
notes_vi: "Ca cấp cứu theo đề bài: trả lời 'không' ở câu sàng lọc phản vệ đầu tiên, phải được phát hiện qua các câu tiếp xúc dị nguyên, mề đay, khò khè. 'Nặng ngực' được tính là đau ngực (khó chịu ở ngực) nhưng không phải tức nặng giữa ngực kiểu tim."
