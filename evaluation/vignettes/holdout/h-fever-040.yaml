source:
  basis: "Sốt xuất huyết Dengue vào giai đoạn nguy hiểm: ngay khi hết sốt xuất hiện sốc (mệt lả, chi lạnh, vã mồ hôi, choáng khi đứng, tiểu ít) kèm đau vùng gan, nôn, chấm xuất huyết. Sốt xuất huyết Dengue nặng ở người cao tuổi có bệnh nền, cần cấp cứu ngay (2760/QĐ-BYT; WHO 2009)."
  references:
    - byt-qd-2760-2023
    - who-dengue-2009
    - who-arbovirus-2025
author: "agent:vignette-holdout"
notes_vi: "Người nhà dễ hiểu nhầm hết sốt là đã khỏi; giai đoạn nguy hiểm thường từ ngày 3 đến ngày 7 của bệnh. Danh mục chưa có câu hỏi về mạch, huyết áp khi sốc."
