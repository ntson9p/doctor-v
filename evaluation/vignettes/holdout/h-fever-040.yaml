id: h-fever-040
set: holdout
title_vi: "Nữ 68 tuổi bị đái tháo đường, sốt 4 ngày, vừa hết sốt thì mệt lả, chân tay lạnh, choáng khi đứng"
narrative_vi: "Bà N., 68 tuổi, ở Hà Nội, bị đái tháo đường và tăng huyết áp. Khu phố đang có nhiều người bị sốt xuất huyết. Bà sốt 4 ngày, 38,5–39°C, đau đầu nhẹ, mỏi người, mệt, chán ăn. Từ sáng nay bà kêu đau tức dưới sườn phải, nôn 2 lần. Từ trưa bà hết sốt, con cháu tưởng bà đã đỡ, nhưng đến chiều bà mệt lả, không tự đứng dậy được, đứng lên là choáng như sắp ngất. Tay chân bà lạnh, vã mồ hôi lạnh. Từ sáng đến giờ bà chỉ đi tiểu một ít. Ở hai cẳng chân có chấm đỏ li ti, ấn không mất. Bà vẫn tỉnh, trả lời đúng, không khó thở, không chảy máu chân răng."
