source:
  basis: "Ngất do rối loạn nhịp tim nguy hiểm ở thiếu niên (nghi bệnh kênh ion di truyền hoặc bệnh cơ tim gây nhịp nhanh thất): ngất lần thứ hai khi đang gắng sức, ngay trước đó tim đập rất nhanh, không có tiền triệu phế vị, bố đột tử trẻ khi đang chơi thể thao; vài cái giật tay lúc bất tỉnh rồi tỉnh ngay, không lú lẫn, là kiểu ngất có giật cơ chứ không phải động kinh. ESC 2018: ngất khi gắng sức, hồi hộp đột ngột rồi ngất là đặc điểm nguy cơ cao loại nặng, người thân đột tử trẻ là nguy cơ cao loại nhẹ, ngất trong lúc gắng sức thường do tim; EGSYS (Del Rosso 2008): ngất khi gắng sức, hồi hộp trước ngất dự báo ngất do tim; NHS Fainting: ngất khi đang tập luyện hoặc có giật tay chân thì gọi 999, nên mức 1."
  references:
    - esc-syncope-2018
    - delrosso-heart-2008
    - nhs-fainting
author: "agent:vignette-holdout"
notes_vi: "Ca cấp cứu ở thiếu niên, dễ bị bỏ qua vì đã tỉnh hẳn: lần trước bị cho là do nắng nóng, lần này bị nghĩ là động kinh. Giật tay vài giây lúc bất tỉnh nên câu co giật trả lời 'có'. Tim đập nhanh ngay trước khi ngã nên câu hồi hộp trả lời 'có'; em không biết cơn tim nhanh dừng lúc nào. Chưa thử ăn đồ ngọt. Không ghi các câu chỉ hỏi người từ 18 tuổi (bệnh tim đã biết, tăng huyết áp)."
