id: h-syncope-016
set: holdout
title_vi: "Nam 15 tuổi đang đá bóng thấy tim đập rất nhanh rồi ngất, giật tay vài giây; bố đột tử năm 32 tuổi"
narrative_vi: "Em K., nam, 15 tuổi, học lớp 10 ở Huế. Chiều nay đang chạy theo bóng trong trận đá bóng ở sân trường, em thấy tim đập rất nhanh, thình thịch trong ngực vài giây rồi ngã gục xuống, không kịp kêu choáng. Bạn kể em bất tỉnh khoảng 1 phút, mặt tái, hai tay giật vài cái chừng 5–10 giây, không cắn lưỡi, không tè ra quần. Tỉnh lại em nói chuyện được ngay, biết mình đang ở đâu; ngã trên cỏ nên không đập đầu. Hiện em ngồi nghỉ, thở bình thường, không đau ngực, không đau đầu, không chóng mặt, không còn thấy tim đập nhanh. Hai tháng trước em từng ngất một lần khi đang chạy thi ở trường, lúc đó thầy cô nói do nắng nóng. Bố em mất đột ngột năm 32 tuổi khi đang đá bóng với bạn, gia đình nghĩ là 'trúng gió'. Em không sốt, đã ăn trưa đầy đủ, không uống cà phê hay nước tăng lực, không dùng thuốc gì. Cô y tế trường nói có thể em bị động kinh."
