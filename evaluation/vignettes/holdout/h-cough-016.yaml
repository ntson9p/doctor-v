id: h-cough-016
set: holdout
title_vi: "Nữ 66 tuổi mới uống thuốc huyết áp perindopril 2 tháng, 5 tuần nay ho khan, ngứa cổ, nặng hơn khi nằm"
narrative_vi: "Bà L., 66 tuổi, ở Huế. Hai tháng trước bà được phát hiện tăng huyết áp, bác sĩ kê perindopril uống mỗi sáng. Khoảng 5 tuần nay bà ho khan, cảm giác ngứa, vướng ở cổ họng, ho từng tràng ngắn, nhiều hơn khi nằm và buổi tối. Bà không sốt, không khạc đờm, không khò khè, không khó thở, không đau ngực, không ho ra máu, không sụt cân, không ra mồ hôi đêm. Trước khi ho bà không bị cảm, không sổ mũi, không đau họng; không ợ chua. Bà không hút thuốc, không đun bếp củi, không có bệnh tim, chân không phù. Trong nhà không ai ho hay bị lao."
