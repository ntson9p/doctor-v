source:
  basis: "Ho do thuốc ức chế men chuyển (perindopril), ngoài danh mục: ho khan, ngứa họng bắt đầu vài tuần sau khi dùng thuốc, không sốt, không đờm, không khó thở, không triệu chứng mũi, không trào ngược. Các tổng quan dược lý: gặp ở 5–20% người dùng thuốc nhóm này, có thể khởi phát từ vài ngày đến vài tháng sau khi uống, hết trong 1–4 tuần sau khi đổi thuốc. NHS Cough: ho trên 3 tuần thì khám bác sĩ (không khẩn). Cần bác sĩ đổi thuốc, không tự ngừng thuốc huyết áp, nên mức 4."
