source:
  basis: "Nghi lạc nội mạc tử cung (đau bụng kinh thứ phát): đau bụng kinh nặng dần sau nhiều năm có kinh, đau khi giao hợp sâu, đau khi đi ngoài lúc hành kinh, chậm có thai; đau khi giao hợp gợi ý lạc nội mạc tử cung (MSD Dysmenorrhea). Không có dấu hiệu cấp cứu; đau tăng dần và đau khi quan hệ là lý do cần khám phụ khoa trong vài ngày tới (NHS Period pain)."
  references:
    - msd-dysmenorrhea
    - nhs-period-pain
author: "agent:vignette-holdout"
notes_vi: "Ngoài danh mục bệnh; gần nhất là đau bụng kinh nguyên phát nhưng đau mới nặng dần ở tuổi gần 30 và đau khi quan hệ gợi ý nguyên nhân thực thể. Danh mục chưa có câu hỏi về đau khi đi ngoài lúc hành kinh và chậm có thai."
