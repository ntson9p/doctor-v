id: h-abd-043
set: holdout
title_vi: "Nữ 29 tuổi chưa có thai sau 2 năm, đau bụng kinh nặng dần, đau khi quan hệ"
narrative_vi: "Chị V., 29 tuổi, nhân viên văn phòng ở Hải Phòng, lấy chồng 2 năm, không tránh thai nhưng chưa có thai. Trước đây chị chỉ đau bụng kinh nhẹ. Khoảng 2 năm nay, kỳ kinh nào chị cũng đau bụng dưới, mỗi năm một nặng hơn: đau âm ỉ, nặng tức sâu trong bụng dưới, bắt đầu trước kỳ kinh 1–2 ngày và kéo dài suốt kỳ, lan ra thắt lưng. Chị đau khi quan hệ, nhất là khi vào sâu, và đau khi đi ngoài trong những ngày có kinh. Thuốc giảm đau chỉ đỡ một phần, chị vẫn đi làm được. Hôm nay là ngày thứ 2 kỳ kinh, đau giống các tháng gần đây. Kinh đều, không ra máu ngoài kỳ kinh, khí hư bình thường, không sốt. Que thử thai đầu kỳ âm tính."
