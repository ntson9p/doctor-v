id: h-syncope-007
set: holdout
title_vi: "Nữ 78 tuổi đái tháo đường, tăng huyết áp, đang xách nước thì choáng như sắp ngất, vã mồ hôi lạnh, khó thở, nặng nhẹ ngực và thượng vị"
narrative_vi: "Bà C., 78 tuổi, ở Nam Định, bị đái tháo đường và tăng huyết áp nhiều năm, uống thuốc đều; sáng nay bà ăn sáng bình thường rồi mới uống thuốc. Khoảng 40 phút trước, đang xách hai xô nước tưới rau, bà đột ngột choáng váng, tối sầm mắt như sắp ngất, phải ngồi bệt xuống đất, vã mồ hôi lạnh, buồn nôn, khó thở, người rã rời. Bà kêu khó chịu, nặng nặng vùng trên rốn và giữa ngực, không đau nhiều, không lan lên vai, hàm. Đến giờ bà vẫn mệt, thở mệt, vã mồ hôi. Bà không ngất hẳn, không co giật, không nói khó, không yếu tay chân, không thấy tim đập nhanh, không đau đầu. Bà không nôn ra máu, không đi ngoài phân đen. Con trai đo đường huyết bằng máy ở nhà được 9,2 mmol/L. Trước đây chưa được nói là có bệnh tim."
