source:
  basis: "Hội chứng vành cấp không điển hình ở phụ nữ cao tuổi đái tháo đường: suýt ngất khi gắng sức, vã mồ hôi lạnh, buồn nôn, khó thở, chỉ nặng nhẹ vùng thượng vị và giữa ngực, kéo dài 40 phút. MSD Acute myocardial infarction: người cao tuổi hay than khó thở hơn đau ngực, một số đến khám vì ngất; người đái tháo đường hay không có triệu chứng rõ; đau có thể giống khó tiêu. NHS Chest pain: khó chịu ở ngực kèm vã mồ hôi, buồn nôn, choáng váng hoặc khó thở thì gọi 999. ESC 2018: ngất, suýt ngất kèm khó thở hoặc đau ngực mới, xảy ra khi gắng sức là đặc điểm nguy cơ cao. Mức 1."
  references:
    - msd-acute-mi
    - nhs-chest-pain
    - esc-syncope-2018
author: "agent:vignette-holdout"
notes_vi: "Bệnh đã có trong danh mục, nay thêm triệu chứng chính 'Ngất'. Ca khó: tiền triệu vã mồ hôi, buồn nôn, tối sầm mắt giống ngất phản xạ; đau ngực nhẹ nên câu đau thắt ngực dữ dội trả lời 'không'. Đã ăn sáng, đường huyết đo được bình thường nên không phải hạ đường huyết; chưa thử ăn đồ ngọt. Vẫn mệt, khó thở, vã mồ hôi nên câu chưa hồi phục hẳn trả lời 'có'."
