id: h-dizzy-015
set: holdout
title_vi: "Nữ 38 tuổi đau nửa đầu từ trẻ, 1 năm nay nhiều cơn chóng mặt quay 2–6 giờ kèm đau đầu một bên, sợ ánh sáng, sợ tiếng ồn"
narrative_vi: "Chị Q., 38 tuổi, kế toán ở TP.HCM, bị đau nửa đầu từ thời sinh viên. Khoảng một năm nay chị có những cơn chóng mặt quay cuồng tự nhiên xuất hiện, đến nay khoảng 8–10 cơn, mỗi cơn kéo dài 2–6 tiếng; phần lớn các cơn kèm đau đầu giật giật một bên, đi lại thì đau tăng, sợ ánh sáng, sợ tiếng ồn, buồn nôn; hay bị khi thiếu ngủ hoặc sắp có kinh. Sáng nay chị lại bị một cơn sau một đêm thức khuya làm báo cáo; nằm trong phòng tối nghỉ thì đến trưa đỡ dần, vẫn còn nhức đầu. Trong cơn chị đi lại chậm nhưng tự đi được. Chị không ù tai, không nghe kém, không nhìn đôi, không thấy chớp sáng, không nói khó, không tê yếu tay chân. Giữa các cơn chị hoàn toàn bình thường. Chị không có thai, không bị tăng huyết áp."
