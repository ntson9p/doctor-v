source:
  basis: "Đau nửa đầu thể chóng mặt (migraine tiền đình): tiền sử đau nửa đầu, nhiều cơn chóng mặt quay tự phát kéo dài vài giờ, phần lớn kèm đau đầu một bên theo nhịp mạch, tăng khi vận động, sợ ánh sáng, sợ tiếng ồn, buồn nôn; khởi phát khi thiếu ngủ, sắp có kinh; giữa cơn bình thường, không nghe kém. ICHD-3 (phụ lục, chóng mặt do đau nửa đầu): ít nhất 5 cơn chóng mặt vừa–nặng kéo dài 5 phút đến 72 giờ ở người có tiền sử đau nửa đầu, ít nhất một nửa số cơn kèm đặc điểm đau nửa đầu. GRACE-3: cơn chóng mặt tự phát cần phân biệt migraine tiền đình với cơn thiếu máu não thoáng qua, bệnh Ménière (ở đây người trẻ, nhiều cơn giống hệt, không nghe kém). NHS Vertigo: chóng mặt hay tái lại thì đi khám bác sĩ (không khẩn). Mức 4."
