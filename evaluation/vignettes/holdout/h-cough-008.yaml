id: h-cough-008
set: holdout
title_vi: "Bé trai 26 tháng sổ mũi, sốt nhẹ, đêm qua ho ông ổng, khóc khàn, chỉ thở rít khi khóc"
narrative_vi: "Bé T., nam, 26 tháng, ở Hải Dương, đi nhà trẻ, đã tiêm chủng đầy đủ, kể cả 2 mũi vắc xin sởi. Hai ngày nay bé sổ mũi, sốt nhẹ, cao nhất 38,1°C. Đêm qua bé đột nhiên ho ông ổng như tiếng chó sủa, tiếng khóc khàn. Lúc bé khóc thì nghe tiếng rít khi hít vào, khi bé nằm yên hoặc ngủ thì thở êm, không rít. Bé không thở nhanh, ngực không rút lõm, môi hồng. Bé vẫn bú sữa, uống nước bình thường, không chảy dãi, không nôn, chơi được. Trước khi ho bé không bị hóc, sặc gì. Trong lớp có mấy bạn đang sổ mũi, ho."
