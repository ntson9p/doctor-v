source:
  basis: "Viêm thanh quản cấp (croup) thể nhẹ ở trẻ 2 tuổi: sau cảm có ho ông ổng, khàn tiếng, thở rít chỉ khi khóc, nặng về đêm; nằm yên không rít, không rút lõm, uống tốt. NHS Croup: nghĩ trẻ bị croup thì hẹn khám khẩn hoặc gọi 111 (bác sĩ có thể cho thuốc); gọi 999 khi trẻ thở rất vất vả, rút lõm dưới bờ sườn, tím, li bì, chảy dãi. WHO IMCI: thở rít chỉ khi khóc, quấy thì chưa tính là thở rít. Nên mức 3."
