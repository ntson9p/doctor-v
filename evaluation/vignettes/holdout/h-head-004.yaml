narrative_vi: "Chị L., 30 tuổi, ở Thái Nguyên, mang thai con đầu được 34 tuần. Từ sáng nay chị đau đầu dữ dội vùng trán, nhức giật giật, uống paracetamol không đỡ. Chị nhìn mờ, thấy đốm sáng lóe trước mắt, hơi buồn nôn. Mấy ngày nay mặt và hai bàn tay sưng phù. Huyết áp đo ở trạm y tế là 165/110 mmHg. Trước khi có thai chị không bị tăng huyết áp."
