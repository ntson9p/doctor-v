title_vi: "Nam 20 tuổi, sốt 5 ngày, chán ăn, buồn nôn, nay vàng mắt, đau tức dưới sườn phải"
narrative_vi: "Anh Đ., 20 tuổi, sinh viên ở Hà Nội, hay ăn ở quán vỉa hè. Năm ngày nay anh sốt 38,5°C, mệt mỏi, đau mỏi người, chán ăn, buồn nôn. Từ hôm qua anh đau tức dưới sườn phải, bạn cùng phòng thấy mắt anh vàng, nước tiểu sẫm màu như nước chè. Anh không uống rượu, không đi ngoài phân đen."
