narrative_vi: "Em K., nam, 14 tuổi, ở Hà Nội. Lúc 5 giờ sáng em thức dậy vì đau dữ dội đột ngột ở tinh hoàn trái, đau lan lên bụng dưới bên trái và bẹn. Em buồn nôn, nôn 2 lần. Em ngại nên chỉ nói với mẹ là đau bụng. Em không sốt, không tiểu buốt, không bị va đập."
