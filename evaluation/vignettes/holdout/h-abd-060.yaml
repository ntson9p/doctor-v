id: h-abd-060
set: holdout
title_vi: "Nữ 68 tuổi có sỏi mật, 2 ngày đau dưới sườn phải lan ra sau lưng, sốt 39,5°C rét run, vàng mắt, nước tiểu sẫm"
narrative_vi: "Bà S., 68 tuổi, ở Quảng Ngãi, biết có sỏi mật từ 5 năm trước nhưng chưa mổ, bị tăng huyết áp. Hai ngày nay bà đau tức vùng dưới sườn phải, đau lan ra sau lưng bên phải, đau tăng dần. Từ tối qua bà sốt cao 39,5°C, rét run từng cơn, đắp chăn vẫn run. Sáng nay con gái thấy mắt bà vàng, nước tiểu vàng sẫm như nước chè. Bà buồn nôn, chán ăn, nôn 1 lần. Bà vẫn tỉnh táo, nói chuyện bình thường, tự đi lại được, tay chân ấm. Không tiêu chảy, không ho, không tiểu buốt, không đau đầu, không nổi ban."
