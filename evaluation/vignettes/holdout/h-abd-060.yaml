source:
  basis: "Viêm đường mật cấp do sỏi ở nữ 68 tuổi đã biết sỏi mật: đau hạ sườn phải lan ra sau lưng phải, sốt cao rét run, vàng mắt, nước tiểu sẫm (tam chứng Charcot), còn tỉnh, chưa có dấu hiệu sốc. MSD Manual (Choledocholithiasis and Cholangitis): tam chứng Charcot đặc hiệu khoảng 90%; viêm đường mật là cấp cứu, cần hồi sức và dẫn lưu khẩn. Tokyo Guidelines 2018 (Kiriyama và cộng sự): ở viêm đường mật độ II, dẫn lưu đường mật sớm hoặc khẩn làm giảm tử vong 30 ngày. Chưa có lú lẫn hay dấu hiệu sốc nên mức 2."
