source:
  basis: "Nghi lao phổi: ho khạc đờm kéo dài 6 tuần, sốt nhẹ về chiều, đổ mồ hôi đêm, sụt cân, đã dùng kháng sinh không đỡ, đúng mô tả lao phổi và nguyên nhân ho kéo dài trên 3 tuần trong 4235/QĐ-BYT. Không ho ra máu, không khó thở nên đặt lịch khám trong vài ngày để chụp X-quang phổi và xét nghiệm đờm (NHS Common cold: ho quá 3 tuần là lý do đi khám bác sĩ, không cần khám khẩn)."
  references:
    - byt-qd-4235-2012
    - nhs-common-cold
author: "agent:vignette-holdout"
notes_vi: "Ngoài danh mục bệnh. Không nên coi là viêm phổi cấp vì bệnh kéo dài nhiều tuần, sốt nhẹ, đã dùng kháng sinh không đỡ. Có ho ra máu hoặc khó thở thì cần khám sớm hơn. Danh mục chưa có câu hỏi về ho trên 3 tuần, ho ra máu, đổ mồ hôi đêm, sụt cân, tiếp xúc người bị lao."
