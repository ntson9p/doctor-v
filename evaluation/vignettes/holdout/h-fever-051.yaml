id: h-fever-051
set: holdout
title_vi: "Nam 49 tuổi hút thuốc, ho khạc đờm 6 tuần, sốt nhẹ về chiều, đổ mồ hôi đêm, sụt 5 kg"
narrative_vi: "Anh P., 49 tuổi, thợ xây ở Quảng Trị, hút gần 1 bao thuốc lá mỗi ngày, tối nào cũng uống 3–4 lon bia. Khoảng 6 tuần nay anh ho, lúc đầu ho khan, sau ho khạc đờm trắng đục, ho nhiều về sáng. Chiều tối nào anh cũng thấy người hâm hấp, đo được 37,6–37,9°C, đêm đổ mồ hôi ướt áo. Anh ăn kém, mệt, 2 tháng nay sụt khoảng 5 kg. Anh đã tự mua thuốc ho và kháng sinh uống 1 tuần nhưng không đỡ. Anh không ho ra máu, không khó thở, không đau ngực, không đau họng, không sổ mũi, không nổi hạch. Trong nhà không ai ho, sốt. Anh chưa từng được nói là bị tiểu đường."
