id: h-sob-001
set: holdout
title_vi: "Nữ 22 tuổi bị hen từ nhỏ, sau cảm 3 ngày khò khè, ho đêm, leo cầu thang hụt hơi, xịt thuốc cắt cơn thì đỡ"
narrative_vi: "Em T., nữ, 22 tuổi, sinh viên ở Hà Nội, bị hen phế quản từ nhỏ, bình thường ít khi phải dùng thuốc, có bình xịt cắt cơn màu xanh. Ba ngày trước em bị cảm, sổ mũi. Từ hôm qua em khò khè nhiều hơn, ho khan, đêm qua thức giấc 2 lần vì ho và nặng ngực khó thở; leo 2 tầng cầu thang lên lớp là hụt hơi phải dừng. Từ hôm qua em đã xịt thuốc cắt cơn 4 lần, mỗi lần đỡ hẳn được 3–4 giờ. Ngồi yên em thở bình thường, nói chuyện trọn câu. Bạn cùng phòng có máy kẹp ngón tay, đo SpO2 được 96%. Em không sốt, không đau ngực, không ăn món lạ hay dùng thuốc mới, không nổi mẩn. Em không hút thuốc, không có thai, không uống thuốc tránh thai."
