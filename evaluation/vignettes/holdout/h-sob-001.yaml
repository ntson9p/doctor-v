source:
  basis: "Đợt hen nặng lên mức nhẹ – trung bình sau nhiễm vi rút ở người đã biết bị hen: khò khè, ho đêm, khó thở khi gắng sức, phải dùng thuốc cắt cơn nhiều lần nhưng còn đáp ứng, nói trọn câu, SpO2 96% (GINA 2026 mục 9: đánh giá độ nặng theo khả năng nói, nhịp thở, SpO2; 1851/QĐ-BYT Bảng 9). NHS Asthma: đã lên cơn và đã đỡ thì hẹn khám khẩn trong 2 ngày; gọi 999 khi nặng hơn hoặc không đỡ sau liều tối đa thuốc cắt cơn. Còn đáp ứng thuốc nên mức 3."
