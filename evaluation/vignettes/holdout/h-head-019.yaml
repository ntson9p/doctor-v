source:
  basis: "Viêm màng não do liên cầu lợn (Streptococcus suis) sau mổ lợn bị bệnh và ăn tiết canh: sốt cao, đau đầu, nôn, cứng gáy, nghe kém hai tai, lú lẫn. Viêm màng não nhiễm khuẩn là bệnh cấp cứu; đã lú lẫn, li bì nên phải gọi 115 ngay (5642/QĐ-BYT; NICE NG240; NHS Meningitis)."
