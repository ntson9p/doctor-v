    - wertheim-plosone-2009
    - mai-cid-2008
    - byt-qd-5642-2015
    - nice-ng240
    - nhs-meningitis
author: "agent:vignette-holdout"
notes_vi: "Liên cầu lợn là căn nguyên hay gặp nhất của viêm màng não vi khuẩn ở người lớn tại Việt Nam; khoảng hai phần ba người bệnh bị giảm thính lực. Danh mục chưa có câu hỏi về nghe kém, ù tai."
