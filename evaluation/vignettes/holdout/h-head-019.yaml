id: h-head-019
set: holdout
title_vi: "Nam 58 tuổi mổ lợn bệnh, ăn tiết canh, sốt cao, đau đầu dữ dội, cứng gáy, nghe kém, lẫn lộn"
narrative_vi: "Ông Đ., 58 tuổi, nông dân ở Thái Bình, hay uống rượu. Bốn ngày trước nhà có con lợn bị bệnh, ông tự mổ thịt và ăn tiết canh. Từ chiều qua ông sốt cao 39,8°C, rét run, đau đầu dữ dội khắp đầu, đau mỏi người, mệt, nôn nhiều lần, uống nước vào cũng nôn. Sáng nay ông kêu ù tai, nghe kém hẳn cả hai tai, cổ cứng không cúi được. Từ trưa ông lơ mơ, gọi mới mở mắt, nói lẫn lộn, không biết mình đang ở đâu. Ông không co giật, không méo miệng, không yếu tay chân, không bị ngã, trên da không có nốt ban."
