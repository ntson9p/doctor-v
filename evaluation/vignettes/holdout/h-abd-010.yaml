title_vi: "Nam 76 tuổi bị đái tháo đường, đau tức dưới sườn phải 2 ngày, sốt nhẹ, chán ăn"
narrative_vi: "Ông S., 76 tuổi, ở Vĩnh Long, bị đái tháo đường và tăng huyết áp. Hai ngày nay ông đau tức âm ỉ dưới sườn phải, không dữ dội, trở mình hay đi lại thì đau hơn. Ông chán ăn, buồn nôn, mệt, người hâm hấp sốt, đo được 37,9°C. Ông chưa từng siêu âm bụng nên không biết có sỏi mật không. Không vàng da, không đau ngực, không vã mồ hôi."
