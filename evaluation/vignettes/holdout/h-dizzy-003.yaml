id: h-dizzy-003
set: holdout
title_vi: "Nam 38 tuổi, 10 ngày sau cảm, chóng mặt quay cuồng liên tục từ hôm qua, nôn, đi xiêu nhưng vẫn tự đi được"
narrative_vi: "Anh T., 38 tuổi, nhân viên văn phòng ở Đà Nẵng, không có bệnh mạn tính, không hút thuốc. Khoảng 10 ngày trước anh bị cảm, sổ mũi, đau họng, đã khỏi. Sáng hôm qua vừa ngủ dậy anh thấy mọi vật quay tròn liên tục, không dứt; quay đầu hoặc trở mình thì nặng hơn, nằm yên nhắm mắt đỡ hơn một chút nhưng không hết. Anh buồn nôn, nôn 3 lần từ hôm qua, vẫn uống được nước. Anh đi chậm, hơi xiêu sang trái nhưng vẫn tự đứng dậy và tự đi vào nhà vệ sinh, không cần vịn hay người đỡ. Anh không đau đầu, không ù tai, không nghe kém, không đau tai, không nhìn đôi, không nói khó, không tê yếu tay chân, không sốt, không ngất. Trước đây anh chưa từng bị chóng mặt."
