source:
  basis: "Viêm dây thần kinh tiền đình điển hình: hội chứng tiền đình cấp (chóng mặt quay liên tục hơn 24 giờ, buồn nôn, nôn, đi không vững nhưng vẫn tự đi được) khởi phát lúc ngủ dậy, khoảng 10 ngày sau nhiễm vi rút đường hô hấp, không nghe kém, không dấu hiệu thần kinh. NHS Labyrinthitis: thường do vi rút sau cảm cúm; viêm dây thần kinh tiền đình không có nghe kém, ù tai; triệu chứng có thể nặng hơn khi ngủ dậy. GRACE-3: hội chứng tiền đình cấp cần người được đào tạo khám HINTS để phân biệt với đột quỵ. NHS Vertigo: chóng mặt quay kèm nôn hoặc rất buồn nôn thì khám khẩn (mức 3); người trẻ, không có yếu tố nguy cơ mạch máu, tự đi được, không có dấu hiệu cần gọi cấp cứu."
  references:
    - grace3-dizziness-2023
    - nhs-vertigo
    - "https://www.nhs.uk/conditions/labyrinthitis/"
author: "agent:vignette-holdout"
notes_vi: "Trả lời 'có' câu chóng mặt khi trở mình vì cử động đầu làm chóng mặt nặng thêm, người bị hội chứng tiền đình cấp hay kể như vậy; điểm khác chóng mặt tư thế là chóng mặt liên tục cả khi nằm yên."
