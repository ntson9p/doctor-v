source:
  basis: "Nhiễm khuẩn huyết do não mô cầu ở thanh thiếu niên sống tập thể: sốt đột ngột, đau chân, chi lạnh, ban xuất huyết không mất khi ấn lan nhanh, li bì, lẫn lộn. NICE NG240 khuyên nghĩ ngay đến bệnh não mô cầu và chuyển viện cấp cứu; ban không mất khi ấn và lú lẫn là dấu hiệu phải gọi cấp cứu (NHS Sepsis; NHS Meningitis)."
