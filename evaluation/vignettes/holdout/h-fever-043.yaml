id: h-fever-043
set: holdout
title_vi: "Nam 17 tuổi học nội trú, sốt cao đột ngột, đau chân, ban tím ấn không mất lan nhanh, li bì"
narrative_vi: "Em K., nam, 17 tuổi, học sinh nội trú ở Huế. Sáng nay em sốt cao đột ngột 39,7°C, đau đầu, nôn 2 lần, kêu đau nhức hai chân, rất mệt. Đến chiều, bạn cùng phòng thấy ở cẳng chân, đùi và bụng em nổi nhiều chấm, mảng màu tím, ấn ly thủy tinh lên vẫn thấy rõ, lan thêm nhanh trong 1–2 giờ. Tay chân em lạnh ngắt, da tái, thở nhanh, không tự đứng dậy được. Em lơ mơ, gọi mới mở mắt, trả lời chậm và lẫn lộn. Em không cứng gáy, không co giật, không ho, không đi ngoài lỏng."
