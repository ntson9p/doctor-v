id: h-syncope-008
set: holdout
title_vi: "Bé gái 12 tuổi sốt cao 4 ngày, sáng nay hết sốt nhưng mệt lả, đau bụng, nôn, chảy máu cam, ngồi dậy suýt ngất, tay chân lạnh"
narrative_vi: "Bé Ng., gái, 12 tuổi, ở Long Xuyên (An Giang); khu phố đang có nhiều người bị sốt xuất huyết. Bé sốt cao 39–40°C liên tục 4 ngày, đau đầu, đau sau hốc mắt, đau mỏi người. Từ sáng nay bé hết sốt nhưng mệt lả hơn, chỉ nằm, không tự đi lại được. Bé đau bụng vùng dưới sườn phải, nôn 3 lần từ sáng. Chiều nay bé ngồi dậy đi vệ sinh thì choáng váng, tối sầm mắt, suýt ngã, mẹ phải đỡ. Mẹ sờ thấy tay chân bé lạnh, ẩm. Bé chảy máu cam một ít; ở cẳng chân có nhiều chấm đỏ li ti, mẹ ấn thử không mất. Từ sáng bé mới đi tiểu 1 lần, ít. Bé vẫn trả lời mẹ được, không khó thở, không co giật, không ho, không tiêu chảy."
