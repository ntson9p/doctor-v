source:
  basis: "Sốt xuất huyết Dengue ở giai đoạn nguy hiểm, ngay khi hết sốt (ngày thứ 5): mệt lả, đau bụng vùng gan, nôn, chảy máu cam, chấm xuất huyết, kèm dấu hiệu sốc (tay chân lạnh ẩm, suýt ngất khi ngồi dậy, tiểu ít). 2760/QĐ-BYT: giai đoạn nguy hiểm thường ở ngày 3–7, người bệnh có thể hết sốt; dấu hiệu cảnh báo gồm đau bụng vùng gan, nôn nhiều, chảy máu niêm mạc, li bì; sốc cần cấp cứu ngay. CDC Clinical features of dengue: giai đoạn nguy hiểm bắt đầu khi hết sốt, dấu hiệu cảnh báo xuất hiện quanh lúc hết sốt. Mức 1."
