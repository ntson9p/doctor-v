source:
  basis: "Viêm bàng quang ở người từ 65 tuổi: tiểu buốt, tiểu nhiều lần, tức bụng dưới, không sốt, không đau hông lưng (3931/QĐ-BYT). NHS khuyên người từ 65 tuổi có triệu chứng nhiễm khuẩn tiết niệu cần được khám gấp, không tự xử trí như phụ nữ trẻ (NHS UTIs)."
