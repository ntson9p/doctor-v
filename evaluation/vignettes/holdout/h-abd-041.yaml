title_vi: "Nữ 72 tuổi, tiểu buốt, tiểu nhiều lần, tức bụng dưới 2 ngày, không sốt"
narrative_vi: "Bà P., 72 tuổi, ở Vĩnh Long, bị tăng huyết áp, không bị đái tháo đường. Hai ngày nay bà đi tiểu buốt, nóng rát, phải đi tiểu nhiều lần, mỗi lần một ít, đêm dậy đi tiểu 4–5 lần. Bà tức nặng vùng bụng dưới, nước tiểu đục. Bà không sốt, không rét run, không đau hông lưng, không buồn nôn, vẫn ăn uống được và tỉnh táo như mọi ngày. Nước tiểu không đỏ; bà không ra máu hay khí hư bất thường ở âm đạo."
