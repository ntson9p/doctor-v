title_vi: "Nữ 82 tuổi chưa từng mổ, không đi ngoài 5 ngày, bụng to dần, không xì hơi, mới nôn"
narrative_vi: "Bà H., 82 tuổi, ở Tiền Giang, bị tăng huyết áp, chưa từng mổ bụng. Mấy tháng nay bà hay táo bón xen kẽ đi ngoài phân lỏng. Năm ngày nay bà không đi ngoài, bụng to dần, căng tức, đau quặn nhẹ từng lúc. Hai ngày nay bà không xì hơi được, sáng nay bắt đầu nôn. Bà chán ăn, mệt. Không sốt."
