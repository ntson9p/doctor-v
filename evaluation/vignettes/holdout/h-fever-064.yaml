author: "agent:vignette-holdout"
notes_vi: "Ca thay thế cho ca giữ kín đã chuyển sang bộ dev (sởi giai đoạn khởi phát). Câu hỏi phát ban trả lời 'không' vì ban chưa mọc. Danh mục chưa có câu hỏi về hạt Koplik (chấm trắng nhỏ trong má)."
