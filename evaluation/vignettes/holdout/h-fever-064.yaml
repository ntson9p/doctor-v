id: h-fever-064
set: holdout
title_vi: "Bé gái 3 tuổi chưa tiêm vắc xin sởi, 11 ngày trước chơi với em họ bị sởi, nay sốt cao 3 ngày, ho, sổ mũi, mắt đỏ chảy nước, chưa nổi ban"
narrative_vi: "Bé Q., gái, 3 tuổi, ở quận Bình Tân (TP.HCM). Gia đình không cho bé tiêm vắc xin sởi vì sợ phản ứng sau tiêm. Mười một ngày trước, bé chơi cả buổi với em họ ở đám giỗ; hai hôm sau em họ nổi ban, được bệnh viện chẩn đoán sởi. Ba ngày nay bé sốt cao 39–39,8°C, ho khan nhiều, sổ mũi, nghẹt mũi, hắt hơi, hai mắt đỏ, chảy nước mắt, nheo mắt khi ra chỗ sáng. Bé mệt, quấy, ăn kém. Đến giờ người bé chưa nổi ban. Bé vẫn uống được, không nôn, không tiêu chảy, không khó thở, không thở rít, không co giật, không li bì, không đau tai."
