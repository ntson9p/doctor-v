source:
  basis: "Sởi giai đoạn khởi phát (chưa mọc ban) ở bé gái 3 tuổi chưa tiêm vắc xin, tiếp xúc gần người bị sởi 11 ngày trước: sốt cao 3 ngày, ho, sổ mũi, hắt hơi, mắt đỏ, chảy nước mắt, sợ ánh sáng. CDC (Clinical overview of measles): tiền triệu gồm sốt có thể tới 40,5°C, ho, sổ mũi, viêm kết mạc; ban xuất hiện khoảng 14 ngày sau phơi nhiễm, lây từ 4 ngày trước khi phát ban. NHS Measles: nghĩ con bị sởi, hoặc chưa tiêm đủ 2 mũi mà tiếp xúc gần người bị sởi thì khám khẩn (urgent GP / NHS 111), gọi trước để được khám riêng; chưa có dấu hiệu nào cần gọi 999. Bộ Y tế 1019/QĐ-BYT 2025."
  references:
    - nhs-measles
