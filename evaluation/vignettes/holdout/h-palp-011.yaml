source:
  basis: "Rung nhĩ kịch phát ở người cao tuổi tăng huyết áp: các cơn tim đập không đều, nhanh 1–3 giờ rồi tự hết, máy đo lúc có cơn báo mạch 128 lần/phút và nhịp không đều; nay đã hết cơn, khỏe, trong cơn không đau ngực, khó thở, choáng hay ngất, không có dấu hiệu đột quỵ, không có dấu hiệu cường giáp hay thiếu máu. NHS Atrial fibrillation: nghĩ có triệu chứng rung nhĩ hoặc hồi hộp hay tái lại thì khám bác sĩ (không khẩn), chỉ gọi 999 khi đang có cơn kèm đau ngực, khó thở, ngất hoặc dấu hiệu đột quỵ; NHS Heart palpitations: đã hết, vẫn khỏe nhưng cơn hay tái lại, kéo dài hơn vài phút thì khám bác sĩ, nên mức 4 (ghi điện tim, theo dõi nhịp tim, bác sĩ cân nhắc thuốc chống đông)."
  references:
    - nhs-atrial-fibrillation
    - nhs-heart-palpitations
author: "agent:vignette-holdout"
notes_vi: "Ca điển hình, cơn đã hết. Bà không để ý cơn bắt đầu và dừng có đột ngột không nên câu này là 'không rõ'. Mạch ghi theo lần đo lúc đang có cơn. Hơi mệt chỉ trong cơn, nay không mệt nên câu mệt mỏi trả lời 'không'."
