id: h-palp-011
set: holdout
title_vi: "Nữ 72 tuổi tăng huyết áp, 3 tuần có 3 cơn tim đập loạn, nhanh 1–3 giờ rồi tự hết, máy đo báo nhịp không đều"
narrative_vi: "Bà M., 72 tuổi, ở Hải Phòng, bị tăng huyết áp, uống amlodipine mỗi sáng, đo ở nhà thường khoảng 130/80 mmHg. Ba tuần nay bà có 3 cơn tim đập loạn xạ, lúc nhanh lúc chậm, không đều, thấy rõ trong ngực, kèm hơi mệt; mỗi cơn kéo dài khoảng 1–3 giờ rồi tự hết, bà không để ý cơn bắt đầu và hết đột ngột hay từ từ. Lần gần nhất là tối hôm kia, con gái đo bằng máy đo huyết áp lúc đang có cơn: mạch 128 lần/phút, huyết áp 135/85 mmHg, máy báo nhịp tim không đều. Trong cơn bà không đau ngực, không khó thở, không choáng, không ngất. Hiện bà khỏe, đi chợ, làm việc nhà bình thường, đo mạch 76 lần/phút, máy không báo bất thường. Bà không yếu tay chân, không méo miệng, không nói khó. Bà không bị đái tháo đường, không có bệnh tim đã biết, không uống thuốc chống đông hay aspirin, không uống rượu, không uống cà phê hay trà đặc. Bà không sụt cân, không run tay, không sợ nóng, cổ không to, không xanh xao."
