title_vi: "Nam 14 tuổi sáng sớm thức dậy vì đau dữ dội tinh hoàn trái lan lên bẹn và bụng dưới, nôn 2 lần, bìu trái sưng đỏ"
narrative_vi: "Em P., nam, 14 tuổi, ở Thái Nguyên. Khoảng 5 giờ sáng nay em thức dậy vì đau dữ dội ở tinh hoàn trái, đau lan lên bẹn và bụng dưới bên trái. Em nôn 2 lần. Mẹ xem thấy bìu bên trái sưng, đỏ, tinh hoàn trái nằm cao hơn bên phải, chạm vào là em kêu đau. Đến giờ đã khoảng 3 giờ, đau không giảm. Em không bị va đập, không sốt, không tiểu buốt, nước tiểu không đỏ, không tiêu chảy. Ở bẹn không có khối phồng."
