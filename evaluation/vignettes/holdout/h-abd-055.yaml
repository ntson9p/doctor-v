source:
  basis: "Xoắn tinh hoàn điển hình ở thiếu niên 14 tuổi: đau tinh hoàn trái đột ngột, dữ dội, đánh thức lúc sáng sớm, lan lên bẹn và bụng dưới, nôn, bìu sưng đỏ, tinh hoàn nằm cao. EAU Paediatric Urology (2026): xoắn tinh hoàn hay gặp nhất quanh tuổi dậy thì; đau đột ngột kèm buồn nôn, nôn là điển hình; tổn thương phụ thuộc thời gian, cửa sổ quyết định khoảng 4–6 giờ, cần mổ thám sát khẩn. NHS Testicle pain: đau tinh hoàn đột ngột, dữ dội, hoặc kèm nôn, đau bụng thì đến cấp cứu ngay hoặc gọi 999."
