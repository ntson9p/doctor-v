source:
  basis: "Viêm gan A cấp ở sinh viên 21 tuổi, hai bạn cùng phòng ký túc xá vừa bị viêm gan A: sốt nhẹ, mệt, đau mỏi, chán ăn, buồn nôn, tức hạ sườn phải, rồi nước tiểu sẫm, vàng mắt; không có dấu hiệu nặng. NHS Hepatitis A: triệu chứng gồm sốt, mệt, đau đầu, đau cơ, buồn nôn, đau bụng trên, nước tiểu sẫm, phân bạc màu, vàng da. NHS Jaundice: da hoặc lòng trắng mắt vàng thì khám khẩn (urgent GP / NHS 111). Mức 3."
  references:
    - "https://www.nhs.uk/conditions/hepatitis-a/"
    - nhs-jaundice
author: "agent:vignette-holdout"
notes_vi: "Ca ngoài danh mục. Chẩn đoán phân biệt trong danh mục: viêm đường mật (không rét run, không biết sỏi mật), áp xe gan, bệnh do Leptospira (không phơi nhiễm nước bẩn, không đau bắp chân). Danh mục chưa có câu hỏi về nước tiểu sẫm, phân bạc màu, tiếp xúc người bị viêm gan."
