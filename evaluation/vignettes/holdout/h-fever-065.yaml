id: h-fever-065
set: holdout
title_vi: "Nam sinh viên 21 tuổi, hai bạn cùng phòng vừa bị viêm gan A: 5 ngày sốt nhẹ, mệt, chán ăn, buồn nôn, tức dưới sườn phải, nay nước tiểu sẫm, vàng mắt"
narrative_vi: "Em H., nam, 21 tuổi, sinh viên ở ký túc xá tại Hà Nội, hay ăn ở quán vỉa hè, uống nước đá. Ba tuần trước, hai bạn cùng phòng bị vàng da và được chẩn đoán viêm gan A. Năm ngày nay em sốt nhẹ 37,8–38,4°C, mệt, đau mỏi người, nhức đầu nhẹ, chán ăn hẳn, buồn nôn, tức nhẹ vùng dưới sườn phải. Hai ngày nay nước tiểu sẫm như nước chè đặc; hôm nay soi gương thấy lòng trắng mắt vàng. Em không nôn, không tiêu chảy, không đi ngoài phân đen, không ho, không nổi ban, không chảy máu chân răng. Em không uống rượu, chưa từng được nói có sỏi mật hay viêm gan B, chưa tiêm vắc xin viêm gan A. Em vẫn tỉnh táo, ăn uống được ít, tự đi học được."
