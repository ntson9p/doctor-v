title_vi: "Nam 15 tuổi, đau đầu vùng trán, đau sau hốc mắt, sốt 39,3°C, xóm có sốt xuất huyết"
narrative_vi: "Em H., nam, 15 tuổi, ở Đồng Tháp. Từ hôm qua em đau đầu nhiều vùng trán, nhức giật giật, đau sau hốc mắt, kèm sốt 39,3°C. Em đau mỏi khắp người, mệt, chán ăn, buồn nôn, nôn 1 lần. Xóm em đang có nhiều người bị sốt xuất huyết. Em không cứng gáy, không sợ ánh sáng, không lú lẫn, không ho, không nổi ban."
