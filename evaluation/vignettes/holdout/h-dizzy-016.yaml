source:
  basis: "Đột quỵ tiểu não biểu hiện bằng hội chứng tiền đình cấp mà không có liệt, nói khó hay nhìn đôi: chóng mặt quay liên tục từ lúc ngủ dậy, nôn, không tự ngồi vững, không tự đi được kể cả khi mở mắt, nhức đầu vùng gáy, ở người 70 tuổi tăng huyết áp, không có nhiễm vi rút trước đó. GRACE-3: ở hội chứng tiền đình cấp, đánh giá mức độ đi không vững để phân biệt nguyên nhân trung ương với ngoại biên; đi không vững nặng, không tự đi được gợi ý nguyên nhân trung ương. 3312/QĐ-BYT (2024): nhồi máu não có thể biểu hiện thất điều, chóng mặt; chảy máu tiểu não gây nhức đầu vùng chẩm, thất điều, nôn; cần vận chuyển nhanh đến cơ sở điều trị được đột quỵ. NHS Ménière's disease: chóng mặt quay kèm mất thăng bằng nhiều có thể là dấu hiệu đột quỵ, gọi 999. Mức 1."
  references:
    - grace3-dizziness-2023
    - byt-qd-3312-2024
    - nhs-stroke-symptoms
    - "https://www.nhs.uk/conditions/menieres-disease/"
author: "agent:vignette-holdout"
notes_vi: "Ca cấp cứu khó: các câu sàng lọc đột quỵ (méo miệng, yếu tay, nói khó, nhìn đôi) đều 'không'; dấu hiệu then chốt là không tự đi được. Thời điểm còn bình thường cuối cùng là tối qua (đột quỵ lúc ngủ)."
