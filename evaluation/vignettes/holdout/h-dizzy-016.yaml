id: h-dizzy-016
set: holdout
title_vi: "Nữ 70 tuổi tăng huyết áp, ngủ dậy chóng mặt quay liên tục, nôn, không tự ngồi vững, không tự đi được; không liệt, không nói khó"
narrative_vi: "Bà Đ., 70 tuổi, ở Thái Nguyên, bị tăng huyết áp 10 năm, uống thuốc hằng ngày. Tối qua đi ngủ bà vẫn bình thường. Sáng nay khoảng 6 giờ, vừa ngủ dậy bà thấy chóng mặt quay cuồng liên tục, buồn nôn, nôn 3 lần. Bà không tự ngồi vững, đứng dậy là ngã sang trái, phải có hai người dìu mới vào được nhà vệ sinh, kể cả khi mở mắt. Đến giờ (9 giờ) bà vẫn chóng mặt liên tục. Bà vẫn tỉnh, nói rõ, không méo miệng, hai tay vẫn giơ đều, không nhìn đôi, không ù tai, không nghe kém. Bà hơi nhức đầu vùng sau gáy, không phải kiểu đau đột ngột dữ dội. Tuần qua bà không bị cảm. Con trai đo huyết áp được 170/95 mmHg."
