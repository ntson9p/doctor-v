title_vi: "Nam 42 tuổi, đột ngột đau đầu dữ dội nhất từ trước tới nay khi nâng tạ, nôn, cứng gáy"
narrative_vi: "Anh T., 42 tuổi, ở Hà Nội, hút thuốc lá, bị tăng huyết áp nhưng không uống thuốc đều. Khoảng 1 giờ trước, khi đang nâng tạ ở phòng tập, anh đột ngột đau đầu dữ dội vùng sau gáy như bị ai đánh mạnh vào đầu, đau nhất từ trước đến nay. Anh nôn 2 lần, cổ cứng, chói mắt khi nhìn đèn. Anh vẫn tỉnh, nói được, không yếu tay chân, không bị va đập đầu."
