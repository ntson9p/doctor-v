source:
  basis: "Sốc nhiệt cổ điển (không do gắng sức) ở cụ bà 82 tuổi sống một mình trong phòng mái tôn, không có điều hòa, giữa đợt nắng nóng 40–41°C, uống ít nước, đang dùng thuốc lợi tiểu: thân nhiệt 40,5°C, da nóng khô đỏ, không ra mồ hôi, thở nhanh, lơ mơ, lú lẫn. NHS Heat exhaustion and heatstroke: thân nhiệt rất cao, da nóng không ra mồ hôi, thở nhanh, lú lẫn, mất phối hợp là dấu hiệu sốc nhiệt, gọi 999 ngay; người cao tuổi, người có bệnh mạn tính dễ bị."
  references:
    - nhs-heat-exhaustion-heatstroke
author: "agent:vignette-holdout"
notes_vi: "Ca khó ở người cao tuổi, cũng là ca cấp cứu bổ sung (người già sống một mình giữa đợt nắng nóng). Không có triệu chứng nhiễm trùng, nhưng nhiễm khuẩn huyết vẫn là chẩn đoán phân biệt. Danh mục chưa có câu hỏi về da nóng khô, không ra mồ hôi; câu nhiệt độ cao nhất chỉ có lựa chọn 'từ 39°C trở lên', không phân biệt được 39°C với trên 40°C."
