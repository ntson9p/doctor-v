id: h-fever-063
set: holdout
title_vi: "Cụ bà 82 tuổi sống một mình trong phòng mái tôn giữa đợt nắng nóng ở Hà Nội, người nóng ran 40,5°C, da khô đỏ không ra mồ hôi, thở nhanh, lơ mơ, lú lẫn"
narrative_vi: "Bà M., 82 tuổi, sống một mình trên tầng 4 khu tập thể ở Hà Nội, phòng mái tôn, chỉ có một quạt nhỏ, không có điều hòa. Bà bị tăng huyết áp, mỗi sáng uống một viên thuốc huyết áp có lợi tiểu. Đợt nắng nóng tuần này ngoài trời 40–41°C; bà sợ tốn điện nên ít bật quạt, uống ít nước. Chiều nay hàng xóm sang chơi thấy bà nằm trên giường, người nóng ran, da khô đỏ, không ra mồ hôi, thở nhanh. Bà lơ mơ, gọi to mới mở mắt, nói lẫn lộn, không biết đang ở đâu, không tự ngồi dậy được. Hàng xóm đo nhiệt độ ở trán được 40,5°C. Mấy hôm trước bà vẫn khỏe, không ho, không sổ mũi, không tiểu buốt, không tiêu chảy, không nôn. Không co giật, không méo miệng."
