id: h-syncope-021
set: holdout
title_vi: "Nam 19 tuổi lần đầu hiến máu, chưa ăn sáng, lúc rút kim choáng như sắp ngất; nằm kê chân 15 phút thì khỏe"
narrative_vi: "Em L., nam, 19 tuổi, sinh viên năm nhất ở Huế, khỏe mạnh. Sáng nay em hiến máu lần đầu ở ngày hội hiến máu của trường; đêm qua em thức khuya, sáng chưa ăn gì, uống ít nước. Hiến xong, lúc nhân viên rút kim, em vẫn đang ngả lưng trên ghế hiến máu, nhìn thấy túi máu thì thấy nóng bừng người, vã mồ hôi, buồn nôn, mắt tối sầm, choáng như sắp ngất nhưng không mất ý thức. Nhân viên cho em nằm, kê cao chân, cho uống nước cam, ăn bánh; khoảng 15 phút sau em hết hẳn. Bây giờ là 2 giờ sau, em đã ăn trưa, đi lại, lên lớp bình thường, không choáng, không mệt. Em không đau ngực, không khó thở, không thấy tim đập nhanh hay đập loạn, không co giật, không đập đầu. Hồi lớp 9 đi lấy máu xét nghiệm em cũng từng choáng giống vậy một lần. Em không có bệnh tim, không hút thuốc, không uống rượu bia; trong nhà không ai đột tử. Em muốn biết có cần đi khám không."
