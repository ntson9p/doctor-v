source:
  basis: "Suýt ngất phản xạ (phế vị) khi hiến máu ở người trẻ khỏe: yếu tố khởi phát rõ (rút kim, nhìn thấy máu, nhịn đói, thiếu ngủ, vừa mất một lượng máu), tiền triệu điển hình nóng bừng, vã mồ hôi, buồn nôn, tối sầm mắt, không mất ý thức, hết hẳn sau 15 phút nằm kê cao chân, uống nước; đã từng bị giống vậy khi lấy máu; không đau ngực, không hồi hộp, không bệnh tim, gia đình không ai đột tử. ESC 2018: tiền triệu điển hình, xảy ra sau cảnh tượng khó chịu hoặc đau là đặc điểm nguy cơ thấp của ngất phản xạ, không có đặc điểm nguy cơ cao; Romme (2008): ngất phản xạ là nguyên nhân hay gặp nhất ở người dưới 40 tuổi, hay báo trước bằng da tái, choáng, vã mồ hôi; NHS Fainting: khi thấy sắp ngất thì nằm xuống, kê cao chân, uống nước, chỉ cần đi khám để tìm nguyên nhân khi đã ngất hẳn; đã hồi phục hoàn toàn nên mức 5."
  references:
    - esc-syncope-2018
    - nhs-fainting
    - romme-car-2008
author: "agent:vignette-holdout"
notes_vi: "Ca nhẹ: suýt ngất, không mất ý thức, nguyên nhân rõ, đã hồi phục hoàn toàn; khác h-syncope-003 (đã ngất hẳn nên cần đi khám không khẩn). Ăn bánh, uống nước cam xong thì đỡ hẳn trong 15 phút nên câu đỡ sau khi ăn đồ ngọt trả lời 'có', dù nằm kê cao chân mới là cách xử trí chính. Các dấu hiệu lúc suýt ngất (vã mồ hôi, choáng) đã hết từ lâu nên trả lời 'không'; tiền triệu được ghi ở câu dấu hiệu ngay trước khi ngất."
