id: h-abd-048
set: holdout
title_vi: "Nam 71 tuổi hút thuốc lào, đã biết phình động mạch chủ bụng chưa mổ, đột ngột đau dữ dội quanh rốn xuyên ra sau lưng, vã mồ hôi, choáng khi đứng dậy"
narrative_vi: "Ông T., 71 tuổi, ở Hải Phòng, hút thuốc lào hơn 40 năm, bị tăng huyết áp đang uống thuốc. Ba năm trước đi khám sức khỏe, bác sĩ siêu âm nói ông có phình động mạch chủ bụng khoảng 5 cm và hẹn mổ, nhưng ông sợ nên không quay lại. Khoảng 2 giờ trước, đang ngồi xem ti vi, ông đột ngột đau dữ dội quanh rốn, đau xuyên ra sau lưng, đau liên tục không lúc nào đỡ, không nằm yên được. Ông vã mồ hôi, buồn nôn nhưng chưa nôn. Lúc đứng dậy đi vệ sinh, ông choáng, tối sầm mắt, phải ngồi thụp xuống, không ngất hẳn. Con trai thấy da ông tái, tay lạnh. Ông vẫn tỉnh, nói chuyện được. Không sốt, không nôn ra máu, không đi ngoài phân đen, không đau ngực, không khó thở. Đi tiểu bình thường, không tiểu buốt, nước tiểu không đỏ."
