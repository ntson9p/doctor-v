source:
  basis: "Phình động mạch chủ bụng đã biết (khoảng 5 cm, chưa mổ) dọa vỡ hoặc đang rỉ máu ở nam 71 tuổi hút thuốc, tăng huyết áp: đau bụng quanh rốn xuyên ra lưng đột ngột, dữ dội, liên tục, kèm choáng khi đứng, vã mồ hôi, da tái, tay lạnh. NHS (Abdominal aortic aneurysm): đau bụng hoặc đau lưng đột ngột, dữ dội, da tái hoặc xám, mất ý thức là dấu hiệu vỡ phình, đe dọa tính mạng, gọi 999; nam từ 65 tuổi, hút thuốc, tăng huyết áp là yếu tố nguy cơ chính."
