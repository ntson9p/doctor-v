source:
  basis: "Chửa ngoài tử cung vỡ: chậm kinh, ra ít máu nâu, đột ngột đau dữ dội bụng dưới lan lên vai, ngất, da tái, vã mồ hôi lạnh, chi lạnh là dấu hiệu sốc mất máu; gọi cấp cứu ngay (NHS Ectopic pregnancy; NICE NG126). Có thai khi đang đặt vòng thì khoảng một nửa là thai ngoài tử cung (MSD)."
