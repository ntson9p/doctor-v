id: h-abd-039
set: holdout
title_vi: "Nữ 31 tuổi đặt vòng, chậm kinh 10 ngày, đột ngột đau dữ dội bụng dưới phải, ngất, vã mồ hôi lạnh"
narrative_vi: "Chị L., 31 tuổi, ở Nghệ An, có 2 con, đặt vòng tránh thai 3 năm nay nên không nghĩ mình có thai. Kinh thường đều, lần này chậm khoảng 10 ngày. Mấy hôm nay chị ra ít máu nâu lấm tấm, tưởng sắp có kinh nên chưa thử thai. Khoảng 1 giờ trước, đang phơi quần áo thì chị đột ngột đau dữ dội bụng dưới bên phải, rồi đau lan khắp bụng dưới và lên đầu vai phải; cử động là đau tăng. Chị ngất trong nhà tắm vài giây. Hiện chị nằm, da xanh tái, vã mồ hôi lạnh, tay chân lạnh, ngồi dậy là choáng muốn ngất, buồn nôn. Chị không sốt, chưa từng mổ bụng."
