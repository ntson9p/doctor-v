id: h-head-032
set: holdout
title_vi: "Nam 32 tuổi hút thuốc, 10 ngày nay đêm nào cũng bị đánh thức bởi cơn đau dữ dội quanh mắt phải 45–60 phút, kèm đỏ mắt, chảy nước mắt, nghẹt mũi cùng bên"
narrative_vi: "Anh B., 32 tuổi, nhân viên kinh doanh ở TP.HCM, hút thuốc lá 1 gói mỗi ngày. Mười ngày nay, đêm nào anh cũng bị đánh thức vào khoảng 2 giờ sáng bởi cơn đau dữ dội quanh và sau mắt phải, như dao đâm, kéo dài khoảng 45 phút đến 1 giờ rồi hết hẳn. Trong cơn, mắt phải đỏ, chảy nước mắt, mũi bên phải nghẹt và chảy nước; anh không nằm yên được, phải đi lại trong phòng. Uống bia vào là lên cơn. Ngoài cơn anh hoàn toàn bình thường, nhìn rõ, không buồn nôn, không nôn, không thấy quầng sáng quanh đèn. Năm ngoái cũng vào khoảng tháng 10 anh bị một đợt giống hệt kéo dài 6 tuần rồi tự hết, chưa đi khám. Hiện anh đang không trong cơn, không sốt, không yếu tê tay chân, không cứng gáy."
