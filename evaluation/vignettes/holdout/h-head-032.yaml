source:
  basis: "Đau đầu từng cụm (cluster headache) ở nam 32 tuổi hút thuốc: 10 ngày nay đêm nào cũng có cơn đau dữ dội quanh và sau mắt phải 45–60 phút, kèm đỏ mắt, chảy nước mắt, nghẹt và chảy nước mũi cùng bên, bồn chồn phải đi lại; bia làm khởi phát; năm ngoái cùng mùa có một đợt giống hệt; ngoài cơn bình thường, nhìn rõ. NHS Cluster headaches: đau một bên quanh mắt 15 phút đến 3 giờ, xảy ra vào mùa hoặc giờ cố định, kèm đỏ mắt, chảy nước mắt, nghẹt hoặc chảy nước mũi cùng bên, hay gặp ở nam 30–40 tuổi; rượu, hút thuốc là yếu tố khởi phát; nên khám bác sĩ (không khẩn); chỉ gọi 999 khi lần đầu sụp mi hoặc đồng tử nhỏ một bên. Mức 4."
  references:
    - "https://www.nhs.uk/conditions/cluster-headaches/"
    - nice-cg150
author: "agent:vignette-holdout"
notes_vi: "Ca ngoài danh mục. Chẩn đoán phân biệt trong danh mục: glôcôm góc đóng (không nhìn mờ, không quầng sáng, cơn tự hết hẳn, đã có đợt giống hệt), đau nửa đầu, viêm xoang. Danh mục chưa có câu hỏi về cơn đau theo giờ cố định trong ngày, hay bồn chồn phải đi lại trong cơn."
