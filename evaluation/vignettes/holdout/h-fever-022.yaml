title_vi: "Nữ 52 tuổi đang hóa trị ung thư, sốt 38,4°C, ớn lạnh, không có triệu chứng khu trú"
narrative_vi: "Chị G., 52 tuổi, ở Hà Nội, đang hóa trị ung thư vú, đợt truyền gần nhất cách đây 10 ngày. Chiều nay chị thấy ớn lạnh, đo nhiệt độ 38,4°C. Chị mệt và ăn kém nhưng vẫn tỉnh táo, tự đi lại được. Không ho, không đau họng, không tiểu buốt, không tiêu chảy, không đau ở đâu rõ."
