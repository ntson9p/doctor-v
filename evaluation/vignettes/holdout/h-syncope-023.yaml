notes_vi: "Ca điển hình; bạn bè dùng app thay người bệnh nên không rõ dấu hiệu báo trước, đau đầu, chóng mặt. Ngất khi gắng sức cũng gợi ý nguyên nhân tim, cùng mức 1. Danh mục chưa có câu hỏi về da nóng khô, không ra mồ hôi."
