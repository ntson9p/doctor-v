source:
  basis: "Sốc nhiệt do gắng sức ở nam 23 tuổi đá bóng gần 2 giờ giữa trưa nắng 37°C, uống ít nước: chạy loạng choạng, nói lắp bắp rồi ngã gục; tỉnh lại sau 1–2 phút nhưng lú lẫn, lơ mơ, không tự đứng được, da nóng đỏ khô, thở nhanh, nhiệt độ nách 40,2°C, nôn; làm mát 20 phút chưa đỡ. NHS Heat exhaustion and heatstroke: thân nhiệt rất cao, da nóng không ra mồ hôi, thở nhanh, lú lẫn, mất phối hợp, mất ý thức là dấu hiệu sốc nhiệt, gọi 999 ngay. NHS Fainting: ngất khi đang gắng sức hoặc chưa hồi phục hoàn toàn thì gọi 999."
