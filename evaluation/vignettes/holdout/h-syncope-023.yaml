id: h-syncope-023
set: holdout
title_vi: "Nam 23 tuổi đá bóng gần 2 giờ giữa trưa nắng, chạy loạng choạng rồi ngã gục; tỉnh lại nhưng lú lẫn, lơ mơ, da nóng đỏ khô, thở nhanh, 40,2°C, làm mát 20 phút chưa đỡ"
narrative_vi: "Anh P., 23 tuổi, sinh viên ở TP.HCM, khỏe mạnh. Trưa nay trời nắng gắt khoảng 37°C, anh đá bóng ngoài sân cỏ nhân tạo gần 2 giờ, uống ít nước. Cuối trận anh chạy loạng choạng, nói lắp bắp rồi ngã gục xuống sân. Bạn bè đưa anh vào chỗ râm; sau khoảng 1–2 phút anh mở mắt nhưng nói lẫn lộn, không biết mình đang ở đâu, hỏi đi hỏi lại một câu, không tự đứng được. Người anh nóng ran, da đỏ, khô, thở nhanh. Bạn đo nhiệt độ ở nách được 40,2°C. Anh nôn 1 lần. Không co giật, không đập đầu. Trước khi ngã anh không kêu đau ngực, không thấy tim đập loạn. Đã 20 phút được quạt, lau nước mát mà anh vẫn lơ mơ. Trong nhà không ai đột tử."
