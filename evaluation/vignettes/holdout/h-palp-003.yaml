id: h-palp-003
set: holdout
title_vi: "Nữ 26 tuổi, 40 phút nay tim đập rất nhanh và đều, bắt đầu đột ngột như bật công tắc, đồng hồ báo 182 lần/phút, chưa dừng"
narrative_vi: "Chị V., 26 tuổi, nhân viên ngân hàng ở Hà Nội, không có bệnh tim đã biết. Khoảng 40 phút trước, đang ngồi làm việc, chị đột ngột thấy tim đập rất nhanh và đều, đập thình thịch trong ngực và lên cả cổ, như vừa bật công tắc. Đến giờ cơn vẫn chưa dừng; đồng hồ thông minh báo nhịp tim 182 lần/phút. Chị hơi lo, hơi mệt nhưng không đau ngực, không khó thở, không choáng, không thấy sắp ngất. Trước đây chị đã có 3–4 cơn giống vậy, mỗi cơn vài phút rồi tự dừng đột ngột, chưa đi khám. Hôm nay chị không uống cà phê, không dùng thuốc gì, không có thai. Chị không sụt cân, không run tay, không sợ nóng; trong nhà không ai đột tử."
