source:
  basis: "Nhịp nhanh kịch phát trên thất: cơn tim nhanh đều, bắt đầu đột ngột như bật công tắc, đập lên cổ, nhịp 182 lần/phút, đã kéo dài 40 phút chưa dừng; trước đây nhiều cơn ngắn tự dừng đột ngột; người trẻ, không bệnh tim. NHS Supraventricular tachycardia: tim đập nhanh đột ngột, thường trên 100 lần/phút, cơn vài phút đến vài giờ; kèm khó thở, đau ngực hoặc choáng thì gọi 999. NHS Heart palpitations: đang hồi hộp mà cơn không dứt thì gọi 999 hoặc đến cấp cứu. Ổn định, không khó thở, không đau ngực, không choáng nên mức 2 (đến cấp cứu ngay để ghi điện tim và cắt cơn)."
  references:
    - nhs-heart-palpitations
    - "https://www.nhs.uk/conditions/supraventricular-tachycardia-svt/"
author: "agent:vignette-holdout"
notes_vi: "Ca điển hình, cơn đang diễn ra."
