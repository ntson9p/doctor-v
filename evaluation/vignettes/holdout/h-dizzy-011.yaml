id: h-dizzy-011
set: holdout
title_vi: "Nam 48 tuổi uống nhiều rượu, uống thuốc giảm đau hằng ngày, nôn ra chất nâu đen, phân đen, đứng dậy là choáng, vã mồ hôi lạnh"
narrative_vi: "Anh H., 48 tuổi, thợ xây ở TP. Vinh (Nghệ An), uống rượu nhiều hằng ngày; ba tuần nay đau khớp gối nên mua thuốc giảm đau uống mỗi ngày. Khoảng 5 ngày nay anh đau âm ỉ vùng trên rốn. Từ hôm qua anh đi ngoài 2 lần phân đen như bã cà phê, mùi rất khắm. Sáng nay anh nôn 2 lần ra chất nâu đen lẫn máu. Từ trưa anh chóng mặt: ngồi yên thì đỡ, đứng dậy là choáng, tối sầm mắt, phải ngồi xuống ngay. Vợ thấy da anh tái, vã mồ hôi lạnh, tay chân lạnh. Anh vẫn tỉnh, nói chuyện được, chưa ngất, không thấy mọi vật quay tròn, không khó thở, không đau ngực, không sốt, không vàng da. Anh chưa từng được nói là bị xơ gan hay viêm gan, không uống aspirin hay thuốc chống đông."
