source:
  basis: "Xuất huyết tiêu hóa trên (nghi loét dạ dày tá tràng do thuốc giảm đau chống viêm và rượu): nôn ra chất nâu đen lẫn máu, đi ngoài phân đen, kèm choáng khi đứng dậy, da tái, vã mồ hôi lạnh, tay chân lạnh (dấu hiệu mất máu nhiều). NHS Vomiting blood: nôn ra máu kèm choáng hoặc chóng mặt, da lạnh ẩm, phân đen thì gọi 999 hoặc đến cấp cứu, không tự lái xe. NHS Stomach ulcer: dùng thường xuyên thuốc giảm đau chống viêm là nguyên nhân; nôn ra máu, phân đen thì gọi cấp cứu. NICE CG141: mọi người xuất huyết tiêu hóa trên cấp cần được đánh giá nguy cơ ngay khi đến viện. Có dấu hiệu sốc nên gọi 115 (mức 1)."
  references:
    - "https://www.nhs.uk/symptoms/vomiting-blood/"
    - nhs-stomach-ulcer
    - nice-cg141
author: "agent:vignette-holdout"
notes_vi: "Ca điển hình. 'Tối sầm mắt, phải ngồi xuống ngay' khớp với câu hỏi thay thế của câu ngất, suýt ngất nên trả lời 'có'; cứ đứng dậy là choáng nên câu chưa đứng dậy được như bình thường trả lời 'có'."
