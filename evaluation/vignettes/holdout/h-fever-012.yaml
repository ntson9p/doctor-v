narrative_vi: "Bé K., 2 tuổi, ở Bình Dương, đi nhà trẻ. Lớp bé có 3 bạn đang nghỉ vì tay chân miệng. Từ hôm qua bé sốt 38,5°C, chảy nhiều nước dãi, bỏ ăn vì đau miệng. Mẹ thấy trong miệng có vết loét, lòng bàn tay, lòng bàn chân và mông có nốt phỏng nước nhỏ. Bé không giật mình, không nôn, vẫn uống sữa được, chơi bình thường."
