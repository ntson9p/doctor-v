id: h-syncope-020
set: holdout
title_vi: "Nữ 13 tuổi tắm nước nóng 30 phút trong phòng tắm kín có bình nóng lạnh chạy gas, ngất, nay lơ mơ, đau đầu, nôn"
narrative_vi: "Em H., nữ, 13 tuổi, học lớp 8 ở Đà Lạt (Lâm Đồng), khỏe mạnh, kinh nguyệt đều. Nhà em dùng bình nóng lạnh chạy gas đặt ngay trong phòng tắm nhỏ, cửa sổ đóng kín vì trời lạnh. Tối nay em tắm nước nóng khoảng 30 phút, đóng kín cửa. Mẹ nghe tiếng động mạnh, gọi không thấy em trả lời, mở cửa thấy em ngồi gục trên sàn, gọi chỉ ú ớ; em không đập đầu. Mẹ đưa em ra phòng khách, mở hết cửa cho thoáng. Khoảng 10 phút sau em mở mắt, đỡ hơn lúc đầu, nhưng đến giờ vẫn lơ mơ, gọi mới đáp, trả lời chậm, lẫn lộn, không nhớ vừa xảy ra chuyện gì. Em kêu đau nhức cả đầu, choáng váng, buồn nôn, đã nôn 1 lần, mệt rũ. Trong nhà không ai khác bị đau đầu hay chóng mặt vì chỉ mình em tắm. Em không co giật, không sốt, thở bình thường, môi không tím. Tối nay em ăn cơm bình thường cùng cả nhà."
