source:
  basis: "Ngộ độc khí CO do bình nóng lạnh chạy gas trong phòng tắm kín: tắm nước nóng 30 phút, đóng kín cửa, ngất trong phòng tắm, ra chỗ thoáng có đỡ nhưng vẫn lơ mơ, lẫn lộn, đau đầu, choáng váng, nôn; dễ bị nhầm với ngất do tắm nước nóng vì chỉ một người bị. 3610/QĐ-BYT: ở Việt Nam hay gặp do đốt than, củi, khí gas trong phòng kín, kể cả bình nóng lạnh chạy gas trong nhà tắm, cần thở oxy càng sớm càng tốt, oxy cao áp khi đã mất ý thức; CDC: hít nhiều khí CO có thể gây ngất hoặc tử vong; NHS Carbon monoxide poisoning: đã phơi nhiễm mà mất ý thức hoặc đột ngột lú lẫn thì gọi 999, nên mức 1."
  references:
    - byt-qd-3610-2015
    - nhs-carbon-monoxide-poisoning
    - cdc-co-basics
author: "agent:vignette-holdout"
notes_vi: "Ca cấp cứu khó ở thiếu niên: chỉ một người bị, hoàn cảnh giống ngất khi tắm nước nóng (đứng lâu ở nơi nóng). Câu phơi nhiễm trả lời 'có' vì phần giải thích của câu hỏi có nêu bình nóng lạnh chạy gas. Em còn lơ mơ, không nhớ trước khi ngất thấy gì nên câu dấu hiệu báo trước là 'không rõ'. Em vẫn mở mắt khi được gọi nên câu bất tỉnh trả lời 'không'."
