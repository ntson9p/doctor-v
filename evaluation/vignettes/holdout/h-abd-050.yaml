id: h-abd-050
set: holdout
title_vi: "Nữ 79 tuổi rung nhĩ đã tự bỏ thuốc chống đông, đột ngột đau quanh rốn dữ dội nhưng bụng mềm, nôn, đi ngoài phân lỏng nhiều lần, vã mồ hôi lạnh"
narrative_vi: "Bà L., 79 tuổi, ở Nam Định, bị rung nhĩ và tăng huyết áp nhiều năm. Bác sĩ cho thuốc chống đông nhưng bà tự bỏ từ hơn 1 tháng nay vì hay chảy máu chân răng. Khoảng 4 giờ trước, sau bữa trưa, bà đột ngột đau bụng dữ dội quanh rốn, kêu đau không chịu nổi, trằn trọc trên giường. Ngay sau đó bà nôn 2 lần ra thức ăn, mót đi ngoài, đi 3 lần phân lỏng, không có máu. Con gái sờ bụng bà thấy vẫn mềm, ấn vào bà không kêu đau thêm. Bà vã mồ hôi lạnh. Những người cùng ăn trưa đều bình thường. Bà vẫn tỉnh, nói chuyện bình thường. Không sốt, không khó thở, không đau ngực, không nôn ra máu, không đi ngoài phân đen."
