source:
  basis: "Thiếu máu mạc treo ruột cấp do cục máu đông từ tim (rung nhĩ, đã tự bỏ thuốc chống đông) ở nữ 79 tuổi: đột ngột đau quanh rốn dữ dội nhưng bụng vẫn mềm, kèm nôn và đi ngoài nhiều lần ('tống sạch ruột'), vã mồ hôi lạnh. WSES 2022 (Bala và cộng sự): đau bụng dữ dội không tương xứng với khám bụng phải coi là thiếu máu mạc treo cho tới khi loại trừ; gần 50% thể do cục máu đông từ tim có rung nhĩ; nôn và tiêu chảy mỗi loại khoảng 35%; tử vong 30–70%, mỗi 6 giờ chậm chụp mạch thì tử vong tăng gấp đôi. NHS Stomach ache: đau bụng đột ngột, dữ dội thì gọi 999 hoặc đến cấp cứu; bệnh tối khẩn ở người cao tuổi nên mức 1."
  references:
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC9580452/"
    - nhs-stomach-ache
author: "agent:vignette-holdout"
notes_vi: "Ca điển hình. Tiêu chảy và nôn dễ làm nghĩ viêm dạ dày – ruột; người ăn cùng không bị. Danh mục chưa có câu hỏi về 'đau nhiều mà ấn bụng không đau thêm'."
