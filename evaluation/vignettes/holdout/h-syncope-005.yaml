id: h-syncope-005
set: holdout
title_vi: "Nữ 58 tuổi 3 tuần sau mổ gãy xương cẳng chân, bắp chân trái sưng đau, đột ngột khó thở, đau ngực khi hít sâu, tim nhanh rồi ngất"
narrative_vi: "Bà Ng., 58 tuổi, ở Bắc Giang, đã mãn kinh. Ba tuần trước bà bị gãy xương cẳng chân trái, được mổ kết hợp xương, từ đó chủ yếu nằm ở nhà, ít đi lại. Hai ngày nay bắp chân trái sưng to và đau hơn. Sáng nay khi đang ngồi ăn, bà đột ngột khó thở, thở dốc, đau nhói ngực bên phải, đau tăng khi hít sâu, tim đập nhanh dồn dập, rồi lịm đi, mất ý thức khoảng 1 phút. Hiện bà đã tỉnh, trả lời được, nói được câu ngắn, nhưng vẫn thở nhanh, mệt, vã mồ hôi lạnh. Bà không ho, không ho ra máu, không sốt, không co giật, không có bệnh tim hay tăng huyết áp."
