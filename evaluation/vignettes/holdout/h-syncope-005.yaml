source:
  basis: "Thuyên tắc phổi điển hình: sau mổ xương chân, nằm nhiều, sưng đau một bên bắp chân, rồi đột ngột khó thở, đau ngực khi hít sâu, tim nhanh và ngất. NHS Pulmonary embolism: khó thở đột ngột, đau ngực tăng khi hít vào, tim đập rất nhanh, ngất thì gọi 999 hoặc đến cấp cứu. NHS DVT: đang hoặc mới phẫu thuật là yếu tố nguy cơ; triệu chứng huyết khối kèm khó thở, đau ngực thì gọi 999. ESC 2018: ngất kèm khó thở mới, hồi hộp đột ngột rồi ngất là đặc điểm nguy cơ cao. Vẫn thở nhanh, vã mồ hôi sau ngất nên gọi 115 (mức 1)."
  references:
    - "https://www.nhs.uk/conditions/pulmonary-embolism/"
    - "https://www.nhs.uk/conditions/deep-vein-thrombosis-dvt/"
    - esc-syncope-2018
author: "agent:vignette-holdout"
notes_vi: "Ca điển hình. Đau ngực một bên khi hít sâu, không phải tức nặng giữa ngực."
