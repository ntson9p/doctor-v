source:
  basis: "Xuất huyết tiêu hóa trên không đau ở người cao tuổi hay dùng thuốc giảm đau chống viêm: phân đen như hắc ín vài ngày (người bệnh không để ý), chóng mặt, choáng khi đứng dậy, da xanh, mệt, hụt hơi khi gắng sức. NHS Stomach ulcer: phân đen hoặc có máu thì gọi 999 hoặc đến cấp cứu. NHS Iron deficiency anaemia: thuốc giảm đau chống viêm (kể cả aspirin) gây chảy máu dạ dày, ruột. ESC 2018: nghi chảy máu tiêu hóa ở người ngất, suýt ngất là đặc điểm nguy cơ cao. NICE CG141: đánh giá nguy cơ ngay khi đến viện. Còn tỉnh, không vã mồ hôi, tay chân không lạnh nên mức 2 (đến cấp cứu ngay)."
  references:
    - nhs-stomach-ulcer
    - esc-syncope-2018
    - nice-cg141
    - "https://www.nhs.uk/conditions/iron-deficiency-anaemia/"
author: "agent:vignette-holdout"
notes_vi: "Ca khó: không đau bụng, không nôn ra máu; người bệnh tưởng phân đen do ăn rau; đang uống thuốc hạ áp nên dễ nghĩ là hạ huyết áp tư thế do thuốc. Người bệnh không chọn được kiểu chóng mặt (không rõ)."
