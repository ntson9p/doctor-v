id: h-dizzy-012
set: holdout
title_vi: "Nữ 80 tuổi hay uống thuốc xương khớp, 3 ngày chóng mặt, đứng dậy tối sầm mắt, phân đen sệt, không đau bụng, không nôn"
narrative_vi: "Bà X., 80 tuổi, ở Bến Tre, bị tăng huyết áp uống thuốc đều; bà đau khớp nhiều năm nên hay uống thuốc xương khớp, thuốc giảm đau mua ở hiệu thuốc. Ba ngày nay bà chóng mặt, mệt, đi vài bước đã hụt hơi; đứng dậy là choáng, tối sầm mắt, phải ngồi xuống một lúc mới đi tiếp được; hôm nay ngồi ăn cũng thấy lâng lâng. Con gái hỏi kỹ thì bà kể mấy ngày nay đi ngoài phân đen sệt như hắc ín, bà tưởng do ăn rau. Bà không đau bụng, không buồn nôn, không nôn ra máu. Bà không thấy mọi vật quay tròn, không nói khó, không yếu tay chân, không đau ngực, chưa ngất hẳn. Con gái thấy bà xanh xao hơn mọi khi; đo huyết áp lúc ngồi được 105/60 mmHg. Bà vẫn tỉnh táo, tự đi lại trong nhà được, tay chân không lạnh, không vã mồ hôi. Bà không uống aspirin hay thuốc chống đông, không bị bệnh gan."
