source:
  basis: "Tắc ruột do thoát vị bẹn nghẹt: khối phồng bẹn đau, căng, không đẩy lên được, kèm đau quặn, nôn, chướng bụng, bí trung đại tiện. Thoát vị là nguyên nhân hay gặp của tắc ruột, có nguy cơ thắt nghẹt hoại tử ruột nên cần đến cấp cứu ngoại khoa ngay (MSD Intestinal obstruction; NHS Stomach ache)."
