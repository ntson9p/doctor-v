id: h-abd-040
set: holdout
title_vi: "Nam 81 tuổi, khối phồng bẹn phải không đẩy lên được, đau quặn, nôn, bụng chướng, không xì hơi"
narrative_vi: "Ông S., 81 tuổi, ở Quảng Trị, bị tăng huyết áp. Nhiều năm nay ông có khối phồng ở bẹn phải, đứng lâu thì phồng ra, nằm xuống thì tự lặn hoặc ông tự đẩy lên được, nhưng ông ngại mổ. Chiều qua sau khi khiêng bao lúa, khối phồng đột ngột to ra, căng cứng, rất đau, không đẩy lên được nữa. Từ tối qua ông đau quặn từng cơn ở bụng dưới bên phải và quanh rốn, đau lan xuống bẹn, nôn 3 lần ra thức ăn, bụng chướng căng dần. Từ tối qua đến giờ, khoảng 16 tiếng, ông không đi ngoài, không xì hơi được. Ông không sốt, chưa từng mổ bụng."
