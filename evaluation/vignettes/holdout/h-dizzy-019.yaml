source:
  basis: "Kiệt sức do nóng (không có trong danh mục): làm việc nặng ngoài nắng nóng, uống ít nước; chóng mặt, đau đầu, buồn nôn, vã nhiều mồ hôi, da tái ẩm, chuột rút, mệt; đỡ hẳn sau khoảng 30 phút nghỉ chỗ mát, làm mát và uống bù nước, tỉnh táo hoàn toàn. NHS Heat exhaustion and heatstroke: kiệt sức do nóng thường không cần cấp cứu nếu hạ nhiệt được trong 30 phút; gọi 999 khi vẫn không đỡ sau 30 phút nghỉ, làm mát, uống nước, hoặc có dấu hiệu say nóng (sốt rất cao, da nóng không ra mồ hôi, tim nhanh, thở nhanh, lú lẫn, co giật, mất ý thức). Mức 5."
  references:
    - "https://www.nhs.uk/conditions/heat-exhaustion-heatstroke/"
author: "agent:vignette-holdout"
notes_vi: "Ngoài danh mục. Danh mục chưa có câu hỏi về làm việc hoặc ở nơi nắng nóng. Chuột rút được trả lời ở câu đau nhức cơ."
