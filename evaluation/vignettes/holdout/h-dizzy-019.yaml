id: h-dizzy-019
set: holdout
title_vi: "Nam 50 tuổi phụ hồ làm ngoài nắng 39°C, chóng mặt, đau đầu, vã mồ hôi, chuột rút; nghỉ chỗ mát, uống oresol 30 phút thì đỡ hẳn"
narrative_vi: "Anh C., 50 tuổi, phụ hồ ở Hà Tĩnh, không có bệnh mạn tính. Trưa nay trời nắng gắt, nhiệt độ ngoài trời khoảng 39°C, anh làm việc ngoài công trình từ sáng, uống ít nước. Khoảng 11 giờ anh thấy chóng mặt, choáng váng, đau đầu nhẹ, buồn nôn, ra mồ hôi rất nhiều, da tái ẩm, chuột rút bắp chân, người mệt rã. Anh không ngất, không thấy sắp ngất, không thấy mọi vật quay tròn. Anh được đưa vào chỗ râm mát, cởi bớt áo, chườm khăn ướt, quạt và uống khoảng 1 lít oresol. Khoảng 30 phút sau anh đỡ hẳn, hết chóng mặt, hết chuột rút, chỉ còn hơi mệt. Anh tỉnh táo, nói chuyện bình thường, đi lại vững, không nôn, không khó thở, không đau ngực, không hồi hộp. Anh không uống rượu bia hôm nay."
