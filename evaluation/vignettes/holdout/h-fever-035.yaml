title_vi: "Nam 30 tuổi ở Đắk Nông, ngủ rừng, sốt 5 ngày, nay vàng mắt, lú lẫn, tiểu ít"
narrative_vi: "Anh M., 30 tuổi, ở Đắk Nông, làm nghề khai thác gỗ, hay ngủ lại trong rừng. Năm ngày nay anh sốt cao 39–40°C, rét run, đau đầu nhiều, đau mỏi người, nôn. Hôm nay vợ thấy anh vàng mắt, nói năng lẫn lộn, mệt lả không tự đi được, đi tiểu rất ít, nước tiểu sẫm màu. Anh không co giật."
