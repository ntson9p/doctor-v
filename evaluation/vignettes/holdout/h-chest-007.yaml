title_vi: "Nữ 58 tuổi, 3 ngày rát bỏng, châm chích một bên ngực phải lan ra sau lưng, hôm qua nổi đám mụn nước thành dải"
narrative_vi: "Bà H., 58 tuổi, ở Cần Thơ, khỏe mạnh, không bị tiểu đường, không dùng thuốc gì đặc biệt. Ba ngày trước bà thấy rát bỏng, châm chích ở da ngực bên phải, lan vòng ra sau lưng bên phải; áo cọ vào cũng đau, chạm nhẹ vào da là buốt. Hôm qua chỗ đau nổi mấy mảng đỏ, trên có từng đám mụn nước nhỏ, xếp thành một dải từ sau lưng ra trước ngực, chỉ ở bên phải. Đau liên tục, không liên quan khi đi lại, gắng sức. Bà hơi mệt, không sốt, không khó thở, không ho, không vã mồ hôi. Mụn nước không ở mặt, mắt. Lúc nhỏ bà từng bị thủy đậu."
