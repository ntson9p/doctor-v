source:
  basis: "Zona thần kinh điển hình ở ngực: 2–3 ngày đau rát, châm chích, tăng cảm da một bên, rồi nổi mụn nước thành dải theo một khoanh da, không qua đường giữa. NHS Shingles: nghĩ mình bị zona thì hẹn khám khẩn hoặc gọi 111 (hoặc gặp dược sĩ) vì thuốc kháng vi rút hiệu quả nhất khi bắt đầu trong 3 ngày kể từ khi nổi ban; khám ngay khi ban gần mắt. Ban mới nổi 1 ngày nên mức 3."
