notes_vi: "Chạm nhẹ vào da cũng buốt nên câu ấn vào chỗ đau có đau nhói trả lời 'có'. Trang NHS Shingles chưa có trong danh mục nguồn; lời khuyên khám khẩn ghi theo kết quả tìm kiếm ngày 31/10/2026."
