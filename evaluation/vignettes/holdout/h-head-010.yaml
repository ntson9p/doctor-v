id: h-head-010
set: holdout
title_vi: "Nữ 48 tuổi, 2 ngày trước đột ngột đau đầu rất mạnh, nay còn đau, gáy cứng, chói mắt"
narrative_vi: "Chị N., 48 tuổi, ở Thành phố Hồ Chí Minh, trước nay hiếm khi đau đầu. Hai ngày trước, khi đang cúi xuống nhặt đồ, chị đột ngột đau đầu rất mạnh, đau lên đỉnh điểm chỉ trong vài phút. Chị nghĩ là đau nửa đầu nên uống thuốc giảm đau và nằm nghỉ. Đến nay chị vẫn đau âm ỉ khắp đầu ở mức vừa, gáy hơi cứng, buồn nôn, chói mắt. Chị tỉnh táo, không nôn, không yếu tay chân, không sốt."
