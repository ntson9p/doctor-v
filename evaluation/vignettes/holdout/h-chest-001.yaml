title_vi: "Nam 21 tuổi cao gầy hút thuốc, đang ngồi học đột ngột đau nhói ngực phải, đau tăng khi hít sâu, đi lại hụt hơi"
narrative_vi: "Anh L., 21 tuổi, sinh viên ở Hà Nội, cao 1,80 m, nặng 56 kg, hút thuốc lá 3 năm. Khoảng 4 giờ trước, đang ngồi học, anh đột ngột đau nhói dữ dội ngực bên phải, sau đó đau âm ỉ liên tục, đau tăng khi hít sâu. Từ lúc đó anh hụt hơi khi đi lại, lên cầu thang; ngồi yên thì thở được, nói trọn câu. Ấn vào ngực không đau thêm. Anh không ho, không sốt, không ho ra máu, không vã mồ hôi, đau không lan lên vai, cánh tay hay ra sau lưng. Anh không bị chấn thương, không đi xa gần đây, chân không sưng. Anh chưa từng bị như vậy, không bị hen."
