source:
  basis: "Tràn khí màng phổi tự phát nguyên phát điển hình: nam trẻ cao gầy hút thuốc, đột ngột đau ngực một bên kiểu màng phổi lúc nghỉ, khó thở khi gắng sức, không sốt, không chấn thương. BTS 2023: tràn khí có đau hoặc khó thở cần đánh giá tại bệnh viện (chụp phổi, chọc hút hoặc dẫn lưu). NHS Chest pain: đau ngực đột ngột và không hết hoặc kèm khó thở thì gọi 999; còn nói trọn câu, chỉ khó thở khi gắng sức nên đến cơ sở cấp cứu ngay (mức 2)."
