id: h-fever-067
set: holdout
title_vi: "Nam 17 tuổi sau 6 giờ tắm biển không bôi kem chống nắng, da vai lưng đỏ rát, sờ thấy nóng, 37,7°C, ngoài ra khỏe"
narrative_vi: "Em Y., nam, 17 tuổi, ở Nha Trang (Khánh Hòa). Hôm qua em đi tắm biển với bạn từ 9 giờ sáng đến 3 giờ chiều, không bôi kem chống nắng. Tối qua da vai, lưng, mặt và hai cánh tay đỏ rát, chạm vào rất xót, không có bọng nước, không sưng. Sáng nay mẹ sờ lưng em thấy nóng, đo nhiệt độ ở nách được 37,7°C nên lo em bị sốt. Em chỉ thấy rát ở chỗ da cháy nắng, không thấy ớn lạnh hay rét run. Em vẫn ăn uống, đi lại bình thường, uống nhiều nước, đi tiểu bình thường. Không đau đầu, không chóng mặt, không buồn nôn, không nôn, không chuột rút, không mệt nhiều. Không ho, không sổ mũi, không đau họng. Em muốn biết có cần đi khám không."
