source:
  basis: "Cháy nắng không biến chứng ở nam 17 tuổi sau 6 giờ tắm biển không bôi kem chống nắng: da vai, lưng, mặt đỏ rát, không phỏng nước, không sưng, nhiệt độ 37,7°C; không đau đầu, không chóng mặt, không buồn nôn, không rét run, không chuột rút, ăn uống bình thường. NHS Sunburn: tự chăm sóc (tránh nắng, làm mát da, kem dưỡng, uống nhiều nước, thuốc giảm đau không kê đơn); chỉ khám khẩn khi da phỏng hoặc sưng, nhiệt độ rất cao, thấy nóng lạnh rét run, rất mệt, chóng mặt, buồn nôn, đau đầu, chuột rút, hoặc khi trẻ nhỏ bị cháy nắng. Không có dấu hiệu nào nên theo dõi tại nhà."
  references:
    - "https://www.nhs.uk/conditions/sunburn/"
author: "agent:vignette-holdout"
notes_vi: "Ca ngoài danh mục. Người nhà chọn 'Sốt' vì sờ lưng thấy nóng, đo được 37,7°C. Vùng da đỏ do cháy nắng không được tính là phát ban. Chẩn đoán phân biệt trong danh mục: kiệt sức do nóng (không có triệu chứng toàn thân). Danh mục chưa có câu hỏi về cháy nắng."
