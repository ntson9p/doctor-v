title_vi: "Nữ 42 tuổi có sỏi túi mật, đau dưới sườn phải 3 giờ sau bữa nhiều mỡ, không sốt"
narrative_vi: "Chị Q., 42 tuổi, ở Thành phố Hồ Chí Minh, đã biết có sỏi túi mật. Khoảng 2 giờ sau bữa tối nhiều dầu mỡ, chị đau tức nhiều dưới sườn phải, đau liên tục, lan ra sau lưng, đến giờ đã 3 tiếng. Chị buồn nôn, nôn 1 lần. Mấy tháng nay chị đã bị 2 lần tương tự, mỗi lần vài giờ rồi tự hết. Không sốt, không vàng da. Chị không mang thai."
