title_vi: "Nam 66 tuổi tăng huyết áp, đột ngột đau đầu, nôn, yếu tay chân phải, méo miệng"
narrative_vi: "Ông K., 66 tuổi, ở Bắc Giang, bị tăng huyết áp nhưng hay bỏ thuốc, hút thuốc lào. Sáng nay trời rét, khoảng 1 giờ trước khi đang ăn sáng, ông đột ngột đau đầu nhiều, nôn 1 lần, rồi tay chân phải yếu, cầm đũa bị rơi, miệng méo, nói ngọng. Con trai đo huyết áp được 200/110 mmHg. Ông vẫn tỉnh, không co giật."
