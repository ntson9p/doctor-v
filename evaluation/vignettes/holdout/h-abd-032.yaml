title_vi: "Bé trai 6 tuổi, đau bụng 2 ngày, nay đau khắp bụng, sốt cao, nôn, bụng cứng"
narrative_vi: "Bé N., 6 tuổi, ở Thanh Hóa. Hai ngày trước bé kêu đau quanh rốn, sau đó đau bên phải, gia đình nghĩ do ăn uống nên chỉ cho uống thuốc. Hôm nay bé đau khắp bụng, sốt 39,2°C, nôn nhiều lần, đi khom lưng, không dám cử động. Bụng cứng, chạm vào là bé khóc. Bé mệt, bỏ ăn. Bé không tiêu chảy."
