title_vi: "Nam 33 tuổi, đau đầu giật hai bên, buồn nôn sau đêm uống nhiều rượu bia"
narrative_vi: "Anh P., 33 tuổi, ở Thành phố Hồ Chí Minh. Tối qua anh uống rất nhiều bia rượu trong tiệc tất niên, ngủ ít. Sáng dậy, khoảng 3 giờ nay, anh đau đầu giật giật cả hai bên, đi lại thì đau hơn, buồn nôn, khát nước, mệt, khó chịu với ánh sáng và tiếng ồn. Những lần say rượu trước anh cũng bị như vậy. Anh không bị ngã, không va đập đầu, không sốt, không nôn."
