narrative_vi: "Bà L., 67 tuổi, ở Huế, bị viễn thị. Tối nay sau khi xem ti vi trong phòng tối, bà đột ngột đau nhức dữ dội quanh mắt trái lan lên trán. Mắt trái đỏ, nhìn kém hẳn đi, thấy quầng sáng nhiều màu quanh bóng đèn, chói mắt. Bà buồn nôn, nôn 2 lần. Bà không sốt, không yếu tay chân, không méo miệng."
