author: "agent:vignette-holdout"
notes_vi: "Ca cấp cứu ở trẻ em. Chị gái (ăn cùng) cũng nôn nên câu 'người ăn cùng cũng bị' trả lời 'có', dễ dẫn sang ngộ độc thức ăn như Trung tâm Chống độc Bạch Mai cảnh báo. Trẻ đang lơ mơ nên không kể được dấu hiệu trước khi ngất. Bé vẫn mở mắt khi gọi nên câu bất tỉnh trả lời 'không'."
