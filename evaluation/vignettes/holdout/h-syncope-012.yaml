id: h-syncope-012
set: holdout
title_vi: "Bé trai 9 tuổi, cả nhà đốt than sưởi trong phòng kín ở Sa Pa, sáng đứng dậy thì ngã gục, giờ lơ mơ, nôn; bố mẹ, chị cũng đau đầu"
narrative_vi: "Bé T., trai, 9 tuổi, ở Sa Pa (Lào Cai). Đêm qua trời rét đậm, cả nhà 4 người ngủ chung một phòng đóng kín cửa, đốt một chậu than củi để sưởi. Sáng nay khoảng 6 giờ mẹ gọi bé dậy; bé vừa đứng lên thì ngã gục, lịm đi một lúc. Hiện bé đã mở mắt nhưng lơ mơ, gọi mới đáp, trả lời chậm, lẫn lộn, kêu đau đầu, buồn nôn, đã nôn 2 lần. Bố mẹ và chị gái 13 tuổi cũng đau đầu, chóng mặt, buồn nôn; chị gái nôn 1 lần. Cả nhà đã ra ngoài sân. Bé không sốt, không co giật, không khó thở, không đau bụng, không tiêu chảy, cổ không cứng."
