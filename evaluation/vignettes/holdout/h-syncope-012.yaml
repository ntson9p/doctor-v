source:
  basis: "Ngộ độc khí CO cả gia đình do đốt than củi sưởi trong phòng kín mùa đông vùng núi phía Bắc: trẻ ngất khi đứng dậy, sau đó lơ mơ, lẫn lộn, đau đầu, nôn; cả nhà cùng đau đầu, chóng mặt, buồn nôn. NHS Carbon monoxide poisoning: đã phơi nhiễm mà lú lẫn đột ngột hoặc mất ý thức thì gọi 999 hoặc đến cấp cứu. Trung tâm Chống độc Bệnh viện Bạch Mai (VTC News, Nhân Dân 01/2026): triệu chứng đau đầu, nôn, lơ mơ đến hôn mê; nôn, đau bụng dễ nhầm với ngộ độc thực phẩm; mở cửa, đưa ra chỗ thoáng và gọi cấp cứu. Mức 1."
  references:
    - nhs-carbon-monoxide-poisoning
    - "https://vtcnews.vn/dong-kin-cua-suoi-than-chong-tu-vong-vo-nguy-kich-vi-ngo-doc-khi-co-ar1000521.html"
