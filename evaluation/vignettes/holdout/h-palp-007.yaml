source:
  basis: "Thuyên tắc phổi ở phụ nữ mang thai, biểu hiện chủ yếu là hồi hộp: tim nhanh cả khi nghỉ (mạch 118), khó thở tăng, đau ngực khi hít sâu, sưng đau một bên bắp chân, sau chuyến xe 12 giờ; triệu chứng dễ bị coi là do mang thai. NHS DVT: đang mang thai, đi xe trên 4 giờ là yếu tố nguy cơ; triệu chứng huyết khối tĩnh mạch sâu kèm khó thở hoặc đau ngực thì gọi 999 hoặc đến cấp cứu. NHS Pulmonary embolism: khó thở, đau ngực tăng khi hít vào, tim đập rất nhanh thì gọi 999 hoặc đến cấp cứu. Huyết áp bình thường, không ngất, nói được trọn câu nên mức 2."
  references:
    - "https://www.nhs.uk/conditions/deep-vein-thrombosis-dvt/"
    - "https://www.nhs.uk/conditions/pulmonary-embolism/"
author: "agent:vignette-holdout"
notes_vi: "Ca khó ở phụ nữ mang thai: khó thở, phù chân hay gặp khi mang thai nên dễ bị bỏ qua."
