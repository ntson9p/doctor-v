id: h-palp-007
set: holdout
title_vi: "Nữ 33 tuổi mang thai 32 tuần, 2 ngày tim đập nhanh cả khi nghỉ, hụt hơi, đau ngực khi hít sâu, bắp chân trái sưng đau sau chuyến xe 12 giờ"
narrative_vi: "Chị Tr., 33 tuổi, mang thai con đầu được 32 tuần, ở Đà Nẵng. Một tuần trước chị đi xe khách 12 tiếng về quê. Bắp chân trái sưng, căng đau hơn chân phải từ 4–5 ngày nay, chị tưởng do phù khi mang thai. Hai ngày nay chị thấy tim đập nhanh liên tục, kể cả khi nằm nghỉ, thở hụt hơi hơn mấy tuần trước, đi vài bước đã mệt. Sáng nay chị đau nhói ngực bên trái khi hít sâu. Máy đo ở nhà báo mạch 118 lần/phút, huyết áp 110/70 mmHg. Chị vẫn nói được trọn câu, môi không tím. Chị không ho, không ho ra máu, không sốt, không ngất, không choáng. Chị không đau bụng, không ra máu âm đạo, không đau đầu, mặt và tay không phù, thai vẫn máy bình thường. Chị chưa từng bị cục máu đông, không có bệnh tim, không mắc ung thư."
