title_vi: "Nữ 55 tuổi có sỏi mật, không uống rượu, đau dữ dội thượng vị lan ra lưng sau bữa nhiều mỡ"
narrative_vi: "Bà K., 55 tuổi, ở Bình Định, không uống rượu, đã biết có sỏi mật. Khoảng 10 giờ trước, sau bữa tối nhiều dầu mỡ, bà đột ngột đau dữ dội vùng trên rốn, đau lan ra sau lưng. Bà buồn nôn, nôn nhiều lần, sốt nhẹ 37,8°C. Bà không vàng da, bụng không chướng."
