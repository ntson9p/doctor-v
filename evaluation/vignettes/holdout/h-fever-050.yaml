source:
  basis: "Viêm đường mật cấp do sỏi ở người cao tuổi có sỏi mật: sốt cao rét run, vàng da và đau dưới sườn phải (tam chứng Charcot), nước tiểu sẫm; đây là cấp cứu, cần hồi sức và dẫn lưu đường mật khẩn (MSD). Chưa có lú lẫn, khó thở, tay chân lạnh hay tiêu chí nguy cơ cao khác của NICE NG253 nên đến cấp cứu ngay (mức 2), chưa đến mức gọi 115."
  references:
    - msd-choledocholithiasis-cholangitis
    - nice-ng253
    - nhs-acute-cholecystitis
author: "agent:vignette-holdout"
notes_vi: "Ngoài danh mục bệnh. Viêm túi mật cấp được chấp nhận vì cùng do sỏi mật, cùng phải nhập viện ngay. Người cao tuổi có thể nhanh chóng chuyển sang sốc nhiễm khuẩn; có lú lẫn hoặc tụt huyết áp thì chuyển mức 1. Danh mục chưa có câu hỏi về nước tiểu sẫm màu, phân bạc màu."
