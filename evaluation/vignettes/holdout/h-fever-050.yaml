id: h-fever-050
set: holdout
title_vi: "Nữ 74 tuổi có sỏi mật, sốt cao rét run, vàng mắt, nước tiểu sẫm, đau tức dưới sườn phải"
narrative_vi: "Bà T., 74 tuổi, ở Hưng Yên, bị tăng huyết áp, uống thuốc đều. Ba năm trước đi siêu âm, bác sĩ nói bà có sỏi mật nhưng bà chưa điều trị. Hai ngày nay bà đau tức âm ỉ dưới sườn phải, chán ăn, buồn nôn, mệt. Từ chiều qua bà lên cơn rét run cầm cập rồi sốt cao, con gái đo được 39,4°C. Sáng nay con gái thấy lòng trắng mắt bà vàng, nước tiểu sẫm như nước chè đặc. Bà nôn 1 lần ra thức ăn. Bà vẫn tỉnh táo, nói chuyện bình thường, tự đi lại trong nhà được, thở bình thường, tay chân ấm. Bà không ho, không đau buốt khi đi tiểu, không đi ngoài phân đen. Bà không bị tiểu đường, không uống rượu."
