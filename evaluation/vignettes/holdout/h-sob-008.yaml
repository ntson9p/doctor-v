source:
  basis: "Suy tim mạn mất bù nhẹ sau ăn mặn và tự ngưng thuốc lợi tiểu: khó thở tăng khi gắng sức, khó thở khi nằm, ho đêm, phù hai chân, tăng 2,5 kg trong 4 ngày, ngồi nghỉ thở được, SpO2 95% (1857/QĐ-BYT: khó thở khi nằm, phù mắt cá, tăng cân trên 2 kg/tuần là triệu chứng sung huyết). NHS Heart failure: khó thở khi nằm hoặc khi làm việc thường ngày, tăng cân đột ngột thì hẹn khám khẩn hoặc gọi 111; gọi 999 khi khó thở dữ dội, tím, ngất. Nên mức 3."
