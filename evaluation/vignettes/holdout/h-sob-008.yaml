title_vi: "Nữ 74 tuổi suy tim, tự ngưng thuốc lợi tiểu 4 ngày, ăn mặn; khó thở khi đi lại, 2 đêm phải ngồi ngủ, phù chân, tăng 2,5 kg"
narrative_vi: "Bà T., 74 tuổi, ở TP.HCM, bị tăng huyết áp và được bác sĩ nói bị suy tim từ 2 năm nay, uống thuốc đều. Tuần trước bà về quê dự đám cưới, ăn nhiều đồ mặn, và tự ngưng thuốc lợi tiểu 4 ngày vì ngại đi tiểu nhiều trên xe; các thuốc huyết áp khác vẫn uống. Bốn ngày nay bà khó thở tăng dần: đi từ phòng ra bếp đã thở dốc; ngồi yên thì đỡ. Hai đêm nay nằm xuống là khó thở, ho khan, phải kê cao gối, ngồi dựa tường mới ngủ được. Hai bàn chân, cổ chân phù, ấn lõm. Bà cân thấy tăng 2,5 kg trong 4 ngày. Con gái đo SpO2 được 95%. Bà không đau ngực, không sốt, không khò khè, không hồi hộp, không ngất, vẫn tỉnh táo."
