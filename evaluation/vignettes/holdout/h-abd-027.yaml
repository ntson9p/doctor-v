title_vi: "Nữ 36 tuổi mang thai 37 tuần, đau thượng vị lan hạ sườn phải, nôn, phù mặt và tay"
narrative_vi: "Chị P., 36 tuổi, ở Cần Thơ, mang thai lần đầu được 37 tuần. Từ khoảng 6 giờ trước chị đau tức vùng trên rốn lan sang dưới sườn phải, kèm nóng rát sau xương ức, buồn nôn và nôn 2 lần. Chị nghĩ là đau dạ dày. Chị đau đầu nhẹ, mặt và hai bàn tay sưng phù mấy ngày nay. Ở nhà không có máy đo huyết áp. Không sốt, không ra máu âm đạo, không nhìn mờ."
