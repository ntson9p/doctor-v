id: h-dizzy-002
set: holdout
title_vi: "Nam 76 tuổi tăng huyết áp, 5 ngày nay chao đảo vài giây mỗi khi nằm xuống, trở mình, ngửa cổ"
narrative_vi: "Ông K., 76 tuổi, ở Huế, bị tăng huyết áp nhiều năm, uống thuốc huyết áp đều, đo ở nhà vẫn khoảng 130/80 mmHg. Năm ngày nay, mỗi lần nằm xuống giường, trở mình sang trái hoặc ngửa cổ lấy đồ trên cao, ông thấy chao đảo, chòng chành như say sóng trong vài giây rồi hết; ông không tả là mọi vật quay tròn. Trong cơn ông mất thăng bằng, phải vịn tường cho đến khi hết, có lần suýt ngã. Ngồi hoặc đứng yên thì không sao; đứng dậy khỏi ghế không bị choáng hay tối sầm mắt. Ông hơi buồn nôn, không nôn. Ông không đau đầu, không ù tai, nghe vẫn như cũ, không nhìn mờ, không nhìn đôi, không nói khó, không tê yếu tay chân, chưa từng ngất. Giữa các cơn ông vẫn tự đi lại, tự đi chợ được. Trước đây ông chưa bị như vậy."
