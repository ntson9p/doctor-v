source:
  basis: "Chóng mặt tư thế kịch phát lành tính ở người cao tuổi, mô tả không điển hình: cơn chao đảo vài giây (không tả là quay tròn) mỗi khi đổi tư thế đầu, giữa các cơn đi lại bình thường, không có dấu hiệu thần kinh, đứng dậy không choáng, huyết áp ở nhà bình thường. GRACE-3: cơn chóng mặt có yếu tố khởi phát là cử động đầu thì làm nghiệm pháp Dix–Hallpike, điều trị bằng nghiệm pháp Epley, không chụp chiếu thường quy. AAFP 2017 (Muncie và cộng sự): bệnh hay gặp nhất ở tuổi 50–70, khởi phát khi cử động đầu, đổi tư thế; người bệnh thường khó mô tả cảm giác chóng mặt. NHS Vertigo: chóng mặt hay tái lại thì đi khám bác sĩ (không khẩn); không có dấu hiệu cần khám khẩn hay gọi cấp cứu."
  references:
    - grace3-dizziness-2023
    - nhs-vertigo
    - "https://www.aafp.org/pubs/afp/issues/2017/0201/p154.html"
author: "agent:vignette-holdout"
notes_vi: "Ca khó ở người cao tuổi. Người bệnh trả lời 'có' câu đột ngột mất thăng bằng vì phải vịn tường trong cơn; câu 'không tự đi được' trả lời 'không' vì hướng dẫn của câu này không tính cơn ngắn dưới 1 phút. Đang uống thuốc hạ áp nhưng không choáng khi đứng dậy: không phải hạ huyết áp tư thế."
