notes_vi: "Ca khó: trẻ rất nhỏ, ít khò khè, không sốt. Ở màn sàng lọc đầu, mẹ trả lời 'không' câu khó thở dữ dội, môi tím vì lúc đó bé đang thở, môi hồng. Ho gà là chẩn đoán phân biệt nhưng chưa có ho cơn."
