id: h-sob-005
set: holdout
title_vi: "Bé gái 5 tuần tuổi nghẹt mũi, ho nhẹ 2 ngày, hôm nay 2 lần ngừng thở 10–15 giây, môi tái, bú kém"
narrative_vi: "Bé L., gái, 5 tuần tuổi, ở Hà Nội, sinh đủ tháng. Anh trai 3 tuổi đi nhà trẻ về bị sổ mũi, ho. Hai ngày nay bé nghẹt mũi, chảy nước mũi, ho nhẹ, thở hơi nhanh hơn bình thường. Hôm nay mẹ thấy 2 lần bé đang nằm thì ngừng thở khoảng 10–15 giây, môi tái đi, mẹ lay thì bé thở lại. Bé bú kém hẳn, mỗi cữ chỉ bú được vài phút rồi bỏ. Bây giờ bé đang thở, môi hồng. Mẹ đo nhiệt độ ở nách 37,1°C. Bé không co giật, vẫn cử động chân tay khi tỉnh, không thở rên, mẹ chưa nghe tiếng khò khè."
