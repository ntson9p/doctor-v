source:
  basis: "Viêm tiểu phế quản ở trẻ dưới 6 tuần biểu hiện bằng cơn ngừng thở: nghẹt mũi, ho nhẹ 2 ngày, anh trai bị cảm, nay có 2 lần ngừng thở 10–15 giây kèm môi tái, bú kém. NICE NG9 mục 1.1.5: trẻ nhỏ (nhất là dưới 6 tuần) có thể chỉ biểu hiện bằng ngừng thở; mục 1.2.1: ngừng thở (người nhà kể) là chỉ định chuyển cấp cứu ngay, thường bằng xe cấp cứu. NHS Bronchiolitis: có lúc ngừng thở thì gọi 999. Mức 1."
