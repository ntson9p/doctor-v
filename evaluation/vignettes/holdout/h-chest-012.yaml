id: h-chest-012
set: holdout
title_vi: "Nữ 24 tuổi đang ôn thi, đột ngột tức ngực, tim đập nhanh, hụt hơi, tê quanh miệng, sợ chết, 10 phút thì hết; lần thứ 4 trong 2 tháng"
narrative_vi: "Em Q., nữ, 24 tuổi, học thạc sĩ ở Hà Nội, khỏe mạnh, không hút thuốc, không uống thuốc tránh thai. Mấy tuần nay em căng thẳng vì sắp bảo vệ luận văn, ngủ ít. Tối nay đang ngồi đọc tài liệu, em đột ngột thấy tức ở giữa ngực, tim đập thình thịch rất nhanh, hụt hơi như không hít đủ, tê bì quanh miệng và đầu ngón tay, run tay, lâng lâng, sợ hãi như sắp chết. Khoảng 10 phút sau mọi thứ hết dần, giờ em thấy bình thường. Đây là lần thứ 4 trong 2 tháng; lần trước em vào cấp cứu, được đo điện tim, xét nghiệm máu bình thường, bác sĩ nói là cơn hoảng sợ. Em không ngất, không vã mồ hôi lạnh, không sốt, không ho, chân không sưng, gần đây không đi xa. Tối nay em không uống cà phê hay nước tăng lực."
