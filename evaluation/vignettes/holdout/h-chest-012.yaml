source:
  basis: "Cơn hoảng sợ tái diễn ở phụ nữ trẻ: đột ngột tức ngực, tim nhanh, hụt hơi, tê quanh miệng, run, sợ chết, hết sau khoảng 10 phút; đã có 4 cơn giống hệt trong 2 tháng, lần trước đã được làm điện tim, xét nghiệm bình thường; không yếu tố nguy cơ tim mạch hay huyết khối. NHS Panic disorder: phần lớn cơn kéo dài 5–20 phút, đáng sợ nhưng không nguy hiểm; khám bác sĩ gia đình để loại trừ bệnh khác và điều trị. Cơn đã hết, giống các cơn đã được khám nên mức 4."
