    - nhs-chest-pain
author: "agent:vignette-holdout"
notes_vi: "Nếu là cơn đầu tiên, hoặc cơn khác hẳn các lần trước, hoặc đau ngực kéo dài, thì cần khám sớm hơn để loại trừ nguyên nhân tim."
