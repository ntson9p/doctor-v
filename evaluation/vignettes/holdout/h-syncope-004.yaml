source:
  basis: "Ngất tình huống khi đi tiểu kết hợp hạ huyết áp tư thế do thuốc hạ áp, lợi tiểu ở người cao tuổi: ngất khi vừa ngồi dậy, đứng đi tiểu lúc nửa đêm, có tiền triệu choáng, tối sầm mắt, vã mồ hôi, tỉnh nhanh, không bị thương; mấy tuần nay hay choáng khi đứng dậy. ESC 2018: ngất khi đi tiểu, khi vừa đứng dậy là đặc điểm nguy cơ thấp; ca này không có đặc điểm nguy cơ cao (không đau ngực, khó thở, hồi hộp trước ngất, không ngất khi gắng sức hay khi nằm, không bệnh tim, không phân đen). NHS Fainting: đi khám bác sĩ (không khẩn) để tìm nguyên nhân. NHS Low blood pressure: một số thuốc gây hạ huyết áp; hay choáng, ngất thì đi khám bác sĩ. Mức 4 để bác sĩ xem lại thuốc."
  references:
    - esc-syncope-2018
    - nhs-fainting
    - "https://www.nhs.uk/conditions/low-blood-pressure-hypotension/"
author: "agent:vignette-holdout"
notes_vi: "Ca khó ở người cao tuổi: tuổi cao, đang uống thuốc tim mạch nhưng không có đặc điểm nguy cơ cao theo ESC 2018."
