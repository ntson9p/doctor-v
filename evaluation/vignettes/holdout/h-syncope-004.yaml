id: h-syncope-004
set: holdout
title_vi: "Nam 78 tuổi uống thuốc huyết áp có lợi tiểu, nửa đêm đứng đi tiểu thì choáng, vã mồ hôi, lả đi nửa phút; mấy tuần hay choáng khi đứng dậy"
narrative_vi: "Ông B., 78 tuổi, ở Hà Nam, bị tăng huyết áp, đang uống hai loại thuốc huyết áp, trong đó có thuốc lợi tiểu. Đêm qua khoảng 2 giờ sáng ông ngồi dậy đi tiểu; đứng tiểu được một lúc thì thấy choáng váng, tối sầm mắt, vã mồ hôi rồi lả đi. Bà vợ đỡ kịp nên ông không ngã, không đập đầu; ông mê đi khoảng nửa phút rồi tỉnh, nói chuyện bình thường ngay, không co giật, không tè ra quần. Sáng nay ông tỉnh táo, ăn sáng bình thường. Mấy tuần nay ông thỉnh thoảng choáng vài giây khi đứng dậy nhanh, không quay cuồng. Ông không đau ngực, không thấy tim đập nhanh hay đập loạn trước khi ngất, không khó thở, không yếu tay chân, không nói khó, không đau đầu; đi ngoài phân vàng bình thường, tiểu không buốt. Sáng nay con đo huyết áp lúc ngồi được 125/70 mmHg. Trước đây ông chưa từng ngất; trong nhà không ai đột tử."
