title_vi: "Nam 76 tuổi, sốt 3 ngày, ho, rất mệt, chán ăn, cháu mắc COVID-19"
narrative_vi: "Ông K., 76 tuổi, ở Hà Nội, bị tăng huyết áp. Tuần trước cháu nội của ông xét nghiệm dương tính COVID-19. Ba ngày nay ông sốt 38,2°C, ho khan, đau họng, rất mệt và chán ăn. Ông không mất mùi vị, không khó thở, không đau ngực, vẫn tỉnh táo và tự đi lại được."
