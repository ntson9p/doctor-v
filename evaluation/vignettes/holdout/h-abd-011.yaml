narrative_vi: "Anh V., 45 tuổi, ở Quảng Ninh, uống rượu nhiều đã nhiều năm, mấy ngày Tết uống liên tục. Khoảng 5 giờ trước anh đột ngột đau dữ dội vùng trên rốn, đau xuyên ra sau lưng, phải ngồi cúi gập người mới đỡ. Anh nôn nhiều lần, uống gì cũng nôn. Anh không sốt, không đi ngoài phân đen, không đau ngực."
