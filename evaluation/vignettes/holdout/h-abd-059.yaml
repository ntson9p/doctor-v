source:
  basis: "Đái tháo đường típ 1 mới khởi phát, biểu hiện bằng nhiễm toan ceton ở bé trai 8 tuổi: 3 tuần khát, tiểu nhiều, đái dầm lại, sụt cân; nay đau bụng, nôn, thở nhanh sâu, hơi thở mùi trái cây, mắt trũng, còn tỉnh. Bộ Y tế 3312/QĐ-BYT 2015 (Toan xeton do đái tháo đường): bệnh sử sụt cân, đau bụng, nôn, đái nhiều, uống nhiều; thở nhanh sâu kiểu Kussmaul; đau bụng giống bệnh cấp tính vùng bụng. NHS Type 1 diabetes: tiểu nhiều, rất khát, mệt kèm đau bụng, nôn hoặc thở nhanh sâu thì gọi 999 hoặc đến cấp cứu; trẻ hay bị bỏ sót vì đau bụng. Trẻ còn tỉnh nên mức 2."
  references:
    - byt-qd-3312-2015
    - nhs-type-1-diabetes
author: "agent:vignette-holdout"
notes_vi: "Trẻ dưới 13 tuổi không được hỏi câu đái tháo đường và đo đường huyết; nhà không có máy đo. Câu khát nhiều, tiểu nhiều và hơi thở mùi trái cây là manh mối chính."
