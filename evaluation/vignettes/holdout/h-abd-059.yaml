id: h-abd-059
set: holdout
title_vi: "Bé trai 8 tuổi 3 tuần khát nhiều, tiểu nhiều, đái dầm lại, sụt cân; nay đau quanh rốn, nôn, thở nhanh sâu, hơi thở mùi trái cây, chưa từng được nói bị tiểu đường"
narrative_vi: "Bé K., nam, 8 tuổi, ở Long An, trước giờ khỏe mạnh, chưa từng được nói là bị tiểu đường. Khoảng 3 tuần nay bé hay khát, uống nước rất nhiều, đi tiểu nhiều, đêm phải dậy đi tiểu 3–4 lần, có đêm đái dầm dù đã thôi đái dầm từ lâu. Bé gầy đi thấy rõ dù vẫn ăn. Từ chiều qua bé kêu đau bụng quanh rốn, buồn nôn, nôn 3 lần, bỏ ăn. Sáng nay bé mệt, nằm nhiều, thở nhanh và sâu, hơi thở có mùi lạ như trái cây chín, mắt trũng. Gọi thì bé vẫn tỉnh, trả lời đúng, vẫn uống được nước. Bé không sốt, không tiêu chảy, không ho, không tiểu buốt. Nhà không có máy đo đường huyết."
