source:
  basis: "Xoắn buồng trứng ở bé gái 11 tuổi chưa có kinh: đau bụng dưới trái đột ngột lúc nửa đêm, từng cơn (xoắn rồi tự tháo xoắn một phần), nôn nhiều lần, không sốt, không tiêu chảy; tháng trước từng có một cơn ngắn tự hết. Winton và Yamoah (BMJ Case Rep 2020): ở trẻ gái chưa có kinh, đau bụng gặp 92%, buồn nôn và nôn 85%; xoắn có thể xảy ra ở buồng trứng bình thường; không triệu chứng nào đủ để loại trừ; là cấp cứu, ưu tiên mổ tháo xoắn bảo tồn. NHS Stomach ache: đau bụng đột ngột, dữ dội thì đến cấp cứu ngay."
  references:
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC7228144/"
    - nhs-stomach-ache
author: "agent:vignette-holdout"
notes_vi: "Ca khó: trẻ chưa có kinh, đau từng cơn, mẹ nghĩ rối loạn tiêu hóa. Trẻ dưới 13 tuổi không được hỏi các câu về kinh nguyệt, u nang buồng trứng."
