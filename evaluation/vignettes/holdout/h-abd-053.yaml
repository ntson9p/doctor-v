id: h-abd-053
set: holdout
title_vi: "Bé gái 11 tuổi chưa có kinh, nửa đêm đột ngột đau quặn từng cơn bụng dưới trái, nôn 4 lần, không sốt; tháng trước từng có một cơn ngắn tương tự"
narrative_vi: "Bé H., gái, 11 tuổi, ở Vinh (Nghệ An), chưa có kinh nguyệt. Khoảng 2 giờ sáng nay bé đột ngột thức dậy vì đau bụng dưới bên trái. Đau từng cơn: có cơn đau quặn dữ dội làm bé khóc, rồi đỡ dần, khoảng một giờ sau lại đau lại. Đến giờ đã khoảng 10 giờ. Bé nôn 4 lần ra thức ăn và nước, vẫn uống được từng ngụm nước. Mẹ nghĩ bé bị rối loạn tiêu hóa nên cho uống men tiêu hóa nhưng không đỡ. Bé không sốt, không tiêu chảy, không tiểu buốt, hôm qua đi ngoài bình thường. Một tháng trước bé từng đau bụng dưới bên trái một lần chừng nửa giờ rồi tự hết. Ngoài cơn đau bé vẫn tỉnh táo, nói chuyện bình thường, nhưng bỏ ăn."
