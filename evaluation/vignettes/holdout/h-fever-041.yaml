source:
  basis: "Viêm phổi cộng đồng nặng ở người cao tuổi hút thuốc: sốt, rét run, ho đờm mủ, đau ngực khi ho, khó thở nặng, tím môi, lú lẫn mới (4235/QĐ-BYT). Lú lẫn mới và tím môi là tiêu chí nguy cơ cao của nhiễm khuẩn huyết theo NICE NG253, cần gọi cấp cứu ngay."
