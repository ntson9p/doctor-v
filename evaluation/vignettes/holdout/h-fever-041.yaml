id: h-fever-041
set: holdout
title_vi: "Nam 78 tuổi hút thuốc lào, sốt, ho đờm đặc 4 ngày, thở rất mệt, môi tím, lú lẫn"
narrative_vi: "Ông T., 78 tuổi, ở Bắc Giang, hút thuốc lào hơn 50 năm, bị tăng huyết áp, mùa lạnh nào cũng hay ho khạc đờm. Bốn ngày nay ông sốt 38,6°C, rét run, ho nhiều hơn hẳn, khạc đờm đặc màu vàng xanh, kêu đau ngực bên phải mỗi khi ho. Từ đêm qua ông thở rất mệt, phải ngồi dậy mới thở được, nói vài tiếng lại phải dừng lấy hơi, môi và đầu ngón tay tím. Sáng nay ông lơ mơ, gọi mới mở mắt, nói lẫn lộn, không nhận ra con dâu. Ông bỏ ăn, mệt lả, không tự đứng dậy được. Ông không nôn, không đi ngoài lỏng."
