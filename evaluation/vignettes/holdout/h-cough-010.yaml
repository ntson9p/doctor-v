id: h-cough-010
set: holdout
title_vi: "Nữ 52 tuổi không hút thuốc, ho khan 10 tuần, ho nhiều sau ăn no và khi nằm, hay ợ chua, sáng khàn tiếng"
narrative_vi: "Chị P., 52 tuổi, kế toán ở Hà Nội, không hút thuốc, không có bệnh mạn tính, không uống thuốc gì thường xuyên. Khoảng 10 tuần nay chị ho khan, hay phải đằng hắng, ho nhiều sau bữa ăn no và khi vừa nằm xuống ngủ. Chị hay ợ chua, có lúc thấy chua trong miệng, nhất là sau khi ăn tối muộn. Buổi sáng ngủ dậy giọng chị hơi khàn. Chị không sốt, không khạc đờm, không khò khè, không khó thở, không đau ngực, không ho ra máu, không sụt cân, không ra mồ hôi đêm, không sổ mũi, nghẹt mũi. Trong nhà không ai ho kéo dài hay bị lao. Chị đã uống siro ho 2 lần không đỡ."
