source:
  basis: "Ho mạn tính do trào ngược dạ dày – thực quản: ho khan 10 tuần, nặng sau ăn no và khi nằm, ợ chua, khàn tiếng buổi sáng, không hút thuốc, không dùng thuốc nhóm ức chế men chuyển, không triệu chứng mũi, không khò khè. Trào ngược là một trong các nguyên nhân hay gặp của ho trên 8 tuần ở người không hút thuốc. NHS Cough: ho trên 3 tuần thì khám bác sĩ (không khẩn). Không có dấu hiệu nặng (ho ra máu, sụt cân, khó thở) nên đặt lịch khám trong vài ngày."
