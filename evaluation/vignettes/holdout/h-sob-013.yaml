id: h-sob-013
set: holdout
title_vi: "Nữ 16 tuổi kinh nguyệt nhiều, 3 tháng nay leo cầu thang là hụt hơi, tim đập nhanh, mệt, da xanh, choáng khi đứng dậy"
narrative_vi: "Em H., nữ, 16 tuổi, học sinh ở An Giang. Từ khi có kinh, mỗi kỳ em ra nhiều, kéo dài 7–8 ngày, phải thay băng liên tục. Khoảng 3 tháng nay em hay mệt, học kém tập trung; leo 3 tầng lầu lên lớp là hụt hơi, tim đập nhanh, phải dừng nghỉ; ngồi yên thì thở bình thường. Đứng dậy nhanh hay bị choáng, tối sầm mắt vài giây nhưng chưa ngất. Mẹ thấy em da xanh, môi và mí mắt nhợt. Em ăn ít thịt, hay nhịn ăn sáng. Em không sốt, không ho, không đau ngực, không phù chân, không sụt cân, không đi ngoài phân đen. Em chưa có quan hệ tình dục. Em chưa từng được nói là bị thiếu máu."
