source:
  basis: "Thiếu máu thiếu sắt do kinh nguyệt nhiều ở nữ vị thành niên: 3 tháng hụt hơi khi gắng sức, tim nhanh, mệt, da và niêm mạc nhợt, choáng khi đứng dậy; ngồi nghỉ thở bình thường, không đau ngực, không ngất. NHS Iron deficiency anaemia: mệt, khó thở, hồi hộp, da nhợt; kinh nguyệt nhiều là nguyên nhân rất hay gặp; khám bác sĩ gia đình (không khẩn). NHS Shortness of breath: khó thở tăng khi làm việc thường ngày thì khám bác sĩ (không khẩn). Nên mức 4."
