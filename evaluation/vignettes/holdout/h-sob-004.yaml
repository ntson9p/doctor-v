id: h-sob-004
set: holdout
title_vi: "Bé trai 8 tháng, ngày thứ 4 sổ mũi ho, nay thở khò khè, hơi nhanh khi bú, chỉ bú được nửa cữ, sốt 38,3°C"
narrative_vi: "Bé P., nam, 8 tháng, ở TP.HCM, sinh đủ tháng, khỏe mạnh, đã tiêm đủ các mũi 5 trong 1 theo lịch. Chị gái 4 tuổi của bé đang sổ mũi. Bốn ngày nay bé sổ mũi, nghẹt mũi, ho. Từ hôm qua bé thở khò khè, mỗi lần bú thì thở nhanh, phải nhả ti nghỉ, nên 24 giờ qua chỉ bú được khoảng nửa lượng mọi ngày; lúc nằm ngủ bé thở gần như bình thường. Bé sốt 2 ngày, cao nhất 38,3°C. Mẹ nhìn kỹ khi bé nằm yên: ngực dưới không lõm vào, không thở rên, không lúc nào ngừng thở, môi hồng. Bé vẫn tỉnh, chơi một lúc, không nôn, hôm nay vẫn đi tiểu ướt 4 tã."
