source:
  basis: "Viêm tiểu phế quản điển hình ở trẻ 8 tháng mùa mưa: sau 3 ngày sổ mũi, ho thì khò khè, thở nhanh khi bú, sốt nhẹ, anh chị bị cảm. NICE NG9 mục 1.2.2: cân nhắc chuyển viện khi lượng bú chỉ 50–75% bình thường; NHS Bronchiolitis: bú ít hơn hẳn bình thường thì hẹn khám khẩn hoặc gọi 111; chỉ gọi 999 khi thở rên, rút lõm, ngừng thở, tím. Chưa có dấu hiệu nặng nên mức 3."
