id: h-abd-045
set: holdout
title_vi: "Nữ 68 tuổi uống thuốc giảm đau xương khớp hằng ngày 2 tháng, đau rát vùng trên rốn tăng sau ăn 3 tuần"
narrative_vi: "Bà S., 68 tuổi, ở Vĩnh Long, bị thoái hóa khớp gối và tăng huyết áp, uống thuốc huyết áp đều. Hai tháng nay gối đau nhiều, bà mua thuốc giảm đau xương khớp ở tiệm thuốc về uống mỗi ngày. Khoảng 3 tuần nay bà hay đau rát, cồn cào vùng trên rốn, đau tăng sau khi ăn no hoặc ăn chua cay, kèm đầy bụng, ợ chua, đôi khi buồn nôn. Đau âm ỉ, không lan ra sau lưng, bà vẫn làm việc nhà được và đau không nặng thêm. Bà không nôn, không nôn ra máu, đi ngoài phân vàng, không đen. Bà vẫn ăn được như thường, không sụt cân, không mệt hơn mọi khi, không sốt. Bà không đau ngực, không khó thở, không vã mồ hôi khi đau."
