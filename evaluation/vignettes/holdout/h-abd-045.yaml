source:
  basis: "Viêm, loét dạ dày do thuốc chống viêm không steroid ở người cao tuổi: đau rát vùng trên rốn tăng sau ăn, ợ chua, buồn nôn 3 tuần khi đang uống thuốc giảm đau xương khớp hằng ngày (MSD: thuốc chống viêm không steroid gây trên một nửa số ổ loét; loét dạ dày có khi đau tăng khi ăn). Không nôn ra máu, không phân đen, không sụt cân, không chán ăn, đau không nặng thêm nên theo NHS Stomach ulcer chỉ cần đặt lịch khám, không cần khám khẩn."
  references:
    - msd-peptic-ulcer
    - nhs-stomach-ulcer
author: "agent:vignette-holdout"
notes_vi: "Người cao tuổi đang dùng thuốc chống viêm nhưng chưa có dấu hiệu báo động; tuổi cao đơn thuần không phải lý do khám khẩn. Danh mục chưa có câu hỏi về no sớm, sụt cân."
