title_vi: "Nữ 32 tuổi, sau cảm 1 tuần, nặng trán và má khi cúi, nghẹt mũi, nước mũi vàng"
narrative_vi: "Chị K., 32 tuổi, ở Thành phố Hồ Chí Minh, không mang thai. Một tuần trước chị bị cảm, sổ mũi. Mấy ngày nay chị đau nặng vùng trán và hai bên má, cúi đầu xuống thì đau tăng. Chị nghẹt mũi, nước mũi đặc màu vàng, ho ít. Chị không sốt, không sợ ánh sáng, không buồn nôn. Đau ở mức nhẹ, vẫn đi làm được."
