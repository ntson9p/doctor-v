id: h-fever-056
set: holdout
title_vi: "Nữ 70 tuổi đái tháo đường kiểm soát kém, sốt cao kèm rét run 5 ngày, chỉ tức nhẹ dưới sườn phải, không vàng da, không có ổ nhiễm trùng rõ"
narrative_vi: "Bà Đ., 70 tuổi, ở Bến Tre, bị đái tháo đường típ 2 và tăng huyết áp nhiều năm, uống thuốc không đều; sáng nay tự đo đường huyết được 15 mmol/L. Năm ngày nay bà sốt cao, mỗi ngày có 1–2 cơn rét run, con đo được 39,6°C. Bà mệt, chán ăn, buồn nôn, đau đầu nhẹ và mỏi người khi sốt. Hỏi kỹ thì bà chỉ thấy hơi tức nhẹ vùng dưới sườn phải, không đau nhiều. Bà không ho, không khó thở, không tiểu buốt, không đau hông lưng, không tiêu chảy, da và mắt không vàng, không nổi ban. Bà vẫn tỉnh táo, tự đi lại được. Hàng xóm không ai bị sốt xuất huyết."
