source:
  basis: "Áp xe gan do vi khuẩn ở nữ 70 tuổi đái tháo đường kiểm soát kém: sốt cao, rét run 5 ngày, chỉ tức nhẹ hạ sườn phải, không vàng da, không có ổ nhiễm khuẩn rõ khác (ở châu Á căn nguyên hay gặp là Klebsiella pneumoniae). Kong và cộng sự (Medicine 2017): K. pneumoniae là căn nguyên hay gặp nhất của áp xe gan do vi khuẩn, gắn với đái tháo đường (43% so với 21% ở căn nguyên khác); phần lớn người bệnh sốt. Chưa có tiêu chí nguy cơ cao của nhiễm khuẩn huyết (NICE NG253) nên đi khám trong 24 giờ."
  references:
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC5604666/"
    - nice-ng253
author: "agent:vignette-holdout"
notes_vi: "Ca khó: biểu hiện chủ yếu là sốt kéo dài, đau bụng mơ hồ; dễ nghĩ nhiễm khuẩn tiết niệu hoặc sốt do vi rút."
