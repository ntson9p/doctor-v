id: h-chest-003
set: holdout
title_vi: "Nữ 73 tuổi tăng huyết áp, cúi nhặt đồ thì đột ngột đau dữ dội sau lưng giữa hai bả vai lan ra ngực, choáng như sắp ngất, vã mồ hôi"
narrative_vi: "Bà K., 73 tuổi, ở Quy Nhơn (Bình Định), bị tăng huyết áp, uống thuốc hằng ngày. Khoảng 1 giờ trước, khi cúi nhặt rổ rau, bà đột ngột đau dữ dội ngay từ đầu ở sau lưng, giữa hai bả vai, như bị dao đâm, rồi đau lan ra trước ngực. Ngay sau đó bà choáng, tối sầm mắt như sắp ngất, phải ngồi bệt xuống, vã mồ hôi, buồn nôn. Bà nghĩ bị trúng gió, con gái đang cạo gió cho bà. Đến giờ vẫn đau. Con gái đo huyết áp được 168/100 mmHg. Bà không nói cảm giác xé rách, không ho, không sốt. Ấn vào lưng, ngực không đau thêm. Bà không yếu tay chân, không méo miệng."
