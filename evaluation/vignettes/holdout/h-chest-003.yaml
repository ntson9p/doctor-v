source:
  basis: "Bóc tách động mạch chủ không điển hình ở phụ nữ cao tuổi tăng huyết áp: đau dữ dội đột ngột ở lưng trên giữa hai bả vai lan ra ngực (không tả là xé), kèm choáng như sắp ngất, vã mồ hôi; người nhà nghĩ trúng gió. HSE Aortic dissection: đau ngực hoặc lưng trên đột ngột, dữ dội; mất ý thức, da vã mồ hôi; dễ nhầm với bệnh khác; gọi cấp cứu ngay. NHS Chest pain: đau ngực lan ra lưng kèm vã mồ hôi, choáng thì gọi 999. Mức 1."
  references:
