    - nhs-chest-pain
author: "agent:vignette-holdout"
notes_vi: "Ca không điển hình: phụ nữ, đau nhiều nhất ở lưng, không tả đau như xé. Danh mục chưa có câu hỏi so sánh mạch hoặc huyết áp hai tay."
