id: h-sob-002
set: holdout
title_vi: "Nam 69 tuổi bị bệnh phổi tắc nghẽn mạn tính, 4 ngày khó thở tăng khi đi lại, đờm nhiều hơn, chuyển vàng xanh, SpO2 94%"
narrative_vi: "Ông B., 69 tuổi, ở Phú Thọ, hút thuốc lào hơn 40 năm, bỏ được 3 năm. Năm năm trước ông được chẩn đoán bệnh phổi tắc nghẽn mạn tính, dùng bình xịt hằng ngày. Nhiều năm nay sáng nào ông cũng ho khạc đờm trắng. Sau một đợt cảm, 4 ngày nay ông khó thở hơn hẳn: đi ra sân, lên bậc thềm là thở dốc phải dừng; ngồi nghỉ thì thở được. Ông ho nhiều hơn, đờm nhiều hơn, đặc, màu vàng xanh, có lúc nghe khò khè. Ông xịt thuốc cắt cơn thì đỡ được một lúc. Con trai đo SpO2 được 94%. Ông không sốt, tỉnh táo, ăn uống được, không đau ngực, không phù chân, nằm không khó thở hơn, không ho ra máu."
