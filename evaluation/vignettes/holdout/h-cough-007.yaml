id: h-cough-007
set: holdout
title_vi: "Nữ 31 tuổi mang thai 30 tuần, con trai vừa được chẩn đoán ho gà, ho 3 tuần thành cơn, nôn sau ho, không rít"
narrative_vi: "Chị L., 31 tuổi, ở Hà Nội, đang mang thai con thứ hai được 30 tuần, chưa tiêm vắc xin ho gà trong lần mang thai này. Con trai 4 tuổi của chị được bệnh viện chẩn đoán ho gà cách đây 1 tuần. Chị ho đã khoảng 3 tuần: lúc đầu sổ mũi, ho nhẹ như cảm; 10 ngày nay ho thành từng cơn dồn dập, ho đến chảy nước mắt, có lần ho xong thì nôn, đêm ho nhiều không ngủ được. Cuối cơn không có tiếng rít. Giữa các cơn chị thấy bình thường, không khó thở, không đau ngực, không sốt, không ho ra máu. Thai máy đều, chị không đau bụng, không ra máu âm đạo, không phù. Chị không hút thuốc, chưa từng bị hen."
