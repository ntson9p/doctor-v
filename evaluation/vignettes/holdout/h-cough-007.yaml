source:
  basis: "Ho gà ở người lớn đang mang thai: ho 3 tuần, từng cơn dồn dập, nôn sau ho, nặng về đêm, không có tiếng rít (người lớn thường không rít), con trai vừa được chẩn đoán ho gà (định nghĩa ca lâm sàng WHO). NHS Whooping cough: đang mang thai và tiếp xúc người bị ho gà thì hẹn khám khẩn hoặc gọi 111; điều trị sớm để giảm lây cho trẻ sơ sinh. Không khó thở, không tím nên mức 3."
