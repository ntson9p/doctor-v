title_vi: "Nam 66 tuổi uống thuốc giảm đau xương khớp, đau thượng vị, đi ngoài phân đen"
narrative_vi: "Ông H., 66 tuổi, ở Nam Định, bị thoái hóa khớp gối, uống thuốc giảm đau xương khớp hằng ngày đã 2 tháng. Một tuần nay ông đau âm ỉ vùng trên rốn, buồn nôn. Từ hôm qua ông đi ngoài 2 lần phân đen, nát, dính như hắc ín, mùi rất khắm. Ông mệt nhưng không ngất, không choáng, không nôn ra máu. Ông bị tăng huyết áp."
