source:
  basis: "Cúm mùa chưa biến chứng ở người trẻ khỏe: khởi phát đột ngột sốt, ớn lạnh, đau đầu, đau cơ, mệt, ho khan, đau họng, có đồng nghiệp xác định cúm A (CDC; ở phòng khám tuyến ban đầu tại Thành phố Hồ Chí Minh, khoảng 93% người cúm A có đau đầu theo Todd 2018). Không thuộc nhóm nguy cơ diễn biến nặng theo 1840/QĐ-BYT, không cứng gáy, không lú lẫn, không ban, không khó thở nên chăm sóc tại nhà và theo dõi dấu hiệu cần đi khám."
