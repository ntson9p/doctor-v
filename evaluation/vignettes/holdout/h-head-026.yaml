author: "agent:vignette-holdout"
notes_vi: "Sốt kèm đau đầu nhưng không có dấu hiệu màng não, không ăn tiết canh hay giết mổ lợn, nên không cần xếp mức cấp cứu. Xét nghiệm nhanh âm tính chưa loại trừ COVID-19 nên COVID-19 cũng được chấp nhận."
