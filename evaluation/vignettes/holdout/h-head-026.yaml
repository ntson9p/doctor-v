id: h-head-026
set: holdout
title_vi: "Nam 26 tuổi, đột ngột sốt 38,6°C, đau đầu, đau mỏi người, ho khan, đồng nghiệp bị cúm A"
narrative_vi: "Anh T., 26 tuổi, nhân viên khách sạn ở Đà Lạt (Lâm Đồng), khỏe mạnh, không có bệnh nền, không hút thuốc. Tuần này ở chỗ làm có 3 đồng nghiệp đi khám được xét nghiệm dương tính cúm A. Từ chiều qua anh đột ngột ớn lạnh, run, rồi sốt 38,6°C, nhức khắp đầu, đau mỏi khắp người, mệt, ăn không ngon, ho khan, đau họng nhẹ. Đau đầu mức vừa, phải nằm nghỉ, uống paracetamol thì đỡ. Sáng nay anh tự xét nghiệm nhanh COVID-19, kết quả 1 vạch. Anh tỉnh táo, cúi đầu cằm chạm ngực được, không sợ ánh sáng, không nôn, không nổi ban, không khó thở, không đau ngực, không sổ mũi. Tuần qua anh không ăn tiết canh, không đi rừng."
