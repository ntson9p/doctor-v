  basis: "Tay chân miệng độ 3 theo 292/QĐ-BYT: sau giật mình nhiều lần và sốt cao không đáp ứng thuốc hạ sốt, trẻ thở nhanh, thở bụng, vã mồ hôi, chi lạnh, li bì. Đây là biến chứng thần kinh kèm rối loạn hô hấp, tuần hoàn, cần hồi sức cấp cứu ngay."
