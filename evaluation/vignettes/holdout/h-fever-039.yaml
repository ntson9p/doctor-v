notes_vi: "Môi chưa tím nên câu khó thở dữ dội trả lời 'không'; mức 1 phải nhận ra từ tổ hợp giật mình, thở nhanh, chi lạnh, li bì. Danh mục chưa có câu hỏi về vã mồ hôi và mạch nhanh."
