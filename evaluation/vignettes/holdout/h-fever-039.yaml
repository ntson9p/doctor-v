id: h-fever-039
set: holdout
title_vi: "Bé trai 22 tháng, sốt cao 3 ngày, loét miệng, giật mình liên tục, thở nhanh, vã mồ hôi, chi lạnh"
narrative_vi: "Bé H., 22 tháng, ở Tây Ninh, đi nhà trẻ; lớp bé có mấy bạn đang nghỉ vì tay chân miệng. Bé sốt 3 ngày nay, 39,5–40°C, uống thuốc hạ sốt gần như không hạ. Trong miệng bé có vết loét, lòng bàn tay, bàn chân có vài nốt phỏng nước nhỏ. Từ đêm qua bé giật mình chới với liên tục, khoảng 4–5 lần trong nửa giờ, nôn 3 lần. Sáng nay bé thở nhanh, bụng phập phồng mạnh khi thở, vã mồ hôi nhiều, tay chân lạnh, da tái. Bé bỏ ăn, không chịu uống nước, lừ đừ, ngủ li bì, gọi mới mở mắt rồi lại ngủ. Môi bé chưa tím, bé không co giật. Bé đã tiêm đủ 2 mũi vắc xin sởi."
