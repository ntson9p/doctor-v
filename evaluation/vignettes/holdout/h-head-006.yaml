title_vi: "Nữ 66 tuổi, đau căng vùng gáy 4 ngày khi mất ngủ, giống kiểu đau đã có từ lâu"
narrative_vi: "Bà T., 66 tuổi, ở Hải Dương, bị tăng huyết áp, uống thuốc đều. Từ thời trẻ bà đã hay bị đau đầu kiểu này. Bốn ngày nay bà chăm chồng nằm viện, mất ngủ, lại đau căng tức vùng gáy và sau đầu, mức vừa, phải nằm nghỉ. Tiếng ồn làm bà khó chịu hơn. Huyết áp đo sáng nay 135/85 mmHg. Bà không buồn nôn, không nhìn mờ, không yếu tay chân, không sốt, không đau hàm khi nhai."
