source:
  basis: "COVID-19 mức nhẹ ở người trẻ khỏe, đã tiêm vắc xin, không bệnh nền: đau đầu là một trong các triệu chứng hay gặp nhất thời kỳ Omicron, cùng sổ mũi, đau họng (Menni 2022). Chăm sóc tại nhà và theo dõi dấu hiệu nặng (2671/QĐ-BYT)."
