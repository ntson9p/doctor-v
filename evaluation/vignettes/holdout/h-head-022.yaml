id: h-head-022
set: holdout
title_vi: "Nam 41 tuổi, đau đầu khắp đầu kèm đau họng, sổ mũi, sốt nhẹ, test nhanh COVID-19 dương tính"
narrative_vi: "Anh L., 41 tuổi, hướng dẫn viên du lịch ở Nha Trang, khỏe mạnh, đã tiêm 3 mũi vắc xin COVID-19, không hút thuốc. Mấy người trong đoàn khách anh vừa dẫn đang bị sốt, ho. Từ hôm qua anh đau đầu khắp đầu, đau như bó chặt, mức vừa, phải nằm nghỉ, kèm đau họng, sổ mũi, ho ít, đau mỏi người, mệt, sốt nhẹ 37,8°C. Sáng nay anh tự test nhanh COVID-19 thấy 2 vạch. Anh không khó thở, không đau ngực, không cứng gáy, không buồn nôn, vẫn ăn uống được, ngửi và nếm bình thường. Trước đây anh hiếm khi bị đau đầu."
