source:
  basis: "Cường giáp thể vô cảm ở người cao tuổi kèm nghi rung nhĩ: mệt, uể oải, ăn kém, sụt cân, tim đập không đều, hụt hơi khi gắng sức; không run tay, không sợ nóng, không bướu cổ, không lồi mắt. Sharma (Cureus 2022, ca bệnh và tổng quan y văn): người cao tuổi cường giáp có thể biểu hiện 'cường giáp vô cảm' với li bì, trầm buồn, sụt cân, ăn kém; run, hồi hộp, tiêu chảy, sợ nóng thường không có; ít bướu cổ hơn người trẻ; rung nhĩ, suy tim hay gặp. NHS Atrial fibrillation: nghĩ có triệu chứng rung nhĩ thì đi khám bác sĩ (không khẩn); gọi 999 khi đang tim nhanh hoặc không đều kèm đau ngực, khó thở, ngất, yếu một bên người. NHS Overactive thyroid: đi khám bác sĩ. Mức 4."
  references:
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC8788900"
    - "https://www.nhs.uk/conditions/atrial-fibrillation/symptoms/"
    - "https://www.nhs.uk/conditions/overactive-thyroid-hyperthyroidism/"
author: "agent:vignette-holdout"
notes_vi: "Ca khó ở người cao tuổi: người nhà nghĩ do buồn phiền. Rung nhĩ là biến chứng của cường giáp nên chấp nhận cả rối loạn nhịp tim."
