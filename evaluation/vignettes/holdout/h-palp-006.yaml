id: h-palp-006
set: holdout
title_vi: "Nữ 70 tuổi, 2 tháng mệt, ăn kém, sụt 6 kg; 3 tuần nay tim đập lộn xộn, hụt hơi khi làm việc nhà; không run, không sợ nóng, cổ không to"
narrative_vi: "Bà Th., 70 tuổi, ở Long An. Khoảng 2 tháng nay bà mệt, uể oải, ăn kém, sụt khoảng 6 kg; người nhà tưởng bà buồn phiền chuyện gia đình, bà cũng hay lo nghĩ, ngủ kém. Ba tuần nay bà hay thấy tim đập lộn xộn, lúc nhanh lúc chậm, không đều, nhất là khi làm việc nhà; đi chợ về là hụt hơi. Bà không thấy run tay, không sợ nóng, cổ không thấy to, mắt không lồi. Bà không đau ngực, không ngất, không choáng, ngồi nghỉ không khó thở, không phù chân. Bà không bị tăng huyết áp, không bị đái tháo đường, không có bệnh tim đã biết, không uống aspirin hay thuốc chống đông. Bà đi ngoài phân bình thường, không đen, không tiêu chảy."
