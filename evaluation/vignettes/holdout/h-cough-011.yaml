source:
  basis: "Viêm phổi mắc phải ở cộng đồng ở người cao tuổi: sốt, rét run, ho khạc đờm vàng, đau ngực kiểu màng phổi, khó thở khi gắng sức 3 ngày (4235/QĐ-BYT, bài viêm phổi mắc phải ở cộng đồng). Bà tỉnh táo, ngồi nghỉ thở bình thường, uống được: theo thang CRB-65 chỉ có 1 điểm (tuổi), NICE NG138 khuyên cân nhắc khám đánh giá ở bệnh viện, bác sĩ quyết định điều trị ngoại trú hay nhập viện. NHS Cough: ho kèm đau ngực, khó thở thì hẹn khám khẩn. Nên mức 3."
  references:
    - byt-qd-4235-2012
    - nhs-cough
author: "agent:vignette-holdout"
notes_vi: "Ca của bệnh đã có, triệu chứng chính mới (Ho). Lú lẫn, khó thở khi nghỉ, SpO2 dưới 92% hoặc tụt huyết áp sẽ đưa lên mức 2."
