id: h-cough-011
set: holdout
title_vi: "Nữ 74 tuổi tăng huyết áp, 3 ngày sốt rét run, ho đờm vàng, đau ngực phải khi ho, đi nhanh thì hụt hơi"
narrative_vi: "Bà N., 74 tuổi, ở Hưng Yên, bị tăng huyết áp uống thuốc đều, không hút thuốc, không bị tiểu đường. Ba ngày nay bà sốt, cao nhất 38,8°C, có lúc rét run, ho nhiều, khạc đờm đặc màu vàng. Bà đau nhói ngực bên phải mỗi khi ho hoặc hít sâu. Đi nhanh hoặc lên vài bậc thềm là bà hụt hơi, ngồi nghỉ thì thở được bình thường. Bà mệt, chán ăn nhưng vẫn ăn được cháo, uống nước được, tỉnh táo, nói chuyện bình thường, tự đi lại trong nhà được. Nhà không có máy đo SpO2. Bà không ho ra máu, không phù chân, không nôn, không tiêu chảy. Trong xóm nhiều người đang bị ho, sốt."
