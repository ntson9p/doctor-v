id: h-head-024
set: holdout
title_vi: "Nam 41 tuổi, đau đầu bó chặt hai bên 3–4 ngày mỗi tuần đã 2 tháng, làm việc căng thẳng, thiếu ngủ"
narrative_vi: "Anh Q., 41 tuổi, kế toán ở Thành phố Hồ Chí Minh. Hai tháng nay công ty dồn việc, anh thường làm đến khuya, mỗi đêm chỉ ngủ 4–5 tiếng. Tuần nào anh cũng đau đầu 3–4 ngày, thường từ giữa buổi chiều, cảm giác như bị bó chặt quanh đầu, nặng hai bên thái dương lan ra sau gáy, mức nhẹ, vẫn làm việc được. Mỗi đợt kéo dài vài giờ, có hôm đến tối mới hết; hôm nay đau từ trưa, đã khoảng 5 giờ. Cổ vai hay mỏi cứng nhưng vẫn cúi đầu bình thường. Anh uống paracetamol khoảng 2 ngày mỗi tuần, đỡ một phần. Đi lại, leo cầu thang không làm đau hơn. Anh không buồn nôn, không nôn, ánh sáng hay tiếng ồn không làm khó chịu thêm, không nhìn mờ, không yếu tay chân, không sốt. Trước đây anh chỉ thỉnh thoảng đau kiểu này vài lần mỗi năm. Huyết áp đo ở công ty tháng trước 125/80 mmHg."
