source:
  basis: "Đau đầu kiểu căng thẳng: đau hai bên, cảm giác bó chặt, mức nhẹ, không tăng khi vận động, không buồn nôn, không sợ ánh sáng hay tiếng ồn (ICHD-3), liên quan căng thẳng và thiếu ngủ. Đau nhiều ngày mỗi tuần nên theo NHS Tension headaches cần đi khám bác sĩ (không khẩn), không chỉ tự dùng thuốc giảm đau."
  references:
    - nhs-tension-headaches
    - ihs-ichd3-2018
author: "agent:vignette-holdout"
notes_vi: "Mức 4 vì đau nhiều lần mỗi tuần; đau thưa vài lần mỗi năm thì tự theo dõi được. Thuốc giảm đau dùng dưới 15 ngày mỗi tháng nên chưa nghĩ đau đầu do lạm dụng thuốc. Danh mục chưa có câu hỏi về số ngày dùng thuốc giảm đau mỗi tháng."
