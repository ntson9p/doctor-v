title_vi: "Bé trai 2 tuổi, sốt cao 6 ngày, mắt đỏ, môi nứt, ban đỏ, phù bàn tay bàn chân"
narrative_vi: "Bé T., 2 tuổi, ở Thành phố Hồ Chí Minh. Bé sốt cao 39–40°C đã 6 ngày, uống thuốc hạ sốt chỉ đỡ ít giờ. Hai mắt bé đỏ nhưng không có ghèn, môi đỏ, khô nứt, lưỡi đỏ. Người bé nổi ban đỏ ở thân, bàn tay bàn chân sưng phù, đỏ. Bé quấy khóc nhiều, ăn kém. Bé không ho, không sổ mũi, đã tiêm đủ 2 mũi vắc xin sởi."
