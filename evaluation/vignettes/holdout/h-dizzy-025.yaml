source:
  basis: "Huyết áp tăng rất cao không có tổn thương cơ quan đích cấp (tăng huyết áp khẩn cấp) ở nữ 69 tuổi uống thuốc không đều: choáng váng, nặng đầu, đau đầu vùng gáy, chảy máu mũi một lần đã cầm, huyết áp đo hai lần khoảng 200/105 mmHg; không nhìn mờ, không nhìn đôi, không yếu tê, nói rõ, tự đi được, không đau ngực, không khó thở. NICE NG136: huyết áp từ 180/120 mmHg mà không có triệu chứng đe dọa tính mạng (lú lẫn mới, đau ngực, suy tim, tổn thương thận cấp) hay xuất huyết võng mạc, phù gai thị thì thăm dò tổn thương cơ quan đích càng sớm càng tốt, không cần chuyển viện ngay trong ngày. Mức 3."
  references:
    - nice-ng136
author: "agent:vignette-holdout"
notes_vi: "Ca khó ở người cao tuổi: chóng mặt kèm huyết áp rất cao làm nghĩ đến đột quỵ, nhưng không có dấu hiệu thần kinh, tự đi được. Câu chảy máu chân răng, chảy máu mũi trả lời 'có' vì chảy máu mũi."
