id: h-dizzy-025
set: holdout
title_vi: "Nữ 69 tuổi uống thuốc huyết áp lúc nhớ lúc quên, sáng dậy choáng váng, nặng đầu, đau gáy, chảy máu mũi một lần, huyết áp đo hai lần khoảng 200/105 mmHg"
narrative_vi: "Bà H., 69 tuổi, ở Phủ Lý (Hà Nam), bị tăng huyết áp, uống thuốc lúc nhớ lúc quên. Sáng nay trời rét, bà ngủ dậy thấy choáng váng, nặng đầu, đi lại hơi chòng chành nhưng vẫn tự đi được, không thấy mọi vật quay tròn; đến giờ đã khoảng 3 giờ. Bà đau đầu âm ỉ vùng gáy và chảy máu mũi bên trái một lần, ép mũi 10 phút thì cầm. Con gái đo huyết áp hai lần, đều khoảng 200/105 mmHg. Bà không nhìn mờ, không nhìn đôi, không méo miệng, không yếu tê tay chân, nói rõ, không đau ngực, không khó thở, không buồn nôn, không nôn, không ù tai. Nhà dùng máy sưởi điện, không đốt than. Bà chưa từng bị như vậy."
