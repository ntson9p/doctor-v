title_vi: "Bé gái 3 tuổi, sốt 39,2°C 2 ngày, loét miệng, giật mình khi ngủ, nôn"
narrative_vi: "Bé T., 3 tuổi, ở Đồng Nai. Bé sốt 39,2°C đã 2 ngày, uống thuốc hạ sốt vẫn sốt lại. Trong miệng có vài vết loét, chỉ có vài nốt phỏng nước nhỏ ở mông, tay chân chưa thấy nốt. Đêm qua bé giật mình 2 lần khi ngủ, quấy khóc, khó ngủ. Sáng nay bé nôn 2 lần. Bé vẫn tỉnh, uống được nước, thở bình thường. Không rõ bé có tiếp xúc với trẻ bị tay chân miệng không."
