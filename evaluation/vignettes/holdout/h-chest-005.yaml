id: h-chest-005
set: holdout
title_vi: "Nữ 29 tuổi sau 1 ngày chuyển nhà khuân đồ, 2 ngày đau nhói ngực trái cạnh xương ức, ấn vào đau đúng chỗ, đau khi xoay người"
narrative_vi: "Chị N., 29 tuổi, ở TP.HCM, khỏe mạnh, không hút thuốc, không uống thuốc tránh thai, không có thai. Ba ngày trước chị chuyển nhà, khuân nhiều thùng đồ nặng cả ngày. Từ 2 ngày nay chị đau nhói ở ngực trái, sát cạnh xương ức, đau tăng khi xoay người, giơ tay lên cao, khi hít thật sâu. Ấn tay vào chỗ đó thì đau nhói đúng chỗ. Đau âm ỉ cả ngày, không lan đi đâu. Chị vẫn đi làm, leo cầu thang không khó thở. Chị không sốt, không ho, không vã mồ hôi, không hồi hộp. Da chỗ đau bình thường, không nổi mẩn, không rát. Chân không sưng, gần đây chị không đi xe đường dài."
