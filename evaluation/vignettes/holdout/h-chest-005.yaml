source:
  basis: "Đau thành ngực (cơ, sụn sườn) sau gắng sức mang vác: đau khu trú cạnh xương ức, ấn đau đúng chỗ, tăng khi cử động, xoay người, hít sâu; người trẻ không yếu tố nguy cơ tim mạch, không khó thở, không yếu tố nguy cơ huyết khối. NHS Chest pain: đau ngực tăng khi cử động hoặc ấn vào thường do cơ, xương; tự chăm sóc, khám bác sĩ nếu không đỡ. Nên mức 5."
