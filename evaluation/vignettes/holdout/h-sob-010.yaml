source:
  basis: "COVID-19 mức nặng ở người cao tuổi có đái tháo đường: ngày thứ 6, sốt, ho, nay khó thở cả khi nghỉ, SpO2 89–90%. 2671/QĐ-BYT (2023) xếp SpO2 dưới 94% khi thở khí trời vào mức nặng, cần điều trị tại bệnh viện; hướng dẫn theo dõi SpO2 tại nhà của NHS: từ 92% trở xuống thì đến cấp cứu. Còn nói trọn câu, tỉnh táo nên đến cơ sở cấp cứu ngay (mức 2)."
