id: h-sob-010
set: holdout
title_vi: "Nam 66 tuổi đái tháo đường, COVID-19 ngày thứ 6, sốt, ho khan, nay ngồi yên cũng thở mệt, SpO2 90%"
narrative_vi: "Ông Q., 66 tuổi, ở Hà Nội, bị đái tháo đường típ 2 và tăng huyết áp, uống thuốc hằng ngày. Sáu ngày trước cháu nội ông dương tính COVID-19; hôm sau ông sốt, ho khan, đau mỏi người, tự xét nghiệm nhanh thấy 2 vạch. Ông sốt 5 ngày nay, cao nhất 38,7°C, mệt, ăn kém, mất mùi. Từ hôm qua ông thở mệt dần, hôm nay ngồi yên cũng thấy khó thở, đi vào nhà vệ sinh thì thở dốc. Ông vẫn nói được trọn câu, tỉnh táo. Con trai đo SpO2 bằng máy kẹp ngón tay nhiều lần, được 89–90%. Ông không đau ngực, không ho ra máu, không phù chân, tay chân ấm."
