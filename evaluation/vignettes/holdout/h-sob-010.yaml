notes_vi: "Ca của bệnh đã có, triệu chứng chính mới (Khó thở). Ngưỡng SpO2 trong 2671/QĐ-BYT ghi theo hiểu biết đã có, mục nguồn trong danh mục chưa trích chi tiết phân độ."
