id: h-syncope-002
set: holdout
title_vi: "Nữ 74 tuổi uống gliclazide, 1 tuần ăn rất ít vì viêm họng, sáng nay lả đi trên ghế, vã mồ hôi, nói lẫn lộn; uống sữa đường thì tỉnh"
narrative_vi: "Bà S., 74 tuổi, ở Thái Bình, bị đái tháo đường típ 2, uống gliclazide và metformin nhiều năm. Một tuần nay bà bị viêm họng, nuốt đau, ăn rất ít, mỗi bữa vài thìa cháo, nhưng vẫn uống thuốc tiểu đường đều. Sáng nay khoảng 6 giờ, trước bữa sáng, con gái thấy bà ngồi lả trên ghế, vã mồ hôi, run tay, nói năng lẫn lộn, gọi hỏi trả lời chậm, suýt ngã khỏi ghế. Con gái cho bà uống một cốc sữa pha đường; khoảng 15 phút sau bà tỉnh táo hẳn, nói chuyện bình thường, nhận ra mọi người, hiện chỉ còn mệt. Hai buổi sáng trước bà cũng có lúc vã mồ hôi, run, mệt, ăn xong thì đỡ. Bà không sốt, không đau ngực, không khó thở, không thấy tim đập nhanh, không yếu tay chân, không méo miệng, không co giật. Nhà không có máy đo đường huyết."
