source:
  basis: "Hạ đường huyết do sulfonylurea (gliclazide) ở người cao tuổi ăn kém: vã mồ hôi, run, lú lẫn, lả đi trước bữa sáng, tỉnh hẳn sau khi được cho uống sữa đường; hai buổi sáng trước cũng có cơn nhẹ. NHS Low blood sugar: triệu chứng gồm vã mồ hôi, run, lú lẫn; hay gặp ở người dùng insulin hoặc thuốc như gliclazide; hay bị hạ đường huyết hoặc đã bị hạ đường huyết nặng thì cần được bác sĩ xem lại. Veitch và Clifton-Bligh (MJA 2004): hạ đường huyết do sulfonylurea có thể kéo dài và tái phát quá 24 giờ dù đã điều trị, cần theo dõi đường huyết ít nhất 24 giờ; ở người cao tuổi, lơ mơ, lú lẫn có thể là biểu hiện nổi bật; người không ăn uống được cần chuyển viện khẩn. Đã cần người khác giúp mới hết cơn, vẫn ăn kém và thuốc còn tác dụng nên đến cấp cứu ngay để theo dõi (mức 2)."
  references:
    - nhs-hypoglycaemia
    - "https://www.mja.com.au/journal/2004/180/2/long-acting-sulfonylureas-long-acting-hypoglycaemia"
    - "https://www.nhs.uk/medicines/gliclazide/side-effects-of-gliclazide/"
author: "agent:vignette-holdout"
notes_vi: "Ca khó ở người cao tuổi: biểu hiện chủ yếu là lú lẫn, lả đi. Lú lẫn đã hết sau khi uống sữa đường nhưng mới xảy ra trong giờ qua nên người nhà trả lời 'có'; đến giờ bà đã hồi phục hẳn nên câu chưa hồi phục sau ngất trả lời 'không'. Nhà không có máy đo nên đường huyết là 'Chưa đo'."
