source:
  basis: "Bóc tách động mạch chủ điển hình: nam cao tuổi tăng huyết áp không kiểm soát, đột ngột đau ngực dữ dội ngay từ đầu, như xé, lan ra sau lưng giữa hai bả vai, vã mồ hôi, huyết áp 190/105 mmHg. HSE Aortic dissection: đau ngực hoặc lưng trên đột ngột, dữ dội, như xé, có thể lan dọc lưng; gọi cấp cứu ngay khi có bất kỳ dấu hiệu nào. Mức 1."
