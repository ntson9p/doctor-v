id: h-chest-002
set: holdout
title_vi: "Nam 68 tuổi tăng huyết áp không kiểm soát, 40 phút trước đột ngột đau ngực dữ dội như xé, lan ra sau lưng giữa hai bả vai"
narrative_vi: "Ông P., 68 tuổi, ở Hải Phòng, hút thuốc lá, bị tăng huyết áp nhiều năm nhưng uống thuốc thất thường. Khoảng 40 phút trước, đang ngồi xem ti vi, ông đột ngột đau ngực dữ dội ngay từ đầu, cảm giác như bị xé rách, đau xuyên ra sau lưng, giữa hai bả vai. Ông nói không phải kiểu đè nặng mà như có gì xé trong ngực. Đến giờ vẫn đau nhiều, không nằm yên được, vã mồ hôi, buồn nôn. Con trai đo huyết áp tay phải được 190/105 mmHg. Ông vẫn tỉnh, nói được, không yếu tay chân, không méo miệng, không ngất. Đau không lan lên hàm hay cánh tay. Ông chưa từng được nói có phình động mạch chủ hay bệnh tim."
