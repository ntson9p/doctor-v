narrative_vi: "Ông D., 58 tuổi, ở Hải Phòng, hút thuốc lá 30 năm. Bốn ngày nay ông sốt cao 39,5°C kèm rét run, ho khạc đờm vàng đặc. Ông đau nhói ngực bên phải khi hít sâu và khi ho, đi lại nhanh thì hụt hơi. Ông mệt, chán ăn, đau mỏi người. Ông vẫn tỉnh táo, nói được trọn câu, môi không tím."
