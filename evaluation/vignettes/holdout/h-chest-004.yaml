id: h-chest-004
set: holdout
title_vi: "Nam 38 tuổi, 2 tuần nay nóng rát sau xương ức sau ăn, nhất là sau nhậu và khi nằm, ợ chua, uống thuốc dạ dày thì đỡ"
narrative_vi: "Anh T., 38 tuổi, nhân viên kinh doanh ở Đà Nẵng, hút thuốc lá, hay đi nhậu với khách. Khoảng 2 tuần nay, sau bữa ăn, nhất là sau khi uống bia, ăn đồ cay, đồ chiên, anh thấy nóng rát sau xương ức, lan lên cổ họng, ợ chua, có lúc trào nước chua lên miệng. Nằm ngay sau bữa tối thì nặng hơn. Mỗi lần nóng rát kéo dài khoảng nửa giờ đến 1 giờ, lần gần nhất tối qua. Uống thuốc dạ dày mua ở hiệu thuốc thì đỡ nhanh. Không phải cảm giác tức nặng, đè ép. Đau không liên quan gắng sức: anh vẫn chạy bộ 3 km không sao. Anh không khó thở, không vã mồ hôi, không nôn, không nuốt nghẹn, không sụt cân, phân vàng bình thường."
