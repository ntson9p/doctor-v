source:
  basis: "Trào ngược dạ dày – thực quản điển hình: nóng rát sau xương ức sau ăn, khi nằm, ợ chua, trào ngược, đỡ nhanh với thuốc kháng acid, không liên quan gắng sức, không có dấu hiệu báo động (nuốt nghẹn, sụt cân, nôn ra máu, phân đen). NHS Chest pain: đau ngực nóng rát sau ăn, ợ chua thường do trào ngược; chỉ gọi 999 khi đau đột ngột không hết, lan tay, hàm, kèm vã mồ hôi, khó thở. Theo hướng dẫn chung về trào ngược (NHS Heartburn and acid reflux), tự điều chỉnh ăn uống, hỏi dược sĩ, khám bác sĩ nếu không đỡ sau 3 tuần, nên mức 5."
  references:
    - nhs-chest-pain
author: "agent:vignette-holdout"
notes_vi: "Ợ chua, nóng rát sau xương ức được tính là đau ngực (khó chịu ở ngực) nên người bệnh chọn Đau ngực. Nam hút thuốc, hay uống rượu bia nhưng mới 38 tuổi và gắng sức không đau."
