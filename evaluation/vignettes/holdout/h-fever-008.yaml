title_vi: "Bé gái 2 tuổi chưa tiêm vắc xin sởi, sốt cao 4 ngày, mắt đỏ, ban từ mặt lan xuống"
narrative_vi: "Bé M., 2 tuổi, ở Hà Nội. Bé chưa tiêm vắc xin sởi vì hay bị bệnh vào đúng lịch tiêm. Bé sốt cao 39–40°C đã 4 ngày, ho, chảy nước mũi, mắt đỏ, chảy nước mắt. Hôm qua bé nổi ban đỏ sau tai, lên mặt, nay lan xuống ngực và lưng. Hàng xóm có trẻ đang bị sởi. Bé mệt, ăn kém nhưng vẫn uống được, không khó thở, không tiêu chảy."
