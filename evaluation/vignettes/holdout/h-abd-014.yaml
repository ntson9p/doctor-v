title_vi: "Nữ 35 tuổi, đau quặn bụng dưới phải 8 giờ lan xuống bẹn, tiểu nhiều lần, không tiểu máu"
narrative_vi: "Chị Đ., 35 tuổi, ở Hà Nội, không mang thai, kinh nguyệt đều, vừa sạch kinh 1 tuần. Từ sáng, khoảng 8 giờ trước, chị đột ngột đau quặn từng cơn ở bụng dưới bên phải, lan xuống bẹn và ra hông lưng phải. Chị buồn nôn, đi tiểu nhiều lần, nước tiểu không đỏ. Không sốt, không ra khí hư hay ra máu âm đạo."
