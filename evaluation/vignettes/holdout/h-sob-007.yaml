title_vi: "Nam 17 tuổi ăn cua ghẹ 20 phút trước, nổi mề đay khắp người, sưng môi, nghẹn họng, khàn tiếng, khò khè, choáng"
narrative_vi: "Em Đ., nam, 17 tuổi, ở Vũng Tàu. Tối nay em ăn lẩu cua ghẹ ở đám tiệc. Khoảng 20 phút sau em thấy ngứa khắp người, nổi mảng mề đay đỏ gồ lan nhanh từ cổ xuống ngực, lưng; môi sưng lên, cổ họng thắt lại, nuốt vướng, giọng khàn đi, thở khò khè, hụt hơi dù đang ngồi. Em ho khan, buồn nôn, nôn 1 lần, thấy choáng váng. Em vẫn tỉnh, nói được câu ngắn. Trước đây em từng nổi mẩn ngứa sau ăn tôm nhưng nhẹ. Em không bị hen, không hút thuốc."
