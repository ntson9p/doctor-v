id: h-fever-042
set: holdout
title_vi: "Nữ 24 tuổi sinh con tại nhà 6 ngày, sốt, đau bụng dưới, sản dịch hôi, thở nhanh, da nổi vân tím, lẫn lộn"
narrative_vi: "Chị H., 24 tuổi, ở một thôn xa trung tâm xã tại Đắk Lắk. Chị sinh con thứ hai tại nhà cách đây 6 ngày, do người trong thôn đỡ. Ba ngày nay chị sốt, người nóng ran, có lúc rét run, đau âm ỉ bụng dưới, sản dịch có mùi hôi; chị mệt và bỏ ăn. Nhà không có nhiệt kế. Từ sáng nay chị thở nhanh, mệt lả không tự ngồi dậy được, tay chân lạnh, da nổi vân tím. Chị nói năng lẫn lộn, không nhận ra mẹ chồng. Từ sáng đến giờ chị chưa đi tiểu. Chị không ho, không nôn, không đi ngoài lỏng."
