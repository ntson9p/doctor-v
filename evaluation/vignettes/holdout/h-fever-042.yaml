source:
  basis: "Nhiễm khuẩn hậu sản sau đẻ tại nhà (sốt, đau bụng dưới, sản dịch hôi) đã thành nhiễm khuẩn huyết: lú lẫn mới, thở nhanh, da nổi vân tím là tiêu chí nguy cơ cao theo NICE NG253. Cần gọi cấp cứu ngay (NHS Sepsis)."
