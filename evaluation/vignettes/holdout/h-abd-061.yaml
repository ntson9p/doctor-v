source:
  basis: "Nang buồng trứng cơ năng 4 cm phát hiện tình cờ, chỉ tức nhẹ bụng dưới trái từng lúc, không đau dữ dội, không nôn, không sốt, không chậm kinh. NHS Ovarian cyst: nang buồng trứng rất hay gặp, nang cơ năng thường vô hại và tự hết sau vài tháng; có triệu chứng thì khám bác sĩ (không khẩn); chỉ khám khẩn khi đau vùng chậu đột ngột, dữ dội hoặc đau bụng kèm buồn nôn, nôn (nang xoắn hoặc vỡ). Mức 4."
  references:
    - "https://www.nhs.uk/conditions/ovarian-cyst/"
author: "agent:vignette-holdout"
notes_vi: "Ca ngoài danh mục: nang buồng trứng không xoắn, không vỡ. Dùng để đo khuyên quá mức khi người dùng trả lời 'đã biết có u nang buồng trứng'."
