id: h-abd-061
set: holdout
title_vi: "Nữ 29 tuổi vừa phát hiện tình cờ nang buồng trứng trái 4 cm, 3 tuần nay thỉnh thoảng tức nhẹ bụng dưới trái, không nôn, không sốt"
narrative_vi: "Chị D., 29 tuổi, ở Cần Thơ, chưa có con. Tuần trước đi khám sức khỏe định kỳ ở công ty, siêu âm thấy nang buồng trứng trái 4 cm; bác sĩ nói là nang cơ năng, hẹn siêu âm lại sau 2 chu kỳ kinh. Khoảng 3 tuần nay chị để ý thỉnh thoảng hơi tức nhẹ bụng dưới bên trái, mỗi lần vài giờ, vẫn đi làm bình thường, chưa phải uống thuốc. Không đau dữ dội, không buồn nôn, không nôn, không sốt. Kinh nguyệt đều, không ra nhiều, vừa có kinh cách đây 10 ngày, không chậm kinh, không ra máu bất thường, khí hư bình thường. Không đau khi đi tiểu, không đau khi quan hệ. Chị lo nang to lên nên muốn biết có cần đi khám ngay không."
