id: h-syncope-006
set: holdout
title_vi: "Nữ 27 tuổi chậm kinh 2 tuần, ra máu nâu, đột ngột đau dữ dội bụng dưới lan lên vai phải rồi ngất; da tái, vã mồ hôi lạnh"
narrative_vi: "Chị Y., 27 tuổi, ở Biên Hòa (Đồng Nai), đã sinh thường một con. Kinh nguyệt chậm khoảng 2 tuần, chị chưa thử thai. Hai ngày nay chị ra ít máu nâu ở âm đạo và đau âm ỉ bụng dưới bên phải. Chiều nay đang nấu cơm, chị đột ngột đau nhói dữ dội bụng dưới bên phải, đau lan lên vai phải, rồi choáng, tối sầm mắt và ngã xuống; chồng thấy chị lịm đi khoảng nửa phút. Hiện chị tỉnh, trả lời được, nhưng da tái nhợt, vã mồ hôi lạnh, tay chân lạnh, buồn nôn, đứng dậy là choáng muốn ngất, vẫn đau bụng nhiều. Chị không sốt, không tiêu chảy, không đau khi đi tiểu, không khó thở, không đau ngực."
