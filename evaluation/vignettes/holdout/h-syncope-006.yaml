source:
  basis: "Chửa ngoài tử cung vỡ: chậm kinh, ra máu âm đạo ít, đau bụng dưới một bên vài ngày, rồi đột ngột đau dữ dội, đau lan lên vai, ngất; sau đó da tái, vã mồ hôi lạnh, tay chân lạnh, choáng khi đứng (dấu hiệu chảy máu trong ổ bụng). NHS Ectopic pregnancy: đau bụng đột ngột dữ dội, chóng mặt nhiều hoặc ngất, buồn nôn, da rất tái là dấu hiệu vỡ, gọi 999 hoặc đến cấp cứu ngay; đau ở đầu vai là triệu chứng gợi ý. MSD Ectopic pregnancy; NICE NG126. Mức 1."
  references:
    - nhs-ectopic-pregnancy
    - msd-ectopic-pregnancy
    - nice-ng126
author: "agent:vignette-holdout"
notes_vi: "Bệnh đã có trong danh mục, nay thêm triệu chứng chính 'Ngất'. Ca khó: ngất ngay sau cơn đau dữ dội nên người bệnh chọn hoàn cảnh 'đang đau', dễ bị coi là ngất phản xạ. Chưa thử thai nên câu có thai trả lời 'không rõ'."
