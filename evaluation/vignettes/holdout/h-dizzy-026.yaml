id: h-dizzy-026
set: holdout
title_vi: "Nam 38 tuổi, 5 ngày sau khi bị bẻ cổ ở tiệm cắt tóc, đau gáy phải, nay đột ngột chóng mặt quay liên tục, nôn, đi loạng choạng ngã sang phải, không tự đi được"
narrative_vi: "Anh V., 38 tuổi, ở TP.HCM, khỏe mạnh, không có bệnh nền, không hút thuốc. Năm ngày trước anh đi cắt tóc, thợ xoa bóp rồi bẻ mạnh cổ anh sang hai bên, nghe 'rắc'. Từ hôm đó anh đau cổ và đau vùng gáy bên phải. Khoảng 2 giờ trước, đang ngồi làm việc, anh đột ngột thấy mọi vật quay tròn liên tục, buồn nôn, nôn 3 lần. Anh đứng dậy thì loạng choạng, ngã sang phải, phải có người đỡ mới đi được, kể cả khi mở mắt. Đầu đau nhói ở gáy bên phải, tăng dần chứ không bùng lên đột ngột. Anh vẫn tỉnh, nói rõ, không nhìn đôi, không méo miệng, tay chân không yếu, không tê. Không ù tai, không nghe kém. Mấy tuần nay anh không bị cảm. Trước đây chưa từng bị chóng mặt."
