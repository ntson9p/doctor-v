source:
  basis: "Nhồi máu não tuần hoàn sau do bóc tách động mạch đốt sống ở nam 38 tuổi, 5 ngày sau khi bị bẻ cổ ở tiệm cắt tóc: đau cổ, đau gáy phải từ hôm đó, nay đột ngột chóng mặt quay liên tục, nôn, đi loạng choạng ngã sang phải, không tự đi được; không có dấu hiệu FAST. AHA/ASA (Biller 2014): bóc tách động mạch cổ là một trong những nguyên nhân hay gặp nhất của đột quỵ ở người trẻ và trung niên, gắn với nắn chỉnh cột sống cổ, biểu hiện đau đầu một bên, đau gáy, thiếu máu não. Rothwell 2001: người dưới 45 tuổi bị đột quỵ hệ sống – nền có khả năng đã nắn chỉnh cột sống cổ trong tuần trước cao gấp khoảng 5 lần. BE-FAST (Aroor 2017): mất thăng bằng đột ngột là dấu hiệu đột quỵ hay bị bỏ sót khi chỉ dùng FAST. GRACE-3: chóng mặt liên tục cấp kèm đi không vững cần nghĩ nguyên nhân trung ương. Bộ Y tế 3312/QĐ-BYT 2024: nhồi máu não có thể biểu hiện chóng mặt, thất điều. Nghi đột quỵ thì gọi 115."
  references:
    - biller-stroke-2014
    - rothwell-stroke-2001
    - aroor-stroke-2017
    - grace3-dizziness-2023
    - byt-qd-3312-2024
author: "agent:vignette-holdout"
notes_vi: "Ca thay thế cho ca giữ kín đã chuyển sang bộ dev (đột quỵ tuần hoàn sau sau khi bị bẻ cổ). Ca khó: không có yếu liệt, nói khó hay nhìn đôi, dễ nhầm với viêm dây thần kinh tiền đình."
