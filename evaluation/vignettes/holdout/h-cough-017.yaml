source:
  basis: "Ho sau nhiễm vi rút (ho bán cấp, 3–8 tuần), ngoài danh mục: ho khan 4 tuần sau cúm, đang đỡ dần, không sốt, không đờm, không khó thở, không sụt cân, không ho ra máu, không hút thuốc, không dùng thuốc ức chế men chuyển. NHS Cough: ho thường hết trong 3–4 tuần; ho trên 3 tuần thì khám bác sĩ (không khẩn); chỉ khám khẩn khi ho rất nặng, khó thở, đau ngực, ho ra máu. Nên mức 4."
