id: h-cough-017
set: holdout
title_vi: "Nam 38 tuổi ho khan 4 tuần sau đợt cúm, đang đỡ dần, ho khi nói nhiều hoặc gặp gió lạnh, ngoài ra khỏe"
narrative_vi: "Anh V., 38 tuổi, nhân viên bán hàng ở TP.HCM, khỏe mạnh, không hút thuốc. Khoảng 4 tuần trước anh bị cúm: sốt cao, đau nhức người, ho, sổ mũi khoảng 1 tuần rồi hết sốt. Từ đó anh vẫn ho khan, ngứa cổ, ho nhiều khi nói chuyện lâu, khi vào phòng máy lạnh hoặc gặp gió lạnh. Hai tuần nay ho đã thưa dần. Anh không sốt, không khạc đờm, không khò khè, không khó thở, không đau ngực, không ho ra máu, không sụt cân, không ra mồ hôi đêm, không sổ mũi, không ợ chua. Anh không uống thuốc huyết áp hay thuốc gì thường xuyên. Trong nhà không ai bị lao."
