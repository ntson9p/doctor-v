title_vi: "Nam 19 tuổi, sốt cao, đau đầu dữ dội, cứng gáy, sợ ánh sáng, nôn"
narrative_vi: "Anh S., 19 tuổi, sinh viên ở ký túc xá tại Hà Nội. Từ chiều qua anh sốt 39,5°C, đau đầu dữ dội khắp đầu, tăng dần trong vài giờ. Anh nôn 2 lần, rất khó chịu khi nhìn ánh sáng, cổ cứng, không cúi được cằm chạm ngực. Anh mệt, đau mỏi người. Anh vẫn tỉnh, nói chuyện bình thường. Trên da không có nốt ban."
