id: h-dizzy-013
set: holdout
title_vi: "Nam 66 tuổi tăng huyết áp hay quên thuốc, 1 giờ nay đột ngột chóng mặt quay, nôn, nhìn đôi, nói ngọng, không tự đi được"
narrative_vi: "Ông Ph., 66 tuổi, ở Quảng Ngãi, bị tăng huyết áp nhưng hay quên uống thuốc, hút thuốc lá nhiều năm. Khoảng 1 giờ trước, đang ngồi xem ti vi, ông đột ngột chóng mặt quay cuồng, nôn 2 lần, nhìn một thành hai. Con trai thấy ông nói ngọng, líu lưỡi; đứng dậy thì xiêu sang phải, phải có người đỡ mới đi được. Ông vẫn tỉnh, nhận ra người nhà. Hai tay giơ lên vẫn đều, miệng không méo. Ông hơi đau đầu vùng gáy, không phải kiểu đau đột ngột dữ dội. Ông không ù tai, không nghe kém, không đau ngực, không hồi hộp. Con trai đo huyết áp được 185/100 mmHg."
