source:
  basis: "Đột quỵ tuần hoàn sau đang diễn ra: đột ngột chóng mặt quay, nôn, nhìn đôi, nói khó, đi không vững đến mức phải có người đỡ, ở người tăng huyết áp không kiểm soát, hút thuốc. 3312/QĐ-BYT (2024): nhồi máu não khởi phát đột ngột với nhìn đôi, rối loạn ngôn ngữ, thất điều, chóng mặt; cần vận chuyển nhanh, an toàn đến cơ sở điều trị được đột quỵ. NHS Vertigo: chóng mặt quay kèm nhìn đôi hoặc khó nói thì gọi 999 hoặc đến cấp cứu. NHS Symptoms of a stroke: chóng mặt hoặc ngã, khó nói là triệu chứng đột quỵ, gọi 999. Mức 1."
  references:
    - byt-qd-3312-2024
    - nhs-vertigo
    - nhs-stroke-symptoms
author: "agent:vignette-holdout"
notes_vi: "Bệnh đã có trong danh mục (đột quỵ), nay thêm triệu chứng chính 'Chóng mặt'. Không yếu liệt tay, không méo miệng; dấu hiệu đột quỵ ở câu sàng lọc là nói khó."
