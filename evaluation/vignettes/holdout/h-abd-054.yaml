source:
  basis: "Xoắn phần phụ khi mang thai 10 tuần sau thụ tinh trong ống nghiệm, buồng trứng còn to, nhiều nang sau kích trứng: đau bụng dưới phải đột ngột, dữ dội khi trở mình, nôn, không ra máu âm đạo. Spitzer và cộng sự (Geburtshilfe Frauenheilkd 2012): nguy cơ xoắn tăng rõ khi có thai sau hỗ trợ sinh sản hoặc quá kích buồng trứng, phần lớn xảy ra trong 3 tháng đầu; đau bụng cấp trên 80%, đau kèm buồn nôn, nôn gợi ý xoắn; chẩn đoán muộn tăng nguy cơ phải cắt bỏ phần phụ, nên mổ nội soi tháo xoắn sớm. NHS Stomach ache: đau bụng đột ngột, dữ dội thì đến cấp cứu ngay."
  references:
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC4168525/"
    - nhs-stomach-ache
author: "agent:vignette-holdout"
notes_vi: "Siêu âm đã thấy thai trong tử cung, nhưng danh mục không có câu hỏi về điều này, nên từ câu trả lời không phân biệt được với chửa ngoài tử cung (sau thụ tinh trong ống nghiệm còn có thể có thai cả trong và ngoài tử cung); vì vậy chấp nhận ectopic_pregnancy. Danh mục chưa có câu hỏi về thụ tinh trong ống nghiệm hoặc kích trứng."
