title_vi: "Nữ 31 tuổi mang thai 10 tuần sau thụ tinh trong ống nghiệm, buồng trứng còn nhiều nang sau kích trứng, đột ngột đau dữ dội bụng dưới phải khi trở mình, nôn 3 lần"
narrative_vi: "Chị V., 31 tuổi, ở Hà Nội, đang mang thai 10 tuần sau làm thụ tinh trong ống nghiệm. Lần siêu âm lúc thai 7 tuần, bác sĩ nói thai đã vào tử cung, có tim thai; hai buồng trứng còn to, có nhiều nang sau kích trứng. Khoảng 2 giờ trước, khi trở mình trên giường, chị đột ngột đau dữ dội ở bụng dưới bên phải, đau liên tục, không nằm yên được; cử động là đau tăng. Chị buồn nôn, nôn 3 lần. Không ra máu âm đạo, không sốt, không tiêu chảy, không tiểu buốt. Chị không choáng, không ngất, không đau đầu, không phù."
