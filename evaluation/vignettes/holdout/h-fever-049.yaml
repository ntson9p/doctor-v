title_vi: "Bé trai 11 tháng, sốt cao 3 ngày vẫn chơi, bú tốt, hết sốt thì nổi ban hồng ấn mất màu"
narrative_vi: "Bé N., trai, 11 tháng, ở Hải Dương. Bé sốt cao 39–39,8°C liên tục 3 ngày, uống thuốc hạ sốt thì hạ rồi lại sốt. Mấy ngày sốt bé hơi quấy, chảy ít nước mũi trong, nhưng vẫn bú tốt, hạ sốt thì chơi bình thường. Sáng nay bé hết sốt, đến trưa nổi nhiều nốt ban hồng nhỏ ở ngực, bụng, lưng rồi lan lên cổ; ấn vào thì mất màu, bé không ngứa. Bé tỉnh, chơi, bú tốt, đi tiểu bình thường. Bé không ho, mắt không đỏ, trong miệng không loét, không nôn, không tiêu chảy, không co giật. Bé đã tiêm mũi vắc xin sởi đầu tiên lúc 9 tháng và không tiếp xúc ai bị sởi."
