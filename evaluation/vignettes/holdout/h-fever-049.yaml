source:
  basis: "Sốt phát ban ở trẻ nhỏ (roseola, do vi rút herpes típ 6): sốt cao 3 ngày ở trẻ vẫn chơi, bú tốt, ban hồng ấn mất màu mọc khi vừa hết sốt. Không có dấu hiệu vàng hay đỏ theo bảng đèn giao thông của NICE NG143 nên chăm sóc tại nhà, dặn dấu hiệu cần đi khám."
