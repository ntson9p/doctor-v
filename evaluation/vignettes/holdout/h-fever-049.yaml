notes_vi: "Ngoài danh mục bệnh; dễ nhầm sởi hoặc sốt xuất huyết. Điểm phân biệt: ban mọc khi đã hết sốt, ban không mọc từ mặt, trẻ vẫn chơi và bú tốt."
