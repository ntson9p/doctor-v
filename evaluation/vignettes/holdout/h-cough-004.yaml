source:
  basis: "Lao phổi điển hình: ho khạc đờm 5 tuần, sốt nhẹ về chiều, ra mồ hôi đêm, sụt cân, mệt, kém ăn, sống cùng nhà với người đang điều trị lao phổi. 162/QĐ-BYT (2024), Phần II mục 1.1: ở người lớn, ho kéo dài trên 2 tuần là triệu chứng nghi lao quan trọng nhất, kèm gầy sút, sốt nhẹ về chiều, ra mồ hôi đêm; tiếp xúc nguồn lây là yếu tố nguy cơ. Không ho ra máu, không khó thở nên đặt lịch khám trong vài ngày để chụp phổi, xét nghiệm đờm (NHS Cough: ho trên 3 tuần, sụt cân thì khám bác sĩ, không cần khám khẩn)."
