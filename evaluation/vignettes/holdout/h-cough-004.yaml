title_vi: "Nam 42 tuổi hút thuốc, anh ruột đang điều trị lao, ho đờm 5 tuần, sốt nhẹ về chiều, mồ hôi trộm, sụt 4 kg"
narrative_vi: "Anh Đ., 42 tuổi, công nhân ở Bình Dương, hút khoảng nửa bao thuốc lá mỗi ngày. Anh trai sống cùng nhà được chẩn đoán lao phổi 3 tháng trước, đang uống thuốc lao. Khoảng 5 tuần nay anh ho, lúc đầu ho khan, sau khạc đờm đục. Chiều tối anh hay thấy người hâm hấp, đo được 37,6–37,8°C; đêm ra mồ hôi ướt áo. Anh mệt, ăn kém, 2 tháng nay sụt khoảng 4 kg. Anh đã tự mua thuốc ho uống nhưng không đỡ. Anh không ho ra máu, không khó thở, không đau ngực, không đau họng, không sổ mũi. Anh không bị tiểu đường, không có bệnh làm giảm sức đề kháng."
