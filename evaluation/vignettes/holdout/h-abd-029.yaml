title_vi: "Nữ 63 tuổi bị đái tháo đường, khó chịu thượng vị lan ra lưng, buồn nôn, mệt, khó thở, không đau ngực"
narrative_vi: "Bà N., 63 tuổi, ở Huế, bị đái tháo đường và tăng huyết áp. Khoảng 3 giờ nay bà khó chịu, tức âm ỉ vùng trên rốn, lan ra sau lưng, buồn nôn, nôn 1 lần. Bà mệt rũ, hơi khó thở khi đi lại trong nhà. Bà không thấy đau ngực, không vã mồ hôi, không sốt. Bà nghĩ là đau dạ dày."
