id: h-dizzy-017
set: holdout
title_vi: "Nữ 45 tuổi, nửa năm 4 cơn chóng mặt quay 2–4 giờ kèm ù tai, nghe kém, đầy tức tai trái, nôn; hết cơn tai nghe gần như cũ"
narrative_vi: "Chị Ph., 45 tuổi, buôn bán ở Hải Dương. Nửa năm nay chị có 4 cơn chóng mặt quay cuồng tự nhiên xuất hiện, mỗi cơn kéo dài 2–4 giờ, kèm buồn nôn, nôn. Trước và trong cơn, tai trái ù như tiếng ve, nghe kém đi và đầy tức trong tai; hết cơn thì tai nghe gần như cũ nhưng lần sau kém hơn lần trước một chút. Hôm qua chị vừa bị một cơn, nằm nghỉ thì hết sau 3 giờ. Hôm nay chị đi lại bình thường, chỉ còn ù tai nhẹ. Trong cơn chị không nhìn đôi, không nói khó, không tê yếu tay chân, không đau đầu, không sốt, không đau tai, tai không chảy dịch. Chị không bị tăng huyết áp, không bị đau nửa đầu, không có thai, trước cơn đầu tiên không bị cảm."
