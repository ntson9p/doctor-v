source:
  basis: "Bệnh Ménière (không có trong danh mục): các cơn chóng mặt quay tự phát 2–4 giờ, kèm ù tai, nghe kém, đầy tức tai trái dao động theo cơn, buồn nôn, nôn; đã nhiều cơn; giữa cơn đi lại bình thường. NHS Ménière's disease: cơn quay cuồng đột ngột kéo dài vài phút đến 24 giờ, ù tai, nghe kém, cảm giác áp lực trong tai, buồn nôn, nôn; có triệu chứng thì đi khám bác sĩ (không khẩn); gọi 999 khi chóng mặt kèm méo mặt, yếu tay, nói khó, mất thị lực đột ngột hoặc mất thăng bằng nhiều. GRACE-3: cơn chóng mặt tự phát cần phân biệt Ménière với cơn thiếu máu não thoáng qua, migraine tiền đình. Nghe kém dao động theo cơn, tái diễn nhiều lần, không phải nghe kém đột ngột lần đầu; cơn đã hết nên mức 4."
  references:
    - "https://www.nhs.uk/conditions/menieres-disease/"
    - grace3-dizziness-2023
    - "https://www.nhs.uk/conditions/labyrinthitis/"
author: "agent:vignette-holdout"
notes_vi: "Ngoài danh mục. Nghe kém dao động theo cơn, nay đã gần như cũ, nên câu đột ngột nghe kém hẳn mấy ngày nay trả lời 'không'; nếu là nghe kém đột ngột kéo dài thì cần khám khẩn (NHS Labyrinthitis)."
