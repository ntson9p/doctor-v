id: h-head-031
set: holdout
title_vi: "Nam 57 tuổi tăng huyết áp hết thuốc 2 tuần, đau nặng vùng gáy từ sáng, huyết áp đo hai lần khoảng 195/115 mmHg, không đau ngực, không yếu tê, không nhìn mờ"
narrative_vi: "Ông D., 57 tuổi, ở Thái Bình, bị tăng huyết áp 5 năm, hết thuốc từ 2 tuần nay nhưng chưa đi lấy thuốc. Ông hút thuốc lào. Từ sáng ông đau đầu vùng sau gáy, căng tức, nặng đầu, vẫn làm việc nhẹ được nhưng phải nghỉ. Con trai đo huyết áp hai lần cách nhau 15 phút, đều khoảng 195/115 mmHg. Ông không đau ngực, không khó thở, không nhìn mờ, không yếu tê tay chân, nói năng bình thường, không lú lẫn, không buồn nôn, không nôn, không sốt. Kiểu đau đầu này ông thỉnh thoảng bị mỗi khi quên uống thuốc."
