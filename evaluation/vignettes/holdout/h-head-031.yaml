source:
  basis: "Huyết áp tăng rất cao không có tổn thương cơ quan đích cấp (tăng huyết áp khẩn cấp) ở nam 57 tuổi bỏ thuốc 2 tuần: huyết áp đo hai lần khoảng 195/115 mmHg, đau đầu vùng gáy; không đau ngực, không khó thở, không nhìn mờ, không yếu tê, không lú lẫn. NICE NG136: huyết áp từ 180/120 mmHg mà không có dấu hiệu cần chuyển viện trong ngày thì thăm dò tổn thương cơ quan đích càng sớm càng tốt; chỉ chuyển khám chuyên khoa ngay trong ngày khi có xuất huyết võng mạc, phù gai thị hoặc triệu chứng đe dọa tính mạng (lú lẫn mới, đau ngực, dấu hiệu suy tim, tổn thương thận cấp). Mức 3: đi khám, dùng lại thuốc trong ngày hoặc chậm nhất ngày mai."
  references:
    - nice-ng136
author: "agent:vignette-holdout"
notes_vi: "Ca điển hình, có số đo huyết áp."
