id: h-chest-013
set: holdout
title_vi: "Nam 67 tuổi đái tháo đường, hút thuốc, 30 phút nay đau thắt đè nặng giữa ngực lan tay trái và hàm, vã mồ hôi, khó thở, nghỉ không đỡ"
narrative_vi: "Ông L., 67 tuổi, ở Hà Nội, bị đái tháo đường típ 2 và tăng huyết áp, hút thuốc lá hơn 40 năm. Sáng nay trời rét, ông đi bộ thể dục quanh hồ; khoảng 30 phút trước ông thấy đau thắt, đè nặng ở giữa ngực, tăng dần, lan lên hàm và xuống cánh tay trái. Ông ngồi nghỉ trên ghế đá nhưng không đỡ, vẫn đau nhiều. Ông vã mồ hôi lạnh, buồn nôn, khó thở. Ông vẫn tỉnh, nói được. Trước đây ông chưa bị như vậy, chưa được nói là có bệnh tim. Ông không sốt, không ho, đau không tăng khi hít thở hay khi ấn vào ngực, không lan ra sau lưng."
