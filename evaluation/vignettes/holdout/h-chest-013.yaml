source:
  basis: "Hội chứng vành cấp điển hình ở nam cao tuổi nhiều yếu tố nguy cơ (đái tháo đường, tăng huyết áp, hút thuốc): đau thắt, đè nặng giữa ngực 30 phút, lan hàm và tay trái, khởi phát khi đi bộ trời rét, nghỉ không đỡ, vã mồ hôi, buồn nôn, khó thở. 2187/QĐ-BYT: đau ngực kéo dài kèm vã mồ hôi gợi ý nhồi máu cơ tim, liên lạc ngay 115; NICE CG95 mục 1.2.1.3, 1.2.1.7: đau trên 15 phút kèm vã mồ hôi, buồn nôn, khó thở, đang đau thì chuyển cấp cứu. NHS Chest pain: gọi 999. Mức 1."
  references:
    - byt-qd-2187-2019
