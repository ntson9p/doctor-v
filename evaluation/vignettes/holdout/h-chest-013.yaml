    - nhs-chest-pain
author: "agent:vignette-holdout"
notes_vi: "Ca cấp cứu theo đề bài. Đau bắt đầu khi gắng sức nhưng nghỉ không đỡ, nên câu đau khi gắng sức và đỡ khi nghỉ trả lời 'không'."
