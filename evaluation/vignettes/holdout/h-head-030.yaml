id: h-head-030
set: holdout
title_vi: "Nữ 70 tuổi tăng huyết áp, sau khi bực tức thì đau đầu dữ dội nửa bên trái, nôn 4 lần, huyết áp 175/100; hỏi kỹ mới thấy đau quanh mắt trái, mắt trái đỏ, nhìn mờ"
narrative_vi: "Bà K., 70 tuổi, ở Hà Tĩnh, bị tăng huyết áp, đang uống thuốc đều. Chiều nay bà bực tức vì cãi nhau với hàng xóm; khoảng một giờ sau bà đau đầu dữ dội nửa đầu bên trái, buồn nôn, nôn 4 lần trong 3 giờ. Con trai đo huyết áp được 175/100 mmHg, nghĩ bà bị lên huyết áp nên mở app. Khi được hỏi kỹ, bà nói đau nhức nhiều quanh mắt trái, mắt trái nhìn mờ; con thấy mắt trái đỏ hơn mắt phải. Bà không để ý có quầng sáng quanh đèn không. Bà không sốt, không cứng gáy, không méo miệng, không yếu tay chân, nói rõ ràng, vẫn tỉnh táo, tự đi lại được. Trước đây bà chưa từng đau đầu như vậy."
