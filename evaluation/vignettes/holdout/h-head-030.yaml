source:
  basis: "Glôcôm góc đóng cơn cấp ở nữ 70 tuổi, khởi phát sau xúc động mạnh: biểu hiện nổi bật là đau đầu dữ dội nửa bên trái và nôn nhiều, huyết áp 175/100 mmHg nên người nhà nghĩ lên huyết áp; hỏi kỹ mới thấy đau nhức quanh mắt trái, mắt trái đỏ, nhìn mờ. Bộ Y tế 40/QĐ-BYT 2015: cơn cấp khởi phát đột ngột, thường về chiều tối hoặc sau xúc động mạnh; đau nhức quanh hốc mắt lan lên nửa đầu cùng bên, nhìn mờ; có thể buồn nôn, nôn, đau bụng, vã mồ hôi. NHS Glaucoma: triệu chứng đột ngột là cấp cứu, gọi 999 hoặc đến cấp cứu."
  references:
    - byt-qd-40-2015
    - nhs-glaucoma
author: "agent:vignette-holdout"
notes_vi: "Ca khó: dễ nhầm cơn tăng huyết áp, đột quỵ hoặc đau nửa đầu vì đau đầu và nôn nổi bật, huyết áp tăng do đau; không nhận ra quầng sáng quanh đèn."
