source:
  basis: "Glôcôm góc đóng cơn cấp điển hình ở nữ 61 tuổi viễn thị, khởi phát buổi tối sau khi ngồi lâu trong phòng tối: đau nhức dữ dội mắt phải lan lên nửa đầu, mắt đỏ, nhìn mờ như sương, thấy quầng sáng nhiều màu quanh đèn, buồn nôn, nôn. Bộ Y tế 40/QĐ-BYT 2015 (Glôcôm góc đóng nguyên phát): cơn cấp khởi phát đột ngột, thường về chiều tối; đau nhức mắt, quanh hốc mắt lan lên nửa đầu cùng bên, nhìn mờ như qua màn sương, nhìn đèn thấy quầng xanh đỏ, sợ ánh sáng, có thể buồn nôn, nôn; tổn thương thị thần kinh không hồi phục nên cần điều trị kịp thời. NHS Glaucoma: triệu chứng xuất hiện đột ngột là cấp cứu, gọi 999 hoặc đến cấp cứu."
