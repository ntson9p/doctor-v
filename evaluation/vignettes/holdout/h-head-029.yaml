title_vi: "Nữ 61 tuổi viễn thị, tối nay sau khi xem phim lâu trong phòng tối đột ngột đau nhức dữ dội mắt phải lan lên nửa đầu, mắt đỏ, nhìn mờ, thấy quầng sáng quanh đèn, nôn"
narrative_vi: "Bà P., 61 tuổi, ở Hà Nội, bị viễn thị, đeo kính từ năm 40 tuổi. Tối nay sau khi ngồi xem phim lâu trong phòng tắt đèn, bà đột ngột đau nhức dữ dội ở mắt phải, đau lan lên trán và nửa đầu bên phải. Mắt phải đỏ, nhìn mờ như có màn sương, nhìn bóng đèn thấy quầng sáng nhiều màu; ánh sáng làm bà chói mắt. Bà buồn nôn, đã nôn 2 lần. Đau khoảng 2 giờ nay, uống thuốc giảm đau không đỡ. Bà không sốt, không cứng gáy, không yếu tay chân, không méo miệng, nói năng bình thường. Trước đây bà ít khi đau đầu, chưa từng bị như vậy."
