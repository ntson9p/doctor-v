source:
  basis: "Ngoại tâm thu điển hình: cảm giác tim hẫng một nhịp rồi đập mạnh một cái, mỗi lần 1–2 giây, nhiều lần mỗi ngày trong 3 tuần, hay gặp lúc nghỉ ngơi, sau uống trà đặc, khi căng thẳng, ít đi khi gắng sức; mạch đo lúc có triệu chứng bình thường; không có triệu chứng kèm, không bệnh tim, không tiền sử gia đình. NHS Heart palpitations: cảm giác hẫng hoặc thêm nhịp, đập mạnh là kiểu hồi hộp thường gặp, thường vô hại; nguyên nhân hay gặp là căng thẳng, lo âu, thiếu ngủ, cà phê; đã hồi hộp, vẫn khỏe nhưng hay tái lại hoặc dày hơn thì đi khám bác sĩ (không khẩn) để ghi điện tim; gọi cấp cứu chỉ khi kèm đau ngực, khó thở, choáng hoặc ngất. Mức 4."
  references:
    - nhs-heart-palpitations
author: "agent:vignette-holdout"
notes_vi: "Ca điển hình của ngoại tâm thu cần đi khám vì tái diễn nhiều tuần; không có dấu hiệu gợi ý cường giáp, thiếu máu hay rối loạn nhịp nhanh."
