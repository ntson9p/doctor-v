id: h-palp-010
set: holdout
title_vi: "Nữ 48 tuổi, 3 tuần nay nhiều lần mỗi ngày tim hẫng một nhịp rồi đập thịch mạnh, nhất là lúc nằm nghỉ; vẫn khỏe, mạch đo được 76"
narrative_vi: "Chị H., 48 tuổi, kế toán ở Ninh Bình, kinh nguyệt vẫn đều. Ba tuần nay chị thấy tim hay hẫng một nhịp rồi đập thịch mạnh một cái, có lúc như tim lộn một vòng trong ngực, mỗi lần 1–2 giây; ngày bị nhiều lần, nhất là buổi tối lúc nằm nghỉ hoặc sau khi uống trà đặc; khi đi bộ nhanh, làm việc thì lại ít thấy. Dạo này chị lo lắng chuyện công việc, ngủ kém. Chị đo bằng máy đo huyết áp đúng lúc đang thấy hẫng nhịp: mạch 76 lần/phút, huyết áp 125/80 mmHg, máy thỉnh thoảng báo nhịp không đều. Chị vẫn khỏe, leo cầu thang không mệt hơn trước, không đau ngực, không khó thở, không choáng, không ngất, không có cơn tim đập nhanh kéo dài. Chị không sụt cân, không run tay, không sợ nóng, cổ không to, không xanh xao. Chị không có bệnh tim, không bị tăng huyết áp, không uống rượu, không hút thuốc; trong nhà không ai bị bệnh tim hay đột tử."
