id: h-palp-005
set: holdout
title_vi: "Nữ 35 tuổi, 3 tháng tim đập nhanh cả khi nghỉ, ăn nhiều mà sụt 5 kg, sợ nóng, run tay, cổ to ra, mắt lồi; mạch 112"
narrative_vi: "Chị L., 35 tuổi, buôn bán ở Thanh Hóa. Ba tháng nay chị thấy tim đập nhanh, đập mạnh gần như cả ngày, kể cả lúc ngồi nghỉ. Chị ăn nhiều hơn trước nhưng sụt 5 kg, hay đổ mồ hôi, sợ nóng (người nhà thấy mát mà chị vẫn bật quạt mạnh), run tay khi cầm đũa, dễ cáu gắt, khó ngủ, đi ngoài 3–4 lần mỗi ngày phân nát. Chồng chị thấy cổ chị to ra phía trước và mắt lồi hơn trước. Máy đo huyết áp ở nhà báo mạch 112 lần/phút, huyết áp 135/70 mmHg. Chị không đau ngực, không ngất, ngồi nghỉ không khó thở; leo cầu thang nhanh mệt hơn trước. Kinh nguyệt ít đi nhưng vẫn đều, chị không có thai. Chị không có bệnh tim, không uống thuốc gì."
