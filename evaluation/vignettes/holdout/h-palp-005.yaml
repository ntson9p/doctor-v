source:
  basis: "Cường giáp (nghi bệnh Basedow) điển hình: hồi hộp, tim nhanh cả khi nghỉ (mạch 112), sụt cân dù ăn nhiều, sợ nóng, vã mồ hôi, run tay, cáu gắt, khó ngủ, đi ngoài nhiều lần, bướu cổ, mắt lồi. NHS Overactive thyroid: lo âu, cáu gắt, khó ngủ, mệt, sợ nóng, bướu cổ, tim nhanh hoặc không đều, run, sụt cân; có triệu chứng thì đi khám bác sĩ để xét nghiệm chức năng tuyến giáp. AAFP 2016 (Kravets): tăng chuyển hóa gây sụt cân dù ăn nhiều; hồi hộp, nhịp nhanh, run, vã mồ hôi, sợ nóng là triệu chứng cường giao cảm. Không đau ngực, không ngất, không khó thở khi nghỉ nên mức 4."
  references:
    - "https://www.nhs.uk/conditions/overactive-thyroid-hyperthyroidism/"
    - "https://www.aafp.org/pubs/afp/issues/2016/0301/p363.html"
author: "agent:vignette-holdout"
notes_vi: "Ca điển hình. Đi ngoài phân nát 3–4 lần mỗi ngày nên câu tiêu chảy trả lời 'có'; mồ hôi nóng do sợ nóng, không phải vã mồ hôi lạnh."
