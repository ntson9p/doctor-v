id: h-dizzy-018
set: holdout
title_vi: "Nam 60 tuổi mới uống amlodipine 10 ngày, mỗi sáng lâng lâng vài giờ sau uống thuốc, nhức đầu, đỏ bừng mặt; huyết áp bình thường"
narrative_vi: "Ông Tr., 60 tuổi, ở Đà Lạt (Lâm Đồng), mới phát hiện tăng huyết áp, được bác sĩ kê amlodipine uống mỗi sáng từ 10 ngày nay. Từ khi uống thuốc, ngày nào cũng vậy, khoảng 1–2 giờ sau khi uống ông thấy lâng lâng, choáng nhẹ trong vài giờ, kèm nhức đầu giật giật nhẹ khắp đầu, mặt nóng đỏ bừng. Cảm giác này có cả khi ngồi yên, không nặng hơn khi đứng dậy, không quay cuồng. Hai cổ chân hơi phù vào buổi chiều. Ông tự đo huyết áp ở nhà lúc đang choáng được 128/78 mmHg, mạch 84 lần/phút. Ông không ngất, không đau ngực, không khó thở, không hồi hộp, không tê yếu tay chân, không nói khó, nghe rõ, không ù tai. Ông không bị đái tháo đường, không hút thuốc."
