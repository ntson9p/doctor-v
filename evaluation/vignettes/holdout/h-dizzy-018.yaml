source:
  basis: "Tác dụng phụ của thuốc hạ áp mới (amlodipine), không có đặc điểm hạ huyết áp tư thế: lâng lâng, nhức đầu, đỏ bừng mặt vài giờ sau uống thuốc, cả khi ngồi yên, không nặng hơn khi đứng dậy, huyết áp và mạch đo lúc có triệu chứng bình thường, phù nhẹ hai cổ chân. NHS Amlodipine: phù cổ chân, nhức đầu, chóng mặt, đỏ bừng mặt là tác dụng phụ thường gặp; nói với dược sĩ hoặc bác sĩ nếu khó chịu hoặc không hết, vẫn uống thuốc cho đến khi được hướng dẫn khác. NHS Low blood pressure: hạ huyết áp tư thế là choáng khi đứng dậy hoặc đổi tư thế; ở đây không có. Mức 4 (khám lại trong vài ngày để bác sĩ cân nhắc đổi thuốc)."
  references:
    - "https://www.nhs.uk/medicines/amlodipine/side-effects-of-amlodipine/"
    - "https://www.nhs.uk/conditions/low-blood-pressure-hypotension/"
author: "agent:vignette-holdout"
notes_vi: "Ngoài danh mục: chóng mặt do tác dụng phụ của thuốc, không phải hạ huyết áp tư thế (không choáng khi đứng dậy, huyết áp không thấp). Danh mục chưa có câu hỏi về đỏ bừng mặt, phù hai chân hay thuốc mới bắt đầu dùng."
