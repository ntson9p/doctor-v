title_vi: "Nữ 25 tuổi, đột ngột đau dữ dội bụng dưới phải khi tập thể dục, nôn, thử thai âm tính"
narrative_vi: "Chị X., 25 tuổi, ở Thành phố Hồ Chí Minh. Ba giờ trước, khi đang tập thể dục, chị đột ngột đau dữ dội bụng dưới bên phải, đau từng đợt, lan xuống bẹn. Chị buồn nôn, nôn 3 lần. Kỳ kinh gần nhất cách đây 2 tuần, que thử thai âm tính. Không sốt, không ra máu âm đạo, không tiểu buốt."
