id: h-dizzy-022
set: holdout
title_vi: "Bé trai 8 tuổi đi xe khách qua đèo, chóng mặt, buồn nôn, nôn 2 lần; dừng xe nghỉ 30 phút thì khỏe hẳn"
narrative_vi: "Bé Q., nam, 8 tuổi, ở Hà Nội. Sáng nay cả nhà đi xe khách lên Hà Giang du lịch. Khi xe bắt đầu qua các đoạn đèo dốc quanh co, bé ngồi xem điện thoại một lúc thì kêu chóng mặt, buồn nôn, mặt tái, vã mồ hôi, ngáp liên tục, rồi nôn 2 lần ra thức ăn. Bé không thấy mọi vật quay tròn. Đến điểm dừng nghỉ, bố mẹ cho bé xuống xe hít thở, nằm nghỉ ở chỗ thoáng, uống vài ngụm nước; khoảng 30 phút sau bé hết chóng mặt, hết buồn nôn, đòi ăn và chạy chơi bình thường. Bé không sốt, không đau đầu, không đau bụng, không đau tai, không tiêu chảy, đi đứng vững, nói chuyện bình thường, tỉnh táo. Lần nào đi ô tô đường dài bé cũng bị say xe giống vậy. Những người khác trên xe không ai bị. Bố mẹ muốn biết có cần cho bé đi khám trước khi đi tiếp không."
