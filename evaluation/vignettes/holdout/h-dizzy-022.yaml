source:
  basis: "Say tàu xe (không có trong danh mục) ở trẻ em: chóng mặt, buồn nôn, nôn, mặt tái, vã mồ hôi, ngáp khi đi xe qua đường đèo quanh co và nhìn điện thoại, hết hẳn trong 30 phút sau khi dừng xe, nghỉ chỗ thoáng; lần nào đi xe đường dài cũng bị; không sốt, không đau đầu, đi đứng vững, tỉnh táo, nay ăn chơi bình thường. NHS Dizziness nêu say tàu xe là một nguyên nhân chóng mặt và hướng dẫn tự chăm sóc; trang này khuyên khám bác sĩ (không khẩn) khi chóng mặt không hết, hay tái lại không rõ lý do hoặc kèm triệu chứng khác như nôn, còn ở đây chóng mặt và nôn chỉ xảy ra khi đi xe, có nguyên nhân rõ và hết hẳn khi dừng xe, nên tự chăm sóc là phù hợp (mức 5)."
  references:
    - nhs-dizziness
author: "agent:vignette-holdout"
notes_vi: "Ngoài danh mục, ca nhẹ ở trẻ em. Nôn, buồn nôn, vã mồ hôi xảy ra trên xe cách đây khoảng 1 giờ nên bố mẹ trả lời 'có'; da xanh, môi nhợt hỏi về thiếu máu, nay bé hồng hào nên trả lời 'không'. Trang NHS Motion sickness (chưa có trong danh mục nguồn) chỉ hướng dẫn tự xử trí (ngồi phía trước, nhìn xa, không xem màn hình, nghỉ giữa chặng) và hỏi dược sĩ, không có mục cần đi khám. Danh mục chưa có câu hỏi về đi tàu xe."
