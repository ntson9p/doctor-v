source:
  basis: "Trào ngược dạ dày – thực quản điển hình ở phụ nữ trung niên thừa cân: 10 ngày nóng rát sau xương ức sau ăn, khi cúi hoặc nằm, trào nước chua, đỡ nhanh với thuốc kháng acid, không liên quan gắng sức, không có dấu hiệu báo động (nuốt nghẹn, sụt cân, nôn, phân đen). NHS Chest pain: đau sau ăn, trào thức ăn hoặc dịch đắng, chua thường do trào ngược; gọi 999 khi đau đột ngột không hết, lan tay, hàm, lưng, kèm vã mồ hôi, khó thở. NHS Heartburn and acid reflux: tự điều chỉnh ăn uống, hỏi dược sĩ; khám bác sĩ khi ợ nóng hầu hết các ngày từ 3 tuần trở lên, không đỡ với thuốc không kê đơn, hoặc có dấu hiệu báo động. Chưa đủ 3 tuần, không dấu hiệu báo động nên mức 5 (đồng thuận của Hội Khoa học Tiêu hóa Việt Nam về bệnh trào ngược cũng xếp ợ nóng, trào ngược là triệu chứng điển hình)."
  references:
    - nhs-chest-pain
author: "agent:vignette-holdout"
notes_vi: "Ca thay thế cho ca trào ngược đã chuyển sang bộ dev. Nóng rát sau xương ức được tính là đau ngực (khó chịu ở ngực) nên người bệnh chọn Đau ngực."
