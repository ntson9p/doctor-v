id: h-chest-016
set: holdout
title_vi: "Nữ 47 tuổi, 10 ngày nay nóng rát sau xương ức sau bữa ăn và khi nằm, trào nước chua lên miệng, uống thuốc kháng acid thì đỡ"
narrative_vi: "Chị T., 47 tuổi, bán hàng ở chợ tại Cần Thơ, hơi thừa cân, không hút thuốc, không uống rượu bia, không có thai, không dùng thuốc nội tiết. Mười ngày nay, sau bữa ăn no, nhất là bữa tối có đồ chiên, cà phê hoặc trái cây chua, chị thấy nóng rát sau xương ức, lan lên cổ họng, có lúc trào nước chua lên miệng. Cúi người xuống hoặc nằm ngay sau ăn thì nặng hơn. Mỗi lần nóng rát khoảng 10 phút, lần gần nhất tối qua. Uống thuốc kháng acid dạng gói mua ở hiệu thuốc thì đỡ nhanh. Chị nói không phải cảm giác tức nặng, đè ép. Chị vẫn đi chợ, leo cầu thang, khuân hàng bình thường mà không đau, không khó thở. Chị không vã mồ hôi, không nôn, không nuốt nghẹn, không sụt cân, không đi ngoài phân đen. Chị không bị tăng huyết áp, tiểu đường, chưa được nói có bệnh tim."
