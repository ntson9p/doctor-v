id: h-dizzy-009
set: holdout
title_vi: "Nữ 80 tuổi, 3 ngày nay từng lúc choáng váng, tối sầm mắt cả khi ngồi, mệt, hụt hơi; máy đo báo mạch 36 lần/phút"
narrative_vi: "Bà N., 80 tuổi, ở Thủ Dầu Một (Bình Dương), bị tăng huyết áp, uống một loại thuốc huyết áp mỗi sáng đã nhiều năm. Ba ngày nay bà hay choáng váng, người lả đi; từng lúc mắt tối sầm, phải ngồi hoặc nằm xuống ngay, mỗi lần vài phút, có lúc đang ngồi xem ti vi cũng bị. Cơn đến đột ngột, trước đó không nóng người, không vã mồ hôi, không buồn nôn. Bà không thấy mọi vật quay tròn; đứng dậy thì choáng nhiều hơn. Đi vài bước trong nhà đã mệt, hụt hơi. Sáng nay con trai đo bằng máy đo huyết áp điện tử: mạch 36 lần/phút, huyết áp 150/70 mmHg. Bà không đau ngực, ngồi nghỉ không khó thở, không thấy tim đập nhanh, không nói khó, không méo miệng, không yếu tay chân, vẫn tỉnh táo. Bà không bị đái tháo đường, chưa được nói là có bệnh tim, chưa từng bị như vậy."
