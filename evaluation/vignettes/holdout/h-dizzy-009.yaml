source:
  basis: "Nhịp chậm nặng (nghi block nhĩ thất hoàn toàn) ở người cao tuổi: các cơn choáng, tối sầm mắt suýt ngất xảy ra đột ngột cả khi đang ngồi, không có tiền triệu, mệt và hụt hơi khi gắng sức nhẹ, mạch đo được 36 lần/phút. ESC 2018: nhịp chậm dai dẳng dưới 40 lần/phút lúc thức (không do luyện tập thể thao) là đặc điểm nguy cơ cao loại nặng; ngất khi đang ngồi, không có triệu chứng báo trước cũng là đặc điểm nguy cơ; suýt ngất được xử trí như ngất; người có đặc điểm nguy cơ cao cần được đánh giá tích cực ở bệnh viện. Có thể ngất, ngừng tim trên đường đi nên gọi 115 (mức 1)."
  references:
    - esc-syncope-2018
author: "agent:vignette-holdout"
notes_vi: "Ca khó: người bệnh chọn 'Chóng mặt', đang uống thuốc hạ áp và choáng hơn khi đứng dậy nên dễ nghĩ là hạ huyết áp tư thế; mạch dưới 40 là dấu hiệu then chốt. 'Tối sầm mắt' ở đây là chính cơn suýt ngất, đến đột ngột, không có nóng người, vã mồ hôi, buồn nôn trước đó, nên câu dấu hiệu báo trước chọn 'Không thấy gì'."
