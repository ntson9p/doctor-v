source:
  basis: "Ngộ độc khí CO do đốt than sưởi trong phòng kín mùa đông miền Bắc: đau đầu, buồn nôn, chóng mặt, mệt lả, lú lẫn, người cùng phòng cũng bị; đưa ra chỗ thoáng và gọi cấp cứu (NHS Carbon monoxide poisoning)."
