title_vi: "Nữ 70 tuổi đốt than sưởi trong phòng kín, sáng dậy đau đầu, nôn, lú lẫn"
narrative_vi: "Bà M., 70 tuổi, ở Hà Nội, bị tăng huyết áp. Đêm qua trời rét, hai ông bà đốt bếp than tổ ong để sưởi trong phòng ngủ đóng kín cửa. Sáng nay bà dậy thấy đau đầu nhiều khắp đầu, buồn nôn, nôn 2 lần, choáng váng, mệt lả không đứng vững, nói năng lơ mơ, lẫn lộn. Ông cũng bị đau đầu, buồn nôn. Bà không sốt, không yếu một bên người."
