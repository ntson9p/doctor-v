id: h-chest-015
set: holdout
title_vi: "Nam 27 tuổi, 1 tuần sau cảm cúm, từ hôm qua đau nhói giữa ngực, nằm ngửa và hít sâu đau hơn, ngồi cúi ra trước đỡ, sốt nhẹ"
narrative_vi: "Anh D., 27 tuổi, nhân viên văn phòng ở Hà Nội, khỏe mạnh, không hút thuốc. Khoảng 1 tuần trước anh bị cảm cúm: sốt, đau họng, sổ mũi, đau mỏi người, sau 4 ngày thì đỡ. Từ sáng hôm qua anh đau nhói ở giữa ngực, đau liên tục, tăng khi hít sâu, khi ho và khi nằm ngửa; ngồi dậy cúi người ra trước thì đỡ nhiều. Đêm qua anh phải ngồi ngủ vì nằm thì đau. Anh sốt nhẹ 37,8°C. Đau không lan ra tay, hàm, lưng; không tăng khi đi lại; ấn vào ngực không đau. Anh không khó thở, không vã mồ hôi, không hồi hộp, không ngất, không ho ra máu. Chân không sưng, không đi xa gần đây."
