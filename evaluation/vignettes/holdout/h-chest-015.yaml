source:
  basis: "Viêm màng ngoài tim cấp sau nhiễm vi rút, ngoài danh mục: đau nhói giữa ngực liên tục, tăng khi hít sâu, ho, nằm ngửa, đỡ khi ngồi cúi ra trước, sốt nhẹ, 1 tuần sau cảm cúm; không khó thở, không ngất, không tim nhanh. NHS Pericarditis: đau ngực nhói, như dao đâm thì hẹn khám khẩn hoặc gọi 111; gọi 999 khi đau ngực đột ngột lan tay, lưng, cổ, hàm, kèm khó thở, vã mồ hôi. Nên mức 3 để được làm điện tim, siêu âm tim."
  references:
    - nhs-chest-pain
author: "agent:vignette-holdout"
notes_vi: "Ca ngoài danh mục. Danh mục chưa có câu hỏi về đau ngực đổi theo tư thế (tăng khi nằm, đỡ khi cúi ra trước). Nằm thì đau chứ không khó thở nên câu khó thở khi nằm trả lời 'không'. Trang NHS Pericarditis chưa có trong danh mục nguồn; lời khuyên ghi theo kết quả tìm kiếm ngày 31/10/2026."
