    - byt-qd-2767-2023
    - gold-2026
author: "agent:vignette-holdout"
notes_vi: "Ca không điển hình: nữ, không hút thuốc, chưa từng được chẩn đoán. Hen khởi phát muộn và suy tim là chẩn đoán phân biệt."
