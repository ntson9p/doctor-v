source:
  basis: "Đợt cấp bệnh phổi tắc nghẽn mạn tính chưa được chẩn đoán ở phụ nữ không hút thuốc, phơi nhiễm khói bếp củi nhiều năm (GOLD 2026: khói chất đốt sinh khối là yếu tố nguy cơ quan trọng ở người không hút thuốc): ho khạc đờm mạn tính, mùa lạnh nặng lên, nay khó thở cả khi nghỉ, khò khè, SpO2 90%. 2767/QĐ-BYT Bảng 3.2: khó thở khi nghỉ, SpO2 dưới 92% là chỉ định nhập viện. Còn tỉnh, nói được câu nên đến cơ sở cấp cứu ngay (mức 2)."
