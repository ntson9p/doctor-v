id: h-sob-003
set: holdout
title_vi: "Nữ 72 tuổi không hút thuốc, 40 năm đun bếp củi, ho đờm mùa lạnh nhiều năm; 5 ngày nay khó thở cả khi ngồi, khò khè, SpO2 90%"
narrative_vi: "Bà H., 72 tuổi, ở một xã miền núi tỉnh Lạng Sơn, chưa từng hút thuốc. Hơn 40 năm nay bà nấu ăn bằng bếp củi trong gian bếp kín. Nhiều năm nay cứ đến mùa lạnh bà lại ho khạc đờm, đi lên dốc là hụt hơi, nhưng chưa đi khám, chưa được nói bị bệnh phổi gì. Đợt rét này, 5 ngày nay bà ho nhiều hơn, đờm đặc màu vàng, khò khè, khó thở tăng dần; từ hôm qua ngồi yên cũng thở mệt, phải ngồi cúi người tì tay lên đầu gối, nói được câu nhưng chậm. Cháu bà mua máy kẹp ngón tay, đo SpO2 được 90%. Bà không sốt, không đau ngực, không ho ra máu, chân không phù, vẫn tỉnh táo, trả lời đúng."
