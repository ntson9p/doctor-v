id: h-abd-058
set: holdout
title_vi: "Nữ 19 tuổi đái tháo đường típ 1 tự giảm, bỏ liều insulin khi bị cảm: khát, tiểu nhiều, đau khắp bụng, nôn liên tục, thở nhanh sâu, hơi thở mùi trái cây, đường huyết báo 'HI'"
narrative_vi: "Em M., nữ, 19 tuổi, sinh viên ở Hà Nội, bị đái tháo đường típ 1 từ năm 14 tuổi, tiêm insulin hằng ngày. Ba ngày trước em bị cảm, sổ mũi, ăn kém nên tự giảm liều insulin, có hôm bỏ mũi tiêm vì sợ hạ đường huyết. Từ hôm qua em khát nước liên tục, đi tiểu rất nhiều, rất mệt. Từ sáng nay em đau âm ỉ khắp bụng, buồn nôn, nôn 5 lần, uống nước vào lại nôn ra. Bạn cùng phòng thấy em thở nhanh và sâu, hơi thở có mùi như trái cây chín. Máy đo đường huyết báo 'HI' (quá cao). Em vẫn tỉnh, trả lời đúng, tự đi lại được. Không sốt, không tiêu chảy, không tiểu buốt, không đau ngực. Kinh nguyệt đều, không có thai."
