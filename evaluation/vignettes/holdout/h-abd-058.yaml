source:
  basis: "Nhiễm toan ceton ở nữ 19 tuổi đái tháo đường típ 1 tự giảm, bỏ liều insulin khi bị cảm: khát nhiều, tiểu nhiều, đau bụng, nôn liên tục, thở nhanh sâu, hơi thở mùi trái cây, đường huyết 'HI', còn tỉnh. NHS Diabetic ketoacidosis: có triệu chứng nhiễm toan ceton (khát, tiểu nhiều, đau bụng, nôn, thở sâu, hơi thở mùi trái cây) thì gọi 999 hoặc đến cấp cứu; yếu tố khởi phát gồm ốm, thiếu insulin. ADA 2024 (Umpierrez và cộng sự): buồn nôn, nôn, đau bụng gặp trên 50%, thở Kussmaul có mùi trái cây; là cấp cứu đe dọa tính mạng. Còn tỉnh táo nên mức 2."
  references:
    - nhs-diabetic-ketoacidosis
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC11272983/"
author: "agent:vignette-holdout"
notes_vi: "Ca điển hình. Danh mục chưa có câu hỏi về bỏ hoặc giảm liều insulin, đo xeton."
