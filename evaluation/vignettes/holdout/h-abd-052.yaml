title_vi: "Nữ 27 tuổi có u nang buồng trứng phải 6 cm đã biết, đột ngột đau dữ dội bụng dưới phải khi đang tập nhảy, nôn 2 lần, không chậm kinh"
narrative_vi: "Chị N., 27 tuổi, nhân viên văn phòng ở TP.HCM. Hai tháng trước đi khám phụ khoa, bác sĩ siêu âm thấy u nang buồng trứng phải khoảng 6 cm, hẹn theo dõi. Khoảng 3 giờ trước, đang tập nhảy ở phòng tập, chị đột ngột đau dữ dội ở bụng dưới bên phải, đau liên tục, phải ngồi bệt xuống. Chị buồn nôn, đã nôn 2 lần. Đi lại hay ngồi xe xóc thì đau tăng. Không sốt, không tiêu chảy, không tiểu buốt, không ra máu âm đạo, khí hư bình thường. Kinh nguyệt đều, có kinh lần cuối cách đây 2 tuần, không chậm kinh; hai vợ chồng dùng bao cao su, chị không nghĩ mình có thai. Trước đây chị chưa từng đau như vậy."
