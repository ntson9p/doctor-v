source:
  basis: "Xoắn phần phụ ở nữ 27 tuổi có u nang buồng trứng phải 6 cm đã biết: đau bụng dưới phải đột ngột, dữ dội khi đang vận động mạnh, kèm buồn nôn, nôn; không chậm kinh, không sốt, không ra máu âm đạo. Winton và Yamoah (BMJ Case Rep 2020): xoắn buồng trứng là cấp cứu, thường biểu hiện bằng đau đột ngột, dữ dội kèm nôn, cần mổ sớm để bảo tồn buồng trứng. NHS Ovarian cyst: nang xoắn hoặc vỡ gây đau vùng chậu đột ngột, dữ dội. NHS Stomach ache: đau bụng đột ngột, dữ dội thì đến cấp cứu ngay."
  references:
    - nhs-stomach-ache
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC7228144/"
    - "https://www.nhs.uk/conditions/ovarian-cyst/"
