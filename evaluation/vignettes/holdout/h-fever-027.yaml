title_vi: "Nữ 82 tuổi, lú lẫn, bỏ ăn, tiểu nhiều lần, nước tiểu hôi, chỉ sốt nhẹ"
narrative_vi: "Bà T., 82 tuổi, ở Nam Định, bị đái tháo đường và tăng huyết áp, sống cùng con gái. Ba ngày nay bà đi tiểu nhiều lần, nước tiểu đục và hôi. Từ hôm qua bà lú lẫn, không nhận ra cháu, bỏ ăn, mệt lả không tự ngồi dậy được. Người hơi ấm, đo được 37,8°C. Hôm nay bà đi tiểu rất ít, tay chân lạnh. Con gái không biết bà có đau bụng hay tiểu buốt không vì bà không nói rõ được."
