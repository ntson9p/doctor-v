author: "agent:vignette-holdout"
notes_vi: "Người bệnh chọn 'Đau bụng' vì đã hết sốt, dễ tưởng là đau dạ dày. Câu 'Có sốt không?' được trả lời 'có' vì đã sốt 4 ngày trong đợt bệnh này."
