source:
  basis: "Sốt xuất huyết Dengue ở giai đoạn nguy hiểm, ngay khi vừa hết sốt (ngày 4–5): đau bụng vùng gan, nôn liên tục, chảy máu chân răng, mệt lả, kèm dấu hiệu sốc như tay chân lạnh ẩm, choáng khi ngồi dậy, tiểu ít (2760/QĐ-BYT; CDC: giai đoạn nguy hiểm bắt đầu khi hết sốt). Sốc sốt xuất huyết cần cấp cứu ngay nên gọi 115 hoặc nhờ người đưa đến cấp cứu."
