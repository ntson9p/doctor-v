id: h-abd-046
set: holdout
title_vi: "Nữ 23 tuổi, sốt cao 4 ngày vừa hạ, nay đau bụng, nôn liên tục, chảy máu chân răng, tay chân lạnh, choáng"
narrative_vi: "Chị V., 23 tuổi, công nhân ở Cần Thơ; xóm trọ đang có mấy người bị sốt xuất huyết. Chị sốt cao 39,5–40°C liên tục 4 ngày, nhức đầu, đau sau hốc mắt, đau nhức cơ khớp. Từ chiều qua chị hết sốt, tưởng đã khỏi, nhưng từ đêm qua chị đau bụng vùng dưới sườn phải và trên rốn, ngày càng đau nhiều. Sáng nay chị nôn 5 lần, uống nước vào lại nôn ra. Đánh răng thì chảy máu chân răng. Chị mệt lả, chỉ nằm, ngồi dậy là choáng váng tối sầm mắt; bạn cùng phòng sờ thấy tay chân chị lạnh, rịn mồ hôi. Từ sáng đến giờ chị mới đi tiểu 1 lần, rất ít. Chị vẫn trả lời đúng câu hỏi, không khó thở. Chị không có thai, không nôn ra máu, không đi ngoài phân đen, không tiêu chảy."
