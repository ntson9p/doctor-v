title_vi: "Nam 45 tuổi vừa từ châu Phi về, sốt 2 ngày không thành cơn, tiêu chảy"
narrative_vi: "Anh S., 45 tuổi, ở Hà Nội. Anh về nước được 9 ngày sau 2 năm làm xây dựng ở Angola, không uống thuốc phòng sốt rét. Hai ngày nay anh sốt 38,5–38,9°C, có lúc ớn lạnh run, nhưng không thành cơn rõ ràng. Anh đau đầu, đau mỏi người, mệt, chán ăn, buồn nôn, đi ngoài phân lỏng 3–4 lần mỗi ngày, không có máu. Anh không vàng da, không lú lẫn, không ho."
