id: h-dizzy-005
set: holdout
title_vi: "Nam 68 tuổi tăng huyết áp, đái tháo đường, hút thuốc lào; sáng nay 20 phút chóng mặt, nói ngọng, tê tay phải, méo miệng rồi tự hết"
narrative_vi: "Ông P., 68 tuổi, ở Hà Nội, bị tăng huyết áp và đái tháo đường, uống thuốc hằng ngày, hút thuốc lào nhiều năm. Khoảng 8 giờ sáng nay, đang ngồi uống trà, ông đột ngột chóng mặt, thấy mọi vật quay tròn, nói ngọng líu lưỡi, tay phải tê bì, cầm chén không chắc; vợ ông thấy miệng ông méo sang một bên. Khoảng 20 phút sau mọi triệu chứng tự hết hoàn toàn. Bây giờ là 10 giờ sáng, ông nói rõ, cười hai bên miệng đều, giơ hai tay đều, đi lại vững, không còn chóng mặt, chỉ hơi mệt. Ông không đau đầu, không buồn nôn, không nhìn đôi, không ngất, không đau ngực, không hồi hộp. Con trai đo huyết áp được 165/95 mmHg. Trước đây ông chưa từng bị như vậy."
