source:
  basis: "Cơn thiếu máu não thoáng qua: đột ngột chóng mặt kèm nói khó, tê tay phải, méo miệng, hết hoàn toàn sau 20 phút, ở người có tăng huyết áp, đái tháo đường, hút thuốc. NHS TIA: triệu chứng giống đột quỵ, hết trong 24 giờ, là dấu hiệu báo trước đột quỵ; cần được đánh giá ở bệnh viện và khám chuyên khoa trong 24 giờ kể từ khi khởi phát. 3312/QĐ-BYT (2024): nguy cơ tái phát sớm rất cao, điều trị dự phòng ngay, tối ưu trong 24 giờ đầu. Triệu chứng đã hết, người bệnh ổn định nên mức đúng là đến cấp cứu ngay (mức 2); gọi 115 cũng an toàn."
  references:
