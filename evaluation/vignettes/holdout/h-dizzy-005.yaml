author: "agent:vignette-holdout"
notes_vi: "Các câu sàng lọc đột quỵ hỏi tình trạng hiện tại nên trả lời 'không'; triệu chứng đã tự hết được ghi ở câu 'yếu, tê nửa người hoặc nói khó, dù đã tự hết'."
