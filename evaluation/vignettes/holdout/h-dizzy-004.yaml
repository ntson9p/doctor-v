id: h-dizzy-004
set: holdout
title_vi: "Nữ 67 tuổi tăng huyết áp, đái tháo đường, sau cảm chóng mặt quay liên tục từ chiều qua, nôn, vẫn tự đi được"
narrative_vi: "Bà L., 67 tuổi, ở Cần Thơ, bị tăng huyết áp và đái tháo đường, uống thuốc huyết áp và metformin đều. Tuần trước bà bị sổ mũi, ho nhẹ vài ngày rồi khỏi. Từ chiều hôm qua bà chóng mặt quay cuồng liên tục; quay đầu thì càng chóng mặt, nằm yên vẫn còn quay. Bà buồn nôn, nôn 2 lần, từ hôm qua chỉ ăn được ít cháo, vẫn uống được nước. Bà đi chậm, hơi xiêu vẹo nhưng vẫn tự đứng dậy và tự đi được vào nhà vệ sinh, không cần vịn hay người đỡ. Bà không đau đầu, không ù tai, không nghe kém, không nhìn đôi, không nói ngọng, không méo miệng, không tê yếu tay chân, không sốt, không ngất, vẫn tỉnh táo. Con gái đo huyết áp sáng nay được 150/90 mmHg. Nhà không có máy đo đường huyết; bà chưa ăn uống đồ ngọt để thử."
