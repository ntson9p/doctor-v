notes_vi: "Ca khó: cùng bệnh với h-dizzy-003 nhưng mức xử trí khẩn hơn vì tuổi và yếu tố nguy cơ mạch máu. Ăn ít do nôn nên trả lời 'có' câu bỏ bữa; chưa thử ăn đồ ngọt."
