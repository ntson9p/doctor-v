source:
  basis: "Viêm dây thần kinh tiền đình ở người cao tuổi có nhiều yếu tố nguy cơ mạch máu: hội chứng tiền đình cấp (chóng mặt quay liên tục, nôn, đi không vững) sau nhiễm vi rút, vẫn tự đi được, không nghe kém, không dấu hiệu thần kinh. GRACE-3: hội chứng tiền đình cấp cần người được đào tạo khám HINTS để phân biệt đột quỵ với nguyên nhân ở tai trong, chụp cộng hưởng từ khi HINTS gợi ý trung ương hoặc không rõ. 3312/QĐ-BYT (2024): nhồi máu não có thể biểu hiện chóng mặt, thất điều; viêm mê đạo có thể nhầm với đột quỵ tiểu não. Ở người 67 tuổi có tăng huyết áp, đái tháo đường, chưa được khám HINTS thì chưa loại trừ được đột quỵ tuần hoàn sau, nên cần đến cấp cứu ngay (mức 2), dù bệnh thật là viêm dây thần kinh tiền đình."
  references:
    - grace3-dizziness-2023
    - byt-qd-3312-2024
    - "https://www.nhs.uk/conditions/labyrinthitis/"
