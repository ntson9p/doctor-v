id: h-palp-002
set: holdout
title_vi: "Nam 71 tuổi hay uống thuốc giảm đau xương khớp, 2 tháng nay tim đập nhanh, hụt hơi khi đi bộ, xanh xao, sụt 4 kg"
narrative_vi: "Ông D., 71 tuổi, làm vườn ở Vĩnh Long, bị thoái hóa khớp gối, hai năm nay hay tự mua thuốc giảm đau xương khớp uống. Khoảng hai tháng nay ông thấy tim đập nhanh, đập mạnh mỗi khi đi bộ ra chợ hay làm vườn, phải dừng lại nghỉ; đi một đoạn ngắn đã hụt hơi, mệt. Thỉnh thoảng đứng dậy nhanh ông thấy choáng vài giây. Người nhà thấy ông xanh xao, môi và mí mắt nhợt. Ông ăn kém, sụt khoảng 4 kg trong 3 tháng. Ông không để ý màu phân, chưa từng nôn ra máu, không đau bụng. Ông không đau ngực, không ngất, ngồi nghỉ thì không khó thở, không sốt, không phù chân. Ông chưa từng được nói là bị thiếu máu, không bị tăng huyết áp, không có bệnh tim đã biết, không uống aspirin hay thuốc chống đông, đã bỏ thuốc lá 10 năm."
