source:
  basis: "Thiếu máu ở người cao tuổi, nghi do mất máu tiêu hóa rỉ rả vì dùng thuốc giảm đau chống viêm kéo dài: hồi hộp và hụt hơi khi gắng sức, mệt, da xanh, môi và mí mắt nhợt, choáng khi đứng dậy nhanh, ăn kém, sụt cân. NHS Iron deficiency anaemia: mệt, khó thở, hồi hộp, da nhợt; chảy máu dạ dày, ruột (kể cả do thuốc giảm đau chống viêm) là nguyên nhân hay gặp; nghĩ mình bị thiếu máu thì đi khám bác sĩ. NHS Heart palpitations: hồi hộp tái diễn nhưng vẫn khỏe thì đi khám bác sĩ (không khẩn). Không đau ngực, không ngất, không khó thở khi nghỉ, không nôn ra máu nên mức 4; thiếu máu kèm sụt cân ở người cao tuổi cần được khám sớm để tìm nguồn chảy máu và loại trừ ung thư đường tiêu hóa."
  references:
    - "https://www.nhs.uk/conditions/iron-deficiency-anaemia/"
    - nhs-heart-palpitations
author: "agent:vignette-holdout"
notes_vi: "Ca khó ở người cao tuổi: biểu hiện là hồi hộp khi gắng sức; người bệnh không để ý màu phân nên câu phân đen trả lời 'không rõ'."
