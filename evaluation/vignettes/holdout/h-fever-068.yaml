id: h-fever-068
set: holdout
title_vi: "Nam 70 tuổi đái tháo đường, 4 tuần sốt nhẹ về chiều, mệt, chán ăn, sụt 5 kg, ho khan húng hắng 3 tuần, không ra mồ hôi đêm"
narrative_vi: "Ông B., 70 tuổi, ở Thái Nguyên, bị đái tháo đường típ 2 10 năm, uống thuốc hằng ngày; ông hút thuốc lào 30 năm, bỏ được 10 năm. Khoảng 4 tuần nay chiều nào ông cũng hâm hấp sốt, đo được 37,5–38,2°C, không rét run. Ông mệt, chán ăn, 2 tháng nay sụt khoảng 5 kg. Ba tuần nay ông ho khan húng hắng, ông cho là do trời hanh nên không để ý. Ông không ra mồ hôi đêm, không khó thở, không đau ngực, không ho ra máu. Ông không tiểu buốt, không đau bụng, không tiêu chảy, không vàng da, không nổi hạch, không nổi ban. Ông không biết có tiếp xúc với ai bị lao không. Ông không đi rừng, chưa tự xét nghiệm COVID-19."
