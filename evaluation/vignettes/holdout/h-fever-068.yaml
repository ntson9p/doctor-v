    - byt-qd-162-2024
author: "agent:vignette-holdout"
notes_vi: "Ca không điển hình: người bệnh chọn Sốt, triệu chứng hô hấp ít, không mồ hôi đêm, không rõ tiếp xúc nguồn lây."
