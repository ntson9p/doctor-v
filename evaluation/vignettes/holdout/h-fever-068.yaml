source:
  basis: "Lao phổi ở người cao tuổi đái tháo đường, biểu hiện chủ yếu bằng sốt kéo dài: 4 tuần sốt nhẹ về chiều, mệt, chán ăn, sụt cân, ho khan 3 tuần mà người bệnh không để ý, không ra mồ hôi đêm. 162/QĐ-BYT (2024), Phần II mục 1.1 và 1.3: sốt kéo dài trên 2 tuần không rõ nguyên nhân, ho trên 2 tuần, gầy sút, kém ăn là triệu chứng nghi lao; đái tháo đường là yếu tố nguy cơ. Tỉnh táo, không khó thở, không ho ra máu nên đặt lịch khám trong vài ngày."
