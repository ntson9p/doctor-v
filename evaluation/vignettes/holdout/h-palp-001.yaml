id: h-palp-001
set: holdout
title_vi: "Nam 55 tuổi tiêm insulin, mới tăng liều, bỏ bữa trưa thì hồi hộp, tim đập nhanh, run, vã mồ hôi; đường huyết 3,1 mmol/L, uống nước đường đỡ hẳn"
narrative_vi: "Ông T., 55 tuổi, bán tạp hóa ở Biên Hòa (Đồng Nai), bị đái tháo đường típ 2 tám năm, tiêm insulin hai lần mỗi ngày và uống metformin; hai tuần trước bác sĩ tăng liều insulin. Sáng nay ông tiêm insulin, ăn sáng ít, rồi bận khách nên bỏ bữa trưa. Khoảng 2 giờ chiều ông thấy hồi hộp, tim đập nhanh thình thịch, run tay, vã mồ hôi, chóng mặt, cồn cào đói. Ông đo đường huyết bằng máy ở nhà được 3,1 mmol/L, uống ngay một cốc nước đường, khoảng 10 phút sau thấy đỡ hẳn. Tuần này ông đã bị 3 lần giống vậy, lần nào ăn kẹo hoặc uống nước ngọt cũng đỡ. Hiện ông tỉnh táo, nói chuyện bình thường, không đau ngực, không khó thở, không ngất, không yếu tay chân. Ông không bị tăng huyết áp, không có bệnh tim đã biết."
