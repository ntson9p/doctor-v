source:
  basis: "Hạ đường huyết nhẹ, tái diễn ở người tiêm insulin mới tăng liều, xảy ra khi bỏ bữa: hồi hộp, tim nhanh, run, vã mồ hôi, chóng mặt, đói, đường huyết 3,1 mmol/L, đỡ hẳn trong 10–15 phút sau khi uống nước đường; tuần này đã 3 lần. NHS Low blood sugar: hạ đường huyết thường là dưới 4 mmol/L, hay gặp ở người dùng insulin; triệu chứng gồm đói, chóng mặt, vã mồ hôi, run, hồi hộp; tự xử trí bằng đồ ngọt rồi đo lại; hay bị hạ đường huyết thì đi khám bác sĩ (không khẩn) để chỉnh thuốc. NHS Heart palpitations: đã hết hồi hộp, vẫn khỏe nhưng hay tái lại thì đi khám bác sĩ. Mức 4."
  references:
    - nhs-hypoglycaemia
    - nhs-heart-palpitations
author: "agent:vignette-holdout"
notes_vi: "Ca điển hình. Người bệnh chọn 'Hồi hộp' vì tim đập nhanh là triệu chứng làm ông lo nhất."
