source:
  basis: "Rung nhĩ mới phát hiện, tần số thất nhanh, ở người cao tuổi tăng huyết áp: tim nhanh không đều liên tục 3 ngày, mạch 128 lần/phút, khó thở khi gắng sức, mệt, hơi choáng. NHS Atrial fibrillation: tim nhanh hoặc không đều kèm khó thở, chóng mặt thì gọi 999; NHS Heart palpitations: đang hồi hộp và cơn không hết, kèm khó thở hoặc choáng thì gọi 999 hoặc đến cấp cứu. Huyết áp còn ổn, không đau ngực, không ngất nên đến cơ sở cấp cứu ngay (mức 2)."
