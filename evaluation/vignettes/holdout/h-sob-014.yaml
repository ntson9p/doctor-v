title_vi: "Nữ 78 tuổi tăng huyết áp, 3 ngày tim đập loạn không đều, đi lại là hụt hơi, mạch 128 không đều"
narrative_vi: "Bà G., 78 tuổi, ở Quảng Ngãi, bị tăng huyết áp nhiều năm, uống thuốc đều. Ba ngày nay bà thấy tim đập nhanh, loạn xạ, không đều, liên tục không dứt. Bà mệt hơn, đi lại trong nhà, ra sân là hụt hơi, thở dốc phải ngồi nghỉ; ngồi yên thì đỡ. Bà hơi choáng khi đi lại nhưng không ngất. Con trai đo bằng máy đo huyết áp điện tử: huyết áp 138/86 mmHg, mạch 128 lần/phút, máy báo nhịp không đều. Bà không đau ngực, không tức ngực, không vã mồ hôi, không sốt, không ho, nằm không khó thở hơn, chân không phù. Bà không yếu tay chân, không méo miệng, nói rõ. Trước đây chưa được nói là có bệnh tim hay rung nhĩ. Bà không uống rượu, cà phê."
