narrative_vi: "Chị V., 35 tuổi, kế toán ở Thành phố Hồ Chí Minh. Nhiều năm nay, mỗi tháng chị bị vài lần đau đầu như có vòng bó chặt quanh đầu, đau cả hai bên, mức nhẹ, vẫn làm việc được. Lần này đau từ trưa đến giờ khoảng 6 tiếng, đúng dịp cuối tháng căng thẳng, thức khuya. Chị không buồn nôn, không sợ ánh sáng hay tiếng ồn, đi lại không làm đau tăng."
