title_vi: "Bé trai 12 tuổi đột ngột đau dữ dội bụng dưới phải sát bẹn, nôn 2 lần; mẹ nghĩ đau ruột thừa, bé ngại không nói và không cho xem bìu"
narrative_vi: "Bé T., nam, 12 tuổi, ở Pleiku (Gia Lai). Khoảng 4 giờ trước, đang ngồi học bài, bé đột ngột kêu đau bụng dưới, chỉ vào vùng bụng dưới bên phải sát bẹn, đau nhiều đến mức phải nằm co. Bé nôn 2 lần, bỏ bữa trưa. Mẹ nghĩ bé bị đau ruột thừa. Khi mẹ hỏi có đau ở 'chỗ kín' không, bé ngượng, lắc đầu nói không biết và không cho mẹ xem. Bé không sốt, không tiêu chảy, không tiểu buốt, sáng nay đi ngoài bình thường. Bé không bị ngã hay va đập. Bé vẫn tỉnh táo, trả lời rõ ràng."
