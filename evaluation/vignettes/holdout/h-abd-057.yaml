source:
  basis: "Xoắn tinh hoàn phải ở bé trai 12 tuổi chỉ kể đau bụng dưới phải đột ngột, dữ dội và nôn; bé ngại, không cho xem bìu. EAU Paediatric Urology (2026): bìu cấp là cấp cứu tiết niệu nhi, hay gặp nhất do xoắn tinh hoàn, đỉnh quanh tuổi dậy thì; đau đột ngột kèm buồn nôn, nôn là điển hình. NHS Testicle pain: đau tinh hoàn kèm đau bụng, nôn thì đến cấp cứu ngay; NHS Stomach ache: đau bụng đột ngột, dữ dội thì đến cấp cứu. Ở trẻ trai đau bụng dưới phải luôn hỏi kỹ và xem bìu."
  references:
    - eau-paediatric-urology-2026
    - nhs-testicle-pain
    - nhs-stomach-ache
author: "agent:vignette-holdout"
notes_vi: "Chẩn đoán cuối cùng của ca giả định là xoắn tinh hoàn phải. Câu hỏi về bìu được trả lời 'không rõ' vì trẻ ngại, đúng tình huống câu hỏi đã lường trước. Viêm ruột thừa là chẩn đoán phân biệt chính nhưng không đưa vào danh sách chấp nhận: ca dùng để đo việc app có giữ xoắn tinh hoàn trong danh sách khi người bệnh không nói về bìu."
