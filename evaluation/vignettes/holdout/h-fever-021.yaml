title_vi: "Nam 60 tuổi bị đái tháo đường, vết thương chân nhiễm trùng, sốt rét run, thở nhanh, lẫn lộn"
narrative_vi: "Ông Đ., 60 tuổi, ở Bến Tre, bị đái tháo đường nhiều năm. Một tuần trước ông giẫm phải đinh, vết thương ở bàn chân trái sưng đỏ, chảy mủ. Từ hôm qua ông rét run, sốt 39,6°C. Hôm nay ông thở nhanh, mệt lả không tự đứng dậy được, tay chân lạnh, da nổi vân tím, từ sáng chỉ đi tiểu rất ít. Vợ ông thấy ông nói năng lẫn lộn."
