title_vi: "Nam 70 tuổi, sốt hơn 1 tuần, đau đầu, ban đỏ ở thân, hay phát cỏ kiếm củi"
narrative_vi: "Ông B., 70 tuổi, ở Hòa Bình, bị tăng huyết áp. Ông hay vào đồi kiếm củi, phát cỏ vườn. Đã hơn 1 tuần ông sốt 38–38,8°C, đau đầu âm ỉ, mỏi người, mệt, chán ăn, ho khan. Hai ngày nay trên ngực và bụng có ban đỏ nhạt, ấn vào thì mất. Ông không tự xem được lưng và vùng kín nên không biết có vết loét không. Ông tỉnh táo, không khó thở."
