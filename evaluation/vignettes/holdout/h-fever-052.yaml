source:
  basis: "Viêm màng não mủ ở nhũ nhi: sốt cao, khóc thét khi bế, nôn, bỏ bú, thóp phồng, li bì (NHS Meningitis; bệnh sử thóp phồng có LR khoảng 8 theo Curtis 2010). Li bì và không bú được là dấu hiệu nguy hiểm toàn thân theo IMCI, và NICE NG240 yêu cầu chuyển viện cấp cứu khi nghi viêm màng não vi khuẩn, nên gọi 115 ngay."
