id: h-fever-052
set: holdout
title_vi: "Bé gái 7 tháng, sốt cao 2 ngày, khóc thét khi bế, nôn, bỏ bú, thóp phồng, nay li bì"
narrative_vi: "Bé L., gái, 7 tháng, ở Hà Tĩnh, được tiêm chủng theo lịch. Tuần trước bé sổ mũi, ho nhẹ, nay đã hết. Từ sáng hôm qua bé sốt cao, mẹ đo 39,3°C, uống thuốc hạ sốt chỉ hạ được một lúc. Bé quấy khóc, khóc thét như đau mỗi khi bế lên, nôn 3 lần, bú kém hẳn, từ trưa nay gần như không chịu bú. Chiều nay bé li bì, gọi phải lay mới mở mắt rồi lại lịm đi. Mẹ sờ thấy thóp trên đỉnh đầu phồng căng hơn mọi ngày. Tã ướt ít hơn mọi ngày. Bé chưa co giật, không nổi ban, không thở gấp, không tiêu chảy, tay chân không lạnh."
