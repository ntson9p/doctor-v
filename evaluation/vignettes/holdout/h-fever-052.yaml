notes_vi: "Ở nhũ nhi thường không đánh giá được cứng gáy; thóp phồng và li bì là dấu hiệu chính. Nhiễm khuẩn huyết được chấp nhận vì hai bệnh hay đi cùng nhau ở trẻ nhỏ."
