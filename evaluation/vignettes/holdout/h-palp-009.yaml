source:
  basis: "Ngoại tâm thu lành tính do cà phê và thiếu ngủ, mới bị một lần: vài lần tim hẫng một nhịp rồi đập mạnh một cái, mỗi lần 1–2 giây, chỉ trong một buổi tối sau khi uống cà phê đậm và thức khuya; người trẻ khỏe, không có triệu chứng kèm, không bệnh tim, gia đình không có người bệnh tim hay đột tử. NHS Heart palpitations: hồi hộp thường vô hại, hay do cà phê, thiếu ngủ, căng thẳng; chỉ cần đi khám bác sĩ khi hay tái lại, kéo dài hơn vài phút, có bệnh tim hoặc gia đình có người bệnh tim; gọi cấp cứu khi kèm đau ngực, khó thở, choáng, ngất. Không có các dấu hiệu đó nên tự theo dõi, giảm cà phê, ngủ đủ (mức 5)."
  references:
    - nhs-heart-palpitations
author: "agent:vignette-holdout"
notes_vi: "Ca nhẹ, mới bị một lần, có yếu tố khởi phát rõ (cà phê đậm, thức khuya) và đã hết: mức tự theo dõi. Khác h-palp-010 là ngoại tâm thu tái diễn nhiều tuần cần đi khám."
