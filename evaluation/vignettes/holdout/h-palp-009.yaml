id: h-palp-009
set: holdout
title_vi: "Nam 22 tuổi, tối qua sau 2 ly cà phê đậm để thức khuya, tim hẫng nhịp vài lần trong nửa giờ, sáng nay hết, vẫn khỏe"
narrative_vi: "Anh B., 22 tuổi, sinh viên ở Cần Thơ, đang mùa thi, mấy hôm nay ngủ ít. Tối qua anh uống 2 ly cà phê đen đậm để thức đến 2 giờ sáng ôn bài. Khoảng 11 giờ đêm, lúc đang ngồi học, anh thấy tim như hẫng một nhịp rồi đập thịch mạnh một cái, mỗi lần chỉ 1–2 giây, bị vài lần trong khoảng nửa giờ rồi thôi. Sáng nay không còn bị. Anh vẫn khỏe, đi lại, chơi thể thao bình thường không mệt, không đau ngực, không khó thở, không choáng, không ngất. Trước đây anh chưa bị như vậy. Trong nhà không ai bị bệnh tim hay đột tử. Anh không sụt cân, không run tay, không sợ nóng, không uống rượu, không hút thuốc, không dùng thuốc gì. Anh chưa đo mạch."
