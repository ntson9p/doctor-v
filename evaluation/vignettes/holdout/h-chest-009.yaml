title_vi: "Nam 71 tuổi từng hút thuốc 35 năm, 6 tuần đau âm ỉ ngực phải liên tục, ho khan, mệt, chán ăn, sụt 4 kg"
narrative_vi: "Ông N., 71 tuổi, ở Hội An (Quảng Nam), hút thuốc lá 35 năm, bỏ được 8 năm. Khoảng 6 tuần nay ông đau âm ỉ ở ngực phải, đau liên tục, không tăng khi đi lại, không tăng khi hít thở hay khi ấn vào. Một tháng nay ông ho khan húng hắng. Ông mệt, ăn không ngon, 2 tháng nay sụt khoảng 4 kg. Ông không sốt, không ra mồ hôi đêm, không ho ra máu, không khó thở, vẫn đi bộ được. Da ngực bình thường. Ông không bị tăng huyết áp, tiểu đường, chưa được nói có bệnh tim, bệnh phổi. Trong nhà không ai bị lao."
