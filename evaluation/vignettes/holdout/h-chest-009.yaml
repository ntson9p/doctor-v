source:
  basis: "Gợi ý ung thư phổi ở người cao tuổi từng hút thuốc lâu năm, biểu hiện bằng đau ngực: đau âm ỉ một bên ngực liên tục 6 tuần, ho khan 1 tháng, mệt, chán ăn, sụt cân, không sốt, không ho ra máu. NICE NG12: người từ 40 tuổi từng hút thuốc có một trong các triệu chứng ho, mệt, khó thở, đau ngực, sụt cân, chán ăn không rõ nguyên nhân thì chụp X-quang phổi khẩn trong 2 tuần. NHS Chest pain: đau ngực âm ỉ, không cấp tính thì khám bác sĩ gia đình. Nên mức 4."
