source:
  basis: "Phản vệ sau uống thuốc ở người cao tuổi, không có triệu chứng hô hấp rõ: 20 phút sau viên kháng sinh đầu tiên có tức ngực, mề đay, đau quặn bụng, nôn, choáng như sắp ngất, huyết áp 85/55 mmHg. 51/2017/TT-BYT Phụ lục I, bệnh cảnh 2: ít nhất 2 trong 4 nhóm (da, niêm mạc; hô hấp gồm tức ngực; tụt huyết áp; tiêu hóa) xuất hiện vài phút đến vài giờ sau tiếp xúc; Phụ lục II độ II–III; Điều 6: tiêm adrenalin ngay. NHS Anaphylaxis: choáng, ngất, da lạnh sau dùng thuốc thì gọi 999. Mức 1."
  references:
    - byt-tt-51-2017
    - nhs-anaphylaxis
author: "agent:vignette-holdout"
notes_vi: "Ca không điển hình: không khó thở, không sưng môi lưỡi nên câu sàng lọc phản vệ đầu trả lời 'không'. Câu huyết áp không có lựa chọn huyết áp thấp, 85/55 mmHg chỉ chọn được 'dưới 140/90'."
