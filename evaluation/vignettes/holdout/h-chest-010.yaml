id: h-chest-010
set: holdout
title_vi: "Nam 67 tuổi uống viên kháng sinh mới 20 phút trước, tức nặng ngực, nổi mề đay ngứa, choáng khi đứng, nôn, đau quặn bụng"
narrative_vi: "Ông T., 67 tuổi, ở Huế, bị đau răng nên mua kháng sinh ở hiệu thuốc theo lời khuyên của người bán. Khoảng 20 phút sau khi uống viên đầu tiên, ông thấy tức nặng ở giữa ngực, khó chịu, ngứa ran khắp người, ở ngực và cổ nổi nhiều mảng đỏ gồ ngứa. Ông đau quặn bụng, buồn nôn, nôn 1 lần. Lúc đứng dậy đi vệ sinh ông choáng, tối sầm mắt như sắp ngất, phải ngồi xuống. Ông không thấy khó thở, môi và lưỡi không sưng, không khò khè. Ông lo bị đau tim, chưa nghĩ tới thuốc. Con trai đo huyết áp được 85/55 mmHg, mạch 112 lần/phút. Ông không bị tăng huyết áp, tiểu đường, chưa có bệnh tim, không hút thuốc."
