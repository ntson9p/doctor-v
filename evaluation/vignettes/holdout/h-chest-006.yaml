source:
  basis: "Hội chứng đau nhói trước tim (precordial catch, một dạng đau thành ngực lành tính) ở trẻ vị thành niên: đau nhói đột ngột, khu trú, vài chục giây, xảy ra lúc nghỉ, tăng khi hít vào, không liên quan gắng sức, tự hết; không khó thở, hồi hộp, ngất, tiền sử gia đình đột tử. Các tổng quan về hội chứng này: lành tính, chẩn đoán dựa vào bệnh sử, không cần điều trị; đi khám nếu tính chất đau thay đổi hoặc có triệu chứng khác. NHS Chest pain: đau thoáng qua, đã hết nhanh không phải cấp cứu. Nên mức 5."
  references:
    - nhs-chest-pain
author: "agent:vignette-holdout"
notes_vi: "Ca khó: trẻ vị thành niên, đau ngực kiểu màng phổi nhưng chỉ vài giây. Đau khi gắng sức, ngất hoặc hồi hộp ở trẻ thì phải khám tim."
