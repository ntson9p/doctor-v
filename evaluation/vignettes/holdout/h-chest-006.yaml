id: h-chest-006
set: holdout
title_vi: "Nữ 13 tuổi, 3 tuần nay hay đột ngột đau nhói dưới vú trái vài chục giây khi ngồi học, hít vào đau hơn, rồi tự hết"
narrative_vi: "Em M., nữ, 13 tuổi, học sinh lớp 8 ở Hà Nội, khỏe mạnh, chơi cầu lông đều. Khoảng 3 tuần nay, mỗi tuần vài lần, đang ngồi học hoặc ngồi xem ti vi thì em đột ngột thấy đau nhói như kim châm ở một điểm dưới vú trái, hít vào thì đau hơn nên em thở nông; mỗi lần chỉ khoảng 10–30 giây rồi hết hẳn. Hôm nay bị lại một lần ở lớp nên mẹ lo. Em không đau khi chạy nhảy hay chơi cầu lông, không hụt hơi, không hồi hộp, không ngất, không choáng. Ấn vào ngực không đau, da bình thường. Em không sốt, không ho. Trong nhà không ai đột tử hay bị bệnh tim từ trẻ."
