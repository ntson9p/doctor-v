source:
  basis: "Thoát vị bẹn nghẹt ở nhũ nhi trai sinh non gây tắc ruột: khối phồng bẹn căng cứng, đau, không đẩy lên được, khóc không dỗ được, nôn dịch xanh, chưa đi ngoài (Jackson 2011: thoát vị là nguyên nhân tắc ruột; MSD: ruột bị thắt nghẹt có thể hoại tử sau 6 giờ, người nghi tắc ruột cần nhập viện). NHS Stomach ache: nôn dịch xanh là lý do đến cấp cứu; chưa có dấu hiệu sốc nên mức 2."
  references:
    - msd-intestinal-obstruction
    - jackson-afp-2011
    - nhs-stomach-ache
author: "agent:vignette-holdout"
notes_vi: "Triệu chứng chính 'Đau bụng' bao gồm cả vùng bẹn. Trẻ chưa biết nói nên vị trí đau bụng để 'không rõ'. Danh mục chưa có câu hỏi về sinh non, khối phồng ở bẹn từng tự lên xuống."
