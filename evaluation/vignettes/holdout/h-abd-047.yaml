id: h-abd-047
set: holdout
title_vi: "Bé trai 5 tháng sinh non, khóc không dỗ được, nôn dịch xanh, khối phồng căng cứng ở bẹn phải không đẩy lên được"
narrative_vi: "Bé K., trai, 5 tháng, ở Bắc Ninh, sinh non lúc 35 tuần. Mấy tuần nay mẹ thấy bẹn phải của bé thỉnh thoảng phồng lên khi bé khóc, rặn, nằm yên thì tự lặn, nên chưa đi khám. Khoảng 8 giờ trước bé đột ngột khóc thét, ưỡn người, dỗ thế nào cũng không nín, bú được vài ngụm lại khóc. Bẹn phải phồng thành một cục to, căng cứng, hơi đỏ, chạm vào là bé khóc thét; mẹ ấn nhẹ không lên như mọi khi. Bé nôn 4 lần, lúc đầu ra sữa, lần gần nhất ra nước màu xanh lá. Từ lúc khóc đến giờ bé chưa đi ngoài, mẹ không để ý bé có xì hơi không. Bụng bé hơi chướng nhưng không căng cứng. Bé không sốt, vẫn tỉnh, không li bì, tã vẫn ướt."
