source:
  basis: "Viêm ruột thừa ở trẻ nhỏ biểu hiện không điển hình: đau bụng, bỏ ăn, nôn rồi mới sốt, đau tăng khi xe xóc, không chịu đi lại, ấn bụng dưới phải đau (Bundy 2007: đi lại khó, đau khi nhảy hoặc gõ gợi ý viêm ruột thừa, trẻ càng nhỏ càng dễ thủng; Reust 2016: sốt xuất hiện sau đau và nôn phù hợp viêm phúc mạc đang tiến triển). NHS Appendicitis: đau bụng dữ dội cần đến cấp cứu ngay."
  references:
    - nhs-appendicitis
    - bundy-jama-2007
    - reust-afp-2016
author: "agent:vignette-holdout"
notes_vi: "Người nhà chọn 'Sốt' và nghĩ là viêm dạ dày – ruột; trình tự đau bụng, nôn rồi mới sốt và đau khi xe xóc là điểm phân biệt. Danh mục chưa có câu hỏi về thứ tự xuất hiện đau bụng và sốt."
