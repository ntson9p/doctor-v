id: h-fever-053
set: holdout
title_vi: "Bé trai 4 tuổi, đau bụng, nôn rồi sốt 38,6°C, không chịu đi lại, khóc khi xe xóc"
narrative_vi: "Bé Đ., trai, 4 tuổi, ở Buôn Ma Thuột (Đắk Lắk), đã tiêm đủ 2 mũi vắc xin sởi. Chiều qua bé kêu đau bụng, bỏ bữa tối, buổi tối nôn 2 lần. Đêm qua bé sốt, mẹ đo 38,6°C, mẹ nghĩ bé bị viêm dạ dày ruột. Sáng nay bé nôn thêm 1 lần, đi ngoài 1 lần phân hơi nhão, kêu buồn nôn. Hỏi đau ở đâu thì bé chỉ quanh rốn, nhưng mẹ ấn bụng dưới bên phải thì bé khóc, gạt tay mẹ ra. Bé nằm co người, không chịu đứng dậy đi; bế lên xe máy đi qua ổ gà là bé khóc thét kêu đau bụng. Bé vẫn tỉnh, uống được ít nước, đi tiểu bình thường. Bé không ho, không sổ mũi, không nổi ban, trong miệng không loét, bụng không chướng."
