id: h-chest-014
set: holdout
title_vi: "Nam 52 tuổi tăng huyết áp không điều trị, đang khiêng bao xi măng đột ngột đau dữ dội ngực như dao đâm xuyên ra lưng rồi xuống bụng, vã mồ hôi"
narrative_vi: "Anh H., 52 tuổi, thợ xây ở Biên Hòa (Đồng Nai), được nói bị tăng huyết áp từ 3 năm trước nhưng không uống thuốc, hút thuốc lá, hay uống rượu. Khoảng 1 giờ trước, đang khiêng bao xi măng, anh đột ngột đau dữ dội ngay từ đầu ở giữa ngực, như dao đâm, xuyên thẳng ra sau lưng, sau đó đau lan dần xuống bụng. Anh vã mồ hôi, da tái, không ngồi yên được, buồn nôn. Đồng nghiệp đo huyết áp tay trái ở trạm y tế công trường được 200/110 mmHg. Anh vẫn tỉnh, nói được, không yếu tay chân, không méo miệng. Anh không sốt, không ho, chưa từng bị như vậy."
