source:
  basis: "Bóc tách động mạch chủ ở nam tăng huyết áp không điều trị, khởi phát khi gắng sức nặng: đột ngột đau dữ dội ngay từ đầu ở ngực, xuyên ra lưng rồi lan xuống bụng, vã mồ hôi, da tái, huyết áp 200/110 mmHg. HSE Aortic dissection: đau ngực hoặc lưng trên đột ngột, dữ dội, có thể lan dọc lưng, đau bụng đột ngột; gọi cấp cứu ngay. NHS Chest pain: đau ngực lan ra lưng, bụng kèm vã mồ hôi thì gọi 999. Mức 1."
  references:
    - hse-aortic-dissection
    - nhs-chest-pain
author: "agent:vignette-holdout"
notes_vi: "Ca cấp cứu theo đề bài. Ở màn sàng lọc đầu, anh trả lời 'có' câu đau thắt hoặc đè nặng ngực dữ dội kèm vã mồ hôi (đau dữ dội, vã mồ hôi), dù tả đau như dao đâm. Hội chứng vành cấp là chẩn đoán phân biệt cùng mức."
