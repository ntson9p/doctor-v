narrative_vi: "Bé T., 9 tháng, ở Thành phố Hồ Chí Minh, trước đó khỏe mạnh. Khoảng 8 giờ trước bé đột ngột khóc thét từng cơn, co hai chân lên bụng, mỗi cơn vài phút rồi nằm yên, khoảng 15–20 phút lại lên cơn. Bé nôn 3 lần, bú ít hơn nhưng vẫn bú được. Lần đi ngoài vừa rồi tã có nhầy lẫn máu đỏ sẫm như mứt dâu. Bé không sốt, chưa li bì."
