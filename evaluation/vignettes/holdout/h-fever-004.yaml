narrative_vi: "Bà L., 72 tuổi, ở Nam Định, bị đái tháo đường và tăng huyết áp. Từ hôm qua bà sốt 38,5°C, ho khan, đau họng, sổ mũi, đau mỏi người, đau đầu nhẹ, mệt và chán ăn. Đứa cháu đi học về bị cúm trước đó 2 ngày. Bà không khó thở, không đau ngực, vẫn tỉnh táo và ăn uống được ít."
