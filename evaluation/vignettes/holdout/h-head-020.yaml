source:
  basis: "Nghi máu tụ dưới màng cứng mạn tính: người cao tuổi đang dùng thuốc chống đông, đau đầu tăng dần vài tuần sau ngã đập đầu, có nôn. NICE NG232 khuyên người đau đầu dai dẳng hoặc nôn sau chấn thương đầu, đang dùng thuốc chống đông phải đến khoa cấp cứu; NHS Headaches: đau đầu sau chấn thương đầu trong 3 tháng qua cần đi cấp cứu."
  references:
    - nice-ng232
    - nhs-headaches
author: "agent:vignette-holdout"
notes_vi: "Ngoài danh mục bệnh. Người nhà dễ quên cú ngã đã xảy ra nhiều tuần trước. Còn tỉnh táo, không có dấu hiệu thần kinh khu trú nên mức 2, không phải mức 1. Danh mục chưa có câu hỏi về thuốc chống đông."
