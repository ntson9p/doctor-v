id: h-head-020
set: holdout
title_vi: "Nữ 79 tuổi uống thuốc chống đông, ngã đập đầu 3 tuần trước, đau đầu tăng dần, nôn"
narrative_vi: "Bà T., 79 tuổi, ở Nam Định, bị rung nhĩ và tăng huyết áp, đang uống thuốc chống đông máu hằng ngày theo đơn. Khoảng 3 tuần trước bà trượt chân ngã trong nhà tắm, đập đầu vào thành bể nước, lúc đó chỉ sưng đau, không ngất nên không đi khám. Khoảng 10 ngày nay bà đau đầu âm ỉ, nặng nề khắp đầu, mỗi ngày một tăng, uống paracetamol không đỡ. Sáng nay bà buồn nôn, nôn 1 lần. Bà vẫn tỉnh táo, nói chuyện đúng, tự đi lại được, tay chân cử động đều, không méo miệng, nhìn rõ, không sốt. Con gái đo huyết áp sáng nay được 135/80 mmHg."
