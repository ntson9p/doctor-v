id: h-syncope-011
set: holdout
title_vi: "Nam 67 tuổi uống thuốc giảm đau chống viêm 2 tuần, phân đen 3 ngày, ngất khi vừa đi ngoài xong; da tái, vã mồ hôi lạnh, tim nhanh"
narrative_vi: "Ông Đ., 67 tuổi, ở Hải Phòng, đau lưng nên 2 tuần nay uống thuốc giảm đau chống viêm mua ở hiệu thuốc, ngày 2–3 lần. Mấy hôm nay ông hơi đau tức vùng trên rốn. Ba ngày nay mỗi ngày ông đi ngoài 1–2 lần phân đen, nhão, mùi khắm, ông không để ý. Sáng nay ông đi ngoài nhiều phân đen, vừa đứng dậy khỏi bồn cầu thì choáng, vã mồ hôi, tối sầm mắt rồi ngất; vợ nghe tiếng động chạy vào thấy ông ngồi gục bên bồn cầu, khoảng 1 phút sau ông tỉnh, không đập đầu. Hiện ông nằm trên giường, tỉnh, nói chuyện được nhưng da xanh tái, vã mồ hôi lạnh, tay chân lạnh, tim đập nhanh, khát nước; ngồi dậy là choáng, không tự đứng lên được. Ông không nôn, không nôn ra máu, không đau ngực, không khó thở, không co giật. Ông không uống aspirin hay thuốc chống đông, không bị bệnh gan."
