source:
  basis: "Xuất huyết tiêu hóa trên (nghi loét do thuốc giảm đau chống viêm) gây ngất: phân đen nhiều ngày, ngất khi đi ngoài, sau đó da tái, vã mồ hôi lạnh, tay chân lạnh, tim nhanh, khát, không tự đứng dậy được (dấu hiệu mất máu nhiều, sốc). ESC 2018: nghi chảy máu tiêu hóa là đặc điểm nguy cơ cao loại nặng ở người ngất. NHS Stomach ulcer: phân đen thì gọi 999 hoặc đến cấp cứu; thuốc giảm đau chống viêm là nguyên nhân. NICE CG141: đánh giá nguy cơ ngay khi đến viện. Mức 1."
  references:
    - esc-syncope-2018
    - nhs-stomach-ulcer
    - nice-cg141
author: "agent:vignette-holdout"
notes_vi: "Ca cấp cứu khó: ngất khi đi ngoài dễ bị coi là ngất tình huống (nguy cơ thấp); phân đen là dấu hiệu then chốt. Đi ngoài 1–2 lần mỗi ngày nên câu tiêu chảy trả lời 'không'."
