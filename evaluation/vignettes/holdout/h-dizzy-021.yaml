id: h-dizzy-021
set: holdout
title_vi: "Nữ 33 tuổi uống thuốc tránh thai, sau chuyến xe 14 giờ hay choáng váng khi gắng sức, thở hụt, mạch 112"
narrative_vi: "Chị Tr., 33 tuổi, nhân viên kinh doanh ở Hà Nội, uống thuốc tránh thai hằng ngày 8 tháng nay. 10 ngày trước chị đi công tác Đà Nẵng bằng xe khách giường nằm, mỗi chiều khoảng 14 tiếng. Ba ngày nay chị hay choáng váng, lâng lâng mỗi khi đi nhanh hoặc leo cầu thang; leo lên tầng 3 phải dừng lại vì thở hụt, tim đập nhanh; ngồi nghỉ vài phút thì đỡ choáng. Từ sáng nay ngồi yên chị vẫn thấy thở nhanh hơn bình thường, tim đập nhanh liên tục, người mệt. Máy đo ở nhà lúc ngồi nghỉ báo mạch 112 lần/phút, huyết áp 110/75 mmHg. Chị vẫn nói được trọn câu. Chị không thấy mọi vật quay tròn, chưa lần nào tối sầm mắt hay suýt ngất. Chị không đau ngực, không ho, không ho ra máu, không sốt, hai bắp chân không sưng đau. Chị vừa có kinh tuần trước, lượng như mọi tháng, không có thai. Chị không hút thuốc, không có bệnh tim, chưa từng bị cục máu đông, không mắc ung thư, không sụt cân, không run tay, không sợ nóng."
