source:
  basis: "Thuyên tắc phổi biểu hiện chủ yếu bằng choáng váng: choáng khi gắng sức, thở hụt tăng dần, nay khó thở cả khi nghỉ, tim nhanh 112 lần/phút liên tục, ở phụ nữ đang uống thuốc tránh thai vừa ngồi xe đường dài, không đau ngực, không sưng chân, không có dấu hiệu thiếu máu hay cường giáp. ESC 2019 (thuyên tắc phổi): thuốc tránh thai là yếu tố thuận lợi mức trung bình, ngồi lâu khi đi xa là yếu tố yếu, tiền ngất và khó thở là biểu hiện, nhịp nhanh có thể là bất thường duy nhất; NHS Pulmonary embolism: khó thở đột ngột, tim đập rất nhanh thì gọi 999 hoặc đến cấp cứu; NHS Heart palpitations: hồi hộp không dứt thì gọi 999 hoặc đến cấp cứu; huyết áp còn bình thường, không ngất, nói được trọn câu nên mức 2."
  references:
    - esc-pe-2019
    - nhs-pulmonary-embolism
    - nhs-heart-palpitations
author: "agent:vignette-holdout"
notes_vi: "Ca khó: không đau ngực, không ho ra máu, không sưng chân; người bệnh chọn triệu chứng chính 'Chóng mặt'. Danh mục chưa có câu hỏi về thuốc tránh thai; chuyến xe đường dài được ghi ở câu mổ, nằm lâu, ngồi xe lâu trong 4 tuần qua. Thở nhanh cả khi ngồi nghỉ nên câu khó thở trả lời 'có'; vẫn nói trọn câu nên câu khó thở dữ dội trả lời 'không'."
