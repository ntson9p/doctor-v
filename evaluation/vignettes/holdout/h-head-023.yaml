id: h-head-023
set: holdout
title_vi: "Bé gái 10 tuổi, đau đầu giật hai bên thái dương từng cơn, 2 cơn mỗi tuần, buồn nôn, chói mắt"
narrative_vi: "Bé H., gái, 10 tuổi, học lớp 5 ở Hà Nội. Khoảng 3 tháng nay bé hay lên cơn đau đầu, tháng gần đây tuần nào cũng 2 cơn, thường vào buổi chiều sau giờ học, nhất là hôm bỏ bữa sáng hoặc xem điện thoại lâu; dạo này bé đi học thêm buổi tối, ngủ muộn. Bé đau giật giật hai bên thái dương và trán, phải bỏ dở việc đang làm để nằm nghỉ; chạy nhảy, leo cầu thang thì đau hơn. Lúc đau bé buồn nôn nhưng không nôn, kêu chói mắt, ồn ào thì khó chịu. Mỗi cơn kéo dài 2–3 giờ, bé ngủ một giấc trong phòng tối dậy thì hết. Chiều nay bé lại đau như mọi lần, mới được khoảng 1 giờ. Mẹ bé cũng bị đau nửa đầu. Bé không đau đầu lúc mới ngủ dậy, không đau thức giấc ban đêm, các cơn không nặng dần lên. Bé không sốt, không cứng gáy, không nhìn mờ, không lác mắt, không yếu tay chân, không bị ngã đập đầu. Giữa các cơn bé học và chơi bình thường."
