source:
  basis: "Đau nửa đầu không tiền triệu ở trẻ: cơn 2–3 giờ, đau giật hai bên trán thái dương (trẻ hay đau hai bên theo ICHD-3 và Chakravarty 2008), tăng khi vận động, buồn nôn, sợ ánh sáng và tiếng ồn, mẹ cũng bị. Cơn nhiều hơn 1 lần mỗi tuần nên cần đặt lịch khám (NHS Migraine), nhưng không có dấu hiệu cần khám khẩn ở trẻ (không nôn, không đau lúc mới ngủ dậy hay thức giấc ban đêm, không nặng dần, không có vấn đề về mắt; NHS Headaches)."
  references:
    - nhs-migraine
    - ihs-ichd3-2018
    - chakravarty-jhp-2008
    - nhs-headaches
author: "agent:vignette-holdout"
notes_vi: "Đau tăng khi đi lại, leo cầu thang trong cơn là đặc điểm của đau nửa đầu, khác với đau đầu khởi phát do ho, rặn hay gắng sức. Danh mục chưa có câu hỏi về đau đầu lúc mới ngủ dậy, lác mắt ở trẻ."
