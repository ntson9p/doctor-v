id: h-cough-012
set: holdout
title_vi: "Bé trai 4 tuổi sổ mũi, ho 4 ngày, ho nhiều khi ngủ, hôm đầu sốt nhẹ, vẫn ăn chơi bình thường"
narrative_vi: "Bé A., nam, 4 tuổi, ở Hải Phòng, đi mẫu giáo, đã tiêm chủng đầy đủ theo lịch, kể cả 2 mũi vắc xin sởi. Bốn ngày nay bé sổ mũi trong, nghẹt mũi, ho húng hắng, ho nhiều hơn khi nằm ngủ. Hôm đầu bé sốt nhẹ 37,8°C, từ hôm sau không sốt nữa. Bé vẫn ăn, uống sữa, chơi bình thường, không khó thở, không thở nhanh, ngực không rút lõm, không khò khè, không thở rít, không đau tai, không nôn. Bé không bị hóc, sặc gì. Trong lớp nhiều bạn đang sổ mũi."
