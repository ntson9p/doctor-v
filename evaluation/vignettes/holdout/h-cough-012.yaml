source:
  basis: "Cảm lạnh thông thường ở trẻ 4 tuổi: sổ mũi, nghẹt mũi, ho 4 ngày, ho nhiều khi nằm (do dịch mũi chảy xuống họng), sốt nhẹ 1 ngày, ăn chơi bình thường, không có dấu hiệu nguy hiểm của WHO IMCI (không thở nhanh, không rút lõm, không thở rít, uống được). NHS Common cold: tự chăm sóc; đi khám khi sốt cao hơn 3 ngày, nặng lên, khó thở, không đỡ sau 10 ngày hoặc ho quá 3 tuần."
