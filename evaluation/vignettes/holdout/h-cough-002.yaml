    - nhs-common-cold
author: "agent:vignette-holdout"
notes_vi: "Ca khó hơn: người cao tuổi, có khò khè và ho về đêm (dễ nghĩ hen, suy tim). Uống amlodipine (không phải thuốc nhóm ức chế men chuyển) nên không nghĩ ho do thuốc. SpO2 chỉ được hỏi khi có khó thở nên không ghi."
