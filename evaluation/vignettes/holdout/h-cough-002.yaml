title_vi: "Nam 70 tuổi không hút thuốc, ho đờm 2 tuần sau cảm, hơi khò khè về đêm, không sốt, không khó thở"
narrative_vi: "Ông T., 70 tuổi, ở Đà Lạt (Lâm Đồng), bị tăng huyết áp nhiều năm, uống amlodipine mỗi sáng, huyết áp ổn định. Ông chưa từng hút thuốc, không có bệnh tim, bệnh phổi hay tiểu đường. Khoảng 2 tuần trước ông bị cảm, sổ mũi, đau họng 4–5 ngày. Sau đó ông ho dai dẳng, khạc đờm trắng, đêm nằm có lúc nghe ngực hơi khò khè, ho nhiều hơn về đêm. Ông vẫn đi bộ buổi sáng, làm vườn được, không thấy hụt hơi, không khó thở khi nằm, không đau ngực. Ông không sốt, không ho ra máu, không sụt cân, không ra mồ hôi đêm, ăn uống bình thường, chân không phù. Con gái đo SpO2 bằng máy kẹp ngón tay được 97%."
