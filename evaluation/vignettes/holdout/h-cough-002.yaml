source:
  basis: "Viêm phế quản cấp ở người cao tuổi khỏe mạnh: ho đờm 2 tuần sau cảm lạnh, khò khè nhẹ về đêm, không sốt, không khó thở, SpO2 97%, không có bệnh tim phổi hay đái tháo đường. NHS Cough và NHS Common cold: ho thường hết trong 3–4 tuần; đi khám khi ho trên 3 tuần, khó thở, đau ngực, ho ra máu, sụt cân hoặc có bệnh nền. Khò khè nhẹ thường gặp trong viêm phế quản cấp. Chưa có dấu hiệu nào nên theo dõi tại nhà."
