narrative_vi: "Bé P., 20 tháng, ở Vĩnh Long. Bé sổ mũi, nghẹt mũi, ho nhẹ 3 ngày nay. Từ tối qua bé sốt 38,6°C, quấy khóc, hay kéo và dụi tai phải, khóc nhiều khi nằm. Bé ăn kém hơn nhưng vẫn bú và uống được. Không chảy mủ tai, không nôn, không nổi ban. Bé tỉnh, chơi được khi hạ sốt. Bé đã tiêm đủ 2 mũi vắc xin sởi."
