source:
  basis: "Viêm dạ dày – ruột cấp sau bữa giỗ (người ăn cùng cũng bị) gây mất nước ở người cao tuổi đang uống thuốc lợi tiểu và thuốc hạ áp: tiêu chảy toàn nước 2 ngày, khô miệng, khát, tiểu ít, nước tiểu sẫm, xây xẩm mỗi khi đứng dậy, huyết áp thấp hơn hẳn thường ngày; vẫn tỉnh, tự đi lại, uống được, tay chân ấm, không có dấu hiệu sốc. NHS Dehydration: chóng mặt khi đứng dậy không hết, tiểu ít, nước tiểu sẫm thì khám khẩn trong ngày, chỉ gọi 999 khi có dấu hiệu sốc (da lạnh, lú lẫn, lơ mơ); NHS Low blood pressure: thuốc là một nguyên nhân hạ huyết áp tư thế, cần bác sĩ xem lại thuốc; NHS Diarrhoea and vomiting: không có dấu hiệu cần gọi cấp cứu, nên mức 3."
  references:
    - nhs-dehydration
    - nhs-low-blood-pressure
    - nhs-diarrhoea-vomiting
author: "agent:vignette-holdout"
notes_vi: "Ca ở người cao tuổi: người nhà chọn triệu chứng chính 'Chóng mặt', không chọn 'Đau bụng'. Hạ huyết áp tư thế do mất nước và thuốc lợi tiểu là cơ chế gây chóng mặt nên chấp nhận cả ngất phản xạ, hạ huyết áp tư thế. Xây xẩm vài giây khi đứng dậy, chưa tối sầm mắt nên câu ngất, suýt ngất trả lời 'không'. Huyết áp 105/65 mmHg nên chọn 'Dưới 140/90 mmHg'."
