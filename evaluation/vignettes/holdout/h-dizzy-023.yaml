id: h-dizzy-023
set: holdout
title_vi: "Nữ 77 tuổi uống thuốc lợi tiểu, tiêu chảy 2 ngày sau đám giỗ, nay đứng dậy là xây xẩm, tiểu ít, khô miệng"
narrative_vi: "Bà S., 77 tuổi, ở Pleiku (Gia Lai), bị tăng huyết áp, mỗi sáng uống một viên thuốc huyết áp và một viên thuốc lợi tiểu. Hai hôm trước bà ăn đám giỗ, tối đó bắt đầu đi ngoài phân lỏng toàn nước, mỗi ngày 6–7 lần, không có máu, kèm buồn nôn, nôn 1 lần; mấy người ăn cùng cũng bị đi ngoài. Bà chỉ sôi bụng, không đau bụng, không sốt, ăn uống kém. Bà uống oresol được, không nôn thêm, nhưng vẫn đi ngoài nhiều, và vẫn uống thuốc huyết áp, thuốc lợi tiểu đều. Từ sáng nay bà mệt, khô miệng, khát; mỗi lần đứng dậy là xây xẩm vài giây, phải vịn tường, chưa lần nào tối sầm mắt hay ngã. Từ sáng đến chiều bà chỉ đi tiểu 1 lần, nước tiểu ít và sẫm màu. Con trai đo huyết áp lúc ngồi được 105/65 mmHg (bình thường bà khoảng 140/85), mạch 96 lần/phút. Bà vẫn tỉnh táo, nói chuyện bình thường, tự đi lại trong nhà được, tay chân ấm. Bà không thấy mọi vật quay tròn, không đau đầu, không nhìn đôi, không nói khó, không yếu tay chân, không đau ngực, không khó thở. Bà không bị đái tháo đường, không đi ngoài phân đen."
