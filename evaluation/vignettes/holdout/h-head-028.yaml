source:
  basis: "Bệnh do Leptospira thể thông thường ở nam 33 tuổi dọn bùn, khơi cống 5 ngày sau lũ ở Quảng Nam, nhà nhiều chuột: sốt cao đột ngột, rét run, đau đầu dữ dội, đau cơ bắp chân khi bóp, đỏ mắt không ghèn; chưa vàng da, chưa tiểu ít, không chảy máu. WHO 2003 (Human leptospirosis): nghĩ đến bệnh khi sốt đột ngột, rét run, đỏ kết mạc, đau đầu, đau cơ, nhất là khi có phơi nhiễm nước hoặc đất nhiễm nước tiểu động vật; đỏ kết mạc và đau cơ bắp chân khi ấn là dấu hiệu phân biệt nhất; dùng kháng sinh càng sớm càng tốt, tốt nhất trước ngày thứ 5, không chờ xét nghiệm. Chưa có dấu hiệu nặng nên đi khám trong 24 giờ."
  references:
    - who-leptospirosis-2003
    - "https://www.nhs.uk/conditions/leptospirosis/"
author: "agent:vignette-holdout"
notes_vi: "Ca điển hình; người bệnh chọn 'Đau đầu' vì đây là triệu chứng nặng nề nhất. Sốt xuất huyết, sốt mò là chẩn đoán phân biệt."
