id: h-head-028
set: holdout
title_vi: "Nam 33 tuổi dọn bùn, khơi cống 5 ngày sau lũ ở Quảng Nam, đột ngột sốt cao rét run, đau đầu dữ dội vùng trán, đau nhiều hai bắp chân, đỏ mắt"
narrative_vi: "Anh T., 33 tuổi, ở Đại Lộc (Quảng Nam). Đợt lũ đầu tháng 11, nhà anh ngập gần 1 mét; anh lội nước, dọn bùn, khơi cống suốt 5 ngày, chân tay có nhiều vết xước, trong nhà nhiều chuột chết. Ba ngày nay anh đột ngột sốt cao 39,5°C, rét run, đau đầu dữ dội vùng trán và quanh hai mắt, đau nhức khắp người, nhất là hai bắp chân, bóp vào đau đến mức đi lại khó. Hai mắt đỏ, không có ghèn. Anh buồn nôn, chán ăn, không nôn. Không cứng gáy, không lú lẫn, không ho, không khó thở, không nổi ban, không chảy máu chân răng, da không vàng, đi tiểu bình thường. Đau đầu là điều làm anh khó chịu nhất. Trước đây anh ít khi đau đầu."
