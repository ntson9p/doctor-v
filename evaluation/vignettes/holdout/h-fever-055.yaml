title_vi: "Nam 45 tuổi ở Huế uống rượu nhiều, sốt cao ớn lạnh 10 ngày, đau dưới sườn phải tăng khi hít sâu, lan lên vai phải, chán ăn, sụt cân"
narrative_vi: "Anh C., 45 tuổi, thợ hồ ở Huế, uống rượu hằng ngày nhiều năm nay. Mười ngày nay anh sốt, chiều tối sốt cao, có hôm đo 39,2°C, kèm ớn lạnh, rét run. Anh đau âm ỉ vùng dưới sườn phải, đau tăng khi hít sâu, khi đi xe máy qua chỗ xóc, đau lan lên vai phải. Anh buồn nôn, chán ăn, mệt, sụt khoảng 4 kg. Da và mắt không vàng. Không ho, không khó thở, không tiêu chảy, không tiểu buốt, không nổi ban. Không đi rừng, không lội nước lũ, khu phố không có ai bị sốt xuất huyết. Anh vẫn tỉnh táo, tự đi lại được."
