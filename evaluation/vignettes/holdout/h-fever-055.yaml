source:
  basis: "Áp xe gan (nhiều khả năng do amip) ở nam 45 tuổi uống rượu nhiều, sống ở Huế: sốt cao, rét run 10 ngày, đau hạ sườn phải tăng khi hít sâu, khi xóc, lan lên vai phải, chán ăn, sụt cân, không vàng da. Blessmann và cộng sự (Am J Trop Med Hyg 2002): Thừa Thiên Huế có tỷ lệ áp xe gan do amip ít nhất 21/100.000 dân mỗi năm, 95% là người lớn, hơn 80% là nam; các triệu chứng được theo dõi là sốt, đau hạ sườn phải, gan đau (Blessmann 2003). Kong và cộng sự (Medicine 2017): sốt, rét run, đau vùng gan là triệu chứng điển hình của áp xe gan. Không có tiêu chí nguy cơ cao của nhiễm khuẩn huyết (NICE NG253) nên đi khám trong 24 giờ để siêu âm và điều trị."
  references:
    - "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=Blessmann%20AND%20amebic%20AND%20Vietnam&format=json&resultType=core&pageSize=8"
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC5604666/"
    - nice-ng253
author: "agent:vignette-holdout"
notes_vi: "Ca điển hình. Đau khi hít sâu là đau hạ sườn phải do ổ áp xe sát cơ hoành, người bệnh trả lời 'có' ở câu đau ngực khi hít sâu."
