source:
  basis: "Viêm mào tinh hoàn – tinh hoàn do nhiễm khuẩn tiết niệu ở nam 67 tuổi phì đại tiền liệt tuyến: tiểu buốt, tiểu nhiều lần 4 ngày, rồi sốt 38,6°C, ớn lạnh, bìu phải sưng đỏ, nóng, đau tăng dần trong 2 ngày. NHS Epididymitis: ở nam trên 35 tuổi thường do nhiễm khuẩn tiết niệu, nhất là khi phì đại tiền liệt tuyến; đau có thể đến từ từ; chỉ cần cấp cứu khi đau tinh hoàn hoặc bụng đột ngột, dữ dội không chịu nổi (nghi xoắn). Có sốt nên cần khám và dùng kháng sinh trong 24 giờ."
  references:
    - "https://www.nhs.uk/conditions/epididymitis/"
    - "https://www.nhs.uk/conditions/testicle-pain/"
author: "agent:vignette-holdout"
notes_vi: "Ca ngoài danh mục. NHS Testicle pain khuyên đến cấp cứu khi đau tinh hoàn quá 1 giờ để không bỏ sót xoắn; ở người 67 tuổi khởi phát từ từ trong 2 ngày, kèm tiểu buốt và sốt, xoắn rất khó xảy ra, nên mức đúng là 3; app khuyên mức 2 vẫn an toàn (tính là khuyên quá mức). Danh mục chưa có câu hỏi về tiểu khó, tia tiểu yếu, phì đại tiền liệt tuyến."
