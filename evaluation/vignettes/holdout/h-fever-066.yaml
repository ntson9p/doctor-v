id: h-fever-066
set: holdout
title_vi: "Nam 67 tuổi phì đại tiền liệt tuyến, 4 ngày tiểu buốt, tiểu nhiều lần, 2 ngày sốt 38,6°C ớn lạnh, bìu phải sưng đỏ, đau tăng dần"
narrative_vi: "Ông X., 67 tuổi, ở Quy Nhơn (Bình Định), bị tăng huyết áp và phì đại tiền liệt tuyến, mấy năm nay đi tiểu khó, tia yếu, đêm dậy tiểu 2–3 lần. Bốn ngày nay ông đi tiểu buốt, tiểu nhiều lần, mỗi lần ít. Hai ngày nay ông sốt 38,6°C, ớn lạnh, và thấy bìu bên phải sưng to dần, đỏ, nóng, đau tức, chạm vào rất đau; ông nói đau tăng từ từ chứ không đột ngột. Ông không đau bụng, không đau hông lưng, nước tiểu không đỏ. Không nôn, không tiêu chảy, không ho. Ông vẫn tỉnh táo, ăn uống được, tự đi lại."
