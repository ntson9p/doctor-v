source:
  basis: "Đau đầu do tăng huyết áp nặng không kiểm soát sau khi tự ngừng thuốc (huyết áp tâm thu từ 180 mmHg; ICHD-3 mục 10.3.2: đau đầu do cơn tăng huyết áp chưa có bệnh não), chưa có dấu hiệu tổn thương cơ quan đích cấp như lú lẫn, đau ngực, khó thở, yếu liệt, nhìn mờ. NICE NG136: huyết áp từ 180/120 mà không có triệu chứng đe dọa tính mạng thì cần thăm dò tổn thương cơ quan đích càng sớm càng tốt, nên đi khám trong hôm nay hoặc ngày mai, chưa phải cấp cứu ngay."
  references:
    - nice-ng136
    - ihs-ichd3-2018
author: "agent:vignette-holdout"
notes_vi: "Ngoài danh mục bệnh. Không có dấu hiệu thần kinh khu trú nên không nghĩ đột quỵ, nhưng cũng không để tự theo dõi tại nhà. Có lú lẫn, đau ngực, khó thở, nhìn mờ, nôn hoặc yếu liệt thì chuyển mức 1–2. Danh mục chưa có câu hỏi về tự ngừng thuốc huyết áp."
