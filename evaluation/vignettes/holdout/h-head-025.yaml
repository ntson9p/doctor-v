id: h-head-025
set: holdout
title_vi: "Nam 69 tuổi tăng huyết áp, tự ngừng thuốc 10 ngày, đau nặng sau gáy 2 ngày, huyết áp đo được 192/112"
narrative_vi: "Ông H., 69 tuổi, ở Ninh Bình, bị tăng huyết áp 8 năm, hút thuốc lào. Mười ngày trước ông uống hết thuốc huyết áp, thấy trong người vẫn khỏe nên chưa đi lấy thuốc. Hai ngày nay trời trở rét, ông đau đầu âm ỉ, nặng tức vùng sau gáy, mức vừa, phải nằm nghỉ. Trước giờ ông ít khi đau đầu, đây là lần đầu đau kéo dài như vậy. Sáng nay con trai đo huyết áp ở nhà 2 lần được 192/112 và 188/110 mmHg. Cơn đau đến từ từ, không phải đột ngột dữ dội. Ông không buồn nôn, không nôn, không nhìn mờ, không đau ngực, không khó thở, không tê hay yếu tay chân, không méo miệng, nói rõ, đi lại vững, tỉnh táo, cổ cúi được bình thường. Không sốt. Ông không bị tiểu đường, chưa từng được nói là có bệnh tim."
