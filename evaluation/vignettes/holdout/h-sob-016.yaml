source:
  basis: "Cơn hen nặng ở trẻ 9 tuổi: chỉ nói được từng từ, ngồi cúi người, co kéo cơ hô hấp phụ, SpO2 89%, không đỡ sau thuốc cắt cơn. GINA 2026 mục 9 (trẻ 6–11 tuổi): nói từng từ, SpO2 dưới 92% là cơn nặng, chuyển ngay tới cơ sở cấp cứu; 1851/QĐ-BYT Bảng 9: cơn nặng là cấp cứu đe dọa tử vong. NHS Asthma: không đỡ sau liều tối đa thuốc cắt cơn thì gọi 999. Mức 1."
