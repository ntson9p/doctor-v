id: h-sob-016
set: holdout
title_vi: "Bé trai 9 tuổi bị hen, từ tối khò khè nặng dần, nay chỉ nói được vài từ, ngồi cúi người thở, xịt 8 nhát không đỡ, SpO2 89%"
narrative_vi: "Bé N., nam, 9 tuổi, ở Hà Nội, bị hen phế quản từ năm 4 tuổi, có bình xịt cắt cơn. Mấy hôm nay trời chuyển lạnh, bé sổ mũi. Từ tối qua bé ho, khò khè, khó thở tăng dần. Trong 1 giờ qua mẹ đã cho bé xịt thuốc cắt cơn 8 nhát qua buồng đệm mà không đỡ. Bây giờ bé ngồi cúi người ra trước, tì tay lên đùi để thở, thở rất nhanh, co kéo cổ, chỉ nói được vài từ rồi phải dừng lấy hơi, mệt, vã mồ hôi. Môi chưa tím, bé vẫn tỉnh, trả lời được bằng gật đầu. Máy kẹp ngón tay đo SpO2 được 89%. Bé không sốt, không ăn món lạ, không bị ong đốt, không nổi mẩn."
