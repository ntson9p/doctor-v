source:
  basis: "Cơn hoảng sợ tái diễn ở học sinh 15 tuổi trong giai đoạn căng thẳng, thiếu ngủ, biểu hiện chính là chóng mặt: lâng lâng, cảm giác không thật, tê quanh miệng và đầu ngón tay, run, thở gấp, tim nhanh, sợ chết, sợ mất kiểm soát, mỗi cơn khoảng 15 phút rồi tự hết. NHS Panic disorder: các triệu chứng trên là triệu chứng cơn hoảng sợ, phần lớn cơn kéo dài 5–20 phút; có triệu chứng rối loạn hoảng sợ thì đi khám bác sĩ. NHS Dizziness: căng thẳng, lo âu là nguyên nhân chóng mặt. Tê hai bên quanh miệng và đầu ngón tay (do thở nhanh) không phải tê nửa người; không có dấu hiệu thần kinh, không ngất, không đau ngực nên mức 4."
  references:
    - "https://www.nhs.uk/mental-health/conditions/panic-disorder/"
    - nhs-dizziness
author: "agent:vignette-holdout"
notes_vi: "Ca khó: người bệnh là thiếu niên, chọn 'Chóng mặt' chứ không chọn 'Hồi hộp'. Thở gấp trong cơn đã hết nên câu khó thở (hỏi tình trạng hiện tại) trả lời 'không'."
