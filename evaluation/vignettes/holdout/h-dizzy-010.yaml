id: h-dizzy-010
set: holdout
title_vi: "Nữ 15 tuổi ôn thi, thiếu ngủ, 2 tuần nay 4 cơn choáng váng, tê quanh miệng và đầu ngón tay, run, tim nhanh, sợ hãi dữ dội"
narrative_vi: "Em T., nữ, 15 tuổi, học lớp 9 ở Hà Nội, đang ôn thi vào lớp 10, mỗi đêm chỉ ngủ 4–5 tiếng. Hai tuần nay em bị 4 cơn đột ngột chóng mặt, choáng váng, lâng lâng như mọi thứ không có thật, tê bì quanh miệng và các đầu ngón tay, run tay, thở gấp, tim đập nhanh, sợ hãi dữ dội như sắp chết, sợ mất kiểm soát; mỗi cơn khoảng 15 phút rồi tự hết. Hôm nay em lên cơn trong giờ kiểm tra; cô giáo cho em ra ngoài ngồi nghỉ, khoảng 20 phút sau em đỡ hẳn, giờ thở bình thường. Em không ngất, không thấy sắp ngất, không quay cuồng, không đau đầu, không nhìn đôi, không yếu tay chân, không nói khó, không đau ngực. Em ăn uống bình thường, không sụt cân, không sợ nóng. Kinh nguyệt đều, không ra nhiều."
