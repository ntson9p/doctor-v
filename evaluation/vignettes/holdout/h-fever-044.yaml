id: h-fever-044
set: holdout
title_vi: "Bé gái 10 tháng chưa tiêm vắc xin sởi, sốt 5 ngày, ban từ mặt lan xuống, thở rút lõm, môi tím, bỏ bú"
narrative_vi: "Bé gái 10 tháng, ở Bình Dương, chưa được tiêm mũi vắc xin sởi nào. Hai tuần trước anh trai 4 tuổi của bé bị sởi. Bé sốt cao 39–40°C đã 5 ngày, ho nhiều, chảy nước mũi, hai mắt đỏ, chảy nước mắt. Từ 2 ngày nay bé nổi ban đỏ sau tai, lên mặt rồi lan xuống ngực, lưng. Từ đêm qua bé thở rất nhanh, cánh mũi phập phồng, lồng ngực rút lõm khi hít vào, quanh môi tím tái. Bé bỏ bú, lả đi, nằm li bì, lay mới mở mắt. Bé không nôn, không đi ngoài lỏng, không co giật."
