source:
  basis: "Sởi ở trẻ dưới 12 tháng chưa tiêm vắc xin (nhóm nguy cơ cao theo 1019/QĐ-BYT), biến chứng viêm phổi nặng: thở nhanh, rút lõm lồng ngực, tím tái, bỏ bú, li bì. Tím tái, bỏ bú, rối loạn tri giác là dấu hiệu nguy hiểm; theo IMCI đây là bệnh rất nặng, cần chuyển cấp cứu ngay."
