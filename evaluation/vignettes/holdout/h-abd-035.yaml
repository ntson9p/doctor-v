id: h-abd-035
set: holdout
title_vi: "Bé trai 6 tuổi, đau quanh rốn từng lúc 2 tháng, 4–5 ngày mới đi ngoài, phân cứng"
narrative_vi: "Bé P., 6 tuổi, ở Bắc Ninh. Hai tháng nay bé hay kêu đau bụng quanh rốn, đau từng lúc. Bé 4–5 ngày mới đi ngoài một lần, phân to, cứng, đi rất đau nên hay nhịn. Bé ăn kém hơn trước. Bé vẫn xì hơi bình thường, không nôn, không sốt, bụng không chướng căng, vẫn chơi và đi học bình thường."
