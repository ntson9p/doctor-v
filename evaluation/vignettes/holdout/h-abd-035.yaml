source:
  basis: "Táo bón chức năng ở trẻ (NICE CG99): đau bụng tái diễn, đi ngoài thưa, phân to cứng, hay nhịn, không có dấu hiệu báo động; đặt lịch khám trong vài ngày (NHS Stomach ache: đau bụng hay tái lại cần gặp bác sĩ)."
  references:
    - nhs-stomach-ache
author: "agent:vignette-holdout"
notes_vi: "Ngoài danh mục bệnh. Danh mục chỉ có 'không đi ngoài, không xì hơi được' (dấu hiệu tắc ruột), chưa có câu hỏi về số lần đi ngoài và phân cứng."
