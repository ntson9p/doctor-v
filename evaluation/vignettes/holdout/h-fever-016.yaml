narrative_vi: "Anh R., 28 tuổi, ở Gia Lai. Hai tuần trước anh vào rừng lấy măng, ngủ lại trong rừng 3 đêm. Năm ngày nay anh lên cơn rét run, sau đó sốt cao 39,5°C rồi vã mồ hôi, cứ cách 1 ngày lại lên cơn. Anh đau đầu, đau mỏi người, mệt, chán ăn, buồn nôn. Anh không vàng da, vẫn tỉnh táo. Anh không làm rẫy, không phát cỏ."
