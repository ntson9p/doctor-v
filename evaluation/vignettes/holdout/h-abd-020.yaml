title_vi: "Bé gái 2 tuổi, đau bụng từng cơn 10 giờ, nôn, li bì giữa các cơn, chưa có phân máu"
narrative_vi: "Bé A., 2 tuổi, ở Hà Nội, tuần trước bị sổ mũi, nay vẫn còn sổ mũi ít. Khoảng 10 giờ trước bé bắt đầu từng cơn ôm bụng khóc, co chân lên bụng rồi lại nằm im. Bé nôn 4 lần, vẫn uống được ít nước. Giữa các cơn bé lả đi, ngủ li bì, gọi mới mở mắt. Bé chưa đi ngoài ra máu, không sốt."
