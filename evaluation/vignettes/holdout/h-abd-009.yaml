title_vi: "Nữ 48 tuổi có sỏi mật, đau dưới sườn phải 18 giờ sau bữa nhiều mỡ, sốt 38,6°C"
narrative_vi: "Chị M., 48 tuổi, ở Hà Nội, được bác sĩ nói có sỏi mật từ 2 năm trước. Tối qua sau bữa lẩu nhiều mỡ, chị đau dưới sườn phải, đau liên tục đến giờ khoảng 18 tiếng, lan ra sau lưng và vai phải. Hít sâu hay đi lại đều đau hơn. Chị sốt 38,6°C, chán ăn, buồn nôn, nôn 2 lần. Không vàng da, không vàng mắt. Chị không mang thai."
