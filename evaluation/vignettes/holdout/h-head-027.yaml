title_vi: "Nam 41 tuổi sốt, đau đầu nhiều 4 ngày, từ hôm qua nói năng lạ, khó tìm từ, quên, sáng nay co giật toàn thân rồi lơ mơ, lẫn lộn"
narrative_vi: "Anh S., 41 tuổi, ở Vĩnh Long, trước giờ khỏe. Bốn ngày nay anh sốt 38,5–39,2°C, đau đầu khắp đầu, rất đau, uống thuốc hạ sốt không đỡ, buồn nôn, nôn 1 lần. Từ chiều qua vợ thấy anh nói năng lạ, lặp đi lặp lại một câu, có lúc nói không ra từ, cáu gắt vô cớ, không nhớ chuyện vừa xảy ra. Sáng nay anh lên một cơn co giật toàn thân khoảng 2 phút, sau đó lơ mơ, gọi hỏi trả lời chậm, lẫn lộn. Vợ dùng app thay anh. Anh không cứng gáy rõ, không nổi ban, không ho; không bị ngã hay va đập đầu. Không méo miệng, tay chân cử động được cả hai bên. Đây là lần đầu anh đau đầu như vậy."
