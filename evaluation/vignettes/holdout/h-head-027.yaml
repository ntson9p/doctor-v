source:
  basis: "Viêm não do vi rút (nhiều khả năng do herpes) ở nam 41 tuổi: sốt, đau đầu 4 ngày, rồi thay đổi hành vi, lặp lời, khó tìm từ, quên, sau đó co giật toàn thân và lơ mơ, lú lẫn; không cứng gáy, không ban. NHS Encephalitis: bệnh khởi đầu như cúm (sốt, đau đầu), sau đó lú lẫn, co giật, thay đổi tính cách và hành vi, khó nói, mất ý thức; có các dấu hiệu này thì gọi 999 ngay, cần điều trị khẩn ở bệnh viện."
  references:
    - "https://www.nhs.uk/conditions/encephalitis/"
author: "agent:vignette-holdout"
notes_vi: "Ca điển hình. Danh mục chưa có câu hỏi về thay đổi hành vi, tính cách hay khó tìm từ xuất hiện dần trong vài ngày."
