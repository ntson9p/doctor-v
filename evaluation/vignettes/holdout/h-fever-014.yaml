title_vi: "Bé trai 9 tuổi, sổ mũi đặc 12 ngày không đỡ, nặng mặt, sốt nhẹ"
narrative_vi: "Bé H., 9 tuổi, ở Hà Nội. Bé bị sổ mũi, nghẹt mũi đã 12 ngày, không đỡ. Nước mũi đặc, màu vàng xanh. Bé ho có đờm cả ngày lẫn đêm, kêu nặng vùng trán và má khi cúi đầu, đau đầu nhẹ vùng trán. Hai ngày nay bé sốt nhẹ 37,8°C. Không đau tai, không sưng quanh mắt, vẫn ăn uống và đi học được."
