source:
  basis: "Cơn co giật toàn thể lần đầu (không có trong danh mục), bị gia đình gọi là ngất: mất ý thức đột ngột không có tiền triệu khi đang ngồi, co cứng rồi giật toàn thân 1–2 phút, cắn cạnh lưỡi, tiểu không tự chủ, lú lẫn khoảng 20 phút sau cơn, đau mỏi cơ; khởi phát sau nhiều đêm thiếu ngủ. Co giật kéo dài, cắn cạnh lưỡi, lú lẫn kéo dài sau cơn gợi ý cơn động kinh hơn là ngất. NHS Epilepsy: đang co giật lần đầu thì gọi 999; nếu có thể đã co giật lần đầu mà không đến bệnh viện thì khám khẩn với bác sĩ hoặc gọi 111. Đã tỉnh táo hoàn toàn sau 3 giờ, không chấn thương, không sốt, không cứng gáy nên mức 3."
  references:
    - "https://www.nhs.uk/conditions/epilepsy/"
author: "agent:vignette-holdout"
notes_vi: "Ngoài danh mục, ở thiếu niên. Lú lẫn sau cơn đã hết nhưng mới xảy ra sáng nay nên người nhà trả lời 'có'; nay đã tỉnh táo, đi lại bình thường nên câu chưa hồi phục hẳn trả lời 'không'. Danh mục chưa có câu hỏi về cắn lưỡi, tiểu không tự chủ, thời gian lú lẫn sau cơn."
