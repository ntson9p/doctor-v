id: h-syncope-015
set: holdout
title_vi: "Nam 17 tuổi thức khuya ôn thi, đang ngồi ăn thì kêu lên, ngã, co cứng rồi giật cả người 1–2 phút, cắn lưỡi, tè ra quần; gia đình gọi là ngất"
narrative_vi: "Em Q., nam, 17 tuổi, học lớp 12 ở Hưng Yên. Cả tuần nay em thức khuya ôn thi, mỗi đêm ngủ khoảng 4 tiếng. Sáng nay khoảng 6 giờ, đang ngồi ăn sáng, em đột ngột kêu lên một tiếng rồi ngã xuống. Mẹ kể em bất tỉnh, người co cứng rồi giật mạnh cả tay chân khoảng 1–2 phút, mắt trợn ngược, sùi bọt mép, cắn rách cạnh lưỡi, tè ra quần. Sau đó em lơ mơ, nói lẫn lộn, không nhận ra mẹ khoảng 20 phút rồi tỉnh dần. Bây giờ là 9 giờ sáng, em đã tỉnh táo hoàn toàn, nói chuyện bình thường nhưng đau đầu, mỏi nhừ người. Em nói trước khi ngã không thấy choáng, không vã mồ hôi, không thấy tim đập nhanh. Em chưa từng bị như vậy, không sốt, cổ không cứng, không dùng thuốc, rượu bia hay chất kích thích, không bị va đập đầu. Trong nhà không ai đột tử. Gia đình nói em bị 'ngất'."
