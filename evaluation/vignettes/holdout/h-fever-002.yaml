title_vi: "Bé trai 3 tuổi, sốt 38,5°C từ sáng, sổ mũi, ho, vẫn chơi bình thường"
narrative_vi: "Bé N., 3 tuổi, ở Cần Thơ. Từ sáng nay bé sốt 38,5°C, sổ mũi trong, nghẹt mũi và ho vài tiếng. Anh chị của bé cũng đang sổ mũi. Bé ăn kém hơn mọi ngày nhưng vẫn uống nước, uống sữa tốt, hạ sốt thì chơi bình thường. Không khó thở, không nôn, không nổi ban. Bé đã tiêm chủng đầy đủ, kể cả 2 mũi vắc xin sởi."
