id: h-sob-012
set: holdout
title_vi: "Nữ 31 tuổi uống thuốc tránh thai, sau chuyến xe 12 giờ đau bắp chân phải; từ hôm qua đột ngột khó thở, đau ngực khi hít sâu, mạch 115"
narrative_vi: "Chị V., 31 tuổi, nhân viên văn phòng ở TP.HCM, uống thuốc tránh thai hằng ngày 1 năm nay, không hút thuốc. Chín ngày trước chị đi xe khách giường nằm từ Quảng Ngãi vào, ngồi gần 12 tiếng. Bốn ngày nay bắp chân phải căng, đau, hơi to hơn chân trái. Chiều qua đang leo cầu thang chị đột ngột thấy hụt hơi, phải dừng lại; từ sáng nay ngồi yên cũng thở nhanh, mệt. Chị đau nhói ngực bên phải mỗi khi hít sâu. Tim chị đập nhanh liên tục; đồng hồ thông minh báo mạch 115 lần/phút lúc ngồi nghỉ. Chị vẫn nói trọn câu. Chị không ho, không ho ra máu, không sốt, không ngất. Chị không có thai, chưa từng bị cục máu đông, không mắc ung thư, không bị hen."
