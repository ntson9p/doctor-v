source:
  basis: "Thuyên tắc phổi ở phụ nữ trẻ uống thuốc tránh thai, sau chuyến xe ngồi lâu: đau, sưng một bên bắp chân, khó thở đột ngột rồi khó thở khi nghỉ, đau ngực kiểu màng phổi, tim nhanh 115 lần/phút. ESC 2019 (Bảng 3): thuốc tránh thai là yếu tố thuận lợi mức trung bình, ngồi lâu khi đi xa là yếu tố yếu; mục 4.1: khó thở, đau ngực màng phổi, tim nhanh. NHS Pulmonary embolism: khó thở đột ngột, đau ngực, tim rất nhanh thì gọi 999 hoặc đến cấp cứu. Còn nói trọn câu, không ngất nên mức 2."
