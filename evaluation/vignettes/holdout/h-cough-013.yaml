id: h-cough-013
set: holdout
title_vi: "Nữ 68 tuổi tăng huyết áp, từ chiều qua đột ngột sốt 39,2°C, rét run, đau nhức người, ho khan, hàng xóm bị cúm"
narrative_vi: "Bà S., 68 tuổi, ở Hà Nội, bị tăng huyết áp uống thuốc hằng ngày, không bị tiểu đường, không có bệnh tim phổi. Mấy hôm nay nhà hàng xóm có 3 người bị cúm. Chiều qua bà đột ngột rét run rồi sốt, cao nhất 39,2°C, đau nhức khắp người, đau đầu, mệt rã rời, chán ăn. Bà ho khan nhiều, đau rát họng. Sáng nay con gái cho bà tự xét nghiệm nhanh COVID-19, kết quả 1 vạch. Bà không khó thở, không đau ngực, vẫn tỉnh táo, tự đi lại được, uống được nước. Bà không nôn, không tiêu chảy, không mất mùi vị."
