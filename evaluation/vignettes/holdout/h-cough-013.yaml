source:
  basis: "Cúm mùa ở người cao tuổi: khởi phát đột ngột sốt cao, rét run, đau cơ, đau đầu, ho khan, đau họng, có người xung quanh bị cúm (CDC: dấu hiệu lâm sàng cúm). 1840/QĐ-BYT (2025): người trên 65 tuổi thuộc nhóm nguy cơ diễn biến nặng, cần khám sớm để được cân nhắc thuốc kháng vi rút (hiệu quả nhất trong 48 giờ đầu). Không khó thở, không đau ngực, tỉnh táo nên mức 3."
