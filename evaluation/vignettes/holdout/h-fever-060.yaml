source:
  basis: "Bệnh Kawasaki điển hình ở bé trai 26 tháng: sốt cao liên tục 6 ngày không đáp ứng kháng sinh, mắt đỏ không ghèn, môi đỏ nứt, lưỡi dâu tây, ban đỏ thân mình, phù đỏ bàn tay bàn chân, hạch cổ một bên, quấy khóc. Bộ Y tế 3312/QĐ-BYT 2015 (Bệnh Kawasaki): sốt liên tục từ 5 ngày kèm đủ các biểu hiện chính; globulin miễn dịch nên dùng trong 10 ngày đầu; tổn thương động mạch vành ở khoảng một phần ba ca không điều trị hoặc điều trị muộn. NHS Kawasaki disease: có triệu chứng thì khám khẩn (urgent GP / NHS 111). AHA 2017: không điều trị thì khoảng 25% bị phình động mạch vành. Mức 3."
  references:
    - byt-qd-3312-2015
    - nhs-kawasaki-disease
    - aha-kawasaki-2017
author: "agent:vignette-holdout"
notes_vi: "Ca điển hình. Sởi là chẩn đoán phân biệt nhưng bé đã tiêm đủ 2 mũi, không ho, không sổ mũi, ban không mọc từ mặt."
