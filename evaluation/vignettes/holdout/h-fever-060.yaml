id: h-fever-060
set: holdout
title_vi: "Bé trai 26 tháng sốt cao liên tục 6 ngày không đỡ với kháng sinh, mắt đỏ không ghèn, môi nứt, lưỡi dâu tây, ban đỏ, phù đỏ bàn tay bàn chân, hạch cổ"
narrative_vi: "Bé N., trai, 26 tháng, ở Hà Nội, đã tiêm đủ 2 mũi vắc xin sởi. Bé sốt cao liên tục 6 ngày nay, 39–40°C, uống hạ sốt chỉ đỡ vài giờ; đã uống kháng sinh 3 ngày theo đơn phòng khám tư nhưng không đỡ. Bé quấy khóc rất nhiều, ăn ít. Từ ngày thứ 3, hai mắt bé đỏ nhưng không có ghèn; môi đỏ sẫm, khô nứt, lưỡi đỏ rực nổi gai như quả dâu tây. Người bé nổi ban đỏ ở thân mình, ấn vào thì mất. Hai bàn tay, bàn chân sưng phù, lòng bàn tay đỏ. Cổ bên phải nổi một hạch to bằng đầu ngón tay cái. Bé không ho, không sổ mũi, không tiêu chảy, không nôn, trong miệng không có vết loét, không có nốt phỏng. Bé vẫn uống được, không li bì, không co giật."
