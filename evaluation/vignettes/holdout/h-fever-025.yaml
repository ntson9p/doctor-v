title_vi: "Bé trai 14 tháng, tiêu chảy, nôn 2 ngày, sốt, mắt trũng, tã ít ướt"
narrative_vi: "Bé L., 14 tháng, ở Cà Mau. Hai ngày nay bé đi ngoài phân toàn nước khoảng 8 lần mỗi ngày, nôn 4–5 lần, sốt 38,4°C. Mẹ thấy mắt bé trũng, tã ít ướt hơn hẳn, bé quấy khóc và uống nước háo hức. Bé không nôn ra hết mọi thứ, vẫn uống được, không li bì. Phân không có máu. Bé mới tiêm 1 mũi vắc xin sởi."
