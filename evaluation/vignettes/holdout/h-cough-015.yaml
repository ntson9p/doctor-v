source:
  basis: "Dị vật đường thở (hạt lạc) ở trẻ 20 tháng, ngoài danh mục: đột ngột sặc, ho rũ rượi khi đang ăn lạc, sau đó ho từng lúc, khò khè, thở hơi nhanh; trước đó khỏe hoàn toàn. Các tổng quan về dị vật đường thở ở trẻ em: hay gặp nhất ở trẻ 1–3 tuổi, hạt lạc là dị vật hữu cơ thường gặp nhất; sau cơn sặc có thể có giai đoạn ít triệu chứng làm chậm chẩn đoán; X-quang bình thường không loại trừ, cần nội soi phế quản sớm (trong 24 giờ). Còn thở được, môi hồng, không rít, không rút lõm nên đến cơ sở cấp cứu ngay (mức 2), không phải mức 1."
  references:
    - nhs-cough
author: "agent:vignette-holdout"
notes_vi: "Ca ngoài danh mục. Nếu trẻ không thở được, không ho được, tím tái thì là mức 1 và cần sơ cứu dị vật ngay. Hen, viêm tiểu phế quản là chẩn đoán phân biệt nhưng khởi phát ngay sau sặc."
