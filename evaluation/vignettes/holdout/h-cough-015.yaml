id: h-cough-015
set: holdout
title_vi: "Bé gái 20 tháng đang ăn lạc rang thì sặc, ho rũ rượi; 5 giờ sau vẫn ho từng lúc, thở khò khè, hơi nhanh"
narrative_vi: "Bé N., gái, 20 tháng, ở Nghệ An, đã tiêm chủng đầy đủ, kể cả 2 mũi vắc xin sởi. Chiều nay khoảng 5 giờ trước, bé ngồi ăn lạc rang cùng anh chị thì đột ngột sặc, ho rũ rượi, mặt đỏ, chảy nước mắt; mẹ vỗ lưng, vài phút sau bé đỡ ho, không thấy hạt lạc văng ra. Từ đó bé ho từng lúc, thở có tiếng khò khè, thở hơi nhanh hơn bình thường cả khi ngồi chơi. Bé vẫn tỉnh, chơi được, uống nước được, không chảy dãi, môi hồng, không rít khi hít vào, ngực không rút lõm. Trước đó bé hoàn toàn khỏe, không sổ mũi, không sốt."
