source:
  basis: "Rối loạn hoảng sợ điển hình: các cơn tái diễn đột ngột với tim nhanh, run, vã mồ hôi, chóng mặt, tê quanh miệng và đầu ngón tay, thở gấp, sợ hãi dữ dội như sắp chết, mỗi cơn 10–20 phút rồi tự hết; đã được khám cấp cứu, điện tim bình thường; đang căng thẳng, ngủ kém. NHS Panic disorder: các triệu chứng trên là triệu chứng cơn hoảng sợ, phần lớn cơn kéo dài 5–20 phút; có triệu chứng rối loạn hoảng sợ thì đi khám bác sĩ. NHS Heart palpitations: hồi hộp đã hết, vẫn khỏe nhưng hay tái lại thì đi khám bác sĩ (không khẩn). Hiện không khó thở, không đau ngực, không ngất nên mức 4."
  references:
    - "https://www.nhs.uk/mental-health/conditions/panic-disorder/"
    - nhs-heart-palpitations
author: "agent:vignette-holdout"
notes_vi: "Ca điển hình. Thở gấp trong cơn đã hết nên câu khó thở (hỏi tình trạng hiện tại) trả lời 'không'; cơn dịu dần chứ không dừng đột ngột. Danh mục chưa có câu hỏi về điện tim, xét nghiệm đã làm."
