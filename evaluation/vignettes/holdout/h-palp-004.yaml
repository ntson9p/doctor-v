id: h-palp-004
set: holdout
title_vi: "Nữ 24 tuổi, 3 tháng nay nhiều cơn đột ngột tim đập nhanh, run, tê quanh miệng, sợ hãi như sắp chết, mỗi cơn 10–20 phút; đã khám tim bình thường"
narrative_vi: "Chị K., 24 tuổi, nhân viên văn phòng ở TP.HCM. Ba tháng nay chị hay lên những cơn đột ngột: tim đập nhanh thình thịch, run tay, vã mồ hôi, chóng mặt, tê bì quanh miệng và đầu ngón tay, thở gấp, sợ hãi dữ dội như sắp chết. Mỗi cơn kéo dài khoảng 10–20 phút rồi dịu dần. Tối nay vừa có một cơn lúc đang ngồi xem điện thoại; đến giờ (1 tiếng sau) đã hết hẳn, thở bình thường, chỉ còn mệt và lo. Hai tháng trước chị từng vào cấp cứu một lần trong cơn, được đo điện tim và xét nghiệm, bác sĩ nói tim bình thường. Dạo này công việc căng thẳng, chị ngủ kém. Chị không đau ngực, không ngất, không uống thuốc gì, không có thai, không sụt cân, không sợ nóng, cổ không to; trong nhà không ai bị bệnh tim hay đột tử."
