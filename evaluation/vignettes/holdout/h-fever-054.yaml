source:
  basis: "Viêm đường mật cấp nặng ở người 84 tuổi có sỏi ống mật chủ chưa lấy: rét run, sốt 39°C, vàng mắt, lơ mơ, lú lẫn, gần như không than đau bụng (người cao tuổi hay không đủ tam chứng Charcot). Lú lẫn là dấu hiệu rối loạn chức năng cơ quan của viêm đường mật nặng. MSD Manual: viêm đường mật là cấp cứu, cần hồi sức và dẫn lưu khẩn. NICE NG253: thay đổi ý thức mới là tiêu chí nguy cơ cao của nhiễm khuẩn huyết; NHS Sepsis: lú lẫn kèm sốt thì gọi 999."
  references:
    - msd-choledocholithiasis-cholangitis
    - nice-ng253
    - nhs-sepsis
author: "agent:vignette-holdout"
notes_vi: "Ca khó ở người cao tuổi. Người nhà không rõ có đau bụng không vì ông lú lẫn, chỉ nhăn mặt khi ấn hạ sườn phải. Nhiễm khuẩn huyết đường mật là cách gọi khác cũng đúng của ca này nên chấp nhận sepsis. Danh mục chưa có câu hỏi về nước tiểu sẫm màu, phân bạc màu."
