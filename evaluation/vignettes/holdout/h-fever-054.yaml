id: h-fever-054
set: holdout
title_vi: "Nam 84 tuổi có sỏi ống mật chủ chưa lấy, rét run rồi sốt 39°C, sáng nay lơ mơ, lú lẫn, lòng trắng mắt hơi vàng, gần như không than đau bụng"
narrative_vi: "Ông B., 84 tuổi, ở Mỹ Tho (Tiền Giang), bị tăng huyết áp, biết có sỏi ống mật chủ từ 2 năm trước; bác sĩ hẹn làm thủ thuật lấy sỏi nhưng gia đình chưa đưa đi. Tối qua ông lạnh run cầm cập, sau đó sốt, con đo được 39°C. Sáng nay ông lơ mơ, lúc tỉnh lúc lẫn, nói lẫn lộn, không nhận ra cháu, gọi thì mở mắt rồi lại ngủ, không tự đứng dậy đi được. Con gái thấy lòng trắng mắt ông hơi vàng. Ông không than đau bụng, chỉ nhăn mặt khi con ấn vào vùng dưới sườn phải. Ông bỏ ăn từ hôm qua, chưa nôn. Không ho, không khó thở, không tiểu buốt, không tiêu chảy, không cứng gáy, không nổi ban, không co giật. Tay chân ông vẫn ấm."
