id: h-fever-059
set: holdout
title_vi: "Nông dân 66 tuổi lội ruộng mùa nước nổi ở Đồng Tháp, sốt cao 6 ngày, đau nhiều hai bắp chân, đỏ mắt, 2 ngày nay vàng da, tiểu rất ít, mệt lả"
narrative_vi: "Ông Đ., 66 tuổi, làm ruộng ở Tháp Mười (Đồng Tháp). Mùa nước nổi năm nay ông lội ruộng vớt lúa ngập nhiều ngày, chân có vết xước; ruộng có nhiều chuột. Sáu ngày nay ông sốt cao đột ngột 39,5°C, rét run, đau đầu, đau nhức khắp người, nhất là hai bắp chân, bóp vào rất đau. Hai mắt đỏ, không có ghèn. Hai ngày nay da và mắt vàng dần, nước tiểu ít hẳn, sẫm màu; từ tối qua đến giờ (khoảng 14 giờ) ông mới tiểu một lần rất ít. Ông buồn nôn, chán ăn, mệt lả, phải có người đỡ mới đi được. Không ho ra máu, không chảy máu chân răng, không nổi ban, không khó thở, không đau bụng. Ông vẫn tỉnh, trả lời đúng."
