source:
  basis: "Bệnh do Leptospira thể nặng (hội chứng Weil) ở nông dân 66 tuổi lội ruộng mùa nước nổi, nhiều chuột: sốt cao đột ngột, rét run, đau cơ bắp chân khi bóp, đỏ mắt, từ ngày 4–5 vàng da, tiểu rất ít, mệt lả. WHO 2003 (Human leptospirosis): hội chứng Weil gồm vàng da, suy thận, xuất huyết; đỏ kết mạc và đau cơ khi ấn (rõ nhất ở bắp chân) là dấu hiệu phân biệt nhất; người cao tuổi dễ bị nặng; thể nặng cần nhập viện, có thể phải lọc máu; tử vong 5–30%. NICE NG253: không tiểu 12–18 giờ là tiêu chí nguy cơ trung bình – cao của nhiễm khuẩn huyết, cần đánh giá khẩn ở bệnh viện. NHS Leptospirosis: vàng da, không tiểu được là dấu hiệu nặng. Mức 2."
  references:
    - who-leptospirosis-2003
    - nice-ng253
    - "https://www.nhs.uk/conditions/leptospirosis/"
author: "agent:vignette-holdout"
notes_vi: "Ca khó ở người cao tuổi. Chẩn đoán phân biệt: viêm đường mật (vàng da, sốt), sốt rét, sốt xuất huyết, nhiễm khuẩn huyết. Danh mục chưa có câu hỏi về vết xước ở chân khi lội nước."
