id: h-sob-018
set: holdout
title_vi: "Nam 24 tuổi cao gầy hút thuốc, đột ngột đau nhói ngực trái, khó thở tăng nhanh trong 2 giờ, nay không nói trọn câu, môi tím"
narrative_vi: "Anh K., 24 tuổi, lập trình viên ở TP.HCM, cao 1,82 m, gầy, hút thuốc lá 6 năm. Khoảng 2 giờ trước, đang ngồi làm việc, anh đột ngột đau nhói dữ dội ngực bên trái, đau tăng khi hít vào, kèm hụt hơi. Anh nằm nghỉ nhưng khó thở tăng dần; nửa giờ nay anh thở rất nhanh, chỉ nói được vài từ, môi tím tái, vã mồ hôi lạnh, tim đập rất nhanh. Bạn cùng phòng dùng app giúp anh. Anh không ho, không ho ra máu, không sốt, không bị chấn thương ngực, không đi xa gần đây, chân không sưng. Anh chưa từng bị hen."
