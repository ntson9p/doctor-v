source:
  basis: "Tràn khí màng phổi tự phát ở nam trẻ cao gầy hút thuốc, diễn tiến nặng (gợi ý tràn khí áp lực): đột ngột đau ngực một bên kiểu màng phổi, khó thở tăng nhanh, nay không nói trọn câu, tím, vã mồ hôi, tim rất nhanh. NHS Shortness of breath: khó thở dữ dội, không nói được thành lời, môi tím thì gọi 999. Tràn khí áp lực là cấp cứu cần giải áp ngay (BTS 2023). Mức 1."
