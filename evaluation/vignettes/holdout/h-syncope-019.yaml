id: h-syncope-019
set: holdout
title_vi: "Nữ 81 tuổi tăng huyết áp, đang ngồi ăn thì gục xuống bất tỉnh, không báo trước; mấy tuần hay xây xẩm; mạch 36"
narrative_vi: "Bà Ch., 81 tuổi, ở Vĩnh Long, bị tăng huyết áp nhiều năm, chỉ uống một loại thuốc huyết áp là amlodipine, không uống thuốc tim nào khác. Khoảng 2 tuần nay bà mệt hơn, đi chậm hơn, đi chợ về là hụt hơi; có 2 lần đang đứng nấu cơm thì xây xẩm vài giây, phải bám vào bàn. Sáng nay đang ngồi ăn sáng, bà đột ngột gục xuống bàn, mặt tái nhợt, gọi không biết; khoảng 20–30 giây sau bà tỉnh lại, mặt hồng trở lại, nói chuyện được ngay, không lú lẫn. Trước khi gục bà không thấy choáng, không vã mồ hôi, không buồn nôn, không thấy tim đập nhanh. Bà không co giật, không đập đầu. Con gái đo bằng máy đo huyết áp ở nhà: mạch 36 lần/phút, huyết áp 160/70 mmHg; 10 phút sau đo lại mạch vẫn 38 lần/phút. Hiện bà ngồi nghỉ, tỉnh táo, không đau ngực, không khó thở, không yếu tay chân, không méo miệng, không nói khó, không đau đầu. Bà không bị đái tháo đường, không đi ngoài phân đen, chưa từng ngất trước đây."
