source:
  basis: "Ngất do nhịp chậm ở người cao tuổi (nghi blốc nhĩ thất hoàn toàn, cơn Adams–Stokes): đang ngồi thì mất ý thức đột ngột, không có tiền triệu, mặt tái rồi hồng lại khi tỉnh, mạch đo 2 lần dưới 40 lần/phút, mấy tuần nay mệt, hụt hơi, xây xẩm; không dùng thuốc làm chậm nhịp tim. ESC 2018: nhịp chậm dai dẳng dưới 40 lần/phút lúc thức là đặc điểm nguy cơ cao loại nặng, ngất khi đang ngồi không có tiền triệu là nguy cơ cao loại nhẹ, người có đặc điểm nguy cơ cao cần được đánh giá sớm và tích cực ở cấp cứu; Framingham (Soteriades 2002): ngất do tim làm tăng tử vong; NHS Heart rhythm problems: tim đập quá chậm có thể gây mệt, choáng, cảm giác sắp ngất; nhịp vẫn dưới 40, có thể ngất lại hoặc ngừng tim bất cứ lúc nào nên mức 1."
  references:
    - esc-syncope-2018
    - soteriades-nejm-2002
    - nhs-arrhythmia
author: "agent:vignette-holdout"
notes_vi: "Ca điển hình của ngất do tim ở người cao tuổi; đang uống thuốc hạ áp nên dễ bị nghĩ là tụt huyết áp do thuốc. Hai lần xây xẩm khi đang đứng nấu cơm, không phải ngay lúc vừa đứng dậy, nên câu choáng khi đứng dậy trả lời 'không'. Huyết áp 160/70 mmHg chọn mức 'Từ 160/110 đến dưới 180/120 mmHg' theo hướng dẫn chọn mức cao hơn."
