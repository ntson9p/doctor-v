id: h-head-021
set: holdout
title_vi: "Nữ 15 tuổi ôn thi, thiếu ngủ, đau đầu bó chặt hai bên gần như hằng ngày 2 tháng"
narrative_vi: "Em N., nữ, 15 tuổi, học sinh lớp 9 ở Cần Thơ, đang ôn thi vào lớp 10. Hai tháng nay em học thêm đến khuya, mỗi đêm chỉ ngủ khoảng 5 tiếng, ngồi máy tính và điện thoại nhiều. Gần như ngày nào em cũng đau đầu như bị đội mũ chật, bó chặt hai bên trán và thái dương, thường từ chiều đến tối, mức nhẹ, vẫn học được. Em uống paracetamol khoảng 3 lần mỗi tuần. Em không buồn nôn, không sợ ánh sáng hay tiếng ồn, đi lại không làm đau tăng. Sáng ngủ dậy em không đau, đau không làm em thức giấc ban đêm. Em không sốt, nhìn rõ, tay chân bình thường, không bị va đập đầu. Hôm nay em đau từ 3 giờ chiều đến giờ, khoảng 5 tiếng."
