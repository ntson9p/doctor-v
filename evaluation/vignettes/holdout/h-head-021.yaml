notes_vi: "Không có dấu hiệu báo động ở trẻ vị thành niên (đau làm thức giấc, nôn buổi sáng, đau nặng dần). Dùng thuốc giảm đau khoảng 12 ngày mỗi tháng, cần được tư vấn để tránh đau đầu do lạm dụng thuốc."
