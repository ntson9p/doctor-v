source:
  basis: "Đau đầu căng thẳng ở thiếu niên: đau hai bên kiểu bó chặt, mức nhẹ, không buồn nôn, không sợ ánh sáng, không tăng khi vận động (ICHD-3), liên quan học căng thẳng, thiếu ngủ. Đau gần như hằng ngày nên cần đặt lịch khám trong vài ngày tới, không cần đi cấp cứu (NHS Tension headaches)."
