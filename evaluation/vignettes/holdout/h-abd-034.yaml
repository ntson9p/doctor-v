title_vi: "Nữ 30 tuổi, đau quặn bụng dưới trái tái đi tái lại 8 tháng, đi ngoài xong đỡ"
narrative_vi: "Chị Y., 30 tuổi, nhân viên văn phòng ở Hà Nội. Tám tháng nay chị hay đau quặn bụng dưới bên trái, đau tăng sau ăn, đi ngoài xong thì đỡ. Chị lúc đi ngoài phân lỏng, lúc táo bón, hay đầy hơi, nhất là khi căng thẳng công việc. Đợt này chị đi ngoài phân lỏng 3 lần mỗi ngày. Không sụt cân, phân không có máu, không sốt. Chị không mang thai."
