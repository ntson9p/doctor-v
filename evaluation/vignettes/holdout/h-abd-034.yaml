source:
  basis: "Hội chứng ruột kích thích: đau bụng tái diễn, đỡ sau khi đi ngoài, thay đổi tính chất phân, đầy hơi, liên quan căng thẳng, không có dấu hiệu báo động; đặt lịch khám trong vài ngày (NHS IBS: triệu chứng trên 4 tuần cần gặp bác sĩ)."
