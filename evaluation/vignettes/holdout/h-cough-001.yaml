source:
  basis: "Viêm phế quản cấp điển hình sau cảm lạnh: ho có đờm 10 ngày, không sốt, không khó thở, không đau ngực, không ho ra máu, người khỏe mạnh không bệnh nền. NHS Cough: ho thường tự hết trong 3–4 tuần, phần lớn do cảm lạnh, cúm; chỉ khám khi ho trên 3 tuần, ho rất nặng, khó thở, đau ngực, ho ra máu. Không có dấu hiệu nào nên theo dõi tại nhà (NICE NG120 cũng khuyên tự chăm sóc với ho cấp)."
  references:
