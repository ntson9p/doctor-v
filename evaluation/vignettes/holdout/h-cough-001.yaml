title_vi: "Nữ 35 tuổi, sau đợt cảm, ho có đờm 10 ngày, không sốt, không khó thở"
narrative_vi: "Chị H., 35 tuổi, nhân viên văn phòng ở Hà Nội, khỏe mạnh, không hút thuốc. Khoảng 12 ngày trước chị bị cảm, sổ mũi, đau họng vài ngày rồi hết. Từ đó chị ho, 10 ngày nay ho nhiều hơn, khạc đờm trắng đục, có lúc hơi vàng, ho nhiều nhất buổi sáng. Chị hơi mệt nhưng vẫn đi làm, ăn uống được. Chị không sốt, không khó thở, không khò khè, không đau ngực, không ho ra máu, không sụt cân. Hiện chị không còn sổ mũi hay đau họng. Chị chưa từng bị hen, không có thai."
