author: "agent:vignette-holdout"
notes_vi: "Đờm hơi vàng không phải dấu hiệu nhiễm khuẩn cần kháng sinh. Mốc khám lại: ho quá 3 tuần, sốt, khó thở, đau ngực hoặc ho ra máu."
