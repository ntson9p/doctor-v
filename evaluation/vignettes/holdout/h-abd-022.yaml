title_vi: "Nữ 24 tuổi kinh không đều, chưa thử thai, đau bụng dưới, ra máu ít, tiêu chảy"
narrative_vi: "Chị V., 24 tuổi, ở Hà Nội, kinh nguyệt vốn không đều nên không rõ lần này có chậm kinh không, chưa thử thai. Hai ngày nay chị đau âm ỉ bụng dưới, ra ít máu âm đạo lấm tấm. Chị hay mót đi ngoài, đi ngoài phân lỏng 3 lần mỗi ngày, buồn nôn nhẹ. Không sốt, không tiểu buốt, chưa ngất."
