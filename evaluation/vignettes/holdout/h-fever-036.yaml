title_vi: "Nam 40 tuổi lội nước lũ, sốt cao 3 ngày, đau bắp chân, mắt đỏ"
narrative_vi: "Anh H., 40 tuổi, nông dân ở Quảng Ngãi. Sau trận lũ cách đây 9 ngày, anh lội nước, dọn bùn ngoài ruộng không đi ủng, chân có vết xước. Ba ngày nay anh sốt cao đột ngột 39,6°C, rét run, đau nhức cơ nhiều nhất ở bắp chân, đau đầu, hai mắt đỏ. Anh buồn nôn, chán ăn, mệt. Không vàng da, đi tiểu bình thường, không chảy máu, không ho."
