source:
  basis: "Bệnh do Leptospira sau phơi nhiễm nước lũ ở miền Trung: sốt đột ngột, đau cơ, đỏ mắt, chưa có vàng da hay tiểu ít; ở vùng nhiệt đới cần khám trong 24 giờ để xét nghiệm và điều trị kháng sinh sớm (NHS Leptospirosis: vàng da, tiểu ít cần khám gấp)."
