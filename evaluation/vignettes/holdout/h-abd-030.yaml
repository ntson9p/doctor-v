narrative_vi: "Ông L., 78 tuổi, ở Hà Nội, bị đái tháo đường và tăng huyết áp. Sáng nay trời lạnh, ngủ dậy khoảng 1 giờ thì ông thấy nóng rát, tức vùng trên rốn, vã mồ hôi lạnh, buồn nôn. Ông nghĩ là đau dạ dày nên uống thuốc dạ dày nhưng không đỡ. Ông không thấy đau ngực, không khó thở, không ngất."
