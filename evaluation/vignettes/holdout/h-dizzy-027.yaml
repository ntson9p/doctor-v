id: h-dizzy-027
set: holdout
title_vi: "Nữ 36 tuổi có tiền sử đau nửa đầu, 8 tháng nay 7–8 đợt chóng mặt quay nửa giờ đến vài giờ kèm buồn nôn, sợ ánh sáng, đau đầu nhẹ; đợt này sau một tuần thiếu ngủ"
narrative_vi: "Chị L., 36 tuổi, giáo viên ở Hà Nội, bị đau nửa đầu từ năm 20 tuổi, hay lên cơn trước kỳ kinh hoặc khi thiếu ngủ: đau giật giật một bên đầu, sợ ánh sáng, sợ tiếng ồn. Khoảng 8 tháng nay chị có thêm những đợt chóng mặt: tự nhiên thấy mọi vật quay tròn hoặc chòng chành, mỗi đợt kéo dài từ nửa giờ đến vài giờ, kèm buồn nôn, sợ ánh sáng, nhiều lần có đau đầu giống cơn đau nửa đầu. Đã khoảng 7–8 đợt, giữa các đợt hoàn toàn bình thường. Đợt này bắt đầu từ 2 giờ trước, sau một tuần chấm thi thiếu ngủ: chóng mặt quay, buồn nôn, đau đầu nhẹ giật giật bên trái, khó chịu với ánh sáng và tiếng ồn; chị nằm yên trong phòng tối thì đỡ hơn, vẫn tự đi vào nhà vệ sinh được. Không nôn, không ù tai, không nghe kém, không nhìn đôi, không yếu tê tay chân, nói rõ. Không bị bẻ cổ hay va đập. Kinh nguyệt đều, không có thai."
