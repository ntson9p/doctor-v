source:
  basis: "Đau nửa đầu tiền đình ở nữ 36 tuổi có tiền sử đau nửa đầu: 8 tháng nay 7–8 đợt chóng mặt quay tự phát, mỗi đợt nửa giờ đến vài giờ, kèm buồn nôn, sợ ánh sáng, nhiều đợt có đau đầu kiểu đau nửa đầu; đợt này sau một tuần thiếu ngủ; không ù tai, không nghe kém, không dấu hiệu thần kinh, tự đi được. Bárány Society và IHS (Lempert 2022): ít nhất 5 đợt triệu chứng tiền đình mức vừa hoặc nặng, mỗi đợt 5 phút đến 72 giờ, có tiền sử đau nửa đầu, ít nhất một nửa số đợt có đặc điểm đau nửa đầu; 65–85% là nữ. NHS Vertigo: chóng mặt quay hay tái lại thì khám bác sĩ (không khẩn); không có dấu hiệu cần cấp cứu (nhìn đôi, nghe kém, nói khó, yếu tê). Mức 4."
