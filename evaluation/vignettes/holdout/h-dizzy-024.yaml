id: h-dizzy-024
set: holdout
title_vi: "Cụ bà 79 tuổi đái tháo đường típ 2 tự bỏ thuốc 3 tuần, khát nhiều, tiểu nhiều, sụt cân, choáng khi đứng, không đứng vững, nay lơ mơ, lú lẫn; máy đo đường huyết báo 'HI'"
narrative_vi: "Bà T., 79 tuổi, ở Long Xuyên (An Giang), bị đái tháo đường típ 2 và tăng huyết áp. Khoảng 3 tuần nay bà tự bỏ thuốc tiểu đường vì hết thuốc, ngại đi khám; thuốc huyết áp vẫn uống. Hai tuần nay bà khát nước nhiều, uống nhiều nước mía, nước ngọt, đi tiểu liên tục, kể cả ban đêm; người gầy rộc đi. Mấy hôm nay bà than chóng mặt, choáng váng, đứng dậy là tối sầm mắt, phải vịn tường; không thấy mọi vật quay tròn. Từ hôm qua bà mệt lả, lơ mơ, lúc nói chuyện được lúc lẫn lộn, không nhận ra cháu, không tự đứng vững. Con gái đo đường huyết bằng máy, máy báo 'HI'. Bà không sốt, không ho, không tiểu buốt, không nôn, không tiêu chảy, không đau ngực, không đau đầu. Không méo miệng, hai tay chân cử động đều. Nhà không đốt than."
