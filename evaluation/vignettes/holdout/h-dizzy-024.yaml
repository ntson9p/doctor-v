source:
  basis: "Tình trạng tăng áp lực thẩm thấu do đái tháo đường ở cụ bà 79 tuổi đái tháo đường típ 2 tự bỏ thuốc 3 tuần, uống nhiều nước ngọt: 2 tuần khát nhiều, tiểu nhiều, sụt cân, choáng khi đứng, không tự đứng vững, rồi lơ mơ, lú lẫn; máy đo đường huyết báo 'HI'; không sốt, không nôn, không dấu hiệu thần kinh khu trú. ADA 2024 (Umpierrez và cộng sự, Hyperglycemic crises in adults with diabetes): tăng áp lực thẩm thấu hay gặp ở người cao tuổi đái tháo đường típ 2, có thể hình thành trong nhiều ngày đến nhiều tuần với tiểu nhiều, khát nhiều, sụt cân, mất nước, thay đổi ý thức; là cấp cứu đe dọa tính mạng. NHS Diabetic ketoacidosis: buồn ngủ hoặc lú lẫn ở người đái tháo đường thì gọi 999 hoặc đến cấp cứu. Lú lẫn, li bì nên mức 1."
  references:
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC11272983/"
    - nhs-diabetic-ketoacidosis
author: "agent:vignette-holdout"
notes_vi: "Ca khó ở người cao tuổi; bệnh đúng là thể tăng áp lực thẩm thấu của bệnh 'Nhiễm toan ceton, tăng áp lực thẩm thấu do đái tháo đường'. Người nhà chọn 'Chóng mặt' vì bà than choáng váng. Đột quỵ là chẩn đoán phân biệt vì không tự đứng vững. Danh mục chưa có câu hỏi về bỏ thuốc tiểu đường hay uống nhiều nước ngọt."
