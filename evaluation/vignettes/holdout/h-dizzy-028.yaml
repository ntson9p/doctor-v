id: h-dizzy-028
set: holdout
title_vi: "Thợ xây 28 tuổi làm trên mái giữa trưa nắng 39°C ở Hà Nội: choáng váng, nhức đầu, buồn nôn, ra nhiều mồ hôi, chuột rút, 37,9°C; nghỉ chỗ mát, uống oresol 30 phút thì đỡ nhiều"
narrative_vi: "Anh K., 28 tuổi, thợ xây ở Hà Nội, khỏe mạnh. Hôm nay nắng nóng 39°C, anh làm trên mái công trình từ trưa đến 3 giờ chiều, uống ít nước. Khoảng 3 giờ chiều anh thấy choáng váng, chòng chành, nhức đầu, buồn nôn, ra mồ hôi rất nhiều, rất khát, mệt rã rời, chuột rút ở bắp chân. Đồng nghiệp đưa anh xuống chỗ râm mát, cởi bớt áo, quạt và lau người bằng nước mát, cho uống nước và oresol. Tổ trưởng đo nhiệt độ ở nách được 37,9°C. Sau khoảng 30 phút anh đỡ nhiều, hết choáng, tỉnh táo, nói chuyện bình thường, đi lại vững. Anh không nôn, không ngất, không đau ngực, không khó thở, không thấy tim đập loạn, không thấy mọi vật quay tròn."
