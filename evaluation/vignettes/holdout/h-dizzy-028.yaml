source:
  basis: "Kiệt sức do nóng ở thợ xây 28 tuổi làm việc trên mái giữa trưa nắng 39°C, uống ít nước: choáng váng, nhức đầu, buồn nôn, ra nhiều mồ hôi, rất khát, mệt, chuột rút, nhiệt độ 37,9°C; được đưa vào chỗ mát, quạt, lau nước mát, uống nước và oresol, sau 30 phút đỡ nhiều, tỉnh táo, đi vững. NHS Heat exhaustion and heatstroke: kiệt sức do nóng gồm mệt, chóng mặt, đau đầu, buồn nôn, ra nhiều mồ hôi, chuột rút, rất khát; không cần cấp cứu nếu làm mát được trong 30 phút; chỉ gọi 999 khi vẫn không khỏe sau 30 phút, thân nhiệt rất cao, da nóng không ra mồ hôi, lú lẫn, co giật. Mức 5."
