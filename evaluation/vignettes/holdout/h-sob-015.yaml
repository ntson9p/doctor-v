source:
  basis: "Nhiễm khuẩn huyết từ đường tiết niệu ở người cao tuổi đái tháo đường: sốt cao, rét run, tiểu buốt, nay thở nhanh, lơ mơ, lẫn lộn, tay chân lạnh, tiểu ít. NICE NG253 (từ 16 tuổi): thở nhanh, thay đổi tri giác mới xuất hiện, da tái, tiểu ít là tiêu chí nguy cơ cao, cần cấp cứu ngay. Mức 1."
