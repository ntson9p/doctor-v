id: h-sob-015
set: holdout
title_vi: "Nam 81 tuổi đái tháo đường, 2 ngày tiểu buốt, sốt rét run; hôm nay thở nhanh, lơ mơ, lẫn lộn, tay chân lạnh"
narrative_vi: "Ông T., 81 tuổi, ở Tiền Giang, bị đái tháo đường và phì đại tiền liệt tuyến, uống thuốc tiểu đường hằng ngày. Hai ngày nay ông tiểu buốt, tiểu nhiều lần, sốt, có cơn rét run, con gái đo được 39,3°C. Sáng nay ông thở nhanh, thở mệt cả khi nằm yên; con gái lo nên chọn 'Khó thở'. Ông lơ mơ, gọi mới mở mắt, nói lẫn lộn, không biết đang ở đâu; mệt lả không tự ngồi dậy được. Tay chân ông lạnh, da tái. Từ tối qua ông đi tiểu rất ít. Con gái đo SpO2 được 94%. Ông không ho, không đau ngực, không nôn, không co giật, không méo miệng."
