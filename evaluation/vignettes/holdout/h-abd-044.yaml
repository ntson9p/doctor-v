title_vi: "Bé gái 6 tuổi, đau bụng dưới, đau buốt khi tiểu, tiểu nhiều lần 2 ngày, mới bị đái dầm, không sốt"
narrative_vi: "Bé M., gái, 6 tuổi, học lớp 1 ở Đà Nẵng. Ở trường bé ít uống nước, hay nhịn tiểu. Hai ngày nay bé kêu đau âm ỉ bụng dưới, mỗi lần đi tiểu thì kêu rát, có lúc khóc. Bé đi tiểu rất nhiều lần, mỗi lần chỉ được một ít, có lúc chạy không kịp nên són ra quần; đêm qua bé đái dầm, dù đã hết đái dầm từ năm 4 tuổi. Nước tiểu hơi đục, không đỏ. Mẹ đo nhiệt độ 37,2°C. Bé không kêu đau lưng, không nôn, không tiêu chảy, vẫn ăn uống và chơi bình thường."
