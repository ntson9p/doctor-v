source:
  basis: "Nhiễm khuẩn tiết niệu dưới (viêm bàng quang) ở trẻ gái: đau bụng dưới, đau buốt khi tiểu, tiểu nhiều lần, són tiểu, đái dầm mới xuất hiện, không sốt, không đau hông lưng. NHS UTIs: trẻ từ 15 tuổi trở xuống có triệu chứng nhiễm khuẩn tiết niệu cần hẹn khám khẩn (trong ngày hoặc hôm sau) để xét nghiệm nước tiểu và điều trị."
  references:
    - nhs-utis
author: "agent:vignette-holdout"
notes_vi: "Không sốt, không đau hông lưng nên nghĩ nhiễm khuẩn tiết niệu dưới, không phải viêm thận – bể thận. Danh mục chưa có câu hỏi về són tiểu, đái dầm mới xuất hiện, nước tiểu đục."
