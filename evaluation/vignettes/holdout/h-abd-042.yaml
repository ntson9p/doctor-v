source:
  basis: "Viêm dạ dày, loét tá tràng do H. pylori ở trẻ: đau vùng trên rốn lúc đói, đau thức giấc ban đêm, ăn vào đỡ, ợ chua, kéo dài 2 tháng, bố từng bị loét (Nguyen 2023). Không có dấu hiệu báo động (nôn ra máu, phân đen, sụt cân, nôn kéo dài) nên đặt lịch khám trong vài ngày (NHS Stomach ulcer)."
  references:
    - nhs-stomach-ulcer
    - nguyen-healthcare-2023
    - msd-peptic-ulcer
author: "agent:vignette-holdout"
notes_vi: "Đau thức giấc ban đêm gợi ý nguyên nhân thực thể, không nên coi là đau bụng chức năng. Danh mục chưa có câu hỏi về người nhà nhiễm H. pylori."
