id: h-abd-042
set: holdout
title_vi: "Bé trai 12 tuổi, đau rát vùng trên rốn lúc đói 2 tháng, có đêm đau thức giấc, ăn vào đỡ"
narrative_vi: "Bé K., nam, 12 tuổi, học sinh lớp 7 ở Thành phố Hồ Chí Minh. Khoảng 2 tháng nay bé hay đau âm ỉ, nóng rát vùng trên rốn, nhất là lúc đói; có đêm bé đau thức giấc lúc nửa đêm, ăn chút bánh hoặc uống sữa thì đỡ. Bé hay ợ chua, đôi khi buồn nôn. Bố bé từng bị loét dạ dày do vi khuẩn HP. Bé không nôn, không nôn ra máu, phân vàng bình thường, không sụt cân, không sốt, vẫn ăn uống và đi học bình thường."
