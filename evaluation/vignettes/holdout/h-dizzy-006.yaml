source:
  basis: "Cơn thiếu máu não thoáng qua tuần hoàn sau, biểu hiện chủ yếu là chóng mặt: đột ngột chòng chành, không ngồi vững (thất điều) kèm nói khó khoảng 15 phút rồi hết, ở người 79 tuổi có rung nhĩ đã bỏ thuốc chống đông và tăng huyết áp; người bệnh chỉ kể là 'chóng mặt' và đến sáng hôm sau mới kể. 3312/QĐ-BYT (2024): dấu hiệu dễ bị bỏ qua của cơn thiếu máu não thoáng qua gồm chóng mặt, thất điều, nói khó; nguy cơ tái phát sớm rất cao; điều trị dự phòng ngay, tối ưu trong 24 giờ đầu. NHS TIA: rung nhĩ, tăng huyết áp, tuổi cao là yếu tố nguy cơ; cần khám chuyên khoa trong 24 giờ kể từ khi khởi phát. Khởi phát khoảng 18 giờ trước, triệu chứng đã hết: đến cấp cứu ngay (mức 2)."
  references:
    - byt-qd-3312-2024
    - nhs-tia
    - grace3-dizziness-2023
author: "agent:vignette-holdout"
notes_vi: "Ca khó: biểu hiện không điển hình, kể muộn. Mất thăng bằng chiều qua đã hết nên câu 'đột ngột mất thăng bằng' (hỏi tình trạng hiện tại) trả lời 'không'; triệu chứng đã hết ghi ở câu 'yếu, tê nửa người hoặc nói khó, dù đã tự hết'. Đã tự bỏ thuốc chống đông 2 tháng nên câu đang uống thuốc chống đông trả lời 'không'."
