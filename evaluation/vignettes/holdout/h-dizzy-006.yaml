id: h-dizzy-006
set: holdout
title_vi: "Nữ 79 tuổi rung nhĩ tự bỏ thuốc chống đông, chiều qua 15 phút chòng chành, không ngồi vững, nói ngọng rồi tự hết"
narrative_vi: "Bà Kh., 79 tuổi, ở Vĩnh Phúc, bị rung nhĩ (bác sĩ nói tim đập không đều) và tăng huyết áp; bà có đơn thuốc chống đông nhưng tự bỏ uống từ 2 tháng nay vì sợ chảy máu, vẫn uống thuốc huyết áp. Chiều qua khoảng 4 giờ, đang ngồi nhặt rau, bà đột ngột thấy chòng chành, chao đảo, không ngồi vững, nói ngọng líu lưỡi khoảng 15 phút rồi tự hết. Bà nghĩ do mệt nên không nói với ai. Sáng nay con gái về chơi, bà mới kể là chiều qua bị chóng mặt. Hiện bà nói rõ, cười hai bên miệng đều, giơ hai tay đều, tự đi lại vững, không còn chóng mặt. Bà không đau đầu, không buồn nôn, không nhìn đôi, không ù tai, không ngất, không đau ngực, không thấy tim đập nhanh. Con gái đo huyết áp được 150/85 mmHg, máy báo nhịp tim không đều."
