title_vi: "Nam 70 tuổi, đau âm ỉ bụng dưới bên phải 2 ngày, sốt 38,3°C, chán ăn"
narrative_vi: "Ông T., 70 tuổi, ở Quảng Nam, bị đái tháo đường và tăng huyết áp. Hai ngày nay ông đau âm ỉ bụng dưới, nay đau nhiều hơn ở bên phải, không nhớ lúc đầu đau ở đâu. Đi lại thì đau tăng. Ông sốt 38,3°C, mệt, chán ăn, buồn nôn nhưng không nôn, vẫn đi ngoài và xì hơi được. Ông không tiểu buốt, chưa từng mổ bụng."
