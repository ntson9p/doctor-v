title_vi: "Nữ 30 tuổi mang thai 24 tuần, sốt cao, rét run, đau dưới sườn phải và hông lưng, nôn nhiều"
narrative_vi: "Chị T., 30 tuổi, ở Hải Dương, đang mang thai 24 tuần. Từ hôm qua chị đau âm ỉ dưới sườn phải lan ra hông lưng phải, rét run, sốt 39,3°C. Chị buồn nôn, nôn nhiều lần, uống nước vào lại nôn ra. Chị đi tiểu nhiều lần nhưng không buốt. Không ra máu âm đạo, không đau bụng từng cơn. Huyết áp đo ở trạm y tế 120/75 mmHg."
