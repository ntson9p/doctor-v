source:
  basis: "Viêm thận – bể thận ở phụ nữ có thai, nôn không giữ được nước: cần nhập viện truyền kháng sinh (NHS Kidney infection: phụ nữ có thai có thể cần điều trị tại bệnh viện; NICE NG111 khuyên chuyển viện khi có thai hoặc không uống được)."
