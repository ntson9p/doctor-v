id: h-fever-028
set: holdout
title_vi: "Bé gái 11 tuổi, sốt xuất huyết ngày 5, đau bụng, nôn nhiều, chảy máu chân răng"
narrative_vi: "Bé N., 11 tuổi, ở Thành phố Hồ Chí Minh. Bé sốt cao 39–40°C đã 5 ngày, trong lớp có nhiều bạn bị sốt xuất huyết. Hôm nay bé bớt sốt nhưng đau bụng liên tục ở dưới sườn phải, nôn 4 lần trong 6 giờ, uống vào lại nôn. Bé chảy máu chân răng khi đánh răng, ở cẳng chân có chấm đỏ li ti ấn không mất. Bé mệt, đau đầu, đau mỏi người, nhưng vẫn tỉnh, tay chân còn ấm, vẫn đi tiểu được."
