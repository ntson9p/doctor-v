source:
  basis: "Tràn khí màng phổi thứ phát ở người bệnh phổi tắc nghẽn mạn tính: sau cơn ho mạnh đột ngột đau ngực một bên kiểu màng phổi, khó thở cả khi nghỉ, thuốc cắt cơn không đỡ, đờm không đổi (khác đợt cấp nhiễm khuẩn). BTS 2023 (bệnh màng phổi): tràn khí thứ phát nguy hiểm hơn tràn khí nguyên phát, cần điều trị tại bệnh viện. NHS Shortness of breath: khó thở đột ngột, nặng thì gọi 999 hoặc đến cấp cứu. Còn nói được, SpO2 93% nên mức 2."
  references:
    - nhs-shortness-of-breath
author: "agent:vignette-holdout"
notes_vi: "Ca không điển hình: người cao tuổi có bệnh phổi nền, dễ nhầm với đợt cấp bệnh phổi tắc nghẽn mạn tính. Thuyên tắc phổi là chẩn đoán phân biệt."
