id: h-sob-009
set: holdout
title_vi: "Nam 68 tuổi bệnh phổi tắc nghẽn mạn tính, sau cơn ho mạnh đột ngột đau nhói ngực trái, khó thở cả khi ngồi, xịt thuốc không đỡ"
narrative_vi: "Ông Đ., 68 tuổi, ở Nam Định, hút thuốc lá 40 năm, bỏ được 5 năm, bị bệnh phổi tắc nghẽn mạn tính 6 năm, dùng bình xịt hằng ngày. Nhiều năm nay ông ho khạc ít đờm trắng mỗi sáng, mấy hôm nay vẫn như mọi khi, không đổi màu. Khoảng 3 giờ trước, sau một cơn ho mạnh, ông đột ngột đau nhói ngực bên trái, đau tăng khi hít vào, rồi khó thở nhiều, ngồi yên cũng thở dốc. Ông đã xịt thuốc cắt cơn 3 lần mà không đỡ. Ông vẫn nói được câu ngắn, tỉnh táo, môi chưa tím. Con trai đo SpO2 được 93%. Ông không sốt, không ho ra máu, chân không sưng phù."
