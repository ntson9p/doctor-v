title_vi: "Nữ 58 tuổi, đột ngột đau đầu sau gáy, choáng váng, nhìn đôi, nôn, đi loạng choạng"
narrative_vi: "Bà P., 58 tuổi, ở Đồng Nai, bị đái tháo đường và tăng huyết áp. Khoảng 2 giờ trước bà đột ngột đau đầu vùng sau gáy, choáng váng, đi loạng choạng, nhìn một vật thành hai, nôn 2 lần. Bà không méo miệng, hai tay giơ lên đều nhau, nói được. Huyết áp đo được 170/100 mmHg. Bà không sốt."
