id: h-syncope-009
set: holdout
title_vi: "Nữ 82 tuổi đái tháo đường, 2 ngày sốt, rét run, tiểu buốt; sáng nay ngồi dậy thì lả đi, lơ mơ, nói lẫn lộn, thở nhanh, tay chân lạnh"
narrative_vi: "Bà V., 82 tuổi, ở Tây Ninh, bị đái tháo đường, uống thuốc tiểu đường hằng ngày. Hai ngày nay bà tiểu buốt, tiểu nhiều lần, sốt, rét run, ăn uống rất kém. Sáng nay bà ngồi dậy thì choáng, lả đi, con gái đỡ kịp. Từ đó bà lơ mơ, gọi mới mở mắt, nói lẫn lộn, không nhận ra cháu, khác hẳn mọi ngày. Bà thở nhanh, tay chân lạnh, mệt lả không tự đi lại được. Con gái đo nhiệt độ 39,2°C, đo đường huyết bằng máy ở nhà được 15 mmol/L. Từ tối qua đến giờ bà chưa đi tiểu. Bà không ho, không đau ngực, không co giật, không méo miệng, không yếu một bên người."
