source:
  basis: "Nhiễm khuẩn huyết từ đường tiết niệu ở người rất cao tuổi đái tháo đường: sốt cao, rét run, tiểu buốt, tiểu nhiều lần, rồi lả đi khi ngồi dậy, lơ mơ, lú lẫn mới, thở nhanh, tay chân lạnh, không tiểu từ tối qua. NICE NG253: thay đổi ý thức mới, thở nhanh, không tiểu nhiều giờ là tiêu chí nguy cơ cao. NHS Sepsis: ở người từ 5 tuổi, lú lẫn, nói lẫn lộn, thở rất nhanh thì gọi 999. NHS UTIs: người già nhiễm khuẩn tiết niệu có thể lú lẫn; lú lẫn, lơ mơ thì gọi 999. Mức 1."
  references:
    - nice-ng253
    - nhs-sepsis
    - nhs-utis
author: "agent:vignette-holdout"
notes_vi: "Bệnh đã có trong danh mục, nay thêm triệu chứng chính 'Ngất'. Người nhà chọn 'Ngất, suýt ngất' vì bà lả đi khi ngồi dậy. Viêm thận bể thận là nguồn nhiễm khuẩn nên được chấp nhận. Bà đang lú lẫn nên không trả lời được câu đau hông lưng."
