title_vi: "Nữ 27 tuổi mang thai 28 tuần, sốt cao đột ngột, rét run, đau nhức người, ho, xưởng có nhiều người bị cúm"
narrative_vi: "Chị M., 27 tuổi, công nhân ở Bắc Ninh, đang mang thai con đầu được 28 tuần. Mấy hôm nay phân xưởng của chị có nhiều người nghỉ vì cúm A. Từ tối qua chị rét run rồi sốt 38,8°C, đau nhức khắp người, đau đầu, ho khan, đau họng, sổ mũi. Chị mệt, ăn kém. Sáng nay chị tự test nhanh COVID-19 thì 1 vạch. Chị không khó thở, không đau ngực, không mất mùi vị. Thai vẫn máy đều, chị không đau bụng, không ra máu, không bị phù."
