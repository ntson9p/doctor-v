source:
  basis: "Thiếu máu thiếu sắt do kinh nguyệt ra nhiều: mệt, da xanh, môi nhợt, choáng, hoa mắt nhất là khi đứng dậy, hụt hơi và tim đập mạnh khi gắng sức nhẹ, kéo dài vài tháng. NHS Iron deficiency anaemia: kinh nguyệt nhiều là nguyên nhân rất hay gặp; triệu chứng mệt, khó thở, hồi hộp, da nhợt; nghĩ mình bị thiếu máu thiếu sắt thì đi khám bác sĩ (không khẩn). NHS Dizziness: thiếu máu thiếu sắt là một nguyên nhân chóng mặt. Không ngất, không đau ngực, không khó thở khi nghỉ, không đi ngoài phân đen nên mức 4."
  references:
    - "https://www.nhs.uk/conditions/iron-deficiency-anaemia/"
    - nhs-dizziness
author: "agent:vignette-holdout"
notes_vi: "Ca điển hình. Kinh nguyệt ra nhiều là ra máu trong kỳ kinh, nên câu ra máu âm đạo bất thường (không phải kỳ kinh) trả lời 'không'. Đã được nói là thiếu máu nhẹ từ năm ngoái."
