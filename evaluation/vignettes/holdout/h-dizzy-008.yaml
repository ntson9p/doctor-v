id: h-dizzy-008
set: holdout
title_vi: "Nữ 34 tuổi, 1 năm kinh nguyệt ra nhiều, 3 tháng nay mệt, xanh xao, hay choáng khi đứng dậy, hụt hơi khi leo cầu thang"
narrative_vi: "Chị M., 34 tuổi, giáo viên ở Quy Nhơn (Bình Định). Khoảng một năm nay kinh nguyệt ra rất nhiều, mỗi kỳ 8–9 ngày, có hôm phải thay băng vệ sinh 1–2 giờ một lần, có máu cục. Ba tháng nay chị mệt mỏi, gần như ngày nào cũng choáng váng, hoa mắt, nhất là khi đứng dậy nhanh; leo hai tầng cầu thang đã hụt hơi, tim đập thình thịch. Đồng nghiệp bảo chị trông xanh xao, môi nhợt. Năm ngoái khám sức khỏe định kỳ ở trường, bác sĩ nói chị bị thiếu máu nhẹ, dặn uống viên sắt, nhưng chị chỉ uống vài tuần rồi bỏ. Chị không thấy mọi vật quay tròn, chưa ngất, không đau ngực, ngồi nghỉ không khó thở, không đau đầu, không ù tai. Đi ngoài phân bình thường, không đen. Chị không sụt cân, không có thai (kinh vẫn đều, vừa hết kỳ kinh tuần trước), không uống thuốc gì thường xuyên."
