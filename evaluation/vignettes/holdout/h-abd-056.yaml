title_vi: "Nam 23 tuổi từng có 2 cơn đau tinh hoàn phải ngắn tự hết, nay đau bẹn và bụng dưới phải lan xuống tinh hoàn hơn 2 giờ, buồn nôn; tưởng sỏi thận"
narrative_vi: "Anh Q., 23 tuổi, công nhân ở Bình Dương. Ba tháng nay anh đã 2 lần bị đau nhói ở tinh hoàn phải chừng 15–20 phút rồi tự hết, nên không đi khám. Khoảng 2 giờ trước, đang bê hàng, anh đột ngột đau ở bẹn phải và bụng dưới bên phải, đau lan xuống tinh hoàn phải; lần này đau tăng dần, không hết. Anh buồn nôn nhưng không nôn. Anh nghĩ mình bị sỏi thận nên định uống thuốc giảm đau rồi theo dõi. Bìu phải hơi sưng, chạm vào đau. Không sốt, không tiểu buốt, nước tiểu không đỏ, không đau hông lưng, không có khối phồng ở bẹn. Anh chưa từng bị sỏi thận."
