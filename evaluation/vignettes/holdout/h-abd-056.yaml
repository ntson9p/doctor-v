source:
  basis: "Xoắn tinh hoàn ở nam 23 tuổi, trước đó có 2 cơn đau tinh hoàn ngắn tự hết (xoắn rồi tự tháo xoắn), nay đau bẹn, bụng dưới phải lan xuống tinh hoàn phải hơn 2 giờ, buồn nôn, bìu sưng đau; người bệnh tưởng sỏi thận. NHS Testicle pain: đau tinh hoàn kéo dài hơn 1 giờ, hoặc kèm buồn nôn, nôn, đau bụng thì đến cấp cứu ngay hoặc gọi 999; xoắn tinh hoàn có thể làm mất tinh hoàn nếu không điều trị nhanh. EAU (2026): tổn thương phụ thuộc thời gian, cửa sổ khoảng 4–6 giờ, cần mổ thám sát khẩn."
  references:
    - nhs-testicle-pain
    - eau-paediatric-urology-2026
author: "agent:vignette-holdout"
notes_vi: "Ca khó: người lớn, đau chưa đến mức không chịu nổi, giống cơn đau quặn thận lan xuống bẹn. Danh mục chưa có câu hỏi về tinh hoàn nằm cao hoặc nằm ngang."
