id: h-fever-057
set: holdout
title_vi: "Nam 72 tuổi sốt nhẹ, nhức đầu 4 ngày, từ hôm qua nói năng lộn xộn, khó tìm từ, cáu gắt, đêm đi lang thang không biết mình ở đâu"
narrative_vi: "Ông G., 72 tuổi, ở Bắc Ninh, bị tăng huyết áp, trước đây khỏe, minh mẫn. Bốn ngày nay ông sốt nhẹ, đo được 38,3°C, kêu nhức đầu khắp đầu. Từ hôm qua vợ thấy ông khác hẳn: nói năng lộn xộn, gọi nhầm tên con cháu, lúc thì gắt gỏng vô cớ, hỏi câu này trả lời câu khác, có lúc không tìm ra từ để nói. Đêm qua ông đi lang thang trong nhà, không biết mình đang ở đâu. Ông không bị méo miệng, không yếu tay chân, vẫn tự đi lại được. Không co giật, không cứng gáy, không nôn, không nổi ban, không ho, không tiểu buốt, không vàng da, không đau bụng."
