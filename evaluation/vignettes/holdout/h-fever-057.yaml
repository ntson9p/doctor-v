source:
  basis: "Viêm não (nhiều khả năng do vi rút herpes) ở nam 72 tuổi: sốt nhẹ, nhức đầu 4 ngày, rồi thay đổi hành vi, nói lộn xộn, khó tìm từ, lú lẫn, đi lang thang; không cứng gáy, không co giật, không yếu nửa người. NHS Encephalitis: bệnh thường bắt đầu như cúm (sốt, đau đầu), sau đó trong vài giờ đến vài ngày xuất hiện lú lẫn, thay đổi tính cách và hành vi, khó nói, co giật; có các dấu hiệu này thì gọi 999 ngay."
  references:
    - "https://www.nhs.uk/conditions/encephalitis/"
author: "agent:vignette-holdout"
notes_vi: "Ca khó ở người cao tuổi: sốt nhẹ, triệu chứng chính là thay đổi hành vi. Ở nhà không phân biệt được viêm não với viêm màng não khi có sốt, đau đầu, lú lẫn mà không cứng gáy, nên chấp nhận bacterial_meningitis. Danh mục chưa có câu hỏi về thay đổi hành vi, tính cách hay khó tìm từ xuất hiện dần trong vài ngày (câu 'nói khó' hiện chỉ hỏi kiểu đột ngột như đột quỵ)."
