id: h-fever-062
set: holdout
title_vi: "Bé trai 9 tuổi sau buổi hội thao giữa trưa nắng: mệt, đỏ mặt, nhiều mồ hôi, nhức đầu, nôn 1 lần, 38,3°C; làm mát, uống oresol 1 giờ thì đỡ hẳn"
narrative_vi: "Bé T., nam, 9 tuổi, ở Biên Hòa (Đồng Nai), đã tiêm đủ 2 mũi vắc xin sởi. Hôm nay trường tổ chức hội thao, bé chạy thi và đứng ngoài sân nắng gần như cả buổi trưa, trời khoảng 37°C, bé mang theo ít nước. Chiều về bé mệt, đỏ bừng mặt, ra nhiều mồ hôi, kêu nhức đầu, buồn nôn, nôn 1 lần. Mẹ đo nhiệt độ được 38,3°C. Mẹ cho bé vào phòng có quạt, lau người bằng nước mát, cho uống từng ngụm nước và oresol. Khoảng 1 giờ sau bé đỡ hẳn, đo lại 37,4°C, tỉnh táo, uống được nước, đi tiểu được, đòi ăn. Bé không ho, không sổ mũi, không đau họng, không tiêu chảy, không đau bụng, không nổi ban, không co giật, không lú lẫn. Mấy hôm nay trong lớp không có bạn nào bị sốt."
