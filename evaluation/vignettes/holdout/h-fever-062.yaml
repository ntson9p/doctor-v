source:
  basis: "Kiệt sức do nóng ở bé trai 9 tuổi sau buổi hội thao giữa trưa nắng, uống ít nước: mệt, đỏ bừng mặt, ra nhiều mồ hôi, nhức đầu, buồn nôn, nôn 1 lần, nhiệt độ 38,3°C; được làm mát, uống nước và oresol thì sau khoảng 1 giờ đỡ hẳn, nhiệt độ về 37,4°C, tỉnh táo, ăn uống được. NHS Heat exhaustion and heatstroke: kiệt sức do nóng gồm mệt, đau đầu, buồn nôn hoặc nôn, ra nhiều mồ hôi, nhiệt độ cao, rất khát; không cần cấp cứu nếu làm mát được trong 30 phút; chỉ gọi 999 khi vẫn không khỏe sau 30 phút, thân nhiệt rất cao, da nóng không ra mồ hôi, lú lẫn, co giật. Đã hồi phục nên theo dõi tại nhà."
