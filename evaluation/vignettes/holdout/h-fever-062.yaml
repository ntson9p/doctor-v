    - nhs-heat-exhaustion-heatstroke
author: "agent:vignette-holdout"
notes_vi: "Ca khó: người nhà chọn 'Sốt' vì đo được 38,3°C; phơi nắng là manh mối chính để phân biệt với sốt do nhiễm trùng."
