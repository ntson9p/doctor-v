id: h-syncope-010
set: holdout
title_vi: "Nam 15 tuổi đang chạy nước rút đá bóng thì ngã gục, bất tỉnh 30 giây; trước đó tim đập dồn dập; bố đột tử năm 36 tuổi"
narrative_vi: "Em H., nam, 15 tuổi, học lớp 10 ở Hà Nội, chơi trong đội bóng đá của trường, không có bệnh gì đã biết. Chiều nay đang chạy nước rút trong trận đấu, em đột ngột ngã gục xuống sân. Bạn bè kể em bất tỉnh khoảng 30 giây, không co giật, rồi tự tỉnh. Em kể ngay trước đó thấy tim đập rất nhanh, dồn dập vài giây rồi tối sầm. Sau khi tỉnh em nói chuyện bình thường, chỉ mệt, trầy xước đầu gối. Hai tháng trước em cũng một lần choáng, tối sầm mắt suýt ngất khi đang chạy bền. Bố em mất đột ngột năm 36 tuổi khi đang ngủ, không rõ nguyên nhân. Em không đau ngực, không khó thở, không đau đầu, không dùng thuốc hay chất kích thích nào, hôm nay vẫn ăn uống bình thường."
