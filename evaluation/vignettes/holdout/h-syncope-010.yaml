source:
  basis: "Ngất khi gắng sức ở vận động viên trẻ, nghi do rối loạn nhịp thất có tính gia đình (ví dụ hội chứng QT dài): ngất đột ngột khi đang chạy nước rút, hồi hộp ngay trước ngất, từng suýt ngất khi gắng sức, bố đột tử khi còn trẻ. NHS Fainting: ngất khi đang tập luyện, gắng sức thì gọi 999. ESC 2018: ngất khi gắng sức, hồi hộp đột ngột rồi ngất ngay sau đó là đặc điểm nguy cơ cao; gia đình có người đột tử khi còn trẻ là yếu tố nguy cơ; ngất trong lúc gắng sức thường do tim. Mức 1."
  references:
    - nhs-fainting
    - esc-syncope-2018
author: "agent:vignette-holdout"
notes_vi: "Ca cấp cứu ở thiếu niên. Danh mục không hỏi bệnh tim đã biết ở người dưới 18 tuổi. Nguyên nhân thật cũng có thể là bệnh cơ tim phì đại gây rối loạn nhịp thất; ca này xếp vào rối loạn nhịp tim."
