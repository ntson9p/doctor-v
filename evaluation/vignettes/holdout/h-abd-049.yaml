id: h-abd-049
set: holdout
title_vi: "Nam 66 tuổi hút thuốc, từng bị sỏi thận, đột ngột đau dữ dội hông lưng và bụng dưới trái lan xuống bẹn, nôn, choáng khi đứng; tưởng sỏi thận tái phát"
narrative_vi: "Ông H., 66 tuổi, ở Cần Thơ, hút thuốc lá 1 gói mỗi ngày, bị tăng huyết áp nhưng uống thuốc không đều. Mười năm trước ông bị sỏi thận trái, đã tán sỏi. Sáng nay đang tưới cây, ông đột ngột đau dữ dội ở hông lưng trái và bụng dưới bên trái, đau lan xuống bẹn trái. Ông nghĩ sỏi thận tái phát nên uống một viên thuốc giảm đau nhưng không đỡ. Đã khoảng 3 giờ, đau liên tục, không lúc nào hết. Ông buồn nôn, nôn 1 lần ra thức ăn. Mỗi lần đứng dậy ông thấy choáng váng, xây xẩm, phải ngồi xuống ngay; ông không ngất. Không sốt, không tiểu buốt, nước tiểu không đỏ, vẫn đi ngoài và xì hơi được. Ông chưa từng được siêu âm động mạch chủ."
