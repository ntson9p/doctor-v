source:
  basis: "Phình động mạch chủ bụng rỉ máu biểu hiện giống cơn đau quặn thận ở nam 66 tuổi hút thuốc, tăng huyết áp: đau hông lưng và bụng dưới trái đột ngột, dữ dội, liên tục, lan xuống bẹn, choáng mỗi khi đứng dậy. Đau quặn thận là chẩn đoán nhầm hay gặp nhất của vỡ phình động mạch chủ bụng; cơn đau quặn thận ở người cao tuổi phải nghĩ đến phình động mạch chủ dù dấu hiệu sinh tồn ổn định (emDocs, Tandlich và Colton 2021). NHS (Abdominal aortic aneurysm): đau bụng hoặc đau lưng đột ngột, dữ dội thì gọi 999."
  references:
    - nhs-abdominal-aortic-aneurysm
    - "https://www.emdocs.net/?p=17980"
author: "agent:vignette-holdout"
notes_vi: "Ca khó: tiền sử sỏi thận trái và đau lan xuống bẹn là yếu tố gây nhiễu có chủ ý; choáng khi đứng là dấu hiệu duy nhất gợi ý mất máu. Danh mục chưa có câu hỏi về khối đập theo nhịp mạch trong bụng."
