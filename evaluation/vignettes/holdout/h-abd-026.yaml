title_vi: "Nữ 15 tuổi, đau bụng kinh kèm tiêu chảy, buồn nôn, đau đầu nhẹ"
narrative_vi: "Em T., nữ, 15 tuổi, ở Thành phố Hồ Chí Minh, có kinh được hơn 1 năm. Sáng nay là ngày đầu kỳ kinh, em đau quặn bụng dưới, lan ra lưng, kèm đi ngoài phân lỏng 3 lần, buồn nôn, đau đầu nhẹ, mệt. Các kỳ kinh trước em cũng đau và đi ngoài như vậy. Em không sốt, ăn uống bình thường, nhà không ai bị tiêu chảy."
