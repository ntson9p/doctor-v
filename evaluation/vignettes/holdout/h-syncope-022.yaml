id: h-syncope-022
set: holdout
title_vi: "Nam 76 tuổi hút thuốc lào, bệnh mạch vành, đang rặn đi ngoài thì đột ngột đau dữ dội thắt lưng và bụng dưới trái rồi ngất; tỉnh lại nhưng tái, vã mồ hôi lạnh, vẫn đau, ngồi dậy là muốn ngất"
narrative_vi: "Ông C., 76 tuổi, ở Nam Định, hút thuốc lào từ trẻ, bị tăng huyết áp, từng đặt stent mạch vành, đang uống aspirin và thuốc huyết áp. Sáng nay khi đang rặn đi ngoài, ông đột ngột đau dữ dội vùng thắt lưng và bụng dưới bên trái, vã mồ hôi, tối sầm mắt rồi ngã gục trong nhà vệ sinh, bất tỉnh khoảng 1 phút. Con trai đỡ ông ra giường: ông đã tỉnh, nói chuyện được, nhưng da tái nhợt, vã mồ hôi lạnh, tay chân lạnh, buồn nôn, vẫn đau bụng và đau lưng dữ dội, ngồi dậy là choáng muốn ngất lại, không tự đứng được. Ông chưa từng được nói có phình động mạch chủ. Ông không đau ngực, không khó thở, không thấy tim đập nhanh trước khi ngất, không co giật, không nôn ra máu, không đi ngoài phân đen. Không sốt."
