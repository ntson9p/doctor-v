source:
  basis: "Vỡ phình động mạch chủ bụng ở nam 76 tuổi hút thuốc lào, tăng huyết áp, bệnh mạch vành, chưa từng được siêu âm động mạch chủ: đang rặn đi ngoài thì đột ngột đau dữ dội thắt lưng và bụng dưới trái rồi ngất khoảng 1 phút; tỉnh lại nhưng da tái, vã mồ hôi lạnh, tay chân lạnh, vẫn đau, ngồi dậy là muốn ngất lại. Hoàn cảnh đi ngoài và dấu hiệu báo trước dễ làm nghĩ ngất phản xạ. ESC 2018: ngất kèm đau bụng mới xuất hiện là đặc điểm nguy cơ cao loại nặng. NHS Fainting: chưa hồi phục hoàn toàn sau ngất thì gọi 999. NHS Abdominal aortic aneurysm: đau bụng hoặc đau lưng đột ngột, dữ dội, da tái, mất ý thức là dấu hiệu vỡ phình, gọi 999."
  references:
    - nhs-abdominal-aortic-aneurysm
    - esc-syncope-2018
    - nhs-fainting
author: "agent:vignette-holdout"
notes_vi: "Ca thay thế cho ca giữ kín đã chuyển sang bộ dev (vỡ phình động mạch chủ bụng biểu hiện bằng ngất). Danh mục chưa có lựa chọn 'đau dữ dội' trong câu dấu hiệu ngay trước khi ngất; người bệnh chọn 'nóng người, vã mồ hôi, tối sầm mắt'."
