title_vi: "Nam 14 tuổi, chớp sáng trước mắt 20 phút rồi đau giật hai bên trán, giống các cơn trước"
narrative_vi: "Em B., nam, 14 tuổi, ở Đà Nẵng. Năm ngoái bác sĩ đã khám và cho biết em bị đau nửa đầu. Đây là cơn thứ ba trong 6 tháng, giống các lần trước: đầu tiên em thấy những đường ngoằn ngoèo, chớp sáng trước mắt khoảng 20 phút, sau đó đau giật giật cả hai bên trán. Em buồn nôn, sợ ánh sáng, muốn nằm yên trong phòng tối. Cơn đau mới bắt đầu khoảng 1 giờ. Em không yếu tay chân, nói bình thường, không sốt."
