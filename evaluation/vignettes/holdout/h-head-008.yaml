source:
  basis: "Đau nửa đầu có tiền triệu thị giác điển hình ở thanh thiếu niên đã được bác sĩ khám: tiền triệu dưới 1 giờ, đau hai bên, cơn ngắn; tự chăm sóc (NICE CG150; NHS Migraine: chỉ cần khám gấp khi tiền triệu kéo dài trên 1 giờ)."
