source:
  basis: "Rung nhĩ đáp ứng thất nhanh sau uống nhiều rượu, kèm tức ngực, khó thở, vã mồ hôi: tim nhanh lộn xộn 156 lần/phút kéo dài 2 giờ, huyết áp hơi thấp. NHS Atrial fibrillation: đang tim nhanh hoặc không đều kèm đau ngực, khó thở hoặc ngất thì gọi 999; không tự lái xe. NHS Heart palpitations: đang hồi hộp không dứt kèm đau ngực, khó thở thì gọi 999 hoặc đến cấp cứu. NHS Chest pain: đau ngực kèm vã mồ hôi, khó thở thì gọi 999. Chưa loại trừ được hội chứng vành cấp nên chấp nhận cả bệnh này. Mức 1."
  references:
    - "https://www.nhs.uk/conditions/atrial-fibrillation/symptoms/"
    - nhs-heart-palpitations
    - nhs-chest-pain
author: "agent:vignette-holdout"
notes_vi: "Ca cấp cứu. Tức nặng ngực kéo dài 2 giờ kèm vã mồ hôi nên câu sàng lọc đau thắt ngực dữ dội trả lời 'có'."
