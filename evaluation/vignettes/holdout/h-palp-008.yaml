id: h-palp-008
set: holdout
title_vi: "Nam 66 tuổi tăng huyết áp, sau bữa nhậu tim đập rất nhanh, lộn xộn 2 giờ, tức nặng giữa ngực, khó thở, vã mồ hôi; mạch 156"
narrative_vi: "Ông S., 66 tuổi, ở Buôn Ma Thuột (Đắk Lắk), bị tăng huyết áp uống thuốc đều, hay uống rượu. Khoảng 2 giờ trước, sau bữa nhậu tối, ông thấy tim đập rất nhanh, lộn xộn, không đều, kèm tức nặng giữa ngực, hơi khó thở, vã mồ hôi. Đến giờ vẫn chưa hết. Con trai đo bằng máy đo huyết áp điện tử: mạch 156 lần/phút, máy báo nhịp không đều, huyết áp 105/70 mmHg. Ông vẫn tỉnh, nói chuyện được trọn câu, không ngất, không choáng, không yếu tay chân, không méo miệng. Trước đây ông chưa bị như vậy, chưa được nói là có bệnh tim, không uống aspirin hay thuốc chống đông, không bị đái tháo đường."
