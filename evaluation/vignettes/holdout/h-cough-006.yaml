id: h-cough-006
set: holdout
title_vi: "Bé gái 6 tuổi chưa tiêm đủ vắc xin ho gà, ho 17 ngày, từng cơn dồn dập, cuối cơn rít như gà gáy, nôn sau ho"
narrative_vi: "Bé M., gái, 6 tuổi, ở Hà Nội. Lúc nhỏ bé hay bị bệnh đúng lịch tiêm nên chỉ được tiêm 1 mũi vắc xin 5 trong 1, chưa tiêm nhắc lại. Khoảng 17 ngày trước bé sổ mũi, ho nhẹ như cảm. Sau khoảng 1 tuần, bé ho thành từng cơn dồn dập, ho liền chục tiếng không dứt, đỏ mặt, chảy nước mắt; cuối cơn hít vào có tiếng rít như tiếng gà gáy, nhiều lần ho xong thì nôn ra. Cơn ho nhiều về đêm. Giữa các cơn bé chơi, ăn gần như bình thường, thở bình thường. Bé không sốt, môi không tím. Trong lớp có một bạn cũng ho kéo dài mấy tuần nay. Trong nhà không ai bị lao."
