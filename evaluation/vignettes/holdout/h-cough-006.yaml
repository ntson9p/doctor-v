source:
  basis: "Ho gà điển hình ở trẻ chưa tiêm đủ vắc xin: khởi đầu như cảm, sau 1 tuần ho từng cơn dồn dập, tiếng rít khi hít vào cuối cơn, nôn sau ho, nặng về đêm, giữa cơn bình thường, ho đã 17 ngày (định nghĩa ca lâm sàng WHO: ho từ 2 tuần kèm ho cơn, tiếng rít hoặc nôn sau ho). NHS Whooping cough: ho rất nặng và nặng dần thì hẹn khám khẩn hoặc gọi 111; kháng sinh trong 3 tuần đầu kể từ khi ho giúp giảm lây. Không tím, không khó thở nên mức 3."
