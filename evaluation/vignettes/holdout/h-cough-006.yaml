notes_vi: "Đợt dịch ho gà ở Hà Nội năm 2024 chủ yếu ở trẻ chưa tiêm hoặc tiêm chưa đủ. Bé nôn sau cơn ho nhưng không nôn mọi thứ ăn uống vào."
