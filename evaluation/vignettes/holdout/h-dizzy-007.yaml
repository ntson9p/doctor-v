id: h-dizzy-007
set: holdout
title_vi: "Nam 27 tuổi, đêm qua đốt than tổ ong sưởi trong phòng trọ đóng kín, sáng dậy chóng mặt, đau đầu, nôn; bạn cùng phòng cũng bị"
narrative_vi: "Anh Q., 27 tuổi, công nhân, thuê phòng trọ cùng một người bạn ở Bắc Ninh, hút thuốc lá, không có bệnh mạn tính. Đêm qua trời rét đậm, hai người đốt một bếp than tổ ong trong phòng để sưởi, đóng kín cửa rồi đi ngủ. Khoảng 5 giờ sáng anh thức dậy thấy chóng mặt, choáng váng, đau đầu nhức cả đầu, buồn nôn, nôn 1 lần, người mệt rũ, chân tay bủn rủn. Anh mở cửa ra ngồi ngoài sân, thấy đỡ hơn một chút nhưng vẫn chóng mặt, đau đầu. Người bạn cùng phòng cũng kêu đau đầu, chóng mặt, buồn nôn, nhưng không nôn, không đau bụng, không tiêu chảy. Anh vẫn tỉnh, nói chuyện bình thường, tự đi lại được, không thấy mọi vật quay tròn, không khó thở, không đau ngực, không sốt, không ngất."
