source:
  basis: "Ngộ độc khí CO mức nhẹ–vừa do đốt than tổ ong sưởi trong phòng kín mùa đông miền Bắc: chóng mặt, đau đầu, buồn nôn, nôn, mệt khi ngủ dậy, đỡ một chút khi ra ngoài, người ở cùng phòng có triệu chứng giống vậy. NHS Carbon monoxide poisoning: ra chỗ thoáng, xin tư vấn y tế càng sớm càng tốt; người ngộ độc CO cần được kiểm tra ở bệnh viện (đo nồng độ CO trong máu, có thể thở oxy). Trung tâm Chống độc Bệnh viện Bạch Mai (VTC News, Nhân Dân 01/2026): mở cửa, đưa người bệnh ra chỗ thoáng và gọi cấp cứu; ngộ độc có thể tổn thương não, tim. Còn tỉnh, không khó thở, không lú lẫn, không ngất nên mức 2 (đến cấp cứu ngay), chưa cần mức 1."
