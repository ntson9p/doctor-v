title_vi: "Nam 72 tuổi, sốt, đau đầu dữ dội, nôn, sáng nay lú lẫn"
narrative_vi: "Ông N., 72 tuổi, ở Thái Bình, bị tăng huyết áp. Từ hôm qua ông sốt 38,8°C, kêu đau đầu dữ dội, buồn nôn và nôn 1 lần, mệt, bỏ ăn. Sáng nay con cháu thấy ông nói năng lẫn lộn, không nhớ mình đang ở đâu. Gia đình không biết ông có cứng gáy không. Ông không ho, không khó thở, không tiểu buốt, không yếu liệt tay chân, không méo miệng."
