title_vi: "Bé trai 7 tuổi, sốt cao, đau bụng dưới sườn phải, ho, thở nhanh"
narrative_vi: "Bé K., 7 tuổi, ở Đà Nẵng. Từ hôm qua bé sốt 39,4°C, kêu đau bụng bên phải, phía dưới sườn, buồn nôn và nôn 1 lần. Bé ho khan vài tiếng, mẹ thấy bé thở nhanh hơn bình thường. Bé mệt, bỏ ăn. Bé không tiêu chảy, không tiểu buốt, đau không tăng khi đi lại."
