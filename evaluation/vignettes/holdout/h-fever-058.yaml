source:
  basis: "Viêm não Nhật Bản ở bé trai 6 tuổi chưa tiêm vắc xin, sống ở vùng trồng lúa, nuôi lợn của Bắc Giang, đang tháng 7: sốt cao, đau đầu, nôn 3 ngày rồi li bì, lú lẫn, co giật. CDC Yellow Book (2026, Japanese encephalitis): ở vùng lưu hành, bệnh chủ yếu gặp ở trẻ em; lây chủ yếu ở vùng nông nghiệp trồng lúa, lợn là vật chủ khuếch đại; ở vùng ôn đới và cận nhiệt đới bệnh đỉnh vào mùa hè, thu; khởi phát bằng sốt, đau đầu, nôn, sau đó thay đổi ý thức, co giật hay gặp ở trẻ em; tử vong 20–30%, 30–50% người sống sót có di chứng nặng. NHS Encephalitis: co giật, lú lẫn thì gọi 999 ngay."
  references:
    - "https://www.cdc.gov/yellow-book/hcp/travel-associated-infections-diseases/japanese-encephalitis.html"
    - "https://www.nhs.uk/conditions/encephalitis/"
author: "agent:vignette-holdout"
notes_vi: "Ca cấp cứu bổ sung. Danh mục chưa có câu hỏi về tiêm vắc xin viêm não Nhật Bản, nơi ở gần ruộng lúa hoặc chuồng lợn, hay ca bệnh tương tự trong vùng."
