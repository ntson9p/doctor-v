id: h-fever-058
set: holdout
title_vi: "Bé trai 6 tuổi ở vùng trồng lúa Bắc Giang, chưa tiêm vắc xin viêm não Nhật Bản, tháng 7 sốt cao, đau đầu, nôn 3 ngày, rồi li bì, lú lẫn, co giật"
narrative_vi: "Bé L., nam, 6 tuổi, ở một xã trồng lúa của huyện Lục Ngạn (Bắc Giang); nhà nuôi lợn, sát ruộng lúa. Bé đã tiêm đủ 2 mũi vắc xin sởi nhưng chưa được tiêm vắc xin viêm não Nhật Bản vì bố mẹ đi làm ăn xa, bỏ lỡ lịch tiêm. Ba ngày nay bé sốt cao 39,5–40°C, kêu đau đầu, nôn 3 lần. Từ chiều qua bé li bì, gọi mới mở mắt, nói lẫn lộn, không nhận ra mẹ, không tự đi được. Sáng nay bé lên một cơn co giật toàn thân khoảng 3 phút. Bây giờ bé nằm lơ mơ, lay gọi mới hé mắt. Mẹ không biết cổ bé có cứng không. Bé không ho, không sổ mũi, không tiêu chảy, không nổi ban, không có nốt phỏng ở tay chân, miệng. Tháng này trong xã đã có một trẻ khác bị sốt, co giật phải đi viện."
