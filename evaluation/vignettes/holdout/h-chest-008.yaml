id: h-chest-008
set: holdout
title_vi: "Nam 66 tuổi tăng huyết áp, 2 ngày đau rát, châm chích một dải từ sau lưng trái vòng ra ngực trái, áo cọ vào cũng đau, chưa nổi ban"
narrative_vi: "Ông S., 66 tuổi, ở Bắc Ninh, bị tăng huyết áp, uống thuốc đều, không hút thuốc. Hai ngày nay ông đau rát bỏng, châm chích ở da thành một dải, từ dưới bả vai trái vòng ra ngực trái, dưới núm vú. Đau liên tục cả ngày lẫn đêm, áo cọ vào cũng đau, chạm nhẹ vào da thì buốt. Đau không tăng khi đi lại, leo dốc, không tăng khi hít thở; ông vẫn làm vườn được. Ông nhìn kỹ da chỗ đau chưa thấy nổi mẩn hay mụn nước. Ông không khó thở, không vã mồ hôi, không buồn nôn, không hồi hộp, không sốt, không ho. Lúc nhỏ ông bị thủy đậu."
