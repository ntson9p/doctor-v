source:
  basis: "Zona thần kinh giai đoạn tiền triệu ở người cao tuổi: 2 ngày đau rát, châm chích, tăng cảm da thành một dải một bên ngực – lưng, chưa nổi ban; không liên quan gắng sức, không khó thở, không vã mồ hôi (đau có thể có trước khi nổi ban vài ngày). NHS Chest pain: đau ngực không lúc nào hết cần được bác sĩ khám; NHS Shingles: nghĩ bị zona thì hẹn khám khẩn hoặc gọi 111 để được điều trị sớm. Người 66 tuổi đau ngực mới cần khám trong ngày để loại trừ nguyên nhân tim, nên mức 3."
