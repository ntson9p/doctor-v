title_vi: "Bé trai 3 tuần tuổi, sốt 38,4°C, bú kém"
narrative_vi: "Bé trai 3 tuần tuổi, ở Thành phố Hồ Chí Minh, sinh đủ tháng. Từ chiều nay bé sốt, đo nhiệt độ 38,4°C. Bé bú kém hẳn, mỗi cữ chỉ bú vài phút rồi bỏ, ngủ nhiều hơn nhưng vẫn cựa quậy khi được đánh thức. Bé không ho, không nôn, không tiêu chảy, thở bình thường."
