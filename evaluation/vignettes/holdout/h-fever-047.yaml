source:
  basis: "Nhiễm khuẩn tiết niệu có sốt (viêm thận – bể thận) ở trẻ dưới 2 tuổi thường chỉ có sốt, quấy, nôn, nước tiểu hôi; trẻ sốt không rõ ổ nhiễm cần được kiểm tra nước tiểu (NICE NG143). Trẻ em có triệu chứng nhiễm khuẩn tiết niệu kèm sốt cần được khám trong ngày (NHS UTIs; NHS Kidney infection)."
