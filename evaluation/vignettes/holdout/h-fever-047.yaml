title_vi: "Bé gái 20 tháng, sốt 39,2°C 2 ngày, quấy khóc, nôn 1 lần, nước tiểu hôi, không ho, không sổ mũi"
narrative_vi: "Bé gái 20 tháng, ở Đà Nẵng. Bé sốt 39,2°C đã 2 ngày, uống thuốc hạ sốt thì hạ rồi lại sốt. Bé quấy khóc, ăn kém hơn, hôm qua nôn 1 lần. Mẹ thấy tã có mùi khai nồng, hôi hơn mọi khi, nước tiểu hơi đục; mẹ không rõ bé có đau khi đi tiểu không. Bé không ho, không sổ mũi, không kéo tai, không tiêu chảy, không nổi ban, trong miệng không có vết loét. Bé vẫn uống nước, bú sữa tốt, tã vẫn ướt như mọi ngày, hạ sốt thì chơi được. Bé đã tiêm đủ 2 mũi vắc xin sởi."
