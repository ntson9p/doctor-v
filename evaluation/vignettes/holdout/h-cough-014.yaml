source:
  basis: "Ho gà ở trẻ dưới 2 tháng chưa được tiêm phòng: ho từng cơn kèm tím, có cơn ngừng thở sau ho, nôn sau ho, bú kém, anh trai ho kéo dài; trẻ nhỏ thường không có tiếng rít. NHS Whooping cough: gọi 999 khi môi, mặt tím, thở khó hoặc có lúc ngừng thở; trẻ dưới 6 tháng thường phải điều trị ở bệnh viện. WHO IMCI: trẻ dưới 2 tháng bú kém là bệnh rất nặng, chuyển viện khẩn cấp. Mức 1."
