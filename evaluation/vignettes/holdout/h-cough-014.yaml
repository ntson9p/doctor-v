notes_vi: "Ca cấp cứu. Ở màn sàng lọc đầu, mẹ trả lời 'không' câu khó thở dữ dội, môi tím vì lúc đang dùng app bé thở bình thường, môi hồng; cơn ngừng thở chỉ được nêu ở câu hỏi riêng."
