id: h-cough-014
set: holdout
title_vi: "Bé trai 7 tuần tuổi ho 10 ngày, ho từng cơn đỏ mặt rồi tím, hôm nay 2 lần ngừng thở sau cơn ho, anh trai ho kéo dài"
narrative_vi: "Bé Q., nam, 7 tuần tuổi, ở Hà Nam, chưa đến tuổi tiêm vắc xin 5 trong 1; mẹ không tiêm vắc xin ho gà khi mang thai. Anh trai 5 tuổi của bé ho đã 3 tuần. Bé ho khoảng 10 ngày, lúc đầu ho nhẹ, nghẹt mũi. Mấy ngày nay bé ho từng cơn, ho liên tục không dứt, mặt đỏ rồi tím tái, ho xong hay ọc, nôn ra sữa. Hôm nay có 2 lần sau cơn ho bé ngừng thở khoảng 10–15 giây, môi tím, mẹ phải vỗ lưng bé mới thở lại. Bé bú kém hơn hẳn vì cứ bú là ho. Giữa các cơn bé thở bình thường, môi hồng. Bé không sốt, không co giật, vẫn cử động chân tay bình thường."
