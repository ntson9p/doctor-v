title_vi: "Nữ 25 tuổi, đau giật một bên đầu, buồn nôn, sợ ánh sáng, giống các cơn trước"
narrative_vi: "Chị H., 25 tuổi, ở Hà Nội. Từ năm 16 tuổi, mỗi tháng chị bị 1–2 cơn đau đầu giật giật ở một bên đầu, thường gần kỳ kinh hoặc khi thiếu ngủ. Cơn lần này bắt đầu từ sáng, đau bên trái, phải nằm nghỉ trong phòng tối. Chị buồn nôn, sợ ánh sáng và tiếng ồn, đi lại thì đau tăng. Chị không thấy chớp sáng trước cơn, không yếu tay chân, không sốt."
