id: h-sob-011
set: holdout
title_vi: "Nữ 72 tuổi đái tháo đường 15 năm, 2 giờ nay đột ngột khó thở, vã mồ hôi, buồn nôn, nôn, mệt rũ, không đau ngực"
narrative_vi: "Bà M., 72 tuổi, ở Thái Bình, bị đái tháo đường 15 năm và tăng huyết áp, uống thuốc đều. Khoảng 2 giờ trước, sau bữa sáng, bà đột ngột thấy khó thở, hụt hơi, người mệt rũ, vã mồ hôi, buồn nôn, nôn 1 lần. Đến giờ ngồi yên bà vẫn thở mệt, nói được trọn câu nhưng phải ngừng lấy hơi. Bà không thấy đau ngực, không tức ngực, không đau lan lên vai, hàm. Con dâu đo SpO2 được 94%. Bà không sốt, không ho, không khò khè, không phù chân, nằm không khó thở hơn, không thấy tim đập nhanh, không ngất. Trước đây chưa được nói có bệnh tim. Bà không bị hen hay bệnh phổi."
