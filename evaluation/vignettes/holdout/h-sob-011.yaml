source:
  basis: "Hội chứng vành cấp không đau ngực ở người cao tuổi đái tháo đường: đột ngột khó thở kèm vã mồ hôi, buồn nôn, nôn, mệt rũ kéo dài 2 giờ. 2187/QĐ-BYT (2019): người lớn tuổi, đái tháo đường có thể không đau ngực, triệu chứng không điển hình gồm khó thở, mệt, buồn nôn, nôn; liên lạc ngay 115. NICE CG95 mục 1.2.1.5: không phải người bệnh nào cũng đau giữa ngực. NHS Shortness of breath: khó thở đột ngột, nặng thì gọi 999 hoặc đến cấp cứu. Mức 1."
