source:
  basis: "Hẹp van động mạch chủ có triệu chứng (không có trong danh mục): suýt ngất khi gắng sức kèm tức ngực khi gắng sức, hụt hơi khi gắng sức tăng dần, đã được nói là hẹp van tim có tiếng thổi. MSD Aortic stenosis: hẹp van động mạch chủ tiến triển gây ngất khi gắng sức, đau thắt ngực, khó thở; khi đã có triệu chứng, thời gian sống trung bình còn khoảng 3 năm nếu không thay van, khoảng 13% tử vong là đột tử. ESC 2018: ngất khi gắng sức, bệnh tim cấu trúc là đặc điểm nguy cơ cao; suýt ngất xử trí như ngất. NHS Fainting: ngất khi đang gắng sức thì gọi 999. Không mất ý thức hẳn, đã hồi phục, ổn định lúc nghỉ nên mức 2."
  references:
    - "https://www.msdmanuals.com/professional/cardiovascular-disorders/valvular-disorders/aortic-stenosis"
    - esc-syncope-2018
    - nhs-fainting
author: "agent:vignette-holdout"
notes_vi: "Ngoài danh mục. Tức ngực khi gắng sức đã hết khi nghỉ nhưng mới xảy ra sáng nay nên trả lời 'có'; câu đau thắt ngực dữ dội trả lời 'không'. Danh mục chưa có câu hỏi về bệnh van tim, tiếng thổi ở tim (câu bệnh tim đã biết trả lời 'có')."
