id: h-syncope-014
set: holdout
title_vi: "Nam 76 tuổi được nói hẹp van tim nhưng không tái khám, leo cầu thang thì tức ngực, choáng, tối sầm mắt, khuỵu xuống; hay hụt hơi khi gắng sức"
narrative_vi: "Ông H., 76 tuổi, ở Nha Trang (Khánh Hòa). Ba năm trước đi khám, bác sĩ nói ông bị hẹp van tim, nghe tim có tiếng thổi, hẹn tái khám nhưng ông không đi. Mấy tháng nay ông đi bộ nhanh hoặc leo dốc là hụt hơi, phải dừng lại nghỉ. Sáng nay đang leo cầu thang lên tầng 3 thăm cháu, ông thấy tức nặng giữa ngực, choáng váng, tối sầm mắt, khuỵu xuống bậc thang; con trai đỡ kịp. Ông không mất ý thức hẳn; ngồi nghỉ khoảng 5 phút thì hết tức ngực, hết choáng. Hiện ông ngồi nghỉ thấy bình thường, không khó thở, không đau ngực. Ông không thấy tim đập nhanh hay đập loạn, không vã mồ hôi, không yếu tay chân, không nói khó. Ông không bị tăng huyết áp, không bị đái tháo đường, không hút thuốc; trong nhà không ai đột tử."
